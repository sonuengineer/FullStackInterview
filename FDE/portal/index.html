<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
/* One page, two modes: local (127.0.0.1:8766, editable) and GitHub Pages (read-only).
   Data: plan.json (generated by plan.py), ../progress.json (public), ../private.enc.json (encrypted). */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --sunk: #e8ecf2; --fg: #1b2330; --muted: #5b6678; --line: #d3d9e3;
  --accent: #b8650a; --accent-soft: #fbecd8; --ink: #26466d; --ok: #1f7a4d; --ok-soft: #dff1e7; --bad: #b3322b;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161e; --surface: #18202b; --sunk: #0d1218; --fg: #e3e8ef; --muted: #98a3b4; --line: #2a3442;
    --accent: #f0a14a; --accent-soft: #3a2a17; --ink: #9cc0ea; --ok: #5fcf95; --ok-soft: #173326; --bad: #f08079; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 60px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 1.7rem; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
a { color: var(--ink); }
code, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
code { font-size: 0.86em; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 11px; }
button:hover { border-color: var(--ink); }
button.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
button.link { border: none; background: none; padding: 0; color: var(--ink); text-decoration: underline; }
button:disabled { opacity: 0.55; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; min-width: 0; }
textarea { width: 100%; min-height: 80px; resize: vertical; }
header.top { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; }
.syncbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--ok); } .dot.warn { background: var(--accent); } .dot.bad { background: var(--bad); }
.banner { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 0.92rem; }
.banner.ok { background: var(--ok-soft); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: grid; gap: 4px; align-content: start; }
.tile .lbl { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tile .val { font-family: var(--font-mono); font-size: 1.1rem; }
.tile .sub { font-size: 0.8rem; color: var(--muted); }
.meter { height: 6px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--ink); }
.meter.ok > i { background: var(--ok); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.badge { font-size: 0.76rem; padding: 2px 9px; border-radius: 999px; border: 1px dashed var(--line); color: var(--muted); }
.badge.got { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--fg); }
nav.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
nav.tabs button { border: none; background: transparent; padding: 6px 10px; border-radius: 6px; color: var(--muted); }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
section.panel { margin-top: 18px; display: grid; gap: 16px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { font-family: var(--font-mono); font-size: 0.7rem; padding: 1px 7px; border-radius: 999px; background: var(--sunk); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
.tag.C { background: var(--ink); color: var(--bg); }
.tag.E { background: var(--accent-soft); color: var(--fg); }
.tag.gate { background: var(--accent); color: var(--bg); }
ul.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
li.item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 5px; background: var(--surface); }
li.item.gate { border-color: var(--accent); background: var(--accent-soft); }
li.item.done { opacity: 0.75; }
li.item.done .t { text-decoration: line-through; color: var(--muted); }
li.item.locked { opacity: 0.55; }
.ihead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ihead .t { flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
.imeta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--muted); align-items: center; }
.proofline { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
.proof { display: flex; flex-wrap: wrap; gap: 6px; }
.proof input { flex: 1 1 260px; }
.err { color: var(--bad); font-size: 0.85rem; }
details.cp { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
details.cp > summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
details.cp > summary h3 { flex: 1 1 260px; }
details.cp[open] > summary { margin-bottom: 10px; }
.ms { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.tablewrap { overflow-x: auto; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.locknote { padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 0.9rem; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); width: min(860px, calc(100vw - 32px)); max-height: 86vh; padding: 0; }
dialog::backdrop { background: rgb(0 0 0 / 0.45); }
.dlghead { position: sticky; top: 0; display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.dlgbody { padding: 4px 18px 18px; }
.dlgbody pre { background: var(--sunk); padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
.edit-only { }
body.public .edit-only { display: none !important; }
ol.rules { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>FDE Portal</h1>
      <div class="muted small" id="subtitle">Loading...</div>
    </div>
    <div class="syncbar" id="syncbar"></div>
  </header>
  <div id="banners"></div>
  <div class="tiles" id="tiles"></div>
  <div class="badges" id="badges"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section class="panel" id="panel"></section>
</div>
<dialog id="reader"><div class="dlghead"><strong id="reader-title"></strong><button data-act="closereader">Close</button></div><div class="dlgbody" id="reader-body"></div></dialog>

<script>
"use strict";
const LOCAL = location.hostname === "127.0.0.1" && location.port === "8766";
const TABS = [["today", "Today"], ["cp", "Checkpoint"], ["roadmap", "Roadmap"], ["caps", "Capstones"], ["jobs", "Job hunt"], ["settings", "Settings"]];
const LEVELS = [[0, "Curious builder"], [10, "Steady learner"], [25, "Practitioner"], [45, "Shipping engineer"], [70, "Systems architect"]];
const ITER = 600000;
let plan = null, state = null, privBlob = null, priv = null, cryptoKey = null, gitInfo = null;
const ui = { tab: "today", cp: null, open: null, msg: "", busy: false };
try { ui.tab = localStorage.getItem("fde-tab") || "today"; } catch (e) { /* storage blocked */ }

// ---------- small helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isUrl = (s) => /^https?:\/\/\S+$/i.test(String(s || "").trim());
const linkOr = (s) => isUrl(s) ? `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>` : esc(s);
const pathUrl = (p) => "../" + p.split("/").map(encodeURIComponent).join("/");
const sum = (a) => a.reduce((x, y) => x + y, 0);
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function toD(s) { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function fromD(d) { return d.toISOString().slice(0, 10); }
function addDays(s, n) { const d = toD(s); d.setUTCDate(d.getUTCDate() + n); return fromD(d); }
function addMonths(s, n) { const [y, m, d] = s.split("-").map(Number); return fromD(new Date(Date.UTC(y, m - 1 + n, d))); }
function diffDays(a, b) { return Math.round((toD(b) - toD(a)) / 86400000); }
function monday(s) { const d = toD(s); return addDays(s, -((d.getUTCDay() + 6) % 7)); }
function isoWeek(s) {
  const d = toD(s); d.setUTCDate(d.getUTCDate() + 3 - ((d.getUTCDay() + 6) % 7));
  const y = d.getUTCFullYear(), jan4 = new Date(Date.UTC(y, 0, 4));
  const w = 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  return y + "-W" + String(w).padStart(2, "0");
}
function nice(s) { return toD(s).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); }
function hrs(min) { return (min / 60).toFixed(1) + " h"; }
async function getJSON(url) { try { const r = await fetch(url, { cache: "no-store" }); return r.ok ? await r.json() : null; } catch (e) { return null; } }
async function post(url, body) {
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    return await r.json();
  } catch (e) { return { ok: false, text: "Portal server is not running. Start FDE/start-portal.bat." }; }
}
function blankState() {
  return { settings: { track: "slow", start: plan.start, switches: [] }, done: {}, minutes: {}, rest: [], drills: {}, reviews: {}, quiz: [], apps: {}, mocks: [], firstInterview: null };
}
function blankPrivate() { return { notes: {}, reviews: {}, drills: {}, applications: [], mocks: [] }; }

// ---------- encryption (same scheme as prep/: PBKDF2-SHA256 600k -> AES-256-GCM) ----------
const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deriveKey(password, salt, iterations) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptPrivate() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKey.key, new TextEncoder().encode(JSON.stringify(priv))));
  return { v: "1", kdf: "PBKDF2-SHA256", iterations: String(ITER), salt: cryptoKey.salt, iv: b64(iv), ct: b64(ct) };
}
async function unlock(password) {
  const salt = unb64(privBlob.salt), key = await deriveKey(password, salt, Number(privBlob.iterations) || ITER);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(privBlob.iv) }, key, unb64(privBlob.ct));
  priv = Object.assign(blankPrivate(), JSON.parse(new TextDecoder().decode(pt)));
  cryptoKey = { key, salt: privBlob.salt };
}
async function createPrivate(password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  cryptoKey = { key: await deriveKey(password, salt, ITER), salt: b64(salt) };
  priv = blankPrivate();
  await savePrivate();
}

// ---------- saving ----------
let saveTimer = null;
function save() {
  if (!LOCAL) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => { const r = await post("/api/state", state); if (r.git) gitInfo = r.git; else ui.msg = r.text || r.error; renderSync(); }, 250);
}
async function savePrivate() {
  if (!LOCAL || !priv || !cryptoKey) return;
  privBlob = await encryptPrivate();
  const r = await post("/api/private", privBlob);
  if (r.git) gitInfo = r.git; else ui.msg = r.text || r.error;
  renderSync();
}
function changed(alsoPrivate) {
  save();
  if (alsoPrivate) savePrivate();
  document.dispatchEvent(new CustomEvent("fde-progress"));
}
document.addEventListener("fde-progress", () => render());

// ---------- plan model ----------
const track = () => plan.tracks[state.settings.track];
const cps = () => track().checkpoints;
const queue = () => cps().flatMap((c) => c.items);
const item = (id) => plan.items[id];
const isDone = (id) => !!state.done[id];
function cpIndexOf(id) { return cps().findIndex((c) => c.items.includes(id)); }
function cpUnlocked(k) { return k <= 0 || cps()[k - 1].items.filter((i) => item(i).kind === "gate").every(isDone); }
function currentCp() {
  const list = cps();
  for (let k = 0; k < list.length; k++) if (!list[k].items.every(isDone)) return k;
  return list.length - 1;
}
function nextUp(n) {
  const out = [];
  cps().forEach((c, k) => { if (cpUnlocked(k)) c.items.forEach((i) => { if (!isDone(i) && out.length < n) out.push(i); }); });
  return out;
}
const hoursOf = (ids) => sum(ids.map((i) => item(i).hours));

// ---------- time, streak, projection ----------
const minutesOn = (d) => Number(state.minutes[d] || 0);
const active = (d) => minutesOn(d) >= 25 || state.rest.includes(d);
function streaks() {
  const t = todayStr();
  let cur = 0, d = active(t) ? t : addDays(t, -1);
  while (active(d)) { cur++; d = addDays(d, -1); }
  const days = Object.keys(state.minutes).concat(state.rest).sort();
  let best = 0, run = 0, prev = null;
  for (const day of [...new Set(days)]) {
    if (!active(day)) { run = 0; prev = day; continue; }
    run = prev && diffDays(prev, day) === 1 && active(prev) ? run + 1 : 1;
    best = Math.max(best, run); prev = day;
  }
  return { cur, best: Math.max(best, cur) };
}
function restAvailable() { const w = isoWeek(todayStr()); return !state.rest.some((d) => isoWeek(d) === w); }
function weekMinutes(s) { const m = monday(s); return sum([0, 1, 2, 3, 4, 5, 6].map((i) => minutesOn(addDays(m, i)))); }
function targetDate() { return addDays(addMonths(state.settings.start, state.settings.track === "fast" ? 2 : 5), -1); }
function projection() {
  const t = todayStr(), start = state.settings.start;
  const remaining = hoursOf(queue().filter((i) => !isDone(i)));
  if (t < start) return { before: true, remaining };
  const window = Math.min(14, diffDays(start, t) + 1);
  const mins = sum([...Array(window).keys()].map((i) => minutesOn(addDays(t, -i))));
  const perDay = mins / 60 / window;
  if (perDay <= 0) return { remaining, perDay: 0 };
  const finish = addDays(t, Math.ceil(remaining / perDay));
  return { remaining, perDay, finish, late: diffDays(targetDate(), finish) };
}
function monthMilestone() {
  const t = todayStr(), start = state.settings.start, months = track().months;
  const last = Math.max(...Object.keys(months).map(Number));
  let m = 1;
  while (m < last && t >= addMonths(start, m)) m++;
  const cpN = months[m], ids = cps().slice(0, cpN).flatMap((c) => c.items);
  const total = hoursOf(ids), done = hoursOf(ids.filter(isDone));
  return { m, cpN, due: addDays(addMonths(start, m), -1), pct: total ? Math.round((100 * done) / total) : 0 };
}

// ---------- XP, levels, badges ----------
function xp() {
  const ids = queue();
  const max = sum(ids.map((i) => (item(i).kind === "gate" ? 50 : 20)));
  const fromQueue = sum(ids.filter(isDone).map((i) => (item(i).kind === "gate" ? 50 : 20)));
  const apps = sum(Object.values(state.apps).map((n) => Math.min(Number(n) * 5, 10)));
  const mocks = state.mocks.length * 30, drills = Object.keys(state.drills).length * 15;
  const quiz = sum(state.quiz.map((q) => Number(q.pts) * (q.graded ? 5 : 2)));
  const total = fromQueue + apps + mocks + drills + quiz;
  const pct = Math.min(100, Math.round((100 * total) / max));
  const achieved = isDone("G-OG-V1") && isDone("G-AM-V1") && isDone("M18-12");
  let level = LEVELS[0][1];
  for (const [p, name] of LEVELS) if (pct >= p) level = name;
  const fde = achieved && pct >= 95;
  return { total, max, pct, level: fde ? "FDE" : level, fde, achieved };
}
function badges() {
  const ids = queue(), frac = ids.filter(isDone).length / ids.length, s = streaks();
  const anyTopic = Object.keys(state.done).some((i) => plan.items[i] && plan.items[i].kind === "topic");
  const appsTotal = sum(Object.values(state.apps).map(Number));
  return [
    ["First topic", anyTopic], ["Quarter way", frac >= 0.25], ["Half way", frac >= 0.5],
    ["Perfect self-check", state.quiz.some((q) => Number(q.max) > 0 && Number(q.pts) === Number(q.max))],
    ["Three quarters", frac >= 0.75], ["First live deploy", isDone("G-DEPLOY")],
    ["7-day streak", s.best >= 7], ["30-day streak", s.best >= 30],
    ["OmniGuard v1.0", isDone("G-OG-V1")], ["AuditMesh v1.0", isDone("G-AM-V1")],
    ["First application sent", appsTotal >= 1], ["First interview", !!state.firstInterview],
  ];
}

// ---------- rendering ----------
function render() {
  if (!plan || !state) return;
  document.body.classList.toggle("public", !LOCAL);
  const T = track();
  $("#subtitle").innerHTML = `${esc(T.label)} track &middot; start ${esc(nice(state.settings.start))} &middot; target ${esc(nice(targetDate()))} &middot; ${T.topicCount} topics, ~${Math.round(T.hours)} h of work`
    + (LOCAL ? "" : " &middot; <strong>read-only public view</strong>");
  renderSync(); renderBanners(); renderTiles(); renderBadges(); renderTabs();
  const fn = { today: tabToday, cp: tabCp, roadmap: tabRoadmap, caps: tabCaps, jobs: tabJobs, settings: tabSettings }[ui.tab] || tabToday;
  $("#panel").innerHTML = fn();
}
function renderSync() {
  if (!LOCAL) { $("#syncbar").innerHTML = `<span class="sync"><span class="dot"></span>Ticking happens in local mode (FDE/start-portal.bat)</span>`; return; }
  const g = gitInfo || {}, cls = !g.ok ? "bad" : g.dirty ? "warn" : "on";
  $("#syncbar").innerHTML = `<span class="sync"><span class="dot ${cls}"></span>${esc(ui.msg || g.text || "")}</span>
    <button data-act="pull" ${ui.busy ? "disabled" : ""}>Get latest</button>
    <button class="primary" data-act="push" ${ui.busy ? "disabled" : ""}>Save to GitHub</button>`;
}
function renderBanners() {
  const out = [], t = todayStr(), p = projection(), s = state.settings;
  if (t < s.start) out.push(`Plan starts <strong>${esc(nice(s.start))}</strong>. Use the time before that for setup (checkpoint 1 setup items can be ticked now).`);
  if (s.track === "slow" && t >= s.start) {
    const w1 = addDays(monday(t), -7), w2 = addDays(monday(t), -14);
    if (w2 >= monday(s.start) && weekMinutes(w1) >= 1500 && weekMinutes(w2) >= 1500)
      out.push(`You logged 25+ hours in each of the last 2 weeks. The plan says you can <strong>upgrade to FAST</strong> (Settings). Remaining Extended topics drop out of the queue.`);
  }
  if (s.track === "fast" && t >= s.start && diffDays(s.start, t) >= 28 && p.finish && p.late > 14)
    out.push(`Projected finish is <strong>${p.late} days</strong> past the fast target. The plan says: <strong>switch to SLOW</strong> (Settings). Every tick carries over.`);
  if (LOCAL && privBlob && !priv) out.push(`Private notes are locked. Unlock them in <button class="link" data-act="tab" data-tab="settings">Settings</button> to write notes, reviews and applications.`);
  $("#banners").innerHTML = out.map((b) => `<div class="banner">${b}</div>`).join("");
}
function tile(lbl, val, sub, pct, ok) {

const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
function addMinutes(n) {
  const t = todayStr();
  n = Math.round(Number(n));
  if (!(n > 0 && n <= 900)) return alert("Enter minutes between 1 and 900.");
  state.minutes[t] = minutesOn(t) + n;
  changed();
}
async function openReader(file, title) {
  $("#reader-title").textContent = title;
  $("#reader-body").innerHTML = `<p class="muted">Loading...</p>`;
  $("#reader").showModal();
  try {
    const r = await fetch(pathUrl(file), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const text = await r.text();
    $("#reader-body").innerHTML = window.marked ? window.marked.parse(text) : `<pre>${esc(text)}</pre>`;
  } catch (e) { $("#reader-body").innerHTML = `<p class="err">Could not load ${esc(file)}.</p>`; }
}
const actions = {
  tab: (el) => { ui.tab = el.dataset.tab; ui.open = null; try { localStorage.setItem("fde-tab", ui.tab); } catch (e) {} render(); },
  open: (el) => { ui.open = el.dataset.id; render(); const i = $("#proof-in"); if (i) i.focus(); },
  cancel: () => { ui.open = null; render(); },
  done: (el) => {
    const id = el.dataset.id, it = item(id), p = val("proof-in");
    if (!p) return ($("#proof-err").textContent = "Proof is required.");
    if (it.kind === "gate" && !isUrl(p)) return ($("#proof-err").textContent = "A gate needs a link starting with http:// or https://");
    state.done[id] = { d: todayStr(), p };
    ui.open = null; changed();
  },
  undo: (el) => { if (confirm("Undo this tick?")) { delete state.done[el.dataset.id]; changed(); } },
  read: (el) => openReader(el.dataset.file, el.dataset.title),
  closereader: () => $("#reader").close(),
  addmin: () => addMinutes(val("min-in")),
  quickmin: (el) => addMinutes(el.dataset.n),
  fixmin: () => {
    const t = todayStr(), v = prompt("Set today's total minutes to:", minutesOn(t));
    if (v == null) return;
    const n = Math.round(Number(v));
    if (!(n >= 0 && n <= 1440)) return alert("0 to 1440.");
    if (n === 0) delete state.minutes[t]; else state.minutes[t] = n;
    changed();
  },
  rest: () => { const t = todayStr(); if (restAvailable() && !state.rest.includes(t)) { state.rest.push(t); state.rest = state.rest.slice(-400); changed(); } },
  addquiz: () => {
    const id = val("q-id").toUpperCase(), pts = Number(val("q-pts")), max = Number(val("q-max"));
    if (!id || !(max > 0) || !(pts >= 0 && pts <= max)) return alert("Topic id, points (0..max) and max are needed.");
    state.quiz.push({ d: todayStr(), id, pts, max, graded: $("#q-graded").checked });
    changed();
  },
  savenote: () => { const t = todayStr(), v = val("note-in"); if (v) priv.notes[t] = v; else delete priv.notes[t]; changed(true); },
  savereview: () => {
    const w = isoWeek(todayStr());
    priv.reviews[w] = { shipped: val("rv-shipped"), unclear: val("rv-unclear"), change: val("rv-change") };
    state.reviews[w] = todayStr(); changed(true);
  },
  savedrill: () => {
    const w = isoWeek(todayStr()), v = val("drill-in");
    if (!v) return alert("Write which drill you did (and a link if any).");
    priv.drills[w] = v; state.drills[w] = state.drills[w] || todayStr(); changed(true);
  },
  addapp: () => {
    const company = val("a-company"), role = val("a-role");
    if (!company || !role) return alert("Company and role are needed.");
    const d = todayStr(), w = isoWeek(d);
    priv.applications.push({ d, company, role, link: val("a-link"), note: val("a-note"), status: "applied" });
    state.apps[w] = Number(state.apps[w] || 0) + 1; changed(true);
  },
  delapp: (el) => {
    const a = priv.applications[el.dataset.i];
    if (!a || !confirm(`Delete ${a.company}?`)) return;
    const w = isoWeek(a.d);
    state.apps[w] = Math.max(0, Number(state.apps[w] || 0) - 1);
    if (!state.apps[w]) delete state.apps[w];
    priv.applications.splice(el.dataset.i, 1); changed(true);
  },
  addmock: () => {
    const score = Number(val("m-score"));
    if (!(score >= 0 && score <= 10) || val("m-score") === "") return alert("Score 0-10.");
    const d = todayStr();
    priv.mocks.push({ d, kind: val("m-kind"), score, note: val("m-note") });
    state.mocks.push(d); changed(true);
  },
  delmock: (el) => {
    const x = priv.mocks[el.dataset.i];
    if (!x || !confirm("Delete this mock?")) return;
    const j = state.mocks.indexOf(x.d); if (j >= 0) state.mocks.splice(j, 1);
    priv.mocks.splice(el.dataset.i, 1); changed(true);
  },
  switch: () => {
    const s = state.settings, to = s.track === "fast" ? "slow" : "fast";
    if (!confirm(`Switch to ${to.toUpperCase()}? Every tick carries over; the queue and target date change.`)) return;
    s.switches.push({ d: todayStr(), from: s.track, to }); s.track = to; ui.cp = null; changed();
  },
  setstart: () => {
    const v = val("start-in");
    if (!/^\d{4}-\d\d-\d\d$/.test(v) || v === state.settings.start) return;
    if (confirm(`Change start date to ${v}? Milestones and the target move with it.`)) { state.settings.start = v; changed(); }
  },
  createpw: async () => {
    const a = val("pw1"), b = val("pw2");
    if (a.length < 8) return alert("Use at least 8 characters.");
    if (a !== b) return alert("The two passwords differ.");
    await createPrivate(a); render();
  },
  unlock: async () => {
    try { await unlock(val("pw")); render(); }
    catch (e) { const er = $("#pw-err"); if (er) er.textContent = "Wrong password (or the file is damaged)."; }
  },
  lock: () => { priv = null; cryptoKey = null; render(); },
  export: () => {
    const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), state, private: privBlob }, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `fde-backup-${todayStr()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  pull: async () => {
    ui.busy = true; renderSync();
    clearTimeout(saveTimer); await post("/api/state", state);
    const r = await post("/api/pull");
    ui.busy = false; ui.msg = r.text || "";
    if (r.state) state = r.state;
    if (r.private !== undefined) {
      const changedBlob = JSON.stringify(r.private) !== JSON.stringify(privBlob);
      privBlob = r.private;
      if (changedBlob && priv) { priv = null; cryptoKey = null; ui.msg += " Private data changed on the other PC -- unlock again."; }
    }
    const p = await getJSON("plan.json"); if (p) plan = p;
    if (r.git) gitInfo = r.git;
    render();
  },
  push: async () => {
    ui.busy = true; renderSync();
    clearTimeout(saveTimer); await post("/api/state", state);
    const r = await post("/api/push");
    ui.busy = false; ui.msg = r.text || ""; if (r.git) gitInfo = r.git; renderSync();
  },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT") return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.act === "cpsel") { ui.cp = Number(el.value); render(); }
  if (el.dataset.act === "appstatus" && priv) {
    const a = priv.applications[el.dataset.i]; if (!a) return;
    a.status = el.value;
    if ((a.status === "interview" || a.status === "offer") && !state.firstInterview) state.firstInterview = todayStr();
    changed(true);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const map = { "proof-in": "done", "min-in": "addmin", pw: "unlock" };
  const act = map[e.target.id];
  if (act) { e.preventDefault(); const btn = document.querySelector(`[data-act="${act}"]`); if (btn) btn.click(); }
});

// ---------- boot ----------
(async function boot() {
  plan = await getJSON("plan.json");
  if (!plan) { $("#subtitle").textContent = "Could not load plan.json. Run: python portal/plan.py"; return; }
  if (LOCAL) {
    const d = await getJSON("/api/data");
    if (d) { state = d.state; privBlob = d.private; gitInfo = d.git; }
  } else {
    state = await getJSON("../progress.json");
    privBlob = await getJSON("../private.enc.json");
  }
  state = Object.assign(blankState(), state || {});
  state.settings = Object.assign(blankState().settings, state.settings || {});
  if (!plan.tracks[state.settings.track]) state.settings.track = "slow";
  render();
})();
</script>
</body>
</html>
