<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 21-Day AI Engineer Course -- Reader</title>
<link rel="stylesheet" id="hl-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link rel="stylesheet" id="hl-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --fs:19px; --measure:680px;
  --bg:#fdfbf7; --panel:#ffffff; --text:#1c1b18; --muted:#7a7468;
  --accent:#a8562b; --accent2:#c27a45; --line:#e6e0d2; --code-bg:#f4f1e8;
  --card:#ffffff; --ghost:#efeadd; --mark:#ffe9a8;
}
body.t-sepia{--bg:#f1e7d0;--panel:#f8f0dd;--text:#4a3c2a;--muted:#8a7a5f;--accent:#9c5222;--accent2:#b06f3a;--line:#dccfae;--code-bg:#e9ddc0;--card:#f8f0dd;--ghost:#e4d6b4;--mark:#f0d98c;}
body.t-dark{--bg:#12151a;--panel:#181c22;--text:#d8d5cd;--muted:#8b8b85;--accent:#e0995c;--accent2:#c77f45;--line:#2a2f37;--code-bg:#1b2027;--card:#181c22;--ghost:#1d2229;--mark:#5a4a1e;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.75;transition:background .35s,color .35s;-webkit-font-smoothing:antialiased}
body.f-serif{font-family:Georgia,'Palatino Linotype','Book Antiqua','Times New Roman',serif}
body.f-sans{font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.7}
::selection{background:var(--mark)}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.hide{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .title{flex:1;text-align:center;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-style:italic}
.icon-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;font-size:14px;color:var(--muted);transition:.2s}
.icon-btn:hover{background:var(--ghost);color:var(--text)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#progress-line{position:sticky;top:0;z-index:60;height:3px;background:transparent}
#progress-fill{height:100%;width:0;background:var(--accent);transition:width .15s}

/* ---------- dashboard ---------- */
.hero{max-width:960px;margin:0 auto;padding:64px 28px 8px;text-align:center}
.hero h1{font-size:clamp(34px,6vw,54px);line-height:1.12;margin:0 0 14px;letter-spacing:-.5px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p{color:var(--muted);max-width:620px;margin:0 auto}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:34px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 26px;min-width:130px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat b{display:block;font-size:26px;line-height:1.2;color:var(--text)}
.stat span{font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--ghost) 0);display:grid;place-items:center;margin:0 auto 10px}
.ring i{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}
.resume{margin:30px 0 8px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:999px;background:var(--accent);color:#fff;font-size:15.5px;font-weight:600;letter-spacing:.02em;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);transition:.2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn.ghosty{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.searchwrap{max-width:560px;margin:26px auto 0;position:relative}
.searchwrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
#search{width:100%;padding:13px 18px 13px 44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15.5px;outline:none;transition:.2s}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
#search::placeholder{color:var(--muted)}

.shelf{max-width:960px;margin:34px auto 90px;padding:0 28px}
.module-label{display:flex;align-items:center;gap:14px;margin:44px 0 16px;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.18em}
.module-label::after{content:'';flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px 16px;position:relative;overflow:hidden;transition:.22s;display:flex;flex-direction:column;gap:8px;min-height:150px}
.card:hover{transform:translateY(-3px);border-color:var(--accent2);box-shadow:0 12px 28px rgba(0,0,0,.09)}
.card .day{position:absolute;right:10px;top:-16px;font-size:76px;font-weight:800;color:var(--ghost);line-height:1;user-select:none}
.card h3{margin:0;font-size:17.5px;line-height:1.35;position:relative;max-width:88%}
.card p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.badge{padding:3px 9px;border-radius:999px;background:var(--ghost);font-size:11px;letter-spacing:.04em}
.badge.done{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:700}
.badge.notes{background:var(--mark);color:#6b5416;font-weight:700}
.pbar{height:3px;border-radius:2px;background:var(--ghost);margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);width:0}
.noresults{text-align:center;color:var(--muted);padding:60px 0}

/* ---------- reader ---------- */
.page{max-width:var(--measure);margin:0 auto;padding:46px 26px 40px}
.page h1{font-size:clamp(28px,4.5vw,40px);line-height:1.18;margin:0 0 10px;letter-spacing:-.4px}
.page h2{font-size:1.42em;margin:2.2em 0 .7em;padding-bottom:.25em;border-bottom:1px solid var(--line);line-height:1.3}
.page h3{font-size:1.14em;margin:1.9em 0 .55em;color:var(--accent)}
.page p{margin:0 0 1.15em}
.page ul,.page ol{margin:0 0 1.2em;padding-left:1.5em}
.page li{margin:.4em 0}
.page blockquote{margin:1.4em 0;padding:.9em 1.3em;border-left:3px solid var(--accent);background:var(--code-bg);border-radius:0 12px 12px 0;font-style:italic;color:color-mix(in srgb,var(--text) 82%,var(--muted))}
.page blockquote p{margin:.2em 0}
.page hr{border:none;border-top:1px solid var(--line);margin:2.6em auto;width:60%}
.page code{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;font-size:.86em;background:var(--code-bg);padding:.15em .4em;border-radius:6px}
/* Inline code has no spaces to break on, so a token like
   base_url="https://api.groq.com/openai/v1" used to force the whole column
   wider than a phone screen. "anywhere" also shrinks min-content width, so
   the paragraph stops pushing the page sideways. Block code is excluded: it
   keeps white-space:pre and scrolls inside its own box instead. */
.page :not(pre) > code{overflow-wrap:anywhere}
.page pre{background:var(--code-bg);border:1px solid var(--line);border-radius:14px;padding:18px 20px;overflow-x:auto;line-height:1.55;margin:0 0 1.4em;font-size:.85em}
.page pre code{background:none;padding:0;font-size:1em}
.page table{border-collapse:collapse;width:100%;margin:0 0 1.5em;font-size:.92em}
/* Tables are wrapped in .table-wrap at render time (see open()). A 6-column
   table cannot shrink below its min-content width, so on a phone it used to
   widen the whole article; the wrapper scrolls it instead. */
.page .table-wrap{max-width:100%;overflow-x:auto;margin:0 0 1.5em}
.page .table-wrap table{margin:0;min-width:100%;width:max-content}
.page th,.page td{border:1px solid var(--line);padding:9px 13px;text-align:left;vertical-align:top}
.page th{background:var(--code-bg);font-weight:700}
.page tr:nth-child(even) td{background:color-mix(in srgb,var(--code-bg) 45%,transparent)}
.page img{max-width:100%;border-radius:12px}
mark{background:var(--mark);border-radius:3px;padding:0 2px}
p.noteable{cursor:pointer;transition:background .2s;border-left:3px solid transparent;padding-left:12px;margin-left:-15px;border-radius:2px}
p.noteable:hover{background:color-mix(in srgb,var(--accent) 7%,transparent);border-left-color:var(--line)}
p.has-note{border-left-color:var(--accent2);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.footnav{max-width:var(--measure);margin:0 auto;padding:0 26px 80px;display:flex;justify-content:space-between;gap:12px}
.footnav button{flex:1;padding:16px 18px;border:1px solid var(--line);background:var(--card);border-radius:14px;font-size:15px;transition:.2s;text-align:left}
.footnav button:hover{border-color:var(--accent2)}
.footnav button small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.footnav button.next{text-align:right}
.chapinfo{text-align:center;color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:.08em;text-transform:uppercase}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.45);z-index:80;display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(560px,100%);max-height:80vh;overflow:auto;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.panel h4{margin:0 0 14px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.panel h4 button{color:var(--muted);font-size:13px}
.toc-item{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px;font-size:14.5px;color:var(--muted)}
.toc-item:hover{background:var(--ghost);color:var(--text)}
.toc-item.h3{padding-left:28px;font-size:13.5px}
.sr-item{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid transparent}
.sr-item:hover{background:var(--ghost);border-color:var(--line)}
.sr-item .where{font-size:11.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}
.sr-item .snip{font-size:14px;color:var(--muted);line-height:1.5}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:12px;font:inherit;font-size:15px;resize:vertical;outline:none}
textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px}
.chip.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.danger{color:#b3402e}
.sizes{display:flex;gap:6px;align-items:center}
.sizes button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);font-size:14px}
.sizes button:hover{background:var(--ghost)}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--mark)}100%{background:transparent}}
@media (max-width:640px){
  .hero{padding-top:40px}.page{padding:30px 20px}
  .footnav{flex-direction:column}
  .stats .stat{min-width:100px;padding:12px 16px}
}
@media print{.topbar,.footnav,#progress-line{display:none}.page{max-width:100%}}
</style>
</head>
<body class="f-serif">
<div id="progress-line"><div id="progress-fill"></div></div>

<nav class="topbar">
  <button class="icon-btn" id="home-btn" title="Dashboard"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Library</button>
  <div class="title" id="bar-title">The 21-Day AI Engineer Course</div>
  <button class="icon-btn" id="toc-btn" title="Contents"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <button class="icon-btn" id="find-btn" title="Search in document"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button class="icon-btn" id="theme-btn" title="Theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg><span id="theme-name">Paper</span></button>
  <div class="sizes">
    <button id="font-btn" title="Toggle serif / sans" style="font-family:Georgia,serif">Aa</button>
    <button id="fs-down" title="Smaller text">A-</button>
    <button id="fs-up" title="Larger text">A+</button>
  </div>
</nav>

<main id="dashboard">
  <header class="hero">
    <h1>The <em>21-Day</em> AI Engineer Course</h1>
    <p>From your first API call to a deployed research agent -- the complete journey, in one book. Click any chapter, or pick up right where you left off.</p>
    <div class="stats">
      <div class="stat"><div class="ring" id="ring"><i id="ring-pct">0%</i></div><span>Progress</span></div>
      <div class="stat"><b id="st-done">0</b><span>Chapters read</span></div>
      <div class="stat"><b id="st-notes">0</b><span>Notes taken</span></div>
      <div class="stat"><b id="st-time">0h</b><span>Reading time</span></div>
    </div>
    <div class="resume" id="resume-slot"></div>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search all chapters..." autocomplete="off">
    </div>
  </header>
  <section class="shelf" id="shelf"></section>
</main>

<main id="reader" class="hide">
  <article class="page" id="page"></article>
  <nav class="footnav">
    <button id="prev-btn"><small><- Previous</small><span id="prev-label"></span></button>
    <button id="next-btn" class="next"><small>Next -></small><span id="next-label"></span></button>
  </nav>
  <div class="chapinfo" id="chapinfo"></div>
</main>

<script>
(function(){
'use strict';
var DATA = __DATA__;
var MODULES = __MODULES__;
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem('kindle-'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set: function(k, v){ try{ localStorage.setItem('kindle-'+k, JSON.stringify(v)); }catch(e){} }
};
var progress = store.get('progress', {});
var notes = store.get('notes', {});
var themes = ['light','sepia','dark'];
var themeNames = {light:'Paper', sepia:'Sepia', dark:'Night'};
var cur = -1;

var marked = window.marked;
var renderer = new marked.Renderer();
renderer.code = function(code, lang){
  var out = '';
  try {
    if (lang && window.hljs && hljs.getLanguage(lang)) {
      out = hljs.highlight(code, {language: lang}).value;
    } else if (window.hljs) {
      out = hljs.highlightAuto(code).value;
    } else { out = code.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  } catch(e){ out = code.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  return '<pre><code class="hljs">' + out + '</code></pre>';
};
marked.setOptions({ renderer: renderer, gfm: true, breaks: false });

function el(id){ return document.getElementById(id); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function rx(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* ---------- settings ---------- */
function applySettings(){
  var theme = store.get('theme','light');
  document.body.className = 't-'+theme+' f-'+store.get('font','serif');
  document.documentElement.style.setProperty('--fs', store.get('fs',19)+'px');
  document.documentElement.style.setProperty('--measure', store.get('measure',680)+'px');
  el('theme-name').textContent = themeNames[theme];
  el('hl-light').disabled = theme==='dark';
  el('hl-dark').disabled = theme!=='dark';
}
el('theme-btn').onclick = function(){
  var t = store.get('theme','light');
  t = themes[(themes.indexOf(t)+1)%themes.length];
  store.set('theme', t); applySettings();
};
el('font-btn').onclick = function(){
  store.set('font', store.get('font','serif')==='serif'?'sans':'serif'); applySettings();
};
el('fs-up').onclick = function(){ store.set('fs', Math.min(26, store.get('fs',19)+1)); applySettings(); };
el('fs-down').onclick = function(){ store.set('fs', Math.max(15, store.get('fs',19)-1)); applySettings(); };

/* ---------- helpers ---------- */
function frac(i){ return (progress[i] && progress[i].f) || 0; }
function noteCount(i){
  var n = 0;
  for (var k in notes){ if (k.indexOf(i+':')===0 && notes[k].trim()) n++; }
  return n;
}
var parseCache = {i:-1, paras:[]};
function chapterText(i, pi){
  if (i !== parseCache.i){
    var d = document.createElement('div');
    d.innerHTML = marked.parse(DATA[i].md);
    parseCache.paras = Array.prototype.slice.call(d.querySelectorAll('p'));
    parseCache.i = i;
  }
  var p = parseCache.paras[pi];
  return p ? p.textContent.trim() : '';
}

/* ---------- dashboard ---------- */
function match(i,q){
  return DATA[i].title.toLowerCase().indexOf(q)>=0 || DATA[i].md.toLowerCase().indexOf(q)>=0;
}
function renderDashboard(){
  var total = DATA.length, done = 0, mins = 0, nnotes = 0;
  for (var i=0;i<total;i++){ if (frac(i)>=.9) done++; mins += DATA[i].minutes; nnotes += noteCount(i); }
  var pct = Math.round(done/total*100);
  el('st-done').textContent = done + ' / ' + total;
  el('st-notes').textContent = nnotes;
  el('st-time').textContent = (mins/60 >= 1 ? (Math.round(mins/6)/10)+'h' : mins+'m');
  el('ring').style.setProperty('--p', pct);
  el('ring-pct').textContent = pct + '%';

  var slot = el('resume-slot'); slot.innerHTML = '';
  var last = store.get('last', -1);
  var target = -1;
  if (last >= 0 && frac(last) > 0.02 && frac(last) < 0.9) target = last;
  else { for (var j=0;j<total;j++){ if (frac(j)<0.9){ target = j; break; } } }
  if (target >= 0){
    var b = document.createElement('button');
    b.className = 'btn';
    var short = DATA[target].title.replace(/^Day\s*\d+\s*--\s*/,'');
    b.innerHTML = 'Continue -- ' + esc(short) +
      (frac(target)>0.02 ? ' <small style="opacity:.75">(Ch. '+(target+1)+' - '+Math.round(frac(target)*100)+'%)</small>' : '');
    b.onclick = function(){ open(target); };
    slot.appendChild(b);
    var ex = document.createElement('button');
    ex.className = 'btn ghosty'; ex.style.marginLeft = '10px';
    ex.textContent = 'Export notes';
    ex.onclick = exportNotes;
    slot.appendChild(ex);
  }

  var q = el('search').value.trim().toLowerCase();
  var shelf = el('shelf'); shelf.innerHTML = '';
  var groups = {};
  DATA.forEach(function(c,i){ (groups[c.module] = groups[c.module]||[]).push(i); });
  MODULES.forEach(function(mod){
    var idxs = (groups[mod]||[]).filter(function(i){ return !q || match(i,q); });
    if (!idxs.length) return;
    var label = document.createElement('div'); label.className='module-label'; label.textContent = mod;
    shelf.appendChild(label);
    var grid = document.createElement('div'); grid.className='grid';
    idxs.forEach(function(i){
      var c = DATA[i], f = frac(i);
      var card = document.createElement('button');
      card.className = 'card';
      var plain = c.md.replace(/^#.*$/m,'').replace(/\*\*/g,'').replace(/[>#`|]/g,' ').replace(/\s+/g,' ').trim();
      var desc = plain.split(' ').slice(0,26).join(' ');
      card.innerHTML =
        '<span class="day">'+String(i+1).padStart(2,'0')+'</span>' +
        '<h3>'+esc(c.title)+'</h3><p>'+esc(desc)+'...</p>' +
        '<div class="meta"><span class="badge'+(f>=.9?' done':'')+'">'+(f>=.9?'Read':(f>0?Math.round(f*100)+'%':'Day '+(i+1)))+'</span>' +
        '<span>'+c.minutes+' min</span>' + (noteCount(i)?'<span class="badge notes">'+noteCount(i)+(noteCount(i)===1?' note':' notes')+'</span>':'') + '</div>' +
        '<div class="pbar"><i style="width:'+(f*100)+'%"></i></div>';
      card.onclick = function(){ open(i); };
      grid.appendChild(card);
    });
    shelf.appendChild(grid);
  });
  if (!shelf.children.length){
    shelf.innerHTML = '<div class="noresults">No chapters match "'+esc(q)+'".</div>';
  }
}
el('search').addEventListener('input', renderDashboard);

function exportNotes(){
  var keys = Object.keys(notes).filter(function(k){ return notes[k].trim(); });
  if (!keys.length){ alert('No notes yet. While reading, click any paragraph to attach a note.'); return; }
  keys.sort(function(a,b){ return (a.split(':')[0]-b.split(':')[0]) || (a.split(':')[1]-b.split(':')[1]); });
  var out = '# My notes -- 21-Day AI Engineer Course\n\n';
  var lastCh = -1;
  keys.forEach(function(k){
    var p = k.split(':'), i = +p[0], pi = +p[1];
    if (i !== lastCh){ out += '## '+DATA[i].title+'\n\n'; lastCh = i; }
    var quote = chapterText(i,pi);
    out += '> ' + quote.slice(0,160) + '\n\n**Note:** ' + notes[k].trim() + '\n\n---\n\n';
  });
  var blob = new Blob([out], {type:'text/markdown'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'my-notes.md'; a.click();
}

/* ---------- reader ---------- */
function open(i, anchor){
  cur = i;
  store.set('last', i);
  el('dashboard').classList.add('hide');
  el('reader').classList.remove('hide');
  el('bar-title').textContent = DATA[i].title;
  var page = el('page');
  page.innerHTML = marked.parse(DATA[i].md);
  // Wrap each table in its own scroll box. A 6-column table cannot shrink
  // below its min-content width, and setting overflow on the table itself does
  // not contain its rows, so on a phone it widened the whole article. The
  // wrapper is a plain block, which does contain them.
  page.querySelectorAll('table').forEach(function(t){
    if (t.parentElement && t.parentElement.classList.contains('table-wrap')) return;
    var wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });
  var hs = page.querySelectorAll('h2, h3');
  var toc = [];
  hs.forEach(function(h, hi){ h.id = 'h'+hi; toc.push({t:h.textContent, l:h.tagName, id:h.id}); });
  page.dataset.toc = JSON.stringify(toc);
  page.querySelectorAll('p').forEach(function(p, pi){
    p.classList.add('noteable');
    if (notes[i+':'+pi]) p.classList.add('has-note');
    p.addEventListener('click', function(){ editNote(i, pi, p); });
  });
  page.querySelectorAll('a').forEach(function(a){ a.target = '_blank'; a.rel='noopener'; });
  window.scrollTo(0,0);
  history.replaceState(null,'','#ch/'+i);
  var f = frac(i);
  if (!anchor && f > 0.02){
    requestAnimationFrame(function(){
      var max = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo(0, max * f);
    });
  }
  if (anchor){
    requestAnimationFrame(function(){
      var t = document.getElementById(anchor);
      if (t){ t.scrollIntoView(); t.classList.add('flash'); }
    });
  }
  el('prev-btn').style.visibility = i>0 ? 'visible':'hidden';
  el('next-btn').style.visibility = i<DATA.length-1 ? 'visible':'hidden';
  el('prev-label').textContent = i>0 ? DATA[i-1].title : '';
  el('next-label').textContent = i<DATA.length-1 ? DATA[i+1].title : '';
  el('chapinfo').textContent = 'Chapter '+(i+1)+' of '+DATA.length+' - '+DATA[i].minutes+' min read';
  window.addEventListener('scroll', onScroll);
}
function closeReader(){
  window.removeEventListener('scroll', onScroll);
  el('reader').classList.add('hide');
  el('dashboard').classList.remove('hide');
  el('bar-title').textContent = 'The 21-Day AI Engineer Course';
  el('search').value = '';
  history.replaceState(null,'','#');
  renderDashboard();
  window.scrollTo(0,0);
}
var scrollTick = null;
function onScroll(){
  if (scrollTick) return;
  scrollTick = requestAnimationFrame(function(){
    scrollTick = null;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var f = max>0 ? Math.min(1, window.scrollY/max) : 1;
    el('progress-fill').style.width = (f*100)+'%';
    if (cur >= 0){ progress[cur] = {f:f, done:f>=.9}; store.set('progress', progress); }
  });
}
el('home-btn').onclick = closeReader;
el('prev-btn').onclick = function(){ if (cur>0) open(cur-1); };
el('next-btn').onclick = function(){ if (cur<DATA.length-1) open(cur+1); };

/* ---------- notes ---------- */
var noteCtx = null;
function editNote(i, pi, pEl){
  noteCtx = {i:i, pi:pi, el:pEl};
  var ov = document.createElement('div'); ov.className='overlay'; ov.id='note-ov';
  var quote = pEl.textContent.trim().slice(0,180);
  ov.innerHTML = '<div class="panel"><h4>Note on this paragraph <button id="note-x">Esc</button></h4>' +
    '<div style="font-size:13.5px;color:var(--muted);font-style:italic;margin-bottom:12px;line-height:1.5">"'+esc(quote)+(quote.length>=180?'...':'')+'"</div>' +
    '<textarea id="note-ta" placeholder="Write your note..."></textarea>' +
    '<div class="row"><button class="chip danger" id="note-del">Delete</button><button class="chip primary" id="note-save">Save note</button></div></div>';
  document.body.appendChild(ov);
  var ta = el('note-ta');
  ta.value = notes[i+':'+pi] || '';
  ta.focus();
  ov.addEventListener('click', function(e){ if (e.target===ov) saveNote(); });
  el('note-x').onclick = saveNote;
  el('note-save').onclick = saveNote;
  el('note-del').onclick = function(){
    delete notes[noteCtx.i+':'+noteCtx.pi]; store.set('notes', notes);
    noteCtx.el.classList.remove('has-note'); closeNote();
  };
}
function saveNote(){
  if (!noteCtx) return;
  var v = el('note-ta').value.trim();
  if (v){ notes[noteCtx.i+':'+noteCtx.pi] = v; noteCtx.el.classList.add('has-note'); }
  else { delete notes[noteCtx.i+':'+noteCtx.pi]; noteCtx.el.classList.remove('has-note'); }
  store.set('notes', notes);
  closeNote();
}
function closeNote(){ var n = el('note-ov'); if (n) n.remove(); noteCtx = null; }

/* ---------- toc + find ---------- */
function showPanel(title, bodyBuilder){
  var ov = document.createElement('div'); ov.className='overlay'; ov.id='panel-ov';
  ov.innerHTML = '<div class="panel"><h4>'+title+' <button id="panel-x">Esc</button></h4><div id="panel-body"></div></div>';
  document.body.appendChild(ov);
  bodyBuilder(el('panel-body'));
  ov.addEventListener('click', function(e){ if (e.target===ov) ov.remove(); });
  el('panel-x').onclick = function(){ ov.remove(); };
  return ov;
}
el('toc-btn').onclick = function(){
  if (el('reader').classList.contains('hide')) return;
  var toc = JSON.parse(el('page').dataset.toc || '[]');
  showPanel('Contents', function(b){
    if (!toc.length){ b.innerHTML = '<div class="noresults">No sections</div>'; return; }
    toc.forEach(function(h){
      var a = document.createElement('button');
      a.className = 'toc-item ' + (h.l==='H3'?'h3':'');
      a.textContent = (h.l==='H3' ? '- ' : '') + h.t;
      a.onclick = function(){
        el('panel-ov').remove();
        var t = document.getElementById(h.id);
        if (t){ t.scrollIntoView({behavior:'smooth'}); t.classList.add('flash'); }
      };
      b.appendChild(a);
    });
  });
};
el('find-btn').onclick = function(){
  showPanel('Search in document', function(b){
    var inp = document.createElement('input');
    inp.type='search'; inp.placeholder = 'Type to search all '+DATA.length+' chapters...';
    inp.style.cssText = 'width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none;margin-bottom:14px';
    var res = document.createElement('div');
    b.appendChild(inp); b.appendChild(res);
    inp.addEventListener('input', function(){
      var q = inp.value.trim().toLowerCase();
      res.innerHTML = '';
      if (q.length < 2) return;
      var found = 0;
      for (var i=0;i<DATA.length && found<40;i++){
        var low = DATA[i].md.toLowerCase();
        var pos = 0, per = 0;
        while ((pos = low.indexOf(q, pos)) >= 0 && per < 3){
          var start = low.lastIndexOf('\n', pos)+1;
          var end = DATA[i].md.indexOf('\n', pos); if (end<0) end = DATA[i].md.length;
          var line = DATA[i].md.slice(start, end).replace(/[#>*`]/g,'').trim();
          if (line){
            (function(ci, lineTxt){
              var item = document.createElement('button'); item.className='sr-item';
              var marked1 = lineTxt.replace(new RegExp(rx(q),'gi'), function(m){ return '\u0001'+m+'\u0002'; });
              item.innerHTML = '<div class="where">'+esc(DATA[ci].title)+'</div><div class="snip">'+
                esc(marked1).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>')+'</div>';
              item.onclick = function(){ el('panel-ov').remove(); open(ci); };
              res.appendChild(item); found++; per++;
            })(i, line);
          }
          pos += q.length;
        }
      }
      if (!found) res.innerHTML = '<div class="noresults">Nothing found.</div>';
    });
    setTimeout(function(){ inp.focus(); }, 50);
  });
};

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (el('note-ov')) return saveNote();
    var p = el('panel-ov'); if (p) p.remove();
    return;
  }
  var tag = document.activeElement ? document.activeElement.tagName : '';
  if (/input|textarea/i.test(tag)) return;
  if (!el('reader').classList.contains('hide')){
    if (e.key === 'ArrowRight' && cur < DATA.length-1) open(cur+1);
    if (e.key === 'ArrowLeft' && cur > 0) open(cur-1);
  }
});

/* ---------- boot ---------- */
applySettings();
renderDashboard();
var hash = location.hash.match(/#ch\/(\d+)/);
if (hash) open(Math.min(DATA.length-1, +hash[1]));
window.addEventListener('hashchange', function(){
  var m = location.hash.match(/#ch\/(\d+)/);
  if (m && +m[1] !== cur) open(+m[1]);
});
})();
</script>
