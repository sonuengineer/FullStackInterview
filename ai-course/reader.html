 again, with a new name.\n\nIf you are ever tuning a crew and getting nowhere, you are probably editing backstories. Go and edit the expected outputs.\n\n---\n\n### Stage 4 -- Hierarchical, and what it costs\n\n```python\nmanager = LLM(model=\"groq/llama-3.3-70b-versatile\", api_key=os.environ[\"GROQ_API_KEY\"])\n\ncrew = Crew(\n    agents=[researcher, writer],\n    tasks=[Task(\n        description=\"Find out what the user's documents say about deadlines AND about \"\n                    \"budget, then write one summary covering both with sources.\",\n        expected_output=\"Under 300 words, two sections, every claim with its source filename.\",\n    )],\n    process=Process.hierarchical,\n    manager_llm=manager,\n    verbose=True,\n)\n```\n\nNote the task has **no agent**. The manager decides who does it.\n\n**Turn on delegation** and watch the difference:\n\n```python\nresearcher = Agent(..., allow_delegation=True)\n```\n\nNow agents can ask each other for help.\n\n**Count the calls in both versions.** Hierarchical with delegation is typically two to four times the tokens of sequential, because the manager reasons about assignment, agents write delegation requests, and results get passed around.\n\n**When is it worth it?** When the work genuinely cannot be ordered in advance. If you already know it is research-then-write, `sequential` does the same job for a fraction of the cost. This is Day 14's conclusion, arriving again from a different direction: coordination is not free, and most tasks do not need it.\n\n---\n\n### Stage 5 -- Map it all back\n\nFill this in yourself. It is the exercise, not the reference:\n\n| Concept | Your code | LangGraph | CrewAI |\n|---|---|---|---|\n| A worker | `agent(goal, prompt, tools)` | a node | `Agent` |\n| Its instructions | system prompt | node function | `role`+`goal`+`backstory` |\n| One unit of work | a delegation call | a node run | `Task` |\n| Output shape | Day 3 format rules | your prompt | `expected_output` |\n| Handoff | the `findings` string | state | `context=[...]` |\n| Orchestration | `supervise()` | edges | `Process` |\n| Tools | `TOOL_SCHEMAS` | `@tool` | `@tool` |\n| Step limit | `max_steps` | `recursion_limit` | `max_iter` |\n| Budget | `SharedBudget` | -- | `max_rpm` |\n\n**Look at the last two rows.** Neither framework gives you Day 9's three-way budget of steps, tokens and wall-clock time. You still have to build that yourself, and it is the thing that stops a runaway run costing real money.\n\n**Frameworks give you structure. They do not give you operational safety.** That gap is where most of Day 15 lives, and it does not close when you adopt a framework.\n\n---\n\n### Stage 6 -- Open the box, and judge honestly\n\n**See what it actually sends:**\n\n```python\nimport litellm\nlitellm.set_verbose = True\ncrew.kickoff()\n```\n\nRead the real prompts. You will find framework-written text around your descriptions -- task wrappers, delegation instructions, output-format boilerplate. **Estimate how many tokens that adds per call**, then multiply by the number of calls in a run. That is your framework tax, and it is not small.\n\n**Then run your Day 15 evals** against three implementations of the same task: hand-written Day 14, LangGraph, CrewAI.\n\n```\n                 success   tokens   seconds\nhand-written        80%     8,400      22\nlanggraph           80%     9,100      24\ncrewai              73%    14,200      38\n```\n\nWrite your own numbers. The shape is usually: **similar quality, meaningfully more tokens** for the more opinionated framework.\n\n**The honest summary:**\n\n| | Best at |\n|---|---|\n| **Your own code** | Full control, minimum tokens, you can debug anything. Costs your time. |\n| **LangGraph** | Custom control flow, persistence, resumable interrupts, deployment. |\n| **CrewAI** | Getting a standard role-based team running very fast. |\n\n**And the real recommendation, having built all three:** start with your own code for anything unusual. Reach for LangGraph when you need persistence and branching. Reach for CrewAI when the problem genuinely is a team of roles and you want it working this afternoon.\n\nNone of the three makes the model smarter. All of them are ways of organising prompts.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **Agent (CrewAI)** | A role with a goal, backstory, tools and an LLM. |\n| **Role / goal / backstory** | Three strings that become the system prompt. |\n| **Task** | One unit of work, with a description and an expected output. |\n| **expected_output** | The format specification. The biggest quality lever here. |\n| **context=[...]** | Which earlier task outputs feed this one. The handoff. |\n| **Crew** | The team plus the tasks plus the process. |\n| **Process.sequential** | Tasks in order. |\n| **Process.hierarchical** | A manager LLM assigns work. |\n| **allow_delegation** | Whether agents may ask each other for help. |\n| **max_iter** | Step limit per agent. |\n| **max_rpm** | Requests per minute cap. |\n| **kickoff()** | Run the crew. |\n| **Opinionated framework** | Fewer decisions, less control. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Empty the expected_output.**\nSet it to `\"A summary.\"` on both tasks.\n*You will see:* a noticeable quality drop.\n*It teaches:* the most useful thing about CrewAI. It is Day 3 with a new name.\n\n**2. Swap the backstories.**\nGive the researcher the writer's backstory and vice versa, keeping roles and tasks.\n*You will see:* less difference than you expect.\n*It teaches:* `backstory` is a style nudge, not a personality. The task description does the work.\n\n**3. Count the delegation tax.**\nSame task, `allow_delegation` off then on.\n*You will see:* two to four times the tokens.\n*It teaches:* coordination has a price tag, and here it is.\n\n**4. Break the handoff.**\nRemove `context=[research_task]` from the writing task.\n*You will see:* the writer working with nothing, inventing content.\n*It teaches:* `context` is the handoff, and the handoff is everything. Day 14's lesson, reconfirmed.\n\n**5. Read the real prompts.**\n`litellm.set_verbose = True`.\n*You will see:* a lot of text you did not write.\n*It teaches:* what you are paying for.\n\n**6. Three-way eval.**\nDay 15's eval set against hand-written, LangGraph and CrewAI.\n*You will see:* similar quality, different costs.\n*It teaches:* how to choose a framework with evidence rather than enthusiasm.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- the default OpenAI model**\n*Symptom:* an authentication error mentioning OpenAI when you configured Groq.\n*Fix:* pass `llm=` explicitly on every agent, with the `groq/` prefix.\n\n**Trap 2 -- dependency conflicts**\n*Symptom:* pip breaks your working environment.\n*Fix:* a separate virtual environment for CrewAI.\n\n**Trap 3 -- the backstory trap**\n*Symptom:* hours spent writing richer personas, no improvement.\n*Fix:* edit `expected_output` and task descriptions instead.\n\n**Trap 4 -- hierarchical by default**\n*Symptom:* three times the cost for no gain.\n*Fix:* `sequential` unless the ordering genuinely cannot be decided in advance.\n\n**Trap 5 -- delegation loops**\n*Symptom:* agents delegating back and forth.\n*Fix:* `allow_delegation=False` unless needed, and set `max_iter`.\n\n**Trap 6 -- assuming frameworks bring safety**\n*Symptom:* your careful Day 9 budgets and Day 13 permission tiers quietly disappear when you port to a framework.\n*Fix:* keep them. `max_iter` and `max_rpm` are not a token budget, a wall-clock limit, or a permission model. Frameworks give structure, not operational safety.\n\n---\n\n## 10. Check yourself\n\n1. Map `Agent`, `Task`, `context` and `Process` to your own Day 14 code.\n2. Which CrewAI field has the biggest effect on output quality, and which one only appears to?\n3. When is `hierarchical` worth its cost, and when is it waste?\n4. Name two things from Day 9 and Day 13 that no framework gives you.\n5. You need a research-then-write pipeline this afternoon. Which of the three do you pick, and why?\n\n---\n\n## 11. Where this goes\n\n- **Day 18** builds the research agent for real, and you choose your approach with the three-way eval numbers in hand.\n- **Day 19 (LangChain)** is the layer under LangGraph -- document loaders, splitters, retrievers -- some of which would have saved you time on Days 5 and 6, and some of which is a wrapper you do not need.\n- **Day 20** deploys it. Framework choice matters here: LangGraph's checkpointing is built for it, CrewAI less so.\n- **Day 21** is the capstone, and cost per task is a real constraint. A framework tax of 60% more tokens is a business decision, not a detail.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 17:\n\nFolders:\n  research-assistant/\n    ai/\n      crew_agent.py        (NEW - Day 14's team rebuilt in CrewAI)\n      graph_agent.py       (Day 16 LangGraph version)\n      multi_agent.py       (Day 14 hand-written version - all three kept\n                            side by side on purpose, for comparison)\n      observability.py, evals.py, reliability.py, logs/\n      chat.py, agent.py, autonomous.py, planner.py, memory.py\n      retrieval.py, golden_set.py, security.py\n      vector_store.py, embeddings.py, documents.py, tools.py\n      mcp_agent.py, mcp_client.py, mcp_servers/my_tools.py\n      prompts.py, classify.py, test_prompt.py\n      runs/, notes/, documents/, chroma_db/\n    dashboard/             (still empty)\n\nLibraries: crewai, crewai-tools (NEW). Heavy dependency tree with stricter\nPython version requirements - installed in a SEPARATE venv (venv-crew) to\navoid breaking the working environment.\n\nCRITICAL CONFIG: CrewAI defaults to OpenAI. Groq must be passed explicitly:\n  LLM(model=\"groq/llama-3.3-70b-versatile\", api_key=...)\n  the \"groq/\" prefix is what selects the provider\n\ncrew_agent.py:\n  researcher Agent - role/goal/backstory, tools=[search_documents,\n      current_time], allow_delegation=False\n  writer Agent     - NO TOOLS (Day 14 reasoning: cannot wander, cannot be\n      used by an injection to write anything)\n  research_task    - description includes \"state clearly what you could NOT\n      find\", which was OUR Day 14 discovery, not something the framework\n      supplies\n  writing_task     - context=[research_task]  \u003c- this IS the handoff\n  Crew(process=Process.sequential)\n\nTHE MAPPING (fill in and keep):\n  concept          your code           LangGraph        CrewAI\n  worker           agent(...)          node             Agent\n  instructions     system prompt       node function    role+goal+backstory\n  unit of work     delegation call     node run         Task\n  output shape     Day 3 format rules  your prompt      expected_output\n  handoff          findings string     state            context=[...]\n  orchestration    supervise()         edges            Process\n  tools            TOOL_SCHEMAS        @tool            @tool\n  step limit       max_steps           recursion_limit  max_iter\n  budget           SharedBudget        --               max_rpm (partial)\n\nMEASURED (Day 15 evals, same tasks, three implementations):\n  hand-written   80%   8,400 tokens   22s\n  langgraph      80%   9,100 tokens   24s\n  crewai         73%  14,200 tokens   38s\n  (record your own; the usual shape is similar quality, more tokens for\n   the more opinionated framework)\n\nFindings worth remembering:\n  - expected_output is the BIGGEST quality lever in CrewAI; it is Day 3's\n    format specification with a new name\n  - backstory feels important and does very little; it is a style nudge,\n    not a personality\n  - hierarchical + allow_delegation costs 2-4x sequential; only worth it\n    when the ordering genuinely cannot be decided in advance\n  - framework prompt wrappers (visible via litellm.set_verbose) add real\n    tokens to every single call\n\nKey decisions made:\n  - all three implementations kept side by side rather than replacing\n  - frameworks judged by running the Day 15 eval set, not by feature lists\n  - Day 9 budgets and Day 13 permission tiers are NOT ported away; no\n    framework provides a token budget, a wall-clock limit, or a permission\n    model\n\nKnown problems, left for later:\n  - CrewAI lives in a separate venv; the project now has two environments\n  - crew_agent.py has no token or wall-clock budget wired in\n  - no observability logging from inside the crew; litellm verbose output\n    is not captured into logs/calls.jsonl\n  - hierarchical process not used in the final version, on cost grounds\n```\n\n---\n\n## Answers\n\n**1.** `Agent` is your specialist worker with its own system prompt and tool list. `Task` is one delegation call. `context=[...]` is the `findings` string handed between agents. `Process` is the `supervise()` loop -- sequential is your pipeline, hierarchical is your supervisor with a manager model.\n\n**2.** `expected_output` has the biggest effect, because it is a format specification that goes into the prompt. `backstory` only appears to matter -- it reads like a character description but is a mild style nudge.\n\n**3.** Worth it when the order of work genuinely cannot be decided in advance, so a manager must assign it at runtime. Waste when you already know the sequence, because sequential does the same job at a fraction of the token cost.\n\n**4.** A real budget across steps, tokens and wall-clock time (Day 9), and a permission model separating read-only from write tools (Day 13). `max_iter` and `max_rpm` are not substitutes. You keep building these yourself.\n\n**5.** CrewAI, if it really is just research-then-write and you want it today -- that is exactly the shape it is built for and it is about thirty lines. If it needs to persist across restarts, or branch, or pause for approval, LangGraph instead.\n"},{"file":"day-18.md","title":"Day 18 -- Build Our AI Research Agent","module":"04 -- Frameworks","time":"about 1 hour, probably more","minutes":20,"md":"# Day 18 -- Build Our AI Research Agent\n\n**Module:** 04 -- Frameworks\n**Time:** about 1 hour, probably more\n**Builds on:** all seventeen days. Especially Day 15 -- evals; Day 17 -- the three-way comparison\n\n---\n\n## 1. Today in one line\n\nYou stop building components and build the **product** -- one research agent, assembled from evidence, that produces a cited report you would actually send to someone.\n\n---\n\n## 2. The problem\n\nLook at your `ai/` folder. Twenty-odd files. Three different multi-agent implementations. Five variations of the agent loop. Two virtual environments.\n\n**None of it is a thing.** You have an excellent parts bin and no machine.\n\nAnd a research agent is more than a question-answering bot. A bot answers from one search. Research means:\n\n- working out what the question actually is\n- gathering from **several** sources\n- noticing when sources **disagree**\n- saying what could not be found\n- and attaching a source to every claim, so someone can check\n\nThat last one is the difference between a report and a plausible essay. A research output nobody can verify is worse than no output, because it carries authority it has not earned.\n\nToday is less new theory and more **integration** -- which sounds easy and is not. You have already met this: memory (Day 2) and documents (Day 5) each worked perfectly alone, and together they caused constant rate limits. Components interact. Today you find out where.\n\n---\n\n## 3. Mental model\n\n**You are assembling, not inventing.**\n\nEvery part exists. The work is choosing which parts, connecting them, and measuring the result.\n\n**Where this comparison breaks, and it is the whole risk of today:**\n\n**Integration is not additive.** Two components that each work can produce a system that does not. The token cost of your pipeline is the sum of every stage -- retrieval, rewriting, memory extraction, agent steps, critic passes. Each was reasonable alone. Together they can make one report cost more than a hundred chat messages.\n\nSo today has a rule:\n\n> Measure the whole thing, not the parts. You already measured the parts.\n\n**What a research agent actually does**, as a shape:\n\n```\nquestion\n  -> clarify      is this answerable? what is really being asked?\n  -> plan         what sub-questions does this break into?\n  -> gather       search each sub-question, in parallel, across sources\n  -> cross-check  do the sources agree? what is missing?\n  -> synthesise   write it, with a source on every claim\n  -> verify       do the cited sources actually exist and say that?\n```\n\nDays 10, 12, 14 and 9 respectively. Nothing new. The work is in the joins.\n\n---\n\n## 4. How it really works\n\n**Decision one: single agent or a team?**\n\nUse your Day 17 table. If your numbers said the single agent matched the team at a third of the cost, build the single agent. A \"research agent\" does not require multiple agents -- it requires multiple *searches*, which Day 7's loop already gives you.\n\nThe one place a team clearly wins here is **parallel gathering** of independent sub-questions, which is Day 14's one genuine advantage.\n\n**Decision two: framework or not?**\n\nSame answer, same evidence. A sensible middle position, and the one this lesson takes: **your own pipeline code, calling your own components, with LangGraph only if you need persistence and resumable interrupts** -- which you will, on Day 20.\n\n**Decision three: where do citations come from?**\n\nThis is the one that matters most, and it has a trap in it.\n\nThe wrong way: ask the model to cite its sources. It will. It will also invent filenames that look exactly like your real ones.\n\nThe right way: **citations come from your retrieval code, not from the model.** You know which chunk came from which file, because you attached that at index time on Day 5. Give each retrieved chunk an id, require the model to reference ids, then **check in code** that every id it used was actually in what you gave it.\n\nA citation the model produced is a claim. A citation your code verified is evidence.\n\n**Decision four: what does \"done\" mean?**\n\nA research report is done when every sub-question has been attempted, every claim has a verified source, and gaps are stated explicitly. Not when the model says it is finished -- Day 9 settled that.\n\n---\n\n## 5. Setup\n\nTime to tidy up. Make one package:\n\n```bash\ncd research-assistant/ai\nmkdir -p research\ntouch research/__init__.py research/pipeline.py research/sources.py research/report.py\n```\n\n**Optional but worth it: a second source.** A research agent reading only your local files is thin. A free web search, no key required:\n\n```bash\npip install ddgs\n```\n\nIt is unofficial and gets rate-limited, so treat it as a source that may fail -- which is good practice anyway, since every real source does. If it is unreliable for you, skip it; everything below works with documents alone.\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- Write the decisions down\n\nBefore code, ten minutes with a text file. `research/DECISIONS.md`:\n\n```markdown\n# Architecture decisions\n\n## 1. Single agent with parallel gathering, not a multi-agent crew\nEvidence: Day 17 eval, 3 tasks. Multi 73-80% success at 14,200 tokens;\nsingle 80% at 8,400. Keeping parallel fan-out for independent sub-questions,\nwhich was the one place the team genuinely won.\n\n## 2. Own pipeline code, LangGraph only for the outer loop on Day 20\nEvidence: Day 16 eval showed equal quality, ~8% more tokens. Adopting it for\ncheckpointing and resumable interrupts, which deployment needs, not for the\nagent logic.\n\n## 3. Citations produced by retrieval code, verified in code\nThe model never invents a source id, because it only ever sees ids we gave it,\nand we check every id it used.\n\n## 4. Two sources: local documents and web search\nWeb search may fail. The pipeline must produce a report anyway and say which\nsources were unavailable.\n\n## 5. Hard budget: 60,000 tokens and 300 seconds per report\nDay 9's budget, applied to the whole pipeline rather than one agent.\n```\n\n**This file is not ceremony.** In three weeks you will wonder why you did not use CrewAI, and this tells you -- with numbers. Every real project has this document, usually written too late.\n\n---\n\n### Stage 2 -- Sources with provenance\n\n`research/sources.py`:\n\n```python\nimport uuid\nimport tools as my_tools\nfrom retrieval import reranked_search\n\n\ndef search_documents(query, limit=5):\n    \"\"\"Local documents. Returns chunks with a stable citation id.\"\"\"\n    try:\n        hits = reranked_search(query, top_n=limit)\n    except Exception as error:\n        return {\"ok\": False, \"error\": str(error)[:150], \"chunks\": []}\n\n    chunks = []\n    for hit in hits:\n        chunks.append({\n            \"id\": f\"D{uuid.uuid4().hex[:6]}\",\n            \"text\": hit[\"text\"],\n            \"source\": hit[\"source\"],\n            \"kind\": \"document\",\n            \"score\": hit.get(\"rerank_score\", 0),\n        })\n    return {\"ok\": True, \"chunks\": chunks}\n\n\ndef search_web(query, limit=4):\n    \"\"\"Web search. May fail, and that is expected.\"\"\"\n    try:\n        from ddgs import DDGS\n        results = list(DDGS().text(query, max_results=limit))\n    except Exception as error:\n        return {\"ok\": False, \"error\": str(error)[:150], \"chunks\": []}\n\n    chunks = []\n    for r in results:\n        chunks.append({\n            \"id\": f\"W{uuid.uuid4().hex[:6]}\",\n            \"text\": f\"{r.get('title','')}\\n{r.get('body','')}\",\n            \"source\": r.get(\"href\", \"unknown\"),\n            \"kind\": \"web\",\n            \"score\": 0.5,\n        })\n    return {\"ok\": True, \"chunks\": chunks}\n\n\ndef gather(query):\n    \"\"\"Every source, with failures recorded rather than raised.\"\"\"\n    document_result = search_documents(query)\n    web_result = search_web(query)\n\n    return {\n        \"chunks\": document_result[\"chunks\"] + web_result[\"chunks\"],\n        \"failed\": [name for name, r in\n                   [(\"documents\", document_result), (\"web\", web_result)]\n                   if not r[\"ok\"]],\n    }\n```\n\n**Three things doing real work.**\n\n**Every chunk gets an id at the moment it is retrieved.** `D4f2a1`, `W9c3e0`. The model will only ever see these ids, so the only ids it can cite are ones you handed it.\n\n**A failing source returns a result, it does not raise.** The report must still be produced, with the failure noted. A research tool that dies because one source was down is not usable.\n\n**`kind` marks provenance.** A claim from your own document is not the same as a claim from a random web page, and the report should say which.\n\n---\n\n### Stage 3 -- The pipeline\n\n`research/pipeline.py`:\n\n```python\nimport os, json, time, asyncio\nfrom openai import OpenAI\nfrom dotenv import load_dotenv\nfrom observability import new_trace, log_call\nfrom research.sources import gather\n\nload_dotenv()\nclient = OpenAI(api_key=os.environ[\"GROQ_API_KEY\"],\n                base_url=\"https://api.groq.com/openai/v1\")\nBIG = \"llama-3.3-70b-versatile\"\nSMALL = \"llama-3.1-8b-instant\"\n\n\ndef ask(messages, model=BIG, component=\"research\", json_mode=False):\n    start = time.time()\n    kwargs = {\"response_format\": {\"type\": \"json_object\"}} if json_mode else {}\n    response = client.chat.completions.create(\n        model=model, messages=messages, temperature=0, **kwargs)\n    log_call(model, component,\n             response.usage.prompt_tokens, response.usage.completion_tokens,\n             (time.time() - start) * 1000)\n    return response.choices[0].message.content\n\n\nPLAN_PROMPT = \"\"\"You break a research question into sub-questions.\n\nReply with JSON only:\n{\"answerable\": true/false,\n \"reason\": \"if not answerable, why\",\n \"sub_questions\": [\"...\", \"...\", \"...\"]}\n\nRULES\n- 2 to 4 sub-questions. Each must be independently searchable.\n- Each must stand alone. Do not write \"and the other one\".\n- Set answerable to false if the question is too vague to research, or asks\n  for something nobody could know.\"\"\"\n\n\ndef plan(question):\n    raw = ask([{\"role\": \"system\", \"content\": PLAN_PROMPT},\n               {\"role\": \"user\", \"content\": question}],\n              model=SMALL, component=\"plan\", json_mode=True)\n    return json.loads(raw)\n\n\ndef gather_all(sub_questions):\n    \"\"\"Parallel, because sub-questions are independent by construction.\"\"\"\n    async def run():\n        loop = asyncio.get_event_loop()\n        jobs = [loop.run_in_executor(None, gather, q) for q in sub_questions]\n        return await asyncio.gather(*jobs)\n\n    results = asyncio.run(run())\n\n    chunks, failed = [], set()\n    for sub_question, result in zip(sub_questions, results):\n        for chunk in result[\"chunks\"]:\n            chunk[\"for\"] = sub_question\n            chunks.append(chunk)\n        failed.update(result[\"failed\"])\n    return chunks, sorted(failed)\n```\n\n**`plan` uses the small model.** Day 15's routing: breaking a question into parts is a narrow structured job. Ten times cheaper, no measurable quality loss. Check that on your own evals rather than taking my word.\n\n**The sub-questions must be independent** -- the prompt says so explicitly -- because Stage 3 runs them in parallel. Day 14's warning: splitting something that does not split gives you agents working with incomplete information.\n\n---\n\n### Stage 4 -- Synthesis with enforced citations\n\nStill in `pipeline.py`:\n\n```python\nSYNTHESIS_PROMPT = \"\"\"You write a research report from numbered sources.\n\nCITATION RULES\n- Every factual claim must end with its source id in square brackets, like [D4f2a1].\n- Use ONLY ids from the sources given. Never invent an id.\n- If sources disagree, say so explicitly and cite both.\n- If a sub-question has no supporting source, write it under \"Gaps\". Do not\n  fill the gap from your own knowledge.\n\nFORMAT\n## Summary\nTwo or three sentences answering the main question.\n\n## Findings\nOne short section per sub-question. Every claim cited.\n\n## Disagreements\nWhere sources conflict, and what each says. Write \"None found\" if there are none.\n\n## Gaps\nWhat could not be answered, and why.\n\nUnder 500 words. Plain language. Never write a claim you cannot cite.\"\"\"\n\n\ndef synthesise(question, sub_questions, chunks):\n    blocks = []\n    for c in chunks:\n        blocks.append(f\"[{c['id']}] ({c['kind']}: {c['source']})\\n{c['text'][:900]}\")\n\n    return ask([\n        {\"role\": \"system\", \"content\": SYNTHESIS_PROMPT},\n        {\"role\": \"user\", \"content\":\n         f\"MAIN QUESTION: {question}\\n\\n\"\n         f\"SUB-QUESTIONS:\\n\" + \"\\n\".join(f\"- {q}\" for q in sub_questions) +\n         \"\\n\\nSOURCES:\\n\" + \"\\n\\n\".join(blocks)}\n    ], component=\"synthesis\")\n```\n\nNow the part that makes citations mean something:\n\n```python\nimport re\n\ndef verify_citations(report, chunks):\n    \"\"\"Check every cited id was actually given to the model.\"\"\"\n    given = {c[\"id\"] for c in chunks}\n    used = set(re.findall(r\"\\[([DW][0-9a-f]{6})\\]\", report))\n\n    fabricated = used - given\n    unused = given - used\n\n    claim_lines = [line for line in report.split(\"\\n\")\n                   if line.strip().startswith(\"-\") and len(line) > 40]\n    uncited = [line for line in claim_lines if not re.search(r\"\\[[DW][0-9a-f]{6}\\]\", line)]\n\n    return {\n        \"fabricated\": sorted(fabricated),\n        \"uncited_claims\": uncited[:5],\n        \"sources_used\": len(used),\n        \"sources_available\": len(given),\n        \"clean\": not fabricated and not uncited,\n    }\n```\n\n**Run this on every report, and print the result.**\n\n`fabricated` should always be empty. When it is not, the model invented a source id that looks exactly like a real one -- and without this check you would never have noticed, because `[D7b3f2]` looks entirely convincing.\n\n**This is the single most valuable function in today's file.** It is the difference between a report you can trust and one that merely looks trustworthy.\n\n---\n\n### Stage 5 -- Put it together\n\n```python\ndef research(question, max_seconds=300):\n    trace = new_trace()\n    started = time.time()\n\n    plan_result = plan(question)\n    if not plan_result.get(\"answerable\"):\n        return {\"ok\": False, \"reason\": plan_result.get(\"reason\"), \"trace\": trace}\n\n    sub_questions = plan_result[\"sub_questions\"]\n    print(f\"[{trace}] {len(sub_questions)} sub-questions\")\n    for q in sub_questions:\n        print(f\"  - {q}\")\n\n    chunks, failed = gather_all(sub_questions)\n    print(f\"  gathered {len(chunks)} sources\"\n          + (f\", FAILED: {failed}\" if failed else \"\"))\n\n    if not chunks:\n        return {\"ok\": False, \"reason\": \"No sources returned anything.\",\n                \"failed_sources\": failed, \"trace\": trace}\n\n    report = synthesise(question, sub_questions, chunks)\n    check = verify_citations(report, chunks)\n\n    return {\n        \"ok\": True,\n        \"trace\": trace,\n        \"question\": question,\n        \"sub_questions\": sub_questions,\n        \"report\": report,\n        \"citations\": check,\n        \"failed_sources\": failed,\n        \"seconds\": round(time.time() - started, 1),\n        \"sources\": [{\"id\": c[\"id\"], \"source\": c[\"source\"], \"kind\": c[\"kind\"]}\n                    for c in chunks],\n    }\n\n\nif __name__ == \"__main__\":\n    result = research(\"What deadlines and budget constraints do my documents describe, \"\n                      \"and do they conflict with each other?\")\n    print(\"\\n\" + \"=\" * 70)\n    print(result.get(\"report\", result.get(\"reason\")))\n    print(\"=\" * 70)\n    print(result.get(\"citations\"))\n    print(f\"{result.get('seconds')}s\")\n```\n\nRun it. You get a structured report with a Summary, Findings, Disagreements and Gaps, every claim carrying a source id, and a verification result telling you whether those ids were real.\n\n**Save it to `runs/` alongside your agent trajectories.** A report without its trace is not reproducible.\n\n---\n\n### Stage 6 -- Measure the whole thing and fix the worst part\n\nNow the rule from section 3.\n\n```python\nQUESTIONS = [\n    \"What deadlines do my documents describe?\",\n    \"Do my documents contradict each other about the budget?\",\n    \"What does my project plan say about risks, and what does it leave out?\",\n    \"What is my manager's home address?\",          # unanswerable\n    \"Tell me everything about everything.\",         # too vague to plan\n]\n\nfor q in QUESTIONS:\n    result = research(q)\n    print(f\"\\n{q[:50]}\")\n    print(f\"  ok={result['ok']} {result.get('seconds','')}s\")\n    if result[\"ok\"]:\n        c = result[\"citations\"]\n        print(f\"  fabricated={c['fabricated']} uncited={len(c['uncited_claims'])} \"\n              f\"sources used {c['sources_used']}/{c['sources_available']}\")\n\nreport()   # from observability.py -- cost per component\n```\n\n**Three things to look at, in this order.**\n\n**Cost per report.** Add it up from the log. If one report costs more than a hundred chat messages, that is a product decision, not a bug -- but you need the number before you can make it.\n\n**The dominant component.** Almost certainly synthesis, because it carries every chunk. The lever is `text[:900]`: trim it and re-measure quality.\n\n**Run the same question twice and compare the two reports.** They will differ. Day 15 told you to expect this; seeing it in a *deliverable* is a different feeling from seeing it in a test score. A report is something you hand to a person, and it not being reproducible is a real property of the thing you have built. Decide what you will tell users about that.\n\nThen **fix only the worst failure** you found. Not all of them. One. Re-measure. That is what the rest of the work looks like.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **Integration** | Joining working parts into a working whole. Not automatic. |\n| **ADR** | Architecture decision record. Why you chose what you chose. |\n| **Provenance** | Where a piece of information came from. |\n| **Citation id** | A stable label attached to a chunk at retrieval time. |\n| **Fabricated citation** | A source id the model invented. |\n| **Cross-checking** | Comparing what different sources say. |\n| **Synthesis** | Writing the report from gathered sources. |\n| **Gaps section** | Explicitly stating what could not be found. |\n| **Graceful degradation** | Producing a report when a source is down. |\n| **Cost per report** | The number that decides whether this is viable. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Remove citation verification.**\nRun five reports and read the ids by hand against the source list.\n*You will see:* at least one invented id, sooner or later, looking completely real.\n*It teaches:* why a model-produced citation is a claim, not evidence.\n\n**2. Contradict yourself on purpose.**\nPut \"the deadline is 30 November\" in one document and \"the deadline is 15 December\" in another. Ask about the deadline.\n*You will see:* whether the Disagreements section actually works.\n*It teaches:* noticing conflict is the thing that makes it research rather than lookup.\n\n**3. Kill a source.**\nDisconnect the internet, or break `search_web`.\n*You will see:* whether you still get a report with a noted failure, or a crash.\n*It teaches:* graceful degradation, tested rather than assumed.\n\n**4. Ask something with no answer.**\n*You will see:* whether it says so, or writes a confident report from general knowledge.\n*It teaches:* the Gaps section is a safety feature, not a formatting choice.\n\n**5. Run the same question twice.**\nCompare the two reports properly, line by line.\n*You will see:* different sub-questions, different sources, different emphasis.\n*It teaches:* what statistical means when the output is a deliverable.\n\n**6. Break independence.**\nMake the planner produce sub-questions where the third depends on the first.\n*You will see:* the parallel gather returns poor results for the dependent one.\n*It teaches:* Day 14's rule, now load-bearing in your product.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- fabricated citations**\n*Symptom:* a report that looks perfectly sourced and is not.\n*Fix:* `verify_citations`, run every time, printed every time.\n\n**Trap 2 -- integration cost surprise**\n*Symptom:* each component was affordable; the pipeline is not.\n*Fix:* measure the whole pipeline. Trim the biggest contributor first.\n\n**Trap 3 -- the single-source report**\n*Symptom:* every claim cites the same file.\n*Fix:* check source diversity in `verify_citations` and say so in the report when it happens.\n\n**Trap 4 -- confident emptiness**\n*Symptom:* a well-formatted report containing nothing that was actually found.\n*Fix:* if `sources_used` is very low relative to claims, say so instead of shipping it.\n\n**Trap 5 -- no decision record**\n*Symptom:* rebuilding the same comparison in a month.\n*Fix:* `DECISIONS.md`, with the numbers.\n\n**Trap 6 -- reports that outrun their evidence**\n*Symptom:* not a code bug. A report that reads as authoritative on a question it only partly answered.\n*Fix:* the Gaps section, and being willing to return \"not enough sources\" as a result. A tool that sometimes says \"I could not answer this\" is more useful than one that never does.\n\n---\n\n## 10. Check yourself\n\n1. Why must citation ids be created by your retrieval code and not by the model?\n2. Name a component pairing that worked alone and broke together earlier in this course.\n3. What makes a research agent different from a question-answering bot?\n4. Why must sub-questions be independent in this design?\n5. You run the same question twice and get two different reports. Is that a bug? What do you tell users?\n\n---\n\n## 11. Where this goes\n\n- **Day 19 (LangChain)** offers loaders, splitters and retrievers you could swap into `sources.py`. You will judge them by running today's pipeline with each and comparing.\n- **Day 20** puts this behind an API and finally builds the Node dashboard in front of it. Today's `research()` returning a structured dict rather than a string is exactly what makes that straightforward.\n- **Day 21** turns it into the platform: many users, saved reports, history, and the cost per report you measured today as a real constraint.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 18:\n\nFolders:\n  research-assistant/\n    ai/\n      research/                 (NEW - the actual product)\n        __init__.py\n        DECISIONS.md            (architecture decision record, with numbers)\n        sources.py              (document + web search, provenance, failures)\n        pipeline.py             (plan -> gather -> synthesise -> verify)\n      observability.py, evals.py, reliability.py, logs/\n      retrieval.py, golden_set.py, vector_store.py, embeddings.py\n      documents.py, tools.py, memory.py, security.py\n      graph_agent.py, crew_agent.py, multi_agent.py  (kept for comparison)\n      chat.py, agent.py, autonomous.py, planner.py\n      mcp_agent.py, mcp_client.py, mcp_servers/my_tools.py\n      prompts.py, classify.py, test_prompt.py\n      runs/, notes/, documents/, chroma_db/\n    dashboard/                  (STILL EMPTY - Node arrives on Day 20)\n\nLibraries: ddgs (NEW, optional). Unofficial and rate-limited, treated as a\nsource that may fail.\n\nARCHITECTURE DECISIONS (research/DECISIONS.md), all evidence-based:\n  1. single agent + parallel gathering, NOT a multi-agent crew\n     (Day 17 eval: multi 73-80% at 14,200 tokens, single 80% at 8,400)\n  2. own pipeline code; LangGraph adopted only for the outer loop on Day 20,\n     for checkpointing and resumable interrupts, not for agent logic\n  3. citations produced by retrieval code and verified in code\n  4. two sources, and the report must still be produced when one fails\n  5. hard budget 60,000 tokens / 300 seconds per report\n\nresearch/sources.py:\n  search_documents(query) -> chunks with id \"D\" + 6 hex, text, source,\n      kind=\"document\", rerank score. Uses Day 12's reranked_search.\n  search_web(query)       -> chunks with id \"W\" + 6 hex, kind=\"web\"\n  gather(query)           -> merged chunks + a list of FAILED sources\n  every source returns a result on failure instead of raising\n\nresearch/pipeline.py:\n  ask()          - logs every call to observability, temperature 0\n  plan()         - SMALL model (Day 15 routing), JSON, returns\n                   {answerable, reason, sub_questions}\n                   2-4 sub-questions, each INDEPENDENTLY searchable because\n                   they are gathered in parallel\n  gather_all()   - asyncio parallel fan-out over sub-questions (Day 14's one\n                   genuine multi-agent advantage, kept without the agents)\n  synthesise()   - BIG model, sections: Summary / Findings / Disagreements /\n                   Gaps, every claim must carry a source id in brackets\n  verify_citations(report, chunks)  \u003c- THE KEY FUNCTION\n                   fabricated = ids used but never given (should ALWAYS be\n                   empty; when it is not, the model invented a convincing\n                   fake id and nothing else would have caught it)\n                   also reports uncited claims and source usage ratio\n  research(question) -> structured dict: report, citations check, sources,\n                   failed_sources, seconds, trace id\n\nKey decisions made:\n  - a model-produced citation is a CLAIM; a code-verified one is EVIDENCE\n  - ids are attached at retrieval time, so the model can only cite what it\n    was given\n  - the report is produced even when a source is down, with the failure named\n  - \"not enough sources\" is a valid result and better than a confident report\n\nMeasured:\n  cost per report (record your own) - synthesis dominates, because it carries\n      every chunk; the lever is the text[:900] truncation\n  the SAME question run twice produces DIFFERENT reports - different\n      sub-questions, different sources, different emphasis. This is a real\n      property of the product, not a bug, and users should be told.\n\nKnown problems, left for later:\n  - no memory integration yet; the pipeline does not know the user\n  - no budget enforcement wired in, only written in DECISIONS.md\n  - source diversity is not checked; all claims can cite one file\n  - web chunks are search snippets only, not full pages\n  - reports are printed, not saved anywhere a user could return to (Day 20)\n```\n\n---\n\n## Answers\n\n**1.** Because a model asked to cite sources will produce ids that look exactly like real ones, including for sources it never saw. If your code creates the ids and checks which were used, the only ids it can cite are ones you handed it, and any invention is caught immediately.\n\n**2.** Memory (Day 2) and documents (Day 5). Each worked alone; together, retrieved chunks landed in the conversation history and were re-sent every turn, causing constant rate limits.\n\n**3.** Multiple sources rather than one search, explicit handling of disagreement between them, explicit statement of what could not be found, and a verifiable source attached to every claim. A bot answers; research shows its working.\n\n**4.** Because they are searched in parallel. If one depends on another's answer, the parallel version runs it without the information it needs and returns poor results.\n\n**5.** Not a bug. It is what a statistical system does, and it applies to a deliverable exactly as it applies to a test score. Tell users plainly: reports are generated fresh each time, the citations are verifiable, and re-running may produce different emphasis. That is more honest than implying determinism you do not have.\n"},{"file":"day-19.md","title":"Day 19 -- LangChain for Agent Engineers","module":"04 -- Frameworks","time":"about 1 hour","minutes":19,"md":"# Day 19 -- LangChain for Agent Engineers\n\n**Module:** 04 -- Frameworks\n**Time:** about 1 hour\n**Builds on:** Day 5, 6, 12 -- the things you built by hand; Day 16 -- LangGraph\n\n---\n\n## 1. Today in one line\n\nYou look at the toolbox you have been ignoring, work out which parts are worth taking, and -- more usefully -- build a rule for deciding that yourself.\n\n---\n\n## 2. The problem\n\nOn Day 5 you wrote a PDF reader and a text splitter. On Day 6 you wrote cosine similarity. On Day 12 you wrote hybrid search and reranking.\n\nLangChain has all of it. Document loaders for a hundred formats. A splitter better than yours. `EnsembleRetriever`, which is your RRF. `ContextualCompressionRetriever`, which is your cross-encoder.\n\n**Did you waste two weeks?**\n\nNo, and it is worth being clear why. If you had started with LangChain, you would now be someone who can call `EnsembleRetriever` and has no idea what it does, cannot tell when it is the wrong tool, and cannot debug it when the results are strange. You built the thing; the library is now a labour saving, not a black box.\n\nBut that leaves a real question, and it is today's actual subject:\n\n**Which parts should you adopt, and which should you leave?**\n\nLangChain is huge, it changes fast, and it has a reputation for wrapping simple things in complicated ones. \"Use it\" and \"avoid it\" are both bad advice. What you need is a rule you can apply yourself, and a habit of measuring before you swap.\n\nOne clarification, because it confuses people constantly: **LangChain and LangGraph are different things.** LangGraph (Day 16) is control flow -- nodes, edges, state. LangChain is components -- loaders, splitters, retrievers, output parsers. You can use either without the other.\n\n---\n\n## 3. Mental model\n\n**A hardware shop.**\n\nSome tools save you a day: a pipe threader you would never make yourself. Some are a plastic handle around a screwdriver you already own, sold at four times the price.\n\nThe shop does not distinguish. You have to.\n\n**Where this comparison breaks, and this is the part that matters:**\n\nA bad hand tool sits in a drawer. **A bad abstraction sits between you and your prompt.** Every wrapper is a layer, and layers are where debugging goes to die. When your retrieval returns nonsense, the question is always \"what did it actually send\" -- and each layer makes that harder to answer.\n\nSo the cost of a LangChain component is not just tokens. It is **visibility**.\n\n**The rule, and it is the deliverable of today:**\n\n> Adopt it if it connects to something external, or performs a well-defined transformation you would have written identically.\n>\n> Skip it if it contains a prompt, or controls flow you care about.\n\nLoaders connect to external formats -- adopt. Splitters transform text deterministically -- adopt if measured better. Retrievers are borderline: measure. Anything with a hidden prompt inside it -- write your own, because that prompt is your product.\n\n---\n\n## 4. How it really works\n\n**The components, and the verdict on each:**\n\n| Component | What it is | Verdict |\n|---|---|---|\n| **Document loaders** | Readers for 100+ formats | **Adopt.** Clear win. |\n| **Text splitters** | Chunking strategies | **Measure.** Often better than yours. |\n| **Embeddings** | Wrappers over models | Neutral. You already have this. |\n| **Vector stores** | Wrappers over Chroma etc. | Neutral. Adds a layer. |\n| **Retrievers** | Ensemble, compression, multi-query | **Measure.** These are your Day 12. |\n| **Output parsers** | Structured output with retry | **Adopt.** Solid, no hidden prompt. |\n| **LCEL / Runnables** | The pipe composition syntax | **Selectively.** |\n| **Agents (legacy)** | The old agent abstractions | **Skip.** Use LangGraph. |\n| **Memory (legacy)** | Old conversation memory | **Skip.** Day 11 is better. |\n| **Callbacks** | Hooks on every call | **Adopt.** This is your Day 15. |\n\n**LCEL, briefly**\n\nThe pipe syntax:\n\n```python\nchain = prompt | model | parser\nresult = chain.invoke({\"question\": \"...\"})\n```\n\nWhat it buys you: `.stream()`, `.batch()` and `.ainvoke()` for free on anything you compose. Batching thirty questions asynchronously is genuinely useful and you would otherwise write it yourself.\n\nWhat it costs: the pipeline becomes an object rather than code you can step through. Put a `print` in the middle of a pipe and you cannot.\n\n**The deprecation problem, said plainly**\n\nLangChain has moved fast and broken things repeatedly. Tutorials six months old often do not run. Agent abstractions were superseded by LangGraph. Memory classes were deprecated.\n\nThat is a real cost of adoption, not a complaint. **Pin your versions**, prefer the current official docs over blog posts, and when something does not exist any more, check the current API rather than assuming you made a mistake.\n\n---\n\n## 5. Setup\n\n```bash\ncd research-assistant/ai\nsource venv/bin/activate\n\npip install langchain langchain-community langchain-text-splitters pypdf\npip freeze > requirements.txt\n\ntouch lc_compare.py\n```\n\nYou already have `langchain` and `langchain-openai` from Day 16; they are listed again so this day stands alone. Install the pieces you are testing, not the whole ecosystem.\n\n**`langchain` itself is not optional today.** Stage 3 imports from `langchain.retrievers`, and Stage 6 uses `langchain.globals`. Neither lives in `langchain-community` or `langchain-core`, so without the top-level package you get `ModuleNotFoundError: No module named 'langchain'`.\n\n> **Expect the import paths to have moved.** LangChain has reorganised where retrievers and compressors live more than once across major versions -- things have shifted between `langchain`, `langchain-core` and `langchain-community`, and some have moved into their own packages. If an import in this day fails, that is the most likely reason: look the class up in the current LangChain docs rather than assuming you mistyped it. This is not a side note, it is Trap 2 and experiment 5 of today, arriving early.\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- Loaders: adopt without hesitation\n\nYour `read_any` handles `.txt` and `.pdf`. LangChain handles a hundred formats:\n\n```python\nfrom langchain_community.document_loaders import (\n    PyPDFLoader, TextLoader, Docx2txtLoader, UnstructuredMarkdownLoader,\n    CSVLoader, DirectoryLoader\n)\n\nloader = DirectoryLoader(\"documents\", glob=\"**/*.pdf\", loader_cls=PyPDFLoader)\ndocs = loader.load()\n\nprint(f\"{len(docs)} pages\")\nprint(docs[0].metadata)      # {'source': 'documents/plan.pdf', 'page': 0}\nprint(docs[0].page_content[:200])\n```\n\n**This is a clear adopt**, and the reason is in the second print. `PyPDFLoader` returns one `Document` per page with `source` and `page` already in the metadata.\n\nYou built that by hand on Day 5 -- remember inserting `[Page N]` markers into the text so citations could work? This gives you the same thing as structured data instead of a string you have to parse back out.\n\n**Why this fits the rule:** a loader is a connector to an external format. No prompt, no flow control, and you would have written it the same way. Take it.\n\nOne caution: metadata keys differ between loaders. `CSVLoader` gives you `row`, `PyPDFLoader` gives you `page`. Normalise to your own shape at the boundary rather than letting loader-specific keys spread through your code.\n\n---\n\n### Stage 2 -- Splitters: measure, do not assume\n\nYour `chunk_text` looks for paragraph breaks, then sentence breaks. `RecursiveCharacterTextSplitter` does the same idea with a priority list:\n\n```python\nfrom langchain_text_splitters import RecursiveCharacterTextSplitter\n\nsplitter = RecursiveCharacterTextSplitter(\n    chunk_size=1000,\n    chunk_overlap=150,\n    separators=[\"\\n\\n\", \"\\n\", \". \", \" \", \"\"],\n)\nchunks = splitter.split_documents(docs)\n```\n\nIt tries each separator in order, falling back to the next when a chunk is still too large. Yours tried two levels; this tries five.\n\n**Now the important part -- measure it**, using Day 12's golden set:\n\n```python\n# lc_compare.py\nfrom golden_set import GOLDEN\nfrom retrieval import evaluate\nfrom documents import chunk_text as my_splitter\n\n# index your documents twice, once with each splitter,\n# into two separate Chroma collections, then:\n\nevaluate(search_with_my_chunks,        \"my splitter\")\nevaluate(search_with_langchain_chunks, \"RecursiveCharacterTextSplitter\")\n```\n\nYou will get something like:\n\n```\nmy splitter                      recall@5: 12/15 (80%)  MRR: 0.556\nRecursiveCharacterTextSplitter   recall@5: 13/15 (87%)  MRR: 0.601\n```\n\n**A real improvement, measured.** Adopt it -- and notice that you could only make that call because you built the golden set on Day 12.\n\nAlso try `MarkdownHeaderTextSplitter`, which splits on headings and keeps the heading in the metadata. If your documents have structure, that is often a bigger win than any retrieval tuning, because chunks stop straddling section boundaries.\n\n---\n\n### Stage 3 -- Retrievers: your Day 12, as objects\n\n```python\nfrom langchain_community.retrievers import BM25Retriever\nfrom langchain.retrievers import EnsembleRetriever, ContextualCompressionRetriever\nfrom langchain.retrievers.document_compressors import CrossEncoderReranker\nfrom langchain_community.cross_encoders import HuggingFaceCrossEncoder\n\nbm25 = BM25Retriever.from_documents(chunks)\nbm25.k = 20\n\nvector = chroma_store.as_retriever(search_kwargs={\"k\": 20})\n\nensemble = EnsembleRetriever(retrievers=[bm25, vector], weights=[0.4, 0.6])\n\nreranker = CrossEncoderReranker(\n    model=HuggingFaceCrossEncoder(model_name=\"cross-encoder/ms-marco-MiniLM-L-6-v2\"),\n    top_n=5\n)\n\npipeline = ContextualCompressionRetriever(\n    base_compressor=reranker,\n    base_retriever=ensemble\n)\n\nresults = pipeline.invoke(\"what were the earnings last quarter\")\n```\n\n**Nine lines replacing about eighty of yours.** And you understand every one, because you wrote the eighty.\n\n`EnsembleRetriever` is your RRF. `CrossEncoderReranker` is your cross-encoder stage. Same models, same algorithms.\n\n**One real difference:** `weights=[0.4, 0.6]` lets you favour one retriever. Your RRF weighted both equally. Try it -- on documents heavy with codes and part numbers, pushing BM25 up often helps.\n\n**Measure it against yours** before switching. Same golden set, same numbers. You will probably find them equal, which makes it a maintenance decision rather than a quality one: nine lines you did not write versus eighty you fully control.\n\n**Where I would land:** adopt the retrievers, keep your own `verify_citations` and provenance handling around them. The retrievers are a well-defined transformation. The citation logic is your product.\n\n---\n\n### Stage 4 -- Output parsers: a quiet adopt\n\n```python\nfrom langchain_core.output_parsers import PydanticOutputParser\nfrom langchain_core.prompts import ChatPromptTemplate\nfrom pydantic import BaseModel, Field\n\n\nclass ResearchPlan(BaseModel):\n    answerable: bool = Field(description=\"Whether this can be researched\")\n    reason: str = Field(description=\"If not answerable, why\")\n    sub_questions: list[str] = Field(description=\"2-4 independently searchable questions\")\n\n\nparser = PydanticOutputParser(pydantic_object=ResearchPlan)\n\nprompt = ChatPromptTemplate.from_messages([\n    (\"system\", \"Break the question into sub-questions.\\n{format_instructions}\"),\n    (\"user\", \"{question}\")\n]).partial(format_instructions=parser.get_format_instructions())\n\nchain = prompt | llm | parser\n\nplan = chain.invoke({\"question\": \"What do my documents say about deadlines?\"})\nprint(plan.sub_questions)     # a real list, on a typed object\n```\n\n**This is better than your Day 18 version**, and the reason is types. You get a validated object, not a dict you hope has the right keys. A missing field is an error at parse time rather than a `KeyError` three functions later.\n\nWrap it in `OutputFixingParser` and a malformed response gets one automatic repair attempt -- your Day 15 `json_with_repair`, already built.\n\n**Why it fits the rule:** the format instructions are generated from your schema, and you can print them. No hidden prompt, and the transformation is well-defined.\n\n---\n\n### Stage 5 -- LCEL, and what it hides\n\nBuild the same thing three ways, then look at all three:\n\n```python\n# 1. Yours\nraw = client.chat.completions.create(model=..., messages=[...])\nresult = json.loads(raw.choices[0].message.content)\n\n# 2. LCEL\nchain = prompt | llm | parser\nresult = chain.invoke({\"question\": q})\n\n# 3. LCEL with batching\nresults = chain.batch([{\"question\": q} for q in twenty_questions])\n```\n\n**Version 3 is the argument for LCEL.** Twenty questions run concurrently, one line. You would write that yourself with asyncio, as you did on Day 14.\n\n**Now open the box:**\n\n```python\nfrom langchain.globals import set_debug\n\nset_debug(True)\nchain.invoke({\"question\": \"test\"})\n```\n\n**`set_debug(True)`, not `langchain.debug = True`.** The module attribute is the deprecated form you will find in older tutorials; `langchain.globals` is the supported one, and `set_debug(False)` switches it back off when the output gets too loud.\n\nRead the actual prompt. The format instructions are there -- fine, you generated those. **Look for anything else you did not write.**\n\nThen try to debug it. Put a print between `prompt` and `llm`. You cannot, not directly -- you need `RunnableLambda`:\n\n```python\nfrom langchain_core.runnables import RunnableLambda\n\ndef peek(x):\n    print(\"SENDING:\", x)\n    return x\n\nchain = prompt | RunnableLambda(peek) | llm | parser\n```\n\n**That extra step is the tax.** In your own code you write `print()`. Here you wrap a function in a class to inspect your own data.\n\n**So use LCEL where composition is the point** -- batching, streaming, parallel branches. Write plain code where the logic is the point.\n\n---\n\n### Stage 6 -- Write your own adoption table\n\nThe deliverable. Go through your project and decide, with evidence. `research/DECISIONS.md`:\n\n```markdown\n## LangChain adoption (Day 19)\n\nADOPTED\n- DirectoryLoader + PyPDFLoader: replaces documents.py readers.\n  Gives per-page Documents with source/page metadata for free.\n  Was: hand-inserted [Page N] markers parsed back out of a string.\n\n- RecursiveCharacterTextSplitter: replaces chunk_text.\n  Measured: 80% -> 87% recall@5 on the golden set. Real improvement.\n\n- EnsembleRetriever + CrossEncoderReranker: replaces hybrid_search\n  and reranked_search. Measured equal. Adopted for maintenance, not\n  quality. Weights [0.4, 0.6] favour vector slightly; retest on new docs.\n\n- PydanticOutputParser: replaces hand-rolled JSON parsing in pipeline.py.\n  Typed and validated, fails at the right place.\n\n- Callbacks: wired into observability.py logging.\n\nNOT ADOPTED\n- LangChain agents: superseded by LangGraph, which we already use.\n- LangChain memory classes: our Day 11 memory does relevance-based recall\n  with fact extraction and conflict resolution. Theirs does not.\n- Vector store wrapper: we use Chroma directly. The wrapper adds a layer\n  and no capability.\n- LCEL for the research pipeline: the flow is the product and we want to\n  read it as ordinary code. Using LCEL only for batch evaluation runs.\n\nKEPT AS OURS, DELIBERATELY\n- verify_citations: this is the product. No library version exists.\n- Day 9 budgets (steps, tokens, wall clock) and Day 13 permission tiers.\n  No framework provides these.\n- The prompts. Every one.\n\nVERSIONS PINNED: see requirements.txt. LangChain moves fast.\n```\n\n**That last section matters most.** Notice what you kept: the citation verification, the budgets, the permission model, the prompts. Those are the things nobody can give you, because they are specific to what you are building.\n\n**Frameworks give you plumbing. They cannot give you the product.**\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **LangChain vs LangGraph** | Components versus control flow. Different things. |\n| **Document loader** | A reader for a file format. |\n| **Document** | LangChain's object: `page_content` plus `metadata`. |\n| **Text splitter** | A chunking strategy. |\n| **Retriever** | Anything with `.invoke(query)` returning documents. |\n| **EnsembleRetriever** | Your hybrid RRF search. |\n| **ContextualCompressionRetriever** | Filter or rerank after retrieval. |\n| **LCEL** | The pipe composition syntax. |\n| **Runnable** | Anything composable with `|`. |\n| **Output parser** | Turns model text into a validated object. |\n| **Callbacks** | Hooks on every call. Your observability. |\n| **Deprecation churn** | The cost of adopting a fast-moving library. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Splitter shoot-out.**\nYour `chunk_text` versus `RecursiveCharacterTextSplitter`, on the golden set.\n*You will see:* a measurable difference.\n*It teaches:* adoption decisions can be evidence-based. Most people's are not.\n\n**2. Print inside a chain.**\nTry to inspect what goes into `llm` in a `prompt | llm | parser` chain.\n*You will see:* you need `RunnableLambda`.\n*It teaches:* the visibility cost of abstraction, felt directly.\n\n**3. Batch versus loop.**\nTwenty questions through `chain.batch()` and through your own for-loop.\n*You will see:* a large time difference.\n*It teaches:* the real argument for LCEL.\n\n**4. Weight the ensemble.**\n`[0.9, 0.1]` then `[0.1, 0.9]`. Measure both.\n*You will see:* different failures -- exact codes versus paraphrases.\n*It teaches:* Day 12's sparse-dense trade, now as a dial.\n\n**5. Follow a stale tutorial.**\nFind a LangChain agent tutorial from a year ago and run it.\n*You will see:* imports that no longer exist.\n*It teaches:* deprecation churn is a real adoption cost, not a grumble.\n\n**6. Count the wrapper tokens.**\n`set_debug(True)` on an output-parser chain. Count the format instructions.\n*You will see:* a few hundred tokens per call.\n*It teaches:* convenience has a token price. Sometimes worth it.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- adopting wholesale**\n*Symptom:* your whole system is framework objects and you cannot find your own logic.\n*Fix:* the rule in section 3. Component by component, with measurements.\n\n**Trap 2 -- deprecated imports and moved ones**\n*Symptom:* tutorials that do not run. `ModuleNotFoundError`, `ImportError`, or a `DeprecationWarning` on something that still works for now -- `langchain.debug = True` is exactly this, replaced by `langchain.globals.set_debug()`. Retriever and compressor classes have also moved between `langchain`, `langchain-core` and `langchain-community` across major versions.\n*Fix:* pin versions, use current docs, check the API before assuming you made a mistake.\n\n**Trap 3 -- hidden prompts**\n*Symptom:* strange output from a component you did not write a prompt for.\n*Fix:* `set_debug(True)` before adopting anything. If it contains a prompt you did not write, think hard.\n\n**Trap 4 -- debugging through layers**\n*Symptom:* an hour spent finding where a value became wrong.\n*Fix:* keep the parts you debug most as plain code.\n\n**Trap 5 -- confusing LangChain with LangGraph**\n*Symptom:* looking for agent loops in the wrong library.\n*Fix:* components versus control flow. Different tools.\n\n**Trap 6 -- metadata that leaks**\n*Symptom:* code full of `doc.metadata.get(\"page\") or doc.metadata.get(\"row\")`.\n*Cause:* different loaders use different keys.\n*Fix:* normalise to your own shape at the boundary, once.\n\n---\n\n## 10. Check yourself\n\n1. State the adopt-or-skip rule in one sentence, and give an example of each.\n2. What is the difference between LangChain and LangGraph?\n3. What does LCEL buy, and what does it cost?\n4. You are considering a splitter swap. What do you do before deciding?\n5. Name three things you deliberately kept as your own, and why no framework provides them.\n\n---\n\n## 11. Where this goes\n\n- **Day 20** deploys it. Fewer hand-written components means less to maintain in production -- and the loaders make ingesting user-uploaded files far simpler.\n- **Day 21** is the platform. Today's adoption table is part of the story you tell about why it is built the way it is.\n- **Beyond:** the rule from section 3 outlives LangChain. Every framework you meet gets the same two questions -- does it contain a prompt, and does it control flow you care about.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 19:\n\nFolders:\n  research-assistant/\n    ai/\n      lc_compare.py        (NEW - splitter and retriever comparisons)\n      research/\n        DECISIONS.md       (NOW includes the LangChain adoption table)\n        sources.py         (retrievers swapped to LangChain equivalents)\n        pipeline.py        (plan() now uses PydanticOutputParser)\n      documents.py         (loaders replaced with LangChain loaders)\n      retrieval.py         (own implementations KEPT alongside, for reference\n                            and because evaluate() still uses them)\n      observability.py     (now also receives LangChain callbacks)\n      evals.py, reliability.py, golden_set.py, logs/\n      vector_store.py, embeddings.py, tools.py, memory.py, security.py\n      graph_agent.py, crew_agent.py, multi_agent.py\n      chat.py, agent.py, autonomous.py, planner.py\n      mcp_agent.py, mcp_client.py, mcp_servers/my_tools.py\n      prompts.py, classify.py, test_prompt.py\n      runs/, notes/, documents/, chroma_db/\n    dashboard/             (STILL EMPTY - Node arrives tomorrow)\n\nLibraries: langchain-community, langchain-text-splitters (NEW).\nlangchain and langchain-openai already present from Day 16; langchain itself\nis REQUIRED here, for langchain.retrievers and langchain.globals.\nVersions PINNED - LangChain moves fast and breaks tutorials, and the\nretriever/compressor import paths have been reorganised more than once, so\ncheck the current docs when an import fails.\n\nTHE RULE (the real deliverable of Day 19):\n  ADOPT if it connects to something external, or performs a well-defined\n       transformation you would have written identically.\n  SKIP  if it contains a prompt, or controls flow you care about.\n\nADOPTED, with reasons:\n  DirectoryLoader + PyPDFLoader\n      per-page Documents with source/page metadata as structured data,\n      replacing hand-inserted [Page N] markers parsed back out of a string\n  RecursiveCharacterTextSplitter\n      MEASURED on the Day 12 golden set: 80% -> 87% recall@5. Real gain.\n      (MarkdownHeaderTextSplitter worth trying on structured documents)\n  EnsembleRetriever + CrossEncoderReranker + ContextualCompressionRetriever\n      9 lines replacing ~80 of ours. Measured EQUAL, so adopted for\n      maintenance rather than quality. weights=[0.4, 0.6] is a dial our\n      RRF did not have; raise BM25 for code-heavy documents.\n  PydanticOutputParser (+ OutputFixingParser)\n      typed validated objects instead of dicts we hope have the right keys;\n      failures surface at parse time, not three functions later\n  Callbacks -> wired into observability.py\n\nNOT ADOPTED:\n  LangChain agents      - superseded by LangGraph, already in use\n  LangChain memory      - our Day 11 memory does relevance recall, fact\n                          extraction and conflict resolution; theirs does not\n  vector store wrapper  - Chroma used directly; the wrapper adds a layer\n                          and no capability\n  LCEL for the pipeline - the flow IS the product and we want to read it as\n                          ordinary code. LCEL used only for batch eval runs,\n                          where .batch() over 20 questions is a genuine win.\n\nKEPT AS OURS, DELIBERATELY:\n  verify_citations      - this is the product; no library version exists\n  Day 9 budgets (steps / tokens / wall clock)\n  Day 13 permission tiers and least privilege\n  every prompt\n\nLangChain vs LangGraph: components vs control flow. Different libraries,\nconstantly confused.\n\nVisibility cost measured:\n  a print between prompt and llm in an LCEL chain requires RunnableLambda;\n  in plain code it is print(). Every layer makes \"what did it actually\n  send\" harder to answer, which is the question that matters most in\n  debugging.\n\nKnown problems, left for later:\n  - two implementations of retrieval now exist (ours and LangChain's);\n    evaluate() still points at ours, which could drift from production\n  - loader metadata keys differ per loader (page vs row); normalised at the\n    boundary but easy to leak\n  - framework format instructions add a few hundred tokens per call\n```\n\n---\n\n## Answers\n\n**1.** Adopt it if it connects to something external or performs a well-defined transformation you would have written identically; skip it if it contains a prompt or controls flow you care about. Adopt: `PyPDFLoader`. Skip: LangChain's agent abstractions.\n\n**2.** LangChain is components -- loaders, splitters, retrievers, parsers. LangGraph is control flow -- nodes, edges, state, checkpointing. Either can be used without the other.\n\n**3.** It buys `.stream()`, `.batch()` and `.ainvoke()` for free on anything you compose, which makes concurrent batch runs one line. It costs visibility: inspecting a value mid-chain needs a `RunnableLambda` where plain code needs a `print`.\n\n**4.** Index your documents both ways and run the golden set against each. Adopt only if the numbers improve, or if they are equal and the maintenance saving is worth it.\n\n**5.** Citation verification, the budget system, and the permission model -- plus the prompts. No framework provides them because they are specific to what you are building and what you consider unacceptable. Frameworks give plumbing; the product is yours.\n"},{"file":"day-20.md","title":"Day 20 -- AI Agent Deployment","module":"05 -- Deployment and Capstone","time":"about 1 hour, probably more","minutes":23,"md":"# Day 20 -- AI Agent Deployment\n\n**Module:** 05 -- Deployment and Capstone\n**Time:** about 1 hour, probably more\n**Builds on:** Day 18 -- the research pipeline; Day 15 -- observability and limits\n\n---\n\n## 1. Today in one line\n\nYour agent becomes a service other people can use -- and Node finally arrives, nineteen days after you made that empty folder.\n\n---\n\n## 2. The problem\n\nEverything you have built runs in your terminal, on your laptop, when you type `python`.\n\nNobody else can use it. Close the lid and it stops. Your API key is in a file on your disk. There is no way to see a past report. If you wanted to show someone, you would have to install Python on their machine.\n\nAnd an agent service has a problem normal web services do not.\n\n**Your research pipeline takes two to four minutes.** A normal HTTP request finishes in milliseconds. If you hold the connection open for four minutes, something in the middle -- a proxy, a load balancer, a browser -- closes it first. The user sees an error and the work is lost.\n\nThis is the central design problem of deploying agents, and it has a standard answer: **do not make the user wait on the request.** Start the work, hand back a ticket, let them ask about it.\n\nYou will also meet a specific trap today that catches nearly everyone deploying Python AI code: your agent functions are **synchronous**, and putting synchronous code in an async web server freezes the whole server for every other user. It is in the traps section and it is worth reading before you write anything.\n\n---\n\n## 3. Mental model\n\n**A workshop versus a shop.**\n\nThe workshop has your tools everywhere and one person who knows how it all works. The shop has a counter, opening hours, prices, and a way to hand someone their order.\n\nSame work. Completely different arrangement, because someone else is now involved.\n\n**Where this comparison breaks, in three ways that shape today:**\n\n**Orders take minutes, not seconds.** So you need a ticket system -- a receipt with a number, and a way to check on it.\n\n**Every order costs you money.** A chat message is a fraction of a rupee. A research report is not. Without per-user limits, one person can spend your entire quota in an afternoon, by accident.\n\n**You cannot watch the counter.** Day 15's logging stops being good practice and becomes the only way you will ever know what happened.\n\n---\n\n## 4. How it really works\n\n**The shape**\n\n```\nBrowser  ->  Node (dashboard)  ->  Python (FastAPI)  ->  your agent\n```\n\nNode serves the pages and talks to the user. Python does the AI. They speak HTTP. Exactly what was described on the day you made those two folders.\n\n**Two kinds of endpoint**\n\n**Fast** -- a chat message, a few seconds. Answer on the request.\n\n**Slow** -- a research report, minutes. Job pattern:\n\n```\nPOST /research   -> {\"job_id\": \"abc123\", \"status\": \"queued\"}\nGET  /jobs/abc123 -> {\"status\": \"running\", \"step\": \"gathering sources\"}\nGET  /jobs/abc123 -> {\"status\": \"done\", \"report\": {...}}\n```\n\nThe user gets a ticket immediately. The dashboard polls, or listens to a stream.\n\n**Streaming**\n\nPolling works and feels dead. **Server-Sent Events** keeps one connection open and pushes progress as it happens -- \"planning\", \"3 sub-questions\", \"gathering\", \"writing\". A four-minute wait with visible progress is tolerable; four minutes of a spinner is not.\n\n**Auth and budget**\n\nAn API key per user in a header. From that key you get a user id, and from the user id you get their daily budget. Day 15's cost tracking becomes an enforced limit rather than a report.\n\n**Config**\n\nEverything that differs between your laptop and a server comes from environment variables. No secrets in code, none in the container image.\n\n---\n\n## 5. Setup\n\n```bash\ncd research-assistant/ai\nsource venv/bin/activate\n\npip install \"fastapi[standard]\" uvicorn\npip freeze > requirements.txt\n\ntouch api.py\n\ncd ../dashboard\nnpm init -y\nnpm install express node-fetch\nmkdir public\ntouch server.js public/index.html\n```\n\nThat is nineteen days of an empty folder, finally used.\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- The service\n\n`ai/api.py`:\n\n```python\nimport os, json, uuid, time, threading\nfrom typing import Optional\nfrom fastapi import FastAPI, Header, HTTPException, BackgroundTasks\nfrom fastapi.middleware.cors import CORSMiddleware\nfrom pydantic import BaseModel\n\nfrom research.pipeline import research\nfrom observability import new_trace, LOG_FILE\n\napp = FastAPI(title=\"Research Agent\")\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=os.environ.get(\"ALLOWED_ORIGINS\", \"http://localhost:3000\").split(\",\"),\n    allow_methods=[\"*\"],\n    allow_headers=[\"*\"],\n)\n\nJOBS = {}\nJOBS_LOCK = threading.Lock()\n\nAPI_KEYS = {\n    os.environ.get(\"DEMO_KEY\", \"demo-key-change-me\"): {\n        \"user\": \"demo\", \"daily_usd\": 1.00\n    }\n}\nSPEND = {}\n\n\ndef authenticate(x_api_key: Optional[str] = Header(None)):\n    if x_api_key not in API_KEYS:\n        raise HTTPException(401, \"Invalid or missing API key\")\n\n    account = API_KEYS[x_api_key]\n    today = time.strftime(\"%Y-%m-%d\")\n    spent = SPEND.get((account[\"user\"], today), 0)\n\n    if spent >= account[\"daily_usd\"]:\n        raise HTTPException(429, f\"Daily budget of ${account['daily_usd']} used up\")\n\n    return account\n\n\nclass ResearchRequest(BaseModel):\n    question: str\n\n\n@app.get(\"/health\")\ndef health():\n    with JOBS_LOCK:\n        active = sum(1 for j in JOBS.values() if j[\"status\"] == \"running\")\n    return {\"ok\": True, \"active_jobs\": active}\n\n\n@app.post(\"/research\")\ndef start_research(body: ResearchRequest,\n                   background: BackgroundTasks,\n                   x_api_key: Optional[str] = Header(None)):\n    account = authenticate(x_api_key)\n\n    if len(body.question) > 500:\n        raise HTTPException(400, \"Question too long\")\n\n    job_id = uuid.uuid4().hex[:10]\n    with JOBS_LOCK:\n        JOBS[job_id] = {\"status\": \"queued\", \"step\": \"waiting\",\n                        \"user\": account[\"user\"], \"created\": time.time()}\n\n    background.add_task(do_research, job_id, body.question, account[\"user\"])\n    return {\"job_id\": job_id, \"status\": \"queued\"}\n\n\ndef estimate_cost(result):\n    \"\"\"What this job cost, in USD: sum the logged cost of its model calls.\"\"\"\n    trace = result.get(\"trace\")\n    if not trace:\n        return 0.0\n\n    total = 0.0\n    try:\n        with open(LOG_FILE) as f:\n            for line in f:\n                row = json.loads(line)\n                if row.get(\"trace\") == trace:\n                    total += row.get(\"usd\", 0.0)\n    except (FileNotFoundError, ValueError):\n        return 0.0\n    return round(total, 6)\n\n\ndef do_research(job_id, question, user):\n    def update(**fields):\n        with JOBS_LOCK:\n            JOBS[job_id].update(fields)\n\n    update(status=\"running\", step=\"planning\")\n    try:\n        result = research(question)\n        update(status=\"done\", step=\"finished\", result=result)\n\n        today = time.strftime(\"%Y-%m-%d\")\n        SPEND[(user, today)] = SPEND.get((user, today), 0) + estimate_cost(result)\n    except Exception as error:\n        update(status=\"failed\", error=str(error)[:300])\n\n\n@app.get(\"/jobs/{job_id}\")\ndef job_status(job_id: str, x_api_key: Optional[str] = Header(None)):\n    account = authenticate(x_api_key)\n\n    with JOBS_LOCK:\n        job = JOBS.get(job_id)\n\n    if not job:\n        raise HTTPException(404, \"No such job\")\n    if job[\"user\"] != account[\"user\"]:\n        raise HTTPException(403, \"Not your job\")\n\n    return {k: v for k, v in job.items() if k != \"user\"}\n```\n\nRun it:\n\n```bash\nuvicorn api:app --reload --port 8000\n```\n\nOpen `http://localhost:8000/docs`. FastAPI generates a full interactive page from your type hints. Try an endpoint from there.\n\n**Five things worth noticing.**\n\n**`def`, not `async def`.** This is the trap from section 2. Your `research()` function is synchronous and takes minutes. In an `async def` endpoint it would block the entire event loop and freeze the server for every other user. Declared as plain `def`, FastAPI runs it in a thread pool automatically. **Get this wrong and your server appears to work perfectly with one user and collapses with two.**\n\n**`JOBS_LOCK`.** Background tasks run in threads, so a plain dict update can race. A lock here costs nothing and prevents a bug that appears only under load.\n\n**The ownership check** on `/jobs/{job_id}`. Without it, anyone with any valid key can read anyone's report by guessing an id. Job ids are not secrets.\n\n**Budget checked before starting, spend recorded after.** Not perfect -- a single very expensive job can overshoot -- but it stops the runaway case.\n\n**`estimate_cost` is Day 15's log, read back.** You are not inventing a new number. Every model call already writes a line to `logs/calls.jsonl` with its `trace` and its `usd`, computed from `PRICING` by `cost_of()`. A job's cost is just the sum of the rows carrying that job's trace id, and `research()` already returns its `trace`. That is the whole function.\n\nThree honest limits, worth saying out loud:\n\n- It only counts what `tracked_call` logged. Embeddings run locally and cost nothing, but a paid embedding API or a reranker you forgot to wrap would be invisible here. **A cost meter is only as complete as your instrumentation.**\n- Pricing in `PRICING` is a copy of someone's rate card at a point in time. It drifts. This is an *estimate*, which is why the function is not called `exact_cost`.\n- Re-reading the whole JSONL for every job is fine at demo scale and bad later. When the file gets big, either keep a running per-trace total in memory as calls are logged, or put the rows in the SQLite store from Stage 5.\n\nIt is also worth checking: run one job, note the number, and compare it against `report()` from Day 15 for the same trace. If they disagree, something is calling the model outside `tracked_call`.\n\n---\n\n### Stage 2 -- Stream the progress\n\nPolling every two seconds works. This feels alive:\n\n```python\nimport json, asyncio\nfrom fastapi.responses import StreamingResponse\n\n\n@app.get(\"/jobs/{job_id}/stream\")\nasync def stream_job(job_id: str, x_api_key: Optional[str] = Header(None)):\n    account = authenticate(x_api_key)\n\n    async def events():\n        last = None\n        for _ in range(300):                     # 5 minute ceiling\n            with JOBS_LOCK:\n                job = dict(JOBS.get(job_id, {}))\n\n            if not job:\n                yield f\"data: {json.dumps({'status': 'missing'})}\\n\\n\"\n                return\n            if job.get(\"user\") != account[\"user\"]:\n                yield f\"data: {json.dumps({'status': 'forbidden'})}\\n\\n\"\n                return\n\n            snapshot = {\"status\": job[\"status\"], \"step\": job.get(\"step\")}\n            if snapshot != last:\n                payload = dict(snapshot)\n                if job[\"status\"] == \"done\":\n                    payload[\"result\"] = job[\"result\"]\n                if job[\"status\"] == \"failed\":\n                    payload[\"error\"] = job.get(\"error\")\n                yield f\"data: {json.dumps(payload)}\\n\\n\"\n                last = snapshot\n\n            if job[\"status\"] in (\"done\", \"failed\"):\n                return\n\n            await asyncio.sleep(1)\n\
