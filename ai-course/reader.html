84  0.3341 -0.0072  0.0918  0.1457 -0.2201  0.0339]\n```\n\n**That is it.** That is what an embedding is. A list of 384 numbers. There is nothing hidden -- no text stored inside, no dictionary, no magic. Just a position.\n\nLook at those numbers for a moment. They mean nothing individually. No single number is \"the money number\". The meaning is spread across all 384, which is why you can never inspect them and understand why something matched. This is a real limitation, and it is worth knowing early.\n\n`all-MiniLM-L6-v2` is the standard starting model: small, fast, good enough, works on a plain laptop CPU. There are better ones and you can swap later -- but if you swap, you must re-embed everything, because the map changes.\n\n---\n\n### Stage 2 -- Measure closeness yourself\n\nBefore using a library that hides it, compute similarity by hand once.\n\n```python\nimport numpy as np\n\ndef similarity(a, b):\n    return float(np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b)))\n\n\npairs = [\n    (\"our revenue grew 12%\",        \"our earnings rose 12%\"),\n    (\"our revenue grew 12%\",        \"the cat sat on the mat\"),\n    (\"the deadline is 30 November\", \"when is this due?\"),\n    (\"I love this product\",         \"I hate this product\"),\n    (\"car\",                         \"vehicle\"),\n]\n\nfor first, second in pairs:\n    score = similarity(model.encode(first), model.encode(second))\n    print(f\"{score:.3f}   {first}  \u003c->  {second}\")\n```\n\nRun it. You should see roughly:\n\n```\n0.81   our revenue grew 12%  \u003c->  our earnings rose 12%\n0.03   our revenue grew 12%  \u003c->  the cat sat on the mat\n0.62   the deadline is 30 November  \u003c->  when is this due?\n0.71   I love this product  \u003c->  I hate this product\n0.64   car  \u003c->  vehicle\n```\n\n**Stop and read line by line.**\n\nLine 1: **0.81 between revenue and earnings.** Yesterday this scored zero. That is the whole day, in one number.\n\nLine 3: 0.62 between a statement and a question that shares no meaningful words. The map understands what the question is *asking for*.\n\nLine 4: **0.71 between love and hate.** This is the warning from section 3, and here it is in your own terminal. Opposites are close, because they are about the same thing in the same shape. Retrieval finds relevant text -- it does not find *correct* text. The model still has to read it and work out what it says.\n\n**The maths, briefly.** `np.dot(a, b)` multiplies the lists together and sums the result -- big when they point the same way. Dividing by both lengths (`np.linalg.norm`) removes the effect of size, leaving only direction. Three lines, and it is the engine under every vector database on earth.\n\n---\n\n### Stage 3 -- Search your own documents by meaning\n\nNow replace yesterday's keyword search. Add to `embeddings.py`:\n\n```python\nimport numpy as np\nfrom documents import load_all_documents, chunk_text\n\n_model = None\n_chunks = []\n_vectors = None\n\n\ndef get_model():\n    global _model\n    if _model is None:\n        _model = SentenceTransformer(\"all-MiniLM-L6-v2\")\n    return _model\n\n\ndef build_index(folder=\"documents\"):\n    \"\"\"Read, chunk and embed everything once.\"\"\"\n    global _chunks, _vectors\n\n    _chunks = []\n    for name, text in load_all_documents(folder).items():\n        for chunk in chunk_text(text):\n            _chunks.append(f\"[From: {name}]\\n{chunk}\")\n\n    print(f\"Embedding {len(_chunks)} chunks...\")\n    _vectors = get_model().encode(_chunks, show_progress_bar=True)\n    print(\"Done.\")\n\n\ndef semantic_search(question, top_n=3):\n    if _vectors is None:\n        build_index()\n\n    question_vector = get_model().encode(question)\n\n    scores = np.dot(_vectors, question_vector) / (\n        np.linalg.norm(_vectors, axis=1) * np.linalg.norm(question_vector)\n    )\n\n    best = np.argsort(scores)[::-1][:top_n]\n    return [(float(scores[i]), _chunks[i]) for i in best]\n\n\nif __name__ == \"__main__\":\n    build_index()\n    while True:\n        q = input(\"\\nSearch: \")\n        if q.lower() in [\"quit\", \"exit\"]:\n            break\n        for score, chunk in semantic_search(q):\n            print(f\"\\n[{score:.3f}] {chunk[:250]}...\")\n```\n\n**The parts worth understanding:**\n\n- `encode(_chunks)` with a **list** embeds them all in one batch. Far faster than one at a time.\n- `np.dot(_vectors, question_vector)` -- one line comparing your question against *every* chunk at once. `_vectors` is a grid of 384-number rows; numpy multiplies the whole grid in a single operation. This is why vector search stays fast with thousands of chunks.\n- `np.argsort(scores)[::-1][:top_n]` -- sort positions by score, reverse for highest first, take the top few.\n- Returning the **score alongside the chunk**. Do not hide it. You want to see when your best match scored 0.21 and is probably rubbish.\n\nRun it, and **go through your five synonym failures from yesterday, one by one.**\n\n```\nSearch: what were the earnings?\n[0.734] [From: report.pdf] [Page 2] Revenue for the quarter grew...\n```\n\nThere it is. Same document, same chunking, same everything -- one function replaced, and the wall is gone.\n\n---\n\n### Stage 4 -- Stop re-embedding every time\n\nRestart your script. It embeds everything again. With 500 chunks that is a minute of waiting, every single run.\n\nSave it instead. Chroma does this with almost no code. Make `vector_store.py`:\n\n```python\nimport chromadb\nfrom chromadb.utils import embedding_functions\nfrom documents import load_all_documents, chunk_text\n\nclient = chromadb.PersistentClient(path=\"./chroma_db\")\n\nembedder = embedding_functions.SentenceTransformerEmbeddingFunction(\n    model_name=\"all-MiniLM-L6-v2\"\n)\n\ncollection = client.get_or_create_collection(\n    name=\"documents\",\n    embedding_function=embedder,\n    metadata={\"hnsw:space\": \"cosine\"}      # NOT the default. Read on.\n)\n\n\ndef index_documents(folder=\"documents\"):\n    ids, texts, metadatas = [], [], []\n\n    for name, text in load_all_documents(folder).items():\n        for number, chunk in enumerate(chunk_text(text)):\n            ids.append(f\"{name}::{number}\")\n            texts.append(chunk)\n            metadatas.append({\"source\": name, \"chunk\": number})\n\n    collection.upsert(ids=ids, documents=texts, metadatas=metadatas)\n    print(f\"Indexed {len(ids)} chunks. Total stored: {collection.count()}\")\n\n\ndef search(question, top_n=3):\n    results = collection.query(query_texts=[question], n_results=top_n)\n\n    found = []\n    for text, meta, distance in zip(results[\"documents\"][0],\n                                    results[\"metadatas\"][0],\n                                    results[\"distances\"][0]):\n        found.append({\n            \"text\": text,\n            \"source\": meta[\"source\"],\n            \"score\": 1 - distance\n        })\n    return found\n\n\nif __name__ == \"__main__\":\n    index_documents()\n    for hit in search(\"what were the earnings?\"):\n        print(f\"\\n[{hit['score']:.3f}] {hit['source']}\\n{hit['text'][:200]}...\")\n```\n\n**What Chroma is doing for you:**\n\n- `PersistentClient(path=\"./chroma_db\")` -- writes to disk. Restart and your embeddings are still there.\n- `embedding_function` -- Chroma calls the same model for you, so you pass text in and text out. **This is also a safety feature**: the collection remembers which model it was built with, so you cannot accidentally mix two maps.\n- `upsert` rather than `add` -- running it twice updates instead of creating duplicates. `add` would give you every chunk twice, and your search results would come back in pairs.\n- `ids=f\"{name}::{number}\"` -- stable ids. Re-index after editing a file and the chunks are replaced, not duplicated.\n- `metadatas` -- extra information travelling with each chunk. You are only storing the filename now; on Day 12 this is how you filter by date, author or document type.\n- `metadata={\"hnsw:space\": \"cosine\"}` -- **the most important line in this file, and the easiest to leave out.** See below.\n- `1 - distance` -- Chroma returns a *distance* (smaller is closer), never a similarity. With cosine space, `distance = 1 - cosine_similarity`, so `1 - distance` gives you back exactly the number your hand-written `similarity()` produced in Stage 3. Getting the direction backwards is a very common and very confusing bug.\n\n---\n\n**Now the line that deserves its own section: you have to choose the distance metric, and the default is probably not what you want.**\n\n`hnsw:space` tells Chroma how to measure \"far apart\". It takes `\"cosine\"`, `\"l2\"` (squared Euclidean) or `\"ip\"` (inner product), and **if you do not pass it, you get `l2`** -- not cosine, even though cosine is what the whole first half of today was about.\n\nThat matters because `1 - distance` only means something under cosine:\n\n| space | what `distance` is | range | is `1 - distance` a similarity? |\n|---|---|---|---|\n| `cosine` | `1 - cosine_similarity` | 0 to 2 | **Yes.** 1.0 identical, 0.0 unrelated, negative for opposites |\n| `l2` (default) | squared straight-line distance | 0 to anything | **No.** It can be any size, so `1 - distance` goes arbitrarily negative |\n| `ip` | `1 - dot product` | unbounded | No |\n\nSo with the default collection, `score = 1 - distance` is not a similarity at all. It is some unbounded number that happens to be ordered roughly the right way, which is exactly why this mistake survives so long: **the ranking still looks plausible, so nothing appears broken.** The damage shows up at the next stage, where a threshold compares that number against `0.25` and rejects nearly everything, and you spend an evening wondering why your retrieval \"stopped working\".\n\nThis is the shape of mistake worth remembering from today, more than any API detail:\n\n> A silent default plus a number that still sorts correctly equals a bug you will not find by reading your own code.\n\n**Prove it to yourself.** Make a second collection with no `metadata=`, index the same documents, print the raw `distances` from both, and compare. The cosine ones sit between 0 and about 1; the L2 ones will not, and `1 - distance` on them will be negative for perfectly good matches.\n\nOne more thing: `hnsw:space` is fixed when the collection is created. Changing it later means deleting the collection and re-indexing. If you already ran this file before adding the line, delete `chroma_db/` and index again -- `get_or_create_collection` will happily hand you the old L2 collection and ignore the metadata you passed.\n\nAdd `chroma_db/` to your `.gitignore`.\n\n---\n\n### Stage 5 -- Plug it into the assistant\n\nOne function changes in `tools.py`. That is all.\n\n```python\nfrom vector_store import search as vector_search\n\n\ndef search_documents(query):\n    \"\"\"Search the user's documents by meaning.\"\"\"\n    hits = vector_search(query, top_n=3)\n\n    if not hits or hits[0][\"score\"] \u003c 0.25:\n        return \"Nothing in the user's documents is relevant to that.\"\n\n    parts = []\n    for hit in hits:\n        parts.append(f\"[Source: {hit['source']}, relevance {hit['score']:.2f}]\\n{hit['text']}\")\n    return \"\\n\\n---\\n\\n\".join(parts)\n```\n\nNow update the tool description, because yesterday's had an apology built into it:\n\n```python\n\"description\": \"Search the user's own documents, notes and PDFs by meaning. You can use natural language and do not need to guess the exact words used in the document. Use this whenever the question might involve the user's personal files or anything you would not know from general knowledge.\"\n```\n\n**Delete that old line** begging the model to use the document's own vocabulary. It is not needed any more. That deletion is the clearest possible sign of what you built today.\n\n**About that `0.25` threshold.** It is a guess, and you should treat it as one.\n\nIt is at least a guess in the right units. Because the collection uses cosine space, `score` is a cosine similarity: 1.0 is identical, around 0 is unrelated, negative means pointing the other way. With `all-MiniLM-L6-v2` a genuinely relevant chunk usually lands somewhere around 0.4 to 0.7, and noise sits near 0.1, so a line at 0.25 is a defensible starting point. **On a default L2 collection the same comparison would be meaningless**, and almost everything would be rejected -- that is the whole reason the `hnsw:space` line exists.\n\nBut it is still your data that decides. Similarity scores are relative, not absolute -- there is no universal number above which a match is \"good\". The right threshold depends on your documents, your chunk size and your embedding model. Find yours by printing scores for questions you know the answers to, and questions you know are unanswerable, then picking a line between them. Doing this properly is part of Day 12.\n\nRun `chat.py` and ask about your documents using completely different wording from the files. It finds them.\n\n---\n\n### Stage 6 -- Find where it still fails\n\nYou have built something genuinely useful. Now go and find its edges, before they find you.\n\nTry these four:\n\n**1. An exact code.** If your documents contain an invoice number, order id or version number, search for it exactly.\n*Often worse than yesterday.* Meaning-search sees `INV-2024-8871` and `INV-2024-8872` as nearly identical. Keyword search nails it.\n\n**2. Negation.** \"Which projects are *not* delayed?\"\n*Usually fails.* It retrieves chunks about delayed projects, because that is what the question is about. The word \"not\" barely moves the position.\n\n**3. Counting.** \"How many times is the budget mentioned?\"\n*Fails.* It only ever sees three chunks. It cannot count what it was not shown.\n\n**4. Something that needs two documents at once.** \"How does the plan compare to the report?\"\n*Usually poor.* Top 3 chunks might all come from one file.\n\n**None of these are bugs in your code.** They are the honest limits of simple RAG, and every one of them has a name and a fix:\n\n- Exact codes -> **hybrid search**, running keyword and vector together (Day 12)\n- Counting and comparing -> the **agent** deciding to search several times (Day 7, three days' work away)\n- Better ranking -> **re-ranking** (Day 12)\n\nWrite these four failures down, the same way you wrote down the synonym failures yesterday. You will re-test them on Day 12.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **Embedding** | A list of numbers giving the position of a piece of text on a map of meaning. |\n| **Vector** | The same thing. A list of numbers. |\n| **Dimensions** | How many numbers. 384 for our model. |\n| **Embedding model** | A small model that converts text to a position. Does not talk. |\n| **Cosine similarity** | Closeness measure from -1 to 1, based on direction not size. |\n| **Semantic search** | Searching by meaning instead of by words. |\n| **Vector store** | A database of embeddings you can search quickly. |\n| **Index / indexing** | Reading, chunking and embedding everything in advance. |\n| **top_k / top_n** | How many results to return. |\n| **RAG** | Retrieval Augmented Generation. Find relevant text, then answer with it. |\n| **Distance** | The opposite of similarity. Smaller is closer. Chroma returns this. |\n| **Upsert** | Insert or update. Safe to run twice. |\n| **Metadata** | Extra information stored alongside each chunk. |\n| **Hybrid search** | Keyword and vector search combined. Day 12. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Test the opposite problem.**\nScore these pairs: \"the meeting is confirmed\" / \"the meeting is cancelled\"; \"profits rose\" / \"profits fell\".\n*You will see:* high similarity for opposite meanings.\n*It teaches:* retrieval finds relevant passages, not correct ones. The reading is still the model's job. This is the most important thing on this page.\n\n**2. Mix the maps.**\nEmbed your documents with `all-MiniLM-L6-v2` and your query with a different model. Search.\n*You will see:* meaningless results, and **no error at all**.\n*It teaches:* the silent failure mode. This is why Chroma binds the model to the collection.\n\n**3. Turn the dial on chunk size.**\nRe-index with `chunk_size=200`, then `chunk_size=3000`. Run the same five questions.\n*You will see:* small chunks match precisely but lack surrounding context, so answers are thin. Large chunks carry context but blur the meaning, so ranking gets worse.\n*It teaches:* chunk size affects retrieval quality as much as prompt wording. Day 12 has real strategies.\n\n**4. Ask for more.**\nSet `top_n=10`. Watch `prompt_tokens`.\n*You will see:* better recall, and a token count that may blow your free tier in one question.\n*It teaches:* `top_n` is a direct trade between finding things and affording things.\n\n**5. Cross languages.**\nIf you speak another language, put a document in it and ask in English.\n*You will see:* with this model, poor results. Multilingual embedding models exist and are a straight swap.\n*It teaches:* the map's coverage depends entirely on what it was trained on.\n\n**6. Race yesterday against today.**\nKeep both `search_chunks` and `semantic_search`. Run ten questions through each and record which wins.\n*You will see:* vector wins on paraphrasing, keyword wins on exact names and codes.\n*It teaches:* why hybrid search exists, from your own data rather than from being told.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- two maps, no error**\n*Symptom:* search returns confident nonsense.\n*Cause:* query and documents embedded with different models.\n*Fix:* one model, defined in one place. Let Chroma hold it.\n\n**Trap 2 -- distance read as similarity**\n*Symptom:* your worst results rank first.\n*Cause:* Chroma always returns a *distance*, where small is good -- never a similarity. If you sort as if bigger is better, you get it exactly backwards.\n*Fix:* convert once, at the boundary, as in `search()`.\n\n**Trap 2b -- the distance is not the distance you assumed**\n*Symptom:* the ranking looks fine, but every `score` is negative, and your relevance threshold rejects correct answers.\n*Cause:* the collection was created without `metadata={\"hnsw:space\": \"cosine\"}`, so Chroma used its default, `l2` -- squared Euclidean, unbounded. `1 - distance` is only a cosine similarity when the space is cosine.\n*Fix:* set the space explicitly at creation time, every time. It cannot be changed afterwards -- you have to delete the collection and re-index.\n\n**Trap 3 -- duplicate chunks**\n*Symptom:* the same passage appears three times in your results, crowding out everything else.\n*Cause:* `add` instead of `upsert`, or unstable ids, run repeatedly.\n*Fix:* `upsert` with stable `filename::number` ids.\n\n**Trap 4 -- re-embedding on every start**\n*Symptom:* a minute of waiting each run, and it gets worse as documents grow.\n*Fix:* `PersistentClient`. Index when documents change, not when the program starts.\n\n**Trap 5 -- a threshold that does not travel**\n*Symptom:* `0.25` works beautifully on your documents and badly on someone else's.\n*Cause:* scores are relative to your data and your model.\n*Fix:* measure it. Print scores for known-good and known-bad questions, and set the line between them. Re-measure whenever you change model or chunk size.\n\n**Trap 6 -- assuming retrieval is the answer**\n*Symptom:* a fluent, wrong answer, with a citation attached.\n*Cause:* the top chunk was about the right topic but said something different -- see experiment 1.\n*Fix:* keep the grounding prompt from Day 5, keep the citations, and open the source occasionally to check. An unverified citation is decoration.\n\n---\n\n## 10. Check yourself\n\n1. What is an embedding, concretely? What does the model give you back?\n2. Why must the query and the documents use the same embedding model, and what happens if they do not?\n3. \"I love this\" and \"I hate this\" score 0.71. Why, and what does that tell you about what retrieval can and cannot do?\n4. Why is the embedding model run on your laptop rather than through the API?\n5. Yesterday's keyword search beats today's on one kind of question. Which kind, and why?\n6. You forget `metadata={\"hnsw:space\": \"cosine\"}`. The search results still come back in a sensible order. So what exactly is broken, and where does it bite you?\n\n---\n\n## 11. Where this goes\n\n- **Day 7 is tomorrow and it is the big one.** Right now your assistant searches *once* and answers. An agent can search, read the result, notice it is missing something, and search again with better words. Several of today's failures are fixed not by better retrieval but by *repeated* retrieval.\n- **Day 11** uses embeddings on conversation history -- remembering what matters instead of what is recent. The exact problem you hit on Day 2.\n- **Day 12** is this day done properly: hybrid search, re-ranking, better chunking, metadata filtering, and measuring retrieval quality instead of guessing.\n- **Day 18 and 21** build the research platform on top of this. The vector store you created today is a real piece of the capstone.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 6:\n\nFolders:\n  research-assistant/\n    ai/\n      venv/, .env, .gitignore (now includes chroma_db/), requirements.txt\n      chat.py, prompts.py, classify.py, test_prompt.py\n      tools.py             (search_documents now uses the vector store)\n      tool_test.py\n      documents.py         (Day 5 - reading and chunking, unchanged)\n      ask_document.py\n      embeddings.py        (NEW - raw embedding + hand-written cosine search)\n      vector_store.py      (NEW - Chroma, persistent)\n      chroma_db/           (NEW - saved embeddings, gitignored)\n      conversation.json, notes/, documents/\n    dashboard/             (still empty)\n\nLibraries: openai, python-dotenv, pypdf,\n           sentence-transformers (NEW, ~2GB with torch),\n           chromadb (NEW), numpy\n\nEmbedding model: all-MiniLM-L6-v2, 384 dimensions, runs locally on CPU.\nFree, no API, no rate limits. Chat model unchanged (Groq llama-3.3-70b).\n\nembeddings.py:\n  get_model(), build_index(), semantic_search(question, top_n)\n  similarity(a, b) written by hand with numpy, kept for understanding\n\nvector_store.py:\n  chromadb.PersistentClient(path=\"./chroma_db\")\n  collection \"documents\" bound to the embedding function, so query and\n  documents can never use different models\n  created with metadata={\"hnsw:space\": \"cosine\"} - Chroma's DEFAULT is l2\n  (squared Euclidean), and the space is fixed at creation time\n  index_documents()  - upsert with stable ids \"filename::chunknumber\"\n  search(question)   - returns dicts with text, source, score (1 - distance,\n  which is a cosine similarity ONLY because the space is cosine)\n\ntools.py:\n  search_documents(query) now calls vector_store.search\n  returns \"nothing relevant\" when top score \u003c 0.25 (a GUESSED threshold,\n  needs measuring properly on Day 12)\n  tool description rewritten: the old plea to \"use the document's own\n  vocabulary\" was deleted, because synonyms now work\n\nKey decisions made:\n  - embeddings run locally so indexing thousands of chunks costs nothing\n  - similarity computed by hand once before using a library\n  - relevance scores always shown, never hidden\n  - upsert + stable ids so re-indexing never duplicates\n  - distance converted to similarity at one boundary only\n  - the distance metric is CHOSEN EXPLICITLY, never left to the default.\n    A default plus a number that still sorts correctly is an invisible bug.\n\nVerified working:\n  - the 5 synonym failures from Day 5 now all return the right chunk\n    (revenue/earnings, car/vehicle, \"when is it due\" etc.)\n\nKnown problems, written down to re-test on Day 12:\n  - exact codes and ids are now WORSE than keyword search (INV-2024-8871\n    vs -8872 look almost identical) -> needs hybrid search\n  - negation fails (\"which projects are NOT delayed\")\n  - counting fails (\"how many times is X mentioned\") - only 3 chunks seen\n  - cross-document comparison is poor, top 3 often all from one file\n  - 0.25 threshold is a guess, not measured (it is at least in the right\n    units now: cosine similarity, 1.0 identical, ~0 unrelated)\n  - opposites score high (love/hate 0.71); retrieval finds relevant text,\n    not correct text\n```\n\n---\n\n## Answers\n\n**1.** A list of numbers -- 384 of them with this model -- describing where a piece of text sits on a map of meaning. Nothing is stored inside it: no words, no dictionary. Just a position, where closeness means similar meaning.\n\n**2.** Because each model draws its own map. A position on one map compared to a position on another is meaningless. It produces no error, just quietly wrong results, which makes it one of the nastier bugs to find.\n\n**3.** Because the map measures what text is *about* and how it is shaped, more than what it claims. Both sentences concern the same product in the same form. It tells you retrieval finds relevant passages, not correct ones -- working out what the passage actually says is still the model's job.\n\n**4.** Because indexing means embedding thousands of chunks, and an API would burn your entire free tier doing it. The embedding model is small enough to run on a normal CPU, so it is free, unlimited and instant after the first download.\n\n**5.** Exact strings: codes, ids, part numbers, precise names. Keyword search matches them perfectly. Meaning-search sees `INV-2024-8871` and `INV-2024-8872` as almost the same position, because they are almost the same text. Running both together is called hybrid search.\n\n**6.** The *ordering* is fine, which is why nothing looks wrong. What breaks is the *number*. Chroma's default space is `l2` -- squared Euclidean, with no upper bound -- so `1 - distance` is not a similarity in any range you can reason about, and on real data it goes well below zero. It bites the moment you compare that number against something: the `0.25` relevance threshold in `search_documents` rejects correct answers, and the \"relevance\" figure you print next to each source is nonsense. And because the space is fixed when the collection is created, you cannot patch it in place -- delete `chroma_db/` and re-index.\n"},{"file":"day-07.md","title":"Day 7 -- Build Your First AI Agent","module":"02 -- AI Agents","time":"about 1 hour","minutes":20,"md":"# Day 7 -- Build Your First AI Agent\n\n**Module:** 02 -- AI Agents\n**Time:** about 1 hour\n**Builds on:** Day 4 -- tools; Day 6 -- document search\n\n---\n\n## 1. Today in one line\n\nYou add a `while` loop around Day 4's code, and a chatbot becomes an agent.\n\n---\n\n## 2. The problem\n\nRemember how Day 4 ended:\n\n```\nYou: Save a note with today's date in it.\n  [tool: get_current_time({})]\nAssistant: It's Tuesday, 15 September 2026.\n```\n\nIt got the date. Then it stopped. No note was saved.\n\nYour code runs tools **once**, then asks for a final answer. The model never gets a second turn to say \"good, now I need `save_note` with that date in it\".\n\nThat ceiling is everywhere once you notice it:\n\n- \"Find what my notes say about the budget and save a summary\" -- needs search, then save.\n- \"What time is it in Tokyo and how many hours ahead is that?\" -- needs time, then calculate.\n- \"Look up the deadline, work out how many days are left\" -- needs search, then a date calculation.\n\nEvery one is two or three steps. Your assistant can do one.\n\nThe fix is a loop. Genuinely, that is it. Keep calling the model until it stops asking for tools. **About ten lines.**\n\nAnd those ten lines change what the thing *is*. Up to now you have been building a very good assistant that answers questions. After today you have something that takes a goal and works at it. That is the line between a chatbot and an agent, and it is much thinner than the word \"agent\" suggests.\n\n---\n\n## 3. Mental model\n\n**Day 4 was asking a colleague one question and getting one answer.**\n\n**An agent is handing a colleague a goal and letting them work.**\n\nThey try something. They look at what came back. They decide what to do next. They try again. Eventually they come back and tell you what happened.\n\nYou are not directing each step. You set the goal and the boundaries; they choose the path.\n\n**Where this comparison breaks, and both breaks are today's real content:**\n\n**A person notices when they are going in circles.** After searching the same thing three times with no luck, a human stops and asks you for help. The model will happily search the same thing thirty times. It has no sense of \"this is not working\". You must supply that from outside, in code.\n\n**A person knows when they have actually finished.** The model can decide it is done while having done nothing at all -- it will announce \"I have saved your note\" without ever calling `save_note`. Fluent text about success is exactly as easy to produce as success.\n\nSo the agent is the loop, but **the engineering is the stopping**. Any beginner can write the loop. Knowing when to cut it off, and how to tell success from a confident claim of success, is the actual skill. It runs through Days 9, 10 and 15.\n\n---\n\n## 4. How it really works\n\nHere is the whole thing in plain words:\n\n```\nadd the user's goal to the message list\n\nrepeat:\n    send the whole message list, with tools\n\n    if the model asked for tools:\n        run them\n        add the request and the results to the message list\n        go round again\n\n    if the model answered in words:\n        that's the answer, stop\n\n    if we've gone round too many times:\n        stop anyway\n```\n\nThat is the agent. Everything in Days 9, 10, 14 and 16 is a variation on those nine lines.\n\n**Three things worth understanding properly:**\n\n**The message list is the agent's working memory.** There is no other state anywhere. Every time round the loop, the model re-reads the entire list: the goal, every tool it called, every result it got back. That is how it knows what it has already tried. This is why Day 2 mattered so much -- the agent's ability to reason about its own progress is built entirely on the conversation history.\n\nSome people call it the **scratchpad**. Same thing, better name.\n\n**Each step is a full API call.** A five-step task means five calls, each carrying everything from all the previous steps. Look at the shape of it:\n\n```\nstep 1:  sends 400 tokens\nstep 2:  sends 900\nstep 3:  sends 1,600\nstep 4:  sends 2,500\nstep 5:  sends 3,800\n```\n\nOne task, about 9,000 tokens. Your free minute is 6,000. **Agents are expensive in a way chatbots are not**, and this is the mechanism. Day 15 is largely about this graph.\n\n**You decide how much freedom it gets.** It is not on or off. `max_steps=3` is a short leash. `max_steps=20` with a file-writing tool is a long one. Which tools exist, how many steps are allowed, and whether a human approves anything -- these are your dials, and choosing them badly is how agents cause damage.\n\n---\n\n## 5. Setup\n\nNothing to install.\n\n```bash\ncd research-assistant/ai\nsource venv/bin/activate\n\ntouch agent.py\nrm -f conversation.json\n```\n\nWe build the agent as a new file rather than editing `chat.py`, so you can compare the two side by side.\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- The loop\n\n`agent.py`:\n\n```python\nimport os, json, time\nfrom dotenv import load_dotenv\nfrom openai import OpenAI, RateLimitError\nfrom tools import TOOL_SCHEMAS, AVAILABLE_TOOLS\n\nload_dotenv()\nclient = OpenAI(api_key=os.environ[\"GROQ_API_KEY\"],\n                base_url=\"https://api.groq.com/openai/v1\")\n\nMODEL = \"llama-3.3-70b-versatile\"\n\n\ndef call_model(messages, tools=None, tries=4):\n    for attempt in range(tries):\n        try:\n            return client.chat.completions.create(\n                model=MODEL, messages=messages, tools=tools\n            )\n        except RateLimitError:\n            wait = 2 ** attempt\n            print(f\"  [rate limited, waiting {wait}s]\")\n            time.sleep(wait)\n    raise RuntimeError(\"Rate limited too many times.\")\n\n\ndef run_agent(goal, max_steps=8):\n    messages = [\n        {\"role\": \"system\", \"content\": \"You are a capable assistant. Use your tools to complete the user's request. Work step by step.\"},\n        {\"role\": \"user\", \"content\": goal}\n    ]\n\n    for step in range(1, max_steps + 1):\n        print(f\"\\n--- step {step} ---\")\n\n        response = call_model(messages, tools=TOOL_SCHEMAS)\n        message = response.choices[0].message\n\n        if not message.tool_calls:\n            print(\"Model answered.\")\n            return message.content\n\n        messages.append(message.model_dump(exclude_none=True))\n\n        for call in message.tool_calls:\n            name = call.function.name\n            args = json.loads(call.function.arguments)\n            print(f\"  calling {name}({args})\")\n\n            try:\n                result = AVAILABLE_TOOLS[name](**args)\n            except Exception as error:\n                result = f\"Tool failed: {error}\"\n\n            print(f\"  -> {str(result)[:120]}\")\n            messages.append({\n                \"role\": \"tool\",\n                \"tool_call_id\": call.id,\n                \"content\": str(result)\n            })\n\n    return \"I ran out of steps before finishing.\"\n\n\nif __name__ == \"__main__\":\n    print(run_agent(\"Save a note called 'today' that contains today's date and the time in Tokyo.\"))\n```\n\nRun it.\n\n```\n--- step 1 ---\n  calling get_current_time({'timezone': 'Asia/Kolkata'})\n  -> Tuesday, 15 September 2026, 06:12 PM\n\n--- step 2 ---\n  calling get_current_time({'timezone': 'Asia/Tokyo'})\n  -> Tuesday, 15 September 2026, 09:42 PM\n\n--- step 3 ---\n  calling save_note({'title': 'today', 'content': 'Date: Tuesday...'})\n  -> Saved to notes/today.txt\n\n--- step 4 ---\nModel answered.\nI've saved a note called 'today' with the current date and the Tokyo time.\n```\n\n**Open `notes/today.txt`.** The file is really there.\n\nThat is your first agent. Look back at what changed from Day 4: the `if` became a `for`, and results feed back in. Nothing else.\n\n**The key line is `messages.append(...)` inside the loop.** Each round, the list grows with what happened. On step 3 the model can see both times it fetched, so it can write them into the note. Remove those appends and it would forget every step immediately and loop forever.\n\n---\n\n### Stage 2 -- Make it show its reasoning\n\nRight now the model acts without saying why. When something goes wrong, you cannot tell what it was thinking.\n\nChange the system prompt:\n\n```python\nAGENT_PROMPT = \"\"\"You are a capable assistant that completes tasks using tools.\n\nHOW TO WORK\n- Work in small steps. One or two tools per step.\n- Before using a tool, say in one short sentence what you are about to do and why.\n- After getting a result, say in one short sentence what you learned.\n- When the task is fully done, give a final answer with no tool calls.\n\nRULES\n- Never claim you have done something unless a tool actually returned success.\n- If a tool fails twice in a row, stop and explain the problem instead of retrying.\n- If the task is impossible with your tools, say so immediately.\"\"\"\n```\n\nAlso print the model's text when there are tool calls, since models often write a sentence alongside:\n\n```python\n        if message.content:\n            print(f\"  thinking: {message.content}\")\n```\n\nRun it again. Now you get a trail:\n\n```\n--- step 1 ---\n  thinking: I need today's date first.\n  calling get_current_time({})\n```\n\n**Two lines in that prompt are doing heavy lifting.**\n\n`\"Never claim you have done something unless a tool actually returned success\"` -- this fights the failure from section 3. Without it, models regularly announce completed work they never did.\n\n`\"If a tool fails twice in a row, stop\"` -- a stopping condition written in words. You will also add one in code, because words alone are not reliable enough. Belt and braces, like Day 3.\n\nThis \"say what you will do, do it, say what you learned\" shape has a name: **ReAct**, short for Reasoning and Acting. It is the most common agent pattern in use, and you have now built it.\n\n---\n\n### Stage 3 -- Watch the cost\n\nAdd token tracking, because agents are where cost stops being theoretical:\n\n```python\ndef run_agent(goal, max_steps=8):\n    ...\n    total_tokens = 0\n\n    for step in range(1, max_steps + 1):\n        response = call_model(messages, tools=TOOL_SCHEMAS)\n        total_tokens += response.usage.total_tokens\n        print(f\"--- step {step} --- (sent {response.usage.prompt_tokens}, \"\n              f\"total so far {total_tokens})\")\n```\n\nRun a task that takes four or five steps. Watch `prompt_tokens` climb each step.\n\n**This is Day 2's problem, amplified.** Every step re-sends everything from every previous step. Cost does not grow with steps -- it grows faster than that, because each step is both longer and one more.\n\nOn the free tier, a six-step task can consume your entire minute. That is not a bug; that is what agents cost. Every technique on Day 15 exists because of this number.\n\n---\n\n### Stage 4 -- Give it something worth doing\n\nNow combine Day 6 with today. This is where it stops feeling like a demo:\n\n```python\n    print(run_agent(\n        \"Search my documents for anything about deadlines. \"\n        \"Then save a note called 'deadlines' summarising what you found, \"\n        \"with the source filename for each item.\"\n    ))\n```\n\nWatch the trail: it searches, reads what came back, possibly searches again with better words, then writes the note.\n\n**Look carefully for a second search.** If the first one returns poor results, a good model reformulates and tries again. This is genuinely important: it means the agent can partly compensate for weak retrieval, which is one answer to yesterday's list of RAG failures. Repeated searching beats better searching more often than you would expect.\n\nTry one that needs comparison, which failed yesterday:\n\n```python\n    run_agent(\"Compare what my documents say about the budget with what they say about the timeline. Are they consistent?\")\n```\n\nOne search could not do this. An agent searching twice can.\n\n---\n\n### Stage 5 -- Find the failure modes\n\nBreak it deliberately. All three of these will happen to you in real use.\n\n**Failure A -- the loop that never ends.**\n\n```python\n    run_agent(\"Find the current share price of Reliance Industries.\", max_steps=20)\n```\n\nYou have no web tool. Watch what happens. Many models will search documents repeatedly, rephrase, search again, and keep going until your step limit cuts it off -- burning your entire quota.\n\n**Fix, in code, not in words:**\n\n```python\ndef run_agent(goal, max_steps=8):\n    ...\n    recent_calls = []\n\n    for step in range(1, max_steps + 1):\n        ...\n        for call in message.tool_calls:\n            name = call.function.name\n            args = json.loads(call.function.arguments)\n\n            signature = f\"{name}:{json.dumps(args, sort_keys=True)}\"\n            if recent_calls.count(signature) >= 2:\n                result = (\"You have already called this exact tool with these exact \"\n                          \"arguments twice and it did not help. Try something different, \"\n                          \"or tell the user you cannot complete this task.\")\n                messages.append({\"role\": \"tool\", \"tool_call_id\": call.id, \"content\": result})\n                continue\n            recent_calls.append(signature)\n            ...\n```\n\n**Read what that does.** It does not crash or stop. It sends a *message back to the model* telling it to change approach. You are steering it with feedback rather than killing it, which usually leads to a graceful \"I can't do this\" instead of a hard failure.\n\n**Failure B -- claiming success without doing the work.**\n\nBreak `save_note` so it returns `\"Error: disk full\"`. Run a save task.\n\nA well-prompted agent reports the failure. A poorly-prompted one says \"Saved!\" anyway. Try it with and without the `\"Never claim...\"` rule to see the difference.\n\n**The real lesson:** never trust the agent's summary of what it did. Trust the tool results. Day 15 builds checks that verify outcomes instead of believing reports.\n\n**Failure C -- running out of steps.**\n\nSet `max_steps=2` on a task needing four. It stops mid-way, having done half the work -- a note created but empty, or a search done but nothing saved.\n\n**Partial completion is the dangerous state.** Not failure, not success. Half-done with no clean rollback. Worth knowing about before you give an agent a tool that sends email.\n\n---\n\n### Stage 6 -- Ask before doing damage (optional, 10 minutes)\n\nYour agent can write files on its own. Later it will send messages and call APIs. Add a pause:\n\n```python\nNEEDS_APPROVAL = {\"save_note\"}\n\n            if name in NEEDS_APPROVAL:\n                print(f\"\\n  AGENT WANTS TO: {name}({args})\")\n                if input(\"  allow? (y/n): \").lower() != \"y\":\n                    result = \"The user refused permission for this action.\"\n                    messages.append({\"role\": \"tool\", \"tool_call_id\": call.id, \"content\": result})\n                    continue\n```\n\nNotice the refusal also goes back as a tool result. The agent learns it was blocked and can respond sensibly, rather than being left confused.\n\nThis is called **human in the loop**, and it is the main dial between \"useful\" and \"safe\". Day 9 is about turning it down on purpose, and what you need in place first.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **Agent** | A model in a loop with tools, working towards a goal. |\n| **Step / iteration** | One trip round the loop: one model call plus any tools. |\n| **Scratchpad** | The growing message list. The agent's working memory. |\n| **Trajectory** | The full path an agent took -- every step and result. |\n| **ReAct** | Reason, then act, then observe, then repeat. Today's pattern. |\n| **Stopping condition** | Any rule that ends the loop. |\n| **max_steps** | The hard limit. Your seatbelt. |\n| **Loop detection** | Noticing the same action repeated with no progress. |\n| **Human in the loop** | A person approving actions before they run. |\n| **Autonomy** | How much it does without asking. A dial, not a switch. |\n| **Partial completion** | Stopped halfway. Neither done nor undone. |\n| **Tool chaining** | Using one tool's output as another tool's input. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Remove the step limit.**\n`while True` instead of `for step in range(...)`. Give it an impossible task. **Watch your quota.**\n*You will see:* it runs until the rate limiter stops it.\n*It teaches:* `max_steps` is not a nicety. It is the difference between a bug and a bill.\n\n**2. Empty the scratchpad.**\nStop appending tool results -- keep only the goal each round.\n*You will see:* it calls the same first tool forever, because from its point of view nothing has happened yet.\n*It teaches:* the message list *is* the agent. No history, no agent.\n\n**3. A tool that always fails.**\nMake `calculate` return `\"Error: service unavailable\"`. Ask a maths question.\n*You will see:* with the \"fails twice\" rule, it gives up sensibly. Without it, it retries until the steps run out.\n*It teaches:* prompt-level stopping conditions genuinely work, and are genuinely not sufficient.\n\n**4. Two tools that both fit.**\nAsk something either `search_documents` or the model's own knowledge could answer.\n*You will see:* inconsistent choices between runs.\n*It teaches:* tool selection is probabilistic. If you need determinism, decide in code, not in the prompt.\n\n**5. Watch it recover from bad retrieval.**\nAsk about something in your documents using very odd wording.\n*You will see, sometimes:* a poor first search, then a reformulated second search that works.\n*It teaches:* the loop compensates for weak retrieval. This is one real answer to yesterday's failures.\n\n**6. Measure the cost of autonomy.**\nRun the same request through `chat.py` and through `run_agent`. Compare total tokens.\n*You will see:* the agent costs several times more.\n*It teaches:* do not make everything an agent. Many jobs are one call. Day 15 covers choosing.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- no step limit**\n*Symptom:* quota gone, or a program that never returns.\n*Fix:* `max_steps`, always, from the first version. Never \"just for testing\".\n\n**Trap 2 -- forgetting to append the assistant message**\n*Symptom:* an API error about tool messages without a matching assistant message, or an agent that repeats step 1 forever.\n*Cause:* Day 4's trap 3, now inside a loop where it is much more confusing.\n*Fix:* `messages.append(message.model_dump(exclude_none=True))` before running the tools.\n\n**Trap 3 -- trimming that cuts a tool pair**\n*Symptom:* works for short tasks, fails on long ones with an orphaned-tool-call error.\n*Cause:* Day 2's `trim_history` slicing between a request and its result. Agents produce many such pairs, so it finally bites.\n*Fix:* for now, do not trim inside the agent loop. Proper fix on Day 11.\n\n**Trap 4 -- believing the final answer**\n*Symptom:* \"I've saved your note\" and no file.\n*Fix:* check the tool results, not the summary. If it matters, verify in code.\n\n**Trap 5 -- dangerous tools with no brakes**\n*Symptom:* fine in testing, then an agent deletes something.\n*Cause:* a tool with side effects, no approval, a high step limit.\n*Fix:* Stage 6. Separate read-only tools from tools that change things, and treat them differently.\n\n**Trap 6 -- the cost surprise**\n*Symptom:* constant rate limiting once you start using the agent properly.\n*Cause:* every step re-sends everything.\n*Fix:* fewer steps, fewer tools, shorter tool results. Day 15.\n\n---\n\n## 10. Check yourself\n\n1. What exactly is the difference between Day 4's code and an agent?\n2. Where does the agent keep track of what it has already done?\n3. Why does `prompt_tokens` grow faster than the number of steps?\n4. Name two stopping conditions your agent has, and say which one you trust more.\n5. The agent says \"I've saved your note.\" What must you check before believing it?\n\n---\n\n## 11. Where this goes\n\n- **Day 8 (MCP)** answers a question today should have raised: your tools only exist inside this one Python file. MCP makes them a standard plug that any app can use.\n- **Day 9** turns the autonomy dial up. Longer tasks, no approval, which means everything in Stage 5 becomes essential rather than interesting.\n- **Day 10** adds planning: writing the whole plan first, then working through it, instead of deciding one step at a time.\n- **Day 11** fixes the scratchpad. Long tasks overflow the context window, and choosing what to keep is the job.\n- **Day 14** makes one of the tools *another agent*. That is genuinely all multi-agent is.\n- **Day 16 (LangGraph)** is today's loop drawn as an explicit map of states. You will recognise every piece -- which is exactly why frameworks come after this and not before.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 7:\n\nFolders:\n  research-assistant/\n    ai/\n      venv/, .env, .gitignore, requirements.txt\n      chat.py            (Day 4 single-round-of-tools version, kept)\n      agent.py           (NEW - the agent loop)\n      prompts.py, classify.py, test_prompt.py\n      tools.py           (unchanged today: time, calculate, save_note,\n                          search_documents via Chroma)\n      documents.py, embeddings.py, vector_store.py, chroma_db/\n      conversation.json, notes/, documents/\n    dashboard/           (still empty)\n\nLibraries: no new installs today\n\nagent.py contains:\n  MODEL constant\n  call_model(messages, tools, tries)  - exponential backoff, same as Day 1\n  run_agent(goal, max_steps=8):\n    - builds messages = [AGENT_PROMPT, user goal]\n    - for step in range(1, max_steps+1):\n        call model with TOOL_SCHEMAS\n        if no tool_calls -> return the text answer\n        append message.model_dump(exclude_none=True)\n        run every requested tool, append role=\"tool\" with tool_call_id\n    - returns \"ran out of steps\" if the limit is reached\n  prints the step number, the model's reasoning sentence, each tool call\n    and a truncated result\n  tracks total_tokens across all steps and prints it\n\nAGENT_PROMPT (in agent.py):\n  ReAct shape - say what you will do, do it, say what you learned\n  \"Never claim you have done something unless a tool returned success\"\n  \"If a tool fails twice in a row, stop and explain\"\n  \"If the task is impossible with your tools, say so immediately\"\n\nLoop protection added:\n  recent_calls list holds \"toolname:sorted-json-args\" signatures\n  the same signature 3 times returns a message to the MODEL telling it to\n  change approach, rather than crashing or silently stopping\n\nOptional human-in-the-loop:\n  NEEDS_APPROVAL = {\"save_note\"}; prompts y/n before running;\n  a refusal is sent back as a tool result so the agent can react\n\nKey decisions made:\n  - agent.py is a separate file from chat.py so the two can be compared\n  - max_steps is mandatory and was never omitted, even in the first version\n  - stopping is handled in BOTH the prompt and in code, deliberately\n  - loop detection steers the model with feedback instead of killing the run\n  - no trimming inside the agent loop (it splits tool_calls/tool pairs)\n\nVerified working:\n  - \"save a note with today's date and the time in Tokyo\" now completes.\n    Day 4 could not do this. Real file appears in notes/.\n  - multi-step document tasks work: search -> summarise -> save\n  - the agent sometimes reformulates a failed search on its own, which\n    partly compensates for Day 6's retrieval limits\n\nKnown problems, left for later:\n  - tokens grow steeply per step; a 6-step task can use the whole free minute\n  - no trimming or summarising of the scratchpad yet (Day 11)\n  - the agent decides one step at a time, with no overall plan (Day 10)\n  - partial completion is possible when max_steps is hit; no rollback\n  - tools live only inside this Python project, hand-written schemas (Day 8)\n  - no verification that claimed actions really happened (Day 15)\n```\n\n---\n\n## Answers\n\n**1.** A loop. Day 4 runs tools once and then asks for a final answer. The agent keeps going -- calling the model, running tools, feeding results back -- until the model replies without asking for a tool, or the step limit is reached.\n\n**2.** In the message list. Every request and every result is appended, and the whole list is re-sent each step, so the model re-reads its own history to know what it has already tried. There is no other memory.\n\n**3.** Because every step re-sends everything from all previous steps. Step 5 carries steps 1 to 4 inside it. So the cost per step rises as well as the number of steps, and the total climbs steeply rather than linearly.\n\n**4.** The prompt rule (\"stop if a tool fails twice\") and the code limits (`max_steps` and loop detection). Trust the code. The prompt is steering and can be ignored; `max_steps` cannot.\n\n**5.** The tool results in the trajectory -- did `save_note` actually return a success message? And ideally the file itself. Producing a fluent sentence about having saved something is exactly as easy for the model as saving something.\n"},{"file":"day-08.md","title":"Day 8 -- Model Context Protocol (MCP)","module":"02 -- AI Agents","time":"about 1 hour","minutes":19,"md":"# Day 8 -- Model Context Protocol (MCP)\n\n**Module:** 02 -- AI Agents\n**Time:** about 1 hour\n**Builds on:** Day 4 -- tool schemas; Day 7 -- the agent loop\n\n---\n\n## 1. Today in one line\n\nYour tools move out of your Python file and become a standard plug that any AI app can use -- including apps you did not write.\n\n---\n\n## 2. The problem\n\nLook at what you have built. `tools.py` holds four useful tools: time, calculate, save notes, search your documents. Genuinely good.\n\nNow try to use them anywhere else.\n\n- In Claude Desktop? Rewrite them.\n- In your Node dashboard on Day 20? Rewrite them.\n- In a friend's project? Send them your file and hope.\n- With a different AI provider that uses a different schema format? Rewrite them.\n\nAnd the reverse is worse. Someone has already written an excellent GitHub tool, a Postgres tool, a Slack tool. You cannot use any of them, because there is no shared shape. Every project builds its own tools from scratch, forever.\n\nThere is a second problem, quieter but more interesting. Your agent knows its tools at **build time** -- `TOOL_SCHEMAS` is a list you typed. It can never gain a new ability while running. To add a tool you edit code and restart.\n\nMCP fixes both. It is a standard way to describe and offer tools, so tools become things you *connect to* rather than things you *contain*.\n\n**A word of warning about today.** Day 8 often feels abstract, and that is normal. You are not gaining new powers -- your tools already work. You are learning a plug shape. It properly clicks on Day 13. Today, aim to understand the shape and get one working.\n\n---\n\n## 3. Mental model\n\n**MCP is USB-C for AI tools.**\n\nBefore USB-C, every device had its own charger. Twelve cables in a drawer, none of them interchangeable. The chargers worked fine; they just did not work *together*.\n\nUSB-C did not make charging better. It made it **shared**. One shape, so any cable fits any device, and a new device works with cables that already exist.\n\nMCP is that for tools:\n\n- An **MCP server** offers capabilities -- tools, data, prompts.\n- An **MCP client** connects and uses them.\n- Any client can talk to any server, because the shape is agreed.\n\nYour agent becomes a client. Your tools become a server. And suddenly your tools work in Claude Desktop, in your Node app, in anything that speaks MCP -- and servers other people wrote work in yours.\n\n**Where the comparison breaks:**\n\nUSB-C is physically enforced. The wrong plug will not fit. MCP is a convention over JSON messages, so a badly written server is perfectly legal and will disappoint you in ways a cable cannot.\n\nMore importantly: **standardising the plug does nothing for the description**. Your model still chooses tools based on how well they are described. Everything from Day 4 still applies. MCP moves your schemas; it does not improve them.\n\n---\n\n## 4. How it really works\n\n**Three roles**\n\n- **Host** -- the app the user sees. Claude Desktop, your `agent.py`.\n- **Client** -- the part inside the host that speaks MCP. One per server.\n- **Server** -- the thing offering tools. Usually a separate small program.\n\n**Servers offer three kinds of thing**\n\n- **Tools** -- functions the model can call. What you built on Day 4.\n- **Resources** -- data the model can read. A file, a database row, a document.\n- **Prompts** -- reusable prompt templates the user can pick.\n\nToday is tools only. Day 13 covers the other two.\n\n**The conversation**\n\nMCP uses **JSON-RPC**: plain JSON messages with a method name, parameters and an id. Over **stdio** -- the server's standard input and output -- or over HTTP.\n\nStdio surprises people, so be clear about it: your server is a normal program, launched as a subprocess, and messages travel down the pipe you would normally use for printing. That has one sharp consequence, which is trap 1 below and the single most common MCP mistake.\n\nThe exchange:\n\n```\nclient -> initialize                    \"hello, I speak version X\"\nserver -> capabilities                  \"hello, I offer tools\"\nclient -> tools/list                    \"what have you got?\"\nserver -> [ schemas ]                   \"here, in JSON Schema\"\nclient -> tools/call {name, arguments}  \"run this one\"\nserver -> result                        \"here you go\"\n```\n\n**Now the important observation.** Look at what `tools/list` returns: name, description, input schema. **That is exactly what you hand-wrote in `TOOL_SCHEMAS` on Day 4.**\n\nMCP did not invent a new idea. It took the thing you already built and standardised two things around it:\n\n1. **Transport** -- how the description travels between programs.\n2. **Discovery** -- the client asks at runtime instead of being told at build time.\n\nDiscovery is the part that matters. Your agent no longer needs to know its tools in advance. Connect a server, ask what it has, offer that to the model. Add a tool to the server and the agent can use it without a single change to the agent's code.\n\n---\n\n## 5. Setup\n\n```bash\ncd research-assistant/ai\nsource venv/bin/activate\n\npip install mcp\npip freeze > requirements.txt\n\nmkdir -p mcp_servers\n```\n\nMCP is async, so today has `async` and `await` in it. If those are new: `async def` marks a function that can pause while waiting, and `await` is where it pauses. You do not need a deep understanding today -- follow the shape and read up later.\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- Build a server\n\n`mcp_servers/my_tools.py`:\n\n```python\nimport sys\nimport os\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom mcp.server.fastmcp import FastMCP\nfrom tools import get_current_time, calculate, save_note, search_documents\n\nmcp = FastMCP(\"research-tools\")\n\n\n@mcp.tool()\ndef current_time(timezone: str = \"Asia/Kolkata\") -> str:\n    \"\"\"Get the current date and time in a specific timezone.\n\n    Use this whenever the user asks about the current time or today's date.\n\n    Args:\n        timezone: An IANA timezone name, for example 'Asia/Kolkata' or 'Asia/Tokyo'.\n    \"\"\"\n    return get_current_time(timezone)\n\n\n@mcp.tool()\ndef maths(expression: str) -> str:\n    \"\"\"Do exact arithmetic. Use this for ANY calculation, even easy ones,\n    because language models cannot do arithmetic reliably.\n\n    Args:\n        expression: A maths expression such as '8472 * 391'.\n    \"\"\"\n    return calculate(expression)\n\n\n@mcp.tool()\ndef note_save(title: str, content: str) -> str:\n    \"\"\"Save a note to a file for the user to read later.\n\n    Args:\n        title: A short filename-friendly title, no extension.\n        content: The full text to save.\n    \"\"\"\n    return save_note(title, content)\n\n\n@mcp.tool()\ndef documents_search(query: str) -> str:\n    \"\"\"Search the user's own documents, notes and PDFs by meaning.\n    Natural language works; you do not need the exact words from the document.\n\n    Args:\n        query: What to look for.\n    \"\"\"\n    return search_documents(query)\n\n\nif __name__ == \"__main__\":\n    mcp.run()\n```\n\n**What FastMCP is doing for you.**\n\nLook at `current_time`. You wrote no JSON Schema. FastMCP reads the **type hints** (`timezone: str`) and the **docstring**, and generates the schema automatically.\n\nCompare that with your Day 4 version -- twenty lines of nested JSON per tool. This is the same information in a form humans can actually maintain.\n\n**That docstring is now your tool description**, which means it is now a prompt. Everything from Day 3 applies: say *when* to use it, be specific about argument formats, name the model's weaknesses. The `maths` docstring keeps the \"cannot do arithmetic reliably\" line for exactly that reason. Vague docstrings mean a model that picks badly.\n\n**The `sys.path.insert` line** lets the server import your existing `tools.py` from the parent folder. The server is launched as its own program, so it does not inherit your project folder automatically.\n\nTest that it starts:\n\n```bash\npython mcp_servers/my_tools.py\n```\n\nIt will sit there doing nothing. **That is correct.** It is waiting for JSON on standard input. Press `Ctrl+C`.\n\n---\n\n### Stage 2 -- Look at the raw protocol\n\nBefore using a client library, see the actual messages. This is the Day 1 habit.\n\nRun the server again and paste this into the terminal, as one line, then press enter:\n\n```json\n{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"manual\",\"version\":\"1.0\"}}}\n```\n\nYou get a JSON response describing the server's capabilities.\n\nNow send:\n\n```json\n{\"jsonrpc\":\"2.0\",\"method\":\"notifications/initialized\"}\n```\n\nthen:\n\n```json\n{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}\n```\n\nAnd there they are -- your four tools, with descriptions and input schemas, as JSON.\n\n**Read that output next to your Day 4 `TOOL_SCHEMAS`.** Slightly different key names, identical information. This is the moment MCP stops feeling mysterious: it is your own tool descriptions, sent down a pipe, with an agreed envelope around them.\n\n---\n\n### Stage 3 -- Write a client\n\n`mcp_client.py`:\n\n```python\nimport asyncio\nfrom mcp import ClientSession, StdioServerParameters\nfrom mcp.client.stdio import stdio_client\n\nserver = StdioServerParameters(\n    command=\"python\",\n    args=[\"mcp_servers/my_tools.py\"]\n)\n\n\nasync def main():\n    async with stdio_client(server) as (read, write):\n        async with ClientSession(read, write) as session:\n            await session.initialize()\n\n            tools = await session.list_tools()\n            print(\"Tools this server offers:\")\n            for tool in tools.tools:\n                print(f\"  {tool.name}: {tool.description.splitlines()[0]}\")\n\n            result = await session.call_tool(\"maths\", {\"expression\": \"8472 * 391\"})\n            print(\"\\nResult:\", result.content[0].text)\n\n\nasyncio.run(main())\n```\n\nRun it:\n\n```\nTools this server offers:\n  current_time: Get the current date and time in a specific timezone.\n  maths: Do exact arithmetic. Use this for ANY calculation, even easy ones,\n  note_save: Save a note to a file for the user to read later.\n  documents_search: Search the user's own documents, notes and PDFs by meaning.\n\nResult: 3312552\n```\n\n**Your client did not know any of those tools existed.** It asked. That is discovery, and it is the whole point.\n\n`stdio_client` launched the server as a subprocess, held the pipes open, and shuts it down cleanly when the `async with` block ends.\n\n---\n\n### Stage 4 -- Put MCP under your agent\n\nNow replace the hardcoded schemas in `agent.py` with discovered ones. `mcp_agent.py`:\n\n```python\nimport os, json, asyncio\nfrom dotenv import load_dotenv\nfrom openai import OpenAI\nfrom mcp import ClientSession, StdioServerParameters\nfrom mcp.client.stdio import stdio_client\n\nload_dotenv()\nclient = OpenAI(api_key=os.environ[\"GROQ_API_KEY\"],\n                base_url=\"https://api.groq.com/openai/v1\")\nMODEL = \"llama-3.3-70b-versatile\"\n\nserver = StdioServerParameters(command=\"python\", args=[\"mcp_servers/my_tools.py\"])\n\n\ndef to_openai_schema(mcp_tool):\n    \"\"\"Turn an MCP tool description into the shape the chat API expects.\"\"\"\n    return {\n        \"type\": \"function\",\n        \"function\": {\n            \"name\": mcp_tool.name,\n            \"description\": mcp_tool.description,\n            \"parameters\": mcp_tool.inputSchema\n        }\n    }\n\n\nasync def run_agent(goal, max_steps=8):\n    async with stdio_client(server) as (read, write):\n        async with ClientSession(read, write) as session:\n            await session.initialize()\n\n            listed = await session.list_tools()\n            schemas = [to_openai_schema(t) for t in listed.tools]\n            print(f\"Discovered {len(schemas)} tools: {[t.name for t in listed.tools]}\\n\")\n\n            messages = [\n                {\"role\": \"system\", \"content\": \"You are a capable assistant. Use your tools. Work step by step.\"},\n                {\"role\": \"user\", \"content\": goal}\n            ]\n\n            for step in range(1, max_steps + 1):\n                print(f\"--- step {step} ---\")\n\n                response = client.chat.completions.create(\n                    model=MODEL, messages=messages, tools=schemas\n                )\n                message = response.choices[0].message\n\n                if not message.tool_calls:\n                    return message.content\n\n                messages.append(message.model_dump(exclude_none=True))\n\n                for call in message.tool_calls:\n                    args = json.loads(call.function.arguments)\n                    print(f\"  {call.function.name}({args})\")\n\n                    try:\n                        outcome = await session.call_tool(call.function.name, args)\n                        text = outcome.content[0].text\n                    except Exception as error:\n                        text = f\"Tool failed: {error}\"\n\n                    print(f\"  -> {text[:120]}\")\n                    messages.append({\n                        \"role\": \"tool\",\n                        \"tool_call_id\": call.id,\n                        \"content\": text\n                    })\n\n            return \"Ran out of steps.\"\n\n\nif __name__ == \"__main__\":\n    print(asyncio.run(run_agent(\n        \"Search my documents for anything about deadlines, then save a note called 'deadlines' summarising what you found.\"\n    )))\n```\n\n**What changed from Day 7, and it is only two things:**\n\n- `TOOL_SCHEMAS` is now fetched at runtime with `list_tools()` instead of being imported.\n- `AVAILABLE_TOOLS[name](**args)` became `await session.call_tool(name, args)`.\n\nEverything else -- the loop, the appends, the step limit -- is identical. The agent pattern did not change. Only where the tools live.\n\n**The `to_openai_schema` function is worth noticing.** MCP has its shape, the chat API has another. This small translator sits between them. Every framework you meet from Day 16 onwards has a version of this function. Now you know what it is doing.\n\n**Now prove the point.** Add a tool to `mcp_servers/my_tools.py`:\n\n```python\n@mcp.tool()\ndef word_count(text: str) -> str:\n    \"\"\"Count the words in a piece of text.\n\n    Args:\n        text: The text to count.\n    \"\"\"\n    return f\"{len(text.split())} words\"\n```\n\nRun `mcp_agent.py` again and ask it to count words in something.\n\n**You did not touch the agent.** It discovered the new tool on startup and used it. On Day 7, adding a tool meant editing agent code. That difference is the entire value of MCP.\n\n---\n\n### Stage 5 -- Use a server you did not write\n\nThis is where it stops being theory. There are MCP servers for filesystems, GitHub, Postgres, Slack, web fetching and much more.\n\nAdd a second server to your client:\n\n```python\nservers = {\n    \"mine\":  StdioServerParameters(command=\"python\", args=[\"mcp_servers/my_tools.py\"]),\n    \"files\": StdioServerParameters(\n        command=\"npx\",\n        args=[\"-y\", \"@modelcontextprotocol/server-filesystem\", os.path.abspath(\"documents\")]\n    ),\n}\n```\n\nYou connect to each, list tools from both, and keep a map from tool name to which session owns it:\n\n```python\ntool_owner = {}   # tool name -> session\n```\n\nWhen the model calls a tool, look up the owner and route the call there.\n\n**Two real warnings, which is why this stage is short:**\n\n**Name collisions.** Two servers can both offer `search`. The model sees two identical names and behaves unpredictably. Real clients prefix them -- `files.search`, `mine.search`. If you build this, prefix.\n\n**Trust.** You just gave a program written by a stranger the ability to read and write files on your machine, and your agent decides when to call it. Note the `os.path.abspath(\"documents\")` argument -- that server is scoped to one folder deliberately. Read what a server can do before you connect it. Day 13 goes into this properly.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **MCP** | Model Context Protocol. A shared shape for offering tools to AI apps. |\n| **Server** | A program offering tools, resources or prompts. |\n| **Client** | The part of your app that talks to one server. |\n| **Host** | The app the user sees, which may hold many clients. |\n| **Transport** | How messages travel. stdio (a pipe) or HTTP. |\n| **stdio** | Standard input and output. The server's normal print channel, used as the wire. |\n| **JSON-RPC** | The message format: method, params, id. |\n| **initialize** | The opening handshake. |\n| **tools/list** | \"What can you do?\" |\n| **tools/call** | \"Run this one.\" |\n| **Discovery** | Learning what tools exist at runtime instead of build time. |\n| **Resources** | Data a server offers for reading. Day 13. |\n| **Prompts** | Reusable prompt templates a server offers. Day 13. |\n| **FastMCP** | The helper that builds schemas from your type hints and docstrings. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Print to stdout in the server.**\nAdd `print(\"starting up\")` at the top of `my_tools.py`. Run the client.\n*You will see:* the connection fails or hangs, with a confusing parse error.\n*It teaches:* **stdout is the wire.** Anything you print corrupts the protocol. This is trap 1 and it catches nearly everyone.\n\n**2. Empty a docstring.**\nDelete the body of `documents_search`'s docstring. Run the agent on a document question.\n*You will see:* it stops choosing that tool, or chooses it badly.\n*It teaches:* MCP standardised transport, not quality. Description is still everything.\n\n**3. Add a tool while the agent is written.**\nAdd a new `@mcp.tool()` and re-run the agent without editing it.\n*You will see:* it appears and gets used.\n*It teaches:* runtime discovery, felt rather than described. This is the payoff of the whole day.\n\n**4. Kill the server mid-run.**\nFind the subprocess and kill it while the agent is working.\n*You will see:* an ugly exception, and probably a stuck program.\n*It teaches:* MCP adds a process boundary, and process boundaries fail. A real client reconnects or degrades gracefully. Yours does not.\n\n**5. Wrong types.**\nMake a tool take `count: int` and have the model pass `\"three\"`.\n*You will see:* a validation error returned as a tool result.\n*It teaches:* schemas are enforced, unlike your Day 4 code where a bad argument crashed Python. This is a genuine improvement.\n\n**6. Compare the two.**\nPut `tools/list` output side by side with your Day 4 `TOOL_SCHEMAS`.\n*You will see:* the same information, different envelope.\n*It teaches:* MCP is not a new idea. It is your idea, standardised.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- printing to stdout**\n*Symptom:* JSON parse errors, hangs, or a client that gets nothing.\n*Cause:* `print()` in a stdio server writes into the message channel.\n*Fix:* log to **stderr** (`print(..., file=sys.stderr)`) or to a file. Never stdout. This is the number one MCP bug.\n\n**Trap 2 -- the server cannot import your modules**\n*Symptom:* `ModuleNotFoundError: No module named 'tools'`.\n*Cause:* the server is launched as a separate process from a different working directory.\n*Fix:* the `sys.path.insert` line at the top, or absolute imports plus a proper package layout.\n\n**Trap 3 -- forgetting await**\n*Symptom:* `RuntimeWarning: coroutine was never awaited`, and a result object with nothing useful in it.\n*Cause:* async. `session.call_tool(...)` without `await` returns a coroutine, not a result.\n*Fix:* `await` every session method.\n\n**Trap 4 -- name collisions between servers**\n*Symptom:* the wrong tool runs, inconsistently.\n*Fix:* prefix tool names per server.\n\n**Trap 5 -- trusting a stranger's server**\n*Symptom:* nothing visible, which is the problem.\n*Cause:* an MCP server is a program with your permissions, called by a model that can be talked into things.\n*Fix:* read the source, scope it to a folder, prefer well-known servers. Day 13.\n\n**Trap 6 -- expecting MCP to make tools better**\n*Symptom:* disappointment. \"I did all this and it behaves the same.\"\n*Reality:* correct. Same tools, same model, same choices. What changed is that the tools are now portable and discoverable.\n\n---\n\n## 10. Check yourself\n\n1. What two things does MCP actually standardise? What does it not touch?\n2. Why must an MCP server never print to stdout?\n3. What is discovery, and what could you do after Stage 4 that you could not do on Day 7?\n4. `tools/list` returns something you had already written by hand. What, and where?\n5. You connect a filesystem server someone else wrote. What is the risk, and what reduces it?\n\n---\n\n## 11. Where this goes\n\n- **Day 9** runs the agent autonomously. Tools behind a process boundary matter more when nobody is watching each call.\n- **Day 13 is MCP properly.** Resources and prompts, authentication, sampling, and the security questions from trap 5. Today's abstract feeling largely disappears there.\n- **Day 14** can give each agent its own set of MCP servers, so agents differ by capability rather than by code.\n- **Day 20** is where today pays off in a way you can see: your Node dashboard can talk to the same MCP server this Python agent uses. Two languages, one set of tools, written once.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 8:\n\nFolders:\n  research-assistant/\n    ai/\n      venv/, .env, .gitignore, requirements.txt\n      chat.py, agent.py            (Day 7 agent, hardcoded tools, kept)\n      mcp_agent.py                 (NEW - agent using discovered MCP tools)\n      mcp_client.py                (NEW - minimal client, lists and calls)\n      mcp_servers/\n        my_tools.py                (NEW - FastMCP server wrapping tools.py)\n      tools.py, prompts.py, classify.py, test_prompt.py\n      documents.py, embeddings.py, vector_store.py, chroma_db/\n      conversation.json, notes/, documents/\n    dashboard/                     (still empty)\n\nLibraries: mcp (NEW). Everything else unchanged.\n\nmcp_servers/my_tools.py:\n  FastMCP(\"research-tools\"), run over stdio\n  sys.path.insert at the top so it can import ../tools.py\n  exposes 4 tools, each a thin wrapper over the existing functions:\n    current_time, maths, note_save, documents_search\n  (plus word_count, added to prove runtime discovery works)\n  schemas are generated automatically from type hints + docstrings,\n  so docstrings are now the tool descriptions and matter as prompts\n\nmcp_client.py:\n  StdioServerParameters(command=\"python\", args=[\"mcp_servers/my_tools.py\"])\n  async: stdio_client -> ClientSession -> initialize -> list_tools -> call_tool\n\nmcp_agent.py:\n  same loop as Day 7, with two changes only:\n    - schemas fetched at runtime via session.list_tools()\n    - tools run via await session.call_tool(name, args)\n  to_openai_schema() translates MCP tool shape -> chat API tool shape\n  prints the discovered tool list on startup\n\nVerified working:\n  - manual JSON-RPC over stdin: initialize, notifications/initialized,\n    tools/list. Output compared against Day 4 TOOL_SCHEMAS - same\n    information, different envelope.\n  - added word_count to the SERVER and the agent used it with NO change\n    to agent code. This is runtime discovery.\n\nKey decisions made:\n  - tools.py kept as the real implementation; the MCP server is a thin\n    wrapper, so agent.py (Day 7) still works unchanged\n  - docstrings written as prompts: when to use, argument formats, and the\n    model's own weaknesses named\n  - nothing is ever printed to stdout inside the server\n\nKnown problems, left for later:\n  - no reconnect or graceful failure if the server process dies\n  - multiple servers would collide on tool names; no prefixing yet\n  - no authentication, no permission model, third-party servers run with\n    full user permissions (Day 13)\n  - resources and prompts not used at all yet (Day 13)\n  - mcp_agent.py has no loop detection or approval step; those live in\n    agent.py and still need merging\n```\n\n---\n\n## Answers\n\n**1.** Transport (how tool descriptions and calls travel between programs) and discovery (asking at runtime what tools exist). It does not touch how good the tool is, how well it is described, or whether the model chooses it sensibly -- all of that is still Day 3 and Day 4 work.\n\n**2.** Because with stdio transport, standard output *is* the message channel. Anything printed lands in the middle of the JSON-RPC stream and corrupts it. Log to stderr or a file instead.\n\n**3.** Discovery is asking the server at runtime what tools it offers rather than knowing them at build time. After Stage 4 you can add a tool to the server and the agent uses it immediately, with no change to the agent's code. On Day 7 that required editing the agent.\n\n**4.** The tool name, description and input schema -- exactly the contents of `TOOL_SCHEMAS` in `tools.py` from Day 4. MCP puts a standard envelope around the same information.\n\n**5.** It is a program running with your permissions, and a model that can be influenced by text decides when to call it. Reduce the risk by reading the source, scoping it to a single folder as with `abspath(\"documents\")`, preferring well-known servers, and requiring approval for anything that changes data.\n"},{"file":"day-09.md","title":"Day 9 -- Building an Autonomous AI Agent","module":"02 -- AI Agents","time":"about 1 hour","minutes":22,"md":"# Day 9 -- Building an Autonomous AI Agent\n\n**Module:** 02 -- AI Agents\n**Time:** about 1 hour\n**Builds on:** Day 7 -- the agent loop; Day 8 -- MCP tools\n\n---\n\n## 1. Today in one line\n\nYou let the agent work unsupervised on long tasks -- which means today is really about the rails that make that survivable.\n\n---\n\n## 2. The problem\n\nYour Day 7 agent works, but only while you are watching it.\n\n`max_steps=8`. Every note save waits for you to type `y`. You read each step as it scrolls past. That is fine for a demo and useless for anything real.\n\nA genuinely useful task looks like this:\n\n> Go through all my documents, find every deadline mentioned, check which ones have already passed, and write me a summary note.\n\nThat is fifteen to twenty steps. You cannot sit and approve twenty actions -- at that point you may as well do it yourself.\n\nSo turn the dials up: `max_steps=30`, remove the approval prompt. Now try it.\n\nThree things go wrong, and all three will happen to you:\n\n- **Your quota disappears.** Twenty steps, each re-sending everything, is tens of thousands of tokens.\n- **It stops halfway and tells you it finished.** You get a confident summary, and the note is empty.\n- **It gets stuck.** The same search, eight times, with slightly different wording, until the step limit kills it.\n\nAutonomy is not a setting you switch on. It is a set of things you have to build *before* you can safely stop watching. That is today.\n\n**One sentence to carry through the whole lesson:**\n\n> The agent must never be the judge of whether it succeeded.\n\n---\n\n## 3. Mental model\n\n**Think about the difference between a colleague you watch and a colleague you send off for the afternoon.**\n\nTo send someone off, you need five things:\n\n1. **A clear goal** -- so they know what finished looks like.\n2. **Boundaries** -- which systems they may touch, and which they may not.\n3. **A budget** -- do not spend three days on this.\n4. **A report** -- tell me what you actually did.\n5. **A way to stop them** -- if this goes wrong, it must be possible to end it.\n\nEvery one of those becomes code today.\n\n**Where the comparison breaks, and this is the whole lesson:**\n\n**A person tells you when th
