 independent.** If question 2 needs question 1's answer, running them together produces two agents working with incomplete information. Splitting a task that does not split is worse than not splitting it.\n\n---\n\n### Stage 5 -- The critic\n\nCheap, and it improves output more reliably than most of this page:\n\n```python\ndef critique(brief, work, budget):\n    response = call([{\"role\": \"system\", \"content\": CRITIC},\n                     {\"role\": \"user\", \"content\": f\"BRIEF:\\n{brief}\\n\\nWORK:\\n{work}\"}])\n    budget.spend(response.usage.total_tokens)\n    try:\n        return json.loads(response.choices[0].message.content)\n    except json.JSONDecodeError:\n        return {\"verdict\": \"good\", \"problems\": []}\n\n\ndef write_with_critic(brief, findings, budget, rounds=2):\n    work = writer(brief, findings, budget)\n\n    for round_number in range(rounds):\n        review = critique(brief, work, budget)\n        print(f\"  critic round {round_number+1}: {review['verdict']}\")\n\n        if review[\"verdict\"] == \"good\":\n            break\n\n        for problem in review.get(\"problems\", [])[:3]:\n            print(f\"    - {problem}\")\n\n        work = writer(\n            f\"{brief}\\n\\nYour previous draft had these problems, fix them:\\n\"\n            + \"\\n\".join(review.get(\"problems\", []) + review.get(\"missing\", [])),\n            findings, budget)\n\n    return work\n```\n\n**`rounds=2` is a hard cap, and it is not negotiable.** Without it, a critic finds something to improve forever -- each round produces a slightly different draft with slightly different flaws. Two rounds captures nearly all of the gain.\n\n**Test whether it earns its cost.** Run the same brief with and without the critic, and read both outputs. Sometimes the improvement is obvious. Sometimes the critic invents requirements that were never in the brief and makes it worse. That is why `CRITIC` says \"judge only against the brief\".\n\n---\n\n### Stage 6 -- Measure it, and be willing to conclude \"not worth it\"\n\nThe point of the day.\n\n```python\nfrom autonomous import run as single_agent, Budget\n\nTASKS = [\n    \"What deadlines are in my documents?\",\n    \"Summarise what my documents say about deadlines, with sources.\",\n    \"Compare what my documents say about budget and timeline, find any \"\n    \"contradictions, and write a summary with sources for each claim.\",\n]\n\nfor task in TASKS:\n    print(\"=\" * 70)\n    print(task[:60])\n\n    start = time.time()\n    one = single_agent(task, budget=Budget(max_steps=15), policy=\"auto\")\n    print(f\"  single: {one['budget']}, {time.time()-start:.0f}s\")\n\n    start = time.time()\n    budget = SharedBudget()\n    many = supervise(task, budget)\n    print(f\"  multi:  {budget.steps} steps, {budget.tokens} tokens, {time.time()-start:.0f}s\")\n```\n\nThen **read both outputs** for each task and judge them yourself. Quality is the whole question and no counter measures it.\n\nYou will most likely find something like:\n\n| Task | Better | Why |\n|---|---|---|\n| Simple lookup | **Single, clearly** | Coordination costs more than the task |\n| Medium summary | About even, multi costs 2-3x | Specialisation helps a bit |\n| Complex comparison | **Multi**, if handoffs were clean | Separate contexts prevent muddle |\n\n**Write your real numbers down.** And be prepared for the outcome most people do not expect: that on your tasks, with your documents, the single agent wins. That is a legitimate and useful result. Multi-agent is a tool for specific shapes of problem, not a level you graduate to.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **Orchestrator / supervisor** | The agent that holds the goal and delegates. |\n| **Worker** | A specialist agent doing one kind of job. |\n| **Agent-as-tool** | Exposing an agent as a callable function. |\n| **Handoff** | Passing work between agents. Where context is lost. |\n| **Fan-out / fan-in** | Splitting into parallel work, then merging. |\n| **Pipeline** | A fixed chain of agents. |\n| **Critic** | An agent that reviews another's output. |\n| **Swarm** | Agents passing control freely. Flexible, hard to debug. |\n| **Blackboard** | Shared state all agents can read and write. |\n| **Coordination overhead** | The extra calls, tokens and time that multi-agent costs. |\n| **Context isolation** | Each agent seeing only what it needs. The main benefit. |\n| **Trace id** | One id threaded through every agent, for debugging. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Measure the cost.**\nSame task, single versus supervised. Compare tokens.\n*You will see:* two to four times more for the multi version.\n*It teaches:* coordination is not free, in a number you produced yourself.\n\n**2. Cripple the handoff.**\nChange the supervisor prompt to \"pass a brief one-sentence summary of findings to the writer\".\n*You will see:* the final output gets noticeably thinner.\n*It teaches:* the handoff string is the bottleneck. This is the failure people do not anticipate.\n\n**3. Remove \"say what you could not find\".**\nTake that line out of `RESEARCHER`. Ask about something half-covered in your documents.\n*You will see:* the writer treats silence as completeness and the gap disappears.\n*It teaches:* absent information must be reported explicitly or it vanishes at every handoff.\n\n**4. Let the critic run free.**\nSet `rounds=10`.\n*You will see:* it keeps finding things, the draft keeps changing, quality plateaus early.\n*It teaches:* review loops need a hard cap.\n\n**5. Break a worker.**\nMake the researcher always return `\"[error]\"`.\n*You will see:* whether the supervisor notices, or writes a summary of nothing.\n*It teaches:* failures must propagate. Same lesson as Day 10's `depends_on`.\n\n**6. Split something unsplittable.**\nFan out three questions where question 3 depends on question 1's answer.\n*You will see:* three researchers with incomplete information, and a muddled merge.\n*It teaches:* parallelism needs genuine independence. It is not a general speedup.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- multi-agent when one would do**\n*Symptom:* three times the cost, no better output.\n*Fix:* default to one agent. Reach for a team when you have a measured reason.\n\n**Trap 2 -- per-agent budgets**\n*Symptom:* quota gone in one run.\n*Cause:* five agents at 25 steps each. Each looks reasonable alone.\n*Fix:* `SharedBudget`. One pot.\n\n**Trap 3 -- the lossy handoff**\n*Symptom:* the multi version produces thinner work than the single one did.\n*Cause:* the receiving agent only got a summary.\n*Fix:* pass more, or restructure so the agent that needs the detail is the one that gathered it.\n\n**Trap 4 -- critic loops**\n*Symptom:* it never finishes.\n*Fix:* hard round cap. Always.\n\n**Trap 5 -- no trace id**\n*Symptom:* something went wrong and you cannot tell which agent.\n*Fix:* one run id, threaded through every agent, logged on every call, saved to `runs/`.\n\n**Trap 6 -- injection reaching the whole team**\n*Symptom:* a document manipulates the researcher, whose report manipulates the supervisor.\n*Cause:* Day 13, multiplied. Agent output is untrusted input to the next agent.\n*Fix:* wrap inter-agent messages the same way you wrap document text, and keep least privilege per worker -- which is exactly why the writer has no tools.\n\n---\n\n## 10. Check yourself\n\n1. What single idea makes multi-agent possible with no new machinery?\n2. Why do two agents usually have *less* total context than one agent would have had?\n3. Which pattern gives a genuine speed win, and what must be true for it to work?\n4. Why must budgets be shared rather than per agent?\n5. Name one task where a single agent beats a team, and say why.\n\n---\n\n## 11. Where this goes\n\n- **Day 15** makes this operable: tracing across agents, cost per task, and evaluation over many runs rather than one.\n- **Day 16 (LangGraph)** gives you this as a graph. Supervisor, workers and handoffs become nodes and edges. You will recognise every piece.\n- **Day 17 (CrewAI)** is this with roles and goals as the main concept. Crews, tasks, delegation -- today's ideas with different names.\n- **Day 18** builds the research agent properly, and you will choose single or multi with evidence from Stage 6.\n- **Day 21** is where the choice matters commercially: three times the tokens for a marginal gain is a real cost.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 14:\n\nFolders:\n  research-assistant/\n    ai/\n      venv/, .env, .gitignore, requirements.txt\n      multi_agent.py        (NEW)\n      chat.py, agent.py, autonomous.py, planner.py, memory.py\n      retrieval.py, golden_set.py, vector_store.py, embeddings.py\n      documents.py, tools.py, security.py\n      mcp_agent.py, mcp_client.py, mcp_servers/my_tools.py\n      prompts.py, classify.py, test_prompt.py\n      runs/, notes/, documents/, chroma_db/, conversation.json\n    dashboard/              (still empty)\n\nLibraries: no new installs (asyncio is standard library)\n\nmulti_agent.py contains:\n\n  SharedBudget    - ONE budget for every agent in a run, not one each.\n                    40 steps / 80000 tokens / 300 seconds.\n                    Per-agent budgets were the trap: 5 agents x 25 steps\n                    each looks reasonable and costs 125 steps.\n\n  agent(goal, system_prompt, tool_names, budget, max_steps, label)\n                  - a generic worker. tool_names filters TOOL_SCHEMAS, so\n                    each worker STRUCTURALLY only has the tools it needs.\n                    This is Day 13 least privilege built into the shape.\n\n  Specialists:\n    RESEARCHER  - tools: search_documents, get_current_time, calculate\n                  MUST report what it could NOT find (without this line the\n                  writer treats silence as completeness and gaps vanish)\n    WRITER      - NO TOOLS AT ALL. Cannot search, cannot write files.\n                  Uses only the findings handed to it.\n    CRITIC      - JSON verdict good|needs_work, problems[], missing[]\n                  judges only against the brief\n\n  supervise(goal, budget, max_steps)\n                  - supervisor with TEAM_SCHEMAS: delegate_research and\n                    delegate_writing are TOOLS whose implementations are\n                    other agents. Agent-as-tool is the whole trick; no new\n                    machinery was needed.\n                  - the \"findings\" argument IS the handoff, and everything\n                    the researcher read that is not in that string is lost\n\n  parallel_research(goal, questions) + research_many()\n                  - asyncio.gather over run_in_executor, roughly 3x faster\n                    for 3 independent questions\n                  - only valid when the subtasks genuinely do not depend on\n                    each other\n\n  write_with_critic(brief, findings, budget, rounds=2)\n                  - HARD cap at 2 rounds; without it the critic finds\n                    something to improve forever\n\nMeasured, single agent vs supervised, on 3 tasks:\n  simple lookup      -> single wins clearly, coordination costs more than\n                        the task\n  medium summary     -> roughly even, multi costs 2-3x the tokens\n  complex comparison -> multi better IF the handoff carried enough detail\n  (record your own numbers; concluding \"not worth it\" is a legitimate and\n   useful result)\n\nPractical note: Groq free (30 RPM / 6000 TPM) throttles the parallel stage\nalmost immediately. Backoff handles it but the speedup shrinks.\n\nKey decisions made:\n  - default to ONE agent; a team needs a measured reason\n  - budgets are always shared\n  - each worker gets the narrowest possible toolset; the writer gets none\n  - researchers must report gaps explicitly\n  - review loops always have a hard round cap\n\nKnown problems, left for later:\n  - no trace id threaded through agents yet; debugging across workers is\n    hard (Day 15)\n  - handoffs are lossy by construction and there is no measurement of how\n    much is lost\n  - worker failures do not reliably propagate to the supervisor\n  - inter-agent messages are not wrapped as untrusted content, so a Day 13\n    injection can travel from a document through the researcher's report\n    into the supervisor\n  - no shared blackboard; workers cannot see each other's findings\n```\n\n---\n\n## Answers\n\n**1.** That an agent is a function, and a function can be a tool. `run_agent(goal)` exposed as a tool makes the supervisor pattern fall out of Day 4 with no new machinery.\n\n**2.** Because the handoff is a summary. The researcher read forty chunks and passes a paragraph; the writer never sees the forty chunks. A single agent would have had all of it in one context.\n\n**3.** Parallel fan-out. It requires the subtasks to be genuinely independent -- if one needs another's answer, running them together just produces two agents working with incomplete information.\n\n**4.** Because per-agent budgets multiply invisibly. Five agents with 25 steps each is 125 steps, and each individual budget looks perfectly reasonable when you set it.\n\n**5.** A simple lookup like \"what deadlines are in my documents\". One search answers it, and the supervisor's delegation call costs more than the entire task. Coordination overhead only pays for itself when there is real work to coordinate.\n"},{"file":"day-15.md","title":"Day 15 -- Making AI Agent Production Ready","module":"03 -- Advanced Agent Systems","time":"about 1 hour","minutes":21,"md":"# Day 15 -- Making AI Agent Production Ready\n\n**Module:** 03 -- Advanced Agent Systems\n**Time:** about 1 hour\n**Builds on:** everything. Especially Day 9 -- verification; Day 12 -- measurement\n\n---\n\n## 1. Today in one line\n\nYou find out what your system actually costs, how often it actually works, and what happens when it breaks -- because right now you do not know any of those three.\n\n---\n\n## 2. The problem\n\nEverything works. On your machine, on your documents, while you are watching.\n\nNow answer these:\n\n- **What does one task cost?** Not roughly. In tokens, and in rupees.\n- **How often does it succeed?** Out of a hundred real tasks, how many are right?\n- **What happens when Groq is down?** Does it crash, hang, or degrade sensibly?\n- **You changed a prompt on Day 11. Did it make anything worse?** You cannot know.\n- **Something went wrong last Tuesday at 3am. What happened?** No idea.\n\nThat is the gap between something that works and something you would let another person use.\n\nThere is one deeper problem, and it changes how you have to think.\n\n**Normal software is deterministic.** Same input, same output. A test passes or fails, and if it passes today it passes tomorrow.\n\n**Your system is statistical.** The same input can succeed today and fail tomorrow. There is no \"it works\". There is only a **rate** -- 87% of tasks, 93% of retrievals, 2% of runs exceed budget.\n\nWhich means every single-run observation you have made in this course is close to worthless as evidence. Including the ones in Day 12's table.\n\nToday you start measuring rates.\n\n---\n\n## 3. Mental model\n\n**A prototype car versus a shipped one.**\n\nThe prototype drives. The shipped one has a fuel gauge, a temperature warning, a service history, crash testing, and a manual describing what to do when the light comes on.\n\nNone of that makes it go faster. All of it is what separates something that works from something you would put another person in.\n\n**Where this comparison breaks, and it is the important part:**\n\nA car either starts or it does not. Your system starts, and produces a slightly different answer each time, and sometimes that answer is wrong in a way that looks exactly like being right.\n\nSo your dashboard cannot be a warning light. It has to be a set of **rates measured over many runs**:\n\n- success rate, over 20 tasks, not one\n- cost per task, averaged\n- latency at p50 and p95, not \"it felt fast\"\n- failure rate, and what kind of failure\n\n> If you measured it once, you did not measure it.\n\nThat is today's sentence.\n\n---\n\n## 4. How it really works\n\n**Five areas, in the order you should build them.**\n\n**1. Observability -- know what happened**\n\nEvery model call logged as one line of structured data: trace id, which agent, model, tokens in and out, latency, success or failure. Structured, not prose, so you can aggregate it.\n\nA **trace id** ties one user request to every call it caused. Without it, a 15-call multi-agent run is 15 unrelated log lines.\n\n**2. Evals -- know how often it works**\n\nDay 12 measured retrieval. Today you measure **answers**.\n\nTwo kinds of check:\n\n- **Assertions** -- did the file appear, does the answer contain \"30 November\", is it under 200 words. Cheap, exact, trustworthy.\n- **LLM-as-judge** -- for things assertions cannot check, like whether a summary is actually good. Useful and biased: judges favour longer answers, favour confident ones, and favour text written by the same model family. Treat it as a weak signal you have calibrated, never as ground truth.\n\n**Regression is the real point.** Run the eval before and after a change. That is the only way to know whether your prompt edit helped.\n\n**3. Reliability -- survive failure**\n\nYou have retries. Missing: **timeouts** (a hanging call), **fallback models** (provider down), **output validation with repair** (bad JSON -- try once more with the error), and **graceful degradation** (retrieval failed, so answer from general knowledge and say so).\n\n**4. Cost -- know the number, then reduce it**\n\nMeasure per task. Then the three levers, in order of payoff:\n\n- **Model routing** -- send easy tasks to a small model. Usually the biggest win by far.\n- **Caching** -- identical or near-identical requests answered from a store.\n- **Context trimming** -- shorter tool results, fewer retrieved chunks, tighter prompts.\n\n**5. Limits -- bound the damage**\n\nPer-user rate limits, per-user daily budget caps, a circuit breaker that stops calling a failing provider instead of hammering it.\n\n---\n\n## 5. Setup\n\n```bash\ncd research-assistant/ai\nsource venv/bin/activate\n\ntouch observability.py evals.py reliability.py\nmkdir -p logs\n```\n\nNo new libraries. Everything today is standard library plus what you have.\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- Log everything, structured\n\n`observability.py`:\n\n```python\nimport json, time, uuid, os\nfrom datetime import datetime, timezone\nfrom contextvars import ContextVar\n\nLOG_FILE = \"logs/calls.jsonl\"\n_trace = ContextVar(\"trace_id\", default=None)\n\n# Groq pricing per million tokens, roughly. Check current rates.\nPRICING = {\n    \"llama-3.3-70b-versatile\": {\"in\": 0.59, \"out\": 0.79},\n    \"llama-3.1-8b-instant\":    {\"in\": 0.05, \"out\": 0.08},\n}\n\n\ndef new_trace():\n    trace_id = uuid.uuid4().hex[:12]\n    _trace.set(trace_id)\n    return trace_id\n\n\ndef cost_of(model, prompt_tokens, completion_tokens):\n    rates = PRICING.get(model, {\"in\": 0, \"out\": 0})\n    return (prompt_tokens * rates[\"in\"] + completion_tokens * rates[\"out\"]) / 1_000_000\n\n\ndef log_call(model, component, prompt_tokens, completion_tokens,\n             milliseconds, ok=True, error=None):\n    record = {\n        \"time\": datetime.now(timezone.utc).isoformat(),\n        \"trace\": _trace.get(),\n        \"component\": component,\n        \"model\": model,\n        \"tokens_in\": prompt_tokens,\n        \"tokens_out\": completion_tokens,\n        \"ms\": round(milliseconds),\n        \"usd\": round(cost_of(model, prompt_tokens, completion_tokens), 6),\n        \"ok\": ok,\n        \"error\": error,\n    }\n    with open(LOG_FILE, \"a\") as f:\n        f.write(json.dumps(record) + \"\\n\")\n    return record\n```\n\nWrap every call site:\n\n```python\ndef tracked_call(messages, tools=None, component=\"agent\", model=MODEL):\n    start = time.time()\n    try:\n        response = client.chat.completions.create(\n            model=model, messages=messages, tools=tools)\n        log_call(model, component,\n                 response.usage.prompt_tokens,\n                 response.usage.completion_tokens,\n                 (time.time() - start) * 1000)\n        return response\n    except Exception as error:\n        log_call(model, component, 0, 0, (time.time() - start) * 1000,\n                 ok=False, error=str(error)[:200])\n        raise\n```\n\n**`ContextVar` is why this works across your multi-agent code.** Set the trace id once at the start of a request, and every nested agent call picks it up automatically without you passing it through five function signatures. It also works correctly with the asyncio fan-out from Day 14.\n\n**`component`** is what makes the log readable: `\"supervisor\"`, `\"researcher\"`, `\"critic\"`, `\"extraction\"`, `\"rewrite\"`. You are about to discover that one of these costs far more than you expected.\n\nJSONL -- one JSON object per line -- because it appends safely and you can read it with anything.\n\nRun a few tasks, then look at the raw file. That is the Day 1 habit, applied to your own system.\n\n---\n\n### Stage 2 -- Aggregate it\n\n```python\ndef report(log_file=LOG_FILE):\n    rows = [json.loads(line) for line in open(log_file)]\n    if not rows:\n        return print(\"No logs yet.\")\n\n    by_trace = {}\n    by_component = {}\n\n    for row in rows:\n        by_trace.setdefault(row[\"trace\"], []).append(row)\n        c = by_component.setdefault(row[\"component\"],\n                                    {\"calls\": 0, \"usd\": 0, \"tokens\": 0, \"ms\": []})\n        c[\"calls\"] += 1\n        c[\"usd\"] += row[\"usd\"]\n        c[\"tokens\"] += row[\"tokens_in\"] + row[\"tokens_out\"]\n        c[\"ms\"].append(row[\"ms\"])\n\n    print(f\"{len(rows)} calls across {len(by_trace)} requests\")\n    print(f\"total cost: ${sum(r['usd'] for r in rows):.4f}\")\n    print(f\"failure rate: {sum(1 for r in rows if not r['ok'])/len(rows):.1%}\\n\")\n\n    print(f\"{'component':16s} {'calls':>6s} {'tokens':>9s} {'usd':>9s} {'p50ms':>7s} {'p95ms':>7s}\")\n    for name, c in sorted(by_component.items(), key=lambda x: -x[1][\"usd\"]):\n        times = sorted(c[\"ms\"])\n        p50 = times[len(times)//2]\n        p95 = times[int(len(times)*0.95)] if len(times) > 1 else times[0]\n        print(f\"{name:16s} {c['calls']:6d} {c['tokens']:9d} ${c['usd']:8.4f} {p50:7.0f} {p95:7.0f}\")\n\n    costs = sorted(sum(r[\"usd\"] for r in calls) for calls in by_trace.values())\n    print(f\"\\ncost per request: median ${costs[len(costs)//2]:.4f}, \"\n          f\"worst ${costs[-1]:.4f}\")\n```\n\nRun twenty varied tasks, then `report()`.\n\n**Two things will probably surprise you.**\n\n**p95 is much worse than p50.** Median might be 900ms and p95 six seconds. Averages hide this completely, which is why nobody who runs a service quotes averages. Your users experience p95 regularly.\n\n**One component dominates the cost, and it is not the one you expected.** Very often it is memory extraction from Day 11 -- a call on every single turn that you stopped thinking about. Or the multi-query rewrite from Day 12.\n\nYou have now found your optimisation target with evidence instead of intuition.\n\n---\n\n### Stage 3 -- Measure answers, not just retrieval\n\n`evals.py`:\n\n```python\nimport os, json, time\nfrom autonomous import run, Budget\nfrom observability import new_trace\n\nTASKS = [\n    {\"name\": \"simple_lookup\",\n     \"goal\": \"What deadlines are mentioned in my documents?\",\n     \"asserts\": [{\"contains\": \"30 November\"}]},\n\n    {\"name\": \"unanswerable\",\n     \"goal\": \"What is my manager's home address according to my documents?\",\n     \"asserts\": [{\"contains_any\": [\"don't know\", \"not in\", \"no information\", \"not found\"]}]},\n\n    {\"name\": \"save_with_date\",\n     \"goal\": \"Save a note called 'eval-check' containing today's date.\",\n     \"asserts\": [{\"file_exists\": \"notes/eval-check.txt\"},\n                 {\"file_contains\": [\"notes/eval-check.txt\", \"2026\"]}]},\n\n    # ... 10 total. Include at least 2 unanswerable and 2 multi-step.\n]\n\n\ndef check(assertion, result):\n    answer = (result.get(\"answer\") or \"\").lower()\n\n    if \"contains\" in assertion:\n        return assertion[\"contains\"].lower() in answer\n    if \"contains_any\" in assertion:\n        return any(p.lower() in answer for p in assertion[\"contains_any\"])\n    if \"not_contains\" in assertion:\n        return assertion[\"not_contains\"].lower() not in answer\n    if \"file_exists\" in assertion:\n        return os.path.exists(assertion[\"file_exists\"])\n    if \"file_contains\" in assertion:\n        path, text = assertion[\"file_contains\"]\n        return os.path.exists(path) and text.lower() in open(path).read().lower()\n    if \"max_words\" in assertion:\n        return len(answer.split()) \u003c= assertion[\"max_words\"]\n    return False\n\n\ndef run_evals(repeats=3):\n    scores = {}\n\n    for task in TASKS:\n        passes = 0\n        for attempt in range(repeats):\n            new_trace()\n            result = run(task[\"goal\"], budget=Budget(max_steps=12), policy=\"auto\")\n            if all(check(a, result) for a in task[\"asserts\"]):\n                passes += 1\n\n        scores[task[\"name\"]] = passes / repeats\n        flag = \"\" if passes == repeats else (\"  \u003c-- FLAKY\" if passes else \"  \u003c-- ALWAYS FAILS\")\n        print(f\"{task['name']:20s} {passes}/{repeats}{flag}\")\n\n    overall = sum(scores.values()) / len(scores)\n    print(f\"\\noverall: {overall:.0%}\")\n    return scores\n```\n\n**The `file_exists` and `file_contains` assertions are the honest ones**, which is why `os` is in the import line. Everything else inspects the model's own words; these two go and look at the disk. An agent that *says* it saved the note and did not is exactly the failure a text-matching assertion waves through.\n\n**`repeats=3` is the whole point of this stage.**\n\nRun it. You will see something like:\n\n```\nsimple_lookup        3/3\nunanswerable         2/3  \u003c-- FLAKY\nsave_with_date       3/3\nmulti_step           1/3  \u003c-- FLAKY\ncompare_documents    0/3  \u003c-- ALWAYS FAILS\n```\n\n**Look at `unanswerable`: 2 out of 3.** Same task, same documents, same prompt. Twice it correctly said it did not know. Once it made something up.\n\nIf you had run that eval a single time you would have recorded either \"works\" or \"broken\", and both would have been wrong. **This is what statistical means**, and it is why every single-run result earlier in this course was weaker evidence than it looked.\n\nFlaky and always-failing need completely different responses. Always-failing is a bug you can go and fix. Flaky is a reliability number you have to decide whether you can live with.\n\n**Save the scores to a file with a date.** That file is your regression history, and it is the only way to know whether tomorrow's prompt edit helped.\n\n---\n\n### Stage 4 -- The judge, and its bias\n\nFor things assertions cannot check:\n\n```python\nJUDGE_PROMPT = \"\"\"You grade an answer against a question and a rubric.\n\nScore each criterion 1-5:\n- grounded: every claim is supported by the sources given, nothing invented\n- complete: answers everything that was asked\n- clear: a busy person could act on it\n\nReply with JSON only:\n{\"grounded\": n, \"complete\": n, \"clear\": n, \"worst_problem\": \"one sentence\"}\n\nGrade strictly. Length is not quality. A short correct answer beats a long\nvague one. Do not reward confident tone.\"\"\"\n\n\ndef judge(question, answer, sources=\"\"):\n    response = client.chat.completions.create(\n        model=MODEL,\n        messages=[{\"role\": \"system\", \"content\": JUDGE_PROMPT},\n                  {\"role\": \"user\", \"content\":\n                   f\"QUESTION:\\n{question}\\n\\nSOURCES:\\n{sources[:3000]}\\n\\nANSWER:\\n{answer}\"}],\n        temperature=0,\n        response_format={\"type\": \"json_object\"}\n    )\n    return json.loads(response.choices[0].message.content)\n```\n\n**Now calibrate it, which is the part people skip.**\n\nTake ten answers. Grade them yourself, 1 to 5, before looking at anything. Then run the judge and compare.\n\nYou will probably find it scores higher than you do, and that its errors lean in a consistent direction -- usually rewarding length and confidence. `\"Length is not quality\"` and `\"Do not reward confident tone\"` are in the prompt precisely because that bias is well known.\n\n**Use the judge for tracking change over time**, where a consistent bias cancels out. Do not use it as ground truth for whether something is good enough.\n\n---\n\n### Stage 5 -- Survive failure\n\n`reliability.py`:\n\n```python\nimport time, json\n\nPRIMARY = \"llama-3.3-70b-versatile\"\nFALLBACK = \"llama-3.1-8b-instant\"\n\n\ndef robust_call(messages, tools=None, component=\"agent\", timeout=30):\n    for model in (PRIMARY, FALLBACK):\n        for attempt in range(3):\n            try:\n                start = time.time()\n                response = client.chat.completions.create(\n                    model=model, messages=messages, tools=tools, timeout=timeout)\n                log_call(model, component,\n                         response.usage.prompt_tokens,\n                         response.usage.completion_tokens,\n                         (time.time()-start)*1000)\n                if model != PRIMARY:\n                    print(f\"  [using fallback model {model}]\")\n                return response\n            except Exception as error:\n                name = type(error).__name__\n                log_call(model, component, 0, 0, 0, ok=False, error=f\"{name}: {error}\"[:200])\n\n                if \"RateLimit\" in name:\n                    time.sleep(2 ** attempt)\n                    continue\n                break   # not a rate limit: try the other model instead\n\n    raise RuntimeError(\"All models failed.\")\n\n\ndef json_with_repair(messages, schema_hint, tries=2):\n    \"\"\"Get valid JSON, or fix it once by showing the model its own error.\"\"\"\n    for attempt in range(tries):\n        response = robust_call(messages, component=\"json\")\n        raw = response.choices[0].message.content\n        try:\n            return json.loads(raw.strip().strip(\"`\").removeprefix(\"json\").strip())\n        except json.JSONDecodeError as error:\n            if attempt == tries - 1:\n                raise\n            messages = messages + [\n                {\"role\": \"assistant\", \"content\": raw},\n                {\"role\": \"user\", \"content\":\n                 f\"That was not valid JSON: {error}. Required shape: {schema_hint}. \"\n                 f\"Reply with only the corrected JSON.\"}\n            ]\n    raise RuntimeError(\"Could not get valid JSON.\")\n```\n\n**Three things doing real work.**\n\n`timeout=30` -- the missing piece from Day 9. A hanging call now fails instead of freezing everything.\n\n**The fallback is a different model, not just a retry.** Rate limit means wait and retry. Anything else means the primary model is not going to work, so switch. Retrying the same failing thing three times is how you turn a 5-second failure into a 30-second one.\n\n**JSON repair shows the model its own error.** This works remarkably well -- far better than retrying with an identical prompt and hoping.\n\n**Test it properly.** Set `PRIMARY = \"this-model-does-not-exist\"` and run a task. It should fall back and complete. If it crashes, your error handling is decorative.\n\n---\n\n### Stage 6 -- Cut the cost, and prove it\n\nNow use Stage 2's report to target the right thing.\n\n**Model routing -- usually the biggest win.**\n\nYou built the classifier on Day 3. Use it:\n\n```python\nSIMPLE_COMPONENTS = {\"classify\", \"extraction\", \"rewrite\", \"judge\"}\n\ndef model_for(component, goal=\"\"):\n    if component in SIMPLE_COMPONENTS:\n        return FALLBACK        # 8b: about 10x cheaper\n    if len(goal) \u003c 60 and \"?\" in goal:\n        return FALLBACK\n    return PRIMARY\n```\n\nLook at the numbers: the 70b model costs roughly $0.59 per million input tokens, the 8b about $0.05. **Ten times cheaper.** Memory extraction, query rewriting and classification do not need a 70b model -- they are narrow, structured jobs.\n\n**Caching.**\n\n```python\n_cache = {}\n\ndef cached_call(messages, component, ttl=3600):\n    key = json.dumps(messages, sort_keys=True)[:2000]\n    hit = _cache.get(key)\n    if hit and time.time() - hit[\"at\"] \u003c ttl:\n        log_call(\"cache\", component, 0, 0, 0)\n        return hit[\"value\"]\n\n    value = robust_call(messages, component=component)\n    _cache[key] = {\"value\": value, \"at\": time.time()}\n    return value\n```\n\nOnly cache things that should be deterministic -- classification, extraction, rewriting. **Never cache a conversational reply**, or a user will get someone else's answer.\n\n**Now prove it worked.** Clear your logs, run the same twenty tasks, and compare:\n\n```\nbefore:  $0.0412 per task,  p50 1,240ms\nafter:   $0.0121 per task,  p50   680ms\n```\n\n**Then immediately re-run `run_evals()`.** Cost reductions cause quality regressions, and the small model may be worse at something. If your score dropped from 82% to 71%, you did not save money -- you bought cheapness with quality, and now you can decide whether that trade is acceptable instead of discovering it from a user.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **Observability** | Being able to tell what happened after the fact. |\n| **Trace id** | One id tying every call in a request together. |\n| **Structured logging** | Logs as data, not prose, so you can aggregate them. |\n| **p50 / p95** | Median and near-worst-case latency. p95 is what users feel. |\n| **Eval** | A fixed task set you score repeatedly. |\n| **Regression** | A change that quietly made something worse. |\n| **LLM-as-judge** | A model grading output. Useful, biased, needs calibration. |\n| **Flaky** | Passes sometimes. Different problem from always failing. |\n| **Circuit breaker** | Stop calling a failing service instead of hammering it. |\n| **Graceful degradation** | Doing less, well, instead of failing entirely. |\n| **Model routing** | Small model for easy jobs. Usually the biggest saving. |\n| **Cost per task** | The number that matters commercially. |\n| **Canary** | Trying a change on a small slice before everyone. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Run the same eval three times.**\nNo changes between runs.\n*You will see:* different scores.\n*It teaches:* the single most important idea today. If you measured it once, you did not measure it.\n\n**2. Kill the primary model.**\nSet `PRIMARY` to a name that does not exist.\n*You will see:* whether fallback actually works.\n*It teaches:* untested error handling is decoration.\n\n**3. Calibrate the judge.**\nGrade ten answers yourself, then compare with the judge.\n*You will see:* it is more generous than you, and consistently so.\n*It teaches:* judges track change well and measure absolute quality badly.\n\n**4. Route everything to the small model.**\nThen re-run the evals.\n*You will see:* about 10x cheaper, and some tasks now fail.\n*It teaches:* cost and quality are one dial. Now you can price the trade.\n\n**5. Compare p50 and p95.**\nRun 30 requests and look at both.\n*You will see:* a gap much bigger than you expected.\n*It teaches:* averages hide the experience your users actually have.\n\n**6. Break a prompt on purpose.**\nRemove the escape hatch from Day 3. Re-run evals.\n*You will see:* the `unanswerable` tasks collapse, everything else holds.\n*It teaches:* what a regression test catches, from the inside.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- measuring once**\n*Symptom:* confident conclusions from single runs.\n*Fix:* repeat everything at least three times. Report rates.\n\n**Trap 2 -- trusting the judge**\n*Symptom:* scores of 4.6 and unhappy users.\n*Fix:* calibrate against your own grading, and keep hard assertions wherever a hard assertion is possible.\n\n**Trap 3 -- an eval set that is too easy**\n*Symptom:* 95% forever, no signal.\n*Fix:* include the unanswerable, the multi-step, and the ones you know are broken.\n\n**Trap 4 -- optimising before measuring**\n*Symptom:* a week spent on something that was 3% of the cost.\n*Fix:* Stage 2 first. The dominant component is usually not the obvious one.\n\n**Trap 5 -- no trace id**\n*Symptom:* logs you cannot join up.\n*Fix:* `ContextVar`, set once per request.\n\n**Trap 6 -- personal data in logs**\n*Symptom:* a permanent file of user questions and retrieved documents.\n*Fix:* log token counts, latency and ids. Do not log message contents by default. If you need contents for debugging, keep them separate, short-lived, and access-controlled.\n\n---\n\n## 10. Check yourself\n\n1. Why does \"it works\" mean nothing for this kind of system, and what replaces it?\n2. What is the difference between a flaky task and an always-failing one, and why treat them differently?\n3. Why is p95 more useful than the average?\n4. Name two biases of an LLM judge, and say what judges are actually good for.\n5. You cut cost by 70%. What must you do immediately afterwards, and why?\n\n---\n\n## 11. Where this goes\n\n- **Day 16 and 17** bring frameworks. Run today's evals against the framework version -- that is how you find out whether it is actually better, rather than just newer.\n- **Day 18** builds the research agent. Today's eval set is how you know it works.\n- **Day 20** deploys it. Logging, tracing, timeouts and budget caps stop being good practice and become requirements.\n- **Day 21** is where cost per task becomes the number that decides whether the thing is viable.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 15:\n\nFolders:\n  research-assistant/\n    ai/\n      observability.py     (NEW - trace ids, structured logging, cost, report)\n      evals.py             (NEW - task eval set with repeats)\n      reliability.py       (NEW - timeout, fallback model, JSON repair)\n      logs/calls.jsonl     (NEW - one JSON object per model call)\n      chat.py, agent.py, autonomous.py, planner.py, memory.py\n      multi_agent.py, retrieval.py, golden_set.py, security.py\n      vector_store.py, embeddings.py, documents.py, tools.py\n      mcp_agent.py, mcp_client.py, mcp_servers/my_tools.py\n      prompts.py, classify.py, test_prompt.py\n      runs/, notes/, documents/, chroma_db/\n    dashboard/             (still empty)\n\nLibraries: no new installs (contextvars, json, time are standard library)\n\nobservability.py:\n  _trace = ContextVar  -> set once per request, picked up automatically by\n      every nested agent call including the asyncio fan-out from Day 14,\n      with no need to thread it through function signatures\n  new_trace(), cost_of(model, in, out), log_call(...)\n  PRICING per million tokens: 70b ~$0.59/$0.79, 8b ~$0.05/$0.08 (verify)\n  every call logged as JSONL: time, trace, component, model, tokens_in,\n      tokens_out, ms, usd, ok, error\n  report() aggregates by component: calls, tokens, usd, p50, p95\n      and cost per request (median and worst)\n\nevals.py:\n  10 tasks, each with assertions: contains / contains_any / not_contains /\n      file_exists / file_contains / max_words\n  includes at least 2 unanswerable and 2 multi-step tasks\n  run_evals(repeats=3)  \u003c- THE KEY DESIGN. Every task runs 3 times.\n      Output distinguishes FLAKY (passes sometimes) from ALWAYS FAILS\n      (a real bug). A single run cannot tell these apart.\n  scores saved with a date, as regression history\n\n  judge(question, answer, sources) - LLM-as-judge, JSON, criteria:\n      grounded / complete / clear, 1-5 each\n      prompt explicitly says length is not quality and not to reward\n      confident tone, because judges are biased toward both\n      CALIBRATED against manual grading of 10 answers; it scored higher\n      than manual grading, consistently. Use it to track CHANGE over time,\n      never as ground truth.\n\nreliability.py:\n  robust_call() - timeout=30 (the missing Day 9 piece), retries only on\n      rate limits, otherwise switches to the FALLBACK model rather than\n      retrying a model that is not going to work\n  json_with_repair() - on invalid JSON, sends the model its own output\n      plus the parse error and asks for a correction. Far more effective\n      than retrying an identical prompt.\n\nCost work:\n  model_for(component, goal) routes classify / extraction / rewrite / judge\n      to the 8b model, which is roughly 10x cheaper\n  cached_call() for deterministic components only; conversational replies\n      are NEVER cached\n  measured before/after, then RE-RAN THE EVALS, because cost reductions\n  cause quality regressions and the small model is worse at some tasks\n\nFindings worth remembering:\n  - the same eval run 3 times gives different scores; \"unanswerable\" tasks\n    are the flakiest\n  - p95 latency is far worse than p50; averages hide what users experience\n  - the dominant cost component was NOT the obvious one (memory extraction\n    on every turn, and multi-query rewriting, are common culprits)\n\nKey decisions made:\n  - every measurement is repeated; rates replace pass/fail\n  - hard assertions preferred wherever possible; the judge only fills gaps\n  - logs contain token counts and ids, NOT message contents, because that\n    would be a permanent file of user questions and document text\n\nKnown problems, left for later:\n  - the cache is in memory only, lost on restart\n  - no per-user rate limits or daily budget caps yet (Day 20)\n  - no circuit breaker; repeated provider failure is retried every time\n  - eval set is 10 tasks; small, and written by the same person who wrote\n    the system\n```\n\n---\n\n## Answers\n\n**1.** Because the same input can produce a different result each time, so a single success proves almost nothing. It is replaced by rates measured over repeated runs -- success rate, cost per task, p50 and p95 latency, failure rate.\n\n**2.** Always-failing is a deterministic bug you can find and fix. Flaky is a probability, and no amount of debugging removes it entirely -- you either make it less likely or decide the rate is acceptable. Treating a flaky task as a bug leads to hours of chasing something that was never broken in a fixable way.\n\n**3.** Because averages are dragged toward the middle and hide the tail. p95 is what a meaningful share of your users actually experience, and it is where timeouts and abandonment happen.\n\n**4.** They reward length and they reward confident tone (and they tend to favour text from their own model family). They are good for tracking whether a change made things better or worse, because a consistent bias cancels out across comparisons. They are bad at absolute judgements of quality.\n\n**5.** Re-run the evals. Cost reductions almost always come from using a weaker model or sending less context, both of which can reduce quality. Without re-measuring you have not saved money, you have made an untracked trade.\n"},{"file":"day-16.md","title":"Day 16 -- LangGraph","module":"04 -- Frameworks","time":"about 1 hour","minutes":19,"md":"# Day 16 -- LangGraph\n\n**Module:** 04 -- Frameworks\n**Time:** about 1 hour\n**Builds on:** Day 7 -- the agent loop; Day 9 -- approval; Day 11 -- state\n\n---\n\n## 1. Today in one line\n\nYou rebuild your agent as an explicit graph -- and recognise every single piece, because you already built all of them by hand.\n\n---\n\n## 2. A word before you start\n\n**You are now allowed to use a framework, because you no longer need one.**\n\nThat is the reason the syllabus put Days 16 to 19 at the end. Everything LangGraph does, you have written: the loop, the state, the tool dispatch, the approval gate, the step limit. Today you find out what the framework calls those things, and what it gives you that your version did not.\n\nTwo rules for the next four days:\n\n1. **Map every framework concept back to your own code.** If you cannot say which of your files a feature replaces, you do not understand it yet.\n2. **Keep looking at what it sends.** Frameworks build their reputation on hiding the prompt. The people who can debug agents in production are the ones who still open the box.\n\n---\n\n## 3. The problem\n\nYour `agent.py` works. Here is what it cannot do.\n\n**The control flow is invisible.** Your agent's logic is spread across an `if`, a `for`, and three `append` calls. Nobody can look at that and see the shape. You cannot draw it.\n\n**It cannot resume.** Kill the program at step 12 of a 20-step task and everything is gone. There is no way to come back tomorrow and continue.\n\n**Approval kills the process.** Day 9's `input(\"allow?\")` blocks. That works in a terminal and is useless in a web app, where the approval might come back four minutes later from a different request.\n\n**Branching gets ugly.** Add \"if the question is simple, skip research entirely\" and you are nesting conditions inside a loop that already has three exit paths.\n\n**You have written the same loop five times** -- `agent.py`, `autonomous.py`, `planner.py`, `multi_agent.py`, `mcp_agent.py`. Each slightly different. Fix a bug in one and the other four still have it.\n\nLangGraph addresses all five. It also hides things, which is why Stage 6 exists.\n\n---\n\n## 4. Mental model\n\n**Your agent is a state machine. You just wrote it implicitly.**\n\nLook at what your loop really does:\n\n- there is a **state** (the message list) passed from step to step\n- there are **nodes** (call the model, run the tools)\n- there are **edges** (after calling the model, go to tools *or* finish)\n\nLangGraph makes that explicit. You declare the nodes, declare the edges, and it runs the machine.\n\nThat is the entire idea. The framework does not add intelligence. It takes the structure that was hiding in your control flow and makes it a thing you can see, draw, pause and resume.\n\n**Where this comparison breaks:**\n\nA state machine is fixed structure, and agents need to be dynamic. LangGraph's answer is **conditional edges** -- functions that look at the state and decide where to go next. They do a lot of work, and a graph with many of them becomes just as hard to read as your nested `if` statements were. The structure helps until it does not.\n\n**The translation table.** Keep this next to you today:\n\n| Your code | LangGraph |\n|---|---|\n| `messages` list | the state |\n| `while` loop | a cycle in the graph |\n| `if message.tool_calls:` | a conditional edge |\n| running the tool | a `ToolNode` |\n| `max_steps` | `recursion_limit` |\n| `input(\"allow?\")` | `interrupt` |\n| `save_history()` | a checkpointer |\n| `compress_scratchpad()` | a node |\n\n---\n\n## 5. Setup\n\n```bash\ncd research-assistant/ai\nsource venv/bin/activate\n\npip install langgraph langchain langchain-openai\npip freeze > requirements.txt\n\ntouch graph_agent.py\n```\n\n**Why `langchain` as well as `langchain-openai`.** LangChain is split into several packages: `langchain-core` (the base types), `langchain-openai` (the provider), `langgraph` (today's graph runtime), and `langchain` itself (the top-level package). Stage 6 uses `langchain.globals`, which lives in that last one, and nothing else installs it for you.\n\n**Groq works unchanged**, because of the decision you made on Day 1:\n\n```python\nllm = ChatOpenAI(model=\"llama-3.3-70b-versatile\",\n                 base_url=\"https://api.groq.com/openai/v1\",\n                 api_key=os.environ[\"GROQ_API_KEY\"])\n```\n\nSame OpenAI-compatible client, pointed at Groq. That Day 1 choice is still paying for itself sixteen days later.\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- Your Day 7 agent, as a graph\n\n`graph_agent.py`:\n\n```python\nimport os\nfrom typing import Annotated, TypedDict\nfrom dotenv import load_dotenv\nfrom langchain_openai import ChatOpenAI\nfrom langchain_core.tools import tool\nfrom langgraph.graph import StateGraph, START, END\nfrom langgraph.graph.message import add_messages\nfrom langgraph.prebuilt import ToolNode, tools_condition\n\nimport tools as my_tools\n\nload_dotenv()\n\nllm = ChatOpenAI(model=\"llama-3.3-70b-versatile\",\n                 base_url=\"https://api.groq.com/openai/v1\",\n                 api_key=os.environ[\"GROQ_API_KEY\"])\n\n\n@tool\ndef search_documents(query: str) -> str:\n    \"\"\"Search the user's own documents and notes by meaning.\"\"\"\n    return my_tools.search_documents(query)\n\n\n@tool\ndef get_current_time(timezone: str = \"Asia/Kolkata\") -> str:\n    \"\"\"Get the current date and time in a timezone.\"\"\"\n    return my_tools.get_current_time(timezone)\n\n\n@tool\ndef save_note(title: str, content: str) -> str:\n    \"\"\"Save a note to a file for the user.\"\"\"\n    return my_tools.save_note(title, content)\n\n\nTOOLS = [search_documents, get_current_time, save_note]\nllm_with_tools = llm.bind_tools(TOOLS)\n\n\nclass State(TypedDict):\n    messages: Annotated[list, add_messages]\n\n\ndef call_model(state: State):\n    return {\"messages\": [llm_with_tools.invoke(state[\"messages\"])]}\n\n\nbuilder = StateGraph(State)\nbuilder.add_node(\"model\", call_model)\nbuilder.add_node(\"tools\", ToolNode(TOOLS))\n\nbuilder.add_edge(START, \"model\")\nbuilder.add_conditional_edges(\"model\", tools_condition)\nbuilder.add_edge(\"tools\", \"model\")\n\ngraph = builder.compile()\n\n\nif __name__ == \"__main__\":\n    result = graph.invoke({\"messages\": [\n        (\"user\", \"Save a note called 'graph-test' with today's date and anything my documents say about deadlines.\")\n    ]})\n    print(result[\"messages\"][-1].content)\n```\n\nRun it. It completes the multi-step task.\n\n**Now read the graph definition against your Day 7 code.**\n\n```\nSTART -> model\nmodel -> tools (if the model asked for tools)\nmodel -> END   (if it answered)\ntools -> model\n```\n\nThat is your `while` loop, drawn. `tools -> model` is the cycle. `tools_condition` is your `if message.tool_calls:`. `ToolNode` is your dispatch code -- the `json.loads`, the lookup, the `role: \"tool\"` append, all of it.\n\n**Everything you wrote by hand is there, with names.** Nothing new is happening, and that is exactly what you should be checking for.\n\n---\n\n### Stage 2 -- State and reducers\n\n`Annotated[list, add_messages]` deserves a proper look, because it is the piece that confuses people.\n\nA node returns a **partial** state -- just what it changed:\n\n```python\nreturn {\"messages\": [new_message]}\n```\n\nA **reducer** decides how that merges into the existing state. `add_messages` appends rather than replaces, and also handles message ids so an update to an existing message replaces it rather than duplicating.\n\nWithout a reducer, returning `{\"messages\": [x]}` would **overwrite** your whole history with a one-item list. Your agent would forget everything every step -- exactly the Day 1 bug, reintroduced by a framework detail.\n\nAdd your own state fields:\n\n```python\nimport operator\n\nclass State(TypedDict):\n    messages: Annotated[list, add_messages]\n    steps: Annotated[int, operator.add]      # each node returns 1, they sum\n    findings: list                           # no reducer: last write wins\n```\n\n```python\ndef call_model(state: State):\n    return {\"messages\": [llm_with_tools.invoke(state[\"messages\"])],\n            \"steps\": 1}\n```\n\n**The rule to remember:** a node **returns** its changes, it never mutates state in place. Mutating works sometimes and fails silently with checkpointing, which is a miserable bug to track down.\n\n---\n\n### Stage 3 -- Persistence, and something your code cannot do\n\n```python\nfrom langgraph.checkpoint.memory import MemorySaver\n\nmemory = MemorySaver()\ngraph = builder.compile(checkpointer=memory)\n\nconfig = {\"configurable\": {\"thread_id\": \"conversation-1\"}}\n\ngraph.invoke({\"messages\": [(\"user\", \"My name is Rahul.\")]}, config)\ngraph.invoke({\"messages\": [(\"user\", \"What's my name?\")]}, config)\n```\n\nThe second call knows. The state was saved against `thread_id` and reloaded.\n\n**`thread_id` is the whole mechanism.** Different id, different conversation. This is how one deployed agent serves many users -- and it is exactly the `user` field you put in your memory metadata on Day 11, now appearing as a first-class concept.\n\nInspect it:\n\n```python\nsnapshot = graph.get_state(config)\nprint(f\"{len(snapshot.values['messages'])} messages\")\nprint(f\"next node: {snapshot.next}\")\n\nfor old in graph.get_state_history(config):\n    print(old.config[\"configurable\"][\"checkpoint_id\"], old.next)\n```\n\n**`get_state_history` is genuinely new.** You can rewind to an earlier checkpoint and run forward again from there. Your `runs/*.json` recorded what happened; this lets you go back and change it. For debugging a long agent run, that is a real capability you did not have.\n\n`MemorySaver` is in-memory. `langgraph-checkpoint-sqlite` gives you a real file, which is what you want from Day 20.\n\n---\n\n### Stage 4 -- Approval that does not block\n\nDay 9's approval called `input()` and froze the program. In a web app that is unusable.\n\n```python\ngraph = builder.compile(checkpointer=memory, interrupt_before=[\"tools\"])\n\nconfig = {\"configurable\": {\"thread_id\": \"approval-1\"}}\n\nresult = graph.invoke({\"messages\": [(\"user\", \"Save a note called 'test' saying hello.\")]}, config)\n\nsnapshot = graph.get_state(config)\npending = snapshot.values[\"messages\"][-1]\nprint(\"wants to call:\", pending.tool_calls)\n\nif input(\"allow? (y/n): \") == \"y\":\n    result = graph.invoke(None, config)      # None = resume from the checkpoint\n    print(result[\"messages\"][-1].content)\nelse:\n    print(\"refused\")\n```\n\n**Look at `graph.invoke(None, config)`.** Passing `None` means \"carry on from where you stopped\". The process could have exited in between. The approval could arrive tomorrow, from a different machine, over HTTP.\n\nThat is the difference between a terminal script and something deployable, and it is not a difference you could have bolted onto your Day 9 code without building the whole checkpoint mechanism yourself.\n\n**Approve only what matters:**\n\n```python\ndef approval_needed(state):\n    last = state[\"messages\"][-1]\n    if any(c[\"name\"] == \"save_note\" for c in getattr(last, \"tool_calls\", [])):\n        return \"approval\"\n    return \"tools\"\n```\n\nDay 13's least privilege, as a routing decision.\n\n---\n\n### Stage 5 -- Branch\n\nNow the thing that was awkward in your code. Route simple questions past the whole agent:\n\n```python\nfrom typing import Literal\n\ndef route(state: State) -> Literal[\"model\", \"quick\"]:\n    question = state[\"messages\"][-1].content\n    verdict = llm.invoke([\n        (\"system\", \"Reply with exactly one word: SIMPLE if this can be answered \"\n                   \"from general knowledge, RESEARCH if it needs the user's own \"\n                   \"documents or a tool.\"),\n        (\"user\", question)\n    ]).content.strip().upper()\n    return \"quick\" if \"SIMPLE\" in verdict else \"model\"\n\n\ndef quick_answer(state: State):\n    return {\"messages\": [llm.invoke(state[\"messages\"])]}\n```\n\n**Stage 5 replaces the Stage 1 wiring, so build a fresh graph.** Do not add the conditional edge to the builder you already used: Stage 1 put a plain `START -> model` edge on it, and adding `add_conditional_edges(START, ...)` on top leaves you with two conflicting routes out of `START`. A graph also has to be compiled *after* every node and edge is on the builder -- the `graph` object from Stage 1 was compiled before `quick` existed, so it does not contain it.\n\nBuild the whole thing in one place, start to finish:\n\n```python\nbuilder = StateGraph(State)                   # a NEW builder, deliberately\n\nbuilder.add_node(\"model\", call_model)\nbuilder.add_node(\"tools\", ToolNode(TOOLS))\nbuilder.add_node(\"quick\", quick_answer)\n\nbuilder.add_conditional_edges(START, route, {\"model\": \"model\", \"quick\": \"quick\"})\nbuilder.add_conditional_edges(\"model\", tools_condition)\nbuilder.add_edge(\"tools\", \"model\")\nbuilder.add_edge(\"quick\", END)\n\ngraph = builder.compile(checkpointer=memory)  # recompile, with quick included\n```\n\nThe only line removed from Stage 1 is `builder.add_edge(START, \"model\")`; the conditional edge now owns that decision. Everything else is the same wiring you already read, written out once so there is no doubt about which version is compiled.\n\nNow \"what is the capital of France\" costs one call with no tools, and \"what do my documents say about deadlines\" goes through the full agent.\n\n**That is Day 15's model routing, as graph structure.** The cost saving is the same; what changed is that the decision is now visible in the diagram instead of buried in a function.\n\nPrint the graph:\n\n```python\nprint(graph.get_graph().draw_ascii())\n```\n\n**Keep that output.** Being able to draw your agent is worth more than it sounds when you are explaining it to someone, or to yourself in three weeks.\n\n---\n\n### Stage 6 -- Open the box\n\nThe anti-magic stage. Do not skip it.\n\n**See the actual prompt:**\n\n```python\nfrom langchain.globals import set_debug\n\nset_debug(True)\ngraph.invoke({\"messages\": [(\"user\", \"What time is it in Tokyo?\")]})\n```\n\n**Not `langchain.debug = True`.** You will see that in every older tutorial. Setting the module attribute directly is deprecated -- `set_debug(True)` is the supported switch, and `set_debug(False)` turns it off again. Same output, and it is a small live example of Trap 2 later in this file.\n\nRead what it sends. Compare it against the message list you built by hand on Day 4. **Note any extra text the framework added that you did not write** -- framework prompt wrappers cost tokens on every single call, and you are paying for them.\n\n**Watch it step by step:**\n\n```python\nfor event in graph.stream({\"messages\": [(\"user\", \"Find deadlines and save a note.\")]},\n                          stream_mode=\"values\"):\n    last = event[\"messages\"][-1]\n    print(f\"{type(last).__name__}: {str(last.content)[:100]}\")\n```\n\n**Then run your Day 15 evals against it.** This is the real test:\n\n```python\n# in evals.py, swap the runner for the graph version\n```\n\nCompare: success rate, tokens per task, latency. **The framework version is often slightly more expensive** because of its prompt wrapping, and roughly the same on quality -- because it is the same model doing the same work.\n\n**So what did you actually buy?** Persistence, resumable interrupts, visible structure, streaming, and one loop instead of five. Those are real and worth having. What you did not buy is better answers, and anyone who implies otherwise is selling something.\n\n**And set your step limit**, because the equivalent of `max_steps` is not on by default:\n\n```python\ngraph.invoke(inputs, {\"recursion_limit\": 25, **config})\n```\n\nWithout it, a looping graph runs to LangGraph's own default and can burn your quota -- the Day 7 lesson, in a new costume.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **StateGraph** | The graph you define. |\n| **Node** | A function taking state and returning changes. |\n| **Edge** | A transition between nodes. |\n| **Conditional edge** | A function choosing the next node. Your `if`. |\n| **State** | The data passed along. Your message list, plus extras. |\n| **Reducer** | How a node's return merges into state. `add_messages` appends. |\n| **ToolNode** | Prebuilt node that runs tool calls. Your dispatch code. |\n| **tools_condition** | Prebuilt edge checking for tool calls. |\n| **Checkpointer** | Saves state so a run can be resumed. |\n| **thread_id** | Which conversation a checkpoint belongs to. |\n| **interrupt** | Pause before a node, for approval. |\n| **Time travel** | Rewinding to an earlier checkpoint. |\n| **recursion_limit** | The step cap. Your `max_steps`. |\n| **Streaming** | Emitting events as the graph runs. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Remove the reducer.**\nChange `messages: Annotated[list, add_messages]` to `messages: list`. Run a tool task.\n*You will see:* it forgets everything each step, or breaks outright.\n*It teaches:* what reducers are for, by removing one. This is the confusing bug people hit in week one with LangGraph.\n\n**2. Mutate instead of returning.**\nHave a node do `state[\"messages\"].append(x)` and return `{}`.\n*You will see:* it may appear to work, then behave oddly with a checkpointer.\n*It teaches:* return changes, never mutate.\n\n**3. Remove the recursion limit.**\nMake a graph that loops, and give it an impossible task. Watch your quota.\n*It teaches:* `max_steps` did not stop mattering because you changed library.\n\n**4. Read the raw prompt.**\n`from langchain.globals import set_debug` then `set_debug(True)`, and compare to your Day 4 messages.\n*You will see:* extra wrapping you did not write.\n*It teaches:* frameworks cost tokens. Know how many.\n\n**5. Resume across a restart.**\nSQLite checkpointer, start a task, kill the program, restart, resume with the same `thread_id`.\n*You will see:* it continues.\n*It teaches:* the clearest thing LangGraph gives you that your code did not.\n\n**6. Run your evals on both.**\nDay 15's eval set, hand-written agent versus graph.\n*You will see:* similar quality, slightly higher cost.\n*It teaches:* what frameworks buy, and what they do not.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- reducer confusion**\n*Symptom:* state disappears or duplicates.\n*Fix:* `add_messages` for messages, `operator.add` for counters, nothing for last-write-wins.\n\n**Trap 2 -- mutating state**\n*Symptom:* works in testing, breaks with checkpointing.\n*Fix:* always return a dict of changes.\n\n**Trap 3 -- no recursion limit**\n*Symptom:* runaway cost.\n*Fix:* set it explicitly on every invoke.\n\n**Trap 4 -- forgetting thread_id**\n*Symptom:* checkpointer configured, nothing persists.\n*Fix:* `config={\"configurable\": {\"thread_id\": ...}}` on every call, and a different id per user.\n\n**Trap 5 -- MemorySaver in production**\n*Symptom:* state lost on restart.\n*Fix:* SQLite or Postgres checkpointer.\n\n**Trap 6 -- version churn**\n*Symptom:* tutorials from four months ago do not run.\n*Cause:* LangGraph and LangChain move quickly and rename things.\n*Fix:* pin versions in `requirements.txt`, and prefer the official docs over blog posts. When something does not exist any more, check the current API rather than assuming you made a mistake.\n\n---\n\n## 10. Check yourself\n\n1. Map four of your Day 7 code pieces to their LangGraph names.\n2. What does a reducer do, and what breaks without `add_messages`?\n3. What can a checkpointer do that your Day 9 code could not?\n4. Why is `interrupt` better than `input(\"allow?\")` for a deployed app?\n5. What does LangGraph give you, and what does it not?\n\n---\n\n## 11. Where this goes\n\n- **Day 17 (CrewAI)** is the same problem with a different shape: roles and tasks rather than nodes and edges. Comparing the two is the point of doing both.\n- **Day 18** builds the research agent, and you choose which framework -- or none -- with evidence from your evals.\n- **Day 19 (LangChain)** is the layer underneath. Some of it is useful, some is a thin wrapper you do not need.\n- **Day 20** is where checkpointing stops being a nice feature. Persistence and resumable interrupts are what let an agent survive a deployment.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 16:\n\nFolders:\n  research-assistant/\n    ai/\n      graph_agent.py       (NEW - the agent as a LangGraph StateGraph)\n      observability.py, evals.py, reliability.py, logs/\n      chat.py, agent.py, autonomous.py, planner.py, memory.py\n      multi_agent.py, retrieval.py, golden_set.py, security.py\n      vector_store.py, embeddings.py, documents.py, tools.py\n      mcp_agent.py, mcp_client.py, mcp_servers/my_tools.py\n      prompts.py, classify.py, test_prompt.py\n      runs/, notes/, documents/, chroma_db/\n    dashboard/             (still empty)\n\nLibraries: langgraph, langchain, langchain-openai (NEW)\n  langchain itself is needed for langchain.globals.set_debug; the provider\n  package does not pull it in\n\nGroq works unchanged:\n  ChatOpenAI(model=\"llama-3.3-70b-versatile\",\n             base_url=\"https://api.groq.com/openai/v1\", api_key=...)\n  The Day 1 decision to use the OpenAI-compatible client is still paying off.\n\ngraph_agent.py:\n  State = TypedDict with messages: Annotated[list, add_messages]\n  nodes: \"model\" (calls llm_with_tools), \"tools\" (prebuilt ToolNode)\n  edges: START->model, model->[tools|END] via tools_condition, tools->model\n  tools wrapped with @tool from langchain_core, delegating to tools.py\n\nTHE TRANSLATION TABLE (what each framework concept replaces):\n  messages list          -> the state\n  while loop             -> the tools->model cycle\n  if message.tool_calls  -> tools_condition (a conditional edge)\n  tool dispatch code     -> ToolNode\n  max_steps              -> recursion_limit (NOT on by default - set it)\n  input(\"allow?\")        -> interrupt_before=[\"tools\"]\n  save_history()         -> checkpointer\n  compress_scratchpad()  -> a node\n\nReducers:\n  a node RETURNS partial state, it never mutates in place\n  add_messages appends and handles message ids\n  without it, {\"messages\":[x]} OVERWRITES the whole history - the Day 1\n  amnesia bug, reintroduced by a framework detail\n  operator.add for counters, no reducer = last write wins\n\nPersistence:\n  MemorySaver for testing, SQLite checkpointer for anything real\n  thread_id in config identifies the conversation; different id = different\n  user. This is the Day 11 \"user\" metadata field as a first-class concept.\n  get_state() and get_state_history() allow rewinding to an earlier\n  checkpoint and running forward again - genuinely new, runs/*.json only\n  recorded what happened\n\nInterrupts:\n  interrupt_before=[\"tools\"] pauses; graph.invoke(None, config) resumes\n  the process can exit in between, so approval can arrive later from a\n  different request. Day 9's blocking input() could never do this.\n  a conditional router sends only save_note through the approval node\n\nBranching:\n  a route() conditional edge from START sends simple questions to a \"quick\"\n  node with no tools. This is Day 15 model routing, made visible in the\n  graph instead of buried in a function.\n  the branching version is built on a FRESH builder: the plain START->model\n  edge is dropped (two edges out of START conflict), and compile() runs\n  after the \"quick\" node is added, or the compiled graph will not contain it\n\nMeasured against Day 15 evals (hand-written vs graph):\n  quality: about the same (same model, same work)\n  cost: slightly HIGHER, due to framework prompt wrapping\n  what was actually gained: persistence, resumable interrupts, visible\n  structure, streaming, and ONE loop instead of five copies\n\nKey decisions made:\n  - only adopted a framework after building everything by hand\n  - every concept mapped back to the equivalent hand-written code\n  - set_debug(True) from langchain.globals used to read the ACTUAL prompt\n    sent, and the framework's added wrapper text counted as a cost\n    (langchain.debug = True is the deprecated form seen in old tutorials)\n  - recursion_limit set explicitly on every invoke\n\nKnown problems, left for later:\n  - the five hand-written loops still exist and have not been consolidated\n  - MemorySaver is in-memory; SQLite needed before deployment\n  - the Day 14 multi-agent system has not been ported to a graph\n  - framework prompt wrapping adds tokens to every call\n  - LangGraph and LangChain change fast; versions must be pinned\n```\n\n---\n\n## Answers\n\n**1.** The `messages` list is the state; the `while` loop is the `tools -> model` cycle; `if message.tool_calls:` is `tools_condition`; the tool dispatch code is `ToolNode`; `max_steps` is `recursion_limit`; `input(\"allow?\")` is `interrupt`.\n\n**2.** A reducer decides how a node's returned changes merge into the existing state. `add_messages` appends new messages and handles ids. Without it, returning `{\"messages\": [x]}` replaces the whole history with a single message, so the agent forgets everything each step.\n\n**3.** Save state and resume it later, including after the process has exited, and rewind to an earlier checkpoint to run forward again from there. Day 9's runs recorded what happened but could not continue or replay.\n\n**4.** Because `input()` blocks the process. `interrupt` saves a checkpoint and returns, so the approval can arrive minutes later, over HTTP, from a different machine -- which is what a web application actually needs.\n\n**5.** It gives persistence, resumable interrupts, visible structure, streaming, and one implementation of the loop instead of several copies. It does not give better answers -- same model, same tools, same work -- and it costs slightly more per call because of its own prompt wrapping.\n"},{"file":"day-17.md","title":"Day 17 -- CrewAI","module":"04 -- Frameworks","time":"about 1 hour","minutes":19,"md":"# Day 17 -- CrewAI\n\n**Module:** 04 -- Frameworks\n**Time:** about 1 hour\n**Builds on:** Day 14 -- multi-agent; Day 16 -- LangGraph, for comparison\n\n---\n\n## 1. Today in one line\n\nYou rebuild your Day 14 team in CrewAI, and learn to tell an opinionated framework from a flexible one -- because that choice matters more than either framework's feature list.\n\n---\n\n## 2. The problem\n\nYesterday's LangGraph version required you to define state, nodes, edges and reducers. Full control, and a lot of scaffolding for something as common as \"a researcher hands findings to a writer\".\n\nThat pattern is so standard it should not need a graph. CrewAI takes that view: describe a **team** -- who they are, what they do, in what order -- and it assembles the machinery.\n\nYour Day 14 supervisor was about 120 lines. The CrewAI version is about 30.\n\n**The cost of that is control.** Yesterday you could see every edge. Today a great deal happens inside the framework, including prompts you did not write and cannot easily read. That is the trade, and today is about learning to feel it rather than being told about it.\n\nOne practical note: **CrewAI is Python-only.** Which is fine -- your AI side has been Python since Day 1, and Node is only doing the dashboard.\n\n---\n\n## 3. Mental model\n\n**LangGraph is a flowchart. CrewAI is an org chart.**\n\nLangGraph: boxes and arrows. You decide what happens after what.\n\nCrewAI: roles and responsibilities. You decide who does what, and hand over the goal.\n\n**Where this comparison breaks, and it is worth watching for:**\n\n**The org-chart metaphor invites you to anthropomorphise.** CrewAI has a field called `backstory`, and writing \"You are a veteran analyst with 15 years in fintech\" *feels* like creating a person. It is a string prepended to a prompt. Nothing more. Day 3 told you that role-setting shifts output style -- that is real, and it is also all that is happening.\n\n**Real teams get better because people learn.** Your crew does not. Every run starts from the same prompts. There is no accumulated judgement, no \"she's good at that one\", no growth. The org chart is a way of organising prompts, not an organisation.\n\nHold on to that and the framework is useful. Forget it and you will start attributing behaviour to personalities instead of debugging prompts.\n\n---\n\n## 4. How it really works\n\n**Four concepts, and all four are things you already built.**\n\n**Agent** -- a role, a goal, a backstory, tools, an LLM, and whether it may delegate. This is Day 14's specialist: `RESEARCHER` with its own system prompt and its own tool list.\n\n**Task** -- a description, an `expected_output`, the agent responsible, and `context` (which earlier tasks feed it). This is one delegation call.\n\n**Crew** -- the agents, the tasks, and a process: `sequential` (in order) or `hierarchical` (a manager delegates). This is your supervisor.\n\n**Process** -- `sequential` is Day 14's pipeline. `hierarchical` is Day 14's supervisor, with a manager LLM deciding who does what.\n\n**The field that matters most**\n\n`expected_output` is not documentation. It goes into the prompt, and it is the single biggest lever on output quality in the whole framework.\n\n```python\nexpected_output=\"A bullet list. Each bullet: the deadline date, what it refers to, and the source filename in brackets. Say 'none found' if there are none.\"\n```\n\nThat is Day 3's format specification wearing a CrewAI name. Leave it vague and you get vague output, exactly as on Day 3.\n\n**The field that matters second**\n\n`context=[previous_task]` is Day 14's handoff, made explicit. It controls what the next agent sees. You learned on Day 14 that the handoff is where context gets lost -- this is the field where that loss happens, so it is the field to watch.\n\n**What it does underneath**\n\nCrewAI wraps each task in its own prompt template, adds delegation instructions when delegation is on, and manages the passing of outputs. Those wrappers are real tokens on every call, and they are not shown to you by default. Stage 6 is about seeing them.\n\n---\n\n## 5. Setup\n\n```bash\ncd research-assistant/ai\nsource venv/bin/activate\n\npip install crewai crewai-tools\npip freeze > requirements.txt\n\ntouch crew_agent.py\n```\n\n**Two warnings.**\n\n**This install is heavy** and pulls a large dependency tree. It also has stricter Python version requirements than the rest of your project. If it conflicts with what you have, make a separate virtual environment for today rather than breaking the one that works:\n\n```bash\npython3 -m venv venv-crew && source venv-crew/bin/activate && pip install crewai crewai-tools\n```\n\n**CrewAI defaults to OpenAI.** Configure Groq explicitly or you will get an authentication error that has nothing to do with your code:\n\n```python\nfrom crewai import LLM\n\nllm = LLM(model=\"groq/llama-3.3-70b-versatile\",\n          api_key=os.environ[\"GROQ_API_KEY\"])\n```\n\nThe `groq/` prefix matters -- that is how the underlying router picks the provider.\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- Your Day 14 crew, in 30 lines\n\n`crew_agent.py`:\n\n```python\nimport os\nfrom dotenv import load_dotenv\nfrom crewai import Agent, Task, Crew, Process, LLM\n\nload_dotenv()\n\nllm = LLM(model=\"groq/llama-3.3-70b-versatile\",\n          api_key=os.environ[\"GROQ_API_KEY\"])\n\nresearcher = Agent(\n    role=\"Document Researcher\",\n    goal=\"Find accurate information in the user's documents and report exactly what is there\",\n    backstory=\"You are careful and literal. You report what the documents say and \"\n              \"nothing more. When something is not there, you say so plainly instead \"\n              \"of guessing.\",\n    llm=llm,\n    allow_delegation=False,\n    verbose=True,\n)\n\nwriter = Agent(\n    role=\"Technical Writer\",\n    goal=\"Turn findings into clear, honest prose a busy person can act on\",\n    backstory=\"You write plainly and never add facts that were not given to you. \"\n              \"Where information is missing you write 'not found' rather than \"\n              \"filling the gap.\",\n    llm=llm,\n    allow_delegation=False,\n    verbose=True,\n)\n\nresearch_task = Task(\n    description=\"Search the user's documents for anything about deadlines or due dates. \"\n                \"Report each one you find, and state clearly what you could NOT find.\",\n    expected_output=\"A list. Each item: the date, what it refers to, and the source \"\n                    \"filename. Then a short line listing anything you looked for and \"\n                    \"could not find.\",\n    agent=researcher,\n)\n\nwriting_task = Task(\n    description=\"Using only the research findings, write a short summary of the \"\n                \"user's deadlines.\",\n    expected_output=\"Under 200 words. A one-sentence opening, then bullets, each with \"\n                    \"its source filename in brackets. Include a 'Gaps' line if anything \"\n                    \"was not found.\",\n    agent=writer,\n    context=[research_task],\n)\n\ncrew = Crew(agents=[researcher, writer],\n            tasks=[research_task, writing_task],\n            process=Process.sequential,\n            verbose=True)\n\nif __name__ == \"__main__\":\n    print(crew.kickoff())\n```\n\nRun it. **Read the verbose output carefully** -- this is the clearest view you will get of what the framework does.\n\n**Then open `multi_agent.py` next to it.** Every idea maps:\n\n| Your Day 14 code | CrewAI |\n|---|---|\n| `RESEARCHER` system prompt | `role` + `goal` + `backstory` |\n| `tool_names` per worker | `tools=[...]` |\n| `delegate_research(question)` | a `Task` with `agent=researcher` |\n| the `findings` handoff string | `context=[research_task]` |\n| `supervise()` loop | `Crew` with `Process.sequential` |\n| \"report what you could NOT find\" | still yours, in the description |\n\nNote the last row. **That line was your discovery on Day 14** -- without it, the writer treats silence as completeness and gaps vanish. No framework supplies it. The framework gives you structure; the quality lines are still yours to write.\n\n---\n\n### Stage 2 -- Give it your tools\n\nThe researcher cannot search yet. Wire in your Day 12 pipeline:\n\n```python\nfrom crewai.tools import tool\nimport tools as my_tools\n\n\n@tool(\"Search Documents\")\ndef search_documents(query: str) -> str:\n    \"\"\"Search the user's own documents and notes by meaning. Natural language works;\n    you do not need the exact words from the document.\"\"\"\n    return my_tools.search_documents(query)\n\n\n@tool(\"Current Time\")\ndef current_time(timezone: str = \"Asia/Kolkata\") -> str:\n    \"\"\"Get the current date and time in a timezone.\"\"\"\n    return my_tools.get_current_time(timezone)\n\n\nresearcher = Agent(\n    ...,\n    tools=[search_documents, current_time],\n)\n```\n\n**The docstring is the tool description**, exactly as with MCP on Day 8 and function schemas on Day 4. Three frameworks, three syntaxes, one idea: describe the tool well or the model chooses badly.\n\n**The writer still has no tools**, deliberately. Day 14's reasoning holds: it cannot search so it cannot wander, and it cannot write files so an injection reaching it can do nothing.\n\n---\n\n### Stage 3 -- Prove that `expected_output` is the lever\n\nThis is the stage that teaches the most about CrewAI.\n\nRun three versions of `writing_task` and keep all three outputs side by side:\n\n```python\n# Version A - vague\nexpected_output=\"A summary of the deadlines.\"\n\n# Version B - specific\nexpected_output=\"Under 200 words. One opening sentence, then bullets, each with its source filename in brackets.\"\n\n# Version C - specific, with an example\nexpected_output=\"\"\"Under 200 words.\n\nFormat exactly like this:\nYou have 3 upcoming deadlines.\n- 30 November: final report submission [project-plan.pdf]\n- 15 December: budget review [finance-notes.txt]\n\nGaps: nothing found about the Q1 timeline.\"\"\"\n```\n\nThe difference between A and C is large. Much larger than any change you could make to `backstory`.\n\n**That ratio is the lesson.** `backstory` feels like the important field because it reads like a character description. `expected_output` is the important field, because it is a format specification -- Day 3,
