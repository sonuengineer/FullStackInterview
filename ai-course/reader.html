ey are stuck.** They come back and say \"I couldn't find it, what do you want me to do?\" An agent does not do this unless you build it. Left alone, it either loops silently or produces a confident report of work it never did.\n\n**A person knows the difference between doing something and describing it.** The model does not. Writing \"I have saved your summary to notes/deadlines.txt\" costs it exactly the same effort as saving the file. Nothing in how it works distinguishes those two acts.\n\nWhich is why verification cannot be a matter of asking nicely in the prompt. It has to be a separate check, run outside the agent, on evidence rather than on claims.\n\n---\n\n## 4. How it really works\n\n**Autonomy is a set of dials, not a switch.**\n\n| Dial | Low | High |\n|---|---|---|\n| Step budget | 5 | 50 |\n| Token budget | 5,000 | 200,000 |\n| Time budget | 30 seconds | 10 minutes |\n| Tool permissions | read only | read and write and send |\n| Approval | every action | none |\n| Verification | a human reads it | automatic checks |\n\nA \"fully autonomous agent\" is just all of these turned up. You can turn them independently, and you should. A very common and very sensible setup is: unlimited read steps, approval required for anything that changes something.\n\n**The shape of an autonomous run**\n\n```\ngoal\n  -> loop (with budgets checked every step)\n  -> termination (one of three kinds)\n  -> verification (separate, outside the agent)\n  -> report (what actually happened, from evidence)\n```\n\n**Three kinds of termination**, and you need all three:\n\n- **Success** -- the model answers without asking for a tool. This is a *claim*, not a fact.\n- **Budget** -- steps, tokens or time ran out. Reliable, because it is your code.\n- **Safety** -- a loop was detected, or a tool failed repeatedly. Also your code.\n\nOnly two of those three are trustworthy. Notice which.\n\n**Verification, and why it is separate**\n\nThe agent's final message is generated by the same process that generates everything else: what text is likely to come next. \"I have completed the task\" is an extremely likely thing to come next after a lot of work-looking activity, whether or not the work succeeded.\n\nSo verification has to look at evidence:\n\n- **In code, where possible.** Did the file appear? Is it non-empty? Does it contain the date? This is the best kind, because it cannot be talked into anything.\n- **With a second model call, where not.** Give a fresh model the original goal and the trajectory, and ask: was this achieved? Fresh matters -- the agent that did the work is the worst judge of it.\n\n**Blast radius**\n\nBefore turning autonomy up, ask: what is the worst thing this can do? An agent with `save_note` can write files in one folder. An agent with a delete tool, or an email tool, or a shell tool, has a much larger radius. The rails you need scale with the radius, not with the task.\n\n---\n\n## 5. Setup\n\nNothing to install.\n\n```bash\ncd research-assistant/ai\nsource venv/bin/activate\n\ntouch autonomous.py\nmkdir -p runs\n```\n\nThe `runs/` folder will hold a saved record of each run. You will need it, because you will not be watching.\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- Budgets\n\nStart `autonomous.py` with the thing that stops runaway costs:\n\n```python\nimport os, json, time, uuid\nfrom datetime import datetime\nfrom dotenv import load_dotenv\nfrom openai import OpenAI, RateLimitError\nfrom tools import TOOL_SCHEMAS, AVAILABLE_TOOLS\n\nload_dotenv()\nclient = OpenAI(api_key=os.environ[\"GROQ_API_KEY\"],\n                base_url=\"https://api.groq.com/openai/v1\")\nMODEL = \"llama-3.3-70b-versatile\"\n\n\nclass Budget:\n    def __init__(self, max_steps=25, max_tokens=40000, max_seconds=180):\n        self.max_steps = max_steps\n        self.max_tokens = max_tokens\n        self.max_seconds = max_seconds\n        self.steps = 0\n        self.tokens = 0\n        self.started = time.time()\n\n    def spend(self, step_tokens):\n        self.steps += 1\n        self.tokens += step_tokens\n\n    def exceeded(self):\n        if self.steps >= self.max_steps:\n            return f\"step limit reached ({self.max_steps})\"\n        if self.tokens >= self.max_tokens:\n            return f\"token limit reached ({self.tokens})\"\n        if time.time() - self.started > self.max_seconds:\n            return f\"time limit reached ({self.max_seconds}s)\"\n        return None\n\n    def summary(self):\n        return (f\"{self.steps} steps, {self.tokens} tokens, \"\n                f\"{time.time() - self.started:.0f}s\")\n```\n\n**Why three budgets and not one.**\n\nSteps alone are not enough -- one step that retrieves twenty chunks can cost more than five small ones.\n\nTokens alone are not enough -- a tool that hangs uses no tokens at all while your program sits there forever.\n\n**The time budget is the one people forget, and it is the one that saves you.** Any tool that waits on a network is a potential infinite hang. Steps and tokens both stay frozen while that happens. Wall-clock time is the only budget that notices.\n\n---\n\n### Stage 2 -- Permission tiers\n\nNot all tools are equally dangerous. Sort them:\n\n```python\nREAD_ONLY = {\"get_current_time\", \"calculate\", \"search_documents\"}\nWRITES    = {\"save_note\"}\n\nPOLICY = \"ask\"      # \"ask\" | \"auto\" | \"dry_run\"\n\n\ndef permitted(name, args):\n    \"\"\"Returns (allowed, message). Message is sent to the model when refused.\"\"\"\n    if name in READ_ONLY:\n        return True, None\n\n    if name not in WRITES:\n        return False, f\"The tool '{name}' is not permitted in this run.\"\n\n    if POLICY == \"auto\":\n        return True, None\n\n    if POLICY == \"dry_run\":\n        return False, f\"DRY RUN: {name} was not actually executed. Assume it would have succeeded.\"\n\n    print(f\"\\n  >>> agent wants to run {name}({args})\")\n    if input(\"  >>> allow? (y/n): \").strip().lower() == \"y\":\n        return True, None\n    return False, \"The user refused permission for this action.\"\n```\n\n**Three things worth noticing.**\n\nUnknown tools are refused by default, not allowed. If the model hallucinates a tool name, it gets a clear refusal rather than a `KeyError`.\n\nEvery refusal returns a **message for the model**, not an exception. The agent learns it was blocked and can adapt -- \"I couldn't save the file, here is the summary instead\" -- rather than dying.\n\n**`dry_run` is the mode to use while developing.** The agent runs its whole trajectory, every write tool reports fake success, and nothing is actually changed. You get to watch what it *would* have done before letting it do it. Use this every time you give an agent a new tool.\n\n---\n\n### Stage 3 -- The run, and a real result object\n\nDay 7 returned a string. That is not enough when nobody was watching.\n\n```python\ndef call_model(messages, tools, tries=4):\n    for attempt in range(tries):\n        try:\n            return client.chat.completions.create(\n                model=MODEL, messages=messages, tools=tools)\n        except RateLimitError:\n            wait = 2 ** attempt\n            time.sleep(wait)\n    raise RuntimeError(\"Rate limited repeatedly.\")\n\n\nAUTONOMOUS_PROMPT = \"\"\"You are working on a task without a human watching.\n\nHOW TO WORK\n- Work in small steps. Say in one short sentence what you are doing and why.\n- After each result, say what you learned and what is still missing.\n- When everything is genuinely done, reply with a final answer and no tool calls.\n\nRULES\n- Never say you have done something unless a tool returned success for it.\n- If a tool fails twice, stop and report the problem. Do not keep retrying.\n- If you cannot complete the task, say exactly what you could and could not do.\n- If you are blocked, stop and explain. Do not invent a result.\"\"\"\n\n\ndef run(goal, budget=None, policy=\"ask\"):\n    global POLICY\n    POLICY = policy\n    budget = budget or Budget()\n\n    run_id = datetime.now().strftime(\"%Y%m%d-%H%M%S\") + \"-\" + uuid.uuid4().hex[:4]\n    messages = [\n        {\"role\": \"system\", \"content\": AUTONOMOUS_PROMPT},\n        {\"role\": \"user\", \"content\": goal},\n    ]\n    trajectory = []\n    seen_calls = []\n\n    result = {\"run_id\": run_id, \"goal\": goal, \"status\": None,\n              \"answer\": None, \"reason\": None, \"trajectory\": trajectory}\n\n    while True:\n        stop = budget.exceeded()\n        if stop:\n            result[\"status\"] = \"budget_exhausted\"\n            result[\"reason\"] = stop\n            break\n\n        response = call_model(messages, TOOL_SCHEMAS)\n        budget.spend(response.usage.total_tokens)\n        message = response.choices[0].message\n\n        if message.content:\n            print(f\"[{budget.steps}] {message.content[:150]}\")\n\n        if not message.tool_calls:\n            result[\"status\"] = \"claimed_complete\"\n            result[\"answer\"] = message.content\n            break\n\n        messages.append(message.model_dump(exclude_none=True))\n\n        for call in message.tool_calls:\n            name = call.function.name\n            try:\n                args = json.loads(call.function.arguments)\n            except json.JSONDecodeError:\n                args = {}\n\n            signature = f\"{name}:{json.dumps(args, sort_keys=True)}\"\n            if seen_calls.count(signature) >= 2:\n                output = (\"You have already tried this exact call twice without \"\n                          \"progress. Try a different approach or stop and report.\")\n                trajectory.append({\"tool\": name, \"args\": args, \"blocked\": \"loop\"})\n            else:\n                seen_calls.append(signature)\n                allowed, refusal = permitted(name, args)\n\n                if not allowed:\n                    output = refusal\n                    trajectory.append({\"tool\": name, \"args\": args, \"blocked\": refusal})\n                else:\n                    try:\n                        output = str(AVAILABLE_TOOLS[name](**args))\n                        trajectory.append({\"tool\": name, \"args\": args,\n                                           \"result\": output[:500], \"ok\": True})\n                    except Exception as error:\n                        output = f\"Tool failed: {error}\"\n                        trajectory.append({\"tool\": name, \"args\": args,\n                                           \"result\": output, \"ok\": False})\n\n            print(f\"   {name}({args}) -> {output[:100]}\")\n            messages.append({\"role\": \"tool\", \"tool_call_id\": call.id, \"content\": output})\n\n    result[\"budget\"] = budget.summary()\n\n    with open(f\"runs/{run_id}.json\", \"w\") as f:\n        json.dump(result, f, indent=2)\n\n    return result\n```\n\n**The status field is the point of this stage.** Notice it says `claimed_complete`, not `complete`. The agent stopping asking for tools means it *thinks* it is done. Naming it honestly in your own code keeps you from forgetting that.\n\n**Every tool call is recorded in `trajectory`**, including blocked and failed ones, and the whole thing is written to `runs/`. When an unsupervised run goes wrong at 2am, this file is the only thing you have.\n\n---\n\n### Stage 4 -- Verify it, outside the agent\n\nThis is the most important stage of the day.\n\n```python\nVERIFIER_PROMPT = \"\"\"You check whether a task was actually completed.\n\nYou will get the original goal and a record of everything the agent did.\nJudge only by tool results. Ignore anything the agent said about itself.\n\nReply with JSON only:\n{\"verdict\": \"done\" | \"partial\" | \"failed\",\n \"evidence\": \"the specific tool result that proves it, or what is missing\",\n \"confidence\": \"high\" | \"low\"}\"\"\"\n\n\ndef verify_with_model(result):\n    record = json.dumps(result[\"trajectory\"], indent=2)[:6000]\n\n    response = client.chat.completions.create(\n        model=MODEL,\n        messages=[\n            {\"role\": \"system\", \"content\": VERIFIER_PROMPT},\n            {\"role\": \"user\", \"content\": f\"GOAL:\\n{result['goal']}\\n\\nWHAT THE AGENT DID:\\n{record}\"}\n        ],\n        temperature=0,\n        response_format={\"type\": \"json_object\"}\n    )\n    return json.loads(response.choices[0].message.content)\n\n\ndef verify_in_code(expected_file=None, must_contain=None):\n    \"\"\"The kind of check that cannot be argued with.\"\"\"\n    if not expected_file:\n        return None\n    if not os.path.exists(expected_file):\n        return {\"verdict\": \"failed\", \"evidence\": f\"{expected_file} does not exist\"}\n    text = open(expected_file).read()\n    if len(text.strip()) \u003c 20:\n        return {\"verdict\": \"failed\", \"evidence\": f\"{expected_file} is nearly empty\"}\n    if must_contain and must_contain.lower() not in text.lower():\n        return {\"verdict\": \"partial\", \"evidence\": f\"'{must_contain}' not found in the file\"}\n    return {\"verdict\": \"done\", \"evidence\": f\"{expected_file} exists, {len(text)} characters\"}\n```\n\nUse both:\n\n```python\nif __name__ == \"__main__\":\n    result = run(\n        \"Search my documents for anything about deadlines. Save a note called \"\n        \"'deadlines' listing each one with its source filename.\",\n        budget=Budget(max_steps=20, max_tokens=40000, max_seconds=180),\n        policy=\"auto\"\n    )\n\n    print(\"\\n--- agent says ---\")\n    print(result[\"status\"], \"|\", result[\"budget\"])\n    print(result[\"answer\"])\n\n    print(\"\\n--- code check ---\")\n    print(verify_in_code(\"notes/deadlines.txt\", must_contain=\"deadline\"))\n\n    print(\"\\n--- model check ---\")\n    print(verify_with_model(result))\n```\n\n**Why the verifier gets the trajectory and not the answer.** Hand it the agent's summary and you are asking one model to grade another model's essay about itself. Hand it the tool results and it is checking evidence. `\"Judge only by tool results. Ignore anything the agent said about itself\"` is the line doing the work.\n\n**`verify_in_code` is worth more than `verify_with_model`.** It cannot be persuaded. Whenever a goal has a checkable outcome -- a file, a row in a database, a value that should have changed -- check it in code. Use the model verifier only for things code cannot judge, like whether a summary is actually about deadlines.\n\n---\n\n### Stage 5 -- Make it notice it is stuck\n\nLoop detection catches identical repeats. It misses the more common failure: slow drift, where it keeps doing slightly different things and getting nowhere.\n\nAdd a nudge every few steps:\n\n```python\nCHECK_EVERY = 5\n\n        if budget.steps > 0 and budget.steps % CHECK_EVERY == 0:\n            messages.append({\n                \"role\": \"user\",\n                \"content\": (\"Pause. In two sentences: what have you actually completed \"\n                            \"so far, and what is left? If you are not making progress, \"\n                            \"stop now and report what you achieved.\")\n            })\n```\n\nRun a hard task and watch what it says at step 5, 10, 15.\n\n**This works better than it has any right to.** Being asked to state progress forces the model to read its own trajectory and compare it against the goal -- and models are considerably better at spotting a stall when asked directly than at noticing one while in the middle of it.\n\nIt costs one extra call every five steps. Cheap, for the number of runaway runs it ends early.\n\n---\n\n### Stage 6 -- Actually leave it alone\n\nNow do the thing the whole day was for.\n\n```python\n    result = run(\n        \"Go through all my documents. Find every date or deadline mentioned. \"\n        \"For each one, note which document it came from and what it refers to. \"\n        \"Then save a note called 'all-deadlines' with the full list, sorted by date.\",\n        budget=Budget(max_steps=30, max_tokens=60000, max_seconds=300),\n        policy=\"dry_run\"\n    )\n```\n\nStart with `dry_run`. Read the trajectory in `runs/`. Check what it *would* have written. Only when that looks right, switch to `auto` and run it for real.\n\n**That sequence -- dry run, read the trajectory, then run for real -- is the habit to keep.** It is how you give an agent a new tool without finding out the hard way.\n\nThen open the run file and read it end to end:\n\n```bash\ncat runs/*.json | python -m json.tool | less\n```\n\nThis is what operating an agent actually looks like. Not watching it work. Reading what it did.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **Autonomy** | How much the agent does without asking. A set of dials. |\n| **Budget** | A hard limit on steps, tokens or time. |\n| **Termination condition** | Any rule that ends the run. |\n| **Trajectory** | The full record: every call, argument and result. |\n| **Verification** | Checking the goal was met, from evidence, outside the agent. |\n| **Self-report** | The agent's own claim about what it did. Not evidence. |\n| **Guardrail** | Any rule limiting what the agent may do. |\n| **Blast radius** | The worst damage this agent could cause. |\n| **Dry run** | Executing the trajectory with write tools faking success. |\n| **Idempotent** | Safe to run twice. Matters a lot when retries exist. |\n| **Circuit breaker** | Stopping after repeated failures instead of retrying forever. |\n| **Audit log** | The saved record of what happened. Your `runs/` folder. |\n| **Human in the loop** | A person approving actions. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Measure how often it lies.**\nRun five different tasks with `policy=\"auto\"`. For each, record what the agent claimed and what `verify_in_code` found. Count the disagreements.\n*You will see:* a real number, on your machine, for how often \"done\" is not done.\n*It teaches:* this is the most valuable experiment in the course. Everyone is told not to trust self-reports. Very few people measure it.\n\n**2. Hang a tool.**\nPut `time.sleep(600)` inside `get_current_time`. Run with a step and token budget but comment out the time check.\n*You will see:* nothing, for ten minutes. Steps and tokens never move.\n*It teaches:* why the time budget exists. It is the only one that catches this.\n\n**3. Starve it.**\nSet `max_tokens=8000` on a task needing twenty steps.\n*You will see:* `budget_exhausted` with half the work done -- maybe a file created and left empty.\n*It teaches:* partial completion is the dangerous state. Neither done nor undone, and no rollback.\n\n**4. Remove the \"never claim\" rule.**\nTake that line out of `AUTONOMOUS_PROMPT`, then break `save_note` so it returns an error. Run a save task.\n*You will see:* a cheerful report of success.\n*It teaches:* prompt rules genuinely help -- and are genuinely not enough, which is why Stage 4 exists.\n\n**5. Hallucinate a tool.**\nAdd to the goal: \"use the send_email tool to email me the results.\"\n*You will see:* it tries to call a tool that does not exist, gets your refusal message, and adapts.\n*It teaches:* deny by default turns a crash into a conversation.\n\n**6. Break the verifier on purpose.**\nFeed `verify_with_model` a trajectory where nothing worked, but hand it the agent's glowing summary instead of the tool results.\n*You will see:* it often agrees the task was done.\n*It teaches:* the verifier is only as good as what you show it. Evidence in, judgement out.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- believing `claimed_complete`**\n*Symptom:* your pipeline reports success and produces nothing.\n*Fix:* never treat the agent's stopping as success. Verify in code where you can.\n\n**Trap 2 -- no time budget**\n*Symptom:* a program that never returns and shows no activity.\n*Fix:* wall-clock budget, checked every step.\n\n**Trap 3 -- tools that are not safe to repeat**\n*Symptom:* three identical notes, or the same message sent three times.\n*Cause:* a retry after a timeout, where the first call actually succeeded.\n*Fix:* make write tools idempotent -- same input, same result, no duplicate. A stable id or filename is usually enough.\n\n**Trap 4 -- no audit log**\n*Symptom:* \"it did something wrong last night\" and nothing to look at.\n*Fix:* write the trajectory to `runs/` on every run, including failed ones. Especially failed ones.\n\n**Trap 5 -- blast radius bigger than the rails**\n*Symptom:* fine for weeks, then something irreversible.\n*Cause:* a powerful tool added to an agent whose guardrails were designed for a weaker one.\n*Fix:* every time you add a tool, ask what the worst case is now, and re-check the rails. Adding a tool is a security change.\n\n**Trap 6 -- autonomy where it was not needed**\n*Symptom:* a thirty-step agent run for something one API call answers.\n*Fix:* ask whether the task actually needs multiple steps. Most do not. Day 15 covers choosing.\n\n---\n\n## 10. Check yourself\n\n1. Three kinds of termination end a run. Which two can you trust, and why not the third?\n2. Why does the time budget catch something the step and token budgets cannot?\n3. Why is the verifier given the trajectory rather than the agent's final answer?\n4. What is a dry run, and when should you always use one?\n5. A tool times out, you retry, and the first call had actually succeeded. What is the problem called and what fixes it?\n\n---\n\n## 11. Where this goes\n\n- **Day 10** adds planning. Today's agent decides one step at a time; tomorrow it writes the plan first, which also lets you approve a plan rather than twenty separate actions.\n- **Day 11** fixes the scratchpad. A thirty-step run overflows the context window, and choosing what to keep is the job.\n- **Day 13** is the security side: MCP servers, permissions, and text inside documents trying to influence an agent nobody is watching.\n- **Day 14** runs several agents at once. Every budget and rail here now needs to work across all of them.\n- **Day 15** turns this into production practice: cost tracking, retries, monitoring, and evaluation runs over many tasks rather than one.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 9:\n\nFolders:\n  research-assistant/\n    ai/\n      venv/, .env, .gitignore, requirements.txt\n      chat.py, agent.py            (Day 7 supervised agent, kept)\n      mcp_agent.py, mcp_client.py, mcp_servers/my_tools.py\n      autonomous.py                (NEW - budgets, permissions, verification)\n      tools.py, prompts.py, classify.py, test_prompt.py\n      documents.py, embeddings.py, vector_store.py, chroma_db/\n      runs/                        (NEW - one JSON trajectory per run)\n      conversation.json, notes/, documents/\n    dashboard/                     (still empty)\n\nLibraries: no new installs\n\nautonomous.py contains:\n\n  Budget class - three independent limits, all checked every step:\n      max_steps (25), max_tokens (40000), max_seconds (180)\n      spend(), exceeded() -> reason string or None, summary()\n      time budget exists specifically to catch hanging tools, which\n      consume no steps and no tokens\n\n  Permission tiers:\n      READ_ONLY = {get_current_time, calculate, search_documents}\n      WRITES    = {save_note}\n      unknown tool names are DENIED by default\n      POLICY is one of \"ask\" | \"auto\" | \"dry_run\"\n      dry_run executes the whole trajectory while write tools report fake\n      success, so a new tool can be watched before it is trusted\n      every refusal is returned to the MODEL as a tool result, never raised\n\n  run(goal, budget, policy) returns a dict:\n      run_id, goal, status, answer, reason, trajectory, budget summary\n      status is one of: \"claimed_complete\" | \"budget_exhausted\"\n      note the name: claimed_complete, because the agent stopping is a\n      claim and not evidence\n      every tool call is recorded including blocked and failed ones\n      loop detection: same tool + same args 3 times returns a steering\n      message telling the model to change approach\n      progress check injected every 5 steps asking what is done and what\n      is left, which ends stalled runs early\n      the whole result is written to runs/\u003crun_id>.json\n\n  Verification, deliberately OUTSIDE the agent:\n      verify_in_code(expected_file, must_contain) - file exists, is not\n        nearly empty, contains an expected string. Cannot be argued with.\n        This is the preferred check whenever the goal has a checkable outcome.\n      verify_with_model(result) - fresh model call given the GOAL and the\n        TRAJECTORY only, never the agent's own summary. Returns JSON:\n        verdict done|partial|failed, evidence, confidence.\n\nAUTONOMOUS_PROMPT rules:\n  never claim something without a successful tool result\n  stop after two failures of the same tool\n  state exactly what could and could not be done\n  never invent a result when blocked\n\nKey decisions made:\n  - the agent is never the judge of its own success\n  - three budgets, not one; wall-clock time is mandatory\n  - deny unknown tools by default\n  - dry_run before auto, always, when a tool is new\n  - every run written to disk, including failures\n\nVerified working:\n  - unattended multi-step document task completed with policy=\"auto\"\n  - self-reported success measured against verify_in_code across several\n    runs; the disagreement rate is real and worth knowing\n\nKnown problems, left for later:\n  - no overall plan; the agent still decides one step at a time (Day 10)\n  - the scratchpad grows without limit and will overflow on long runs;\n    no trimming is applied inside the loop because it splits tool pairs\n    (Day 11)\n  - write tools are not idempotent; a retry after a timeout can duplicate\n  - partial completion has no rollback\n  - budgets are per run, not per user or per day (Day 15)\n```\n\n---\n\n## Answers\n\n**1.** Budget termination and safety termination, because both are enforced by your own code. Success termination cannot be trusted, because it only means the model stopped asking for tools -- a claim produced by the same process that produces everything else it says.\n\n**2.** A hanging tool consumes no steps and no tokens. Both those budgets stay frozen while your program waits forever. Wall-clock time is the only measure that keeps moving.\n\n**3.** Because the final answer is the agent's own account of itself, and asking a model to grade that is asking it to grade an essay about the thing rather than the thing. The trajectory contains actual tool results, which is evidence.\n\n**4.** A run where the agent does everything normally but write tools report fake success without changing anything. Use it every single time you give an agent a new tool that can change something, before letting it run for real.\n\n**5.** Non-idempotent tools. The fix is to make write operations safe to repeat -- a stable id or filename so the same call produces the same single outcome instead of a duplicate.\n"},{"file":"day-10.md","title":"Day 10 -- Advanced Agent Planning","module":"03 -- Advanced Agent Systems","time":"about 1 hour","minutes":23,"md":"# Day 10 -- Advanced Agent Planning\n\n**Module:** 03 -- Advanced Agent Systems\n**Time:** about 1 hour\n**Builds on:** Day 7 -- the loop; Day 9 -- budgets and verification; Day 3 -- JSON output\n\n---\n\n## 1. Today in one line\n\nYour agent writes down what it intends to do *before* doing it -- and you find out that the plan matters less than the ability to change it.\n\n---\n\n## 2. The problem\n\nYour Day 9 agent is **greedy**. Each step it looks at where it is and picks the next action. No overview, no idea how far along it is, no idea what is coming.\n\nGive it something genuinely multi-part:\n\n> Research the three main approaches to caching, compare them on speed and complexity, and write me a recommendation.\n\nWatch it. You will see some of these:\n\n- It researches approach one, writes half a recommendation, then remembers approach two.\n- It searches for the same thing twice, ten steps apart, having forgotten it already did.\n- It writes the comparison before gathering the third approach.\n- At step 12 it announces it is finished, having covered two of the three.\n\nNothing there is a bug. It is what one-step-at-a-time thinking looks like on a task with structure.\n\nThere is a second problem, which matters more in practice. **You cannot approve a plan you were never shown.** On Day 9 you could approve twenty individual actions, which is not approval -- it is twenty interruptions. Being able to read \"here are the six things I intend to do\" and say yes once is a completely different experience.\n\nSo: make it plan first. Which introduces its own failure, and that failure is really what today is about.\n\n---\n\n## 3. Mental model\n\n**Walking with a map versus following your nose.**\n\nFollowing your nose works well when the terrain is simple and you can see the destination. You react to what is in front of you. No wasted effort on planning.\n\nA map lets you see the whole route, notice that two errands are near each other, and know how far along you are.\n\n**Where the comparison breaks, and this is the actual lesson:**\n\n**The map is drawn before you have seen the terrain.** An agent writes its plan at step zero, when it knows the least it will ever know. Step 2 will teach it something that makes steps 4, 5 and 6 wrong.\n\nA person adjusts automatically -- you find the road closed and reroute without thinking. An agent will march through a plan that stopped making sense four steps ago, because the plan is in its context and the plan is what it is following.\n\nSo here is the sentence for today:\n\n> Planning is easy. Replanning is the skill.\n\nAn agent that plans and then follows the plan blindly is often *worse* than one that never planned at all -- it has traded flexibility for a structure that may be wrong. The value comes from plan, act, check the plan still holds, adjust.\n\n---\n\n## 4. How it really works\n\n**Three patterns. You should be able to choose between them.**\n\n**ReAct** (Days 7 and 9): think, act, observe, repeat. Flexible, adapts instantly, no wasted planning. Wanders on complex tasks, loses track of overall progress.\n\n**Plan-and-execute**: make the full plan, then work through it. Structured, visible, approvable, less repeated work. Brittle when the plan turns out wrong, and costs a planning call up front.\n\n**Plan with replanning** (today's target): plan, execute a step, check whether the remaining plan still makes sense, adjust if not. Best results, most calls.\n\nNone is universally correct. A two-step task does not deserve a plan. A fifteen-step research task falls apart without one.\n\n**What a plan actually is**\n\nA plan is structured data, not prose. You already know how to get that -- Day 3, JSON mode.\n\n```\n[\n  {\"id\": 1, \"task\": \"Search documents for caching approaches\",\n   \"tool\": \"search_documents\", \"depends_on\": [], \"done\": false},\n  {\"id\": 2, \"task\": \"For each approach found, search for performance details\",\n   \"tool\": \"search_documents\", \"depends_on\": [1], \"done\": false},\n  {\"id\": 3, \"task\": \"Write the comparison and save it\",\n   \"tool\": \"save_note\", \"depends_on\": [1, 2], \"done\": false}\n]\n```\n\nTwo fields carry most of the weight.\n\n**`depends_on`** is what stops it writing the comparison before the research. Step 3 cannot start until 1 and 2 are done. This is the structure that greedy stepping never has.\n\n**`done`** is progress. The agent can look at the plan and know it is four of seven through. On Day 9 it had no way to know that.\n\n**The dependency problem**\n\nStep 2 needs what step 1 found. So when you run step 2, you must pass along step 1's results. Get this wrong and each step starts blind, which is worse than no plan at all.\n\n**Reflection**\n\nOne more idea, cheap and effective: when the plan is finished, hand the goal and the results to a fresh call and ask \"was this actually achieved, and what is weak about it?\" Then optionally redo one step.\n\nThis is Day 9's verification, used as an input rather than a report. Same trick, different purpose.\n\n---\n\n## 5. Setup\n\nNothing to install.\n\n```bash\ncd research-assistant/ai\nsource venv/bin/activate\n\ntouch planner.py\n```\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- Make a plan and look at it\n\nDo not execute anything yet. Just get a plan and read it.\n\n`planner.py`:\n\n```python\nimport os, json\nfrom dotenv import load_dotenv\nfrom openai import OpenAI\nfrom tools import TOOL_SCHEMAS, AVAILABLE_TOOLS\n\nload_dotenv()\nclient = OpenAI(api_key=os.environ[\"GROQ_API_KEY\"],\n                base_url=\"https://api.groq.com/openai/v1\")\nMODEL = \"llama-3.3-70b-versatile\"\n\nTOOL_LIST = \"\\n\".join(\n    f\"- {t['function']['name']}: {t['function']['description'][:120]}\"\n    for t in TOOL_SCHEMAS\n)\n\nPLANNER_PROMPT = f\"\"\"You break a goal into a short, ordered plan.\n\nAvailable tools:\n{TOOL_LIST}\n\nReply with JSON only, in this shape:\n{{\"steps\": [\n   {{\"id\": 1, \"task\": \"what to do, in one clear sentence\",\n     \"tool\": \"the tool name, or null if this step is thinking only\",\n     \"depends_on\": []}}\n]}}\n\nRULES\n- Between 2 and 6 steps. Fewer is better.\n- Each step must be doable with ONE of the listed tools, or be pure reasoning.\n- Use depends_on when a step needs an earlier step's result.\n- If the goal cannot be done with these tools, return {{\"steps\": [], \"impossible\": \"why\"}}.\n- Do not plan steps for things you already know.\"\"\"\n\n\ndef make_plan(goal):\n    response = client.chat.completions.create(\n        model=MODEL,\n        messages=[\n            {\"role\": \"system\", \"content\": PLANNER_PROMPT},\n            {\"role\": \"user\", \"content\": goal}\n        ],\n        temperature=0,\n        response_format={\"type\": \"json_object\"}\n    )\n    return json.loads(response.choices[0].message.content)\n\n\nif __name__ == \"__main__\":\n    plan = make_plan(\n        \"Find everything my documents say about deadlines, check which ones \"\n        \"have already passed, and save a summary note.\"\n    )\n    print(json.dumps(plan, indent=2))\n```\n\nRun it. You get something like:\n\n```json\n{\"steps\": [\n  {\"id\": 1, \"task\": \"Search documents for deadlines and due dates\",\n   \"tool\": \"search_documents\", \"depends_on\": []},\n  {\"id\": 2, \"task\": \"Get today's date to compare against\",\n   \"tool\": \"get_current_time\", \"depends_on\": []},\n  {\"id\": 3, \"task\": \"Determine which deadlines have passed\",\n   \"tool\": null, \"depends_on\": [1, 2]},\n  {\"id\": 4, \"task\": \"Save a summary note\",\n   \"tool\": \"save_note\", \"depends_on\": [3]}\n]}\n```\n\n**Read that plan properly.** It is a reasonable plan -- better than what Day 9's agent would have wandered into. Steps 1 and 2 have no dependencies, so they could run in either order. Step 3 needs both. Step 4 needs step 3.\n\n**Now try to break the planner.** Ask for something impossible with your tools:\n\n```python\n    print(json.dumps(make_plan(\"Email my manager a summary of my documents.\"), indent=2))\n```\n\nIf you get `\"impossible\"`, good. If you get a confident four-step plan including a `send_email` tool that does not exist -- which happens often -- note it. **Planners hallucinate capability.** The plan is generated text like any other, and a plausible-looking plan is easy to produce whether or not it can be carried out. Your executor has to catch it, because the planner will not.\n\n---\n\n### Stage 2 -- Execute the plan\n\nEach step becomes a small agent run, with the step as its goal:\n\n```python\nEXECUTOR_PROMPT = \"\"\"You are completing ONE step of a larger plan.\n\nDo only this step. Do not try to complete the whole goal.\nUse a tool if the step needs one. When the step is done, reply with a short\nstatement of what you found or did, with no tool calls.\nIf you cannot do this step, say exactly why.\"\"\"\n\n\ndef run_step(step, context, max_calls=4):\n    messages = [\n        {\"role\": \"system\", \"content\": EXECUTOR_PROMPT},\n        {\"role\": \"user\", \"content\":\n            f\"OVERALL GOAL: {context['goal']}\\n\\n\"\n            f\"RESULTS SO FAR:\\n{context['results_text']()}\\n\\n\"\n            f\"YOUR STEP: {step['task']}\"}\n    ]\n\n    for _ in range(max_calls):\n        response = client.chat.completions.create(\n            model=MODEL, messages=messages, tools=TOOL_SCHEMAS)\n        message = response.choices[0].message\n\n        if not message.tool_calls:\n            return message.content\n\n        messages.append(message.model_dump(exclude_none=True))\n        for call in message.tool_calls:\n            name = call.function.name\n            args = json.loads(call.function.arguments)\n            print(f\"    {name}({args})\")\n\n            if name not in AVAILABLE_TOOLS:\n                output = f\"There is no tool called {name}.\"\n            else:\n                try:\n                    output = str(AVAILABLE_TOOLS[name](**args))\n                except Exception as error:\n                    output = f\"Tool failed: {error}\"\n\n            messages.append({\"role\": \"tool\", \"tool_call_id\": call.id, \"content\": output})\n\n    return \"This step did not finish within its call limit.\"\n```\n\n**Two design points.**\n\n`max_calls=4` per step. Each step gets its own small budget. One bad step cannot eat the whole run -- a real advantage over Day 9, where one confused stretch could consume everything.\n\n`RESULTS SO FAR` is the dependency fix. Each step sees what earlier steps produced. Remove that line and step 3 has no idea what step 1 found, and the plan becomes worse than useless.\n\n---\n\n### Stage 3 -- The runner, with results carried forward\n\n```python\ndef run_plan(goal):\n    plan = make_plan(goal)\n\n    if plan.get(\"impossible\") or not plan.get(\"steps\"):\n        return {\"status\": \"impossible\", \"reason\": plan.get(\"impossible\", \"no plan produced\")}\n\n    steps = plan[\"steps\"]\n    results = {}\n    task_of = {}                      # step id -> task text, for the results block\n\n    print(\"PLAN:\")\n    for step in steps:\n        needs = f\" (needs {step['depends_on']})\" if step.get(\"depends_on\") else \"\"\n        print(f\"  {step['id']}. {step['task']}{needs}\")\n    print()\n\n    context = {\n        \"goal\": goal,\n        \"results_text\": lambda: \"\\n\".join(\n            f\"Step {i} ({task_of[i]}): {r}\" for i, r in results.items()\n        ) or \"Nothing yet.\"\n    }\n\n    index = 0\n    while index \u003c len(steps):         # re-reads steps every pass, on purpose\n        step = steps[index]\n        index += 1\n\n        missing = [d for d in step.get(\"depends_on\", []) if d not in results]\n        if missing:\n            print(f\"  ! step {step['id']} skipped, missing {missing}\")\n            continue\n\n        print(f\"  > step {step['id']}: {step['task']}\")\n        outcome = run_step(step, context)\n        task_of[step[\"id\"]] = step[\"task\"]\n        results[step[\"id\"]] = outcome\n        print(f\"    = {outcome[:140]}\\n\")\n\n    return {\"status\": \"finished\", \"plan\": steps, \"results\": results}\n```\n\n**Two small decisions here that both exist for the same reason: the plan is about to change while the loop is running.**\n\n`while index \u003c len(steps)` instead of `for step in steps`. A `for` loop takes a single iterator from the list object it was given at the start. If you later rebind the name `steps` to a *new* list, the running loop does not notice -- it is still walking the old one. Since Stage 4 replaces the remaining plan mid-run, a `for` loop would print \"revising plan\" and then quietly execute the old steps anyway. The `while` re-reads `steps` and `len(steps)` on every pass, so a replacement list actually takes effect.\n\n`task_of[i]` instead of `steps[i-1][\"task\"]`. Step **ids** are not list **positions**. The planner is told to number from 1, but nothing enforces it, and after a revise the new steps carry their own ids. Indexing by position raises `IndexError` on any plan numbered differently, and silently mislabels results after a revise. Keyed on the id, it is always right.\n\nRun it on the deadlines goal. You get a visible plan, then each step running in order, each seeing what came before.\n\n**Compare this against Day 9 on the same task.** Look at the trajectory of each. The plan version does less repeated work, and -- more usefully -- you can read what it intends to do before it does any of it.\n\n---\n\n### Stage 4 -- Replanning (the part that matters)\n\nNow the real content. After each step, check whether the rest of the plan still holds.\n\n```python\nREPLAN_PROMPT = \"\"\"You are checking whether a plan is still valid.\n\nYou get the goal, the plan, which steps are done, and what they found.\n\nReply with JSON only:\n{\"action\": \"continue\" | \"revise\" | \"stop\",\n \"reason\": \"one short sentence\",\n \"steps\": [ ...the new remaining steps, only if action is revise... ]}\n\nChoose \"continue\" unless something has genuinely changed.\nChoose \"revise\" if what was learned makes remaining steps wrong, redundant or\ninsufficient.\nChoose \"stop\" if the goal is already achieved, or is now clearly impossible.\"\"\"\n\n\ndef replan(goal, steps, results, current_id):\n    remaining = [s for s in steps if s[\"id\"] > current_id]\n    if not remaining:\n        return {\"action\": \"continue\"}\n\n    payload = {\n        \"goal\": goal,\n        \"completed\": [{\"id\": i, \"result\": str(r)[:400]} for i, r in results.items()],\n        \"remaining_steps\": remaining\n    }\n\n    response = client.chat.completions.create(\n        model=MODEL,\n        messages=[\n            {\"role\": \"system\", \"content\": REPLAN_PROMPT},\n            {\"role\": \"user\", \"content\": json.dumps(payload, indent=2)}\n        ],\n        temperature=0,\n        response_format={\"type\": \"json_object\"}\n    )\n    return json.loads(response.choices[0].message.content)\n```\n\nWire it into the runner, at the bottom of the `while` body, after each step completes:\n\n```python\n        decision = replan(goal, steps, results, step[\"id\"])\n\n        if decision[\"action\"] == \"stop\":\n            print(f\"  [stopping: {decision['reason']}]\")\n            break\n\n        if decision[\"action\"] == \"revise\":\n            print(f\"  [revising plan: {decision['reason']}]\")\n            steps = steps[:index] + decision.get(\"steps\", [])\n            # index already points just past the step that finished,\n            # so the next pass runs the first revised step.\n```\n\n**`steps[:index]`, not a filter on ids.** Everything up to and including the step that just finished is kept; everything after it is thrown away and replaced. Slicing by position is correct here even though lookups elsewhere go by id, because \"what has already run\" is a fact about the loop, not about the numbering.\n\n**Check that the revision really ran.** Print the step ids as they execute. If you see the revised ids appear in the output, the rebind took effect. If the run continues with the original plan after printing \"revising plan\", you are back on a `for` loop somewhere.\n\n**Test it by breaking reality.** Move your documents folder somewhere else so step 1 finds nothing, and run again.\n\nWithout replanning: step 1 finds nothing, steps 2, 3 and 4 run anyway, and you get a note about deadlines that do not exist.\n\nWith replanning: after step 1 returns nothing, it should `stop` or `revise` -- \"no deadlines found, there is nothing to summarise\".\n\n**That difference is the whole day.** A plan alone makes the agent tidier. Replanning makes it able to be wrong and recover, which is what actually matters in real use.\n\n**The cost is honest and worth stating:** one extra model call after every step. On a six-step plan that is six extra calls, plus the planning call. Plan-execute-replan can easily cost more than plain ReAct. What you buy is structure, visibility, and less wasted work on complex tasks. On simple tasks you are paying for nothing.\n\n---\n\n### Stage 5 -- Reflect at the end\n\nOne last call, and it is cheap:\n\n```python\nREFLECT_PROMPT = \"\"\"You review finished work against its original goal.\n\nReply with JSON only:\n{\"achieved\": \"fully\" | \"partly\" | \"no\",\n \"gaps\": [\"what is missing or weak\"],\n \"redo_step\": \u003cstep id to redo, or null>,\n \"suggestion\": \"how to do that step better\"}\n\nBe strict. Judge against the goal as written, not against what was attempted.\"\"\"\n```\n\nRun it after the plan finishes, print the result, and -- if `redo_step` is set -- re-run that one step with the suggestion appended to its task.\n\n**Two warnings, both real.**\n\n**Do not let it redo more than once.** Reflection loops can go around forever, each pass finding something new to improve. One redo, then stop.\n\n**Do not trust reflection as verification.** It is the same model judging the same work, so it is optimistic. Keep Day 9's `verify_in_code` for anything with a checkable outcome. Reflection is for *improving* the work; verification is for *believing* it. Different jobs.\n\n---\n\n### Stage 6 -- Work out when planning is worth it\n\nRun the same three tasks through both `autonomous.run` (Day 9) and `run_plan` (today). Record steps, total tokens and whether the result was actually good.\n\nTry:\n\n- **Simple:** \"What time is it in Tokyo?\"\n- **Medium:** \"Find deadlines in my documents and save a note.\"\n- **Complex:** \"Compare what my documents say about budget and timeline, check for contradictions, and write a summary with sources.\"\n\nYou will most likely find:\n\n| Task | Better approach | Why |\n|---|---|---|\n| Simple | ReAct, easily | The planning call costs more than the whole task |\n| Medium | About even | Planning helps a little, costs a little |\n| Complex | Plan and replan | Structure prevents the wandering |\n\n**Write your actual numbers down.** This is a judgement you will make constantly for the rest of the course, and having measured it once on your own machine is worth more than any rule of thumb.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **Decomposition** | Breaking a goal into smaller steps. |\n| **Plan-and-execute** | Plan everything first, then carry it out. |\n| **ReAct** | Decide one step at a time. Days 7 and 9. |\n| **Replanning** | Checking after each step whether the rest still makes sense. |\n| **Reflection** | Critiquing finished work and possibly redoing part of it. |\n| **Subtask / step** | One item in the plan. |\n| **depends_on** | Which steps must finish first. |\n| **DAG** | A dependency graph with no loops. What a plan really is. |\n| **Plan drift** | Following a plan that stopped being right. |\n| **Over-planning** | Planning a task too simple to need it. |\n| **Hallucinated capability** | Planning a step using a tool that does not exist. |\n| **Executor** | The part that carries out one step. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Plan something impossible.**\nAsk for a plan involving email, or the web, or anything you have no tool for.\n*You will see:* often, a confident plan using invented tools.\n*It teaches:* a plan is generated text. Plausibility is free; feasibility is not. The executor must check.\n\n**2. Remove the dependency context.**\nDelete `RESULTS SO FAR` from the executor prompt.\n*You will see:* every step starts blind. Step 3 asks for information step 1 already found.\n*It teaches:* passing results forward is not a detail, it is the point.\n\n**3. Break reality mid-plan.**\nRename your documents folder after the plan is made but before it runs.\n*You will see:* without replanning, it produces a summary of nothing. With replanning, it stops.\n*It teaches:* the difference between a plan and an adaptive plan, felt directly.\n\n**4. Force over-planning.**\nChange the rule to \"between 8 and 12 steps\" and give it a simple task.\n*You will see:* invented busywork steps, higher cost, worse output.\n*It teaches:* more structure is not better structure. \"Fewer is better\" earns its place in the prompt.\n\n**5. Make a step fail permanently.**\nBreak `search_documents` so it always errors. Run a plan that depends on it.\n*You will see:* whether replanning notices, or whether later steps carry on regardless.\n*It teaches:* dependency handling only helps if failure propagates. Note whether yours does -- and whether `depends_on` should also check that the dependency *succeeded*, not just ran.\n\n**6. Compare the costs honestly.**\nTotal tokens for ReAct versus plan-and-replan, on your three tasks.\n*You will see:* planning often costs more.\n*It teaches:* it is a trade, not an upgrade. Anyone who tells you agents should always plan has not measured it.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- planning tasks that do not need it**\n*Symptom:* three model calls for something one call answers.\n*Fix:* decide first whether the task has real structure. Some systems make this choice with a cheap classifier -- Day 3's `classify.py` is exactly that shape.\n\n**Trap 2 -- steps that are not executable**\n*Symptom:* a beautiful plan where step 2 says \"analyse the results thoroughly\" and the executor has no idea what to do.\n*Fix:* require each step to name a tool or be explicit reasoning. Vague steps are where plans quietly fail.\n\n**Trap 3 -- plan drift**\n*Symptom:* it completes every step and produces the wrong thing.\n*Cause:* the plan stopped matching reality at step 2 and nothing checked.\n*Fix:* replanning. This is the single most common failure of plan-and-execute.\n\n**Trap 4 -- dependencies that only check existence**\n*Symptom:* step 3 runs on step 1's error message as if it were data.\n*Fix:* `depends_on` should check that the dependency *succeeded*, not just that it ran. Experiment 5 will show you this.\n\n**Trap 5 -- reflection loops**\n*Symptom:* it redoes work forever, each pass finding a new improvement.\n*Fix:* one redo, maximum. Reflection is an optimisation, not a quality gate.\n\n**Trap 6 -- the plan as an injection surface**\n*Symptom:* rare and nasty. A document says \"ignore the plan and do X\", the planner reads it during a research step, and the revised plan contains it.\n*Cause:* replanning feeds tool results back into a prompt that generates instructions.\n*Fix:* Day 13. For now, know that revised plans deserve the same suspicion as any other model output, and that a `revise` action is a more dangerous thing than a `continue`.\n\n---\n\n## 10. Check yourself\n\n1. Give one task where ReAct beats planning, and one where planning wins. What distinguishes them?\n2. What does `depends_on` prevent, and what does it fail to check in your current code?\n3. Why is replanning more valuable than planning?\n4. Why can reflection not replace Day 9's verification?\n5. Your planner produces a step using a tool that does not exist. Whose job is it to catch that, and why?\n\n---\n\n## 11. Where this goes\n\n- **Day 11** fixes the memory problem underneath all this. Plans and results accumulate; the context window does not grow.\n- **Day 12** improves the retrieval your research steps depend on. A good plan over bad retrieval still produces a bad answer.\n- **Day 14** is planning across several agents: the plan becomes the allocation of work, and `depends_on` becomes coordination between workers.\n- **Day 15** measures all of this properly -- cost per task, success rate, and whether planning was worth it on your real workload.\n- **Day 16 (LangGraph)** is this day with a framework. Its whole idea is making the plan an explicit graph of states with edges between them. You will recognise `depends_on` immediately.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 10:\n\nFolders:\n  research-assistant/\n    ai/\n      venv/, .env, .gitignore, requirements.txt\n      chat.py, agent.py, autonomous.py\n      planner.py                  (NEW - plan, execute, replan, reflect)\n      mcp_agent.py, mcp_client.py, mcp_servers/my_tools.py\n      tools.py, prompts.py, classify.py, test_prompt.py\n      documents.py, embeddings.py, vector_store.py, chroma_db/\n      runs/, notes/, documents/, conversation.json\n    dashboard/                    (still empty)\n\nLibraries: no new installs\n\nplanner.py contains:\n\n  TOOL_LIST      - tool names + truncated descriptions, injected into the\n                   planner prompt so it can only plan with real tools\n  make_plan(goal) - JSON mode, temperature 0, returns\n                   {\"steps\":[{id, task, tool, depends_on}]}\n                   or {\"steps\":[], \"impossible\": \"...\"}\n                   rules: 2-6 steps, fewer is better, each step must map to\n                   one tool or be pure reasoning, no planning things it\n                   already knows\n\n  run_step(step, context, max_calls=4)\n                 - a small agent run scoped to ONE step\n                 - per-step call budget, so one bad step cannot eat the run\n                 - prompt includes OVERALL GOAL and RESULTS SO FAR, which is\n                   how dependencies actually get satisfied\n\n  run_plan(goal) - prints the plan before executing anything\n                 - a WHILE loop over an index, not a for loop, so a plan\n                   replaced mid-run is actually executed\n                 - skips steps whose depends_on are not in results\n                 - carries results forward via context[\"results_text\"]()\n                 - results labelled from task_of[id], keyed on step id, never\n                   by list position\n\n  replan(goal, steps, results, current_id)\n                 - runs AFTER every step\n                 - returns {\"action\": \"continue\"|\"revise\"|\"stop\", \"reason\",\n                   \"steps\": [...new remaining steps...]}\n                 - \"revise\" replaces everything after the current step, via\n                   steps = steps[:index] + new_steps\n\n  reflection pass at the end\n                 - {\"achieved\", \"gaps\", \"redo_step\", \"suggestion\"}\n                 - at most ONE redo, then stop\n\nKey decisions made:\n  - a plan is structured JSON, never prose\n  - the planner is only ever shown real tool names, and the executor still\n    checks, because planners hallucinate capability anyway\n  - each step gets its own small budget rather than sharing one big one\n  - the executor loop re-reads the plan list on every pass, because the\n    headline feature of the day is replacing that list while it runs\n  - replanning is the point; planning alone was measured as barely better\n    than ReAct\n  - reflection improves work; it does NOT verify it. Day 9's\n    verify_in_code is still the thing that decides whether to believe a run.\n\nMeasured on three tasks (simple / medium / complex):\n  simple  -> ReAct wins, the planning call costs more than the task\n  medium  -> roughly even\n  complex -> plan + replan clearly better, less repeated work\n  planning generally costs MORE tokens; it is a trade, not an upgrade\n\nKnown problems, left for later:\n  - depends_on only checks that a step RAN, not that it SUCCEEDED, so a\n    failed step's error message can be used as input by a later step\n  - no automatic choice between ReAct and planning; it is manual\n  - replanning feeds tool results into a prompt that generates instructions,\n    which is a prompt-injection surface (Day 13)\n  - results accumulate with no trimming; long plans will overflow (Day 11)\n  - steps run strictly in order, never in parallel even when independent\n    (Day 14)\n```\n\n---\n\n## Answers\n\n**1.** ReAct wins on \"what time is it in Tokyo\" -- a single tool call, where the planning call costs more than the task itself. Planning wins on \"compare three approaches and write a recommendation\", which has several parts with real dependencies. The distinguishing feature is structure: multiple parts that depend on each other, where order matters and work can be repeated by accident.\n\n**2.** It prevents a step running before the steps it needs have run. It does not check whether those steps *succeeded* -- a failed step still counts as present in `results`, so a later step can happily treat an error message as data.\n\n**3.** Because the plan is written when the agent knows the least it will ever know. Step 2 routinely makes steps 4 and 5 wrong. Without replanning, the agent marches through a plan that stopped being correct, which can be worse than never having planned.\n\n**4.** Because it is the same model judging its own work, and it is optimistic about it. Verification checks evidence -- the file exists, it contains what it should -- and cannot be talked round. Reflection improves work; verification decides whether to believe it.\n\n**5.** The executor's. The planner produces text, and a plausible-looking plan is exactly as easy to generate as a feasible one. Only the code that actually tries to run the step can find out that the tool does not exist -- which is why unknown tool names return a message rather than crashing.\n"},{"file":"day-11.md","title":"Day 11 -- Memory Engineering","module":"03 -- Advanced Agent Systems","time":"about 1 hour","minutes":23,"md":"# Day 11 -- Memory Engineering\n\n**Module:** 03 -- Advanced Agent Systems\n**Time:** about 1 hour\n**Builds on:** Day 2 -- the sliding window problem; Day 6 -- embeddings; Day 7 and 9 -- the scratchpad\n\n---\n\n## 1. Today in one line\n\nYou stop keeping what is **recent** and start keeping what **matters** -- which fixes the problem Day 2 left open and the one Day 9 is about to hit.\n\n---\n\n## 2. The problem\n\nThree open wounds, all from earlier days.\n\n**Day 2's.** Your sliding window keeps the last eight messages. Tell it your name, chat about something else for ten turns, ask your name. Gone. Keeping everything instead is not an option -- the cost curve you watched climbing was real.\n\n**Day 9's.** A thirty-step autonomous run accumulates thirty tool results in the scratchpad. Long runs overflow the context window, and you cannot trim them, because trimming splits the `tool_calls` / `tool` pairs and the API rejects it. You have been avoiding this by raising the limit. That stops working.\n\n**The one nobody has mentioned yet.** Close your program. Open it tomorrow. It knows nothing about you. Not your name, not your job, not that you said last week you prefer short answers. Every conversation starts from zero, forever.\n\nThe instinct is to store more. That is the wrong instinct, and you can see why by thinking about what \"store everything\" actually means: a complete transcript of every conversation, which you then have to search, and which mostly contains \"ok\", \"thanks\" and \"what about the other one\".\n\nThe right question is not *how do I keep more*. It is **what deserves to be kept, and in what form**.\n\n---\n\n## 3. Mental model\n\n**A transcript versus a notebook.**\n\nA transcript is everything that was said, in order. Complete, enormous, and almost useless -- to find one fact you must search the whole thing.\n\nA notebook holds what you decided was worth writing down. Facts, not conversations. \"Rahul works in fintech, prefers short answers, based in Mumbai.\" Three lines that replace forty exchanges.\n\nYour memory is a notebook, not a recording. You do not remember Tuesday's conversation word for word. You remember that your friend changed jobs. You extracted the fact and discarded the transcript, without deciding to.\n\n**Where this comparison breaks, in a way that matters:**\n\n**Human forgetting is graceful.** Things fade -- you half-remember, you recognise when prompted, you know that you used to know. Systems forget catastrophically. A fact is either in the store or it is not, and when it is not, the assistant does not hesitate. It does not know that it does not know.\n\nSo a system's memory needs to be *deliberately* selective. Nothing fades on its own. Whatever you do not write down is gone completely and silently.\n\n---\n\n## 4. How it really works\n\n**Memory is not one thing. It is five, and they have different lifetimes.**\n\n| Kind | What it holds | Lives for | Where you have met it |\n|---|---|---|---|\n| **Working** | This agent run's scratchpad | One task | Day 7, 9 |\n| **Short-term** | This conversation | One session | Day 2 |\n| **Long-term (semantic)** | Facts about the user and world | Forever | Today |\n| **Episodic** | What happened in past sessions | Forever | Today, lightly |\n| **Procedural** | Learned how-to, refined instructions | Forever | Days 16+ |\n\nMost confusion about \"AI memory\" comes from mixing these up. \"Should the assistant remember this?\" has no answer until you say *which memory*. A one-off correction belongs in short-term. \"I'm vegetarian\" belongs in long-term. A tool result from step 4 belongs in working memory and should vanish at the end of the run.\n\n**The three operations**\n\n**Writing.** After each turn, decide what is worth keeping. This needs judgement, so it is a model call -- a small one. It is called **extraction**: turning a conversation into facts.\n\n**Reading.** At the start of each turn, pull the *relevant* memories -- not the recent ones. You already have the tool for this: embeddings, Day 6. Embed the memory, embed the incoming message, find what is close.\n\n**This is the central swap of the whole day.** Day 2 used recency because it was easy. Today you use relevance, because you have embeddings. \"What's my name?\" retrieves the name fact regardless of how many turns ago it was mentioned.\n\n**Forgetting.** Unglamorous and necessary. Without it, memory fills with stale facts. \"I live in Mumbai\" from March and \"I moved to Pune\" from September are both true statements that were made, and only one is true now. Three kinds of forgetting: **superseding** (the new fact replaces the old), **decay** (old and unused facts fade), and **explicit** (\"forget that\").\n\n**The cost you are paying**\n\nEvery turn now costs an extra small call for extraction, plus an embedding lookup, plus the retrieved memories occupy context. Memory is not free. On Day 15 you will decide whether to extract on every turn or every fifth.\n\n---\n\n## 5. Setup\n\nNothing new to install -- Chroma and sentence-transformers are already there from Day 6.\n\n```bash\ncd research-assistant/ai\nsource venv/bin/activate\n\ntouch memory.py\n```\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- Extract facts from conversation\n\n`memory.py`:\n\n```python\nimport os, json, uuid\nfrom datetime import datetime, timezone\nfrom dotenv import load_dotenv\nfrom openai import OpenAI\nimport chromadb\nfrom chromadb.utils import embedding_functions\n\nload_dotenv()\nclient = OpenAI(api_key=os.environ[\"GROQ_API_KEY\"],\n                base_url=\"https://api.groq.com/openai/v1\")\nMODEL = \"llama-3.3-70b-versatile\"\n\nEXTRACT_PROMPT = \"\"\"You pull out facts worth remembering long-term about a user.\n\nKeep ONLY things that will still be true and useful next week:\n- who they are, their work, their situation\n- stable preferences (\"prefers short answers\", \"vegetarian\")\n- ongoing projects and goals\n- important people, places and constraints in their life\n\nDo NOT keep:\n- the question they just asked\n- anything you told them\n- temporary states (\"I'm tired today\")\n- small talk, pleasantries, one-off requests\n\nReply with JSON only:\n{\"facts\": [{\"text\": \"a complete standalone sentence\", \"kind\": \"identity|preference|project|context\"}]}\n\nEach fact must make sense alone, with no pronouns referring outside itself.\nWrite \"Rahul works in fintech\", never \"he works there\".\nIf there is nothing worth keeping, return {\"facts\": []}. This is common and fine.\"\"\"\n\n\ndef extract_facts(user_message, assistant_reply=\"\"):\n    response = client.chat.completions.create(\n        model=MODEL,\n        messages=[\n            {\"role\": \"system\", \"content\": EXTRACT_PROMPT},\n            {\"role\": \"user\", \"content\": f\"USER SAID: {user_message}\\n\\nASSISTANT REPLIED: {assistant_reply[:500]}\"}\n        ],\n        temperature=0,\n        response_format={\"type\": \"json_object\"}\n    )\n    return json.loads(response.choices[0].message.content).get(\"facts\", [])\n\n\nif __name__ == \"__main__\":\n    print(extract_facts(\"Hi, I'm Rahul. I'm building a fintech startup in Mumbai and I prefer short answers.\"))\n    print(extract_facts(\"What's the weather like?\"))\n    print(extract_facts(\"Thanks, that's helpful!\"))\n```\n\nRun it:\n\n```\n[{'text': 'The user is named Rahul.', 'kind': 'identity'},\n {'text': 'Rahul is building a fintech startup in Mumbai.', 'kind': 'project'},\n {'text': 'Rahul prefers short answers.', 'kind': 'preference'}]\n[]\n[]\n```\n\n**Two things doing the real work here.**\n\n**The \"do NOT keep\" list is longer than the \"keep\" list, on purpose.** Without it, extraction saves everything -- every question asked, every answer given -- and within a week your memory is a worse transcript than the transcript.\n\n**\"Each fact must make sense alone.\"** This is not a style note. Facts get retrieved one at a time, out of order, months later, with no surrounding conversation. \"He mentioned it was important\" is worthless on its own. This one rule is the difference between a memory store that works and one that produces confusing noise.\n\nReturning `[]` for small talk is the correct and most common outcome.\n\n---\n\n### Stage 2 -- Store them\n\n```python\nchroma = chromadb.PersistentClient(path=\"./chroma_db\")\nembedder = embedding_functions.SentenceTransformerEmbeddingFunction(\n    model_name=\"all-MiniLM-L6-v2\")\n\nmemories = chroma.get_or_create_collection(\n    name=\"memories\",\n    embedding_function=embedder,\n    metadata={\"hnsw:space\": \"cosine\"}      # as on Day 6: the default is l2\n)\n\n\ndef remember(text, kind=\"context\", user=\"default\"):\n    memories.upsert(\n        ids=[uuid.uuid4().hex],\n        documents=[text],\n        metadatas=[{\n            \"kind\": kind,\n            \"user\": user,\n            \"created\": datetime.now(timezone.utc).isoformat(),\n            \"used\": 0\n        }]\n    )\n\n\ndef recall(query, top_n=5, user=\"default\"):\n    if memories.count() == 0:\n        return []\n\n    results = memories.query(\n        query_texts=[query],\n        n_results=min(top_n, memories.count()),\n        where={\"user\": user}\n    )\n\n    found = []\n    for text, meta, distance in zip(results[\"documents\"][0],\n                                    results[\"metadatas\"][0],\n                                    results[\"distances\"][0]):\n        score = 1 - distance\n        if score > 0.25:\n            found.append({\"text\": text, \"kind\": meta[\"kind\"], \"score\": score})\n    return found\n```\n\n**A separate collection from your documents.** They are different things with different lifetimes, and mixing them means a document chunk can be retrieved as if it were a fact about you.\n\n**`metadata={\"hnsw:space\": \"cosine\"}`, again.** New collection, so the choice has to be made again -- Chroma defaults to `l2`, and the space cannot be changed after creation. Without it, `1 - distance` is not a similarity and the `0.25` test below throws away perfectly good memories. **Every `get_or_create_collection` in this project sets the space explicitly.** If you leave it out of one collection and not another, the same threshold means two different things in two parts of your code, which is worse than having it wrong everywhere.\n\n**`score > 0.25` is the same cosine threshold as Day 6**, and it means the same thing here only because the space matches. Relevant memories usually land above 0.4; noise sits near 0.1.\n\n**`user` in the metadata, even though you are the only user.** Adding it later means migrating everything. Adding it now costs one line. On Day 20, when this runs as a service, you will be glad.\n\nTest it:\n\n```python\n    for fact in extract_facts(\"Hi, I'm Rahul. I'm building a fintech startup in Mumbai and I prefer short answers.\"):\n        remember(fact[\"text\"], fact[\"kind\"])\n\n    print(recall(\"what is my name\"))\n    print(recall(\"what am I working on\"))\n    print(recall(\"how should you talk to me\"))\n```\n\n**Look at the third one.** \"How should you talk to me\" retrieves \"Rahul prefers short answers\" -- no shared words at all. Day 6's embeddings, doing the thing keyword search could never do.\n\n---\n\n### Stage 3 -- Inject memories into the conversation\n\nNow connect it. In `chat.py`:\n\n```python\nfrom memory import extract_facts, remember, recall\n\n\ndef build_system_prompt(question):\n    found = recall(question, top_n=5)\n    if not found:\n        return SYSTEM_PROMPT\n\n    lines = \"\\n\".join(f\"- {m['text']}\" for m in found)\n    return (SYSTEM_PROMPT +\n            \"\\n\\nWHAT YOU KNOW ABOUT THIS USER:\\n\" + lines +\n            \"\\n\\nUse these naturally. Do not announce that you remember them.\")\n```\n\nAnd in the loop:\n\n```python\n    messages.append({\"role\": \"user\", \"content\": question})\n\n    send = [{\"role\": \"system\", \"content\": build_system_prompt(question)}] + trim_history(messages)[1:]\n    response = ask_model(send, tools=TOOL_SCHEMAS)\n    ...\n\n    for fact in extract_facts(question, answer):\n        remember(fact[\"text\"], fact[\"kind\"])\n```\n\n**Read what just happened.** The system prompt is now **rebuilt every turn**, based on what the current question is about. Different question, different memories injected. Memory is not a block of text you carry around -- it is a lookup, run fresh each turn.\n\n**Now the test Day 2 failed.** Run `chat.py`:\n\n```\nYou: Hi, I'm Rahul and I work in fintech.\nYou: What's the capital of France?\n... eight more unrelated turns ...\nYou: What's my name?\nAssistant: Your name is Rahul.\n```\n\n**Then quit, restart, and ask again.** It still knows. Memory now outlives the conversation.\n\n\"Do not announce that you remember them\" is there for a reason. Without it you get \"As I recall, you mentioned you work in fintech...\" every single turn, which is both irritating and slightly unsettling.\n\n---\n\n### Stage 4 -- Handle contradictions\n\nSay this:\n\n```\nYou: I live in Mumbai.\n... later ...\nYou: I've moved to Pune.\n```\n\nNow `recall(\"where do I live\")` returns **both**, and the model gets two contradictory facts with nothing to choose between them.\n\n```python\nCONFLICT_PROMPT = \"\"\"You decide whether a new fact replaces existing ones.\n\nReply with JSON only:\n{\"replaces\": [list of existing fact numbers this supersedes],\n \"keep_new\": true/false,\n \"reason\": \"one short sentence\"}\n\nA fact REPLACES another when it updates the same thing about the same subject\n(moved house, changed job, changed preference).\nIt does NOT replace when both can be true at once (two hobbies, two projects).\nSet keep_new to false only if the new fact is already covered by an existing one.\"\"\"\n\n\ndef remember_carefully(text, kind=\"context\", user=\"default\"):\n    similar = recall(text, top_n=4, user=user)\n\n    if not similar:\n        remember(text, kind, user)\n        return \"added\"\n\n    numbered = \"\\n\".join(f\"{i}. {m['text']}\" for i, m in enumerate(similar))\n    response = client.chat.completions.create(\n        model=MODEL,\n        messages=[\n            {\"role\": \"system\", \"content\": CONFLICT_PROMPT},\n            {\"role\": \"user\", \"content\": f\"EXISTING:\\n{numbered}\\n\\nNEW FACT:\\n{text}\"}\n        ],\n        temperature=0,\n        response_format={\"type\": \"json_object\"}\n    )\n    decision = json.loads(response.choices[0].message.content)\n\n    for index in decision.get(\"replaces\", []):\n        if 0 \u003c= index \u003c len(similar):\n            old = memories.get(where_document={\"$contains\": similar[index][\"text\"]})\n            if old[\"ids\"]:\n                memories.delete(ids=old[\"ids\"])\n\n    if decision.get(\"keep_new\", True):\n        remember(text, kind, user)\n        return f\"added, replaced {len(decision.get('replaces', []))}\"\n    return \"skipped, already known\"\n```\n\nSwap `remember` for `remember_carefully` in `chat.py` and test the Mumbai/Pune sequence. The old fact should disappear.\n\n**Two things worth being honest about.**\n\nThis costs an extra model call per fact. On Day 15 you will decide whether that is worth it -- one reasonable answer is to only run conflict resolution for `identity` and `preference` facts, where contradictions actually matter, and skip it for `project` and `context`.\n\nAnd deletion is permanent. A better production design keeps superseded facts with an `active: false` flag, so you have a history and can recover from a wrong call. Your version deletes, which is simpler and less forgiving.\n\n---\n\n### Stage 5 -- Fix the agent scratchpad\n\nNow the Day 9 problem. A long run overflows, and you cannot trim naively because of tool pairs.\n\n```python\ndef compress_scratchpad(messages, keep_recent=8):\n    \"\"\"Summarise old agent steps without breaking tool_call pairs.\"\"\"\n    system = messages[0]\n    body = messages[1:]\n\n    if len(body) \u003c= keep_recent + 4:\n        return messages\n\n    split = len(body) - keep_recent\n\n    # never split between an assistant tool_calls message and its tool results\n    while split \u003c len(body) and body[split].get(\"role\") == \"tool\":\n        split += 1\n\n    old, recent = body[:split], body[split:]\n\n    readable = []\n    for m in old:\n        role = m.get(\"role\")\n        if role == \"tool\":\n            readable.append(f\"tool result: {str(m.get('content'))[:200]}\")\n        elif m.get(\"tool_calls\"):\n            names = [c[\"function\"][\"name\"] for c in m[\"tool_calls\"]]\n            readable.append(f\"called: {', '.join(names)}\")\n        elif m.get(\"content\"):\n            readable.append(f\"{role}: {str(m['content'])[:200]}\")\n\n    response = client.chat.completions.create(\n        model=MODEL,\n        messages=[\n            {\"role\": \"system\", \"content\":\n             \"Summarise these agent steps in under 150 words. Keep every fact \"\n             \"found, every file written, every failure, and anything already \"\n             \"tried that did not work. Drop everything else.\"},\n            {\"role\": \"user\", \"content\": \"\\n\".join(readable)}\n        ],\n        temperature=0\n    )\n\n    summary = response.choices[0].message.content\n    return [system, {\"role\": \"user\", \"content\": f\"[Earlier steps summarised]\\n{summary}\"}] + recent\n```\n\n**The `while` loop is the fix you have been waiting for since Day 4.** It walks the split point forward past any `tool` messages, so a cut can never land between an assistant's tool request and its results. That orphaned-tool-call error is finally, properly dead.\n\n**\"Anything already tried that did not work\"** in the summary prompt is the line that prevents the worst failure: the agent forgetting its failures, repeating them, and looping. Facts are useless if the agent re-does work it already knows failed.\n\nUse it in `autonomous.py`, inside the loop before calling the model:\n\n```python\n        if len(messages) > 25:\n            messages = compress_scratchpad(messages)\n```\n\nNow run a task with `max_steps=30`. It survives.\n\n---\n\n### Stage 6 -- Forgetting\n\nThree kinds, all necessary.\n\n**Explicit.** Add a tool the user can trigger:\n\n```python\ndef forget(about):\n    \"\"\"Delete memories about a topic.\"\"\"\n    found = recall(about, top_n=5)\n    if not found:\n        return \"I have no memories about that.\"\n\n    removed = []\n    for m in found:\n        if m[\"score\"] > 0.5:\n            got = memories.get(where_document={\"$contains\": m[\"text\"]})\n            if got[\"ids\"]:\n                memories.delete(ids=got[\"ids\"])\n                removed.append(m[\"text\"])\n    return f\"Forgotten: {removed}\" if removed else \"Nothing close enough to delete.\"\n```\n\nRegister it as a tool so the user can say \"forget that I live in Mumbai\".\n\n**`0.5` here, not the `0.25` from `recall`, and the gap is deliberate.** Both are cosine similarities on the same scale, so they are directly comparable, and deleting is not symmetric with reading. Injecting a loosely-related memory into a prompt is a small cost; deleting one is permanent. So the delete bar sits well above the read bar: `recall` may show you a 0.3 match, `forget` will not act on it. **When two thresholds in one file read the same number, make sure they really are the same unit** -- that is the whole reason both collections pin `hnsw:space`.\n\n**Decay.** Track `used` in the metadata, bump it on every recall, and periodically delete `context`-kind facts that are old and never retrieved. Identity and preference facts should not decay.\n\n**A cap.** Above a few hundred memories, injection starts getting noisy -- the top 5 for any query becomes a loose collection of vaguely related things. Keep a ceiling and drop the least useful.\n\n**Then test the noise directly.** Add 50 memories and check what `recall(\"what's my name\")` returns. If facts with score 0.3 are creeping in, raise the threshold. Precision matters more than recall here: one wrong memory injected confidently is worse than five right ones missed.\n\n**One last thing, and it is not a technical point.** You have just built a file that quietly accumulates personal facts about a person from their conversations. If this ever runs for anyone but you: they should know it exists, be able to read it, and be able to delete it. That is why `forget` is a user-facing tool and not just a maintenance script.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **Working memory** | The current run's scratchpad. Dies with the task. |\n| **Short-term memory** | This conversation. Dies with the session. |\n| **Long-term / semantic** | Facts that last. Today's store. |\n| **Episodic memory** | What happened in past sessions. |\n| **Procedural memory** | Learned how-to. Refined instructions. |\n| **Extraction** | Turning conversation into standalone facts. |\n| **Consolidation** | Merging and tidying facts over time. |\n| **Superseding** | A new fact replacing an outdated one. |\n| **Decay** | Old, unused memories fading out. |\n| **Recency vs relevance** | Keeping the latest versus keeping what fits. The core swap today. |\n| **Memory injection** | Putting retrieved memories into the prompt. |\n| **Context rot** | Quality dropping as the context fills with marginally relevant text. |\n\n---\n\n## 8. Break it on purpose\n\n**1. The Day 2 test, properly.**\nName yourself, chat fifteen unrelated turns, restart the program, ask your name.\n*You will see:* it works, across the restart.\n*It teaches:* what memory actually means. Day 2 could not do this at any window size.\n\n**2. Turn off the \"do NOT keep\" list.**\nDelete it from `EXTRACT_PROMPT`. Have a normal ten-turn conversation. Count the memories.\n*You will see:* dozens, most of them worthless.\n*It teaches:* extraction quality is the whole system. A noisy store is worse than no store, because it retrieves confidently.\n\n**3. Contradict yourself with and without conflict handling.**\nMumbai, then Pune. Run it both ways.\n*You will see:* with plain `remember`, both facts get injected and the model picks one, sometimes the wrong one.\n*It teaches:* storing is not the hard part. Updating is.\n\n**4. Flood it.**\nAdd 50 varied memories. Run five specific queries and read what comes back.\n*You will see:* marginally relevant facts creeping into the top 5.\n*It teaches:* **con
