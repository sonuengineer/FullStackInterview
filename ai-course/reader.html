n    return StreamingResponse(events(), media_type=\"text/event-stream\")\n```\n\n**The SSE format is exactly this:** `data: ` then JSON then two newlines. That is the whole protocol. Browsers have `EventSource` built in, so the client side is four lines.\n\n**This one IS `async def`**, because it only sleeps and reads a dict. Async is right for waiting; threads are right for work.\n\nMake `do_research` report real progress, so there is something to stream:\n\n```python\n    update(status=\"running\", step=\"planning\")\n    plan_result = plan(question)\n    update(step=f\"{len(plan_result['sub_questions'])} sub-questions, gathering\")\n    ...\n    update(step=\"writing the report\")\n```\n\n**This is the difference between a usable product and a frustrating one.** The work takes the same four minutes either way.\n\n---\n\n### Stage 3 -- The Node dashboard\n\n`dashboard/server.js`:\n\n```javascript\nconst express = require(\"express\");\nconst app = express();\n\nconst AI_URL = process.env.AI_URL || \"http://localhost:8000\";\nconst AI_KEY = process.env.AI_KEY || \"demo-key-change-me\";\n\napp.use(express.json());\napp.use(express.static(\"public\"));\n\n// Node holds the key. The browser never sees it.\napp.post(\"/api/research\", async (req, res) => {\n  try {\n    const upstream = await fetch(`${AI_URL}/research`, {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\", \"X-API-Key\": AI_KEY },\n      body: JSON.stringify({ question: req.body.question }),\n    });\n    res.status(upstream.status).json(await upstream.json());\n  } catch (error) {\n    res.status(502).json({ error: \"The AI service is not reachable.\" });\n  }\n});\n\napp.get(\"/api/jobs/:id\", async (req, res) => {\n  try {\n    const upstream = await fetch(`${AI_URL}/jobs/${req.params.id}`, {\n      headers: { \"X-API-Key\": AI_KEY },\n    });\n    res.status(upstream.status).json(await upstream.json());\n  } catch (error) {\n    res.status(502).json({ error: \"The AI service is not reachable.\" });\n  }\n});\n\napp.listen(3000, () => console.log(\"Dashboard on http://localhost:3000\"));\n```\n\n**Node is a proxy, and that is the point.** The API key lives on the server. If the browser called Python directly, the key would be in the page source and anyone could take it.\n\nThis also removes the CORS problem entirely -- the browser only ever talks to its own origin.\n\n`dashboard/public/index.html`:\n\n```html\n\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003ctitle>Research Agent\u003c/title>\n  \u003cstyle>\n    body { font-family: system-ui, sans-serif; max-width: 750px; margin: 40px auto;\n           padding: 0 20px; line-height: 1.6; background: #14181c; color: #e6e9ec; }\n    textarea { width: 100%; padding: 12px; font: inherit; background: #1d2329;\n               color: inherit; border: 1px solid #2f3942; border-radius: 6px; }\n    button { padding: 10px 22px; font: inherit; background: #2f7d5d; color: white;\n             border: 0; border-radius: 6px; cursor: pointer; margin-top: 10px; }\n    button:disabled { opacity: .5; cursor: default; }\n    #status { color: #9aa6b1; margin: 20px 0; }\n    #report { white-space: pre-wrap; background: #1d2329; padding: 20px;\n              border-radius: 8px; }\n    .sources { font-size: .85em; color: #9aa6b1; margin-top: 20px; }\n    .warn { color: #d98b4a; }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003ch1>Research Agent\u003c/h1>\n  \u003ctextarea id=\"q\" rows=\"3\" placeholder=\"What would you like researched?\">\u003c/textarea>\n  \u003cbutton id=\"go\">Research\u003c/button>\n  \u003cdiv id=\"status\">\u003c/div>\n  \u003cdiv id=\"report\">\u003c/div>\n  \u003cdiv class=\"sources\" id=\"sources\">\u003c/div>\n\n\u003cscript>\nconst go = document.getElementById(\"go\");\nconst status = document.getElementById(\"status\");\nconst report = document.getElementById(\"report\");\nconst sources = document.getElementById(\"sources\");\n\ngo.onclick = async () => {\n  const question = document.getElementById(\"q\").value.trim();\n  if (!question) return;\n\n  go.disabled = true;\n  report.textContent = \"\";\n  sources.textContent = \"\";\n  status.textContent = \"Starting...\";\n\n  const started = await fetch(\"/api/research\", {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\" },\n    body: JSON.stringify({ question }),\n  }).then(r => r.json());\n\n  if (!started.job_id) {\n    status.textContent = \"Error: \" + (started.detail || started.error);\n    go.disabled = false;\n    return;\n  }\n\n  const poll = setInterval(async () => {\n    const job = await fetch(\"/api/jobs/\" + started.job_id).then(r => r.json());\n    status.textContent = job.step || job.status;\n\n    if (job.status === \"done\") {\n      clearInterval(poll);\n      go.disabled = false;\n      const result = job.result;\n      status.textContent = `Finished in ${result.seconds}s`;\n      report.textContent = result.report;\n\n      const bad = result.citations.fabricated;\n      sources.innerHTML =\n        `\u003cb>${result.sources.length} sources\u003c/b>\u003cbr>` +\n        result.sources.map(s => `[${s.id}] ${s.source}`).join(\"\u003cbr>\") +\n        (bad.length ? `\u003cbr>\u003cspan class=\"warn\">Unverified citations: ${bad.join(\", \")}\u003c/span>` : \"\") +\n        (result.failed_sources.length ? `\u003cbr>\u003cspan class=\"warn\">Unavailable: ${result.failed_sources.join(\", \")}\u003c/span>` : \"\");\n    }\n\n    if (job.status === \"failed\") {\n      clearInterval(poll);\n      go.disabled = false;\n      status.textContent = \"Failed: \" + job.error;\n    }\n  }, 2000);\n};\n\u003c/script>\n\u003c/body>\n\u003c/html>\n```\n\nRun both:\n\n```bash\n# terminal 1\ncd ai && uvicorn api:app --port 8000\n\n# terminal 2\ncd dashboard && node server.js\n```\n\nOpen `http://localhost:3000` and research something.\n\n**Look at what the page shows underneath the report:** the source list, any unverified citations, and any source that was unavailable. Day 18's verification, surfaced to the person reading. A product that shows its own uncertainty is a more honest one than a product that does not.\n\n---\n\n### Stage 4 -- Survive a restart\n\n`JOBS` is a dict in memory. Restart and everyone's work vanishes.\n\n```python\nimport sqlite3, json\n\nDB = \"jobs.db\"\n\ndef init_db():\n    with sqlite3.connect(DB) as db:\n        db.execute(\"\"\"CREATE TABLE IF NOT EXISTS jobs (\n            id TEXT PRIMARY KEY, user TEXT, status TEXT, step TEXT,\n            question TEXT, result TEXT, error TEXT, created REAL)\"\"\")\n\ndef save_job(job_id, **fields):\n    with sqlite3.connect(DB) as db:\n        existing = db.execute(\"SELECT * FROM jobs WHERE id=?\", (job_id,)).fetchone()\n        if existing:\n            sets = \", \".join(f\"{k}=?\" for k in fields)\n            db.execute(f\"UPDATE jobs SET {sets} WHERE id=?\",\n                       (*[json.dumps(v) if k == \"result\" else v\n                          for k, v in fields.items()], job_id))\n        else:\n            db.execute(\"INSERT INTO jobs (id, user, status, step, question, created) \"\n                       \"VALUES (?,?,?,?,?,?)\",\n                       (job_id, fields.get(\"user\"), fields.get(\"status\"),\n                        fields.get(\"step\"), fields.get(\"question\"), time.time()))\n```\n\n**On startup, mark anything still `running` as `failed`** -- those jobs died with the old process and will never finish:\n\n```python\n@app.on_event(\"startup\")\ndef on_start():\n    init_db()\n    with sqlite3.connect(DB) as db:\n        db.execute(\"UPDATE jobs SET status='failed', error='Server restarted' \"\n                   \"WHERE status IN ('queued','running')\")\n```\n\nWithout that, a user polls a job that is never going to move, forever.\n\nNow add `/history`, which is what makes it feel like a product rather than a demo:\n\n```python\n@app.get(\"/history\")\ndef history(x_api_key: Optional[str] = Header(None)):\n    account = authenticate(x_api_key)\n    with sqlite3.connect(DB) as db:\n        rows = db.execute(\n            \"SELECT id, question, status, created FROM jobs WHERE user=? \"\n            \"ORDER BY created DESC LIMIT 20\", (account[\"user\"],)).fetchall()\n    return [{\"id\": r[0], \"question\": r[1], \"status\": r[2], \"created\": r[3]} for r in rows]\n```\n\n---\n\n### Stage 5 -- Package it\n\n`ai/Dockerfile`:\n\n```dockerfile\nFROM python:3.12-slim\n\nWORKDIR /app\nRUN apt-get update && apt-get install -y --no-install-recommends gcc \\\n    && rm -rf /var/lib/apt/lists/*\n\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\nENV PYTHONUNBUFFERED=1\nEXPOSE 8000\n\nHEALTHCHECK --interval=30s --timeout=5s \\\n  CMD python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"\n\nCMD [\"uvicorn\", \"api:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\n`.dockerignore`:\n\n```\n.env\nvenv/\nvenv-crew/\nchroma_db/\nlogs/\nruns/\n__pycache__/\n*.db\n```\n\n**`.env` in `.dockerignore` is not optional.** Copy your key into an image and it is in the image forever, in every layer, on every registry it is ever pushed to. Keys go in at run time:\n\n```bash\ndocker run -e GROQ_API_KEY=$GROQ_API_KEY -e DEMO_KEY=$DEMO_KEY -p 8000:8000 research-agent\n```\n\n**One thing the embeddings model makes awkward.** `sentence-transformers` downloads its model on first use, so your first container request is slow and needs network access. Either bake the model into the image at build time, or mount a cache volume. Find out which before you deploy, not after.\n\n`PYTHONUNBUFFERED=1` makes your logs appear immediately instead of sitting in a buffer -- the single most annoying container problem to debug without it.\n\n---\n\n### Stage 6 -- The pre-deployment checklist\n\nGo through it honestly. Anything unticked is something you will find out about at a bad time.\n\n**Security**\n- [ ] No secrets in code, in git, or in the image\n- [ ] Every endpoint authenticated\n- [ ] Users can only read their own jobs\n- [ ] Input length capped\n- [ ] CORS restricted to your own origin, not `*`\n- [ ] Day 13: write tools disabled or approval-gated in the service\n\n**Cost**\n- [ ] Per-user daily budget enforced\n- [ ] A hard token and time budget per job\n- [ ] Cost per request logged\n- [ ] You know what a busy day costs\n\n**Reliability**\n- [ ] `/health` exists and is honest\n- [ ] Jobs survive a restart\n- [ ] Running jobs are marked failed on startup\n- [ ] Day 15's fallback model wired in\n- [ ] A hanging job cannot run forever\n\n**Operability**\n- [ ] Trace id on every request, returned to the client\n- [ ] Logs go to stdout\n- [ ] No message contents or document text in logs\n- [ ] You can answer \"what happened to job abc123\" from logs alone\n\n**Test it under real conditions:**\n\n```bash\n# two at once -- does the server stay responsive?\ncurl -X POST localhost:8000/research -H \"X-API-Key: demo-key-change-me\" \\\n  -H \"Content-Type: application/json\" -d '{\"question\":\"test one\"}' &\ncurl localhost:8000/health\n\n# no key\ncurl -X POST localhost:8000/research -H \"Content-Type: application/json\" \\\n  -d '{\"question\":\"test\"}'\n\n# someone else's job\ncurl localhost:8000/jobs/abc123 -H \"X-API-Key: demo-key-change-me\"\n```\n\n**The concurrency test is the one that matters.** If `/health` hangs while a research job runs, you used `async def` where you needed `def`, and you have just found the bug that would have taken your service down on its first real day.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **ASGI / uvicorn** | The server that runs FastAPI. |\n| **Background task** | Work started by a request but not finished during it. |\n| **Job pattern** | Return a ticket, do the work, let them check. |\n| **Polling** | Asking repeatedly if it is done. |\n| **SSE** | Server-Sent Events. One connection, pushed updates. |\n| **CORS** | Browser rule about which origins may call your API. |\n| **Proxy** | A server that forwards requests. Your Node layer. |\n| **Health check** | An endpoint saying whether the service is alive. |\n| **Graceful shutdown** | Finishing or recording in-flight work before exiting. |\n| **12-factor** | Config from the environment, logs to stdout, no local state. |\n| **Event loop blocking** | Sync work in an async handler, freezing everything. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Block the event loop.**\nChange `def start_research` to `async def` and call `research()` directly inside it. Then hit `/health` while a job runs.\n*You will see:* `/health` hangs. The whole server is frozen.\n*It teaches:* **the most important thing today.** It works perfectly with one user.\n\n**2. Restart mid-job.**\nStart a job, kill the server, restart, poll the job.\n*You will see:* with SQLite and the startup sweep, `failed: Server restarted`. Without, either nothing or a job stuck at `running` forever.\n*It teaches:* in-memory state is not state.\n\n**3. Read someone else's report.**\nRemove the ownership check and fetch another user's job.\n*It teaches:* ids are not secrets.\n\n**4. Spend the budget.**\nSet `daily_usd` to 0.01 and run two reports.\n*You will see:* a 429 on the second.\n*It teaches:* what stands between one user and your whole quota.\n\n**5. Break CORS on purpose.**\nHave the browser call `http://localhost:8000` directly.\n*You will see:* a CORS error in the console.\n*It teaches:* why Node proxies, and where your key would have ended up.\n\n**6. Kill the AI service.**\nStop uvicorn, leave Node running, click Research.\n*You will see:* whether you get a clear message or a broken page.\n*It teaches:* the dashboard must handle its backend being down.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- `async def` around sync work**\n*Symptom:* fine alone, frozen with two users.\n*Fix:* plain `def` for endpoints calling sync code. FastAPI thread-pools them.\n*This is the most common serious bug in deployed Python AI services.*\n\n**Trap 2 -- holding the request open for minutes**\n*Symptom:* gateway timeouts at 30 or 60 seconds, and lost work.\n*Fix:* the job pattern.\n\n**Trap 3 -- secrets in the image**\n*Symptom:* silent. Then a leaked key.\n*Fix:* `.dockerignore`, and inject at run time.\n\n**Trap 4 -- no per-user budget**\n*Symptom:* your quota gone in an afternoon.\n*Fix:* enforce before starting work.\n\n**Trap 5 -- state in memory**\n*Symptom:* every deployment loses in-flight work.\n*Fix:* SQLite at minimum, and sweep stale jobs on startup.\n\n**Trap 6 -- logging everything**\n*Symptom:* a permanent, growing file of user questions and document text.\n*Fix:* Day 15's rule. Ids and counts, not contents.\n\n---\n\n## 10. Check yourself\n\n1. Why can a research endpoint not just do the work and return the answer?\n2. Why `def` rather than `async def`, and what exactly goes wrong?\n3. Why does Node proxy to Python instead of the browser calling it directly?\n4. What must happen to `running` jobs when the server restarts, and why?\n5. Name two things that must never appear in your container image.\n\n---\n\n## 11. Where this goes\n\n- **Day 21** is the capstone. This service becomes the platform: user accounts, saved reports, uploads, and the interface built properly.\n- Everything from earlier now has a production home. Day 9's budgets are enforced per user. Day 13's permissions decide what a deployed agent may touch. Day 15's logs are the only window you have.\n- Tomorrow is mostly assembly and judgement. The hard engineering is behind you.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 20:\n\nFolders:\n  research-assistant/\n    ai/\n      api.py               (NEW - FastAPI service)\n      Dockerfile           (NEW)\n      .dockerignore        (NEW - .env, venv, chroma_db, logs, runs, *.db)\n      jobs.db              (NEW - SQLite job persistence)\n      research/            (pipeline, sources, DECISIONS.md)\n      observability.py, evals.py, reliability.py, logs/\n      retrieval.py, golden_set.py, vector_store.py, embeddings.py\n      documents.py, tools.py, memory.py, security.py\n      graph_agent.py, crew_agent.py, multi_agent.py\n      chat.py, agent.py, autonomous.py, planner.py\n      mcp_agent.py, mcp_client.py, mcp_servers/my_tools.py\n      prompts.py, classify.py, test_prompt.py\n      runs/, notes/, documents/, chroma_db/\n    dashboard/             (NO LONGER EMPTY - 19 days later)\n      server.js            (NEW - Express proxy)\n      public/index.html    (NEW - the UI)\n      package.json\n\nLibraries: fastapi[standard], uvicorn (Python). express, node-fetch (Node).\n\nARCHITECTURE:\n  Browser -> Node :3000 -> Python :8000 -> the agent\n  Node is a PROXY. It holds the API key so the browser never sees it, and\n  it removes CORS entirely because the browser only calls its own origin.\n\napi.py endpoints:\n  GET  /health                 - liveness + active job count\n  POST /research               - returns {job_id, status} immediately\n  GET  /jobs/{id}              - status, step, and result when done\n  GET  /jobs/{id}/stream       - SSE, pushes progress as it changes\n  GET  /history                - the user's last 20 jobs\n\nTHE MOST IMPORTANT DETAIL:\n  endpoints that call research() are declared `def`, NOT `async def`.\n  research() is synchronous and takes minutes. In an async handler it\n  blocks the event loop and freezes the ENTIRE server for every other\n  user. Declared as plain def, FastAPI runs it in a thread pool.\n  This works perfectly with one user and collapses with two, which is\n  why it is so commonly shipped.\n  The SSE endpoint IS async, because it only sleeps and reads a dict.\n  Async is right for waiting; threads are right for work.\n\nOther deployment details that matter:\n  JOBS_LOCK around the shared jobs dict - background tasks are threads\n  ownership check on /jobs/{id} - job ids are not secrets\n  budget checked BEFORE starting, spend recorded after\n  estimate_cost(result) sums the \"usd\" of every logs/calls.jsonl row sharing\n    the job's trace id - Day 15's log read back, not a new number. Only as\n    complete as the instrumentation, and PRICING drifts, so it is an estimate\n  input length capped at 500 chars\n  CORS restricted to ALLOWED_ORIGINS, never \"*\"\n  on startup, any job left \"running\" or \"queued\" is marked failed with\n      \"Server restarted\" - otherwise a user polls forever\n  PYTHONUNBUFFERED=1 so container logs appear immediately\n  .env in .dockerignore; keys injected at run time with -e\n  sentence-transformers downloads its model on first use, so the first\n      container request is slow and needs network - bake it in or mount\n      a cache volume\n\nThe dashboard surfaces Day 18's verification to the reader:\n  the source list, any FABRICATED citations, and any source that was\n  unavailable. The product shows its own uncertainty.\n\nPre-deployment checklist completed across security, cost, reliability\nand operability (see Day 20 stage 6).\n\nKey decisions made:\n  - the job pattern, because agent work takes minutes and HTTP does not\n  - Node proxies rather than the browser calling Python\n  - SQLite for jobs; in-memory state is not state\n  - per-user daily budget enforced, not just measured\n  - logs contain ids and counts, never message contents or document text\n\nKnown problems, left for Day 21:\n  - API keys are a hardcoded dict; no real user accounts\n  - no document upload; documents/ is still a local folder\n  - the dashboard polls; the SSE endpoint exists but the UI does not use it\n  - no rate limit on requests per minute, only daily spend\n  - single process; no queue, so many concurrent jobs will exhaust threads\n```\n\n---\n\n## Answers\n\n**1.** Because it takes minutes, and HTTP connections held open that long get closed by proxies, load balancers or the browser. The user sees an error and the completed work is lost. The job pattern returns a ticket immediately and lets them check on it.\n\n**2.** Because `research()` is synchronous. Inside an `async def` handler it blocks the event loop, so the entire server -- every endpoint, every other user -- freezes until it finishes. A plain `def` handler is run in a thread pool by FastAPI, leaving the loop free.\n\n**3.** So the API key stays on the server. If the browser called Python directly, the key would be visible in the page source to anyone who looked. It also means the browser only ever talks to its own origin, which removes CORS.\n\n**4.** They must be marked failed. Those jobs died with the old process and will never progress, so a client polling them would wait forever with no explanation.\n\n**5.** The `.env` file, and anything else containing credentials -- plus large local state like `chroma_db`, `logs` and `runs`, which do not belong in an image either. Secrets are injected at run time, never baked in.\n"},{"file":"day-21.md","title":"Day 21 -- Capstone: Build the Research AI Agent Platform","module":"05 -- Deployment and Capstone","time":"longer than an hour. Give it a weekend if you can.","minutes":22,"md":"# Day 21 -- Capstone: Build the Research AI Agent Platform\n\n**Module:** 05 -- Deployment and Capstone\n**Time:** longer than an hour. Give it a weekend if you can.\n**Builds on:** all twenty days\n\n---\n\n## 1. Today in one line\n\nYou turn yesterday's service into something another person could sign into, upload their own documents to, and get a cited report out of -- and then you hand it to someone and watch.\n\n---\n\n## 2. The problem\n\nYesterday's service works. Here is why it is a demo and not a platform.\n\n**There is one user.** API keys are a dict in the source. Everyone shares one `documents/` folder and one Chroma collection. If two people used it, each would search the other's files.\n\n**Documents arrive by you copying them into a folder.** A user cannot add anything.\n\n**Reports vanish.** You can run one and read it. You cannot come back tomorrow and find it.\n\n**Nothing says what it cannot do.** Someone using this would not know that reports vary between runs, that web search sometimes fails, or that a citation can occasionally be unverified.\n\nThat last one matters more than it sounds. A research tool that quietly hides its limits is worse than one that states them, because the user trusts it exactly as much as a tool that deserves trust.\n\n**And there is a trap in today specifically.** The word \"platform\" invites feature-building. You will want accounts with passwords, teams, sharing, exports, a settings page. Resist it.\n\n> A capstone is judged on being finished, not on being large.\n\nA narrow thing that works completely, with its limits written down, is a far better piece of work -- and a far better thing to show someone -- than a broad thing with six half-features.\n\n---\n\n## 3. Mental model\n\n**A demo is a thing you drive. A product is a thing you hand over.**\n\nWhen you drive it, you steer around the rough parts without noticing. You know which questions work. You know not to upload a scanned PDF. You know to restart it when it gets stuck.\n\nHand it to someone else and every one of those becomes a bug report.\n\n**Where this comparison breaks, and it is the useful part:**\n\nA normal product either works or it does not. **Yours is statistical and you cannot make it deterministic.** So \"finished\" cannot mean \"always right\". It has to mean:\n\n- it does the narrow thing it claims, most of the time\n- when it fails, it fails visibly rather than confidently\n- the user can check its working\n- and the limits are written down where they will be read\n\nThat is a reachable definition of done. \"Never wrong\" is not, and chasing it is how capstones stay unfinished.\n\n---\n\n## 4. How it really works\n\n**Scope: three versions. Pick the middle one.**\n\n**Minimum (a weekend).** One user, upload documents, run research, see cited reports, keep history. Everything from Day 20 plus upload and persistence.\n\n**The real one (a week).** Multiple users with isolated documents, upload and ingest, streaming progress, saved report history, a visible limitations page, deployed somewhere with a URL.\n\n**Do not attempt.** Real accounts with password reset, teams and sharing, billing, a mobile app, real-time collaboration, fine-tuning. Every one is weeks and none of them demonstrates anything you learned in this course.\n\n**Isolation is the one genuinely new piece of engineering**\n\nMultiple users means every store needs a user boundary:\n\n| Store | How it separates |\n|---|---|\n| Documents | `uploads/{user_id}/` |\n| Vector index | one Chroma collection per user, or a `user` metadata filter |\n| Memory | the `user` field you added on Day 11 |\n| Jobs | the ownership check from Day 20 |\n\n**The Day 11 decision pays off here.** You put `user` into memory metadata when you had exactly one user, because adding it later means migrating everything. Today it is free.\n\n**Ingestion is a pipeline, not a copy**\n\n```\nupload -> validate -> extract text -> chunk -> embed -> index -> confirm\n```\n\nValidation is not optional: file type, size cap, and Day 13's content scan. Someone else's document is untrusted input by definition.\n\n**Make it idempotent.** Upload the same file twice and you should get one copy, not two -- Day 6's stable ids, `{user}::{filename}::{chunk}`.\n\n---\n\n## 5. Setup\n\n```bash\ncd research-assistant/ai\nsource venv/bin/activate\npip install python-multipart\n\nmkdir -p uploads\ntouch users.py ingest.py LIMITATIONS.md README.md\n```\n\n`python-multipart` is what lets FastAPI accept file uploads.\n\n---\n\n## 6. Build it\n\n---\n\n### Stage 1 -- Scope it in writing, including what is out\n\nBefore any code. `README.md`:\n\n```markdown\n# Research Agent Platform\n\nUpload your documents. Ask a research question. Get a report where every\nclaim carries a source you can check.\n\n## What it does\n- Upload PDF, TXT, MD, DOCX (up to 10 MB each, 50 files per user)\n- Breaks a question into sub-questions and searches each one\n- Searches your documents and the web\n- Produces a report with Summary, Findings, Disagreements and Gaps\n- Every claim cites a source id, and every id is verified against what was\n  actually retrieved\n- Keeps your last 50 reports\n\n## What it does NOT do\n- No accounts with passwords (API key per user)\n- No sharing between users\n- No scanned PDFs (no OCR, so image-only PDFs produce nothing)\n- No documents in languages other than English (the embedding model)\n- No editing or re-running a report\n- Reports are not reproducible: the same question twice gives different\n  emphasis\n\n## Known limits\nSee LIMITATIONS.md.\n\n## Why it is built this way\nSee research/DECISIONS.md.\n```\n\n**Write the \"does NOT\" section before you build.** It is what stops the scope creeping, and it is the section someone reading your work will respect most.\n\n---\n\n### Stage 2 -- Users and isolation\n\n`ai/users.py`:\n\n```python\nimport os, json, secrets, hashlib\n\nUSERS_FILE = \"users.json\"\nDEFAULT_BUDGET = 1.00\n\n\ndef _load():\n    return json.load(open(USERS_FILE)) if os.path.exists(USERS_FILE) else {}\n\n\ndef _save(users):\n    with open(USERS_FILE, \"w\") as f:\n        json.dump(users, f, indent=2)\n\n\ndef create_user(name):\n    users = _load()\n    key = \"ra_\" + secrets.token_urlsafe(24)\n    user_id = hashlib.sha256(key.encode()).hexdigest()[:12]\n\n    users[key] = {\"user_id\": user_id, \"name\": name, \"daily_usd\": DEFAULT_BUDGET}\n    _save(users)\n\n    os.makedirs(f\"uploads/{user_id}\", exist_ok=True)\n    return key, user_id\n\n\ndef lookup(key):\n    return _load().get(key)\n\n\ndef user_paths(user_id):\n    return {\n        \"uploads\": f\"uploads/{user_id}\",\n        \"collection\": f\"docs_{user_id}\",\n    }\n```\n\nThen make retrieval user-aware. In `vector_store.py`:\n\n```python\ndef get_collection(user_id):\n    return chroma.get_or_create_collection(\n        name=f\"docs_{user_id}\",\n        embedding_function=embedder,\n        metadata={\"hnsw:space\": \"cosine\"}      # same space for every user\n    )\n\n\ndef search(question, user_id, top_n=3):\n    collection = get_collection(user_id)\n    if collection.count() == 0:\n        return []\n    ...\n```\n\n**`hnsw:space` matters more here than anywhere else so far.** This function creates a collection per user, so the space is chosen once per signup instead of once in your whole program. Leave it out and Chroma uses `l2`, and because the space is fixed at creation, you end up with some users on cosine and some on L2 depending on which version of the code was deployed when they joined -- the same relevance threshold silently meaning two different things for two different accounts. **Anything created per-tenant must have its settings pinned in code, not inherited from a library default.**\n\n**Then thread `user_id` all the way down** -- `sources.py`, `pipeline.py`, `research()`. It is tedious, mechanical, and the single most important correctness change in the whole capstone.\n\n**Test it immediately and properly:**\n\n```python\nkey_a, user_a = create_user(\"Alice\")\nkey_b, user_b = create_user(\"Bob\")\n# upload a document containing \"PINEAPPLE\" as Alice only\n# search for \"pineapple\" as Bob -> must return nothing\n```\n\n**If Bob can see Alice's documents, nothing else you build today matters.** Do this test before moving on, and do it again at the end.\n\n**Note what `create_user` does with the key.** It stores the key as the lookup and derives the user id from a hash of it. That is simple and it works; it is not how a real system stores credentials, and your README already says there are no real accounts. Being clear about that is better than pretending.\n\n---\n\n### Stage 3 -- Upload and ingest\n\n`ai/ingest.py`:\n\n```python\nimport os, hashlib\nfrom langchain_community.document_loaders import PyPDFLoader, TextLoader, Docx2txtLoader\nfrom langchain_text_splitters import RecursiveCharacterTextSplitter\nfrom vector_store import get_collection\nfrom security import scan\n\nMAX_BYTES = 10 * 1024 * 1024\nMAX_FILES = 50\nALLOWED = {\".pdf\", \".txt\", \".md\", \".docx\"}\n\nsplitter = RecursiveCharacterTextSplitter(\n    chunk_size=1000, chunk_overlap=150,\n    separators=[\"\\n\\n\", \"\\n\", \". \", \" \", \"\"])\n\n\ndef validate(filename, size, user_id):\n    extension = os.path.splitext(filename)[1].lower()\n    if extension not in ALLOWED:\n        return f\"Cannot read {extension} files.\"\n    if size > MAX_BYTES:\n        return f\"Too large. Limit is {MAX_BYTES // 1024 // 1024} MB.\"\n\n    folder = f\"uploads/{user_id}\"\n    if os.path.isdir(folder) and len(os.listdir(folder)) >= MAX_FILES:\n        return f\"You have reached the limit of {MAX_FILES} files.\"\n    return None\n\n\ndef ingest(path, filename, user_id):\n    extension = os.path.splitext(filename)[1].lower()\n\n    if extension == \".pdf\":\n        documents = PyPDFLoader(path).load()\n    elif extension == \".docx\":\n        documents = Docx2txtLoader(path).load()\n    else:\n        documents = TextLoader(path, encoding=\"utf-8\").load()\n\n    text = \"\\n\".join(d.page_content for d in documents)\n    if len(text.strip()) \u003c 50:\n        return {\"ok\": False, \"error\":\n                \"No readable text found. Scanned PDFs are not supported.\"}\n\n    flags = scan(text)\n\n    chunks = splitter.split_documents(documents)\n    collection = get_collection(user_id)\n\n    ids, texts, metadatas = [], [], []\n    for index, chunk in enumerate(chunks):\n        ids.append(f\"{filename}::{index}\")\n        texts.append(chunk.page_content)\n        metadatas.append({\n            \"source\": filename,\n            \"page\": chunk.metadata.get(\"page\", 0),\n            \"flagged\": bool(flags),\n        })\n\n    collection.upsert(ids=ids, documents=texts, metadatas=metadatas)\n\n    return {\"ok\": True, \"chunks\": len(chunks),\n            \"flagged\": flags[:3] if flags else None}\n```\n\nThe endpoint, in `api.py`:\n\n```python\nfrom fastapi import UploadFile, File\n\n@app.post(\"/documents\")\ndef upload(file: UploadFile = File(...), x_api_key: str = Header(None)):\n    account = authenticate(x_api_key)\n    user_id = account[\"user_id\"]\n\n    contents = file.file.read()\n    problem = validate(file.filename, len(contents), user_id)\n    if problem:\n        raise HTTPException(400, problem)\n\n    safe_name = os.path.basename(file.filename)\n    path = os.path.join(\"uploads\", user_id, safe_name)\n    with open(path, \"wb\") as f:\n        f.write(contents)\n\n    result = ingest(path, safe_name, user_id)\n    if not result[\"ok\"]:\n        os.remove(path)\n        raise HTTPException(400, result[\"error\"])\n\n    return {\"filename\": safe_name, \"chunks\": result[\"chunks\"],\n            \"flagged\": result[\"flagged\"]}\n\n\n@app.get(\"/documents\")\ndef list_documents(x_api_key: str = Header(None)):\n    account = authenticate(x_api_key)\n    folder = f\"uploads/{account['user_id']}\"\n    if not os.path.isdir(folder):\n        return []\n    return [{\"filename\": n, \"bytes\": os.path.getsize(os.path.join(folder, n))}\n            for n in sorted(os.listdir(folder))]\n\n\n@app.delete(\"/documents/{filename}\")\ndef delete_document(filename: str, x_api_key: str = Header(None)):\n    account = authenticate(x_api_key)\n    safe = os.path.basename(filename)\n    path = os.path.join(\"uploads\", account[\"user_id\"], safe)\n\n    if os.path.exists(path):\n        os.remove(path)\n\n    collection = get_collection(account[\"user_id\"])\n    existing = collection.get(where={\"source\": safe})\n    if existing[\"ids\"]:\n        collection.delete(ids=existing[\"ids\"])\n\n    return {\"deleted\": safe}\n```\n\n**Four things worth noting.**\n\n**`os.path.basename` on the filename.** Day 13. An upload named `../../../etc/passwd` is a request, not an accident.\n\n**Ids are `filename::index`**, so re-uploading replaces rather than duplicates. Idempotent ingest.\n\n**Delete removes the chunks too.** A user deleting a document and still getting it in results is a real failure -- and an important one, because it is also the mechanism by which someone can withdraw data they did not mean to share.\n\n**Flagged content is recorded, not blocked.** Day 13's scanner catches lazy injections. Blocking on it would reject legitimate documents that happen to discuss prompt injection. Recording lets you show the user a warning.\n\n---\n\n### Stage 4 -- The dashboard, properly\n\nExtend `dashboard/public/index.html` to three panels: documents, ask, history. The key part is switching from polling to the SSE endpoint you built yesterday and never used:\n\n```javascript\nfunction runResearch(question) {\n  fetch(\"/api/research\", {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\" },\n    body: JSON.stringify({ question }),\n  })\n  .then(r => r.json())\n  .then(started => {\n    if (!started.job_id) { showError(started.detail); return; }\n\n    const stream = new EventSource(\"/api/jobs/\" + started.job_id + \"/stream\");\n\n    stream.onmessage = (event) => {\n      const update = JSON.parse(event.data);\n      setStatus(update.step || update.status);\n\n      if (update.status === \"done\") {\n        stream.close();\n        renderReport(update.result);\n        loadHistory();\n      }\n      if (update.status === \"failed\") {\n        stream.close();\n        showError(update.error);\n      }\n    };\n\n    stream.onerror = () => {\n      stream.close();\n      setStatus(\"Connection lost. Checking...\");\n      pollOnce(started.job_id);       // fall back to polling\n    };\n  });\n}\n```\n\nAdd the SSE proxy in `server.js`:\n\n```javascript\nconst { Readable } = require(\"node:stream\");\n\napp.get(\"/api/jobs/:id/stream\", async (req, res) => {\n  const upstream = await fetch(`${AI_URL}/jobs/${req.params.id}/stream`, {\n    headers: { \"X-API-Key\": AI_KEY },\n  });\n\n  res.setHeader(\"Content-Type\", \"text/event-stream\");\n  res.setHeader(\"Cache-Control\", \"no-cache\");\n  res.setHeader(\"X-Accel-Buffering\", \"no\");\n\n  // upstream.body is a WEB ReadableStream; res is a NODE stream.\n  Readable.fromWeb(upstream.body).pipe(res);\n  req.on(\"close\", () => upstream.body.cancel().catch(() => {}));\n});\n```\n\n**That `Readable.fromWeb` is not decoration, and it is worth understanding.** Node's global `fetch` is undici, which follows the web standard, so `response.body` is a **Web `ReadableStream`** -- the kind a browser gives you, with `getReader()` and no `.pipe()`. Express's `res` is a **Node stream**, with `.pipe()` and `.write()`. The two families are not interchangeable: writing `upstream.body.pipe(res)` throws `upstream.body.pipe is not a function` on the very first request. `Readable.fromWeb()` is the adapter between them.\n\nIf you prefer to see the chunks, write the loop by hand instead -- same result, and you can log or filter events on the way through:\n\n```javascript\n  const reader = upstream.body.getReader();\n  for (;;) {\n    const { value, done } = await reader.read();\n    if (done) break;\n    res.write(value);          // value is a Uint8Array\n  }\n  res.end();\n```\n\n**`req.on(\"close\", ...)` matters more than it looks.** When the browser tab closes, nothing cancels the upstream request by itself, and you leak an open connection to the Python service for every abandoned stream.\n\n**`X-Accel-Buffering: no` is a small line that saves an afternoon.** Some proxies buffer responses, so your events all arrive at once at the end -- which looks exactly like SSE not working at all.\n\n**And `stream.onerror` falling back to polling.** SSE connections drop. A product that breaks permanently on one dropped connection is not finished.\n\n**Render the report with its uncertainty visible:**\n\n```javascript\nfunction renderReport(result) {\n  document.getElementById(\"report\").textContent = result.report;\n\n  const warnings = [];\n  if (result.citations.fabricated.length)\n    warnings.push(`${result.citations.fabricated.length} citations could not be verified`);\n  if (result.failed_sources.length)\n    warnings.push(`Unavailable sources: ${result.failed_sources.join(\", \")}`);\n  if (result.citations.sources_used \u003c 2)\n    warnings.push(\"This report relies on very few sources\");\n\n  document.getElementById(\"warnings\").innerHTML =\n    warnings.map(w => `\u003cdiv class=\"warn\">${w}\u003c/div>`).join(\"\");\n}\n```\n\n**That third warning is the one to be proud of.** A report citing one source looks exactly as confident as a report citing twelve. Saying so is the whole difference between a research tool and a generator of plausible text.\n\n---\n\n### Stage 5 -- Measure the finished thing\n\nRun the whole system end to end, as a user would.\n\n```python\n# evals.py, extended to hit the HTTP API\nimport requests\n\ndef eval_via_api(key, questions):\n    results = []\n    for q in questions:\n        started = requests.post(\"http://localhost:8000/research\",\n                                json={\"question\": q},\n                                headers={\"X-API-Key\": key}).json()\n        # poll until done, then check\n        ...\n    return results\n```\n\nThen produce the numbers that describe your product:\n\n```\nReports run:            20\nCompleted:              18/20   (90%)\nFailed:                  2/20   (both: web search unavailable)\nFabricated citations:    0/18\nSingle-source reports:   3/18   (flagged in the UI)\nMedian cost per report:  $0.021\nMedian time:             94s\np95 time:                186s\n```\n\n**This table is the most professional artefact you will produce in the whole course.** Almost nobody who builds an AI project can tell you what theirs costs or how often it works. You can, because you built the eval set on Day 15 and the cost tracking on the same day.\n\nPut it in `LIMITATIONS.md`, with the honest text around it:\n\n```markdown\n# Limitations\n\n## Reports are not reproducible\nThe same question run twice produces different sub-questions and different\nemphasis. Measured: 20 runs, no two identical. Citations are always\nverifiable, but the shape of the report varies.\n\n## Citations are verified, claims are not\nEvery source id is checked against what was actually retrieved, so a cited\nsource always exists. Whether the source truly supports the claim is not\nchecked. Open the source.\n\n## Retrieval misses things\nMeasured recall@5 is 87% on a 15-question test set over the author's own\ndocuments. Roughly one question in eight will miss relevant material.\n\n## Web search is unreliable\nIt uses an unofficial endpoint and fails under rate limiting. The report is\nstill produced, and unavailable sources are named.\n\n## Not supported\nScanned PDFs (no OCR). Non-English documents. Files over 10 MB. More than\n50 files per user.\n\n## Cost\nMedian $0.021 per report at current rates. The daily cap is $1.00 per user.\n```\n\n**Writing your own limitations honestly is a skill**, and it is rarer than the engineering. Anyone can demo the good case.\n\n---\n\n### Stage 6 -- Hand it to someone\n\nThe last stage, and the most useful one.\n\nCreate a key for a friend. Send them the URL. Then **watch them use it and say nothing.**\n\nDo not explain. Do not steer them away from the thing you know is broken. Write down every moment they hesitate.\n\nYou will learn things no test told you:\n\n- they upload a photo of a document, because to them that is a document\n- they ask a one-word question\n- they ask something your documents cannot possibly answer\n- they wait fifteen seconds and click Research again\n- they do not notice the source list at all\n- they ask \"is this true?\" -- which is the correct question and the one your interface should answer better\n\n**Fix the top two things. Write the rest in a \"next\" list and stop.**\n\nThen finish the README with a short demo script -- three questions that show it working, taken from your eval set -- and a note saying what you would build next and why.\n\n**That is the capstone.** Not the largest thing you could build. The thing that works, whose limits you know and have written down, that someone else has actually used.\n\n---\n\n## 7. Words I heard today\n\n| Word | Plain meaning |\n|---|---|\n| **Multi-tenancy** | Several users on one system, isolated from each other. |\n| **Isolation** | User A cannot reach user B's data. |\n| **Ingestion** | Upload, validate, extract, chunk, embed, index. |\n| **Idempotent ingest** | Uploading twice gives one copy. |\n| **Scope** | What is in, and explicitly what is out. |\n| **MVP** | The smallest version that is genuinely useful. |\n| **Limitations document** | Written honest account of what it cannot do. |\n| **Demo script** | A short path through the product that shows it working. |\n| **Dogfooding** | Using your own product for real work. |\n\n---\n\n## 8. Break it on purpose\n\n**1. Two users, one secret word.**\nUpload a document containing a unique word as Alice, search for it as Bob.\n*You must see:* nothing.\n*It teaches:* the only test in this course that must pass. Run it twice -- once now and once when you think you are finished.\n\n**2. Upload something horrible.**\nA scanned PDF. A 40 MB file. A `.exe` renamed to `.pdf`. A file called `../../etc/passwd`.\n*You will see:* whether validation actually holds.\n*It teaches:* every upload is untrusted input.\n\n**3. Delete and search.**\nDelete a document, then search for something only it contained.\n*You will see:* whether the chunks really went.\n*It teaches:* deletion has to reach every store, and this is also how a user withdraws data.\n\n**4. Plant an injection, as a user.**\nDay 13's attack, uploaded through the interface.\n*You will see:* whether it is flagged, and whether least privilege still holds in the deployed path.\n*It teaches:* your defences must survive the real entry point, not just the test one.\n\n**5. Kill the internet.**\nRun a report with web search unreachable.\n*You will see:* whether you get a report with a named failure or a broken page.\n*It teaches:* graceful degradation, in the finished product.\n\n**6. Watch someone use it.**\nSay nothing for ten minutes.\n*You will see:* more than every other experiment combined.\n*It teaches:* the gap between a thing you drive and a thing you hand over.\n\n---\n\n## 9. Traps\n\n**Trap 1 -- scope creep**\n*Symptom:* day four of the capstone, building a settings page, core still rough.\n*Fix:* the \"does NOT do\" list, written first, defended.\n\n**Trap 2 -- no isolation**\n*Symptom:* one user sees another's documents.\n*Cause:* a `user_id` not threaded all the way down to the Chroma collection.\n*Fix:* experiment 1, run twice. This is the one genuinely serious bug available today.\n\n**Trap 3 -- duplicate ingest**\n*Symptom:* re-uploading a file makes every search return it twice.\n*Fix:* stable `filename::index` ids and `upsert`.\n\n**Trap 4 -- the invisible warning**\n*Symptom:* users trust a one-source report as much as a twelve-source one.\n*Fix:* show the uncertainty in the interface, not just in the JSON.\n\n**Trap 5 -- a demo pretending to be a product**\n*Symptom:* it only works on your three questions.\n*Fix:* stage 5's numbers, and stage 6's stranger.\n\n**Trap 6 -- no limitations document**\n*Symptom:* the work looks naive rather than finished.\n*Fix:* `LIMITATIONS.md`. Knowing what your system cannot do is evidence that you understand it.\n\n---\n\n## 10. Check yourself\n\n1. Name every store that needs a user boundary, and how each one gets it.\n2. What makes ingest idempotent, and what happens without it?\n3. Why record flagged content instead of blocking it?\n4. Why is \"the same question gives different reports\" a limitation to publish rather than a bug to fix?\n5. What is the single test that must pass before anything else matters?\n\n---\n\n## 11. Where this goes\n\nYou have finished the twenty-one days.\n\n- Use it yourself, on real work, for two weeks. You will find things no test did.\n- Fix the top two things your friend hit. Ignore the rest for now.\n- Keep the eval set running. Every change gets measured -- that habit is the most transferable thing you learned.\n\nThe next file has a longer answer about what to do from here.\n\n---\n\n## 12. PROJECT STATE\n\n```\nPROJECT STATE after Day 21 -- COURSE COMPLETE\n\nFolders:\n  research-assistant/\n    ai/\n      api.py               (upload, documents, research, jobs, stream, history)\n      users.py             (NEW - key creation, lookup, per-user paths)\n      ingest.py            (NEW - validate, extract, chunk, embed, index)\n      README.md            (NEW - what it does, and what it does NOT do)\n      LIMITATIONS.md       (NEW - honest, with measured numbers)\n      research/            (pipeline, sources, DECISIONS.md)\n      observability.py, evals.py, reliability.py, security.py\n      retrieval.py, golden_set.py, vector_store.py (now per-user collections)\n      embeddings.py, documents.py, tools.py, memory.py\n      graph_agent.py, crew_agent.py, multi_agent.py\n      chat.py, agent.py, autonomous.py, planner.py\n      mcp_agent.py, mcp_client.py, mcp_servers/my_tools.py\n      prompts.py, classify.py, test_prompt.py\n      uploads/{user_id}/   (NEW - per-user document storage)\n      jobs.db, users.json, chroma_db/, logs/, runs/, notes/\n      Dockerfile, .dockerignore, requirements.txt\n    dashboard/\n      server.js            (proxy: research, jobs, SSE stream, documents)\n      public/index.html    (documents panel, ask panel, history panel)\n\nLibraries added: python-multipart\n\nISOLATION - the one thing that must be right:\n  documents   -> uploads/{user_id}/\n  vectors     -> one Chroma collection per user, \"docs_{user_id}\"\n  memory      -> the \"user\" metadata field added on Day 11 (which is why it\n                 was added on Day 11, with one user, when it was free)\n  jobs        -> ownership check from Day 20\n  user_id threaded all the way down through sources.py and pipeline.py\n  TEST: upload a doc with a unique word as user A, search as user B,\n  must return nothing. Run this test twice - now and at the end.\n\nIngestion:\n  validate: extension allowlist, 10 MB cap, 50 file cap\n  os.path.basename on every filename (Day 13, path traversal)\n  ids are \"filename::index\" so re-upload REPLACES, never duplicates\n  delete removes the file AND the chunks from the collection\n  scan() flags suspicious content but does NOT block, because blocking\n    would reject legitimate documents that discuss injection; the flag is\n    surfaced to the user instead\n\nDashboard:\n  switched from polling to the SSE endpoint built on Day 20\n  proxy uses Readable.fromWeb(upstream.body).pipe(res), because fetch gives\n  a WEB ReadableStream and res is a NODE stream -- .pipe() does not exist on\n  the web one\n  X-Accel-Buffering: no on the proxy, or events arrive all at once at the end\n  onerror falls back to polling, because SSE connections drop\n  report renders WITH its uncertainty: unverified citations, unavailable\n  sources, and a warning when fewer than 2 sources were used\n\nMEASURED (the product's own numbers, in LIMITATIONS.md):\n  20 reports: 18 completed, 2 failed (web search unavailable)\n  0 fabricated citations\n  3 single-source reports, all flagged in the UI\n  median $0.021 and 94s per report, p95 186s\n  recall@5 87% on the Day 12 golden set\n\nScope discipline:\n  README's \"What it does NOT do\" written BEFORE building\n  explicitly out of scope: passwords, sharing, teams, billing, OCR,\n  non-English documents, editing reports\n\nStage 6: handed to another person, watched without helping. Top two\nobserved problems fixed; the rest written into a \"next\" list.\n\nWHAT WAS KEPT AS OURS THROUGHOUT, and no framework provides:\n  verify_citations, the budget system (steps/tokens/wall clock), the\n  permission model, the eval set, and every prompt.\n```\n\n---\n\n## Answers\n\n**1.** Documents (`uploads/{user_id}/`), the vector index (a per-user Chroma collection or a metadata filter), memory (the `user` field from Day 11), and jobs (the ownership check from Day 20). Each needs `user_id` threaded down to it, which is mechanical and easy to miss in one place.\n\n**2.** Stable ids of the form `filename::index` with `upsert`. Without it, re-uploading a file adds a second copy of every chunk, so searches return the same passage twice and crowd out other material.\n\n**3.** Because the scanner matches patterns that appear legitimately in documents about prompt injection, security, or AI itself. Blocking would reject real documents. Recording it lets you warn the user while still ingesting, and the real defence is least privilege anyway.\n\n**4.** Because it cannot be fixed. It is a property of how the system works, not a defect in your code. Publishing it means users calibrate their trust correctly; hiding it means they trust it as though it were deterministic, which it is not.\n\n**5.** Upload a document containing a unique word as one user, then search for that word as a different user. It must return nothing. If isolation fails, nothing else about the product matters.\n"},{"file":"day-22-what-next.md","title":"Day 22 -- What Next","module":"Epilogue","time":"","minutes":9,"md":"# Day 22 -- What Next\n\n**Not in the syllabus.** The course is 21 days and you have finished it. This is the part nobody writes: where you actually stand, and what to do on Monday.\n\n---\n\n## 1. Where you actually are\n\nBe accurate about this, in both directions.\n\n**What you can genuinely do now:**\n\n- Build an agent from nothing, with no framework, and explain every line\n- Read framework code and say what it is doing underneath\n- Build a RAG pipeline and **measure** whether it is any good\n- Recognise when a task needs an agent and when it needs one API call\n- Find the security holes in an agent system, including your own\n- Put a number on what your system costs and how often it works\n- Deploy it and hand it to someone else\n\n**What you cannot do yet, and should not claim:**\n\n- You have not run anything at scale. Fifty users behaves differently from two.\n- You have not operated a system for months. Drift, stale indexes and creeping cost are things you have read about, not survived.\n- You have used one model family on one free tier. Model differences are real and you have not felt them.\n- You have not worked inside someone else's large codebase, which is what most of this work actually is.\n\n**The most valuable thing you have is not on either list.** It is the habit: build it by hand, measure it, look at the raw output, be honest about what failed. That habit outlasts every library named in this course, and it is the thing most people skip.\n\n---\n\n## 2. Test whether the six primitives really landed\n\nDay 0 said the twenty-one topics were really six ideas. Answer these out loud, with no notes. If you cannot, the day to revisit is named.\n\n1. **The call.** What does the model do and what does your code do? *(Day 1, 4)*\n2. **State.** Where is the conversation stored, and why does it grow so fast? *(Day 2, 11)*\n3. **Instruction.** Why does \"at most 3 sentences\" beat \"don't be verbose\"? *(Day 3)*\n4. **Tools.** Walk the full tool-call cycle. How many API calls, and who runs the function? *(Day 4)*\n5. **Retrieval.** Why does a keyword search fail on synonyms, and why does vector search fail on invoice numbers? *(Day 5, 6, 12)*\n6. **The loop.** What single change turns a chatbot into an agent, and why is stopping the hard part? *(Day 7, 9)*\n\nAnd three that matter as much:\n\n7. Why can the agent not be the judge of its own success? *(Day 9)*\n8. Why can prompt injection not be fixed the way SQL injection was? *(Day 13)*\n9. Why does a single test run tell you almost nothing? *(Day 15)*\n\n**Anything you fumbled, go back to that day and redo the experiments.** Not the reading -- the experiments. That is where the understanding lives.\n\n---\n\n## 3. What to build next\n\nThree projects, increasing in difficulty. Pick one and finish it.\n\n**1. Something for yourself, used daily (one week)**\n\nNot a demo. Something you actually use: your email triaged, your reading queue summarised, your bank statements categorised, your notes searched properly.\n\n**Using your own thing daily is the fastest teacher available.** You will find failures no eval set contains, because real use is messier than any test you would write.\n\n**2. Something for one other person (two to three weeks)**\n\nPick someone with a real repetitive problem -- a teacher, a small business, a researcher -- and build the narrow thing that solves it.\n\nThis is harder than it sounds, and the difficulty is instructive: they do not know what an agent is, they do not care, and they will use it in ways you did not plan. Building for a real user teaches product judgement, which is the thing engineers in this field most often lack.\n\n**3. Something genuinely hard (a month or more)**\n\nChoose one:\n\n- **An agent that writes and runs code**, in a sandbox, with tests as verification. Verification is easy here -- the tests pass or they do not -- which makes it an excellent place to study agent reliability properly.\n- **A voice agent.** Real-time changes everything: latency budgets in hundreds of milliseconds, interruption handling, streaming throughout.\n- **An evaluation harness for agents**, properly. Less glamorous, in short supply, and the skill people actually pay for.\n- **A local-only agent.** Everything on your machine, no API. You will learn what the big models were doing for you.\n\n---\n\n## 4. What to learn next, in order\n\n**First: evaluation, seriously.** You built a 15-question golden set and a 10-task eval. That was the beginner version. Learn about proper test set construction, inter-rater agreement, judge calibration, and statistical significance for small samples. **This is the highest-leverage skill in applied AI right now** and the one most teams are worst at.\n\n**Second: cost and latency at scale.** Prompt caching, batch APIs, model distillation, routing hierarchies, streaming architecture. You measured your costs; now learn to move them by an order of magnitude.\n\n**Third: agent security, properly.** Day 13 was an introduction. Read the current literature on indirect prompt injection and agent sandboxing. It is an unsolved problem, which makes it a good place to be useful.\n\n**Fourth, only if you need it: fine-tuning.** Most people reach for it too early. The honest rule: try prompting, then few-shot, then RAG, then a better model, and only then fine-tune. Fine-tuning teaches style and format well; it teaches facts badly, and RAG does that job better.\n\n**Also worth your time:** structured output and constrained decoding, multimodal input (documents as images often beats text extraction), and async Python properly, since you met it several times and skated past it.\n\n---\n\n## 5. How to stay current without drowning\n\nThe field produces enormous noise. Most of it will not matter in six months.\n\n**What actually matters:**\n\n- Model releases that change capability meaningfully -- a few a year, not weekly\n- New primitives -- tool use, MCP and structured output were real. Most named techniques are not.\n- Cost changes. An order-of-magnitude price drop changes what is buildable.\n\n**What does not:**\n\n- Prompt tricks with names\n- Benchmark leaderboard movements\n- Framework feature announcements\n- Almost every thread beginning \"this changes everything\"\n\n**A sustainable habit:** read the model providers' own docs and release notes directly. Follow a small number of practitioners who ship things. Skim one paper a week, properly, rather than fifty abstracts. Ignore everything else and you will lose nothing.\n\n**And the test to apply:** when you read about a new technique, ask \"what does this replace in what I built?\" If you cannot answer, it is probably a rename of something you already know. A striking number of them are.\n\n---\n\n## 6. Keeping your project alive\n\nIf you stop touching it, it rots. Specifically:\n\n- **Model names change.** Groq deprecates them. Pin them in one place and check quarterly.\n- **Your index goes stale.** Documents change and the embeddings do not. Re-index on a schedule.\n- **Dependencies break.** LangChain especially. Pinned versions, and a deliberate upgrade once a quarter rather than whenever pip feels like it.\n- **Costs drift.** Prompts grow, context grows, nobody notices. Your Day 15 report is the check.\n\n**A monthly half hour:** run the evals, run the golden set, read the cost report, upgrade one dependency on purpose. That is the whole maintenance routine, and doing it is what separates a project from an abandoned repository.\n\n---\n\n## 7. Talking about the work\n\nIf this goes on a CV or into an interview, most people describe what they built. Describe what you **measured**. It is far rarer.\n\n**Weak:** \"Built an AI research agent with RAG and multi-agent orchestration using LangGraph and CrewAI.\"\n\n**Strong:** \"Built a research agent that produces cited reports. Measured retrieval at 87% recall@5 on a 15-question set, improving from 60% by adding hybrid search and cross-encoder reranking. Median cost $0.021 per report. Compared single-agent against multi-agent on the same eval set -- multi-agent cost 70% more for no quality gain, so I kept the single agent.\"\n\nThe second one says you can engineer. Anyone can list libraries.\n\n**Questions you should now be able to answer well:**\n\n- \"How do you know your RAG is working?\" -- the golden set, recall@k, MRR, measured before and after each change\n- \"How do you stop an agent doing something harmful?\" -- least privilege, budgets, approval gates, verification outside the agent\n- \"When would you not use an agent?\" -- most of the time; one call is cheaper and more reliable when the task is one step\n- \"How do you handle hallucination?\" -- grounding, an escape hatch with an exact phrase, citations verified in code, and accepting that the rate is never zero\n\n**Have the failures ready too.** \"The multi-agent version was worse and I removed it\" is a better answer than any success story, because it shows you measured rather than assumed.\n\n---\n\n## 8. The honest state of the field\n\n**What is real:** these systems do useful work today, tool use is genuinely transformative, RAG solves a real problem, costs are falling fast, and the gap between demo and production is where nearly all the difficulty lives.\n\n**What is oversold:** autonomy. Most \"autonomous agents\" are supervised pipelines with good marketing. Reliability is the binding constraint, not capability -- and you now know exactly why, because you measured a task that passed twice out of three.\n\n**What is genuinely unsolved:** prompt injection. Reliable long-horizon autonomy. Evaluation of open-ended output. Knowing when a model does not know.\n\n**Where that leaves you:** the demand is not for people who can call an API. It is for people who can make these systems reliable enough to trust, and who can tell the difference between a system that works and one that looks like it works.\n\nThat is the specific thing you spent twenty-one days learning.\n\n---\n\n## 9. The last thing\n\nYou built an agent from scratch before touching a framework. Most people never do that, and it is the reason you can debug things they cannot.\n\nKeep the habit. When the next framework arrives -- and it will, with a new vocabulary for the same six ideas -- you will be able to read it in an afternoon and judge whether it is worth adopting, because you know what it is wrapping.\n\nNow go and use the thing you built. On real work, for a fortnight. That is where the next set of lessons is.\n"}];
var MODULES = ["00 -- Start Here","01 -- Build the Foundation","02 -- AI Agents","03 -- Advanced Agent Systems","04 -- Frameworks","05 -- Deployment and Capstone","Epilogue"];
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem('kindle-'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set: function(k, v){ try{ localStorage.setItem('kindle-'+k, JSON.stringify(v)); }catch(e){} }
};
var progress = store.get('progress', {});
var notes = store.get('notes', {});
var themes = ['light','sepia','dark'];
var themeNames = {light:'Paper', sepia:'Sepia', dark:'Night'};
var cur = -1;

var marked = window.marked;
var renderer = new marked.Renderer();
renderer.code = function(code, lang){
  var out = '';
  try {
    if (lang && window.hljs && hljs.getLanguage(lang)) {
      out = hljs.highlight(code, {language: lang}).value;
    } else if (window.hljs) {
      out = hljs.highlightAuto(code).value;
    } else { out = code.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  } catch(e){ out = code.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  return '<pre><code class="hljs">' + out + '</code></pre>';
};
marked.setOptions({ renderer: renderer, gfm: true, breaks: false });

function el(id){ return document.getElementById(id); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function rx(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* ---------- settings ---------- */
function applySettings(){
  var theme = store.get('theme','light');
  document.body.className = 't-'+theme+' f-'+store.get('font','serif');
  document.documentElement.style.setProperty('--fs', store.get('fs',19)+'px');
  document.documentElement.style.setProperty('--measure', store.get('measure',680)+'px');
  el('theme-name').textContent = themeNames[theme];
  el('hl-light').disabled = theme==='dark';
  el('hl-dark').disabled = theme!=='dark';
}
el('theme-btn').onclick = function(){
  var t = store.get('theme','light');
  t = themes[(themes.indexOf(t)+1)%themes.length];
  store.set('theme', t); applySettings();
};
el('font-btn').onclick = function(){
  store.set('font', store.get('font','serif')==='serif'?'sans':'serif'); applySettings();
};
el('fs-up').onclick = function(){ store.set('fs', Math.min(26, store.get('fs',19)+1)); applySettings(); };
el('fs-down').onclick = function(){ store.set('fs', Math.max(15, store.get('fs',19)-1)); applySettings(); };

/* ---------- helpers ---------- */
function frac(i){ return (progress[i] && progress[i].f) || 0; }
function noteCount(i){
  var n = 0;
  for (var k in notes){ if (k.indexOf(i+':')===0 && notes[k].trim()) n++; }
  return n;
}
var parseCache = {i:-1, paras:[]};
function chapterText(i, pi){
  if (i !== parseCache.i){
    var d = document.createElement('div');
    d.innerHTML = marked.parse(DATA[i].md);
    parseCache.paras = Array.prototype.slice.call(d.querySelectorAll('p'));
    parseCache.i = i;
  }
  var p = parseCache.paras[pi];
  return p ? p.textContent.trim() : '';
}

/* ---------- dashboard ---------- */
function match(i,q){
  return DATA[i].title.toLowerCase().indexOf(q)>=0 || DATA[i].md.toLowerCase().indexOf(q)>=0;
}
function renderDashboard(){
  var total = DATA.length, done = 0, mins = 0, nnotes = 0;
  for (var i=0;i<total;i++){ if (frac(i)>=.9) done++; mins += DATA[i].minutes; nnotes += noteCount(i); }
  var pct = Math.round(done/total*100);
  el('st-done').textContent = done + ' / ' + total;
  el('st-notes').textContent = nnotes;
  el('st-time').textContent = (mins/60 >= 1 ? (Math.round(mins/6)/10)+'h' : mins+'m');
  el('ring').style.setProperty('--p', pct);
  el('ring-pct').textContent = pct + '%';

  var slot = el('resume-slot'); slot.innerHTML = '';
  var last = store.get('last', -1);
  var target = -1;
  if (last >= 0 && frac(last) > 0.02 && frac(last) < 0.9) target = last;
  else { for (var j=0;j<total;j++){ if (frac(j)<0.9){ target = j; break; } } }
  if (target >= 0){
    var b = document.createElement('button');
    b.className = 'btn';
    var short = DATA[target].title.replace(/^Day\s*\d+\s*--\s*/,'');
    b.innerHTML = 'Continue -- ' + esc(short) +
      (frac(target)>0.02 ? ' <small style="opacity:.75">(Ch. '+(target+1)+' - '+Math.round(frac(target)*100)+'%)</small>' : '');
    b.onclick = function(){ open(target); };
    slot.appendChild(b);
    var ex = document.createElement('button');
    ex.className = 'btn ghosty'; ex.style.marginLeft = '10px';
    ex.textContent = 'Export notes';
    ex.onclick = exportNotes;
    slot.appendChild(ex);
  }

  var q = el('search').value.trim().toLowerCase();
  var shelf = el('shelf'); shelf.innerHTML = '';
  var groups = {};
  DATA.forEach(function(c,i){ (groups[c.module] = groups[c.module]||[]).push(i); });
  MODULES.forEach(function(mod){
    var idxs = (groups[mod]||[]).filter(function(i){ return !q || match(i,q); });
    if (!idxs.length) return;
    var label = document.createElement('div'); label.className='module-label'; label.textContent = mod;
    shelf.appendChild(label);
    var grid = document.createElement('div'); grid.className='grid';
    idxs.forEach(function(i){
      var c = DATA[i], f = frac(i);
      var card = document.createElement('button');
      card.className = 'card';
      var plain = c.md.replace(/^#.*$/m,'').replace(/\*\*/g,'').replace(/[>#`|]/g,' ').replace(/\s+/g,' ').trim();
      var desc = plain.split(' ').slice(0,26).join(' ');
      card.innerHTML =
        '<span class="day">'+String(i+1).padStart(2,'0')+'</span>' +
        '<h3>'+esc(c.title)+'</h3><p>'+esc(desc)+'...</p>' +
        '<div class="meta"><span class="badge'+(f>=.9?' done':'')+'">'+(f>=.9?'Read':(f>0?Math.round(f*100)+'%':'Day '+(i+1)))+'</span>' +
        '<span>'+c.minutes+' min</span>' + (noteCount(i)?'<span class="badge notes">'+noteCount(i)+(noteCount(i)===1?' note':' notes')+'</span>':'') + '</div>' +
        '<div class="pbar"><i style="width:'+(f*100)+'%"></i></div>';
      card.onclick = function(){ open(i); };
      grid.appendChild(card);
    });
    shelf.appendChild(grid);
  });
  if (!shelf.children.length){
    shelf.innerHTML = '<div class="noresults">No chapters match "'+esc(q)+'".</div>';
  }
}
el('search').addEventListener('input', renderDashboard);

function exportNotes(){
  var keys = Object.keys(notes).filter(function(k){ return notes[k].trim(); });
  if (!keys.length){ alert('No notes yet. While reading, click any paragraph to attach a note.'); return; }
  keys.sort(function(a,b){ return (a.split(':')[0]-b.split(':')[0]) || (a.split(':')[1]-b.split(':')[1]); });
  var out = '# My notes -- 21-Day AI Engineer Course\n\n';
  var lastCh = -1;
  keys.forEach(function(k){
    var p = k.split(':'), i = +p[0], pi = +p[1];
    if (i !== lastCh){ out += '## '+DATA[i].title+'\n\n'; lastCh = i; }
    var quote = chapterText(i,pi);
    out += '> ' + quote.slice(0,160) + '\n\n**Note:** ' + notes[k].trim() + '\n\n---\n\n';
  });
  var blob = new Blob([out], {type:'text/markdown'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'my-notes.md'; a.click();
}

/* ---------- reader ---------- */
function open(i, anchor){
  cur = i;
  store.set('last', i);
  el('dashboard').classList.add('hide');
  el('reader').classList.remove('hide');
  el('bar-title').textContent = DATA[i].title;
  var page = el('page');
  page.innerHTML = marked.parse(DATA[i].md);
  // Wrap each table in its own scroll box. A 6-column table cannot shrink
  // below its min-content width, and setting overflow on the table itself does
  // not contain its rows, so on a phone it widened the whole article. The
  // wrapper is a plain block, which does contain them.
  page.querySelectorAll('table').forEach(function(t){
    if (t.parentElement && t.parentElement.classList.contains('table-wrap')) return;
    var wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });
  var hs = page.querySelectorAll('h2, h3');
  var toc = [];
  hs.forEach(function(h, hi){ h.id = 'h'+hi; toc.push({t:h.textContent, l:h.tagName, id:h.id}); });
  page.dataset.toc = JSON.stringify(toc);
  page.querySelectorAll('p').forEach(function(p, pi){
    p.classList.add('noteable');
    if (notes[i+':'+pi]) p.classList.add('has-note');
    p.addEventListener('click', function(){ editNote(i, pi, p); });
  });
  page.querySelectorAll('a').forEach(function(a){ a.target = '_blank'; a.rel='noopener'; });
  window.scrollTo(0,0);
  history.replaceState(null,'','#ch/'+i);
  var f = frac(i);
  if (!anchor && f > 0.02){
    requestAnimationFrame(function(){
      var max = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo(0, max * f);
    });
  }
  if (anchor){
    requestAnimationFrame(function(){
      var t = document.getElementById(anchor);
      if (t){ t.scrollIntoView(); t.classList.add('flash'); }
    });
  }
  el('prev-btn').style.visibility = i>0 ? 'visible':'hidden';
  el('next-btn').style.visibility = i<DATA.length-1 ? 'visible':'hidden';
  el('prev-label').textContent = i>0 ? DATA[i-1].title : '';
  el('next-label').textContent = i<DATA.length-1 ? DATA[i+1].title : '';
  el('chapinfo').textContent = 'Chapter '+(i+1)+' of '+DATA.length+' - '+DATA[i].minutes+' min read';
  window.addEventListener('scroll', onScroll);
}
function closeReader(){
  window.removeEventListener('scroll', onScroll);
  el('reader').classList.add('hide');
  el('dashboard').classList.remove('hide');
  el('bar-title').textContent = 'The 21-Day AI Engineer Course';
  el('search').value = '';
  history.replaceState(null,'','#');
  renderDashboard();
  window.scrollTo(0,0);
}
var scrollTick = null;
function onScroll(){
  if (scrollTick) return;
  scrollTick = requestAnimationFrame(function(){
    scrollTick = null;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var f = max>0 ? Math.min(1, window.scrollY/max) : 1;
    el('progress-fill').style.width = (f*100)+'%';
    if (cur >= 0){ progress[cur] = {f:f, done:f>=.9}; store.set('progress', progress); }
  });
}
el('home-btn').onclick = closeReader;
el('prev-btn').onclick = function(){ if (cur>0) open(cur-1); };
el('next-btn').onclick = function(){ if (cur<DATA.length-1) open(cur+1); };

/* ---------- notes ---------- */
var noteCtx = null;
function editNote(i, pi, pEl){
  noteCtx = {i:i, pi:pi, el:pEl};
  var ov = document.createElement('div'); ov.className='overlay'; ov.id='note-ov';
  var quote = pEl.textContent.trim().slice(0,180);
  ov.innerHTML = '<div class="panel"><h4>Note on this paragraph <button id="note-x">Esc</button></h4>' +
    '<div style="font-size:13.5px;color:var(--muted);font-style:italic;margin-bottom:12px;line-height:1.5">"'+esc(quote)+(quote.length>=180?'...':'')+'"</div>' +
    '<textarea id="note-ta" placeholder="Write your note..."></textarea>' +
    '<div class="row"><button class="chip danger" id="note-del">Delete</button><button class="chip primary" id="note-save">Save note</button></div></div>';
  document.body.appendChild(ov);
  var ta = el('note-ta');
  ta.value = notes[i+':'+pi] || '';
  ta.focus();
  ov.addEventListener('click', function(e){ if (e.target===ov) saveNote(); });
  el('note-x').onclick = saveNote;
  el('note-save').onclick = saveNote;
  el('note-del').onclick = function(){
    delete notes[noteCtx.i+':'+noteCtx.pi]; store.set('notes', notes);
    noteCtx.el.classList.remove('has-note'); closeNote();
  };
}
function saveNote(){
  if (!noteCtx) return;
  var v = el('note-ta').value.trim();
  if (v){ notes[noteCtx.i+':'+noteCtx.pi] = v; noteCtx.el.classList.add('has-note'); }
  else { delete notes[noteCtx.i+':'+noteCtx.pi]; noteCtx.el.classList.remove('has-note'); }
  store.set('notes', notes);
  closeNote();
}
function closeNote(){ var n = el('note-ov'); if (n) n.remove(); noteCtx = null; }

/* ---------- toc + find ---------- */
function showPanel(title, bodyBuilder){
  var ov = document.createElement('div'); ov.className='overlay'; ov.id='panel-ov';
  ov.innerHTML = '<div class="panel"><h4>'+title+' <button id="panel-x">Esc</button></h4><div id="panel-body"></div></div>';
  document.body.appendChild(ov);
  bodyBuilder(el('panel-body'));
  ov.addEventListener('click', function(e){ if (e.target===ov) ov.remove(); });
  el('panel-x').onclick = function(){ ov.remove(); };
  return ov;
}
el('toc-btn').onclick = function(){
  if (el('reader').classList.contains('hide')) return;
  var toc = JSON.parse(el('page').dataset.toc || '[]');
  showPanel('Contents', function(b){
    if (!toc.length){ b.innerHTML = '<div class="noresults">No sections</div>'; return; }
    toc.forEach(function(h){
      var a = document.createElement('button');
      a.className = 'toc-item ' + (h.l==='H3'?'h3':'');
      a.textContent = (h.l==='H3' ? '- ' : '') + h.t;
      a.onclick = function(){
        el('panel-ov').remove();
        var t = document.getElementById(h.id);
        if (t){ t.scrollIntoView({behavior:'smooth'}); t.classList.add('flash'); }
      };
      b.appendChild(a);
    });
  });
};
el('find-btn').onclick = function(){
  showPanel('Search in document', function(b){
    var inp = document.createElement('input');
    inp.type='search'; inp.placeholder = 'Type to search all '+DATA.length+' chapters...';
    inp.style.cssText = 'width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none;margin-bottom:14px';
    var res = document.createElement('div');
    b.appendChild(inp); b.appendChild(res);
    inp.addEventListener('input', function(){
      var q = inp.value.trim().toLowerCase();
      res.innerHTML = '';
      if (q.length < 2) return;
      var found = 0;
      for (var i=0;i<DATA.length && found<40;i++){
        var low = DATA[i].md.toLowerCase();
        var pos = 0, per = 0;
        while ((pos = low.indexOf(q, pos)) >= 0 && per < 3){
          var start = low.lastIndexOf('\n', pos)+1;
          var end = DATA[i].md.indexOf('\n', pos); if (end<0) end = DATA[i].md.length;
          var line = DATA[i].md.slice(start, end).replace(/[#>*`]/g,'').trim();
          if (line){
            (function(ci, lineTxt){
              var item = document.createElement('button'); item.className='sr-item';
              var marked1 = lineTxt.replace(new RegExp(rx(q),'gi'), function(m){ return '\u0001'+m+'\u0002'; });
              item.innerHTML = '<div class="where">'+esc(DATA[ci].title)+'</div><div class="snip">'+
                esc(marked1).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>')+'</div>';
              item.onclick = function(){ el('panel-ov').remove(); open(ci); };
              res.appendChild(item); found++; per++;
            })(i, line);
          }
          pos += q.length;
        }
      }
      if (!found) res.innerHTML = '<div class="noresults">Nothing found.</div>';
    });
    setTimeout(function(){ inp.focus(); }, 50);
  });
};

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (el('note-ov')) return saveNote();
    var p = el('panel-ov'); if (p) p.remove();
    return;
  }
  var tag = document.activeElement ? document.activeElement.tagName : '';
  if (/input|textarea/i.test(tag)) return;
  if (!el('reader').classList.contains('hide')){
    if (e.key === 'ArrowRight' && cur < DATA.length-1) open(cur+1);
    if (e.key === 'ArrowLeft' && cur > 0) open(cur-1);
  }
});

/* ---------- boot ---------- */
applySettings();
renderDashboard();
var hash = location.hash.match(/#ch\/(\d+)/);
if (hash) open(Math.min(DATA.length-1, +hash[1]));
window.addEventListener('hashchange', function(){
  var m = location.hash.match(/#ch\/(\d+)/);
  if (m && +m[1] !== cur) open(+m[1]);
});
})();
</script>
