**Example:** A partner's integration has a bug and sends 5,000 requests per second in a loop. Rate limiting returns `429` to them and keeps everyone else working. -> [[04-handling-traffic-spike-15k-rps]]

## 9. Backups Mean Nothing If You've Never Tested Restoring Them.

A backup you've never restored is a hope, not a backup.

**Example:** A team discovers during a real outage that backups had been silently failing for 3 months, or that a restore takes 14 hours - longer than the business can survive. Practice restores regularly and time them.

## 10. The Bug Is Always in the Last Place You Look.

(Because you stop looking once you find it.) The real lesson: **debug systematically**, not randomly. Check what changed, follow one request end to end, and rule things out with data instead of hunches.

-> [[20-sudden-latency-spike-checklist]]

---

## 🧠 Remember

> Production is where your assumptions go to die: log with context, validate everything, use transactions, hash passwords properly, distrust caches, expect retries, rate limit, test restores, and debug with data.

## Reflect

Which of these ten has already bitten you? Which one do you think will bite you next?
</script>
<script type="text/markdown" class="lesson-data" data-id="67" data-title="Scheduling Jobs Across DST (2:30 AM Doesn't Exist)" data-category="System Design at Scale" data-order="67">
# 2M Users Schedule a Job for 2:30 AM Local Time. On DST Spring-Forward Day, 2:30 AM Doesn't Exist.

## 1. Story

Millions of users set "run my backup / send my report at 2:30 AM." In many regions (US, Europe), on the day clocks spring forward, local time jumps straight from **1:59:59 to 3:00:00**. There is no 2:30 AM that day. And on the fall-back day, **1:00-1:59 happens twice**.

The options:
- **A:** Skip the job.
- **B:** Run it at 3:00 AM.
- **C:** Convert the intended local time to UTC once, before scheduling.

## 2. Why Option C Is a Trap

C sounds the most "correct," because "always store times in UTC" is good general advice. But for a **recurring job defined in local time**, converting to UTC once is wrong:

- In winter, 2:30 AM New York = 07:30 UTC. Store "07:30 UTC" forever.
- After DST starts, 07:30 UTC = **3:30 AM** local. The user's job now runs an hour late every day for months.
- Timezone rules also change by government decision (countries drop or move DST), so a UTC time computed today can be wrong next year.

**UTC is right for moments that already happened** (event timestamps, logs). It's wrong for **future local-time intentions** ("2:30 every night in my city").

## 3. Option A Is Usually Wrong Too

Skipping silently means a user's daily backup or bill payment just doesn't happen that day. Silent data-loss-style behavior is worse than running a bit late.

## 4. The Best Answer: Store the Intention, Resolve It at Run Time, and Apply B as the Policy

**Store what the user actually meant:**
- `local_time = 02:30`
- `timezone = America/New_York` (an IANA timezone name, not a fixed offset like `-05:00`)
- the recurrence rule (daily, weekly, ...)

**Compute each next run time at scheduling time for that occurrence**, using an up-to-date timezone database, with an explicit policy for the two DST edge cases:

| Case | What happens to 2:30 | Common policy |
|---|---|---|
| **Spring forward (gap)** | 2:30 doesn't exist | Run at the next valid time, **3:00** (option B) |
| **Fall back (overlap)** | 1:30 happens twice | Run **once**, at the first occurrence |

That's how cron-like systems and calendar apps (RFC 5545 / iCalendar) generally behave, and it matches what users expect: "run it, even if a little shifted, and never twice."

So the interview answer is: **B as the behavior, but implemented by storing local time + timezone, not by pre-converting to UTC (C).**

## 5. Don't Forget the Scale Problem

2 million jobs mapped to the same wall-clock moment means **2M jobs fire at 3:00 AM at once** on DST day (and every night at 2:30). That's the synchronized-burst problem from [[16-synchronized-connection-pool-expiry]]. Add **jitter** (spread execution across a window, e.g. 2:30-2:45) and push jobs through a queue with bounded workers ([[23-queue-backlog-after-spike]]). Make each job **idempotent** so a retry or the fall-back hour never runs it twice ([[19-idempotent-consumer-duplicate-events]]).

## 6. Code Example

```javascript
const { DateTime } = require('luxon');

function nextRun(localTime, zone, afterUtc) {
  const [h, m] = localTime.split(':').map(Number);
  let day = DateTime.fromJSDate(afterUtc, { zone }).startOf('day');
  for (let i = 0; i < 3; i++) {
    let run = day.set({ hour: h, minute: m });   // Luxon shifts a nonexistent
                                                  // 2:30 forward to 3:30 - normalize
    if (run.hour !== h) run = run.set({ minute: 0 }); // policy: run at 3:00
    if (run.toUTC() > DateTime.fromJSDate(afterUtc)) return run.toUTC();
    day = day.plus({ days: 1 });
  }
}
// Stored: { localTime: '02:30', zone: 'America/New_York' } - never a fixed UTC time
```

## 7. Mental Model

> Store the user's **intention** ("2:30 at night where I live"), not your **translation** of it. Translate fresh each time, because the rules for translating can change.

## 8. 🧠 Remember

> For recurring local-time jobs, store local time + IANA timezone and compute each run at scheduling time: shift nonexistent times forward (3:00), run ambiguous times once, add jitter for the burst, and make the job idempotent - converting to UTC once breaks the moment DST changes.

## 9. Quick Self-Test

1. Why does storing "07:30 UTC" make a 2:30 AM job run at the wrong local time for half the year?
2. What should happen to a 1:30 AM job on the fall-back day, and why?
3. Why is 2M jobs at the same local time a problem even on normal days?
</script>
<script type="text/markdown" class="lesson-data" data-id="68" data-title="Schema Change Broke the Pipeline: Producer or Consumer?" data-category="Distributed Systems" data-order="68">
# An Upstream Team Added One Nullable Column and Broke the Pipeline. Who Owns the Failure?

## 1. Story

A production data pipeline fails at 2:17 AM. The code hasn't changed in 3 weeks. It normally processes 120M+ rows without trouble. Logs look clean, CPU and memory are fine.

After hours of debugging: an **upstream team added one nullable column** without telling anyone. The pipeline broke - maybe it used `SELECT *` into a fixed-width target, maybe strict schema validation rejected the unknown field, maybe column positions shifted in a CSV export.

One engineer blames the upstream team for changing the contract. Another blames the pipeline for not handling schema evolution. Both have a point.

## 2. The Honest Answer: Both Own a Part

**The producer owns the contract.** If other teams consume your data, its shape is a public API ([[11-what-is-an-api]]). Changing it without notice is like changing an API's response format without versioning. The producer should publish the schema, classify changes as compatible or breaking, and announce them.

**The consumer owns its own robustness.** Adding an optional (nullable) column is widely considered a **backward-compatible** change. A consumer that crashes on an extra field it doesn't even use is brittle. The consumer should read only the columns it needs, ignore unknown fields, and fail loudly and early (not silently at 2 AM mid-run) when something is truly incompatible.

**The system (both teams) owns the missing guardrail.** The real failure is that nothing checked the change *before* it reached production.

## 3. The Fix: A Data Contract

**Term: Data contract** - an explicit, versioned agreement about the shape and meaning of data between a producer and its consumers: field names, types, nullability, and which changes are allowed.

- **Schema registry + compatibility rules** (e.g. Avro/Protobuf with Confluent Schema Registry): new schema versions are checked against the old ones. Adding an optional field passes; removing or retyping a field is rejected unless it's a new major version.
- **Contract tests in CI**: the producer's pipeline runs the consumers' expectations before deploying a schema change.
- **Schema validation at the boundary**: the consumer validates the incoming schema at the start of a run and alerts immediately, instead of failing halfway through 120M rows.
- **Tolerant reader**: consumers select explicit columns, ignore unknown fields, and handle nulls.
- **Change communication**: an owner, a changelog, and a deprecation period for breaking changes.

## 4. Mental Model

> Data between teams is an API without the API discipline. Treat the schema like a public contract: the producer promises not to break it without warning, the consumer promises not to break over harmless additions, and a machine checks both promises before deploy.

## 5. Flow

```mermaid
flowchart LR
  P[Producer changes schema] --> R{Schema registry<br/>compatibility check}
  R -->|Compatible: add optional field| D[Deploy]
  R -->|Breaking: remove/retype field| X[Blocked - needs new version + notice]
  D --> C[Consumer: tolerant reader,<br/>validates schema at start]
```

## 6. How to Answer in an Interview

"Both, but the more useful answer is that the **system** failed: there was no contract and no automated compatibility check. The producer should treat the schema as a public contract and version breaking changes; the consumer should be a tolerant reader and validate early. Then I'd add a schema registry and contract tests so this class of failure is caught before deploy, not at 2 AM."

That answer avoids blame and fixes the process - which is what senior engineers are expected to do.

## 7. 🧠 Remember

> Schema changes between teams need a data contract: producers version and announce breaking changes, consumers tolerate harmless additions and validate early, and a registry enforces compatibility automatically.

## 8. Quick Self-Test

1. Why is adding a nullable column usually considered backward-compatible, and how could it still break a consumer?
2. What does a schema registry check before allowing a new schema version?
3. Why is "who's to blame" the less useful question in a postmortem?
</script>
<script type="text/markdown" class="lesson-data" data-id="69" data-title="ORM save() in a Loop vs Bulk Insert" data-category="Databases" data-order="69">
# ORM `.save()` Inside a Loop for 5,000 Records

> **Similar-question flag**: this is the write-side version of the N+1 problem from [[52-orm-or-raw-sql]], and the same "stop paying the round-trip cost one at a time" idea as [[54-notify-5000-users-10x-faster]]. Short recap.

## Why It's Slow

```javascript
for (const row of rows) {        // 5,000 iterations
  await Order.create(row);       // 1 INSERT + 1 network round trip + 1 commit each
}
```

- **5,000 round trips**: at ~2ms each, that's 10 seconds of pure waiting.
- **5,000 commits**: each commit may force a disk flush.
- **ORM overhead** per object: hooks, validation, change tracking.
- **No atomicity**: if it fails at row 3,127, you have half the data saved.

## The Fix

**1. Bulk insert in batches** - one statement for many rows:

```javascript
// Sequelize: one INSERT ... VALUES (...), (...), ... per batch
for (let i = 0; i < rows.length; i += 1000) {
  await Order.bulkCreate(rows.slice(i, i + 1000));
}
```

**2. Wrap it in a transaction** so it's all-or-nothing and commits once:

```javascript
await sequelize.transaction(async (t) => {
  for (let i = 0; i < rows.length; i += 1000) {
    await Order.bulkCreate(rows.slice(i, i + 1000), { transaction: t });
  }
});
```

**3. For very large loads**, use the database's bulk loader (`COPY` in Postgres, `LOAD DATA` in MySQL) - often 10-100x faster than even batched inserts.

Typical result: **~10 seconds -> well under 1 second** for 5,000 rows.

## Batch Size Matters

Too small keeps the round-trip cost; too large can hit parameter limits (Postgres allows 65,535 bind parameters per statement) and long lock times. **500-5,000 rows per batch** is a common sweet spot.

## 🧠 Remember

> Don't pay a network round trip and a commit per row - batch inserts into multi-row statements, wrap them in one transaction, and use the database's bulk loader for really large imports.
</script>
<script type="text/markdown" class="lesson-data" data-id="70" data-title="AI Built the Website: 20 Things It Forgot" data-category="Blog" data-order="70">
# Blog: "AI Built the Website in 2 Hours." Now Check the 20 Things It Probably Forgot.

*A working demo is not a production website. The boring 20% is what makes it real.*

This connects to [[55-blog-engineering-harder-building-easier]]: building got easy, but making something production-ready is still engineering. Here's a checklist, grouped so it's easier to work through. Each item has a one-line "why it matters."

---

## Group 1 - When Things Go Wrong

1. **Proper error handling** - a failed API call should show a helpful message, not a blank screen or a raw stack trace (which can also leak internals).
2. **Empty states** - a new user with zero orders should see "No orders yet - start shopping," not an empty white box.
3. **Loading states** - spinners or skeletons, so users don't click three times thinking nothing happened.
4. **404 and 500 pages** - friendly pages with a way back home, instead of the hosting provider's default error.

## Group 2 - Users and Devices

5. **Mobile navigation** - most traffic is on phones; the menu must work on a small screen (we fixed exactly this on this dashboard).
6. **Form validation** - on the client for UX, and **always on the server** for security ([[66-blog-before-first-backend-job]]).
7. **Accessibility** - labels, alt text, keyboard navigation, and color contrast, so everyone can use it (and to avoid legal risk in some countries).
8. **Image optimization** - compressed, modern formats (WebP/AVIF), correct sizes, lazy loading - often the biggest speed win ([[51-fast-api-slow-page]]).

## Group 3 - Security and Abuse

9. **Rate limiting** - on login, signup, contact forms, and APIs, or bots will find them within days.
10. **Authentication edge cases** - password reset, expired sessions, logout on all devices ([[09-jwt-logout-invalidation]]), email change, brute-force protection.
11. **Security headers** - HTTPS/HSTS, Content-Security-Policy, X-Frame-Options, and proper CORS ([[07-cors-error-fix]]).
12. **Email confirmations** - verify addresses before trusting them, and send receipts for important actions.

## Group 4 - Being Found and Shared

13. **SEO metadata** - a unique title and description per page.
14. **OG previews** - Open Graph tags so a shared link on WhatsApp/LinkedIn shows a title, image, and description instead of a bare URL.
15. **Favicon** - small, but a site without one looks unfinished in every browser tab.
16. **Sitemap** - helps search engines find all your pages.
17. **robots.txt** - tells crawlers what to index (and make sure it isn't accidentally blocking the whole site).

## Group 5 - Running It for Real

18. **Analytics** - you can't improve what you can't see (and respect privacy/consent rules).
19. **Privacy and terms pages** - legally required in many places, especially if you collect any personal data or take payments.
20. **Backup and monitoring** - uptime checks, error tracking, and **tested** restores. A backup you've never restored is only a hope.

---

## Why AI Tends to Skip These

AI optimizes for "the thing you asked for works." These 20 items are mostly about **what happens around the happy path**: failure, abuse, strangers finding the page, and the site still running next month. Nobody writes "remember robots.txt" in their prompt, so it doesn't get built.

## How to Use This

Before calling any AI-built project "done," go through the 20 items and mark each one: done, not needed, or todo. Most take minutes each. Together, they're the difference between a demo and a product.

## 🧠 Remember

> AI builds the 80% you asked for. The boring 20% - errors, edge cases, security, discoverability, and operations - is what makes it a real production website.
</script>
<script type="text/markdown" class="lesson-data" data-id="71" data-title="Parking Lot LLD: What the Interviewer Wanted" data-category="Low-Level Design" data-order="71">
# Parking Lot LLD: The Candidate Named the Right Patterns. Why Didn't the Interviewer Like It?

## 1. The Candidate's Answer

"I'll model `ParkingLot`, `Floor`, `Vehicle`, `ParkingSpot`, `Ticket`, and `Gate`. Allocation goes behind a `SpotAllocationStrategy`, pricing behind a `PricingStrategy`, so new spot types and pricing rules don't require changing existing classes."

Nothing in that is *wrong*. That's the problem: it's a **list of nouns and pattern names**, not a design. An interviewer has heard this exact answer hundreds of times.

## 2. What Was Missing

**1. Requirements were never clarified.** How many floors and spots? Is allocation "nearest to the entry gate"? Can a motorcycle use a car spot? Is payment at exit or prepaid? What does "dynamic pricing" actually depend on - occupancy, time of day, events? The right design depends on these answers ([[30-workload-before-conclusion]]).

**2. No flow was walked through.** The interviewer wants to see one car go: arrive at gate -> find a spot -> issue ticket -> park -> exit -> calculate fee -> pay -> free the spot. Walking the flow exposes the real methods and responsibilities.

**3. No behavior - only names.** What are the methods? Who owns "is this spot free"? What does `Ticket` hold? Classes without method signatures and relationships aren't LLD yet.

**4. Concurrency was ignored - the most important gap.** Two cars arrive at two different gates at the same moment. Both allocation calls see spot `F2-17` as free. Both get it. This is the same check-then-act race as [[26-duplicate-email-race-condition]]. A strong answer makes "reserve spot" atomic.

**5. State wasn't modeled.** A spot is `FREE -> RESERVED -> OCCUPIED -> FREE` (plus `OUT_OF_SERVICE`). A ticket is `ACTIVE -> PAID -> CLOSED` (plus `LOST`). Explicit states make illegal transitions impossible.

**6. Edge cases were skipped.** Lot full, lost ticket, payment failure at exit, car leaves without paying, a spot blocked for maintenance, the gate losing network.

**7. Patterns came first instead of last.** Strategies are fine *where variation actually exists*. Leading with pattern names signals memorization. Let patterns appear when a requirement demands them ([[42-resilience-vs-overengineering]] - the same idea for code structure).

## 3. A Stronger Sketch

```javascript
const SpotType = Object.freeze({ MOTORCYCLE: 'MOTORCYCLE', COMPACT: 'COMPACT', LARGE: 'LARGE', EV: 'EV' });
const SpotStatus = Object.freeze({ FREE: 'FREE', OCCUPIED: 'OCCUPIED', OUT_OF_SERVICE: 'OUT_OF_SERVICE' });

// Which spot types each vehicle can use, in order of preference
const COMPATIBLE = {
  MOTORCYCLE: [SpotType.MOTORCYCLE, SpotType.COMPACT, SpotType.LARGE],
  CAR: [SpotType.COMPACT, SpotType.LARGE],
  TRUCK: [SpotType.LARGE],
};

class ParkingSpot {
  constructor(id, type) { this.id = id; this.type = type; this.status = SpotStatus.FREE; }
}

class Floor {
  constructor(spots) {
    // one free-spot pool per type -> O(1) allocation instead of scanning every spot
    this.freeSpots = new Map(Object.values(SpotType).map((t) => [t, []]));
    spots.forEach((s) => this.freeSpots.get(s.type).push(s));
  }
  // Node runs this on one thread with no await inside, so check + mark happen
  // together within this process - no two gates handled here get the same spot.
  reserve(vehicleType) {
    for (const t of COMPATIBLE[vehicleType]) {
      const spot = this.freeSpots.get(t).shift();
      if (spot) { spot.status = SpotStatus.OCCUPIED; return spot; }
    }
    return null;
  }
  release(spot) { spot.status = SpotStatus.FREE; this.freeSpots.get(spot.type).push(spot); }
}

class ParkingLot {
  constructor({ floors, allocationStrategy, pricingStrategy, ticketRepo, paymentService }) {
    Object.assign(this, { floors, allocationStrategy, pricingStrategy, ticketRepo, paymentService });
  }
  async enter(vehicle, gate) {
    const { spot, floor } = this.allocationStrategy.allocate(this.floors, vehicle, gate) ?? {};
    if (!spot) throw new Error('LOT_FULL');
    return this.ticketRepo.save({ id: crypto.randomUUID(), vehicle, spot, floor, status: 'ACTIVE', enteredAt: new Date() });
  }
  async exit(ticketId, payment) {
    const ticket = await this.ticketRepo.findActive(ticketId);   // lost ticket -> separate flow
    const fee = this.pricingStrategy.price(ticket, new Date());
    await this.paymentService.charge(payment, fee, { idempotencyKey: ticket.id });
    await this.ticketRepo.close(ticket.id);
    ticket.floor.release(ticket.spot);
    return { ticketId: ticket.id, fee };
  }
}

// A strategy is just an object with one method - swap it without touching ParkingLot
const nearestToGate = {
  allocate(floors, vehicle, gate) {
    for (const floor of floors.slice().sort((a, b) => gate.distanceTo(a) - gate.distanceTo(b))) {
      const spot = floor.reserve(vehicle.type);
      if (spot) return { spot, floor };
    }
    return null;
  },
};
```

Now the strategies earn their place: allocation genuinely varies (nearest to gate, fill lowest floor first, reserve EV spots), and so does pricing.

**Beyond one process:** a single Node process is safe here only because `reserve()` has no `await` between checking and marking the spot. With many gates handled by **different servers**, in-memory state isn't shared at all, so reserve the spot in the database atomically, the same pattern as [[60-cache-says-100-db-says-20]]:

```javascript
const { rowCount } = await db.query(
  `UPDATE spots SET status = 'OCCUPIED' WHERE id = $1 AND status = 'FREE'`, [spotId]);
if (rowCount === 0) { /* someone else took it - try the next spot */ }
```

## 4. What Actually Helps You Clear LLD Rounds

1. **Clarify requirements and scope** for 3-5 minutes.
2. **Identify entities and relationships**, then **responsibilities** ("who knows what, who does what").
3. **Walk through the main use cases** and let method signatures come out of the flow.
4. **Model state** with enums and valid transitions.
5. **Handle concurrency** anywhere two actors compete for the same resource.
6. **Cover edge cases** out loud.
7. **Introduce patterns only to solve a stated variation**, and say why.
8. **Write real code** for the core flow - many interviewers expect compilable-looking classes, not just a diagram.

## 5. Mental Model

> LLD isn't "which patterns do you know." It's "can you turn requirements into classes with clear responsibilities, correct state, and safe behavior under concurrency." Patterns are the seasoning, not the meal.

## 6. 🧠 Remember

> Clarify, walk the flow, give classes real methods and states, make shared-resource allocation atomic, cover edge cases - and only then reach for patterns where variation truly exists.

## 7. Quick Self-Test

1. How can two gates assign the same spot, and how do you prevent it in one process and across many servers?
2. Why does leading with "Strategy pattern" often hurt instead of help?
3. What states would you model for a Ticket, and which transitions are illegal?
</script>
<script type="text/markdown" class="lesson-data" data-id="72" data-title="Secret Leaked to a Public Git Repo" data-category="Security" data-order="72">
# You Pushed a Secret to a Public Git Repository. What Now?

## 1. Story

You push a commit. Two minutes later you notice `.env` was included: a production database password and an AWS access key, now sitting in a **public** repository.

## 2. The Most Important Fact

**Assume it's already stolen.** Bots scan public GitHub pushes continuously, and leaked cloud keys are often abused within **minutes** (commonly to spin up crypto-mining servers on your bill). Deleting the file or the commit does **not** undo that: the commit stays in history, forks and clones already have it, and scanners already copied it.

So the order matters: **make the secret useless first, clean up second.**

## 3. The Response, in Order

**1. Revoke and rotate immediately.**
- Cloud keys: deactivate/delete the key in AWS IAM (or equivalent), create a new one.
- Database passwords, API tokens, OAuth secrets, webhook secrets: rotate them all.
- Deploy the new secrets to the systems that need them.

This is the step that actually stops the damage. Everything else is cleanup.

**2. Check for misuse.**
Look at cloud audit logs (e.g. CloudTrail), billing, database access logs, and API provider dashboards for activity since the push. If something was accessed, it becomes a security incident: follow your company's incident process.

**3. Remove it from Git history.**
- Use `git filter-repo` (or BFG Repo-Cleaner) to strip the file/string from **all** commits, then force-push.
- Ask collaborators to re-clone.
- Contact GitHub Support to purge cached views and pull-request references if needed.
- Remember: this reduces future exposure, but **it doesn't un-leak** what's already copied.

**4. If it was personal data, not just credentials**, involve security/legal: data-protection laws may require notifying users or regulators within a deadline.

**5. Prevent it next time.**
- `.gitignore` for `.env` and key files, plus a `.env.example` with fake values.
- **Pre-commit secret scanning** (gitleaks, detect-secrets) and **GitHub push protection / secret scanning**, which block the push before it lands.
- Store secrets in a **secrets manager** (AWS Secrets Manager, Vault, Doppler) instead of files.
- Prefer **short-lived credentials** (IAM roles, OIDC for CI) over long-lived keys, so a leak expires by itself.

## 4. Mental Model

> A leaked secret is a lost house key. Deleting your photo of the key from Instagram doesn't help - someone already has a copy. Change the lock first, then clean up the photo.

## 5. Common Mistakes

- Deleting the file in a new commit and calling it fixed (it's still in history).
- Rewriting history but never rotating the key.
- Making the repo private and assuming that undoes the exposure.

## 6. 🧠 Remember

> Rotate first, investigate second, scrub history third, and prevent it with secret scanning, a secrets manager, and short-lived credentials - because a secret that hit a public repo must be treated as compromised.

## 7. Quick Self-Test

1. Why is rotating the secret more important than deleting the commit?
2. Why doesn't making the repository private fix the leak?
3. What two tools or practices stop this from happening again?
</script>
<script type="text/markdown" class="lesson-data" data-id="73" data-title="URI vs URL" data-category="Web &amp; API Communication" data-order="73">
# What's the Difference Between a URI and a URL?

## 1. The Short Answer

- **URI (Uniform Resource Identifier)** - a string that **identifies** a resource.
- **URL (Uniform Resource Locator)** - a URI that also tells you **where the resource is and how to get it** (a scheme/protocol plus a location).
- **URN (Uniform Resource Name)** - a URI that **names** a resource in a permanent way, without saying where it is.

**Every URL is a URI. Not every URI is a URL.**

## 2. Simple Analogy

> Your **name** identifies you (like a URN). Your **home address** identifies you *and* says how to find you (like a URL). Both are "identifiers" (URIs), but only the address lets someone actually reach you.

## 3. Examples

| String | Is it a URI? | URL? | Why |
|---|---|---|---|
| `https://shop.com/orders/42?tab=items#summary` | Yes | Yes | Scheme + host tell you how and where to fetch it |
| `mailto:help@shop.com` | Yes | Yes (commonly treated as one) | Scheme says how to reach it |
| `urn:isbn:9780134685991` | Yes | No | Names a book, doesn't say where to get it |
| `/orders/42` | A relative reference | Not by itself | Needs a base URL to become a full URL |

## 4. Anatomy of a URL

```
https://user@shop.com:443/orders/42?tab=items#summary
\___/   \__/ \______/ \_/\________/ \_______/ \_____/
scheme  user   host   port  path      query   fragment
```

- **scheme**: how to access it (`https`, `ftp`, `mailto`)
- **host + port**: where
- **path**: which resource on that server
- **query**: parameters
- **fragment**: a spot inside the page - handled by the browser, **never sent to the server**

## 5. Does It Matter in Practice?

In everyday web development, people use "URL" for web addresses and nobody minds. The distinction matters in specs, APIs, and some library names (Java has both `java.net.URI` and `java.net.URL`; in the browser, `new URL(...)` parses full URLs). In an interview, the one-liner above plus one URN example is enough.

## 6. 🧠 Remember

> A URI identifies; a URL identifies and locates. Every URL is a URI, but a URN like `urn:isbn:...` is a URI that names something without telling you where to find it.
</script>
<script type="text/markdown" class="lesson-data" data-id="74" data-title="Troubleshooting 502 Bad Gateway From Ingress" data-category="Infrastructure &amp; DevOps" data-order="74">
# Troubleshooting a 502 Bad Gateway From a Kubernetes Ingress

> **Connects to**: [[02-debugging-random-500-errors]] (the error may come from the layer *above* your app) and [[08-ec2-no-internet-troubleshooting]] (check each network layer in order).

## 1. What 502 Actually Means

**502 Bad Gateway** = the proxy (here, the Ingress controller, e.g. NGINX) tried to talk to the **upstream** (your Service/Pods) and got **no valid response**: connection refused, connection reset, or a garbage response.

So your app might never have seen the request. The question is: **where between Ingress and container did the connection fail?**

Related codes help narrow it down:
- **502**: upstream refused/reset/returned something invalid.
- **503**: no healthy upstream at all (often zero endpoints).
- **504**: upstream accepted the connection but was too slow (timeout).

## 2. The Path, and What to Check at Each Hop

`Client -> Ingress controller -> Service -> Endpoints -> Pod -> container port -> app`

**1. Are the pods running and ready?**
```bash
kubectl get pods -l app=myapp -o wide
kubectl describe pod <pod>        # CrashLoopBackOff? OOMKilled? readiness failing?
kubectl logs <pod> --previous     # logs from the crashed container
```
Crashing or restarting pods reset connections mid-request, a classic 502 cause.

**2. Does the Service actually point at the pods?**
```bash
kubectl get endpoints myapp-svc   # empty = selector doesn't match pod labels
kubectl describe svc myapp-svc
```
Compare the Service `selector` with the pod labels. One typo and there are no endpoints.

**3. Do the ports line up?**
Ingress `backend.service.port` -> Service `port` -> Service `targetPort` -> the port the container actually listens on. A mismatch anywhere means "connection refused."

**4. Is the app listening on the right interface?**
An app bound to `127.0.0.1` inside the container is unreachable from outside the pod. It must listen on `0.0.0.0`.

**5. Test from inside the cluster, skipping the Ingress:**
```bash
kubectl run tmp --rm -it --image=curlimages/curl -- sh
curl -v http://myapp-svc.<namespace>.svc.cluster.local:<port>/health
```
- Works here but fails via Ingress -> the problem is in Ingress config.
- Fails here too -> the problem is the Service/pod/app.

**6. Read the Ingress controller logs** - they usually say exactly what happened:
```bash
kubectl logs -n ingress-nginx deploy/ingress-nginx-controller | grep 502
```
Look for `connect() failed (111: Connection refused)`, `upstream prematurely closed connection`, or `upstream sent too big header`.

**7. Protocol mismatch.** The backend serves HTTPS but the Ingress sends HTTP (or gRPC vs HTTP). Fix with the right backend-protocol annotation.

**8. Keep-alive timeout mismatch (intermittent 502s).** If the app closes idle connections sooner than the Ingress expects, the Ingress sometimes reuses a connection the app just closed -> reset -> 502. Make the app's keep-alive timeout **longer** than the proxy's.

**9. Headers too big.** Large cookies/JWTs overflow the proxy buffer -> "upstream sent too big header." Increase proxy buffer size.

**10. Deployments and scaling.** 502s only during rollouts means pods are killed while still serving traffic: add readiness probes, a `preStop` sleep, and graceful shutdown so in-flight requests finish.

## 3. Mental Model

> A 502 is the Ingress saying "I called your service and got nonsense or nothing." Walk the chain hop by hop - pods, endpoints, ports, bind address, protocol, timeouts - and test from inside the cluster to split "Ingress problem" from "app problem."

## 4. 🧠 Remember

> For an Ingress 502, check pod health and restarts, Service endpoints and selectors, the full port chain, the app's bind address, and the controller logs - and if the 502s are intermittent, suspect keep-alive mismatches or ungraceful pod shutdowns during deploys.

## 5. Quick Self-Test

1. How do 502, 503, and 504 differ in what went wrong upstream?
2. Why does an app listening on `127.0.0.1` cause failures only when called from outside the pod?
3. Why can a keep-alive timeout mismatch cause random, occasional 502s?
</script>
<script type="text/markdown" class="lesson-data" data-id="75" data-title="Top 10 Mistakes in System Design Interviews" data-category="Blog" data-order="75">
# Blog: Top 10 Mistakes in System Design Interviews

*Each mistake below comes with what it sounds like in the room, what to do instead, and the lessons in this library that teach the fix.*

---

## 1. Skipping Requirements

**Sounds like:** "Okay, so we'll have a load balancer, then..." within the first 30 seconds.

**Instead:** spend the first few minutes on numbers - QPS (peak, not average), p95 latency target, data size, retention, regions, and consistency needs. Every later decision depends on them.

-> [[30-workload-before-conclusion]], [[15-simple-vs-scalable-architecture]]

## 2. Drawing Boxes Before the API and Data Model

**Sounds like:** a beautiful diagram that can't answer "how do I get a user's last 20 orders?"

**Instead:** define the main API calls and the core tables/entities first. Then draw components that serve those calls.

-> [[11-what-is-an-api]], [[71-parking-lot-lld-review]]

## 3. Treating the Database as Infinite

**Sounds like:** "and we store it in the database" - with no index plan, no hot-key discussion, no partitioning, no read-replica vs cache trade-off.

**Instead:** say which queries matter, which index serves each one, and what happens when one key or tenant gets hot.

-> [[57-two-indexes-still-slow-composite]], [[21-database-partitioning]], [[28-scaling-database-reads]]

## 4. Ignoring Backpressure

**Sounds like:** "we'll put it in a queue" - an unlimited queue with no load shedding and no timeouts, until every dependency gets dogpiled.

**Instead:** bound your queues, set timeouts, shed load with `429`, and scale consumers carefully.

-> [[04-handling-traffic-spike-15k-rps]], [[23-queue-backlog-after-spike]], [[39-autoscaling-amplifies-outage]]

## 5. No Connection Pooling

**Sounds like:** nothing - it simply never comes up. Then one request = one new DB connection, and the database melts at 2k RPS.

**Instead:** mention pooled connections, pool size vs DB max connections, and what happens when the pool is exhausted.

-> [[16-synchronized-connection-pool-expiry]], [[53-blog-senior-system-design-without-big-scale]]

## 6. Retries Without Rules

**Sounds like:** "and if it fails, we retry." No jitter, no max attempts, no idempotency key, no circuit breaker - a guaranteed retry storm.

**Instead:** exponential backoff with jitter, a retry budget, idempotency keys, and a circuit breaker.

-> [[14-cascading-failure-recovery]], [[32-payment-idempotency-double-click]]

## 7. Assuming Exactly-Once

**Sounds like:** "the consumer processes each message once." It won't: duplicates, reordering, and partial failures across services happen.

**Instead:** design for at-least-once delivery with idempotent consumers, and use an outbox where state and messages must stay in sync.

-> [[19-idempotent-consumer-duplicate-events]], [[65-pagerduty-incident-dedup-paging]]

## 8. Observability as an Afterthought

**Sounds like:** "we'll add monitoring." No SLIs/SLOs, no tracing, no plan for metric cardinality, no structured logs.

**Instead:** name the 2-3 SLIs that define "working" (e.g. p99 latency, error rate, queue lag), and say how you'd trace one request across services.

-> [[02-debugging-random-500-errors]], [[20-sudden-latency-spike-checklist]]

## 9. Hand-Waving Deploys

**Sounds like:** the design exists, but nobody knows how it changes. No migrations, rollbacks, versioning, dark launches, or capacity planning.

**Instead:** mention backward-compatible schema changes, versioned APIs and events, feature flags, and rollback.

-> [[68-schema-change-producer-vs-consumer]], [[18-http-status-codes-400-404-409-422]]

## 10. Not Talking About Failure Modes

**Sounds like:** a design that only works when everything is healthy.

**Instead:** walk through what happens on an AZ outage, a cache stampede, clock skew, a poison message, and a slow dependency - and how you recover.

-> [[12-multi-az-availability]], [[10-clock-skew-last-write-wins]], [[44-distributed-locking-with-redis]]

---

## The Pattern Behind All 10

Every mistake is the same thing in different clothes: **describing the happy path of an imaginary system instead of the real behavior of a system under load and failure.** Interviewers aren't grading the boxes. They're grading whether you can predict what breaks.

## 🧠 Remember

> Clarify numbers first, define the API and data first, then design for limits, retries, duplicates, deploys, and failure - that's what separates a senior answer from a diagram.
</script>
<script type="text/markdown" class="lesson-data" data-id="76" data-title="When Not to Use AI Coding Agents" data-category="Blog" data-order="76">
# Blog: AI Coding Agents Are Great Tools - But Not for Every Job

*Being a good engineer now includes knowing when to prompt and when to just write the code.*

---

## The Core Idea

A quote (credited to Petar Dambovaliev) sums it up:

> "The more precise you need to be, the more natural-language text you need to write to describe the same programming concept. So at some point it is actually faster to write the code than to try to explain to an LLM what the code should do. It is a spectrum, and you should at any moment be able to go from one to the other."

Code is a precise language. English is not. When the thing you want is fuzzy, English is efficient. When the thing you want is exact, the code **is** the shortest description.

## A Simple Example

**Easy to prompt:** "Create an Express endpoint that returns a paginated list of orders, with validation and tests."
Twelve words produce 150 lines. Huge win.

**Hard to prompt:** "The balance update must be one atomic conditional statement, reject if the balance would go negative, use the account row as the only source of truth, and never read from the cache."
You've now written a paragraph to describe what is literally one line:

```sql
UPDATE accounts SET balance = balance - $1 WHERE id = $2 AND balance >= $1;
```

At that point, writing the line yourself is faster **and** you know it's exactly right ([[60-cache-says-100-db-says-20]]).

## Where Agents Shine

- **Boilerplate and scaffolding**: CRUD endpoints, DTOs, config, migrations for simple tables.
- **Well-known patterns**: "add rate limiting with this library," "convert this to async/await."
- **Exploration**: reading an unfamiliar codebase, summarizing a module, drafting options.
- **Tests and refactors** with a clear target.
- **Glue code** between well-documented APIs.

## Where Writing It Yourself Is Often Faster (or Safer)

- **Precise invariants**: concurrency, locking, money, idempotency ([[44-distributed-locking-with-redis]], [[65-pagerduty-incident-dedup-paging]]).
- **Tiny, exact changes**: a one-line fix where describing it takes longer than typing it.
- **Deep context**: behavior that depends on history nobody wrote down ("we do it this way because of the 2024 incident").
- **Performance-critical paths** where the exact query plan matters ([[50-slow-query-500m-rows]]).
- **Security-sensitive code**: auth flows, crypto, secret handling ([[56-password-hashing-not-sha256]], [[72-secret-leaked-to-public-git]]).

## The Skill: Moving Along the Spectrum

Good engineers switch modes constantly:

1. Prompt the agent for the scaffold.
2. Hand-write the one tricky function where correctness lives.
3. Ask the agent to write tests for that function.
4. Review everything like it came from a fast but new teammate.

The mistake isn't using AI or refusing to. It's being stuck at one end of the spectrum: prompting for 20 minutes to avoid writing 3 lines, or hand-typing 300 lines of boilerplate out of pride.

## Why This Matters for Your Career

If you can only work through prompts, you can't tell when the output is subtly wrong - and the subtle bugs (races, retries, stale caches) are exactly the expensive ones. If you can read and write precise code, AI becomes a multiplier instead of a crutch. That's the same point as [[29-why-hire-you-over-ai]] and [[55-blog-engineering-harder-building-easier]].

## 🧠 Remember

> Use natural language when the idea is fuzzy and the pattern is common; write code when the idea is precise, because past a certain point the code is the shortest and most accurate description.

## Reflect

1. What was the last task where prompting took longer than writing it would have?
2. Which parts of your current project would you never let an agent change without a line-by-line review?
</script>
<script type="text/markdown" class="lesson-data" data-id="77" data-title="Microservices Are a Tax" data-category="Blog" data-order="77">
# Blog: "A Monolith Is a Choice. Microservices Are a Tax."

> **Similar-question flag**: this is the same conversation as [[24-kubernetes-pets-vs-cattle]] ("don't buy a ranch for two pets"), one level up: services instead of infrastructure. The underlying rule is [[15-simple-vs-scalable-architecture]] and [[42-resilience-vs-overengineering]]. What's new here is the itemized bill: what the "tax" actually costs, and what "owing the money" looks like.

---

## The Conversation

> **Me:** "Let's split this into microservices. It'll scale better."
> **Tech Lead:** "Scale better than what?"
> **Me:** "Better than one codebase."
> **Tech Lead:** "Have we measured a single service hitting a limit? Or are we designing a distributed system for a traffic graph that still fits on one laptop?"
> **Tech Lead:** "A monolith is a choice. Microservices are a tax. Don't pay the tax before you owe the money."

## "Scale Better" Is Usually the Wrong Reason

A monolith scales horizontally just fine: run 10 copies behind a load balancer ([[06-ec2-autoscaling]]). What usually hits a limit first is the **database**, and splitting code into services doesn't fix that - often it makes it worse, because now five services share one overloaded database.

Microservices mainly help with **organizational scale**, not traffic scale: many teams stepping on each other in one codebase and one deploy pipeline.

## The Tax Bill (What You Pay From Day One)

A function call becomes a network call. That one change brings:

| In a monolith | With microservices |
|---|---|
| Function call, ~microseconds | Network call, milliseconds, can time out ([[13-hidden-latency-bottleneck]]) |
| One database transaction | Distributed consistency, sagas, outbox ([[65-pagerduty-incident-dedup-paging]]) |
| Call always arrives once | Retries, duplicates, idempotency ([[19-idempotent-consumer-duplicate-events]]) |
| One service fails -> one process down | Cascading failures, circuit breakers ([[14-cascading-failure-recovery]]) |
| One deploy | Many deploys, versioned APIs and event schemas ([[68-schema-change-producer-vs-consumer]]) |
| One log file | Distributed tracing needed just to debug one request |
| Refactor across modules in one PR | Coordinated changes across teams and repos |

Every row is real engineering time, every week, forever.

## When You Actually "Owe the Money"

Split a piece out when you can **point to** one of these:

- **Teams block each other**: many teams, one codebase, deploys queue up behind each other.
- **Different scaling or resource needs**: one component (video transcoding, ML inference) needs very different hardware or scale than the rest.
- **Different reliability or security boundaries**: payments must be isolated, or one flaky feature keeps taking down the core product.
- **Measured bottleneck**: you've profiled it, and one part genuinely can't scale inside the monolith.

If you can't name one of these, the split is a cost with no benefit yet.

## The Better Default: A Modular Monolith

One deployable, but with **strict internal boundaries**: separate modules with clear interfaces, no reaching into each other's tables. You get most of the design cleanliness now, and if a module later truly needs to become a service, the seam is already there.

## A Simple Example

A food-delivery startup with 6 engineers and 200 orders per minute splits into Users, Orders, Restaurants, Payments, and Notifications services. Now:

- Placing an order makes 4 network calls instead of 4 function calls.
- A Notifications outage makes checkout hang (no timeouts yet).
- A bug fix touching Orders and Payments needs two coordinated deploys.

The same team with a modular monolith would ship faster, debug faster, and still handle 200 orders/minute on a couple of servers.

## 🧠 Remember

> Microservices buy team independence and isolation by charging you latency, distributed failure, and operational overhead on every request, forever - start with a well-structured monolith and split only when you can point to the specific limit you've hit.

## Reflect

1. Can you name the specific limit your current system has hit that a service split would fix?
2. Which boundary in your codebase would be the first to split *if* you ever needed to - and is it clean enough today?
</script>
<script type="text/markdown" class="lesson-data" data-id="78" data-title="Who Finds the DNS Server's Address?" data-category="Networking" data-order="78">
# If DNS Turns Names Into IPs, Who Finds the DNS Server's Address?

## 1. The Puzzle

To visit `google.com`, your computer asks a DNS server "what's the IP of google.com?" But to ask that DNS server anything, you need **its** address. If you needed DNS to find the DNS server, you'd be stuck in a loop forever.

## 2. The Answer: Nobody Translates It - It's Already an IP Address

The loop is broken because **DNS servers are always configured by IP address, never by name**. There are three places this happens:

**1. Your device gets the resolver's IP from the network (DHCP).**
When you join Wi-Fi, the router hands your device an IP, a gateway, **and the IP of a DNS resolver** (often the router itself, e.g. `192.168.1.1`, or your ISP's resolver). You can also set one by hand: `8.8.8.8` (Google), `1.1.1.1` (Cloudflare). On Linux you see it in `/etc/resolv.conf`; on Windows in `ipconfig /all`.

**2. The resolver knows the root servers' IPs from a built-in file.**
Your resolver may not know `google.com`, so it starts at the top: the **13 root server names (a.root-servers.net to m.root-servers.net)**. Their IP addresses ship with the resolver software in a **root hints** file. They almost never change, so hardcoding them works.

**3. Parent zones hand out "glue" IPs for name servers inside their own domain.**
The root says "ask the `.com` servers" and includes their IPs. `.com` says "`google.com` is served by `ns1.google.com`" - but that name is *inside* `google.com`, another loop. So the parent also sends a **glue record**: the IP of `ns1.google.com` directly.

**Term: Glue record** - an IP address the parent zone provides for a name server whose name lives inside the zone it serves, so you can reach it without looking it up first.

## 3. The Full Journey

```mermaid
sequenceDiagram
  participant PC as Your device
  participant R as Resolver (IP from DHCP, e.g. 192.168.1.1)
  participant Root as Root server (IP from root hints)
  participant TLD as .com server
  participant NS as ns1.google.com
  PC->>R: google.com?
  R->>Root: google.com?
  Root-->>R: ask .com servers (+ their IPs)
  R->>TLD: google.com?
  TLD-->>R: ask ns1.google.com (+ glue IP)
  R->>NS: google.com?
  NS-->>R: 142.250.x.x
  R-->>PC: 142.250.x.x (and caches it)
```

Every "who do I ask next" step comes with an IP, never just a name.

## 4. Mental Model

> You can't look up the phone number of directory assistance in directory assistance - it's printed on the phone already. DNS works the same way: the resolver's IP comes from your network settings, the root servers' IPs ship with the software, and every referral includes the IP of the next server.

## 5. Why It Matters in Real Life

- **"Internet works but websites don't load"** often means the resolver IP is wrong or unreachable. `ping 8.8.8.8` works but `ping google.com` fails -> it's DNS, not the network ([[08-ec2-no-internet-troubleshooting]]).
- In AWS, the VPC resolver lives at a fixed address (the VPC base +2, e.g. `10.0.0.2`, and `169.254.169.253`), so instances find DNS without any lookup.
- **Caching** at every level (browser, OS, resolver) is why most lookups never reach the root at all.

## 6. 🧠 Remember

> The DNS loop is broken with plain IP addresses: your device learns the resolver's IP from DHCP or manual settings, resolvers ship with the root servers' IPs, and parent zones include glue IPs for name servers inside their own domains.

## 7. Quick Self-Test

1. Where does your laptop get its DNS resolver's IP address from?
2. Why do root server IPs need to be built into resolver software?
3. What problem does a glue record solve?
</script>
<script type="text/markdown" class="lesson-data" data-id="79" data-title="Rate Limiting Explained" data-category="Blog" data-order="79">
# Blog: Rate Limiting - What Happens When Thousands of Users Hit Your API at Once?

*Rate limiting protects your system from traffic spikes, abuse, and accidental overload. Here's how it works, in plain terms, with examples.*

---

## The Problem

Without rate limiting, one user, one buggy script, or one bot can send thousands of requests and use up the capacity meant for everyone:

`requests keep increasing -> server overloaded -> legitimate users get slow responses or errors`

**Real example:** a partner's integration has a bug and retries in a tight loop - 5,000 requests per second. Without limits, your whole API slows down for every customer. With limits, only that partner gets `429 Too Many Requests`, and everyone else doesn't notice. (This is load shedding, from [[04-handling-traffic-spike-15k-rps]].)

## The Idea

**Term: Rate limiting** - capping how many requests a client can make in a time period, e.g. **100 requests / minute / user**.

`request arrives -> check this client's usage -> under the limit: allow | over the limit: reject (429) or delay`

## The Four Common Algorithms (Simple Version)

**1. Fixed window** - count requests per calendar minute (12:00-12:01, 12:01-12:02...).
- Simple: one counter per user per minute.
- **Weakness:** a user can send 100 at 12:00:59 and 100 more at 12:01:00 - 200 requests in 2 seconds, right at the boundary.

**2. Sliding window** - count requests in the **last 60 seconds** from right now, not the calendar minute.
- Fixes the boundary burst.
- Exact version (store every timestamp) costs more memory; a common approximation blends the current and previous window counts.

**3. Token bucket** - each user has a bucket holding up to N tokens that refills at a steady rate (e.g. 100 tokens, +1.67 per second). Each request spends one token; no token, no request.
- **Allows short bursts** (up to the bucket size) while enforcing the average rate. The most popular choice for APIs (AWS API Gateway and Stripe-style limits work this way).

**4. Leaky bucket** - requests go into a queue that drains at a **fixed** rate, like water leaking from a bucket at a steady drip. If the bucket is full, new requests are dropped.
- **Smooths traffic** into a perfectly steady flow - good for protecting a fragile downstream that can't handle bursts.

| Algorithm | Allows bursts? | Smooth output? | Complexity |
|---|---|---|---|
| Fixed window | Yes, even at boundaries (bad) | No | Very low |
| Sliding window | Controlled | Mostly | Medium |
| Token bucket | Yes, up to bucket size | No | Medium |
| Leaky bucket | No | Yes | Medium |

## Where to Implement It

- **API gateway / CDN / WAF** - blocks abuse before it reaches your servers. Cheapest place to stop floods.
- **Load balancer** - coarse per-IP protection.
- **Application** - where you know *who* the user is and *which plan* they're on (free vs paid limits).
- **Distributed limiter in Redis** - so all your servers share one count.

Most real systems use more than one layer: coarse IP limits at the edge, precise per-user limits in the app.

## The Multi-Server Problem

If you have 5 servers and each keeps its own in-memory counter, a user effectively gets **5x the limit**. The limit must be shared - usually a Redis counter that every server updates atomically.

```javascript
// Fixed-window limiter shared by all servers (Redis)
async function allow(userId, limit = 100, windowSec = 60) {
  const key = `rl:${userId}:${Math.floor(Date.now() / 1000 / windowSec)}`;
  const count = await redis.incr(key);                 // atomic, safe across servers
  if (count === 1) await redis.expire(key, windowSec); // counter cleans itself up
  return count <= limit;
}

app.use(async (req, res, next) => {
  if (await allow(req.user.id)) return next();
  res.set('Retry-After', '60');
  res.status(429).json({ error: 'Too many requests, slow down.' });
});
```

For token/sliding-window versions in production, run the whole check as one **Lua script** in Redis so read-and-update is atomic (the same "don't split check and act" rule from [[26-duplicate-email-race-condition]]), or use a proven library.

## Design Decisions You Must Make

- **Per user, per IP, or per API key?** Per IP punishes whole offices behind one IP; per user needs authentication first. Often: per IP for login/signup, per user or API key everywhere else.
- **What happens at the limit?** Return **`429 Too Many Requests`** with a **`Retry-After`** header, and ideally `RateLimit-Remaining` headers so clients can slow down on their own.
- **Reject or queue?** Reject for interactive APIs (fast feedback). Queue for background work that can wait ([[23-queue-backlog-after-spike]]).
- **Different limits per endpoint:** login gets strict limits (brute-force protection), search gets tighter limits than cheap reads, paid plans get higher limits.
- **What if Redis is down?** Decide: *fail open* (allow traffic, risk overload) or *fail closed* (block traffic, risk an outage). Most APIs fail open with a local fallback limit.

## Common Mistakes

- Per-server in-memory counters behind a load balancer (users get N times the limit).
- Returning `500` instead of `429`, so clients retry immediately and make it worse ([[14-cascading-failure-recovery]]).
- No limits on login and password-reset endpoints - the favorite target for bots ([[66-blog-before-first-backend-job]]).
- Clients retrying on `429` without backoff and jitter, turning a limit into a retry storm.

## 🧠 Remember

> Rate limiting caps each client's share so one user or bot can't take down the service for everyone: pick the algorithm by how you want bursts handled, share the count across servers (usually Redis), and answer clearly with 429 + Retry-After.

## Self-Test

1. Why can a fixed window allow 2x the limit in a short time?
2. Why does token bucket suit most APIs better than leaky bucket?
3. What goes wrong if each server keeps its own counter?
</script>
<script type="text/markdown" class="lesson-data" data-id="80" data-title="Restart Logs Everyone Out" data-category="Security" data-order="80">
# You Restart the Backend and Every User Is Logged Out - What Assumption Was Wrong?

## 1. The Story

Users log in and everything works. You deploy a small fix, the server restarts, and suddenly **every single user** is kicked back to the login page. Support tickets flood in. Nothing in the login code changed.

## 2. The Wrong Assumption

> **"The server process will live forever, so it can remember things."**

Login state was stored somewhere that **dies with the process**. When the process restarts, that memory is gone, so every token or session the server issued is now meaningless to it.

## 3. The Three Usual Culprits

**1. Sessions stored in process memory**
`express-session` uses an in-memory store by default (`MemoryStore`). Every session lives in a JavaScript object inside the Node process. Restart = empty object = everyone logged out.
The docs even warn: MemoryStore is not for production - it also leaks memory and doesn't work with more than one server.

**2. The JWT secret is generated at startup**
```javascript
// BAD - a new random secret on every boot
const JWT_SECRET = crypto.randomBytes(32).toString('hex');
```
Every token signed before the restart was signed with the **old** secret. After the restart, verification fails for all of them.

**3. Each server has its own secret or its own memory**
With 3 servers behind a load balancer, even without a restart, a user logged in on server A is "unknown" on server B. A restart just makes the same bug obvious.

## 4. The Fix: Keep Auth State Outside the Process

| What you use | Where state must live |
|---|---|
| Server sessions | A **shared store**: Redis (`connect-redis`), or the database |
| JWT | A **fixed secret from config** (env / Secrets Manager), the same on every server; refresh tokens stored in the DB/Redis |

```javascript
// Sessions in Redis - survive restarts and work across many servers
const session = require('express-session');
const { RedisStore } = require('connect-redis');
const { createClient } = require('redis');

const redisClient = createClient({ url: process.env.REDIS_URL });
await redisClient.connect();

app.use(session({
  store: new RedisStore({ client: redisClient }),
  secret: process.env.SESSION_SECRET,            // fixed, from config - never random at boot
  resave: false,
  saveUninitialized: false,
  cookie: { httpOnly: true, secure: true, sameSite: 'lax', maxAge: 7 * 24 * 3600 * 1000 },
}));
```

```javascript
// JWT - one stable secret from config, same on every instance
const JWT_SECRET = process.env.JWT_SECRET;
if (!JWT_SECRET) throw new Error('JWT_SECRET missing - refusing to start');   // fail fast
```

## 5. The Principle Behind It

**Term: Stateless server** - a server that keeps no user-specific data in its own memory between requests, so any instance can handle any request and restarts lose nothing.

This is the same rule that makes **horizontal scaling** and **zero-downtime deploys** possible. If a restart logs everyone out, you also can't safely run two servers or do a rolling deploy.

## 6. Related Traps

- **Redis without persistence, or evicting keys:** sessions in Redis also vanish if Redis restarts with no persistence, or if Redis runs out of memory and evicts them. Give session keys their own Redis (or `noeviction`), separate from cache keys.
- **Rotating the secret on purpose:** if you must rotate a JWT secret, support **two keys** for a while (verify with old or new, sign with new) - or everyone is logged out at the rotation.
- **Cookie settings changed in the deploy:** a new cookie name, domain or `SameSite` value also makes old cookies useless.


## 🧠 Remember

> If a restart logs everyone out, your auth state lived inside the process. Move it out: sessions in a shared store, JWT secrets from config - and the same rule gives you safe scaling and zero-downtime deploys.

## Self-Test

1. Why does `express-session` with default settings log everyone out on restart?
2. Why is `crypto.randomBytes()` at startup a bad JWT secret?
3. How would you rotate a JWT secret without logging everyone out?

Related: [[09-jwt-logout-invalidation]]
</script>
<script type="text/markdown" class="lesson-data" data-id="81" data-title="Delete 150M Rows Safely" data-category="Databases" data-order="81">
# Delete 150 Million Rows From a Live 800M-Row Table - No Locks, No Lag, No Downtime

*This is the "delete at scale" problem from [[03-ttl-deletion-at-scale]] under stricter rules: a busy table (3,000 writes/second), a replica that must not fall behind, and zero downtime.*

## 1. Why One Big DELETE Is a Disaster

```sql
DELETE FROM events WHERE created_at < '2025-01-01';   -- 150 million rows
```

- **One giant transaction:** it runs for hours, holding locks on every row it touches, and if it fails at 90% everything rolls back.
- **Huge log (WAL / binlog):** 150M row deletions flood the replica, so **replica lag** explodes.
- **Table bloat:** in Postgres, deleted rows become dead tuples until vacuum cleans them; one big delete creates 150M at once.
- **Blocks the 3,000 writes/second** hitting the same table and indexes.

## 2. The Best Answer - If You Can: Don't Delete, Drop

If the table is (or can become) **partitioned by time** ([[21-database-partitioning]]), deleting old data is:

```sql
ALTER TABLE events DETACH PARTITION events_2024_12;
DROP TABLE events_2024_12;                              -- instant, no row-by-row work
```

Dropping a partition removes a whole file - no per-row locks, almost no log, no bloat. **Say this first in the interview** - then handle the case where the table isn't partitioned.

## 3. If You Must Delete Rows: Small Batches, Throttled, Watched

The idea: delete a **small batch** (e.g. 5,000 rows) by primary key, commit, **pause**, check the replica lag, repeat.

```javascript
// Batch delete by primary-key ranges - each batch is a short, cheap transaction
const BATCH = 5000;
const CUTOFF = '2025-01-01';

async function purge() {
  let lastId = 0;
  const { rows: [{ max }] } = await db.query(
    'SELECT max(id) FROM events WHERE created_at < $1', [CUTOFF]);   // the old rows' id boundary

  while (lastId < max) {
    // 1. Stop if the replica is falling behind
    while ((await replicaLagSeconds()) > 5) await sleep(10_000);

    // 2. Delete one small, index-backed slice
    const res = await db.query(
      `DELETE FROM events
       WHERE id > $1 AND id <= $2 AND created_at < $3`,
      [lastId, lastId + BATCH, CUTOFF]);

    lastId += BATCH;
    console.log(`up to id ${lastId}: deleted ${res.rowCount}`);   // resumable: log progress

    // 3. Give live traffic and the replica room to breathe
    await sleep(200);
  }
}

async function replicaLagSeconds() {
  // Postgres, run on the replica connection
  const { rows } = await replica.query(
    'SELECT EXTRACT(EPOCH FROM now() - pg_last_xact_replay_timestamp()) AS lag');
  return Number(rows[0].lag || 0);
}
```

**Why each detail matters:**
- **Delete by primary-key range**, not `LIMIT` with a full scan - each batch finds its rows through the index instantly.
- **Short transactions** - locks are held for milliseconds, so the 3,000 writes/second barely notice.
- **Lag check before each batch** - the replica sets the pace (**backpressure**).
- **Sleep between batches** - smooths the load; tune it while watching latency.
- **Log the last id** - if the job stops, it resumes where it left off.
- **Run off-peak** if possible, and make it **pausable** (a flag or a kill switch).

## 4. After Deleting

- **Postgres:** run `VACUUM` (autovacuum will be busy) so dead rows become reusable space. The file won't shrink by itself - that needs `pg_repack` (online) if you need the disk back.
- **MySQL:** `OPTIMIZE TABLE` or `pt-online-schema-change` to reclaim space online.
- **Then prevent it happening again:** partition the table by month so next year's cleanup is a `DROP` ([[21-database-partitioning]]).

## 5. Alternative: Copy What You Keep

When you're deleting **most** of a table (say 700M of 800M), it's often faster to copy the rows you **keep** into a new table and swap - using an online tool (`pg_repack`, `gh-ost`, `pt-online-schema-change`) that keeps both in sync while live writes continue. With 150M of 800M, batched deletes are usually the simpler choice.

## 🧠 Remember

> Never delete millions of rows in one statement. Best: drop a partition. Otherwise: small primary-key batches, short transactions, pause when the replica lags, log progress so it can resume - and partition the table so you never have to do it again.

## Self-Test

1. Why does one big `DELETE` cause replica lag?
2. Why delete by primary-key range instead of `DELETE ... LIMIT 5000`?
3. Why is dropping a partition so much cheaper than deleting its rows?

Related: [[03-ttl-deletion-at-scale]], [[21-database-partitioning]], [[50-slow-query-500m-rows]]
</script>
<script type="text/markdown" class="lesson-data" data-id="82" data-title="Return 10,000, Show 20 (Pagination)" data-category="Web &amp; API Communication" data-order="82">
# Your API Returns 10,000 Records but the Screen Shows 20 - What Do You Do?

## 1. The Question

The frontend displays 20 rows. The API sends 10,000. Options:
- A) Return all 10,000
- B) Add pagination
- C) Add cursor pagination
- D) Let the frontend handle it

**Answer: paginate on the server - B for a simple admin table, C for large, growing or infinite-scroll lists.** A and D are the same mistake.

## 2. Why "Return All 10,000" Hurts Everyone

Every request pays for 9,980 rows nobody sees:

- **Database:** reads and sorts 10,000 rows instead of 20.
- **Server:** builds a huge object and serializes a multi-MB JSON (which blocks the Node event loop while it runs).
- **Network:** megabytes per request - painful on mobile data.
- **Browser:** parses it all and holds it in memory; rendering 10,000 rows freezes the page.

And it gets worse every day as the table grows. "Let the frontend handle it" (D) means you already paid all of those costs - the frontend can only hide rows, not un-download them.

## 3. Option B: Offset Pagination (page numbers)

```javascript
// GET /api/orders?page=3&limit=20
app.get('/api/orders', async (req, res) => {
  const limit = Math.min(Number(req.query.limit) || 20, 100);   // cap it - never trust the client
  const page = Math.max(Number(req.query.page) || 1, 1);
  const { rows } = await db.query(
    'SELECT id, customer, total, created_at FROM orders ORDER BY created_at DESC, id DESC LIMIT $1 OFFSET $2',
    [limit, (page - 1) * limit]);
  res.json({ items: rows, page, limit });
});
```

- **Good for:** admin tables where users jump to "page 7"; small or medium tables.
- **Weak at depth:** `OFFSET 100000` makes the database walk and throw away 100,000 rows first. And if new rows arrive while the user pages, rows **shift** - duplicates or skipped items.

## 4. Option C: Cursor (Keyset) Pagination

Instead of "skip N rows", say "give me the 20 rows **after the last one I saw**".

```javascript
// GET /api/orders?limit=20&cursor=<opaque>
app.get('/api/orders', async (req, res) => {
  const limit = Math.min(Number(req.query.limit) || 20, 100);
  let where = '', params = [limit + 1];                     // fetch one extra to know if there's more
  if (req.query.cursor) {
    const [ts, id] = Buffer.from(req.query.cursor, 'base64url').toString().split('|');
    where = 'WHERE (created_at, id) < ($2, $3)';
    params.push(ts, id);
  }
  const { rows } = await db.query(
    `SELECT id, customer, total, created_at FROM orders ${where}
     ORDER BY created_at DESC, id DESC LIMIT $1`, params);

  const hasMore = rows.length > limit;
  const items = rows.slice(0, limit);
  const last = items[items.length - 1];
  res.json({
    items,
    nextCursor: hasMore
      ? Buffer.from(`${last.created_at.toISOString()}|${last.id}`).toString('base64url')
      : null,
  });
});
// Index: CREATE INDEX ON orders (created_at DESC, id DESC);
```

- **Fast at any depth** - the index jumps straight to the cursor position.
- **Stable** - new rows don't shift what you've already seen.
- **Can't jump to page 50** - fine for feeds and infinite scroll.
- The `id` tiebreaker handles rows with the same timestamp.

## 5. How to Choose

| Situation | Use |
|---|---|
| Admin table, "page 3 of 12", small data | Offset (B) |
| Feed, infinite scroll, large or fast-growing table | Cursor (C) |
| Export of all rows | A **background job** that streams a file (CSV) - not one API response |
| Frontend truly needs everything (a tiny dropdown list) | Return it all - but only if it's small and bounded |

## 6. Details That Show Seniority

- **Cap `limit`** (e.g. max 100) - otherwise `?limit=1000000` brings the problem back.
- **Return only needed columns**, not `SELECT *`.
- **Avoid `COUNT(*)` on every page** - on big tables it's a full scan. Use `hasMore` (the `limit + 1` trick) or a cached/approximate total.
- **Filter and sort on the server** with matching indexes; otherwise pagination returns the wrong 20.

## 🧠 Remember

> Never send what the user can't see. Paginate on the server: offset for small tables with page numbers, cursor for large lists and infinite scroll - cap the limit and index the sort order.

## Self-Test

1. Why is "let the frontend handle it" the same mistake as returning everything?
2. Why does offset pagination get slower on deep pages?
3. What does the `limit + 1` trick give you?

Related: [[84-infinite-scroll-pagination-at-scale]], [[48-huge-json-payloads]]
</script>
<script type="text/markdown" class="lesson-data" data-id="83" data-title="Redis Down: Protect the Database" data-category="Production Debugging &amp; Incidents" data-order="83">
# Redis Goes Down for 30 Seconds - How Do You Stop the Database From Collapsing?

## 1. The Story

Your API serves 20,000 requests per second. Redis answers 95% of reads, so the database only sees ~1,000 queries per second - and it's sized for that.

Redis goes down for 30 seconds. Your code falls back to the database: **"cache miss? just query the DB."** Now the database gets **20,000 queries per second - 20x its normal load**. Queries slow down, connections pile up, timeouts start, clients **retry**... and the database collapses. When Redis comes back, the DB is still drowning ([[14-cascading-failure-recovery]]).

**The cache wasn't just a speed-up. It was protecting the database.** Losing it removes the protection.

## 2. The Defences (layer them)

### 1. Don't wait on a dead Redis - short timeouts + circuit breaker
If every Redis call waits 5 seconds to time out, your API is slow **and** threads/connections pile up. Set short timeouts (e.g. 50-100 ms). After several failures, **open a circuit breaker**: skip Redis entirely for a few seconds, then try again.

### 2. Limit how hard you hit the database
Put a **concurrency limit** in front of the fallback queries - e.g. at most 200 DB queries in flight per server. Requests beyond that **wait briefly or fail fast** with a friendly error. Better to fail some requests than to take the database (and everyone) down. This is **load shedding**.

### 3. Collapse duplicate requests (request coalescing / single-flight)
If 5,000 requests ask for the same hot key ("homepage products"), only **one** should query the database; the other 4,999 wait for that same promise.

### 4. Serve stale data
A small **in-process cache** (a few seconds to minutes) in each server keeps the hottest items available even when Redis is gone. Slightly stale data beats an outage for most reads (product lists, config) - not for money or permissions.

### 5. Degrade features, not the whole site
Turn off non-essential expensive features (recommendations, "people also viewed") while Redis is down, so core flows keep working.

## 3. Code: All the Layers Together (Node.js)

```javascript
const pLimit = require('p-limit');                 // or your own limiter
const dbLimit = pLimit(200);                        // max 200 DB fallback queries in flight
const inFlight = new Map();                         // single-flight: key -> promise
const local = new Map();                            // tiny stale cache: key -> { value, at }

let redisDownUntil = 0;                             // simple circuit breaker

async function cachedGet(key, loadFromDb, ttlSec = 60) {
  // 1. Try Redis unless the breaker is open
  if (Date.now() > redisDownUntil) {
    try {
      const hit = await withTimeout(redis.get(key), 80);       // don't wait on a dead Redis
      if (hit) return JSON.parse(hit);
    } catch {
      redisDownUntil = Date.now() + 5000;                       // open the breaker for 5s
    }
  }

  // 2. Serve slightly stale local data if we have it (fresh enough)
  const stale = local.get(key);
  if (stale && Date.now() - stale.at < 5 * 60_000) return stale.value;

  // 3. Single-flight: only one DB query per key at a time
  if (inFlight.has(key)) return inFlight.get(key);
  const p = dbLimit(() => loadFromDb())              // 4. bounded DB load (load shedding)
    .then((value) => {
      local.set(key, { value, at: Date.now() });
      if (Date.now() > redisDownUntil) {
        redis.set(key, JSON.stringify(value), 'EX', ttlSec + Math.floor(Math.random() * 30)).catch(() => {});
      }
      return value;
    })
    .finally(() => inFlight.delete(key));
  inFlight.set(key, p);
  return p;
}

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}
```

(In production, bound the `local` map with an LRU so it can't grow forever, and add a queue-wait timeout to the limiter.)

## 4. When Redis Comes Back: Avoid the Second Wave

- The cache is **empty** (cold). If every request rebuilds at once, you get a **stampede** again. Single-flight and TTL **jitter** (the `+ Math.random() * 30` above) spread the rebuilds out ([[16-synchronized-connection-pool-expiry]] - same "everything at once" trap).
- **Pre-warm** the hottest keys before sending full traffic back.
- Don't let the autoscaler add 10 more servers against the struggling DB - that makes it worse ([[39-autoscaling-amplifies-outage]]).

## 5. Prevent It in the First Place

- **Managed Redis with a replica and automatic failover** (e.g. ElastiCache Multi-AZ) - a 30-second outage becomes a few seconds.
- **Size the database for "cache is gone" for at least a short time**, or know exactly how much it can take.
- **Separate Redis roles:** sessions and queues shouldn't share an instance with a disposable cache.
- **Alert** on cache hit ratio and DB connection usage - you'll see trouble before it becomes an outage.


## 🧠 Remember

> A cache protects the database, so plan for losing it: short timeouts and a circuit breaker, a cap on fallback DB queries, one query per hot key, stale data where it's safe - and jittered, gradual refill when Redis returns.

## Self-Test

1. Why can a 30-second cache outage keep the database down for much longer?
2. What does single-flight (request coalescing) save you?
3. Why add random jitter to TTLs when refilling the cache?

Related: [[14-cascading-failure-recovery]], [[16-synchronized-connection-pool-expiry]], [[39-autoscaling-amplifies-outage]], [[44-distributed-locking-with-redis]]
</script>
<script type="text/markdown" class="lesson-data" data-id="84" data-title="Infinite Scroll Pagination at Scale" data-category="Web &amp; API Communication" data-order="84">
# Millions of Records + Infinite Scroll - Which Pagination Strategy?

*Same topic as [[82-return-10000-show-20]], asked from the design side. Short answer below; the full code is in lesson 82.*

## 1. The Answer in One Line

> **Cursor-based (keyset) pagination** on an indexed, stable sort order - because offset gets slower the deeper you scroll and shifts rows while new data arrives.

## 2. Why Not Offset for Infinite Scroll?

| Problem | Offset (`LIMIT 20 OFFSET 200000`) | Cursor (`WHERE (created_at, id) < (...)`) |
|---|---|---|
| Speed on deep scroll | Slower every page - the DB walks and discards all skipped rows | Same speed at any depth - the index jumps to the cursor |
| New items arrive while scrolling | Rows shift: duplicates or missed items | Stable - you continue after the last item you saw |
| Jump to page 500 | Possible | Not possible (not needed for infinite scroll) |

## 3. How It Works

1. The first request returns 20 items + a **`nextCursor`** (an encoded `created_at|id` of the last item).
2. The client sends `?cursor=...` to get the next 20.
3. The query uses `WHERE (created_at, id) < (cursor values) ORDER BY created_at DESC, id DESC LIMIT 21` on an index `(created_at DESC, id DESC)`.
4. When `nextCursor` is `null`, the client shows "You're all caught up".

## 4. Production Details

- **Opaque cursor** (base64) - clients shouldn't build or depend on its format.
- **Tiebreaker column (`id`)** - many rows can share a timestamp.
- **Filters are part of the index** - e.g. a feed per tenant needs `(tenant_id, created_at DESC, id DESC)`.
- **Cap the page size** and skip `COUNT(*)`; use `limit + 1` to know if there's more.
- **Frontend:** an IntersectionObserver loads the next page before the user hits the bottom, and **virtualize** the list once it gets long so the DOM doesn't hold 10,000 nodes ([[33-react-performance-at-scale]]).
- **Deletions are fine;** the cursor just continues from the last seen position.

## 🧠 Remember

> For infinite scroll over millions of rows: cursor pagination on an indexed, stable sort (timestamp + id), an opaque cursor, a capped page size - and a virtualized list on the frontend.

## Self-Test

1. What two problems does offset pagination cause in an infinite feed?
2. Why must the cursor include `id` and not just `created_at`?

Related: [[82-return-10000-show-20]], [[33-react-performance-at-scale]]
</script>
<script type="text/markdown" class="lesson-data" data-id="85" data-title="Authentication vs Authorization" data-category="Security" data-order="85">
# Authentication vs Authorization - In One Sentence Each

## 1. The One-Liners

> **Authentication (AuthN)** answers **"Who are you?"** - proving your identity.
>
> **Authorization (AuthZ)** answers **"What are you allowed to do?"** - checking your permissions.

**Authentication always comes first** - you can't decide what someone may do until you know who they are.

## 2. The Everyday Picture

At an office building:
- Showing your **ID card at reception** = authentication (they know who you are).
- Your card **opening only the 5th floor, not the server room** = authorization (what you may access).

## 3. In a Real App

| | Authentication | Authorization |
|---|---|---|
| Question | Who is this? | May they do this? |
| Examples | Password, OTP / 2FA, SSO login, JWT or session check | Roles (admin, editor), permissions ("can delete supplier"), ownership ("only your own orders") |
| Failure status | **401 Unauthorized** (really means "unauthenticated") | **403 Forbidden** |
| Happens | Once at login, then verified on each request via the token/session | On every protected action |

## 4. In Code (Express)

```javascript
// AUTHENTICATION - who is calling?
function authenticate(req, res, next) {
  const token = req.get('Authorization')?.replace('Bearer ', '');
  try {
    req.user = jwt.verify(token, process.env.JWT_SECRET);   // identity proven
    next();
  } catch {
    res.status(401).json({ error: 'Please log in' });         // we don't know who you are
  }
}

// AUTHORIZATION - may they do THIS?
const requirePermission = (perm) => (req, res, next) =>
  req.user.permissions?.includes(perm) ? next()
    : res.status(403).json({ error: 'You do not have access to this' });

app.delete('/api/suppliers/:id',
  authenticate,                          // 1. who are you?
