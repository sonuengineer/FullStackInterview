<script>
mermaid.initialize({ startOnLoad: false, theme: 'default' });

// ---- Discover all lessons from the embedded <script type="text/markdown"> blocks ----
const lessonNodes = Array.from(document.querySelectorAll('script.lesson-data'));
const lessons = lessonNodes.map(node => ({
  id: node.dataset.id,
  title: node.dataset.title,
  category: node.dataset.category || 'Uncategorized',
  order: parseInt(node.dataset.order || '999', 10),
  content: node.textContent.trim(),
})).sort((a, b) => a.order - b.order);

// Preserve category display order by first-seen order in the lesson list
const categoryOrder = [];
lessons.forEach(l => { if (!categoryOrder.includes(l.category)) categoryOrder.push(l.category); });

const renderer = new marked.Renderer();
renderer.code = function(code, lang) {
  if (lang === 'mermaid') return '<div class="mermaid">' + code + '</div>';
  return '<pre><code>' + code.replace(/</g, '&lt;') + '</code></pre>';
};

// Turn [[NN-slug]] references inside lesson markdown into clickable
// "related lesson" jumps, so similar/duplicate-pattern questions link
// back to where the concept was first taught instead of repeating it.
function linkifyCrossRefs(md) {
  return md.replace(/\[\[(\d{2})-[a-z0-9-]+\]\]/g, (match, id) => {
    const target = lessons.find(l => l.id === id);
    if (!target) return match;
    return '<a href="#" class="xref-link" data-target="' + id + '">&#128279; Lesson ' + id + ': ' + target.title + '</a>';
  });
}

const readerEl = document.getElementById('reader');
const progressEl = document.getElementById('progress');
const tocContainer = document.getElementById('toc-container');
let currentId = null;

// Accordion state: every category starts closed. Persisted here (not reset
// on each buildSidebar call) so opening a lesson or searching doesn't
// forget which topics the user had open/closed.
const collapsedCategories = new Set(categoryOrder);
try {
  const saved = JSON.parse(localStorage.getItem('dashboard.openCategories') || '[]');
  saved.forEach(cat => collapsedCategories.delete(cat));
} catch (e) {}

function persistOpenCategories() {
  const open = categoryOrder.filter(c => !collapsedCategories.has(c));
  try { localStorage.setItem('dashboard.openCategories', JSON.stringify(open)); } catch (e) {}
}

function buildSidebar(filterText) {
  tocContainer.innerHTML = '';
  const q = (filterText || '').trim().toLowerCase();

  categoryOrder.forEach(cat => {
    const items = lessons.filter(l => l.category === cat &&
      (!q || l.title.toLowerCase().includes(q) || cat.toLowerCase().includes(q)));
    if (!items.length) return;

    // Always show the category containing the active lesson, and expand
    // every matching category while actively searching - collapsed is only
    // the resting state, not something that hides what you're looking for.
    const containsActive = items.some(l => l.id === currentId);
    const forceOpen = q.length > 0 || containsActive;
    const isOpen = forceOpen || !collapsedCategories.has(cat);

    const group = document.createElement('div');
    group.className = 'category-group';

    const titleEl = document.createElement('div');
    titleEl.className = 'category-title' + (isOpen ? '' : ' collapsed');
    titleEl.textContent = cat + ' (' + items.length + ')';
    const itemsEl = document.createElement('div');
    itemsEl.className = 'category-items' + (isOpen ? '' : ' collapsed');

    titleEl.addEventListener('click', () => {
      const nowCollapsed = titleEl.classList.toggle('collapsed');
      itemsEl.classList.toggle('collapsed', nowCollapsed);
      if (nowCollapsed) collapsedCategories.add(cat);
      else collapsedCategories.delete(cat);
      persistOpenCategories();
    });

    items.forEach(l => {
      const btn = document.createElement('button');
      btn.className = 'toc-item' + (l.id === currentId ? ' active' : '');
      btn.innerHTML = '<span class="toc-num">' + l.id + '</span>' + l.title;
      btn.addEventListener('click', () => openLesson(l.id));
      itemsEl.appendChild(btn);
    });

    group.appendChild(titleEl);
    group.appendChild(itemsEl);
    tocContainer.appendChild(group);
  });

  if (!tocContainer.children.length) {
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'No lessons match "' + filterText + '"';
    tocContainer.appendChild(note);
  }
}

function renderHome() {
  currentId = null;
  document.title = 'Learning Dashboard';
  progressEl.textContent = lessons.length + ' lessons';
  let html = '<h1>Your Learning Library</h1>' +
    '<p style="color:var(--muted)">' + lessons.length + ' lessons across ' + categoryOrder.length + ' topics. Click any card, or pick from the sidebar.</p>' +
    '<div class="home-grid">';
  lessons.forEach(l => {
    html += '<div class="home-card" data-id="' + l.id + '">' +
      '<div class="cat">' + l.category + '</div>' +
      '<div class="ttl">' + l.id + '. ' + l.title + '</div></div>';
  });
  html += '</div>';
  readerEl.innerHTML = html;
  readerEl.querySelectorAll('.home-card').forEach(card => {
    card.addEventListener('click', () => openLesson(card.dataset.id));
  });
  buildSidebar(document.getElementById('search').value);
  window.scrollTo(0, 0);
  readerEl.scrollTop = 0;
}

function openLesson(id) {
  const lesson = lessons.find(l => l.id === id);
  if (!lesson) return;
  currentId = id;
  document.title = lesson.title + ' - Learning Dashboard';
  readerEl.innerHTML = marked.parse(linkifyCrossRefs(lesson.content), { renderer });
  mermaid.run({ querySelector: '#reader .mermaid' });
  progressEl.textContent = 'Lesson ' + lesson.id + ' of ' + lessons.length + ' - ' + lesson.category;
  buildSidebar(document.getElementById('search').value);
  document.getElementById('reader-wrap').scrollTop = 0;
  try { localStorage.setItem('dashboard.lastLesson', id); } catch (e) {}
}

document.getElementById('btn-home').addEventListener('click', renderHome);
document.getElementById('search').addEventListener('input', (e) => buildSidebar(e.target.value));
readerEl.addEventListener('click', (e) => {
  const link = e.target.closest('.xref-link');
  if (link) { e.preventDefault(); openLesson(link.dataset.target); }
});

function setTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  try { localStorage.setItem('dashboard.theme', theme); } catch (e) {}
}
document.getElementById('theme-sepia').addEventListener('click', () => setTheme('sepia'));
document.getElementById('theme-light').addEventListener('click', () => setTheme('light'));
document.getElementById('theme-dark').addEventListener('click', () => setTheme('dark'));

document.getElementById('font-sm').addEventListener('click', () => {
  readerEl.classList.remove('font-lg');
  readerEl.classList.add('font-sm');
  try { localStorage.setItem('dashboard.font', 'font-sm'); } catch (e) {}
});
document.getElementById('font-lg').addEventListener('click', () => {
  readerEl.classList.remove('font-sm');
  readerEl.classList.add('font-lg');
  try { localStorage.setItem('dashboard.font', 'font-lg'); } catch (e) {}
});

// ---- Restore last session (theme, font size, last-read lesson) ----
(function restore() {
  let theme = 'sepia', font = null, lastId = null;
  try {
    theme = localStorage.getItem('dashboard.theme') || 'sepia';
    font = localStorage.getItem('dashboard.font');
    lastId = localStorage.getItem('dashboard.lastLesson');
  } catch (e) {}
  setTheme(theme);
  if (font) readerEl.classList.add(font);
  if (lastId && lessons.find(l => l.id === lastId)) {
    openLesson(lastId);
  } else {
    renderHome();
  }
})();
</script>
</body>
</html>
