3. Validate it, then process it, all **inside the HTTP request**.

With a 20 MB body, one request can easily hold 50-100 MB of heap. Ten concurrent uploads and a normal-sized server is out of memory. And because processing happens inside the request, the client is stuck waiting for minutes, load balancers hit their timeouts, and one slow request ties up a worker for everyone else.

## 3. The Solution - Stop Treating a Big Payload Like a Small One

**1. Set explicit limits.** Configure a max body size at the load balancer/reverse proxy and in the app (`express.json({ limit: '20mb' })`). Anything bigger gets a fast `413 Payload Too Large` instead of eating memory first.

**2. Accept compressed bodies.** JSON compresses extremely well (often 5-10x). Accept `Content-Encoding: gzip` so the network transfer is small.

**3. Stream-parse instead of loading everything.** **Term: Streaming parser** - reads the JSON piece by piece and emits one record at a time, so memory stays flat no matter how big the file is. If the payload is an array of items, process each item as it arrives instead of holding all of them.

**4. Make it asynchronous.** The API should only *accept* the payload, store it (object storage like S3), put a job on a queue, and immediately return `202 Accepted` with a `jobId`. Workers process it in the background, and the client polls `GET /jobs/{jobId}` or gets a webhook when done. This is the same "decouple slow work from the request" idea from [[17-notification-system-design]].

**5. Better yet - don't send it through the API at all.** For really large data, let the client upload directly to object storage with a pre-signed URL and just tell the API "it's there." That's the full design in [[49-large-file-upload-with-status]].

**6. Question the format.** If partners are sending huge arrays of records, **NDJSON** (one JSON object per line) or batched pagination (1,000 items per request) is often simpler than one giant document.

## 4. Mental Model

> A big payload is not a big request, it's a **job**. Accept it fast, store it somewhere durable, and process it in the background, piece by piece.

## 5. Flow

```mermaid
flowchart LR
  C[Client] -->|gzip JSON, max 20MB| API
  API -->|store raw payload| S3[(Object storage)]
  API -->|enqueue jobId| Q[Queue]
  API -->|202 Accepted + jobId| C
  Q --> W[Worker - streaming parse]
  W --> DB[(Database)]
  C -->|GET /jobs/jobId| API
```

## 6. Code Example

```javascript
// Accept fast, process later
app.post('/imports', express.raw({ type: 'application/json', limit: '20mb' }), async (req, res) => {
  const jobId = crypto.randomUUID();
  await s3.putObject({ Bucket: 'imports', Key: `${jobId}.json`, Body: req.body });
  await queue.send({ jobId });
  await db.jobs.insert({ id: jobId, status: 'queued' });
  res.status(202).json({ jobId, statusUrl: `/imports/${jobId}` });
});

// Worker: stream-parse so memory stays flat
const { parser } = require('stream-json');
const { streamArray } = require('stream-json/streamers/StreamArray');

async function processImport(jobId) {
  const stream = (await s3.getObject({ Bucket: 'imports', Key: `${jobId}.json` })).Body
    .pipe(parser()).pipe(streamArray());
  for await (const { value: item } of stream) {
    await upsertItem(item); // one record at a time, never the whole file in memory
  }
  await db.jobs.update(jobId, { status: 'done' });
}
```

## 7. Production Reality

- Validate cheaply up front (content type, size, auth), and do deep validation in the worker, reporting row-level errors in the job status.
- Make the import idempotent (the client sends an idempotency key, see [[32-payment-idempotency-double-click]]) so a retry after a timeout doesn't import twice.
- Put per-client rate limits on this endpoint, since a single partner can otherwise flood your workers.

## 8. Trade-offs

Async processing means the client no longer gets an instant "done", it gets a job to track. That is more work for API consumers, but it is the only design that stays stable when payloads and concurrency both grow.

## 9. Common Mistakes

- Just raising the body limit to 50 MB and calling it fixed. The memory and timeout problems are still there, just delayed.
- Parsing the whole payload in the request handler, then processing it synchronously while the client waits.

## 10. 🧠 Remember

> Treat a huge payload as a job, not a request: limit it, compress it, store it, queue it, and stream-parse it in a worker.

## 11. Quick Self-Test

1. Why can a 20 MB JSON body use far more than 20 MB of memory once parsed?
2. Why is returning `202 Accepted` with a job ID better than processing inside the request?
3. When would you skip the API entirely and upload straight to object storage?
</script>
<script type="text/markdown" class="lesson-data" data-id="49" data-title="Large File Uploads With Status Tracking" data-category="System Design at Scale" data-order="49">
# Large File Uploads With Status Tracking - Why "Upload Through the API" Is Wrong

> **Builds on**: [[48-huge-json-payloads]] (big data should not flow through your API servers) and [[17-notification-system-design]] (async processing with status tracking).

## 1. Story

The interview problem: build a system where users upload large files (videos, datasets, 2 GB design files) and can see the upload status.

The candidate answers: "Frontend uploads the file, API receives it, backend stores it on the server, save the file URL in the DB."

It sounds reasonable. It breaks in at least five ways.

## 2. What's Wrong With the Candidate's Answer

- **API servers become file pipes.** Every byte of a 2 GB file flows through your app server, holding a connection and memory/disk for minutes. A handful of uploads can saturate the whole API tier.
- **Storing on the server's local disk.** The file lives on one machine. The next request might hit another instance behind the load balancer that doesn't have it, autoscaling can delete that instance, and disks fill up. This breaks the stateless-server rule from [[06-ec2-autoscaling]].
- **No resume.** If the network drops at 95%, the user starts over from zero.
- **No real status.** "Track upload status" is impossible if the only state is "the request is still open."
- **Timeouts.** Load balancers and proxies commonly cut long requests (often 60 seconds by default), killing large uploads mid-way.

## 3. The Correct Design

**Step 1 - Ask for permission, not bandwidth.** The client calls the API: "I want to upload `video.mp4`, 2 GB." The API creates an `uploads` record (`status = pending`) and returns a **pre-signed URL**.

**Term: Pre-signed URL** - a temporary, signed link that lets the client upload directly to object storage (S3, GCS, Azure Blob) for a limited time, without your API ever touching the bytes and without exposing storage credentials.

**Step 2 - Upload directly to object storage, in parts.** For big files, use **multipart upload**: the file is split into chunks (for example 10 MB each), uploaded in parallel, and each chunk can be retried independently. A dropped connection means re-sending one chunk, not the whole file. This gives you resume for free.

**Step 3 - Track progress.** The client knows which parts are done, so it can show a real progress bar. The server records state transitions: `pending -> uploading -> uploaded -> processing -> ready` (or `failed`).

**Step 4 - Confirm completion.** When the upload finishes, object storage emits an event (e.g. S3 event notification) or the client calls `POST /uploads/{id}/complete`. The API verifies the object exists (size, checksum) and updates the status.

**Step 5 - Post-process asynchronously.** Virus scan, thumbnails, video transcoding, metadata extraction all run in background workers from a queue, updating the status as they go. The user sees "Processing..." then "Ready".

## 4. Mental Model

> Your API is the **traffic controller**, not the **truck**. It hands out permission slips (pre-signed URLs) and keeps the logbook (status table), while the heavy cargo goes straight from the user to the warehouse (object storage).

## 5. Flow

```mermaid
sequenceDiagram
  participant C as Client
  participant API
  participant S3 as Object Storage
  participant Q as Queue/Worker

  C->>API: POST /uploads (name, size, type)
  API-->>C: uploadId + pre-signed part URLs
  C->>S3: PUT part 1..N (parallel, retry per part)
  C->>API: POST /uploads/{id}/complete
  API->>S3: verify object (size, checksum)
  API->>Q: enqueue post-processing
  Q-->>API: status = ready
  C->>API: GET /uploads/{id} (status polling or websocket)
```

## 6. Data Model

| Column | Purpose |
|---|---|
| id | upload id |
| user_id | owner |
| object_key | where it lives in storage |
| size, checksum | integrity check on completion |
| status | pending / uploading / uploaded / processing / ready / failed |
| created_at, updated_at | expire abandoned uploads |

## 7. Production Reality

- **Abandoned uploads**: users close the tab mid-upload. Use a lifecycle rule to clean up incomplete multipart uploads and a TTL on `pending` records (same continuous-cleanup idea as [[03-ttl-deletion-at-scale]]).
- **Security**: validate type/size before issuing the URL, keep the URL short-lived, scan files before they become downloadable, and never trust the client-reported size alone.
- **Downloads**: serve files via a CDN or pre-signed GET URLs, not through the API.

## 8. Trade-offs

Direct-to-storage uploads add a few more steps (request URL, upload, confirm) and make the client slightly more complex. In return, the API tier stays small and stateless, uploads survive network drops, and status becomes a real, queryable thing.

## 9. 🧠 Remember

> Never stream large files through your API servers or onto their local disks: hand out pre-signed URLs, let clients upload in resumable parts straight to object storage, and track the lifecycle in a status table.

## 10. Quick Self-Test

1. Name three things that break when files are stored on the API server's local disk.
2. How does multipart upload give you "resume" almost for free?
3. How does the backend learn that an upload directly to S3 has finished?
</script>
<script type="text/markdown" class="lesson-data" data-id="50" data-title="Slow Query on 500M Rows" data-category="Databases" data-order="50">
# 500 Million Rows, 45-Second Query, Business Wants Under 2 Seconds - What First?

> **Connects to**: [[21-database-partitioning]] and [[28-scaling-database-reads]] cover the bigger tools. This lesson is about the **order**: what you touch *first*, and why the answer is "read the query plan" before anything else.

## 1. Story

A reporting query on a 500-million-row `orders` table takes 45 seconds. The business wants it under 2. Someone suggests "bigger database," someone else says "add Redis," a third wants to shard. Nobody has looked at *why* it takes 45 seconds.

## 2. First Move: Look at the Query Plan

**Term: Query plan** - the step-by-step strategy the database chose to run your query (which indexes, which scan type, which join order). You see it with `EXPLAIN` (estimates) or `EXPLAIN ANALYZE` (actually runs it and shows real timings and row counts).

This is the Database Mode chain in practice: **data -> storage -> index -> query -> query plan -> performance**. A 45-second query on 500M rows almost always shows one of these in the plan:

- **Sequential scan** (reading the whole table) because no usable index exists for the `WHERE` filter.
- An index exists but **can't be used**: a function on the column (`WHERE DATE(created_at) = ...`), an implicit type cast, a leading wildcard `LIKE '%abc'`, or `OR` across different columns.
- A huge **sort or hash** spilling to disk because `ORDER BY` / `GROUP BY` isn't backed by an index.
- Row estimates wildly wrong because **statistics are stale**, so the planner picks a bad strategy.

## 3. Then Fix in Order of Cheapness

1. **Rewrite the query so indexes can be used.** `WHERE created_at >= '2026-01-01' AND created_at < '2026-01-02'` instead of `WHERE DATE(created_at) = '2026-01-01'`. Select only the columns you need instead of `SELECT *`.
2. **Add the right index.** Usually a **composite index** matching the filter and sort, e.g. `(customer_id, created_at)`. If the index also contains every selected column (a **covering index**), the database never even touches the table rows.
3. **Update statistics** (`ANALYZE`) so the planner makes good choices.
4. **Partition** by the filter key (often time) so the query touches one partition instead of 500M rows - see [[21-database-partitioning]].
5. **Precompute** if it's an aggregate report: a summary table or materialized view refreshed periodically turns a 45-second aggregation into a millisecond lookup - the CQRS idea from [[28-scaling-database-reads]].
6. Only after all that: caching, read replicas, or bigger hardware.

## 4. Code Example

```sql
-- Step 1: see what the database is actually doing
EXPLAIN ANALYZE
SELECT id, total FROM orders
WHERE customer_id = 42 AND DATE(created_at) = '2026-09-01'
ORDER BY created_at DESC;
-- Plan shows: Seq Scan on orders (rows=500,000,000) ... 45,000 ms

-- Step 2: make the filter index-friendly
SELECT id, total FROM orders
WHERE customer_id = 42
  AND created_at >= '2026-09-01' AND created_at < '2026-09-02'
ORDER BY created_at DESC;

-- Step 3: index that matches filter + sort, covering the selected columns
CREATE INDEX CONCURRENTLY idx_orders_customer_created
  ON orders (customer_id, created_at DESC) INCLUDE (total);
-- Plan now: Index Only Scan ... ~5 ms
```

## 5. Mental Model

> Never tune a slow query blind. `EXPLAIN ANALYZE` tells you whether the database is reading 500 million rows or 50 - and most "45 second" queries are one missing or unusable index away from milliseconds.

## 6. Production Reality

- On a live 500M-row table, create indexes **concurrently** (`CREATE INDEX CONCURRENTLY` in Postgres, online DDL in MySQL) so you don't lock writes for an hour.
- Every index speeds up reads but slows down writes and uses disk, so add the one the plan actually needs, not ten "just in case."
- Test with production-like data volume; a query that's fast on 10,000 rows in staging can pick a completely different plan on 500M.

## 7. Common Mistakes

- Jumping to Redis or a bigger instance before reading the query plan.
- Wrapping an indexed column in a function in the `WHERE` clause, silently disabling the index.
- Adding a single-column index when the query filters on one column and sorts on another, so the database still sorts millions of rows.

## 8. 🧠 Remember

> Slow query on a huge table: run `EXPLAIN ANALYZE` first, make the filter index-friendly, add the index that matches the filter and sort, and only then reach for partitioning, precomputation, or hardware.

## 9. Quick Self-Test

1. Why does `WHERE DATE(created_at) = ...` often ignore an index on `created_at`?
2. What makes an index "covering," and why is it faster?
3. When is a materialized view a better fix than an index?
</script>
<script type="text/markdown" class="lesson-data" data-id="51" data-title="Fast API, Slow Page (80ms vs 4.8s)" data-category="Frontend" data-order="51">
# The API Is Fast, But Users Say It's Slow (80ms Backend, 4.8s Experience)

> **Similar-question flag**: this is close to [[33-react-performance-at-scale]] (backend fine, browser is the bottleneck). That lesson was about **rendering a big list** after data arrives. This one is about the **whole page-load timeline**: everything that happens between the user pressing Enter and seeing something usable.

## 1. Story

Backend: 80ms. Database: 20ms. Yet users wait 4.8 seconds before the page is usable. Where did the other 4.7 seconds go?

## 2. The Key Insight

Your 80ms is the time **one API call** spends on **your server**. The user experiences the **whole journey**:

`DNS -> TCP/TLS handshake -> download HTML -> download + parse + execute JavaScript -> render -> fetch data (maybe many calls, maybe one after another) -> render again -> images/fonts load`

The backend is one small slice of that timeline.

## 3. Where to Investigate (in This Order)

**1. Open the browser's Network tab (waterfall view).** It shows every request on a timeline. Look for:
- A **request waterfall**: call A must finish before call B starts, then C. Five sequential 80ms calls plus network latency each is already over a second. This is [[13-hidden-latency-bottleneck]] happening in the browser: fix it by running independent calls in parallel, or by adding one endpoint that returns everything the page needs.
- **Huge JavaScript bundles**: a 3 MB bundle must be downloaded, parsed, and executed before anything useful appears, especially slow on mid-range phones.
- **Large unoptimized images** or web fonts blocking text from showing.

**2. Check network distance.** 80ms on the server can be 300ms+ for a user on the other side of the world. Static assets should come from a **CDN**, and repeat visits should hit the browser cache (correct `Cache-Control` headers).

**3. Check how the page renders.** A pure client-side-rendered app shows a blank screen until JS loads, runs, *then* fetches data. Server-side rendering or static generation can show content much earlier.

**4. Run Lighthouse / Core Web Vitals.**
- **TTFB** (Time To First Byte): server + network. Yours is probably fine.
- **LCP** (Largest Contentful Paint): when the main content appears. This is likely where the 4.8s shows up.
- **INP** (Interaction to Next Paint): how quickly the page responds to clicks and typing.

**5. Measure real users, not just your laptop.** Real User Monitoring (RUM) shows what people on slow phones and 4G actually experience; your fast dev machine on office Wi-Fi hides most of this.

## 4. Fixes, Matched to Cause

| Finding | Fix |
|---|---|
| Sequential API calls | Parallelize, or one aggregated endpoint (BFF) |
| Huge JS bundle | Code-splitting, lazy loading, remove unused libraries |
| Blank screen until JS runs | SSR / static generation, skeleton UI |
| Slow assets far from user | CDN + caching headers |
| Heavy images | Compress, modern formats (WebP/AVIF), lazy-load below the fold |
| Slow after load | See [[33-react-performance-at-scale]] |

## 5. Mental Model

> "The API is fast" measures one slice of the timeline. Users feel the whole timeline. Measure end-to-end from the user's device, then find the biggest bar in the waterfall.

## 6. Flow

```mermaid
flowchart LR
  A[DNS + TLS] --> B[HTML]
  B --> C["JS bundle 3MB: download + parse + run"]
  C --> D["API call 1 (80ms)"]
  D --> E["API call 2 (waits for 1)"]
  E --> F["API call 3 (waits for 2)"]
  F --> G[Render + images]
```

## 7. Common Mistakes

- Treating backend latency as "the" latency and closing the ticket.
- Testing only on a fast laptop and fast network, never on a mid-range phone on mobile data.

## 8. 🧠 Remember

> An 80ms API can still produce a 4.8s page: check the network waterfall for sequential calls, bundle size, and distance to the user, and measure what real users experience, not just what your server logs.

## 9. Quick Self-Test

1. What does TTFB measure, and why can it be good while LCP is terrible?
2. How does a request waterfall turn five fast calls into a slow page?
3. Why can a big JavaScript bundle hurt more on phones than on laptops?
</script>
<script type="text/markdown" class="lesson-data" data-id="52" data-title="ORM or Raw SQL?" data-category="Databases" data-order="52">
# Tech Lead Says "Never Use an ORM." What's Your Reply?

## 1. Story

Your tech lead has been burned before: a page that made 400 database queries, a report that took 30 seconds because the ORM generated an insane join, a migration nobody understood. So now the rule is: "Never use an ORM for database queries."

## 2. What an ORM Actually Is

**Term: ORM (Object-Relational Mapper)** - a library (Prisma, Sequelize, TypeORM, Hibernate, Django ORM, SQLAlchemy) that maps database rows to objects in your code, so you write `User.findById(1)` instead of `SELECT * FROM users WHERE id = 1`.

It's a productivity and safety tool, not a performance tool.

## 3. Why the Tech Lead Isn't Wrong

The pain is real:

- **The N+1 problem.** Load 100 orders, then access `order.customer` in a loop: the ORM quietly runs 1 query for orders + 100 queries for customers = 101 round trips, where one join would have done it.
- **Hidden, inefficient SQL.** Complex filters and joins can generate SQL no human would write, and nobody looks at it until it's slow.
- **Over-fetching.** `SELECT *` by default, loading columns you don't need.
- **Leaky abstraction.** Developers stop learning SQL and can't debug the query plan (see [[50-slow-query-500m-rows]]).

## 4. Why "Never" Is Too Strong

- Most application queries are simple CRUD. Hand-writing hundreds of them is slow, repetitive, and error-prone.
- ORMs give you **parameterized queries by default**, which protects against SQL injection - hand-built SQL strings are a common source of exactly that bug.
- Migrations, relations, and type safety come for free.
- Nearly every ORM has an escape hatch to raw SQL when you need it.

## 5. A Good Reply

> "I agree the ORM has burned us. But I'd rather set rules than ban it: use the ORM for simple CRUD, where it's safe and fast to write. For complex reports, hot paths, and bulk operations, write raw SQL or use a query builder. Log the SQL the ORM generates, watch for N+1 in code review, and check `EXPLAIN` on anything slow. The problem isn't the ORM, it's not knowing what SQL it runs."

## 6. Code Example

```javascript
// N+1: 1 query for orders + 1 query per order for the customer
const orders = await Order.findAll();
for (const o of orders) {
  console.log((await o.getCustomer()).name);
}

// Fixed with the ORM: eager-load, one query with a join
const orders2 = await Order.findAll({ include: Customer });

// Hot reporting path: raw SQL where you control every line
const rows = await db.query(
  `SELECT c.name, SUM(o.total) AS revenue
     FROM orders o JOIN customers c ON c.id = o.customer_id
    WHERE o.created_at >= $1
    GROUP BY c.name
    ORDER BY revenue DESC
    LIMIT 20`,
  [since]   // still parameterized - never string-concatenate user input
);
```

## 7. Mental Model

> An ORM is an automatic gearbox: great for daily driving, but you should still know how the engine works, and switch to manual (raw SQL) on the steep hills.

## 8. Trade-offs

| | ORM | Raw SQL / query builder |
|---|---|---|
| Speed of development | Fast for CRUD | Slower, more code |
| Performance control | Limited, can surprise you | Full control |
| Injection safety | Safe by default | Safe only if parameterized |
| Complex queries | Awkward or inefficient | Natural |

## 9. Common Mistakes

- Banning the ORM entirely and then hand-writing string-concatenated SQL that opens SQL injection holes.
- Using the ORM everywhere without ever looking at the generated SQL.

## 10. 🧠 Remember

> The right answer isn't "never ORM" or "always ORM" - it's ORM for simple CRUD, raw SQL for complex and hot paths, and always knowing what SQL is actually running.

## 11. Quick Self-Test

1. What is the N+1 query problem, and how do you fix it inside an ORM?
2. Why can banning ORMs make an application *less* secure?
3. Which kinds of queries would you always write by hand?
</script>
<script type="text/markdown" class="lesson-data" data-id="53" data-title="How to Clear Senior System Design Without Big-Scale Experience" data-category="Blog" data-order="53">
# Blog: How to Clear a Senior System Design Round Without Ever Working at Google Scale

*A junior engineer asked: "My company has a few thousand users. I've never worked at Google or Atlassian scale. How am I supposed to clear a Senior system design round?"*

Here's the honest answer.

**You don't need to have worked at Google scale to reason about scale.**
**You need to show you can find what breaks as the workload grows.**

Interviewers aren't checking whether you've *seen* a million requests per second. They're checking whether you can look at a design and say: "This part breaks first, here's why, here's what I'd change, and here's what that change costs." That skill can be practiced on any system - including the small one you work on today.

Let's make it concrete with one running example.

---

## Our Example: The "Place Order" Feature

Imagine you built the checkout for a small food-ordering app. Today it handles about **100 requests per second** at dinner time.

```
Client -> API -> OrderService -> Postgres
                              -> Payment provider (external)
                              -> sends confirmation email
```

Nothing fancy. Now let's use it to practice thinking like a senior engineer.

---

## Step 1 - Start With the System You Already Know

Take this one feature and ask:

- **What breaks at 1,000 requests/sec?**
- **What breaks at 10,000?**
- **Which component gets saturated first?**
- **How would I even know?**

Walk through it for our checkout:

| Load | What likely breaks first | How you'd notice |
|---|---|---|
| 100 rps | Nothing, it works | - |
| 1,000 rps | Database connection pool runs out (say 20 connections, each request holds one for ~50ms) | Requests queue waiting for a connection, p99 latency climbs |
| 1,000 rps | Sending the email *inside* the request adds 300ms to every checkout | Checkout feels slow even though the DB is fine |
| 10,000 rps | Single Postgres primary maxes out on writes | DB CPU / IO at 100%, lock waits |
| 10,000 rps | Payment provider rate-limits you | 429 errors from the provider |

Quick math for the pool: 20 connections, each held ~50ms, means about `20 / 0.05 = 400` requests/sec max. So at 1,000 rps you are already over the limit. **That's a real, defensible bottleneck you found with arithmetic, not a Google badge.**

You're not pretending your app is Netflix. You're learning how load actually moves through a real system.

---

## Step 2 - Follow One Request End to End

Trace a single checkout from the moment the user taps "Pay":

`Client -> API -> application -> database -> queue -> worker -> external dependency`

At each hop, ask four questions:

1. **Where does it wait?** (Network calls, locks, disk.) Waiting doesn't show up as high CPU - see [[13-hidden-latency-bottleneck]].
2. **Which pool is bounded?** (DB connections, thread pool, worker count, provider rate limit.) Bounded pools are where queues form.
3. **Which operation gets slower as data grows?** ("Check if this coupon was already used" is instant with 10,000 orders and 45 seconds with 500 million if it's not indexed - see [[50-slow-query-500m-rows]].)
4. **What happens when a downstream service is down?** If the email provider hangs for 20 seconds, does checkout hang for 20 seconds too? (See [[14-cascading-failure-recovery]].)

**The big lesson: scale is usually waiting, contention, and skew - not a giant number printed on a slide.**

- **Waiting**: a request sitting idle on a slow dependency.
- **Contention**: many requests fighting for the same thing (one row, one lock, one small pool).
- **Skew**: one hot key, one huge customer, or one popular restaurant taking a disproportionate share of traffic.

---

## Step 3 - Learn the Common Scaling Moves (and What Each One Costs)

There's a small toolkit that covers most interview problems. The senior part is knowing the **cost** of each move, not just its name.

| Problem | Common moves | The new problem it creates |
|---|---|---|
| Reads are slow | Index, cache, read replicas, precompute | Stale data, cache invalidation, replication lag ([[28-scaling-database-reads]]) |
| Writes are hot | Partition, batch, reduce coordination | Cross-partition queries get hard ([[21-database-partitioning]]) |
| Slow work blocks requests | Move it to a queue | Retries, duplicates, need idempotency ([[19-idempotent-consumer-duplicate-events]]) |
| One tenant dominates | Isolate them (own pool, own shard, own rate limit) | More infrastructure to run |
| Users are far away | Serve reads closer (CDN, regional replicas) | Consistency across regions ([[10-clock-skew-last-write-wins]]) |

Apply it to our checkout:

- Email inside the request? **Move it to a queue.** Checkout drops from 350ms to 50ms. *New problem*: if the worker retries, the user might get two emails, so the email job needs an idempotency key.
- Connection pool maxed? **Tune the pool and cut query time with an index** first. *Cost*: almost nothing. That's why it comes first ([[38-first-thing-to-scale]]).
- One restaurant chain is 40% of all orders? **Isolate it** with its own rate limit so a sale at that chain doesn't slow down everyone else.

**Every move creates another problem. Saying that out loud in the interview is exactly what makes you sound senior.**

---

## Step 4 - Use Numbers to Guide How Deep You Go

Before drawing boxes, estimate a few things:

- **Peak QPS** (not average - dinner time, sale day)
- **Read/write ratio**
- **Object size**
- **Storage growth** per day/year
- **Acceptable latency**

Our checkout, quick version:

- 1 million orders/day, peak is roughly 10x average: `1,000,000 / 86,400 = ~12/sec average`, so **~120/sec peak**.
- Each order row ~1 KB: `1M x 1 KB = ~1 GB/day`, **~365 GB/year**.

What do the numbers tell us? 120 writes/sec is **easy** for a single Postgres. So we don't need sharding. But 365 GB/year means that in 2-3 years, old-order queries will slow down, so we should plan **time-based partitioning or archiving** ([[21-database-partitioning]]).

You don't need perfect math. **You need just enough math to explain why the simple design stops being enough - and when.** That also protects you from the opposite mistake: over-engineering a system that 120 writes/sec never needed ([[15-simple-vs-scalable-architecture]], [[42-resilience-vs-overengineering]]).

---

## Putting It Together in the Interview

A structure that works even if you've never touched huge scale:

1. **Clarify** requirements and the numbers ([[30-workload-before-conclusion]]).
2. **Draw the simple design** that meets today's needs.
3. **Grow the load** in steps (10x, 100x) and name what breaks first at each step.
4. **Apply one scaling move** per bottleneck and state its cost.
5. **Cover failure**: what happens when a dependency is slow or down.

Example sentence you can reuse:

> "At 100 rps this design is fine. At around 400 rps the connection pool becomes the bottleneck, which I can see from connection wait time. First I'd add the missing index and move email to a queue, which is cheap. If we reach 10,000 rps, write throughput on one primary becomes the limit, so I'd look at partitioning by restaurant, and that makes cross-restaurant reports harder, so I'd precompute those."

That answer shows reasoning, ordering, and trade-offs. None of it required Google.

---

## 🧠 Remember

> Senior system design isn't about having seen massive scale - it's about taking any system, growing the load in your head, finding what breaks first, and explaining the fix *and* its cost.

## Practice Assignment

Pick one feature you actually built this year and write down:

1. Its current peak requests/sec.
2. The first component that saturates at 10x, and how you'd detect it.
3. One scaling move for that bottleneck, and the new problem that move creates.
</script>
<script type="text/markdown" class="lesson-data" data-id="54" data-title="Notify 5,000 Users 10x Faster" data-category="Core Concepts" data-order="54">
# 5,000 Notifications x 200ms = 16 Minutes. One Change Makes It 10x Faster.

> **Same-question flag**: this is [[13-hidden-latency-bottleneck]] (sequential waits add up) and [[01-concurrency-vs-parallelism]] (I/O-bound work needs concurrency, not more CPU) wearing a notification costume. What's new here is doing it **safely**: bounded concurrency, not "fire all 5,000 at once."

## 1. The Math

The loop sends one notification, waits 200ms for the provider to answer, then sends the next:

`5,000 x 0.2s = 1,000s ~ 16.7 minutes`

During each 200ms, your server is doing almost nothing - it's **waiting** on the network. The CPU is idle.

## 2. The Fix: Send Them Concurrently (With a Limit)

Keep **10 sends in flight at the same time** instead of 1:

`1,000s / 10 = 100s` -> **10x faster.** Same users, same notifications, same 200ms each.

With 50 in flight it's ~20 seconds. The limit is set by what the provider allows (rate limits) and what your connection pool can handle, not by your CPU.

## 3. Why Not Just `Promise.all` on All 5,000?

Firing 5,000 requests at once will hit the provider's rate limit, exhaust sockets/connection pools, and turn into a burst of failures and retries - the thundering herd from [[14-cascading-failure-recovery]]. **Bounded** concurrency gives you the speedup without the stampede.

## 4. Code Example

```javascript
// BEFORE: sequential, ~1,000 seconds
for (const user of users) {
  await sendNotification(user); // 200ms each, one at a time
}

// AFTER: bounded concurrency, ~100 seconds with limit 10
const pLimit = require('p-limit');
const limit = pLimit(10); // at most 10 in flight
await Promise.all(users.map(u => limit(() => sendNotification(u))));
```

## 5. Other Moves That Stack On Top

- **Batch API**: many providers (FCM, SES, Twilio) accept many recipients per call - 5,000 users might become 5 calls.
- **Queue + workers**: put 5,000 jobs on a queue and let several workers drain it, with retries and idempotency - the design from [[17-notification-system-design]]. The API returns immediately instead of blocking for minutes.

## 6. 🧠 Remember

> When time is spent waiting, not computing, the fix is overlap: run the I/O concurrently with a sensible limit, and the total drops from the sum of all waits to roughly the sum divided by the concurrency.

## 7. Quick Self-Test

1. Why doesn't a faster CPU help this job at all?
2. Why is a concurrency limit of 10-50 safer than sending all 5,000 at once?
3. How would a provider's batch API change the math?
</script>
<script type="text/markdown" class="lesson-data" data-id="55" data-title="Engineering Is Getting Harder, Building Is Getting Easier" data-category="Blog" data-order="55">
# Blog: Being a Software Engineer Is Getting Harder. Building Software Is Getting Easier.

*An unpopular opinion, and why the gap between those two sentences is going to change who gets into tech.*

---

## Two Things Are True at Once

**Building software is getting easier.** Ten years ago, a login page, a database, hosting, payments, and email took weeks of setup. Today:

- AI writes the first version of most code in seconds.
- Managed services handle auth (Clerk, Auth0), databases (Supabase, RDS), payments (Stripe), and hosting (Vercel, AWS).
- A single person can ship a working product over a weekend.

**Being a software engineer is getting harder.** The job didn't disappear. It moved:

- The easy part (typing code) is now cheap, so the hard parts are what you're paid for: judgment, debugging, design, and owning production.
- Systems are more distributed: more services, more queues, more third-party APIs, more ways to fail.
- The bar for juniors went up. The tasks juniors used to learn on (simple CRUD, boilerplate, small bug fixes) are exactly what AI now does.

## A Simple Example

Ask an AI: "Build me an API that charges a customer."

You'll get working code in 10 seconds. It will probably:

- charge twice if the user double-clicks ([[32-payment-idempotency-double-click]])
- break when two requests read a stale balance ([[60-cache-says-100-db-says-20]])
- hang forever when the payment provider is slow ([[14-cascading-failure-recovery]])

**Building** the endpoint took seconds. **Engineering** it - making it correct under retries, concurrency, and failure - is the part that still needs a person who understands what's happening underneath.

## So What Changes About Who Gets Into Tech?

**1. "I can build an app" is no longer a differentiator.** Almost anyone can. Bootcamp-style "I built a todo app" portfolios stop standing out.

**2. Depth becomes the entry ticket.** People who understand *why* things break - databases, networking, concurrency, failure modes - become more valuable, because they can review and fix what AI produces.

**3. Builders who aren't engineers will multiply.** Designers, founders, domain experts, and analysts will ship real software without calling themselves engineers. That's good. It also means "writing code" is no longer a gate that only engineers pass through.

**4. The junior ladder needs a new first rung.** If AI does the beginner work, beginners must learn from the start by reading, debugging, and questioning code, not only by writing it.

## What To Do About It (If You're Early in Your Career)

- **Use AI to build fast, then ask "how does this break?"** about everything it produces.
- **Go deep on fundamentals** that don't go out of date: how a request travels, how databases execute queries, what happens under concurrency and failure. That's what this whole lesson library is about.
- **Own something in production**, even a small side project with real users. Production teaches what tutorials can't.
- **Practice explaining trade-offs.** "Why this and not that?" is the question AI can't answer for your specific system ([[29-why-hire-you-over-ai]]).

## 🧠 Remember

> Building software is getting cheaper because the code is getting cheaper. Engineering is getting harder because what's left - judgment, correctness, and owning failure - is the part that was always hard.

## Reflect

1. What's one thing you built recently that AI could have written - and one thing about it that AI would likely have gotten wrong?
2. Which fundamental topic would make you better at reviewing AI-generated code?
</script>
<script type="text/markdown" class="lesson-data" data-id="56" data-title="Why Not SHA-256 for Passwords?" data-category="Security" data-order="56">
# Why Not Store SHA-256(password)? What Should You Use Instead?

> **Connects to**: [[27-cia-triad]] (this protects Confidentiality when - not if - the database leaks).

## 1. Story

Your users table leaks. It happens to big companies every year. The attacker now has every row, including the `password_hash` column. The only question that matters now: **how long until they turn those hashes back into real passwords?**

## 2. The Surprise: SHA-256 Is Too *Fast*

SHA-256 is a great hash for **file integrity and signatures**, where speed is a feature. For passwords, speed is exactly the problem.

- A modern GPU can compute **billions** of SHA-256 hashes per second.
- Passwords like `MyPassword@123` are not random. Attackers try leaked-password lists and common patterns first.
- So the attacker hashes billions of guesses per second and compares against your leaked hashes. Weak and medium passwords fall in minutes or hours.

**Other problems with plain SHA-256:**

- **No salt** means two users with the same password have the **same hash**. One crack reveals both, and attackers can use **precomputed tables** (rainbow tables) of hashes for common passwords.
- **Term: Salt** - a random value, unique per user, mixed into the password before hashing. Same password, different salt, completely different hash. It kills precomputed tables and forces attackers to crack each user separately.

Even with a salt, SHA-256 is still billions-per-second fast. Salt fixes the "crack everyone at once" problem, but not the "guess very fast" problem.

## 3. The Fix: A Slow, Salted Password-Hashing Function

Use an algorithm **designed to be slow and memory-hungry on purpose**:

| Algorithm | Notes |
|---|---|
| **Argon2id** | Modern first choice (winner of the Password Hashing Competition). Tunable CPU + memory cost, which hurts GPU attacks badly. |
| **bcrypt** | Battle-tested, widely available. Tunable cost factor. Only uses the first 72 bytes of the password. |
| **scrypt** | Memory-hard, good choice too. |
| **PBKDF2** | Acceptable (and required in some compliance settings) with a high iteration count, but weaker against GPUs. |

These have **salts built in** and a **cost factor** you tune so one hash takes around 100-500ms on your server. For one login that's unnoticeable. For an attacker trying billions of guesses, it turns minutes into centuries.

## 4. Mental Model

> A password hash should be like a heavy vault door: one legitimate opening a day is fine, but trying a billion keys becomes impossibly slow. SHA-256 is a revolving door - great for traffic, terrible for security.

## 5. Code Example

```javascript
const argon2 = require('argon2');

// Signup: hash with a built-in random salt and tuned cost
const hash = await argon2.hash(password, { type: argon2.argon2id });
// Stored value looks like: $argon2id$v=19$m=65536,t=3,p=4$<salt>$<hash>
// Algorithm, cost settings, and salt are all stored inside the string.

// Login: verify - never compare hashes yourself with ===
const ok = await argon2.verify(storedHash, loginAttemptPassword);
```

## 6. Production Reality

- **Raise the cost factor over time** as hardware gets faster; re-hash a user's password with new settings when they next log in successfully.
- Optionally add a **pepper**: a server-side secret (kept outside the database, e.g. in a secrets manager) mixed in, so a database-only leak isn't enough.
- **Rate-limit login attempts** - slow hashing also makes login a CPU target, so protect the endpoint.
- Never write your own crypto. Use the library's `hash` and `verify`.

## 7. Common Mistakes

- "SHA-256 is secure, so it's fine for passwords." Secure for *integrity*, wrong tool for *passwords*.
- Hashing many times with MD5/SHA in a homemade loop instead of using a proper algorithm.
- Encrypting passwords (reversible) instead of hashing them (one-way). If you can decrypt them, so can an attacker who steals the key.

## 8. 🧠 Remember

> Passwords need a slow, salted, purpose-built hash - Argon2id or bcrypt - because the threat is billions of guesses per second after a leak, and SHA-256's speed is exactly what the attacker wants.

## 9. Quick Self-Test

1. Why is speed good for file hashing but bad for password hashing?
2. What does a salt protect against, and what does it *not* protect against?
3. Why is encrypting passwords worse than hashing them?
</script>
<script type="text/markdown" class="lesson-data" data-id="57" data-title="Two Indexes, Still Slow (Composite Index)" data-category="Databases" data-order="57">
# Index on user_id Exists. Index on created_at Added. Still 30 Seconds. What's Missing?

> **Similar-question flag**: [[50-slow-query-500m-rows]] already covers the method (read `EXPLAIN ANALYZE`, then add the index that matches filter + sort). This lesson zooms in on one specific trap: **two separate single-column indexes are not the same as one composite index.**

## 1. The Situation

```sql
SELECT * FROM orders
WHERE user_id = 42
ORDER BY created_at DESC
LIMIT 20;
```

50 million rows. There's an index on `user_id` and another on `created_at`. Still 30 seconds.

## 2. What's Missing: A Composite Index `(user_id, created_at)`

A database usually uses **one** index per table access to do the heavy lifting. With two separate indexes it has to pick:

- **Use `user_id` index**: finds all of user 42's rows fast - but if that user has 2 million orders, it must fetch all 2 million, then **sort them** by `created_at` to get the top 20.
- **Use `created_at` index**: walks rows newest-first - but it has to check `user_id = 42` on each one, possibly reading millions of other users' rows before finding 20 matches.

Either way, it reads a huge number of rows.

A **composite index** on `(user_id, created_at)` stores the data already grouped by user **and** sorted by time inside each user. The database jumps straight to user 42 and reads the first 20 entries in order. No sort, no scanning other users.

```sql
CREATE INDEX CONCURRENTLY idx_orders_user_created
  ON orders (user_id, created_at DESC);
```

## 3. Mental Model

> A phone book sorted by last name, then first name, lets you find "Sharma, Priya" instantly. Two separate books - one sorted by last name, one by first name - don't. Column **order** in a composite index matters the same way: put the equality filter first (`user_id`), then the sort/range column (`created_at`).

## 4. Other Things to Check in the Plan

If the composite index still doesn't fix it, `EXPLAIN ANALYZE` usually shows one of these:

- **`SELECT *`** forces a lookup into the table for every row; selecting only needed columns (or a covering index with `INCLUDE`) avoids it.
- **Type mismatch**: `user_id` is a string column but the query passes a number (or vice versa), so the index can't be used.
- **Function on the column** (`WHERE DATE(created_at) = ...`) disables the index.
- **Stale statistics**: run `ANALYZE` so the planner picks the right index.
- **Skew**: one "whale" user with millions of rows behaves very differently from a typical user.

## 5. 🧠 Remember

> Two single-column indexes don't combine into one fast path - a query that filters on one column and sorts by another needs a composite index in that order: equality column first, then the sort/range column.

## 6. Quick Self-Test

1. Why can't the database efficiently use both single-column indexes together for this query?
2. Why does `(user_id, created_at)` work but `(created_at, user_id)` is much worse here?
3. What does a covering index add on top of a composite one?
</script>
<script type="text/markdown" class="lesson-data" data-id="58" data-title="Less Traffic, More CPU" data-category="Production Debugging &amp; Incidents" data-order="58">
# Traffic Dropped by Half, But CPU Went From 45% to 91% - How?

## 1. Story

Yesterday: 50,000 requests/min, CPU at 45%. Today: 25,000 requests/min, CPU at 91%. No deployment. Everyone's first instinct - "it must be more traffic" - is the one thing the numbers rule out.

## 2. The Key Insight

**Requests per minute is not load.** Load is:

`load = number of requests x cost per request`

If traffic halved but CPU doubled, then **each request got about 4x more expensive**. The question becomes: *what made each request cost more?*

## 3. The Usual Suspects

**1. Fewer servers.** The autoscaler saw lower traffic and **scaled in** from, say, 8 instances to 2. Total traffic halved, but traffic *per instance* doubled. Per-server CPU goes up even though the system as a whole is quieter. Check instance count first - it's the fastest thing to rule out. (Same "autoscaler reacts to symptoms" theme as [[39-autoscaling-amplifies-outage]].)

**2. Cache hit rate collapsed.** A Redis restart, an eviction storm, a changed cache key format, or a TTL change means requests that used to be served from cache now hit the database and do full work. Fewer requests, far more work each.

**3. The traffic mix changed.** Yesterday's traffic was mostly cheap reads (homepage, product page). Today's is mostly expensive calls: search, reports, exports - or a scraper/bot hammering one heavy endpoint. Same count, very different cost.

**4. Retries and errors.** A downstream dependency started failing; clients and services now retry, so each user action produces several internal requests - and failed requests often cost more (timeouts, stack traces, logging).

**5. Data grew past a tipping point.** A table crossed a size where the query plan changed (from index scan to full scan), or an unindexed query got 10x slower as rows piled up ([[50-slow-query-500m-rows]]).

**6. Something else is using the CPU.** A cron job, a backup, a reindex, log shipping, or garbage-collection pressure from a slow memory leak ([[22-nodejs-memory-leak-debugging]]).

**7. Lock contention and spinning.** Threads waiting on hot locks or retrying optimistic updates can burn CPU without doing useful work.

## 4. How to Investigate

1. **Instance count** - did the fleet scale in?
2. **CPU per request** and **latency by endpoint** - which endpoint got expensive?
3. **Cache hit rate** over the last 48 hours.
4. **Traffic mix** by endpoint and by client/user agent - look for bots or one heavy customer.
5. **Downstream error and retry rates.**
6. **Profile the process** (CPU flame graph) to see where time is actually going.
7. **What changed** even without a deploy: config, feature flags, cron schedules, data volume ([[20-sudden-latency-spike-checklist]]).

## 5. Mental Model

> Don't watch the number of cars - watch how heavy each truck is. Half the trucks, each four times heavier, will still break the bridge.

## 6. Common Mistakes

- Alerting and capacity planning purely on request count.
- Assuming "no deploy" means "nothing changed" - caches, data size, traffic mix, and autoscaling all change without a deploy.

## 7. 🧠 Remember

> Less traffic can create more load when each request becomes more expensive - check fleet size, cache hit rate, traffic mix, retries, and data growth before blaming the code.

## 8. Quick Self-Test

1. How can scaling in make each server busier even though total traffic dropped?
2. Why can a drop in cache hit rate increase CPU even with fewer requests?
3. Which one metric would you add to dashboards so this is obvious next time?
</script>
<script type="text/markdown" class="lesson-data" data-id="59" data-title="UUID vs Auto-Increment IDs" data-category="Databases" data-order="59">
# Why Are UUIDs Preferred Over Auto-Increment IDs in Some Systems?

## 1. Story

Your app's order URLs look like `/orders/1042`. A curious user changes it to `/orders/1041` and sees someone else's order (an authorization bug - but the guessable ID made it trivial to find). A competitor notices your order IDs jumped by 3,000 this month and now knows your sales volume. Later, you split the database into shards, and two shards both create order `5000`.

## 2. What Each One Is

**Auto-increment ID** - the database hands out `1, 2, 3, ...`. Small, fast, naturally ordered.

**Term: UUID** - a 128-bit identifier like `3f2b8c1e-9a4d-4e7f-b6a1-0c9d2e5f7a13`, generated so that collisions are practically impossible, **without asking anyone** for the next number.

## 3. Why UUIDs Win in Some Systems

- **Generated anywhere.** App servers, mobile clients (offline), or different shards can create IDs independently, with no central counter. That matters for distributed systems and sharding ([[21-database-partitioning]]).
- **Not guessable.** You can't walk `/orders/1`, `/orders/2`, ... (still enforce authorization - a UUID is not a security control by itself - but it removes the easy enumeration).
- **Doesn't leak business data.** Sequential IDs reveal how many users/orders you have and how fast you're growing.
- **Easy merging.** Combining data from multiple databases, regions, or tenants doesn't cause ID clashes.
- **ID known before insert.** The client can create the ID up front, which helps with idempotency and offline sync ([[32-payment-idempotency-double-click]]).

## 4. Why Auto-Increment Is Still Often Better

- **Smaller**: 8 bytes vs 16. Every index and foreign key referencing it is smaller too.
- **Faster inserts**: new rows always go at the end of the B-tree index.
- **Random UUIDs (v4) hurt write performance at scale**: inserts land at random places in the index, causing page splits and poor cache use.
- **Human-friendly**: "order 1042" is easy to read over the phone.

## 5. The Modern Middle Ground

- **UUIDv7 / ULID**: time-ordered UUIDs. Globally unique and generated anywhere, **but** roughly sequential, so inserts stay index-friendly. This is often the best default today when you want UUIDs.
- **Both**: an internal `BIGINT` primary key for joins and speed, plus a public UUID column used in URLs and APIs.

## 6. Mental Model

> Auto-increment is a ticket machine at one counter: tidy, small, ordered - but everyone must visit that one machine. UUIDs let everyone print their own ticket anywhere, at the cost of bigger, messier tickets. UUIDv7 prints tickets with a timestamp, so they still line up nicely.

## 7. Trade-offs

| | Auto-increment | UUIDv4 (random) | UUIDv7 / ULID |
|---|---|---|---|
| Generated without DB | No | Yes | Yes |
| Guessable | Yes | No | Hard (time part visible) |
| Size | 8 bytes | 16 bytes | 16 bytes |
| Index insert performance | Best | Poor at scale | Good |

## 8. 🧠 Remember

> Use UUIDs when IDs must be created in many places, merged across systems, or kept unguessable; prefer time-ordered UUIDv7/ULID over random UUIDv4 to keep inserts fast; and remember an ID is never a replacement for authorization checks.

## 9. Quick Self-Test

1. Why do random UUIDs slow down inserts on large tables?
2. What problem does a UUID solve when you shard a database?
3. Why is "unguessable IDs" not enough to protect other users' data?
</script>
<script type="text/markdown" class="lesson-data" data-id="60" data-title="Cache Says $100, DB Says $20 (Double Spend)" data-category="Distributed Systems" data-order="60">
# Cache Says $100, Database Says $20, Two $80 Payments Both Succeed

> **Similar-question flag**: the double payment is the same check-then-act race from [[26-duplicate-email-race-condition]] and [[32-payment-idempotency-double-click]]. What's new here is the **cache**: a stale copy of the balance was used to make a money decision.

## 1. Story

A user has $20 in the database. The cache still says $100 (it wasn't invalidated after an earlier purchase). Two $80 payment requests arrive at two different servers at the same moment. Both read $100 from the cache, both think "enough money," both succeed. The user spent $160 from a $20 balance.

## 2. Two Separate Bugs

**Bug 1 - The cache was used as the source of truth for money.** A cache is a *copy*, and copies go stale: a missed invalidation, a delayed update, a race between "update DB" and "update cache." That's fine for a product description. It's not fine for deciding whether money can move.

**Bug 2 - Check-then-act across two servers.** Even with the correct balance, "read balance -> check -> write new balance" as separate steps lets two requests both pass the check before either writes. This is the TOCTOU race from [[26-duplicate-email-race-condition]].

## 3. The Fix

**1. Never authorize money from the cache.** Read the balance from the database (the primary, not a lagging replica - see [[28-scaling-database-reads]]). Use the cache for displaying the balance, not for deciding.

**2. Make the check and the write one atomic operation.**

```sql
UPDATE accounts
SET balance = balance - 80
WHERE id = 7 AND balance >= 80;
-- Returns 1 row updated -> payment allowed
-- Returns 0 rows updated -> insufficient funds
```

The database applies the two updates one after the other on that row. With the real balance of $20, both are rejected (20 < 80). Even if the balance really were $100, the first would succeed (leaving $20) and the second would then find $20 and be rejected. There's no window where both see "enough."

Alternatives: `SELECT ... FOR UPDATE` inside a transaction (row lock), or optimistic locking with a `version` column that must match on update.

**3. Idempotency key per payment** so a retried request doesn't charge twice ([[32-payment-idempotency-double-click]]).

**4. Better ledger design for real money**: record each movement as an immutable entry and derive the balance, as in [[30-workload-before-conclusion]].

**5. Fix the cache invalidation too** - after a successful write, delete the cache key (don't just update it) so the next read reloads from the DB. But treat that as a UX fix, not the safety guarantee.

## 4. Mental Model

> The cache is a photo of the balance; the database is the bank vault. You can show customers the photo, but you only hand out money after checking the vault - and you check and take the money in one movement, so nobody can slip in between.

## 5. Flow

```mermaid
sequenceDiagram
  participant S1 as Server 1
  participant S2 as Server 2
  participant DB as Database (balance $20)
  S1->>DB: UPDATE ... SET balance=balance-80 WHERE balance>=80
  S2->>DB: UPDATE ... SET balance=balance-80 WHERE balance>=80
  DB-->>S1: 0 rows (insufficient)
  DB-->>S2: 0 rows (insufficient)
  Note over DB: Both rejected. Row-level serialization,<br/>no stale cache involved.
```

## 6. 🧠 Remember

> Never make a money decision from a cache, and never split "check balance" and "deduct balance" into separate steps - do both in one atomic conditional update on the source of truth.

## 7. Quick Self-Test

1. Why is using a cached balance acceptable for display but not for authorization?
2. How does `WHERE balance >= 80` inside the `UPDATE` remove the race condition?
3. Even with the correct DB balance, why do separate SELECT-then-UPDATE steps still allow a double spend?
</script>
<script type="text/markdown" class="lesson-data" data-id="61" data-title="1,000 Requests 10x Faster" data-category="Core Concepts" data-order="61">
# 1,000 Independent Requests x 500ms = 8.3 Minutes. One Change Makes It 10x Faster.

> **Same-question flag**: this is exactly [[54-notify-5000-users-10x-faster]] with different numbers, and it rests on [[13-hidden-latency-bottleneck]] and [[01-concurrency-vs-parallelism]]. Short recap only.

## The Answer

The requests are **independent** and each one spends its 500ms **waiting** on I/O, not using CPU. Run them **concurrently with a limit** instead of one after another:

- Sequential: `1,000 x 0.5s = 500s` (~8.3 min)
- 10 in flight at once: `500s / 10 = 50s` -> **10x faster**
- 50 in flight: ~10s

```javascript
const pLimit = require('p-limit');
const limit = pLimit(10);
const results = await Promise.all(urls.map(u => limit(() => fetch(u))));
```

## The Two Things Interviewers Listen For

1. **"Bounded"** - not `Promise.all` on all 1,000 at once, which can hit rate limits, exhaust connections, and cause a retry storm ([[14-cascading-failure-recovery]]).
2. **"Independent"** - if request B needs A's result, you can't overlap them; concurrency only helps work that doesn't depend on each other.

Bonus: check for a **batch endpoint** (1 call for 100 items) - often a bigger win than concurrency.

## 🧠 Remember

> Independent, I/O-bound work should overlap: total time goes from the sum of all waits to roughly the sum divided by your concurrency limit.
</script>
<script type="text/markdown" class="lesson-data" data-id="62" data-title="Top 10 Tips for Better Backend Engineering" data-category="Blog" data-order="62">
# Blog: Top 10 Tips for Becoming Better at Backend Engineering

*Backend skill is not knowing more tools. It's building systems that stay correct, fast, and debuggable under real traffic.*

Each tip below has a simple explanation, a small real-world example, and links to lessons in this library that go deeper.

---

## 1. Learn How a Request Actually Travels

`Client -> load balancer -> app -> database -> response`

If you don't know where the time is spent, you can't make the system faster.

**Example:** A page takes 3 seconds. Is it DNS, the network, the app, the database, or three API calls running one after another? Until you trace it, every fix is a guess.

Go deeper: [[13-hidden-latency-bottleneck]], [[51-fast-api-slow-page]]

## 2. Get Dangerous With Databases

Indexes, transactions, query plans, connection pools, and locks matter more than learning another framework. **Most backend problems are data problems.**

**Example:** A 45-second query becomes 5ms with one correct composite index. No new framework does that.

Go deeper: [[50-slow-query-500m-rows]], [[57-two-indexes-still-slow-composite]], [[34-where-vs-having]]

## 3. Design for Failure From Day One

Timeouts, retries, idempotency, and fallbacks are not "later work." If a dependency dies and your service hangs, the design is incomplete.

**Example:** The email provider hangs for 30 seconds. Without a timeout, every checkout hangs for 30 seconds too, and your servers run out of threads.

Go deeper: [[14-cascading-failure-recovery]], [[19-idempotent-consumer-duplicate-events]], [[32-payment-idempotency-double-click]]

## 4. Make Work Async When the User Doesn't Need to Wait

Emails, reports, image processing, and third-party calls belong in queues. The request path should stay short.

**Example:** "Place order" returns in 80ms. The confirmation email, invoice PDF, and analytics event happen in background workers.

Go deeper: [[17-notification-system-design]], [[48-huge-json-payloads]]

## 5. Master Observability

Logs, metrics, traces, and request IDs are how you debug production. If you can't follow one request across services, you are guessing.

**Example:** "Random 500s, logs look clean" is solved in minutes when every log line has a request ID you can search across the load balancer, app, and database.

Go deeper: [[02-debugging-random-500-errors]], [[20-sudden-latency-spike-checklist]]

## 6. Write APIs Like a Contract

Clear status codes, pagination, validation, versioning, and idempotency keys. A messy API becomes a messy system.

**Example:** Returning `200 OK` with `{"error": "not found"}` forces every client to parse your messages. A proper `404` lets them branch correctly.

Go deeper: [[11-what-is-an-api]], [[18-http-status-codes-400-404-409-422]], [[25-api-styles-comparison]]

## 7. Understand Trade-offs, Not Just Tools

Redis, Kafka, and Postgres are easy to name. The skill is knowing **when not to use them**.

**Example:** Adding Kafka to a system doing 50 events per second adds a cluster to operate, and a Postgres table as a job queue would have been fine.

Go deeper: [[30-workload-before-conclusion]], [[42-resilience-vs-overengineering]]

## 8. Read Production, Not Only Tutorials

Watch slow queries, error rates, memory, and queue lag. Real systems teach faster than courses.

**Example:** A memory graph slowly climbing for a week teaches you more about leaks than any article.

Go deeper: [[22-nodejs-memory-leak-debugging]], [[58-less-traffic-more-cpu]]

## 9. Keep the Design as Simple as the Scale Allows

Don't shard, split into microservices, or add a cache because it sounds senior. Add complexity only when a simpler design is **actually** failing.

**Example:** 120 writes/second is easy for one Postgres database. Sharding it would add months of work and new failure modes for no benefit.

Go deeper: [[15-simple-vs-scalable-architecture]], [[24-kubernetes-pets-vs-cattle]], [[38-first-thing-to-scale]]

## 10. Own the Full Path

Good backend engineers don't stop at "code merged." They care about deploy, latency, cost, on-call, and what happens when it breaks at 2 AM.

**Example:** Your feature works in staging but doubles the cloud bill in production because it calls an expensive API on every page view. Owning the full path means you catch that.

Go deeper: [[46-build-vs-rent-infrastructure]], [[04-handling-traffic-spike-15k-rps]]

---

## 🧠 Remember

> Backend skill is not knowing more tools. It's making systems that stay correct, fast, and debuggable under real traffic.

## Self-Check

Score yourself 1-5 on each tip. Pick your two lowest and spend the next month on those - reading the linked lessons, then finding one real example in the system you work on.
</script>
<script type="text/markdown" class="lesson-data" data-id="63" data-title="Why Is a Query Faster the Second Time?" data-category="Databases" data-order="63">
# Why Is the Same Query 10ms the First Time and 1ms the Second?

## 1. Story

You run a query: 10ms. You run the exact same query again: 1ms. Same data, same database, nothing changed. Where did the other 9ms go?

## 2. The Short Answer

The first run did work that the second run **didn't have to repeat**: mostly **reading data from disk into memory**, plus some one-time setup. The second run found everything already warm.

## 3. Where the 9ms Went

**1. Disk vs memory (the big one).**
Databases store data in fixed-size **pages** (e.g. 8 KB in Postgres, 16 KB in MySQL InnoDB). To read a row, the database needs its page in memory.

**Term: Buffer pool / shared buffers** - the database's own in-memory cache of pages.

- First run: pages aren't in the buffer pool -> read from disk (or the OS page cache). That's the slow part.
- Second run: pages are already in memory -> RAM access is orders of magnitude faster than disk.

The operating system also keeps its own **page cache** of recently read file blocks, a second layer that makes repeated reads faster.

**2. Query planning.**
The database parses the SQL and builds a query plan the first time. With **prepared statements**, many databases can reuse a cached plan on the next run, skipping that work.

**3. Index pages warmed up too.**
The index's upper levels (root and branch pages) get loaded on the first run and stay hot, so the next lookup walks the tree in memory.

**4. Connection and app-side warm-up.**
If you're measuring from the application: the first request may pay for opening a DB connection, TLS handshake, JIT compilation, or ORM metadata loading. Later requests reuse the pooled connection.

**5. Query result cache (rare today).**
Some systems cache full results, but MySQL removed its query cache in 8.0 and Postgres never had one. Usually it's the **data pages**, not the result, that are cached.

## 4. Mental Model

> The first time, the librarian walks to the basement archive (disk) to fetch the book. The second time, it's already sitting on the front desk (memory). Same book, no walk.

## 5. Why This Matters in Production

- **Benchmarks lie if you only measure warm runs.** Test cold and warm, and look at p99, not just the fast repeat.
- **After a restart or failover, the cache is cold.** Queries are slower until the buffer pool warms up - a real cause of latency spikes right after a deploy or DB failover.
- **Working set vs RAM.** If your frequently used data (the working set) fits in memory, the database is fast. When it outgrows RAM, pages keep getting evicted and reloaded from disk, and performance falls off a cliff.
- **Buffer cache hit ratio** is a key database metric - a drop usually means the working set outgrew memory or a query started scanning far more data.

## 6. 🧠 Remember

> The second run is faster because the data pages were already in memory (the buffer pool and OS cache), and planning and connections were already done - the first run paid for reading from disk.

## 7. Quick Self-Test

1. What is the buffer pool, and why does it make repeated queries faster?
2. Why can a database be slow for a few minutes after a failover even with no code change?
3. What happens to performance when the working set no longer fits in memory?
</script>
<script type="text/markdown" class="lesson-data" data-id="64" data-title="500 MB Uploads Exploding Memory" data-category="System Design at Scale" data-order="64">
# 100 Users Upload 500 MB Videos at Once and Memory Explodes

> **Same-question flag**: this is [[49-large-file-upload-with-status]] (pre-signed URLs, direct-to-storage multipart upload) plus the "don't hold big payloads in memory" rule from [[48-huge-json-payloads]]. Short recap with the math.

## Why Memory Explodes

The API buffers the **whole file** before processing: `100 users x 500 MB = 50 GB` of memory. No normal server has that, so it swaps, slows down, and gets OOM-killed - taking every other request down with it.

## The Fix, in Order of Preference

**1. Don't let the bytes touch your API at all.** Return a **pre-signed URL**; the client uploads directly to object storage (S3/GCS) using **multipart upload** (e.g. 10 MB chunks, retry per chunk). Your API only stores metadata and status. Memory used by your API: close to zero. Full design: [[49-large-file-upload-with-status]].

**2. If the file must pass through your server, stream it.** Pipe the incoming request straight to storage chunk by chunk, never collecting it in memory. Memory per upload becomes a small fixed buffer (a few MB), not 500 MB.

```javascript
// Streaming pass-through: memory stays at a small buffer per upload
const { Upload } = require('@aws-sdk/lib-storage');
app.post('/videos', async (req, res) => {
  await new Upload({
    client: s3,
    params: { Bucket: 'videos', Key: crypto.randomUUID(), Body: req }, // req is a stream
    partSize: 10 * 1024 * 1024,
    queueSize: 2,
  }).done();
  res.status(202).json({ status: 'processing' });
});
```

**3. Process asynchronously.** Transcoding and thumbnails run in background workers from a queue, never inside the upload request.

**4. Add guardrails.** Max file size at the load balancer, per-user concurrent upload limits, and short-lived upload URLs.

## 🧠 Remember

> Never buffer large uploads in API memory: send clients straight to object storage with pre-signed multipart uploads, or at minimum stream the bytes through, and process the video in background workers.
</script>
<script type="text/markdown" class="lesson-data" data-id="65" data-title="Design PagerDuty: One Incident, One Page" data-category="Distributed Systems" data-order="65">
# Design PagerDuty: One Incident, Exactly One Page, Even When Things Crash

> **Connects to**: [[19-idempotent-consumer-duplicate-events]] (at-least-once + idempotency), [[26-duplicate-email-race-condition]] (check-then-act races), [[44-distributed-locking-with-redis]] (why a Redis lock isn't enough under partitions). This question ties all three together.

## 1. Story

A monitoring system sends 50,000 alerts per minute. One service starts failing. The **same alert fires 400 times in 20 seconds from 80 replicas.**

Your system creates an incident and pages the on-call engineer. The SMS is sent. Then, **before** the service records "notification sent" and starts the escalation timer, the process **crashes**.

The alert keeps arriving. Another replica picks it up. It thinks nobody was paged. It pages the secondary, then the manager, then the director. Four people woken up for one incident.

Or worse: the crash happened *before* the SMS went out, and **nobody** gets paged.

## 2. Why the Easy Answers Fail

- **"Use a unique alert key."** Good start, but if 80 replicas *check* for the key at the same time, they all see "not found" and all create one. Checking isn't the same as enforcing.
- **"Put it in Redis with a TTL."** If Redis is partitioned from the notifier or fails over, two workers can both believe they own the incident (see [[44-distributed-locking-with-redis]]).
- **"Check if an incident exists first."** Two requests check at the same instant, both see nothing, both create, both page. Classic check-then-act ([[26-duplicate-email-race-condition]]).

## 3. The Concept Behind It

**Exactly-once delivery is impossible across a crash.** Between "send SMS" and "record that we sent it," a crash can always happen. You can't make those two steps atomic, because the SMS provider isn't inside your database transaction.

What you **can** build:

> **At-least-once delivery + idempotency = effectively-once.**

Make every step safe to retry, make the database the single source of truth for "what state is this incident in," and make the SMS send idempotent. This is the same idea as [[19-idempotent-consumer-duplicate-events]], applied end to end. The tool that connects your database to the outside world safely is the **transactional outbox**.

## 4. The Design

**Step 1 - Dedup at ingest with the database, not a pre-check.**
Compute a **dedup key** from the alert (e.g. `service + check_name + environment`). Insert the incident with a **unique constraint** on `(dedup_key)` for open incidents:

```sql
INSERT INTO incidents (id, dedup_key, status, created_at)
VALUES ($1, $2, 'triggered', now())
ON CONFLICT (dedup_key) WHERE status IN ('triggered','acknowledged')
DO UPDATE SET alert_count = incidents.alert_count + 1, last_seen = now()
RETURNING id, (xmax = 0) AS created;
```

400 alerts from 80 replicas -> **one** row wins the insert; the other 399 just bump a counter. No race, because the database enforces uniqueness atomically.

**Step 2 - Only the winner schedules the page, in the same transaction.**
When the insert actually *created* the incident, write an **outbox row** in the **same transaction**:

```sql
INSERT INTO outbox (id, incident_id, action, target, idempotency_key, status)
VALUES (gen_random_uuid(), $incident, 'page', 'primary_oncall',
        $incident || ':page:level1', 'pending');
```

**Term: Transactional outbox** - instead of calling the SMS provider directly, you write "this message needs to be sent" into your own database in the same transaction as the state change. Either both are saved or neither is. A separate **dispatcher** reads pending outbox rows and does the actual sending.

This fixes "crash before paging": if the incident exists, the page request **exists durably** too. Nobody gets silently skipped.

**Step 3 - Dispatcher sends at least once, with an idempotency key.**
The dispatcher picks pending rows (`SELECT ... FOR UPDATE SKIP LOCKED` so two dispatchers don't grab the same row), sends the SMS **with the idempotency key** `incident:page:level1`, then marks the row `sent`.

If it crashes after sending but before marking `sent`, another dispatcher retries the same row with the **same idempotency key**. The provider (or your own "sent log" keyed by that key) recognizes it and doesn't send a second SMS. That fixes "crash mid-notify double-pages."

**Step 4 - Escalation is state + time, stored in the database.**
Store `escalation_level` and `next_escalation_at` on the incident. A scheduler finds incidents where `status = 'triggered' AND next_escalation_at <= now()` and, in one transaction, bumps the level **only if it's still the level it expected**:

```sql
UPDATE incidents
SET escalation_level = 2, next_escalation_at = now() + interval '10 minutes'
WHERE id = $1 AND status = 'triggered' AND escalation_level = 1
RETURNING id;
```

...and writes the level-2 outbox row in that same transaction. If two schedulers race, only one update matches `escalation_level = 1`. The other gets 0 rows and does nothing.

**Step 5 - Acknowledgement cancels escalation atomically.**
`UPDATE incidents SET status = 'acknowledged' WHERE id = $1 AND status = 'triggered'`. From then on, escalation updates match 0 rows (they require `status = 'triggered'`), so nothing further is paged. Pending outbox rows for higher levels are cancelled in the same transaction.

## 5. Flow

```mermaid
flowchart TB
  A[400 alerts from 80 replicas] --> B["INSERT ... ON CONFLICT (dedup_key)"]
  B -->|1 winner creates incident| C[(incidents + outbox row, one transaction)]
  B -->|399 others| D[increment alert_count]
  C --> E[Dispatcher: SKIP LOCKED]
  E -->|SMS with idempotency key| F[SMS provider]
  E -->|mark sent| C
  G[Escalation scheduler] -->|"UPDATE ... WHERE status='triggered' AND level=N"| C
  H[Engineer acks] -->|"status = acknowledged"| C
```

## 6. How This Meets Each Requirement

| Requirement | How |
|---|---|
| 400 alerts -> 1 incident | Unique constraint on dedup key, atomic upsert |
| Someone is definitely paged | Outbox row written in the same transaction as the incident |
| Ack cancels escalation | Escalation updates are conditional on `status = 'triggered'` |
| Crash doesn't double-page | Retries reuse the same idempotency key |
| Crash doesn't drop the page | Pending outbox rows are retried until marked sent |

## 7. Production Reality

- The idempotency key must be honored somewhere real: the SMS/voice provider's idempotency support, or your own `sent_notifications` table with a unique key checked before calling the provider (with the tiny remaining window accepted and monitored).
- Page through **multiple channels** (push, SMS, voice) and alert if the outbox has rows stuck in `pending` - that's your "nobody got paged" detector.
- Keep the dedup window sensible: a resolved incident followed by the same alert 2 hours later should create a **new** incident.

## 8. Mental Model

> You can't make "send the SMS" and "remember you sent it" happen at the same instant. So make the database the single notebook of truth, write "page needed" into it atomically with the incident, and make sending safe to repeat.

## 9. 🧠 Remember

> Exactly-once delivery doesn't exist across crashes - build at-least-once delivery with idempotency keys, enforce uniqueness in the database instead of checking first, and use a transactional outbox so state changes and "messages to send" are saved together.

## 10. Quick Self-Test

1. Why does "check if an incident exists, then create it" fail with 80 replicas?
2. What exactly does the transactional outbox guarantee, and what does it not guarantee?
3. How does a conditional `UPDATE ... WHERE escalation_level = 1` stop two schedulers from double-escalating?
</script>
<script type="text/markdown" class="lesson-data" data-id="66" data-title="Things I Wish I Knew Before My First Backend Job" data-category="Blog" data-order="66">
# Blog: Things I Wish Someone Told Me Before My First Backend Job

*Ten short lessons that usually take a year of production incidents to learn. Each one comes with a tiny real example and a link to go deeper.*

---

## 1. Logs Are Your Best Friend. Use Them.

When something breaks in production, you can't attach a debugger. Logs are what you have.

**Example:** "Payment failed for some users." With logs that include `requestId`, `userId`, and the error, you find the cause in 5 minutes. With `console.log("error")`, you're guessing for a day.

Log with context, use structured (JSON) logs, and never log passwords or card numbers. -> [[02-debugging-random-500-errors]]

## 2. Every Input Is a Potential Attack. Validate Everything.

Query params, JSON bodies, headers, file uploads, even data from your own mobile app - all of it can be changed by an attacker.

**Example:** A `quantity` field accepts `-5`, and a user gets a refund on an order they never paid for. Validate type, range, and length on the server, and use parameterized queries to prevent SQL injection. -> [[18-http-status-codes-400-404-409-422]]

## 3. "Works in Dev" Means Nothing.

Dev has 50 rows, one user, and a fast laptop. Production has 50 million rows, concurrent users, slow networks, and real failures.

**Example:** A query that takes 5ms locally takes 45 seconds in production because the table is 10,000x bigger and has no index. -> [[50-slow-query-500m-rows]]

## 4. Database Transactions Exist for a Reason.

If two writes must both happen or neither happen, wrap them in a transaction.

**Example:** You deduct money from wallet A, then the server crashes before adding it to wallet B. Without a transaction, the money just disappears. -> [[60-cache-says-100-db-says-20]]

## 5. Never Store Passwords in Plain Text. Ever.

And not as plain SHA-256 or MD5 either. Use Argon2id or bcrypt.

**Example:** Databases leak. With plain text, every user's password (and likely their email password too) is exposed instantly. -> [[56-password-hashing-not-sha256]]

## 6. Cache Invalidation Is Harder Than It Sounds.

Adding a cache takes an hour. Keeping it correct takes forever.

**Example:** A user updates their profile photo, but the old one keeps showing for 10 minutes because the cache wasn't cleared. Annoying for photos; dangerous for balances and permissions. Never make critical decisions from cached data. -> [[60-cache-says-100-db-says-20]]

## 7. Your API Will Be Called in Ways You Never Imagined.

Clients double-click, retry on timeout, send huge payloads, call endpoints out of order, and hammer you from scripts.

**Example:** A mobile app retries every failed request 3 times. A slow payment endpoint now gets triple traffic and charges some users twice. Design for retries with idempotency keys. -> [[32-payment-idempotency-double-click]], [[48-huge-json-payloads]]

## 8. Rate Limiting Is Not Optional.

Without limits, one buggy client, scraper, or attacker can take down the service for everyone.
