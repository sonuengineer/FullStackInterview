<script type="text/markdown" class="lesson-data" data-id="01" data-title="Concurrency vs Parallelism" data-category="Core Concepts" data-order="1">
# Concurrency vs Parallelism

## 1. Story

Imagine you're a single chef in a small kitchen. Three orders come in: soup, salad, and steak.

You start the soup boiling, then while it simmers you chop vegetables for the salad, then while the vegetables rest you flip the steak. You're one person, switching between three tasks, making progress on all of them without ever doing two things in the same instant.

Now imagine two chefs in the kitchen. One cooks the soup, the other grills the steak, **at the exact same moment**.

Both kitchens get food out faster than one dish at a time. But only the second kitchen has two things physically happening simultaneously.

## 2. The Problem

Engineers use "concurrent" and "parallel" interchangeably in conversation, and it causes real design mistakes:

- A team wraps a CPU-heavy image-resizing function in `async/await` in Node.js, expects it to "run in parallel," and is confused when it's not faster — it's still using one CPU core, just switching between tasks.
- Another team assumes their single-core server "can't do concurrency," so they under-utilize it, when actually a single core can juggle thousands of concurrent I/O-bound requests just fine.

## 3. Why This Problem Exists

Both concurrency and parallelism are about "doing more than one thing," so the vocabulary blurs. But they answer two different questions:

- **Concurrency** answers: *"How do I structure a program to deal with multiple tasks that are in progress at overlapping times?"*
- **Parallelism** answers: *"How do I actually execute multiple tasks at the same physical instant?"*

## 4. The Solution (The Actual Distinction)

**Term: Concurrency** — multiple tasks make progress during overlapping time windows, by interleaving (switching between them), not necessarily executing at the same instant. Needs only one CPU core.

**Term: Parallelism** — multiple tasks execute at the literal same instant, on different CPU cores (or different machines).

> Concurrency is about **structure** (how you organize work). Parallelism is about **execution** (whether work physically overlaps in time).

## 5. Mental Model

| | One chef, juggling | Two chefs, side by side |
|---|---|---|
| Concept | Concurrency | Parallelism |
| Hardware needed | 1 core | 2+ cores |
| What happens | Fast switching between tasks | Simultaneous execution |
| Good for | I/O-bound work (waiting on network/disk) | CPU-bound work (heavy computation) |

Concurrency can exist *without* parallelism (one core, switching fast). Parallelism always implies some concurrency (multiple things are in flight), but adds true simultaneity.

## 6. How It Works

A single-threaded Node.js server handles 10,000 open connections concurrently using the **event loop**: while request A is waiting on a database response (I/O), the CPU is free, so the event loop picks up request B and starts processing it. Nothing is happening "at the same instant" — it's fast switching during idle gaps.

True parallelism requires multiple OS threads/processes running on multiple CPU cores at once — e.g. Node's `worker_threads`, a `cluster` of processes, or a language with real multi-threading (Go routines across cores, Java threads).

## 7. Flow

```mermaid
flowchart TB
  subgraph Concurrency ["Concurrency - 1 core, interleaved"]
    A1[Task A runs] --> A2[Task A waits on I/O]
    A2 --> B1[Task B runs while A waits]
    B1 --> B2[Task B waits on I/O]
    B2 --> A3[Back to Task A]
  end
  subgraph Parallelism ["Parallelism - 2 cores, simultaneous"]
    direction LR
    C1[Core 1: Task C running] 
    C2[Core 2: Task D running]
  end
```

## 8. Code Example

```javascript
// CONCURRENCY: single thread, event loop, great for I/O-bound work
async function handleRequest(req) {
  const user = await db.findUser(req.userId);   // CPU is free while waiting
  const posts = await db.findPosts(user.id);    // another request can run here
  return { user, posts };
}
// 10,000 of these can be "in flight" on ONE core, because each await
// just parks the task and frees the CPU until the I/O completes.

// PARALLELISM: actually uses multiple cores for CPU-heavy work
const { Worker } = require('worker_threads');
function resizeImageInParallel(buffer) {
  return new Promise((resolve) => {
    const worker = new Worker('./resize-worker.js', { workerData: buffer });
    worker.on('message', resolve); // runs on a separate core, truly simultaneous
  });
}
```

## 9. Production Reality

- **I/O-bound work** (API calls, DB queries, file reads) -> concurrency (async/await, event loops) is usually enough. Adding more CPU cores does not speed this up much, because the bottleneck is waiting, not computing.
- **CPU-bound work** (image processing, video encoding, big data transforms, password hashing) -> you need real parallelism (worker threads, multiple processes, multiple machines) or the event loop itself gets blocked and *every* concurrent request stalls behind it.
- Node.js is single-threaded for your JS code, but it uses a **thread pool underneath (libuv)** for things like file I/O and DNS — so it's not "purely" single-threaded end to end; know this distinction for interviews.

## 10. Trade-offs

| | Concurrency | Parallelism |
|---|---|---|
| Hardware cost | Low (one core) | Higher (needs multiple cores/machines) |
| Complexity | Simpler mental model, but callback/await ordering bugs possible | Race conditions, shared-memory bugs, synchronization overhead |
| Speeds up | Waiting-heavy workloads | Computation-heavy workloads |

## 11. Common Mistakes

- Thinking `async/await` makes CPU-bound code faster. It doesn't — it just avoids blocking *other* requests while this one runs, but the heavy computation itself still eats one core's time linearly.
- Believing a single-threaded runtime "can't scale." It scales beautifully for I/O-bound traffic — that's the entire premise of Node.js and why it powers huge APIs.

## 12. Real-World Example

A payment API doing `await` calls to a bank's API and a database is concurrency-bound — Node.js/Python asyncio handle thousands of these per core. A video transcoding service (CPU-bound) needs real parallelism — multiple worker processes/cores, or it'll queue up and fall behind no matter how "async" the code looks.

## 13. 🧠 Remember

> Concurrency is about **structure** — juggling many tasks by switching between them. Parallelism is about **execution** — actually running many tasks at the exact same instant. You need multiple cores for parallelism; you just need smart scheduling for concurrency.

## 14. Quick Self-Test

1. If you wrap a CPU-heavy loop in `async/await` on a single-core server, will other requests speed up or slow down? Why?
2. Can a system be concurrent but not parallel? Can it be parallel but not concurrent?
3. Your API is slow because it's waiting on three downstream microservices sequentially. Is this a concurrency problem or a parallelism problem — and what's the fix?
</script>
<script type="text/markdown" class="lesson-data" data-id="02" data-title="Debugging Random 500s" data-category="Production Debugging & Incidents" data-order="2">
# Debugging Random 500 Errors With Clean Logs

## 1. Story

You get a Slack ping: "Hey, some users say checkout randomly fails with a 500. It's not everyone, not every time." You open your app logs. Nothing. No stack trace, no error message, just normal request logs right up to the point of failure.

## 2. The Problem

500 means "something broke that we didn't expect and didn't handle" — unlike a 400 (bad request) which is an *expected* rejection, a 500 is a symptom of a gap in your own error handling or visibility. "Random" + "clean logs" almost always means one of these:

- The error is being caught somewhere and silently swallowed (`catch (e) {}` with no logging).
- The error is happening **before your app's logger even runs** — e.g. at the load balancer, reverse proxy, or API gateway layer.
- It's an infrastructure issue (OOM kill, connection pool exhaustion, disk full) that never reaches your application's error-handling code at all.
- It's a race condition or resource exhaustion that only shows up under specific timing/load, so it's rare and hard to catch in a normal test.

## 3. Why This Problem Exists

Most apps log the *happy path* well (because that's what developers test) but under-instrument the *unhappy path* (because it's invisible until production proves you wrong). The absence of a log line is not the absence of a failure — it's the absence of someone deciding to log it.

## 4. The Solution: A Systematic Checklist (Move Up and Down the Stack)

```mermaid
flowchart LR
  C[Client] --> LB[Load Balancer / API Gateway]
  LB --> APP[Application Server]
  APP --> CACHE[Cache]
  APP --> DB[(Database)]
  APP --> EXT[Third-party API]
```

Work through this in order — don't guess, instrument:

1. **Reproduce and correlate**: What % of requests fail? Same endpoint? Same time of day? Same user pattern (e.g. only logged-in users, only large payloads)? Get a request ID for a failed request.
2. **Check the layer ABOVE your app first** — load balancer / nginx / API gateway logs. A 500 can be generated by the LB itself (upstream timeout, connection reset by peer) before your app even sees the request. This is the #1 most overlooked spot.
3. **Check infra metrics on the instance**: CPU, memory (was the process OOM-killed?), open file descriptors, disk space. A crashed/restarted process explains "random" failures with no app-level trace.
4. **Check your own error handling**: Is there a generic `try/catch` or a global error handler that returns 500 without logging the actual exception and stack trace? Fix this immediately — it should be illegal in production code to catch an error without logging it.
5. **Check downstream dependencies**: DB connection pool exhausted? Third-party API timing out intermittently? A connection pool with 20 slots under a traffic spike will randomly fail some requests while others succeed — classic "random" signature.
6. **Check for race conditions**: Shared mutable state, unhandled promise rejections crashing a worker process, two requests touching the same resource without locking.
7. **Add correlation IDs and structured logging** if you don't have them — generate a request ID at the edge, pass it through every layer, log it everywhere, so you can grep one ID across LB, app, and DB logs to see exactly where it died.

## 5. Code Example: The Fix That Should Already Be There

```javascript
// BAD: swallows the actual error, gives you nothing to debug
app.use((err, req, res, next) => {
  res.status(500).json({ error: 'Something went wrong' });
});

// GOOD: logs the real error with context before responding
app.use((err, req, res, next) => {
  logger.error({
    requestId: req.id,
    path: req.path,
    userId: req.user?.id,
    error: err.message,
    stack: err.stack,
  }, 'Unhandled request error');
  res.status(500).json({ error: 'Something went wrong', requestId: req.id });
});
```

## 6. Production Reality

- Use an APM tool (Datadog, New Relic, Sentry) so you get automatic stack traces, request tracing, and error grouping instead of relying on manual log greps.
- Set up alerts on 5xx rate, not just uptime — "randomly returning 500" is exactly the kind of thing a simple health check won't catch.
- Distributed tracing (correlation IDs across services) turns "random failure, no idea why" into "I can see exactly which service in the chain timed out."

## 7. Trade-offs

Better observability (structured logs, tracing, APM) costs setup time and some infrastructure — but the alternative is exactly the situation in this story: paying that cost anyway, at 2am, by hand, under pressure.

## 8. Common Mistakes

- Staring only at application logs when the failure is actually happening at the load balancer or in the database.
- Catching exceptions "to be safe" without logging them — this converts a debuggable crash into an undebuggable, silent failure.
- Assuming "random" means "unfixable" — intermittent failures almost always correlate with *something* (load, timing, a specific input shape, connection pool size) once you have the right instrumentation.

## 9. 🧠 Remember

> Random 500s with clean logs almost always mean you're not logging where the failure actually happens — move up the stack (load balancer) and down the stack (database/dependencies) until you find where the silence is.

## 10. Quick Self-Test

1. Why is a 500 fundamentally different from a 400 in terms of what it tells you about your own code?
2. Name three layers between the client and the database where a 500 could originate that would never show up in your application's own logs.
3. Why would connection pool exhaustion cause failures that look "random" instead of "consistent"?
</script>
<script type="text/markdown" class="lesson-data" data-id="03" data-title="TTL Deletion at Scale (WhatsApp Status)" data-category="System Design at Scale" data-order="3">
# Deleting Expired Data at Massive Scale (WhatsApp Status Example)

## 1. Story

WhatsApp Status posts disappear after 24 hours. With ~2 billion users posting statuses daily, that's potentially billions of rows that all need to "die" roughly 24 hours after they were born.

The naive engineer says: "Easy — cron job, runs every minute, `DELETE FROM statuses WHERE created_at < NOW() - INTERVAL 24 HOUR`."

## 2. The Problem

Run that query against a table with billions of rows and here's what happens:

- The `WHERE` scan (even indexed) still has to touch a huge number of matching rows every run.
- A single `DELETE` touching millions of rows takes a heavy lock, causing replication lag and blocking other writes.
- It creates a **write spike** — instead of spreading load evenly, you get a cron-triggered avalanche every minute, hammering disk I/O and the write-ahead log.
- At 2 billion posts/day, that's roughly 23,000 expirations *per second*, continuously. A periodic batch job is fighting a firehose with a bucket.

## 3. Why This Problem Exists

The mistake is framing this as "how do I delete billions of rows fast?" The real question is: **"how do I make sure I never accumulate a backlog of billions of rows that need deleting all at once?"** Deletion should be a continuous background trickle, not a scheduled event.

## 4. The Solution — Combine Four Techniques

**Technique 1 — Lazy (read-time) expiration.** Every read query filters `WHERE expires_at > NOW()`. A status that's "expired" but not yet physically deleted is invisible to users immediately — correctness doesn't depend on how fast the physical delete happens.

**Technique 2 — Time-based partitioning.** Instead of one giant table, partition storage by hour (e.g. `statuses_2026090911`, `statuses_2026090912`, ...). "Deleting" an entire expired partition is a single metadata operation (`DROP PARTITION`), not a row-by-row scan — O(1) instead of O(n).

**Technique 3 — A delay queue for precise, spread-out expiry.** When a status is created, push its ID into a Redis **sorted set** with score = expiry timestamp (or a Kafka delayed/scheduled topic). A background worker continuously pops items whose score `<= now()`, in small batches. Because creation happens continuously all day, expirations naturally spread out across the day too — no spike.

**Technique 4 — Throttled batch physical deletes.** For any leftover cleanup, delete in small batches (e.g. 500 rows) with a short sleep between batches, during off-peak hours, using an indexed range scan with `LIMIT` — never one unbounded `DELETE`.

## 5. Mental Model

> Don't fight a flood with one big dam release. Let it drain continuously through many small pipes.

Think of it like a library with a strict "24-hour loan" — instead of checking every single book overnight, the librarian just checks each book's due date **when someone tries to read it** (lazy expiration), and separately does a slow, ongoing shelf-clearing in the background — never a frantic once-a-day sweep of the whole library.

## 6. Architecture / Flow

```mermaid
flowchart TB
  U[User posts Status] --> S[Status Service]
  S --> DB[(DB - partitioned by hour)]
  S --> Z["Redis ZSET: score = expiry time"]
  W[Expiry Worker - continuous, batched] -->|poll: score <= now| Z
  W -->|small batches, throttled| DB
  R[Read request] --> DB
  R -.filters expires_at > now.-> R
```

## 7. Code Example

```sql
-- Technique 2: dropping a whole expired partition is instant, no row scan
ALTER TABLE statuses DROP PARTITION p_2026090909;  -- the 09:00 hour bucket, now > 24h old
```

```javascript
// Technique 3: Redis sorted set as a delay queue
await redis.zadd('status_expiry', expiresAtEpoch, statusId);

// Worker loop - runs continuously, small batches, never a giant sweep
async function expiryWorker() {
  while (true) {
    const now = Date.now();
    const expired = await redis.zrangebyscore('status_expiry', 0, now, 'LIMIT', 0, 500);
    if (expired.length) {
      await markHidden(expired);          // instant, cheap, correctness-critical
      await redis.zrem('status_expiry', ...expired);
      await queuePhysicalDelete(expired);  // slow path, batched, off the hot path
    }
    await sleep(1000);
  }
}
```

## 8. Production Reality

Reads must never trust "has it been physically deleted yet" — always filter by `expires_at`. This decouples user-facing correctness from the speed of your cleanup pipeline, which is exactly what lets you make cleanup slow, cheap, and throttled without ever showing an expired status to a user.

## 9. Trade-offs

| Approach | Pro | Con |
|---|---|---|
| Partition-drop | O(1) deletion, no lock contention | Requires schema pre-planning for time-based partitions |
| Redis delay queue | Spreads load evenly, precise timing | Needs reliable, idempotent workers (at-least-once delivery) |
| Lazy expiration | Zero write cost, instant correctness | "Expired but not deleted" rows briefly waste storage |

## 10. Common Mistakes

- Writing one unthrottled `DELETE` for all expired rows — this is the exact anti-pattern the story opens with, and it's the most common wrong first instinct.
- Forgetting lazy expiration and assuming deletion speed determines correctness — it shouldn't. A slow cleanup job should never mean a user sees expired content.

## 11. 🧠 Remember

> At billion-row scale, never delete in one shot — delete continuously and cheaply, ideally by dropping whole partitions instead of rows, and let "expired" be a read-time filter instead of an urgent write-time job.

## 12. Quick Self-Test

1. Why does spreading deletions across a delay queue avoid the "cron avalanche" problem that a periodic batch job creates?
2. Why is `DROP PARTITION` so much cheaper than `DELETE WHERE ...` at scale?
3. If your physical delete pipeline falls behind by 2 hours, why does the user still never see an expired status?

# Your API Is Choking at 15,000 RPS - You Have 15 Minutes

## 1. Story

It's 8:47 PM. A dashboard turns red. Requests per second have tripled in ten minutes, latency is climbing, error rates are ticking up, and support tickets are piling in. You're on call, alone, with 15 minutes before this turns into a full outage.

This is not a design exercise. This is triage.

## 2. The Problem

Under real incident pressure, engineers make two classic mistakes: they try to **fix the code** (deploy a hotfix, refactor a slow function) mid-fire, which is slow and risky; or they **scale the wrong layer** (add more app servers when the database is actually the bottleneck, which just sends *more* connections into an already-drowning database and makes it worse).

## 3. The Solution: A 15-Minute Incident Playbook

**Minute 0-3 — Find the actual bottleneck, don't guess.** Look at dashboards: CPU/memory on app servers, DB connection count and query latency, queue depth, cache hit rate. You cannot fix what you haven't identified.

**Minute 3-6 — Stop the bleeding (shed load).** Turn on or tighten rate limiting so you return fast `429 Too Many Requests` instead of slow, resource-consuming `500`s. If there's a feature flag for expensive functionality (recommendations, search facets, personalization), turn it off to serve a cheaper, simpler response. If a specific client/IP/bot is the source of the spike, block it at the CDN/WAF edge.

**Minute 6-10 — Add capacity where it's stateless and safe.** If the bottleneck is the app tier (CPU-bound, not DB-bound), bump your Auto Scaling Group's desired capacity manually — don't wait for reactive scaling policies. If the bottleneck is the database, adding app servers *doesn't help* — check connection pool limits instead.

**Minute 10-13 — Take pressure off the database specifically.** Verify your cache is actually being hit (a near-zero cache hit rate during a spike is a huge red flag — possible cache stampede, or cache was never warmed for this traffic pattern). Kill or deprioritize any single identifiably expensive/slow query. Make sure the CDN is serving anything cacheable (static assets, cacheable GET responses) so it never reaches your origin at all.

**Minute 13-15 — Communicate and stabilize.** Post a status update if user-facing. Confirm error rate and latency trending back down. Only *after* the fire is out do you investigate root cause properly.

## 4. Mental Model

> In an incident, the priority order is: **Stop the bleeding -> Reduce load -> Add capacity -> Root-cause later.**

Think of it like a hospital ER, not a surgery room: you stabilize the patient first (stop the bleeding), you don't start planning reconstructive surgery while they're crashing.

## 5. Flow

```mermaid
flowchart TD
  A["Alert: 15k RPS, latency spiking"] --> B{"Where's the bottleneck?<br/>Check dashboards"}
  B -->|App CPU maxed| C["Scale ASG desired capacity"]
  B -->|DB connections maxed| D["Do NOT add app servers.<br/>Shed load, check pool limits"]
  B -->|Cache hit rate near zero| E["Investigate cache stampede /<br/>warm cache"]
  C --> F["Enable rate limiting / 429s<br/>for non-critical traffic"]
  D --> F
  E --> F
  F --> G["Verify CDN caches static/cacheable GETs"]
  G --> H["Monitor recovery, then<br/>root-cause after the fire is out"]
```

## 6. Production Reality

This playbook assumes some things are already true *before* the incident: your app is stateless (so adding instances actually helps), you have an autoscaling group or at least manual scale controls, you have a CDN in front of static/cacheable content, and you have dashboards that show CPU/DB/cache metrics in real time. None of these can be built during the 15 minutes — that's exactly why the trade-off discussion below matters.

## 7. Trade-offs

- **Horizontal scaling** is fast to apply but costs money and doesn't fix an underlying single point of failure like a non-scalable database.
- **Load shedding** protects the system's overall health but deliberately degrades experience for some users — an intentional, visible trade-off made under pressure, not a silent failure.

## 8. Common Mistakes

- Deploying a "quick fix" to the codebase during the incident without knowing the root cause — high risk of making things worse under pressure.
- Scaling the app tier when the real bottleneck is the database — this doesn't just fail to help, it actively worsens the database's load by allowing even more concurrent connections to pile up.

## 9. 🧠 Remember

> In a live incident: stop the bleeding first (shed load, scale what's actually stateless), find the real bottleneck with data not guesses, and postpone permanent fixes until after the fire is out.

## 10. Quick Self-Test

1. Why can adding more app servers sometimes make a database bottleneck *worse* instead of better?
2. Why is returning `429` during an overload better than letting requests queue up and eventually 500?
3. Name two things that must already exist *before* an incident for this 15-minute playbook to actually work.
</script>
<script type="text/markdown" class="lesson-data" data-id="05" data-title="Username Availability Check" data-category="System Design at Scale" data-order="5">
# How Gmail Checks "Username Already Taken" Instantly

## 1. Story

You start typing a Gmail address. Before you've even finished, the UI shows "That username is taken." Gmail has well over a billion accounts. How does it check against all of them, for every keystroke, from users worldwide, in milliseconds?

## 2. The Problem

The naive design: on every keystroke, fire `SELECT 1 FROM users WHERE username = ?` straight at the primary database. Even with an index, that's a network round trip plus a real query, multiplied by every keystroke, from every signup form, everywhere in the world, constantly. At Gmail's scale that's an enormous, unnecessary load on the most critical database in the company, just for a UX nicety.

## 3. The Solution — Layered, Cheapest-Check-First

**Step 1 — Debounce on the client.** Don't fire a request per keystroke; wait ~300ms after typing pauses. This alone cuts request volume dramatically.

**Step 2 — A probabilistic pre-check: the Bloom filter.**

**Term: Bloom filter** — a compact, memory-efficient data structure that can answer "have I possibly seen this before?" with zero false negatives (if it says "no," it's *definitely* not taken) but occasional false positives (if it says "maybe," it might be a false alarm). It's just a bit array plus a few hash functions — checking it costs microseconds and no database round trip at all.

A replica of this Bloom filter (containing all existing usernames) can live in memory at the edge/application layer, so the vast majority of "is it available" checks (which are usually "yes, available" for a random typed string) never even touch the database.

**Step 3 — Confirm the rare "maybe taken" case** against a fast read-replica or cache (not the primary DB) only when the Bloom filter flags a possible hit.

**Step 4 — The database's unique constraint is the actual source of truth**, enforced only at the moment of final account creation — never trust the "fast check" as the real answer.

## 4. Mental Model

> A Bloom filter is a very fast, very cheap bouncer who can instantly say "definitely not on the list" for most people, and only occasionally says "let me check the clipboard" for a few.

The instant UI feedback is just a **hint**. The database's `UNIQUE` constraint at signup time is the actual **decision**.

## 5. Architecture / Flow

```mermaid
sequenceDiagram
  participant U as User (typing)
  participant B as Browser (debounced)
  participant E as Edge Service (Bloom filter in memory)
  participant C as Cache / Read Replica
  participant D as Primary DB (source of truth)

  U->>B: types username, pauses 300ms
  B->>E: check "is this taken?"
  E-->>B: "definitely available" (fast path, most common)
  Note over E,C: Only if Bloom filter says "maybe taken":
  E->>C: confirm against replica
  C-->>B: real answer
  U->>D: actual signup submission
  D-->>D: UNIQUE constraint enforces truth,<br/>rejects race-condition duplicates
```

## 6. Code Example

```javascript
// Ultra-fast, in-memory, no DB hit for the common case
function isProbablyTaken(username, bloomFilter) {
  return bloomFilter.has(username); // false = definitely available, no DB call needed
}

// Only escalate to a real check when the Bloom filter says "maybe"
async function checkAvailability(username) {
  if (!bloomFilter.has(username)) return { available: true };
  const exists = await readReplica.query(
    'SELECT 1 FROM users WHERE username = $1', [username]
  );
  return { available: !exists };
}
```

```sql
-- The actual source of truth, enforced atomically at signup
ALTER TABLE users ADD CONSTRAINT unique_username UNIQUE (username);
-- INSERT that violates this throws an error the app catches and
-- returns "taken" - even if the earlier check said "available"
```

## 7. Production Reality

Two users can type the same available-looking username at the exact same moment and both see "available" — the Bloom filter/cache is only a hint, and it can go briefly stale right after someone else signs up. The system must handle the resulting `UNIQUE` constraint violation gracefully at insert time and tell the second user "actually, that's taken now."

## 8. Trade-offs

- Bloom filter size vs. false-positive rate: a bigger bit array and more hash functions reduce false positives but cost more memory — tuned based on expected number of usernames.
- Slight staleness: a just-registered username might take a moment to propagate into replicas/caches everywhere, but this only ever causes a false "maybe available" that gets caught at the real insert — never actual duplicate accounts.

## 9. Common Mistakes

- Treating the instant "available" check as the actual reservation, with no atomic uniqueness enforcement at write time — this lets two concurrent signups both succeed with the same username under race conditions.
- Hitting the primary database directly for every keystroke instead of debouncing and using a cheap pre-check layer.

## 10. 🧠 Remember

> Fast uniqueness checks are UX, not truth — use a Bloom filter/cache for instant feedback, but the database's unique constraint at insert time is what actually prevents duplicate usernames.

## 11. Quick Self-Test

1. Why can a Bloom filter say "maybe taken" incorrectly, but never say "not taken" incorrectly?
2. What actually prevents two users from grabbing the same username at the exact same millisecond, given that the instant check can be wrong?
3. Why does debouncing on the client matter even though the Bloom filter check itself is nearly free?
</script>
<script type="text/markdown" class="lesson-data" data-id="06" data-title="EC2 Auto Scaling" data-category="Cloud & Infrastructure (AWS)" data-order="6">
# Auto-Scaling an EC2 App for a 10x Traffic Spike

## 1. Story

Your app runs on a couple of EC2 instances. A product goes viral, or a big sale starts, and traffic jumps 10x within minutes. You need the system to grow on its own, without you SSH-ing into new boxes at 2 AM, and without falling over in the meantime.

## 2. The Problem

A fixed number of EC2 instances is a fixed ceiling. Traffic beyond that ceiling means queued requests, timeouts, and eventually an outage — exactly what you don't want during your highest-traffic moment.

## 3. The Solution

Put your EC2 instances in an **Auto Scaling Group (ASG)** behind an **Application Load Balancer (ALB)**:

- The **ALB** is the single entry point — it health-checks every instance and only routes traffic to healthy ones.
- The **ASG** watches a **CloudWatch metric** (commonly average CPU utilization, or request count per target) and automatically launches new EC2 instances from a **launch template** when the metric crosses a threshold ("target tracking scaling"), and terminates instances when load drops.
- New instances must be able to serve traffic immediately — so the app must be **stateless**: no session data stored on the local instance's disk/memory. Sessions go in a shared store like Redis/ElastiCache; static assets go on S3 + CloudFront, not on the instance.

## 4. Mental Model

> ASG + ALB = a pool of interchangeable workers that grows and shrinks automatically, with a receptionist (the load balancer) routing each customer to whichever worker is free and healthy.

## 5. How It Works / Flow

```mermaid
flowchart TB
  Users --> R53[Route 53 DNS]
  R53 --> ALB[Application Load Balancer]
  ALB --> ASG["Auto Scaling Group<br/>(min 2, max N EC2 instances)"]
  ASG --> RDS[(RDS - primary + read replicas)]
  ASG --> Cache[(ElastiCache / Redis - shared sessions)]
  CW[CloudWatch Metrics: CPU, request count] -.triggers scaling policy.-> ASG
```

## 6. How I'd Answer This In An Interview

1. **State the prerequisite**: the app must be stateless — otherwise scaling out just creates instances that can't correctly serve a user whose session lives on a different box.
2. **Name the components**: ALB for routing + health checks, ASG for elastic capacity, a launch template/AMI for consistent instance bootstrapping.
3. **Name the scaling policy concretely**: target tracking on CPU utilization (e.g., "keep average CPU near 60%") or on ALB request count per target — not just "it scales automatically," show you know the mechanism.
4. **Address scale-out vs scale-in asymmetry**: scale out fast (react quickly to spikes) but scale in slowly with a cooldown period, to avoid "flapping" (rapidly launching and terminating instances).
5. **Address cold-start lag**: a freshly launched EC2 instance takes time to boot and initialize the app — mitigate with a pre-baked AMI (app + dependencies already installed) rather than installing everything via user-data scripts at boot, or maintain a small warm pool.
6. **Mention predictable vs. unpredictable spikes**: for a known event (a scheduled sale), use **scheduled scaling** to pre-warm capacity ahead of time; for an unknown viral spike, rely on **reactive target-tracking** scaling.
7. **Call out the next bottleneck**: the database. Scaling app servers alone doesn't help if the single RDS instance behind them is now getting 10x the queries — that's the sign of a mature answer in an interview: acknowledging that this fix moves the bottleneck rather than solving it end-to-end.

## 7. Production Reality

Cold start time (EC2 boot + app startup) means reactive scaling always has some lag — for the first minute or two of a sudden spike, existing instances absorb the extra load. This is exactly why load shedding (see the 15k RPS lesson) matters as a complementary short-term measure while ASG catches up.

## 8. Trade-offs

| | EC2 + ASG | Fargate / Lambda |
|---|---|---|
| Control | Full control over OS/runtime | Less control, managed runtime |
| Scale speed | Minutes (instance boot time) | Seconds (containers/functions) |
| Cost model | Pay for running instances | Pay per request/duration |
| Ops burden | You manage AMIs, patches | Provider manages infra |

## 9. Common Mistakes

- Forgetting the database. Horizontally scaling the app tier while the database stays a single instance just relocates the bottleneck — this is the single most common gap in this interview answer, and calling it out explicitly signals seniority.
- Storing session state on the local instance, which breaks correctness the moment a user's second request lands on a different instance than their first.
- Setting scale-in too aggressively, causing the ASG to thrash (constantly launching and killing instances) as load fluctuates near the threshold.

## 10. 🧠 Remember

> Auto Scaling only works if your app is stateless and your database can take the extra load too — scaling compute without scaling or protecting your data layer just moves the bottleneck.

## 11. Quick Self-Test

1. Why does storing session data on the local EC2 instance break Auto Scaling correctness?
2. Why would you use scheduled scaling in addition to (not instead of) target-tracking scaling?
3. If your app servers scale to 20 instances but your RDS instance is maxed out, what actually happens to your users?
</script>
<script type="text/markdown" class="lesson-data" data-id="07" data-title="CORS Error Fix" data-category="Web & API Communication" data-order="7">
# Fixing a CORS Error Between app.company.com and api.company.com

## 1. Story

Your frontend lives at `http://app.company.com`. It calls your API at `http://api.company.com`. The browser console shows:

```
CORS error: No 'Access-Control-Allow-Origin' header is present on the requested resource.
```

The API works fine in Postman. It works fine with `curl`. It only fails from the browser.

## 2. The Problem — And Why It's Not a Networking Bug

**Term: Same-Origin Policy** — a browser security rule that blocks a script running on one origin (scheme + domain + port) from reading responses from a different origin, unless that origin explicitly grants permission. `app.company.com` and `api.company.com` are *different origins* (different subdomains), even though they're on the same top-level company domain.

This is why Postman and `curl` work fine — they aren't browsers, so they don't enforce this policy at all. The request often actually **reaches your server successfully**; the browser just refuses to let your JavaScript read the response.

## 3. The Solution

The server (`api.company.com`) must respond with headers that explicitly allow the requesting origin:

```
Access-Control-Allow-Origin: https://app.company.com
```

If the request uses cookies or `Authorization` headers for auth, you also need:

```
Access-Control-Allow-Credentials: true
```

— and in that case `Access-Control-Allow-Origin` **cannot** be `*`; it must be the exact origin, and the frontend's `fetch`/`axios` call must set `credentials: 'include'`.

For anything beyond a "simple" GET (custom headers, `PUT`/`DELETE`, `Content-Type: application/json`), the browser first sends an automatic **preflight** `OPTIONS` request to ask permission before sending the real one. Your server must respond to `OPTIONS` with `Access-Control-Allow-Methods`, `Access-Control-Allow-Headers`, and `Access-Control-Allow-Origin` — if it doesn't, the browser never even attempts the real request.

## 4. Mental Model

> CORS is the server handing the browser a signed permission slip. The browser won't let your JavaScript touch the response unless that slip explicitly names the requesting origin.

## 5. Flow

```mermaid
sequenceDiagram
  participant B as Browser (app.company.com)
  participant S as Server (api.company.com)

  Note over B,S: Non-simple request (e.g. POST with JSON + auth header)
  B->>S: Preflight OPTIONS request
  S-->>B: Access-Control-Allow-Origin, -Methods, -Headers
  Note over B: Browser checks: is my origin allowed?
  B->>S: Actual POST request
  S-->>B: Response + Access-Control-Allow-Origin header
  Note over B: Browser allows JS to read the response
```

## 6. Code Example

```javascript
// Express server (api.company.com)
const cors = require('cors');

app.use(cors({
  origin: 'https://app.company.com',  // exact origin, not '*', because we use cookies
  credentials: true,
  methods: ['GET', 'POST', 'PUT', 'DELETE'],
  allowedHeaders: ['Content-Type', 'Authorization'],
}));
```

```javascript
// Frontend fetch (app.company.com) - must opt in to sending cookies
fetch('https://api.company.com/orders', {
  method: 'POST',
  credentials: 'include',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ item: 'widget' }),
});
```

## 7. Production Reality

If you support multiple frontend origins (e.g. staging, production, a mobile web view), use a dynamic origin check on the server (a whitelist function) instead of hardcoding one string. Also set `Access-Control-Max-Age` so browsers cache the preflight result and don't re-send `OPTIONS` on every single request — this matters for latency at scale.

## 8. Trade-offs

- `Access-Control-Allow-Origin: *` is simple and fine for a fully public, unauthenticated API — but browsers **flatly reject** combining `*` with credentials, so any authenticated cross-origin API must use an explicit origin.
- An explicit origin whitelist is more secure but requires maintaining that list as new frontend domains appear.

## 9. Common Mistakes

- Setting `Access-Control-Allow-Origin: *` while also trying to send cookies/auth — browsers block this combination outright, no matter what else you configure.
- Handling CORS for `GET` but forgetting that `POST` with a JSON body or custom headers triggers a preflight `OPTIONS` request that also needs a correct response.
- Assuming a CORS error means the request never reached the server — it very often did; the browser is just blocking your script from reading the result.

## 10. 🧠 Remember

> CORS errors are the browser protecting the user, not the network failing — fix them on the server by explicitly telling the browser which origins, methods, and headers are allowed, including answering the preflight OPTIONS request.

## 11. Quick Self-Test

1. Why does the same request work in Postman but fail in the browser?
2. Why can't you use `Access-Control-Allow-Origin: *` together with cookies/credentials?
3. What browser behavior triggers an automatic preflight `OPTIONS` request, and what must the server do in response?
</script>
<script type="text/markdown" class="lesson-data" data-id="08" data-title="EC2 No Internet Troubleshooting" data-category="Cloud & Infrastructure (AWS)" data-order="8">
# EC2 Has a Public IP But No Internet Access

## 1. Story

You launch an EC2 instance, the AWS console proudly shows a public IP address next to it, and you SSH in and run `curl google.com`. It hangs, then times out. No internet. But... it has a public IP. What's going on?

## 2. The Problem — A Public IP Is Just an Address, Not a Path

Having a public IP means the internet *could* find your instance if traffic reached it correctly. It says nothing about whether the surrounding network configuration actually lets traffic flow in either direction. There are multiple independent layers between "has an IP" and "can talk to the internet," and a block at *any single one* produces the exact same symptom: nothing.

## 3. The Solution — Check Every Layer, Top-Down

Think of the path as layers, from the outside in:

```mermaid
flowchart LR
  Internet((Internet)) --> IGW[Internet Gateway]
  IGW --> RT[Route Table: 0.0.0.0/0 -> IGW?]
  RT --> NACL["Network ACL (stateless,<br/>subnet-level)"]
  NACL --> SG["Security Group (stateful,<br/>instance-level)"]
  SG --> OS["OS firewall<br/>(iptables/firewalld)"]
  OS --> APP[Your Application]
```

Walk it top-down, checking each:

1. **Internet Gateway (IGW)** — is one actually attached to the VPC? Without it, nothing in the VPC can reach the public internet no matter what else is configured.
2. **Route table** — does the subnet's route table have a route for `0.0.0.0/0` pointing to the IGW? This is the single most common miss: a public IP with no corresponding route is a dead end. (This is what actually defines a subnet as "public" — not the instance having a public IP.)
3. **Network ACL (NACL)** — subnet-level, **stateless**, meaning it evaluates inbound and outbound rules independently. A NACL that allows outbound but blocks the inbound *return* traffic will silently break connections even though the outbound packet leaves fine.
4. **Security Group (SG)** — instance-level, **stateful** (return traffic for an allowed outbound connection is automatically allowed back in). Check outbound rules aren't locked down (default SGs allow all outbound, but this is often tightened later) and inbound rules allow what's needed.
5. **OS-level firewall** — `iptables`/`firewalld` running inside the instance itself can independently block traffic regardless of what AWS-level config says.
6. **DNS resolution** — sometimes "no internet" is actually "no DNS": check VPC DNS settings and whether `curl <an IP directly>` works even when `curl google.com` doesn't.
7. **Elastic IP association** — confirm the public IP shown is actually correctly associated and not stale/detached.

## 4. Mental Model

> Think of it as a chain of bouncers between your instance and the internet: the Internet Gateway (front door of the building), the route table (the signpost telling your floor how to reach that door), the NACL (a stateless bouncer at the building entrance who checks both directions separately), the Security Group (a stateful bouncer at your apartment door who remembers who you let out), and the OS firewall (a lock on the room itself). A "no" from *any* of them looks identical from inside the room.

## 5. How I'd Answer This In An Interview

"I'd check top-down: does the route table send `0.0.0.0/0` to an attached Internet Gateway; do the NACL rules allow the traffic in *both* directions since NACLs are stateless; does the Security Group allow the outbound (and inbound, if relevant) traffic since SGs are stateful; and finally whether the instance's own OS firewall is blocking it. I'd also check DNS resolution separately, since 'no internet' sometimes really means 'no DNS.'" — walking through layers methodically, rather than guessing, is what interviewers are actually listening for.

## 6. Production Reality

For instances that need **outbound-only** internet access (e.g., pulling OS updates or packages) without being publicly reachable from the internet, the correct pattern is a **private subnet + NAT Gateway**, not giving the instance a public IP at all. A public IP + IGW route is for instances that genuinely need to be reachable *from* the internet.

## 7. Trade-offs

Public subnet + IGW is simple but exposes the instance to direct internet-facing risk (must be locked down carefully at the SG/NACL/OS level). Private subnet + NAT Gateway costs a bit more and adds a hop, but keeps the instance itself unreachable from outside while still allowing it to reach out.

## 8. Common Mistakes

- Assuming "has a public IP" automatically means "has internet access" — these are two independent facts; the IP is just an address, the *route* is what makes it reachable.
- Confusing Security Groups (stateful, instance-level) with NACLs (stateless, subnet-level, need explicit rules for both directions) — a very common interview trip-up.
- Putting an instance that only needs outbound access directly in a public subnet with a public IP, instead of using a NAT Gateway from a private subnet.

## 9. 🧠 Remember

> A public IP is just an address — internet access requires the whole chain: Internet Gateway attached, route table pointing to it, NACL and Security Group both allowing the traffic in both directions, and the OS not blocking it itself.

## 10. Quick Self-Test

1. What's the practical difference between a Security Group and a Network ACL, and why does that difference matter for troubleshooting?
2. Why would an instance with a public IP still have zero internet access if the route table is missing a `0.0.0.0/0` route?
3. What's the correct architecture for an instance that needs outbound internet access but should never be reachable from outside?
</script>
<script type="text/markdown" class="lesson-data" data-id="09" data-title="JWT Logout Invalidation" data-category="Auth & Security" data-order="9">
# JWT Is Stateless - So How Does Logout Actually Work?

## 1. Story

You built login with JWT. The whole pitch was: no server-side session storage, no database lookup per request — the server just verifies the token's signature and expiry, and trusts what's inside. Fast, scalable, stateless.

Then someone clicks **Logout**. And you realize: the server never "remembers" issuing this token in the first place. So how do you make it stop working?

## 2. The Problem

The entire performance benefit of JWT comes from the server **not** checking a database or session store on every request. But "invalidate this specific token right now" is inherently a stateful operation — you're asking the server to remember something it deliberately designed itself not to remember.

## 3. Why This Problem Exists

**Term: Statelessness** here specifically means "the server can verify the token's validity using only cryptography (signature) and the token's own claims (expiry), without a lookup." Statelessness was never meant to be absolute — it's a deliberate trade of *revocability* for *scalability*. Real systems need some of that revocability back, so they reintroduce a small, controlled amount of state.

## 4. The Solution — Four Real Patterns (Used Together in Practice)

**Pattern 1 — Short-lived access token + revocable refresh token (the standard production approach).** The access token (used on every API call) has a short TTL, e.g. 15 minutes. The refresh token (used only to mint new access tokens) is longer-lived but stored server-side (DB/Redis), so it **can** be revoked. On logout: delete both tokens client-side, and delete/invalidate the refresh token server-side. The stolen/old access token is still technically valid for at most 15 more minutes — an accepted, bounded risk window.

**Pattern 2 — Blocklist (denylist) in a fast store.** On logout, store the token's unique ID (`jti` claim) in Redis with a TTL equal to the token's *remaining* validity. Every request checks "is this `jti` blocklisted?" before trusting it. This reintroduces one stateful check — but it's a cheap Redis lookup, and you only ever store *revoked* tokens, not every active one.

**Pattern 3 — Token versioning ("logout everywhere").** Store a `tokenVersion` (or `lastLogoutAt`) per user in the database. Include that version as a claim in the JWT at issue time. On every request, compare the token's version against the current value stored for that user; bump the stored version on logout (or password change) to instantly invalidate *every* previously issued token for that user, without tracking individual tokens.

**Pattern 4 — Client-side only deletion (weakest, only safe with very short expiry).** Just delete the token from browser storage. It remains cryptographically valid until it naturally expires — acceptable only if that window is very short and the token was never exposed.

## 5. Mental Model

> "Stateless" is a spectrum, not an absolute. Pure stateless JWT trades away revocability for pure speed. To get revocation back, you reintroduce state — but only a *small* amount, checked cheaply, not a full session lookup for every request.

## 6. Flow

```mermaid
sequenceDiagram
  participant U as User
  participant A as App Server
  participant R as Redis (blocklist / refresh store)

  U->>A: Login
  A-->>U: access token (15 min) + refresh token (7 days, stored in R)
  U->>A: API calls with access token (no DB/Redis check needed - fast path)
  U->>A: Logout
  A->>R: Delete refresh token
  A->>R: SETEX jti <ttl = remaining access token life>
  Note over U,A: Old access token, if reused before expiry:
  U->>A: API call with old access token
  A->>R: is jti blocklisted?
  R-->>A: yes
  A-->>U: 401 Unauthorized
```

## 7. Code Example

```javascript
// On logout: blocklist the current access token's jti until it would
// have expired anyway - never store it longer than that
async function logout(req, res) {
  const { jti, exp } = req.user; // decoded from the JWT
  const ttlSeconds = exp - Math.floor(Date.now() / 1000);
  if (ttlSeconds > 0) {
    await redis.setex(`blocklist:${jti}`, ttlSeconds, '1');
  }
  await refreshTokenStore.delete(req.user.refreshTokenId);
  res.clearCookie('refreshToken');
  res.json({ message: 'Logged out' });
}

// On every request: one cheap Redis check before trusting the JWT
async function authMiddleware(req, res, next) {
  const payload = verifyJwtSignatureAndExpiry(req.headers.authorization);
  const revoked = await redis.get(`blocklist:${payload.jti}`);
  if (revoked) return res.status(401).json({ error: 'Token revoked' });
  req.user = payload;
  next();
}
```

## 8. Production Reality

The blocklist entry's TTL must match the token's *remaining* validity exactly — otherwise entries either expire too early (letting a revoked token work again) or pile up forever (defeating the point of a lightweight check). For "log out of all devices" or "invalidate everything after a password change," token versioning is architecturally cleaner than trying to blocklist every individual token a user ever had.

## 9. Trade-offs

| Approach | Revocation speed | Cost |
|---|---|---|
| Pure stateless JWT | Never (until natural expiry) | Zero — fastest, no lookups |
| Short access + revocable refresh | Bounded by access token TTL (e.g. 15 min) | Low — one store, checked only at refresh time |
| Redis blocklist | Immediate | One cheap lookup per request |
| Token versioning | Immediate, per-user, all tokens at once | One lookup per request, but simpler data model |

## 10. Common Mistakes

- Believing JWT is "fully stateless" and therefore concluding logout simply can't be done properly — leads to either ignoring the security gap or overcorrecting.
- Storing every single issued token in the database to "solve" this — this defeats the entire performance purpose of using JWT in the first place; only store *revoked* tokens, and only until they'd have expired anyway.

## 11. 🧠 Remember

> You can't truly invalidate a stateless JWT before it expires without adding some state back — the practical answer is short-lived access tokens plus a revocable refresh token (or a lightweight Redis blocklist), so you regain control without giving up JWT's scalability everywhere.

## 12. Quick Self-Test

1. Why does storing every issued token in a database defeat the purpose of using JWT?
2. Why must a blocklist entry's TTL match the token's remaining validity rather than some fixed long TTL?
3. If a user changes their password, which pattern (blocklist vs. token versioning) more cleanly invalidates every device they were logged into, and why?
</script>
<script type="text/markdown" class="lesson-data" data-id="10" data-title="Clock Skew and Last-Write-Wins" data-category="Distributed Systems" data-order="10">
# Why the "Older" Write Wins in a Distributed Database

## 1. Story

Your app runs across two data centers — Mumbai and Virginia — both able to accept writes to the same user row (an active-active, multi-region setup). A user updates their profile bio from Mumbai. Three seconds later, they update it again from a session that happens to hit the Virginia server. You check the database afterward, and the **first** edit is what stuck — the newer one is gone. No bug in your code, no failed request, no error logged anywhere.

## 2. The Problem

In a multi-master (active-active) database, two servers can accept writes to the same row independently, with no coordination between them at write time. Something has to decide which write "wins" when they conflict. A very common, simple strategy is:

**Term: Last-Write-Wins (LWW)** — when two writes conflict, keep whichever one carries the **highest timestamp**, discard the other.

Simple — as long as the timestamps actually reflect real-world order. They often don't.

## 3. Why This Happens

Timestamps in LWW are usually the **wall-clock time** of whichever machine (client or server) handled the write. Machines' clocks are synchronized via NTP, but NTP only *minimizes* drift — it doesn't eliminate it. Cross-continent clock skew of tens of milliseconds is normal, and under network issues, VM pauses, or GC stalls, it can be much worse.

So: if Virginia's clock is running a few seconds **behind** real time, the write that objectively happened *later* gets stamped with a timestamp that looks *earlier* than Mumbai's write. LWW compares the stamps, not the real order of events — and keeps the wrong one.

> **This is one of the most important lessons in distributed systems: there is no single global "now."** Two machines can never be perfectly certain which of them did something first, purely from wall-clock time.

## 4. Mental Model

Think of two people in different time zones each writing a diary entry, each glancing at a slightly-wrong wristwatch to timestamp it. If you later sort the diary entries purely by the number written on them, you might sort them in the wrong real-world order — the watches disagreeing is invisible until you compare them to real events.

## 5. The Real Solutions

- **Logical / Lamport clocks** — instead of physical time, track a counter that increments on every event and is passed along with messages, capturing *causality* ("did this event know about that one?") rather than physical time.
- **Vector clocks** — an extension that tracks per-node counters, letting a system detect true concurrent conflicts (neither caused the other) instead of forcing a single winner.
- **CRDTs (Conflict-free Replicated Data Types)** — data structures designed to merge concurrent updates automatically and consistently, without needing to pick a "winner" at all.
- **Bounded-uncertainty physical clocks** — Google Spanner's TrueTime uses GPS + atomic clocks and explicitly tracks clock *uncertainty*, waiting out the uncertainty window before committing, to get correct global ordering from physical time itself (an unusually heavy, infrastructure-level solution).
- **Single-owner routing** — for a given key, route all writes to one designated region/leader, avoiding true multi-master conflicts for that key entirely.

## 6. Flow

```mermaid
sequenceDiagram
  participant M as Mumbai server (clock +2s fast)
  participant V as Virginia server (clock -1s slow)
  participant DB as Replicated row

  Note over M: Real time T=0: user writes bio="A"
  M->>DB: write bio="A", timestamp=T+2 (clock is fast)
  Note over V: Real time T=3: user writes bio="B" (actually newer!)
  V->>DB: write bio="B", timestamp=T+2 (clock is slow, looks equal/earlier)
  Note over DB: LWW compares timestamps, not real time.<br/>Result can keep "A" even though "B" happened later.
```

## 7. Production Reality

Cassandra and DynamoDB Global Tables both use LWW by default for multi-region conflict resolution — this is a well-known, documented trade-off, not a bug in those systems. Teams building on them need to explicitly decide: is losing a rare conflicting write acceptable for this data (often yes, e.g. "last profile picture wins"), or does this field need stronger guarantees (route writes for that key to one region, or use an app-level merge strategy)?

## 8. Trade-offs

| | Last-Write-Wins | Logical/Vector Clocks or CRDTs |
|---|---|---|
| Coordination cost | None — fast, available even during partitions | Some bookkeeping overhead, more complex merge logic |
| Correctness | Can silently lose a write | Correctly captures causality or merges automatically |
| Simplicity | Very simple to implement | More moving parts |

## 9. Common Mistakes

- Assuming NTP-synced clocks are "close enough" that timestamp order always matches real event order — it's close, not exact, and exact is what LWW correctness actually needs.
- Using LWW for data where silently losing an update is unacceptable (e.g. financial balances) instead of a consensus-based or single-leader-per-key approach.

## 10. 🧠 Remember

> In distributed systems, don't trust wall-clock time to decide what happened first across machines — clock skew means the write timestamped later doesn't always happen later. Use logical clocks, causality tracking, or a single source of truth for ordering when correctness matters.

## 11. Quick Self-Test

1. Why can NTP-synced clocks still disagree enough to break "last write wins" correctness?
2. What's the difference between a physical clock timestamp and a logical (Lamport) clock value?
3. Name one alternative to LWW that avoids relying on wall-clock time for conflict resolution.
</script>
<script type="text/markdown" class="lesson-data" data-id="11" data-title="What Is an API, Really?" data-category="Core Concepts" data-order="11">
# What Exactly Is an API? (It's Not a Framework or a Library)

## 1. Story

You keep hearing "API" everywhere — "use this API," "build an API," "connect to an API." You open Express.js docs and see the word. You open the Stripe docs and see the word. You look at a Python library's docs and see the word again. Each time it seems to mean a slightly different *thing*, so you start to wonder: is an API a framework? A library? A URL? A piece of software you install?

## 2. The Problem

The confusion is understandable, because "API" isn't a specific technology — it's a **concept** that gets implemented in wildly different concrete forms, so it looks different every time you meet it.

## 3. The Solution

**Term: API (Application Programming Interface)** — a defined **contract** that says "here is how you're allowed to ask me to do something, and here is what you'll get back," without you ever needing to know how it's implemented internally.

That's it. It's not a tool. It's the *boundary* between "what you can ask for" and "how it actually gets done." That boundary shows up in many forms:

- **A library's public functions** — an in-process API. `requests.get(url)` in Python is the API of the `requests` library — you call the function, you don't need to know how it opens a TCP socket underneath.
- **A web/HTTP API** — a network contract. Stripe's REST API says "send an HTTP POST to this URL with this JSON shape, you'll get this JSON response back" — you never see their servers, database, or code.
- **An OS-level API** — system calls your program makes to the operating system kernel.
- **A hardware/driver API** — how software talks to a printer or GPU without knowing its internal electronics.

When someone says **"build an API"** they almost always mean specifically: build a network-accessible (usually HTTP) contract that other programs can call. When they say **"use this API,"** they mean: call these predefined functions/endpoints and trust the contract, don't worry about the internals.

## 4. Mental Model

> An API is a restaurant menu, not the kitchen. You (the client) order from a fixed menu (the interface) and a waiter (the interface layer) brings back your food. The kitchen can completely change its staff, recipes, and equipment (the internal implementation) as long as the menu (the contract) stays the same — you, the customer, never notice or need to care.

**Framework vs. Library vs. API — the actual distinction:**

| Term | What it actually is | Example |
|---|---|---|
| **Framework** | A structure/toolset that dictates how you build your app; it calls your code | Express, Django, Spring |
| **Library** | Reusable code you call directly, in-process, on your own terms | axios, Lodash, `requests` |
| **API** | The contract itself — what you're allowed to ask, what you'll get back | The `/v1/charges` endpoint of Stripe; the `.get()` method of a library |

A framework **helps you build** an API. A library **has** an API (its public functions). Neither one *is* an API by itself — the API is the promise, not the machinery behind it.

## 5. How It Works / Flow

```mermaid
flowchart LR
  subgraph Library API - in-process
    A[Your code] -->|function call| B[Library's public function]
  end
  subgraph Web API - over the network
    C[Client app] -->|HTTP request| D[Server's defined endpoint]
    D -->|HTTP response - JSON| C
  end
```

## 6. Code Example

```javascript
// LIBRARY API: an in-process contract - call it directly, no network involved
const axios = require('axios');
const data = await axios.get('/local-cache'); // this call IS the library's API

// WEB API: a network contract - defined with a framework (Express), but
// Express itself is not the API - the routes YOU define are the API
app.get('/v1/users/:id', (req, res) => {
  res.json({ id: req.params.id, name: 'Priya' }); // this shape IS your API's contract
});
```

## 7. Production Reality

An API is a **promise to your callers**. Once other teams or external customers depend on it, changing the response shape or removing a field silently breaks every consumer without warning. This is why production APIs use:

- **Versioning** (`/v1/`, `/v2/`) so you can change the contract without breaking existing callers.
- **Documentation** (OpenAPI/Swagger) so the contract is explicit and machine-readable.
- **Backward compatibility** discipline — adding fields is usually safe, removing or renaming them isn't.

## 8. Trade-offs / Styles

REST, GraphQL, and gRPC are just different **styles** of exposing a web API — different shapes for the same underlying concept (a contract between client and server). REST is simple and cache-friendly; GraphQL lets clients ask for exactly the fields they need; gRPC is fast and strongly-typed, common between internal microservices.

## 9. Common Mistakes

- Calling Express.js itself "an API" — Express is a **framework** that helps you *build* an API. The actual API is the specific set of routes and response shapes you define with it.
- Changing an existing endpoint's response shape without versioning, silently breaking every client that was relying on the old contract.

## 10. 🔗 Connection to Other Concepts

This directly connects to [[07-cors-error-fix]] — CORS is entirely about a browser deciding whether it's allowed to call a **web API** across origins; the "API" there is exactly this contract concept. It also connects to [[09-jwt-logout-invalidation]] — the JWT itself is part of an API's authentication contract.

## 11. 🧠 Remember

> An API is a contract, not a technology. A framework helps you build one, a library is code you call directly, but the API itself is simply the agreed-upon way to ask for something without needing to know how it's made.

## 12. Quick Self-Test

1. Is Express.js an API? Why or why not?
2. What's the mechanical difference between calling a library's API and calling a web API?
3. Why does changing an API's response shape without versioning break things for everyone who depends on it?
</script>
<script type="text/markdown" class="lesson-data" data-id="12" data-title="Surviving an Availability Zone Failure" data-category="Cloud & Infrastructure (AWS)" data-order="12">
# Surviving an Availability Zone Failure

## 1. Story

Your application runs entirely in one Availability Zone — say `us-east-1a`. It's midnight, everything's calm, no bad deploy, no traffic spike, no code bug — and then that entire AZ goes dark. Power event, network partition, whatever the cause: the physical building/network segment your servers live in is simply gone. This has genuinely happened to real AWS regions before.

Recall from [[06-ec2-autoscaling]]: an Auto Scaling Group can add or remove EC2 instances automatically based on load. But if that ASG's subnets only exist in **one** AZ, all those instances — even 20 of them — vanish together the moment that AZ fails. Auto Scaling protects you from *load*. It does nothing for a *whole data center disappearing*.

## 2. The Problem

A single AZ is a single point of failure for everything physically tied to it — power, networking hardware, the physical building. "We have redundancy, we run multiple EC2 instances" doesn't help at all if every one of those instances sits in the exact same AZ.

## 3. The Solution — Design for Multi-AZ From the Start

- **Multi-AZ Auto Scaling Group**: configure the ASG's subnets to span at least 2 (ideally 3) AZs in the region. The ASG automatically balances instances across all of them.
- **Application Load Balancer across AZs**: the ALB itself spans multiple AZs and health-checks instances in each. If every instance in one AZ fails its health check, the ALB simply stops routing there and sends 100% of traffic to the surviving AZs — no manual intervention needed.
- **RDS Multi-AZ deployment**: a synchronously-replicated standby database instance lives in a *different* AZ. If the primary's AZ fails, AWS automatically fails over to the standby (via a DNS endpoint swap), typically within 60-120 seconds — a brief blip, not a full outage.
- **Stateless application tier** (same prerequisite as Auto Scaling in [[06-ec2-autoscaling]]): any instance in any AZ must be able to serve any user, meaning sessions live in a shared, Multi-AZ cache (ElastiCache replication group), not on the local instance.
- **S3 assets**: already durably multi-AZ by default — no action usually needed, though Cross-Region Replication exists for even stronger, region-level guarantees.

## 4. Mental Model

> Run the same restaurant in three different buildings across town, all serving from the same menu (API contract) and the same reservation system (shared data layer). If one building loses power, the host (load balancer) simply stops sending guests there — the other two keep serving, and the customer never notices.

## 5. Flow

```mermaid
flowchart TB
  Users --> ALB[Application Load Balancer<br/>spans all AZs]
  subgraph AZ-a
    E1[EC2 instance]
    E2[EC2 instance]
    RDSp[(RDS Primary)]
  end
  subgraph AZ-b
    E3[EC2 instance]
    E4[EC2 instance]
    RDSs[(RDS Standby - sync replica)]
  end
  ALB --> E1
  ALB --> E2
  ALB --> E3
  ALB --> E4
  RDSp -.synchronous replication.-> RDSs
  RDSp -.automatic failover on AZ-a outage.-> RDSs
```

## 6. How I'd Answer This in an Interview

1. **Name the single point of failure explicitly**: "A single AZ means the entire app is one power or network failure away from total downtime — no amount of horizontal scaling *within* that AZ changes that."
2. **Compute tier**: Multi-AZ ASG + ALB — instances spread across AZs, load balancer routes only to healthy ones.
3. **Data tier**: RDS Multi-AZ (or a naturally distributed database) — explain the mechanism: synchronous replication to a standby in another AZ, automatic DNS-based failover.
4. **Cache/session tier**: Multi-AZ ElastiCache replication group, so a cache tier loss doesn't take down sessions either.
5. **Tie it back**: none of this works unless the app is already stateless — the same prerequisite as basic Auto Scaling.
6. If pushed further: mention Route 53 health checks and multi-**region** failover as the next level up, for surviving a whole-region outage, not just one AZ.

## 7. Production Reality

RDS Multi-AZ failover isn't instant — expect roughly 60-120 seconds of write unavailability during the DNS cutover. Applications should retry transient database connection errors during that window with backoff, rather than surfacing a hard failure to the user immediately.

## 8. Trade-offs

Multi-AZ roughly doubles the cost of the compute and database tiers (extra instances, a mostly-idle standby database) in exchange for eliminating a real, historically-proven failure mode. For anything customer-facing or revenue-generating, this is almost always worth the cost — for an internal, low-stakes tool, single-AZ with fast recovery tooling might be an acceptable trade instead.

## 9. Common Mistakes

- Believing "we have an Auto Scaling Group, so we're resilient" without checking whether that ASG's subnets actually span multiple AZs — a surprisingly common real-world misconfiguration that looks fine until the day one AZ fails.
- Forgetting the database tier entirely and only making the compute tier Multi-AZ — a resilient app tier still goes down hard if its single-AZ database disappears.

## 10. 🧠 Remember

> Auto Scaling protects you from load; Multi-AZ protects you from an entire data center disappearing — you need both, because more instances in one dying building doesn't help.

## 11. Quick Self-Test

1. Why doesn't having 20 EC2 instances protect you from an AZ outage if they're all in one AZ?
2. What actually happens, mechanically, when RDS Multi-AZ fails over?
3. Why must the application already be stateless before Multi-AZ architecture can actually help?
</script>
<script type="text/markdown" class="lesson-data" data-id="13" data-title="Hidden Latency Bottleneck (3s Response, Healthy Metrics)" data-category="Production Debugging &amp; Incidents" data-order="13">
# Your API Takes 3 Seconds, But Every Metric Is Healthy

## 1. Story

An endpoint takes 3 seconds to respond. You check the dashboards: CPU is at 20%, memory at 30%, the database reports healthy with fast query times. You add more servers. Still 3 seconds. You spend a day optimizing the code — tightening loops, removing redundant logic. Still 3 seconds, to the millisecond.

## 2. The Problem

Every obvious lever you pulled targets **computation**: more servers (more compute capacity), leaner code (less compute work), a healthy database (fast data access). None of them touched the actual bottleneck, because none of them measure the one thing that's actually happening: **waiting**.

CPU and memory graphs only show you what's happening *while your code is running*. They show nothing about time your code spends **parked**, waiting for a network response from somewhere else.

## 3. Why This Is Hiding "In Plain Sight"

Recall [[01-concurrency-vs-parallelism]]: I/O-bound work means the CPU is free while waiting — that's *precisely* why this bottleneck produces 20% CPU. The server isn't struggling; it's idle, patiently waiting on a network call. Waiting produces no CPU spike, no memory pressure, and no database slowdown — so every standard resource dashboard reports "healthy" while the user still waits 3 full seconds.

The most common concrete cause: your endpoint calls several downstream dependencies (other internal services, or a third-party API) **sequentially** — `await`-ing one, then the next, then the next — instead of running the independent ones concurrently.

```
Auth service:      800ms  ┐
Inventory service:  700ms  ├─ awaited one after another = 3000ms total
Pricing service:    900ms  │
Recommendations:    600ms  ┘
```

## 4. The Solution

**If the calls are independent** (none needs another's result), run them concurrently instead of sequentially — total time becomes the *slowest single call*, not the *sum* of all of them.

**If one specific external dependency is unavoidably slow** (e.g. a third-party fraud-check API), consider:
- **Caching** its result if it doesn't need to be fetched fresh on every request.
- **A strict timeout + circuit breaker**, so a flaky dependency can't silently become "your" latency indefinitely.
- **Making it asynchronous** — return a fast initial response and complete the slow part via a webhook or a polling endpoint, instead of blocking the user for the full duration.

## 5. Mental Model

> Three seconds of *waiting* looks identical to three seconds of *computing* from the outside — but they need completely different fixes. If your resource graphs are all green, you're not computing. You're waiting on somebody else.

## 6. Flow

```mermaid
sequenceDiagram
  participant C as Client
  participant A as Your API
  participant S1 as Auth Service
  participant S2 as Inventory Service
  participant S3 as Pricing Service

  Note over A,S3: BEFORE — sequential (3.0s total)
  C->>A: request
  A->>S1: await (0.8s)
  S1-->>A: ok
  A->>S2: await (0.7s)
  S2-->>A: ok
  A->>S3: await (0.9s)
  S3-->>A: ok
  A-->>C: response (~3s later)

  Note over A,S3: AFTER — concurrent (~0.9s total)
  C->>A: request
  par
    A->>S1: call
  and
    A->>S2: call
  and
    A->>S3: call
  end
  A-->>C: response (~0.9s, the slowest call)
```

## 7. Code Example

```javascript
// BEFORE: sequential - total time = sum of every call
async function getOrderSummary(userId) {
  const auth = await authService.verify(userId);       // 0.8s
  const inventory = await inventoryService.get(userId); // 0.7s
  const pricing = await pricingService.get(userId);     // 0.9s
  return { auth, inventory, pricing };                  // ~2.4s+ total
}

// AFTER: concurrent - total time = the slowest single call
async function getOrderSummary(userId) {
  const [auth, inventory, pricing] = await Promise.all([
    authService.verify(userId),
    inventoryService.get(userId),
    pricingService.get(userId),
  ]);
  return { auth, inventory, pricing }; // ~0.9s total
}
```

## 8. Production Reality

This exact bug survives both horizontal scaling and code optimization sprints indefinitely, because neither lever touches it — which is exactly why teams often burn days chasing the wrong fix. The tool that actually makes it visible is **distributed tracing** (a timeline/Gantt view of every downstream call's start and end time for one request) — not a CPU/memory dashboard.

## 9. Trade-offs

- Running calls concurrently increases the **peak simultaneous load** each request places on downstream services (all N calls fire at once instead of trickling in) — worth confirming those services can handle that burst.
- Caching introduces staleness risk.
- Async/webhook patterns add complexity: the client now has to poll or receive a callback instead of getting one synchronous answer.

## 10. Common Mistakes

- Treating "scale more" and "optimize the code" as the only two categories of performance problem, and never considering the third, very common one: sequential I/O-bound waiting on external dependencies.
- Not having distributed tracing in place, so this exact class of bug is invisible until someone manually reads through logs correlating timestamps.

## 11. 🔗 Connection to Other Concepts

This is a direct, concrete application of [[01-concurrency-vs-parallelism]]: independent I/O-bound work that should overlap concurrently but is instead running one-after-another. It also connects to [[02-debugging-random-500-errors]]'s checklist item "check downstream dependencies" — the same instinct applies here even though this isn't an error, just unexplained latency.

## 12. 🧠 Remember

> If CPU, memory, and the database are all healthy but the response is still slow, you're not computing — you're waiting. Look at what your request is calling in sequence, not what it's calculating.

## 13. Quick Self-Test

1. Why does adding more servers not fix a single request's 3-second latency?
2. Why does optimizing your own code not help if the bottleneck is a downstream call?
3. If three independent downstream calls each take about 1 second, what's the fastest total time you could achieve, and how?
</script>
<script type="text/markdown" class="lesson-data" data-id="14" data-title="Root Cause Fixed, Still Down (Cascading Failure)" data-category="Production Debugging &amp; Incidents" data-order="14">
# The Root Cause Is Fixed. Why Won't the System Recover?

## 1. Story

Your payment gateway (a downstream dependency) has a network blip and slows down for 20 seconds. Alerts fire. You escalate. The provider confirms and fixes it. The root cause is gone.

But your own service's error rate and latency stay elevated for several more minutes — sometimes worse than during the original 20-second blip. Traffic is completely normal; there's no new spike. So what's actually keeping it down?

## 2. The Problem

Fixing the trigger stops **new** damage. It does nothing to undo the side effects your own system already created *during* those 20 seconds — and those side effects can be self-sustaining, meaning they keep the system unhealthy on their own, independent of whether the original cause is still present.

## 3. The Hidden Culprits (Often Several at Once)

**Term: Retry storm** — during the slowdown, calls to the dependency timed out and were retried, sometimes multiple times per original request. That backlog of retries doesn't vanish the instant the dependency recovers — it's still queued up, still hammering the now-healthy service, keeping it artificially saturated in a loop it can't easily escape.

**Thread / connection pool exhaustion** — every call to the slow dependency held a thread or connection for the *full* 20 seconds (blocking). A limited-size pool fills up fast under that condition and, even after the dependency speeds back up, has to drain a backlog far deeper than normal, one request at a time — recovering far more slowly than the outage that caused it.

**Term: Thundering herd** — everyone who was failing or waiting retries at roughly the same moment the dependency becomes healthy again, producing an instant burst well above normal traffic, right when the system is least able to absorb it. This burst can be enough to re-trigger the exact same slowdown, making it look like "it never actually recovered."

**A poorly designed circuit breaker** — if the breaker's half-open trial requests hit the fresh flood of retries and backlog, they fail, sending the breaker back to "open" — round and round, extending the outage far past the original cause.

## 4. Mental Model

> A fire being extinguished doesn't mean the smoke clears instantly. The backlog and the panic (retries) it left behind are now their own separate fire — and it needs its own extinguishing, not just confirmation that the match is out.

## 5. Flow

```mermaid
flowchart TB
  A["0-20s: Dependency slows down"] --> B["Callers time out and retry<br/>(often multiple times each)"]
