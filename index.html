  A["0-20s: Dependency slows down"] --> B["Callers time out and retry<br/>(often multiple times each)"]
  B --> C["Thread/connection pool fills with<br/>stuck, blocked calls"]
  C --> D["20s: Root cause fixed -<br/>dependency is healthy again"]
  D --> E["Retry backlog + thundering herd<br/>hit it all at once"]
  E --> F{"Can it absorb the burst?"}
  F -->|No| A
  F -->|Yes, with backoff + shedding| G[Actually recovers]
```

## 6. The Solution — Recovery Needs Its Own Design, Not Just a Root-Cause Fix

- **Exponential backoff with jitter** on retries — spreads retry attempts out over time instead of every client retrying at the exact same instant, which is what directly causes a thundering herd.
- **Circuit breakers** — fail fast during an outage instead of piling up blocked/retrying calls in the first place, then probe recovery cautiously with a small trickle of test traffic before fully reopening (rather than an all-at-once flood).
- **Bounded queues + backpressure** — a queue that can grow without limit during an incident just delays the pain; return a fast `503`/`429` once capacity is exceeded instead of endlessly queuing work that will time out anyway.
- **The Bulkhead pattern** — give each downstream dependency its own separate, bounded thread/connection pool, so one slow dependency exhausting its pool can't also starve unrelated, healthy code paths that share the same pool.
- **Deliberate load shedding during recovery** — intentionally drop or delay some requests rather than trying to process the full backlog plus fresh traffic simultaneously, which can prolong recovery indefinitely.

## 7. Code Example

```javascript
// Exponential backoff WITH jitter - prevents every client retrying in lockstep
async function callWithBackoff(fn, attempt = 0) {
  try {
    return await fn();
  } catch (err) {
    if (attempt >= 5) throw err;
    const base = Math.min(1000 * 2 ** attempt, 30000);
    const jitter = Math.random() * base * 0.5; // spreads retries out over time
    await sleep(base + jitter);
    return callWithBackoff(fn, attempt + 1);
  }
}

// Circuit breaker sketch: fail fast, then trickle-test before fully reopening
class CircuitBreaker {
  state = 'closed'; // closed -> open -> half-open -> closed
  failures = 0;
  async call(fn) {
    if (this.state === 'open') throw new Error('circuit open - failing fast');
    try {
      const result = await fn();
      if (this.state === 'half-open') this.state = 'closed'; // trial succeeded
      this.failures = 0;
      return result;
    } catch (err) {
      this.failures++;
      if (this.failures >= 5) this.state = 'open';
      throw err;
    }
  }
}
```

## 8. Production Reality

This is exactly why "root cause identified and fixed" and "service fully recovered" are tracked as two **separate** milestones in real incident timelines. Teams often have to actively intervene during recovery — temporarily blocking or shedding traffic, manually draining queues, ramping allowed traffic back up gradually — to actually end an incident, even though the original trigger is long gone.

## 9. Trade-offs

Circuit breakers and backoff add real complexity, and a misconfigured breaker (too sensitive or too lax) can create its own failure modes. Deliberate load shedding during recovery intentionally sacrifices some requests' experience to protect the system as a whole — a conscious, visible trade-off, not a silent bug.

## 10. Common Mistakes

- Assuming "root cause fixed" means "incident over," and standing down right as the phase that actually needs the most careful handling — the self-inflicted backlog and thundering herd — begins.
- Using plain exponential backoff without jitter, which still causes every client to retry in near-lockstep, reproducing the thundering herd anyway.
- Sharing one thread/connection pool across multiple downstream dependencies, so one slow dependency can starve calls to completely unrelated, healthy services.

## 11. 🔗 Connection to Other Concepts

This builds directly on the load-shedding ideas from [[04-handling-traffic-spike-15k-rps]] and the "check downstream dependencies" step from [[02-debugging-random-500-errors]] — but adds a new dimension: the danger isn't just the dependency being slow, it's the system's own reaction to that slowness outliving the slowness itself.

## 12. 🧠 Remember

> Fixing the root cause stops new damage, but the retries and backlog created during the outage can keep the system down long after — recovery needs backoff, circuit breakers, and deliberate load shedding, not just a fixed root cause.

## 13. Quick Self-Test

1. Why can a system stay unhealthy even after the original slow dependency is fully fixed?
2. What is a "thundering herd" in this context, and what specifically causes it?
3. Why does jitter make exponential backoff meaningfully better, not just cosmetically different?
4. What problem does the Bulkhead pattern solve that a circuit breaker alone doesn't?
</script>
<script type="text/markdown" class="lesson-data" data-id="15" data-title="Simple vs Scalable Architecture (10K Users)" data-category="System Design at Scale" data-order="15">
# Which Architecture Would You Ship: Simple or Scalable?

## 1. Story

You're given two options for a product expecting 10,000 users.

**Architecture A**: `User -> API -> Database`. Simple, cheap, easy to maintain.

**Architecture B**: `User -> CDN -> Load Balancer -> API -> Redis -> Database`. Scalable, fast, complex.

Which one do you ship?

## 2. The Problem

Most people answer this by gut feeling — "B looks more professional/scalable, ship B" or "A is simpler, always start simple, ship A." Both answers, given *without asking a question first*, are actually wrong, because the question is missing the one number that decides everything.

## 3. The Missing Question: What Does "10,000 Users" Actually Mean?

"10,000 users" is ambiguous in a way that changes the entire answer:

- **10,000 total registered users** (lifetime signups) — even with generous usage, this could easily mean single-digit to low-double-digit requests per second at peak. A single well-configured server and a managed database handle this without breaking a sweat.
- **10,000 concurrent users** (all active at the same moment) — this is a very different load profile, likely hundreds to low-thousands of requests per second, where a single API instance and a single database connection pool genuinely start to strain.
- **10,000 requests per second** — this is Architecture B territory almost regardless of user count; a single API server cannot realistically absorb this alone.

**The correct first move in this interview isn't picking A or B — it's asking which of these three "10,000 users" actually means.** That single clarifying question is often what separates a strong system design answer from a guess.

## 4. The Solution — Reasoned By Actual Requirement

**If it's 10,000 total users** (the common, realistic reading for an early-stage product): ship **Architecture A**. A single API server plus a managed database (with its own built-in redundancy) can handle this comfortably. Architecture B's CDN, load balancer, and Redis cache all solve problems — origin overload, single-server capacity limits, repeated expensive database reads — that **don't exist yet** at this scale. Building them anyway means paying real cost (money, operational complexity, more failure points, slower iteration speed) for a problem you don't have.

**If it's 10,000 concurrent users or a high request rate**: ship **Architecture B**. At that load, a single API instance is a real bottleneck (needs a load balancer to spread traffic across multiple instances — see [[06-ec2-autoscaling]]), repeated database reads for the same data become expensive at volume (needs Redis), and static/cacheable content should never hit your origin server at all (needs a CDN).

## 5. Mental Model

> Ship the architecture that matches **today's actual, clarified requirement**, with a clear, cheap path to add the next piece (cache, load balancer, CDN) the moment a specific metric proves you need it — not the architecture that looks more impressive in a diagram.

## 6. Flow

```mermaid
flowchart TD
  Q{"What does<br/>'10,000 users' mean?"}
  Q -->|Total registered users| A["Ship Architecture A<br/>User -> API -> Database"]
  Q -->|Concurrent users / high RPS| B["Ship Architecture B<br/>User -> CDN -> LB -> API -> Redis -> DB"]
  A -->|"DB read load climbs,<br/>single server maxes out"| B
```

## 7. How I'd Answer This In an Interview

1. Ask the clarifying question first: "Is that 10,000 total signups, concurrent users, or requests per second? That changes my answer."
2. State the default: for a modest total-user count, the simpler architecture is not just acceptable, it's *correct* — over-building adds cost and complexity without a matching benefit yet.
3. Name the specific, measurable triggers that would justify migrating to the more complex design: sustained high database CPU/read latency, API response times degrading under real concurrent load, a single point of failure becoming an unacceptable business risk.
4. Show you know each piece of Architecture B and *why* it exists — CDN offloads static/cacheable traffic from origin, the load balancer distributes load across multiple API instances and provides failover (ties to [[06-ec2-autoscaling]] and [[12-multi-az-availability]]), Redis absorbs repeated reads so the database isn't hit for the same data over and over.

## 8. Production Reality

Real companies rarely start with Architecture B on day one — they start closer to A and add pieces of B incrementally, each addition justified by an actual, observed bottleneck (a slow endpoint, a database under load, a traffic spike that caused an incident). Building the full "scalable" stack pre-emptively is a common and expensive mistake for early-stage products.

## 9. Trade-offs

| | Architecture A | Architecture B |
|---|---|---|
| Cost | Low | Higher (CDN, LB, cache all cost money and ops time) |
| Time to ship | Fast | Slower — more moving parts to build and configure |
| Failure points | Fewer, but a single API/DB instance is a single point of failure | More components, but redundancy at each layer |
| Right for | Low-to-moderate actual load | Genuinely high concurrent load / traffic |

## 10. Common Mistakes

- **Resume-driven design**: choosing the more complex, "impressive-looking" architecture regardless of the actual requirement, because it sounds more senior.
- **The opposite mistake**: staying on Architecture A well past the point where real metrics (not guesses) clearly show it's failing — simplicity is only a virtue until the evidence says otherwise.
- Answering with a firm "A" or "B" immediately, without asking what the given scale number actually represents.

## 11. 🔗 Connection to Other Concepts

The load balancer and multi-instance scaling in Architecture B is exactly what [[06-ec2-autoscaling]] and [[12-multi-az-availability]] describe in depth — this question is really asking "when do you actually need that machinery?"

## 12. 🧠 Remember

> Ship the simplest architecture that satisfies today's actual, clarified requirements — add caching, load balancing, and a CDN only when a specific metric proves you need them, not because a diagram looks more serious.

## 13. Quick Self-Test

1. Why is "10,000 users" alone not enough information to answer this question definitively?
2. What's the first thing you should do when given an ambiguous scale number in a system design interview?
3. Name two concrete, measurable signals that would tell you it's time to move from Architecture A to Architecture B.
</script>
<script type="text/markdown" class="lesson-data" data-id="16" data-title="Synchronized Connection Pool Expiry" data-category="Production Debugging &amp; Incidents" data-order="16">
# Synchronized Connection Pool Expiry (Same Thundering Herd, Different Costume)

> **Similar-question flag**: this is the *same root pattern* as [[14-cascading-failure-recovery]] — a Thundering Herd. Last time it was retries piling up after an outage; this time it's a connection pool where everything was born together, so everything dies together. The core lesson doesn't need repeating — what's actually new here is *where* it shows up and which of the three fixes is the real one.

## 1. Story

Every 30 minutes, latency spikes for exactly 20 seconds. Traffic is flat, CPU and memory are fine, nobody deployed anything. Digging in, you find all 200 database connections in the pool were created together — and they all expire together, every 30 minutes, on the dot.

## 2. Why This Happens

Connection pools (HikariCP, pgbouncer, most JDBC/ODBC pools) are typically configured with a single **max lifetime** — e.g. "recycle every connection after 30 minutes" — to avoid stale connections. If all 200 connections were created at roughly the same moment (commonly at app startup, or when the pool first filled), they all share the same birth time, so they all hit that 30-minute lifetime at the same instant. The pool then has to close and re-establish all 200 connections in a tight burst — and queries queue up behind that churn for the ~20 seconds it takes to recover. Same disease as [[14-cascading-failure-recovery]]'s thundering herd: **many things acting in perfect synchrony create a burst the system isn't sized to absorb instantly.**

## 3. Evaluating the Three Options You Were Given

- **Change the lifetime** (e.g. 30 min -> 2 hours): this only makes the spike **less frequent**, not gone. It doesn't fix the synchronization — you'll get the exact same 20-second stall, just every 2 hours instead of every 30 minutes. Not a real fix by itself.
- **Add jitter** (the actual fix): give each connection a randomized variance on top of the base lifetime (e.g. 30 min ± a random 0-5 min per connection), so they expire at *different* moments and reconnections spread out over time instead of arriving as one burst. This is the exact same principle as "exponential backoff with jitter" from [[14-cascading-failure-recovery]], applied to connection lifetimes instead of retries.
- **Pre-warming**: establish the pool's connections gradually/staggered at startup instead of all at once. This prevents the *original* synchronization from ever happening — if they're never born in sync, they won't expire in sync 30 minutes later either.

**Best answer: do both jitter and pre-warming.** Pre-warming fixes the cause (how they were born); jitter is ongoing insurance even if something else re-synchronizes them later (e.g. a full pool restart after a deploy).

## 4. Code Example

```javascript
// HikariCP-style config: fixed lifetime = synchronized expiry risk
const badConfig = { maxLifetime: 30 * 60 * 1000 }; // all connections die together

// Jitter added: spreads expiry across a window instead of one instant
function jitteredLifetime(baseMs, jitterMs) {
  return baseMs + Math.floor(Math.random() * jitterMs);
}
const perConnectionLifetime = jitteredLifetime(30 * 60 * 1000, 5 * 60 * 1000);
```

## 5. Production Reality

This exact "synchronized expiry" pattern shows up far beyond database connections: TTL-based cache entries all set with the same expiry, cron jobs scheduled "every 30 minutes" that all started at the same deploy time, or a Kubernetes rolling restart where too many pods land on the same restart interval. Any time a fleet of things shares a fixed lifetime *and* a shared birth time, expect a periodic burst unless jitter is deliberately added.

## 6. 🧠 Remember

> Anything born together dies together, unless you add jitter — a synchronized lifetime creates a synchronized failure burst, the same thundering herd from Lesson 14 wearing a different costume.

## 7. Quick Self-Test

1. Why does simply increasing the connection lifetime not fix the underlying problem?
2. Why is doing *both* jitter and pre-warming better than picking just one?
3. Name one other place in a real system (not database connections) where this exact synchronized-expiry pattern could bite you.
</script>
<script type="text/markdown" class="lesson-data" data-id="17" data-title="Notification System Design (OneSignal-style HLD)" data-category="System Design at Scale" data-order="17">
# System Design: A Notification System Like OneSignal

## 1. Requirements

**Functional:**
- Send Push, Email, and SMS notifications.
- Support millions of users.
- Send immediately, or schedule for a future time.
- Support bulk/campaign notifications (one trigger fans out to millions of recipients).
- Retry failed deliveries.
- Avoid sending duplicate notifications.
- Respect user preferences and opt-outs.
- Track delivery, failure, and read status per notification.
- Handle traffic spikes during campaigns.
- Provide an API for other internal services to trigger notifications.

**Non-functional:**
- High throughput -- millions of notifications completing within a bounded campaign window.
- Reliability -- a triggered notification should not silently vanish; at minimum, its failure must be visible.
- Low latency for "send now" -- should feel near-instant, not minutes later.
- Elastic scalability for campaign bursts, without those bursts degrading normal "send now" traffic.
- Idempotency -- retries and at-least-once delivery must not turn into duplicate messages to the user.

## 2. Scale Estimation

Assume 50M total users, a large campaign targeting 10M of them, expected to complete within 30 minutes: 10,000,000 divided by 1800 seconds is about 5,600 notifications per second, sustained, just for that one campaign, on top of continuous individually-triggered notifications. Design the pipeline for a peak combined throughput in the tens of thousands of notifications per second. Storing delivery history at that volume (say 1 billion records per month at roughly 500 bytes each) is roughly 500 GB per month -- needs time-based partitioning and archival, not one unbounded table.

## 3. High-Level Architecture

```mermaid
flowchart TB
  Caller[Other internal services] -->|"POST notifications API - see 11-what-is-an-api"| API[Notification API]
  API --> Pref[User Preference Check]
  API --> Dedup[(Redis - idempotency check)]
  API --> Sched{Send now or later?}
  Sched -->|now| Q[Kafka - per-channel topics]
  Sched -->|later| Delay[(Delay queue - by scheduled_at)]
  Delay -->|due items, batched| Q
  Q --> PW[Push Workers]
  Q --> EW[Email Workers]
  Q --> SW[SMS Workers]
  PW --> FCM[FCM / APNs]
  EW --> SES[SES / SendGrid]
  SW --> Twilio[Twilio]
  FCM --> Status[Status Ingestion Service]
  SES --> Status
  Twilio --> Status
  Status --> DB[(Status / Delivery DB)]
```

## 4. Request Flow

1. A calling service sends a request to the Notification API with an idempotency key, target user(s) or segment, channel(s), content/template, and an optional scheduled time.
2. The API checks the idempotency key against Redis (skip if already processed), checks the user's opt-out preferences, and either enqueues to the "send now" topic or the delay structure.
3. For a bulk campaign, the API does not expand millions of recipients synchronously inside the request -- it enqueues one "campaign job," and a background fan-out worker expands it into individual per-user jobs at a steady, controlled rate, writing them into the channel queues.
4. Channel-specific worker pools (Push, Email, SMS) consume their queue with bounded concurrency matching each provider's own rate limits, call the external provider, and apply retry-with-backoff-and-jitter on transient failures -- the same pattern as [[14-cascading-failure-recovery]] -- up to a max attempt count, then route to a dead-letter queue with alerting.
5. Providers send delivery and read webhooks back to a status ingestion service, which updates each notification's status.
6. The triggering service or an internal dashboard queries delivery, read, and failure status via the API.

## 5. Data Model

| Entity | Key fields |
|---|---|
| Notification | id, idempotency_key, user_id/segment_id, channel, template_id, scheduled_at, status, created_at |
| DeliveryAttempt | notification_id, attempt_number, provider, status, error, attempted_at |
| UserPreference | user_id, channel, opted_in |
| Campaign | id, segment definition, schedule, status, total_count, sent_count, failed_count |

## 6. Deep Dive

**Idempotency**: the dedup key (a hash of user_id, template_id, and trigger_event_id) is checked with a Redis SETNX before enqueueing -- if it already exists, skip. This converts the queue's "at-least-once" delivery guarantee into "effectively-once" from the user's point of view, without needing a slower, fully strict database transaction for every send.

**Scheduling for "send later"**: reuses the exact delay-queue pattern from [[03-ttl-deletion-at-scale]] -- scheduled items live in a time-ordered structure (a Kafka delayed topic, or a table polled continuously in small batches), and a worker pulls due items steadily. Never a single giant cron sweep at the top of the hour -- that reproduces the same avalanche problem taught there.

**Fan-out for bulk campaigns**: expanding "10 million recipients" must happen asynchronously in the background, streaming jobs into the queue at a controlled rate -- never synchronously inside the triggering API call, which would time out and risk a memory blowup.

**Retry and circuit breaking per provider**: if FCM starts failing, back off and slow down instead of hammering it with the full campaign volume; give each channel its own worker pool and rate limiter (a Bulkhead, from [[14-cascading-failure-recovery]]) so an email-provider outage cannot stall Push or SMS.

## 7. Bottlenecks

- External provider rate limits (FCM, APNs, SES, Twilio all cap how fast you can send) -- the system must throttle to match, never exceed, or it gets throttled or blocked externally.
- Fan-out expansion for very large campaigns, if done synchronously or without pagination.
- Hot Kafka partitions if jobs are not spread evenly -- partition by a hash of user_id to distribute load.

## 8. Scaling

Each channel's worker pool scales independently (Push, Email, and SMS have different provider limits and payload sizes) -- this connects to [[06-ec2-autoscaling]]: stateless workers behind an auto-scaling policy keyed on queue depth, not just CPU. The ingestion API itself is stateless and scales the same way. The queue scales via partitioning.

## 9. Reliability

Queue-based delivery gives at-least-once semantics; idempotency at the worker level converts that into effectively-once for the end user. Notifications that exhaust retries go to a dead-letter queue with alerting, so failures are visible rather than silently dropped -- never fail hard and vanish.

## 10. Consistency

Delivery and read status can be eventually consistent -- a small delay before a dashboard reflects "delivered" is harmless. User opt-out preference checks are the exception: these should read from a low-latency, frequently-refreshed source, because sending to someone who just unsubscribed is a trust and compliance problem, not just a UX nit.

## 11. Security

Authenticate calling services (API keys or mTLS on the trigger API -- this contract is exactly what [[11-what-is-an-api]] describes). Sanitize notification content to prevent injection into email/SMS templates. Respect regulatory requirements (unsubscribe links, opt-out enforcement). Rate-limit the ingestion API itself so a single misbehaving internal caller cannot trigger a self-inflicted traffic spike -- the same load-shedding instinct from [[04-handling-traffic-spike-15k-rps]].

## 12. Trade-offs

Queue-based async delivery adds a small amount of latency to "send now" (hundreds of milliseconds to a couple of seconds) versus a direct synchronous call to the provider -- but buys reliability, retryability, and protection from traffic spikes, which is almost always worth it at this scale. Storing full delivery history indefinitely is expensive; time-based partitioning plus archiving old records to cold storage (the mirror image of the partition-drop idea in [[03-ttl-deletion-at-scale]]) keeps this bounded.

## 13. Final Mental Model

A notification system is fundamentally a durable, rate-limited, retryable pipeline between "something wants to tell a user something" and "an external provider that will actually deliver it." Decouple every stage with queues, so a slow or spiky stage never takes the others down with it.

## 14. Quick Self-Test

1. Why must bulk campaign fan-out happen asynchronously instead of inside the triggering API request?
2. Why does user opt-out status need stronger consistency guarantees than delivery/read status?
3. How does idempotency turn "at-least-once" queue delivery into "effectively-once" from the user's perspective?
4. Why does each channel (Push/Email/SMS) need its own worker pool and rate limiter instead of sharing one?
</script>
<script type="text/markdown" class="lesson-data" data-id="18" data-title="HTTP Status Codes: 400 vs 404 vs 409 vs 422" data-category="Web &amp; API Communication" data-order="18">
# When Should an API Return 400, 404, 409, or 422?

## 1. Story

An interviewer asks: "Your API needs to reject a bad request. When do you return 400? When 404? When 409? When 422?" You know all four are "client error" codes (4xx), but picking the right one for a given situation is where most engineers get vague, or just default to 400 for everything.

## 2. The Problem

All four say "the client did something wrong," so it's tempting to treat them as interchangeable. They're not — each answers a genuinely different question about *why* the request failed, and picking the right one is part of your API's contract (see [[11-what-is-an-api]]): callers build logic around these codes (retry, show a specific error, redirect to login), so blurring them makes your API harder to integrate with correctly.

## 3. The Solution — Four Different Questions

**400 Bad Request** — "I could not even understand your request." The request is structurally broken: malformed JSON, a required field missing entirely, wrong data type where a number was expected. This is a **syntactic** failure — the server can't get far enough to evaluate the request's meaning at all.

**404 Not Found** — "The thing you're asking about does not exist." The request is perfectly well-formed, but the resource identified by the URL/path/ID simply isn't there. `GET /orders/999999` when no such order exists.

**409 Conflict** — "What you're asking is valid, the resource exists, but doing this right now conflicts with its current state." Classic examples: trying to register a username that's already taken (ties directly to [[05-username-availability-check]] — the Bloom filter says "maybe available," but the actual `INSERT` fails with a conflict), or an optimistic-locking version mismatch on a concurrent update.

**422 Unprocessable Entity** — "Your request is syntactically perfect, but the data inside it violates a business/semantic rule." The JSON parses fine, the types are correct, but the *content* doesn't make sense: an `email` field containing `"not-an-email"`, a `quantity` of `-5`, or an end date earlier than the start date.

## 4. Mental Model

> **400** = I couldn't parse it. **404** = it doesn't exist. **409** = it exists, but this conflicts with its current state. **422** = I parsed it fine, but the data itself breaks a rule.

The 400-vs-422 line is the one people blur most: 400 is about *structure* (can the server even read this?), 422 is about *meaning* (the server read it fine, but the values are invalid according to business rules).

## 5. Decision Flow

```mermaid
flowchart TD
  A[Request arrives] --> B{Syntactically parseable?<br/>Valid JSON, correct types,<br/>required fields present?}
  B -->|No| R400[400 Bad Request]
  B -->|Yes| C{Does the target<br/>resource exist?}
  C -->|No| R404[404 Not Found]
  C -->|Yes| D{Conflicts with the<br/>resource's current state?}
  D -->|Yes| R409[409 Conflict]
  D -->|No| E{Violates a semantic/<br/>business validation rule?}
  E -->|Yes| R422[422 Unprocessable Entity]
  E -->|No| OK[200 / 201 Success]
```

## 6. Code Example

```javascript
app.post('/orders', (req, res) => {
  // 400: structurally broken - can't even evaluate it
  if (typeof req.body !== 'object' || !req.body.amount) {
    return res.status(400).json({ error: 'Missing required field: amount' });
  }

  // 422: well-formed, but the value breaks a business rule
  if (req.body.amount <= 0) {
    return res.status(422).json({ error: 'amount must be a positive number' });
  }

  const order = findOrder(req.body.orderId);
  // 404: the referenced resource does not exist
  if (!order) return res.status(404).json({ error: 'Order not found' });

  // 409: exists, but conflicts with current state
  if (order.status === 'already_paid') {
    return res.status(409).json({ error: 'Order is already paid' });
  }

  processPayment(order);
  res.status(200).json({ status: 'paid' });
});
```

## 7. Production Reality

In practice, not every real-world API agrees on 400 vs 422 — some large, well-known APIs use 400 broadly for both structural and semantic validation failures and skip 422 entirely; this is a genuinely debated convention, not a universally enforced law. What matters more than picking the "textbook perfect" code every time is **being consistent within your own API** so callers can reliably branch on status codes.

## 8. Common Mistakes

- Returning 400 for everything, including cases that are really 404 (resource doesn't exist) or 409 (conflicts with current state) — this forces every caller to parse your error *message* instead of branching on the status code, defeating the point of having different codes.
- Using 404 to hide the existence of a resource for security reasons when 403 (Forbidden) would be more accurate — a legitimate but distinct design choice, not a mistake by itself, just worth being deliberate about.

## 9. 🔗 Connection to Other Concepts

The 409 case for a duplicate username is the exact scenario from [[05-username-availability-check]] — the fast Bloom-filter check is just a hint, and the real conflict is what the database's unique constraint enforces at insert time. And these status codes are themselves part of the API contract described in [[11-what-is-an-api]].

## 10. 🧠 Remember

> 400 = I couldn't parse it. 404 = it doesn't exist. 409 = it exists but conflicts with its current state. 422 = I parsed it fine, but the data itself breaks a rule.

## 11. Quick Self-Test

1. A client sends valid JSON with a `birthDate` field set to a date in the future — which code, and why?
2. Why is 404 sometimes used deliberately instead of 403, even when the real reason is "you're not allowed to see this"?
3. Why does blurring 400 and 422 into "just always return 400" hurt API consumers?
</script>
<script type="text/markdown" class="lesson-data" data-id="19" data-title="Idempotent Consumers and Duplicate Events" data-category="Distributed Systems" data-order="19">
# A Consumer Crashes After Processing But Before Acknowledging - Now What?

> **Similar-question flag**: this is the same idempotency principle taught in [[17-notification-system-design]]'s "Idempotency" deep dive, now asked directly as a multiple-choice distributed-systems question. The mechanism doesn't need re-deriving - what's worth walking through is *why the other three options are traps* and why this crash window is unavoidable in any at-least-once queue, not just a payment-specific edge case.

## 1. Story

Your payment service publishes an event. A consumer picks it up, fully processes it (say, marks the payment as captured and emails the receipt) - and then crashes, a split second before it sends the acknowledgment back to the queue.

**A.** Process it again
**B.** Drop the event
**C.** Make the consumer idempotent
**D.** Block the entire queue

## 2. Why the Crash Window Is Unavoidable

A message queue only knows a message is "done" when it receives an acknowledgment. If the consumer crashes after finishing the work but before sending that ack, the queue has no way to know the work already happened - from its point of view, the message was never confirmed, so it **must** redeliver it to be safe. This is exactly why real message queues (Kafka, SQS, RabbitMQ) advertise **at-least-once delivery**, not exactly-once: exactly-once would require the queue and your business logic to commit atomically as a single distributed transaction, which is either impossible or prohibitively expensive at scale. At-least-once plus a crash-at-the-wrong-instant is what guarantees you will eventually see a duplicate delivery, no matter how you configure things.

## 3. Evaluating the Four Options

- **A. Process it again (unconditionally)** - wrong. This is what happens by default if you do nothing, and here it means charging the card or sending the receipt email a second time. Straightforwardly harmful for a payment.
- **B. Drop the event** - wrong, and worse than A. Assuming any redelivery is a duplicate and silently discarding it risks losing a payment that was never actually processed (e.g. the consumer crashed *before* doing the work, not after) - trading a duplicate-processing risk for a silent-data-loss risk.
- **D. Block the entire queue** - wrong as a general strategy. Halting all consumers over one ambiguous event turns a local problem into a system-wide outage - the same cascading, self-inflicted damage pattern from [[14-cascading-failure-recovery]]. (A narrower version of this - routing just the one problematic event to a dead-letter queue for isolated inspection - is reasonable; freezing everything is not.)
- **C. Make the consumer idempotent** - correct. Accept that redelivery *will* happen, and design processing so handling the same event twice produces the exact same end state as handling it once.

## 4. How to Actually Make It Idempotent

- **Track processed event IDs**: before doing the real work, check a dedup store (a `processed_events` table with a unique constraint on `event_id`, or Redis `SETNX`) in the *same transaction* as the business effect. If the ID is already present, skip - this is the identical mechanism used for notification dedup in [[17-notification-system-design]].
- **Prefer naturally idempotent operations**: "set balance to $500" is idempotent no matter how many times you run it; "add $50 to balance" is not - reprocessing the second form doubles the effect. Where possible, design state changes as absolute sets rather than relative deltas.
- **Use the payment provider's own idempotency key** (e.g. Stripe's `Idempotency-Key` header) so even a duplicate *call* to the provider is deduplicated on their side too, not just yours.

## 5. Mental Model

> At-least-once delivery is a promise, not a threat - it guarantees your consumer will eventually see everything, at the cost of sometimes seeing it twice. Idempotency is the other half of that deal: it's what turns "at least once" into "effectively once" from the business's point of view.

## 6. 🧠 Remember

> You cannot prevent duplicate delivery in a distributed queue - you can only make duplicate delivery harmless. Idempotency at the consumer is that fix; reprocessing blindly or dropping events blindly both trade one failure mode for a worse one.

## 7. Quick Self-Test

1. Why can a message queue never fully guarantee exactly-once delivery on its own?
2. Why is "add $50 to balance" more dangerous to reprocess than "set balance to $500"?
3. Why is blocking the entire queue over one ambiguous event a worse trade-off than routing just that event to a dead-letter queue?
</script>
<script type="text/markdown" class="lesson-data" data-id="20" data-title="Sudden Latency Spike Checklist (200ms to 8s)" data-category="Production Debugging &amp; Incidents" data-order="20">
# API Response Time Suddenly Jumps From 200ms to 8 Seconds - What Do You Check First?

> **Similar-question flag**: this overlaps with [[02-debugging-random-500-errors]] (the systematic top-down checklist) and [[13-hidden-latency-bottleneck]] (I/O-wait hiding behind healthy CPU/memory). Rather than re-running that whole checklist, this lesson focuses on the one word that changes your first move - **"suddenly"** - and adds two causes those lessons didn't cover: GC pauses and database lock contention.

## 1. Story

Your API's response time has been a steady 200ms for weeks. Today, without warning, it jumps to 8 seconds and stays there.

## 2. Why "Suddenly" Changes Everything

[[13-hidden-latency-bottleneck]] was about a *chronic*, always-been-this-way 3-second response - the fix there was architectural (parallelize sequential calls). This is different: a **step-function change** at a specific moment means something concrete happened right at that moment. That reframes the first move entirely:

**Check what changed, before you check what's broken.** Look at the deploy log, infrastructure change log, feature-flag toggle history, and scaling events, and line them up against the exact timestamp of the jump. A huge fraction of "sudden" incidents are explained in the first two minutes this way - a deploy, a config change, a certificate rotation, a scaling-down event, a cron job that just started running.

## 3. If Nothing Obviously Changed, Walk Down From There

1. **Resource saturation** - did CPU, memory, disk I/O, or open connections suddenly max out at that same timestamp?
2. **Downstream dependency latency** (the [[13-hidden-latency-bottleneck]] check) - open the dashboard for *their* service, not just yours; a dependency's own incident shows up as your latency spike.
3. **Connection pool saturation** - if the pool to your database or a downstream service is exhausted, new requests queue waiting for a free connection, producing exactly this kind of spike (the same pool-exhaustion idea from [[16-synchronized-connection-pool-expiry]], here triggered by load rather than synchronized expiry).
4. **Two causes worth naming explicitly, because they're easy to miss:**

**Term: GC pause (stop-the-world pause)** - in managed-runtime languages (Java, .NET, and others), memory pressure or a growing heap can trigger a long garbage-collection pause that freezes request processing for seconds at a time. This produces exactly the "sudden latency spike" signature, and it can happen while CPU and memory graphs still look broadly "fine" on a coarse dashboard, because the spike is a short, deep freeze rather than sustained high usage.

**Term: Lock contention** - a single slow or stuck query holding a row- or table-level lock in the database can make many otherwise-fast, completely unrelated queries queue up behind it. This doesn't necessarily show as high CPU either - it shows as elevated *wait time*, visible only in database-specific views (e.g. `pg_stat_activity` in Postgres, `SHOW ENGINE INNODB STATUS` in MySQL), not in generic infrastructure dashboards.

## 4. Mental Model

> A *sudden* jump points you at a *recent event*. A *chronic* slow endpoint points you at *architecture*. Ask "what changed?" before you ask "what's broken?" - and only reach for a code profiler after infrastructure, dependencies, and the database have all been ruled out.

## 5. Flow

```mermaid
flowchart TD
  A["Response time: 200ms -> 8s, suddenly"] --> B{"What changed at<br/>that exact timestamp?<br/>(deploy, config, scaling)"}
  B -->|Found it| Fix[Root cause identified]
  B -->|Nothing obvious| C{Resource saturation?<br/>CPU/mem/disk/connections}
  C -->|Yes| Fix
  C -->|No| D["Downstream dependency's<br/>own dashboard healthy?"]
  D -->|No| Fix
  D -->|Yes| E["Check DB lock waits<br/>and GC pause logs"]
  E --> Fix
```

## 6. Production Reality

Most incident responders open the deploy/change log before touching a single graph - it's usually the fastest path to an answer, and it's why "what changed recently" is often the very first question asked in an incident channel, before any dashboard is even shared.

## 7. Common Mistakes

- Jumping straight to profiling application code - this is almost always the *last* resort, not the first, because the fastest wins come from correlating with a recent change, then infrastructure, then dependencies, then the database.
- Assuming healthy CPU/memory rules out GC pauses or lock contention - both can hide behind coarse, averaged resource graphs entirely.

## 8. 🧠 Remember

> A sudden latency jump is a symptom of a recent event, not a mystery to solve from scratch - check what changed first, then resource saturation, then downstream dependencies, then database-level locks and GC pauses, before ever opening a profiler.

## 9. Quick Self-Test

1. Why does "suddenly" change your first diagnostic step compared to a latency problem that's always been slow?
2. Why might CPU and memory graphs look normal even during a GC-pause-caused latency spike?
3. How could a single slow query cause many unrelated-looking requests to also become slow?
</script>
<script type="text/markdown" class="lesson-data" data-id="21" data-title="What Is Database Partitioning?" data-category="Databases" data-order="21">
# What Is Database Partitioning?

## 1. Story

A `orders` table grows to 500 million rows. Queries that used to take 20ms now take 4 seconds, even with indexes. Backups take all night. A migration that adds a column locks the whole table for an hour. Everything about this one giant table has become slow and risky to touch.

## 2. The Problem

Databases are built to handle large tables, but "large" has practical limits: indexes get deeper and slower to traverse, a single lock can block a huge share of daily traffic, a full table scan (even a rare one, like a reporting query) becomes enormously expensive, and maintenance operations (backups, index rebuilds, schema changes) that used to take seconds now take hours.

## 3. The Solution

**Term: Database Partitioning** - splitting one logical table into multiple smaller physical pieces ("partitions"), while the application (and often the database itself) can still query it as if it were one table. Each partition holds a subset of the rows, grouped by some rule.

The three common partitioning strategies:

- **Range partitioning** - split by a range of values, most commonly time (e.g. one partition per month or per hour - this is exactly the technique used in [[03-ttl-deletion-at-scale]], where an entire expired partition is dropped in one O(1) operation instead of deleting rows one by one).
- **Hash partitioning** - apply a hash function to a key (e.g. `user_id`) and assign the row to one of N partitions based on the hash result - this spreads rows evenly regardless of any natural ordering, useful when there's no good range key or when range partitioning would create uneven ("hot") partitions.
- **List partitioning** - split by an explicit set of values (e.g. one partition per country code, or per subscription tier).

## 4. Mental Model

> Partitioning is filing one enormous cabinet's worth of documents into several labeled drawers instead of one drawer. Looking for a specific memo from March? Only the March drawer needs to be opened - the other eleven never get touched.

**Term: Partition pruning** - when a query includes a filter on the partitioning key (e.g. `WHERE created_at BETWEEN ...` on a table range-partitioned by `created_at`), the database can skip scanning partitions that couldn't possibly contain matching rows entirely, rather than scanning the whole table. This is *why* partitioning speeds up queries, not just why it organizes storage more neatly.

## 5. How It Works / Flow

```mermaid
flowchart TB
  Q["Query: WHERE created_at<br/>BETWEEN Jan1 AND Jan31"] --> Router[Partition router]
  Router -->|skipped - pruned| P1[Partition: Nov 2025]
  Router -->|skipped - pruned| P2[Partition: Dec 2025]
  Router -->|scanned| P3[Partition: Jan 2026]
  Router -->|skipped - pruned| P4[Partition: Feb 2026]
```

## 6. Code Example

```sql
-- Range partitioning by month (PostgreSQL syntax)
CREATE TABLE orders (
  id BIGINT,
  user_id BIGINT,
  created_at TIMESTAMP,
  amount NUMERIC
) PARTITION BY RANGE (created_at);

CREATE TABLE orders_2026_01 PARTITION OF orders
  FOR VALUES FROM ('2026-01-01') TO ('2026-02-01');

-- A query filtering on created_at only ever touches the relevant partition(s)
SELECT * FROM orders WHERE created_at >= '2026-01-15' AND created_at < '2026-01-20';

-- Dropping an entire old partition is instant - no row-by-row DELETE needed,
-- the exact technique from the WhatsApp Status lesson
DROP TABLE orders_2025_11;
```

## 7. Partitioning vs. Sharding - A Common Mix-Up

**Partitioning** typically means splitting one table into multiple pieces that still live on the *same* database instance (or the same cluster, depending on the engine) - the database itself understands and manages the split. **Sharding** usually means distributing data across *entirely separate database instances/servers*, each unaware of the others, with the application (or a routing layer) deciding which shard to query. In practice, the terms sometimes overlap (some engines call cross-node splits "partitions" too), but the distinction between "still one database, split internally" and "spread across independent database servers" is the one worth knowing precisely for an interview.

## 8. Production Reality

Choosing the partitioning key well matters enormously: a bad choice creates a **hot partition** - one partition receiving disproportionately more reads/writes than the others, which defeats the entire point (you've just made one "sub-table" the new bottleneck). Time-based partitioning is popular exactly because most write-heavy systems naturally spread writes evenly across time.

## 9. Trade-offs

| | Benefit | Cost |
|---|---|---|
| Smaller physical pieces | Faster scans, cheaper maintenance (backup/reindex per partition) | More moving parts to manage |
| Partition pruning | Queries on the partition key get dramatically faster | Queries *not* filtering on the partition key may need to scan every partition, sometimes slower than an unpartitioned table |
| Dropping old partitions | O(1) bulk deletion (see [[03-ttl-deletion-at-scale]]) | Requires the schema to be designed with partitioning in mind from early on |

Cross-partition queries and joins across partitions can be more expensive than the equivalent query on a single unpartitioned table, since the database (or application) may need to touch and merge results from multiple pieces.

## 10. Common Mistakes

- Partitioning by a key that doesn't match how the data is actually queried - if most queries don't filter on the partition key, pruning never kicks in and you gain none of the speed benefit while still paying the added complexity cost.
- Choosing a partitioning key that creates a hot partition (e.g. partitioning by a boolean flag where 95% of rows share the same value).
- Treating partitioning as a substitute for indexing - they solve different problems and are normally used together, not as alternatives.

## 11. 🔗 Connection to Other Concepts

This is the general concept behind the specific technique used in [[03-ttl-deletion-at-scale]] (time-based partitions, dropped instead of deleted) and mentioned again in [[17-notification-system-design]] for archiving old delivery history.

## 12. 🧠 Remember

> Partitioning splits one table into smaller physical pieces so queries can skip the pieces they don't need (pruning) and bulk operations like deletion become instant - but only if the partition key actually matches how the data is queried and written.

## 13. Quick Self-Test

1. What is partition pruning, and why is it the actual reason partitioning speeds up queries?
2. What's the practical difference between partitioning and sharding?
3. Why can a poorly chosen partitioning key make things worse instead of better?
</script>
<script type="text/markdown" class="lesson-data" data-id="22" data-title="Node.js Memory Leak Debugging" data-category="Production Debugging &amp; Incidents" data-order="22">
# Finding a Node.js Memory Leak With No Errors and No Pattern

## 1. Story

An Express API's memory climbs steadily from 200MB to 2GB over 24 hours, then crashes. The process restarts, climbs again, crashes again. The logs show nothing - no errors, no stack traces. There's no correlation with traffic: it leaks the same way whether load is high or low.

## 2. The Problem

Every debugging lesson so far in this curriculum ([[02-debugging-random-500-errors]], [[20-sudden-latency-spike-checklist]]) starts from a symptom that *announces itself* - an error, a slow response. A memory leak announces nothing. Nothing ever throws. The application just quietly consumes more and more memory until it's forcibly killed - so log-searching, the instinct from those other lessons, finds nothing here by design.

The traffic-independence is itself the biggest clue: if the leak grew proportionally with request count, you'd suspect something tied to handling requests. Growing regardless of load points at something that accumulates **over time or over a small number of trigger events**, not proportionally with volume - a background timer, a growing global cache, or listeners that were only ever added a handful of times but never removed.

## 3. Why This Happens in a Garbage-Collected Runtime

**Term: Reachability** - V8's garbage collector doesn't free memory because your code is "done" with it logically; it frees memory only when there is **no remaining reference path** to that object from a root (global variables, active closures, event emitter listener lists, timers). A memory leak in Node.js is never "memory that was never freed" in the C/C++ sense - it's memory that's still **technically reachable** because of a reference somewhere that you forgot you were keeping, even though your code has logically moved on.

## 4. The Step-by-Step Process

**Step 1 - Confirm it's an actual leak, not just V8 being V8.** Log `process.memoryUsage()` periodically (`rss`, `heapUsed`, `heapTotal`, `external`). A healthy app often shows a sawtooth pattern (memory climbs, garbage collection reclaims it, repeat) - that's normal. A leak shows **heapUsed climbing across GC cycles without ever coming back down** to its previous baseline.

**Step 2 - Take heap snapshots and compare them.** Run with `node --inspect` and connect Chrome DevTools' Memory tab (or use the `heapdump` package / `v8.writeHeapSnapshot()`), and take two snapshots under similar conditions, an hour or more apart. Use the **Comparison** view to see exactly which object types have a growing, non-zero "retained" count between the two snapshots - this narrows "somewhere in my app" down to a specific constructor/object type.

**Step 3 - Follow the retainer chain.** For the object type that's growing, DevTools shows the **Retainers** view - the actual chain of references keeping that object reachable. This answers *why* garbage collection can't free it: often a global array, a `Map` that's never pruned, or an `EventEmitter`'s internal listener array.

**Step 4 - Check the systematic list of Node/Express-specific leak sources**, especially since "no traffic pattern" points away from per-request code paths that scale with volume:

- **Unbounded in-memory caches** - a plain object or `Map` used as a cache with no eviction policy and no TTL, growing forever as new keys appear.
- **Event listeners added but never removed** - e.g. attaching a listener to a shared or long-lived `EventEmitter` (or `process`) inside a request handler or a per-connection callback; each occurrence adds one more listener that's never cleaned up. Node even warns about this with `MaxListenersExceededWarning` - worth grepping logs for, even though it's a warning, not an error.
- **Timers that are never cleared** - a `setInterval` created inside a function that runs more than once (e.g. once per incoming connection) without a matching `clearInterval`, so each call adds a new timer running forever.
- **Closures capturing large objects** - a callback closes over a big buffer/array, and that closure itself gets stored somewhere long-lived (a cache, a socket handler), keeping the large object alive indefinitely.
- **Unclosed streams/sockets/buffers** - these often show up as growth in `external` memory rather than `heapUsed`, which is a specific enough signal to point straight at native/Buffer-backed resources instead of plain JS objects.

## 5. Mental Model

> A memory leak isn't "memory that's too high" - it's memory that keeps climbing because something is still holding a reference the code has logically finished with. Find it with heap snapshot comparisons and retainer chains, not log searches, because a leak, almost by definition, never logs an error.

## 6. Flow

```mermaid
flowchart TD
  A["Memory climbs steadily, no errors"] --> B["Log process.memoryUsage() over time -<br/>sawtooth (normal) or monotonic climb (leak)?"]
  B -->|Monotonic climb| C["Take two heap snapshots,<br/>~1hr apart, similar conditions"]
  C --> D["Compare snapshots -<br/>which object type keeps growing?"]
  D --> E["Follow Retainers chain -<br/>what's still referencing it?"]
  E --> F["Fix: remove listener, clear timer,<br/>bound the cache, close the stream"]
```

## 7. Code Example

```javascript
// LEAK: a new listener is added on every request and never removed
app.get('/status', (req, res) => {
  sharedEmitter.on('update', () => res.write('tick')); // grows forever
});

// LEAK: a new interval is created per connection, never cleared
io.on('connection', (socket) => {
  setInterval(() => socket.emit('ping'), 5000); // never cleared on disconnect
});

// FIX: bounded, self-cleaning
io.on('connection', (socket) => {
  const interval = setInterval(() => socket.emit('ping'), 5000);
  socket.on('disconnect', () => clearInterval(interval)); // cleaned up properly
});

// FIX: a bounded cache instead of an ever-growing plain object
const LRU = require('lru-cache');
const cache = new LRU({ max: 500, ttl: 1000 * 60 * 10 }); // bounded size + TTL
```

## 8. Production Reality

Container orchestrators and process managers (Kubernetes, PM2) restarting a crashed process on OOM is exactly why the symptom looks like "climbs, crashes, restarts, climbs again" - the restart masks the leak's user-facing impact but does nothing to fix it. This is the same distinction as [[14-cascading-failure-recovery]]'s "root cause fixed vs. system actually recovered," just inverted: here the *symptom* clears (via restart) while the *root cause* is completely untouched.

## 9. Common Mistakes

- Treating "no errors in the logs" as evidence nothing is wrong - a memory leak is exactly the category of bug that produces zero errors while still being fatal.
- Treating automatic restarts as a fix rather than a temporary mask that hides the real problem while memory pressure and restart frequency quietly get worse over time.
- Debugging by reading application code top-to-bottom looking for the leak, instead of starting from heap snapshot comparisons - with a large codebase this is far slower than letting the retainer chain point directly at the culprit.

## 10. 🧠 Remember

> A memory leak isn't memory that's too high - it's memory that keeps climbing because something is still holding a reference the code logically doesn't need anymore. Find it with heap snapshot comparisons and retainer chains, not log searches, because a leak almost never logs an error.

## 11. Quick Self-Test

1. Why does "no errors in the logs" not rule out a serious bug in this specific case?
2. What's the difference between memory usage that looks high but is a normal sawtooth pattern, versus memory usage that indicates an actual leak?
3. Why doesn't restarting the process on crash count as fixing the problem?
4. Name two Node.js-specific causes of a memory leak that have nothing to do with request volume.
</script>
<script type="text/markdown" class="lesson-data" data-id="23" data-title="Queue Backlog After a Spike" data-category="Production Debugging &amp; Incidents" data-order="23">
# Traffic Is Normal, But 8 Million Jobs Are Still Stuck in the Queue

> **Similar-question flag**: this connects to [[14-cascading-failure-recovery]] (fixing the trigger doesn't undo the backlog it left behind) and [[17-notification-system-design]] (scale workers on queue depth, not CPU). What's new here is a concrete **decision framework** for what to actually do with an existing backlog, since "scale consumers," "drop stale jobs," and "make users wait" aren't mutually exclusive - they apply to different slices of the backlog.

## 1. Story

Traffic spiked, then returned to normal 20 minutes ago. The API is still slow. Digging in: the queue did its job during the spike - it absorbed 8 million jobs instead of dropping requests or erroring out. But absorbing the work isn't the same as finishing it. The backlog is still there, and consumers are draining it at their normal, pre-spike rate.

## 2. Do the Math First

Before choosing an approach: `backlog size / current consumer throughput = time to drain`. If consumers process 1,000 jobs/sec, 8,000,000 jobs is roughly 2.2 hours at the current rate - far too long. This single number tells you whether "just wait it out" is even remotely viable before you consider it as an option.

## 3. Evaluating the Three Options - They're Not Mutually Exclusive

**Scale consumers** - almost always the first lever, and the direct fix for "drain rate is too slow." But scale carefully: if consumers call a downstream service or database, doubling consumer count means doubling concurrent calls to that dependency. Do this too aggressively and you recreate the exact thundering-herd problem from [[14-cascading-failure-recovery]], just self-inflicted by your own backlog-clearing effort instead of by an outage.

**Drop stale jobs** - only valid for job types where the value of the result **decays with time**. A "user is typing" notification, a real-time price alert, or an abandoned-cart reminder for a cart that's already been checked out are all worthless 20 minutes late - processing them wastes capacity that could clear jobs that still matter. This means giving jobs a TTL/max-age at creation (the same expiry philosophy as [[03-ttl-deletion-at-scale]], applied to queued work instead of stored data) so a consumer can check "is this still relevant?" before doing the expensive part, and skip it if not.

**Make users wait** - acceptable only for genuinely asynchronous, non-blocking work where nobody is staring at a spinner (a background email digest, a nightly report). Unacceptable for anything synchronous or user-facing.

## 4. The Real Answer

Production systems typically do all three, applied to different subsets: scale consumers immediately (matched to what the downstream dependency can actually absorb), drop or deprioritize jobs that have exceeded a staleness threshold, and let the remaining, still-relevant, genuinely-tolerant background work simply take its turn.

## 5. Mental Model

> A full queue after the spike has ended is a math problem (arrival rate vs. drain rate) mixed with a business problem (which jobs still matter). Solve both - don't guess one universal answer for every job in the backlog.

## 6. 🧠 Remember

> The queue absorbing a spike buys you time, not a solution - clearing the backlog needs scaling matched to what downstream can handle, staleness-based dropping for time-decaying work, and patience only where patience is actually free.

## 7. Quick Self-Test

1. Why can scaling consumers too aggressively recreate the exact problem from Lesson 14?
2. What property of a job makes "drop it if stale" the right call, versus a job where that would be unacceptable?
3. Why is "how long will draining take at the current rate" the first calculation to make, before picking a strategy?
</script>
<script type="text/markdown" class="lesson-data" data-id="24" data-title="Kubernetes: Pets vs Cattle" data-category="Infrastructure &amp; DevOps" data-order="24">
# Should We Adopt Kubernetes for Three Containers?

> **Similar-question flag**: this is the same "don't ship the impressive architecture, ship the one your actual scale needs" principle from [[15-simple-vs-scalable-architecture]], now applied to infrastructure orchestration specifically. What's new here is the concrete list of what Kubernetes actually buys you, and the "pets vs. cattle" framing for deciding when that trade is worth it.

## 1. Story

"Let's add Kubernetes, deployments will be easier." "Easier than what?" "Than SSH and a systemd unit." "How many boxes do we run - or are we adopting an operating system to host three containers?"

## 2. The Problem

Kubernetes doesn't run your containers - it runs a **distributed system that runs your containers**: a control plane, a key-value store (etcd) for cluster state, a scheduler, a networking overlay, RBAC, usually an ingress controller. All of that is real, ongoing operational surface area - upgrades, security patches, learning curve, failure modes of its own - adopted before a single line of your actual application changes.

## 3. What Kubernetes Actually Solves

- **Scheduling across many nodes** - deciding which of dozens/hundreds of machines should run which container, and rebalancing automatically as machines come and go.
- **Self-healing at fleet scale** - automatically restarting or rescheduling containers when a node dies, across a fleet large enough that a human can't watch every box.
- **Service discovery and load balancing** across a constantly-changing set of instances.
- **Rolling deployments across many hosts** - safely updating a fleet of dozens/hundreds of instances without a human running the same deploy script over and over.

## 4. Term: Pets vs. Cattle

**Pets** - servers you know individually, name, and nurse back to health when something goes wrong (SSH in, check logs, restart the service). Fine, even correct, at a small scale.

**Cattle** - a fleet large enough that individual machines are disposable and interchangeable; you don't fix a sick one, you replace it. Orchestration exists to manage cattle at scale, automatically.

> Orchestration is for cattle. Don't build a ranch's worth of infrastructure to manage two pets.

## 5. The Actual Decision

For **three containers on a couple of boxes**, SSH plus a systemd unit (or a simple process manager like PM2, plus a basic deploy script) achieves "easier deployments" with a small fraction of the operational surface area. The genuine trigger for Kubernetes isn't "we want easier deploys" in the abstract - it's a specific, measurable pain: dozens-to-hundreds of services/instances that need automatic scheduling, self-healing, and rolling updates that a human genuinely can't keep up with by hand.

## 6. 🔗 Connection to Other Concepts

This is the exact same reasoning taught in [[15-simple-vs-scalable-architecture]] - ask what the actual requirement is before reaching for the architecture that looks most senior on paper.

## 7. 🧠 Remember

> Kubernetes trades a lot of new operational complexity for the ability to manage a large, disposable fleet automatically - if you're managing a handful of pets, not a herd of cattle, that trade isn't worth making yet.

## 8. Quick Self-Test

1. What specifically does Kubernetes cost you operationally, beyond "another thing to learn"?
2. What's the actual, measurable trigger that justifies adopting it, versus just "it sounds more professional"?
3. Why does "pets vs. cattle" matter more than the raw number of containers alone?
</script>
<script type="text/markdown" class="lesson-data" data-id="25" data-title="API Styles Compared (REST/SOAP/GraphQL/gRPC/WebSocket/Webhook)" data-category="Web &amp; API Communication" data-order="25">
# REST, SOAP, GraphQL, gRPC, WebSocket, Webhook - What's Actually Different?

> **Builds on**: [[11-what-is-an-api]] established that REST/GraphQL/gRPC are just different **styles** of exposing the same underlying concept - a contract between client and server. This lesson is the full comparison that mention deferred.

## 1. Story

"Just use this API" turns out to mean six genuinely different things depending on which system you're talking to - a payment provider's REST API, an old enterprise system's SOAP interface, a modern frontend's GraphQL endpoint, two internal microservices talking gRPC, a chat app's WebSocket connection, and a CI system pinging you with a webhook. All of them are "APIs" in the sense from [[11-what-is-an-api]] - contracts for asking and receiving - but the shape of that contract, and the problem it's optimized for, differs a lot.

## 2. The Six Styles

**REST** - resources identified by URLs, manipulated with standard HTTP verbs (GET/POST/PUT/DELETE), typically JSON payloads. Simple, cacheable (leans on HTTP caching semantics), the default choice for public APIs and straightforward CRUD.

**SOAP** - a strict, XML-based protocol with a formal contract (WSDL) defining every operation and message shape ahead of time. Verbose and rigid compared to REST, but that rigidity brought strong tooling and formal validation - still common in older enterprise systems (banking, insurance, government) that adopted it before REST became dominant.

**GraphQL** - a single endpoint where the client specifies exactly which fields it needs in the request itself, and gets back exactly that shape - no more, no less. Solves REST's common "over-fetching" (getting a whole user object when you needed just the name) and "under-fetching" (needing three separate REST calls to assemble one screen).

**gRPC** - a binary, strongly-typed protocol (built on HTTP/2 and Protocol Buffers) optimized for fast server-to-server communication, commonly used between internal microservices where both sides are code you control and raw speed/type-safety matters more than human-readability.

**WebSocket** - unlike the request-response pattern of the others, this keeps a single connection **open** in both directions, so either side can push data at any time without the other having to ask again. The right fit for chat apps, live scoreboards, real-time collaborative editing - anything where the server needs to speak first.

**Webhook** - inverts the usual client-initiates-the-call pattern: instead of you polling a service asking "did anything happen yet?", the service calls **you** the moment something happens (a payment completes, a CI build finishes). It's still just an HTTP request-response contract underneath - the inversion of who calls whom is the whole idea.

## 3. Mental Model

| Style | Best for | Core idea |
|---|---|---|
| REST | Public APIs, simple CRUD | Resources + HTTP verbs |
| SOAP | Strict old enterprise contracts | Formal XML contract (WSDL) |
| GraphQL | Frontends needing flexible, precise data shapes | Client specifies exact fields |
| gRPC | Fast internal service-to-service calls | Binary, typed, HTTP/2 |
| WebSocket | Real-time, bidirectional, server-initiated pushes | One connection, stays open |
| Webhook | "Tell me when it happens" instead of polling | Server calls you back |

## 4. Flow

```mermaid
flowchart LR
  subgraph "Request-Response (REST/SOAP/GraphQL/gRPC)"
    C1[Client asks] --> S1[Server answers, connection closes]
  end
  subgraph "WebSocket - stays open"
    C2[Client] <--> S2[Server - either side can push anytime]
  end
  subgraph "Webhook - inverted"
    S3[External service] -->|"calls you when something happens"| C3[Your endpoint]
  end
```

## 5. Production Reality

Most real systems use **more than one of these simultaneously**, matched to the specific problem: a public-facing REST or GraphQL API for external/frontend consumers, gRPC between internal microservices for speed, a WebSocket connection for the live-updating parts of the UI, and webhooks to receive events from third parties (Stripe, GitHub, payment processors) instead of polling them constantly.

## 6. Common Mistakes

- Assuming "API" always means REST - as [[11-what-is-an-api]] establishes, the API is the contract; REST is just one popular shape for it.
- Using WebSockets for something that's really just occasional request-response (adds connection-management complexity for no benefit) - or the reverse, polling repeatedly for something a webhook would deliver instantly and far more efficiently.

## 7. 🧠 Remember

> These aren't competing "better or worse" options - they're different shapes of the same underlying idea (a contract for asking and receiving), each optimized for a different pattern: simple CRUD, formal enterprise contracts, precise data-fetching, fast internal calls, bidirectional real-time, or "tell me when it happens."

## 8. Quick Self-Test

1. Why does GraphQL solve both over-fetching and under-fetching, and what causes those problems in plain REST?
2. Why is a webhook not a fundamentally different protocol, just an inverted usage of the same request-response idea?
3. When would gRPC be the wrong choice, even though it's the fastest option on this list?
</script>
<script type="text/markdown" class="lesson-data" data-id="26" data-title="Duplicate Email Race Condition" data-category="System Design at Scale" data-order="26">
# Two Users Register With the Same Email at the Same Instant

> **Same-question flag**: this is the exact race condition already covered in [[05-username-availability-check]]'s "common mistake" section - a check-then-act gap, just triggered by email instead of username. No new mechanism to teach here; what's worth adding is the formal name for this class of bug, since it shows up constantly under different disguises.

## 1. Story

Two users hit "register" with the same email within the same instant. Both requests check "is this email taken?" - both get "no." Both accounts get created. Now there are two accounts sharing one email, login is ambiguous, password reset is ambiguous, authentication is quietly broken forever - and nothing ever logged an error.

## 2. What's Actually Missing

**Term: TOCTOU (Time-Of-Check to Time-Of-Use)** - a race condition where the gap between checking a condition and acting on it is wide enough for another process to invalidate that check before the action happens. Here: check "email free" -> *(gap)* -> insert row. If a second request runs its own check in that gap, both see "free" and both proceed.

The fix is identical in shape to [[05-username-availability-check]]: the application-level check is only ever a UX hint. The actual guarantee has to come from an **atomic, database-enforced unique constraint** on the email column, checked by the database itself at the moment of insert - not by two separate application steps that can interleave.

```sql
ALTER TABLE users ADD CONSTRAINT unique_email UNIQUE (email);
-- The second concurrent INSERT throws a constraint violation instead of
-- silently succeeding - the application catches it and returns "email taken."
```

## 3. 🧠 Remember

> Any "check, then act" sequence with a gap in between is a race condition waiting to happen under concurrency - the fix is never a faster check, it's making the actual write atomic and constraint-enforced at the database level.

## 4. Quick Self-Test

1. Why does checking "is this email taken" faster not actually fix the race condition?
2. What database feature turns this from a possible bug into an impossible one?
3. Name one other place in this curriculum where the exact same check-then-act gap showed up.
</script>
<script type="text/markdown" class="lesson-data" data-id="27" data-title="The CIA Triad" data-category="Security" data-order="27">
# The CIA Triad: Confidentiality, Integrity, Availability

## 1. Story

Security+ question of the day: an attacker modifies a database record without authorization. Which part of the CIA triad was compromised?

A. Confidentiality
B. Integrity
C. Availability
D. Authentication

**Answer: B, Integrity.** Modifying data without authorization is precisely what Integrity protects against. Confidentiality would be violated by *reading* data they shouldn't see (not changing it). Availability would be violated by *denying access* to data or systems (not altering content). Authentication isn't part of the CIA triad at all - it's a *mechanism* that helps protect all three, which is exactly why it's the tempting wrong answer.

## 2. The Solution - The Three Pillars

**Confidentiality** - only authorized parties can *read* the data. Violated by: an unencrypted database being read by an attacker, a misconfigured S3 bucket exposing files publicly, a leaked API key granting read access it shouldn't.

**Integrity** - data is accurate and hasn't been *tampered with*, by accident or attack. Violated by: an attacker modifying a database record, a man-in-the-middle altering a payment amount in transit, corrupted data from a bug that silently changes stored values.

**Availability** - authorized parties can actually *access* the system/data when they need to. Violated by: a DDoS attack taking a service offline, a ransomware attack encrypting files so legitimate users can't read them, a hardware failure with no redundancy.

## 3. Mental Model

> Confidentiality = who can **read** it. Integrity = can it be **trusted/unaltered**. Availability = can it be **reached** when needed. Every security control maps to protecting one or more of these three - and every incident can be classified by which one(s) it broke.

## 4. Why "Authentication" Is the Tempting Wrong Answer

Authentication (proving who you are) and authorization (proving what you're allowed to do) are both **mechanisms** used to *enforce* confidentiality and integrity - they're not a fourth pillar sitting alongside the other three. A weak authentication system is a *cause* that can lead to a confidentiality or integrity breach, not a category of breach itself. This distinction (mechanism vs. the property it protects) is exactly what a well-designed multiple-choice security question is testing.

## 5. Flow

```mermaid
flowchart LR
  subgraph "CIA Triad - properties being protected"
    Conf[Confidentiality<br/>who can read it]
    Integ[Integrity<br/>can it be trusted]
    Avail[Availability<br/>can it be reached]
  end
  subgraph "Mechanisms that enforce them"
    Auth[Authentication / Authorization]
    Enc[Encryption]
    Backup[Backups / Redundancy]
    Checksum[Checksums / Digital Signatures]
  end
  Auth --> Conf
  Auth --> Integ
  Enc --> Conf
  Checksum --> Integ
  Backup --> Avail
```

## 6. Production Reality

Real incidents rarely violate just one pillar cleanly - a ransomware attack usually violates Availability (systems locked/offline) and often Confidentiality too (data exfiltrated before encryption, for double-extortion). Thinking in terms of the triad helps scope an incident response: "what's actually been broken here, and what controls map to fixing each part."

## 7. 🧠 Remember

> Confidentiality is about who can read it, Integrity is about whether it can be trusted, Availability is about whether it can be reached - authentication is a tool that protects these, not a fourth member of the triad.

## 8. Quick Self-Test

1. Why is unauthorized modification an Integrity violation and not a Confidentiality one?
2. Why isn't Authentication considered part of the CIA triad itself?
3. Give an example of a single incident that could violate two of the three pillars at once.
</script>
<script type="text/markdown" class="lesson-data" data-id="28" data-title="Scaling Database Reads" data-category="Databases" data-order="28">
# Scaling Database Reads Without a Bigger Instance

> **Connects to**: [[21-database-partitioning]] (partitioning/sharding vocabulary) and [[15-simple-vs-scalable-architecture]] (add each piece only when a real metric justifies it - this lesson is the concrete "when read load is that metric" case).

## 1. Story

A database is drowning in read traffic. Performance keeps degrading. "Just increase the instance size" (vertical scaling) works for a while, but it has a ceiling, gets expensive fast, and doesn't address *why* read load is so high in the first place. The question: how do you scale reads without simply throwing a bigger box at it?

## 2. The Solution - Several Techniques, Usually Combined

**Read replicas** - stand up one or more read-only copies of the database (leader-follower replication), and route `SELECT` queries to the replicas while writes still go to the primary. This directly multiplies read capacity, since each replica can serve queries independently. Trade-off: replicas are usually asynchronously replicated, so reads from them can be **slightly stale** - fine for a product feed, not fine for "did my payment just succeed."

**A caching layer (Redis)** - put a cache in front of the database for data that's read far more often than it changes (the same pattern from [[04-handling-traffic-spike-15k-rps]]'s "check cache hit rate" and [[15-simple-vs-scalable-architecture]]'s Architecture B). A cache hit never touches the database at all - this is usually the single highest-leverage fix when a small set of records get read disproportionately often.

**Indexing and query optimization** - a missing index can force a full table scan on every read; adding the right index can turn a query that scans millions of rows into one that touches a few dozen. This is often overlooked because "the database is healthy" (per [[13-hidden-latency-bottleneck]]'s theme) doesn't mean every individual query is efficient.

**Partitioning / sharding** - split the data itself (per [[21-database-partitioning]]) so no single physical piece carries the full read load; sharding in particular spreads both reads and writes across multiple independent database instances entirely.

**CQRS / materialized views** - for read patterns that are expensive to compute from normalized tables (aggregates, joins, reports), precompute and store the read-optimized shape separately, updated asynchronously, so expensive reads become cheap lookups against a pre-built view instead of live joins.

## 3. Mental Model

> Vertical scaling buys you a bigger single box; these techniques instead **reduce how much work each read actually costs**, or **spread reads across more than one box** - and usually you need a mix of both, not a single silver bullet.

## 4. Flow

```mermaid
flowchart TB
  App[Application] --> Cache{In cache?}
  Cache -->|Hit| Return[Return cached result - no DB hit]
  Cache -->|Miss| Router{Read or write?}
  Router -->|Write| Primary[(Primary DB)]
  Router -->|Read| Replica1[(Read Replica 1)]
  Router -->|Read| Replica2[(Read Replica 2)]
  Primary -.async replication.-> Replica1
  Primary -.async replication.-> Replica2
```

## 5. How I'd Answer This In an Interview

1. Ask what the read pattern actually looks like: is it a few hot records read constantly (favors caching), or broad, varied reads across the whole dataset (favors replicas/sharding/indexing)?
2. Start with the cheapest fix that matches the pattern - caching and missing indexes are usually far cheaper to add than infrastructure like sharding.
3. Add read replicas for horizontally scaling general read throughput, being explicit about the staleness trade-off for any consumer that reads from them.
4. Reach for sharding or CQRS only once the simpler layers are demonstrably insufficient - the same "don't ship the impressive one by default" instinct from [[15-simple-vs-scalable-architecture]].

## 6. Trade-offs

| Technique | Gain | Cost |
|---|---|---|
| Read replicas | Multiplies read throughput | Replication lag / staleness |
| Caching | Removes DB reads entirely on hits | Cache invalidation complexity, staleness |
| Indexing | Makes existing queries cheap | Slightly slower writes, more storage |
| Sharding | Scales both reads and writes | Cross-shard queries get harder |

## 7. Common Mistakes
