<script type="text/markdown" class="lesson-data" data-id="92" data-title="Encoding vs Encryption vs Hashing" data-category="Security" data-order="92">
# Encoding vs Encryption vs Hashing (and Which One for Passwords)

> **Connects to**: [[56-password-hashing-not-sha256]] (the password answer in depth) and [[43-crypto-shredding-recovery]] (what encryption really promises).

## 1. The Three, in One Line Each

- **Encoding** = changing the *format* so a system can handle the data. **No secret involved. Anyone can reverse it.** Example: Base64 for sending a file in JSON, URL encoding for `%20`.
- **Encryption** = scrambling data so only someone with the **key** can read it. **Two-way on purpose** - you encrypt to decrypt later. Example: TLS for traffic, a database field holding a customer's PAN card number.
- **Hashing** = a one-way fingerprint. **Cannot be reversed**, and the same input always gives the same output. Example: password storage, file integrity checks.

## 2. Mental Model

> Encoding is a **translation** (anyone can translate back). Encryption is a **locked box** (you need the key). Hashing is a **blender** (you can never get the fruit back, but the same fruit always makes the same smoothie).

## 3. The Table

| | Reversible? | Needs a key? | What it's for | Example |
|---|---|---|---|---|
| Encoding | Yes, by anyone | No | Safe transport/storage of a format | Base64, URL encoding, UTF-8 |
| Encryption | Yes, with the key | Yes | Keeping data secret from others | AES-256-GCM, TLS |
| Hashing | No | No (a salt is not a key) | Proving a value matches, without storing it | Argon2id, bcrypt, SHA-256 |

## 4. The Answer for Passwords: Hashing

And not just any hash - a **slow, salted password hash**: **Argon2id** (first choice) or **bcrypt**.

- **Not encoding:** Base64 is not security at all. `cGFzc3dvcmQ=` is decodable by anyone in one second.
- **Not encryption:** if you can decrypt passwords, so can anyone who steals your key. You never *need* the original password - only to check whether the one typed matches.
- **Not plain SHA-256:** it's a hash, but a *fast* one. A GPU tries billions of guesses per second. Password hashes must be deliberately slow ([[56-password-hashing-not-sha256]]).

## 5. Code

```javascript
// ENCODING - no security, just format
Buffer.from('hunter2').toString('base64');            // 'aHVudGVyMg=='
Buffer.from('aHVudGVyMg==', 'base64').toString();     // 'hunter2' - anyone can do this

// ENCRYPTION - two-way, needs a key you must protect
const { createCipheriv, randomBytes } = require('node:crypto');
const iv = randomBytes(12);
const cipher = createCipheriv('aes-256-gcm', key, iv);  // key from a secrets manager
const enc = Buffer.concat([cipher.update('4111 1111 1111 1111', 'utf8'), cipher.final()]);

// HASHING (passwords) - one-way, slow, salted
const argon2 = require('argon2');
const stored = await argon2.hash(password, { type: argon2.argon2id });
const ok = await argon2.verify(stored, attempt);       // compare, never decrypt
```

## 6. Where Each Belongs in a Real App

- **Passwords** -> hash (Argon2id/bcrypt).
- **Card numbers, Aadhaar/PAN, health data you must show again** -> encrypt, with the key in a secrets manager (or, better, don't store it - let a payment provider hold it).
- **Data in transit** -> encryption (HTTPS/TLS), always.
- **Tokens in a URL, binary in JSON, file names** -> encoding.
- **"Did this file change?"** -> hashing (SHA-256 is perfect here, because speed is a feature).

## 7. Common Mistakes

- Saying "the password is encoded/encrypted in the database" - both are wrong answers in an interview, and the second is a real design flaw.
- Using a fast hash (MD5, SHA-1, SHA-256) for passwords.
- Thinking Base64 hides anything. It's a format, not protection.

## 8. 🧠 Remember

> Encoding is for format (anyone can undo it), encryption is for secrecy (the key undoes it), hashing is one-way (nothing undoes it) - and passwords need hashing with a slow, salted algorithm like Argon2id.

## 9. Quick Self-Test

1. Why is "we encrypt passwords" a worse answer than "we hash passwords"?
2. Why is SHA-256 great for file integrity but wrong for passwords?
3. Which of the three would you use for a stored card number that must be shown again, and what extra thing does it need?
</script>
<script type="text/markdown" class="lesson-data" data-id="93" data-title="CPU Spike Every Night at 2:17 AM" data-category="Production Debugging &amp; Incidents" data-order="93">
# CPU Hits 100% Every Night at 2:17 AM. No Cron, No Deploy, No Traffic Spike.

> **Similar-question flag**: the method is the checklist from [[20-sudden-latency-spike-checklist]] and the "load = requests x cost per request" idea from [[58-less-traffic-more-cpu]]. What's new here is the clue that matters most: it repeats at a **fixed time**, which means something *scheduled* - just not scheduled where you looked.

## 1. The Clue Is the Clock

Anything that happens at the same minute every night is on a timer. "No cron jobs" usually means **no cron jobs in your application repo**. Timers live in many other places.

The odd minute matters too: `2:17` is not a human choice like `2:00`, so it smells like a job started at an offset, a staggered fleet-wide schedule, or a job that begins earlier and *reaches* your service at 2:17.

## 2. Where the Timer Is Hiding

**On the machine itself**
- OS-level `cron` / `systemd` timers on the server (`crontab -l`, `sudo crontab -l`, `ls /etc/cron.*`, `systemctl list-timers`) - log rotation, package updates, antivirus or security scans, certificate renewal.
- Backup agents and snapshot tools (EBS snapshots, Velero), which can hammer disk and CPU.
- Container platforms: a Kubernetes **CronJob** (possibly in another namespace) landing on the same node.

**In the database**
- Autovacuum / `ANALYZE` (Postgres), `OPTIMIZE TABLE`, index rebuilds, statistics jobs.
- A scheduled dump/backup, a read replica catching up, or a nightly reporting/ETL query run by the analytics team.
- **TTL/expiry sweeps** - a "delete old rows" job doing exactly what [[03-ttl-deletion-at-scale]] warns about.

**In your own stack, but not called "cron"**
- `setInterval` in a long-running Node process, a BullMQ/Agenda **repeatable job**, a cache warmer.
- **Synchronized expiry**: connections or cache entries created together expire together ([[16-synchronized-connection-pool-expiry]]) - a nightly restart makes them all line up at the same minute forever after.
- Certificate/token refresh, feature-flag or config polling that fans out.

**Outside your company**
- A partner or client system pulling a nightly export, a scraper on a schedule, or a cloud provider maintenance window.

## 3. How to Find It (in Order)

1. **Confirm the pattern**: is it exactly daily? Same minute? Every host or one host? (One host = a local timer. All hosts = something shared, like the database or an external caller.)
2. **Profile during the window** - this is the fastest answer. Capture a CPU profile or flame graph at 2:17 (`node --cpu-prof`, `perf`, or your APM's profiler) and see the function names.
3. **Check the boring lists**: `systemctl list-timers`, `crontab -l` for every user, `kubectl get cronjobs -A`, database scheduled jobs.
4. **Correlate**: do logs, DB connections, disk I/O, or network bytes also spike? High CPU with high disk I/O suggests backup/vacuum; high CPU with no I/O suggests computation or GC.
5. **Check GC and memory**: a nightly memory peak can trigger heavy garbage collection ([[22-nodejs-memory-leak-debugging]]).

## 4. Mental Model

> A spike at the same minute every night is never random - it's a schedule you don't own yet. Your job is to find whose timer it is: the OS, the database, a library inside your app, or someone outside.

## 5. What to Do Once You Find It

- **Move it** to a genuinely quiet time, or spread it out with **jitter** so it doesn't align with everything else.
- **Throttle it**: batch with sleeps, lower its priority, or run it on a separate instance/replica so user traffic isn't affected.
- If it's a legitimate job that must run, **scale for it** or accept it and make sure alerts don't fire on a known window.

## 6. 🧠 Remember

> An exact repeating time means a schedule, so if your app has no cron, look at the OS timers, the database's own maintenance, scheduled jobs inside your process, and outside callers - then profile during the window to name the exact function.

## 7. Quick Self-Test

1. Why does "it happens on every host" point somewhere different than "it happens on one host"?
2. Why is a CPU profile taken during the spike more useful than reading code beforehand?
3. Name two schedulers that exist outside your application repo but can still peg your CPU.
</script>
<script type="text/markdown" class="lesson-data" data-id="94" data-title="JWT Auth Safely in Production" data-category="Auth &amp; Security" data-order="94">
# JWT Auth in Production: Tokens Get Stolen, Users Log Out, Permissions Change

> **Builds on**: [[09-jwt-logout-invalidation]] (how to invalidate a stateless token) and [[85-authentication-vs-authorization]] (who you are vs what you may do). This is the practical checklist for shipping JWT auth safely.

## 1. Why the Tutorial Version Breaks

`login -> generate token -> verify token` works until production asks four questions:

1. The token was **stolen** - how do you stop it being used?
2. The user pressed **logout** - a signed token is still valid until it expires.
3. The session must **expire**, but users shouldn't be kicked out mid-work.
4. **Permissions changed** (a user was demoted) - the old token still claims the old role.

Every one of these is the same root issue: a JWT is a **signed note the server doesn't remember issuing**.

## 2. The Safe Setup

**1. Two tokens, not one.**
- **Access token**: short life (10-15 minutes), sent on every API call, verified by signature only (fast, no database hit).
- **Refresh token**: long life (days), stored **server-side** so it can be revoked, used only to get a new access token.

**2. Store them properly.**
- Best for browsers: **httpOnly, Secure, SameSite cookies** - JavaScript can't read them, so an XSS bug can't steal them. Add CSRF protection (SameSite=Lax/Strict plus a CSRF token for state-changing routes).
- `localStorage` is convenient but readable by any injected script. For mobile apps use the platform's secure storage.

**3. Rotate refresh tokens, and detect theft.**
Each refresh issues a **new** refresh token and invalidates the old one. If an old one is reused, that means someone has a copy: revoke the whole family and force a re-login.

**4. Logout must kill the refresh token** (delete it server-side), and optionally add the access token's `jti` to a short-lived Redis blocklist ([[09-jwt-logout-invalidation]]).

**5. Handle permission changes** with a `tokenVersion` (or `permissionsUpdatedAt`) claim: bump the stored value when a role changes, and any older token stops being accepted. With 15-minute access tokens, most changes need nothing else.

**6. Verify properly.** This is where real breaches come from:
- Pin the algorithm: `algorithms: ['RS256']`. Never accept `alg` from the token (`none` and HS/RS confusion attacks).
- Check `exp`, `iss` and `aud` - not just the signature.
- Keep a `kid` in the header so you can rotate signing keys without logging everyone out.

**7. Keep the payload boring.** A JWT is signed, **not encrypted** - anyone can read it. No PII, no secrets. Keep it small: user id, role/version, `jti`, `exp`.

## 3. Code

```javascript
const jwt = require('jsonwebtoken');

// Issue: short access token + rotating refresh token stored server-side
function issueAccess(user) {
  return jwt.sign(
    { sub: user.id, ver: user.tokenVersion, jti: crypto.randomUUID() },
    PRIVATE_KEY,
    { algorithm: 'RS256', expiresIn: '15m', issuer: 'api.myapp.com', audience: 'myapp-web', keyid: CURRENT_KID }
  );
}

// Verify: pin the algorithm and check issuer/audience, not just the signature
async function auth(req, res, next) {
  try {
    const token = req.cookies.access;                  // httpOnly cookie
    const payload = jwt.verify(token, publicKeyFor(token), {
      algorithms: ['RS256'], issuer: 'api.myapp.com', audience: 'myapp-web',
    });
    if (await redis.get('blocklist:' + payload.jti)) return res.status(401).json({ error: 'revoked' });
    const user = await users.findById(payload.sub);
    if (!user || user.tokenVersion !== payload.ver) return res.status(401).json({ error: 'stale token' });
    req.user = user;
    next();
  } catch {
    res.status(401).json({ error: 'invalid token' });  // 401 = who are you; 403 = not allowed
  }
}
```

## 4. Do You Even Need JWT?

For a normal web app with one backend, a **plain server session** (session id in an httpOnly cookie, state in Redis) is simpler and revocable by design. JWTs earn their place when many services must verify a token without calling an auth service, or for mobile/third-party API clients. Choosing the simpler option is a valid, senior answer ([[42-resilience-vs-overengineering]]).

## 5. Checklist

- [ ] Short access token + revocable, rotating refresh token
- [ ] httpOnly + Secure + SameSite cookies (or secure mobile storage), HTTPS everywhere
- [ ] Logout deletes the refresh token (and blocklists the access token if needed)
- [ ] `tokenVersion` claim for role/permission changes and "log out everywhere"
- [ ] Algorithm pinned, `exp`/`iss`/`aud` verified, `kid` for key rotation
- [ ] No PII or secrets in the payload
- [ ] Rate limiting on login and refresh ([[79-blog-rate-limiting]])

## 6. 🧠 Remember

> A JWT is a signed note anyone can read and nobody can recall - so keep access tokens short, keep the revocable state in a rotating refresh token, verify algorithm/issuer/audience (not just the signature), and use a version claim so permission changes take effect.

## 7. Quick Self-Test

1. Why do httpOnly cookies protect a token from XSS when localStorage doesn't, and what new risk do they add?
2. What does refresh-token rotation detect that a long-lived refresh token can't?
3. A user is demoted from admin. What makes their existing token stop working?
</script>
<script type="text/markdown" class="lesson-data" data-id="95" data-title="Four Database Interview Questions" data-category="Databases" data-order="95">
# Four Database Questions Backend Interviews Keep Asking

> **Connects to**: [[57-two-indexes-still-slow-composite]] and [[50-slow-query-500m-rows]] (indexes in practice), [[34-where-vs-having]] and [[63-query-faster-second-time]] (query basics).

## 1. Clustered vs Non-Clustered Index

**Clustered index** = the table rows are physically stored **in the order of that index**. There can be only **one** per table, because the data can only be sorted one way. In MySQL/InnoDB the primary key *is* the clustered index; in Postgres, tables are heaps and `CLUSTER` is a one-time reorder, so this question is usually about SQL Server/MySQL.

**Non-clustered (secondary) index** = a separate structure holding the indexed column plus a pointer back to the row. You can have many.

**Why it matters:** reading a range from a clustered index is fast because the rows sit next to each other on disk. A non-clustered index may need a second lookup to fetch the rest of the row (the "bookmark lookup") - unless the index is **covering**, meaning it already contains every column the query needs.

> Clustered = the phone book itself, sorted by surname. Non-clustered = an index at the back saying "Sharma - page 214".

**Practical tip:** in InnoDB, a random primary key (UUIDv4) scatters inserts through the clustered index and hurts write performance, which is exactly the point from [[59-uuid-vs-auto-increment]].

## 2. What Is a Materialized View?

- A **view** is a saved query. It runs every time you select from it, and stores no data.
- A **materialized view** stores the **result** on disk, like a cached table. Reads are fast, but the data is only as fresh as the last refresh (`REFRESH MATERIALIZED VIEW`, on a schedule or on demand).

**Use it when** an expensive aggregation is read far more often than the underlying data changes: dashboards, monthly reports, leaderboards. It turns a 45-second aggregation into a millisecond lookup ([[28-scaling-database-reads]]).

**The trade-off** is staleness plus the cost of refreshing. Postgres also supports `REFRESH ... CONCURRENTLY` so reads aren't blocked during a refresh.

## 3. Stored Procedure vs Function

| | Stored procedure | Function |
|---|---|---|
| Purpose | Do work (a series of statements) | Compute and return a value |
| Returns | Optionally output parameters / result sets | Always returns a value |
| Call style | `CALL proc(...)` | Inside SQL: `SELECT fn(col) FROM t` |
| Transactions | Can usually manage them (COMMIT/ROLLBACK) | Usually cannot |
| Side effects | Allowed (INSERT/UPDATE/DELETE) | Restricted, especially if marked deterministic/immutable |

> A function answers a question; a procedure performs a task.

## 4. Find the Nth Highest Salary

The version to write first (standard SQL, handles ties honestly):

```sql
-- Nth highest DISTINCT salary, e.g. N = 3
SELECT DISTINCT salary
FROM employees
ORDER BY salary DESC
OFFSET 2 ROWS FETCH NEXT 1 ROWS ONLY;   -- MySQL/Postgres: LIMIT 1 OFFSET 2
```

Better in an interview, because it names the tie behaviour explicitly:

```sql
-- DENSE_RANK: equal salaries share a rank, so "3rd highest" means the 3rd distinct amount
SELECT emp_id, name, salary
FROM (
  SELECT e.*, DENSE_RANK() OVER (ORDER BY salary DESC) AS rnk
  FROM employees e
) ranked
WHERE rnk = 3;
```

**Say this out loud:** `RANK()` skips numbers after ties (1,2,2,4), `DENSE_RANK()` doesn't (1,2,2,3), and `ROW_NUMBER()` picks one arbitrary row per tie. Which one is "correct" depends on whether two people on the same salary count once or twice - ask the interviewer.

**Also mention:** an index on `salary DESC` lets the `LIMIT/OFFSET` version stop early instead of sorting the whole table.

## 5. 🧠 Remember

> Clustered = the rows themselves in order (one per table); a materialized view is a stored result you must refresh; a function returns a value while a procedure does work; and for "Nth highest", use DENSE_RANK and state how you're treating ties.

## 6. Quick Self-Test

1. Why can a table have only one clustered index?
2. When is a materialized view the wrong choice?
3. What's the difference in output between `RANK()` and `DENSE_RANK()` when two people earn the same salary?
</script>
<script type="text/markdown" class="lesson-data" data-id="96" data-title="12 LPA to 22 LPA Is Not More LeetCode" data-category="Blog" data-order="96">
# Blog: 12 LPA to 22 LPA Is Not "More LeetCode"

*What actually moved the people I know. The jump is a packaging problem as much as a skill problem.*

---

## The Six Things That Moved People

**1. One service they could explain under load.**
Not five side projects. One system where you can answer: what breaks at 10x, which component saturates first, how you'd know. That's the whole method in [[53-blog-senior-system-design-without-big-scale]] - and you can practise it on the small system you already work on.

**2. 8-10 DSA patterns, not 400 random Easy problems.**
Sliding window, two pointers, hashing, binary search on answer, BFS/DFS, heap/top-k, intervals, prefix sums, basic DP, graph traversal. Patterns transfer; solved-problem counts don't.

**3. SQL that uses `EXPLAIN`, not just `SELECT`.**
Being able to read a query plan, spot a sequential scan, and add the right composite index is a senior signal that very few candidates show ([[50-slow-query-500m-rows]], [[57-two-indexes-still-slow-composite]], [[95-database-interview-questions]]).

**4. A resume with latency, cost and users - not "worked on APIs".**
Compare:
- *Before:* "Worked on backend APIs using Node.js and MongoDB."
- *After:* "Cut p95 checkout latency 2.4s -> 380ms for 40k daily users by removing sequential calls and adding a Redis cache; cloud bill down 18%."
Same work. The second version tells the interviewer you measure things. If you don't have exact numbers, use honest ranges and say how you measured.

**5. 12 targeted applications + 4 referrals, not 200 blasts.**
A referral plus a short note about why *this* company is worth more than a hundred cold applications. Targeted means: you read what they build and can say which of your projects is closest.

**6. 6 mock interviews where they said the trade-off out loud.**
Not silent practice. The skill being graded is explaining *why this and not that* while someone pushes back ([[30-workload-before-conclusion]], [[42-resilience-vs-overengineering]]).

## Why "Packaging" Is the Right Word

Two engineers with the same three years of experience get very different offers, because one can *show* what they know in the 45 minutes the interviewer has. Packaging means:

- **Evidence over claims:** numbers, not adjectives.
- **Depth over breadth:** one system explained well beats five listed.
- **Reasoning out loud:** the interviewer can only grade what you say.

None of this replaces skill - it makes existing skill legible.

## A Plan That Fits Around a Job

| Weeks | Focus |
|---|---|
| 1-2 | Pick your one system. Write down its load, bottleneck at 10x, and failure modes. |
| 3-4 | 8-10 DSA patterns, 5-8 problems each, revisited, not 200 new ones. |
| 5 | SQL: `EXPLAIN` on your real slow queries; learn indexes and joins properly. |
| 6 | Rewrite the resume around latency, cost, users, scale. |
| 7-8 | 12 targeted applications, ask for 4 referrals, do 6 mocks and record yourself. |

## 🧠 Remember

> The jump usually isn't more problems solved - it's one system you can explain under load, patterns instead of volume, numbers on your resume, and trade-offs spoken out loud in a room.

## Reflect

1. Which single system would you pick as "the one you can explain under load"? Can you name what breaks first at 10x?
2. Rewrite one resume line to include latency, cost, users or scale.
</script>
<script type="text/markdown" class="lesson-data" data-id="97" data-title="Bulk Price Update and Replica Lag" data-category="Databases" data-order="97">
# `UPDATE products SET price = price * 1.1` on 12M Rows: Two Prices at Once

> **Connects to**: [[81-delete-150m-rows-safely]] (same batching discipline for mass writes) and [[28-scaling-database-reads]] (why replicas lag). The new problem here is that a *partly applied* price change is visible to users.

## 1. What Actually Went Wrong

One statement rewrote 12 million rows. Two separate problems followed:

1. **A giant transaction.** One long write holds locks, bloats the undo/WAL, and if it fails halfway it rolls back for just as long.
2. **Replica lag of 40 seconds.** Reads that go to replicas still saw old prices while the primary had new ones. So the product listing showed the old price and the cart showed the new one: **two prices at the same moment**.

Note the second one isn't fixed by batching alone. Smaller batches actually make the mixed-price window *longer*, just less violent. Users seeing two prices is a **rollout** problem, not a throughput problem.

## 2. The Real Fix: Don't Mutate Prices In Place - Switch Versions

Make the price change a single, instant, atomic event that every replica sees at once.

**Option A - price list version (best for catalog-wide changes).**

```sql
-- prices live in a versioned table, never overwritten
CREATE TABLE price_list (id serial PRIMARY KEY, name text, status text);  -- draft | active | retired
CREATE TABLE price_item (price_list_id int, product_id bigint, price numeric,
                         PRIMARY KEY (price_list_id, product_id));

-- 1. Build the new list in the background, as slowly as you like. Nobody reads it yet.
INSERT INTO price_item (price_list_id, product_id, price)
SELECT 2, product_id, price * 1.1 FROM price_item WHERE price_list_id = 1;

-- 2. Flip, in one tiny transaction (one row changes, replicas apply it instantly)
BEGIN;
UPDATE price_list SET status = 'retired' WHERE id = 1;
UPDATE price_list SET status = 'active'  WHERE id = 2;
COMMIT;
```

The heavy work is a background insert nobody reads; the *cutover* is one row. Rollback is flipping back. This is the same idea as dropping a partition instead of deleting rows ([[21-database-partitioning]]): make the expensive thing invisible, and the visible thing cheap.

**Option B - effective-dated prices.** Store `price, effective_from` and have reads pick the row where `effective_from <= now()`. Write all the future prices ahead of time, and the change happens by clock, everywhere at once. (Mind timezone/DST handling - see [[67-dst-scheduled-jobs]].)

## 3. If You Must Update In Place

Then the goal is: keep lag low, and make sure nobody can see a half-applied catalog.

**Batch and throttle, watching lag:**

```javascript
// Batch by primary key, commit each batch, and pause when replicas fall behind
let lastId = 0;
for (;;) {
  const { rows } = await db.query(
    `UPDATE products SET price = price * 1.1
      WHERE id IN (SELECT id FROM products WHERE id > $1 ORDER BY id LIMIT 5000)
      RETURNING id`, [lastId]);
  if (!rows.length) break;
  lastId = rows[rows.length - 1].id;

  // Postgres: lag in seconds on the primary
  const { rows: [lag] } = await db.query(
    `SELECT COALESCE(MAX(EXTRACT(EPOCH FROM (now() - reply_time))), 0) AS sec FROM pg_stat_replication`);
  while (lag.sec > 5) { await sleep(1000); }        // let replicas catch up
  await sleep(50);                                   // be kind to the primary
}
```

**And close the "two prices" window** with one of these:
- **Read the price from the primary** (or from a cache written at cutover) for anything money-related: cart, checkout, invoice. Product listings can be slightly stale; the price you *charge* must not be.
- **Pin one price per user session**: resolve the price once, carry it (or a `price_list_id`) through cart and checkout, so a user never sees it change mid-flow.
- **Do it in a low-traffic window** and hide the catalog behind a cache that's refreshed after the update completes.

## 4. Protect the User, Not Just the Database

Whatever the mechanism, decide the rule before you start: **the price shown when the item was added is the price honoured at checkout** (or you clearly tell the user it changed). That rule is what stops "split brain" from becoming a support ticket or a refund.

## 5. Checklist Before a Mass Write

- [ ] Can this be a version flip or an effective date instead of an in-place update?
- [ ] Batched, throttled, resumable (keyed by primary key, not `OFFSET`)?
- [ ] Replica lag watched, with an automatic pause?
- [ ] Money reads pinned to the primary or to a session-fixed price?
- [ ] Rollback plan: one flip back, or a saved copy of the old values?
- [ ] Run it off-peak, and announce it if prices are customer-visible.

## 6. 🧠 Remember

> Don't rewrite 12 million rows live - build the new prices in the background and flip a single version row, so every replica switches at the same instant; if you must update in place, batch with replica-lag checks and serve money-critical reads from the primary.

## 7. Quick Self-Test

1. Why do smaller batches fix lag but not the "two prices at once" problem?
2. What makes the version-flip approach atomic for replicas as well as the primary?
3. Which reads in an e-commerce flow must never come from a lagging replica?
</script>
<script type="text/markdown" class="lesson-data" data-id="98" data-title="Job Scheduler for Millions (Hinglish)" data-category="System Design at Scale" data-order="98">
# Job Scheduler Design (Hinglish): "Every Monday 9 AM" x Millions of Jobs

> **Hinglish lesson** - aapne isi tarah maanga tha. Technical terms English mein hain.
> **Connects to**: [[03-ttl-deletion-at-scale]] (delay queue pattern), [[67-dst-scheduled-jobs]] (local time + DST), [[19-idempotent-consumer-duplicate-events]] (duplicate execution), [[65-pagerduty-incident-dedup-paging]] (outbox + leasing), [[14-cascading-failure-recovery]] (retries with backoff).

## 1. Problem Samjho

User bolta hai: "Har Monday 9 AM par mera report job chalao." Millions aise schedules hain. Humein chahiye:

- One-time **aur** recurring jobs
- **No duplicate execution** (ek run exactly ek baar effect kare)
- **Retry** failures
- **Worker crash** ho jaaye to job lost na ho

Naive solution: ek `setInterval` jo har minute poori table scan kare. 10 million rows par ye har minute database ko maar dega, aur agar wo ek server crash ho gaya to **saare** jobs ruk jaayenge. Isliye proper design chahiye.

## 2. Scale Estimate (pehle numbers)

Maan lo 10M schedules, average har schedule roz 1 baar chalta hai:

- `10,000,000 / 86,400` = **~115 jobs/second average**
- Peak bahut zyada, kyunki log round numbers chunte hain: 9:00 AM par lakhs jobs ek saath. Ye **thundering herd** hai ([[16-synchronized-connection-pool-expiry]] wali problem).
- Isliye: due jobs ko **second-level buckets** mein baanto aur execution ko thoda **jitter** do.

## 3. Core Idea: Schedule Store + Due Index + Workers

Teen alag cheezein rakho (ye sabse important design decision hai):

1. **Schedule table** (source of truth): kya chalana hai, kis rule se (cron expression + timezone).
2. **Due index / queue**: *agla* run kab hai - yahin se trigger hota hai (Redis ZSET ya `next_run_at` column with index).
3. **Run table** (execution log): har actual run ka record, jo duplicate rokta hai.

```mermaid
flowchart TB
  API[Schedule API] --> DB[(schedules: cron, tz, next_run_at)]
  DB --> P[Poller / Dispatcher - leader elected, sharded]
  P -->|due jobs, batched| Q[Queue: Kafka / SQS / BullMQ]
  Q --> W1[Worker 1]
  Q --> W2[Worker 2]
  Q --> W3[Worker N]
  W1 --> R[(job_runs: unique job_id + run_at)]
  W1 -->|success/fail| DB
  W1 -->|failure| RT[Retry with backoff + jitter -> DLQ]
```

## 4. Trigger Kaise Kare (ye asli sawaal hai)

**Poller approach (simple aur reliable):**

```sql
-- har 1 second: sirf due rows, batch mein, lock ke saath
UPDATE schedules SET status = 'dispatching', locked_by = $worker, locked_at = now()
WHERE id IN (
  SELECT id FROM schedules
  WHERE next_run_at <= now() AND status = 'active'
  ORDER BY next_run_at
  LIMIT 500
  FOR UPDATE SKIP LOCKED          -- do pollers same row na uthayein
)
RETURNING id, cron_expr, timezone;
```

`FOR UPDATE SKIP LOCKED` ki wajah se aap **kai poller** chala sakte ho bina duplicate ke. Index chahiye: `(status, next_run_at)`.

**Redis ZSET approach (bahut fast):** `ZADD due_jobs <next_run_epoch> <jobId>`, phir `ZRANGEBYSCORE due_jobs 0 now LIMIT 0 500` + atomic remove (Lua). Memory mein hone ki wajah se millions par bhi milliseconds. Lekin Redis source of truth nahi - **DB hi truth hai**, Redis sirf index hai, taaki restart par rebuild ho sake.

**Scale karne ke liye sharding:** `shard = hash(job_id) % N`. Har poller instance apna shard dekhta hai. Ek poller mar gaya to uska shard doosre ko mil jaata hai (leader election / consistent hashing). Isse ek hi poller bottleneck nahi banta.

## 5. Duplicate Execution Kaise Roke

Sirf queue par bharosa mat karo - queues **at-least-once** hote hain, exactly-once nahi ([[19-idempotent-consumer-duplicate-events]]).

```sql
-- har run ka unique identity: job + uska scheduled time
CREATE TABLE job_runs (
  job_id bigint, run_at timestamptz, status text, attempt int,
  PRIMARY KEY (job_id, run_at)
);
```

Worker kaam shuru karne se pehle:

```javascript
// DB decide karega, application check nahi - yahi race-free hai
const { rowCount } = await db.query(
  `INSERT INTO job_runs (job_id, run_at, status, attempt)
   VALUES ($1, $2, 'running', 1) ON CONFLICT DO NOTHING`, [jobId, runAt]);
if (rowCount === 0) return;   // koi aur already chala raha hai / chala chuka hai
await doTheWork(jobId, runAt);
```

Ye wahi check-then-act fix hai jo [[26-duplicate-email-race-condition]] mein hai: database uniqueness enforce kare, code nahi.

## 6. Worker Crash Handle Karna (leasing / visibility timeout)

Worker job utha kar mar gaya - ab kya? Har run ke saath ek **lease** do:

- Worker `locked_at` set karta hai aur beech-beech mein **heartbeat** karke lease extend karta hai.
- Ek **reaper** job un rows ko dhoondhta hai jinka `status='running'` hai lekin `locked_at` purana ho gaya (lease expired), aur unhe wapas `pending` kar deta hai.
- SQS mein ye built-in hai (visibility timeout), Kafka mein consumer group rebalance karta hai.

Isliye jobs **idempotent** hone chahiye - kyunki crash ke baad wahi run dobara chalega.

## 7. Recurring Jobs: Agla Run Kab?

Job complete hone ke **baad** next run calculate karo, purane schedule se:

```javascript
const { CronExpressionParser } = require('cron-parser');
// local time + IANA timezone store karo, fixed UTC nahi (DST issue - Lesson 67)
const it = CronExpressionParser.parse('0 9 * * 1', { tz: 'Asia/Kolkata', currentDate: lastRunAt });
await db.query('UPDATE schedules SET next_run_at = $1, status = $2 WHERE id = $3',
  [it.next().toDate(), 'active', jobId]);
```

Do zaroori baatein:
- **Timezone + DST**: "9 AM local" ko har baar fresh calculate karo ([[67-dst-scheduled-jobs]]).
- **Missed runs policy**: agar system 3 ghante down tha, to kya sab missed runs chalayenge (catch-up) ya sirf latest (skip)? Ye business decision hai - interview mein poochho. Reports ke liye aksar "skip, sirf latest chalao" sahi hota hai.

## 8. Retries aur Failures

- **Exponential backoff + jitter** (1m, 5m, 25m...), max attempts ke saath ([[14-cascading-failure-recovery]]).
- Max attempts ke baad **dead letter queue** + alert - silently drop mat karo.
- Ek customer ke jobs baaki sabko block na karein: per-tenant **rate limit** ya alag queue (bulkhead).

## 9. Peak Handling (9 AM problem)

- **Jitter**: `next_run_at + random(0..60s)`, taaki 9:00:00 par sab ek saath na chalein.
- **Bounded worker concurrency** ([[61-1000-requests-10x-faster]]) aur queue depth par autoscaling ([[23-queue-backlog-after-spike]]).
- Poller queue mein daal deta hai - agar workers slow hain to backlog banega, par jobs lost nahi honge.

## 10. Trade-offs (interview mein bolne layak)

| Approach | Plus | Minus |
|---|---|---|
| DB polling (`SKIP LOCKED`) | Simple, ek hi source of truth, crash-safe | Har second query; index aur sharding zaroori |
| Redis ZSET | Bahut fast, millions handle karta hai | Redis restart/failover par rebuild chahiye; truth DB mein hi rakho |
| Kafka delayed topics | High throughput, durable | Arbitrary per-job time set karna awkward |
| Cloud (EventBridge/Cloud Scheduler) | Aapko kuch chalana nahi padta | Per-schedule limits aur cost, vendor lock-in |

## 11. 🧠 Remember

> Schedule (kya chalana hai), due index (kab chalana hai) aur run log (kya chal chuka hai) - teeno alag rakho: DB se due jobs `SKIP LOCKED` se batch mein uthao, `(job_id, run_at)` ke unique constraint se duplicate roko, lease + reaper se crash handle karo, backoff+jitter se retry karo, aur next run hamesha local time + timezone se calculate karo.

## 12. Quick Self-Test

1. Queue "at-least-once" hai - to phir duplicate execution kaunsi cheez rokti hai?
2. Worker crash hone par job wapas kaise aata hai, aur uske liye job mein kya property honi chahiye?
3. 9:00 AM par lakhs jobs ek saath due hain - aap kya badlenge?
</script>
<script type="text/markdown" class="lesson-data" data-id="99" data-title="AZ Down: What to Check First" data-category="Cloud &amp; Infrastructure (AWS)" data-order="99">
# One of Your Two AZs Goes Down and Users See Errors - What Do You Check First?

> **Same-question flag**: the design answer is [[12-multi-az-availability]] (Multi-AZ ASG + ALB + RDS failover). That lesson is "how do I build it"; this one is the **incident** version - what you check in the first five minutes - plus how each named piece (ALB, Auto Scaling, Multi-AZ RDS, Route 53, health checks) should behave so users barely notice.

## 1. First Question: Why Are Users Seeing Errors At All?

You're already in 2 AZs, so a single AZ failure *should* be invisible. Errors mean one of these assumptions broke:

1. **Health checks aren't failing fast enough.** The ALB keeps sending traffic to dead targets until they fail the threshold. With a 30-second interval and 5 unhealthy checks, that's 2.5 minutes of errors. Check: ALB target group health, `UnHealthyHostCount`, `HTTPCode_ELB_5XX_Count`.
2. **The surviving AZ can't carry 100% of the traffic.** If both AZs ran at 60% capacity, the survivor is now at 120%. Check: instance count per AZ, CPU, and whether Auto Scaling is launching replacements *in the healthy AZ*.
3. **The database primary was in the dead AZ.** Multi-AZ RDS failover is automatic but takes roughly 60-120 seconds, and apps that cache the DNS or don't retry will error through it. Check: RDS events for "failover started/completed", and your app's connection errors.
4. **Something was single-AZ that you forgot.** A NAT gateway, an ElastiCache node, a Kafka broker, a worker that only ran in one AZ, or a subnet with no capacity. This is the most common real cause.

## 2. The Five-Minute Checklist

1. **AWS Health Dashboard** - confirm it's actually an AZ event, not your deploy.
2. **ALB target health per AZ** - are dead targets still receiving traffic? Is cross-zone load balancing on?
3. **Auto Scaling activity** - is it launching in the healthy AZs, or failing with "insufficient capacity" in the dead one?
4. **RDS** - did failover happen, and is the app reconnecting?
5. **Single-AZ dependencies** - NAT, cache, queues, cron hosts.
6. Then: if the survivor is saturated, **raise desired capacity** and shed non-critical load ([[04-handling-traffic-spike-15k-rps]]).

## 3. How Each Piece Should Be Configured So Users Barely Notice

- **Health checks**: short interval (10s), low unhealthy threshold (2-3), and a real `/health` endpoint that checks the app's own dependencies - not a static 200.
- **ALB**: enabled in **all** AZs, with **cross-zone load balancing on**, so the remaining targets share traffic evenly.
- **Auto Scaling**: subnets in 3 AZs, not 2. With 2 AZs you lose 50% of capacity; with 3 you lose 33%. Keep enough headroom that the survivors can absorb the loss, and let the ASG replace lost instances automatically.
- **Multi-AZ RDS**: standby in another AZ, app connects by the **endpoint name** (never a cached IP), with short connection timeouts and retry-on-reconnect so the 60-120s failover is a blip, not an outage.
- **Route 53**: health-checked records matter for *multi-region*; within one region the ALB already handles AZ failure. Keep DNS TTLs low (60s) so a region-level switch is possible later.
- **Stateless app** ([[06-ec2-autoscaling]]): sessions in a shared store, so a user whose instance vanished just continues on another.

## 4. The Honest Trade-off

Surviving an AZ loss invisibly means **paying for capacity you don't use on a normal day** (N+1 across 3 AZs). That's the actual decision, and saying it out loud is the senior answer ([[42-resilience-vs-overengineering]]).

## 5. 🧠 Remember

> In a 2-AZ setup, errors during an AZ failure mean health checks were too slow, the survivor was too small, the database was failing over, or something was quietly single-AZ - check those four, in that order.

## 6. Quick Self-Test

1. Why do 3 AZs need less spare capacity per AZ than 2?
2. Why can an app still error during an RDS Multi-AZ failover, and what makes it a blip instead?
3. Which AZ-failure symptoms does Route 53 *not* solve inside a single region?
</script>
<script type="text/markdown" class="lesson-data" data-id="100" data-title="React Interview: 7 Points (Hinglish)" data-category="Frontend" data-order="100">
# React Interview 2026: Ye 7 Points Hi Poochhe Jaate Hain (Hinglish)

> **Connects to**: [[33-react-performance-at-scale]] (rendering performance) aur [[51-fast-api-slow-page]] (page load).

## 1. State vs Derived State

**Rule:** ek hi source of truth rakho. Jo cheez already state se nikal sakti hai, use **state mat banao**.

```javascript
// GALAT - fullName ab sync mein rakhna padega, bug guarantee
const [first, setFirst] = useState(''), [last, setLast] = useState('');
const [fullName, setFullName] = useState('');

// SAHI - derived value render ke time compute karo
const fullName = first + ' ' + last;
// mehenga calculation ho tabhi useMemo
const sorted = useMemo(() => bigList.sort(cmp), [bigList]);
```

Interview line: *"Derived state duplicate truth banata hai, jo stale ho jaata hai."*

## 2. Rendering Model (rerender kyun hota hai)

- Component rerender hota hai jab: uska **state** badle, **props** badlein, ya **parent** rerender ho.
- `key` reconciliation decide karta hai. Array index ko key banana list reorder par galat item update karta hai. **Stable id** use karo.
- Key badalne par React purana component **unmount** karke naya mount karta hai - state chala jaata hai (accidental remount).

## 3. Effects: `useEffect` vs Event Handler

**Pehla sawaal:** ye kaam kisi *event* se hota hai ya *render ke baad sync* karne ke liye hai?

- Button click par API call -> **event handler**, useEffect nahi.
- External system se sync (subscription, timer, non-React widget) -> **useEffect**, cleanup ke saath.
- Dependency array galat ho to fetch loop ban jaata hai (har render par fetch -> state set -> render...). Cleanup mein **abort** karo:

```javascript
useEffect(() => {
  const ac = new AbortController();
  fetch('/api/user/' + id, { signal: ac.signal }).then(r => r.json()).then(setUser).catch(() => {});
  return () => ac.abort();          // stale response UI par nahi aayega
}, [id]);
```

## 4. Performance: memo/useMemo/useCallback "default" nahi hain

Pehle **measure** karo (React DevTools Profiler), phir fix karo. Warna aap har jagah memo lagake code ko slow + unreadable bana dete ho.

- `React.memo` tabhi kaam karega jab props ki **reference equality** bane - inline object/function props usko tod dete hain.
- Badi list = **virtualization** (react-window), memo se zyada faida ([[33-react-performance-at-scale]]).

## 5. Data Fetching + Caching

Har fetch ke 4 states hote hain: **loading, error, empty, success** - interview mein chaaron bolo.

React Query / SWR kya *actually* dete hain: cache + dedupe (same key ke do request ek ho jaate hain), background refetch, stale-while-revalidate, retry, aur request cancellation. Ye khud likhoge to yahi sab dobara likhna padega.

## 6. Forms: Controlled vs Uncontrolled

- **Controlled** (`value` + `onChange`): React ke paas truth, validation easy, lekin bade form mein har keystroke par rerender.
- **Uncontrolled** (`ref` / react-hook-form): DOM ke paas truth, tez, isliye 50+ fields wale forms mein behtar.
- Validation: schema (Zod/Yup) se, aur **server par dobara** - client validation sirf UX hai ([[66-blog-before-first-backend-job]]).

## 7. TypeScript + Component API

Invalid state ko **type level par impossible** banao:

```typescript
// discriminated union - "loading ke saath data" jaisa invalid combo ban hi nahi sakta
type State =
  | { status: 'loading' }
  | { status: 'error'; message: string }
  | { status: 'success'; data: User[] };
```

Props mein optional flags ki bheed (`isPrimary`, `isDanger`, `isGhost`) ki jagah `variant: 'primary' | 'danger' | 'ghost'` rakho.

## 🧠 Remember

> Ek source of truth (derived state nahi), rerender ka kaaran samjho (state/props/parent + keys), effects sirf sync ke liye, memo measure karke, fetching ke chaar states, bade forms uncontrolled, aur types se invalid state impossible.

## Quick Self-Test

1. Array index ko `key` banane se list reorder par kya galat hota hai?
2. Button click ki API call `useEffect` mein kyun nahi honi chahiye?
3. `React.memo` lagane ke baad bhi component rerender ho raha hai - sabse common wajah?
</script>
<script type="text/markdown" class="lesson-data" data-id="101" data-title="AI Aur Marketing (Hinglish)" data-category="Blog" data-order="101">
# Blog: AI Almost Kuch Bhi Solve Kar Leta Hai - Phir Marketing Itni Mushkil Kyun Hai? (Hinglish)

## Sawaal

AI code likh deta hai, design bana deta hai, copy bhi likh deta hai. Phir bhi marketing "solve" nahi hui. Log ab bhi launch karte hain aur silence milti hai. Kyun?

## Jawaab: Marketing ka bottleneck **output** nahi, **attention aur trust** hai

Engineering mein problem *closed* hoti hai: "ye API 200ms mein response de" - sahi ya galat check ho sakta hai. Marketing ki problem *open* hai: "logon ko parwaah kyun ho?" Iska koi ek sahi jawab nahi, aur jawab time ke saath badalta rehta hai.

Teen wajah:

**1. Attention zero-sum hai.** Code likhna non-zero-sum hai - main likhun ya aap, dono ka code chal sakta hai. Par ek user ke din mein utne hi minutes hain. AI sabko tez bana deta hai, isliye **supply** badh jaati hai, demand utni hi rehti hai. Jab sab log roz 10 posts likh sakte hain, to average post ki value girti hai - AI se content sasta hua, *dhyaan* nahi.

**2. Trust shortcut nahi le sakta.** Ek achhi landing page 10 minute mein ban jaati hai. "Ye log paisa lekar bhaag to nahi jaayenge" - ye feeling 10 minute mein nahi banti. Reviews, referrals, case studies, brand - ye sab **time aur repetition** maangte hain. AI likhawat tez karta hai, bharosa nahi.

**3. Feedback loop slow aur shor-bhara hai.** Code: test fail hua to turant pata. Campaign: 2 hafte baad pata chalta hai ki kaam kiya ya nahi, aur us beech season, competitor, algorithm - sab badal gaya. Jahan feedback dheema ho, wahan "AI se 100 guna zyada try karo" bhi kaam nahi karta, kyunki aap seekh hi nahi paate ki kaunsa try chala.

## Isi Wajah Se Ye Bhi Sach Hai

Yehi baat [[55-blog-engineering-harder-building-easier]] wali hai, doosri jagah: **banana sasta ho gaya, isliye jo cheez sasti nahi hui uski keemat badh gayi**. Software mein wo judgment hai; business mein wo distribution hai ([[47-technology-vs-distribution]]).

## Engineer Ke Liye Practical Takeaway

- **Distribution pehle socho, product ke saath.** "Pehle 100 log kaun honge aur main unhe kaise dhoondhunga?" - ye code se pehle ka sawaal hai.
- **Ek channel jeeto, 5 nahi.** Ek jagah bharosa banana 5 jagah shor karne se behtar hai.
- **Repetition boring lagta hai, kaam wahi karta hai.** Aapko apna message 50th baar bolte hue bore hoga, tab jaakar log pehli baar sunenge.
- **AI ko volume ke liye mat use karo, iteration ke liye karo:** 10 versions likhwa lo, par bhejo wahi jo aap khud defend kar sako.

## 🧠 Remember

> AI ne content banana sasta kar diya, par attention aur trust wahi ke wahi limited hain - isliye marketing ab bhi mushkil hai: bottleneck likhne mein nahi, suna jaane aur bharosa jeetne mein hai.

## Sochne Ke Liye

1. Aapke pichle project ke pehle 100 users kahan se aate? Kya wo plan code se pehle tha?
2. Aapke kaam mein aisi kaunsi cheez hai jo AI sasti *nahi* kar sakta?
</script>
<script type="text/markdown" class="lesson-data" data-id="102" data-title="LOWER(email) Aur Index (Hinglish)" data-category="Databases" data-order="102">
# `WHERE LOWER(email) = ...` - Staging Mein Index, Production Mein Full Scan (Hinglish)

> **Similar-question flag**: [[50-slow-query-500m-rows]] mein ye rule aa chuka hai ("column par function lagaoge to index use nahi hoga"). Naya yahan ye hai: **staging vs production ka farak** aur teen fixes mein se kaunsa lena chahiye.

## 1. Pehli Galatfehmi Door Karo

Index "gayab" nahi hua. `email` par bana normal B-tree index **dono jagah** is query ke liye useless hai:

```sql
SELECT * FROM users WHERE LOWER(email) = 'alex@gmail.com';
```

Index `email` ki **original values** sorted rakhta hai (`Alex@Gmail.com`), par aap `LOWER(email)` maang rahe ho. Database ko har row par function chalana padega, tabhi pata chalega match hua ya nahi - isliye index skip, **full scan**.

**Phir staging mein "fast" kyun laga?** Kyunki 20,000 rows ka full scan bhi 5-10 ms mein ho jaata hai. Wahan bhi scan hi ho raha tha, bas dard nahi hua. 48 million rows par wahi scan seconds le leta hai.

> Sabak: staging "sahi" nahi tha - sirf chhota tha. Production-jaisa data volume ke bina plan test karna dhokha hai.

Pehla step hamesha: `EXPLAIN ANALYZE` - staging **aur** production dono par.

## 2. Teen Fixes - Kaunsa Kab

**Fix A: Expression (functional) index - turant raahat**

```sql
CREATE INDEX CONCURRENTLY idx_users_email_lower ON users (LOWER(email));
```

Ab index ki values wahi hain jo query maang rahi hai. Code badalna nahi padta. 48M rows par `CONCURRENTLY` zaroori hai warna table lock ho jaayega ([[81-delete-150m-rows-safely]] wali soch).

**Fix B: Generated column + index**

```sql
ALTER TABLE users ADD COLUMN email_lower text GENERATED ALWAYS AS (LOWER(email)) STORED;
CREATE INDEX CONCURRENTLY idx_users_email_lower2 ON users (email_lower);
```

Faida: doosri jagah bhi `email_lower` use kar sakte ho, aur `SELECT` mein saaf dikhta hai. Nuksan: extra storage aur schema change.

**Fix C (asli, lamba jawab): column ko function mein lapetna band karo**

Email case-insensitive hai hi - to **likhte waqt normalize karo**, padhte waqt nahi:

```sql
-- Postgres: citext extension, ya simply lowercase store karo
ALTER TABLE users ADD CONSTRAINT users_email_lower_ck CHECK (email = LOWER(email));
-- app side: user.email = email.trim().toLowerCase();  (signup + login dono par)
CREATE UNIQUE INDEX CONCURRENTLY uq_users_email ON users (email);
```

Phir query seedhi ho jaati hai: `WHERE email = 'alex@gmail.com'` - normal index, normal plan, aur duplicate emails bhi ruk jaate hain ([[26-duplicate-email-race-condition]]).

## 3. Interview Mein Kya Bolna Hai

> "Index gayab nahi hua - `LOWER(email)` ki wajah se wo kabhi use ho hi nahi raha tha; staging mein 20k rows ka scan sasta tha isliye dikha nahi. Turant fix expression index hai. Sahi fix hai email ko write time par normalize karke store karna, phir plain index aur unique constraint dono milte hain. Migration ke liye pehle `CONCURRENTLY` index, phir backfill batches mein."

## 4. Ek Aur Cheez: `SELECT *`

48M rows wali table par `SELECT *` har column laata hai. Index-only scan ka faida lena hai to sirf zaroori columns maango ([[57-two-indexes-still-slow-composite]]).

## 🧠 Remember

> Column ko function mein lapetna index ko mara deta hai - chhoti staging table par ye dikhta nahi. Expression index turant bachata hai, par asli fix hai email ko lowercase mein store karna aur query seedhi rakhna.

## Quick Self-Test

1. Staging mein query "fast" thi - iska matlab index use ho raha tha? Kyun nahi?
2. Expression index aur generated column - kab konsa chunoge?
3. Email lowercase store karne se ek *aur* bug bhi rukta hai - kaunsa?
</script>
