e` usko `ws.send()` kar hi nahi sakta. Toh woh Kafka par produce karta hai aur bhool jaata hai. Delivery worker dhoondhta hai. Gateway bhejta hai. **Isi majboori ne architecture ko sahi shape diya** -- ek stateless service jo kabhi kisi ek socket se bandhi nahi hai, aur isliye kahin bhi, kitni bhi chalayi ja sakti hai.\n\n**Dependency direction (arrows sirf ek taraf):**\n\n```\ngateway/ws-server.ts\n   |-- gateway/connection-manager.ts --> Redis (conn:*, gw:* Pub/Sub)\n   |-- gateway/backpressure.ts       --> ws.bufferedAmount\n   |-- gateway/frame-router.ts\n          |-- services/chat.service.ts\n          |      |-- services/conversation.service.ts --> repositories (Redis + Postgres)\n          |      |-- repositories/message.repository.ts --> Postgres\n          |      |-- infra/kafka.ts (produce)\n          |-- services/sync.service.ts     --> repositories\n          |-- services/receipt.service.ts  --> repositories\n          |-- services/presence.service.ts --> Redis\n\nworkers/delivery.worker.ts  (ALAG PROCESS)\n   |-- Kafka consume -> repositories (members, devices, sessions) -> Redis PUBLISH gw:\u003cnodeId>\n```\n\nDekho ki `services/` se koi arrow **wapas** `gateway/` ki taraf nahi jaata. Ye deewar ek taraf se hi paar hoti hai.\n\n> **Interview tip:** \"Main gateway aur chat service ko alag rakhunga. Gateway stateful hai (sockets uske paas hain) aur memory par bound hai; chat service stateless hai aur CPU/DB par bound hai. Services kabhi socket ko touch nahi karti -- woh Kafka par event daalti hai aur delivery worker + Redis Pub/Sub usko sahi gateway tak pahunchate hain. Isse dono tier alag scale hote hain aur business logic bina WebSocket ke unit-test hota hai.\"\n\n---\n\n## PART 11 + 12 -- Node.js / TypeScript Code (line-by-line)\n\nStack: **`ws`** (raw WebSocket, Socket.IO nahi -- per-connection memory kam), **`ioredis`**, **`kafkajs`**, **`pg`**, **Express 5** (sirf REST ke liye), **pino**, **prom-client**.\n\nOrder: pehle gateway (sockets), phir services (rules), phir repository (storage), phir worker (fan-out), phir sync aur presence. Yahi order bahar se andar ka hai.\n\n### 1. `gateway/ws-server.ts` -- socket server, heartbeat, clean close\n\n```ts\nimport { createServer } from 'node:http';\nimport { WebSocketServer, WebSocket } from 'ws';\nimport { ConnectionManager } from './connection-manager';\nimport { routeFrame } from './frame-router';\nimport { canWrite } from './backpressure';\nimport { logger } from '../infra/logger';\nimport { wsConnectionsActive, wsConnectTotal, wsDisconnectTotal } from '../infra/metrics';\n\nconst NODE_ID = process.env.NODE_ID!;          // e.g. 'gw-042' (pod name se)\nconst HEARTBEAT_MS = 30_000;                   // spec: server har 30 s ping\nconst AUTH_TIMEOUT_MS = 10_000;\nconst MAX_FRAME_BYTES = 8 * 1024;              // 4 KB body ka 2x headroom\n\nexport interface ConnState {\n  userId?: string;\n  deviceId?: string;\n  authed: boolean;\n  isAlive: boolean;                            // pichhle ping ka pong aaya tha?\n}\n\nexport function startGateway(connections: ConnectionManager) {\n  const httpServer = createServer((req, res) => {\n    if (req.url === '/health') { res.writeHead(200); res.end('ok'); return; }\n    res.writeHead(404); res.end();\n  });\n\n  const wss = new WebSocketServer({\n    server: httpServer,\n    path: '/ws',\n    maxPayload: MAX_FRAME_BYTES,\n    perMessageDeflate: false,                  // memory > bandwidth (Part 8 ka math)\n    clientTracking: true,\n  });\n\n  wss.on('connection', (ws: WebSocket) => {\n    const state: ConnState = { authed: false, isAlive: true };\n    (ws as any).state = state;\n    wsConnectionsActive.inc();\n    wsConnectTotal.inc();\n\n    const authTimer = setTimeout(() => {\n      if (!state.authed) ws.close(4001, 'auth timeout');\n    }, AUTH_TIMEOUT_MS);\n\n    ws.on('message', async (raw: Buffer) => {\n      let frame: unknown;\n      try {\n        frame = JSON.parse(raw.toString('utf8'));\n      } catch {\n        ws.send(JSON.stringify({ type: 'error', code: 'BAD_FRAME', message: 'invalid json' }));\n        return;\n      }\n      try {\n        await routeFrame(ws, state, frame, connections);\n        if (state.authed) clearTimeout(authTimer);\n      } catch (err) {\n        logger.error({ err, userId: state.userId }, 'frame handling failed');\n        ws.send(JSON.stringify({ type: 'error', code: 'INTERNAL', message: 'try again' }));\n      }\n    });\n\n    ws.on('pong', () => {\n      state.isAlive = true;\n      if (state.userId && state.deviceId) {\n        void connections.refresh(state.userId, state.deviceId);\n      }\n    });\n\n    ws.on('close', (code: number) => {\n      clearTimeout(authTimer);\n      wsConnectionsActive.dec();\n      wsDisconnectTotal.inc({ reason: String(code) });\n      if (state.userId && state.deviceId) {\n        void connections.remove(state.userId, state.deviceId, ws);\n      }\n    });\n\n    ws.on('error', (err) => logger.warn({ err, userId: state.userId }, 'socket error'));\n  });\n\n  const sweeper = setInterval(() => {\n    for (const ws of wss.clients) {\n      const state = (ws as any).state as ConnState | undefined;\n      if (!state) continue;\n      if (!state.isAlive) { ws.terminate(); continue; }   // 2 miss = 60 s -> dead\n      state.isAlive = false;\n      if (canWrite(ws)) ws.ping();\n    }\n  }, HEARTBEAT_MS);\n  sweeper.unref();\n\n  httpServer.listen(8080, () => logger.info({ nodeId: NODE_ID }, 'gateway listening'));\n\n  return {\n    async stop() {\n      clearInterval(sweeper);\n      for (const ws of wss.clients) ws.close(1001, 'server shutting down');\n      await new Promise((r) => setTimeout(r, 2_000));     // clients ko close frame padhne do\n      wss.close();\n      httpServer.close();\n    },\n  };\n}\n```\n\n**Code Explanation:**\n\n- `const NODE_ID = process.env.NODE_ID!` -- har gateway ki apni pehchaan (`gw-042`). Kubernetes mein ye pod ka naam hota hai (downward API se). Yahi `conn:\u003cuserId>:\u003cdeviceId>` ki value banti hai aur yahi `gw:\u003cnodeId>` channel ka naam. **Do nodes ka same NODE_ID = messages galat node par jaayenge** -- isliye ise env se lo, hardcode nahi.\n- `createServer(...)` + `new WebSocketServer({ server: httpServer })` -- WebSocket ek HTTP server par \"chadhta\" hai kyunki handshake HTTP hai. Isi HTTP server par `/health` bhi de diya -- load balancer ko ek plain HTTP endpoint chahiye hota hai.\n- `path: '/ws'` -- sirf `/ws` par upgrade allow. Baaki paths par upgrade request aaye toh `ws` khud reject kar dega.\n- **`maxPayload: 8 * 1024`** -- **protocol level ki defence.** Isse bada frame aaya toh `ws` socket ko turant band kar deta hai, poora frame memory mein buffer kiye bina. Ye application ke 4 KB check se **pehle** aata hai. Iske bina ek attacker 100 MB ka frame bhej ke node ki memory kha sakta hai.\n- `perMessageDeflate: false` -- compression band. Part 8 mein math kiya tha: compression per-connection ~20 KB context leta hai, 50,000 connections par **+1 GB per node**. Hamari asli constraint memory hai, bandwidth nahi.\n- `clientTracking: true` -- `wss.clients` set maintain karo. Heartbeat sweeper aur graceful shutdown dono ko poore connection list par chalna hai.\n- `const state: ConnState = { authed: false, isAlive: true }` -- **per-connection state.** Socket khula hai par abhi `authed: false` -- yaani `send`/`resume` allowed nahi. `(ws as any).state = state` ek shortcut hai; production mein `WeakMap\u003cWebSocket, ConnState>` zyada saaf hai (koi `any` nahi, aur socket GC hone par entry apne aap saaf).\n- `setTimeout(() => { if (!state.authed) ws.close(4001, ...) }, 10_000)` -- **auth timeout.** Bina iske attacker laakhon TCP+TLS connections khol ke chhod sakta hai. Har connection ~20 KB memory + 1 file descriptor -- 50,000 free connections = node dead. Close code `4001` = \"auth failed\", jisse client jaanta hai ki naya token lena hai, blindly reconnect nahi karna.\n- `JSON.parse(raw.toString('utf8'))` **`try/catch` mein** -- malformed JSON par `JSON.parse` throw karta hai. Bina catch ke poora Node process crash ho jaata aur uske saath **50,000 logon ke connections** -- ek galat byte, 50,000 users offline.\n- **Parse fail par `error` frame, close nahi** -- ek kharab frame connection todne ki wajah nahi. Client ka koi ek feature buggy ho sakta hai; baaki chat chalti rehni chahiye.\n- `await routeFrame(ws, state, frame, connections)` -- gateway ka kaam yahin khatam. Aage ka sab `frame-router` -> services. **Yahan koi business logic nahi** (Part 10 wali deewar).\n- `if (state.authed) clearTimeout(authTimer)` -- auth ho gaya toh timer ki zarurat nahi.\n- **Outer `try/catch` around `routeFrame`** -- `ws.on('message', async ...)` mein async function ka rejected promise ko koi nahi pakadta -> Node 15+ mein **unhandled rejection = process crash**. Yahan catch karna mandatory hai, optional nahi.\n- `ws.on('pong', ...)` -- client ne hamare ping ka jawab diya. Do kaam: (a) `isAlive = true` (zinda hai), (b) **Redis session TTL refresh** (`EXPIRE conn:... 90`). Har 30 s ek `EXPIRE` = 10M/30 = ~333K Redis ops/sec poore fleet mein. Yahi spec ka \"presence messaging se mehenga hai\" wala number hai.\n- `void connections.refresh(...)` -- `void` ka matlab: \"ye promise jaan-boojh kar ignore kar raha hoon.\" Yahan `await` nahi kar sakte (event handler sync hai) aur `refresh` andar apni error handle karta hai. `void` ke bina ESLint `no-floating-promises` warning deta hai -- aur woh warning sahi hai, isliye intention explicitly likhte hain.\n- `ws.on('close', ...)` -- **cleanup ki sabse zaruri jagah.** `connections.remove()` local `Map` se socket hataata hai **aur** Redis se `conn:\u003cuserId>:\u003cdeviceId>` delete karta hai. Ye na karo toh: delivery worker us stale entry ko padh ke is node par publish karta rahega, aur node ko pata hi nahi ki kiske liye -- message **chupchaap kho jaayega** (user offline hai par push bhi nahi gaya, kyunki registry ne kaha \"online hai\"). Ye production ka ek bahut tedha bug hai.\n- `wsDisconnectTotal.inc({ reason: String(code) })` -- close code ke hisaab se metric. Dashboard par `1013` (slow clients) ya `4001` (auth) achanak badhe toh turant pata chal jaata hai.\n- `ws.on('error', ...)` -- `ws` ka `error` event agar handle na karo toh Node usko **uncaught exception** bana deta hai -> process crash. Ek user ka TCP reset poore node ko nahi giraana chahiye.\n\n**Heartbeat sweeper (`setInterval`) ka poora logic:**\n\n- `if (!state.isAlive) { ws.terminate(); continue; }` -- pichhle round mein humne `isAlive = false` kiya tha aur ping bheja tha. Agar 30 s mein pong nahi aaya toh abhi bhi `false` hai -> connection **dead**. `terminate()` (not `close()`) -- `close()` handshake ki koshish karta hai aur dead connection par woh kabhi complete nahi hoga.\n- `state.isAlive = false; ws.ping();` -- pehle \"abhi main maanta hoon ye dead hai\" set karo, phir ping bhejo. Pong aaya toh `true` ho jaayega.\n- **Timing:** 30 s par ping #1, 60 s par (pong nahi aaya) terminate. Yaani **2 missed heartbeats = 60 s**, bilkul spec ke mutabik. Redis TTL 90 s isse **thoda zyada** hai jaan-boojh kar: agar TTL 60 s hota toh slow network par pong late aane par session entry pehle expire ho jaati aur user \"offline\" dikhne lagta jabki connection zinda tha. **30 second ka buffer race condition ko marta hai.**\n- **`ping()` kyun zaruri hai jab TCP ke paas keepalive hai?** TCP keepalive ka default 2 **ghante** hai. Mobile networks (NAT, carrier-grade NAT) idle connections ko 5-10 minute mein chupchaap maar dete hain -- **bina FIN bheje**. Server ko lagta rehta hai connection zinda hai. Application-level heartbeat hi sach batata hai.\n- `if (canWrite(ws)) ws.ping()` -- slow client ke socket par ping bhi mat thoonso; uska buffer already bhara hua hai.\n- `sweeper.unref()` -- active `setInterval` Node process ko exit nahi karne deta. `unref()` = \"sirf is timer ki wajah se zinda mat raho.\" Graceful shutdown aur tests dono hang nahi hote.\n- **`stop()` mein `close(1001, 'server shutting down')`** -- deploy ke waqt. `1001` = \"going away\", jispar client normal (jittered) backoff se reconnect karta hai. `terminate()` karoge toh clients ko \"network error\" dikhega aur kai clients aggressive retry karenge -> thundering herd. **2 second ka wait** isliye ki close frames network par nikal jaayein. Ye deploy ko civilized banata hai: 250 nodes ko ek saath nahi, rolling mein restart karo, aur har node apne 50,000 clients ko tameez se vidaa kare.\n\n### 2. `gateway/connection-manager.ts` -- local Map + Redis registry + Pub/Sub\n\n```ts\nimport type { WebSocket } from 'ws';\nimport type { Redis } from 'ioredis';\nimport { canWrite, dropSlowClient } from './backpressure';\nimport { logger } from '../infra/logger';\nimport { deliveriesTotal } from '../infra/metrics';\n\nconst SESSION_TTL_SEC = 90;                    // heartbeat 30 s, dead at 60 s -> 90 s safe\n\nexport interface GatewayEnvelope {\n  targets: Array\u003c{ userId: string; deviceId: string }>;\n  frame: unknown;                              // ServerFrame\n}\n\nexport class ConnectionManager {\n  private readonly sockets = new Map\u003cstring, Set\u003cWebSocket>>();   // userId -> uske saare sockets\n  private readonly deviceOf = new WeakMap\u003cWebSocket, string>();   // socket -> deviceId\n\n  constructor(\n    private readonly redis: Redis,     // normal commands\n    private readonly sub: Redis,       // ALAG connection: subscriber mode\n    private readonly nodeId: string,\n  ) {}\n\n  async start(): Promise\u003cvoid> {\n    await this.sub.subscribe('gw:' + this.nodeId);\n    this.sub.on('message', (_channel: string, payload: string) => {\n      let env: GatewayEnvelope;\n      try { env = JSON.parse(payload); } catch { return; }\n      const text = JSON.stringify(env.frame);\n      for (const t of env.targets) this.deliverLocal(t.userId, t.deviceId, text);\n    });\n    logger.info({ channel: 'gw:' + this.nodeId }, 'subscribed to delivery channel');\n  }\n\n  async add(userId: string, deviceId: string, ws: WebSocket): Promise\u003cvoid> {\n    let set = this.sockets.get(userId);\n    if (!set) { set = new Set(); this.sockets.set(userId, set); }\n    set.add(ws);\n    this.deviceOf.set(ws, deviceId);\n    await this.redis.set('conn:' + userId + ':' + deviceId, this.nodeId, 'EX', SESSION_TTL_SEC);\n  }\n\n  async refresh(userId: string, deviceId: string): Promise\u003cvoid> {\n    const key = 'conn:' + userId + ':' + deviceId;\n    const ok = await this.redis.expire(key, SESSION_TTL_SEC);\n    if (ok === 0) await this.redis.set(key, this.nodeId, 'EX', SESSION_TTL_SEC);\n  }\n\n  async remove(userId: string, deviceId: string, ws: WebSocket): Promise\u003cvoid> {\n    const set = this.sockets.get(userId);\n    set?.delete(ws);\n    if (set && set.size === 0) this.sockets.delete(userId);\n\n    const key = 'conn:' + userId + ':' + deviceId;\n    const owner = await this.redis.get(key);\n    if (owner === this.nodeId) await this.redis.del(key);\n  }\n\n  private deliverLocal(userId: string, deviceId: string, text: string): void {\n    const set = this.sockets.get(userId);\n    if (!set) { deliveriesTotal.inc({ result: 'no_local_socket' }); return; }\n    for (const ws of set) {\n      if (this.deviceOf.get(ws) !== deviceId) continue;\n      if (ws.readyState !== ws.OPEN) continue;\n      if (!canWrite(ws)) { dropSlowClient(ws); deliveriesTotal.inc({ result: 'slow_drop' }); continue; }\n      ws.send(text);\n      deliveriesTotal.inc({ result: 'sent' });\n    }\n  }\n}\n```\n\n**Code Explanation:**\n\n- `private readonly sockets = new Map\u003cstring, Set\u003cWebSocket>>()` -- **process memory mein** \"is node par kaun-kaun baitha hai\". `Set` isliye ki ek user ke **kai devices** ho sakte hain, aur kabhi-kabhi ek device ke do sockets bhi (purana socket abhi tak close nahi hua aur naya aa gaya -- reconnect race). 50,000 entries ka Map = kuch MB, koi problem nahi.\n- **Do levels ka lookup kyun?** Redis (`conn:*`) batata hai **kaunsa node**, local `Map` batata hai **kaunsa socket**. Redis mein socket object rakhna possible hi nahi -- woh ek live TCP handle hai, sirf usi process mein exist karta hai. **Yahi wajah hai ki chat system stateful hai.**\n- `deviceOf = new WeakMap\u003cWebSocket, string>()` -- socket se uska `deviceId`. **`WeakMap` isliye** ki socket close hone par entry apne aap garbage collect ho jaati hai; normal `Map` mein aap `delete` bhoole toh 10M connections ke jeevan kaal mein **memory leak**.\n- `constructor(redis, sub, nodeId)` -- **do alag Redis connections.** Ye Redis Pub/Sub ka hard rule hai: jo connection `SUBSCRIBE` kar leta hai, woh uske baad `GET`/`SET` jaisi normal commands **le hi nahi sakta** (subscriber mode). Ek hi client use karoge toh production mein error milega: \"only (P)SUBSCRIBE / (P)UNSUBSCRIBE / PING / QUIT allowed in this context\".\n- `this.sub.subscribe('gw:' + this.nodeId)` -- **poore node ke liye ek** subscription, per-user nahi. 250 nodes = Redis ko sirf 250 channels dekhne hain. Agar hum `user:\u003cuserId>` channels banate toh 10M channels -- Redis Pub/Sub us scale par bilkul alag (aur bura) behave karta.\n- `this.sub.on('message', ...)` -- Redis se aaya envelope. `try/catch` around `JSON.parse` -- kharab payload par poora gateway crash nahi hona chahiye.\n- `const text = JSON.stringify(env.frame)` -- **loop ke bahar, ek baar.** Ek envelope mein is node ke 40 targets ho sakte hain (ek bade group ke woh members jo isi node par hain). 40 baar `stringify` karna 40x CPU hai for identical output. Ye chhoti si line 460K deliveries/sec par sach mein dikhti hai.\n- `add()` -- do jagah likhta hai: local `Map` (socket dhoondhne ke liye) aur Redis (`conn:\u003cuserId>:\u003cdeviceId> = nodeId`, TTL 90 s). **Order matter karta hai:** pehle local Map, phir Redis. Ulta karoge toh ek chhoti window mein Redis kehta hai \"ye user gw-042 par hai\" par gw-042 ke Map mein socket abhi aaya hi nahi -> us window ka message kho jaayega.\n- `'EX', SESSION_TTL_SEC` -- **TTL ke bina ye key kabhi nahi hatti.** Node `kill -9` hua ya EC2 instance achanak gaya toh `close` handler chalta hi nahi -- cleanup code kabhi nahi chala. TTL hi woh cheez hai jo aise crash ke baad registry ko apne aap saaf karti hai. **Distributed systems mein TTL hi asli garbage collector hai.**\n- `refresh()` -- heartbeat par `EXPIRE`. `EXPIRE` `SET` se sasta hai (value dobara nahi likhni padti).\n- `if (ok === 0) ... set again` -- `EXPIRE` `0` return karta hai jab key **exist hi nahi karti**. Aisa kab hoga? Redis failover hua aur thoda data kho gaya, ya koi race mein key delete ho gayi. Tab hum key ko dobara bana dete hain -- **self-healing**. Iske bina user online hote hue bhi registry se gayab ho jaata aur uske messages push path par chale jaate.\n- `remove()` -- `set.delete(ws)` local se hatao; `set.size === 0` par poori entry hatao (warna khaali `Set` objects jama hote rahenge -- slow memory leak).\n- **`if (owner === this.nodeId)` -- ye check poore file ka sabse sookshm bug-fix hai.** Scenario: Priya ka phone network badalta hai (WiFi -> 4G). Naya socket `gw-117` par ban jaata hai aur Redis mein `conn:priya:d-77aa = gw-117` likh deta hai. **Uske baad** purane socket ka `close` event `gw-042` par fire hota hai. Agar `gw-042` blindly `DEL` kar deta, toh woh **abhi-abhi bani** valid entry mita deta -- aur Priya ke saare messages \"offline\" path par chale jaate jabki woh bilkul online hai. Ye bug intermittent hota hai, reproduce karna mushkil hai, aur \"kabhi-kabhi messages late aate hain\" jaisa dikhta hai. Ye **check-and-delete** usko rokta hai.\n  - **Poori imaandaari:** `GET` phir `DEL` atomic nahi hai -- inke beech mein bhi race possible hai. Bilkul sahi karna ho toh ek chhoti Lua script chahiye: \"agar value meri hai tabhi delete karo\". Ye wahi pattern hai jo distributed lock release mein use hota hai. Hamare case mein window microseconds ki hai aur TTL 90 s waise bhi safety net hai, par production mein Lua hi likhni chahiye.\n- `deliverLocal()` -- Redis se aaye envelope ko asli sockets par bhejna.\n  - `if (!set) { ...no_local_socket...; return; }` -- registry ne kaha ye user yahan hai, par yahan hai nahi. Matlab stale entry. Ye metric **badhna nahi chahiye**; badhe toh cleanup path mein bug hai.\n  - `if (this.deviceOf.get(ws) !== deviceId) continue;` -- envelope ek **specific device** ke liye hai. Priya ke phone ka message web par dobara nahi bhejna (web ke liye alag target entry hai).\n  - `if (ws.readyState !== ws.OPEN) continue;` -- socket band ho raha hai. `CLOSING` state par `send()` throw karta hai.\n  - `if (!canWrite(ws)) { dropSlowClient(ws); ... }` -- **backpressure**, agla section.\n  - `ws.send(text)` -- **yahi woh ek line hai jahan message asal mein user tak pahunchta hai.** Poora system -- Kafka, workers, Redis, registry -- sirf is line tak pahunchne ke liye hai.\n\n### 3. `gateway/backpressure.ts` -- slow client ko drop karna\n\n```ts\nimport type { WebSocket } from 'ws';\nimport { wsBufferedAmountBytes, slowClientDropsTotal } from '../infra/metrics';\n\nexport const MAX_BUFFERED_BYTES = 1024 * 1024;        // 1 MB (spec)\nconst GRACE_MS = 5_000;\n\nexport function canWrite(ws: WebSocket): boolean {\n  const buffered = ws.bufferedAmount;\n  wsBufferedAmountBytes.observe(buffered);\n  return buffered \u003c= MAX_BUFFERED_BYTES;\n}\n\nexport function dropSlowClient(ws: WebSocket): void {\n  slowClientDropsTotal.inc();\n  try {\n    ws.close(1013, 'slow client');                     // 'try again later'\n  } catch {\n    // already closing -- ignore\n  }\n  setTimeout(() => {\n    if (ws.readyState !== ws.CLOSED) ws.terminate();   // close frame bhi nahi ja paa raha\n  }, GRACE_MS).unref();\n}\n```\n\n**Code Explanation:**\n\n- `ws.bufferedAmount` -- **ye number samajhna hi is section ka asli sabak hai.** Jab aap `ws.send(data)` likhte ho, data seedha network par nahi jaata. Woh **kernel ke socket send buffer** mein jaata hai; kernel usko TCP ki raftaar se bhejta hai. Agar client slow hai (2G, tunnel mein, ya app suspend ho gaya) toh TCP ka receive window chhota ho jaata hai aur kernel buffer bharne lagta hai. Jab kernel buffer bhar jaata hai, `ws` library **Node ke process memory mein** aage ka data jama karne lagti hai. `bufferedAmount` = \"kitne bytes abhi tak socket par nikle hi nahi.\"\n- **Ye gateway OOM ka asli karan kyun hai?** Ye arithmetic dekho:\n\n```\nEk slow client jo 1 minute se data nahi le raha,\nek busy group mein hai jahan 20 msg/min aate hain:\n     20 x 300 B = 6 KB    -- theek hai, koi baat nahi\n\nPar asli khatra fan-out ka hai. Socho ek user 50 active groups mein hai:\n     50 groups x 20 msg/min x 300 B = 300 KB/min per slow client\n\nAur asli disaster: kisi ne 200 messages ka backlog bheja\n(ya ek buggy client ne resume loop chala diya):\n     Ab har slow client 1-10 MB hold kar sakta hai.\n\nNode ka heap default ~1.5-4 GB hai. Node par 8 GB RAM hai jisme se\n~1 GB connections ke liye already gaya hua hai.\n\n     500 slow clients x 5 MB = 2.5 GB    -> heap exhausted -> OOM kill\n     -> NODE MAR GAYA\n     -> USKE 50,000 CONNECTIONS TOOT GAYE (49,500 healthy clients bhi)\n     -> woh sab reconnect karenge -> THUNDERING HERD -> agla node bhi khatre mein\n```\n\n  **Yaani: 500 kharab clients 50,000 achhe clients ko maar dete hain.** Isliye slow client ko drop karna nirdayi nahi, **zaruri** hai -- ye ek bulkhead hai.\n- `MAX_BUFFERED_BYTES = 1 MB` -- threshold. Kyun 1 MB? Normal healthy client ka `bufferedAmount` hamesha ~0 rehta hai (message jaate hi nikal jaata hai). Chhoti spikes (burst) mein kuch KB ho sakta hai. 1 MB par pahunchna ka matlab hai: **~3,500 messages backlog** -- ye temporary slowness nahi, ye client sach mein data le hi nahi raha. Bahut kam threshold (jaise 64 KB) rakhoge toh achhe clients bhi burst par drop honge; bahut zyada (100 MB) rakhoge toh protection hi nahi bachegi.\n- `wsBufferedAmountBytes.observe(buffered)` -- **histogram**, gauge nahi. Isse dashboard par `bufferedAmount` ka p50/p95/p99 dikhta hai. Healthy fleet mein p99 bhi ~0 hona chahiye. p99 badhna shuru ho = network problem aa rahi hai, drops shuru hone se **pehle** alert.\n- `canWrite()` har `send` se pehle call hota hai -- `deliverLocal()` mein bhi aur heartbeat sweeper mein bhi.\n- `ws.close(1013, 'slow client')` -- `1013` = \"Try again later\". Ye code client ko saaf batata hai: \"tum galat nahi ho, server bhi theek hai, bas abhi nahi ho paa raha.\" Achha client iske baad **lamba** backoff leta hai (turant reconnect karega toh wahi hoga, kyunki uska network abhi bhi slow hai) aur phir `resume` se saara backlog `seq` se le leta hai. **Ek bhi message nahi khota** -- sab kuch DB mein `seq` ke saath baitha hai. Yahi wajah hai ki drop karna safe hai.\n- `try { ws.close(...) } catch {}` -- socket already `CLOSING`/`CLOSED` ho sakta hai; `close()` tab throw kar sakta hai. Ek slow client ki wajah se gateway crash na ho.\n- **`setTimeout(... ws.terminate(), 5000)`** -- `close()` bhi ek **frame bhejta hai**, aur us frame ko bhi buffer se guzarna padta hai. Slow client ka buffer already bhara hua hai, toh close frame kabhi nikal hi nahi paayega aur socket hamesha ke liye `CLOSING` mein latak jaayega -- memory abhi bhi hold hai, problem hal nahi hui. 5 second ke baad `terminate()` = TCP ko forcefully band karo, buffer turant free. **`close()` tameez hai, `terminate()` guarantee hai. Dono chahiye.**\n- `.unref()` -- ye timer shutdown ko block na kare.\n\n> **Interview line:** \"WebSocket gateway ka sabse common production failure OOM hota hai, aur uski wajah hamesha slow clients hoti hai. `send()` async hai -- data application memory mein queue hota hai jab tak client use nahi leta. Main har write se pehle `bufferedAmount` check karunga, 1 MB par client ko close code `1013` ke saath drop karunga, aur 5 second baad `terminate()` karunga kyunki close frame bhi usi bhare hue buffer se jaata hai. Client reconnect karke `resume` se sab kuch `seq` se le lega, isliye koi message nahi khota.\"\n\n### 4. `services/chat.service.ts` -- authorize, seq, persist, ack, produce\n\n```ts\nimport type { Redis } from 'ioredis';\nimport type { Producer } from 'kafkajs';\nimport type { MessageRepository } from '../repositories/message.repository';\nimport type { ConversationService } from './conversation.service';\nimport type { ChatMessage } from '../types/frames';\nimport { AppError } from '../infra/errors';\nimport { messageSendDuration } from '../infra/metrics';\nimport { logger } from '../infra/logger';\n\nconst MAX_BODY_BYTES = 4096;                          // spec: text message max 4 KB\n\nexport interface SendInput {\n  messageId: string;\n  conversationId: string;\n  body?: string;\n  mediaKey?: string;\n}\n\nexport class ChatService {\n  constructor(\n    private readonly conversations: ConversationService,\n    private readonly redis: Redis,\n    private readonly messages: MessageRepository,\n    private readonly producer: Producer,\n  ) {}\n\n  async sendMessage(\n    senderId: string,\n    input: SendInput,\n    ackSender: (m: ChatMessage) => void,          // gateway ka callback -- service ws nahi jaanti\n  ): Promise\u003cChatMessage> {\n    const done = messageSendDuration.startTimer();\n    try {\n      // --- 1. VALIDATE (sasta kaam pehle) ---\n      if (!isUuid(input.messageId) || !isUuid(input.conversationId)) {\n        throw new AppError('BAD_FRAME', 400, 'messageId and conversationId must be UUIDs');\n      }\n      const bytes = Buffer.byteLength(input.body ?? '', 'utf8');\n      if (bytes > MAX_BODY_BYTES) {\n        throw new AppError('MESSAGE_TOO_LARGE', 413, 'Message body exceeds 4096 bytes');\n      }\n      if (!input.body && !input.mediaKey) {\n        throw new AppError('BAD_FRAME', 400, 'body or mediaKey required');\n      }\n\n      // --- 2. AUTHORIZE (Redis-cached membership) ---\n      const isMember = await this.conversations.isMember(input.conversationId, senderId);\n      if (!isMember) {\n        throw new AppError('NOT_A_MEMBER', 403, 'You are not a member of this conversation');\n      }\n\n      // --- 3. SEQ (atomic, per conversation) ---\n      const seq = await this.redis.incr('seq:' + input.conversationId);\n\n      // --- 4. PERSIST (idempotent) ---\n      const { message, duplicate } = await this.messages.insert({\n        conversationId: input.conversationId,\n        seq,\n        messageId: input.messageId,\n        senderId,\n        type: input.mediaKey ? 'media' : 'text',\n        body: input.body ?? '',\n        mediaKey: input.mediaKey,\n      });\n\n      // --- 5. ACK (persist ke BAAD, Kafka se PEHLE) ---\n      ackSender(message);\n\n      // --- 6. FAN-OUT (async) ---\n      if (!duplicate) {\n        await this.producer.send({\n          topic: 'chat-events',\n          messages: [{\n            key: message.conversationId,                 // per-conversation ordering\n            value: JSON.stringify({ type: 'message', message }),\n          }],\n        });\n      } else {\n        logger.info({ messageId: input.messageId, seq: message.seq }, 'duplicate send ignored');\n      }\n\n      return message;\n    } finally {\n      done();\n    }\n  }\n}\n```\n\n**Code Explanation:**\n\n- `constructor(conversations, redis, messages, producer)` -- **dependency injection.** Service ke andar `new Redis()` kabhi nahi. Test mein chaaron ko fake se badal do aur poora business logic bina kisi infra ke test ho jaata hai.\n- `ackSender: (m: ChatMessage) => void` -- **Part 10 wali deewar ka asli implementation.** Service ko `ws` object nahi mila; usko ek **function** mila jo \"sender ko ye message ack kar do\" kaam karta hai. Gateway us function ke andar `ws.send(JSON.stringify({ type: 'ack', ... }))` karta hai. Test mein aap `jest.fn()` pass karke check kar lete ho ki ack **kab** call hua. Socket ka naam service mein kahin nahi hai.\n- `messageSendDuration.startTimer()` + `finally { done(); }` -- histogram. `message_send_duration_seconds` ka p95 hamara sender-side SLI hai (latency budget ka step 2-6 = ~15 ms).\n\n**Ab steps ka ORDER -- ye is poore file ka sabse important interview point hai:**\n\n- **Step 1: Validation sabse pehle, kyunki sabse sasti hai.** `Buffer.byteLength(body, 'utf8')` -- `body.length` **galat** hai. JS mein `.length` UTF-16 code units ginti hai: emoji ka `.length` 2 hai par bytes 4; Devanagari ka har akshar 3 bytes. Limit bytes mein hai toh naap bhi bytes mein hona chahiye. **Koi I/O nahi, koi Redis nahi** -- galat frame yahin mar jaata hai.\n- **Step 2: Authorization -- validation ke baad, kisi bhi write se pehle.** Agar ye check `INCR` ke baad hota toh ek attacker random `conversationId` bhej-bhej ke Redis mein laakhon `seq:*` keys bana deta (memory attack), chahe uska message kabhi save na ho. **Koi bhi state badalne se pehle authorize karo.**\n  - `conversations.isMember()` Redis-cached hai (`member:\u003cconversationId>` set, TTL 300 s). Har send par Postgres jaana = 70K QPS peak on Postgres, aur +3-8 ms latency.\n  - **Ye check hata dene par kya hoga?** Koi bhi kisi bhi conversation mein message daal sakta hai. Ye **is system ka sabse bada security hole** hai (spec ke shabd). Aur ye chupchaap hota hai -- koi error nahi, bas ek ajnabi ka message aapke private group mein.\n- **Step 3: `INCR seq:\u003cconversationId>`** -- Redis `INCR` **atomic** hai: 50 log ek saath bhejein toh bhi sabko unique, badhta hua number milega. Ye `SELECT MAX(seq)+1` se **kyun behtar** hai? Kyunki `SELECT MAX` aur `INSERT` ke beech mein doosra process bhi wahi `MAX` padh sakta hai -> dono ko same `seq` -> ek ka insert fail. Uske liye `SELECT ... FOR UPDATE` ya serializable transaction chahiye, jo per-conversation ek **lock** ban jaata hai aur throughput maar deta hai. `INCR` ek single atomic operation hai, ~0.3 ms.\n- **Step 4: Persist.** Ab, aur sirf ab, data durable hota hai.\n- **Step 5: `ackSender(message)` -- persist ke BAAD.**\n  - **Ye spec ki sabse pakki decision hai:** \"`sent` ack tabhi jab message persist ho chuka ho.\" Agar hum step 3 ke baad ack dete aur step 4 fail ho jaata (DB down, disk full, connection pool khatam), toh Priya ki screen par **tick lag chuka hota** par message duniya mein exist hi nahi karta. User ko lagega bhej diya; Rohan ko kabhi nahi milega; aur ye baat kabhi pakdi bhi nahi jaayegi. **Ye trust todne wala bug hai.**\n  - Aur dhyaan do ki hum `ack` **`message.seq`** bhejte hain, `seq` variable nahi. Duplicate case mein `message.seq` **original** seq hai (1205), naya nahi (1206). Client ko wahi order milta hai jo pehle mila tha.\n- **Step 6: Kafka produce -- ack ke BAAD.**\n  - **Kyun baad mein?** Kafka produce p95 ~15 ms leta hai. Ack se pehle rakhoge toh sender ka tick 15 ms late. Sender ko sirf ye jaanna hai ki message **safe** hai; delivery uske baad ka kaam hai.\n  - `key: message.conversationId` -- **ye key hi per-conversation ordering ki guarantee hai.** Kafka same key ko hamesha same partition par bhejta hai, aur ek partition ke andar order guaranteed hai. Key na do toh messages round-robin se 64 partitions par bikhar jaayenge aur 64 workers unhe **kisi bhi order** mein deliver kar denge -- recipient ko \"kal milte hain\" pehle aur \"kahan ho?\" baad mein dikhega.\n  - `if (!duplicate)` -- retry par Kafka par dobara produce **nahi** karte. Warna Rohan ko wahi message do baar dikhta. (Woh `messageId` se dedup kar leta, par network aur uski battery bekaar kharch hoti.)\n- **Is ordering ka honest risk:** step 4 (persist) aur step 6 (produce) ke beech process mar gaya toh message DB mein hai par Kafka mein nahi -> real-time delivery nahi hui. Recipient ko woh reconnect/sync par mil jaayega (Flow 5). Poori safety chahiye toh **transactional outbox** pattern: message ke saath hi ek `outbox` row likho usi transaction mein, aur ek alag publisher usse Kafka par bhejta rahe. Ye ek extra moving part hai; v1 ke liye \"sync par mil jaayega + ek reconciler job\" kaafi hai. **Interview mein ye trade-off khud bolna chahiye** -- isse pata chalta hai ki aapko pata hai ki do alag systems ke beech atomicity nahi hoti.\n- `finally { done(); }` -- error ho ya success, timer band. Failed requests ki latency bhi dashboard par honi chahiye.\n\n### 5. `repositories/message.repository.ts` -- idempotent insert\n\n```ts\nimport type { Pool } from 'pg';\nimport type { ChatMessage } from '../types/frames';\n\nconst INSERT_SQL = `\n  INSERT INTO messages (conversation_id, seq, message_id, sender_id, type, body, media_key)\n  VALUES ($1, $2, $3, $4, $5, $6, $7)\n  ON CONFLICT (conversation_id, message_id) DO NOTHING\n  RETURNING conversation_id, seq, message_id, sender_id, body, media_key, created_at`;\n\nconst SELECT_BY_MSGID_SQL = `\n  SELECT conversation_id, seq, message_id, sender_id, body, media_key, created_at\n    FROM messages\n   WHERE conversation_id = $1 AND message_id = $2`;\n\nconst BUMP_LAST_SEQ_SQL = `\n  UPDATE conversations\n     SET last_message_seq = GREATEST(last_message_seq, $2)\n   WHERE id = $1`;\n\nexport interface InsertInput {\n  conversationId: string; seq: number; messageId: string; senderId: string;\n  type: 'text' | 'media' | 'system'; body: string; mediaKey?: string;\n}\n\nexport class MessageRepository {\n  constructor(private readonly db: Pool) {}\n\n  async insert(m: InsertInput): Promise\u003c{ message: ChatMessage; duplicate: boolean }> {\n    const client = await this.db.connect();\n    try {\n      await client.query('BEGIN');\n\n      const res = await client.query(INSERT_SQL, [\n        m.conversationId, m.seq, m.messageId, m.senderId, m.type, m.body, m.mediaKey ?? null,\n      ]);\n\n      if (res.rowCount === 1) {\n        await client.query(BUMP_LAST_SEQ_SQL, [m.conversationId, m.seq]);\n        await client.query('COMMIT');\n        return { message: toChatMessage(res.rows[0]), duplicate: false };\n      }\n\n      // 0 rows -> ON CONFLICT ne roka -> ye ek RETRY hai\n      const existing = await client.query(SELECT_BY_MSGID_SQL, [m.conversationId, m.messageId]);\n      await client.query('COMMIT');\n      return { message: toChatMessage(existing.rows[0]), duplicate: true };\n    } catch (err) {\n      await client.query('ROLLBACK');\n      throw err;\n    } finally {\n      client.release();\n    }\n  }\n\n  async afterSeq(conversationId: string, afterSeq: number, limit: number): Promise\u003cChatMessage[]> {\n    const { rows } = await this.db.query(\n      `SELECT conversation_id, seq, message_id, sender_id, body, media_key, created_at\n         FROM messages\n        WHERE conversation_id = $1 AND seq > $2 AND deleted_at IS NULL\n        ORDER BY seq ASC\n        LIMIT $3`,\n      [conversationId, afterSeq, limit],\n    );\n    return rows.map(toChatMessage);\n  }\n\n  async beforeSeq(conversationId: string, beforeSeq: number, limit: number): Promise\u003cChatMessage[]> {\n    const { rows } = await this.db.query(\n      `SELECT conversation_id, seq, message_id, sender_id, body, media_key, created_at\n         FROM messages\n        WHERE conversation_id = $1 AND seq \u003c $2 AND deleted_at IS NULL\n        ORDER BY seq DESC\n        LIMIT $3`,\n      [conversationId, beforeSeq, limit],\n    );\n    return rows.map(toChatMessage);\n  }\n}\n\nfunction toChatMessage(r: any): ChatMessage {\n  return {\n    messageId: r.message_id,\n    conversationId: r.conversation_id,\n    seq: Number(r.seq),\n    senderId: r.sender_id,\n    body: r.body ?? '',\n    mediaKey: r.media_key ?? undefined,\n    createdAt: r.created_at.toISOString(),\n  };\n}\n```\n\n**Code Explanation:**\n\n- **`ON CONFLICT (conversation_id, message_id) DO NOTHING RETURNING ...`** -- poore repository ka dil.\n  - `ON CONFLICT (...)` ke andar wale columns ko **exactly** us unique index se match karna hota hai jo humne banaya tha (`messages_msgid_uniq`). Index na hota toh ye query hi syntax error deti -- yaani schema aur code ek doosre ko force karte hain.\n  - `DO NOTHING` -- conflict par kuch mat karo, error mat do. `DO UPDATE` yahan **galat** hota: message immutable hai, retry par usko overwrite karne ka koi matlab nahi (aur attacker `messageId` reuse karke purana message badal deta).\n  - `RETURNING` -- insert **hua** toh nayi row wapas milti hai. Conflict hua toh `RETURNING` **kuch nahi** deta (`rowCount === 0`). Yahi hamara duplicate ka signal hai.\n- `if (res.rowCount === 1)` -- naya message. Ab `conversations.last_message_seq` bump karo.\n- `GREATEST(last_message_seq, $2)` -- **monotonic bump.** Do messages ek saath aaye (seq 1205 aur 1206) aur unke UPDATE ulte order mein commit hue: blindly `SET = 1205` karne se counter **peeche** chala jaata, aur phir har client ko lagta ki 1206 exist hi nahi karta -> woh message sync mein miss ho jaata. `GREATEST` isko namumkin bana deta hai.\n- **Dono queries ek `BEGIN`/`COMMIT` mein kyun?** Kyunki ye do statements ek hi **business fact** hain: \"ye message ab is conversation ka hissa hai.\" Insert commit ho jaaye aur bump fail ho jaaye toh `last_message_seq` peeche reh jaayega -> `resume` sochega \"kuch naya nahi hai\" -> message **kabhi deliver nahi hoga**. Transaction ye guarantee deta hai: ya dono, ya koi nahi.\n- **Duplicate path (`rowCount === 0`):** hum `message_id` se **original row** padhte hain aur usi ko wapas karte hain, `duplicate: true` ke saath.\n  - **Client retry ke saath aur bina is sab ke, farak:**\n\n| | Index + `ON CONFLICT` ke BINA | Index + `ON CONFLICT` ke SAATH |\n|---|---|---|\n| Retry par DB mein | 2 rows (seq 1205 aur 1206) | 1 row (seq 1205) |\n| Sender ko ack | seq 1206 (naya) | seq 1205 (original) |\n| Recipient ko | message **do baar** dikha | ek baar |\n| Kafka par | 2 events | 1 event (duplicate par produce skip) |\n| Group mein 30 log | sabko duplicate | sab theek |\n| Naye device par sync | duplicate phir se dikhega (permanent) | saaf |\n| `seq` counter | 1206 istemaal | 1206 **jal gaya** = gap (acceptable) |\n\n- `client.release()` **`finally` mein** -- ye line bhoolna Node backend ka #1 production bug hai. `pg` Pool mein default ~10 connections hote hain. Ek bhi path jahan `release()` na ho, wahan connection hamesha ke liye leak ho jaata hai. 10 leaks ke baad **poori service hang** ho jaati hai -- har query pool se connection ka intezaar karti rehti hai, koi error bhi nahi aata, bas sab kuch ruk jaata hai.\n- `BEGIN` / `COMMIT` / `ROLLBACK` seedhe `client` par -- Pool par nahi. Pool har query ke liye **koi bhi** free connection de sakta hai; transaction ko **ek hi** connection par rehna zaruri hai. `pool.query('BEGIN')` likhna ek classic (aur bahut khatarnak) galti hai -- transaction ek connection par khulti hai aur agli query kisi doosre connection par chali jaati hai.\n- `afterSeq()` -- `seq > $2 ORDER BY seq ASC LIMIT $3`. PK `(conversation_id, seq)` par seedha index seek + forward scan. `OFFSET` kahin nahi (Part 8 ka keyset deep dive).\n- `beforeSeq()` -- `seq \u003c $2 ORDER BY seq DESC`. **Wahi index, ulti direction.** B-tree dono taraf chal sakta hai, isliye ek index dono features deta hai.\n- `deleted_at IS NULL` -- soft-deleted messages history mein nahi aate. (Chaho toh tombstone bhej sakte ho: \"This message was deleted\".)\n- `seq: Number(r.seq)` -- **`pg` ka gotcha.** `pg` library `BIGINT` ko **string** mein deti hai (`\"1205\"`), kyunki 64-bit integer JS `number` mein overflow kar sakta hai. Yahin convert na karo toh `seq > lastSeq` comparison string comparison ban jaata hai: `\"9\" > \"1205\"` JavaScript mein **`true`** hai (lexicographic!). Ye bug production mein \"kabhi-kabhi sync ajeeb behave karta hai\" jaisa dikhta hai aur dhoondhne mein ghante lagte hain.\n- `createdAt: r.created_at.toISOString()` -- `pg` `TIMESTAMPTZ` ko JS `Date` deta hai. Wire par hamesha ISO string (protocol mein `createdAt: string` hai).\n- **Mapping sirf yahin** -- `message_id` -> `messageId` (snake_case se camelCase). Baaki poore app ko DB ke column names ka pata hi nahi. Kal Cassandra par jaaein toh sirf ye file badlegi.\n\n### 6. `workers/delivery.worker.ts` -- fan-out: members -> devices -> sessions -> gateway\n\n```ts\nimport type { Consumer } from 'kafkajs';\nimport type { Redis } from 'ioredis';\nimport type { ConversationService } from '../services/conversation.service';\nimport type { DeviceRepository } from '../repositories/device.repository';\nimport type { Producer } from 'kafkajs';\nimport { logger } from '../infra/logger';\nimport { deliveriesTotal, fanoutSize, offlinePushTotal } from '../infra/metrics';\nimport type { GatewayEnvelope } from '../gateway/connection-manager';\n\ninterface Target { userId: string; deviceId: string }\n\nexport class DeliveryWorker {\n  constructor(\n    private readonly consumer: Consumer,        // group 'delivery'\n    private readonly redis: Redis,\n    private readonly conversations: ConversationService,\n    private readonly devices: DeviceRepository,\n    private readonly pushProducer: Producer,    // Notification System ka topic\n  ) {}\n\n  async start(): Promise\u003cvoid> {\n    await this.consumer.subscribe({ topic: 'chat-events', fromBeginning: false });\n\n    await this.consumer.run({\n      autoCommit: false,                        // spec: enable.auto.commit = false\n      eachMessage: async ({ topic, partition, message }) => {\n        const event = JSON.parse(message.value!.toString());\n        await this.fanOut(event);\n        await this.consumer.commitOffsets([\n          { topic, partition, offset: (Number(message.offset) + 1).toString() },\n        ]);\n      },\n    });\n  }\n\n  private async fanOut(event: { type: string; message: any }): Promise\u003cvoid> {\n    const msg = event.message;\n    const senderId = msg.senderId;\n\n    // --- 1. members -> devices (dono Redis-cached) ---\n    const memberIds = (await this.conversations.memberIds(msg.conversationId))\n      .filter((id) => id !== senderId);\n    if (memberIds.length === 0) return;\n\n    const devicesByUser = await this.devices.listForUsers(memberIds);   // Map\u003cuserId, deviceId[]>\n\n    const targets: Target[] = [];\n    for (const userId of memberIds) {\n      for (const deviceId of devicesByUser.get(userId) ?? []) {\n        targets.push({ userId, deviceId });\n      }\n    }\n    fanoutSize.observe(targets.length);\n    if (targets.length === 0) return;\n\n    // --- 2. SAARE sessions ek MGET mein (N round trips NAHI) ---\n    const keys = targets.map((t) => 'conn:' + t.userId + ':' + t.deviceId);\n    const nodeIds = await this.redis.mget(keys);        // Array\u003cstring | null>, same order\n\n    // --- 3. node ke hisaab se group karo ---\n    const byNode = new Map\u003cstring, Target[]>();\n    const onlineUsers = new Set\u003cstring>();\n    for (let i = 0; i \u003c targets.length; i++) {\n      const nodeId = nodeIds[i];\n      if (!nodeId) continue;                           // ye device offline\n      onlineUsers.add(targets[i].userId);\n      let list = byNode.get(nodeId);\n      if (!list) { list = []; byNode.set(nodeId, list); }\n      list.push(targets[i]);\n    }\n\n    // --- 4. har node par EK publish ---\n    const pipeline = this.redis.pipeline();\n    for (const [nodeId, list] of byNode) {\n      const envelope: GatewayEnvelope = { targets: list, frame: { type: 'message', message: msg } };\n      pipeline.publish('gw:' + nodeId, JSON.stringify(envelope));\n      deliveriesTotal.inc({ result: 'routed' }, list.length);\n    }\n    await pipeline.exec();\n\n    // --- 5. jiska ek bhi device online nahi -> push path ---\n    const offline = memberIds.filter((id) => !onlineUsers.has(id));\n    if (offline.length > 0) {\n      offlinePushTotal.inc(offline.length);\n      await this.pushProducer.send({\n        topic: 'push-requests',\n        messages: offline.map((userId) => ({\n          key: userId,\n          value: JSON.stringify({\n            userId,\n            conversationId: msg.conversationId,\n            seq: msg.seq,\n            messageId: msg.messageId,                  // push ke dedup ke liye\n            senderId,\n          }),\n        })),\n      });\n    }\n\n    logger.debug(\n      { conversationId: msg.conversationId, seq: msg.seq,\n        targets: targets.length, nodes: byNode.size, offline: offline.length },\n      'fanout done',\n    );\n  }\n}\n```\n\n**Code Explanation:**\n\n- `consumer.subscribe({ topic: 'chat-events', fromBeginning: false })` -- group `delivery`. `fromBeginning: false` zaruri hai: naya worker start hone par **3 din purane messages dobara deliver** nahi karne. Chat mein purana event replay karna matlab logon ke phone par purane messages ka notification burst.\n- `autoCommit: false` -- **spec ki decision, aur ye line poore worker ka safety model hai.** Auto-commit ka matlab hota hai \"kafkajs har 5 second mein jo bhi padh liya uska offset commit kar dega\" -- chahe `fanOut()` abhi chal hi raha ho ya fail ho gaya ho. Aisa hone par crash ke baad woh message **dobara padha hi nahi jaayega** = **message kabhi deliver nahi hoga**. Hum ulta chunte hain: **pehle kaam, phir commit.**\n- `await this.fanOut(event); await this.consumer.commitOffsets([...])` -- ye **order** hi at-least-once ka matlab hai.\n  - `offset: (Number(message.offset) + 1).toString()` -- Kafka mein commit \"maine ye padh liya\" nahi, \"**ab main yahan se shuru karunga**\" hota hai. Isliye `+1`. `+1` bhoolne par har restart par aakhri message dobara deliver hoga (irritating, par bhayanak nahi); jabki galti se `+2` karna matlab ek message **permanently skip**.\n  - **Crash mid-fan-out mein kya hota hai?** Maan lo humne 8 nodes mein se 5 par publish kar diya aur worker mar gaya (deploy, OOM, spot instance). Offset commit nahi hua. Naya worker **usi message** se shuru karega aur **poora fan-out dobara** karega -- yaani pehle wale 5 nodes ke users ko message **do baar** milega, aur offline users ko **do push** ja sakte hain.\n  - **Ye acceptable kyun hai?** Kyunki client `messageId` (client-generated UUID) se dedup karta hai -- uske local DB mein woh `messageId` already hai, toh doosri copy chupchaap gir jaati hai. Spec ki line hai: \"**at-least-once delivery, client-side dedup by `messageId`. Duplicate message dikhna galat hai par recoverable; message kho jaana nahi.**\"\n  - Push notification ka duplicate thoda zyada dikhta hai (do baar phone bajega), isliye hum push event mein `messageId` bhejte hain -- Notification System usi key par ek chhoti dedup window (jaise 60 s) laga sakta hai.\n- **Step 1 -- members -> devices.** `conversations.memberIds()` Redis-cached (`member:\u003cconversationId>` set, TTL 300 s). `.filter(id !== senderId)` -- **sender ko apna hi message wapas mat bhejo**, uske paas already hai (aur usko `ack` mil chuka hai). Ye ek line hai jo bhool jaane par har user ko apne message ka duplicate dikhta hai.\n  - Choti si imaandaari: sender ke **doosre devices** ko message chahiye hota hai (phone se bheja, web par bhi dikhna chahiye). Production mein ye filter `userId !== senderId` nahi balki `!(userId === senderId && deviceId === senderDeviceId)` hota hai. Yahan simple rakha hai.\n- **Step 2 -- `MGET`: is poore worker ka sabse important performance decision.**\n\n```\nEk 30-member group, har member ke 2 devices = 58 target devices (sender hata ke).\n\n[X] GALAT -- har device ke liye alag GET:\n      58 x GET conn:\u003cuserId>:\u003cdeviceId>\n      same-AZ Redis RTT ~0.4 ms\n      58 x 0.4 ms = ~23 ms  SIRF lookup mein\n\n      Aur ab iska scale dekho -- 460,000 deliveries/sec peak:\n      460,000 Redis GET/sec sirf session lookup ke liye.\n      Ek Redis node ~100K ops/sec comfortably karta hai\n      -> 5+ Redis nodes SIRF lookups ke liye\n      -> aur har worker 23 ms block, yaani consumer lag badhta jaayega\n      -> Kafka lag badhega -> delivery latency 500 ms budget se bahar\n      -> DESIGN FAIL\n\n[OK] SAHI -- ek MGET:\n      1 x MGET (58 keys) = ~0.4-2 ms, EK round trip\n      460,000 deliveries/sec ab bhi ~15,800 MGET/sec\n      (23,148 msg/sec average, ek MGET per message)\n      -> ek Redis node aaram se kar leta hai\n```\n\n  **Sabak:** network par **round trips** mehenge hote hain, data nahi. 58 keys ek request mein bhejna aur 58 alag requests bhejna -- data lagbhag utna hi hai, par time 50x alag. Ye wahi \"N+1 query problem\" hai jo aapne SQL mein dekha hai, bas yahan Redis par.\n  - `mget` **order preserve** karta hai -- jawab array mein `i`-th entry `keys[i]` ka jawab hai. Isi wajah se hum `targets[i]` se seedha match kar paate hain. `null` ka matlab: us device ki koi session entry nahi = **offline** (ya uski TTL expire ho gayi).\n  - Bahut bade group (256 members x 3 devices = 768 keys) par `MGET` ko chunks (jaise 200 keys) mein todna behtar hai, warna ek command Redis ko kuch milliseconds ke liye block kar sakti hai (Redis single-threaded hai -- ek lambi command ke peeche **sab** rukte hain).\n- **Step 3 -- group by `gatewayNodeId`.** 58 devices 250 nodes par bikhre hue hain, par practically woh 8-15 nodes par hi honge. Grouping ke baad hum 58 publishes ki jagah **8 publishes** karte hain.\n  - `onlineUsers` Set -- jis user ka **koi ek bhi** device online mila, woh \"online\" maana jaayega. Ye Flow 3 wali decision hai: phone offline par web online = push **mat** bhejo.\n- **Step 4 -- `pipeline()` phir `exec()`.** Yahan phir wahi round-trip wala sabak hai: 8 `PUBLISH` commands ek pipeline mein jaate hain = 1 round trip. Alag-alag `await redis.publish(...)` likhte toh 8 round trips.\n  - Ek envelope mein **us node ke saare targets** hote hain aur frame **ek baar** -- isliye gateway ko bhi `JSON.stringify` ek hi baar karna padta hai (block 2 ki wahi line).\n  - **Redis Pub/Sub fire-and-forget hai** -- `PUBLISH` ka return value \"kitne subscribers ne suna\" hai, \"kitno tak pahuncha\" nahi. Agar us exact microsecond mein gateway node reconnect kar raha tha, woh message **chupchaap gir jaata hai**. Ye data loss nahi hai (message Postgres mein `seq` ke saath baitha hai) -- client reconnect/resume par le lega. Par iska matlab ye hai ki **Pub/Sub ko kabhi durable mat samjho.** Interview mein ye khud bolna strong signal hai.\n- **Step 5 -- offline users -> push path.** `memberIds.filter(id => !onlineUsers.has(id))`. Hum FCM/APNs ko khud call nahi karte -- Notification System ko ek event bhejte hain (`push-requests` topic, consumer group `push-notifier`). Woh system retries, token invalidation aur provider outages already handle karta hai.\n  - `key: userId` -- ek user ke saare push events ek partition par, taaki unka order aur rate limiting ek jagah ho.\n- `fanoutSize.observe(targets.length)` -- **histogram**, aur ye dashboard ka sabse batane wala metric hai. p50 ~1 (1:1 chats), p99 ~500 (256-member group x devices). p99 achanak badhna = koi bada group bahut active ho gaya = agla latency spike wahin se aayega.\n- **Worker stateless hai** -- isme kuch yaad nahi rakha jaata. Isliye `delivery` group ke **64 tak instances** chal sakte hain (64 partitions hain, usse zyada instances idle baithenge).\n\n> **Interview line:** \"Fan-out worker ka kaam ek message ko N socket writes mein badalna hai. Do cheezein isko bachati hain: **ek `MGET`** saare device sessions ke liye (N round trips 460K deliveries/sec par design ko maar dete hain), aur **node ke hisaab se grouping** taaki har gateway node par ek hi `PUBLISH` jaaye. Offsets main manually commit karta hoon fan-out ke **baad**, isliye delivery at-least-once hai -- crash par duplicate ja sakta hai, par message kabhi kho nahi sakta, aur client `messageId` se dedup kar leta hai.\"\n\n### 7. `services/sync.service.ts` -- resume: delta per conversation\n\n```ts\nimport type { MessageRepository } from '../repositories/message.repository';\nimport type { ConversationRepository } from '../repositories/conversation.repository';\nimport type { ChatMessage } from '../types/frames';\nimport { logger } from '../infra/logger';\nimport { syncTruncatedTotal, syncFramesTotal } from '../infra/metrics';\n\nconst PER_CONVERSATION_CAP = 200;              // Flow 5: ek conversation se max 200\nconst TOTAL_CAP = 2000;                        // Flow 5: poore resume ka global cap\n\nexport interface ResumeResult {\n  messages: ChatMessage[];\n  truncated: Array\u003c{ conversationId: string; afterSeq: number; hasMore: true }>;\n}\n\nexport class SyncService {\n  constructor(\n    private readonly conversations: ConversationRepository,\n    private readonly messages: MessageRepository,\n  ) {}\n\n  async resume(\n    userId: string,\n    lastSeqByConversation: Record\u003cstring, number>,\n  ): Promise\u003cResumeResult> {\n    // --- 1. server ko pata hona chahiye ki user KIN conversations ka member hai ---\n    const memberships = await this.conversations.listForUser(userId);\n    // [{ conversationId, lastMessageSeq, lastReadSeq }, ...]\n\n    // --- 2. sirf wahi conversations jinme sach mein kuch naya hai ---\n    const stale = memberships\n      .map((m) => {\n        const clientSeq = Number(lastSeqByConversation[m.conversationId] ?? 0);\n        return { ...m, clientSeq, missing: m.lastMessageSeq - clientSeq };\n      })\n      .filter((m) => m.missing > 0)\n      .sort((a, b) => b.lastMessageSeq - a.lastMessageSeq);   // sabse recent chat pehle\n\n    const out: ChatMessage[] = [];\n    const truncated: ResumeResult['truncated'] = [];\n    let budget = TOTAL_CAP;\n\n    // --- 3. per-conversation cap + global budget ---\n    for (const m of stale) {\n      if (budget \u003c= 0) {\n        truncated.push({ conversationId: m.conversationId, afterSeq: m.clientSeq, hasMore: true });\n        continue;                                             // ek bhi query nahi\n      }\n      const limit = Math.min(PER_CONVERSATION_CAP, budget);\n      const rows = await this.messages.afterSeq(m.conversationId, m.clientSeq, limit);\n\n      out.push(...rows);\n      budget -= rows.length;\n\n      const lastSent = rows.length > 0 ? rows[rows.length - 1].seq : m.clientSeq;\n      if (lastSent \u003c m.lastMessageSeq) {\n        truncated.push({ conversationId: m.conversationId, afterSeq: lastSent, hasMore: true });\n      }\n    }\n\n    out.sort((a, b) => (a.conversationId === b.conversationId ? a.seq - b.seq : 0));\n    syncFramesTotal.inc(out.length);\n    if (truncated.length > 0) syncTruncatedTotal.inc(truncated.length);\n\n    logger.info(\n      { userId, conversations: stale.length, frames: out.length, truncated: truncated.length },\n      'resume delta built',\n    );\n    return { messages: out, truncated };\n  }\n}\n```\n\n**Code Explanation:**\n\n- `resume(userId, lastSeqByConversation)` -- client ka `resume` frame seedha yahan aata hai. Yaad rakho: **client apna state khud yaad rakhta hai** (local SQLite/IndexedDB mein har conversation ka `lastSeq`). Server ko kisi client ka \"kahan tak pahuncha tha\" yaad **nahi** rakhna padta -- ye design ko bahut simple banata hai aur server ko stateless rehne deta hai (gateway ke alawa).\n- **Step 1 -- `conversations.listForUser(userId)` sabse pehle kyun?** Kyunki hum client ki bheji hui list par **bharosa nahi** kar sakte. Agar hum seedha `lastSeqByConversation` ki keys par loop karein, toh ek attacker kisi bhi random `conversationId` ke saath `{ \"\u003ckisi-aur-ka-group>\": 0 }` bhej kar **poori history** maang lega. Server-side membership list hi authorization hai.\n  - Doosra fayda: client ki list mein woh conversation **nahi** hogi jisme usko abhi-abhi add kiya gaya hai. Server-side list se woh apne aap aa jaati hai (`clientSeq = 0` -> saara starting history).\n- **Step 2 -- `missing = lastMessageSeq - clientSeq`: ye ek subtraction poore sync ko sasta banata hai.** `conversations.last_message_seq` ek **column** hai -- usko padhne ke liye `messages` table ko chhuna hi nahi padta. 200 conversations wale user mein agar sirf 5 mein naya kuch hai, toh hum **5 queries** karte hain, 200 nahi. (Block 5 mein `GREATEST(...)` se ye column monotonic rakha gaya tha -- usi mehnat ka faayda yahan mil raha hai.)\n  - `Number(lastSeqByConversation[...] ?? 0)` -- client ne `seq` string mein bhej diya toh? `\"1204\" - 1204` NaN nahi deta par `\"9\" > \"1205\"` wala lexicographic bug yahan bhi ghus sakta hai. **Ye wahi `pg` BIGINT-as-string gotcha hai jo block 5 mein aaya tha** -- wahan hum DB se aaye `seq` ko `Number(r.seq)` karte the, yahan hum **client se aaye** `seq` ko `Number()` karte hain. **Seq jahan bhi system ki seema (DB boundary ya network boundary) paar kare, wahan ek baar `Number()` kar lo** -- warna comparison kahin na kahin string comparison ban jaayega aur sync \"kabhi-kabhi ajeeb behave karta hai\" ho jaayega.\n  - `.sort((a, b) => b.lastMessageSeq - a.lastMessageSeq)` -- **budget sabse active chats par kharch ho.** User app kholte hi sabse upar wali (sabse recent) chat dekhega; usko bhara hua milna chahiye, kisi 2 saal purane dormant group ko nahi.\n- **Step 3 -- do caps, aur dono zaruri hain:**\n  - `PER_CONVERSATION_CAP = 200` -- ek busy group poora budget na kha jaaye.\n  - `TOTAL_CAP = 2000` -- 50 conversations x 200 = 10,000 frames bhi utna hi khatarnak hai jitna ek conversation se 10,000.\n\n**Ab woh sawaal jo ye poora section explain karta hai: user ek MAHINE baad aaya, ek busy group mein 10,000 unread hain. Kya karein?**\n\n```\n[X] NAIVE -- sab bhej do:\n     10,000 frames x ~400 B JSON = ~4 MB\n     Abhi-abhi khule socket par ek saath likh diye.\n\n     1. Gateway ki Node heap mein 4 MB buffer ho gaya (ek client ke liye).\n     2. Client mobile network par hai -- 4 MB nikalne mein 10+ second.\n     3. ws.bufferedAmount 1 MB cross kar gaya.\n     4. backpressure.ts ne usko close(1013) kar diya.    \u003c-- hamara hi code\n     5. Client reconnect karta hai, wahi lastSeq bhejta hai (kuch save hi nahi hua).\n     6. Server phir 10,000 frames bhejta hai.\n     7. Phir drop.  -> INFINITE RECONNECT LOOP\n\n     Aur agar 50,000 aise users ek saath aaye (subah 9 baje):\n     50,000 x 4 MB = 200 GB jo gateways se guzarne ki koshish karega.\n     Gateway fleet mar jaayegi.\n\n[OK] SAHI -- cap + marker + REST:\n     1. Us conversation se sirf 200 sabse purane-unread-ke-baad wale messages bhejo\n        (seq 9801..10000 nahi -- seq clientSeq+1 se agle 200, taaki order na toote).\n     2. truncated marker bhejo: { conversationId, afterSeq: \u003cjahan tak bheja>, hasMore: true }\n     3. Client UI turant usable -- chat list dikh gayi, recent messages dikh gaye.\n     4. Client baaki REST se, page by page, apni raftaar se:\n          GET /api/v1/conversations/c-12/messages?afterSeq=9400&limit=50\n     5. Socket real-time ke liye khaali rehta hai -- yahi uska kaam hai.\n```\n\n  - **Asli insight:** user ko 10,000 messages **chahiye hi nahi**. Uski screen par 20 messages dikhte hain. Chat app kabhi \"poora history download\" nahi karta -- woh scroll par maangta hai. Isliye socket par 10,000 frames push karna ek **non-problem ka mehenga solution** hai.\n  - **WebSocket real-time ke liye hai, bulk transfer ke liye nahi.** Bulk HTTP ka kaam hai: HTTP par range requests, retry, resume, compression, CDN, aur **natural backpressure** (client agla page tabhi maangta hai jab pichhla aa gaya) sab free milta hai. Socket par ye sab aapko haath se likhna padega.\n- `if (budget \u003c= 0) { truncated.push(...); continue; }` -- budget khatam hone par **query bhi mat maaro**. Sirf marker bhej do. Ye bachata hai: ek user ka resume 200 Postgres queries na ban jaaye.\n- `lastSent \u003c m.lastMessageSeq` -- cap lagne ka seedha test: humne jahan tak bheja woh server ke last se peeche hai, matlab aur bacha hua hai -> marker.\n  - Marker mein `afterSeq: lastSent` bhejte hain, `clientSeq` nahi -- client ko REST pull **wahin se** shuru karna hai jahan socket ne chhoda tha, warna woh wahi 200 messages dobara khinchega.\n- `hasMore: true` -- client ke liye saaf signal: \"is conversation mein aur bhi hai, REST se le lo.\"\n- **Resume idempotent hai** -- client do baar `resume` bheje toh wahi messages dobara aayenge. Koi nuksan nahi: client `messageId` se dedup karta hai. Ye wahi at-least-once + client-side dedup decision hai jo delivery worker mein bhi thi -- **poore system mein ek hi safety model**, har jagah alag-alag nahi.\n- **Ek honest limitation:** `for` loop **sequential** hai -- 10 stale conversations = 10 Postgres round trips, ek ke baad ek. 5 ms each = 50 ms. Production mein inko `Promise.all` (concurrency limit 5 ke saath) se parallel karna chahiye. Yahan sequential isliye rakha hai ki `budget` har query ke baad ghatta hai -- parallel karne par budget ka hisaab pehle se baant-na padega. **Ye ek asli trade-off hai, chhupane layak nahi.**\n\n### 8. `services/presence.service.ts` -- heartbeat, TTL, aur scoped subscriptions\n\n```ts\nimport type { Redis } from 'ioredis';\nimport type { UserRepository } from '../repositories/user.repository';\nimport { presenceHeartbeatsTotal } from '../infra/metrics';\n\nconst PRESENCE_TTL_SEC = 90;                   // spec: heartbeat 30 s, 3 miss = offline\nconst LAST_SEEN_FLUSH_MS = 30_000;             // batch write to Postgres\nconst MAX_WATCHED = 64;                        // ek screen par itne hi log dikhte hain\n\nexport interface Presence {\n  userId: string;\n  status: 'online' | 'offline';\n  lastSeenAt?: string;\n}\n\nexport class PresenceService {\n  private readonly pendingLastSeen = new Map\u003cstring, number>();   // userId -> epoch ms\n\n  constructor(\n    private readonly redis: Redis,\n    private readonly users: UserRepository,\n  ) {\n    setInterval(() => void this.flushLastSeen(), LAST_SEEN_FLUSH_MS).unref();\n  }\n\n  // --- 1. har heartbeat par: TTL refresh + last-seen ko buffer mein daalo ---\n  async touch(userId: string): Promise\u003cvoid> {\n    presenceHeartbeatsTotal.inc();\n    await this.redis.set('presence:' + userId, '1', 'EX', PRESENCE_TTL_SEC);\n    this.pendingLastSeen.set(userId, Date.now());                 // Postgres abhi nahi\n  }\n\n  // --- 2. ek set of users ki presence: EK round trip ---\n  async read(userIds: string[]): Promise\u003cPresence[]> {\n    if (userIds.length === 0) return [];\n    const keys = userIds.map((id) => 'presence:' + id);\n    const vals = await this.redis.mget(keys);\n\n    const offline = userIds.filter((_, i) => vals[i] === null);\n    const lastSeen = offline.length > 0\n      ? await this.users.lastSeenFor(offline)                     // Map\u003cuserId, Date>\n      : new Map\u003cstring, Date>();\n\n    return userIds.map((userId, i) => vals[i] !== null\n      ? { userId, status: 'online' as const }\n      : { userId, status: 'offline' as const,\n          lastSeenAt: lastSeen.get(userId)?.toISOString() });\n  }\n\n  // --- 3. SIRF us screen ke logon ko watch karo jo abhi khuli hai ---\n  async setWatchList(userId: string, deviceId: string, watchedUserIds: string[]): Promise\u003cPresence[]> {\n    const scoped = watchedUserIds.slice(0, MAX_WATCHED);\n    const key = 'watch:' + userId + ':' + deviceId;\n    const pipe = this.redis.pipeline();\n    pipe.del(key);\n    if (scoped.length > 0) pipe.sadd(key, ...scoped);\n    pipe.expire(key, PRESENCE_TTL_SEC);\n    await pipe.exec();\n    return this.read(scoped);                                     // turant ek snapshot\n  }\n\n  // --- 4. last-seen batch flush (har 30 s ek UPDATE) ---\n  private async flushLastSeen(): Promise\u003cvoid> {\n    if (this.pendingLastSeen.size === 0) return;\n    const batch = [...this.pendingLastSeen.entries()];\n    this.pendingLastSeen.clear();                                 // pehle clear, phir write\n\n    await this.users.bulkUpdateLastSeen(\n      batch.map(([userId, ts]) => ({ userId, lastSeenAt: new Date(ts) })),\n    );\n  }\n}\n```\n\n**Code Explanation:**\n\n- `PRESENCE_TTL_SEC = 90` -- **ye poore presence system ka dil hai, aur ye ek bahut elegant trick hai.**\n  - Hum kahin bhi \"user offline ho gaya\" **likhte nahi**. Hum sirf online hone par ek key likhte hain jiski TTL 90 s hai. Key hai = online. Key nahi hai = offline. Bas.\n  - **Iska fayda:** user ka phone tunnel mein chala gaya, battery khatam, ya node `kill -9` hua -- in sab cases mein koi \"disconnect\" code chalta hi nahi. Agar hum explicit `offline` likhne par depend karte, toh woh user **hamesha ke liye \"online\"** dikhta rehta. TTL ise apne aap theek kar deti hai. **Distributed systems mein TTL hi asli garbage collector hai** (block 2 mein `conn:*` ke liye bhi yahi line thi -- same idea, do jagah).\n  - **90 s kyun?** Heartbeat 30 s hai. 1 miss (60 s) hona normal hai (packet loss). 90 s = 3 heartbeat windows, yaani \"pakka marr gaya.\" Isse chhota (jaise 35 s) rakhoge toh ek packet drop par user \"offline\" flicker karega.\n- **Presence eventual hai aur ise chhupana nahi chahiye.** 90 s TTL ka matlab hai ki ek user jo abhi-abhi offline hua, 90 second tak \"online\" dikh sakta hai. **Ye bug nahi, design hai.** Spec saaf kehti hai: \"Presence eventual hai aur 30-90 s tak stale ho sakti hai -- ye bilkul theek hai aur interview mein ise confidently bolna chahiye.\" Isiliye duniya ke saare chat apps \"last seen 2 minutes ago\" dikhate hain, \"last seen 0 seconds ago\" nahi.\n- `touch()` -- har heartbeat par **ek** Redis `SET ... EX`. Ab iska bojh naapo:\n\n```\n10M concurrent connections, heartbeat har 30 s\n   = 10,000,000 / 30 = 333,000 heartbeats/sec\n\nCompare karo messaging se:\n   messages = 23,148/sec\n\n   PRESENCE TRAFFIC MESSAGING SE 14x ZYADA HAI.\n```\n\n  **Yahi is section ka sabse bada sabak hai: presence messaging se mehenga hai.** Aur ironically presence ek \"nice to have\" feature hai, messaging product hai. Isliye presence ko **throttle** aur **scope** karna hi padta hai -- warna ek optional feature core product ko kha jaata hai.\n- `read(userIds)` -- phir wahi `MGET` wala sabak (block 6 jaisa). Conversation list screen par 50 log dikh rahe hain = **1 round trip**, 50 nahi.\n  - `offline` wale users ke liye hi Postgres se `last_seen_at` maangte hain -- online user ka last-seen koi nahi dekhta (\"online\" likha hota hai). 50 mein se 40 online hain toh Postgres query sirf 10 rows ki hai.\n  - `lastSeenFor(offline)` ek hi `WHERE id = ANY($1)` query hai -- phir se, N queries nahi.\n\n**Ab woh arithmetic jo ye batata hai ki `setWatchList()` kyun exist karta hai -- presence ka N-squared problem:**\n\n```\n[X] NAIVE -- \"jab user online ho, uske saare contacts ko bata do\":\n\n    10M users online aate hain (peak)\n    avg 200 contacts per user\n    = 10,000,000 x 200 = 2,000,000,000 (2 BILLION) notifications\n      SIRF EK PRESENCE FLIP WAVE ke liye.\n\n    Aur presence flip har din kai baar hota hai (train mein network gaya,\n    lift mein gaya, app background gaya, WiFi se 4G).\n\n    Compare: poore din ke messages = 2B.\n    Yaani PRESENCE ka traffic MESSAGING ke barabar ya usse zyada ho jaata hai\n    -- ek aise feature ke liye jiske bina app chal sakta hai.\n\n    Aur ye N-squared hai: users 2x karoge toh contacts bhi badhenge\n    -> notifications 4x. Growth ke saath ye apne aap phat-ta hai.\n\n[OK] SAHI -- scope + pull:\n\n    Priya ki screen par abhi 20 log dikh rahe hain (conversation list).\n    SIRF un 20 ki presence chahiye.\n\n    setWatchList(priya, device, [20 userIds])\n      -> ek MGET -> 20 jawab -> UI bhar gayi\n      -> screen badalne par nayi watch list, purani apne aap TTL par mar jaati hai\n\n    Notifications: 2,000,000,000  ->  ~20 reads jab user screen kholta hai.\n```\n\n  - `MAX_WATCHED = 64` -- client bhale hi 500 userIds bhej de, hum 64 hi lete hain. Ek screen par 64 se zyada log dikhte hi nahi (aur dikhte bhi hon toh unki presence koi nahi dekh raha). Ye ek **server-side limit** hai -- client par bharosa nahi karte.\n  - `pipe.del(key)` phir `sadd` -- watch list **replace** hoti hai, append nahi. User ne screen badli toh purani list poori tarah chali jaani chahiye, warna watch list dheere-dheere badhti rahegi aur hum wapas N-squared ki taraf chal padenge.\n  - `pipe.expire(key, 90)` -- watch list ki bhi TTL. Client crash hua toh ye entry apne aap saaf. (Phir se: TTL = garbage collector.)\n  - `return this.read(scoped)` -- watch set karte hi **turant snapshot** wapas. Warna user ko agle presence change tak khaali status dikhega.\n  - Iske baad presence **change** par push: jab `presence:\u003cuserId>` pehli baar banti/expire hoti hai, ek chhota worker `presence` frame un logon ko bhejta hai jinki watch list mein woh user hai. Kyunki watch lists chhoti hain, ye fan-out sambhav hai -- **2B ki jagah kuch hazaar.**\n- `pendingLastSeen` Map + `flushLastSeen()` -- **batched last-seen persistence.**\n\n```\n[X] Har heartbeat par Postgres UPDATE:\n      333,000 UPDATE/sec on users table\n      Har UPDATE = row rewrite + WAL write + index maintenance\n      Postgres primary turant mar jaayega.\n      (Aur ye 333,000 writes ek aisi value ke liye hain jo\n       kisi ko second-level accuracy mein chahiye hi nahi.)\n\n[OK] Memory mein buffer, har 30 s ek bulk UPDATE:\n      30 s mein 10M users ne touch kiya -> Map mein 10M entries nahi,\n      balki per-node share: 50,000 connections per node\n      -> ek node ke Map mein max 50,000 entries (~2 MB)\n      -> ek bulk UPDATE (UNNEST ya VALUES list) har 30 s\n      -> 333,000 writes/sec  ->  ~1,667 rows/sec per node, batched\n```\n\n  - `this.pendingLastSeen.clear()` **write se pehle** -- kyunki `bulkUpdateLastSeen()` async hai aur us dauraan naye heartbeats aate rahenge. Pehle clear na karo toh ya toh naye entries purane batch ke saath dobara likhenge, ya (aur bura) `clear()` baad mein chalne par **naye heartbeats gir jaayenge**.\n  - **Isme data loss hai, aur woh theek hai:** node crash hua toh pichhle 30 second ke last-seen updates kho gaye. Nateeja? Kisi ka \"last seen\" 30 second purana dikhega. **Ye feature ki accuracy hai, koi message nahi kho raha.** Jahan nuksan sirf cosmetic ho, wahan durability ke liye paise mat kharch karo -- ye ek engineering judgement hai jo interview mein bolna chahiye.\n  - `setInterval(...).unref()` -- timer process ko zinda na rakhe. (Graceful shutdown par ek aakhri `flushLastSeen()` call karna chahiye, taaki deploy par last-seen na kho.)\n- `presenceHeartbeatsTotal` -- `presence_heartbeats_total` spec ka metric hai. Iska rate aapke concurrent connections ka sabse seedha proxy hai: `rate ~= connections / 30`. Achanak girna = connections toot rahe hain.\n\n> **Interview line:** \"Presence do wajah se mushkil hai. Pehla, **volume**: 10M connections x 30 s heartbeat = 333K ops/sec, jo messaging se 14x zyada hai -- isliye heartbeat Redis par jaata hai aur last-seen Postgres par batch mein. Doosra, **N-squared fan-out**: har online event par 200 contacts ko batana = 2B notifications. Main uske liye presence ko **pull + scoped subscription** banata hoon -- sirf woh log jo abhi screen par hain. Aur presence ko main **TTL se derive** karta hoon, explicit offline write se nahi, kyunki crash aur network drop par koi disconnect handler chalta hi nahi.\"\n\n---\n\n## Remember\n\n> **\"Socket par ek line likhne ke liye poora system chalta hai -- `ack` tabhi do jab disk par likh chuke ho, `seq` se order karo (ghadi se kabhi nahi), N lookups ko ek `MGET` banao, aur jo client data nahi le raha usse drop kar do -- kyunki sab kuch `seq` ke saath DB mein baitha hai, woh wapas aakar le lega.\"**\n\n## Quick Self-Test\n\n1. `sendMessage` mein validate -> authorize -> `INCR seq` -> persist -> `ack` -> Kafka produce -- is order mein `authorize` ko `INCR` ke **baad** rakh dein toh ek attacker kya kar sakta hai, aur `ack` ko persist se **pehle** rakh dein toh user ke saath kya galat hoga?\n2. Delivery worker 58 target devices ke liye 58 alag `GET conn:...` karta hai. 460,000 deliveries/sec par iska kya hoga, aur `MGET` isko kaise bachata hai -- asli bachat round trips ki hai ya data ki?\n3. Delivery worker 8 nodes mein se 5 par `PUBLISH` kar chuka tha aur crash ho gaya, offset commit nahi hua. Naya worker start hone par un 5 nodes ke users ke saath kya hoga, aur unhe duplicate messages kyun nahi dikhenge?\n4. Ek user ek mahine baad aata hai aur ek group mein 10,000 unread hain. Agar hum sab socket par push kar dein toh `backpressure.ts` ka kaunsa code us client ko maarega, aur phir infinite loop kaise banta hai?\n5. \"Jab user online ho toh uske 200 contacts ko notify kar do\" -- 10M users par ye number kitna banta hai, aur `setWatchList()` us number ko kis cheez se replace kar deta hai?\n\n---\n\n**Next (Part 3):** WebSocket internals, connection routing ke saare options, message IDs aur ordering (seq vs timestamp vs Snowflake), delivery semantics aur tick state machine, presence ka N-squared problem, concurrency, Redis state. \"next\" bolo.\n"},{"label":"WebSocket Internals -> Ordering -> Delivery -> Presence -> Concurrency","md":"# Chat System -- HLD + LLD (Part 3: WebSocket Internals -> Ordering -> Delivery -> Presence -> Concurrency)\n\n> Is file mein prompt ke **Parts 13-15** hain, par chat ke hisaab se: **mechanisms zero se** (WebSocket ka handshake aur frame format, connection routing, message ID vs seq, delivery ke tick, reconnect storm), **concurrency** (ek hi conversation par do sender, ek user teen device par, Kafka rebalance, receipt out of order), aur **Redis state ka deep dive** (har key, presence ka N-squared problem, memory math, failover).\n> **Part 1-2 recap (3 lines):** Part 1 mein humne polling se WebSocket tak ki seedhi chadhi aur decide kiya ki gateway tier **stateful** hoga -- 250 nodes x 50,000 connections = 10M concurrent sockets, aur \"kaun kis node par hai\" ye Redis `conn:\u003cuserId>:\u003cdeviceId>` batayega. Part 2 mein flow, frame protocol (`send` / `ack` / `message` / `receipt` / `typing` / `resume`), Postgres schema (`messages` PK `(conversation_id, seq)`), APIs (`afterSeq` keyset sync) aur LLD classes (`gateway/`, `services/`, `workers/`) likhe. Rule ye tha: **`sent` ack tabhi jab message persist ho chuka ho**, aur fan-out Kafka `chat-events` (64 partitions, key = `conversationId`) ke through Delivery Workers karte hain.\n> **Part 4 mein kya hai:** scaling 1x -> 1000x, failure scenarios (gateway crash, Redis down, Kafka lag, reconnect storm), consistency, security, observability.\n\n---\n\n## PART 13 -- Important Mechanisms (zero se)\n\nChat mein \"algorithm\" wali baat kam hai (koi Base62, koi token bucket nahi). Yahan **mechanisms** hain -- aise machine ke purze jinke bina system chalta hi nahi. Paanch hain:\n\n1. WebSocket khud (transport)\n2. Connection routing (message sahi node tak kaise pahunche)\n3. Message ID + ordering (do alag cheezein, log inhe mila dete hain)\n4. Delivery semantics + tick state machine\n5. Reconnect + thundering herd\n\nHar ek ko zero se kholte hain.\n\n---\n\n### 13.1 -- WebSocket internals: ek connection jo khula rehta hai\n\n#### Pehle recap: hum yahan kaise pahunche\n\nPart 1 ki seedhi ek line mein:\n\n```\nShort polling   har 2 s GET /messages  -> 10M x 0.5 rps = 5M rps, 99% khaali jawab, phir bhi 2 s lag\nLong polling    server request rok ke rakhta hai -> better, par har message par naya HTTP request + headers\nSSE             server -> client one-way, text only -> client -> server ke liye alag HTTP call chahiye\nWebSocket       ek TCP connection, dono taraf, text + binary, HTTP Upgrade se shuru\n```\n\nAb WebSocket ko kholte hain -- kyunki \"10M connections\" ka poora budget isi ke internals se nikalta hai.\n\n#### Handshake -- byte by byte\n\nWebSocket **HTTP se shuru hota hai**. Ye design choice jaan-boojh kar hai: duniya ke saare firewall, proxy aur load balancer HTTP port 80/443 ko already samajhte hain. Agar WebSocket apna naya port maangta toh corporate network mein kabhi na chalta.\n\nClient bhejta hai (ye ek **normal HTTP GET** hai):\n\n```\nGET /ws HTTP/1.1\nHost: chat.example.com\nUpgrade: websocket\nConnection: Upgrade\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\nSec-WebSocket-Version: 13\nSec-WebSocket-Protocol: chat.v1\nSec-WebSocket-Extensions: permessage-deflate\nOrigin: https://chat.example.com\n```\n\nLine by line:\n\n| Header | Matlab | Agar galat ho toh |\n|---|---|---|\n| `GET /ws HTTP/1.1` | Normal HTTP request. Method **GET hi hona chahiye**, HTTP/1.1 hi (HTTP/1.0 mein Upgrade nahi) | Server 400 dega |\n| `Upgrade: websocket` | \"Is TCP connection ka protocol badalna hai\" | Server normal HTTP response de dega, socket nahi khulega |\n| `Connection: Upgrade` | Hop-by-hop header. Ye proxy ko batata hai ki `Upgrade` header **forward karo, kha mat jao** | Beech ka proxy Upgrade nigal jaata hai -- classic \"local par chalta hai, prod mein nahi\" bug (nginx mein `proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection \"upgrade\";` isliye likhna padta hai) |\n| `Sec-WebSocket-Key` | 16 random bytes, base64 mein (24 chars). **Har connection par naya** | Missing -> 400 |\n| `Sec-WebSocket-Version: 13` | RFC 6455 wala version. Aaj sirf 13 zinda hai | Server `Sec-WebSocket-Version: 13` ke saath 426 Upgrade Required bhejta hai |\n| `Sec-WebSocket-Protocol` | Subprotocol negotiation -- \"main `chat.v1` bolta hoon\". Hamare kaam ka: `chat.v2` deploy karte waqt purane clients ko `chat.v1` par serve kar sakte ho | Server ignore kar sakta hai |\n| `Sec-WebSocket-Extensions` | Frame-level extensions, jaise compression | Server chup rahe = extension off |\n\nServer jawab deta hai:\n\n```\nHTTP/1.1 101 Switching Protocols\nUpgrade: websocket\nConnection: Upgrade\nSec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\nSec-WebSocket-Protocol: chat.v1\n```\n\n**`101 Switching Protocols`** -- ye HTTP ka sabse kam dikhne wala status code hai. Iske baad us TCP connection par **HTTP bacha hi nahi**. Koi `Content-Length` nahi, koi response body nahi, koi \"request khatam\" nahi. Ab dono taraf se WebSocket frames chalenge, jab tak koi close na kare.\n\n#### `Sec-WebSocket-Key` / `Accept` asal mein kya prove karte hain?\n\nSabse common galatfehmi: \"ye security ke liye hai\". **Nahi hai.** Key random hai par **secret nahi** -- wire par plaintext jaati hai (TLS ke andar TLS ki wajah se safe hai, is header ki wajah se nahi).\n\nFormula:\n\n```\nSec-WebSocket-Accept = base64( SHA1( Sec-WebSocket-Key + \"258EAFA5-E914-47DA-95CA-C5AB0DC85B11\" ) )\n```\n\nWoh lamba GUID RFC 6455 mein **hard-coded** hai -- duniya ke har WebSocket server mein wahi string hai.\n\nVerify karke dekho (RFC ka hi examp
