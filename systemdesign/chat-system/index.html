lag per group (delivery/unread/push)       |  fanout_size p50/p99    |\n|  deliveries_total by result (delivered/no_session)|  worker CPU + restarts  |\n+---------------------------------------------------------------------------+\n|  ROW 4 -- DEPENDENCIES                                                    |\n|  Redis: ops/s, p99 latency, memory, evictions     |  DB: write p99, errors  |\n|  Node: event loop lag p99, heap, GC pause         |  S3 / push provider     |\n+---------------------------------------------------------------------------+\n|  ROW 5 -- SAFETY                                                          |\n|  slow_client_drops  |  buffered p99  |  seq_gap  |  authz_denied           |\n+---------------------------------------------------------------------------+\n```\n\n**Row 1 upar kyun:** on-call ko 5 second mein pata chalna chahiye \"users ko dard ho raha hai ya nahi\". Baaki rows \"kyun\" batati hain. Dashboard ko **cause** se nahi, **symptom** se shuru karo.\n\n### 7. Debugging story: \"Users bol rahe hain messages 30 second late aa rahe hain\"\n\nYe is system ka sabse common real incident hai. **Error rate 0% hoga.** Main is kram mein dekhta hoon:\n\n**Step 0 -- \"Kya badla?\"** Deploy timeline, config change, feature flag. 70% incidents ka jawab yahin mil jaata hai. Agar 10 minute pehle deploy hua tha, **pehle rollback socho, phir debug karo.**\n\n**Step 1 -- Confirm karo ki ye sach hai aur kitne logon ko hai.**\n\n```\nhistogram_quantile(0.95,\n  sum by (le, conversation_type) (rate(message_delivery_latency_seconds_bucket[5m])))\n```\n\n- Sab kuch upar? -> systemic.\n- Sirf `conversation_type=\"group\"`? -> fan-out path (Step 4 par jao).\n- p95 theek par p99 kharab? -> tail -- shayad ek node ya ek hot conversation.\n\n**Step 2 -- Pipeline ko do hisson mein kaato: accept vs deliver.**\n\n```\nhistogram_quantile(0.99, sum by (le) (rate(message_send_duration_seconds_bucket[5m])))\n```\n\n- **Send duration bhi upar** -> problem **accept path** mein hai (Redis `INCR`, DB write, authz). Delivery ka dosh hi nahi. Redis latency aur DB write p99 dekho. Aksar: Postgres par ek lambi transaction / lock, ya Redis par memory pressure.\n- **Send duration theek (~20 ms) par delivery latency 30 s** -> **message accept ho raha hai par pipeline mein atka hai.** Aage badho.\n\n**Step 3 -- Kafka lag dekho (sabse zyada baar yahi hota hai).**\n\n```\nmax by (group) (kafka_consumer_lag)\nsum by (partition) (kafka_consumer_lag{group=\"delivery\"})     # per-partition breakdown\n```\n\n- **Saari partitions par lag** -> workers kam hain ya sab slow hain. Wajah: worker deploy/rebalance, Redis slow (worker har delivery par Redis touch karta hai), ya bas traffic peak. **Fix: workers scale karo** (yaad rakho: 64 partitions = max 64 workers).\n- **Ek ya do partitions par lag, baaki 0** -> **hot conversation.** Ek badi group blast kar rahi hai aur apni partition ko block kiye hue hai. Confirm karo `fanout_size` p99 se. Fix: bounded concurrency badhao, gateway coalescing, ya us conversation ko temporarily throttle.\n\n**Step 4 -- Agar Kafka lag 0 hai, toh dosh Kafka ke baad wale hop ka hai.**\n\n```\nsum by (result) (rate(deliveries_total[5m]))                  # no_session badh raha hai?\nhistogram_quantile(0.99, sum by (le) (rate(redis_command_duration_seconds_bucket[5m])))\n```\n\n- `result=\"no_session\"` upar -> **session registry** problem (Redis down/slow, ya TTL refresh fail ho raha hai aur log \"offline\" mark ho rahe hain). Users ko push notifications mil rahe honge live messages ke bajaye -- ye ek bahut distinct symptom hai.\n- Redis p99 upar -> registry lookups aur publishes dono slow. Redis CPU, memory, evictions dekho. (Aur yaad karo: **cluster mode mein pub/sub sab nodes ko broadcast hota hai** -- agar recently cluster mein move kiye ho toh yahi ho sakta hai.)\n\n**Step 5 -- Agar sab upstream healthy hai, toh ek bura gateway node hai.**\n\n```\ntopk(5, ws_connections_active)\ntopk(5, nodejs_eventloop_lag_p99_seconds)\nhistogram_quantile(0.99, sum by (le, node) (rate(ws_buffered_amount_bytes_bucket[5m])))\n```\n\n- Ek node ka **event loop lag** 500 ms -> woh node har socket write late kar raha hai. Uske users ko 30 s dikh raha hai, baaki ko kuch nahi.\n- Wajah aksar: us node par ek badi group ke bahut saare members, ya ek memory leak, ya GC pause.\n- **Fix turant:** us node ko drain karo (staggered, PART 17 #2). Users 1-2 s mein doosre nodes par reconnect ho jaayenge. Postmortem baad mein.\n\n**Step 6 -- Ek trace utha ke poora raasta dekho.**\n\n```\ntrace_id = a3f9...   message send\n  |-- ws.frame.received      (gateway-14)              2 ms\n  |-- chat.authorize         (redis GET member:...)    0.4 ms\n  |-- chat.seq               (redis INCR)              0.3 ms\n  |-- db.insert messages                              14 ms\n  |-- kafka.produce                                    3 ms\n  |   ....................... 28,400 ms QUEUE WAIT .......................   \u003c-- mil gaya\n  |-- delivery.consume       (worker-7)               12 ms\n  |-- redis MGET conn:*                                1 ms\n  |-- redis PUBLISH gw:gateway-22                      0.3 ms\n  |-- ws.send                (gateway-22)              0.2 ms\n```\n\nWoh 28-second ka gap **exactly** batata hai kahan waqt gaya -- aur ye metrics se pehle hi mil jaata hai agar tumne trace id ko frame ke saath carry kiya ho. **Yahi wajah hai ki traceId ko delivery envelope mein daalna zaroori hai.**\n\n> Interview line: \"Mera North Star SLI `message_delivery_latency_seconds` hai -- server accept se recipient ke socket write tak, jise main `acceptedAtMs` aur traceId ko Kafka event aur pub/sub payload ke saath carry karke naapta hoon. Chat mein error rate lagbhag hamesha 0 hota hai, isliye main latency aur **Kafka consumer lag** par alert karta hoon, errors par nahi. Connection tier ke apne metrics hain jo stateless systems mein hote hi nahi -- per-node active connections (jiska achanak girna hamesha ek event hai), close-code distribution, aur buffered-bytes histogram jo slow-client drops ka leading indicator hai. Aur `fanout_size` p99 -- 768 -- wahi number hai jo meri tail latency explain karta hai.\"\n\n---\n\n## Remember\n\n> **Connections ko RAM aur file descriptors par scale karo, messages ko CPU par, aur deliveries ko Redis ops par -- teen alag axes, aur 6.6x amplification hamesha deliveries wala number jeet-ta hai. Push best-effort hai, store durable hai: isliye har failure sirf deri banati hai, data loss nahi. Per-conversation ordering strong (`seq`), presence jaan-boojh ke stale, sender ko read-your-writes. Har send par membership check karo, `Origin` verify karo kyunki CORS WebSockets par lagta hi nahi, aur latency par alert karo -- errors par nahi.**\n\n## Quick Self-Test\n\n1. Spec 23,148 msg/s aur 153,000 deliveries/s dono deta hai. In do numbers se tum gateway nodes, chat service instances aur delivery workers alag-alag kaise size karoge -- aur agar tumne sirf messages wala number use kiya toh sabse pehle kya tootega?\n2. Ek gateway node 50,000 sockets ke saath mara. Teen cheezein batao jo reconnect storm ko rokti hain, aur ye bhi ki rolling deploy usi storm ko **rozana** kyun paida karta hai jabki crash mahine mein ek baar hota hai. Deploy ke waqt kaunsa close code bhejoge aur kyun?\n3. Redis wipe ho gaya aur `seq:\u003cconversationId>` counters chale gaye. Tum unhe kaise rebuild karoge, aur \"gap acceptable hai par reuse kabhi nahi\" -- reuse se exactly kya toot-ta hai?\n4. Ek attacker `evil.com` se `new WebSocket('wss://chat.example.com/ws')` chalata hai. CORS ise kyun nahi rokta, kaunsa header rokta hai, aur token ko URL query string mein rakhna kyun teen alag jagah leak karta hai?\n5. Users kehte hain messages 30 second late aa rahe hain par error rate 0% hai. Pehle chaar cheezein kaunsi dekhoge, aur kaise batayoge ki dosh accept path ka hai, Kafka consumer lag ka hai, session registry ka hai, ya ek hi bure gateway node ka hai?\n\n---\n\n**Next (Part 5):** Trade-offs (WebSocket vs SSE vs long polling, Postgres vs Cassandra, pub/sub vs gRPC routing, E2EE ki keemat), MVP -> Scalable -> Highly Scalable, 20+ follow-up questions, what-ifs, Node.js specific questions. \"next\" bolo.\n"},{"label":"Trade-offs -> 3 Versions -> Follow-ups -> Node.js Questions","md":"# Chat System -- HLD + LLD (Part 5: Trade-offs -> 3 Versions -> Follow-ups -> Node.js Questions)\n\n> Is file mein prompt ke **Parts 21-25** hain: chat system ke har bade decision ka trade-off (\"kyun ye, kyun woh nahi\"), MVP -> Scalable -> Highly Scalable teen versions, 24 interviewer follow-up questions, 13 requirement-change (\"What if...\") questions, aur Node.js specific questions -- sab isi chat system ke numbers par.\n> Part 4 recap: humne dekha ki 1x se 100x tak sabse pehle **connections aur memory** tootti hain (CPU nahi), ek gateway node marne par 50,000 clients ka **reconnect storm** kaise poore fleet ko gira sakta hai (full-jitter backoff + waves), aur consistency mein humne saaf bola ki **ordering per conversation strong hai, presence eventual hai, delivery at-least-once hai**. Security mein connect par JWT, har `send` par membership authorization, media presigned URL; observability mein North Star SLI `message_delivery_latency_seconds` (server accept -> recipient socket write) plus `ws_connections_active`, `ws_buffered_amount_bytes`, `slow_client_drops_total`, `kafka_consumer_lag{group}`.\n> Part 6 mein: zero se ek chhota TypeScript chat server, 30-second answer, 5-minute answer, whiteboard drawing order, aur final cheat sheet.\n\nEk line mein hamara system yaad kar lo, kyunki Part 21 ka har answer isi par tika hai:\n\n```\nClient (mobile / web)\n  |  WebSocket wss://, heartbeat 30 s, reconnect full-jitter, resume with lastSeq\n  v\nL4 Load Balancer (TCP/TLS, least-connections)\n  v\nWS Gateway nodes (250 x 50,000 conns, STATEFUL)\n  |-- Redis session registry  conn:\u003cuserId>:\u003cdeviceId> = nodeId (TTL 90 s)\n  |-- subscribe Redis Pub/Sub channel  gw:\u003cnodeId>\n  v\nChat Service (stateless) -- authorize -> INCR seq:\u003cconversationId> -> persist -> ack 'sent'\n  v\nKafka chat-events (64 partitions, key = conversationId)\n  v\nDelivery Workers -> session lookup -> PUBLISH gw:\u003cnodeId>  |  offline -> Notification service (FCM/APNs)\n  v\nRecipient device -> 'delivered' receipt -> sender ko do tick\n```\n\nNumbers jo baar baar aayenge: **50M DAU, 10M concurrent connections, 2B messages/day (23,148 msg/sec avg, ~70,000 peak), 13.2B deliveries/day (~153,000/sec avg, ~460,000 peak), 50,000 connections per node x 250 nodes, ~20 KB per connection, 600 GB/day messages, 660 GB/day receipts (agar per-message store karein), 333,000 presence heartbeats/sec, group max 256, p95 delivery \u003c 500 ms.**\n\n---\n\n## PART 21 -- Trade-offs: har decision ka \"kyun ye, kyun woh nahi\"\n\n### Pehle rule samjho\n\nChat ke interview mein sabse common galti: \"WebSocket use karenge\" bol ke aage badh jaana. Interviewer ye sunna chahta hai:\n\n```\nRequirement kya hai  ->  Options kya hain  ->  Har option ki keemat kya hai  ->  Is requirement par kaunsi keemat chalegi\n```\n\nHamari requirements yaad rakho: **server ko khud se client tak push karna hai, p95 \u003c 500 ms, 10M concurrent connections, accepted message kabhi na khoye, per-conversation ordering strong, presence eventual chalegi.** Har table ke end mein **hamare system ka decision** hai.\n\n### 1. WebSocket vs SSE vs Long polling vs Short polling vs Push-only\n\nYe is poore system ka pehla aur sabse bada decision hai, isliye ek hi table mein saare axes:\n\n| | Short polling | Long polling | SSE (Server-Sent Events) | **WebSocket (hamara)** | Push-only (FCM/APNs) |\n|---|---|---|---|---|---|\n| **Direction** | Client -> server only (server jawab mein deta hai) | Client -> server, server ka reply \"rok ke\" | **Server -> client one-way**; client -> server ke liye alag HTTP call | **Full duplex** -- dono taraf, kabhi bhi | Server -> device only, aur woh bhi OS ke through |\n| **Latency** | Poll interval jitna (2 s poll = avg 1 s lag) | Near real-time (~ms), par har message ke baad naya request setup | Near real-time; client -> server leg par HTTP overhead | **Sabse kam** -- connection pehle se khula, bas ek frame | Seconds se minutes; OS batch aur throttle karta hai |\n| **Proxy / firewall friendliness** | Sabse zyada -- plain HTTP GET | Bahut achhi, par kuch proxies 30-60 s par request kaat dete hain | Achhi -- plain HTTP response stream, par buffering proxies (nginx `proxy_buffering on`) sab rok lete hain | Achhi, kyunki HTTP `Upgrade` se shuru hoti hai aur 443 par TLS ke andar hai; kuch corporate proxies phir bhi Upgrade block karte hain | N/A (OS ka apna channel) |\n| **Mobile battery** | Sabse bura -- har poll radio jagaata hai | Bura -- baar baar naya request | Theek -- ek connection, par one-way | Achha *agar* heartbeat lamba ho; 30 s heartbeat par radio baar baar jaagta hai (ye asli cost hai) | **Sabse achha** -- OS ka ek shared connection sab apps ke liye |\n| **Complexity** | Almost zero | Kam | Kam (`EventSource` browser mein built-in, auto reconnect + `Last-Event-ID`) | **Sabse zyada** -- stateful server, session registry, heartbeat, backpressure, reconnect + resume protocol | Kam for you, par delivery guarantee tumhare haath mein nahi |\n| **Binary support** | Haan (HTTP body) | Haan | **Nahi** -- text only (UTF-8), binary ko base64 karna padega (+33%) | Haan -- text + binary frames | Payload chhota (~4 KB) |\n\n**Hamare numbers par kya hota hai:**\n\n- Short polling: 10M users x har 2 s = **5M requests/sec**, jisme 99% khaali jawab. 23K msg/sec ke system ke liye 5M rps ka infra -- ye bilkul bewakoofi hai. Aur phir bhi 2 second lag.\n- Long polling: 10M open requests -- connections toh utne hi khule hain jitne WebSocket mein! Fayda kya mila? Bas ye ki har message par request cycle dobara chalti hai (headers, auth, logging middleware). 153K deliveries/sec x ~800 bytes headers = bekaar bandwidth.\n- SSE: sirf ek taraf ka kaam karta hai. Chat mein client bhi bhejta hai (`send`, `receipt`, `typing`) -- toh SSE + POST ka jugaad banega, matlab **do** connections per user. 10M users = 10M SSE + POST traffic.\n- WebSocket: ek connection, dono taraf, ek handshake, chhote frames (2-14 byte header).\n\n**Decision:** \"WebSocket, kyunki mera core requirement hi server-initiated push hai aur client bhi continuously bhejta hai (typing, receipts). SSE tab lunga jab traffic sach mein one-way ho -- live cricket score, stock ticker, order tracking, AI token streaming. Long polling ab bhi ek achha **fallback** hai un networks ke liye jahan Upgrade block hai.\"\n\n> **Honest note (ye line interview mein badi lagti hai):** har \"real-time\" app ko socket nahi chahiye. Agar product sirf **notification-style** hai -- \"order shipped\", \"someone liked your post\", din mein 5-10 events, user ko turant chahiye bhi nahi -- toh **push-only (FCM/APNs) + app khulne par ek REST sync call** poora kaam kar deta hai, aur tumhara server stateless rehta hai. 10M sockets ka poora dard tab uthao jab (a) user actively screen dekh raha ho, (b) do-taraf ka traffic ho, (c) sub-second matter karta ho. Chat mein teeno sach hain, isliye socket. Notification system mein teeno sach nahi, isliye wahan socket **nahi** lagate.\n\n### 2. Raw `ws` vs Socket.IO\n\n| | Raw `ws` (hamari v3 choice) | Socket.IO |\n|---|---|---|\n| **Pros** | Bahut patla -- per connection sirf socket + thoda JS object (~20 KB with TLS buffers). 50,000 conns per node realistic. Protocol tumhara (hamara JSON frame spec). Koi hidden magic nahi -- debugging seedhi | **Built-in reconnect** with backoff, **fallback to HTTP long polling** jab Upgrade block ho, **rooms** (`io.to('conv:123').emit(...)`), acknowledgements callbacks, **Redis adapter** jo multi-node broadcast khud kar deta hai, client libraries har platform ke liye |\n| **Cons** | Reconnect, backoff, heartbeat, rooms, multi-node routing -- **sab khud likhna** (yahi Part 2/3 ka LLD hai) | Per connection zyada memory aur CPU (engine.io session state, packet encoding layer, upgrade ke baad bhi polling session metadata). Apna protocol hai (`42[\"event\",{...}]`), toh non-JS clients ko official client chahiye. Redis adapter har broadcast ko **har node** par bhejta hai (pub/sub fan-out), 250 nodes par ye waste hai |\n| **Kab use karunga** | Jab connections lakhon mein hon aur per-connection memory hi bottleneck ho; jab protocol/versioning par poora control chahiye | **V1 aur V2 mein** -- jab connections hazaaron mein hain, team chhoti hai, aur reconnect/fallback khud likhna time waste hai. Startup ke pehle saal ke liye ye bilkul sahi choice hai |\n\n**Decision:** \"V1/V2 mein Socket.IO -- reconnect aur fallback free milte hain, aur 50,000 connections tak ye koi problem nahi. V3 mein raw `ws`, kyunki 250 nodes x 50,000 = memory per connection hi hamara cost driver ban jaata hai, aur Socket.IO ka Redis adapter broadcast model hamare targeted `gw:\u003cnodeId>` routing se mehenga hai. Ye migration sasta nahi hai (client protocol badalta hai), isliye ise **planned** karna padta hai, achanak nahi.\"\n\n### 3. Routing: Session registry + Redis Pub/Sub vs Consistent hashing vs Direct gRPC node-to-node\n\nProblem ek hi hai: **user A ka message user B tak kaise pahunche jab B ka socket kisi doosre gateway node par pada hai.**\n\n| | Broadcast to all nodes | Consistent hashing (user -> fixed node) | **Session registry + Redis Pub/Sub (hamara)** | Direct gRPC node-to-node |\n|---|---|---|---|---|\n| **Kaise** | Har delivery har node ko; jiske paas socket hai woh bhej de | `nodeId = hashRing(userId)`; LB bhi usi node par bhejta hai | Redis `conn:\u003cuserId>:\u003cdeviceId> = nodeId`; worker lookup karke sirf `gw:\u003cnodeId>` par publish karta hai | Worker registry se nodeId nikaal ke us node ko seedha gRPC call |\n| **Pros** | Zero lookup, zero state | Koi registry hi nahi -- lookup ek hash function hai, zero network. Deterministic | Ek Redis lookup (~0.3 ms) aur ek targeted publish. Node kahin bhi ho sakta hai, LB ko kuch pata nahi. Multi-device natural (`conn:*` ke multiple keys) | **Sabse kam latency** -- ek hop, Redis beech mein nahi. Backpressure aur delivery failure ka seedha signal milta hai |\n| **Cons** | 460K deliveries/sec x 250 nodes = **115M messages/sec** pub/sub par. Bekaar. N^2 | Node add/remove par users ka **rebalance** -- un users ke sockets todne padenge (mass reconnect = wahi storm). Client ko us exact node par pahunchana LB ke liye mushkil (DNS/ip per node). Hot node ka koi ilaaj nahi | Redis ab critical path par hai; Redis Pub/Sub **fire and forget** hai (subscriber down = message gaya); registry stale ho sakti hai (node mara, TTL 90 s baaki hai) | Service discovery chahiye, mesh chahiye, 250 nodes x 250 nodes = **62,500 potential connections**; connection management khud ek project |\n| **Kab use karunga** | Kabhi nahi (sirf jab nodes \u003c 5 aur traffic khilona ho) | Jab node count sthir ho aur tum rebalance ka dard uthaa sakte ho | **Default** -- 250 nodes tak ye simple aur predictable hai | V3 optimization jab p99 delivery latency mein Redis hop dikhne lage, ya jab per-delivery Redis ops budget cross ho |\n\n**Decision:** \"Session registry + pub/sub, kyunki ye **routing ko LB se decouple** kar deta hai -- client kisi bhi node par land kare, hum use dhoond lenge. Stale registry ka ilaaj TTL 90 s + heartbeat refresh + disconnect par explicit `DEL` hai. gRPC V3 ka optimization hai (Redis hop bachta hai) par tab service mesh aur connection pooling ka kharcha uthana padega.\"\n\n### 4. Redis Pub/Sub vs Redis Streams vs Kafka -- delivery fan-out ke liye\n\nDhyaan do: hamare design mein **dono** hain. Kafka `chat-events` (durable pipeline) aur Redis Pub/Sub `gw:\u003cnodeId>` (last hop). Interviewer poochhega \"ek hi kyun nahi?\"\n\n| | Redis Pub/Sub | Redis Streams | **Kafka (hamara pipeline)** |\n|---|---|---|---|\n| **Durability** | **Zero.** Subscriber offline = message gaya, koi trace nahi | Stream mein rehta hai (`XADD`), consumer group + `XACK`, pending entries list se retry | Disk par, replicated, retention (7 din), offset se replay |\n| **Latency** | **Sabse kam** (~0.2-0.5 ms) | Kam (~0.5-1 ms), par `XREADGROUP` + `XACK` = zyada ops | ~2-10 ms (batching, acks) |\n| **Ordering** | Per publisher, best effort | Per stream, strict | **Per partition strict** -- key `conversationId` se ek conversation ke saare messages ek partition mein, isliye order guaranteed |\n| **Consumers** | Sab subscribers ko copy (fan-out) | Consumer group -> kaam bat-ta hai | Multiple **independent** consumer groups: `delivery`, `unread-counter`, `push-notifier`, `archiver` -- sab apne offset par |\n| **Cons** | Fire and forget; Redis Cluster mein pub/sub sab nodes tak jaata hai (shard channels se hi bachta hai) | Trimming (`XTRIM`) khud manage karo warna memory phatti hai; Kafka jaisi retention/replay nahi | Ek aur bada system; 64 partitions ka ops; latency Redis se zyada |\n| **Kab use karunga** | **Last hop** jahan message pehle se durable ho chuka hai aur receiver (gateway) live hai. Miss ho gaya toh client reconnect par `resume` se sync kar lega -- **yahi hamara safety net hai** | Chhota-medium scale, jab Kafka nahi chahiye par durability chahiye. V2 ke liye achha middle ground | **Pipeline** jahan multiple consumers chahiye, replay chahiye, aur ordering per conversation guarantee chahiye |\n\n**Decision:** \"Kafka durable spine ke liye, Redis Pub/Sub sirf last hop ke liye. Pub/Sub ka message kho jaana **acceptable** hai kyunki message pehle hi persist ho chuka hai aur client ka `resume` protocol usse pakad lega. Agar mere paas Kafka nahi hota (V2), main Redis Streams lunga -- kyunki wahan mujhe retry chahiye hoti hai.\"\n\n> Key insight: **jo cheez pehle se durable store mein hai, uske transport ko durable hone ki zarurat nahi.** Chat ka asli safety net storage + `resume` hai, pub/sub nahi.\n\n### 5. `messages` table ke liye: Postgres vs Cassandra vs DynamoDB vs MongoDB\n\n| | Postgres (v1/v2) | **Cassandra / ScyllaDB (v3)** | DynamoDB | MongoDB |\n|---|---|---|---|---|\n| **Pros** | Ek hi DB mein users + members + messages; transactions; `ON CONFLICT` se idempotency free; joins se authorization query; sab jaante hain | Write-optimized (LSM tree), linear scale, `PRIMARY KEY ((conversation_id), seq)` + `CLUSTERING ORDER BY (seq DESC)` hamare exact read pattern se match; multi-DC replication built-in; TTL per row | Zero ops (managed), predictable latency, auto-scale, TTL, streams. `PK = conversationId`, `SK = seq` -- same shape | Flexible schema, sharding on `conversationId`, decent range scans, aggregation |\n| **Cons** | Ek primary par write ceiling (~10-20K simple inserts/sec on good NVMe); 219 TB/year ek machine par nahi aata; vacuum + index bloat; sharding khud karna padega | **Koi join nahi, koi transaction nahi** (membership phir bhi Postgres mein); eventual consistency samajhni padti hai (`QUORUM` reads); wide partition problem; ops heavy (repair, compaction) | Cost item-writes par hai: 2B writes/day ka bill bada hota hai; 400 KB item limit; query flexibility kam; vendor lock-in | Write throughput Cassandra se kam; shard key galat chuna toh hotspot; large scale par ops Cassandra jitna hi mushkil, faayde kam |\n| **Kab use karunga** | **Shuru mein hamesha** -- V1, V2, aur tab tak jab tak numbers na bolein | Jab numbers bolein (neeche) | Jab team chhoti ho aur AWS par ho, aur predictable per-request cost chal jaaye | Jab team already Mongo par hai aur scale medium hai |\n\n**Switch trigger, numbers mein (ye poochha jaata hai):**\n\n| Signal | Threshold | Hamara number |\n|---|---|---|\n| Sustained insert rate on one primary | > ~10,000 inserts/sec | **23,148/sec avg, 70,000 peak** -> cross |\n| `messages` table size | > ~5-10 TB (backup, vacuum, restore sab dard ban jaate hain) | **600 GB/day -> 219 TB/year** -> cross |\n| p99 insert latency | > 20 ms sustained | budget hi 500 ms end-to-end hai, DB ko 10 ms se kam chahiye |\n| Restore time | > few hours | 219 TB restore = din -- unacceptable |\n\n**Decision:** \"V1 Postgres, aur main is par proud hoon -- ek DB mein sab, transactions, idempotency `ON CONFLICT`. Jab messages ka write rate ~10K/sec aur size ~10 TB cross kare, tab `messages` (aur sirf `messages`) Cassandra par jaata hai, kyunki woh **append-only, time-ordered, no-join** data hai -- Cassandra ka perfect shape. `users`, `conversations`, `conversation_members` Postgres mein hi rehte hain, kyunki wahan relational integrity aur authorization queries chahiye. Cassandra ka gotcha: ek bahut badi group ka poora itihaas ek partition mein -- isliye `PRIMARY KEY ((conversation_id, month_bucket), seq)`.\"\n\n### 6. Store-once per conversation (fan-out on read) vs Per-recipient inbox (fan-out on write)\n\n**Ye is system ka sabse important trade-off hai, aur yahi News Feed se ulta hai.**\n\n| | **Store once per conversation (hamara)** | Per-recipient inbox (har member ki copy) |\n|---|---|---|\n| **Write cost** | 1 row per message = **2B rows/day, 600 GB/day** | 1 row per recipient = **13.2B rows/day, ~4 TB/day** (6.6x) |\n| **Read cost** | Ek partition se range scan: `WHERE conversation_id = ? AND seq > ?` -- ek query, sorted | Har user ka apna inbox -- bhi ek query, aur \"unread\" seedha inbox se |\n| **Delete for everyone** | Ek row update (`deleted_at`) -- **sab ko turant lagta hai** | 30 rows update karni padengi, aur kuch miss ho sakti hain |\n| **Edit message** | Ek row | N rows |\n| **Group size ka asar** | Zero -- 256 member group bhi 1 row | Linear -- 256 rows per message |\n| **Kab use karunga** | Jab **recipients per item kam hon** (chat mein avg 30) aur read hamesha \"us conversation ka\" ho | Jab read pattern \"mere saare sources ka merged stream\" ho, aur read time par merge karna mehenga ho |\n\n**News Feed se contrast (yahi interviewer sunna chahta hai):**\n\n| | Chat | News Feed |\n|---|---|---|\n| Read query | \"Ek conversation ke last 50 messages\" -- **ek hi partition** | \"Mere 500 followees ke latest posts, merged aur sorted\" -- **500 partitions** |\n| Fan-out size | avg 30, max 256 | avg 500 followers, celebrity par 100M |\n| Isliye kya jeetta | **Fan-out on read** (store once) -- read already sasta hai, write ko 6.6x mat karo | **Fan-out on write** (push into each follower's timeline) -- warna har feed open par 500-way merge |\n| Ulta case | Broadcast channel (1 lakh members) mein chat bhi feed jaisa ban jaata hai -> read-time fetch | Celebrity post par feed bhi chat jaisa ban jaata hai -> hybrid: pull celebrity posts at read time |\n\n**Decision:** \"Chat mein message **ek hi baar conversation ke against** store hota hai; jo cheez fan out hoti hai woh **delivery** hai (ek transient socket write), **storage** nahi. News Feed mein ulta -- wahan storage fan out hoti hai kyunki read ek 500-way merge hai. Dono jagah shabd 'fan-out' hai par matlab alag; ye farak pakadna hi is sawaal ka asli jawab hai.\"\n\n### 7. Per-message receipt rows vs `last_read_seq` watermarks\n\n| | Per-message receipt row (`message_receipts`) | **Watermark (`last_read_seq`, `last_delivered_seq`) -- hamara** |\n|---|---|---|\n| **Storage** | 13.2B deliveries/day x ~50 B = **660 GB/day** -- messages (600 GB/day) se **zyada**! 1 saal = 240 TB, x3 replication = 720 TB | Ek row per (conversation, user) -- 2 columns update. Chat kitna bhi ho, size **constant** |\n| **Writes** | 153,000 receipt inserts/sec avg, 460,000 peak -- ek aur pura write pipeline | Har receipt = ek `UPDATE ... SET last_read_seq = GREATEST(last_read_seq, $1)` -- aur clients batch karke bhejte hain (10 messages padhe -> ek update) |\n| **Kya kho jaata hai** | -- | \"Kaunsa **exact** message kab deliver hua\" ka history nahi bachta -- sirf \"is seq tak sab ho gaya\". Non-contiguous read (user ne beech ka message padha) express nahi hota | \n| **Group receipts** | Har member x har message = poora matrix | `last_read_seq >= seq` wale members gino -> \"Read by 12 of 30\" seedha nikal jaata hai |\n| **Kab use karunga** | Jab compliance ya legal proof chahiye ki kis banda ne kis message ko kab dekha (enterprise/regulated); ya jab per-message analytics product feature ho | **Default** -- WhatsApp/Slack jaisa product behaviour isse poora ban jaata hai |\n\n**Decision:** \"Watermark. `conversation_members.last_read_seq` aur `last_delivered_seq` monotonic hain -- `GREATEST()` se out-of-order receipts bhi safe hain, aur unread count `last_message_seq - last_read_seq` se free mein mil jaata hai. 660 GB/day bachana ek single design decision se -- interview mein ye line bahut strong lagti hai. Agar product 'kis member ne kab padha' ka full matrix maange toh main us feature ko sirf **groups \u003c= 256** ke liye aur **90 din retention** ke saath dunga, unlimited nahi.\"\n\n### 8. JSON frames vs Protobuf / MessagePack\n\n| | **JSON (hamara)** | Protobuf | MessagePack |\n|---|---|---|---|\n| **Size** | ~300 bytes typical frame (field names repeat hote hain) | ~40-50% chhota (field numbers, varint) | ~20-30% chhota (JSON jaisa model, binary encoding) |\n| **CPU** | `JSON.parse`/`stringify` C++ mein hai aur bahut fast, par **synchronous aur blocking** | Encode/decode fast, par JS implementations ka overhead real hai | Fast, par JSON.parse se hamesha tez nahi (V8 bahut optimized hai) |\n| **Debugging** | **Chrome DevTools mein frame khol ke padh lo** -- ye badi baat hai | Binary; tooling chahiye | Binary |\n| **Schema evolution** | Koi schema nahi -- naya field add karna free, par galti bhi free | Strong: field numbers, `reserved`, backward compatible by design | Koi schema nahi |\n| **Kab use karunga** | Default. Jab tak bandwidth bill ya mobile data complaint na aaye | Jab bandwidth sach mein bottleneck ho: 460K deliveries/sec x 150 bytes bachaye = ~70 MB/s bacha; ya jab typed contract cross-team zaroori ho | Jab minimum badlav mein size chahiye (drop-in, schema nahi) |\n\n**Hamara number:** 460,000 deliveries/sec x 300 bytes = **~138 MB/sec** egress peak. Protobuf se ~60-70 MB/sec. Bandwidth bill ke hisaab se ye matter karta hai, par **development speed** shuruaat mein zyada matter karti hai.\n\n**Decision:** \"JSON, kyunki debuggability aur iteration speed chahiye aur `JSON.parse` sach mein fast hai. Optimization jo main **pehle** karunga woh encoding nahi hai: (1) frames chhote rakho (field names chhote), (2) `permessage-deflate` **soch samajh ke** -- ye CPU aur per-connection ~300 KB memory maangta hai, toh 50,000 connections par 15 GB! Isliye hum ise **off** rakhte hain. Protobuf tab jab bandwidth graph bole.\"\n\n### 9. Stateful gateways (build) vs Fully managed service (buy)\n\nYe asli build-vs-buy baat hai, aur iska jawab **scale par palat jaata hai**.\n\n| | **Apne gateway nodes (build)** | AWS API Gateway WebSocket | Ably / Pusher / PubNub |\n|---|---|---|---|\n| **Kya milta hai** | Poora control: memory per connection, backpressure policy, routing, close codes, protocol | Managed sockets; connection ko Lambda/HTTP backend se jodta hai; `@connections` API se push | Managed sockets + channels/rooms + presence + history + client SDKs + global edge |\n| **Ops** | Tumhare paas 250 stateful nodes hain: deploy, drain, ulimit, OOM, reconnect storms. **Ek team chahiye** | Lambda concurrency, cold start, 29 s limits, payload limits | Lagbhag zero |\n| **Cost (order of magnitude, list price, rough)** | 250 nodes x 8 GB ~ **$30-50K/month** socket tier ke liye | ~$1 per million connection-minutes + ~$1 per million messages. 10M conns x 43,200 min/month = **432,000 million connection-minutes = ~$430K/month**, plus 13.2B deliveries/day x 30 = ~396,000 million messages = **~$400K/month**. Total **~$800K+/month** | Peak-connection + message based; enterprise pricing par bhi 10M connections ka bill **6-7 figures/month** hota hai |\n| **Kab use karunga** | Jab connections **~1M+** ho jaayein, ya jab protocol/latency par control product ka differentiator ho | **Chhote se medium** (10K-100K connections), serverless stack, team chhoti -- yahan ye clearly jeetta hai | Jab socket tumhara core product **nahi** hai (dashboard live updates, collaborative cursor, live scores) aur time-to-market matter karta hai |\n\n**Break-even ka mental model:**\n\n```\n\u003c 50K concurrent      -> buy. Ek engineer ki salary > pura managed bill.\n50K - 500K            -> depends. Bill vs ek dedicated platform engineer ka cost compare karo.\n> 1M concurrent       -> build. Managed bill itna hai ki poori team afford ho jaati hai.\n```\n\n**Decision:** \"Hamare 10M connections par managed service ka bill hamare poore socket tier se **15-20x** mehenga hai, aur usme backpressure policy, close codes, ya per-connection memory par control bhi nahi milta. Isliye build. Lekin agar interviewer ne bola 'startup hai, 6 mahine mein launch karo' -- toh main **Ably/Pusher se shuru** karunga aur socket layer ko apne code mein ek interface ke peeche rakhunga, taaki baad mein swap ho sake. Ye bolna kamzori nahi, maturity hai.\"\n\n### 10. E2EE (end-to-end encryption) vs Server-side plaintext\n\n**Term:** *E2EE* matlab message sirf sender aur recipient ke devices par padha ja sakta hai -- server ke paas sirf encrypted blob hota hai, chaabi nahi.\n\n| | **Server-side plaintext (hamara v1)** | E2EE (Signal protocol style) |\n|---|---|---|\n| **Kya milta hai** | Server-side search, server-side group fan-out of content, easy multi-device, spam/abuse moderation, rich previews, server-side backup/restore, compliance export | Server breach par bhi messages nahi padhe ja sakte; insider risk khatam; legal demands par \"hamare paas hai hi nahi\" |\n| **Kya kho jaata hai** | Privacy guarantee -- server (aur uska admin, aur uska subpoena) sab padh sakta hai | **Server-side search** (index encrypted text par nahi ban sakta -> search device par, aur naye device par purana history searchable nahi). **Server-side group fan-out of content** (server content dekh nahi sakta; sender ko har recipient device ke liye alag encrypt karna padta hai -- 256 member group x 3 devices = 768 encryptions per message, sender ke phone par). **Multi-device** (har device ki apni identity key; naye device par purana history transfer karna alag protocol hai). **Moderation** (server spam/CSAM detect nahi kar sakta -> user reporting par shift). Link previews, server-side backups |\n| **Kya nahi badalta** | -- | **Metadata phir bhi server ke paas hai**: kaun kisko, kab, kitna, kitni baar. Ye chhota nahi hai |\n| **Kab use karunga** | Enterprise/team chat jahan compliance, eDiscovery, aur admin search product requirement hi hain (Slack ka default) | Consumer messaging jahan privacy hi product hai (WhatsApp, Signal) |\n\n**Decision:** \"V1 mein E2EE nahi -- aur ye kaayarta nahi hai, ye ek **product decision** hai: mujhe server-side search, easy multi-device, aur moderation chahiye. Agar privacy core requirement ban jaaye toh Part 24 #3 mein main poora migration path deta hoon. Beech ka raasta bhi hai jo log bhool jaate hain: **encryption at rest + strict access control + audit logs** -- ye server breach ka 80% risk bina E2EE ke dard ke kam kar deta hai.\"\n\n### 11. Presence always-on (push) vs Presence on-demand (pull + subscribe)\n\n| | Always-on push (sabko batao) | **On-demand (hamara)** |\n|---|---|---|\n| **Kaise** | User online hua -> uske saare contacts ko `presence` frame | `presence:\u003cuserId>` Redis key TTL 90 s (heartbeat se refresh). Client jo chat **abhi khuli hai** sirf unke liye poochhta/subscribe karta hai |\n| **Cost** | 10M users x avg 200 contacts = **2B notifications per presence flip**. Aur log din mein 20-50 baar flip karte hain (metro, lift, network switch) -> arbon events | Chat list khuli = ~20 lookups; chat khuli = 1 subscribe. Redis `MGET presence:\u003ca> presence:\u003cb> ...` ek round trip |\n| **Accuracy** | Near instant | **30-90 s tak stale** -- key expire hone par hi \"offline\" pata chalta hai |\n| **Kab use karunga** | Chhoti team apps (Slack workspace mein 50 log) jahan contacts kam hain | Consumer scale jahan contact graph bada hai |\n\n**Decision:** \"On-demand + scoped subscribe. Aur main confidently bolunga: **presence eventual hai aur 30-90 s stale ho sakti hai -- 'last seen 2 minutes ago' ka matlab hi yahi hai.** Yaad rakho: presence heartbeats 333,000/sec hain jabki messages 23,000/sec -- **presence messaging se 14x mehenga hai.** Isliye presence ko throttle karo, scope karo, aur last-seen ko batch mein persist karo (har heartbeat par Postgres update = suicide).\"\n\n### 12. Sticky sessions (LB affinity) vs Session registry\n\n| | Sticky sessions / session affinity | **Session registry (hamara)** |\n|---|---|---|\n| **Kaise** | LB cookie ya source-IP hash se user ko hamesha usi node par bhejta hai | LB jahan chahe bheje; node connect par Redis mein `conn:\u003cuserId>:\u003cdeviceId> = nodeId` likh deta hai |\n| **Pros** | Reconnect par wahi node, wahi warm state; koi registry nahi | Node kabhi bhi mar sakta hai, deploy ho sakta hai, scale ho sakta hai -- client kisi bhi naye node par reconnect karega aur sab kaam karega. Multi-device natural. Node count badalne se kuch nahi tootta |\n| **Cons** | Node restart/deploy par us node ke **saare** sessions ka state bekaar; affinity source-IP par ho toh ek NAT ke peeche wale saare log ek node par; scale-in par bade chunks migrate; aur ye **problem solve hi nahi karta** -- B ka socket phir bhi doosre node par ho sakta hai | Ek Redis dependency; stale entries (TTL se handle); ek extra lookup per delivery |\n| **Kab use karunga** | Legacy apps jinke paas in-memory session hai aur shared store nahi | **Hamesha, is system mein** |\n\n**Decision:** \"Sticky sessions yahan **anti-pattern** hain -- woh routing problem ko solve nahi karte (message kisi aur user ko jaana hai, wapas usi user ko nahi), aur deploy/restart ko mushkil bana dete hain. Isliye LB par sirf **least-connections** (round-robin nahi, kyunki connections long-lived hain -- naya node round-robin par bhi khaali reh jaayega), aur routing ka jawab session registry deta hai.\"\n\n### 13. Prompt ke generic pairs -- chat par kya lagta hai, kya nahi\n\n| Pair | Chat par? | Decision |\n|---|---|---|\n| **SQL vs NoSQL** | Haan, aur jawab **dono** hai | `users`, `conversations`, `conversation_members` -> Postgres (relational, authorization, transactions). `messages` -> v1 Postgres, v3 Cassandra (append-only time series). \"Ek hi DB sab ke liye\" is scale par galat hai |\n| **Sync vs Async** | Haan, aur ye line bahut zaroori hai | **Sync (client ruk ke wait karta hai):** authorize -> `INCR seq` -> persist -> `ack`. Yahi durability requirement hai. **Async (Kafka ke baad):** delivery fan-out, unread counters, push notifications, search indexing, archival. Sender ko recipients ka wait nahi karna chahiye |\n| **Cache vs no cache** | Haan, selective | Cache: membership (`TTL 300 s` -- har send par authorization check), session registry (woh khud Redis hai), presence, unread. **Messages ko cache mat karo** -- read pattern already \"last N by PK\" hai jo DB ke liye sasta hai, aur cache invalidation (delete for everyone, edit) dard hai |\n| **Kafka vs RabbitMQ** | Haan | Kafka, kyunki chahiye **per-key ordering** (`conversationId`), **multiple independent consumer groups** (delivery, unread, push, archive), aur **replay** (delivery worker ka bug -> offset reset). RabbitMQ per-message routing aur complex topologies mein better hai, par ordering + replay + multi-consumer fan-out par Kafka jeetta hai |\n| **REST vs WebSocket** | Dono, aur ye batna important hai | **WebSocket:** send, receipt, typing, presence, incoming messages -- sab real-time. **REST:** conversation list, history scroll (`beforeSeq`), delta sync (`afterSeq`), create conversation, add member, media presign, health. Rule: jo cheez **server se bina poochhe aa sakti hai** woh socket par; jo **user ke action par ek baar** chahiye woh REST par (cacheable, retryable, debuggable) |\n| **Polling vs WebSocket** | Solved in #1 | WebSocket; polling ke numbers upar hain |\n| **UUID vs Snowflake** | Haan, aur ye **do alag cheezein** hain | `messageId` = **client-generated UUID v4** -> idempotency key (retry par duplicate nahi). `seq` = **server-assigned per-conversation integer** (`INCR seq:\u003cconversationId>`) -> ordering + gap detection + delta sync. Snowflake tab jab globally sortable ID chahiye bina per-conversation counter ke -- hamein per-conversation ordering chahiye, global nahi, toh `INCR` simple aur sasta hai. **Timestamp se ordering kabhi nahi** -- client clocks jhoot bolti hain aur servers mein bhi skew hota hai; `createdAt` sirf display ke liye |\n\n### Summary: ek table mein saare decisions\n\n| Decision | Humne kya chuna | Kab badlenge |\n|---|---|---|\n| Transport | WebSocket | One-way traffic -> SSE; Upgrade blocked -> long-poll fallback; notification-style app -> push only |\n| Library | Socket.IO (V1/V2) -> raw `ws` (V3) | Per-connection memory bottleneck bane tab |\n| Routing | Session registry + Redis Pub/Sub | p99 mein Redis hop dikhe -> direct gRPC |\n| Pipeline | Kafka (64 partitions, key `conversationId`) | Chhota scale -> Redis Streams |\n| Last hop | Redis Pub/Sub `gw:\u003cnodeId>` | -- (loss OK, `resume` safety net) |\n| Message store | Postgres -> Cassandra | > ~10K inserts/sec ya > ~10 TB |\n| Storage model | Store once per conversation | Broadcast channels (100K members) -> read-time fetch |\n| Receipts | `last_read_seq` / `last_delivered_seq` watermarks | Compliance chahiye -> per-message rows, bounded retention |\n| Encoding | JSON | Bandwidth bill bole -> protobuf |\n| Gateways | Build (apne nodes) | \u003c 100K connections -> buy (managed) |\n| Encryption | Server-side plaintext + at-rest encryption | Privacy product requirement bane -> E2EE |\n| Presence | On-demand + scoped subscribe, TTL 90 s | Chhoti team app -> push to all contacts |\n| LB | Least-connections, **no** sticky | -- |\n\n> Interview line: \"Chat mein har decision do cheezon ke beech hai -- **latency/simplicity** aur **durability/control**. Mera requirement 'accepted message kabhi na khoye, par presence aur typing kho sakte hain' hai, isliye main durability sirf message path par kharch karta hoon aur baaki sab jagah sasta transient path leta hoon.\"\n\n---\n"},{"label":"Implement It -> Interview Answers -> Whiteboard -> Cheat Sheet","md":"# Chat System -- HLD + LLD (Part 6: Implement It -> Interview Answers -> Whiteboard -> Cheat Sheet)\n\n> Is file mein prompt ke **Parts 26-30** hain: coding round mein \"Implement a chat server\" kaise solve karein, 30-second answer, 5-minute answer, whiteboard par diagram kis order mein banayein, aur poore Chat System (Parts 1-5) ki final cheat sheet.\n> **Part 5 ka 3-line recap:** (1) Top trade-offs -- WebSocket vs polling, session registry vs consistent hashing, raw `ws` vs Socket.IO, Postgres vs Cassandra, E2EE abhi nahi. (2) V1 (ek gateway + Postgres) -> V2 (250 gateways + Redis registry + Kafka) -> V3 (Cassandra, multi-region, direct gRPC node-to-node). (3) Follow-ups -- reconnect storm, group 256 ki limit, receipts ka storage, presence ka N-squared, multi-device ordering.\n> **Ye revision file hai.** Parts 1-5 samajhne ke liye the; ye file interview se ek raat pehle padhne ke liye hai. Ek baar poora padho, phir sirf PART 30 dobara-dobara.\n\n---\n\n## PART 26 -- Code Design Question: \"Implement a chat server\"\n\n### Pehle samjho: ye kya round hai\n\n\"Implement a rate limiter\" ek class thi. **\"Implement a chat server\" ek chhota system hai jo ek file mein aata hai.** Interviewer 40-50 minute mein ye dekhna chahta hai:\n\n- Tum **scope clarify** karte ho ya seedha typing shuru kar dete ho?\n- Tum **connection state** ko sahi manage karte ho (add, remove, cleanup)?\n- **Ack persist ke baad** dete ho ya pehle?\n- `messageId` aur `seq` ka **farak** tumhe pata hai?\n- **Multi-device** handle karte ho, ya \"ek user = ek socket\" maan lete ho?\n- Disconnect par **cleanup** karte ho? (ye sabse common memory leak hai)\n\nIska matlab: **ek process, in-memory store, fake socket bhi chalega.** Lekin har jagah bolna hai ki \"production mein ye Redis/Postgres/Kafka banega, interface wahi rahega\".\n\n> Connection: Rate Limiter ke Part 26 mein bhi yahi pattern tha -- in-memory class + injectable clock, phir \"storage badlega, interface nahi\". Chat mein ek extra cheez hai: **socket** bhi inject karna padta hai, kyunki ye hamara pehla stateful system hai.\n\n### Step 1 -- 60 second mein scope clarify karo (typing se pehle)\n\nYe bolo, seedha bolo:\n\n> \"Main ek single-process chat server likhunga jo WebSocket frames handle karta hai. Transport ko main abstract rakhunga taaki test mein fake socket daal sakun. Storage in-memory rahega lekin uske **do contracts** wahi honge jo production mein hain -- per-conversation monotonic `seq` aur `messageId` par idempotency. Auth, Redis, Kafka, push notification -- ye main **stub** karunga aur bataunga ki asli mein kya hota.\"\n\n| Question | Mera assumption (agar interviewer bole \"you decide\") |\n|---|---|\n| 1:1 ya group? | Dono -- conversation ke members ki list, 1:1 bas 2 members wali conversation hai |\n| Persistence chahiye? | In-memory `Map`, par contract production jaisa (`seq`, idempotency) |\n| Multi-device? | **Haan** -- ek user ke multiple sockets. Ye poora design badal deta hai (`Map\u003cuserId, Set\u003cConnection>>`) |\n| Receipts? | `delivered` aur `read`, monotonic per user per conversation |\n| Presence / typing? | Typing haan (ephemeral, throttled), full presence out of scope |\n| Auth? | `verifyToken(token) -> userId` ek injected function -- JWT verify stub |\n| Offline delivery? | Message store hota hai + ek `onOffline` hook (production mein push notification service) |\n| Multiple server nodes? | **Nahi, ek node.** Multi-node ke liye Redis session registry + pub/sub -- bolunga, likhunga nahi |\n| Clock? | Injectable, taaki heartbeat test bina `sleep` ke ho |\n\n**Kya build karunga:** frame types -> `MessageStore` -> `ConnectionManager` -> `ChatServer` (frame router) -> heartbeat/backpressure -> ek chalta hua scenario.\n\n**Kya stub karunga:** token verify, push notification, Redis, Kafka, real `ws` socket.\n\n### Step 2 -- Logic pehle bolo (Hinglish mein, code se pehle)\n\n> \"Teen alag cheezein hain aur main unhe alag rakhunga.\n>\n> Ek -- **messages ka data**: kaunsi conversation, kaun member hai, kaunsa message kis `seq` par hai. Ye `MessageStore` hai. Isme do guarantee hain: `seq` per conversation **badhta hi jaata hai**, aur ek hi `messageId` do baar insert nahi hota.\n>\n> Do -- **live connections**: kaun abhi online hai aur uske kitne device khule hain. Ye `ConnectionManager` hai, `Map\u003cuserId, Set\u003cConnection>>`. Set isliye kyunki ek user ke phone aur web dono khule ho sakte hain.\n>\n> Teen -- **protocol**: frame aaya toh kya karna hai. Ye `ChatServer` hai, ek switch.\n>\n> `send` ka order sabse important hai: validate -> **authorize** (member ho ya nahi) -> persist (yahin `seq` milta hai) -> **tab** sender ko ack -> phir baaki sab devices par fan-out. Ack persist ke baad, warna user ko tick dikh jaayega aur message gayab ho jaayega.\n>\n> Disconnect par connection ko `Map` se hataana bhoolna sabse badi bug hai -- 50,000 connections wale node par woh OOM hai.\"\n\nAb code.\n\n### Step 3 -- Code block 1: frame types (protocol pehle)\n\n```ts\n// ---- protocol (spec ke exactly same frames) ----\nexport type ClientFrame =\n  | { type: 'auth'; token: string; deviceId: string }\n  | { type: 'send'; messageId: string; conversationId: string; body: string; mediaKey?: string }\n  | { type: 'receipt'; conversationId: string; seq: number; state: 'delivered' | 'read' }\n  | { type: 'typing'; conversationId: string }\n  | { type: 'resume'; lastSeqByConversation: Record\u003cstring, number> }\n  | { type: 'ping' };\n\nexport type ServerFrame =\n  | { type: 'auth_ok'; userId: string }\n  | { type: 'ack'; messageId: string; seq: number; serverTs: string }\n  | { type: 'message'; message: ChatMessage }\n  | { type: 'receipt'; conversationId: string; seq: number; userId: string; state: 'delivered' | 'read' }\n  | { type: 'presence'; userId: string; status: 'online' | 'offline'; lastSeenAt?: string }\n  | { type: 'typing'; conversationId: string; userId: string }\n  | { type: 'error'; code: string; message: string }\n  | { type: 'pong' };\n\nexport interface ChatMessage {\n  messageId: string;        // client UUID = idempotency key\n  conversationId: string;\n  seq: number;              // server assigned, per conversation\n  senderId: string;\n  body: string;\n  mediaKey?: string;\n  createdAt: string;        // display only, NEVER used for ordering\n}\n\n// transport ko abstract rakha hai: test mein fake socket, prod mein `ws`\nexport interface Socket {\n  readyState: number;          // 1 = OPEN\n  bufferedAmount: number;      // ws deta hai; backpressure ka signal\n  send(data: string): void;\n  close(code: number, reason: string): void;\n}\n```\n\n**Code Explanation:**\n\n- `ClientFrame` aur `ServerFrame` **discriminated unions** hain -- `type` field discriminator hai. Iska fayda: `switch (frame.type)` ke andar TypeScript khud jaanta hai ki `frame.body` sirf `send` case mein exist karta hai. Interview mein bolo: \"main protocol ko type system se enforce kar raha hoon, `any` se nahi.\"\n- `auth` mein `deviceId` hai, sirf `token` nahi -- kyunki **multi-device** hai. Session registry ki key hi `conn:\u003cuserId>:\u003cdeviceId>` hai; bina `deviceId` ke phone aur web ek doosre ko overwrite kar dete.\n- `send` mein `messageId` **client** bhejta hai (UUID v4). Ye idempotency key hai. Server generate karta toh retry par server ko pata hi nahi chalta ki ye wahi message hai.\n- `mediaKey?` -- media ka **content** frame mein nahi jaata, sirf S3 ka key. 30 TB/day gateways se nahi guzarna chahiye.\n- `ack` mein `seq` wapas jaata hai -- yahi sender ka \"ek grey tick\" hai, aur client isi se apna local pending message ko server wale se match karta hai.\n- `receipt` client -> server mein `userId` nahi hai (server socket se jaanta hai kaun bola), par server -> client mein `userId` hai (group mein batana padta hai **kisne** padha).\n- `createdAt: string; // display only` -- ye comment code mein rakhna. Interviewer ye line dekh ke hi samajh jaata hai ki tumhe clock skew ka pata hai.\n- `Socket` interface -- ye sabse important design choice hai. Asli `ws` ka `WebSocket` isi shape ka hai (`readyState`, `bufferedAmount`, `send`, `close`). Isko abstract karne se poora server **testable** ho jaata hai bina network ke.\n\n### Step 4 -- Code block 2: `MessageStore` (do contracts jo asli maayne rakhte hain)\n\n```ts\ninterface Conversation {\n  id: string;\n  type: 'direct' | 'group';\n  members: Set\u003cstring>;\n  lastSeq: number;                          // production: Redis INCR seq:\u003cconversationId>\n  messages: ChatMessage[];                  // seq se sorted (append-only)\n  byMessageId: Map\u003cstring, ChatMessage>;    // production: UNIQUE (conversation_id, message_id)\n  readState: Map\u003cstring, { lastDeliveredSeq: number; lastReadSeq: number }>;\n}\n\nexport class MessageStore {\n  private readonly convs = new Map\u003cstring, Conversation>();\n\n  createConversation(id: string, type: 'direct' | 'group', memberIds: string[]): void {\n    const conv: Conversation = {\n      id, type, members: new Set(memberIds), lastSeq: 0,\n      messages: [], byMessageId: new Map(), readState: new Map(),\n    };\n    for (const m of memberIds) conv.readState.set(m, { lastDeliveredSeq: 0, lastReadSeq: 0 });\n    this.convs.set(id, conv);\n  }\n\n  isMember(convId: string, userId: string): boolean {\n    return this.convs.get(convId)?.members.has(userId) ?? false;\n  }\n\n  members(convId: string): string[] {\n    const c = this.convs.get(convId);\n    return c ? [...c.members] : [];\n  }\n\n  // CONTRACT 1: seq per conversation monotonic.  CONTRACT 2: messageId idempotent.\n  append(convId: string, input: { messageId: string; senderId: string; body: string; mediaKey?: string; createdAt: string }):\n    { message: ChatMessage; duplicate: boolean } {\n    const c = this.convs.get(convId);\n    if (!c) throw new Error('NO_CONVERSATION');\n\n    const existing = c.byMessageId.get(input.messageId);\n    if (existing) return { message: existing, duplicate: true };   // retry -> wahi purana message\n\n    const seq = ++c.lastSeq;                                        // monotonic, never reused\n    const message: ChatMessage = {\n      messageId: input.messageId, conversationId: convId, seq,\n      senderId: input.senderId, body: input.body, createdAt: input.createdAt,\n      ...(input.mediaKey ? { mediaKey: input.mediaKey } : {}),\n    };\n    c.messages.push(message);\n    c.byMessageId.set(input.messageId, message);\n    return { message, duplicate: false };\n  }\n\n  // resume / delta sync: seq > afterSeq wale messages\n  after(convId: string, afterSeq: number, limit = 500): ChatMessage[] {\n    const c = this.convs.get(convId);\n    if (!c) return [];\n    let lo = 0, hi = c.messages.length;\n    while (lo \u003c hi) {                       // binary search: pehla index jiska seq > afterSeq\n      const mid = (lo + hi) >> 1;\n      if (c.messages[mid].seq \u003c= afterSeq) lo = mid + 1; else hi = mid;\n    }\n    return c.messages.slice(lo, lo + limit);\n  }\n\n  // receipts monotonic hain: peeche nahi ja sakte\n  markReceipt(convId: string, userId: string, seq: number, state: 'delivered' | 'read'): boolean {\n    const c = this.convs.get(convId);\n    if (!c) return false;\n    const st = c.readState.get(userId) ?? { lastDeliveredSeq: 0, lastReadSeq: 0 };\n    c.readState.set(userId, st);\n    if (state === 'read') {\n      if (seq \u003c= st.lastReadSeq) return false;\n      st.lastReadSeq = seq;\n      if (seq > st.lastDeliveredSeq) st.lastDeliveredSeq = seq;   // read ka matlab delivered bhi\n      return true;\n    }\n    if (seq \u003c= st.lastDeliveredSeq) return false;\n    st.lastDeliveredSeq = seq;\n    return true;\n  }\n}\n```\n\n**Code Explanation:**\n\n- `members: Set\u003cstring>` -- membership lookup O(1). Production mein ye `conversation_members` table hai, aur hot path par **Redis mein cache** (TTL 300 s), warna har send par ek DB query = 23K queries/sec sirf authorization ke liye.\n- `lastSeq: number` + `++c.lastSeq` -- **Contract 1**. Production mein ye `INCR seq:\u003cconversationId>` hai Redis par. Do baaton par dhyaan do: (a) `seq` per **conversation** hai, global nahi -- global counter ek single hot key ban jaata; (b) `seq` mein **gap chalega** (Redis restart par counter `conversations.last_message_seq` se rebuild hota hai), par **reuse kabhi nahi** -- reuse do alag messages ko ek hi slot de deta.\n- `byMessageId: Map\u003cstring, ChatMessage>` -- **Contract 2**. Production mein yahi `CREATE UNIQUE INDEX messages_msgid_uniq ON messages (conversation_id, message_id)` hai, aur insert `INSERT ... ON CONFLICT (conversation_id, message_id) DO NOTHING RETURNING seq` se hota hai. Cassandra mein `IF NOT EXISTS` (lightweight transaction) mehenga hai, isliye wahan dedup **client side** aur ek chhote Redis `SETNX msgid:\u003cid>` guard se hota hai.\n- `append` pehle `byMessageId.get` karta hai aur **duplicate par seq consume nahi karta**. Ye line hi idempotency hai. Agar hum pehle `++lastSeq` karte aur baad mein duplicate check karte, toh har retry ek `seq` jala deta.\n- Return type `{ message, duplicate }` -- caller ko dono chahiye: ack dono case mein bhejna hai (wahi `seq`), lekin **fan-out sirf pehli baar**. Agar duplicate par bhi fan-out karte toh recipient ko message do baar dikhta.\n- `createdAt` input se aata hai (injected clock se), `Date.now()` andar se nahi -- testability.\n- `after()` binary search karta hai, `filter` nahi. `filter` O(n) hai poori history par; binary search O(log n) + O(k) jitne messages wapas bhejne hain. 3 saal purani chat mein ye farak asli hai.\n- `limit = 500` -- resume par unbounded replay mat karo. Client 3 mahine baad khula toh 50,000 messages ek saath socket mein daalna = backpressure + OOM. Baaki history REST `GET /api/v1/conversations/:id/messages?afterSeq=...` se paginate hoti hai.\n- `markReceipt` **monotonic** hai: `if (seq \u003c= st.lastReadSeq) return false`. Kyun? Receipts network par out of order aa sakte hain (seq 5 ka read pehle, seq 3 ka delivered baad mein). Agar hum blindly set karte toh blue tick wapas grey ho jaata. Ye bug real apps mein dikhta hai.\n- `read` par `lastDeliveredSeq` bhi aage badhta hai -- padh liya matlab pahuncha toh tha hi. Ye state machine ka implicit rule hai.\n- Return `boolean` (`changed`) -- agar kuch badla hi nahi toh receipt frame **broadcast mat karo**. 153K deliveries/sec wale system mein bekaar broadcast sabse pehle mehenga padta hai.\n\n### Step 5 -- Code block 3: `ConnectionManager` (aur woh classic memory leak)\n\n```ts\nconst OPEN = 1;\nconst EMPTY: ReadonlySet\u003cConnection> = new Set();\n\nexport interface Connection {\n  id: string;\n  socket: Socket;\n  userId: string | null;\n  deviceId: string | null;\n  authed: boolean;\n  lastSeenAt: number;\n}\n\nexport class ConnectionManager {\n  private readonly byUser = new Map\u003cstring, Set\u003cConnection>>();\n  private total = 0;\n\n  constructor(private readonly nodeId: string, private readonly metrics: Metrics) {}\n\n  add(conn: Connection): void {\n    if (!conn.userId) throw new Error('cannot register an unauthenticated connection');\n    let set = this.byUser.get(conn.userId);\n    if (!set) { set = new Set(); this.byUser.set(conn.userId, set); }\n    set.add(conn);\n    this.total++;\n    this.metrics.ws_connections_active = this.total;\n  }\n\n  // THE cleanup. Ise bhoolna = 50K connections wale node par OOM.\n  remove(conn: Connection): boolean {\n    if (!conn.userId) return false;\n    const set = this.byUser.get(conn.userId);\n    if (!set || !set.delete(conn)) return false;   // already removed -> idempotent\n    if (set.size === 0) this.byUser.delete(conn.userId);   // \u003c-- khaali Set bhi hatao\n    this.total--;\n    this.metrics.ws_connections_active = this.total;\n    return true;\n  }\n\n  devicesOf(userId: string): ReadonlySet\u003cConnection> {\n    return this.byUser.get(userId) ?? EMPTY;\n  }\n\n  isOnline(userId: string): boolean {\n    return (this.byUser.get(userId)?.size ?? 0) > 0;\n  }\n\n  // ek user ke saare devices par bhejo, optionally ek connection chhod kar\n  deliver(userId: string, frame: ServerFrame, exceptConnId?: string): number {\n    let n = 0;\n    for (const conn of [...this.devicesOf(userId)]) {   // copy: send() beech mein remove kar sakta hai\n      if (exceptConnId && conn.id === exceptConnId) continue;\n      if (this.send(conn, frame)) n++;\n    }\n    return n;\n  }\n\n  // send() -- backpressure ke saath -- Step 7 mein\n}\n```\n\n**Code Explanation:**\n\n- `Map\u003cstring, Set\u003cConnection>>` -- **ek user ke multiple devices**. Agar tum `Map\u003cuserId, Connection>` likhte (bahut log likhte hain), toh user ka web login uske phone ka socket overwrite kar deta aur phone ko messages milne band ho jaate. Interviewer yahi dekhta hai.\n- `Connection` mein `userId: string | null` -- socket **pehle** khulta hai, auth **baad mein** aata hai. Auth se pehle connection kisi user ka nahi hai.\n- `add()` mein `if (!conn.userId) throw` -- unauthenticated connection registry mein nahi jaani chahiye, warna `byUser.get(null)` jaisi ajeeb state banti hai.\n- `remove()` ki **teen lines hi asli baat hain**:\n  1. `set.delete(conn)` -- ye connection hataya.\n  2. `if (set.size === 0) this.byUser.delete(conn.userId)` -- **khaali `Set` bhi hataao.** Ye bhoolne par: 50M DAU mein se har user jo kabhi connect hua, uska ek khaali `Set` hamesha ke liye memory mein reh jaata hai. Node kabhi crash nahi karta, bas dheere dheere RSS badhta rehta hai aur 3 din baad OOM. Ye **\"connection hi hata di par Map key reh gayi\"** wali classic leak hai.\n  3. `if (!set || !set.delete(conn)) return false` -- **idempotent**. `close` event do baar aa sakta hai (error + close), aur hum counter do baar decrement nahi kar sakte.\n- Return `boolean` -- caller (`onClose`) tabhi log/metric karta hai jab sach mein kuch hata.\n- `devicesOf` `EMPTY` (ek shared frozen-jaisa `Set`) return karta hai, `null` nahi -- caller ko har jagah null-check nahi karna padta, aur naya `Set()` per call allocate nahi hota.\n- `deliver` mein `[...this.devicesOf(userId)]` -- **copy banakar iterate karo.** Kyun? `send()` ke andar slow-client drop ya write error `close()` call kar sakta hai, jo `remove()` chalata hai, jo isi `Set` ko modify karta hai. Set ko iterate karte hue modify karna yahan silently entries skip kara deta.\n- `exceptConnId` -- **multi-device echo** ka dil. Sender ke **doosre** devices ko message bhejna hai (web par bhi dikhna chahiye), par **jis socket ne bheja usko nahi** (usko `ack` mil chuka hai). Isliye except sirf `conn.id` par hai, `userId` par nahi.\n- `metrics.ws_connections_active` -- ye gateway ka sabse important gauge hai. Node par 50,000 ka target hai; 60,000 dikhe toh LB least-connections theek se kaam nahi kar raha.\n\n### Step 6 -- Code block 4: `ChatServer` (frame router)\n\n```ts\nconst MAX_BODY_BYTES = 4096;\nconst TYPING_THROTTLE_MS = 3000;\nconst SESSION_TTL_MS = 90_000;\n\nexport class ChatServer {\n  private readonly typingSeen = new Map\u003cstring, number>();\n  private connSeq = 0;\n\n  constructor(private readonly deps: {\n    nodeId: string;\n    store: MessageStore;\n    conns: ConnectionManager;\n    sessions: Map\u003cstring, { nodeId: string; expiresAt: number }>;  // prod: Redis\n    now: () => number;\n    verifyToken: (token: string) => string | null;                  // prod: JWT verify\n    metrics: Metrics;\n    onOffline: (userId: string, message: ChatMessage) => void;      // prod: push-notifier\n  }) {}\n\n  onConnection(socket: Socket): Connection {\n    const conn: Connection = {\n      id: `c${++this.connSeq}`, socket, userId: null, deviceId: null,\n      authed: false, lastSeenAt: this.deps.now(),\n    };\n    return conn;   // caller socket ke 'message' / 'close' events ko wire karta hai\n  }\n\n  onClose(conn: Connection, code: number, reason: string): void {\n    const removed = this.deps.conns.remove(conn);\n    if (conn.userId) this.deps.sessions.delete(`conn:${conn.userId}:${conn.deviceId}`);\n    if (removed) this.deps.metrics.ws_disconnect_total++;\n  }\n\n  handleRaw(conn: Connection, raw: string): void {\n    let frame: ClientFrame;\n    try {\n      frame = JSON.parse(raw) as ClientFrame;\n    } catch {\n      this.deps.conns.send(conn, { type: 'error', code: 'BAD_FRAME', message: 'frame is not valid JSON' });\n      return;                                   // connection band mat karo, ek bura frame sab kuch na toote\n    }\n    if (!frame || typeof frame.type !== 'string') {\n      this.deps.conns.send(conn, { type: 'error', code: 'BAD_FRAME', message: 'frame has no type' });\n      return;\n    }\n    if (conn.authed) conn.lastSeenAt = this.deps.now();     // koi bhi frame = zinda hai\n    if (!conn.authed && frame.type !== 'auth') {\n      this.deps.conns.send(conn, { type: 'error', code: 'UNAUTHENTICATED', message: 'auth first' });\n      conn.socket.close(4001, 'auth required');\n      return;\n    }\n    switch (frame.type) {\n      case 'auth':    return this.onAuth(conn, frame);\n      case 'send':    return this.onSend(conn, frame);\n      case 'receipt': return this.onReceipt(conn, frame);\n      case 'typing':  return this.onTyping(conn, frame);\n      case 'resume':  return this.onResume(conn, frame);\n      case 'ping':    return void this.deps.conns.send(conn, { type: 'pong' });\n      default:\n        this.deps.conns.send(conn, { type: 'error', code: 'UNKNOWN_TYPE', message: 'unknown frame type' });\n    }\n  }\n\n  private onAuth(conn: Connection, frame: Extract\u003cClientFrame, { type: 'auth' }>): void {\n    if (conn.authed) return;                                   // dobara auth ignore\n    const userId = this.deps.verifyToken(frame.token);\n    if (!userId || typeof frame.deviceId !== 'string') {\n      this.deps.conns.send(conn, { type: 'error', code: 'UNAUTHENTICATED', message: 'bad token' });\n      conn.socket.close(4001, 'auth failed');\n      return;\n    }\n    conn.userId = userId;\n    conn.deviceId = frame.deviceId;\n    conn.authed = true;\n    conn.lastSeenAt = this.deps.now();\n    this.deps.conns.add(conn);\n    this.deps.sessions.set(`conn:${userId}:${conn.deviceId}`,\n      { nodeId: this.deps.nodeId, expiresAt: this.deps.now() + SESSION_TTL_MS });   // prod: SET .. EX 90\n    this.deps.conns.send(conn, { type: 'auth_ok', userId });\n  }\n\n  private onSend(conn: Connection, frame: Extract\u003cClientFrame, { type: 'send' }>): void {\n    // 1. validate\n    if (typeof frame.messageId !== 'string' || typeof frame.conversationId !== 'string' || typeof frame.body !== 'string') {\n      return void this.deps.conns.send(conn, { type: 'error', code: 'BAD_FRAME', message: 'send needs messageId, conversationId, body' });\n    }\n    if (Buffer.byteLength(frame.body, 'utf8') > MAX_BODY_BYTES) {\n      return void this.deps.conns.send(conn, { type: 'error', code: 'MESSAGE_TOO_LARGE', message: 'body > 4 KB' });\n    }\n    // 2. AUTHORIZE -- is system ka sabse bada security check\n    if (!this.deps.store.isMember(frame.conversationId, conn.userId!)) {\n      return void this.deps.conns.send(conn, { type: 'error', code: 'NOT_A_MEMBER', message: 'you are not a member of this conversation' });\n    }\n    // 3. PERSIST (yahin seq milta hai, yahin idempotency lagti hai)\n    const { message, duplicate } = this.deps.store.append(frame.conversationId, {\n      messageId: frame.messageId, senderId: conn.userId!, body: frame.body,\n      mediaKey: frame.mediaKey, createdAt: new Date(this.deps.now()).toISOString(),\n    });\n    // 4. ACK -- persist ke BAAD, kabhi pehle nahi\n    this.deps.conns.send(conn, { type: 'ack', messageId: message.messageId, seq: message.seq, serverTs: message.createdAt });\n    // 5. duplicate par dobara fan-out NAHI\n    if (duplicate) { this.deps.metrics.duplicate_send_total++; return; }\n    // 6. fan-out\n    this.fanOut(message, conn.id);\n  }\n\n  private fanOut(message: ChatMessage, senderConnId: string): void {\n    let devices = 0;\n    for (const memberId of this.deps.store.members(message.conversationId)) {\n      // sender ke DOOSRE devices ko bhi bhejo (multi-device echo), bhejne wale socket ko nahi\n      const except = memberId === message.senderId ? senderConnId : undefined;\n      const n = this.deps.conns.deliver(memberId, { type: 'message', message }, except);\n      devices += n;\n      if (n === 0 && memberId !== message.senderId) this.deps.onOffline(memberId, message);\n    }\n    this.deps.metrics.deliveries_total += devices;\n  }\n\n  private onReceipt(conn: Connection, frame: Extract\u003cClientFrame, { type: 'receipt' }>): void {\n    if (!this.deps.store.isMember(frame.conversationId, conn.userId!)) {\n      return void this.deps.conns.send(conn, { type: 'error', code: 'NOT_A_MEMBER', message: 'not a member' });\n    }\n    if (frame.state !== 'delivered' && frame.state !== 'read') {\n      return void this.deps.conns.send(conn, { type: 'error', code: 'BAD_FRAME', message: 'state must be delivered|read' });\n    }\n    if (!this.deps.store.markReceipt(frame.conversationId, conn.userId!, frame.seq, frame.state)) return;  // purana receipt -> chup raho\n    const out: ServerFrame = {\n      type: 'receipt', conversationId: frame.conversationId,\n      seq: frame.seq, userId: conn.userId!, state: frame.state,\n    };\n    for (const memberId of this.deps.store.members(frame.conversationId)) {\n      if (memberId === conn.userId) continue;\n      this.deps.conns.deliver(memberId, out);\n    }\n  }\n\n  private onTyping(conn: Connection, frame: Extract\u003cClientFrame, { type: 'typing' }>): void {\n    if (!this.deps.store.isMember(frame.conversationId, conn.userId!)) return;   // chup-chaap drop\n    const key = `${frame.conversationId}:${conn.userId}`;\n    if (this.deps.now() - (this.typingSeen.get(key) ?? 0) \u003c TYPING_THROTTLE_MS) return;\n    this.typingSeen.set(key, this.deps.now());\n    const out: ServerFrame = { type: 'typing', conversationId: frame.conversationId, userId: conn.userId! };\n    for (const memberId of this.deps.store.members(frame.conversationId)) {\n      if (memberId === conn.userId) continue;\n      this.deps.conns.deliver(memberId, out);       // fire and forget, kabhi persist nahi\n    }\n  }\n\n  private onResume(conn: Connection, frame: Extract\u003cClientFrame, { type: 'resume' }>): void {\n    const map = frame.lastSeqByConversation ?? {};\n    for (const [convId, lastSeq] of Object.entries(map)) {\n      if (!this.deps.store.isMember(convId, conn.userId!)) {\n        this.deps.conns.send(conn, { type: 'error', code: 'NOT_A_MEMBER', message: `not a member of ${convId}` });\n        continue;\n      }\n      for (const message of this.deps.store.after(convId, Number(lastSeq))) {\n        if (!this.deps.conns.send(conn, { type: 'message', message })) break;   // socket bhar gaya -> ruk jao\n      }\n    }\n  }\n}\n```\n\n**Code Explanation:**\n\n- `constructor(private readonly deps: {...})` -- sab kuch **injected**: clock, token verify, session map, push hook. Isi wajah se ye class bina Redis, bina network, bina `sleep` ke test hoti hai.\n- `onConnection` sirf ek `Connection` object banata hai -- **auth se pehle registry mein kuch nahi jaata.** Production mein `ws` ka `'connection'` event yahan aata hai, aur JWT `wss://.../ws?token=` query ya pehle `auth` frame se aata hai.\n- `onClose` mein **do cleanup** hain: `conns.remove(conn)` (memory) aur `sessions.delete('conn:\u003cuserId>:\u003cdeviceId>')` (Redis registry). Doosra bhoolne par delivery worker us dead node par publish karta rahega aur messages chup-chaap gir jaayenge -- 90 s ke TTL tak. TTL isliye hai taaki node **crash** ho jaaye (jahan `onClose` chalta hi nahi) tab bhi entry khud saaf ho jaaye.\n- `JSON.parse` ke `catch` mein hum **connection band nahi karte**, sirf `error` frame bhejte hain. Ek buggy client version poore session ko na maare. (Agar bad frames ki rate bahut ho toh per-connection rate limit se close karo.)\n- `if (conn.authed) conn.lastSeenAt = now()` -- **koi bhi** frame liveness ka proof hai, sirf `ping` nahi. Isse active user ka socket heartbeat sweep se galti se nahi katega.\n- `if (!conn.authed && frame.type !== 'auth')` -> close code **`4001`**. 4000-4999 application-defined range hai; client isko dekh kar \"token refresh karo phir reconnect\" karta hai, jabki 1013 par \"wait karke reconnect\" karta hai. Alag codes = alag client behaviour.\n- `onAuth` mein `if (conn.authed) return` -- dobara auth se user switch nahi hona chahiye (session fixation jaisa hole).\n- **`onSend` ka order hi poora answer hai:** validate -> **authorize** -> persist -> **ack** -> fan-out. Ye 5 numbers comments mein likhe hue hain; interview mein inhe zor se bolo.\n  - Step 2 (`isMember`) skip karna is system ka **sabse bada security hole** hai -- koi bhi apne client se kisi bhi `conversationId` par message bhej dega.\n  - Step 4 ka ack **step 3 ke baad** hai. Pehle ack dete toh: user ko grey tick dikhta, phir DB write fail hota, aur message gayab. Durability requirement (\"accepted message kabhi na khoye\") ka concrete roop yahi ek line ka order hai.\n  - Step 5: duplicate par ack **phir bhi jaata hai** (client ko uska tick chahiye) par fan-out **nahi** jaata. Ye at-least-once + idempotency ka asli behaviour hai.\n- `fanOut` mein `const except = memberId === message.senderId ? senderConnId : undefined` -- sender ka phone ne bheja, sender ka **web** bhi woh message dekhega. Bina iske multi-device sync toota hai aur user ko web par apne bheje hue messages nahi dikhte.\n- `if (n === 0 && memberId !== message.senderId) onOffline(...)` -- **zero live devices = offline = push notification.** Sender khud ke liye push nahi. Production mein ye Kafka `chat-events` ka `push-notifier` consumer hai, inline call nahi -- taaki FCM slow ho toh send path slow na ho.\n- `onReceipt` mein `if (!markReceipt(...)) return` -- purana/duplicate receipt aaya toh **broadcast hi mat karo**. Receipts already 660 GB/day ka traffic hain; bekaar wale rok do.\n- `onTyping` -- non-member ko error bhi nahi dete, **chup-chaap drop**. Typing ephemeral hai, uska error dikhane ka koi matlab nahi. 3 s throttle server par bhi hai (client par bhi hona chahiye) -- ek tez typist warna 20 frames/sec bhej dega.\n- `onResume` -- har conversation ke liye **membership dobara check** hota hai. Client kuch bhi bhej sakta hai; `lastSeqByConversation` mein kisi aur ki conversation daal dena sabse aasan attack hai.\n- `if (!conns.send(...)) break` resume loop mein -- agar socket bhar gaya (backpressure) toh replay rok do. Client phir se reconnect + resume karega aur wahin se shuru karega jahan ruka tha. **Yahi backpressure aur resume protocol ka milna hai.**\n\n### Step 7 -- Code block 5: heartbeat, dead-connection sweep, backpressure drop\n\n```ts\nconst MAX_BUFFERED_BYTES = 1024 * 1024;   // 1 MB\nconst HEARTBEAT_MS = 30_000;\nconst HEARTBEAT_TIMEOUT_MS = 60_000;      // 2 missed beats\n\n// ---- class ConnectionManager (continued) ----\nsend(conn: Connection, frame: ServerFrame): boolean {\n  const sock = conn.socket;\n  if (sock.readyState !== OPEN) return false;                 // closing/closed socket par likhna crash hai\n  if (sock.bufferedAmount > MAX_BUFFERED_BYTES) {             // BACKPRESSURE\n    this.metrics.slow_client_drops_total++;\n    sock.close(1013, 'slow client');                          // 1013 = try again later\n    return false;                                             // close -> onClose -> remove()\n  }\n  try {\n    sock.send(JSON.stringify(frame));\n    return true;\n  } catch {\n    this.metrics.ws_write_error_total++;                      // socket mid-write mar gaya (EPIPE/ECONNRESET)\n    sock.close(1011, 'write failed');\n    return false;\n  }\n}\n\n// ---- class ChatServer (continued) ----\nheartbeat(): void {\n  for (const [, set] of [...this.deps.conns.entries()]) {\n    for (const conn of [...set]) {\n      const silentMs = this.deps.now() - conn.lastSeenAt;\n      if (silentMs > HEARTBEAT_TIMEOUT_MS) {                  // DEAD-CONNECTION SWEEP\n        this.deps.metrics.ws_heartbeat_timeout_total++;\n        conn.socket.close(1001, 'heartbeat timeout');         // -> onClose -> remove + session delete\n        continue;\n      }\n      // zinda hai: session registry ka TTL aage badhao (prod: EXPIRE conn:\u003cu>:\u003cd> 90)\n      this.deps.sessions.set(`conn:${conn.userId}:${conn.deviceId}`,\n        { nodeId: this.deps.nodeId, expiresAt: this.deps.now() + SESSION_TTL_MS });\n    }\n  }\n}\n// prod: setInterval(() => server.heartbeat(), HEARTBEAT_MS).unref();\n```\n\n**Code Explanation:**\n\n- `readyState !== OPEN` check sabse pehle -- `ws` par CLOSING/CLOSED socket ko `send()` karna error phenkta hai. Hum silently `false` return karte hain; caller (`deliver`) usko \"ye device nahi mila\" ki tarah ginta hai, aur zero devices = push notification. Correct behaviour.\n- `bufferedAmount > 1 MB` -- **backpressure**. `bufferedAmount` matlab \"kitna data application ne `send` kiya par abhi tak TCP par nikla nahi\". 2G par baitha ek user socket buffer bharta jaata hai. Agar hum likhte rahe toh **ek slow client gateway node ki poori memory kha jaata hai** -- production mein OOM ka sabse aam karan.\n- Fix seedha hai: **usko drop kar do** close code `1013` (try again later) ke saath. Woh reconnect karega, `resume` bhejega, aur sab miss hue messages `seq` se le lega. **Message kho nahi raha -- persist ho chuka hai.** Ye line interview mein bolo: \"drop karna safe isliye hai kyunki durability socket par nahi, store par tiki hai.\"\n- `try/catch` around `sock.send` -- socket **mid-write** mar sakta hai (`EPIPE`, `ECONNRESET`), aur `'close'` event abhi aaya nahi hota. Bina catch ke ye exception poore fan-out loop ko tod dega aur baaki members ko message nahi milega. Catch karke `close(1011)` -> `onClose` -> cleanup.\n- `heartbeat()` do kaam karta hai:\n  1. **Sweep**: 60 s se chup connection = dead (2 missed beats). Kyun zaruri hai? TCP connection **chup-chaap** mar sakta hai -- mobile network switch, NAT timeout, laptop sleep. OS ko pata hi nahi chalta, socket \"open\" dikhta rehta hai. Bina sweep ke ye **ghost connections** memory aur registry dono mein pade rehte hain aur unke messages gayab hote rehte hain.\n  2. **TTL refresh**: zinda connections ke liye `conn:\u003cuserId>:\u003cdeviceId>` ka TTL 90 s par reset. TTL (90 s) > timeout (60 s) jaan-boojh kar rakha hai taaki race na ho -- entry sweep se pehle expire na ho jaaye.\n- Close code `1001` (going away) heartbeat ke liye, `1013` slow client ke liye, `1011` server error ke liye, `4001` auth ke liye. Client inhe alag alag handle karta hai: `1013` par lamba backoff, `4001` par token refresh, baaki par normal **full jitter** backoff `random(0, min(30s, 2^attempt))`.\n- `.unref()` production mein -- ye timer process ko band hone se na roke (graceful shutdown).\n- Node crash hone par ye sweep chalta hi nahi -- **isliye Redis TTL hai.** Do layers: normal case mein sweep saaf karta hai, crash case mein TTL.\n\n### Step 8 -- Code block 6: `main()` -- poora scenario end to end\n\n```ts\nfunction main(): void {\n  const metrics = newMetrics();\n  const store = new MessageStore();\n  const sessions = new Map\u003cstring, { nodeId: string; expiresAt: number }>();\n  const conns = new ConnectionManager('gw-07', metrics);\n  const tokens: Record\u003cstring, string> = { 'tok-amit': 'user-amit', 'tok-bina': 'user-bina' };\n\n  const server = new ChatServer({\n    nodeId: 'gw-07', store, conns, sessions, now: clock, metrics,\n    verifyToken: (t) => tokens[t] ?? null,\n    onOffline: (userId, message) => {\n      metrics.offline_push_total++;\n      log('push-notifier', `${userId} ka koi device online nahi -> FCM/APNs push for seq=${message.seq}`);\n    },\n  });\n\n  store.createConversation('conv-1', 'direct', ['user-amit', 'user-bina']);\n  store.createConversation('conv-9', 'group', ['user-chetan', 'user-bina']);\n\n  // 1. dono connect + auth\n  const amit = new FakeClient('amit/phone', 'user-amit', 'dev-amit-phone', server).connect();\n  amit.frame({ type: 'auth', token: 'tok-amit', deviceId: 'dev-amit-phone' });\n  advance(400);\n  const bina = new FakeClient('bina/phone', 'user-bina', 'dev-bina-phone', server).connect();\n  bina.frame({ type: 'auth', token: 'tok-bina', deviceId: 'dev-bina-phone' });\n\n  // 2. amit typing -> send; bina ko message milta hai\n  advance(1200);\n  amit.frame({ type: 'typing', conversationId: 'conv-1' });\n  advance(800);\n  amit.frame({ type: 'send', messageId: 'm-11111111-aaaa', conversationId: 'conv-1', body: 'Kal milte hain 7 baje?' });\n\n  // 3. bina: delivered -> read;  amit: do grey tick -> blue tick\n  advance(120);\n  bina.frame({ type: 'receipt', conversationId: 'conv-1', seq: 1, state: 'delivered' });\n  advance(4000);\n  bina.frame({ type: 'receipt', conversationId: 'conv-1', seq: 1, state: 'read' });\n\n  // 4. bina disconnect; amit phir bhejta hai -> offline -> push\n  advance(1000);\n  bina.disconnect('app closed / network gaya');\n  advance(2000);\n  amit.frame({ type: 'send', messageId: 'm-22222222-bbbb', conversationId: 'conv-1', body: 'Bina? Reply kar do.' });\n\n  // 5. bina 45 s baad reconnect + resume -> missed message mil jaata hai\n  advance(45_000);\n  const bina2 = new FakeClient('bina/phone', 'user-bina', 'dev-bina-phone', server).connect();\n  bina2.frame({ type: 'auth', token: 'tok-bina', deviceId: 'dev-bina-phone' });\n  bina2.frame({ type: 'resume', lastSeqByConversation: { 'conv-1': 1 } });\n  advance(100);\n  bina2.frame({ type: 'receipt', conversationId: 'conv-1', seq: 2, state: 'delivered' });\n}\n```\n\n**Code Explanation:**\n\n- `newMetrics()` / `clock` / `advance()`
