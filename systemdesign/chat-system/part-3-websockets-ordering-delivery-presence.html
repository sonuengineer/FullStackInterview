### 15.8 -- Typing indicator: woh feature jo "kuch bhi guarantee nahi" deti

Spec saaf hai: **kabhi persist nahi, 3 s client-side throttle, sirf us conversation ke currently-connected members ko, kabhi retry nahi.**

Pehle load samjho:

```
70,000 messages/sec peak
Har message se pehle user ~3-8 second type karta hai
3 s throttle par  ->  ~2 typing frames per message

  70,000 x 2  =  ~140,000 typing frames/sec

Agar ye Kafka se jaate:  140,000 events/sec on chat-events (jo abhi 70,000/sec hai)
                         = topic ka load TEEN GUNA, aisi cheez ke liye jo 5 second mein
                           bekaar ho jaati hai aur jisko koi store bhi nahi karna chahta.
```

Isliye typing ka raasta **bilkul alag** hai: gateway -> Redis -> gateway. **Kafka ko chhuata hi nahi, DB ko chhuata hi nahi, delivery workers ko chhuata hi nahi.**

```
Normal message:  client -> gateway -> Chat Service -> Redis INCR -> Postgres -> Kafka -> Delivery Worker -> Redis PUBLISH -> gateway -> client
Typing:          client -> gateway -> Redis (HSET + EXPIRE, + MGET conn:) -> Redis PUBLISH -> gateway -> client
```

```ts
// services/typing.service.ts
const THROTTLE_MS = 3_000;
const TYPING_TTL_SECONDS = 5;

export async function handle(f: TypingFrame, ctx: SocketCtx) {
  const k = `${ctx.userId}:${f.conversationId}`;
  const now = Date.now();
  if (now - (ctx.lastTypingAt.get(k) ?? 0) < THROTTLE_MS) return;    // (1) server-side throttle bhi
  ctx.lastTypingAt.set(k, now);

  if (!(await membership.isMember(f.conversationId, ctx.userId))) return;   // (2)

  const key = `typing:${f.conversationId}`;
  const pipe = redisState.pipeline();
  pipe.hset(key, ctx.userId, String(now));                           // (3)
  pipe.expire(key, TYPING_TTL_SECONDS);                              // (4)
  pipe.exec().catch(() => {});                                       // (5) FIRE AND FORGET

  const memberIds = await membership.memberIds(f.conversationId);
  const targets = (await deviceRepo.forUsers(memberIds))
    .filter(t => t.userId !== ctx.userId);                           // (6)
  const nodeIds = await redisState.mget(...targets.map(t => `conn:{${t.userId}}:${t.deviceId}`));

  const payload = JSON.stringify({ type: 'typing', conversationId: f.conversationId, userId: ctx.userId });
  const byNode = new Map<string, string[]>();
  targets.forEach((t, i) => {
    if (!nodeIds[i]) return;                                         // (7) offline -> SKIP, koi push nahi
    byNode.set(nodeIds[i], [...(byNode.get(nodeIds[i]) ?? []), t.deviceId]);
  });

  const pub = pubsubFor(byNode).pipeline();
  for (const [nodeId, deviceIds] of byNode) pub.publish(`gw:${nodeId}`, JSON.stringify({ deviceIds, payload }));
  pub.exec().catch(() => {});                                        // (8) phir se fire and forget
}
```

**Code Explanation:**

- **(1) Server-side throttle bhi** -- client par 3 s ka throttle hai (spec), par **client par bharosa nahi karte.** Ek purana ya modified client har keystroke par typing frame bhej sakta hai. Ye in-memory check socket ke context par hai, toh iski cost ~0 hai.
- **(2) Membership check** -- typing bhi ek information leak ho sakti hai: non-member ko pata chal jaayega ki group mein activity hai. Ye check Redis cache se aata hai (spec: membership cache TTL 300 s).
- **(3) `HSET typing:<cid> <userId> <timestamp>`** -- hash isliye ki ek group mein **kai log ek saath** type kar sakte hain ("Alice aur 2 others are typing"). Field = userId.
- **(4) `EXPIRE key 5`** -- **yahan ek gotcha hai jo samjhna zaroori hai:** Redis mein TTL **poori key par** lagta hai, **field par nahi.** Toh agar Alice 10:00:00 par type kare aur Bob 10:00:04 par, toh Bob ka `EXPIRE` poori key ko 10:00:09 tak zinda kar dega -- **Alice ka field bhi**, jabki Alice 4 second se chup hai. Isiliye hum value mein **timestamp** rakhte hain aur padhte waqt filter karte hain: `Object.entries(h).filter(([,ts]) => now - Number(ts) < 5000)`. Alternative tha `typing:<cid>:<userId>` (per-user key, apna TTL) -- par spec ka naam `typing:<conversationId>` hai, aur ek `HGETALL` se poori conversation ka jawab mil jaata hai (N keys ke `MGET` ki jagah).
- **(5) aur (8) `.catch(() => {})` bina `await`** -- **ye jaan-boojh kar hai, laaparwahi nahi.** Typing kabhi retry nahi hoti, kabhi error user tak nahi jaati, aur kabhi `send` ke path ko block nahi karti. Redis down hai? Typing indicator band, baaki sab chalta rahega. Agar yahan `await` hota toh ek slow Redis typing frames ke through poore gateway ka event loop bhar deta.
- **(6) `t.userId !== ctx.userId`** -- apne hi "typing" ko apne doosre devices par bhejne ka koi matlab nahi (message echo ke ulta, jahan bhejna zaroori tha).
- **(7) `if (!nodeIds[i]) return`** -- offline device ke liye **kuch nahi.** Koi push notification nahi, koi store nahi, koi "jab wapas aaye toh batana" nahi. "Priya typing hai" ka notification 10 minute baad bhejna bewakoofi hai.
- **Metrics mein bhi ye alag hai:** typing failures ko error rate mein count **mat** karo, warna aapka SLO dashboard ek aisi feature ki wajah se red hoga jiski koi guarantee hi nahi hai.

Client side:

```ts
let lastSent = 0;
input.addEventListener('input', () => {
  const now = Date.now();
  if (now - lastSent < 3_000) return;                 // spec ka 3 s throttle
  lastSent = now;
  ws.send(JSON.stringify({ type: 'typing', conversationId: openConversationId }));
});

// doosri taraf: dikhana
function onTyping(f: { conversationId: string; userId: string }) {
  if (f.conversationId !== openConversationId) return;   // band chat ka typing ignore
  showTyping(f.userId);
  clearTimeout(typingTimers.get(f.userId));
  typingTimers.set(f.userId, setTimeout(() => hideTyping(f.userId), 5_000));   // TTL se match
}
```

**Code Explanation:**

- `now - lastSent < 3_000` -- har keystroke par frame nahi. Ek 40-word message mein ~200 keystrokes hote hain; throttle ke bina woh 200 frames hota, 2 nahi. **100x ka farak**, ek `if` se.
- `f.conversationId !== openConversationId` -- client bhi band chat ke typing ko ignore karta hai. (Server waise bhi sirf connected members ko bhejta hai, par client par ye deewar sasti hai.)
- `setTimeout(..., 5_000)` -- **client ka hide timer server ke Redis TTL se match karta hai.** Ye sanyog nahi, ye design hai: dono taraf ek hi 5 s ka concept. Agar client 10 s rakhta toh user ko 5 extra second tak jhootha "typing..." dikhta.
- Koi retry nahi, koi ack nahi, koi queue nahi. **Typing indicator ko bhoolna uski feature hai, bug nahi.**

> **Interview line (Redis state ko ek saath):** "Chat mein Redis ek cheez nahi, teen alag deployments hain. State cluster (16 shards, `noeviction`, AOF everysec) mein `conn:`, `seq:`, `presence:`, `unread:` -- yahan `allkeys-lru` ek silent killer hai kyunki `seq:` evict hone ka matlab seq reuse aur Cassandra par purane message ka overwrite hai. 8 standalone instances sirf `gw:<nodeId>` Pub/Sub ke liye, kyunki Cluster mein plain PUBLISH poore bus par broadcast hota hai aur in instances mein koi key hi nahi hoti. Aur ek chhota cache cluster `allkeys-lru` par membership ke liye. Memory ~80 GB, jisme 52 GB sirf `seq:` counters hain -- unka 7-din TTL main jaan-boojh kar chhota nahi karta, kyunki rebuild path hi mera sabse khatarnak code path hai aur usko kam chalana memory se zyada keemti hai."

---

## Remember

> **Chat ki har race ka jawab ek hi hai: push ko reliable mat banao, store ko reliable banao aur client ko resumable.** `INCR` order decide karta hai, `messageId` duplicate pakadta hai, `GREATEST` watermark ko peeche nahi jaane deta, aur Redis mein **gap free hai par seq ka reuse fatal** -- isliye state wala Redis `noeviction` par chalta hai aur presence, jo messaging se 5x mehngi hai, push nahi hoti -- woh TTL expire hone se "offline" ho jaati hai.

## Quick Self-Test

1. Do messages ek hi conversation mein ek hi millisecond par aaye. `SELECT MAX(seq)+1` kya karega, aur `INCR seq:<conversationId>` kya -- aur Cassandra par dono ka natija kaise alag hai?
2. Priya ke teen devices hain aur woh phone se message bhejti hai. Fan-out mein aap `t.userId === senderId` par skip karte ho ya `t.deviceId === originDeviceId` par? Galat wala chunne par exactly kya toot-ta hai?
3. Delivery worker ne `conn:bob:ph-1 = "N87"` padha, usi pal N87 ne woh key delete kar di aur socket band kar diya. Message kahan gaya, aur Bob ko woh kab aur kaise milega? Is race ko lock se rokna kyun galat hai?
4. 10M users x 200 contacts wala presence fan-out per second kitna traffic banata hai, aur woh hamari 460,000 deliveries/sec se kitna bada hai? Usko ~200x kam karne ke liye aap kaun si 4 cheezein karte ho?
5. State wale Redis par `allkeys-lru` lagane se kaun se do silent bugs aa sakte hain (ek latency ka, ek data corruption ka)? `noeviction` un dono ko kaise behtar banata hai, aur uski shart kya hai?
