par throw karta hai.\n- `webhookRejected.inc(...)` -- ye metric **security signal** hai. Achanak bad signatures badhe = koi try kar raha hai.\n\n**Replay protection:** Twilio ke signature mein timestamp nahi hota, yaani ek **valid** signed request ko attacker (agar usne kabhi capture kiya) dobara bhej sakta hai. Do layer:\n\n1. **Idempotency by provider message id:** `MessageSid` / `CallSid` ko ek `webhook_events(provider, provider_message_id)` table mein unique index ke saath insert karo. Duplicate = `200 OK` aur **kuch mat karo**. Ye replay ko no-op bana deta hai.\n2. **Timestamp window** un providers ke liye jo timestamp dete hain (Stripe-style `t=\u003cepoch>,v1=\u003csig>`): `Math.abs(now - t) > 300` -> reject. Signature mein timestamp shamil hota hai, isliye attacker use badal nahi sakta.\n3. Aur sabse zaruri: **inbound \"4\" ko authorization ki tarah treat karo.** `From` number se user resolve karo, phir check karo ki **us user ke paas us incident ko ack karne ka haq hai** (woh us account ka member hai aur us incident par notify hua tha). Sirf \"SMS aaya\" kaafi nahi -- caller ID spoofing SMS/voice par asli cheez hai.\n\n### 6. Abuse -- kabhi tumhara paging system hi spam ka hathiyaar ban jaaye\n\n**Attack:** koi tumhare product mein sign up karta hai, 50 \"users\" banata hai jinke phone numbers premium-rate ya international numbers hain, aur ek script se incidents trigger karta rehta hai. Tum voice calls karte ho, **attacker un premium numbers se revenue share kamata hai**, aur bill tumhara. Isko **toll fraud / IRSF** kehte hain aur ye har communications platform ke saath hota hai.\n\n| Defence | Detail |\n|---|---|\n| **Verified contact methods only** | `contact_methods.verified` (spec mein already hai). Number add karo -> OTP -> tab hi notifications jaati hain. Unverified number par **kabhi** SMS/voice nahi |\n| **Per-account daily send caps** | Plan ke hisaab se: free 100 SMS/day, pro 5,000, enterprise custom. Cap hit -> email par switch + account admin ko alert. **Hard cap hona chahiye**, sirf alert nahi |\n| **Country allowlist** | Account ka default: sirf un countries mein jahan uske users hain. Naya country enable karna ek explicit action ho. IRSF hamesha exotic country codes se hota hai |\n| **Voice ko sakht rakho** | Voice sirf `critical`/`error` par, sirf verified numbers par, aur sirf level 2+ par |\n| **Signup friction** | Trial accounts par voice bilkul band, SMS 20/day. Card verify hone ke baad hi khulta hai |\n| **Anomaly alert** | Kisi account ka SMS spend 24 h mein 10x jump -> automatic throttle + human review |\n\n**Ye ek availability defence bhi hai, sirf cost nahi:** ek attacker ka $50K bill tumhare Twilio account ko suspend kara sakta hai -- aur tab **saare** customers ke pages band ho jaayenge.\n\n### 7. SSRF -- customer ke diye hue webhook URLs\n\nCustomer apni \"custom webhook\" notification method deta hai: \"incident par `POST https://hooks.mycorp.com/pd` karo.\" Attacker uski jagah deta hai:\n\n```\nhttp://169.254.169.254/latest/meta-data/iam/security-credentials/   \u003c- AWS metadata = tumhare IAM creds\nhttp://10.0.0.5:5432/                                              \u003c- tumhara internal Postgres\nhttp://localhost:9090/api/v1/admin/...                             \u003c- tumhara Prometheus\n```\n\n**Defences (sab ek saath lagti hain, koi ek kaafi nahi):**\n\n```ts\n// src/utils/safe-fetch.ts\nimport dns from 'node:dns/promises';\nimport ipaddr from 'ipaddr.js';\n\nconst BLOCKED = ['private', 'loopback', 'linkLocal', 'uniqueLocal', 'reserved', 'carrierGradeNat'];\n\nexport async function resolveSafe(rawUrl: string): Promise\u003c{ url: URL; ip: string }> {\n  const url = new URL(rawUrl);\n  if (url.protocol !== 'https:') throw new Error('SSRF_ONLY_HTTPS');\n  if (url.port && url.port !== '443') throw new Error('SSRF_BAD_PORT');\n\n  const { address } = await dns.lookup(url.hostname);          // ek hi baar resolve\n  const range = ipaddr.parse(address).range();\n  if (BLOCKED.includes(range)) throw new Error(`SSRF_BLOCKED_RANGE:${range}`);\n\n  return { url, ip: address };                                 // IP ko PIN karke usi par connect karo\n}\n```\n\n**Code Explanation:**\n\n- `protocol !== 'https:'` -- `http:`, `file:`, `gopher:`, `ftp:` sab band. `file:///etc/passwd` ek classic SSRF payload hai.\n- `url.port !== '443'` -- port scanning rok do. Attacker `https://internal-host:6379` se Redis tak pahunchne ki koshish karega.\n- `dns.lookup(...)` phir `ipaddr.parse(address).range()` -- hostname ko **IP tak resolve karke** check karo, sirf string dekh kar nahi. `evil.com` ka A record `10.0.0.5` ho sakta hai.\n- `BLOCKED` mein `linkLocal` -- yahi `169.254.169.254` (cloud metadata) ko rokta hai. `uniqueLocal` IPv6 ka private range hai. **Dono IP families check karni padti hain**, warna attacker IPv6 se ghus jaayega.\n- `return { url, ip }` -- **IP pin karke wapas do.** Phir HTTP client ko usi IP par connect karao (`lookup` option override karke) aur `Host` header original hostname rakho. Warna **DNS rebinding**: attacker ka DNS pehli baar public IP deta hai (check pass), doosri baar (jab actual connect hota hai) `10.0.0.5`. Check aur connect ke beech ka ye gap TOCTOU bug hai.\n\nAur teen rules jo code se bahar hain:\n\n- **Redirects follow mat karo** (`maxRedirects: 0`), ya har hop par `resolveSafe` dobara chalao. Ek `302` sara check bypass kar deta hai.\n- **Dedicated egress proxy / NAT** jiska network policy sirf public internet tak jaane deta hai. Ye sabse mazboot layer hai: agar app bug bhi ho, network use bahar hi nahi jaane dega.\n- **Response body customer ko wapas mat dikhao** (sirf status code). Warna webhook ek internal port scanner ban jaata hai.\n- Timeout (5 s) + response size cap (64 KB) -- warna ek slow endpoint tumhare worker pool ko bandhak bana lega.\n\n### 8. Rate limiting -- Rate Limiter lesson ka direct reuse\n\n| Kahan | Key | Kya bachaata hai |\n|---|---|---|\n| Ingest per service | `rl:events:\u003croutingKey>` (token bucket) | Alert storm ek customer tak simit |\n| Per provider | `rl:prov:twilio-sms` | Provider 429 aur circuit breaker se bachna |\n| Per user notifications | notification rules + quiet hours | **Quiet hours bhi ek rate limit hai** -- \"raat 11 se subah 7, low urgency = 0/hour\" |\n| Dashboard API | per user + per account | Scraping aur accidental retry loops |\n| Webhook endpoints | per source IP + per provider | Fake webhook flood |\n| Ack endpoints | per incident | Ek ack button ko 50 baar dabane se DB par load na aaye |\n\n> Interview line: \"Security mein main teen cheezein sabse pehle bolunga. Ek, routing key ek secret hai aur uska scope ek service tak limited hai aur woh write-only hai, taaki leak ka blast radius chhota rahe; rotation ke liye do active keys support karta hoon. Do, tenant isolation ko main yaad rakhne par nahi chhodta -- AsyncLocalStorage se tenant context aur Postgres RLS dono lagate hain, taaki ek bhooli hui `WHERE account_id` company ko na le dube. Teen, provider webhooks ko HMAC se verify karta hoon timing-safe compare ke saath aur provider message id se replay rokta hoon -- kyunki ek fake 'acknowledged' webhook ka matlab hai ki ek asli outage chup-chaap dab gaya.\"\n\n---\n\n## PART 20 -- Observability\n\n### 1. Ek hi SLI jo sab kuch batata hai\n\nEk paging platform ke paas dozens metrics ho sakti hain, par customer sirf **ek** cheez kharid raha hai:\n\n> **`page_latency_seconds`** = event accept hone se lekar **pehle notification ke provider ko handover** hone tak ka time. Target: **p95 \u003c 5 s, p99 \u003c 10 s** (spec).\n\nIse **North Star SLI** kehte hain. Baaki har metric (consumer lag, DB latency, timer lag) sirf **iski** explanation hai. Jab ye theek hai, system theek hai. Jab ye toota hai, baaki metrics batate hain kahan toota.\n\n**Handover tak hi kyun naapte hain, phone tak kyun nahi?**\n\nKyunki Twilio ke baad carrier network hai aur uspar hamara zero control hai. Jis cheez ko tum control nahi kar sakte, uspar SLO mat rakho -- warna tumhara error budget kisi aur ki galti se khatam hoga. **Lekin** delivery receipts (`delivered_at`, provider status webhook se) ko ek **alag, informational** metric ke roop mein zaroor track karo: `delivery_confirmation_seconds{channel,provider}`. Woh provider choose karne aur unse baat karne ke kaam aata hai, SLO ke liye nahi.\n\n### 2. End-to-end kaise measure karein -- trace id\n\nLatency ko 6 hops ke paar naapne ke liye ek hi cheez chahiye: **ek id jo poore raste saath chale.**\n\n```\nIngest API\n  traceparent bana (W3C), event.acceptedAt = now, event.eventId = uuid\n      |\n      |  Kafka message headers: { traceparent, acceptedAt, eventId }\n      v\nIncident consumer\n  header se span continue kiya; incident banaya\n      |\n      |  NotificationTask mein acceptedAt + traceparent forward kiye\n      v\nNotification worker\n  provider ko handover -- YAHAN metric observe hoti hai\n      |\n      |  StatusCallback URL mein ?tid=\u003ctraceId> jodo\n      v\nProvider status webhook\n  tid se wapas usi trace se jud jaata hai\n```\n\n```ts\n// src/workers/notification.worker.ts -- handover ke theek baad\nconst result = await sendWithCap(provider, task, address, incident);\nawait notificationRepo.markSent(task.taskId, result.providerMessageId, provider.name);\n\n// SLI sirf PEHLE page par -- escalations alag metric hain\nif (task.escalationLevel === 1 && task.attempt === 1) {\n  const seconds = (Date.now() - Date.parse(task.acceptedAt)) / 1000;\n  if (seconds \u003c 0) {\n    clockSkewDetected.inc();                       // negative = clock skew, data mat ganda karo\n  } else {\n    pageLatency.observe({ channel: task.channel, synthetic: String(task.synthetic ?? false) }, seconds);\n  }\n}\n```\n\n**Code Explanation:**\n\n- `task.acceptedAt` -- ye timestamp **ingest API** ne lagaya tha aur Kafka -> incident service -> notification task ke saath chal kar aaya. Isliye hum poora end-to-end naap rahe hain, sirf worker ka hissa nahi. **Timestamp ko payload mein carry karna hi end-to-end measurement ka poora raaz hai.**\n- `escalationLevel === 1 && attempt === 1` -- SLI ka matlab hai \"pehla page kitni jaldi gaya\". Escalations (jo jaan-boojh kar 5 min baad hoti hain) aur retries ise ganda kar dete. Unke apne metrics hain.\n- `seconds \u003c 0` -> `clockSkewDetected` -- PART 17 #13. Negative latency ek **bug ka saaf proof** hai; use 0 mein badal kar chhupao mat.\n- `synthetic` label -- watchdog ke synthetic incidents alag dikhte hain. Do views: `synthetic=\"false\"` (asli customer SLO) aur `synthetic=\"true\"` (pipeline health).\n- `channel` label -- push ka p95 ~1 s hoga, voice ka ~4 s. Aggregate p95 dekhne se dono ki kahani mix ho jaati hai.\n\n### 3. Metrics -- spec ki poori list, matlab ke saath\n\n| Metric | Type | Kya batata hai | Alert |\n|---|---|---|---|\n| `page_latency_seconds{channel,synthetic}` | Histogram | **North Star SLI.** Event -> pehla provider handover | p95 > 5 s (5 min) -> **Page** |\n| `events_ingested_total{action}` | Counter | Ingest volume; `action` se trigger/ack/resolve ka mix | 10 min tak 0 (daytime) -> **Page** (chup failure!) |\n| `incidents_created_total{severity}` | Counter | Asli incident rate; storm ka pehla signal | 10x baseline -> Warn |\n| `dedup_hits_total` | Counter | Dedup ratio. `dedup_hits / events` ~0.95 hona chahiye | \u003c 0.80 -> Warn (dedup toot raha hai = duplicate pages) |\n| `notification_send_duration_seconds{channel,provider}` | Histogram | Provider kitna slow hai | p95 > 3 s per provider -> Warn |\n| `notification_attempts_total{channel,provider,result}` | Counter | Failure rate per provider | failure ratio > 10% (5 min) -> **Page** |\n| `escalations_fired_total{level}` | Counter | Level 2/3 ka ratio = product health. Zyada = log ack nahi kar rahe | level2/level1 > 0.4 -> Warn (business) |\n| `timer_lag_seconds` | Histogram | `dueAt` vs actual fire. Scheduler health ka dil | p99 > 10 s (spec) -> **Page** |\n| `dlq_depth` | Gauge | DLQ mein pade messages = **pages jo kabhi nahi gaye** | > 0 -> **Page** |\n| `circuit_breaker_state{provider}` | Gauge (0/1/2) | closed / half-open / open | == 2 for 2 min -> **Page** |\n| `kafka_consumer_lag{topic,group}` | Gauge | Consumers peeche hain = pages late | `incident-events` lag > 10,000 -> **Page** |\n| `scheduler_heartbeat_timestamp_seconds` | Gauge | Scheduler zinda hai? (PART 17 #14) | `time() - value > 120` -> **Page** |\n| `timers_restored_total` | Counter | Recovery job ne timers wapas laaye = Redis ne khoye the | > 0 -> **Page** |\n| `ingest_spooled_total` | Counter | Kafka down, local disk par likh rahe hain | > 0 -> **Page** |\n| `provider_webhook_rejected_total{provider,reason}` | Counter | Security signal | `bad_signature` spike -> Warn (security) |\n| `escalations_exhausted_total{accountId=...}` | Counter | Kisi ne ack hi nahi kiya | Daily report, business signal |\n\n> **Cardinality ka rule (Rate Limiter Part 4 se):** metric labels mein **kabhi** `incidentId`, `userId`, `routingKey` ya phone number mat daalo. 2.5M incidents/day x labels = Prometheus mar jaayega. `accountId` bhi 20,000 values hai -- sirf low-volume counters par (jaise `escalations_exhausted_total`), high-volume par nahi. Per-account detail **logs** se ya ek alag analytics store (ClickHouse) se nikalo.\n\n### 4. PromQL -- woh queries jo on-call sach mein chalata hai\n\n```promql\n# 1. North Star: page latency p95 (asli customers, synthetic chhod kar)\nhistogram_quantile(0.95,\n  sum by (le) (rate(page_latency_seconds_bucket{synthetic=\"false\"}[5m])))\n\n# 2. Per channel p95 -- kaun slow kar raha hai\nhistogram_quantile(0.95,\n  sum by (le, channel) (rate(page_latency_seconds_bucket{synthetic=\"false\"}[5m])))\n\n# 3. Timer lag p99 -- scheduler ki sehat (spec ka alert: > 10 s)\nhistogram_quantile(0.99, sum by (le) (rate(timer_lag_seconds_bucket[5m]))) > 10\n\n# 4. DLQ depth -- har message ek page hai jo kabhi nahi gaya\nmax(dlq_depth) > 0\n\n# 5. Consumer lag -- ingest se kitne peeche hain\nmax by (topic, group) (kafka_consumer_lag{topic=\"incident-events\", group=\"incident-service\"}) > 10000\n\n# 6. Notification failure rate per provider\nsum by (provider) (rate(notification_attempts_total{result=\"failed\"}[5m]))\n  / sum by (provider) (rate(notification_attempts_total[5m])) > 0.10\n\n# 7. Circuit breaker open (2 = open)\nmax by (provider) (circuit_breaker_state) == 2\n\n# 8. Dedup ratio gir raha hai = duplicate incidents ban rahe hain\n1 - (rate(dedup_hits_total[10m]) / rate(events_ingested_total{action=\"trigger\"}[10m])) > 0.20\n\n# 9. Scheduler dead man's switch -- \"kuch hua hi nahi\" wala alert\ntime() - scheduler_heartbeat_timestamp_seconds > 120\n\n# 10. Ingest chup ho gaya (traffic kabhi 0 nahi hona chahiye)\nsum(rate(events_ingested_total[10m])) == 0\n\n# 11. Error budget burn (99.99% availability -> 0.01% budget)\n(1 - (sum(rate(events_ingested_total[1h])) - sum(rate(ingest_rejected_total[1h])))\n     / sum(rate(events_ingested_total[1h]))) > 0.0001 * 14.4\n```\n\n- Query **9 aur 10** sabse special hain: ye **absence** par bajte hain, presence par nahi. Ek paging system mein \"kuch bura hua\" alerts se zyada zaruri hai \"kuch hona chahiye tha par hua nahi\" alerts.\n- Query **11** ka `14.4` **burn rate** hai: 1 ghante mein itna budget jalna matlab poore month ka budget 2 din mein khatam. Ye Google SRE book ka multi-window burn-rate alerting hai -- threshold alerts se kam shor karta hai.\n\n### 5. Structured logging -- fields, sampling, aur kya NAHI log karna\n\n```json\n{\"level\":\"info\",\"msg\":\"notification_sent\",\"traceId\":\"4bf92f3577b34da6\",\"incidentId\":\"inc_91f2\",\n \"serviceId\":\"svc_77a\",\"accountId\":\"acc_12\",\"userId\":\"usr_5c1\",\"channel\":\"sms\",\n \"provider\":\"twilio-sms\",\"escalationLevel\":1,\"attempt\":1,\"taskId\":\"tsk_88b\",\n \"providerMessageId\":\"SM7f3a\",\"latencyMs\":312,\"phoneMasked\":\"+91XXXXXX1234\",\"severity\":\"critical\"}\n```\n\n**Har log line mein ye hone chahiye:** `traceId` (trace se jodne ke liye), `incidentId` (sabse common search), `accountId` (tenant filter -- support ke liye), aur event ka naam (`msg`) jo **machine-searchable** ho (`notification_sent`, `notification_failed`, `escalation_fired` -- free text nahi).\n\n**Sampling -- 50M events/day par ye compulsory hai:**\n\n| Event | Volume/day | Log rate | Kyun |\n|---|---|---|---|\n| Dedup hit (`event_deduped`) | ~47.5M | **0.1% sample** | 95% traffic; count metric mein exact hai, log mein sirf shape chahiye |\n| Incident created | 2.5M | **100%** | Har incident ek audit trail deserve karta hai |\n| Notification sent | 7.5M | **100%** | \"SMS aaya ya nahi\" support ka #1 sawaal hai |\n| Notification failed | ~0.2M | **100%** + stack | Failure kabhi sample mat karo |\n| Escalation fired | ~1M | **100%** | Sabse zyada legal/postmortem value |\n| Ack / resolve | ~5M | **100%** | Audit |\n| Debug traces | huge | **0%**, sirf on-demand per-account flag | Runtime par ek account ke liye debug on kar sako |\n\nDo rules jo sampling ko smart banate hain:\n\n1. **Trace-level sampling, line-level nahi.** Agar ek trace mein **kahin bhi** error hua, toh us trace ki **saari** lines rakho (head-based sampling + tail-based override). Adhoora trace debug ke kaam nahi aata.\n2. **`severity: critical` wale incidents kabhi sample mat karo.** Volume ka 10% hai, value ka 90%.\n\n**Kya NAHI log karna (ye list literally code review checklist hai):**\n\n| Kabhi nahi | Iski jagah |\n|---|---|\n| Phone number, email address | `phoneMasked: \"+91XXXXXX1234\"`, `contactMethodId` |\n| `routingKey` | `serviceId` + `keyFingerprint: sha256(key).slice(0,12)` |\n| Device push token | `contactMethodId` |\n| `payload.customDetails` (poora body) | `payloadBytes: 4213`, `payloadHash: \"9f2c...\"`, aur `summary` sirf 120 chars tak truncated |\n| `Authorization` header, cookies | Kuch nahi (`pino` `redact`) |\n| SMS ka poora text | `templateId` + `channel` |\n\n`customDetails` par zor kyun? Kyunki usme customer ka **kuch bhi** ho sakta hai -- stack trace jisme DB connection string hai, ek user ka email, ek API token. **Woh customer ka data hai, tumhare logs mein uski jagah nahi hai.** Ek baar logs mein aa gaya toh woh tumhare log retention, tumhare SIEM, tumhare backups -- sab jagah phail jaata hai.\n\n### 6. Dashboards\n\n**(a) Customer-facing status page** (alag infra par -- S3 + CloudFront, hamare Kafka/PG se zero dependency):\n\n```\n+---------------------------------------------------------------+\n|  Paging Platform Status                    All systems normal |\n+---------------------------------------------------------------+\n|  Event ingest (/v2/enqueue) ........ Operational   99.99% 30d  |\n|  Incident processing ............... Operational   p95  1.2 s  |\n|  Push notifications ................ Operational   p95  0.9 s  |\n|  SMS notifications ................. DEGRADED      p95  6.4 s  |\n|       \"Twilio is experiencing elevated latency in EU.          |\n|        We have failed over to MessageBird for EU numbers.\"     |\n|  Voice calls ....................... Operational   p95  3.8 s  |\n|  Web dashboard ..................... Operational                |\n+---------------------------------------------------------------+\n|  Past incidents (90 days)  |  Subscribe to updates (email/RSS) |\n+---------------------------------------------------------------+\n```\n\n- Sirf woh dikhao jo customer ke liye matlab rakhta hai -- CPU aur Kafka lag nahi.\n- **Degraded state ka matlab hona chahiye**: \"SMS late hai, push theek hai\" -- customer ko pata chale ki uska kya karna hai.\n- **Status page automatic ho**, manual nahi. Jab tumhari SLI alert baje toh status page apne aap degraded ho. Warna outage ke waqt kisi ke paas update karne ka time nahi hota.\n\n**(b) Internal Grafana -- 4 rows, upar se neeche**\n\n```\nROW 1 -- SLO (sirf 4 tiles, bade)\n  [page_latency p95] [page_latency p99] [error budget burn 1h/6h] [synthetic pipeline OK?]\n\nROW 2 -- PIPELINE (bottleneck kahan hai)\n  [events/sec in] [consumer lag: incident-events] [incidents/sec created] [dedup ratio]\n  [notifications/sec] [consumer lag: notifications] [timer_lag p99] [dlq_depth]\n\nROW 3 -- PROVIDERS (paisa aur third parties)\n  [attempts/sec per provider] [failure % per provider] [send duration p95 per provider]\n  [circuit_breaker_state heatmap] [SMS+voice spend today vs budget]\n\nROW 4 -- INFRA (sirf tab dekho jab upar kuch laal ho)\n  [PG write latency, replication lag] [Redis CPU/memory per shard]\n  [Kafka under-replicated partitions] [Node event loop lag, heap]\n```\n\n- Layout ka rule: **upar se neeche jaate hue \"customer ka dard\" se \"hamari machine ka dard\"**. 3 baje raat ko on-call ROW 1 dekhta hai (\"kitna bura hai?\"), phir ROW 2 (\"kahan atka hai?\"), phir ROW 3/4 (\"kyun?\").\n- Har panel ke neeche **ek line ka runbook link**. Alert mein bhi runbook URL ho. \"Kya karun?\" ka jawab dashboard par hi hona chahiye.\n\n### 7. The watchdog paradox -- \"paging system down ho toh tumhe page kaise mile?\"\n\nYe is poore lesson ka sabse acchha interview sawaal hai, aur jawab humility se shuru hota hai:\n\n> **Tum apne aap ko apne hi system se page nahi kar sakte.** Har monitoring system ki ek aakhri hadd hoti hai: woh apni maut ki khabar khud nahi de sakta.\n\nToh hum **independence ki seedhi** banate hain -- har paayidan pichhle se kam shared infrastructure par:\n\n| Layer | Kya | Kis par chalta hai | Kya pakadta hai | Kab fail hota hai |\n|---|---|---|---|---|\n| 0 | App metrics + apne alerts | Hamara stack | 90% problems | Hamara stack down |\n| 1 | Alert manager -> **ek doosra** paging vendor (haan, competitor!) | Alag SaaS | Hamara paging path down | Hamara Prometheus down |\n| 2 | **Dead man's switch** -- components har 60 s ek third-party healthcheck ko ping karte hain | Healthchecks.io / Cronitor | Component chup-chaap mar gaya (`scheduler`, consumers) | Ping karne wala code hi na chale (Layer 3 pakadta hai) |\n| 3 | **Synthetic incident** har 5 min: robot event bhejta hai, ek dedicated test number/inbox par page aane ka intezaar karta hai | Alag region / alag cloud account | **Poora pipeline** end-to-end -- ingest, Kafka, DB, routing, provider | Synthetic runner khud mar jaaye -> woh bhi Layer 2 ko ping karta hai |\n| 4 | Insaan: rotating \"platform on-call\" ka phone number jo customers ko diya gaya hai, aur ek Slack Connect channel | Kuch bhi nahi | Sab kuch fail | Kabhi nahi -- ye aakhri safety net hai |\n\n**Teen non-negotiable niyam:**\n\n1. **Watchdog ko wahan mat chalao jahan product chalta hai.** Alag cloud account, alag region, ideally alag vendor. Ek shared IAM policy, ek shared VPC, ek shared Terraform apply -- aur dono ek saath marte hain.\n2. **Watchdog ka alert path alag hona chahiye.** Alag SMS provider, alag email domain, alag Slack workspace. Agar Twilio down hai toh Twilio se \"Twilio down hai\" ka SMS nahi aayega.\n3. **Watchdog ko hamesha test karo.** Ek watchdog jo kabhi baja hi nahi, woh watchdog hai ya toota hua code? Har mahine **jaan-boojh kar** scheduler ko band karo (staging mein, ya production mein ek chhote cell mein) aur dekho ki page aata hai ya nahi. **Untested backup = koi backup nahi.**\n\nAur aakhri, sabse imaandaar baat: **status page bhi tumhare infra par nahi hona chahiye.** Outage ke waqt customer status page kholta hai. Agar woh bhi down hai, toh tumhara outage do guna bada ho gaya -- technical bhi aur trust ka bhi.\n\n> Interview line: \"Meri SLI ek hai -- `page_latency_seconds`, event accept se pehle provider handover tak, p95 5 second, aur main use `acceptedAt` timestamp payload mein carry karke end-to-end naapta hoon. Baaki har metric uski explanation hai: consumer lag, timer lag, DLQ depth, per-provider failure rate. Do alerts sabse special hain kyunki woh **absence** par bajte hain -- scheduler ka heartbeat aur ingest traffic zero -- kyunki is system ka sabse khatarnak failure chup-chaap kuch na hona hai. Aur main maanta hoon ki paging system khud ko page nahi kar sakta, isliye ek third-party dead man's switch aur har 5 minute ka synthetic incident rakhta hoon, alag cloud account aur alag notification provider par.\"\n\n---\n\n## Remember\n\n> **Is system ka har failure ek hi sawaal se judta hai: \"kya koi sota hua insaan bina jaage reh jaayega?\" Isliye ingest par fail CLOSED raho (jo deliver nahi kar sakte use accept mat karo), delivery par at-least-once raho (duplicate page chalega, missed page nahi), timers ko Redis mein cache aur Postgres mein sach maano, har query par `account_id` lagao, aur yaad rakho ki paging system khud ko page nahi kar sakta -- uske liye ek bahar wala watchdog chahiye.**\n\n## Quick Self-Test\n\n1. Rate Limiter mein Redis down hone par hum **fail open** the, par yahan Kafka down hone par **fail closed** hain. Dono ke peeche ek hi soch kaise ho sakti hai? Aur `503` dene se pehle hum kya karte hain?\n2. `notifications` topic ko 1,000 sends/sec ke liye 48 partitions kyun diye, jabki throughput ke hisaab se 4-5 bhi kaafi hote? Aur live topic par partitions 24 se 48 karne par `trigger` aur `resolve` ke saath kya galat ho sakta hai?\n3. Scheduler ne Lua claim se 500 timer ids `ZREM` kar liye aur turant crash ho gaya. Woh escalations kaise wapas aati hain, aur `fire()` mein Kafka produce ko `markFired()` se **pehle** rakhna kyun zaruri hai?\n4. Ek responder ne web par ack kiya par uske phone par abhi bhi incident `triggered` dikh raha hai. Iske do alag kaaran ho sakte hain (ek DB layer ka, ek device layer ka) -- dono kya hain aur dono ka fix kya hai? Aur jo SMS ja chuka hai uska kya?\n5. Tumhara scheduler ek bad deploy ke baad chup-chaap band ho gaya. Level-1 pages abhi bhi ja rahe hain, saare dashboards green hain, koi error rate nahi badha. Kaunse **do** alerts is silent failure ko pakdenge, aur woh normal threshold alerts se alag kaise hain?\n\n---\n\n**Next (Part 5):** Trade-offs (Kafka vs RabbitMQ, Postgres vs Mongo, ZSET vs DB polling, push vs SMS vs voice, at-least-once vs exactly-once), MVP -> Scalable -> Highly Scalable, 20+ follow-up questions, what-ifs, Node.js specific questions. \"next\" bolo.\n"},{"label":"Trade-offs -> 3 Versions -> Follow-ups -> Node.js Questions","md":"# Notification / Paging System -- HLD + LLD (Part 5: Trade-offs -> 3 Versions -> Follow-ups -> Node.js Questions)\n\n> Is file mein prompt ke **Parts 21-25** hain: paging system ke har bade decision ka trade-off (\"kyun ye, kyun woh nahi\"), MVP -> Scalable -> Highly Scalable teen versions, 30 interviewer follow-up questions, 13 requirement-change (\"What if...\") questions, aur Node.js specific questions -- sab isi paging system par.\n> Part 4 recap: humne dekha ki 1x se 100x tak kya pehle tootta hai (**Twilio ka per-number throughput aur Postgres ka incidents write path, Kafka nahi**), har component fail hone par kya hota hai (Kafka down -> ingest local spool phir `503`, Redis wipe -> `escalation_timers` se ZSET rebuild, provider down -> circuit breaker + failover), consistency kitni chahiye (**at-least-once: duplicate page OK, missed page NOT**), aur kya monitor karna hai (`page_latency_seconds`, `timer_lag_seconds`, `notification_attempts_total`, `dlq_depth`, `kafka_consumer_lag`). Ab un sab decisions ko interview ki language mein bolna seekhenge.\n> Part 6 mein: poora TypeScript implementation end-to-end, 30-second answer, 5-minute answer, whiteboard drawing order, aur final cheat sheet.\n\nEk line mein system yaad kar lo, kyunki har answer isi par tika hai:\n\n```\nMonitoring tools -> POST /v2/enqueue (routingKey, dedupKey, eventAction)\n  -> Ingest API (N stateless Node.js, Express 5): routingKey->serviceId (Redis cache),\n     token bucket rate limit, validate, produce to Kafka (acks=all)  --> 202 Accepted\n  -> Kafka `incident-events` (24 partitions, key=serviceId)\n  -> Incident Service (consumer group `incident-service`):\n       dedup (Postgres partial unique index) + state machine -> Postgres\n       routing: policy -> level -> schedule -> on-call user\n       produce -> Kafka `notifications` (48 partitions, key=incidentId)\n       schedule timer -> Redis ZSET `sched:escalations` + Postgres `escalation_timers`\n  -> Notification Workers: rules, quiet hours, grouping, provider adapters\n       (FCM/APNs | Twilio SMS | Twilio Voice | SendGrid | Slack), retry + circuit breaker + DLQ\n  -> Providers -> delivery webhook -> Webhook API\n  -> Responder acknowledges (app / web / SMS reply \"4\" / voice DTMF \"4\") -> timers cancel\n```\n\nNumbers jo baar baar aayenge: **50M events/day = ~579 eps avg, ~6,000 eps storm peak; dedup ~95% -> 2.5M incidents/day (~29/sec avg, ~300/sec peak); 7.5M notifications/day (~87/sec avg, ~1,000/sec peak); SMS ~$17K/day + voice ~$5K/day; page latency SLO p95 \u003c 5 s, p99 \u003c 10 s; ~3,500 active incidents typical, ~50,000 in a storm.**\n\nAur ek principle jo har trade-off ka tie-breaker hai:\n\n> **\"Duplicate page is OK. Missed page is NOT.\"**\n\n---\n\n## PART 21 -- Trade-offs: har decision ka \"kyun ye, kyun woh nahi\"\n\n### Pehle rule samjho\n\nPaging system ke interview mein sabse common galti: \"Kafka use karenge kyunki scalable hai\" bol dena. Interviewer sunna chahta hai:\n\n```\nRequirement kya hai  ->  Options kya hain  ->  Har option ki keemat kya hai  ->  Is requirement par kaunsi keemat chalegi\n```\n\nHamari requirements yaad rakho: **reliability sabse upar, p95 \u003c 5 s page latency, 99.99% ingest availability, storms 10x-50x, cost ($22K/day SMS+voice) bhi ek constraint hai, aur accepted event kabhi kho na jaaye.** Har table ke end mein **hamare system ka decision** hai.\n\n### 1. Event bus: Kafka vs RabbitMQ vs SQS vs Postgres-as-a-queue\n\nYe sabse pehla decision hai -- Ingest API `202` bolne se pehle event **kahan** likhta hai.\n\n| | Kafka (hamara) | RabbitMQ | SQS (managed) | Postgres as a queue |\n|---|---|---|---|---|\n| **Pros** | **Replay** -- bug fix karke 7 din ke events dobara process kar sakte ho (paging mein ye sona hai: \"raat ko 200 incidents galat route hue\" -> replay); **ordering per key** (`serviceId` -> ek service ke trigger/resolve out of order nahi); **multiple independent consumer groups** (incident-service + analytics + audit + billing sab same topic padh sakte hain, ek doosre ko block kiye bina); 6K eps ek chhote cluster ke liye kuch bhi nahi; retention se durability | Per-message ack/nack/requeue bahut natural; **delayed messages** plugin se; priority queues; routing (topic exchange) se \"critical events is queue mein\" easy; operate karna Kafka se simple | Zero ops, infinite scale, `202` ke baad AWS sambhale; DLQ built-in; visibility timeout = automatic retry | Kuch naya component nahi; incident aur event **ek hi transaction** mein likh sakte ho (dual-write problem hi khatam); `SELECT ... FOR UPDATE SKIP LOCKED` kaafi accha kaam karta hai |\n| **Cons** | Ops heavy (brokers, ISR, partitions, rebalance); consumer lag samajhna padta hai; per-message delay/retry natural **nahi** hai (isliye retries hum worker ke andar karte hain, topic se nahi); ek slow message poori partition ko rok sakta hai (head-of-line blocking) | Replay nahi (message consume hua toh gaya); ek queue ka throughput limited; multiple consumer groups ke liye alag queues + fanout exchange maintain karo; messages memory mein bharein toh broker slow | **Ordering nahi** (standard SQS), FIFO SQS mein 300 msg/s per group ki limit; replay nahi; **delay max 15 min** (hamara escalation 60 min tak jaata hai -> fit nahi); vendor lock-in; per-message cost 50M/day par dikhta hai | 6,000 eps = 6,000 inserts/sec + 6,000 deletes/sec + vacuum pressure -- **wahi DB jahan incidents likhne hain**; queue table bloat; storm mein DB lock contention se ingest aur incident write dono girte hain; replay manual |\n| **Kab main ye choose karunga** | Jab replay, per-key ordering, aur multiple consumers -- teeno chahiye (hamara case); ya throughput 10K+ eps | Jab per-message retry/delay/priority hi main requirement ho aur replay ki zarurat na ho -- **notification retry level par RabbitMQ ka pattern (delayed exchange + DLX) hamare custom backoff se behtar hai**, isliye V2 mein exactly wahi (BullMQ) use kiya | Jab team chhoti hai, ops nahi karna, throughput moderate hai, aur ordering matter nahi karta -- ek startup ke liye bilkul sahi shuruaat | Jab tumhara scale hazaaron events/day hai (V1), ya jab \"outbox pattern\" chahiye -- DB transaction ke saath event likhna |\n| **Kab main dusra choose karunga** | Agar hum sirf 500 events/day kar rahe hote toh Kafka chalana bewakoofi hai -- Postgres queue | Agar mujhe raat 2 baje ke incident ko dobara process karna pade toh RabbitMQ mujhe kuch nahi de sakta | Agar mujhe 60 min ka delay chahiye ya per-service ordering chahiye | Jaise hi DB CPU ka bada hissa queue polling kha jaaye |\n\n**Decision:** \"Kafka `incident-events`, 24 partitions, key = `serviceId`. Teen wajah: replay (paging mein sabse badi recovery tool), per-service ordering (trigger ke baad resolve aaye, ulta nahi), aur multiple consumer groups. Lekin main honest rahunga -- **Kafka retry/delay ke liye bura hai**, isliye notification retries topic se nahi, worker ke andar backoff + `notifications-dlq` se karte hain. Agar throughput 6K eps na hota aur replay ki zarurat na hoti, SQS se shuru karta.\"\n\n> Note: `202 Accepted` tabhi bolte hain jab Kafka ne `acks=all` par confirm kar diya. Ye jaanbujh kar hai -- accept bol ke event khona is system ka sabse bada paap hai.\n\n### 2. Incident store: Postgres vs MongoDB vs DynamoDB\n\n| | Postgres (hamara) | MongoDB | DynamoDB |\n|---|---|---|---|\n| **Pros** | **Partial unique index** `(service_id, dedup_key) WHERE status \u003c> 'resolved'` -- dedup DB khud enforce karta hai, application race ke bawajood; **multi-row transaction**: incident + timeline + escalation timer ek saath commit; relational data natural hai (service -> policy -> rule -> schedule -> layer -> user -> contact method: 6 joins ka graph); optimistic locking (`version`) se ack race solve; monthly partitions se 90-day retention aasaan; read replicas dashboards ke liye | Flexible schema (`customDetails` jaisa bada JSON), incident + timeline ek hi document mein (ek read se poora incident); sharding built-in; write throughput acchi | Infinite scale, single-digit ms, zero ops; conditional writes (`attribute_not_exists`) se atomic dedup possible; TTL se auto-retention; DynamoDB Streams se change events free |\n| **Cons** | Ek primary par writes (29/sec avg, 300/sec peak -- ye Postgres ke liye kuch nahi, isliye ye con hamare scale par theoretical hai); manual partition management; connection limit (`max_connections`) N workers ke saath dikkat karti hai (Part 25 Q5) | **Partial unique index MongoDB mein hai** (`partialFilterExpression`) lekin sharded collection par unique index sirf shard key par ban sakta hai -- yahi hamara dedup toot jaata; multi-document transaction hai par performance aur ops cost ke saath; joins (`$lookup`) routing ke liye kharaab | Joins nahi -- escalation policy graph ke liye 4-5 alag queries ya heavy denormalization; **partial unique index nahi** (condition `status \u003c> 'resolved'` ko manually modelling karna padta hai, e.g. `PK = serviceId#dedupKey` wala item resolve par delete); GSI eventual consistent; query flexibility kam (dashboard filters mushkil); cost model surprise de sakta hai |\n| **Kab main ye choose karunga** | Jab correctness aur constraints core hain aur write volume mid-range hai -- **paging exactly yahi hai** | Jab incident ek self-contained document ho, schema har customer ka alag ho, aur cross-entity transactions na chahiye -- e.g. ek pure \"event log\" product | Jab 10x-100x scale ho aur team ops nahi karna chahti; ya jab access pattern sirf key-based ho (`getIncident(id)`), analytics alag system mein ho |\n| **Kab main dusra choose karunga** | Agar incidents 100M/day hote toh single-primary Postgres pe likhna galat hota -- tab Dynamo ya Postgres sharding | Agar mujhe cross-table transaction chahiye (incident + timer + timeline atomically) | Agar mujhe rich dashboard queries chahiye (\"last 7 days, service X, severity critical, unacknowledged > 10 min\") |\n\n**Decision:** \"Postgres. Sabse bada reason **partial unique index** hai -- dedup is system ka dil hai, aur main use application logic se nahi, DB constraint se enforce karna chahta hoon. Do workers same `dedupKey` ek hi millisecond mein process karein toh `INSERT ... ON CONFLICT` ek ko insert dega aur doosre ko update -- `xmax = 0` se pata chal jaata hai kaunsa naya tha, aur sirf naye par page jaata hai. MongoDB/Dynamo mein ye guarantee banana padta, milta nahi. 29 incidents/sec Postgres ke liye kuch bhi nahi -- scale problem hai hi nahi, correctness problem hai.\"\n\n### 3. Timers: Redis ZSET vs DB polling vs Kafka delay topics vs cloud scheduler\n\nEscalation timer = \"5 minute baad agar ack nahi hua toh agle level par page karo\". Ye system ka **sabse critical mechanism** hai -- timer miss = missed page.\n\n| | Redis ZSET (hamara) | DB polling (`FOR UPDATE SKIP LOCKED`) | Kafka delay topics | Cloud scheduler (SQS delay / EventBridge / Cloud Tasks) |\n|---|---|---|---|---|\n| **Kaise** | `ZADD sched:escalations \u003cdueAtMs> \u003ctimerId>`; scheduler har 1 s ek atomic Lua `ZRANGEBYSCORE ... LIMIT` + `ZREM` chalata hai | `SELECT ... WHERE due_at \u003c= now() AND state='pending' FOR UPDATE SKIP LOCKED LIMIT 100` har 1 s | Fixed delay tiers: `delay-1m`, `delay-5m`, `delay-15m` topics; consumer message padhta hai, `sleep(dueAt - now)` ya pause karta hai | `SendMessage` with `DelaySeconds`, ya EventBridge scheduler par ek one-off schedule |\n| **Pros** | Sub-second precision; O(log N) add, O(log N + M) claim; 50,000 active timers = ~5 MB (trivial); claim + remove **ek atomic step** -> do scheduler instances same timer do baar fire nahi karte -> leader election ki zarurat nahi | Durable by default (koi alag recovery job nahi chahiye); `SKIP LOCKED` se multiple pollers safe; transaction ke andar \"timer cancel + incident ack\" ek saath; debugging aasaan (SQL se dekh lo) | Koi alag scheduler service nahi; durability Kafka ki; replay bhi mil jaata | Zero ops; provider durability; scale infinite |\n| **Cons** | **Redis ephemeral hai** -- failover/eviction/wipe par timers gayab -> missed page. Isliye durable copy `escalation_timers` table + har 60 s recovery job (`ZADD NX`) **compulsory** hai; Redis ek aur failure domain | Har 1 s ek query x N pollers; 50,000 due timers storm mein DB par extra load exactly us waqt jab DB already busy hai; `due_at` index par lock contention; granularity badhao toh DB aur pite ga | **Delay fixed hai, arbitrary nahi** -- 5 min ka timer 5 min topic se, lekin 7 min ka? Multiple hops chahiye; consumer mein sleep = partition block (head-of-line); cancel karna **impossible** (message wapas nahi le sakte) -> ack ke baad bhi message aayega, har consumer ko \"abhi bhi valid hai?\" check karna padega | SQS `DelaySeconds` **max 15 min** -- hamara 60 min escalation fit hi nahi hota; EventBridge one-off schedules par quota + latency (~1 min granularity); per-timer API call cost; cancel karne ke liye alag API call; cross-cloud portability zero |\n| **Kab main ye choose karunga** | Jab timers bahut hain, precision seconds mein chahiye, aur cancel bahut hota hai (ack par) -- hamara case | Jab timers kam hain (hazaaron/day), ya jab timer aur business row ka **ek transaction** hona hi sabse zaruri hai; V1 ke liye bilkul sahi | Jab delays chhote aur fixed set ke hain (retry ladder: 1s/10s/1m) aur cancel karna nahi hota | Jab delay \u003c 15 min, volume kam, aur team ops nahi chahti |\n| **Kab main dusra choose karunga** | Agar mera Redis already overloaded hai ya team Redis operate nahi kar sakti -> DB polling | Jab 50,000 timers ek second mein due ho jaayein (storm) aur DB already peak par ho | Jab arbitrary delay ya cancel chahiye (hamara dono chahiye) -> isliye reject | Jab 60 min escalation chahiye -> reject |\n\n**Decision:** \"Redis ZSET **plus** Postgres `escalation_timers` durable copy. Ye 'ya toh Redis ya toh DB' nahi hai -- **dono**. Redis speed aur atomic claim deta hai, Postgres truth deta hai. Recovery job har 60 s `SELECT ... WHERE state='pending' AND due_at \u003c now() + interval '5 minutes'` karke `ZADD NX` karti hai, toh Redis wipe hone ke baad bhi agle 60 s mein timers wapas aa jaate hain. **Timers ko sirf Redis mein rakhna is system ki sabse badi galti hoti** -- aur 'sirf DB mein' rakhna storm mein DB ko maar deta. Agar mera scale 100x chhota hota, main seedha `SKIP LOCKED` polling lagata aur Redis touch bhi na karta.\"\n\n> Interview line: \"Timers ka problem memory ka nahi hai (50K timers = 5 MB). Problem do hain: **duplicate fire** (do scheduler same timer uthayein) aur **lost timer** (Redis wipe). Pehla atomic Lua claim se solve hota hai, doosra durable copy + recovery job se.\"\n\n### 4. Delivery guarantee: at-least-once vs exactly-once vs at-most-once\n\n| | At-least-once (hamara) | Exactly-once | At-most-once |\n|---|---|---|---|\n| **Matlab** | Consumer DB mein likhne ke **baad** offset commit karta hai; crash par message dobara aata hai -> duplicate possible, loss nahi | Har page theek ek baar jaaye -- na kam, na zyada | Offset pehle commit, kaam baad mein -> duplicate nahi, **loss possible** |\n| **Pros** | Missed page kabhi nahi (hamara #1 requirement); simple; Kafka ka natural mode (`enable.auto.commit=false`) | Theoretically perfect; customer kabhi do SMS nahi dekhta | Fastest, simplest, provider cost sabse kam |\n| **Cons** | Duplicate SMS/call possible -- responder ko do baar phone bajega | **Third-party ke saath possible hi nahi.** Twilio ko HTTP call gaya, timeout aaya -- SMS gaya ya nahi, hum jaante hi nahi. Retry karo toh shayad duplicate, na karo toh shayad missed. \"Exactly-once\" sirf tab possible hai jab dono taraf transaction ho -- Twilio hamare Postgres transaction mein nahi hai | Kabhi kabhi page jaayega hi nahi -- **production outage kisi ko pata hi nahi chalega**. Ye product ka hi khatma hai |\n| **Kab main ye choose karunga** | **Paging, alerting, payments capture, koi bhi cheez jahan loss unacceptable hai** | Sirf apne system ke andar (Kafka -> Kafka transactions, ya DB idempotency key ke saath) -- \"effectively once\" | Metrics, telemetry, analytics events, \"typing...\" indicators -- jahan ek data point kho jaana koi farq nahi padta |\n| **Kab main dusra choose karunga** | Agar system marketing push bhejta (duplicate promo = user annoyed, missed promo = kuch nahi) -- tab at-most-once bhi chalega | -- | Kabhi nahi, is system mein |\n\n**Decision:** \"At-least-once, poore pipeline mein. Kafka consumers `enable.auto.commit=false`, DB write ke baad manual commit. Duplicates ko hum **kam** karte hain -- `notifications.task_id` par unique index, aur provider-side idempotency key -- par 100% nahi rok sakte, aur ye acceptable hai. Reason ek line mein: **ek extra SMS se responder irritate hoga; ek missed SMS se customer ka production 40 minute down rahega aur kisi ko pata nahi chalega.** Exactly-once yahan marketing word hai, engineering reality nahi -- kyunki Twilio ki HTTP call hamare transaction ka hissa nahi ban sakti.\"\n\n### 5. Sync ingest (`201` with `incidentId`) vs async ingest (`202`)\n\n| | Async: `202 Accepted` + `dedupKey` (hamara) | Sync: `201 Created` + `incidentId` |\n|---|---|---|\n| **Kya hota hai** | Ingest API sirf validate + Kafka produce karta hai (`acks=all`), phir `202 { status: \"accepted\", dedupKey }` | Ingest API DB mein incident insert karta hai, routing resolve karta hai, phir `201 { incidentId }` |\n| **Pros** | Ingest path par **DB touch nahi** -> storm mein bhi ingest zinda (99.99% availability); latency ~5-10 ms, predictable; DB slow ho toh ingest ko farq nahi padta; backpressure Kafka lag ban jaata hai, `503` nahi | Client ko turant `incidentId` milta hai (link banane, UI dikhane ke liye); ek hi call mein sab kuch; debugging simple (\"maine bheja, banna chahiye tha\") |\n| **Cons** | Client ko `incidentId` nahi milta (abhi bana hi nahi) -- client ko baad mein `GET /api/v1/incidents?dedupKey=` se dhoondhna padta hai; \"accepted\" ka matlab \"processed\" nahi -- agar consumer mein bug hai toh client ko pata nahi chalega | Har event par DB write (dedup query + insert) -> **6,000 eps storm par Postgres pe seedha 6,000 queries/sec**; DB slow = ingest slow = customer ka Alertmanager timeout = **events kho gaye**; ingest ki availability DB ki availability se bandh gayi |\n| **Kab main ye choose karunga** | Jab ingest ka #1 kaam \"kabhi mat giro\" ho aur processing few seconds late chal jaaye -- **paging exactly yahi hai** (PagerDuty ka Events API v2 bhi `202` deta hai) | Jab volume kam ho (V1), ya jab client ko turant ID chahiye workflow ke liye (e.g. ticketing API) |\n| **Kab main dusra choose karunga** | Agar customer contract kehta \"response mein incident ID chahiye\" -- tab bhi main `202` + `dedupKey` dunga aur ek `GET` endpoint dunga, kyunki availability zyada important hai | Agar mera peak 50 eps hota, sync bilkul theek tha -- ek Kafka + consumer chalana overkill hota |\n\n**Decision:** \"`202` with `dedupKey`. Customer ka monitoring tab bhejta hai jab uska system **already jal raha ho** -- us waqt hamara ingest DB ki wajah se slow nahi ho sakta. Trade-off main openly bolunga: client ko `incidentId` nahi milta aur 'accepted' ka matlab 'notified' nahi hai. Isko cover karne ke liye: `dedupKey` se lookup endpoint, aur `page_latency_seconds` metric jo accept se lekar first provider handover tak measure karta hai -- taaki hum khud jaanein ki accepted events sach mein page ban rahe hain.\"\n\n### 6. Channels: push vs SMS vs voice vs email vs Slack\n\nYe table interview mein sabse zyada impress karta hai, kyunki isme **latency + cost + reliability + failure mode** ek saath hai.\n\n| Channel | Typical latency | Cost (hamara volume) | Reliability | Kab fail karta hai (asli failure mode) | Hamara use |\n|---|---|---|---|---|---|\n| **Push (FCM/APNs)** | 1-5 s | ~$0 (3.75M/day free) | Achhi, par **guaranteed nahi** | **Phone silent / Do Not Disturb** -> notification aayi par awaaz nahi hui, banda sota raha; app force-quit; device token expire; battery optimization ne app maar diya; phone offline (push queue mein rakha jaata hai, delivered nahi) | **Pehla channel, hamesha** -- sasta aur fast |\n| **SMS (Twilio)** | 2-10 s (carrier par depend) | ~$0.0075 x 2.25M = **~$17K/day** | Achhi, par carrier ke haath mein | Carrier delay (minutes tak ho sakta hai); DND registry (India mein promotional filter); **long code par ~1 SMS/sec** per number -> storm mein queue; international number par delivery fail | **Doosra channel, ~1 min baad** (per-user notification rule) |\n| **Voice call (Twilio)** | 5-20 s ring | ~$0.013/min x 0.4M = **~$5K/day** | Sabse zyada \"wake up\" power | Phone silent mode par bhi ring karta hai (zyada tar phones mein repeated call DND break karti hai) -- isliye ye last resort hai; call reject ho jaaye; voicemail par chala jaaye (delivered dikhega par insaan ne suna nahi); DTMF input miss ho | **Teesra channel, ~5 min baad**, sirf high urgency |\n| **Email (SendGrid)** | 5 s - 5 min | ~$0.0001 (1.1M/day, sasta) | Delivery reliable, **attention unreliable** | Spam folder; inbox rules; raat ko koi email nahi padhta; greylisting se 15 min delay | **Low urgency ka default** (severity `warning`/`info`), aur high urgency ka audit copy |\n| **Slack** | 1-5 s | ~$0 (workspace API) | Achhi | **Slack down ho toh?** (aur Slack down hona khud ek incident hai); channel muted; raat ko koi nahi dekhta; rate limit (~1 msg/sec per channel) | Team channel par context, **kabhi akela paging channel nahi** |\n\n**Decision:** \"Escalating ladder: **push (0 min) -> SMS (1 min) -> voice (5 min)**, per-user `notification_rules` se configurable. Teen wajah:\n1. **Cost:** push free hai, SMS $17K/day, voice $5K/day. Agar main sabko turant voice call karta toh bill 5x ho jaata bina reliability 5x hue.\n2. **Reliability ladder:** har agla channel pichle ke failure mode ko cover karta hai -- push ka failure mode 'silent phone' hai, SMS us par bhi vibrate karta hai, voice DND bhi tod deta hai.\n3. **Politeness:** 90% incidents push se hi ack ho jaate hain (p50 ack ~2 min). Baaki 10% ke liye hi SMS/voice ka paisa lagta hai.\n\nKab main dusra choose karunga: agar customer 'critical database down' jaise service ke liye bole 'pehle hi call karo, 1 min bhi mat waste karo' -- toh us service ki policy mein level 1 ka rule hi `0 min voice` kar dunga. Ye per-service configurable hona chahiye, hardcoded nahi.\"\n\n> Ek honest baat jo interview mein bolna: **koi channel 100% nahi hai.** Isliye hum multi-channel + escalation + repeat karte hain. Reliability ek channel se nahi, **layers se** aati hai.\n\n### 7. Single shared notification worker pool vs per-channel pools\n\n| | Ek shared pool (sab channels ek consumer group) | Per-channel pools (sms-workers, voice-workers, push-workers, email-workers) |\n|---|---|---|\n| **Pros** | Simple: ek deployment, ek autoscaling policy, ek dashboard; resource utilization better (SMS slow hai toh idle workers push kar lete hain); kam infra | **Isolation:** Twilio 10 min down ho toh SMS workers atke rahenge, push aur email chalte rahenge; per-channel concurrency limit natural (`sms: 50, voice: 10, push: 500`); per-channel scaling (storm mein SMS workers 3x, push workers same); alag deploy -> SMS adapter ka bug voice ko nahi girata |\n| **Cons** | **Head-of-line blocking:** Twilio slow (5 s per call) ho gaya toh saare workers SMS calls par atak jaate hain, aur push notifications (jo 50 ms leti hain) queue mein pade rehte hain -- **poora system ek provider ki speed par chala jaata hai**; ek channel ki retry storm sabko affect karti hai | Zyada deployments, zyada dashboards; ek topic ko channel ke hisaab se split karna padta hai (ya har pool poora topic padhe aur apne channel ke alawa skip kare -- waste); partitions ki planning har pool ke liye |\n| **Kab main ye choose karunga** | V1/V2 -- jab volume kam hai aur ek provider ka slow hona bardasht ho sakta hai | V3 -- jab 1,000 notif/sec peak hai aur channels ki latency 100x alag hai (push 50 ms vs voice 20 s) |\n| **Kab main dusra choose karunga** | Jaise hi `notification_send_duration_seconds{channel=\"voice\"}` ki wajah se `{channel=\"push\"}` ki latency badhne lage -- ye signal hai | Agar mere paas sirf 2 channels hain aur dono fast hain, alag pools chalana bekaar overhead hai |\n\n**Decision:** \"V3 mein per-channel pools -- alag consumer groups, ya `notifications` topic ko channel ke hisaab se sub-topics mein split. Main reason cost nahi, **isolation** hai: voice call ka round trip 20 s hai aur push ka 50 ms -- inko ek pool mein rakhna matlab push ko voice ki speed par chalana. Har pool ka apna concurrency cap bhi hota hai, jo provider throughput se match karta hai (Twilio long code ~1 SMS/sec per number -> SMS pool ka cap sender numbers x 1). V1/V2 mein ek hi pool bilkul sahi hai -- premature split karna bas ops ka bojh hai.\"\n\n### 8. Monolith vs microservices for this system\n\n| | Modular monolith (hamara V1/V2) | Microservices (V3 ka rasta) |\n|---|---|---|\n| **Pros** | Ek repo, ek deploy, ek test suite; `IncidentService` -> `RoutingService` -> `NotificationService` sirf function calls (network failure nahi); transaction ek DB mein; naye engineer ko samajhna aasaan; refactor karna sasta | Ingest aur notification ki **scaling profile alag hai** (ingest 6,000 eps, notification 1,000/sec) -> alag autoscale; ek service ka bug doosre ko nahi girata; alag teams alag services own kar sakti hain; provider SDK upgrade sirf notification service ko touch kare |\n| **Cons** | Ingest ko scale karne ke liye notification workers bhi scale hote hain (waste); ek memory leak poore process ko marta hai; deploy sab kuch ek saath restart karta hai (aur restart ke waqt in-flight pages?) | Network calls ke beech failures; distributed tracing compulsory; dual-write / eventual consistency ke problems; local dev heavy; ops 4x |\n| **Kab main ye choose karunga** | Shuruaat mein hamesha. 20,000 accounts wale product ke liye bhi modular monolith bilkul chal sakta hai agar processes alag deploy ho sakein | Jab ek component ki scaling ya failure profile baaki se sach mein alag ho -- yahan **notification workers** aur **scheduler** sabse pehle alag hone chahiye |\n| **Kab main dusra choose karunga** | Jab ek team 5 se 40 engineers ho jaaye aur deploy queue ban jaaye | Agar team 5 log ki hai, microservices se delivery slow hogi, reliability nahi badhegi |\n\n**Decision:** \"Ek **modular monolith codebase**, lekin **alag deployable processes**: `api` (ingest + REST + webhooks), `incident-consumer`, `notification-worker`, `scheduler`, `dlq-worker`. Same repo, same `src/`, alag entrypoints (`workers/*.ts`). Isse mujhe microservices ka main fayda (alag scaling, alag failure domain) mil jaata hai bina distributed transaction ke dard ke. Ye spec ka decision bhi hai: **'v1 ek modular monolith hai, alag deploys optional'**. Asli microservices tab jab alag teams own karein.\"\n\n### 9. Build vs buy: PagerDuty / Opsgenie / Twilio Notify\n\nYe sawaal interviewer aksar last mein poochta hai, aur \"main sab khud banaunga\" bolna **galat answer** hai.\n\n| | Buy (PagerDuty / Opsgenie) | Buy partial (Twilio Notify / Verify, SNS) + apna logic | Build (hamara full design) |\n|---|---|---|---|\n| **Pros** | Din 1 se kaam karta hai; mobile apps already bane hain (iOS + Android, critical alerts entitlement ke saath jo silent mode bhi todta hai); carrier relationships, short codes, international delivery; compliance (SOC2) ready; on-call ke saare edge cases (DST, overrides, vacations) already solved | Delivery ka sabse ganda hissa (carriers, retries, opt-out, number pools) provider ke paas; hum sirf incident logic likhte hain | Product **hum hi bech rahe hain** -- toh build karna hi padega; deep customization (per-customer routing rules); cost per page apna control mein; data apne paas |\n| **Cons** | Per-user per-month cost ($20-40/user) -- 500,000 responders par ye impossible hai; customization limited; vendor lock-in; data unke paas | Escalation, schedules, dedup phir bhi hum likhenge -- jo is system ka 70% hai | 6-12 mahine ka kaam; **mobile app banana** (critical alerts, push reliability) sabse under-estimate kiya hua hissa; 24x7 on-call for the on-call system; carrier/delivery ka dard |\n| **Kab main ye choose karunga** | Agar hum ek normal SaaS hain jise apni team ko page karna hai -- **100% PagerDuty khareedo**, ye design mat banao | Agar hamare paas apna incident model hai (e.g. security alerts) par delivery nahi karni | Agar paging **hamara product** hai (yahi hamara case hai), ya scale itna bada hai ki per-seat pricing DIY se 10x mehenga ho |\n| **Kab main dusra choose karunga** | -- | Shuru mein: hum khud Twilio par direct hain (cheaper, more control on retries) par Notify jaisa layer V1 mein time bacha sakta hai | Agar ye internal tool hota, build karna **galat** hota |\n\n**Decision:** \"Main interview mein ye line bolunga: **'Agar ye internal tool hota, main PagerDuty kharid leta aur ghar chala jaata.'** Build karna sirf isliye sahi hai kyunki paging hi hamara product hai. Aur build karte hue bhi hum sab kuch nahi banate -- Twilio (SMS + voice), FCM/APNs (push), SendGrid (email) sab khareedte hain. Hum sirf woh banate hain jo hamara **differentiator** hai: dedup, routing, escalation, on-call schedules, aur reliability. Ye distinction -- 'kaunsa hissa hamara IP hai aur kaunsa commodity' -- hi build vs buy ka asli jawab hai.\"\n\n### 10. Timers app ke andar vs external scheduler\n\n| | In-app `setTimeout` / timer wheel | External scheduler service (hamara: Redis ZSET + scheduler process) | Managed cloud scheduler |\n|---|---|---|---|\n| **Pros** | Zero infra; sub-ms precision; cancel = `clearTimeout`, instant | Process crash ho toh timer bacha rehta hai (Redis + Postgres mein); koi bhi scheduler instance uthata hai; HA free (atomic claim); 50K timers trivial; `timer_lag_seconds` measure kar sakte ho | Zero ops, provider durability |\n| **Cons** | **Crash = saare pending timers gaye** -- 3,500 active incidents ke escalation timers ek restart mein khatam. Deploy bhi ek restart hai, matlab **har deploy par pages miss honge**; `setTimeout` max delay `2^31-1` ms = ~24.8 din (ye overflow ho toh timer **turant** fire karta hai -- silent bug); timer ek hi process ki memory mein, doosra instance nahi jaanta | Ek aur component; Redis failure domain; recovery job likhni padti hai; 1 s granularity (hamare liye kaafi) | SQS delay max 15 min; per-timer API cost; cancel mushkil; latency ~1 min granularity |\n| **Kab main ye choose karunga** | Sirf **short-lived, non-critical** waits ke liye: HTTP retry backoff (200 ms), debounce, circuit breaker ka 30 s `half-open` transition -- jo kho jaaye toh koi marta nahi | **Koi bhi timer jiska miss hona business ko hurt kare** -- escalation exactly yahi hai | Jab volume bahut kam ho aur ops team na ho |\n| **Kab main dusra choose karunga** | Escalation ke liye **kabhi nahi** | Agar timers hazaaron/din hon toh external scheduler overkill hai -- Postgres polling kaafi | 60 min delay chahiye -> reject |\n\n**Decision:** \"Escalation timers kabhi bhi app process ki memory mein nahi. `setTimeout` is system mein sirf tab jab uska kho jaana matter na kare -- retry backoff, circuit breaker state transition. Ek line jo interviewer ko yaad rahegi: **'Agar tumhara escalation timer `setTimeout` mein hai, toh tumhara deploy hi ek missed page hai.'**\"\n\n### 11. Delivery status: polling vs webhooks\n\nTwilio ko SMS de diya -- lekin phone tak pahunchi? Ye pata karne ke do tareeke hain.\n\n| | Webhook (hamara) | Polling (`GET /Messages/:sid` loop) |\n|---|---|---|\n| **Pros** | Status change hote hi turant pata (`queued -> sent -> delivered -> failed`); zero wasted API calls; provider ka natural model | Koi public endpoint expose nahi karna; firewall friendly; provider down ho toh hum khud retry karte hain; ordering apne haath mein |\n| **Cons** | Public endpoint = attack surface -> **signature verification compulsory** (`X-Twilio-Signature`, HMAC-SHA1 over URL + params); webhook out-of-order aa sakta hai (`delivered` pehle, `sent` baad mein) -> status machine ko monotonic banao; webhook kho bhi sakta hai (provider ne 3 baar try kiya, hamara endpoint down tha); duplicate webhooks aate hain -> idempotent handler chahiye | 7.5M notifications/day x kam se kam 2 polls = 15M extra API calls/day -- rate limits aur cost; status 30-60 s late; polling loop khud ek scheduler problem ban jaata hai |\n| **Kab main ye choose karunga** | Default -- volume zyada hai aur latency chahiye | Reconciliation ke liye: jo notifications 10 min se `sent` par atki hain (webhook nahi aaya), unko batch mein poll karke sach pata karo |\n| **Kab main dusra choose karunga** | Agar hamara system private network mein ho aur public endpoint possible hi na ho | Agar volume chhota ho (V1 mein polling bilkul theek hai) |\n\n**Decision:** \"Webhooks primary (`POST /webhooks/twilio/status`, signature verified, idempotent, out-of-order safe), aur **ek reconciliation job** safety net ki tarah -- har 5 min woh notifications dhoondho jo 10 min se `sent` par hain aur unhe poll karo. Ye 'webhook + reconcile' pattern payment systems se aaya hai aur wahi yahan bhi sahi hai: **webhook fast path hai, polling truth hai.** Aur ek design note: **delivery status se hum paging ka decision nahi lete** -- escalation timer status ka intezaar nahi karta, kyunki `delivered` ka matlab 'insaan ne dekha' nahi hai. Sirf `ack` matlab dekha.\"\n\n### 12. Prompt ke generic pairs -- is system par kya lagta hai, kya nahi\n\n| Pair | Is system par? | Decision |\n|---|---|---|\n| **SQL vs NoSQL** | Haan, bada decision | **Postgres** -- partial unique index (dedup), multi-row transactions (incident + timeline + timer), relational routing graph. Raw events Kafka mein (7 din), cold incidents S3 + Parquet |\n| **Sync vs Async** | Haan, core decision | Ingest **async** (`202`), kyunki availability > client convenience. Ack **sync** (`200` turant, optimistic lock ke saath) kyunki responder ko turant confirmation chahiye -- warna woh dobara ack dabayega |\n| **Cache vs no cache** | Thoda | `svc:\u003croutingKey>` -> serviceId (TTL 300 s) -- har event par ye lookup hai, cache kiye bina Postgres par 6,000 reads/sec. Incidents cache **nahi** karte -- write-heavy hain aur stale incident status dikhana khatarnak hai. **Spec bolti hai: CDN ki zarurat nahi, kyunki kuch bhi cacheable read path nahi hai** |\n| **Kafka vs RabbitMQ** | Haan (section 1) | Kafka event bus ke liye (replay + ordering + multi-consumer); RabbitMQ-style per-message retry/delay ka pattern notification retry par (V2 mein BullMQ) |\n| **REST vs WebSocket / Polling vs WebSocket** | Partially | Mobile app ke liye **push (FCM/APNs)** -- WebSocket battery khata hai aur background mein mar jaata hai. Web dashboard live updates ke liye **SSE** (V2), WebSocket nahi -- kyunki data ek taraf hi jaata hai (server -> browser) |\n| **UUID vs Snowflake** | Chhota | `incidents.id` = **UUID v4**. Ye ID public link mein aati hai (`sho.rt/i/abc` ke peeche), toh guessable nahi honi chahiye -- Snowflake sequential hai aur incident count leak karta hai. Index bloat ka dar hai toh UUID v7 (time-ordered) le lo, par hamare volume par farq nahi padta |\n| **Idempotency** | Haan, do jagah | Ingest par `Idempotency-Key` header -> `idempotency_keys` table (24 h). Delivery par `notifications.task_id` unique index. **Dono alag layer hain** -- pehla client ke retry se bachata hai, doosra hamare apne at-least-once se |\n\n### Summary: ek table mein saare decisions\n\n| Decision | Humne kya chuna | Kab badlenge |\n|---|---|---|\n| Event bus | Kafka, 24 partitions, key=`serviceId` | Chhota scale -> SQS/Postgres queue; sirf retry chahiye -> RabbitMQ |\n| Incident store | Postgres (partial unique index + transactions) | 100M incidents/day -> Dynamo ya shard |\n| Timers | Redis ZSET + Postgres durable copy + 60 s recovery | Chhota scale -> `SKIP LOCKED` polling only |\n| Delivery guarantee | At-least-once + `task_id` unique index | Kabhi nahi (missed page unacceptable) |\n| Ingest | `202 Accepted` + `dedupKey` | Chhota scale -> sync `201` |\n| Channels | push (0m) -> SMS (1m) -> voice (5m), per-service configurable | Critical service -> voice at 0m |\n| Worker pools | V1/V2 ek pool; V3 per-channel | Jab ek channel doosre ki latency khaaye |\n| Architecture | Modular monolith, alag deploy processes | Alag teams -> alag services |\n| Build vs buy | Build core (dedup/routing/escalation), buy delivery (Twilio/FCM/SendGrid) | Internal tool -> PagerDuty kharido |\n| Delivery status | Webhooks + reconciliation job | Chhota scale -> polling |\n| Kafka down | Local disk spool (~60 s) phir `503` -- **fail closed** | Kabhi nahi |\n\n> Interview line: \"Is system mein har decision ek hi sawaal se nikalta hai: **'agar ye component fail hua, toh kya ek page miss hoga?'** Agar haan, toh durable copy + recovery chahiye (timers). Agar nahi, toh simple rakho (delivery status). Rate limiter mein main fail-open tha kyunki limiter ka kaam bachana tha; yahan main **fail-closed** hoon kyunki accept bol ke deliver na karna sabse bada jhoot hai.\"\n\n---\n\n## PART 22 -- Minimum -> Scalable -> Highly Scalable (3 versions)\n\nInterviewer 3 versions isliye maangta hai taaki dekhe ki tum **Day 1 par Kafka + Redis Cluster + 5 microservices nahi laga doge**, aur tumhe pata hai ki **kaunsa metric** tumhe next version par le jaayega.\n\n### Version 1 -- Simple MVP (Express + Postgres + setInterval + Twilio)\n\nYe woh system hai jo ek 3-engineer startup ek hafte mein bana sakti hai. Aur ye **bilkul sahi hai**, jugaad nahi.\n\n```\nMonitoring tool\n   |  POST /v2/enqueue\n   v\nNode.js (Express 5) -- ek hi process\n   |-- validate + routingKey -> service (Postgres SELECT)\n   |-- BEGIN\n   |     INSERT INTO incidents ... ON CONFLICT (service_id, dedup_key)\n   |       WHERE status \u003c> 'resolved' DO UPDATE SET occurrence_count = ...\n   |       RETURNING (xmax = 0) AS inserted\n   |     INSERT INTO incident_events (timeline)\n   |     INSERT INTO escalation_timers (due_at = now() + ack_timeout)\n   |   COMMIT\n   |-- agar inserted -> await twilio.messages.create(...)   [sync, inline]\n   v\n  201 Created { incidentId }\n\nSame process ke andar:\n   setInterval(5000) -> SELECT * FROM escalation_timers\n                        WHERE state='pending' AND due_at \u003c= now()\n                        FOR UPDATE SKIP LOCKED LIMIT 50\n                     -> escalate karo, Twilio call karo, state='fired'\n\nPostgreSQL (single instance + daily backup)\nTwilio (SMS + voice)\n```\n\n**Kitna traffic?** Imaandari se: **kuch sau events/din**, shayad 2,000-5,000/din tak. Matlab ~0.05 events/sec average, storm mein 10-20 eps. Ek Postgres instance aur ek Node process iske liye **bahut zyada** hai. 50-100 customers, 500 responders.\n\n**Components aur unka reason:**\n\n| Component | Kyun hai | Kyun ye \"jugaad\" nahi hai |\n|---|---|---|\n| **Sync ingest, `201` + `incidentId`** | Client ko turant ID mil jaati hai, debugging aasaan | 5 eps par DB write ingest ko slow nahi karti. Async banane ka koi fayda nahi -- bas ek Kafka cluster ka bill |\n| **Postgres partial unique index** | Dedup **din 1 se** DB level par -- ye V1 mein bhi hona chahiye | Ye woh cheez hai jo baad mein retrofit karna mushkil hai. Schema din 1 se sahi rakho |\n| **`escalation_timers` table + `setInterval` poller** | Escalation chahiye hi chahiye, warna product hi nahi hai | `FOR UPDATE SKIP LOCKED` production-grade pattern hai. 50 timers par 5 s polling = kuch nahi |\n| **Twilio inline (request ke andar `await`)** | Ek provider call, ~300 ms. Response thoda slow, par kaam ho gaya | 5 eps par koi queue ki zarurat nahi |\n| **Ek process** | Ek deploy, ek log stream, ek dashboard | 3 engineers 5 services operate nahi kar sakte |\n\n**Kya jaan-boojh ke NAHI hai:** Kafka (koi replay ki zarurat nahi, volume zero), Redis (kuch cache karne ko nahi, timers DB mein hain), separate workers (ek process kaafi), circuit breaker (ek provider, agar down hai toh retry kar lo), grouping (storm aata hi nahi), read replicas, partitioning.\n\n**Exactly kya tootta hai (aur kaunse order mein):**\n\n| # | Problem | Kab aata hai | Kyun |\n|---|---|---|---|\n| 1 | **Twilio slow -> ingest slow** | Twilio ek din 5 s leta hai | Inline `await twilio...` -> har event 5 s. Customer ka Alertmanager 10 s par timeout karta hai -> **woh retry karta hai** -> aur load. Ye sabse pehla dard hai |\n| 2 | **Deploy ke waqt in-flight page gaya** | Har deploy | Process restart hua aur `await twilio` beech mein tha -> DB mein incident hai, SMS nahi gaya, timeline mein kuch nahi |\n| 3 | **Doosra instance chahiye (HA)** | Jab pehla instance ek raat crash ho gaya aur koi page nahi gaya | Do instances par `setInterval` poller dono chalega -- `SKIP LOCKED` ki wajah se ye safe hai (achhi baat), par dono ek saath Twilio hit karenge aur provider rate limit lagega |\n| 4 | **Provider down = incident ka page gaya hi nahi** | Twilio ka pehla outage | Koi retry queue nahi hai. Inline `await` fail hua toh incident bana par page nahi gaya. **Ye exactly woh cheez hai jo is product ko bekaar bana deti hai** |\n| 5 | **Storm par DB thak gaya** | Pehla bada customer onboard hone par | 1,000 events ek minute mein = 1,000 dedup upserts + 1,000 timeline inserts sync path par |\n| 6 | **5 s polling = 5 s timer lag** | Jab customer bole \"escalation late tha\" | Poller 5 s par chalta hai, aur agar ek batch slow hai toh lag badhta hai |\n\n**Next version par kab jaayenge? (signals)**\n\n| Metric | Threshold (rough) | Matlab |\n|---|---|---|\n| Ingest p95 latency | > 1 s | Provider call sync path se hatao -> queue chahiye |\n| Provider failure se lost pages | > 0 (ek bhi) | Retry queue + DLQ chahiye, turant |\n| Instances | > 1 | Ab in-process assumptions tootne lagenge |\n| Events/day | > ~50,000 | DB ingest write path par pressure dikhne lagega |\n| `timer_lag_seconds` | > 10 s | Polling interval kam karo ya scheduler alag karo |\n| Deploy ke dauraan missed page | > 0 | Graceful shutdown + durable queue chahiye |\n\n### Version 2 -- Scalable (Redis + BullMQ + alag workers)\n\nYahan hum **sync path se provider call nikaal dete hain** aur pehli baar \"worker\" concept aata hai.\n\n```mermaid\nflowchart TD\n    M[Monitoring tools] --> LB[Load Balancer]\n    LB --> API1[Node API x3: validate, dedup upsert, enqueue]\n    LB --> API2[Node API]\n    API1 --> PG[(Postgres: incidents, timeline, escalation_timers, idempotency_keys)]\n    API1 --> RQ[[Redis BullMQ notifications queue]]\n    API1 --> RC[(Redis: svc cache, dedup fast path, ZSET timers)]\n    RQ --> W1[Notification Worker x4: p-limit concurrency]\n    RQ --> W2[Notification Worker]\n    W1 --> TW[Twilio SMS and Voice]\n    W1 --> FCM[FCM / APNs push]\n    W1 --> SG[SendGrid email]\n    W1 --> DLQ[[BullMQ failed queue = DLQ]]\n    SCH[Scheduler process x2] --> RC\n    SCH --> RQ\n    SCH --> PG\n    TW -- status webhook --> API1\n    R[Responder: app or SMS reply 4] --> API1\n```\n\n**Kitna traffic?** ~**1M-5M events/day** (12-60 eps average, storm 500 eps), ~50,000-250,000 incidents/day, ~150,000-750,000 notifications/day. 3-5 API instances, 4-8 notification workers, 2 scheduler instances.\n\n**Har naya component -- \"humne ye abhi kyun add kiya?\"**\n\n| Component | Kaunsa dard isko laaya | Kya milta hai |\n|---|---|---|\n| **BullMQ queue (Redis)** | V1 ka #1 aur #4 dard: Twilio inline tha, isliye ingest slow aur provider down par page gum | Ab API turant jawab deta hai aur worker Twilio call karta hai. Provider down -> job retry (BullMQ `attempts` + exponential backoff), 5 baar fail -> failed queue = **DLQ**. **Ek page ab provider outage mein kho nahi sakta** |\n| **Alag notification worker process** | Deploy ke waqt API restart hone se pages ruk rahe the; provider slow hone se API ka event loop bhar raha tha | Workers alag scale, alag deploy. API ka kaam sirf validate + DB + enqueue -- sub-100 ms |\n| **Redis `svc:\u003croutingKey>` cache** | Har event par ek Postgres `SELECT` sirf serviceId ke liye | 60 eps par 60 DB reads/sec bach gaye; TTL 300 s, service update par invalidate |\n| **Redis ZSET `sched:escalations` + scheduler process** | V1 ka `setInterval` DB polling storm mein DB ko aur dabata tha, aur 5 s lag deta tha | 1 s tick, atomic Lua claim, `timer_lag_seconds \u003c 2 s`. **Postgres `escalation_timers` table rehti hai** -- ab woh durable copy hai, aur 60 s recovery job Redis wipe ke baad rebuild karta hai |\n| **Redis dedup fast path (`dedup:\u003cserviceId>:\u003cdedupKey>`, TTL 6 h)** | 95% events duplicate hain -- har ek par DB upsert bekaar hai | Zyada tar duplicates DB tak pahunchte hi nahi. **Lekin source of truth phir bhi Postgres ka partial unique index hai** -- Redis eviction/failover par galat jawab = duplicate incident = duplicate page |\n| **Per-user notification rules + quiet hours** | Customers ne kaha \"raat 2 baje `warning` par mat bulao\" | `notification_rules` table, urgency mapping (`critical`/`error` = high, `warning`/`info` = low) |\n| **Circuit breaker per provider (`cb:\u003cprovider>`)** | Twilio 10 min down tha aur workers 5 retries x 30 s timeout karke atke rahe | 30 s window, >50% fail in >=20 req -> `open` 30 s -> `half-open` 5 probes. Open hote hi failover provider ya channel downgrade |\n| **`p-limit` bounded concurrency per provider** | Workers ne Twilio par 500 parallel calls maar diye -> `429 Too Many Requests` -> sab fail | Provider throughput se match karta cap (Twilio long code ~1 SMS/sec per number) |\n| **Idempotency keys table** | Customer ka client retry karta tha aur do incident ban jaate the | `Idempotency-Key` header -> 24 h stored response; same key + different body -> `409 IDEMPOTENCY_KEY_REUSED` |\n\n**Kya abhi bhi NAHI hai:** Kafka (replay nahi, multi-consumer nahi), per-channel worker pools, grouping / storm control, read replicas, multi-region, partitioning, S3 archive, Elasticsearch.\n\n**Kitna kharcha:** ek Redis (cache + queue + timers -- ek hi instance, jo khud ek risk hai), Postgres primary, ~10 processes. Ops abhi bhi ek chhoti team sambhal sakti hai.\n\n**Kya abhi bhi miss ho sakta hai (honest list):**\n\n- **Redis ek hi hai aur teen kaam kar raha hai** (cache + queue + timers). Woh gira toh queue gayi. BullMQ jobs Redis mein hain -- AOF `everysec` par bhi 1 s ka data ja sakta hai. Timers Postgres se recover ho jaate hain, par **queued notification jobs nahi**.\n- **Replay nahi hai** -- \"kal raat ka routing bug tha, dobara chalao\" possible nahi.\n- **Storm mein 1,000 incidents ek service se** -> 3,000 notifications -> responder ka phone 3,000 baar bajega. Grouping nahi hai.\n- **Analytics / audit consumers** nahi hain -- sab kuch ek hi path se guzarta hai.\n\n**Next version par kab jaayenge? (signals)**\n\n| Metric | Threshold (rough) | Matlab |\n|---|---|---|\n| Events/day | > ~10M (120 eps avg) | Single Redis ka throughput aur memory par dabaav |\n| `page_latency_seconds` p95 | > 5 s (SLO break) | Sync path ya worker pool bottleneck hai |\n| Redis memory / CPU | > 60-70% | Queue + cache + timers ek instance par -- ab alag karo |\n| Storm ka size | Ek service se 10+ incidents/min | Grouping chahiye, warna responder phone band kar dega |\n| \"Replay chahiye\" | Ek bhi baar | Kafka |\n| Doosra consumer (analytics, audit, billing) | Ek bhi | Kafka consumer groups |\n| `notification_send_duration_seconds{channel=\"voice\"}` push ki latency badha raha | -- | Per-channel pools |\n| Postgres `incidents` size | > 200 GB | Partitioning + S3 archive |\n\n### Version 3 -- Highly Scalable (poora spec design)\n\n```mermaid\nflowchart TD\n    M[Monitoring tools: Alertmanager, Datadog, Sentry, cron] --> LB[Load Balancer]\n    LB --> ING[Ingest API: N stateless Node.js, Express 5]\n    ING --> RLIM[Token bucket per routingKey]\n    ING --> SVCC[(Redis svc cache TTL 300s)]\n    ING --> K1[[Kafka incident-events: 24 partitions, key=serviceId, acks=all]]\n    ING -. Kafka down .-> SPOOL[Local disk spool ~60s, phir 503]\n    K1 --> IC[Incident Service: consumer group incident-service]\n    IC --> PGP[(Postgres primary: incidents partitioned, timeline, timers)]\n    IC --> GRP[Grouping counters in Redis]\n    IC --> K2[[Kafka notifications: 48 partitions, key=incidentId]]\n    IC --> ZS[(Redis ZSET sched:escalations)]\n    IC --> ET[(Postgres escalation_timers durable copy)]\n    SCHED[Scheduler x2: 1s atomic Lua claim] --> ZS\n    SCHED --> K3[[Kafka escalations]]\n    K3 --> IC\n    REC[Recovery job 60s: Postgres to ZADD NX] --> ZS\n    K2 --> WP[push workers]\n    K2 --> WS[sms workers]\n    K2 --> WV[voice workers]\n    K2 --> WE[email and slack workers]\n    WS --> CB[Circuit breaker + p-limit]\n    CB --> PROV[Twilio / MessageBird / FCM / APNs / SendGrid / Slack]\n    WS -. 5 fails .-> DLQ[[Kafka notifications-dlq]]\n    PROV -- status webhook, signature verified --> WH[Webhook API]\n    WH --> PGP\n    RESP[Responder: app, web, SMS reply 4, voice DTMF 4] --> ACK[Ack API: optimistic lock]\n    ACK --> PGP\n    ACK --> ZS\n    PGP --> RR[(2 read replicas: dashboards)]\n    PGP --> S3[(S3 + Parquet: incidents older than 90 days)]\n    K1 --> AN[Analytics and audit consumer groups]\n```\n\n**Kitna traffic?** Spec wale numbers: **50M events/day (579 eps avg, ~6,000 eps storm peak), 2.5M incidents/day (29/sec avg, ~300/sec peak), 7.5M notifications/day (87/sec avg, ~1,000/sec peak)**, 20,000 accounts, 500,000 responders, 100,000 services.\n\n**Har naya component -- \"humne ye abhi kyun add kiya?\"**\n\n| Component | Kaunsa dard isko laaya | Keemat |\n|---|---|---|\n| **Kafka `incident-events` (24 partitions, key=`serviceId`)** | (a) Replay chahiye tha -- routing bug ke baad 7 din ke events dobara; (b) analytics + audit consumers ko same stream chahiye; (c) 6,000 eps par Redis queue se durability comfort nahi; (d) ingest ko DB se **poori tarah** decouple karna tha | Ops: brokers, ISR, rebalance, consumer lag monitoring. Aur **per-message delay/retry Kafka se nahi milta** -- woh worker ke andar hi karna padta hai |\n| **Local disk spool + `503`** | Kafka down par kya? Memory buffer = restart par events gaye; `200` bolna = jhoot | ~60 s ka bounded spool; uske baad **fail closed** (`503 INGEST_UNAVAILABLE`), taaki customer ka monitoring khud retry kare. Rate limiter mein hum fail-open the; yahan ulta |\n| **Alag Incident Service consumer group** | Ingest ko sirf \"accept\" karna hai; dedup/routing/state machine ka scaling profile alag hai | Ek aur deployable; consumer lag ek naya SLI |\n| **Kafka `notifications` (48 partitions, key=`incidentId`)** | Notification workers ko incident service se alag scale karna tha (1,000/sec peak); aur per-channel pools chahiye the | Ek aur topic, partition planning |\n| **Per-channel worker pools** | Voice ka 20 s round trip push ke 50 ms ko kha raha tha (head-of-line blocking) | 4 deployments, 4 dashboards |\n| **Grouping / storm control (`grp:\u003cserviceId>:\u003cminute>`)** | Ek DC down -> ek service se 200 incidents/min -> responder ka phone unusable | Individual notifications collapse ho jaati hain (\"checkout: 63 new incidents\") -- **incidents phir bhi bante hain** (audit chahiye). Trade-off: us group mein ek specific incident ka apna page nahi jaata |\n| **Circuit breaker + failover provider (Twilio -> MessageBird)** | Twilio ka region outage = poora paging band | Do provider contracts, do sets of numbers, message format differences |\n| **Postgres partitioning (monthly) + read replicas + S3 archive** | ~450 GB hot data; dashboards ki queries primary ko dabaa rahi thi | Partition maintenance job; replica lag (dashboard 1-2 s purana dikhega -- acceptable) |\n| **Scheduler x2 with atomic Lua claim + recovery job** | Ek scheduler = single point of failure; do scheduler bina atomic claim = duplicate escalation | Leader election ki zarurat **nahi** (claim atomic hai). Leader-based design bhi valid hai, par woh khud ek SPOF banta hai |\n| **`notifications-dlq` + DLQ worker** | 5 attempts ke baad kahan jaaye? Chup-chaap drop karna = missed page | DLQ depth alert (`dlq_depth > 0` page-worthy hai), manual replay tool |\n| **OpenTelemetry tracing** | \"Ye page 40 s late kyun gaya?\" -- 5 processes ke beech answer dhoondhna | `eventId` -> `incidentId` -> `taskId` ek hi trace mein |\n\n**Keemat (honest):** ~5 deployable services, Kafka cluster, Redis, Postgres + 2 replicas, 2 provider contracts, S3, poora observability stack. Ye ek **platform team** ka kaam hai, 3 logon ka nahi. Isliye V3 tabhi jab signals bolein.\n\n### Kaunsa version, kitna traffic?\n\n| Traffic level | Events/day | Version | Kaunsa component decide karta hai |\n|---|---|---|---|\n| Hobby / internal tool | \u003c 5,000 | **V1** (aur sach mein: PagerDuty kharid lo) | Ek Postgres + `setInterval` |\n| Chhota SaaS | 5,000 - 500,000 | **V1 + queue** (V1.5) | Provider call sync path se hatani padegi |\n| Growing product | 500,000 - 10M | **V2** (Redis + BullMQ + workers + scheduler) | Ek Redis, ek queue, ek pool |\n| Real product | 10M - 100M | **V3** (Kafka + per-channel pools + grouping) | Replay, multi-consumer, storm control |\n| PagerDuty scale | > 100M | V3 + multi-region + cell-based isolation | Blast radius: ek customer ka storm doosre customers ko na chhue |\n\n### Teeno versions side by side\n\n| | V1 MVP | V2 Scalable | V3 Highly Scalable |\n|---|---|---|---|\n| Events/day | Kuch sau -- 50K | 1M - 10M | 50M (6,000 eps peak) |\n| Ingest | Sync `201` + `incidentId` | Sync DB + async notify | Async `202` + `dedupKey`, Kafka `acks=all` |\n| Event bus | Koi nahi (in-process) | BullMQ (Redis) | Kafka 24 partitions + replay |\n| Dedup | Postgres partial unique index | Redis fast path + Postgres index | Same (Redis fast path, Postgres truth) |\n| Timers | `escalation_timers` + `setInterval` 5 s + `SKIP LOCKED` | Redis ZSET + Postgres copy + 1 s scheduler | Same + 2 scheduler instances + 60 s recovery job |\n| Notification | Inline `await twilio` | Wor
