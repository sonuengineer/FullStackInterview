xpect, beforeEach } from 'vitest';\n\ndescribe('IncidentService', () => {\n  let t: number;\n  let store: InMemoryIncidentStore;\n  let scheduler: InMemoryEscalationScheduler;\n  let service: IncidentService;\n\n  beforeEach(() => {\n    t = 0;\n    const clock: Clock = () => t;\n    store = new InMemoryIncidentStore(clock);\n    scheduler = new InMemoryEscalationScheduler();\n    service = new IncidentService(store, routing, scheduler, dispatcher, clock);\n  });\n\n  it('same dedupKey ka doosra trigger naya incident nahi banata', () => {\n    const a = service.handleEvent(ev('trigger', 'k1', 'CPU high'), 'svc_checkout');\n    const b = service.handleEvent(ev('trigger', 'k1', 'CPU high'), 'svc_checkout');\n    expect(a.kind).toBe('created');\n    expect(b.kind).toBe('deduped');\n    expect((b as { incident: Incident }).incident.occurrenceCount).toBe(2);\n    expect(store.openCount).toBe(1);\n  });\n\n  it('resolve ke baad wahi dedupKey naya incident banata hai', () => {\n    service.handleEvent(ev('trigger', 'k1', 'CPU high'), 'svc_checkout');\n    service.resolve('inc_1', 'u_priya');\n    const again = service.handleEvent(ev('trigger', 'k1', 'CPU high'), 'svc_checkout');\n    expect(again.kind).toBe('created');\n  });\n\n  it('5 minute tak ack na ho toh level 2 par escalate hota hai', async () => {\n    service.handleEvent(ev('trigger', 'k1', 'CPU high'), 'svc_checkout');\n    t = 4 * 60_000;\n    expect(await scheduler.claimDue(t, 10)).toHaveLength(0);   // abhi nahi\n    t = 5 * 60_000;\n    const due = await scheduler.claimDue(t, 10);\n    expect(due).toHaveLength(1);\n    service.onEscalationTimer(due[0]);\n    expect(store.getById('inc_1')!.escalationLevel).toBe(2);\n  });\n\n  it('ack saare pending timers cancel kar deta hai', async () => {\n    service.handleEvent(ev('trigger', 'k1', 'CPU high'), 'svc_checkout');\n    service.acknowledge('inc_1', 'u_priya');\n    t = 10 * 60_000;\n    expect(await scheduler.claimDue(t, 10)).toHaveLength(0);\n    expect(scheduler.pending).toBe(0);\n  });\n\n  it('ack ke baad aaya hua timer ignore hota hai (zombie timer)', () => {\n    service.handleEvent(ev('trigger', 'k1', 'CPU high'), 'svc_checkout');\n    service.acknowledge('inc_1', 'u_priya');\n    service.onEscalationTimer({ timerId: 'zombie', incidentId: 'inc_1', level: 1, dueAtMs: t });\n    const inc = store.getById('inc_1')!;\n    expect(inc.status).toBe('acknowledged');\n    expect(inc.escalationLevel).toBe(1);\n  });\n\n  it('doosra ack error nahi deta (idempotent)', () => {\n    service.handleEvent(ev('trigger', 'k1', 'CPU high'), 'svc_checkout');\n    service.acknowledge('inc_1', 'u_rahul');\n    const second = service.acknowledge('inc_1', 'u_priya');\n    expect(second.kind).toBe('acknowledged');\n    expect(store.getById('inc_1')!.acknowledgedBy).toBe('u_rahul');   // pehla jeeta\n  });\n});\n```\n\n**Code Explanation:**\n\n- `let t = 0; const clock = () => t;` -- **poore test suite ka dil.** `t = 5 * 60_000` likhkar hum \"5 minute beet gaye\" simulate karte hain. Agar code ke andar `Date.now()` hota, ya `setTimeout` hota, toh is ek test ke liye asli 5 minute lagte -- aur 6 tests = 30 minute. **CI mein koi aisa test suite nahi rakhega, isliye woh test likha hi nahi jaayega, isliye escalation bug production mein milega.** Clock injection ek testing trick nahi, ek **reliability decision** hai.\n- `beforeEach` har test ke liye fresh store + scheduler -- tests ek doosre ka state na dekhein.\n- Test 1 (dedup) aur test 2 (resolve ke baad naya) -- **dedup contract ke dono aadhe hisse.** Ek ke bina doosra adhoora hai; dono hamesha saath likho.\n- Test 3 (escalate) mein `t = 4 * 60_000` par `claimDue` **khaali** -- ye assertion utna hi important hai jitna t=5min wala. \"Jaldi fire nahi hona chahiye\" bhi ek requirement hai.\n- Test 4 (cancel) -- ack ke baad `t` ko 10 minute aage le jaake bhi kuch due nahi. Ye \"ack ke baad page nahi\" ka direct proof hai.\n- Test 5 (zombie) -- scheduler ko bypass karke seedha `onEscalationTimer` call kiya. **Guard ko unit test karna** hai, cancel path ko nahi.\n- Test 6 (idempotent ack) -- `acknowledgedBy` pehle wale par rehta hai. CAS ka behaviour.\n- Kya aur test karna: `resolve` while escalating, full jitter `rand` inject karke exact backoff sequence (`rand = () => 0` -> 0 ms, `rand = () => 0.999` -> ~cap), unverified contact method skip, aur grouping threshold.\n\n### Step 12 -- Complexity\n\nPehle symbols fix karo:\n\n- **I** = active (non-resolved) incidents\n- **N** = pending escalation timers\n- **k** = ek tick mein due timers\n- **L** = escalation policy ke levels\n- **O** = us schedule ke overlapping overrides\n- **R** = ek user ke notification rules (typically 2-3)\n\n| Operation | Time | Space | Kyun |\n|---|---|---|---|\n| `handleEvent` -> `upsertOnTrigger` | **O(1)** | O(1) | Do `Map` lookups (`openByDedup`, `byId`). Production mein ek indexed `INSERT ... ON CONFLICT` -- B-tree lookup, effectively O(log I) |\n| `handleEvent` -> `acknowledge` / `resolve` | **O(1)** + cancel cost | O(1) | Ek `Map` get + CAS. Cancel neeche |\n| `page()` (notify + arm timer) | **O(R)** | O(R) | Har user rule ke liye ek task. `R` chhota aur bounded (per-user rules 2-3) |\n| `resolveOnCall(scheduleId, at)` | **O(L + O)** | O(1) | Layers par ek pass (rotation index ek modulo hai, loop nahi) + overlapping overrides. Production mein `schedule_overrides (schedule_id, starts_at, ends_at)` index se `O` chhota rehta hai |\n| Scheduler tick -- **Redis ZSET** | **O(log N + k)** | O(N) | `ZRANGEBYSCORE ... LIMIT 0, k` = `O(log N + k)`, `ZREM` per member `O(log N)`. Yahi reason hai ki ZSET chuna gaya |\n| Scheduler tick -- in-memory demo impl | **O(N log N)** | O(N) | `filter` + `sort` har tick par. Interview mein theek, production mein nahi -- aur yahi bolna ki \"isliye ZSET\" |\n| `cancelForIncident` (in-memory) | **O(N)** / **O(P)** | O(1) | Poora scan. Production: `escalation_timers (incident_id)` index -> `O(log N + cancelled)` |\n| `deliver()` ek task | **O(attempts)** = O(5) | O(1) | Bounded retries; backoff `sleep` mein time jaata hai, CPU nahi |\n| Memory -- active incidents | -- | **O(I)** | Spec: ~3,500 typical, storm mein ~50,000. 50K x ~100 B ZSET member = **~5 MB** -- trivial |\n\n> Interview line: \"`handleEvent` O(1) hai kyunki dedup ek index lookup hai, scan nahi. Scheduler O(log N + k) hai kyunki ZSET sorted hai aur hum sirf due prefix uthate hain. Memory O(active incidents) hai -- hamare numbers par 50,000 timers ka matlab ~5 MB, yaani **timers memory problem nahi hain.** Asli problem poll fairness aur duplicate fire hai, aur woh atomic Lua claim se solve hoti hai, badi machine se nahi.\"\n\n---\n\n## PART 27 -- 30-Second Answer\n\n> \"At a high level, monitoring tools hamari Events API par `POST /v2/enqueue` karte hain. Ingest API routing key validate karke, per-key rate limit lagakar, event ko Kafka `incident-events` par `acks=all` ke saath likhti hai aur **202 Accepted** deti hai -- yahan hum **fail closed** hain, kyunki jo page deliver nahi kar sakte usko accept karna galat hai. Incident Service consume karke dedup karti hai -- `(serviceId, dedupKey)` par Postgres ka **partial unique index** jo sirf non-resolved rows par lagta hai, isliye 50 million events se sirf 2.5 million incidents bante hain. Naya incident bane toh escalation policy plus on-call schedule se sahi insaan nikalta hai, notification tasks Kafka `notifications` par jaate hain -- per-user rules ke hisaab se 0 min push, 1 min SMS, 5 min voice -- aur ek escalation timer **Redis ZSET** mein armed hota hai jiski durable copy Postgres mein hai. Scheduler har second atomic Lua claim se due timers uthata hai; ack na ho toh agle level par page, ack ho jaaye toh timers aur pending notifications dono cancel. Guiding principle: **duplicate page is OK, missed page is NOT** -- isliye poora system at-least-once hai.\"\n\n(Bolne mein ~45 seconds. Ingest decision, dedup mechanism, timer mechanism, ek principle -- bas.)\n\n---\n\n## PART 28 -- 5-Minute Interview Answer (natural Hinglish)\n\n> Ise ratna nahi hai. Har minute ka **goal** yaad rakho; words apne aap aayenge. Beech-beech mein check-in: \"Is this direction okay?\"\n\n### Minute 1 -- requirements clarify\n\n\"Main pehle requirements clarify karunga. Hum PagerDuty jaisa on-call alerting bana rahe hain: monitoring tools event bhejte hain, hum incident banate hain, sahi on-call insaan ko dhoondhte hain, aur usko phone par page karte hain jab tak woh acknowledge na kare.\n\nFunctional side par paanch cheezein: ek **Events API** with `trigger`, `acknowledge`, `resolve`; **dedup** taaki har 30-second repeat naya incident na bane; **escalation policy** with levels aur ack timeout; **multi-channel delivery** -- push, SMS, voice, email, Slack; aur **acknowledge** jo saara pending kaam cancel kar de.\n\nNon-functional mein mere liye sabse upar **reliability** hai. Ek page ka miss hona matlab production down hai aur kisi ko pata hi nahi chala. Isliye mera guiding principle hai: **duplicate page is OK, missed page is NOT.** Iska seedha matlab hai ki poora system at-least-once hoga, exactly-once ke peeche main nahi bhagunga.\n\nDoosra, **latency**: event accept se pehli notification provider ko handover tak p95 5 second se kam, p99 10 second. Paging hi product hai -- 2 minute late page bekaar hai. Teesra, ingest par **99.99% availability**, kyunki customer ka monitoring tab bolta hai jab uska system already jal raha ho.\"\n\n### Minute 2 -- scale estimate\n\n\"Numbers maan lete hain: 20,000 accounts, 500,000 responder users, 100,000 services.\n\n**50 million events per day** -- 50 million by 86,400 = roughly **580 events per second average**. Lekin alert storm normal hai -- ek data center gira toh sab kuch ek saath bolta hai -- toh peak main 10x maanunga, **~6,000 events per second**.\n\nAb ek important insight: **dedup ratio ~95% hai**, kyunki monitoring har 30-60 second wahi alert repeat karta hai jab tak problem zinda hai. Toh 50 million events se sirf **2.5 million incidents** -- yaani ~29 incidents per second average, peak ~300. Matlab **ingest bahut heavy hai, par asli kaam bahut kam hai** -- yahi is system ka main leverage point hai.\n\nNotifications: average 3 per incident -- push, SMS, phir ek escalation -- toh **7.5 million per day**, ~87 per second average, peak ~1,000.\n\nAur ek number jo interviewer ko pasand aata hai: SMS $0.0075 par, 2.25 million SMS = **~$17,000 per day**. Voice ~$5,000 per day. Isliye channel order push -> SMS -> voice hai: **cost bhi ek design constraint hai, sirf latency nahi.**\n\nActive incidents kisi bhi moment par ~3,500 typical, storm mein ~50,000. 50,000 timers Redis ZSET mein ~5 MB hain -- **timers memory problem nahi hain, poll fairness aur duplicate-fire problem hain.**\"\n\n### Minute 3 -- architecture aur request flow\n\n\"Initially main simple rakhunga -- ek **modular monolith**, microservices nahi. Ek codebase mein ingest, incident aur notify modules, alag deploys optional.\n\nFlow aisa hai: client `POST /v2/enqueue` karta hai. Load balancer se stateless Node.js ingest instances par jaata hai. Ingest teen kaam karta hai -- routing key se serviceId lookup, jo Redis mein 300 second cache hai; per-routing-key **token bucket rate limit**, taaki ek customer ka alert storm baaki sabko na maare; aur validate karke event ko **Kafka `incident-events`** par `acks=all` se likhna. Commit hone ke baad hi **202 Accepted** with dedupKey.\n\n201 nahi, **202**, kyunki processing async hai aur incident abhi bana hi nahi -- main incidentId de hi nahi sakta. Trade-off ye hai ki client ko turant incident id nahi milta; fayda ye hai ki storm mein ingest ka path DB se decoupled hai.\n\nKafka 24 partitions, key = `serviceId` -- toh ek service ke events ordered rehte hain. Incident Service consumer group padhti hai, dedup karti hai, routing karti hai, notification tasks `notifications` topic par daalti hai (48 partitions, key = incidentId), aur escalation timer arm karti hai. Notification workers provider adapters chalate hain. Providers delivery status webhook se wapas bolte hain.\n\nPostgres primary plus do read replicas -- dashboard queries replicas se. Redis routing key cache, dedup fast path, timers, locks aur grouping counters ke liye.\n\nEk cheez main **jaan-boojh kar nahi** le raha: CDN. Yahan kuch cache hota hi nahi, sab write path hai. Aur Elasticsearch v1 mein nahi -- incident search Postgres se chal jaati hai.\"\n\n### Minute 4 -- deep dive: dedup aur timers\n\n\"Do mechanisms par main deep dive karna chahunga, kyunki poora system inhi par khada hai.\n\n**Pehla, dedup.** Main Postgres par ek **partial unique index** rakhta hoon: `(service_id, dedup_key)` par, `WHERE status \u003c> 'resolved'`. Phir `INSERT ... ON CONFLICT ... DO UPDATE SET occurrence_count = occurrence_count + 1 RETURNING (xmax = 0) AS inserted`. `xmax = 0` batata hai ki row naya insert hua -- agar haan toh page karo, warna sirf counter badha aur chup raho. Redis mein bhi ek fast path key hai 6 ghante TTL ke saath, lekin **source of truth Postgres ka index hai**, kyunki Redis eviction ya failover par duplicate incident ban sakta hai. Aur partial isliye ki incident resolve hote hi wahi dedupKey free ho jaaye -- warna problem dobara aane par kabhi page hi nahi jaayega.\n\n**Doosra, timers.** `setTimeout` bilkul nahi -- process crash ya deploy matlab timer gaya, matlab page gaya. Main timer ko ek row banata hoon: Redis **ZSET `sched:escalations`**, member = timerId, score = dueAt milliseconds. Scheduler har second ek **atomic Lua script** chalata hai jo `ZRANGEBYSCORE` se due nikalta hai aur usi script mein `ZREM` kar deta hai -- claim aur remove ek step mein, isliye do scheduler instances same timer do baar fire nahi kar sakte. Leader election ki zarurat hi nahi, aur do instances chal sakte hain.\n\nAur **durable copy Postgres `escalation_timers` mein hai.** Timers ko sirf Redis mein rakhna is system ki sabse badi galti hoti -- ek failover matlab us window ke saare escalations gayab. Har 60 second ek recovery job DB se pending timers padhkar `ZADD NX` karta hai.\n\nAck aane par teen cheezein hoti hain: timer row `cancelled`, Redis se `ZREM`, aur queued notifications `cancelled`. Plus worker bhejne se **theek pehle** dobara check karta hai ki incident abhi bhi triggered hai -- kyunki task already queue mein ho sakta hai. Cancellation best-effort hai, ye last-moment check guarantee hai.\"\n\n### Minute 5 -- trade-offs aur failure\n\n\"At scale yahan **bottleneck notification providers ho sakte hain**, hamara apna code nahi. Twilio ka ek long code ~1 SMS per second deta hai, aur peak par hamein ~1,000 notifications per second chahiye. Iska matlab multiple sender numbers, provider-side queue, aur workers par **per-provider concurrency cap** -- jo basically wahi rate limiter hai jo humne pichhle system mein banaya tha. Doosra bottleneck storm mein Postgres write throughput hai; uska jawab `serviceId` par partition, monthly table partitions, aur 90 din se purana data S3 Parquet mein.\n\nFailures: **Redis gir gaya** toh timers ZSET se gayab -- recovery job Postgres se rebuild karta hai, escalations kuch second late hoti hain par khoti nahi. **Kafka down** toh ingest local disk par ~60 second spool karta hai aur uske baad **503 INGEST_UNAVAILABLE**. Ye important hai -- **hum ingest par fail closed hain.** Rate limiter mein hum fail **open** the, wahan limiter ki failure se API nahi girni chahiye thi. Yahan ulta hai: **accepting a page you cannot deliver is worse than rejecting it loudly**, kyunki customer ka monitoring 503 dekhkar retry karega ya apne fallback par jaayega, jabki jhootha 202 uska alert chup-chaap kha jaata. **Ek provider down** toh per-provider circuit breaker 30 second ke liye open, failover provider ya channel downgrade.\n\nHowever, Redis source of truth nahi hai -- na dedup ke liye, na timers ke liye. Woh sirf speed layer hai, aur dono jagah Postgres peeche khada hai.\n\nOne trade-off here is **at-least-once vs exactly-once**. Kafka consumers manual commit karte hain DB write ke baad, toh crash par message dobara aa sakta hai. Duplicate SMS `notifications.task_id` unique index aur provider-side idempotency key se mostly ruk jaata hai, par 100% guarantee nahi -- aur main ye accept karta hoon, kyunki exactly-once ki keemat latency aur complexity hai, aur hamara principle kehta hai duplicate page chalega, missed page nahi.\n\nDoosra trade-off: **202 async ingest vs synchronous incident creation.** Sync banate toh client ko turant incidentId milta, lekin ingest DB se coupled ho jaata aur storm mein sabse pehle wahi girta -- theek us waqt jab system ki sabse zyada zarurat hai.\n\nSummary: fail-closed ingest par 202, Kafka se durable event log, Postgres partial unique index se dedup, Redis ZSET plus durable copy se timers, at-least-once delivery with per-task idempotency, aur ack par teen-layer cancellation. Kisi part mein deep dive karein?\"\n\n---\n\n## PART 29 -- Whiteboard Drawing Order\n\n**Rule:** diagram ek saath mat banao. Har box tab draw karo jab uska **reason** bol rahe ho. Is system mein ek extra rule: board par **left se right ek hi line** rakho -- event andar, page bahar -- aur ack ka loop sabse aakhir mein neeche se wapas laao. Woh loop hi is system ki kahani ka end hai.\n\n### Step 1 -- Client / monitoring tools\n\n```\n[Prometheus Alertmanager | Datadog | Sentry | cron jobs | custom scripts]\n```\n\n**Ab interviewer ko kya bolna hai?**\n\n> \"Input insaan nahi, **machines** hain. Ye har 30-60 second wahi alert repeat karti hain jab tak problem zinda hai -- isliye 95% traffic duplicate hai aur dedup pehla design decision ban jaata hai.\"\n\n**Ye box kaunsa sawaal invite karta hai:** \"Dedup kaise karoge?\" -- perfect, tumhara sabse strong answer.\n\n### Step 2 -- Load Balancer\n\n```\n[Monitoring tools] --POST /v2/enqueue--> [Load Balancer]   TLS, routingKey = secret\n```\n\n**Ab interviewer ko kya bolna hai?**\n\n> \"Stateless ingest instances ke aage LB. `routingKey` yahan ek API key ki tarah treat hoti hai -- secret, per-service, revocable. Availability target 99.99% isi path par hai, kyunki customer tab bolta hai jab uska system already jal raha ho.\"\n\n**Invite:** \"99.99% kaise? Multi-AZ?\" -- ready rakho: N instances across AZs, health checks, no sticky state.\n\n### Step 3 -- Ingest API\n\n```\n[Load Balancer]\n      |\n      v\n[Ingest API -- N stateless Node.js (Express 5)]\n   |-- routingKey -> serviceId (Redis svc:\u003croutingKey>, TTL 300s; Postgres fallback)\n   |-- rate limit per routingKey (token bucket)\n   |-- validate + Idempotency-Key\n   |-- produce to Kafka (acks=all)  ==>  202 Accepted { dedupKey }\n```\n\n**Ab interviewer ko kya bolna hai?**\n\n> \"Ingest sirf teen kaam karta hai: pehchaano, throttle karo, durable likho. Kuch bhi bhaari nahi. **202, 201 nahi** -- incident abhi bana hi nahi, main incidentId de hi nahi sakta. Aur Kafka down ho toh ~60 second disk spool, phir **503 -- fail closed.** Jo page deliver nahi kar sakte usko accept karna, reject karne se bura hai.\"\n\n**Invite:** \"202 kyun, client ko id kyun nahi dete?\" aur \"fail open kyun nahi?\" -- dono ke jawab upar hain.\n\n**Board abhi aisa dikhta hai (stage 1):**\n\n```\n[Monitoring tools: Prometheus | Datadog | Sentry | cron]\n                    |\n              POST /v2/enqueue\n                    v\n            [Load Balancer]\n                    v\n        [Ingest API -- N stateless Node]\n          routingKey -> serviceId (Redis)\n          rate limit per routingKey\n          validate -> produce -> 202 Accepted\n                    |\n             (Kafka down? spool 60s -> 503, FAIL CLOSED)\n```\n\n### Step 4 -- Kafka `incident-events`\n\n```\n[Ingest API] --> [Kafka: incident-events]  24 partitions, key = serviceId, retention 7d\n```\n\n**Ab interviewer ko kya bolna hai?**\n\n> \"Kafka isliye, RabbitMQ nahi: **replay** chahiye -- bug fix karke 7 din ke events dobara process kar sakein; **ordering per service** chahiye, isliye key = serviceId; aur **multiple independent consumer groups** chahiye -- incident service, analytics, audit. 24 partitions = peak 6,000 events per second, ~250 per partition ka safe budget.\"\n\n**Invite:** \"Partitions kaise nikale?\" -- peak / per-partition budget. Aur \"RabbitMQ kyun nahi?\" -- replay + multi-consumer.\n\n### Step 5 -- Incident Service\n\n```\n[Kafka incident-events] --> [Incident Service -- consumer group 'incident-service']\n                               |-- dedup + state machine\n                               |-- routing: policy -> level -> schedule -> on-call user\n                               |-- produce notification tasks\n                               |-- arm escalation timer\n```\n\n**Ab interviewer ko kya bolna hai?**\n\n> \"Yahan asli dimaag hai. Dedup se 50 million events **2.5 million incidents** ban jaate hain. State machine `triggered -> acknowledged -> resolved` hai, aur routing escalation policy se level, level se schedule, schedule se rotation index nikalti hai. Consumer `enable.auto.commit=false` hai -- DB write ke **baad** commit, isliye at-least-once.\"\n\n**Invite:** \"Duplicate processing?\" -> `taskId` unique index. \"Rotation math?\" -> `floor((at - handoffAt) / rotationLengthMs) % members.length`, aur **DST** ka jawab taiyaar rakho: UTC instants store karo, IANA timezone se compute karo.\n\n### Step 6 -- Postgres\n\n```\n[Incident Service] --> [Postgres primary + 2 read replicas]\n    incidents (monthly partitions)\n      UNIQUE (service_id, dedup_key) WHERE status \u003c> 'resolved'   \u003c-- THE index\n    incident_events (timeline), notifications, notification_attempts,\n    escalation_timers (durable copy), services, escalation_policies/rules,\n    schedules/layers/overrides, users, contact_methods, notification_rules, idempotency_keys\n```\n\n**Ab interviewer ko kya bolna hai?**\n\n> \"Postgres isliye: data relational hai -- service se policy se schedule se user; incident, timeline aur timer **ek transaction** mein chahiye; aur dedup ke liye **partial unique index** chahiye jo sirf non-resolved rows par lage. `ON CONFLICT ... RETURNING (xmax = 0)` batata hai ki page karna hai ya nahi. Monthly partitions se 90-din retention aur S3 archive easy. MongoDB isliye nahi ki yahan multi-entity transactional correctness core hai.\"\n\nBoard par is index ko **box karke highlight** karo. Agar interviewer ek hi cheez yaad rakhe, ye rakhe.\n\n**Board abhi aisa dikhta hai (stage 2):**\n\n```\n[Monitoring tools]\n      |\n      v\n[LB] -> [Ingest API] --202--> client\n              |\n              v\n      [Kafka incident-events]  24p, key=serviceId\n              |\n              v\n      [Incident Service]  dedup -> state machine -> routing\n        |            |\n        |            v\n        |      [Postgres]  incidents + timeline + timers\n        |        UNIQUE (service_id, dedup_key) WHERE status \u003c> 'resolved'\n        v\n   (notification tasks + escalation timer -- next)\n```\n\n### Step 7 -- Redis ZSET + Scheduler\n\n```\n[Incident Service] --ZADD--> [Redis ZSET sched:escalations]  member=timerId, score=dueAtMs\n                                        ^         |\n                    ZADD NX, every 60s  |         | every 1s: atomic Lua\n                          [Postgres escalation_timers]      ZRANGEBYSCORE + ZREM\n                                                  v\n                                         [Scheduler Service x2]\n                                                  |\n                                                  v\n                                         [Kafka escalations]\n```\n\n**Ab interviewer ko kya bolna hai?**\n\n> \"`setTimeout` nahi -- crash matlab timer gaya matlab page gaya. Timer ek **row** hai. Redis ZSET mein score = dueAt, aur scheduler har second ek **atomic Lua** chalata hai jo due nikalta aur usi step mein `ZREM` kar deta hai. Isliye do scheduler instances safe hain, leader election ki zarurat nahi. Aur durable copy Postgres mein hai -- Redis wipe hone par recovery job `ZADD NX` se rebuild karta hai. **Timers sirf Redis mein rakhna is system ki sabse badi galti hogi.**\"\n\n**Invite:** \"DB polling se kyun nahi?\" -> `FOR UPDATE SKIP LOCKED` chhote scale par bilkul sahi hai; 50K active timers aur 1-second granularity par ZSET sasta padta hai. \"SQS delay?\" -> max 15 minute, hamara 60 minute escalation fit nahi hota.\n\n### Step 8 -- Notification Workers\n\n```\n[Kafka notifications] 48p, key=incidentId --> [Notification Workers -- 'notification-workers']\n    |-- per-user rules (0 min push, 1 min sms, 5 min voice) + quiet hours + grouping\n    |-- CANCELLED check right before send\n    |-- retry: full jitter, 5 attempts -> [Kafka notifications-dlq]\n    |-- circuit breaker per provider (cb:\u003cprovider>)\n```\n\n**Ab interviewer ko kya bolna hai?**\n\n> \"Workers per-user rules apply karte hain -- push pehle kyunki woh free aur instant hai, SMS 1 minute baad, voice 5 minute baad kyunki mehnga hai par jagata hai. Bhejne se **theek pehle** cancelled-check, warna ack ke baad SMS jaata hai -- ye product ki number one complaint hai. Retry full jitter se, warna 1,000 workers ek saath wapas aake provider ko dobara gira denge. Aur per-provider concurrency cap -- Twilio long code ~1 SMS per second deta hai.\"\n\n**Invite:** \"Alert storm?\" -> Redis `grp:\u003cserviceId>:\u003cminute>` counter, >10 par grouped page (\"checkout: 63 new incidents\"), incidents phir bhi bante hain.\n\n### Step 9 -- Providers + delivery webhooks\n\n```\n[Notification Workers] --> [FCM/APNs | Twilio SMS | Twilio Voice | SendGrid | Slack]\n                                        |\n                          delivery status webhook (signature verified)\n                                        v\n                               [Webhook API] --> [Postgres] + metrics\n```\n\n**Ab interviewer ko kya bolna hai?**\n\n> \"Providers hamare control mein nahi hain, isliye teen cheezein: **circuit breaker** (30 s window, >50% fail in >=20 requests -> open 30 s -> half-open 5 probes), **failover** (Twilio -> MessageBird) ya channel downgrade, aur **delivery webhooks** -- 'sent' aur 'delivered' alag cheezein hain, aur hum dono track karte hain. Webhook ki signature verify karna mandatory hai, warna koi bhi jhoothi delivery report bhej sakta hai.\"\n\n### Step 10 -- Responder ack loop (yahi kahani ka end hai)\n\n```\n[Responder: mobile app | web | email link | SMS reply \"4\" | voice DTMF \"4\"]\n        |\n        v  POST /api/v1/incidents/:id/acknowledge\n[Incidents API] --> [Incident Service]\n        |-- CAS: UPDATE ... WHERE status='triggered' AND version=$n\n        |-- escalation_timers -> 'cancelled', ZREM from Redis\n        |-- queued notifications -> 'cancelled'\n        '-- timeline: acknowledged\n```\n\n**Ab interviewer ko kya bolna hai?**\n\n> \"Ack char raaston se aa sakta hai -- app, web, email link, SMS reply '4' aur voice DTMF '4' -- lekin sab ek hi service method par milte hain, isliye behaviour identical hai. Do responder ek saath ack karein toh optimistic lock se ek jeetta hai aur doosre ko **error nahi, current state** milti hai. Aur ack teen cheezein cancel karta hai: timer row, Redis ZSET entry, aur queued notifications -- plus worker ka last-moment check chautha safety net hai.\"\n\n**Yahi woh box hai jahan poora loop band hota hai.** Board par is arrow ko workers se wapas Incident Service tak khincho, taaki cycle dikhe.\n\n### Final board\n\n```\n   [Monitoring tools: Prometheus | Datadog | Sentry | cron]\n                       |  POST /v2/enqueue\n                       v\n                 [Load Balancer]\n                       v\n         [Ingest API -- N stateless Node.js]  ---> 202 Accepted { dedupKey }\n           routingKey -> serviceId (Redis 300s)     (Kafka down: spool 60s -> 503 FAIL CLOSED)\n           token bucket per routingKey\n                       |\n                       v\n         [Kafka incident-events]  24p, key = serviceId, 7d\n                       |\n                       v\n         [Incident Service]  dedup -> state machine -> routing -> tasks + timer\n              |                    |                          |\n              |                    v                          v\n              |        [Postgres primary + 2 replicas]   [Redis ZSET sched:escalations]\n              |          incidents (monthly partitions)        ^        |  1s atomic Lua\n              |          UNIQUE(service_id, dedup_key)         |        |  ZRANGEBYSCORE+ZREM\n              |            WHERE status \u003c> 'resolved'  \u003c--- THE INDEX   v\n              |          incident_events, notifications,  |     [Scheduler x2] -> [Kafka escalations]\n              |          escalation_timers (durable) -----'              |\n              |                                                         |\n              v                                                         |\n     [Kafka notifications] 48p, key = incidentId  \u003c----------------------'\n              |\n              v\n     [Notification Workers]  rules (0 push / 1 sms / 5 voice), quiet hours,\n              |              grouping, CANCELLED check, full-jitter retry -> [notifications-dlq]\n              v\n     [FCM/APNs | Twilio SMS | Twilio Voice | SendGrid | Slack]\n              |  delivery webhook (signature verified)\n              v\n     [Webhook API] -> [Postgres] + metrics\n              \n     [Responder: app | web | email | SMS \"4\" | DTMF \"4\"]\n              |  POST /incidents/:id/acknowledge  (CAS on version)\n              '--> [Incident Service]: cancel timers + ZREM + cancel queued notifications\n```\n\n### Kya sirf poochne par draw karna\n\n| Cheez | Kab draw karo | Ek line |\n|---|---|---|\n| **S3 archive** | \"90 din se purana data?\" | Postgres monthly partitions -> S3 Parquet, incidents 90 din hot, raw events 7 din Kafka |\n| **Analytics / MTTA-MTTR dashboards** | \"Reporting?\" | Alag consumer group `incident-events` par -> warehouse; read replicas se dashboards |\n| **Multi-region** | \"Region gir gaya?\" | Active-passive: ingest anycast, Kafka MirrorMaker, Postgres async replica; RPO seconds, RTO minutes |\n| **Elasticsearch** | \"Incident text search?\" | v1 mein nahi, Postgres kaafi; v3 mein -- aur woh agla system hai |\n| **SSE / WebSocket** | \"Web dashboard live updates?\" | v2 mein SSE; mobile ke liye push kaafi hai |\n| **Short links** | \"SMS 160 chars mein link?\" | `sho.rt/i/abc` -- URL Shortener lesson wapas |\n\n**Bilkul mat draw karo jab tak pooche nahi:** CDN (kuch cache hi nahi hota, sab write path hai), har module ke liye alag microservice (v1 modular monolith hai), service mesh, aur Cassandra (relational + transactional needs).\n\n---\n\n## PART 30 -- Final Cheat Sheet (5 minute revision)\n\n### Problem\n\nOn-call incident alerting product (PagerDuty / Opsgenie jaisa) + uske andar multi-channel notification delivery engine. Monitoring tools event bhejte hain -> dedup karke incident banta hai -> escalation policy + on-call schedule se sahi insaan nikalta hai -> push / SMS / voice / email / Slack se page -> `ackTimeoutMin` mein ack na ho toh escalate. Ek line: **\"Ek machine ka alert, sote hue insaan ke phone tak, guaranteed, minutes mein.\"**\n\n### Requirements\n\n| Type | Points |\n|---|---|\n| Functional | `POST /v2/enqueue` (`trigger`/`acknowledge`/`resolve`) -- dedup per `(serviceId, dedupKey)` jab tak resolved na ho -- state machine `triggered -> acknowledged -> resolved` with timeline audit -- routing service -> policy -> level -> schedule -> on-call user -> contact methods -- multi-channel delivery -- escalation with `ackTimeoutMin` (5) + `repeatCount` (2) -- ack/resolve app/web/email/SMS \"4\"/DTMF \"4\", ack par sab cancel -- quiet hours (low urgency = email only) -- alert grouping (10+ per min -> grouped page) |\n| NFR | **Reliability sabse upar**: \"duplicate page is OK, missed page is NOT\" -- **p95 \u003c 5 s, p99 \u003c 10 s** (accept -> first provider handover) -- **99.99%** ingest availability -- durability (202 se pehle Kafka committed) -- idempotency -- security (routingKey secret, PII encrypted, webhook signatures) -- storms 10x-50x |\n| Clarify first | Dedup kis par? Escalation levels aur timeout? Kaunse channels? Ack ke baad kya cancel? Low urgency ka behaviour? At-least-once acceptable? |\n\n### Key numbers (yaad rakho)\n\n| Metric | Value | Isse kya decide hua |\n|---|---|---|\n| Accounts / users / services | 20,000 / 500,000 / ~100,000 | Ek `routingKey` per service |\n| Events | **50M/day = 579/sec avg**, storm 10x = **~6,000/sec peak** | Kafka `incident-events` **24 partitions** (~250 eps/partition budget) |\n| Dedup ratio | **~95%** | **2.5M incidents/day = ~29/sec avg, ~300/sec peak** |\n| Notifications | avg 3/incident -> **7.5M/day = ~87/sec avg, ~1,000/sec peak** | `notifications` **48 partitions**, key = `incidentId` |\n| Channel split | push 50% (3.75M), SMS 30% (2.25M), email 15% (1.1M), voice 5% (0.4M) | Push pehle, voice last |\n| Cost | SMS 2.25M x $0.0075 = **~$17K/day**; voice 0.4M x $0.013 = **~$5K/day** | **Cost bhi design constraint hai** |\n| Raw events storage | 50 GB/day, 7d retention = **350 GB** (RF 3 -> ~1 TB) | Kafka disk |\n| Incidents storage | 2.5M x 2 KB = 5 GB/day, 90d hot = **~450 GB** | Postgres monthly partitions -> S3 Parquet |\n| Notifications storage | ~4 GB/day, 30d = **~120 GB** | Retention job |\n| Active incidents | ack p50 ~2 min, p95 ~10 min -> **~3,500 typical, ~50,000 storm** | 50K x ~100 B = **5 MB ZSET** -- memory nahi, **fairness + duplicate-fire** problem |\n| Twilio throughput | ~**1 SMS/sec per long code**, short code ~100/sec | Multiple sender numbers + per-provider concurrency cap |\n| Timer granularity | tick **1 s**, lag budget **10 s** | Alert on `timer_lag_seconds > 10` |\n\n### APIs\n\n| API | Kya |\n|---|---|\n| `POST /v2/enqueue` | Events API (PagerDuty-compatible). `202 { \"status\": \"accepted\", \"dedupKey\": \"cpu-high-web-3\" }` |\n| `GET /api/v1/incidents?status=triggered&serviceId=&cursor=` | Keyset pagination (`created_at, id`), offset nahi |\n| `GET /api/v1/incidents/:id` | Incident + timeline |\n| `POST /api/v1/incidents/:id/acknowledge` | `{ userId }` -> `200` current state (**idempotent**) |\n| `POST /api/v1/incidents/:id/resolve` | `{ userId, note }` |\n| `POST /api/v1/incidents/:id/notes` | Timeline note |\n| `GET /api/v1/oncall?scheduleId=&at=` | `[{ userId, name, until }]` |\n| `POST /webhooks/twilio/status` | Delivery status (signature verified) |\n| `POST /webhooks/twilio/inbound` | SMS reply \"4\" = acknowledge |\n| `GET /health`, `GET /ready` | Probes |\n| Errors | `400 VALIDATION_ERROR`, `401 INVALID_ROUTING_KEY`, `409 IDEMPOTENCY_KEY_REUSED`, `429 RATE_LIMITED`, `503 INGEST_UNAVAILABLE` |\n\n### HLD one-liner\n\n```\nMonitoring -> LB -> Ingest API (routingKey->serviceId cache, token bucket, 202 after Kafka acks=all)\n  -> Kafka incident-events (24p, key=serviceId)\n  -> Incident Service (dedup -> state machine -> routing -> tasks + timer)\n       |-> Postgres (incidents, timeline, timers, config)   |-> Redis ZSET + Scheduler x2\n  -> Kafka notifications (48p, key=incidentId) -> Notification Workers (rules, cancel-check, retry)\n  -> Providers (FCM/APNs, Twilio SMS/Voice, SendGrid, Slack) -> delivery webhooks\n  \u003c- Responder ack (app/web/email/SMS \"4\"/DTMF \"4\") cancels timers + queued notifications\n```\n\nNo CDN, no Elasticsearch (v1), no microservice-per-thing (modular monolith), no WebSocket (push kaafi).\n\n### LLD folders\n\n```\nsrc/\n  routes/           events.routes.ts, incidents.routes.ts, webhooks.routes.ts\n  controllers/      events.controller.ts, incidents.controller.ts, provider-webhook.controller.ts\n  services/         incident.service.ts, routing.service.ts, oncall.service.ts,\n                    notification.service.ts, escalation.service.ts, grouping.service.ts\n  repositories/     incident.repository.ts, service.repository.ts, policy.repository.ts,\n                    schedule.repository.ts, notification.repository.ts, timer.repository.ts\n  providers/        provider.interface.ts, twilio-sms.provider.ts, twilio-voice.provider.ts,\n                    fcm.provider.ts, sendgrid.provider.ts, slack.provider.ts, provider-registry.ts\n  workers/          incident.consumer.ts, notification.worker.ts, scheduler.ts, dlq.worker.ts\n  middleware/       auth.ts, rate-limit.ts, idempotency.ts, validate.ts\n  infra/            kafka.ts, redis.ts, postgres.ts, logger.ts, metrics.ts, tracing.ts\n  utils/            dedup-key.ts, backoff.ts, circuit-breaker.ts, time.ts\n  app.ts  server.ts\n```\n\n### Database tables + the one index that matters\n\n| Table | Kya rakhta hai |\n|---|---|\n| `services` | `routing_key` UNIQUE (secret), `policy_id`, `auto_resolve_min` |\n| `escalation_policies` / `escalation_rules` | `repeat_count` (2) / per level `ack_timeout_min` (5), `target_type` (`schedule`/`user`), `target_id` |\n| `schedules` / `schedule_layers` / `schedule_overrides` | IANA `timezone`; `rotation_type`, `rotation_length_sec`, `handoff_at` (UTC anchor), `member_ids[]`, `restriction` JSONB |\n| `users` / `contact_methods` / `notification_rules` | `address_enc` BYTEA (KMS envelope), `verified`; per-user \"0 min push, 1 min sms, 5 min voice\" |\n| **`incidents`** | Monthly partitions by `created_at`; `status`, `occurrence_count`, `escalation_level`, `escalation_round`, `version` |\n| `incident_events` | Immutable timeline: `triggered`, `notified`, `escalated`, `acknowledged`, `resolved`, `note` |\n| `notifications` / `notification_attempts` | `task_id` UNIQUE (at-least-once dedup), provider + `provider_message_id`, per-attempt result/latency |\n| `escalation_timers` | Redis ZSET ki **durable copy**; `state` = pending/fired/cancelled |\n| `idempotency_keys` | `(account_id, key)` PK, `request_hash`, `response_json`, 24 h TTL |\n\n**The one index:**\n\n```sql\nCREATE UNIQUE INDEX incidents_open_dedup_uniq\n  ON incidents (service_id, dedup_key)\n  WHERE status \u003c> 'resolved';\n```\n\nIske saath ek aur kaam ka: `CREATE INDEX incidents_open_by_service ON incidents (service_id, created_at DESC) WHERE status \u003c> 'resolved';` (dashboard ka main query), aur `CREATE INDEX escalation_timers_due ON escalation_timers (due_at) WHERE state = 'pending';` (recovery job).\n\n### Redis usage\n\n| Key | Type | TTL | Kaam | Kho jaaye toh? |\n|---|---|---|---|---|\n| `svc:\u003croutingKey>` | string | 300 s | routingKey -> serviceId cache | Postgres fallback, thodi latency |\n| `dedup:\u003cserviceId>:\u003cdedupKey>` | string | 6 h | Dedup **fast path** | Postgres partial unique index bacha leta hai (source of truth) |\n| `sched:escalations` | **ZSET** | -- | Escalation timers (member = timerId, score = dueAtMs) | Recovery job Postgres se `ZADD NX` |\n| `grp:\u003cserviceId>:\u003cminute>` | counter | ~10 min | Storm grouping (>10 -> grouped page) | Grouping off, individual pages -- noisy par safe |\n| `cb:\u003cprovider>` | hash | -- | Circuit breaker state | Breaker reset, thode extra failed attempts |\n| `rl:events:\u003croutingKey>` | hash | computed | Token bucket (Rate Limiter format) | Fail open per Rate Limiter lesson |\n\n**Redis kahin bhi source of truth nahi hai.** Har entry ke peeche Postgres khada hai.\n\n### Kafka topics\n\n| Topic | Partitions | Key | Consumer group | Kyun |\n|---|---|---|---|---|\n| `incident-events` | **24** | `serviceId` | `incident-service` | Peak 6K eps / ~250 per partition; ordering per service; 7d replay |\n| `notifications` | **48** | `incidentId` | `notification-workers` | Peak ~1K/sec x retries; ek incident ki notifications ordered |\n| `escalations` | -- | `incidentId` | `escalation-consumer` | Scheduler ke claimed timers |\n| `notifications-dlq` | -- | -- | `dlq.worker` | 5 attempts ke baad; `dlq_depth` par alert |\n\nKafka kyun, RabbitMQ nahi: **replay**, **ordering per key**, **multiple independent consumer groups**, high throughput. RabbitMQ ka per-message ack/retry/delay pattern notification **retry** level par behtar hai -- woh alag layer hai.\n\n### Main algorithms\n\n**1. Dedup**\n\n```\nINSERT ... ON CONFLICT (service_id, dedup_key) WHERE status \u003c> 'resolved'\nDO UPDATE SET occurrence_count = occurrence_count + 1, last_seen_at = now()\nRETURNING (xmax = 0) AS inserted;\n```\n`xmax = 0` -> naya incident -> **page karo**. Warna sirf counter -> **chup raho**. Resolve par index entry free -> wahi dedupKey naya incident bana sakta hai.\n\n**2. Timer claim (atomic)**\n\n```lua\nlocal due = redis.call('ZRANGEBYSCORE', KEYS[1], '-inf', ARGV[1], 'LIMIT', 0, tonumber(ARGV[2]))\nif #due > 0 then redis.call('ZREM', KEYS[1], unpack(due)) end\nreturn due\n```\nRead + remove ek atomic step -> 2+ scheduler instances safe, leader election ki zarurat nahi. Durable copy `escalation_timers`; recovery job har 60 s `ZADD NX`.\n\n**3. Retry backoff (full jitter)**\n\n```\ndelay = random(0, min(30000, 1000 * 2^attempt))   // max 5 attempts per channel\n4xx = permanent, no retry.  5xx / timeout / 429 = retry.\n```\nCircuit breaker per provider: 30 s window, >50% fail in >=20 req -> `open` 30 s -> `half-open` 5 probes -> failover / channel downgrade.\n\n**4. On-call rotation**\n\n```\nindex = floor((at - handoffAt) / rotationLengthMs) % memberIds.length\nthen apply schedule_overrides (specific window -> someone else)\n```\n**DST:** UTC instants store karo, IANA timezone se compute (Luxon). `new Date(y, m, d, 2, 0)` kabhi nahi -- spring-forward par 2 AM exist hi nahi karta.\n\n**5. Ack race (optimistic lock)**\n\n```sql\nUPDATE incidents SET status='acknowledged', acknowledged_by=$1, version=version+1\nWHERE id=$2 AND status='triggered' AND version=$3;\n```\n0 rows -> koi pehle kar gaya -> `200` with current state, **error nahi**.\n\n**6. Storm grouping**\n\n`INCR grp:\u003cserviceId>:\u003cminute>`; count > 10 -> individual notifications rok kar ek grouped page per 5 min (\"checkout: 63 new incidents\"). Incidents phir bhi bante hain (audit).\n\n### Scaling ladder\n\n| Stage | Change |\n|---|---|\n| V1 (MVP) | Ek Node process: Express + Postgres + `SELECT ... FOR UPDATE SKIP LOCKED` polling timers. Kafka nahi, Redis nahi. **Chhote scale par ye bilkul sahi hai** |\n| V2 | Kafka `incident-events` (durability + spike absorb), Incident Service consumer group, Redis ZSET timers + durable copy, notification workers alag |\n| V3 -- hamare numbers (6K eps, 1K notif/sec) | 24 + 48 partitions, Postgres monthly partitions + 2 read replicas, scheduler x2, per-provider concurrency caps + circuit breakers, grouping |\n| V4 -- aage | Postgres shard by `account_id`, incidents 90d ke baad S3 Parquet, multi-region active-passive (MirrorMaker + async replica), notification service alag deploy, Elasticsearch for incident search |\n\n### Consistency\n\n| Where | Level | Why OK |\n|---|---|---|\n| Dedup | **Strong** (Postgres unique index) | Duplicate incident = duplicate page storm. Yahan compromise nahi |\n| Incident state transitions | **Strong** + optimistic lock (`version`) | Ack race ka deterministic winner |\n| Redis dedup fast path | **Eventual / best-effort** | Miss hua toh DB index pakad lega |\n| Timers (Redis vs Postgres) | **Eventual** (60 s recovery job) | Worst case: escalation kuch second late, **kabhi khoyi nahi** |\n| Notification delivery | **At-least-once** | `task_id` unique + provider idempotency key se mostly single; duplicate page acceptable hai |\n| Dashboards (read replicas) | **Eventual** (replica lag) | Incident **detail** page primary se padho; list replica se chalegi |\n| Ingest -> incident visible | **Async** (202) | Client ko `dedupKey` milta hai, `incidentId` nahi |\n\n### Failure handling\n\n| Failure | Behaviour |\n|---|---|\n| **Kafka down** | Ingest ~60 s local disk spool -> phir **503 INGEST_UNAVAILABLE**. **FAIL CLOSED** -- \"accepting a page you cannot deliver is worse than rejecting it loudly\" |\n| **Redis down** | Dedup Postgres index par gir jaata hai (slow par correct); timers recovery job se Postgres se rebuild; rate limit fail open |\n| **Postgres primary down** | Failover to replica; ingest Kafka par likhta rehta hai (buffer), incident service lag karti hai aur recover hoti hai. **Kuch nahi khota, sab late hota hai** |\n| **Scheduler instance crash** | Doosra instance chalta rehta hai (claim atomic hai). Dono gire toh `timer_lag_seconds` alert + recovery job |\n| **Ek provider down (Twilio)** | Circuit breaker open 30 s -> failover provider (MessageBird) ya channel downgrade (SMS -> voice); attempts DLQ mein |\n| **Notification worker crash mid-send** | At-least-once: message dobara aayega; `task_id` unique index + provider idempotency key duplicate rokte hain (100% nahi) |\n| **Ack ke baad notification queue mein pada tha** | Worker ka **last-moment cancelled-check** + incident status check |\n| **Timer ack ke baad fire hua** | `status !== 'triggered'` guard -> drop |\n| **On-call schedule empty** | Account admin ko fallback page + `oncall_empty_total` alert. **Silent drop kabhi nahi** |\n| **Escalation exhausted** | Timeline entry + account alert; incident **open rehta hai** (dashboard par red) |\n| **Alert storm 50x** | Per-routingKey token bucket + grouping; incidents bante rahenge, pages collapse ho jaayenge |\n\n### Security\n\n- `routing_key` = **secret, API key ki tarah**: UNIQUE, revocable, per-service, logs mein kabhi nahi. Galat key -> `401 INVALID_ROUTING_KEY`.\n- **PII encrypted at rest**: `contact_methods.address_enc` BYTEA, KMS envelope encryption. Logs mein masked (`+91XXXXXX3210`).\n- **Provider webhook signature verification** mandatory -- warna koi bhi jhoothi delivery report ya jhootha inbound \"4\" (= fake acknowledge!) bhej sakta hai.\n- **Per-account isolation**: har query par `account_id` filter; incident id guess karke doosre account ka incident ack na kar sake.\n- **Rate limit per routingKey** -- ek customer ka storm doosre ko na maare.\n- **Ack authorization**: sirf wahi users jo us incident ke escalation path/account mein hain.\n- Audit: `incident_events` immutable timeline -- kisne kab kya kiya, compliance ke liye.\n\n### Top 5 trade-offs\n\n| Decision | Chosen | Kyun | Kab badlega |\n|---|---|---|---|\n| Ingest failure policy | **Fail closed** (spool 60 s -> 503) | Jhootha 202 = alert chup-chaap kha gaya. Loud reject se customer retry/fallback kar sakta hai | Agar downstream truly independent hota (best-effort marketing notifications) toh fail open |\n| Delivery guarantee | **At-least-once** | \"Duplicate page is OK, missed page is NOT\". Exactly-once ki keemat latency + complexity | Billing-grade messaging (paid SMS campaigns) -> exactly-once effort worth it |\n| Ingest response | **202 async** (dedupKey, incidentId nahi) | Ingest DB se decoupled; storm mein girta nahi | Chhota scale / client ko turant id chahiye -> sync 201 |\n| Timers | **Redis ZSET + Postgres durable copy** | O(log N + k) claim, atomic Lua, 1 s granularity, HA without leader | Chhote scale -> Postgres `FOR UPDATE SKIP LOCKED` polling (ek kam system) |\n| Dedup source of truth | **Postgres partial unique index** (Redis sirf fast path) | Redis eviction/failover par duplicate incident ban jaata | Kabhi nahi -- ye correctness hai, performance nahi |\n\n### Top 10 follow-up questions (one-line answers)\n\n| # | Question | One-line answer |\n|---|---|---|\n| 1 | Same alert har 30 second aa raha hai, naya incident kyun nahi banta? | `(service_id, dedup_key)` par partial unique index `WHERE status \u003c> 'resolved'`; `ON CONFLICT` sirf `occurrence_count` badhata hai, `xmax = 0` batata hai ki page karna hai ya nahi |\n| 2 | Escalation timers `setTimeout` se kyun nahi? | Process crash ya deploy = timer gaya = page gaya; timer ek **row** hai -- Redis ZSET + Postgres durable copy + 60 s recovery job |\n| 3 | Do scheduler instances same timer do baar fire nahi karenge? | `ZRANGEBYSCORE` + `ZREM` ek **atomic Lua** mein -- claim aur remove ek step, isliye leader election bhi nahi chahiye |\n| 4 | Redis poora wipe ho gaya toh? | `escalation_timers` Postgres mein pending hain; recovery job har 60 s `ZADD NX` se ZSET rebuild karta hai -- escalations late, khoyi nahi |\n| 5 | Ack ke baad bhi SMS aa gaya, kyun? | At-least-once system mein task already queue mein tha; isliye teen layers -- timer cancel, task `cancelled`, aur worker ka **last-moment status check** |\n| 6 | Do responder ek saath ack karein? | `UPDATE ... WHERE status='triggered' AND version=$n` (optimistic lock); haarne wale ko `200` current state, error nahi |\n| 7 | Kafka down ho gaya toh ingest kya kare? | ~60 s local disk spool, phir **503 -- fail closed**. Jo deliver nahi kar sakte usko accept karna galat hai (Rate Limiter ke fail-open se ulta) |\n| 8 | Twilio down ho gaya? | Per-provider circuit breaker (30 s, >50% fail in >=20) -> open -> failover provider ya channel downgrade; 5 full-jitter attempts ke baad DLQ, aur escalation timer waise bhi agle level par page karega |\n| 9 | Alert storm mein 500 incidents ek minute mein? | Incidents bante rahenge (audit), par `grp:\u003cserviceId>:\u003cminute>` counter >10 par notifications ek grouped page mein collapse -- \"checkout: 63 new incidents\" |\n| 10 | On-call rotation DST par kaise handle karoge? | UTC instants store karo, rotation index `floor((at - handoffAt) / rotationLengthMs) % members.length`, display IANA timezone se (Luxon); `new Date(y, m, d, 2, 0)` kabhi nahi |\n\n### 30-second answer\n\nPART 27 dekho. Skeleton: **202 fail-closed ingest -> Kafka `incident-events` -> dedup via Postgres partial unique index (`xmax = 0`) -> routing (policy -> schedule -> on-call) -> notification tasks with per-user rules -> Redis ZSET timers with Postgres durable copy + atomic Lua claim -> escalate ya ack-cancel -> at-least-once, kyunki duplicate page OK hai, missed page nahi.**\n\n### 5-minute skeleton (full text PART 28 mein)\n\n1. **Minute 1** -- Requirements: events API, dedup, escalation, multi-channel, ack cancels. Principle: **duplicate page OK, missed page NOT**. SLO p95 \u003c 5 s, 99.99% ingest.\n2. **Minute 2** -- Numbers: 50M events/day = 580/s avg, 6K peak; **95% dedup** -> 2.5M incidents; 7.5M notifications; SMS ~$17K/day; 50K active timers = 5 MB.\n3. **Minute 3** -- Architecture: LB -> ingest (202 after Kafka acks=all) -> Kafka 24p key=serviceId -> incident service -> Postgres + Redis -> notification workers -> providers. Modular monolith, no CDN.\n4. **Minute 4** -- Deep dive: partial unique index + `xmax = 0`; timers as rows, ZSET + atomic Lua claim + Postgres durable copy + recovery job; ack cancels 3 things + last-moment check.\n5. **Minute 5** -- Bottleneck = **providers**, not our code (Twilio 1 SMS/sec per long code); failures (Redis, Kafka -> **fail closed**, provider circuit breaker); trade-offs (at-least-once, 202 async); \"deep dive kahan?\"\n\n### Most Important Things To Remember\n\n1. **\"Duplicate page is OK, missed page is NOT.\"** Ye ek line poore system ke har decision ko explain karti hai -- at-least-once, durable timers, fail-closed ingest, teen-layer cancellation.\n2. **Dedup hi is system ka leverage hai:** 50M events -> 2.5M incidents (95% drop). Source of truth Postgres ka **partial unique index** `WHERE status \u003c> 'resolved'`, Redis sirf fast path. Resolve par index free hona utna hi zaruri hai jitna conflict par counter badhna.\n3. **Timer ek data row hai, `setTimeout` nahi.** Redis ZSET + **atomic Lua claim** (do instances safe, leader election nahi) + **Postgres durable copy** + 60 s recovery job. Timers sirf Redis mein rakhna is system ki sabse badi galti hogi.\n4. **Ingest par FAIL CLOSED** -- Rate Limiter ke fail-open se **ulta**, aur yahi contrast yaad rakhne layak hai: \"accepting a page you cannot deliver is worse than rejecting it loudly.\"\n5. **Ack teen cheezein cancel karta hai** (timer row, ZSET entry, queued notifications) aur worker ka **last-moment status check** chautha net hai. Cancellation best-effort, status check guarantee.\n6. **Channel order = cost + wake-up power:** 0 min push (free, instant), 1 min SMS (sasta), 5 min voice (mehnga, par jagata hai). SMS ~$17K/day -- **cost bhi design constraint hai.**\n7. **Bottleneck providers hain, hamara code nahi** -- Twilio long code ~1 SMS/sec. Per-provider concurrency cap + circuit breaker + failover. (Rate Limiter lesson yahan wapas aata hai.)\n8. **Har state transition optimistic lock (`version`) se**, aur duplicate ack / late timer / resolve-while-escalating sab **silent no-op**, error nahi. Aadhi raat ko responder ko `409` dena product bug hai.\n9. **Clock inject karo.** 5-minute escalation ka test 5 millisecond mein chalna chahiye, warna test likha hi nahi jaayega aur bug production mein milega.\n10. Numbers bolo: **50M events/day, 579/s avg, 6K peak, 95% dedup, 2.5M incidents, 7.5M notifications, 24 + 48 partitions, p95 \u003c 5 s, ack timeout 5 min, repeatCount 2, 50K active timers = 5 MB.**\n\n---\n\n## Remember\n\n> **Coding round mein: scope clarify (dedup kis par? escalation levels? ack ke baad kya cancel?) -> logic bolo (dedup index + timer as a row) -> clean code with injected clock -> edge cases (duplicate trigger, early ack, zombie timer, ack race, empty on-call) -> complexity. Design round mein: requirements -> numbers (\"95% dedup\") -> simple diagram -> deep dive (partial unique index + ZSET claim) -> failure policy (fail closed).** Poore system ka dil ek line hai: **\"Duplicate page is OK, missed page is NOT -- isliye har timer durable hai, har delivery at-least-once hai, aur ingest jhooth bolne se pehle 503 de deta hai.\"**\n\n## Quick Self-Test\n\n1. Dedup index par `WHERE status \u003c> 'resolved'` na hota toh do alag-alag bugs aate -- kaunse? Ek bug \"page hi nahi jaayega\" wala hai aur doosra \"uniqueness violation\" wala -- dono explain karo.\n2. `RedisZsetEscalationScheduler.scheduleDurable` mein Postgres pehle aur Redis baad mein kyun? Ulta order karke beech mein crash hone par exactly kya hota, aur hamara principle usko kyun reject karta hai?\n3. Scenario B ke output mein push `NOT sent` hua par Scenario A mein Rahul ka SMS cancel hone ki koi line nahi aayi -- `cancelForIncident` ke andar `if (p.dueAtMs > this.now()) p.settled = true` wali line iska kya karan banti hai, aur production mein ye do cases Kafka ke hisaab se kaise map hote hain?\n4. Interviewer bola: \"Timers ke liye Redis hata do, sirf Postgres polling rakho.\" Kaunse scale par ye sahi answer hai, kaunse par galat, aur tum kaunsa number quote karke decide karoge?\n5. Rate Limiter mein hum **fail open** the aur yahan ingest par **fail closed** -- dono systems ka kaunsa fark ye ulta decision justify karta hai? Aur is system mein aisi kaunsi jagah hai jahan hum phir bhi fail open karte hain?\n\n---\n\n**Notification / Paging System complete.** Next system: **Search System**. \"next\" bolo.\n"}]}</script>
<script>
(function () {
  const book = JSON.parse(document.getElementById('book-data').textContent);
  const parts = book.parts;
  const KEY = 'reader:' + book.title;
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;

  // ---- storage (optional; page works without it) ----
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(patch) { try { localStorage.setItem(KEY, JSON.stringify(Object.assign(load(), patch))); } catch (e) {} }
  const saved = load();

  // ---- settings ----
  let fontSize = saved.fontSize || (window.innerWidth <= 600 ? 17 : 19);
  function applySettings() {
    root.style.setProperty('--font-size', fontSize + 'px');
    root.dataset.theme = saved.theme || 'light';
    root.dataset.font = saved.font || 'serif';
    root.dataset.width = saved.width || 'narrow';
    document.querySelectorAll('.swatch').forEach((s) => s.classList.toggle('on', s.dataset.theme === root.dataset.theme));
    document.querySelectorAll('#fontSeg button').forEach((b) => b.classList.toggle('on', b.dataset.font === root.dataset.font));
    document.querySelectorAll('#widthSeg button').forEach((b) => b.classList.toggle('on', b.dataset.width === root.dataset.width));
  }
  $('fontUp').onclick = () => { fontSize = Math.min(28, fontSize + 1); save({ fontSize }); applySettings(); };
  $('fontDown').onclick = () => { fontSize = Math.max(13, fontSize - 1); save({ fontSize }); applySettings(); };
  document.querySelectorAll('.swatch').forEach((s) => s.onclick = () => { saved.theme = s.dataset.theme; save({ theme: saved.theme }); applySettings(); });
  document.querySelectorAll('#fontSeg button').forEach((b) => b.onclick = () => { saved.font = b.dataset.font; save({ font: saved.font }); applySettings(); });
  document.querySelectorAll('#widthSeg button').forEach((b) => b.onclick = () => { saved.width = b.dataset.width; save({ width: saved.width }); applySettings(); });
  applySettings();

  // ---- markdown rendering ----
  mermaid.initialize({ startOnLoad: false, theme: 'default' });
  const renderer = new marked.Renderer();
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  renderer.code = (code, lang) => lang === 'mermaid'
    ? '<div class="mermaid">' + esc(code) + '</div>'
    : '<pre><code>' + esc(code) + '</code></pre>';
  renderer.table = (header, body) => '<div class="table-wrap"><table><thead>' + header + '</thead><tbody>' + body + '</tbody></table></div>';
  const slug = (s, i) => 'p' + i + '-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);

  // pre-compute headings for the contents drawer
  parts.forEach((p, i) => {
    p.headings = [];
    p.md.split('\n').forEach((line) => {
      const m = /^## (.+)$/.exec(line);
      if (m) p.headings.push({ text: m[1].replace(/[*`]/g, ''), id: slug(m[1].replace(/[*`]/g, ''), i) });
    });
  });

  // ---- contents drawer ----
  function buildToc() {
    $('toc').innerHTML = parts.map((p, i) =>
      '<div class="toc-part' + (i === current ? ' current' : '') + '"><button data-part="' + i + '">Part ' + (i + 1) +
      '<small>' + p.label + '</small></button><ul>' +
      p.headings.map((h) => '<li><a href="#" data-part="' + i + '" data-id="' + h.id + '">' + h.text + '</a></li>').join('') +
      '</ul></div>').join('');
    $('toc').querySelectorAll('[data-part]').forEach((el) => el.onclick = (e) => {
      e.preventDefault();
      closeAll();
      show(+el.dataset.part, el.dataset.id || null);
    });
  }
  function closeAll() { $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); $('settings').classList.remove('open'); }
  $('tocBtn').onclick = () => { buildToc(); $('drawer').classList.add('open'); $('scrim').classList.add('open'); };
  $('setBtn').onclick = (e) => { e.stopPropagation(); $('settings').classList.toggle('open'); };
  $('scrim').onclick = closeAll;
  $('settings').onclick = (e) => e.stopPropagation();
  document.addEventListener('click', () => $('settings').classList.remove('open'));

  // ---- chapters ----
  let current = -1;
  function show(i, anchorId, scrollRatio) {
    if (i < 0 || i >= parts.length) return;
    if (i !== current) {
      current = i;
      const html = marked.parse(parts[i].md, { renderer });
      const next = parts[i + 1], prev = parts[i - 1];
      $('content').innerHTML = html +
        '<div class="chapter-end">' +
        (prev ? '<button class="prev" data-go="' + (i - 1) + '"><small>Previous</small>Part ' + i + ': ' + prev.label + '</button>' : '<span></span>') +
        (next ? '<button class="next" data-go="' + (i + 1) + '"><small>Next</small>Part ' + (i + 2) + ': ' + next.label + '</button>' : '<span></span>') +
        '</div>';
      $('content').querySelectorAll('h2').forEach((h) => { h.id = slug(h.textContent, i); });
      $('content').querySelectorAll('[data-go]').forEach((b) => b.onclick = () => show(+b.dataset.go));
      mermaid.run({ nodes: $('content').querySelectorAll('.mermaid') }).catch(() => {});
      $('chapTitle').textContent = ' -- Part ' + (i + 1) + ': ' + parts[i].label;
      $('prevBtn').disabled = i === 0;
      $('nextBtn').disabled = i === parts.length - 1;
      document.title = 'Part ' + (i + 1) + ': ' + parts[i].label + ' -- ' + book.title;
    }
    requestAnimationFrame(() => {
      if (anchorId && $(anchorId)) $(anchorId).scrollIntoView();
      else window.scrollTo(0, scrollRatio ? scrollRatio * maxScroll() : 0);
      onScroll();
    });
  }
  $('prevBtn').onclick = () => show(current - 1);
  $('nextBtn').onclick = () => show(current + 1);

  // ---- progress + remembered position ----
  const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  let saveTimer = null;
  function onScroll() {
    const ratio = Math.min(1, window.scrollY / maxScroll());
    $('progress').style.width = (ratio * 100).toFixed(1) + '%';
    const overall = ((current + ratio) / parts.length) * 100;
    $('status').textContent = 'Part ' + (current + 1) + ' of ' + parts.length + '  |  ' + Math.round(ratio * 100) + '% of part  |  ' + Math.round(overall) + '% of book';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => save({ part: current, ratio }), 300);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);

  // ---- page turning (keys + side taps) ----
  const atBottom = () => window.scrollY >= maxScroll() - 4;
  const atTop = () => window.scrollY <= 4;
  function pageDown() { if (atBottom()) { if (current < parts.length - 1) show(current + 1); } else window.scrollBy({ top: window.innerHeight - 110, behavior: 'smooth' }); }
  function pageUp() { if (atTop()) { if (current > 0) show(current - 1, null, 1); } else window.scrollBy({ top: -(window.innerHeight - 110), behavior: 'smooth' }); }
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); pageDown(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); pageUp(); }
    else if (e.key === 't' || e.key === 'T') { $('tocBtn').click(); }
    else if (e.key === 'Escape') closeAll();
  });
  $('content').addEventListener('click', (e) => {
    if (e.target.closest('a, button, pre, table, .mermaid, code')) return;
    if (String(window.getSelection())) return;
    const x = e.clientX / window.innerWidth;
    if (x > 0.8) pageDown(); else if (x < 0.2) pageUp();
  });

  // ---- start where the reader left off ----
  const startPart = Number.isInteger(saved.part) && saved.part < parts.length ? saved.part : 0;
  show(startPart, null, saved.ratio || 0);
})();
</script>
</body>
</html>
