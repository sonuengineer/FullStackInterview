# Notification / Paging System -- HLD + LLD (Part 4: Scaling -> Failures -> Consistency -> Security -> Observability)

> Is file mein prompt ke **Parts 16-20** hain: scaling (1x se 1000x), failure scenarios, consistency, security, aur observability.
> Pichle parts ka recap: Part 1 mein numbers nikale (**50M events/day = ~579 events/sec average, ~6,000 eps storm peak, 95% dedup -> 2.5M incidents/day (~29/sec), 7.5M notifications/day (~87/sec avg, ~1,000/sec peak), SLO: event accept -> first provider handover p95 < 5 s**). Part 2 mein `POST /v2/enqueue` ka 202 flow, Postgres schema, aur `incident.service.ts` / `notification.worker.ts` ka LLD code likha. Part 3 mein dedup ka partial unique index, escalation timers ka Redis ZSET + atomic Lua claim, on-call rotation ki DST-safe math, retry backoff aur per-provider circuit breaker deep dive kiya. Ab dekhenge ye system **traffic badhne par, cheezein tootne par, aur attack hone par** kaise behave karta hai.

**Ek baat pehle se yaad rakho:** Rate Limiter ka rule tha "limiter fail ho toh API chalti rahe" (**fail open**). Paging system ka rule uska ulta hai: **jo page tum deliver nahi kar sakte, usko accept karne ka natak mat karo (fail closed on ingest)**. Aur delivery ke baad wala rule spec se seedha aata hai:

> **"Duplicate page is OK. Missed page is NOT."**

Is part ka har decision isi ek sawaal se nikalta hai: **"agar yahan kuch toota, toh kya koi sota hua insaan bina jaage reh jaayega?"**

> Honest note: PagerDuty / Opsgenie jaise asli products isse bade aur purane hain (multi-region active-active, apne khud ke telephony carriers). Ye woh design hai jo interviewer ek **on-call paging platform** ke liye expect karta hai.

---

## PART 16 -- Scaling: 1x -> 10x -> 100x -> 1000x

### Pehle ek rule

Har level par sirf teen sawaal:

1. **Sabse pehle kya tootega?** (bottleneck)
2. **Usko theek karne ka sabse sasta tareeka kya hai?**
3. **Kya abhi zarurat NAHI hai?**

**Part 1 ka key insight yaad rakho:** ye system **write-heavy** hai. Har event ek write hai (Kafka produce), har incident ek DB write hai, har notification ek DB write + ek third-party network call hai. Read traffic (dashboard) is system ka chhota sa hissa hai.

Iska matlab: URL Shortener wala "cache laga do" trick yahan nahi chalega, aur **Postgres read replicas ingest path ko bachate hi nahi** -- woh sirf dashboard bachate hain. Yahan bottleneck teen jagah aata hai:

```
1. Ingest throughput   -> Kafka partitions + stateless API instances
2. Incident write path -> Postgres write throughput (dedup UPDATE!)
3. Delivery fan-out    -> third-party provider limits (Twilio 1 SMS/sec per long code)
```

Aur ek chhupa hua chautha: **timer/scheduler**, jo ek hi Redis ZSET par ek hi second ke tick mein sab kuch karta hai.

### Levels define karte hain

Spec ka 50M events/day ek bade SaaS ka number hai. Kahani samajhne ke liye ek chhote startup se shuru karte hain:

| Level | Events/day | Avg eps | Storm peak eps | Incidents/day | Notifications/day | Peak notif/sec | SMS+voice cost/day |
|---|---|---|---|---|---|---|---|
| **1x** (startup) | 500K | ~6 | ~60 | 25K | 75K | ~10 | ~$220 |
| **10x** | 5M | ~58 | ~600 | 250K | 750K | ~100 | ~$2.2K |
| **100x** (hamara spec) | **50M** | **579** | **~6,000** | **2.5M** | **7.5M** | **~1,000** | **~$22K** |
| **1000x** | 500M | ~5,787 | ~58,000 | 25M (~290/sec) | 75M | ~10,000 | ~$220K |

> Cost formula spec se: SMS 30% x $0.0075 + voice 5% x $0.013. 100x par SMS ~$17K/day + voice ~$5K/day. **Cost ek design constraint hai, sirf latency nahi** -- isliye push pehle, SMS baad mein, voice last.

---

### 1x -- 500K events/day (~6 eps, storm peak ~60 eps)

```
Monitoring tools
   |
   v
   LB
   |
   v
+--------------------------------------------------+
|  ONE Node.js box (modular monolith)              |
|   - Express ingest route                          |
|   - incident service (in-process, same event loop)|
|   - notification worker (in-process)              |
|   - scheduler (setInterval 1 s)                   |
+--------------------------------------------------+
   |                  |                 |
   v                  v                 v
Postgres (1)      Redis (1)      Twilio / FCM / SendGrid
```

- **Kafka ki zarurat hai?** Honest jawab: **v1 mein nahi.** 6 eps par ek Postgres table (`event_queue`) + `SELECT ... FOR UPDATE SKIP LOCKED` poller bilkul kaafi hai. Lekin **durability ka rule fir bhi lagta hai**: `202` dene se pehle event **disk par committed** hona chahiye. In-memory queue (`setImmediate`, BullMQ without persistence) yahan **galat** hai -- process crash = page gaya.
- **Redis?** Timers ke liye chahiye hi chahiye -- warna `setTimeout` process memory mein hoga aur **deploy/restart har pending escalation ko maar dega**. Ye is system ki sabse aam beginner galti hai.
- Scheduler in-process `setInterval(tick, 1000)` -- ek hi instance hai, isliye double-fire ka koi risk nahi.
- **Kya NAHI chahiye:** Kafka, consumer groups, read replicas, partitioning, sharding, DLQ topic, per-channel worker pools, S3 archive.

**Sabse pehle kya toota:**

| # | Kya toota | Kab | Kya add kiya | Kyun |
|---|---|---|---|---|
| 1 | Deploy par pending escalations gaayab | Har deploy | Timers Redis ZSET + `escalation_timers` table mein | Process memory restart-proof nahi hai |
| 2 | Ek Twilio timeout poore event loop ko atka deta hai | Pehla provider outage | Provider call par `timeout: 5000` + `Promise.allSettled` | Ek slow third party poora ingest nahi rok sakta |
| 3 | 60 eps ka chhota storm par p95 latency 5 s cross | Pehla real outage | Notification bhejna ingest se alag kar do (in-process queue -> phir Kafka) | Ingest ko provider latency se decouple karna |

- **Cost direction:** ~$220/day SMS+voice, infra ~$150/month (1 box + managed PG + managed Redis). **Provider bill infra bill se 40x bada hai** -- ye ratio pehle din se sach hai.

> Interview line: "1x par main poora system ek modular monolith mein rakhta hoon -- Kafka nahi, ek Postgres-backed queue. Lekin do cheezein pehle din se non-negotiable hain: accepted event disk par committed ho, aur escalation timers process memory mein na hon warna har deploy pending pages kha jaayega."

### 10x -- 5M events/day (~58 eps, storm peak ~600 eps)

```
Monitoring tools -> LB -> Ingest API x 3 (stateless)
                              |
                              v
                     Kafka `incident-events` (6 partitions, key=serviceId)
                              |
                              v
                     Incident consumers x 3 (group: incident-service)
                              |                 \
                              v                  v
                     Postgres primary       Kafka `notifications` (12 partitions)
                     + 1 read replica              |
                              ^                    v
                     Scheduler x 2  <-- Redis  Notification workers x 4
                     (ZSET sched:escalations)      |
                                                   v
                                          Twilio / FCM / SendGrid
```

| Area | Kya tootega | Change | Kyun |
|---|---|---|---|
| Ingest availability | Ek box gaya = customer ka poora monitoring andha | **3 stateless instances** behind LB, 2 AZ | 99.99% ingest availability chahiye |
| Postgres-backed queue | 600 eps par poller `SKIP LOCKED` contention + table bloat | **Kafka `incident-events`, 6 partitions** | Queue table ab ek hot table ban gayi; Kafka append-only hai |
| Provider latency | Voice call 25 s block karta hai | **Alag notification worker process** (consumer group) | Ingest aur delivery ke life cycles alag hain |
| Scheduler SPOF | Scheduler box gaya = koi escalation nahi | **2 scheduler instances** (atomic Lua claim se safe) | Spec: leader election ki zarurat nahi, claim atomic hai |
| Dashboard queries ingest ko slow karti hain | Bada `GET /incidents` scan | **1 read replica**, dashboards wahan se | Reads ko write path se hatao |

**Stateless horizontal scaling ka asli matlab (ingest API):**

Ingest instance mein **kuch bhi local state nahi**: koi in-memory dedup map nahi, koi local timer nahi, koi session nahi. Sirf do caches hain aur dono **safe-to-lose** hain:

- `svc:<routingKey>` -> serviceId (Redis, TTL 300 s) -- miss hone par Postgres.
- token bucket `rl:events:<routingKey>` -- Redis mein, isliye 3 instances milkar ek hi limit enforce karte hain (Rate Limiter lesson: local bucket hota toh limit 3x ho jaata).

Isi wajah se ingest ko autoscale karna trivial hai: box add karo, LB ko batao, bas.

- **Kya NAHI chahiye:** Postgres partitioning (abhi 250K incidents/day x 2 KB = 0.5 GB/day), sharding, DLQ replay tool (manual ok), per-channel worker pools, S3 archive, SSE/WebSocket.

**Sabse pehle kya toota:**

| # | Kya toota | Kya add kiya | Kyun |
|---|---|---|---|
| 1 | Deploy ke waqt consumer rebalance se duplicate pages | `enable.auto.commit=false`, DB write ke **baad** commit + `notifications.task_id` unique index | At-least-once mein duplicate rokne ka DB-side guard |
| 2 | Ek customer ka storm sabki notifications ko peeche dhakel deta hai | Per-routing-key token bucket + grouping counter `grp:<serviceId>:<minute>` | Noisy neighbour isolation |
| 3 | `GET /api/v1/incidents` timeout (offset pagination) | **Keyset pagination** (`created_at, id`) | URL Shortener Part 4 ka rule: offset kabhi nahi |

- **Cost direction:** provider bill ~$2.2K/day (~$800K/year). Yahan pehli baar **finance team aati hai**: "voice call kyun?" Jawab: voice ka conversion (sote hue insaan ko jagana) SMS se bahut behtar hai; isliye voice ko sirf level-2 escalation par rakho, level-1 par nahi.

> Interview line: "10x par teen cheezein alag hoti hain: ingest stateless ho jaata hai aur 2 AZ mein 3 instances par chalta hai, queue Postgres se Kafka ban jaati hai kyunki poller table hot ho gayi thi, aur notification delivery apni process mein nikal jaati hai taaki ek 25 second ka voice call ingest ki p95 latency na khaaye."

### 100x -- 50M events/day (~579 eps, storm peak ~6,000 eps) -- hamara design point

Ye woh design hai jo Parts 1-3 mein bana.

```mermaid
flowchart TB
    M[Monitoring tools] --> LB[LB + WAF]
    LB --> API[Ingest API: ~20 stateless Node instances]
    API --> KE[(Kafka incident-events<br/>24 partitions, key=serviceId)]
    API -.routingKey cache + token bucket.-> R[(Redis Cluster)]
    KE --> IC[Incident consumers<br/>group incident-service, 24 max]
    IC --> PG[(Postgres primary<br/>monthly partitions)]
    IC --> KN[(Kafka notifications<br/>48 partitions, key=incidentId)]
    IC --> R
    R --> SCH[Scheduler x3<br/>ZSET claim every 1s]
    SCH --> KES[(Kafka escalations)]
    KES --> IC
    KN --> NW[Notification workers<br/>per-channel pools]
    NW --> P[Twilio SMS / Voice / FCM / APNs / SendGrid / Slack]
    P -->|status webhook| WH[Webhook API] --> PG
    PG --> RR[(2 read replicas<br/>dashboards)]
    PG -.detach 90d partitions.-> S3[(S3 Parquet archive)]
```

#### 1. Ingest API -- stateless horizontal scaling

- Peak 6,000 eps. Ek Node instance realistically ~300-500 eps sambhalta hai (JSON parse + validate + Redis lookup + Kafka produce with `acks=all`). Toh **~15-20 instances**, headroom ke saath 24.
- Kafka produce ko **batch** karo: `linger.ms=5`, `batch.size=64KB`. 5 ms extra latency, par throughput kai guna. Hamara budget 5,000 ms hai -- 5 ms kuch nahi.
- `acks=all` + `min.insync.replicas=2`: producer tab tak `202` nahi deta jab tak 2 brokers ne likh nahi liya. **Yehi hamari durability guarantee hai.**
- Autoscale **CPU par nahi, `kafka_producer_queue_depth` par** -- CPU spike hone se pehle hi queue bharne lagti hai.

#### 2. Kafka partition count aur consumer group sizing -- yahan log fisalte hain

**Rule (yaad rakho):** ek partition ko ek consumer group mein **sirf ek** consumer padh sakta hai.

```
consumers <= partitions
```

Agar 24 partitions hain aur tum 30 consumer instances chalao, toh **6 instances khaali baithe rahenge** (idle, sirf paisa jala rahe). Partition count = tumhara **maximum parallelism**.

| Topic | Partitions | Key | Sizing ka kaaran |
|---|---|---|---|
| `incident-events` | **24** | `serviceId` | 6,000 eps peak / ~250 eps per partition safe budget = 24. Key `serviceId` se ek service ke events **ordered** rehte hain (trigger ke baad hi resolve process ho) |
| `notifications` | **48** | `incidentId` | Yahan throughput nahi, **concurrency** decide karti hai (neeche) |
| `escalations` | 12 | `incidentId` | Volume chhota (7.5M notif mein se ek hissa) |
| `notifications-dlq` | 6 | `incidentId` | Manual replay, throughput matter nahi karta |

**`notifications` ko 48 partitions kyun jab peak sirf 1,000/sec hai?**

Kyunki notification ka kaam CPU nahi, **wait** hai. Ek SMS send ~300 ms leta hai. Agar har partition ko strictly sequential process karein:

```
1 partition = 1 / 0.3 s = ~3.3 sends/sec
1,000 sends/sec chahiye -> ~300 partitions?!
```

300 partitions mehnga hai. Isliye hum **do cheezein milate hain**: 48 partitions **x** har partition ke andar bounded concurrency 16 = **768 concurrent sends**. Ye 1,000/sec ko aaram se kha jaata hai (768 / 0.3 s = 2,560 sends/sec capacity).

Trade-off: partition ke andar concurrency chalane se **us partition ka strict ordering toot jaata hai**. Kya ye chalega? Haan -- `notifications` ka key `incidentId` hai aur ek incident ke do notifications (push aur SMS) ke beech koi order dependency nahi. Jahan order chahiye tha (trigger vs resolve) woh `incident-events` topic hai, aur wahan hum **sequential** rehte hain.

**Repartitioning ka dard (interview favourite):**

Partition = `hash(key) % numPartitions`. Agar 24 se 48 kar do, toh **kal jo `serviceId` partition 3 par jaata tha, aaj partition 27 par jaayega**. Result:

```
Partition 3 : ...trigger(svc-A)  <-- abhi tak process nahi hua
Partition 27: resolve(svc-A)     <-- naya message, alag consumer, alag speed
```

Do alag consumers, do alag speeds -> **resolve pehle process ho sakta hai, trigger baad mein** -> ek incident create hota hai jo kabhi resolve nahi hoga, aur kisi ko 3 baje raat ko page jaata hai.

Isse bachne ke teen tareeke:

1. **Din 1 par over-provision karo.** Partitions sasti hain (ek partition = kuch MB memory + file handles). 24 ki jagah 48 se shuru karna aur consumers kam rakhna bilkul theek hai. **Partitions badhana aasaan hai, ghatana namumkin.**
2. **Drain-and-switch:** producers rok do, sab partitions ka lag 0 karo, phir partitions badhao, phir producers chaalu. Ingest path par ye **downtime** hai -- hamare liye acceptable nahi.
3. **Naya topic:** `incident-events-v2` banao, producers udhar switch karo, consumers dono topics padhein jab tak purana drain na ho jaaye. Zero downtime, thodi si code complexity. **100x par yahi karo.**

#### 3. Postgres scaling -- sahi order

Order yaad rakho, kyunki interviewer aksar seedha "shard kar dunga" sun kar khush nahi hota:

```
1. Indexes / query fix   (sabse sasta, ghanton ka kaam)
2. Read replicas          (reads hatao, writes nahi)
3. Partitioning           (retention + vacuum + index size)
4. Shard by account_id    (SABSE AAKHIR mein)
```

**Step 1 -- Indexes, aur ek chupa hua bottleneck.**

Sabse bada Postgres load **incident create karna nahi hai**. 579 eps mein se **95% dedup hits** hain -- yaani ~550 UPDATEs per second, aur storm peak par **~5,700 UPDATEs/sec**:

```sql
UPDATE incidents SET occurrence_count = occurrence_count + 1, last_seen_at = now() WHERE ...
```

**Code Explanation:** ye ek dedup hit ka poora kaam hai -- na naya incident, na koi page, sirf ek counter aur ek timestamp. Dikhne mein trivial hai, par ye **har second 550 baar** (peak par 5,700 baar) chalti hai. Har `UPDATE` ek nayi row version banata hai (Postgres MVCC), yaani WAL traffic, index maintenance aur autovacuum ka kaam -- teeno is "chhoti si query" se aate hain.

Yehi is DB ka sabse bhaari writer hai. Do fixes:

- **Duplicate par timeline row mat likho.** Har dedup hit par `incident_events` mein row daaloge toh 47.5M rows/day ban jaayenge sirf "phir se aaya" batane ke liye. Sirf `occurrence_count` badhao; timeline mein pehli aur aakhri occurrence kaafi hai.
- **Counter ko Redis mein jama karo, Postgres mein flush karo.** `dedup:<serviceId>:<dedupKey>` par `INCR`, aur har 10 s ek batch `UPDATE ... FROM (VALUES ...)` se saare counters ek query mein. 5,700 UPDATEs/sec -> ~50 batched statements/sec. Trade-off: `occurrence_count` ab 10 s stale ho sakta hai (dashboard par "63" ki jagah "58" dikh sakta hai) -- ye **poori tarah acceptable** hai, kyunki ye number sirf insaan ke padhne ke liye hai, kisi decision ka input nahi.

Baaki indexes spec mein already hain: `incidents_open_dedup_uniq` (partial, sirf non-resolved rows -- isliye chhota rehta hai) aur `incidents_open_by_service`. **Partial index ka fayda:** 450 GB table mein bhi "open incidents" sirf ~50K rows hain, toh index RAM mein fit ho jaata hai.

**Step 2 -- Read replicas (2, spec ke mutabik).**

Kya jaata hai replica par: incident list, incident detail + timeline, on-call schedule view, reports/analytics.
Kya **kabhi nahi** jaata replica par: dedup ka `INSERT ... ON CONFLICT`, state transitions, timer writes, aur **ack ke turant baad ka read** (PART 18 dekho).

Replicas ingest ko nahi bachate (woh sab writes hain) -- woh sirf **dashboard ko ingest se alag** karte hain. Ye 100x par zaruri hai kyunki outage ke waqt **hi** dono peak par hote hain: alerts bhi aa rahe hain aur 50 engineers dashboard refresh bhi kar rahe hain.

**Step 3 -- Partitioning (monthly range on `created_at`).**

- 2.5M incidents/day x 2 KB = **5 GB/day**, 90-day hot = **~450 GB**.
- Monthly partitions ka asli fayda **DELETE se bachna** hai. 90 din purane 150 GB ko `DELETE FROM incidents WHERE created_at < ...` se hatana = ghanton ka lock + autovacuum ka pahaad + WAL ka blast. Partition ke saath ye **ek metadata operation** hai:

```sql
ALTER TABLE incidents DETACH PARTITION incidents_2025_06 CONCURRENTLY;
-- phir S3 mein Parquet export, phir DROP TABLE incidents_2025_06;
```

**Code Explanation:** `DETACH PARTITION` sirf catalog mein likhta hai ki "ab ye child table parent ka hissa nahi hai" -- **ek bhi row chhui nahi jaati**, isliye ye milliseconds ka kaam hai. `CONCURRENTLY` (PG 14+) ise `ACCESS EXCLUSIVE` lock ke bina karta hai, yaani ingest chalti rehti hai. Detach ke baad woh ek normal standalone table hai: usse Parquet mein export karo aur `DROP TABLE` se ek hi baar mein poora file space wapas lo (`DELETE` ki tarah row-by-row vacuum nahi).

- Doosra fayda: har partition ke apne chhote indexes, aur autovacuum ka kaam per-partition baant jaata hai.
- Dhyan do: **partitioned table par unique index mein partition key hona chahiye**. `incidents_open_dedup_uniq (service_id, dedup_key)` mein `created_at` nahi hai -- yaani Postgres ise global unique nahi bana sakta. Do options: (a) unique constraint ko **sirf "current" partition** par rakho aur pichhli partitions ko read-only maano (open incidents 90 din purane hote hi nahi, p95 ack 10 min hai), ya (b) dedup ko ek chhoti alag `open_incidents(service_id, dedup_key, incident_id)` table mein rakho jo partitioned nahi hai aur jismein sirf ~50K rows hain. **Option (b) saaf hai** aur interview mein bolne layak hai -- ye woh detail hai jo dikhata hai ki tumne partitioning sach mein ki hai, sirf padhi nahi.

**Step 4 -- Shard by `account_id` (aur ye SABSE AAKHIR mein kyun).**

Shard key **`account_id` hi** hoga kyunki ek query kabhi do accounts ko touch nahi karti: service -> policy -> schedule -> user, sab ek hi account ke andar. Ye ek **perfect** shard key hai.

Fir bhi ye aakhir mein aata hai, kyunki:

| Cost | Detail |
|---|---|
| **Global uniqueness toot jaati hai** | `services.routing_key` UNIQUE poore system mein hai. Sharded par ek alag lookup service / consistent hashing chahiye routing key -> shard resolve karne ke liye |
| **Operations x N** | N primaries, N replica sets, N backup schedules, N schema migrations. Ek migration ab ek script nahi, ek project hai |
| **Cross-shard reporting mar jaati hai** | "Poore platform mein aaj kitne incidents?" ab ek query nahi, N queries + merge |
| **Hot shard** | Ek enterprise account 30% traffic bhej sakta hai. Shard rebalancing (`account_id` move karna) offline copy + cutover hai |
| **Zarurat hi nahi hai** | 450 GB hot data aur ~6K writes/sec ek achhe `db.r6g.4xlarge` par aaram se chalta hai. Sharding ki asli zarurat ~5-10 TB ya ~50K writes/sec par aati hai |

> Interview line: "Main Postgres ko is order mein scale karunga: pehle dedup UPDATE path ko batch karke likhunga kyunki 95% dedup ratio ki wajah se wahi sabse bada writer hai, phir dashboards read replicas par, phir monthly partitions taaki 90-day retention ek DETACH ho na ki ek ghante ka DELETE. Shard by `account_id` sabse aakhir mein -- shard key perfect hai lekin global unique routing key aur N-guna operations ki keemat hai, aur 450 GB par zarurat hi nahi."

#### 4. Timer / scheduler -- system ka chhupa hua bottleneck

Spec kehta hai: 50K active timers x ~100 B = **5 MB**. Memory bilkul problem nahi hai. Problem teen aur hain:

```
Problem 1: EK key par saara load
   sched:escalations ek single Redis key hai -> ek single hash slot -> EK Redis primary.
   Cluster mein 6 primaries hon, timer load fir bhi 1 par hi hai.

Problem 2: EK scheduler tick ka budget
   Har tick par claim -> kai hazaar timer ids -> har ek ke liye Kafka produce.
   3 instances hain par sab ek hi ZSET se claim karte hain (atomic, safe) --
   fir bhi woh Redis round trips ek hi key par serialize hote hain.

Problem 3: Lua ka `unpack(due)` bada batch nahi le sakta
   Lua ka C stack ~8000 entries par phat jaata hai ("too many results to unpack").
   Isliye batch size 500 se upar mat le jao.
```

Storm mein 50,000 timers ek hi second mein due ho sakte hain (ek DC gaya -> sab alerts ek saath aaye -> 5 min baad sab ek saath escalate honge). Batch 500 par woh **100 ticks = 100 seconds** ka lag hai. Hamara alert threshold `timer_lag_seconds > 10` hai -- yaani hum SLO se 10x bahar.

**Fix: ZSET ko shard karo.**

```
sched:escalations            ->   sched:escalations:0
                                  sched:escalations:1
                                  ...
                                  sched:escalations:15

shardIndex = hash32(escalationTimerId) % 16
```

```ts
// src/workers/scheduler.ts
const SHARDS = 16;
const BATCH = 500;

export function shardKeyFor(timerId: string): string {
  return `sched:escalations:${hash32(timerId) % SHARDS}`;   // 0..15
}

export class Scheduler {
  private cursor = Math.floor(Math.random() * SHARDS);      // har instance alag jagah se shuru

  async tick(now = Date.now()): Promise<void> {
    const started = Date.now();
    for (let n = 0; n < SHARDS; n++) {
      const shard = (this.cursor + n) % SHARDS;
      const due: string[] = await this.redis.evalsha(
        this.claimSha, 1, `sched:escalations:${shard}`, String(now), String(BATCH),
      );
      if (due.length === 0) continue;
      await this.fire(due);                                  // Kafka produce + DB state update
      if (Date.now() - started > 800) { this.cursor = (shard + 1) % SHARDS; return; }
    }
    this.cursor = (this.cursor + 1) % SHARDS;
  }
}
```

**Code Explanation:**

- `SHARDS = 16` -- 16 alag ZSET keys. Redis Cluster mein 16 alag hash slots -> load kai primaries par bikhar jaata hai, ek primary ka CPU pin nahi hota.
- `BATCH = 500` -- Lua ke `unpack()` ki limit ke neeche. 16 shards x 500 = **8,000 timers per tick**, aur tick har 1 s. 50K ka storm ab ~7 ticks mein khatam, 100 ticks mein nahi.
- `hash32(timerId) % SHARDS` -- timer ko shard **uske apne id se** map karo, `incidentId` ya `serviceId` se nahi. Kyun? Ek storm mein ek hi service ke hazaaron timers ek saath due hote hain; `serviceId` se hash karte toh woh sab **ek hi shard** par gir jaate aur sharding ka fayda hi khatam ho jaata.
- `this.cursor = Math.floor(Math.random() * SHARDS)` -- **fairness**. Agar har instance hamesha shard 0 se shuru kare, toh shard 15 sirf tab chalega jab pehle 15 khaali hon. Random start + round-robin cursor se har shard ko turn milta hai.
- `evalsha(this.claimSha, 1, key, now, BATCH)` -- Part 3 wala **atomic Lua claim** (`ZRANGEBYSCORE` + `ZREM` ek hi step mein). 3 scheduler instances chalein toh bhi ek timer sirf ek instance ko milega -- isliye leader election ki zarurat nahi (spec ka decision).
- `if (Date.now() - started > 800) ... return` -- **tick ko 1 second ke andar khatam karo.** Agar 800 ms ho gaye toh baaki shards agle tick par. Warna ticks overlap karenge aur event loop peeche girta jaayega (classic `setInterval` death spiral).
- `this.cursor = (shard + 1) % SHARDS` return se pehle -- agla tick wahin se shuru ho jahan chhoda tha, taaki koi shard bhooka na rahe.

**Sharding ke baad bhi ek cheez sach rehti hai:** ye ZSET ek **cache** hai, source of truth nahi. `escalation_timers` table durable copy hai aur recovery job (har 60 s, `ZADD NX`) usse rebuild karta hai. PART 17 mein isi ka failure case hai.

> Chetavani (Redis Cluster): key mein literal curly braces mat likhna. `sched:escalations:{3}` Redis Cluster mein **hash tag** hai -- iska matlab hai "sirf `3` ko hash karo". Agar tumne saare shards `{...}` ke saath likhe toh woh sab alag-alag slots par toh jaayenge par tumhara intent galat likha jaayega; aur agar tag same hua (`{escalations}:3`) toh saare shards **ek hi slot** par chale jaayenge aur sharding ka poora fayda khatam. Isliye plain `sched:escalations:3`.

#### 5. Provider throughput -- yahan tumhara code nahi, duniya limit karti hai

Peak 1,000 notifications/sec, jisme SMS 30% = **~300 SMS/sec**.

| Sender type | Throughput | 300 SMS/sec ke liye chahiye |
|---|---|---|
| Long code (normal 10-digit number) | **~1 SMS/sec** | 300 numbers (!) |
| Toll-free | ~3 SMS/sec | ~100 numbers |
| 10DLC (registered brand) | ~10-100 SMS/sec (campaign tier) | ~5-30 numbers |
| Short code (5-6 digit) | **~100 SMS/sec** | 3 short codes |

Teen practical baatein:

1. **Sender pool.** Ek Twilio Messaging Service mein 10-50 numbers daal do; Twilio khud rotate karta hai aur apni queue rakhta hai. Tumhara worker ek **pool** ko bhejta hai, ek number ko nahi.
2. **Sticky sender per user -- ye zaruri hai.** Agar Priya ko har baar alag number se SMS aaye toh (a) uske phone mein alag-alag threads ban jaayenge, (b) woh "4" reply karegi toh tumhe pata hona chahiye kis incident ka ack hai, aur (c) uska carrier ise spam maan ke block kar sakta hai. Isliye `hash(userId) % poolSize` se number fix karo (Messaging Service ka sticky sender yahi karta hai), aur inbound webhook mein `(From, To)` jodi se user resolve karo.
3. **Per-provider concurrency cap -- Rate Limiter lesson wapas aaya.** Provider ki limit tumhare **saare** workers milkar todte hain, isliye cap **shared Redis token bucket** par hona chahiye, har worker ki local memory mein nahi:

```ts
// src/providers/provider-registry.ts
const caps: Record<string, { key: string; ratePerSec: number; burst: number }> = {
  'twilio-sms':   { key: 'rl:prov:twilio-sms',   ratePerSec: 300,  burst: 600   },
  'twilio-voice': { key: 'rl:prov:twilio-voice', ratePerSec: 60,   burst: 60    },
  'fcm':          { key: 'rl:prov:fcm',          ratePerSec: 5000, burst: 10000 },
  'sendgrid':     { key: 'rl:prov:sendgrid',     ratePerSec: 500,  burst: 1000  },
};

async function sendWithCap(
  p: NotificationProvider, task: NotificationTask, addr: string, inc: Incident,
): Promise<ProviderResult> {
  const cap = caps[p.name];
  const ok = await tokenBucket.consume(cap.key, cap.ratePerSec, cap.burst, 1);
  if (!ok.allowed) {
    throw new RetryableError('provider_cap', ok.retryAfterMs);   // backoff + jitter; offset commit NAHI
  }
  return p.send(task, addr, inc);
}
```

**Code Explanation:**

- `caps` -- har provider ka apna budget. `twilio-voice` sirf 60/sec kyunki voice volume 5% hai aur har call 20-30 s chalti hai (concurrent calls ka apna alag limit hota hai, per-second se alag cheez).
- `tokenBucket.consume(...)` -- **wahi Lua token bucket** jo Rate Limiter lesson mein likha tha, bas identity ab "customer" nahi "provider" hai. Ek hi code do bilkul alag problems solve kar raha hai -- yehi acchhe abstraction ki nishani hai.
- `throw new RetryableError(...)` -- cap lagne par message ko **fail mat maano**. Kafka offset commit **nahi** hota, message backoff ke saath dobara process hoga. Yaani cap ka matlab "thoda ruk jao" hai, "chhod do" nahi.
- **Redis mein kyun, local memory mein kyun nahi?** 24 notification workers hain. Har ek apna local 300/sec rakhe toh total 7,200/sec Twilio ko jaayega -> Twilio 429 -> circuit breaker open -> **pages ruk gaye**. Shared bucket hi sahi jawab hai.

#### 6. Per-channel worker pools -- ek shared pool kyun galat hai

Ek hi pool mein sab channels daalne par kya hota hai:

```
Shared pool (concurrency 100):
  slot 1..97   -> voice calls, har ek 25 SECONDS ring kar raha hai
  slot 98..100 -> push notifications, jo 80 MILLISECONDS mein ho jaate

  Result: 97 slots 25 s ke liye block. Push queue ka lag 30 s.
  Push = sabse SASTA, sabse TEZ, aur LEVEL-1 ka PEHLA page hai.
  Yaani sabse important cheez sabse slow cheez ke peeche fas gayi.
```

Isko **head-of-line blocking** kehte hain: line mein ek slow banda poori line rok deta hai.

| Channel | Typical latency | Cost per message | Pool size (100x) | Kyun |
|---|---|---|---|---|
| `push` | 50-100 ms | ~$0 | 400 | Tez, sasta, level-1 ka pehla page. Sabse bada pool |
| `sms` | 200-500 ms | $0.0075 | 300 | Provider cap 300/sec se match |
| `email` | 200-800 ms | ~$0.0001 | 200 | Low urgency + digest |
| `voice` | 20-30 s | $0.013/min | 100 | Slow aur mehnga, apne kone mein |
| `slack` | 100-300 ms | $0 | 100 | Webhook; customer ka apna rate limit alag |

Alag pools ke teen aur fayde:

- **Blast radius alag.** Twilio down -> SMS pool bhar jaayega, par push aur email chalte rahenge. Shared pool mein Twilio ka outage **sab** channels rok deta.
- **Circuit breaker ka matlab banta hai.** `cb:<provider>` per provider hai; per-channel pool ke bina ek open breaker doosre channels ke slots bhi kha raha hota.
- **Alag scaling.** Email digest ka spike SMS pool ko touch nahi karta.

100x par hum spec ke mutabik **ek hi `notifications` topic (48 partitions)** rakhte hain aur pools **worker process ke andar** banate hain (`p-limit` jaisa bounded concurrency, per channel ek limiter). 1000x par topic hi split hota hai (neeche).

#### 7. S3 archiving

| Data | Hot store | Retention | Archive |
|---|---|---|---|
| Raw events | Kafka `incident-events` | **7 days** (350 GB, RF3 -> ~1 TB disk) | S3 sink connector -> `s3://.../events/dt=YYYY-MM-DD/` (Parquet, gzip) |
| `incidents` | Postgres monthly partitions | **90 days** (~450 GB) | `DETACH PARTITION` -> Parquet -> `DROP` |
| `incident_events` (timeline) | Postgres | 90 days (incident ke saath) | Incident ke saath S3 par (audit ke liye lamba rakho) |
| `notifications` + `notification_attempts` | Postgres | **30 days** (~120 GB) | Aggregates rakho, raw rows drop |

- **Raw events kyun rakhne hain:** **replay.** Bug fix ke baad "pichle 3 din ke events dobara process karo" tabhi possible hai jab events kahin pade hon. Yehi Kafka choose karne ka ek bada kaaran tha (RabbitMQ mein message consume hote hi gaya).
- **Replay ka khatra:** 3 din ke events dobara chala doge toh **3 din ke purane pages dobara** chale jaayenge. Isliye replay hamesha ek flag ke saath: `replay: true` -> incidents banao/update karo, **notifications suppress karo**. Ye switch pehle se code mein hona chahiye; outage ke beech mein likhne ka waqt nahi milta.
- Cost: S3 Standard-IA par 1 TB/month ~$12. Postgres par wahi 1 TB ~$120/month + backup. **~10x sasta** -- isliye archive sirf "neat" nahi, budget decision hai.

**100x par sabse pehle kya toota:**

| # | Kya toota | Symptom | Kya add kiya | Kyun |
|---|---|---|---|---|
| 1 | Dedup `UPDATE` se Postgres ka WAL + autovacuum | Write latency p99 20 ms -> 300 ms | Redis counter + 10 s batched flush | 95% traffic dedup hit hai, wahi sabse bada writer tha |
| 2 | Single ZSET par timer lag | `timer_lag_seconds` storm mein 90 s | 16 ZSET shards + 800 ms tick budget | Ek key = ek slot = ek primary |
| 3 | Twilio 429 storm | SMS failure rate 40%, breaker open | Shared Redis per-provider cap + sender pool | Provider limit ko saare workers milkar todte the |
| 4 | Voice calls ne push ko block kiya | Push p95 80 ms -> 30 s | Per-channel bounded pools | Head-of-line blocking |
| 5 | 90-day `DELETE` ne DB 2 ghante lock kiya | Nightly job ne ingest slow kar diya | Monthly partitions + `DETACH` | DELETE = row-by-row + vacuum; DETACH = metadata |

- **Cost direction (100x):** provider ~$22K/day = **~$8M/year**. Infra (Kafka 6 brokers + PG r6g.4xlarge + 2 replicas + Redis Cluster + ~50 Node instances) ~$25-35K/**month**. Yaani provider bill infra bill ka **~20 guna**. Har architecture decision ab ek cost decision bhi hai: "push pehle try karo" sirf latency ke liye nahi, $17K/day bachane ke liye hai.

### 1000x -- 500M events/day (~5,787 eps avg, ~58,000 eps storm peak)

Numbers: **25M incidents/day = ~290 incidents/sec average** (~1.04M incidents/hour, storm peak ~3,000/sec), **75M notifications/day = ~870/sec avg, ~10,000/sec peak**, provider bill **~$220K/day**.

```
                 Region: us-east                        Region: eu-west
   LB + WAF                                      LB + WAF
      |                                              |
   Ingest API x ~150                              Ingest API x ~60
      |                                              |
   Kafka incident-events (240 partitions)         Kafka (apna alag cluster)
      |                                              |
   Incident consumers x 240                       Incident consumers x 60
      |                                              |
   Postgres SHARDED by account_id                 Postgres shards (EU accounts)
   (8 shards x [primary + 2 replicas])
      |
   Kafka notifications.push  (240 part.)  -> push workers
        notifications.sms    (240 part.)  -> sms workers -> sender pool (30 short codes,
        notifications.voice  ( 60 part.)  -> voice workers   3 providers)
        notifications.email  ( 60 part.)  -> email workers
      |
   Scheduler x 12, ZSET 256 shards across Redis Cluster
```

| Bottleneck | Kyun | Kya karunga |
|---|---|---|
| **Kafka partitions** | 58K eps / 250 eps per partition = **~232** | `incident-events` 240 partitions -> consumer group max 240 instances. Migration naye topic (`-v2`) + dual consume se, live repartition se nahi |
| **Consumers > partitions** | 300 instances chalao toh 60 **idle** | Partition count hamesha max desired instances se upar rakho. Ye capacity planning ka input hai, afterthought nahi |
| **Postgres writes** | ~3,000 incidents/sec peak x ~8 row writes = **~24K writes/sec** | **Ab sharding sach mein chahiye**: 8 shards by `account_id`. `routing_key -> shard` ek chhoti global lookup table + Redis cache se |
| **Timers** | Storm mein ~500K active timers | ZSET shards 16 -> **256**; 12 scheduler instances, har ek ~20 shards ka owner (consistent hashing se assign, taaki do instance ek shard par na ladein) |
| **Provider throughput** | 3,000 SMS/sec peak | **Multi-provider**: Twilio + MessageBird + Sinch, weighted split + automatic failover. Ek provider ki limit ab tumhari limit nahi |
| **Provider cost** | $220K/day = **~$80M/year** | Push-first aggressively (level-1 sirf push + Slack), SMS level-2 par, voice sirf level-3 + `critical`. Grouping default ON |
| **Cross-region latency** | EU customer ka event US Kafka tak 90 ms+ | **Region-local ingest + processing**; har account ka ek "home region", cross-region sirf async replication (metadata) |
| **Blast radius** | Ek bug sabko down kar deta hai | **Cell-based architecture**: har cell = apna Kafka + PG shard + workers + Redis, ~2,000 accounts per cell; deploy ek cell se shuru |

**1000x ka sabse bada mental shift:** ab tum ek single system nahi, **kai chhote identical systems (cells)** chala rahe ho. Kyun? Kyunki ek paging platform ke liye sabse bada business risk hai **"saare customers ek saath andhere mein"**. 8 cells mein ek cell down = 12.5% customers affected, 100% nahi.

**1000x par sabse pehle kya toota:**

| # | Kya toota | Kya add kiya | Kyun |
|---|---|---|---|
| 1 | Ek Postgres primary 24K writes/sec par pin | Shard by `account_id` (8 shards) | Vertical scaling ki chhat aa gayi |
| 2 | Partition count consumer scaling ko cap kar raha tha | Naya topic 240 partitions, dual-consume migration | Live repartition ordering todta hai |
| 3 | Ek provider ki global limit | Multi-provider routing + failover | Twilio bhi ek single point of failure hai |
| 4 | Ek bad deploy = poora platform | Cells + per-cell staged rollout | Blast radius kam karna hi availability hai |
| 5 | $80M/year provider bill | Channel policy sakht: push-first, grouping default ON | Cost ab #1 constraint hai |

> Interview line: "1000x par teen cheezein badalti hain. Ek, Kafka partition count hi mera max consumer count hai -- 240 partitions, aur badhane ke liye naya topic banaunga kyunki live repartition ordering todta hai aur `resolve` `trigger` se pehle process ho sakta hai. Do, Postgres ab sach mein `account_id` par shard hoga kyunki ~24K writes/sec ek primary ki chhat hai. Teen, aur ye sabse important -- main cells banaunga, har cell 2,000 accounts ka poora independent stack, kyunki ek paging platform ke liye 'saare customers ek saath andhere mein' sabse bada risk hai."

## PART 17 -- Failure Scenarios (interviewer style)

Format: **Problem -> Impact -> Solution**, plus **honest trade-off** aur **customer ko kya dikhta hai**.

Golden rules (spec se):

> 1. **Ingest par FAIL CLOSED.** Jo event tum durably store nahi kar sakte, uspar `202` mat bolo.
> 2. **Delivery par AT-LEAST-ONCE.** Duplicate page chalega, missed page nahi.
> 3. **Timers Redis mein cache hain, `escalation_timers` table mein sach hai.**

### Failure map (ek nazar mein)

```
Failure                          Events accept?   Pages jaate hain?   Customer ko kya dikhta hai
Kafka down (ingest)              NAHI (503)       Purane chal rahe    Alertmanager retry / error
Postgres primary down            HAAN (Kafka)     NAHI, buffered      Dashboard 503, pages late
Postgres replica lag             HAAN             HAAN                Stale incident list
Redis wiped / failover           HAAN             HAAN (escalations late) Escalation 60 s tak late
Scheduler crash mid-claim        HAAN             Kuch escalations late Recovery job se aate hain
Worker crash after send          HAAN             HAAN + DUPLICATE    Do SMS, ek hi incident
Twilio down                      HAAN             HAAN (failover/push) SMS ki jagah push/voice
APNs token invalid               HAAN             HAAN (SMS par gira)  Push nahi, SMS aaya
Alert storm (ek customer)        HAAN (throttled) Grouped             "checkout: 63 new incidents"
Poison message                   HAAN             NAHI (us partition)  Ek partition ruka -> DLQ
Nobody acks                      HAAN             Exhausted           Account owner ko email
Clock skew                       HAAN             Early/late timers   Escalation 30 s jaldi ya der se
Scheduler silently dead          HAAN             LEVEL 1 HAAN, escalation NAHI   Sabse khatarnak: kuch nahi dikhta
```

### 1. "Kafka down ho gaya jab event aa raha tha?"

- **Problem:** `incident-events` topic ke brokers reachable nahi, ya `min.insync.replicas=2` satisfy nahi ho raha (2 brokers down).
- **Impact:** ingest API `acks=all` par block ho jaayegi. Agar hum "best effort, memory mein rakh lete hain" karein, toh crash par **event chup-chaap gayab** -- yaani ek production outage jiska page kabhi nahi bheja gaya. Ye sabse bura outcome hai.
- **Solution -- do layer:**

```ts
// src/controllers/events.controller.ts
export async function enqueue(req: Request, res: Response): Promise<void> {
  const event = req.validatedEvent as IncomingEvent;
  try {
    await kafka.produce('incident-events', event.serviceId, event, { acks: -1, timeout: 3000 });
    res.status(202).json({ status: 'accepted', dedupKey: event.dedupKey });
    return;
  } catch (err) {
    ingestKafkaErrors.inc();
    const spooled = await spool.append(event);            // bounded local disk spool (~60 s)
    if (spooled) {
      ingestSpooled.inc();
      res.status(202).json({ status: 'accepted', dedupKey: event.dedupKey, degraded: true });
      return;
    }
    ingestRejected.inc();
    res.status(503).json({ error: 'INGEST_UNAVAILABLE', retryAfter: 5 });
  }
}
```

**Code Explanation:**

- `acks: -1` (`acks=all`) + `timeout: 3000` -- 3 s tak intezaar ki 2 in-sync replicas ne likh liya. 3 s hamare 5,000 ms p95 budget ke andar hai.
- `res.status(202)` **produce ke baad** -- pehle nahi. Yehi "durability before acknowledgement" ka poora matlab hai.
- `spool.append(event)` -- **bounded local disk spool**: ek append-only file per instance, size cap ~60 s ka traffic (peak 250 eps per instance x 60 s x 1 KB = ~15 MB). Ek background flusher Kafka wapas aate hi spool ko drain karta hai.
- `spooled === false` (file full) -> **`503 INGEST_UNAVAILABLE`**. Jhooth nahi bolte.
- `retryAfter: 5` -- Alertmanager / Datadog jaise sender khud retry karte hain. Unka retry hamara backup buffer hai.
- `degraded: true` -- client ko honest signal ki accept hua par normal path se nahi.

**Trade-off:** spool ek **single-instance durability** hai. Us box ki disk gayi toh spool bhi gaya. Isliye spool ko chhota rakho (minutes, ghante nahi) aur `ingest_spooled_total > 0` par turant page karo.

**Customer ko kya dikhta hai:** Alertmanager ke logs mein `503`, aur uska apna retry. Uska alert **thoda late** pahunchega par gayab nahi hoga. Agar hum `202` bol kar event kha jaate, toh uska alert **chup-chaap** gayab hota aur usse bura kuch nahi.

> **Rate Limiter se contrast (ye poora lesson hai):** Rate Limiter mein Redis down hone par hum **fail OPEN** hote the -- request aage jaane do, kyunki limiter ka kaam sirf protection hai aur API chalni chahiye. Yahan hum **fail CLOSED** hote hain. Kyun? Kyunki hamara "kaam" hi accept karna hai. **Ek page jise tum deliver nahi kar sakte, usko accept kar lena jhooth hai -- aur chup jhooth ek loud "no" se hamesha zyada khatarnak hai.**

---

### 2. "Postgres primary down ho gaya?"

- **Problem:** primary crash / AZ failure / failover ke 30-60 s.
- **Impact:**
  - **Ingest chalti rehti hai** (Kafka ko PG ki zarurat nahi) -- events safe hain. [OK]
  - **Incident consumers ruk jaate hain**: dedup `INSERT ... ON CONFLICT` fail. Consumer offset commit nahi karega, message dobara try hoga. Kafka lag badhta jaayega.
  - **Naye pages nahi jaayenge** jab tak DB wapas na aaye. Ye asli dard hai.
  - Dashboard read replicas se **read-only mode** mein chal sakta hai (incidents dikh rahe hain, ack button disabled).
- **Solution:**
  - **Managed Postgres with Multi-AZ automatic failover** (RDS/Aurora): 30-60 s mein standby promote. `pg` pool par `connectionTimeoutMillis: 3000` aur retry-with-backoff, taaki consumer failover ke dauraan bas peeche padta rahe, crash na kare.
  - Consumer ko `pause()` kar do jab DB errors ka rate high ho, aur `resume()` health wapas aane par -- warna 24 consumers har 100 ms par DB ko hit karke recovery ko hi slow kar denge (**thundering herd on recovery**).
  - **Kafka lag hi hamara buffer hai.** 7-day retention ka matlab hai ki 30 min ka DB outage bhi data loss nahi hai, sirf **delay** hai.
  - Failover ke baad consumers apne aap catch up karte hain. 30 min outage = 30 min x 579 eps = ~1M events ka backlog; 24 consumers x ~250 eps = 6,000 eps drain rate -> **~3 min** mein catch-up. Ye math interview mein bolna acchha lagta hai.

**Trade-off:** hum **availability nahi, durability** choose kar rahe hain. DB down par hum pages ko **delay** karte hain, drop nahi. Alternative (pages ko DB ke bina bhej dena) se dedup toot jaata aur ek storm 50,000 duplicate SMS bhej deta.

**Customer ko kya dikhta hai:** pages 1-3 min late (failover + catch-up), dashboard "read-only, recovering" banner. Koi page **kho nahi raha**.

---

### 3. "Read replica lag ki wajah se incident list purani dikh rahi hai?"

- **Problem:** replication lag 200 ms se 30 s (bada write burst, vacuum, ya network). Dashboard replicas se padhta hai.
- **Impact:** teen alag-alag dard:
  1. Responder ne **ack** kiya, page refresh kiya, incident abhi bhi `triggered` dikha raha hai -> woh **dobara ack** karta hai -> confusion ("system kaam nahi kar raha").
  2. Naya incident abhi bana, dashboard par 10 s tak dikha hi nahi -> responder ko push aaya par link kholne par "not found".
  3. Do responders mein se ek ko "acknowledged by Priya" dikh raha hai, doosre ko nahi.
- **Solution:**
  - **Read-your-writes:** `POST /incidents/:id/acknowledge` ka response mein **updated incident object** wapas bhejo. UI usi se apna state update kare, re-fetch na kare. Ye sabse sasta aur sabse effective fix hai.
  - Jahan re-fetch zaruri hai: write ke baad **N seconds tak primary se padho** (sticky read). Ek `x-read-primary-until: <epochMs>` cookie/header client ko do; API woh dekh kar routing decide kare.
  - `pg_stat_replication` se **lag ko metric banao** aur lag > 5 s hone par dashboard ko automatically primary par bhej do (ya banner dikhao: "data up to 30 s purana ho sakta hai").
  - Incident **detail page kabhi bhi replica se load mat karo** agar user ne abhi ack kiya ho -- list replica se theek hai.

**Trade-off:** primary par sticky reads daalne se primary ka load badhta hai. Isliye window chhoti rakho (10 s) aur sirf un users ke liye jinhone abhi likha hai.

**Customer ko kya dikhta hai:** kuch nahi, agar fix laga ho. Bina fix ke: "maine ack kiya tha, phir bhi mujhe escalation call aaya" -- jo asal mein sach nahi hota (ack ho chuka hota hai, escalation cancel ho chuki hoti hai), par **trust mar jaata hai.**

### 4. "Redis wipe ho gaya ya failover hua -- saare timers gaye?"

- **Problem:** Redis primary crash + replica promote (async replication -> last kuch seconds ke `ZADD` gaye), ya kisi ne `FLUSHALL` chala diya, ya maxmemory eviction ne ZSET ko kha liya.
- **Impact:** **saare pending escalation timers gaayab.** Yaani: level-1 page ja chuka hai, responder so raha hai, aur 5 min baad jo escalation aani thi woh **kabhi nahi aayegi.** Ye is system ka sabse chup-chaap aur sabse khatarnak failure hai -- koi error log nahi, koi 500 nahi, bas **kuch hota hi nahi.**
- **Solution -- spec ka recovery job:**

```ts
// src/workers/timer-recovery.ts -- har 60 s
export async function recoverTimers(): Promise<void> {
  const rows = await db.query<{ id: string; due_at: Date }>(
    `SELECT id, due_at FROM escalation_timers
      WHERE state = 'pending' AND due_at < now() + interval '5 minutes'
      ORDER BY due_at LIMIT 10000`,
  );
  let restored = 0;
  const pipe = redis.pipeline();
  for (const r of rows) {
    pipe.zadd(shardKeyFor(r.id), 'NX', r.due_at.getTime(), r.id);   // NX = jo already hai use mat chhedo
    restored++;
  }
  const results = await pipe.exec();
  timersRestored.inc(results.filter(([, added]) => added === 1).length);
  timerRecoveryScanned.set(restored);
}
```

**Code Explanation:**

- `state = 'pending'` -- jo fire ya cancel ho chuke unko wapas laane ka matlab hi nahi (warna ack ho chuke incident par escalation chali jaati).
- `due_at < now() + interval '5 minutes'` -- **poori table nahi**, sirf agle 5 min ka window. Table mein lakhon rows ho sakti hain; ZSET mein sirf "jald aane wale" chahiye. `escalation_timers_due` partial index isi query ke liye bana tha.
- `'NX'` -- **idempotency ka pura jaadu yahin hai.** Agar timer ZSET mein already hai (normal case, 99.9%), `ZADD NX` kuch nahi karta. Agar Redis wipe hua tha, toh add ho jaata hai. Isliye ye job har 60 s bina soche chalaya ja sakta hai.
- `shardKeyFor(r.id)` -- wahi sharding function jo scheduler use karta hai, warna timer galat shard mein jaakar kabhi claim hi nahi hoga. **Ek hi jagah define karo, do jagah copy mat karo.**
- `results.filter(([, added]) => added === 1)` -- `ZADD NX` `1` return karta hai jab naya add hua. Healthy system mein ye **hamesha 0** rehna chahiye. `timers_restored_total > 0` ek **alert** hai: "Redis ne timers khoye the".
- `LIMIT 10000` -- recovery job khud ek storm na ban jaaye.

**Recovery window ka honest sach:** worst case ek timer **60 s late** fire karega (recovery job ka interval). 5 min ke `ackTimeoutMin` par 60 s ka extra = 20% late escalation. Acceptable. Agar nahi chahiye toh Redis failover event par recovery job ko **turant** trigger karo (Sentinel/ElastiCache ka failover notification sun kar).

**Trade-off:** hum Redis ko fast path aur Postgres ko truth maan rahe hain -- yaani har timer **do jagah** likhna padta hai (ek extra DB write per incident). Ye cost hum khushi se de rahe hain. Spec ki line yaad rakho: **"timers ko sirf Redis mein rakhna is system ki sabse badi galti hogi."**

**Customer ko kya dikhta hai:** escalation ~60 s late. Aur agar recovery job hota hi nahi, toh **kabhi nahi** -- aur customer ko subah pata chalta hai ki raat bhar unki site down thi.

### 5. "Scheduler instance claim ke beech mein hi crash ho gaya?"

- **Problem:** Lua claim ne 500 timer ids `ZREM` kar diye aur return kar diye. Ab woh 500 ids **sirf us process ki memory mein** hain. Usi waqt process OOM ho gaya / pod evict ho gaya.
- **Impact:** woh 500 escalations **ZSET se nikal chuke hain par kabhi fire nahi hue.** Fir se woh chup-chaap wali maut.
- **Solution -- durable table hi bachata hai:**
  - Claim ke waqt hum ZSET se **remove** karte hain par `escalation_timers.state` abhi bhi `'pending'` hai. Crash hua -> next recovery job (max 60 s) un rows ko dekhega (`state='pending' AND due_at < now()+5min`) aur `ZADD NX` se wapas daal dega. **Timer wapas aa gaya.**
  - **Isliye order matter karta hai.** Sahi order ye hai:

```ts
// src/workers/scheduler.ts -- fire()
async function fire(timerIds: string[]): Promise<void> {
  for (const id of timerIds) {
    const t = await timerRepo.get(id);
    if (!t || t.state !== 'pending') continue;            // ack ho gaya tha -> cancelled, skip

    // 1. Kafka ko PEHLE batao (durable work handover)
    await kafka.produce('escalations', t.incidentId, {
      escalationTimerId: t.id, incidentId: t.incidentId, level: t.level,
    }, { acks: -1 });

    // 2. TAB jaake 'fired' likho
    await timerRepo.markFired(t.id);
    escalationsFired.inc({ level: String(t.level) });
  }
}
```

**Code Explanation:**

- `if (!t || t.state !== 'pending') continue;` -- **last-moment check**. Claim aur fire ke beech mein responder ne ack kar diya ho sakta hai; tab `state='cancelled'` hoga aur hum page nahi bhejenge. Ye wahi pattern hai jo notification worker mein bhi hai (spec: "ack cancels work").
- **Step 1 pehle, step 2 baad mein -- ye ulta karne par kya hota hai?** Agar hum pehle `markFired()` karte aur phir crash ho jaate, toh row `fired` ho chuki hoti, recovery job use kabhi nahi uthata, aur **escalation hamesha ke liye gaayab.** Isliye: **pehle kaam handover karo (Kafka), phir batao ki kaam ho gaya.**
- Crash step 1 aur 2 ke beech mein hua toh? Kafka ko message ja chuka hai **aur** row `pending` hai -> recovery job dobara ZADD karega -> timer dobara fire hoga -> **duplicate escalation**. Aur yehi hum chahte hain: **duplicate page OK, missed page NOT.**
- Duplicate ko aage roka jaata hai: escalation consumer `incidents.escalation_level` ko optimistic lock ke saath badhata hai (`WHERE escalation_level = $current`), toh doosri baar 0 rows update honge aur woh escalation **no-op** ho jaayegi.
- `acks: -1` -- yahan bhi durability; `escalations` topic par bhi "likha gaya" ka matlab "2 brokers par hai".

**Trade-off:** ye design **duplicate work** ki taraf jhuka hua hai. Har crash ka natija ek extra page ho sakta hai. Alternative (exactly-once ke liye Kafka transactions + DB 2PC) bahut complex hai aur fir bhi third-party SMS par exactly-once nahi de sakta (PART 18).

**Customer ko kya dikhta hai:** best case kuch nahi; worst case ek extra escalation SMS. Timeline mein do `escalated` entries dikhengi -- isliye timeline mein `escalationTimerId` bhi log karo taaki support samajh sake.

### 6. "Notification worker provider ko send karne ke BAAD, commit se PEHLE crash ho gaya?"

- **Problem:** worker ne Twilio ko SMS de diya (Twilio ne `SM123` return kiya), phir `notifications` row insert karne se pehle ya Kafka offset commit karne se pehle pod mar gaya.
- **Impact:** Kafka offset commit nahi hua -> message dobara deliver hoga -> **doosra SMS** jaayega. User ko do SMS.
- **Solution -- teen layer, aur teeno ke baad bhi 100% nahi:**

```ts
// src/workers/notification.worker.ts
export async function handle(task: NotificationTask): Promise<void> {
  // LAYER 1: claim the task in Postgres BEFORE calling the provider
  const claimed = await db.query(
    `INSERT INTO notifications (id, task_id, incident_id, user_id, channel,
                                contact_method_id, status, escalation_level)
     VALUES ($1,$2,$3,$4,$5,$6,'queued',$7)
     ON CONFLICT (task_id) DO NOTHING
     RETURNING id`,
    [uuid(), task.taskId, task.incidentId, task.userId, task.channel,
     task.contactMethodId, task.escalationLevel],
  );
  if (claimed.rowCount === 0) {
    duplicateTasksSkipped.inc({ channel: task.channel });
    return;                                   // koi aur (ya pichla attempt) already bhej chuka hai
  }

  // LAYER 2: last-moment cancel check (ack ho gaya ho sakta hai)
  if (await incidentRepo.isAcknowledgedOrResolved(task.incidentId)) {
    await notificationRepo.markCancelled(task.taskId);
    return;
  }

  // LAYER 3: send, then record
  const result = await sendWithCap(provider, task, address, incident);
  await notificationRepo.markSent(task.taskId, result.providerMessageId, provider.name);
}
```

**Code Explanation:**

- `ON CONFLICT (task_id) DO NOTHING RETURNING id` -- spec ka `notifications_task_uniq` unique index yahan kaam aata hai. **Pehla** worker row banata hai; **doosra** (retry/rebalance ke baad) `rowCount === 0` paata hai aur chup-chaap nikal jaata hai. Ye "send karne se pehle claim karo" pattern hai.
- `claimed.rowCount === 0 -> return` -- **duplicate SMS yahin ruk jaata hai**, 99% cases mein.
- **Baaki 1% kya hai?** Agar crash `INSERT` (status `queued`) ke baad aur Twilio call ke beech mein hua, toh row `queued` par atki hai aur **koi SMS gaya hi nahi** -- doosra worker `DO NOTHING` dekh kar skip kar dega -> **missed page**. Isse bachne ke liye ek **stuck-queued sweeper** chahiye: `status='queued' AND created_at < now() - interval '60 seconds'` -> retry karo. Yaani hum jaan-boojh kar duplicate ki taraf jhukte hain.
- `isAcknowledgedOrResolved(...)` -- spec ka rule: task queue mein pada ho sakta hai jab ack ho jaaye. Send se **just pehle** check karo. Ye ek extra DB/Redis read hai -- $17K/day SMS bill ke saamne sasta.
- `markSent(...)` **send ke baad** -- yahi crash window hai. Chhota hai (~1 network call), par zero nahi.

**Honest trade-off:** `task_id` unique index + stuck sweeper duplicates ko **rare** banate hain, **impossible nahi**. Twilio SMS par koi general idempotency-key header nahi hai jispar hum bharosa kar sakein, aur "DB commit + third-party API call" ko ek transaction mein nahi bandha ja sakta. Isliye design principle: **duplicate page is OK.**

**Customer ko kya dikhta hai:** kabhi-kabhi do SMS, ek hi incident ke liye. Isi liye SMS text mein incident number aur short link (`sho.rt/i/abc`) hota hai -- user dekh leta hai ki ye wahi incident hai.

### 7. "Twilio down hai / Twilio 429 de raha hai?"

Do alag cheezein hain, do alag jawab:

**(a) Twilio down (5xx / timeout):**

- **Impact:** SMS aur voice dono gaye (dono Twilio hain) -- yaani hamari 35% delivery capacity.
- **Solution:**
  - **Circuit breaker** (spec: 30 s rolling window, >50% failures in >=20 requests -> `open` 30 s -> `half-open` 5 probes). Breaker open hote hi har SMS task turant fail hota hai -- **5 s ka timeout bharne ki zarurat nahi**. Isse worker pool khaali rehta hai aur baaki channels tez chalte hain.
  - **Provider failover:** `twilio-sms` open -> `messagebird-sms`. Provider registry mein per-channel ek ordered list rakho.
  - **Channel downgrade:** agar SMS ke saare providers down hain -> **push + Slack par jao aur level-2 escalation ko jaldi trigger karo**. Yaani channel failure ko escalation trigger ki tarah treat karo.
  - Retry: exponential backoff **with full jitter** (spec: `delay = random(0, min(30000, 1000 * 2^attempt))`), max 5 attempts, phir agla channel / DLQ.
- **Trade-off:** do providers rakhna matlab do contracts, do compliance registrations (10DLC/short code alag-alag), aur do integrations test karne padte hain. Chhoti company ke liye ye overkill hai; 100x par ye zaruri hai.
- **Customer ko kya dikhta hai:** SMS ki jagah push/Slack, aur timeline mein "SMS failed (provider unavailable), escalated early".

**(b) Twilio 429 (rate limited):**

- **Impact:** ye **hamari galti** hai, Twilio ki nahi -- hum apne cap se zyada bhej rahe hain.
- **Solution:** 429 ko breaker ke failure count mein **mat** ginn -- warna breaker open ho jaayega aur hum apne aap ko block kar lenge jabki provider bilkul healthy hai. 429 ka sahi jawab: **shared token bucket ka rate ghatao** (adaptive: 429 aaya toh `ratePerSec` 20% kam, 60 s clean chala toh 10% wapas badhao) aur `Retry-After` header maano.
- **Trade-off:** adaptive rate se throughput thoda oscillate karta hai. Simple alternative: cap ko provider ki documented limit se 20% neeche fix rakho aur bhool jao. 100x par simple wala kaafi hai.

### 8. "APNs / FCM ka device token invalid ho gaya?"

- **Problem:** user ne app uninstall ki, ya iOS ne token rotate kar diya. APNs `410 Unregistered` / FCM `UNREGISTERED` deta hai.
- **Impact:** push **chup-chaap** fail. Aur push hamara **level-1 ka pehla, sabse tez, sabse sasta** channel hai. Agar hum ise "failed" maan kar retry karte rahein toh 5 attempts x backoff = **~60 s barbaad** aur user ko SMS bahut late milega.
- **Solution:**
  - `410 / UNREGISTERED / InvalidRegistration` = **permanent failure. Retry mat karo** (spec ka rule: provider 4xx = permanent).
  - Turant `contact_methods` ki us row ko `verified = false` kar do aur **agle channel par jump** karo (SMS), backoff ke bina.
  - User ke dashboard par banner: "Aapke iPhone par push notifications kaam nahi kar rahe -- app kholein." Aur weekly email digest mein bhi.
  - `notification_attempts_total{channel="push",result="permanent_fail"}` par alert: agar ye 5% se upar gaya, matlab hamara token refresh flow (app side) toota hua hai.
- **Trade-off:** token ko turant disable karne se ek "false positive" (temporary APNs glitch) user ko push se kaat sakta hai. Isliye disable karne se pehle **2 consecutive permanent failures** ginno, ek nahi.
- **Customer ko kya dikhta hai:** push nahi, SMS ~1 s baad. Usko lagta hai system ne kaam kiya -- aur technically kiya bhi.

### 9. "SendGrid email reject kar raha hai?"

- **Problem:** `550 bounce` (address exist nahi karta), `spam complaint` ke baad suppression list, ya poora SendGrid outage.
- **Impact:** email **low-urgency ka primary channel** hai (spec: `warning|info` sirf email/digest). Agar email chup-chaap mar raha hai toh low-urgency alerts poori tarah gaayab ho rahe hain aur **kisi ko pata bhi nahi chalega**, kyunki low-urgency par koi escalation nahi hoti.
- **Solution:**
  - **Bounce webhook** ko handle karo: hard bounce -> `contact_methods.verified = false` + user ko dashboard par dikhao. Soft bounce -> retry.
  - **Suppression list ko apne paas mirror karo.** Warna tum har din wahi address bhejte rahoge aur SendGrid tumhari poori domain reputation gira dega.
  - Outage par: **failover email provider** (SES) ya, high-urgency ke liye, channel downgrade to push.
  - **Low-urgency ke liye ek alag safety net:** daily digest ka delivery rate track karo. `notification_attempts_total{channel="email",result="failed"}` ka ratio > 2% = warn.
- **Trade-off:** email ke liye failover provider rakhna matlab do domains warm-up karni padti hain (email reputation transferable nahi hai). Bahut log isliye single provider rakhte hain aur sirf high-urgency ko push/SMS par bharosa karte hain -- ye **valid** choice hai.
- **Customer ko kya dikhta hai:** low-urgency alerts miss. Isliye product mein rule: **"agar tumhe pakka page chahiye, toh severity `critical` ya `error` rakho."**

### 10. "Ek customer ka alert storm poore platform ko kha raha hai?"

- **Problem:** ek customer ka Kubernetes cluster gaya. Uske 800 services ek saath alert karne lage: 60,000 events/min, 3,000 naye incidents, potentially **9,000 notifications** ek hi customer ke 40 responders ko.
- **Impact:** teen taraf ka nuksaan --
  1. Un 40 responders ke phone **bekaar** ho gaye (900 SMS per person = koi nahi padhega). Ye **alert fatigue** hai, aur ye ek real outage se zyada khatarnak hai.
  2. Hamara SMS bill ek ghante mein $6,000.
  3. **Doosre customers** ki notifications us storm ke peeche queue mein lag gayin -- noisy neighbour.
- **Solution -- teen layer, teeno spec mein hain:**

| Layer | Kya karta hai | Key |
|---|---|---|
| **Ingest rate limit** | Per routing key token bucket; overflow par `429 RATE_LIMITED` | `rl:events:<routingKey>` |
| **Grouping / storm control** | `INCR grp:<serviceId>:<minuteBucket>`; count > 10 -> individual notifications band, ek grouped page per 5 min: `"checkout: 63 new incidents"` | `grp:<serviceId>:<minute>` |
| **Per-tenant isolation** | Workers har account ke liye ek **bounded share** rakhte hain (jaise ek account ek waqt mein max 50 concurrent sends), aur Kafka partition key `incidentId` hone se ek account ke messages kai partitions par bikhe hote hain | worker-side fair scheduling |

- **Incidents fir bhi bante hain** (spec: audit chahiye) -- sirf **notifications** collapse hoti hain. Ye distinction interview mein bolna zaruri hai: "main data nahi rokta, main **insaan ko interrupt karna** rokta hoon."
- **Trade-off:** grouping mein ek asli critical incident 62 shor wale incidents ke saath collapse ho sakta hai. Isliye grouping se **`critical` severity ko exempt** rakho, ya grouped message mein sabse high severity wala summary dikhao.
- **Customer ko kya dikhta hai:** 900 SMS ki jagah ek SMS: "checkout: 63 new incidents (3 critical). Open: sho.rt/i/abc". Dashboard par poori list. **Ye ek feature hai, bug nahi** -- aur customers isi ke liye paise dete hain.

### 11. "Ek poison message consumer ko baar-baar crash kar raha hai?"

- **Problem:** ek event ka `customDetails` 5 MB ka nested JSON hai jo `JSON.parse` ke baad heap phaad deta hai; ya `severity` mein ek naya value hai jo `CHECK` constraint fail karta hai; ya `dedupKey` mein null byte hai jo Postgres `TEXT` mein nahi ja sakta.
- **Impact:** consumer crash -> restart -> wahi message dobara (offset commit nahi hua) -> crash. **Us partition ka poora traffic ruk gaya.** 24 partitions mein ek ruka matlab ~4% services ke pages band. Aur crash loop ke logs mein asli problem dhoondhna mushkil hota hai.
- **Solution:**

```ts
// src/workers/incident.consumer.ts
const MAX_ATTEMPTS = 3;

async function consume(msg: KafkaMessage): Promise<void> {
  const attempts = Number(msg.headers?.['x-attempts'] ?? 0);
  try {
    await incidentService.process(parseEvent(msg));
  } catch (err) {
    if (isRetryable(err) && attempts < MAX_ATTEMPTS) {
      throw err;                                   // offset commit NAHI -> Kafka dobara dega
    }
    await kafka.produce('notifications-dlq', msg.key, {
      original: msg.value.toString('base64'),
      topic: 'incident-events', partition: msg.partition, offset: msg.offset,
      error: String(err), failedAt: new Date().toISOString(), attempts,
    });
    dlqProduced.inc({ topic: 'incident-events', reason: errorCode(err) });
    logger.error({ err, offset: msg.offset, partition: msg.partition }, 'sent to dlq');
    // yahan throw NAHI -> offset commit hoga -> partition aage badh jaayega
  }
}
```

**Code Explanation:**

- `isRetryable(err)` -- DB timeout / Kafka unavailable = retryable (system ki problem). Validation error / constraint violation / JSON parse error = **permanent** (message ki problem). Ye distinction hi poora DLQ design hai.
- `throw err` retryable par -- offset commit nahi hota, Kafka message dobara deta hai. Transient problem apne aap theek ho jaati hai.
- `kafka.produce('notifications-dlq', ...)` -- permanent error ya attempts khatam -> message **DLQ mein**. Original bytes `base64` mein rakhte hain taaki replay ke waqt exactly wahi message wapas bheja ja sake.
- `partition` + `offset` bhi store karo -- debug karte waqt ye batate hain ki asal mein kahan se aaya tha.
- **`throw` nahi karna** DLQ ke baad -- yahi woh line hai jo **partition ko unblock** karti hai. Ek zehreela message poore partition ko bandhak nahi bana sakta.
- `dlqProduced` metric -- `dlq_depth` ke saath (spec ka metric). **`dlq_depth > 0` par hamesha alert**, kyunki DLQ mein pada har message ek page hai jo kabhi nahi gaya.

**Replay tool (`src/workers/dlq.worker.ts`):** ek CLI jo `notifications-dlq` se padhta hai, `--filter reason=db_timeout`, `--dry-run` support karta hai, aur messages ko original topic par wapas produce karta hai `x-replayed: true` header ke saath. Do rules: (1) replay hamesha **manual** ho, automatic nahi -- warna poison message infinite loop banata hai; (2) replay ke waqt **notifications suppress** karne ka option ho, kyunki 6 ghante purana page bhejne ka koi matlab nahi.

- **Trade-off:** DLQ ka matlab hai ki hum us event ko **drop** kar rahe hain (abhi ke liye). Yaani ek page miss ho raha hai -- jo hamare #1 principle ke khilaaf hai. Isi liye `dlq_depth` ek **page-worthy alert** hai, warn nahi.
- **Customer ko kya dikhta hai:** us ek event ka incident nahi bana. Baaki sab chalta raha. Support ko DLQ se pata chalta hai ki uska payload kyun reject hua ("customDetails 5 MB se bada hai").

### 12. "Kisi ne ack hi nahi kiya -- phone silent tha, ya sab so rahe the?"

- **Problem:** level 1 par page gaya, `ackTimeoutMin` 5 min nikal gaye. Level 2, phir level 3. `repeatCount` 2 poora ho gaya. Ab kya?
- **Impact:** incident `triggered` par pada hai aur **koi nahi jaanta.**
- **Solution (spec: "escalation exhausted"):**
  1. Timeline mein `escalation_exhausted` entry (audit ke liye).
  2. **Account owner / team manager ko notify karo** -- ye policy ke bahar ka aakhri fallback hai. Aksar ye email + Slack channel hota hai, SMS nahi (kyunki manager ko har baar jagana bhi galat hai).
  3. Us incident ko dashboard par **red "UNACKNOWLEDGED"** banner ke saath sabse upar pin karo.
  4. Optional: customer ka configured **"backup team"** (jaise 24x7 NOC vendor).
  5. Metric `escalations_exhausted_total` -- ye business ke liye ek health signal hai: agar ye badh raha hai, toh customer ki on-call policy toot chuki hai (log resign ho gaye, schedule purana hai) aur CSM ko call karna chahiye.
- **Honest jawab (aur interview mein yahi bolna):** **system kisi insaan ko jagane par majboor nahi kar sakta.** Hum sirf **probability** badha sakte hain -- zyada channels (push -> SMS -> voice, kyunki voice call silent mode ko bhi break karti hai iOS ke "Emergency Bypass" ke saath), zyada log (escalation), aur zyada shor. Iske aage ye ek **process problem** hai, engineering problem nahi: customer ko multi-person schedules, backup on-call, aur regular fire drills chahiye.
- **Trade-off:** aur zyada escalate karne ka matlab hai aur zyada log ko jagana. Ek galat alert ke liye 5 logon ko 3 baje uthana customer ko tumhara product chhod dene par majboor karta hai. Isliye exhaustion par **email/Slack**, SMS nahi.
- **Customer ko kya dikhta hai:** subah manager ke inbox mein "3 incidents were never acknowledged last night" -- aur uske baad ek **postmortem**, jo sahi outcome hai.

### 13. "Services ke beech clock skew ho toh?"

- **Problem:** incident service host ki ghadi 30 s aage hai. Woh `due_at = now + 5 min` compute karta hai -- yaani asal mein `now + 5:30`. Scheduler host ki ghadi 20 s peeche hai. Net effect: escalation **~50 s late**.
- **Impact:** teen jagah dard --
  1. Escalation early ya late fire karti hai (`timer_lag_seconds` galat dikhta hai).
  2. **On-call resolution galat ho sakti hai**: handoff 09:00 par hai aur ghadi 30 s aage hai toh 08:59:40 ka incident naye on-call ko chala jaayega jabki purana abhi duty par hai.
  3. **`page_latency_seconds` mein negative values** aa jaati hain (event `receivedAt` ingest host se, handover time worker host se) -- histogram kharab ho jaata hai.
- **Solution:**
  - **chrony / NTP har host par**, aur `node_timex_offset_seconds` ko monitor karo. Alert: `abs(offset) > 100 ms`.
  - Jahan possible ho, **ek hi ghadi use karo**: `due_at` Postgres ke `now()` se compute karo (`now() + make_interval(mins => $1)`) -- toh saare timers ek hi clock par hain, chahe kaunsa app host ho. Rate Limiter Part 4 mein yahi trick thi (Lua ka `TIME`).
  - **On-call resolution ke liye:** rotation index `floor((at - handoffAt) / rotationLengthMs)` mein `at` hamesha DB/event ka timestamp ho, host ka `Date.now()` nahi.
  - `page_latency_seconds` par: negative duration ko **discard + alarm** karo, 0 mat karo. Negative value = clock skew ka sabse saaf proof.
- **Trade-off:** DB `now()` use karne ka matlab ek extra DB round trip ya query mein expression -- sasta hai. Poori tarah "logical clocks" (Lamport/HLC) wala solution is system ke liye overkill hai; yahan 100 ms accuracy kaafi hai kyunki hamare timeouts minutes mein hain.
- **Customer ko kya dikhta hai:** escalation 30-60 s jaldi ya der se. Chhota, par ek "5 minute" promise ko 4 minute banana bhi trust ka sawaal hai.

### 14. "Ek bad deploy ne scheduler ko chup-chaap band kar diya?"

Ye is poore lesson ka sabse important failure hai.

- **Problem:** ek deploy mein scheduler ke `setInterval` wale code path mein ek exception aa gaya jo kisi ne catch kar liya aur loop ruk gaya. Ya Kubernetes ka `replicas: 0` galti se apply ho gaya. Ya config change se `claimSha` galat ho gaya aur har `evalsha` `NOSCRIPT` fail kar raha hai.
- **Impact:** aur yehi asli darr hai --
  - **Level-1 pages bilkul theek ja rahe hain.** Ingest, incident service, notification workers -- sab green. Dashboard par sab normal.
  - **Sirf escalations band hain.** Aur escalations tabhi chahiye jab pehla banda respond nahi karta -- yaani **sabse zaruri waqt par.**
  - Koi error rate nahi badha. Koi 5xx nahi. Koi log nahi. **System chup-chaap adha mar chuka hai** aur monitoring green hai.
- **Solution -- dead man's switch (heartbeat):**

```ts
// src/workers/scheduler.ts -- har successful tick ke baad
await redis.set('hb:scheduler', String(Date.now()), 'EX', 120);
schedulerHeartbeat.setToCurrentTime();          // Prometheus gauge (unix timestamp)

// EXTERNAL watchdog ko bhi ping karo -- har 60 s, hamare infra ke BAHAR
await fetch(`https://hc-ping.com/${HEALTHCHECK_UUID}`, { method: 'GET', timeout: 5000 })
  .catch((err) => logger.warn({ err }, 'external watchdog ping failed'));
```

**Code Explanation:**

- `redis.set('hb:scheduler', ..., 'EX', 120)` -- heartbeat key jo 120 s mein khud mar jaati hai. Koi bhi service `EXISTS hb:scheduler` se pooch sakta hai ki scheduler zinda hai ya nahi.
- `schedulerHeartbeat.setToCurrentTime()` -- Prometheus gauge. Alert: `time() - scheduler_heartbeat_timestamp_seconds > 120`. **Ye ek "absence of thing" alert hai** -- normal alerts "kuch bura hua" par bajte hain, ye "kuch hua hi nahi" par bajta hai. Silent failures ke liye yahi ek tareeka hai.
- `fetch('https://hc-ping.com/...')` -- **ye line sabse important hai.** Ye ek **third-party healthcheck service** (Healthchecks.io, Cronitor, Better Uptime -- koi bhi) ko ping karti hai. Agar 3 min tak ping na aaye, **woh service** hamein page karti hai -- ek **alag channel** se (apna SMS provider, ek alag email domain, ek Slack webhook).
- `.catch(...)` -- watchdog ka ping fail hona kabhi bhi scheduler ka kaam nahi rok sakta. Watchdog observer hai, dependency nahi.

**Aur ye interview ka best point hai:**

> **Paging system ko apna khud ka paging system nahi ban sakta.** Agar tumhara Prometheus alert tumhare hi paging system se jaata hai, toh jab paging system down hoga tab alert bhi down hoga. Ye ek circular dependency hai -- aur circular dependency exactly tab toot ti hai jab tumhe uski sabse zyada zarurat hoti hai.

Isliye teen layer chahiye, **har ek pichli se zyada independent**:

```
Layer 1 (andar):   apne metrics + apne alerts -> apna paging system
                   Fayda: sab kuch dikhta hai. Nuksaan: system down = alert down.

Layer 2 (bahar):   third-party healthcheck (Healthchecks.io / Cronitor)
                   Hamare components uske ping karte hain. Ping ruka -> WOH page karta hai,
                   alag provider, alag email domain, alag Slack workspace se.

Layer 3 (end-to-end): SYNTHETIC INCIDENT -- har 5 min ek robot ek test routing key par
                   event bhejta hai, aur ek test contact method (ek dedicated inbox /
                   Twilio test number) par page aane ka intezaar karta hai.
                   Page 90 s mein na aaye -> layer 2 ke raste alert.
                   Ye POORA pipeline test karta hai: ingest -> Kafka -> incident ->
                   routing -> worker -> provider. Sirf "process zinda hai" nahi.
```

- **Trade-off:** synthetic incidents har 5 min ka matlab hai ~288 fake incidents/day aur unka SMS/voice cost (~$1/day -- kuch bhi nahi). Aur unko production metrics/dashboards se **filter** karna padta hai warna woh tumhara `page_latency_seconds` ka data ganda karenge (ya sudhaar denge -- dono hi galat hai). Solution: synthetic account ko ek alag label do (`synthetic="true"`) aur dono views rakho.
- **Customer ko kya dikhta hai:** ideally kuch nahi -- hum problem unse pehle pakad lete hain. Aur status page bhi **alag infra par** host hona chahiye (S3 + CloudFront, hamare Kafka/Postgres se zero dependency), warna outage ke waqt customer ko status page bhi nahi milega.

### Failure summary

| Failure | Detect kaise | Fallback | Page ya warn? |

| Kafka down (ingest) | `ingest_spooled_total > 0`, 503 rate | Disk spool 60 s -> `503` (fail closed) | **Page** |
| Postgres primary down | consumer lag spike, DB error rate | Multi-AZ failover; Kafka lag = buffer | **Page** |
| Replica lag | `pg_stat_replication` lag > 5 s | Sticky reads to primary | Warn |
| Redis wiped / failover | `timers_restored_total > 0` | Recovery job `ZADD NX` har 60 s | **Page** |
| Scheduler crash mid-claim | `timer_lag_seconds`, heartbeat | `escalation_timers` table + recovery | **Page** |
| Worker crash after send | `duplicate_tasks_skipped_total` | `task_id` unique index + stuck sweeper | Warn |
| Twilio down / 429 | `circuit_breaker_state{provider}` | Failover provider / channel downgrade | **Page** |
| Push token invalid | `result="permanent_fail"` ratio | Permanent fail -> next channel | Warn |
| Email bounces | bounce webhook, failure ratio | Suppression mirror + failover | Warn |
| Alert storm | `events_ingested_total` per account spike | Rate limit + grouping + isolation | Warn |
| Poison message | `dlq_depth > 0` | DLQ + manual replay tool | **Page** |
| Nobody acks | `escalations_exhausted_total` | Account owner notify + pinned banner | Warn (business signal) |
| Clock skew | `node_timex_offset_seconds > 100ms`, negative latencies | chrony + DB-side `now()` | Warn |
| Scheduler silently dead | **Heartbeat absent** + external watchdog + synthetic | Layer 2/3 watchdog pages via alternate channel | **Page** |
