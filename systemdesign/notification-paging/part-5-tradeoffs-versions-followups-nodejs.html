## PART 25 -- Node.js Specific Interview Questions

> Is system mein Node ke sawaal theoretical nahi hain. Har ek ka seedha matlab hai: **ek page late gaya, do baar gaya, ya gaya hi nahi.**

### Q1. "Event loop -- ek CPU-heavy template render 1,000 pending notifications ko kaise block karta hai?"

**My Answer:** "Node ka JS ek hi thread par chalta hai. Notification worker ka 95% kaam **I/O** hai (Redis read, DB write, Twilio HTTP call) -- us dauraan `await` par function pause hota hai aur event loop doosri notifications ka kaam karta hai. Isliye ek worker hazaaron concurrent notifications sambhal leta hai. Problem tab hoti hai jab beech mein koi **synchronous CPU kaam** aa jaaye -- jaise ek bhaari template render, bada JSON stringify, ya crypto. Us samay event loop **ruk jaata hai**: naye Kafka messages process nahi honge, Twilio ke responses handle nahi honge, timers late chalenge, aur health check bhi late jawab dega."

```ts
// [X] GALAT -- sync CPU kaam har notification par
import Handlebars from 'handlebars';

export function renderSmsBad(tpl: string, incident: Incident): string {
  const compiled = Handlebars.compile(tpl);     // har call par parse + codegen: ~2-15 ms CPU
  return compiled({ incident });
}

// [OK] SAHI -- compile ek baar, cache karo; aur output bounded rakho
const templateCache = new Map<string, HandlebarsTemplateDelegate>();

export function renderSms(tplId: string, tpl: string, incident: Incident): string {
  let compiled = templateCache.get(tplId);
  if (!compiled) {
    compiled = Handlebars.compile(tpl);         // sirf pehli baar
    templateCache.set(tplId, compiled);
  }
  const text = compiled({
    summary: incident.summary.slice(0, 120),    // input ko bound karo
    severity: incident.severity,
    link: shortLink(incident.id),
  });
  return text.slice(0, 320);                    // 2 SMS segments ki hard cap
}
```

**Code Explanation:**

- `Handlebars.compile()` template ko parse karke ek JS function banata hai -- ye **pure CPU** hai, ~2-15 ms bade template par. 1,000 notifications/sec par 1,000 x 5 ms = **5 seconds ka CPU har second mein** -- event loop poori tarah jaam.
- `templateCache` -- compile ek baar, phir har render sirf string building hai (~50 microseconds). Ye ek line ka fix 100x farq deta hai.
- `incident.summary.slice(0, 120)` -- ek customer ne 2 MB ka `summary` bhej diya toh render aur SMS dono phat jaayenge. Input ko **hamesha** bound karo (validation layer par bhi, par yahan defence in depth).
- `text.slice(0, 320)` -- SMS 160 chars per segment; long message = zyada segments = zyada paisa. Isliye incident link ke liye **short link** (`sho.rt/i/abc`, URL Shortener lesson) use karte hain.
- Agar render sach mein bhaari ho (PDF, image, bada markdown), toh woh **worker thread** ya alag service mein jaana chahiye -- Q3 dekho.
- Measure kaise karein: `event_loop_lag_seconds` metric (`perf_hooks` ka `monitorEventLoopDelay`). Agar p99 lag > 50 ms hai toh kahin sync CPU kaam hai. **Notification worker mein event loop lag = page latency.**

### Q2. "`for` loop mein `await` -- 1,000 SMS serially chali gayin. Kya hua aur kaise theek karoge?"

**My Answer:** "`for` loop ke andar `await` ka matlab hai: pehli SMS poori hone ka intezaar, phir doosri. Twilio ka ek call ~300 ms leta hai, toh 1,000 SMS = **300 seconds = 5 minutes**. Hamara SLO 5 second hai -- matlab poori tarah toota. Ulta fix (sab kuch `Promise.all` mein daal dena) bhi galat hai: 1,000 parallel HTTP calls Twilio ko `429` dilwa dengi, hamare socket pool ko khatam kar dengi, aur memory mein 1,000 in-flight requests. Sahi jawab **bounded concurrency** hai -- ek saath N, N provider ki capacity se match kare."

```ts
import pLimit from 'p-limit';

// [X] 1: serial -- 1,000 x 300 ms = 5 minutes
async function sendAllSerial(tasks: NotificationTask[]) {
  for (const t of tasks) {
    await smsProvider.send(t, await addressFor(t), await incidentFor(t));
  }
}

// [X] 2: unbounded -- 1,000 parallel calls, provider 429s, socket exhaustion
async function sendAllUnbounded(tasks: NotificationTask[]) {
  await Promise.all(tasks.map((t) => smsProvider.send(t, /* ... */)));
}

// [OK] 3: bounded concurrency, per provider
const limits: Record<string, ReturnType<typeof pLimit>> = {
  'twilio-sms': pLimit(20),      // sender numbers x ~1 SMS/sec per long code + provider queue
  'twilio-voice': pLimit(10),    // voice calls mehengi aur lambi hoti hain
  fcm: pLimit(200),              // push sasta aur fast
  sendgrid: pLimit(100),
};

async function sendAll(tasks: NotificationTask[]) {
  const results = await Promise.allSettled(
    tasks.map((t) => {
      const provider = registry.for(t.channel);
      return limits[provider.name](() => sendOne(provider, t));
    }),
  );
  for (const [i, r] of results.entries()) {
    if (r.status === 'rejected') {
      metrics.notificationAttempts.inc({ channel: tasks[i].channel, result: 'error' });
      logger.warn({ taskId: tasks[i].taskId, err: r.reason }, 'send failed');
    }
  }
}
```

**Code Explanation:**

- Variant 1 (`for ... await`) -- har iteration pichli ke poora hone ka wait karti hai. Total time = N x latency. **Ye is system ka classic bug hai**, aur code review mein pakadna aasaan hai.
- Variant 2 (`Promise.all` on everything) -- saare requests ek saath. Twilio `429` deta hai, aur hamare Node process mein 1,000 sockets + 1,000 pending promises. Aur `Promise.all` **pehle rejection par hi** reject ho jaata hai -- baaki 999 chalte rehte hain par unka result koi nahi dekhta.
- `pLimit(20)` -- ek function wrapper jo ek saath max 20 chalne deta hai, baaki queue mein. Queue **memory mein** hai, isliye tasks ka batch bounded hona chahiye (Kafka se ek baar mein 100-500 messages, poora topic nahi).
- Har provider ka **apna** limit -- ye zaruri hai: voice ka cap 10 hai, par isse push ke 200 ko rukna nahi chahiye. Ek shared limit hota toh voice ki 10 slow calls poore pool ko block kar detin.
- `Promise.allSettled` -- ek SMS fail hone se baaki 999 cancel nahi hote. Har result alag se handle: fail hone par metric + log + (asli code mein) retry schedule ya DLQ.
- Numbers kahan se: spec kehta hai Twilio long code ~1 SMS/sec per number, short code ~100/sec. Concurrency cap = sender numbers x per-number rate ke aas paas. Ye **Rate Limiter lesson wapas aaya** -- bas ab hum apne outbound calls ko limit kar rahe hain, incoming ko nahi.

### Q3. "Worker threads vs cluster vs alag processes -- consumer ke liye kya use karoge?"

**My Answer:** "Teeno alag problems ke liye hain, aur is system mein main zyada tar **alag processes** use karta hoon.

| | Kya hai | Is system mein kab |
|---|---|---|
| **Worker threads** | Ek hi process mein alag JS threads, memory share nahi (sirf `SharedArrayBuffer`) | Sirf **CPU-bound** kaam ke liye: bada template render, PDF/report generation, crypto. Hamare notification path par ye kaam hai hi nahi -- toh **nahi**. Message passing ka structured-clone cost Twilio call se zyada hoga |
| **Cluster module** | Ek master, N worker processes, sab ek hi port par listen karte hain (kernel load balance karta hai) | **API/ingest** ke liye theek -- ek 4-core box par 4 workers, 4x HTTP throughput. Lekin Kubernetes par main ek container = ek process rakhta hoon aur pods se scale karta hoon (metrics, memory limits, restarts sab clean rehte hain) |
| **Alag processes (alag deployables)** | `api`, `incident-consumer`, `notification-worker`, `scheduler`, `dlq-worker` -- alag entrypoints, alag scaling | **Hamara default.** Kafka consumer ke liye ye natural hai: consumer group mein har process ek member hai, partitions unke beech baant jaati hain |

Kafka consumer ke saath **cluster module ek trap hai**: agar tum 4 cluster workers banao aur chaaron same consumer group join karein, toh woh 4 alag consumer members hain -- ye kaam karta hai, par graceful shutdown, rebalance aur metrics 4x confusing ho jaate hain. Aur cluster ka main fayda (ek port share karna) consumer mein hai hi nahi, kyunki consumer koi port listen nahi karta. Toh: **consumer ke liye alag processes/pods, cluster nahi.**"

```ts
// consumer scaling: partitions ke hisaab se, cores ke hisaab se nahi
// incident-events: 24 partitions -> max 24 useful consumer instances
// 25th instance idle baithega (koi partition assign nahi hogi)

// server.ts (API) -- yahan cluster ka sense banta hai agar VM par chala rahe ho
import cluster from 'node:cluster';
import os from 'node:os';

if (config.useCluster && cluster.isPrimary) {
  const n = Math.min(os.availableParallelism(), 4);
  for (let i = 0; i < n; i++) cluster.fork();
  cluster.on('exit', (w) => { logger.error({ pid: w.process.pid }, 'worker died, forking'); cluster.fork(); });
} else {
  startHttpServer();          // sab workers same port par
}
```

**Code Explanation:**

- `cluster.isPrimary` -- primary process khud requests handle nahi karta, sirf workers fork karta hai.
- `os.availableParallelism()` -- container mein CPU limit ke hisaab se (purana `os.cpus().length` container limits nahi jaanta aur 64-core host par 64 workers fork kar deta hai -- classic OOM).
- `cluster.on('exit')` -> dobara fork -- warna ek crash ke baad capacity kam ho jaati hai chup-chaap.
- `config.useCluster` -- Kubernetes par ise `false` rakhta hoon. Ek pod, ek process: memory limit, liveness probe, aur `SIGTERM` handling sab straightforward rehte hain. Cluster mein `SIGTERM` primary ko aata hai aur usko workers tak forward karna padta hai -- aur is system mein **galat shutdown = missed page**.
- **Ye code notification worker ya scheduler mein kabhi nahi hai** -- wahan scaling pods se hoti hai, aur scheduler toh 2 instances se zyada chahiye hi nahi.

### Q4. "Kafka consumer ka graceful shutdown likho. Hard kill se kya hota hai?"

**My Answer:** "Ye is system ka **sabse critical Node code** hai. Hard kill (`SIGKILL`, ya `SIGTERM` jise humne handle nahi kiya) par do mein se ek hota hai: (a) message process ho gaya par offset commit nahi hua -> restart par **dobara process** -> duplicate page; (b) worker Twilio ko call kar chuka tha aur DB mein `sent` likhne se pehle mar gaya -> record galat, aur retry par **doosra SMS**. Aur Kafka ki taraf se: bina `disconnect()` ke broker ko pata nahi chalta ki member gaya, toh `session.timeout.ms` (default ~45 s) tak uski partitions **kisi ko assign nahi hoti** -- matlab **45 second tak un services ke pages ruke rahenge**. Isliye shutdown ka order fix hai: consuming band -> in-flight poore -> offsets commit -> producer flush -> consumer disconnect -> DB pool drain -> exit."

```ts
// workers/notification.worker.ts (shutdown ka core)
let shuttingDown = false;
const inFlight = new Set<Promise<void>>();

async function main() {
  await consumer.connect();
  await producer.connect();
  await consumer.subscribe({ topic: 'notifications', fromBeginning: false });

  await consumer.run({
    autoCommit: false,                              // hum khud commit karenge
    eachBatchAutoResolve: false,
    eachBatch: async ({ batch, resolveOffset, commitOffsetsIfNecessary, heartbeat, isRunning, isStale }) => {
      for (const message of batch.messages) {
        if (!isRunning() || isStale() || shuttingDown) break;   // naya kaam mat uthao
        const p = handleMessage(message).then(() => { resolveOffset(message.offset); });
        inFlight.add(p);
        p.finally(() => inFlight.delete(p));
        await p;                                    // per-message; concurrency p-limit ke andar hai
        await heartbeat();                          // lamba batch -> group se bahar mat hona
      }
      await commitOffsetsIfNecessary();
    },
  });
}

async function shutdown(signal: string) {
  if (shuttingDown) return;                          // do SIGTERM aa sakte hain
  shuttingDown = true;
  logger.info({ signal }, 'shutdown started');

  readiness.setNotReady();                           // /ready -> 503, LB traffic hatao (API process ke liye)
  const timer = setTimeout(() => {
    logger.error('graceful shutdown timed out, forcing exit');
    process.exit(1);
  }, 25_000).unref();                                // k8s terminationGracePeriodSeconds se kam

  try {
    await consumer.stop();                           // naye messages fetch band, in-flight chalte rahenge
    await Promise.allSettled([...inFlight]);         // jo SMS beech mein hain unhe poora karo
    await producer.flush?.();                        // pending notification tasks brokers tak
    await consumer.disconnect();                     // group ko turant bata do -> fast rebalance
    await producer.disconnect();
    await redis.quit();                              // pending commands drain (disconnect() unhe girata hai)
    await pgPool.end();                              // in-flight queries poori, phir sockets band
    clearTimeout(timer);
    logger.info('shutdown complete');
    process.exit(0);
  } catch (err) {
    logger.error({ err }, 'error during shutdown');
    process.exit(1);
  }
}

process.on('SIGTERM', () => void shutdown('SIGTERM'));
process.on('SIGINT', () => void shutdown('SIGINT'));
```

**Code Explanation:**

- `autoCommit: false` + manual `resolveOffset` -- at-least-once ka core. Offset tabhi aage badhta hai jab message ka kaam **poora** ho chuka ho (DB write + provider call). Auto-commit hota toh crash par message kho jaata = **missed page**.
- `if (!isRunning() || isStale() || shuttingDown) break` -- shutdown shuru hote hi batch se naye messages uthana band. `isStale()` rebalance ke baad purane batch ko chhod deta hai (ab woh partition kisi aur ki hai).
- `inFlight` Set -- jo promises chal rahe hain unka track. `Promise.allSettled([...inFlight])` unhe poora hone deta hai. **Yahi woh line hai jo "SMS bheja par record nahi hua" se bachati hai.**
- `await heartbeat()` -- Kafka ko batata hai ki hum zinda hain. Ek lamba batch (100 voice calls x 20 s) bina heartbeat ke `max.poll.interval.ms` cross kar dega aur broker humein group se nikaal dega -> rebalance -> duplicate processing.
- `consumer.stop()` **pehle**, `disconnect()` **baad mein** -- stop fetching rok deta hai par membership rakhta hai; disconnect membership chhodta hai. Ulta karoge toh in-flight messages ka offset commit nahi ho payega.
- `setTimeout(..., 25_000).unref()` -- agar koi promise kabhi resolve hi na ho (hung provider call), toh hum hamesha ke liye nahi latak sakte. 25 s isliye ki Kubernetes ka `terminationGracePeriodSeconds` (30 s) khatam hone se pehle hum khud clean exit karein -- warna `SIGKILL` aayega aur hum wahin pahunch jaayenge jisse bach rahe the. `.unref()` taaki ye timer khud process ko zinda na rakhe.
- `redis.quit()` vs `redis.disconnect()` -- `quit` pending commands ko poora hone deta hai; `disconnect` unhe turant girata hai (aur woh commands `ZREM`/status update ho sakti hain).
- `pgPool.end()` sabse aakhir mein -- kyunki in-flight handlers ko DB chahiye tha.
- `process.on('SIGTERM')` -- **Docker/Kubernetes `SIGTERM` bhejte hain.** Agar tumhara Node `npm start` ke through `sh -c` mein chal raha hai toh signal shell ko milta hai, Node ko nahi -- `CMD ["node", "dist/worker.js"]` (exec form) use karo ya `tini`. Ye ek chhoti Docker detail hai jo poora graceful shutdown bekaar kar deti hai.

### Q5. "`pg` pool ka size kya rakhoge? N workers ke saath Postgres `max_connections` ka kya?"

**My Answer:** "Sabse common production galti: har process mein `max: 100` likh dena. 20 notification workers + 8 incident consumers + 10 API pods = 38 processes x 100 = **3,800 connections**, jabki Postgres ka default `max_connections` 100-200 hai. Result: `FATAL: sorry, too many clients already` -- aur ye tab hota hai jab traffic peak par ho, matlab storm ke beech. Postgres mein har connection ek **alag OS process** hai (~5-10 MB), toh zyada connections se throughput badhta nahi, **ghatta** hai (context switching + lock contention)."

```ts
// infra/postgres.ts
import { Pool } from 'pg';

export const pgPool = new Pool({
  host: config.pgHost,
  database: config.pgDatabase,
  max: config.pgPoolMax,                 // per process -- niche math dekho
  min: 2,
  idleTimeoutMillis: 30_000,
  connectionTimeoutMillis: 3_000,        // pool khaali hai toh 3 s mein fail, hamesha ke liye mat latko
  statement_timeout: 5_000,              // ek slow query poora worker block na kare
  query_timeout: 5_000,
  application_name: config.serviceName,  // pg_stat_activity mein kaun kaun hai, ye dikhega
});

pgPool.on('error', (err) => logger.error({ err }, 'idle pg client error'));

// Pool math (interview mein ye bolna):
//   Postgres max_connections = 200
//   Reserve superuser + migrations + monitoring = 20
//   Usable = 180
//   Processes: 10 API + 8 incident-consumers + 20 notification-workers + 2 scheduler = 40
//   max per process = floor(180 / 40) = 4
// 4 chhota lagta hai, par har query 2-5 ms ki hai -> ek connection ~200-500 queries/sec kar leta hai.
// Agar aur chahiye -> PgBouncer (transaction pooling) lagao, per-process max mat badhao.
```

**Code Explanation:**

- `max` **per process** hai, poore fleet ka nahi -- ye galatfehmi hi 3,800 connections banati hai.
- `min: 2` -- kuch connections garam rakho, warna har storm ke shuru mein connection handshake (TCP + TLS + auth, ~10-30 ms) latency mein judta hai.
- `connectionTimeoutMillis: 3_000` -- pool khaali hone par request **fail fast** kare. Bina iske sab requests pool ke queue mein jama hoti rehti hain aur memory badhti hai (backpressure ka classic bug, Q6 jaisa hi).
- `statement_timeout` / `query_timeout` -- ek galat query (missing index par full scan) poore worker ko 60 s ke liye block kar sakti hai. 5 s cap = **blast radius bounded**.
- `application_name` -- incident ke waqt `SELECT application_name, count(*) FROM pg_stat_activity GROUP BY 1` se turant pata chalta hai ki connections kaun kha raha hai.
- `pgPool.on('error')` -- idle client ka error (server ne connection band kiya) handle na karo toh process crash ho sakta hai.
- **PgBouncer kab:** jab processes 50+ ho jaayein ya serverless aaye. Transaction pooling mode mein 40 processes x 10 = 400 client connections ko ~30 server connections par multiplex kiya ja sakta hai. Catch: transaction mode mein session-level features (prepared statements ka default behaviour, advisory locks, `LISTEN/NOTIFY`) nahi chalte -- code ko uske hisaab se likhna padta hai.
- Aur ek cheez jo log bhool jaate hain: **replicas ke liye alag pool** -- dashboard queries read replica par, taaki ek bhaari dashboard query paging path ke connections na khaaye.

### Q6. "Kafka messages Twilio se tez aa rahe hain. Backpressure kaise handle karoge?"

**My Answer:** "Kafka se 2,000 messages/sec aa sakte hain, par Twilio 20 concurrent SMS leta hai. Agar hum har message ke liye ek promise bana ke `p-limit` ki queue mein daal dein aur consuming jaari rakhein, toh woh queue **unbounded in-memory queue** ban jaati hai -- lakhon pending tasks, heap badhta hai, GC pauses badhte hain, aur phir OOM crash. **Aur crash ka matlab hai: saare queued pages RAM ke saath gaye** (Kafka se dobara aayenge, par latency aur duplicates ke saath). Ye is system ka classic bug hai. Sahi jawab: queue ki jagah **consumer ko rok do** -- Kafka already ek durable buffer hai, message wahin pade rehne do."

```ts
const MAX_PENDING = 500;                       // memory mein itne se zyada kaam nahi
let pending = 0;
let paused = false;
const topicPartitions = [{ topic: 'notifications' }];

function onTaskStart() {
  pending++;
  if (!paused && pending >= MAX_PENDING) {
    consumer.pause(topicPartitions);           // Kafka se fetch band -- lag badhega, memory nahi
    paused = true;
    metrics.consumerPaused.set(1);
    logger.warn({ pending }, 'consumer paused: provider slower than intake');
  }
}

function onTaskDone() {
  pending--;
  if (paused && pending <= MAX_PENDING / 2) {  // hysteresis: aadha khaali hone par hi resume
    consumer.resume(topicPartitions);
    paused = false;
    metrics.consumerPaused.set(0);
  }
}

async function handleMessage(message: KafkaMessage) {
  onTaskStart();
  try {
    const task = JSON.parse(message.value!.toString()) as NotificationTask;
    await limits[providerFor(task).name](() => sendOne(task));
  } finally {
    onTaskDone();
  }
}
```

**Code Explanation:**

- `MAX_PENDING = 500` -- memory ka bound. 500 tasks x ~2 KB = ~1 MB, predictable. Bina bound ke ye number traffic decide karta hai, hum nahi.
- `consumer.pause(topicPartitions)` -- KafkaJS broker se fetch karna band kar deta hai (connection zinda rehta hai, heartbeats chalte rehte hain, group membership bachi rehti hai). **Ye asli backpressure hai:** kaam Kafka ke durable log mein ruka hai, hamari RAM mein nahi.
- **Hysteresis** (`pending <= MAX_PENDING / 2`) -- agar pause/resume ek hi threshold par hota toh har message par pause-resume flapping hoti (ek syscall-heavy loop). Aadha khaali hone par resume karna stable hai.
- `metrics.consumerPaused` -- ye ek important signal hai: "hum provider se slow hain". Isko alert karo (`paused > 60 s`), kyunki iska matlab hai ki page latency badh rahi hai.
- `finally` mein `onTaskDone()` -- fail ho ya pass, counter ghatna chahiye. Warna ek exception permanent pause bana degi (aur consumer chup-chaap kaam karna band kar dega -- worst kind of bug).
- **Streams ka analogy:** ye wahi `readable.pause()` / `drain` pattern hai jo Node streams mein hai (`res.write()` false de toh `drain` ka wait). Kafka consumer ek stream hi hai, bas usmein `pause`/`resume` explicit hai.
- Kya **nahi** karna: `await` ko hata ke "fire and forget" karna. Tab consumer offsets commit kar dega aur tasks abhi chal rahe honge -> crash par **missed pages**.

### Q7. "Escalation ke liye `setTimeout` kyun nahi? Node ke timers ki limitations kya hain?"

**My Answer:** "Teen alag reasons, aur teeno production mein kaat te hain.

1. **Durability:** `setTimeout` process ki memory mein hai. Process restart (deploy, crash, OOM, node drain) = saare pending timers **gayab**. 3,500 active incidents ke escalation timers ek deploy mein khatam -- matlab **har deploy ek missed-page event hai**.
2. **Max delay:** `setTimeout` ka delay 32-bit signed integer mein rakha jaata hai -- max `2^31 - 1 = 2,147,483,647` ms = **~24.8 din**. Isse bada delay dene par Node warning deta hai aur timeout **turant (1 ms par) fire** ho jaata hai. Hamare escalation 5-60 min ke hain, toh ye direct problem nahi -- par "snooze this incident for 30 days" jaisa feature isi bug mein girta hai.
3. **Drift aur precision:** `setTimeout(fn, 300000)` ka matlab "**kam se kam** 300 s baad", exactly nahi. Event loop busy ho (Q1 wala CPU kaam) toh callback late chalega. Aur agar tum chhote timeouts ko chain karke bada banao toh har hop par drift jamta hai.

Isliye escalation timers **Redis ZSET + Postgres `escalation_timers`** mein hain, aur `timer_lag_seconds` se measure hote hain. `setTimeout` is codebase mein sirf wahan hai jahan uska kho jaana matter nahi karta: retry backoff, circuit breaker ka `half-open` transition, metrics flush."

```ts
// [X] GALAT -- escalation in-process
function scheduleEscalationBad(incident: Incident, ackTimeoutMin: number) {
  setTimeout(() => void escalate(incident.id), ackTimeoutMin * 60_000);
  // restart -> timer gaya -> koi escalate nahi -> missed page, aur kahin koi record bhi nahi
}

// [OK] SAHI -- durable + fast, dono
async function scheduleEscalation(incident: Incident, level: number, ackTimeoutMin: number) {
  const timerId = randomUUID();
  const dueAt = new Date(Date.now() + ackTimeoutMin * 60_000);

  await pgPool.query(                                    // 1) durable truth
    `INSERT INTO escalation_timers (id, incident_id, level, due_at, state)
     VALUES ($1, $2, $3, $4, 'pending')`,
    [timerId, incident.id, level, dueAt],
  );
  await redis.zadd('sched:escalations', dueAt.getTime(), timerId);   // 2) fast path
}

// [OK] SAHI -- short, disposable wait ke liye setTimeout bilkul theek hai
export const sleep = (ms: number) => new Promise<void>((r) => setTimeout(r, ms).unref());

export function backoffDelayMs(attempt: number): number {
  return Math.floor(Math.random() * Math.min(30_000, 1000 * 2 ** attempt));   // full jitter
}
```

**Code Explanation:**

- Galat version mein timer ka **koi record kahin nahi hai** -- na DB mein, na Redis mein. Process gaya toh kisi ko pata bhi nahi chalega ki ek escalation due tha. Ye sabse khatarnak kism ka bug hai: **silent**.
- Sahi version mein order maayne rakhta hai: **pehle Postgres, phir Redis**. Ulta karoge aur beech mein crash ho jaaye toh Redis mein ek timer hai jiska DB mein koi record nahi -- fire hone par consumer ko kuch samajh nahi aayega. Is order mein worst case: DB mein `pending` hai, Redis mein nahi -> recovery job 60 s mein daal degi. **Deterministic recovery.**
- `dueAt.getTime()` ZSET ka score hai (epoch ms). Scheduler ka Lua `ZRANGEBYSCORE '-inf' now` + `ZREM` atomic claim karta hai.
- `backoffDelayMs` -- spec ka **full jitter**: `random(0, min(30000, 1000 * 2^attempt))`. Jitter isliye ki 500 failed notifications ek saath retry na karein (thundering herd -- provider ko dobara giraa denge).
- `sleep()` par `.unref()` -- ye timer process ko zinda nahi rakhega shutdown ke waqt.
- Aur ek Node detail: `setTimeout` ka return **ek object** hai (browser mein number), aur `unref()`/`ref()` usi par hain. `AbortSignal.timeout()` naye code mein aksar behtar hai (Q9).

### Q8. "Twilio/FCM ko HTTP calls -- keep-alive kyun zaruri hai?"

**My Answer:** "Har HTTPS call mein TCP handshake (1 RTT) + TLS handshake (1-2 RTT) hota hai. Twilio ke API tak ~50-100 ms RTT ho toh sirf connection setup mein **150-300 ms** ja sakte hain -- aur hamara poora page latency budget 5 s hai jisme provider ki apni processing bhi hai. 87 notifications/sec average par ye har second ~20 seconds ka wasted CPU+network hai. Node 18 tak `http.globalAgent` mein keep-alive **off** tha; Node 19+ mein default on hai, par production mein main hamesha **explicit agent** banata hoon taaki pool size bhi control kar sakoon."

```ts
// infra/http.ts
import { Agent as HttpsAgent } from 'node:https';
import { Agent as UndiciAgent, setGlobalDispatcher } from 'undici';

// (a) purane SDKs jo node:https use karte hain (twilio SDK)
export const keepAliveAgent = new HttpsAgent({
  keepAlive: true,
  keepAliveMsecs: 30_000,       // idle sockets par TCP keep-alive probe
  maxSockets: 50,               // per host -- p-limit ke concurrency cap se match
  maxFreeSockets: 10,           // idle pool
  timeout: 10_000,              // socket inactivity
  scheduling: 'lifo',           // recently used socket dobara -> idle sockets khud mar jaate hain
});

// (b) fetch/undici based clients ke liye
setGlobalDispatcher(new UndiciAgent({
  keepAliveTimeout: 30_000,
  keepAliveMaxTimeout: 60_000,
  connections: 50,
}));

// twilio SDK ko agent dena
export const twilio = require('twilio')(config.sid, config.token, {
  httpClient: new RequestClient({ agent: keepAliveAgent, timeout: 8_000 }),
});
```

**Code Explanation:**

- `keepAlive: true` -- response ke baad socket band nahi hota, agli request usi socket par jaati hai. **Pehli call ke baad handshake ka cost zero.**
- `maxSockets: 50` -- per host limit. Ise `p-limit` ke cap se **match** karo: agar `pLimit(20)` hai toh 50 sockets kaafi hain; agar agent ka limit 5 hota toh requests agent ki internal queue mein latakti (ek aur invisible unbounded queue -- Q6 wala hi problem, bas ek layer neeche).
- `scheduling: 'lifo'` -- last-in-first-out socket reuse. FIFO mein saare sockets thode thode use hote rehte hain aur kabhi idle timeout nahi maarte; LIFO mein extra sockets idle hoke apne aap band ho jaate hain. Low traffic par memory clean rehti hai.
- `keepAliveMsecs` -- idle socket par TCP keep-alive probe, taaki beech mein baitha NAT/load balancer connection chup-chaap na kaate (warna agli request `ECONNRESET` par failegi -- ye ek bahut confusing production bug hai).
- `timeout: 8_000` SDK level par -- socket inactivity timeout. Ye `AbortController` wale request timeout se alag hai (Q9); production mein **dono** chahiye.
- Aur ek fayda jo log bhool jaate hain: keep-alive se provider ki taraf bhi kam connections banti hain, jisse unka rate limiting behaviour aur hamari observed latency dono behtar rehti hai.

### Q9. "Provider call kabhi khatam hi nahi ho rahi. Timeout kaise lagaoge?"

**My Answer:** "Ye scenario sabse ganda hai: ek hang hui HTTP call `p-limit` ka slot pakad ke baithi rehti hai, phir doosri, phir teesri -- aur 20 minute baad poora worker slots ke bina baitha hai, `pending` badhta hai, consumer pause ho jaata hai, aur pages ruk jaate hain. **Har external call par explicit timeout hona hi chahiye** -- socket timeout kaafi nahi hai, kyunki server slowly bytes bhej sakta hai aur socket 'active' rehta hai."

```ts
// utils/with-timeout.ts
export class ProviderTimeoutError extends Error {
  constructor(public readonly ms: number) { super(`provider call timed out after ${ms}ms`); }
}

export async function callWithTimeout<T>(
  ms: number,
  fn: (signal: AbortSignal) => Promise<T>,
): Promise<T> {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(new ProviderTimeoutError(ms)), ms);
  try {
    return await fn(ac.signal);
  } finally {
    clearTimeout(timer);                        // success par timer turant saaf
  }
}

// providers/twilio-sms.provider.ts (asli use)
async send(task: NotificationTask, address: string, incident: Incident): Promise<ProviderResult> {
  const started = Date.now();
  try {
    const res = await callWithTimeout(8_000, (signal) =>
      fetch(`https://api.twilio.com/2010-04-01/Accounts/${sid}/Messages.json`, {
        method: 'POST',
        signal,                                  // abort hote hi request cancel
        headers: { authorization: basicAuth, 'content-type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ To: address, From: this.pickSender(), Body: renderSms(...) }),
      }),
    );
    const json = await res.json() as { sid?: string; code?: number; message?: string };
    metrics.sendDuration.observe({ channel: 'sms', provider: 'twilio' }, (Date.now() - started) / 1000);

    if (res.ok) return { providerMessageId: json.sid!, status: 'sent' };
    const permanent = res.status >= 400 && res.status < 500 && res.status !== 429;
    return { providerMessageId: '', status: 'failed', permanent };
  } catch (err) {
    if (err instanceof ProviderTimeoutError || (err as Error).name === 'AbortError') {
      // AMBIGUOUS: SMS gaya ya nahi, pata nahi -> retry karenge (duplicate OK, missed NOT)
      metrics.notificationAttempts.inc({ channel: 'sms', provider: 'twilio', result: 'timeout' });
      return { providerMessageId: '', status: 'failed', permanent: false };
    }
    throw err;
  }
}
```

**Code Explanation:**

- `AbortController` + `signal` -- abort hone par `fetch` sach mein request cancel karta hai (socket band). Sirf `Promise.race` se timeout karoge toh promise to reject ho jaayega par **request background mein chalti rahegi** aur socket pakde rakhegi.
- `finally { clearTimeout(timer) }` -- warna har call ek 8-second timer chhod jaayegi. 87/sec x 8 s = ~700 zinda timers, memory aur event loop dono par bojh.
- `8_000` ms -- ye hamare 5 s p95 budget se bada hai jaanbujh kar: timeout ka kaam **hang rokna** hai, SLO enforce karna nahi. SLO ke liye alag metric aur alerting hai.
- `permanent` flag -- spec ka rule: **4xx (invalid number) = permanent fail, retry mat karo**; 5xx / timeout / 429 = retry. `429` ko 4xx se alag rakhna zaruri hai, warna provider ka rate limit humein "permanent failure" lagega aur hum page drop kar denge.
- **Timeout par hum retry karte hain** -- aur ye jaante hue karte hain ki SMS shayad chali gayi ho. Ye poore lesson ka dil hai: ambiguous case mein hum **duplicate** choose karte hain, **miss** nahi.
- Node 18+ mein `AbortSignal.timeout(8000)` ek line mein yahi karta hai; upar wala version isliye likha kyunki usse custom error aur `clearTimeout` ka control milta hai (aur interview mein mechanism dikhana asaan hota hai).
- Ye timeout circuit breaker ke saath kaam karta hai: timeouts failures mein ginte hain, aur 30 s window mein >50% fail -> breaker `open` -> 30 s tak call hi nahi jaati.

### Q10. "Third-party SDK ke errors -- error handling kaise structure karoge?"

**My Answer:** "Teen rules. (1) **SDK ke errors ko apne domain errors mein convert karo** -- upar ke layers ko `TwilioError.code = 21610` nahi samajhna chahiye. (2) **Errors ko classify karo: permanent vs transient vs ambiguous** -- yahi decide karta hai ki retry karein, DLQ bhejein, ya user ko batayein. (3) **Kabhi `catch (e) {}` mat likho** -- is system mein chup-chaap kha liya gaya error ek missed page hai."

```ts
// providers/errors.ts
export type FailureKind = 'permanent' | 'transient' | 'ambiguous';

export class ProviderError extends Error {
  constructor(
    readonly kind: FailureKind,
    readonly provider: string,
    readonly providerCode: string | number | undefined,
    message: string,
    readonly cause?: unknown,
  ) { super(message); this.name = 'ProviderError'; }
}

// Twilio ke codes ko domain meaning do (sirf woh jo humein matter karte hain)
const TWILIO_PERMANENT = new Set([21211, 21610, 21614, 21408]);
//  21211 invalid 'To'  |  21610 unsubscribed recipient  |  21614 not SMS-capable  |  21408 region not enabled

export function classifyTwilio(err: any): ProviderError {
  const code = err?.code;
  if (TWILIO_PERMANENT.has(code)) {
    return new ProviderError('permanent', 'twilio', code, 'recipient cannot receive SMS', err);
  }
  if (err?.status === 429 || (err?.status >= 500 && err?.status < 600)) {
    return new ProviderError('transient', 'twilio', code, 'provider unavailable', err);
  }
  if (err?.name === 'AbortError' || err?.code === 'ETIMEDOUT' || err?.code === 'ECONNRESET') {
    return new ProviderError('ambiguous', 'twilio', err?.code, 'unknown delivery state', err);
  }
  return new ProviderError('transient', 'twilio', code, err?.message ?? 'unknown provider error', err);
}

// notification.worker.ts -- classification se action
async function sendOne(task: NotificationTask) {
  try {
    const result = await provider.send(task, address, incident);
    await notificationRepo.markSent(task.taskId, result.providerMessageId);
  } catch (raw) {
    const err = classifyTwilio(raw);
    await notificationRepo.recordAttempt(task.taskId, task.attempt, err.kind, err.message);

    if (err.kind === 'permanent') {
      await notificationRepo.markFailed(task.taskId, err.message);
      await notifyNextChannel(task);                    // SMS nahi jaa sakti -> voice/push try karo
      await alertUserOfBrokenContact(task.userId);      // "aapka number SMS nahi le sakta"
      return;                                           // retry ka koi matlab nahi
    }
    if (task.attempt >= 5) {
      await kafka.produce('notifications-dlq', task);   // chup-chaap drop nahi
      metrics.dlqDepth.inc();
      return;
    }
    await scheduleRetry(task, backoffDelayMs(task.attempt));  // transient + ambiguous -> retry
  }
}
```

**Code Explanation:**

- `ProviderError` ek **domain error** hai: `kind` upar ke layer ko decision dene ke liye kaafi hai; `providerCode` sirf logs/debugging ke liye rakha hai.
- `TWILIO_PERMANENT` set -- sirf woh codes jo hum sach mein jaante hain. Baaki sab ka default **`transient`** hai, matlab retry -- kyunki is system mein galti karni hi hai toh **retry ki taraf** karo, drop ki taraf nahi.
- `ambiguous` (timeout / `ECONNRESET`) ko alag kism rakha hai. Behaviour transient jaisa hai (retry), par metric alag hai -- kyunki ambiguous rate badhna matlab **duplicate SMS rate badh raha hai**, aur ye product ko dikhana chahiye.
- `permanent` par teen kaam: notification fail mark, **agle channel par jao** (banda phir bhi page hona chahiye), aur user/admin ko batao ki unka contact method toota hai. Sirf `markFailed` karke ruk jaana ek silent missed page hota.
- `task.attempt >= 5` -> **DLQ**, chup-chaap drop nahi. `dlq_depth` par alert hai, aur DLQ worker se manual replay ho sakta hai. Spec ka rule: max 5 attempts per channel, phir agla channel / DLQ.
- `recordAttempt` **har** case mein -- `notification_attempts` table hi woh evidence hai jisse Part 23 Q29/Q30 ke customer sawaalon ka jawab milta hai.
- Aur ek Node-specific baat: `process.on('unhandledRejection')` aur `uncaughtException` handlers hone chahiye jo **log karke exit karein** (crash-only design), kyunki ek half-broken process ka pages bhejte rehna usse bura hai ki woh restart ho jaaye aur Kafka se messages dobara process hon.

### Node.js answers ka summary

| Topic | Is system mein ek line |
|---|---|
| Event loop | Sync CPU kaam (template compile) = 1,000 notifications ruk gayin; compile cache karo, input bound karo, `event_loop_lag` measure karo |
| `for` + `await` | 1,000 SMS serial = 5 minute; `p-limit` per provider (SMS 20, voice 10, push 200) + `Promise.allSettled` |
| Worker threads / cluster | Worker threads sirf CPU kaam ke liye (yahan nahi); cluster API par theek; **consumers ke liye alag processes** |
| Graceful shutdown | `stop -> in-flight finish -> commit -> disconnect -> redis.quit -> pool.end`, 25 s forced-exit timer; hard kill = lost ya duplicate page |
| pg pool | `max` **per process**; `floor(usable / processes)`; `statement_timeout`; 50+ processes -> PgBouncer |
| Backpressure | `consumer.pause()` at 500 pending, resume at 250 (hysteresis); unbounded in-memory queue = OOM = kho gaye pages |
| Timers | `setTimeout` max `2^31-1` ms (~24.8 din), drift, restart par gayab -> escalations Redis ZSET + Postgres mein |
| Keep-alive | Explicit agent, `maxSockets` = `p-limit` cap, `scheduling: 'lifo'`; har call par TLS handshake = 150-300 ms waste |
| `AbortController` | Har provider call par explicit timeout; `Promise.race` request cancel nahi karta; timeout = ambiguous = retry |
| Error handling | SDK error -> `ProviderError { kind: permanent / transient / ambiguous }`; permanent -> agla channel; 5 fail -> DLQ; kabhi silent catch nahi |

## Remember

> **Is system ka har decision ek hi sawaal se nikalta hai: "agar ye component abhi mar jaaye, toh kya koi page miss hoga?" -- isliye ingest fail-closed hai (`503`, jhooth nahi), delivery at-least-once hai (duplicate OK, miss nahi), timers Redis ke saath Postgres mein bhi hain (speed + truth), aur graceful shutdown optional nahi hai -- kyunki ek hard kill ka matlab hai ek insaan jo kabhi nahi jaga.**

## Quick Self-Test

1. Kafka, RabbitMQ, SQS aur Postgres-as-a-queue -- hamare event bus ke liye teeno alternatives kis **specific requirement** par fail hote hain, aur SQS ka 15-minute wala limit exactly kis feature ko todta hai?
