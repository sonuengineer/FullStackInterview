## PART 23 -- Interview Follow-up Questions (30)

> Tip: har answer mein 3 cheezein -- **seedha answer, reason, trade-off**. Numbers hamare design ke. Aur is system mein ek bonus line hamesha kaam aati hai: "duplicate page is OK, missed page is not."

### Scaling

**1. Interviewer:** "Traffic 10x ho gaya -- 500M events/day. Sabse pehle kya tootega?"

**My Answer:** "Kafka nahi tootegi -- 5,800 eps average aur 60,000 eps peak ek 24-partition topic ke liye bas partitions badhane ki baat hai (24 se ~100), brokers add karo, ho gaya. Sabse pehle do cheezein tootengi: **Postgres ka incidents write path** (dedup ratio 95% rahe toh 290 incidents/sec avg aur 3,000/sec peak -- ek primary par ye upsert + timeline insert + timer insert ka teen-gun load hai) aur **Twilio ka throughput** (10,000 notifications/sec peak, jabki long code ~1 SMS/sec per number deta hai -- matlab hazaaron sender numbers ya short codes). Postgres ke liye: pehle batch inserts aur timeline ko alag table/partition, phir `account_id` par sharding ya Citus. Twilio ke liye: multiple messaging services, short codes, aur ek doosra provider. Aur cost: SMS bill $17K se $170K/day ho jaayega -- us scale par push adoption badhana (mobile app install karwana) ek **engineering** project ban jaata hai, marketing nahi."

**2. Interviewer:** "6,000 events/sec peak ke liye 24 partitions kaise nikale?"

**My Answer:** "Ek partition ke liye main ~250 eps ka safe budget rakhta hoon -- Kafka broker isse kaafi zyada kar leta hai, par **consumer** ki speed matter karti hai: har event par ek Redis lookup + ek Postgres upsert hai, matlab ek consumer instance ~200-300 eps se zyada nahi karega. 6,000 / 250 = 24. Partitions consumer parallelism ki upper limit hai -- 24 partitions matlab maximum 24 consumer instances kaam kar sakte hain. Isliye main thoda upar rakhta hoon (24 jab abhi 3 chahiye), kyunki **partitions badhana aasaan hai par key-ordering tod deta hai** -- partition count badla toh `hash(serviceId) % partitions` badal jaata hai aur ek service ke purane-naye events alag partitions mein chale jaate hain."

### Database

**3. Interviewer:** "Dedup Redis se kar lo na -- Postgres pe unique index kyun?"

**My Answer:** "Redis fast path ke liye hai, truth ke liye nahi. Redis mein `SET dedup:<serviceId>:<dedupKey> NX EX 21600` bahut fast hai aur 95% duplicate events ko DB tak aane hi nahi deta -- ye main rakhta hoon. Lekin Redis ke andar **eviction** ho sakti hai (maxmemory policy), **failover** par last kuch ms ke writes ja sakte hain, aur restart par data ja sakta hai. Har aisi ghatna ka matlab hai: duplicate incident ban gaya -> ek aur banda page ho gaya -> customer bolega 'tumhare system ne mujhe do baar uthaya ek hi cheez ke liye'. Isliye truth `incidents (service_id, dedup_key) WHERE status <> 'resolved'` wale partial unique index par hai. `INSERT ... ON CONFLICT ... DO UPDATE ... RETURNING (xmax = 0) AS inserted` -- `xmax = 0` matlab row sach mein naya insert hua, aur **sirf usi case mein page jaata hai**. Trade-off: har non-cached event par ek DB round trip. Ye main khushi se deta hoon."

**4. Interviewer:** "Partial unique index sirf `status <> 'resolved'` par kyun? Poore table par kyun nahi?"

**My Answer:** "Kyunki dedup ka matlab hai 'jab tak problem zinda hai'. `cpu-high-web-3` aaj subah resolve ho gaya, aur shaam ko dobara hua -- woh **naya incident hai**, usi incident ka dobara khulna nahi. Agar main poore table par unique index lagata toh doosri baar insert fail ho jaata aur page hi nahi jaata -- **ye ek missed page hai, sabse bada bug**. Partial index ka ek aur fayda: index chhota rehta hai, kyunki 99% incidents resolved hain aur unki entry index mein hai hi nahi -- 450 GB table par bhi ye index chhota aur garam rehta hai."

**5. Interviewer:** "90 din ka data rakhna hai, 450 GB. Delete kaise karoge?"

**My Answer:** "`DELETE FROM incidents WHERE created_at < now() - interval '90 days'` **kabhi nahi** -- woh 5 GB/day delete karega, bloat banayega, aur autovacuum ke saath production ko hilaayega. Isliye `incidents` monthly `PARTITION BY RANGE (created_at)` hai: purana partition pehle S3 mein Parquet ke roop mein export hota hai, phir `DROP TABLE incidents_2026_01` -- ye metadata operation hai, milliseconds, koi vacuum nahi, koi bloat nahi. Timeline (`incident_events`) aur `notifications` bhi same tarah (30-day retention). Trade-off: partition banane/hataane ka maintenance job chahiye (pg_partman ya apna cron), aur cross-partition queries thodi mehengi hoti hain -- isliye dashboards ki queries hamesha `created_at` range ke saath likhi jaati hain taaki partition pruning ho."

### Kafka

**6. Interviewer:** "Kafka consumer 20 minute peeche chala gaya (lag). Kya karoge?"

**My Answer:** "20 minute lag ka matlab hai ki jo page abhi jaana chahiye tha woh 20 min baad jaayega -- **is product mein woh missed page ke barabar hai**. Pehle root cause: `kafka_consumer_lag{topic,group}` ke saath consumer ka p99 processing time dekho. Aksar wajah DB slow hoti hai, Kafka nahi. Turant ke options: (a) consumer instances badhao -- par **maximum 24 tak** (partitions se zyada consumer bekaar baithenge); (b) processing ke andar batching -- 100 events ka ek batch upsert; (c) agar ek 'poison' message atka hai toh usko DLQ mein bhej ke aage badho. Aur ek product-level decision jo main propose karunga: lag bada ho toh **purane events ko skip karna** theek ho sakta hai -- 20 min purana `trigger` event shayad already resolve ho chuka hai; par ye khatarnak hai, isliye main skip nahi karta, sirf **process order** badalta hoon (critical severity pehle) agar aisa design ho."

**7. Interviewer:** "Offset kab commit karte ho? Auto-commit kyun band hai?"

**My Answer:** "`enable.auto.commit=false`. Auto-commit har 5 second mein background mein offset aage badha deta hai -- matlab message padha, abhi process ho raha hai, tabhi commit ho gaya, aur phir process crash -- **message chala gaya, page kabhi nahi bheja**. Ye at-most-once hai, aur hamare liye zeher. Hum karte hain: message padho -> Postgres mein incident + timeline + timer **ek transaction** mein commit karo -> `notifications` topic par produce karo -> phir **manual offset commit**. Crash beech mein hua toh message dobara aayega, aur dobara aane par partial unique index aur `task_id` unique index duplicate ko sambhal lete hain. Trade-off: throughput thoda kam (har batch ke baad commit), aur duplicates possible."

**8. Interviewer:** "Consumer rebalance ke waqt kya hota hai? Deploy par har baar rebalance?"

**My Answer:** "Rebalance ke dauraan partitions ruk jaati hain -- agar rebalance 30 s leta hai toh 30 s ke pages late hain. Teen cheezein karta hoon: (a) **static group membership** (`group.instance.id`) -- pod restart par Kafka usi instance ko wahi partitions wapas deta hai aur poora rebalance nahi hota; (b) **cooperative sticky assignor** -- saari partitions ek saath revoke nahi hoti, sirf jo move ho rahi hain; (c) **graceful shutdown**: `SIGTERM` par consuming band, in-flight messages poore karo, offsets commit karo, phir `consumer.disconnect()` (Part 25 Q4). Agar hard kill karoge toh session timeout tak (default 45 s) Kafka us instance ki partitions kisi ko nahi dega -- **45 second ke pages atke rahenge**. Ye is system mein deploy ka sabse bada risk hai, isliye rolling deploy ek-ek pod, `terminationGracePeriodSeconds` bada."

### Redis

**9. Interviewer:** "Redis poora wipe ho gaya. Kya kya gaya?"

**My Answer:** "Chaar cheezein Redis mein hain, aur unka nuksaan alag alag hai:
1. `svc:<routingKey>` cache -- **koi nuksaan nahi**, Postgres se dobara bhar jaayega, bas thodi der DB par extra load.
2. `dedup:<serviceId>:<dedupKey>` fast path -- **koi correctness nuksaan nahi**, kyunki truth Postgres ka partial unique index hai. Bas thodi der har event DB tak jaayega.
3. `sched:escalations` ZSET -- **yahan asli khatra hai**: 3,500 active timers gayab. Isliye durable copy `escalation_timers` table mein hai aur ek recovery job har 60 s `SELECT ... WHERE state='pending' AND due_at < now() + interval '5 minutes'` karke `ZADD NX` karta hai. Worst case ek escalation ~60 s late ho sakta hai -- acceptable, missed nahi.
4. `grp:` counters aur `cb:` circuit breaker state -- reset ho jaayenge, matlab thodi der grouping band aur breaker `closed` se shuru. Cosmetic.

Toh Redis wipe ka asli impact: **thodi der ke liye zyada DB load aur ek minute tak escalation lag**. Ye design jaanbujh kar aisa hai -- 'Redis kho jaaye toh system dheela ho, toota nahi.'"

**10. Interviewer:** "Do scheduler instances chal rahe hain. Same timer do baar fire nahi hoga?"

**My Answer:** "Nahi, kyunki claim atomic hai. Scheduler har 1 s ek Lua script chalata hai jo `ZRANGEBYSCORE` se due timers nikaalti hai **aur usi script mein `ZREM` bhi kar deti hai** -- Redis single-threaded hai, toh script ke beech koi doosra command nahi ghus sakta. Jo instance timer utha leta hai, doosre ko woh milta hi nahi. Isiliye mujhe **leader election nahi chahiye** -- aur main ye deliberately choose karta hoon, kyunki leader-based design mein leader ka girna aur naya leader chunna khud ek outage window hai. Trade-off jo maine accept kiya: agar claim ke baad aur Kafka produce se pehle scheduler crash ho jaaye, toh woh timer ZSET se nikal chuka hai par fire nahi hua -- isse bachane ke liye Postgres `escalation_timers.state` abhi bhi `pending` hai, aur recovery job 60 s mein use wapas ZSET mein daal degi. **Ye at-least-once hai, aur yahi chahiye.**"

### Timers

**11. Interviewer:** "Escalation timer ka lag kaise measure karoge? Kitna acceptable hai?"

**My Answer:** "`timer_lag_seconds` = actual fire time minus `due_at`. Ye histogram hai, aur alert `> 10 s` par hai. Scheduler ka tick 1 s hai, toh baseline lag 0-1 s hai. Lag badhta hai teen wajah se: (a) ek tick mein due timers batch size se zyada hain (storm mein 50,000 due) -- isliye batch size tune karta hoon aur ek tick mein multiple batches; (b) Redis slow; (c) scheduler process ka event loop block (Part 25 Q1). 10 s ka budget isliye kyunki hamara page latency SLO p99 10 s hai -- escalation bhi ek page hai. Aur ek baat: timer lag **sirf late** ho sakta hai, early nahi -- `ZRANGEBYSCORE -inf now` kabhi future timer nahi uthata."

**12. Interviewer:** "Ack ho gaya, par notification pehle se hi queue mein hai. Kya woh SMS jaayega?"

**My Answer:** "Hum teen jagah rokte hain: (a) ack par `escalation_timers.state = 'cancelled'`, (b) Redis ZSET se `ZREM`, (c) queued notifications ka `status='cancelled'`. Lekin **teeno ke baad bhi** ek task Kafka `notifications` topic mein pada ho sakta hai jo already produce ho chuka hai -- usko wapas nahi le sakte. Isliye worker mein **last-moment check**: SMS bhejne se **theek pehle** DB/Redis se incident ka current status padho; `acknowledged` ya `resolved` hai toh notification ko `cancelled` mark karke skip kar do. Ye check race-free nahi hai (check aur send ke beech microseconds ka gap hai) -- matlab kabhi kabhi ack ke 1 second baad bhi ek SMS nikal jaayega. **Ye acceptable hai**; ulta (ack ke baad escalate karte rehna) unacceptable hota."

**13. Interviewer:** "`repeatCount` 2 hai. Escalation exhaust ho gaya, kisi ne ack nahi kiya. Ab?"

**My Answer:** "Policy ke saare levels 2 baar ghoom chuke -- ab hum aur page nahi karte, warna system infinite paging machine ban jaata. Hum karte hain: timeline mein `escalation exhausted` entry (audit ke liye, ye sabse important hai), account ke admin/manager ko ek notification, aur incident dashboard par 'unacknowledged, escalation exhausted' flag jo alag se dikhta hai. Kuch products yahan 'notify the whole team' ya 'call the account owner' karte hain -- ye product decision hai, aur main interview mein bolunga ki main customer se poochhunga. Ek cheez main **nahi** karunga: chup-chaap ruk jaana bina kisi record ke."

### Concurrency

**14. Interviewer:** "Do responders ne exactly same second mein ack dabaya. Kya hoga?"

**My Answer:** "Optimistic locking: `UPDATE incidents SET status='acknowledged', acknowledged_by=$1, version=version+1 WHERE id=$2 AND status='triggered' AND version=$3`. Jo pehle pahuncha usko 1 row update mila; doosre ko **0 rows** mila. Aur 0 rows par main error nahi deta -- `200` deta hoon current state ke saath (`acknowledged by Priya at 02:14`), kyunki user ki galti nahi hai aur ack **idempotent** hona chahiye. Timeline mein dono ki entry jaati hai (`acknowledged` aur `ack_ignored_already_acknowledged`), taaki baad mein audit mein dikhe ki dono jaage the. Trade-off: optimistic lock retry loop ki zarurat nahi kyunki hum retry nahi karte -- state machine mein `triggered -> acknowledged` sirf ek baar hota hai."

**15. Interviewer:** "Do incident-service workers same `dedupKey` ka event ek saath process kar rahe hain. Do incident ban jaayenge?"

**My Answer:** "Nahi -- do reasons se. Pehla: Kafka partition key `serviceId` hai, toh ek service ke saare events **ek hi partition** mein hain aur ek hi consumer instance unhe **serially** process karta hai. Ye 90% race khatam kar deta hai. Doosra (aur asli guarantee): rebalance ke dauraan ya partition reassignment par do instances thodi der same partition dekh sakte hain -- wahan Postgres ka partial unique index bachata hai. `INSERT ... ON CONFLICT` mein Postgres row-level lock leta hai; ek transaction insert karti hai, doosri wait karti hai aur phir `DO UPDATE` path par jaati hai, `xmax = 0` false milta hai, page nahi jaata. **Guarantee application logic mein nahi, DB constraint mein hai** -- yahi is design ka main point hai."

### Delivery guarantees

**16. Interviewer:** "Tum kehte ho duplicate page OK hai. Customer ko bolega kaise?"

**My Answer:** "Main product level par ise **explicitly** document karta hoon: 'We guarantee at-least-once delivery of pages. In rare failure scenarios you may receive a duplicate notification.' Aur main duplicates ko minimize karta hoon -- `notifications.task_id` unique index (same task do baar process hua toh doosra insert fail, SMS nahi jaata), provider-side idempotency key jahan support hai, aur worker mein last-moment status check. Customer ko jo line convince karti hai: **'aapko do baar phone aaya, ye annoying hai. Par agar hum exactly-once ka wada karte, toh kabhi kabhi aapko phone aata hi nahi -- aur aapka production 40 minute down rehta.'** Koi bhi on-call engineer ye trade samajh jaata hai."

**17. Interviewer:** "`task_id` unique index duplicate rokta hai -- toh ye exactly-once ho gaya na?"

**My Answer:** "Nahi, ye 'effectively-once **hamare** system ke andar' hai. Index rokta hai ki ek `taskId` ke liye do `notifications` rows banein. Par asli duplicate wahan ban sakta hai jahan index pahunch hi nahi sakta: worker ne Twilio ko HTTP call ki, Twilio ne SMS bhej diya, par response hum tak aane se pehle network timeout ho gaya -- hamare DB mein `sent` nahi likha, worker retry karega, **doosra SMS jaayega**. Isko kam karne ke liye: Twilio ko idempotency key bhejo jahan support hai, aur retry se pehle provider se status query karo (mehenga). Poori tarah band karna possible nahi kyunki **Twilio hamare Postgres transaction ka hissa nahi hai** -- ye distributed systems ka fundamental hai, bug nahi."

### Failure

**18. Interviewer:** "Twilio poora down hai, 20 minute. Kya karoge?"

**My Answer:** "Teen layers chalti hain. (1) **Circuit breaker** (`cb:twilio`): 30 s window mein >50% failures aur >=20 requests -> `open` 30 s. Open matlab workers Twilio ko call hi nahi karte -- warna har notification 30 s timeout par atakti aur worker pool jaam ho jaata. (2) **Failover provider**: SMS ke liye MessageBird par switch. Ye pehle se configured hona chahiye, outage ke beech contract nahi ho sakta -- aur numbers bhi alag honge, toh customer ko alag number se SMS aayegi (isko documentation mein batana padta hai). (3) **Channel downgrade**: SMS fail -> voice try karo (alag provider ya same provider ka alag path), aur push toh chal hi raha hai (FCM/APNs Twilio se independent hai). Jo phir bhi fail ho, `notifications-dlq` mein, `dlq_depth` alert page-worthy hai. Aur ek honest baat: agar push, SMS aur voice teeno provider ek saath down hon, toh hum **Slack aur email** par gir jaate hain aur status page par likhte hain. Koi jaadu nahi hai."

**19. Interviewer:** "Kafka down hai. Ingest kya karega? `200` de dega?"

**My Answer:** "Bilkul nahi -- **fail closed**. Ingest pehle ek bounded **local disk spool** mein likhta hai (~60 s worth), taaki chhoti si blip customer ko dikhe hi na, aur Kafka wapas aate hi spool drain ho jaaye. Spool bhar gaya toh `503 INGEST_UNAVAILABLE`. Reason: `202 Accepted` ka matlab hai 'humne is event ki zimmedari le li'. Agar hum accept bol ke event gira dete hain, toh customer ka Alertmanager retry bhi nahi karega -- **woh page hamesha ke liye gaya**. `503` par uska monitoring khud retry karega. Ye rate limiter lesson ka ulta hai -- wahan main fail-open tha, kyunki limiter ka kaam API ko bachana tha. Yahan main fail-closed hoon, kyunki **accepting a page you cannot deliver is worse than rejecting it loudly.**"

**20. Interviewer:** "Postgres primary gir gaya. Ingest chalta rahega?"

**My Answer:** "Haan, aur ye is architecture ka sabse bada fayda hai. Ingest path par Postgres hai hi nahi -- sirf Redis `svc:` cache (miss par Postgres, par 100,000 services 5-minute TTL par mostly cached hain) aur Kafka produce. Toh **events accept hote rahenge aur Kafka mein jamte rahenge**. Jo rukega woh incident service hai (dedup + insert), matlab pages nahi jaayenge jab tak DB wapas na aaye. Failover (managed Postgres par ~30-60 s) ke baad consumer lag se catch up karega aur saare events process honge -- **kuch bhi kho nahi hoga**, bas pages us window jitne late honge. Ye exactly woh scenario hai jiske liye Kafka hai. Ek honest limitation: agar DB 30 min down rahe, toh 30 min purane pages ek saath nikalenge -- us waqt grouping aur 'stale event' handling zaruri ho jaati hai (Part 24 #3)."

### Security

**21. Interviewer:** "Routing key leak ho gayi -- GitHub par commit ho gayi. Kya hoga aur kya karoge?"

**My Answer:** "Routing key effectively ek API key hai -- jiske paas hai woh us service ke naam par incidents bana sakta hai, matlab **kisi ko bhi raat 3 baje utha sakta hai** (ek naya attack: alert-fatigue DoS). Isliye: (a) key par per-routing-key **token bucket rate limit** pehle se hai (`rl:events:<routingKey>`) -- storm ek customer tak simit rahe; (b) key rotation API ho, aur rotate karte waqt purani key ko grace period do (monitoring config update hone mein time lagta hai); (c) keys ko DB mein hash karke rakho jahan possible, logs mein kabhi poori key mat likho; (d) anomaly detection -- 'is service ka event volume 50x ho gaya aur source IP naya hai' -> alert. Aur incident response: key revoke, timeline mein sab audited hai (`incident_events` immutable hai), customer ko batao ki kaunse incidents us key se aaye."

**22. Interviewer:** "Phone numbers aur emails -- PII. Kaise handle karte ho?"

**My Answer:** "`contact_methods.address_enc BYTEA` -- envelope encryption: har row ka data key, jo KMS ke master key se encrypt hota hai. App ko plaintext number **sirf** us waqt milta hai jab provider ko bhejna ho. Logs mein masked (`+91XXXXXX1234`), aur ye masking ek util function mein hai jise sab log calls use karti hain -- warna koi ek jagah `logger.info({ task })` kar dega aur poora object leak ho jaayega. Backups bhi encrypted, aur read replicas par bhi wahi encryption. Access: `address_enc` decrypt karne ka permission sirf notification workers ke IAM role ko, API ko nahi. Aur GDPR: user delete par `contact_methods` hard delete, par `incident_events` timeline mein sirf `userId` hai (number nahi), toh audit trail bacha rehta hai. Trade-off: encrypted column par query nahi kar sakte -- 'is number wala user kaun hai' ke liye alag deterministic hash column (`address_hash`) rakhna padta hai."

### Cost

**23. Interviewer:** "$22K/day ka SMS + voice bill hai. Aadha karo."

**My Answer:** "Main sabse pehle data dekhunga: kitne incidents push se hi ack ho jaate hain? Agar 70% hote hain toh baaki 30% par SMS ka paisa lag raha hai. Char lever hain:
1. **Push ko pehle aur behtar karo** -- SMS ka delay 1 min se 2 min karo un users ke liye jinke push ka ack rate accha hai. Ye directly SMS volume ghatata hai. Risk: 1 min extra latency un cases mein jahan push fail hua.
2. **Grouping** -- storm mein 63 incidents ke 63 SMS ki jagah ek. Ye storm days par bahut bada saving hai.
3. **Low urgency ko kabhi SMS/voice mat do** -- `warning`/`info` sirf email/digest. Ye already design mein hai, par main audit karunga ki customers ne severity mapping sahi set kiya hai (aksar sab kuch `critical` mark kar dete hain).
4. **Provider negotiation aur routing** -- volume commit se rate kam, aur country-wise sabse sasta provider (India ka traffic ek provider, US ka doosra).
Trade-off jo main **nahi** karunga: retries kam karna ya voice hata dena. Woh reliability ko kaat kar paisa bachana hai, aur is product mein reliability hi product hai. Main customer ko bolunga: 'high urgency ka matlab paisa hai -- decide karo ki kya sach mein high urgency hai.'"

**24. Interviewer:** "Kafka 7 din retention = 1 TB disk. Zaruri hai?"

**My Answer:** "7 din ka reason replay hai. Main poochhunga: pichle saal hum kitni baar replay kiye? Agar jawab '2 baar, aur dono baar 24 ghante ke andar ka data' hai, toh 3 din retention kaafi hai aur disk aadha ho jaata hai. Par main 7 din se neeche jaane se pehle ek aur cheez dekhta hoon: **raw events ka archive S3 mein** already ja raha hai (compliance ke liye) -- agar wahan se replay possible hai (thoda slow, par possible), toh Kafka retention sirf operational buffer hai aur 2-3 din bilkul kaafi. Ye ek classic 'hot vs cold' trade hai: Kafka hot replay (minutes), S3 cold replay (hours)."

### Multi-region

**25. Interviewer:** "Ek hi region hai. Agar woh poora chala jaaye?"

**My Answer:** "Ye is product ka sabse sharm-wala failure hai -- **hamara system down aur customers ko pata nahi ki unka system down hai.** Isliye at minimum: (a) ingest ko multi-region karo, kyunki woh stateless hai -- GeoDNS/anycast, dono regions Kafka par likhein (active-active ingest, ya passive region ka Kafka MirrorMaker se primary par); (b) Postgres ka cross-region read replica jo promote ho sake (async replication, RPO seconds); (c) **status page aur alerting apne infra par mat rakho** -- hamara apna monitoring ek doosre cloud/region par hona chahiye, warna hum apna outage khud detect nahi kar paayenge. RTO realistically 10-30 min hai agar DB promote manual hai. Full active-active is system mein mushkil hai kyunki dedup ko ek global consistent view chahiye -- do regions mein alag Postgres matlab same `dedupKey` ke do incidents. Agar active-active chahiye toh **cell/region-partitioned by account** (har account ka home region fixed) -- tab dedup local rehti hai. Ye Part 24 #4 ka jawab hai."

### Disaster recovery

**26. Interviewer:** "RPO aur RTO kya hai? Backup kaise test karte ho?"

**My Answer:** "Data ke hisaab se alag:
- **Kafka events:** replication factor 3, `acks=all`, min.insync.replicas 2 -> RPO ~0 broker failure par; poora cluster jaaye toh 7 din ka data (disk).
- **Postgres:** continuous WAL archiving + PITR, cross-region replica. RPO ~seconds, RTO ~10-30 min (promote + DNS).
- **Redis:** RPO 'don't care' -- sab kuch recoverable hai (cache Postgres se, timers `escalation_timers` se). Yehi design ka fayda hai.
- **S3 archive:** versioning + cross-region replication.
Testing: main **game days** chalata hoon -- staging par Redis flush karke dekho timers 60 s mein wapas aate hain kya; ek broker maaro; Postgres replica promote karke poora flow chalao. Aur sabse important: **restore ko test karo, backup ko nahi**. Ek backup jo kabhi restore nahi hua, woh backup nahi hai. Hum quarterly ek backup se poora environment khada karke ek synthetic incident end-to-end page karte hain."

### Testing

**27. Interviewer:** "Paging system ko test kaise karoge bina asli logon ko raat mein uthaye?"

**My Answer:** "Ye is system ka sabse under-rated engineering problem hai. Chaar layers:
1. **Test mode / fake providers:** har provider ke peeche `NotificationProvider` interface hai (spec mein hai). Staging mein `FakeSmsProvider` jo DB mein likhta hai aur ek internal UI par dikhata hai -- koi asli SMS nahi. Cost bhi zero.
2. **Staging phone numbers:** ek chhota pool of test numbers (Twilio test credentials ya team ke liye dedicated numbers) jo sirf on-call **engineering** team ke paas hain, customers ke nahi. In par asli end-to-end delivery test hota hai.
3. **Synthetic incidents (canary):** production mein har 5 minute ek synthetic service par ek `trigger` event bhejta hoon jo ek **bot user** ko page karta hai (push to a test device + SMS to a test number). Woh bot 10 s mein ack karta hai. Agar page nahi aaya ya ack nahi hua, ye **hamara apna incident** hai. Isse `page_latency_seconds` ka end-to-end measurement bhi milta hai, sirf internal timing nahi. Ye sabse valuable monitoring hai jo is system mein ho sakti hai.
4. **Deterministic unit/integration tests:** escalation logic ko fake timers ke saath (Part 25 Q7), on-call rotation ko fixed timestamps aur DST boundaries ke saath (spring-forward par 2 AM handoff exist hi nahi karta), aur Postgres dedup ko testcontainers par 200 parallel inserts se -> exactly 1 incident.
Aur ek rule: **production par 'test page' bhejne ka feature customer-facing hona chahiye** ('Send test alert' button), taaki naye user apna setup khud verify kar sake bina hamein poochhe."

**28. Interviewer:** "Escalation ka test likhna hai -- 5 minute wait karoge?"

**My Answer:** "Nahi. Do level par test hota hai. **Unit level:** `EscalationService.onTimerFired(incident)` ek pure function jaisa hai -- usko current level, `repeatCount`, aur policy do, aur assert karo ki agla target kaun hai. Koi waiting nahi. **Integration level:** scheduler ko test mein `due_at = now() - 1s` wala timer do -- woh turant due hai, tick aate hi fire hoga. Matlab time aage badhane ki jagah main **timer ko peeche** rakh deta hoon. Ye Redis ke `TIME` wale problem se bhi bachata hai (fake timers Redis ke andar kaam nahi karte). Aur ek third test jo log bhool jaate hain: **cancel ka test** -- timer schedule karo, ack karo, tick chalao, assert karo ki koi escalation nahi hui."

### Product-level debugging

**29. Interviewer:** "Customer bola: 'mujhe ek hi incident ke liye 3 SMS aaye.' Kaise debug karoge?"

**My Answer:** "Data pehle se store kiya hua hai, isliye ye 5 minute ka kaam hona chahiye. Steps:
1. `notifications WHERE incident_id = ?` -- teeno rows nikalo. Dekho `task_id` **same hai ya alag**.
2. Agar **task_id alag hai**: ye duplicate delivery nahi, duplicate **decision** hai. Matlab ya toh teen alag escalation levels the (level 1, level 2, repeat round) -- jo bilkul sahi behaviour hai aur customer ko `incident_events` timeline dikha ke samjhaya ja sakta hai -- ya routing ne ek hi user ko do levels par resolve kiya (schedule + direct user target dono mein wahi banda). Fix: routing ke baad **per-user dedupe** -- ek escalation round mein ek user ko ek hi page.
3. Agar **task_id same hai**: ye at-least-once ka duplicate hai. `notification_attempts` dekho -- kitne attempts, kya errors, kya timeouts the. Aksar pattern: Twilio ko call gayi, timeout hua, humne retry kiya, dono deliver ho gaye. Provider ke logs se `provider_message_id` match karo.
4. Agar **do incidents ban gaye the** (dedup fail): `incidents WHERE service_id = ? AND dedup_key = ?` -- do rows? Toh Redis fast path ya monitoring tool ka `dedupKey` badalta hai har event mein (bahut common -- log line mein timestamp ghusa hota hai). Customer ko unke `dedupKey` ka pattern dikhao.
Har case ka fix alag hai, aur isiliye hum `task_id`, `notification_attempts` aur immutable timeline store karte hain -- **ye teeno columns exactly is conversation ke liye hain.**"

**30. Interviewer:** "Ulta case: 'mujhe page aaya hi nahi, aur production 40 min down raha.' Ab?"

**My Answer:** "Sabse serious complaint. Main timeline ke reverse mein chalta hoon aur har step par 'kya hamara data ye prove karta hai?' poochhta hoon:
1. **Event aaya tha?** Ingest logs / `events_ingested_total` aur Kafka mein `routingKey` + time window se search. Agar event hi nahi aaya -> customer ka monitoring nahi bheja (ya `503` mila aur unhone retry nahi kiya -- ingest ke `503` bhi log hote hain, ye check karna zaruri hai).
2. **Incident bana?** `incidents WHERE service_id AND created_at range`. Agar dedup ki wajah se naya incident nahi bana -- **ye sabse common wajah hai**: purana incident abhi tak `triggered` tha aur nayi problem usi `dedupKey` par aayi, toh humne sirf `occurrence_count` badhaya aur page nahi bheja. Ye by design hai; customer ko samjhana padta hai ki purana incident resolve karo ya alag `dedupKey` bhejo.
3. **Routing ne kis user ko chuna?** `incident_events` timeline mein `notified` entry hai -- `detail` JSONB mein userId, channel, level. Agar wahan galat banda hai -> schedule/rotation bug (aksar **timezone/DST**).
4. **Notification bani aur bheji gayi?** `notifications` + `notification_attempts` -- `failed` hai toh error kya tha (invalid number = permanent fail, aur us par humein user ko warn karna chahiye tha).
5. **Provider ne deliver kiya?** Delivery webhook ka `delivered_at`. `delivered` hai par banda soya raha -> **channel ka failure mode** (push on silent phone). Yahan jawab escalation ka hai: 'aapki policy mein level 2 5 min par tha aur level 1 ka user ne DND rakha tha.'
Har step par ya toh data hai ya nahi hai -- aur jahan data nahi hai, wahi hamara observability gap hai jo main us incident ke baad theek karta hoon."

## PART 24 -- Requirement Change ("What if...") Questions (13)

> Format: **Current Design -> New Problem -> Change -> Trade-off.**

### 1. What if traffic becomes 100x? (5 billion events/day)

- **Current Design:** 50M events/day (579 eps avg, 6,000 eps peak), Kafka 24 partitions, ek Postgres primary, 7.5M notifications/day.
- **New Problem:** 58,000 eps average, 600,000 eps peak. Postgres par 2,900 incidents/sec average -- ek primary par impossible. Notifications 750M/day -> SMS bill **$1.7M/day**. Kafka 5 TB/day x 7 days x RF3 = ~100 TB disk. Ek Postgres ka `incidents` table 500 GB/day badhega.
- **Change:**
  - **Cell-based architecture:** accounts ko cells mein baanto (har cell = apna Kafka + Postgres + Redis + workers, e.g. 50 cells x 400 accounts). Routing `accountId -> cell` ek chhoti lookup se. Ye sirf scaling nahi, **blast radius** bhi deta hai -- ek cell ka outage 2% customers ko chhuta hai, 100% ko nahi.
  - **Postgres sharding by `account_id`** (ya Citus) cell ke andar, kyunki dedup ka scope `(service_id, dedup_key)` hai aur service ek account ka hai -- **shard key natural hai**, joins cross-shard nahi jaate.
  - Kafka partitions 24 -> per cell 24 (total 1,200), ya ek bada cluster with tiered storage.
  - **Notification path par aggressive grouping aur push-first** -- $1.7M/day bill ka sirf ek hi asli jawab hai: kam SMS bhejo.
  - Timeline aur attempts ko Postgres se **ClickHouse ya S3+Athena** par shift karo -- woh append-only analytics data hai, relational nahi.
- **Trade-off:** cells se cross-account features (global search, org-wide dashboards) mushkil ho jaate hain -- unke liye alag aggregation layer chahiye. Ops 50x. Aur honest baat: is scale par SMS ka business model hi badalna padega (per-page pricing), kyunki ab cost product decision ban gaya hai.

### 2. What if Kafka is removed?

- **Current Design:** Kafka `incident-events` ingest aur incident service ke beech, `notifications` incident aur workers ke beech.
- **New Problem:** Ingest `202` bolne se pehle event kahan likhe? Aur replay, ordering, multi-consumer kahan se aayein?
- **Change -- teen options:**
  1. **Postgres outbox + `SKIP LOCKED` workers:** ingest `INSERT INTO event_inbox` karke `202` de. Workers `SELECT ... FOR UPDATE SKIP LOCKED LIMIT 100` se batch uthayein. Ordering ke liye `serviceId` par advisory lock. **Ye 6,000 eps par mushkil hai** -- 6,000 inserts + 6,000 deletes/sec, plus vacuum -- par 500-1,000 eps par bilkul kaam karta hai.
  2. **Redis Streams:** `XADD` + consumer groups -- Kafka ka 80% model (consumer groups, pending entries list, ack) bina Kafka ke ops ke. Retention memory par depend karta hai, replay limited.
  3. **SQS/SNS:** zero ops, par ordering nahi aur 15 min delay cap.
- **Trade-off:** teeno mein **replay** kharab ya nahi hai. Postgres option mein ingest ki availability DB se bandh jaati hai -- jo hamara sabse bada design goal tha (`202` bolne ke liye DB chahiye). Main honest jawab dunga: "agar Kafka hatana hai toh main Redis Streams lunga aur raw events ka S3 archive rakhunga replay ke liye -- par ye Kafka se kamzor hai, aur main ye clearly bolunga."

### 3. What if Postgres is down for 30 minutes?

- **Current Design:** Ingest Postgres-independent hai (Redis `svc:` cache + Kafka). Incident service har event par Postgres upsert karta hai.
- **New Problem:** Ingest chalta rahega aur Kafka mein 30 min x 579 eps = **~1M events** jam jaayenge. Incident service atak jaayega -- **30 minute tak koi page nahi jaayega**. Aur DB wapas aane par 1M events ek saath process honge -> ek hi jhatke mein hazaaron pages nikalenge, jinme se aadhe already purane/resolve ho chuke honge.
- **Change:**
  - **Ingest zinda rakho** (already hai) -- ye sabse important hai, kyunki kuch bhi kho nahi raha.
  - **Failover:** managed Postgres par automatic (30-60 s); manual promote ke liye runbook. 30 min ka outage matlab failover fail hua -- yahi asli problem hai, isliye replica promotion ko game day mein test karo.
  - **Catch-up ke waqt stale handling:** incident service mein ek rule -- event `receivedAt` se `now()` ka gap > N minutes hai toh incident to banao (audit chahiye) par **notification decision current state se lo**: agar us `dedupKey` ka incident already resolve ho chuka hai ya us service ne baad mein `resolve` bheja hai, toh page mat bhejo.
  - **Grouping catch-up par aggressive karo** -- 1M events ke baad jo pages banenge unhe per-service group karo.
  - **Degraded mode ka option:** critical severity events ke liye ek emergency path -- Redis mein minimal incident record + direct page, aur Postgres wapas aane par reconcile. Ye main **sirf tab** karunga jab product bole "30 min blind rehna acceptable nahi" -- kyunki ye do sources of truth banata hai, jo apne aap mein bug factory hai.
- **Trade-off:** stale-event skip karne se ek asli page miss ho sakta hai (jo hamara #1 paap hai), isliye skip ki jagah **group + mark as delayed** behtar hai. Degraded mode reliability badhata hai par complexity aur consistency bugs laata hai.

### 4. What if we need multi-region with EU data residency?

- **Current Design:** ek region, ek Postgres, ek Kafka, global dedup.
- **New Problem:** EU customers ka data (incident summaries, phone numbers, emails -- sab PII) EU se bahar nahi ja sakta. Aur active-active mein dedup ka global consistent view chahiye, jo cross-region latency (70-150 ms) par possible nahi.
- **Change:**
  - **Region-partitioned (cell) architecture, account ke hisaab se:** har account ka ek **home region** (`eu-west-1` ya `us-east-1`). Poora stack per region: Kafka, Postgres, Redis, workers. Dedup **hamesha ek region ke andar** hoti hai, kyunki ek account sirf apne home region mein hai -> **cross-region consistency ka problem hi nahi rehta.**
  - **Ingest edge:** GeoDNS se nazdeek region par, aur agar event galat region mein aaya toh ek lightweight router use sahi region ke Kafka par forward kare (ya `307` de). Routing table (`accountId -> region`) globally replicated hai -- ye chhota aur rarely-changing data hai, isliye replicate karna safe hai.
  - **Kya globally replicate hota hai:** sirf non-PII control plane -- account -> region mapping, feature flags, billing IDs. **PII kabhi nahi.**
  - **Providers bhi region-aware:** EU customers ke SMS EU ke Twilio region se, EU sub-processor agreements ke saath.
- **Trade-off:** EU account ka responder US mein travel kar raha ho toh uska page EU se aayega -- thodi extra latency (acceptable, 100-200 ms). Cross-region features (global search across accounts) ab possible nahi. Aur DR mushkil ho jaata hai: EU region down hone par US par failover **legally allowed nahi ho sakta** -- toh EU ke andar hi multi-AZ aur ek second EU region chahiye.

### 5. What if page latency must be under 1 second (p99)?

- **Current Design:** p95 < 5 s, p99 < 10 s. Path: ingest (Kafka produce `acks=all` ~5-10 ms) -> Kafka -> incident consumer (Redis + Postgres upsert + produce) -> notification topic -> worker -> provider HTTP call.
- **New Problem:** Hamare hops hi ~200-500 ms lete hain accha din par, par p99 mein Kafka batching (`linger.ms`), consumer poll interval, DB tail latency aur **provider ka apna time** (Twilio ko SMS accept karne mein 200-800 ms, carrier delivery 2-10 s) sab jud jaate hain. **Sabse badi problem:** "page latency" ka matlab kya hai? Agar "phone bajna" hai toh 1 s **carrier ke control mein hai, hamare nahi** -- SMS par 1 s p99 promise karna hi galat hai.
- **Change:**
  - Pehle **definition clarify karo**: hamara SLI `page_latency_seconds` = event accept se **first provider handover** tak. Ye hum control karte hain. End-to-end delivery hum nahi karte.
  - **Fast path for critical:** `severity=critical` events ke liye ek alag, chhota Kafka topic (ya `priority` partition set) + dedicated consumers, taaki storm ke non-critical events ke peeche na lagein.
  - Kafka `linger.ms=0` critical producer par, `acks=all` rakhte hue (durability chhodni nahi hai).
  - Incident consumer mein **Postgres upsert aur notification produce ko parallel mat karo, par produce ko upsert ke turant baad karo** -- timeline insert aur timer insert async (same transaction mein nahi rakhna pad sakta; tab outbox pattern).
  - Provider call par **keep-alive agent + pre-warmed connections + `AbortController` timeout 800 ms** (Part 25 Q8, Q9), aur first channel **push** (FCM ~50-200 ms), SMS nahi.
  - Agar sach mein sub-second chahiye toh **push-only fast path**: incident consumer khud (worker ke bina) FCM ko call kare critical ke liye, aur baaki channels normal path se.
- **Trade-off:** fast path = do code paths = do jagah bugs; `linger.ms=0` se producer throughput kam; consumer mein direct provider call karne se consumer ka event loop provider ki latency se bandh jaata hai (jo humne V1 mein exactly avoid kiya tha). Main ye sirf `critical` ke chhote volume par karunga, sab par nahi.

### 6. What if one customer sends 1M events in a minute?

- **Current Design:** per-`routingKey` token bucket (`rl:events:<routingKey>`), Kafka key = `serviceId`, grouping counters.
- **New Problem:** 1M/min = **~16,700 eps ek customer se**, jabki hamara poora peak 6,000 eps hai. Aur agar sab ek `serviceId` se hain toh woh **ek hi Kafka partition** par jaayenge -> woh partition ka consumer 16,700 eps nahi kar sakta -> us service ka lag badhta jaayega, aur kyunki partition shared hai, **usi partition par baithe doosre customers ke pages bhi late honge** (noisy neighbour).
- **Change:**
  - **Rate limit ingest par kaam karta hai** (Rate Limiter lesson) -- token bucket per routing key, e.g. 100 eps sustained + burst 1,000. Upar ka traffic `429 RATE_LIMITED` with `Retry-After`. Ye customer ko turant feedback deta hai ki unka monitoring loop mein hai.
  - **Hot partition ka fix:** key ko `serviceId` se `serviceId#bucket` par shift karo **sirf un services ke liye jo hot hain** (dynamic), aur ordering ki guarantee us service ke liye dedupKey-level par rakho (`hash(dedupKey) % N` -- same dedupKey same partition, jo dedup ke liye kaafi hai; poore service ka global order humein sach mein chahiye hi nahi).
  - **Grouping:** `grp:<serviceId>:<minute>` > 10 -> individual notifications band, ek grouped page per 5 min. Incidents phir bhi bante hain.
  - **Customer se baat:** 1M/min ka 99% chance ek **retry loop bug** hai (unka script fail hone par turant retry kar raha hai). Ye conversation engineering fix se zyada valuable hai.
  - **Per-account quota aur billing** -- unlimited free ingest ek business bug hai.
- **Trade-off:** rate limiting ka matlab hai ki hum kuch events **reject** kar rahe hain -- aur un rejected events mein ek asli naya incident ho sakta hai. Isliye limit generous rakhta hoon aur `429` par customer ko alag se notify karta hoon ("your service X is being throttled") -- warna hum chup-chaap unke alerts kha rahe honge, jo missed page ka hi doosra roop hai.

### 7. What if events arrive duplicated by their monitoring?

- **Current Design:** `(service_id, dedup_key)` partial unique index; monitoring har 30-60 s repeat bhejta hai, 95% dedup ratio.
- **New Problem:** Do variants hain. (a) **Exact duplicates** -- same `dedupKey`, ye hum already handle karte hain (counter badhta hai, page nahi jaata). (b) **Duplicates jo humein duplicate nahi dikhte** -- customer ka Alertmanager har event mein `dedupKey` mein timestamp ya random ID daal deta hai (`cpu-high-web-3-1758175200`), toh har 30 s ek **naya incident** banta hai aur har ek page karta hai. Responder ka phone har 30 s bajta hai. **Ye is product ki sabse common support ticket hai.**
- **Change:**
  - `dedupKey` absent ho toh hum khud `hash(summary + source)` banate hain (spec) -- ye variant (b) ko partially bachata hai, par tabhi jab customer key bheje hi na.
  - **Content-based secondary dedup:** ek hi service par 60 s window mein aaye events ka `hash(normalize(summary) + source)` Redis mein rakho; match mile toh incident to banao par **notification suppress** karke existing incident ke saath link karo ("similar to INC-123").
  - **Alert grouping** already yehi kaam karta hai storm level par (10+ incidents/min -> ek grouped page).
  - **Customer-facing fix:** dashboard par "your service X is creating a new incident every 30 seconds -- your dedupKey looks non-deterministic" wala diagnostic. Aur integration templates (Alertmanager ke liye ready-made config) jo sahi `dedupKey` set karti hain.
  - **Idempotency-Key header** client retries ke liye alag layer hai -- woh network retry se bachata hai, monitoring ke design se nahi.
- **Trade-off:** content-based dedup **galat merge** kar sakti hai -- do alag machines ka same summary ("disk full") ek incident ban gaya, aur ek machine ka fix hone par doosri bhool gayi. Isliye content dedup ka scope (service + source) tight rakhta hoon aur notification suppress karta hoon, incident merge nahi.

### 8. What if two responders acknowledge at the same time?

- **Current Design:** `UPDATE incidents SET status='acknowledged', acknowledged_by=$1, version=version+1 WHERE id=$2 AND status='triggered' AND version=$3`.
- **New Problem:** Dono ka `version=$3` same tha. Ek ko 1 row mila, doosre ko 0. Agar hum 0 rows par `409 Conflict` de dein toh doosra responder (jo raat ko uthke ack kar raha hai) ko error dikhega aur woh sochega ack nahi hua -- **woh dobara try karega ya panic karega.**
- **Change:**
  - 0 rows = **error nahi**. `200 OK` with current state: `{ status: 'acknowledged', acknowledgedBy: 'priya', acknowledgedAt: '...' }`. Client UI dikhata hai "Already acknowledged by Priya".
  - Timeline mein dono entries: `acknowledged` (Priya) aur `ack_noop` (Rahul) -- taaki post-incident review mein dikhe ki dono jaage the, aur on-call load ka data sahi rahe.
  - **Ack idempotent hai** poori tarah: wahi user dobara ack kare toh bhi `200` aur wahi state.
  - SMS reply "4" aur voice DTMF "4" bhi isi endpoint par jaate hain -- aur woh **do alag channels se ek hi user** ka double-ack aksar hota hai (banda SMS ka reply bhi karta hai aur app mein bhi tap karta hai).
- **Trade-off:** `version` column se optimistic locking simple hai, par har ack ek read + ek conditional update hai. Pessimistic lock (`SELECT ... FOR UPDATE`) bhi kaam karta par ek busy incident par lock queue banega. Hamare volume par optimistic hi sahi hai.

### 9. What if acknowledgement must be exactly-once?

- **Current Design:** ack at-least-once hai (SMS reply do baar aa sakti hai, webhook duplicate aa sakta hai), par **state machine idempotent** hai -- dobara ack karne se kuch nahi badalta.
- **New Problem:** "Exactly-once ack" ka matlab kya? Agar matlab "ack sirf ek baar record ho" -- toh humne already kar rakha hai (`status='triggered'` wala condition sirf ek baar match karta hai). Agar matlab "ack kabhi kho na jaaye aur kabhi galat na lage" -- toh asli risk **kho jaana** hai: responder ne SMS reply bheji, Twilio ka inbound webhook hum tak nahi pahuncha (hamara endpoint 5xx tha), aur escalation chal gaya -- **ek banda ack karke phir bhi escalate ho gaya.**
- **Change:**
  - Ack ki durability par focus: inbound webhook handler **pehle** ek `inbound_events` table mein raw payload likhe (with provider's message SID as unique key), phir process kare. 5xx dene se pehle likh lo -- phir Twilio ka retry duplicate banega, jo idempotent handling se safe hai.
  - **Provider retries ko enable rakho** -- Twilio inbound webhook fail par retry karta hai; hamara endpoint fast aur highly available hona chahiye (ye **paging path jitna critical** hai, aur log isko bhool jaate hain).
  - Ack ke saath escalation cancel ko **ek transaction** mein: `UPDATE incidents` + `UPDATE escalation_timers SET state='cancelled'` + timeline insert. `ZREM` transaction ke baad best-effort hai -- agar woh fail ho jaaye toh timer fire hoga, par escalation consumer incident ka status check karke no-op kar dega. **Ye do-layer defence hai: cancel karo, aur fire hone par bhi check karo.**
  - Har ack channel (app, web, SMS, voice DTMF, email link) ek hi `IncidentService.acknowledge()` se guzre -- alag paths par alag bugs banti hain.
- **Trade-off:** exactly-once "guarantee" bolna galat hoga -- hum **idempotent at-least-once** dete hain, jo practically wahi hai. Aur last-moment status check har notification par ek extra read hai (Redis se sasta, DB se mehenga) -- main Redis mein incident status cache karta hoon (chhota TTL) taaki ye check 1 ms mein ho.

### 10. What if we must support WhatsApp and Microsoft Teams?

- **Current Design:** `NotificationProvider` interface -- `{ name, channel, send(task, address, incident) }`; `Channel = 'push' | 'sms' | 'voice' | 'email' | 'slack'`; `contact_methods.channel` par CHECK constraint.
- **New Problem:** Do naye channels, dono ka **model alag hai**: WhatsApp business API mein session ke bahar sirf **pre-approved template messages** bhej sakte ho (aur templates approve hone mein din lagte hain), aur 24-hour session window ka rule hai. Teams ek **workspace-level integration** hai (bot/webhook), user-level phone number nahi -- matlab `contact_methods` ka model (per-user address) Teams ke liye poora fit nahi baithta, aur ack Teams ke Adaptive Card button se aayega.
- **Change:**
  - `Channel` type mein `'whatsapp' | 'teams'` add, `contact_methods` aur `notification_rules` ke CHECK constraints migrate.
  - **Do naye provider classes**, `provider-registry.ts` mein register. Interface nahi badalta -- yahi is design ka fayda hai (ye interview mein bolna: "adding a channel is a new class, not a refactor").
  - **WhatsApp-specific:** template management ek naya sub-system hai (template IDs, variables, approval status per language). `send()` ko template ID aur variables chahiye, plain text nahi. Session window ke bahar template bhejo, andar free-form.
  - **Teams-specific:** address = channel/webhook URL (per team, per service), user nahi. Isliye Teams ko main **escalation target ki tarah** treat karta hoon, `contact_method` ki tarah nahi -- policy level par "notify Teams channel #ops" wala target type. Ack Adaptive Card action se ek signed callback URL par aata hai.
  - **Ack support** dono mein: WhatsApp interactive button, Teams Adaptive Card -- dono usi `IncidentService.acknowledge()` par.
  - **Urgency mapping:** WhatsApp/Teams ko main push jaisa treat karta hoon (fast, sasta, par silent ho sakta hai) -- matlab **ye SMS/voice ko replace nahi karte**, escalation ladder waisi hi rehti hai.
- **Trade-off:** har naya channel ek naya failure mode, naya rate limit, naye compliance rules (WhatsApp opt-in mandatory hai) aur naya on-call bojh laata hai. Main product se poochhunga: "kitne customers ne maanga?" -- kyunki 6 channels maintain karna 4 se kaafi mehenga hai, aur reliability tab badhti hai jab channels **independent** hon (Teams aur Slack dono internet + SaaS par hain, toh dono ek saath fail ho sakte hain -- woh do channels nahi, ek hi hai).

### 11. What if we need a "maintenance window" where no pages go out?

- **Current Design:** har naya incident (dedup ke baad) turant escalation policy par jaata hai aur page hota hai.
- **New Problem:** Team ne planned deployment rakha hai 2 AM-4 AM. Us dauraan sab kuch alert karega (services restart hongi, health checks fail honge) aur poori team uth jaayegi -- **jo alert fatigue ka sabse bada source hai** aur log paging system hi band kar dete hain.
- **Change:**
  - Naya concept: **maintenance window** -- `maintenance_windows (id, account_id, scope_type ('service'|'account'), scope_id, starts_at, ends_at, created_by, reason)`.
  - Incident service mein routing se **pehle** check: is service par active window hai? Agar haan -> **incident phir bhi banao** (`status='triggered'`, timeline mein `suppressed_by_maintenance` entry with window ID) par **koi notification nahi**, aur **koi escalation timer nahi**.
  - **Window khatam hone par:** ek job un incidents ko dekhta hai jo window ke dauraan bane aur abhi tak `triggered` hain -> ab page karo (ek grouped page: "3 incidents occurred during maintenance and are still open"). Jo window ke andar auto-resolve ho gaye, unka koi page nahi -- **yahi asli fayda hai**.
  - **Guardrails:** window ki max length (e.g. 24 h) aur ek `critical` override option ("even during maintenance, page for severity=critical") -- kyunki asli outage maintenance ke dauraan bhi ho sakta hai.
  - Dashboard par window clearly dikhe, aur window ke andar aaye incidents alag badge ke saath.
- **Trade-off:** ye **jaanbujh ke pages suppress karna** hai -- matlab humne apne #1 rule ("missed page is not OK") mein ek exception banaya, aur isliye ye exception **loud** hona chahiye: kisne window banaya, kab, kyun, aur kitne incidents suppress hue -- sab audit mein. Sabse bada risk: window band karna bhool jaana. Isliye max duration aur auto-expiry compulsory hai, aur window ke khatam hone par reminder.

### 12. What if the customer wants to reorder escalation levels while an incident is live?

- **Current Design:** `escalation_rules (policy_id, level, ack_timeout_min, target_type, target_id)`; incident par `escalation_level` aur `escalation_round` columns; timer `due_at` current level ke `ack_timeout_min` se banta hai.
- **New Problem:** Incident live hai, level 2 par hai, timer 5 min baad due hai. Customer ne abhi policy edit karke level 2 ko hata diya aur level order badal diya. Ab woh timer fire hoga -- **kis level par?** Agar hum fire hone ke time policy dobara padhein, toh incident ka "level 2" ab kisi aur banda ko point karta hai, aur timeline mein likha "escalated to level 2" ab jhoot ban jaata hai. Ulta, agar hum purani policy pakde rahein, toh customer ka fix (jo shayad isliye kiya kyunki galat banda page ho raha tha) lagu hi nahi hoga.
- **Change -- main policy ko versioned karta hoon:**
  - `escalation_policies` par `version` column; edit = **naya version row**, purana immutable. `incidents` par `policy_version` column jo incident banne ke waqt pin ho jaata hai.
  - **Default behaviour:** live incident apne pinned version par chalta hai. Ye predictable hai aur timeline sach bolta hai.
  - **Opt-in "apply now":** UI par ek explicit button -- "apply updated policy to N open incidents". Dabane par: pending timers cancel, incident ka `policy_version` update, `escalation_level` ko naye policy mein **re-map** (agar current target naye policy mein hai toh usi level par, warna level 1 se), naya timer, aur timeline mein `policy_changed` entry with both version IDs.
  - **Round/level ko target se anchor karo, number se nahi** jahan possible -- kyunki "level 2" ek number hai par asli matlab "Priya ki team" hai.
- **Trade-off:** versioning se schema aur UI dono bhaari hote hain, aur "apply now" ek aur race banata hai (timer fire ho raha ho aur usi waqt policy apply ho). Main "apply now" ko ek transaction mein karta hoon (cancel + update + new timer) aur escalation consumer mein `policy_version` mismatch par no-op karta hoon -- **wahi do-layer defence: cancel karo, aur fire hone par bhi verify karo.** Simpler alternative (jo chhote product ke liye theek hai): live incidents par policy change lagu hi mat karo, aur UI par saaf likh do.

### 13. What if we must prove in an audit exactly who was paged and when?

- **Current Design:** `incident_events` (immutable timeline: `triggered`, `notified`, `escalated`, `acknowledged`, `resolved`, `note` with `actor` aur `detail` JSONB), `notifications` (per task: channel, user, provider, `provider_message_id`, `delivered_at`), `notification_attempts` (per attempt: result, error, latency).
- **New Problem:** Audit (SOC2, ya ek legal dispute -- "hamara system 40 min down tha aur tumhara paging ne kisi ko nahi bulaya") mein humein **prove** karna hai: event kab aaya, kis policy se kaun chuna gaya, kis channel par kab bheja gaya, provider ne kya kaha, aur kisne kab ack kiya. Aur prove karna hai ki ye records **badle nahi gaye**.
- **Change:**
  - **Timeline ko sach mein immutable banao:** `incident_events` par sirf INSERT -- app user ko `UPDATE`/`DELETE` ka grant hi mat do (`REVOKE UPDATE, DELETE ON incident_events`). Ye application discipline se zyada strong hai.
  - **Har decision ka input record karo, sirf output nahi:** `notified` entry ke `detail` mein `policyId`, `policyVersion`, `level`, `scheduleId`, `resolvedAt` (kis instant par on-call resolve kiya), `userId`, `channel`, `contactMethodId` (address nahi -- PII). Kyunki 6 mahine baad schedule badal chuka hoga aur "us waqt kaun on-call tha" sirf tabhi prove hoga jab humne us waqt ka **resolved result** likha ho, rotation formula nahi.
  - **Provider evidence:** `provider_message_id` + delivery webhook ka `delivered_at` + raw webhook payload ka archive (S3). Twilio ke apne logs ek independent third-party record hain -- audit mein ye sabse strong evidence hota hai.
  - **Clock discipline:** sab timestamps `TIMESTAMPTZ` UTC, NTP-synced hosts, aur provider ka timestamp alag column mein (hamara aur unka time thoda alag hoga -- dono rakho).
  - **Retention:** audit ke liye timeline 90 din se zyada chahiye -> S3 + Parquet archive, aur **tamper-evidence** ke liye daily hash chain (har din ke records ka hash, jo agle din ke record mein jaata hai) ya WORM/object-lock bucket.
  - **Access logs:** kaunse admin ne kaunsa incident dekha/badla -- ye bhi audit ka hissa hai.
- **Trade-off:** storage badhta hai (`notification_attempts` 7.5M/day x attempts), aur PII retention aur GDPR "right to erasure" ke beech tension hai -- isliye timeline mein sirf IDs rakhta hoon, PII `contact_methods` mein (jo delete ho sakta hai) taaki user delete hone par audit trail structurally intact rahe. Aur immutability ka matlab hai ki galat entry ko **fix nahi kar sakte** -- sirf ek correcting entry add kar sakte hain, accounting ledger ki tarah.
