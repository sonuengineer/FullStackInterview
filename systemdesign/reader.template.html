<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__BOOK_TITLE__ -- Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfbf8; --fg: #1d1d1b; --muted: #6b6b66; --border: #e2e0da;
    --code-bg: #f2f1ec; --accent: #9a5b13; --callout: #f6efe1; --bar: rgba(251,251,248,0.94);
    --font-size: 19px; --measure: 40em;
    --read-font: "Literata", Georgia, "Times New Roman", serif;
  }
  :root[data-theme="sepia"] {
    --bg: #f4ecd8; --fg: #3b2f22; --muted: #7a6a55; --border: #dccfb3;
    --code-bg: #ebe0c7; --accent: #8a4b12; --callout: #eadcbc; --bar: rgba(244,236,216,0.94);
  }
  :root[data-theme="dark"] {
    --bg: #15161a; --fg: #d9d6cf; --muted: #8d8a83; --border: #2c2d33;
    --code-bg: #1e2026; --accent: #e0a458; --callout: #262219; --bar: rgba(21,22,26,0.94);
  }
  :root[data-font="sans"] { --read-font: "Inter", -apple-system, "Segoe UI", Arial, sans-serif; }
  :root[data-width="wide"] { --measure: 56em; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: var(--read-font); font-size: var(--font-size); line-height: 1.7; transition: background .2s, color .2s; }

  /* top bar */
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; gap: 8px;
            padding: 0 12px; background: var(--bar); border-bottom: 1px solid var(--border); z-index: 20;
            font-family: "Inter", -apple-system, "Segoe UI", sans-serif; font-size: 14px; backdrop-filter: blur(6px); }
  .topbar .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); text-align: center; }
  .topbar .title b { color: var(--fg); font-weight: 600; }
  .btn { background: none; border: 1px solid transparent; color: var(--fg); font: inherit; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: var(--border); }
  .btn:disabled { opacity: .35; cursor: default; }

  /* progress */
  .progress { position: fixed; top: 48px; left: 0; height: 3px; background: var(--accent); width: 0; z-index: 21; transition: width .1s; }

  /* content */
  main { max-width: var(--measure); margin: 0 auto; padding: 84px 22px 120px; }
  main h1 { font-size: 1.75em; line-height: 1.25; margin: 0.2em 0 0.8em; }
  main h2 { font-size: 1.35em; line-height: 1.3; margin: 2.2em 0 0.6em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  main h3 { font-size: 1.1em; margin: 1.8em 0 0.5em; color: var(--accent); }
  main h4 { font-size: 1em; margin: 1.4em 0 0.4em; }
  main p { margin: 0.8em 0; }
  main a { color: var(--accent); }
  main hr { border: none; border-top: 1px solid var(--border); margin: 2.4em 0; }
  main ul, main ol { padding-left: 1.3em; }
  main li { margin: 0.3em 0; }
  main blockquote { margin: 1.2em 0; padding: 0.5em 1em; background: var(--callout); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; }
  main code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 0.8em; background: var(--code-bg); padding: 2px 5px; border-radius: 4px; }
  main pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; line-height: 1.5; }
  main pre code { background: none; padding: 0; font-size: 0.74em; }
  .table-wrap { overflow-x: auto; margin: 1.2em 0; }
  main table { border-collapse: collapse; width: 100%; font-size: 0.86em; line-height: 1.5; }
  main th, main td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
  main th { background: var(--code-bg); }
  .mermaid { background: #fff; border-radius: 8px; padding: 12px; margin: 1.2em 0; overflow-x: auto; text-align: center; }

  .chapter-end { margin-top: 3em; padding-top: 1.5em; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px;
                 font-family: "Inter", -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
  .chapter-end button { flex: 1; text-align: left; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: none; color: var(--fg); cursor: pointer; font: inherit; }
  .chapter-end button.next { text-align: right; }
  .chapter-end button small { display: block; color: var(--muted); font-size: 12px; }
  .chapter-end button:hover { border-color: var(--accent); }

  /* bottom bar */
  .bottombar { position: fixed; bottom: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; justify-content: space-between;
               padding: 0 14px; background: var(--bar); border-top: 1px solid var(--border); z-index: 20; color: var(--muted);
               font-family: "Inter", -apple-system, "Segoe UI", sans-serif; font-size: 13px; }

  /* drawers */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(360px, 88vw); background: var(--bg); border-right: 1px solid var(--border);
            transform: translateX(-100%); transition: transform .22s; z-index: 31; overflow-y: auto; padding: 16px 0 40px;
            font-family: "Inter", -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
  .drawer.open { transform: none; }
  .drawer h3 { margin: 4px 18px 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .toc-part { border-top: 1px solid var(--border); }
  .toc-part > button { width: 100%; text-align: left; background: none; border: none; color: var(--fg); font: inherit; font-weight: 600; padding: 12px 18px; cursor: pointer; }
  .toc-part > button small { display: block; font-weight: 400; color: var(--muted); }
  .toc-part.current > button { color: var(--accent); }
  .toc-part ul { list-style: none; margin: 0; padding: 0 0 8px; }
  .toc-part li a { display: block; padding: 5px 18px 5px 30px; color: var(--muted); text-decoration: none; }
  .toc-part li a:hover { color: var(--fg); }

  .settings { position: fixed; top: 54px; right: 12px; width: 280px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
              box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 14px; z-index: 31; display: none;
              font-family: "Inter", -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
  .settings.open { display: block; }
  .settings .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: none; color: var(--fg); padding: 6px 10px; cursor: pointer; font: inherit; }
  .seg button.on { background: var(--accent); color: var(--bg); }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; }
  .swatch.on { border-color: var(--accent); }

  @media (max-width: 600px) {
    :root { --font-size: 17px; }
    main { padding: 70px 16px 100px; }
    .topbar .title span.chap { display: none; }
  }
  @media print {
    .topbar, .bottombar, .progress, .drawer, .scrim, .settings, .chapter-end { display: none !important; }
    main { padding: 0; max-width: none; }
  }
</style>
</head>
<body>
<div class="topbar">
  <button class="btn" id="tocBtn" title="Contents (T)">&#9776; Contents</button>
  <div class="title"><b>__BOOK_TITLE__</b><span class="chap" id="chapTitle"></span></div>
  <button class="btn" id="setBtn" title="Display settings">Aa</button>
</div>
<div class="progress" id="progress"></div>

<main id="content">Loading...</main>

<div class="bottombar">
  <button class="btn" id="prevBtn">&lsaquo; Prev</button>
  <span id="status"></span>
  <button class="btn" id="nextBtn">Next &rsaquo;</button>
</div>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer"><h3>__BOOK_TITLE__</h3><div id="toc"></div></nav>

<div class="settings" id="settings">
  <div class="row"><span>Text size</span>
    <div class="seg"><button id="fontDown">A-</button><button id="fontUp">A+</button></div></div>
  <div class="row"><span>Theme</span>
    <div style="display:flex;gap:8px">
      <div class="swatch" data-theme="light" style="background:#fbfbf8" title="Light"></div>
      <div class="swatch" data-theme="sepia" style="background:#f4ecd8" title="Sepia"></div>
      <div class="swatch" data-theme="dark" style="background:#15161a" title="Dark"></div>
    </div></div>
  <div class="row"><span>Font</span>
    <div class="seg" id="fontSeg"><button data-font="serif">Serif</button><button data-font="sans">Sans</button></div></div>
  <div class="row"><span>Width</span>
    <div class="seg" id="widthSeg"><button data-width="narrow">Narrow</button><button data-width="wide">Wide</button></div></div>
  <div class="row" style="color:var(--muted)">Keys: arrows / space = page, T = contents</div>
</div>

<script type="application/json" id="book-data">/*__BOOK_DATA__*/</script>
<script>
(function () {
  const book = JSON.parse(document.getElementById('book-data').textContent);
  const parts = book.parts;
  const KEY = 'reader:' + book.title;
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;

  // ---- storage (optional; page works without it) ----
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(patch) { try { localStorage.setItem(KEY, JSON.stringify(Object.assign(load(), patch))); } catch (e) {} }
  const saved = load();

  // ---- settings ----
  let fontSize = saved.fontSize || (window.innerWidth <= 600 ? 17 : 19);
  function applySettings() {
    root.style.setProperty('--font-size', fontSize + 'px');
    root.dataset.theme = saved.theme || 'light';
    root.dataset.font = saved.font || 'serif';
    root.dataset.width = saved.width || 'narrow';
    document.querySelectorAll('.swatch').forEach((s) => s.classList.toggle('on', s.dataset.theme === root.dataset.theme));
    document.querySelectorAll('#fontSeg button').forEach((b) => b.classList.toggle('on', b.dataset.font === root.dataset.font));
    document.querySelectorAll('#widthSeg button').forEach((b) => b.classList.toggle('on', b.dataset.width === root.dataset.width));
  }
  $('fontUp').onclick = () => { fontSize = Math.min(28, fontSize + 1); save({ fontSize }); applySettings(); };
  $('fontDown').onclick = () => { fontSize = Math.max(13, fontSize - 1); save({ fontSize }); applySettings(); };
  document.querySelectorAll('.swatch').forEach((s) => s.onclick = () => { saved.theme = s.dataset.theme; save({ theme: saved.theme }); applySettings(); });
  document.querySelectorAll('#fontSeg button').forEach((b) => b.onclick = () => { saved.font = b.dataset.font; save({ font: saved.font }); applySettings(); });
  document.querySelectorAll('#widthSeg button').forEach((b) => b.onclick = () => { saved.width = b.dataset.width; save({ width: saved.width }); applySettings(); });
  applySettings();

  // ---- markdown rendering ----
  mermaid.initialize({ startOnLoad: false, theme: 'default' });
  const renderer = new marked.Renderer();
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  renderer.code = (code, lang) => lang === 'mermaid'
    ? '<div class="mermaid">' + esc(code) + '</div>'
    : '<pre><code>' + esc(code) + '</code></pre>';
  renderer.table = (header, body) => '<div class="table-wrap"><table><thead>' + header + '</thead><tbody>' + body + '</tbody></table></div>';
  const slug = (s, i) => 'p' + i + '-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);

  // pre-compute headings for the contents drawer
  parts.forEach((p, i) => {
    p.headings = [];
    p.md.split('\n').forEach((line) => {
      const m = /^## (.+)$/.exec(line);
      if (m) p.headings.push({ text: m[1].replace(/[*`]/g, ''), id: slug(m[1].replace(/[*`]/g, ''), i) });
    });
  });

  // ---- contents drawer ----
  function buildToc() {
    $('toc').innerHTML = parts.map((p, i) =>
      '<div class="toc-part' + (i === current ? ' current' : '') + '"><button data-part="' + i + '">Part ' + (i + 1) +
      '<small>' + p.label + '</small></button><ul>' +
      p.headings.map((h) => '<li><a href="#" data-part="' + i + '" data-id="' + h.id + '">' + h.text + '</a></li>').join('') +
      '</ul></div>').join('');
    $('toc').querySelectorAll('[data-part]').forEach((el) => el.onclick = (e) => {
      e.preventDefault();
      closeAll();
      show(+el.dataset.part, el.dataset.id || null);
    });
  }
  function closeAll() { $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); $('settings').classList.remove('open'); }
  $('tocBtn').onclick = () => { buildToc(); $('drawer').classList.add('open'); $('scrim').classList.add('open'); };
  $('setBtn').onclick = (e) => { e.stopPropagation(); $('settings').classList.toggle('open'); };
  $('scrim').onclick = closeAll;
  $('settings').onclick = (e) => e.stopPropagation();
  document.addEventListener('click', () => $('settings').classList.remove('open'));

  // ---- chapters ----
  let current = -1;
  function show(i, anchorId, scrollRatio) {
    if (i < 0 || i >= parts.length) return;
    if (i !== current) {
      current = i;
      const html = marked.parse(parts[i].md, { renderer });
      const next = parts[i + 1], prev = parts[i - 1];
      $('content').innerHTML = html +
        '<div class="chapter-end">' +
        (prev ? '<button class="prev" data-go="' + (i - 1) + '"><small>Previous</small>Part ' + i + ': ' + prev.label + '</button>' : '<span></span>') +
        (next ? '<button class="next" data-go="' + (i + 1) + '"><small>Next</small>Part ' + (i + 2) + ': ' + next.label + '</button>' : '<span></span>') +
        '</div>';
      $('content').querySelectorAll('h2').forEach((h) => { h.id = slug(h.textContent, i); });
      $('content').querySelectorAll('[data-go]').forEach((b) => b.onclick = () => show(+b.dataset.go));
      mermaid.run({ nodes: $('content').querySelectorAll('.mermaid') }).catch(() => {});
      $('chapTitle').textContent = ' -- Part ' + (i + 1) + ': ' + parts[i].label;
      $('prevBtn').disabled = i === 0;
      $('nextBtn').disabled = i === parts.length - 1;
      document.title = 'Part ' + (i + 1) + ': ' + parts[i].label + ' -- ' + book.title;
    }
    requestAnimationFrame(() => {
      if (anchorId && $(anchorId)) $(anchorId).scrollIntoView();
      else window.scrollTo(0, scrollRatio ? scrollRatio * maxScroll() : 0);
      onScroll();
    });
  }
  $('prevBtn').onclick = () => show(current - 1);
  $('nextBtn').onclick = () => show(current + 1);

  // ---- progress + remembered position ----
  const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  let saveTimer = null;
  function onScroll() {
    const ratio = Math.min(1, window.scrollY / maxScroll());
    $('progress').style.width = (ratio * 100).toFixed(1) + '%';
    const overall = ((current + ratio) / parts.length) * 100;
    $('status').textContent = 'Part ' + (current + 1) + ' of ' + parts.length + '  |  ' + Math.round(ratio * 100) + '% of part  |  ' + Math.round(overall) + '% of book';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => save({ part: current, ratio }), 300);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);

  // ---- page turning (keys + side taps) ----
  const atBottom = () => window.scrollY >= maxScroll() - 4;
  const atTop = () => window.scrollY <= 4;
  function pageDown() { if (atBottom()) { if (current < parts.length - 1) show(current + 1); } else window.scrollBy({ top: window.innerHeight - 110, behavior: 'smooth' }); }
  function pageUp() { if (atTop()) { if (current > 0) show(current - 1, null, 1); } else window.scrollBy({ top: -(window.innerHeight - 110), behavior: 'smooth' }); }
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); pageDown(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); pageUp(); }
    else if (e.key === 't' || e.key === 'T') { $('tocBtn').click(); }
    else if (e.key === 'Escape') closeAll();
  });
  $('content').addEventListener('click', (e) => {
    if (e.target.closest('a, button, pre, table, .mermaid, code')) return;
    if (String(window.getSelection())) return;
    const x = e.clientX / window.innerWidth;
    if (x > 0.8) pageDown(); else if (x < 0.2) pageUp();
  });

  // ---- start where the reader left off ----
  const startPart = Number.isInteger(saved.part) && saved.part < parts.length ? saved.part : 0;
  show(startPart, null, saved.ratio || 0);
})();
</script>
</body>
</html>
