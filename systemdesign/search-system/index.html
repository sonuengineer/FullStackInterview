 = 5 -> 3   bade clusters (50+ nodes)\n```\n\n**Kyun (n/2)+1?** Partition ho gaya: `A | B,C`. Agar dono side apna master chun lein toh **split brain** -- do cluster states, ek hi shard par dono taraf writes, permanent divergence. Quorum rokta hai: A akela hai (1 \u003c 2), master nahi chun sakta, **read-only** ho jaata hai. B,C ke paas 2 hain -> chalte rehte hain. **Majority hi jeet sakta hai, isliye do masters ban hi nahi sakte.**\n\n> **Even number master-eligible nodes kabhi mat rakho.** 4 ka quorum bhi 3 hai -- extra HA nahi, sirf extra bill.\n\n#### Lever 5: Routing (`_routing`) -- ek query, ek shard\n\n**Default:** `shard = hash(_id) % 6`, query **saari 6 shards** par. **`_routing` ke saath** tum batate ho doc kahan jaaye:\n\n```json\nPUT /products_v3/_doc/p_123?routing=seller_8891\n{ \"productId\": \"p_123\", \"sellerId\": \"seller_8891\", \"title\": \"...\" }\n```\n\n```json\nGET /products/_search?routing=seller_8891\n{ \"query\": { \"bool\": { \"filter\": [{ \"term\": { \"sellerId\": \"seller_8891\" }}] } } }\n```\n\nAb query **1 shard** par -> 6x kam kaam per query -> cluster ki QPS capacity ~6x.\n\n**Kab helpful:** jab query **hamesha** ek tenant ke andar ho.\n\n- [OK] **Multi-tenant marketplace ka seller dashboard** -- \"mere 4,000 products mein 'blue shirt' dhoondo\". 20,000 sellers, har koi sirf apna data. Perfect fit.\n- [X] **Buyer search** -- \"iphone case\" 20,000 sellers mein dhoondhna hai. Routing lag hi nahi sakta.\n\n**Hot shard ka risk:** `hash(routingValue) % 6`. Ek mega seller ke 4M products ek hi shard par baith jaayenge:\n\n```\nshard 0: 22 GB  shard 1: 22 GB  shard 2: 22 GB\nshard 3: 22 GB  shard 4: 22 GB  shard 5: 68 GB  \u003c-- mega seller\n```\n\nUs node par disk, heap, latency, merges -- sab kharab. Aur **fix mushkil** hai: rebalance se kuch nahi hoga, data ek hi shard ka hai. **Mitigation:** bade tenants ke liye `routing_partition_size` (tenant ka data N shards mein bikhre, query N par jaaye, 6 par nahi), ya mega-sellers ko alag index.\n\n> **Rule:** routing tab lagao jab tenants **chhote aur ek jaise** hon. Ek whale tenant poori strategy ko zeher bana deta hai.\n\n#### Lever 6: Coordinating-only nodes\n\n```\nQUERY phase: coordinating -> saari shards \"top 24 ids + scores do\" -> har shard local top 24\nFETCH phase: coordinating 144 hits merge -> global top 24 -> un docs ka _source maango -> response\n```\n\n**Coordinating node** wahi hai jisne request receive ki -- by default koi bhi data node. Uska kaam CPU + heap khata hai: merge, sort, **aggregations ka final reduce** (facet counts!), JSON serialization.\n\n**Problem:** 1,000 QPS x 3 facet aggs ka reduce usi node par ho raha hai jo Lucene search bhi chala raha hai. Ek bhaari reduce us node ka heap kha jaata hai -> GC pause -> us node ki saari shards slow -> p99 spike.\n\n**Fix:** 2-3 **coordinating-only nodes** (`node.roles: []`). Data nodes sirf Lucene search karein, merge alag machine par. **Blast radius** kam. Ye ek ES-aware smart load balancer hai.\n\n**Kab NAHI:** 100x par (6 data nodes, 1,000 QPS) abhi zarurat nahi -- ye **1000x ka lever** hai. Jaldi lagana = 2 extra nodes ka bill bina fayde ke.\n\n#### Lever 7: Caching ki paratein -- 30% head queries\n\nCheapest query woh hai jo **chali hi nahi**.\n\n| Tier | Kahan | Kya | TTL | Hit |\n|---|---|---|---|---|\n| **1. Redis query cache** | Hamara code | `q:\u003csha1(normQuery+filters+sort+page)>` -> poora `SearchResponse` | 60 s | **~30%** |\n| **2. Redis prefix cache** | Hamara code | `sug:\u003cprefix>` -> top 10 suggestions | 600 s | **~60-70%** |\n| **3. ES node query cache** | ES (auto) | `filter` context ke **bitsets** (`brand:Apple`, `inStock:true`) | LRU, heap ka 10% | -- |\n| **4. ES shard request cache** | ES | `size: 0` wali pure-aggregation requests ka result | refresh tak | -- |\n\n```\n1,000 QPS peak - 30% Redis hit (~2 ms) = 700 QPS ES tak\n```\n\nYaani cache ne cluster ka ~30% kaam bachaya -- lagbhag **2 data nodes ka bill**. Cache \"nice to have\" nahi, **capacity plan ka hissa** hai.\n\n**Tier 3 kyun kaam karta hai (Part 3 ka rule):** `filter` score nahi banata, isliye ES uska result **bitset** (har doc ke liye 1 bit) mein cache kar sakta hai. `brand: Apple` ka bitset ek baar bana, har `iphone case + Apple` query usko reuse karti hai. **Isiliye** rule tha: jo score mein contribute nahi karti, usse `filter` mein daalo. Woh theory nahi thi -- woh ek cache hit hai.\n\n**Honest limit:** **personalization cache ko maar deti hai** (cache key mein userId -> hit ~0%). Isiliye spec mein personalization v1 mein nahi. Cache sirf **page 1** ka. Aur TTL 60 s = price change cached queries par 60 s late dikh sakta hai (PART 18).\n\n#### Lever 8: Autocomplete ko alag karo -- 100x ka sabse bada decision\n\n```\nSearch:       20M/day ->  231 QPS avg,  ~1,000 QPS peak\nAutocomplete: 80M/day ->  925 QPS avg,  ~4,000 QPS peak    \u003c-- 4x zyada\n```\n\n**Ek hi index par chalein toh?** Har suggest request 6 shards jagati hai -- 4,000 x 6 = **24,000 shard ops/sec** sirf autocomplete ke liye. Autocomplete ka p99 budget **100 ms** hai, search ka 400 ms -- dono ek hi thread pool mein compete karenge, aur autocomplete apne volume se search ko bhookha maar dega.\n\n| | `products_v3` | `suggestions_v2` |\n|---|---|---|\n| Docs | 50M products | ~2-5M (popular queries + titles + categories) |\n| Size | ~130 GB | **~2-4 GB** -- OS page cache mein poora fit |\n| Fields | 15+, `_source` stored | `text`, `type`, `weight` -- bas |\n| Query | `multi_match` + fuzzy + aggs + `function_score` | `match` on edge n-gram, sort by weight |\n| Shards | 6 | **1-2** |\n| Budget | p95 200 ms | **p99 100 ms** |\n\nUske aage **Redis `sug:\u003cprefix>`** (top ~10K prefixes, TTL 600 s) -- 4,000 QPS ka bada hissa ES tak pahunchta hi nahi.\n\n**1000x par next step:** `suggestions` apne **alag cluster** par. Kyun? Failure domains alag: **suggest cluster gire toh search chalti rahe** -- UI bas suggestions band kar de, user phir bhi Enter dabake search kar sakta hai. Ye degradation user ko mushkil se dikhega.\n\n> Interview line: \"Sabse counter-intuitive number: autocomplete search se 4x zyada traffic laata hai -- 80M vs 20M/day. Isliye main use kabhi main index par nahi chalata. Ek chhota `suggestions_v2` jo RAM mein fit ho, uske aage Redis prefix cache, aur 1000x par poora alag cluster taaki uska failure search ko na le doobe.\"\n\n#### Sale-day playbook (20x = ~4,600 QPS)\n\nSale **predictable** hai -- date pata hai. Ye reactive nahi, **pre-planned checklist** hai. T = sale start.\n\n| Kab | Kya | Kyun |\n|---|---|---|\n| **T-7 din** | `number_of_replicas: 1 -> 2` + extra data nodes | Replica = QPS capacity. Shards **nahi** badha sakte (immutable) -- isliye ye pehle se socha hona chahiye |\n| **T-2 din** | `_reindex` / mapping migrations **freeze** | Merge + IO kha jaata hai; sale ke beech alias swap = risk without upside |\n| **T-1 din** | Popularity job, synonym updates, analyzer reload -- sab ab | Analyzer change = reindex (spec ka rule). Sale mein bilkul nahi |\n| **T-2 ghante** | **Cache pre-warm:** top 5,000 queries background script se hit karo | Cold cache + 4,600 QPS = sab ek saath ES par. Warm cache = pehle minute se 30% saved |\n| **T-2 ghante** | `refresh_interval: 1s -> 30s` | Refresh = naya Lucene segment. 500 updates/sec par 1s = segment churn + merge storm. Keemat: naya product 30-60 s mein dikhega -- sale par acceptable |\n| **T-1 ghanta** | Non-critical Kafka consumers **pause** (re-embedding, image jobs, analytics backfill) | Bulk indexing aur search CPU ke liye ladte hain |\n| **T-1 ghanta** | API autoscale min instances badhao; ES `requestTimeout` **mat** badhao | Timeout badhana = slow queries ko jam hone dena. Fast fail better |\n| **T-0** | **Degradation switches ready** (neeche ladder), `size` cap 24, `page` cap 20 | Facets query cost ka 20-40% hain -- search bachane ke liye **facets sabse pehle giro** |\n| **T+** | Watch: heap %, search p99, `indexer_lag_seconds`, cache hit ratio | Chaar number, ek screen |\n| **T+2 din** | `refresh_interval` wapas 1s, replicas wapas 1, jobs resume, scale down | Bhoolna = mehenga bill + stale search |\n\n**Degrade ladder sale par (sabse pehle kya chhodo):**\n\n```\n1. Facet counts off        -> ES cost -20-40%, filter counts nahi dikhte\n2. Fuzziness off           -> ES cost -10-20%, typo tolerance jaata hai\n3. track_total_hits: false -> \"10,000+\" bhi nahi\n4. Page cap 20 -> 5        -> deep pagination band\n5. Cache TTL 60s -> 300s   -> thoda purana result chalega\n6. Postgres degraded top-20 (PART 17)\n```\n\n**Sabse pehle kya toota (100x):**\n\n| Kya | Symptom | Fix |\n|---|---|---|\n| Facet aggregations | p99 400 ms cross | Facet `size: 10` cap, sale par off |\n| JVM heap | heap > 80%, GC pauses | Heap **31 GB se upar kabhi nahi**; agg cardinality kam |\n| Coordinating load | Ek data node ka CPU double | Coordinating-only nodes |\n| Deep pagination | Page 500 par `max_result_window` error / OOM | `page \u003c= 50` + `search_after` |\n| Autocomplete | Suggest p99 300 ms, search bhi slow | Alag `suggestions_v2` + Redis prefix cache |\n\n> Interview line: \"100x par 130 GB 6 shards par baithta hai, aur 1,000 QPS peak Redis ke 30% head-query cache ke baad ~700 QPS ban jaata hai. QPS badhaana ho toh replicas, data badhe toh shards -- aur shard count immutable hai isliye woh din 1 ka decision hai.\"\n\n---\n\n### 1000x -- 500M products, 10,000+ QPS peak\n\n| Bottleneck | Kyun | Kya karunga |\n|---|---|---|\n| **Index size** | 500M x 2 KB x 1.3 = **~1.3 TB** | 1.3 TB / 35 = **~40 primary shards**, ~25 data nodes |\n| **Query fan-out** | Ek query ab **40 shards** par -> coordination + tail amplification | **Index partitioning:** `products_electronics`, `products_fashion`... alias `products` ke peeche. User aksar category ke andar hai -> query 6 shards par, 40 nahi |\n| **Coordinating load** | Merge + agg reduce data nodes ko maar rahe hain | **4-6 coordinating-only nodes**, LB unhi ko hit kare |\n| **QPS** | 10,000 peak, cache ke baad ~7,000 ES par | Replicas 2-3 + zyada data nodes. Linear, bas mehenga |\n| **Autocomplete** | 40,000 QPS peak | **Alag cluster** + Redis cluster prefix cache |\n| **Indexing** | 50M updates/day, flash sale 5,000/sec | Kafka partitions 12 -> 48; `refresh_interval: 5s` default (1s ka cost 40 shards par bahut) |\n| **Global users** | Ek region = 150-250 ms cross-region | **Multi-region read clusters**, Kafka se feed |\n| **Cost** | ~25 data nodes x 64 GB + replicas | Frozen tier (searchable snapshot S3) discontinued products ke liye; `best_compression`; `description` ko `index: false` karke DB se serve |\n| **Relevance** | 500M docs par BM25 akela kaafi nahi | **LTR** (BM25 se top 500 -> ML re-rank) + **vector/kNN hybrid** -- spec ne inhe v3 kaha tha, yahan aate hain |\n\n```\n              Postgres primary (single writer, source of truth)\n                        | outbox -> Kafka (multi-region replicated)\n          /                       |                       \\\n    IN indexer              US indexer              EU indexer\n    ES cluster IN           ES cluster US           ES cluster EU\n    IN users                US users                EU users\n```\n\nHar region **read-only** search apne local cluster se -> latency ~50 ms. Writes ek jagah, isliye \"do jagah alag price\" wala problem nahi. Trade-off: **indexing lag per region** alag hai; ek region ka indexer atka toh sirf wahan purana data -- aur ye debug karna mushkil hai (\"mujhe dikh raha hai, aapko nahi\"). `indexer_lag_seconds{region}` label mandatory ho jaata hai.\n\n**Sabse pehle kya toota (1000x):**\n\n| Kya | Symptom | Fix |\n|---|---|---|\n| Query fan-out | p99 800 ms, par har shard ka apna time 40 ms | Category-wise index partitioning |\n| Cluster state | 3,200 shards; master slow, allocation minutes leti hai | Shard discipline, ILM, `_shrink` purane indices |\n| Cost | Bill 3x expected | Frozen tier, compression, bade fields hatao |\n| Relevance | Zero-result wapas 8% (long tail) | Hybrid: BM25 + vector kNN, RRF se merge |\n\n> Interview line: \"1000x par ek query ka 40-shard fan-out hi bottleneck ban jaata hai -- shards badhana ab **madad nahi, nuksaan** karta hai. Isliye index ko category-wise partition karta hoon aliases ke peeche, coordinating-only tier lagata hoon, autocomplete alag cluster par, aur multi-region read clusters Kafka se feed karta hoon.\"\n\n### Har scaling tool -- kab, kab nahi\n\n| Tool | Kab | Kab NAHI |\n|---|---|---|\n| **Postgres FTS (`tsvector` + GIN)** | 1x, aur 100x par **fallback path** ke roop mein hamesha | Jab facets / tuning / 5M+ docs chahiye |\n| **Elasticsearch** | 10x se | 100K products wali site |\n| **More replicas** | QPS badhe (sale day) | Data badhne par |\n| **More shards** | Data badhe / shard 40 GB cross kare | QPS ke liye -- over-sharding latency badhata hai |\n| **3 dedicated masters** | 100x se (6+ data nodes) | 3-node dev cluster |\n| **Coordinating-only nodes** | 1000x, ya bhaari aggregations par | 100x par -- overkill |\n| **Routing (`_routing`)** | Seller dashboard (per-tenant) | Buyer search; ya jab whale tenant ho |\n| **Hot/warm/cold + ILM** | Query-log indices | `products` index |\n| **Redis query cache** | 100x se (30% bachata hai) | Jab personalization on ho |\n| **Alag `suggestions` index** | 100x se (4x traffic) | 10x par (`title.ac` kaafi) |\n| **Alag suggest cluster** | 1000x | Pehle |\n| **Multi-region clusters** | 1000x / global users | Ek desh ka marketplace |\n| **LTR / vector search** | 1000x, ya zero-result plateau par | v1/v2 -- pehle synonyms aur BM25 nichodo |\n\n---\n\n## PART 17 -- Failure Scenarios (interviewer style)\n\nFormat: **Problem -> Impact -> Solution**, aur har ek mein **user ko kya dikhta hai**.\n\n> **Rate Limiter mein hum poochte the \"fail open ya fail closed?\" -- yahan woh sawaal galat hai. Search ka jawab hai: DEGRADE, DON'T DIE.** Poora search nahi de sakte toh aadha do; aadha nahi toh stale do; woh bhi nahi toh 503 -- **usi order mein**.\n\n```\nFailure                     Search chalti hai?  User ko kya dikhta hai\nES cluster YELLOW           Haan (normal)       Kuch nahi\nES cluster RED              Partial             ~1/6 results gayab, CHUPCHAAP\nEk data node mara           Haan                Kuch nahi (replica promote)\nPoora ES cluster gaya       Degraded            Top 20, no facets, banner\nJVM heap / GC               Slow                p99 spike, lamba \"loading...\"\nEk slow shard               Partial / slow      Kam results ya slow page\nIndexer peeche (Kafka lag)  Haan                Purana price / stock\nOutbox poller atka          Haan                Naya product dikhta hi nahi\nBad mapping deploy          Haan                Naye/edited products missing\nReindex ne disk bhari       Read-only           Naya kuch index nahi hota\nBad synonym / analyzer      Haan                Bakwaas results (sabse khatarnak)\nScraper hammering           Slow sabke liye     429 usko, latency sabko\nQuery of death              Ek node struggle    Us node ki saari queries slow\nMaster election issue       Partial             Cluster changes ruk jaate hain\n```\n\n### 1. \"Cluster YELLOW ho gaya -- panic karun?\"\n\n- **Problem:** `\"status\": \"yellow\"` -- **saari primaries assigned hain, kam se kam ek replica unassigned hai.**\n- **Impact:** **Data loss zero, search poori tarah kaam kar rahi hai. User ko kuch nahi dikhta.** Do risks: (a) ab us shard ki ek hi copy -- woh node bhi gaya toh **RED**; (b) us shard ka read throughput aadha.\n- **Common causes:** ek data node abhi restart hua; naya index `replicas: 1` ke saath par cluster mein ek hi node (ES ek shard aur uski replica **kabhi** ek node par nahi rakhta); disk **high watermark (90%)** cross -> allocation band.\n- **Solution:** `GET /_cluster/allocation/explain` -- ye API **seedha batati hai** shard allocate kyun nahi ho rahi. Guess mat karo. Node wapas aaya toh khud green (22 GB shard copy hone mein minutes). Alert: **yellow > 15 min = warn** (page nahi).\n\n### 2. \"Cluster RED ho gaya\"\n\n- **Problem:** kam se kam ek **PRIMARY** shard assigned nahi hai.\n- **Impact:** us shard ka data search mein hai hi nahi. Aur khatarnak baat: **query fail nahi hoti.** ES baaki 5 shards se results laata hai aur 200 OK deta hai, `_shards: { total: 6, successful: 5, failed: 1 }`.\n  - User ko dikhega: 8,300 results (10,000 ki jagah). **Woh kabhi nahi jaanega ki 1/6 catalog gayab hai.** Ye **silent partial failure** hai -- outage se bura, kyunki koi alarm nahi bajta.\n- **Solution -- `_shards.failed` har response par check karo:**\n\n```ts\n// src/repositories/es.repository.ts\nconst res = await this.es.search\u003cProductDoc>({ index: 'products', ...body });\n\nif (res._shards.failed > 0) {\n  partialResultsTotal.inc({ index: 'products' }, res._shards.failed);\n  logger.warn(\n    { failed: res._shards.failed, total: res._shards.total,\n      reasons: res._shards.failures?.slice(0, 2).map((f) => f.reason?.type) },\n    'partial search results -- some shards did not answer',\n  );\n}\n```\n\n**Code Explanation:**\n\n- `res._shards.failed > 0` -- ES ne 200 diya, par kuch shards ne jawab nahi diya. **Ye check na ho toh RED cluster chupchaap aadhe results deta rahega.** Yahi RED ka asli detector hai (cluster-health polling se bhi jaldi).\n- `.slice(0, 2)` -- sirf pehle 2 reasons log karo; 1,000 QPS par poora failures array logging pipeline hi gira dega. `f.reason?.type` (`no_shard_available_action_exception`, `circuit_breaking_exception`) batata hai RED hai ya slow shard ya heap.\n- Alert: `rate(partial_results_total[5m]) > 0 for 2m` = **page**. Chaaho toh response mein `degraded: true` bhi bhejo.\n\n  **Recovery:** RED aksar matlab primary **aur** replica dono gaye. Options: node wapas laao, snapshot restore, ya **Postgres se reindex** -- kyunki **ES hamara source of truth nahi hai, worst case mein poora index dobara bana sakte hain.** 50M docs ka full reindex kuch ghante, data loss zero.\n\n### 3. \"Ek data node mar gaya\"\n\n- **Problem:** 6 mein se ek node crash / AZ issue.\n- **Impact:** us node ki 2 shards ki replicas doosre nodes par **seconds mein promote**. Cluster **yellow**. Search chalti rehti hai, **user ko kuch nahi dikhta.** Baaki 5 nodes par 20% zyada load -- p99 thoda badhega.\n- **Solution:**\n  - `index.unassigned.node_left.delayed_timeout: 5m` (default 1m) -- ES turant 22 GB shards copy na kare. Node 5 min mein wapas aa gaya (restart/deploy) toh poora network storm bach gaya. **Ye ek setting bahut saare \"cluster slow ho gaya\" incidents rokti hai.**\n  - `cluster.routing.allocation.awareness.attributes: zone` -- primary aur replica **alag AZ** mein.\n  - Capacity: 6 nodes ko **5 nodes ka load** jhelne layak rakho (peak par ~80% se upar mat jao).\n\n### 4. \"Poora ES cluster unreachable hai\" -- degrade ladder\n\n- **Problem:** bad config push, network ACL, provider outage, ya saari nodes OOM.\n- **Impact:** kuch na karein toh **search feature poora gayab** = revenue zero. Ye system ka worst case hai.\n\n```\nStep 0: ES query -------> fail\nStep 1: Redis stale cache -> head queries ka purana result (30% queries yahin nikal jaati hain)\nStep 2: Postgres pg_trgm --> degraded top-20, BINA facets, degraded: true + UI banner\nStep 3: 503 SEARCH_UNAVAILABLE\n```\n\n```ts\n// src/services/search.service.ts\nasync search(req: SearchRequest): Promise\u003cSearchResponse> {\n  const key = cacheKey(req);\n  const fresh = await this.cache.get(key);\n  if (fresh) return { ...fresh, tookMs: 1 };\n\n  try {\n    const res = await this.esRepo.search(req);\n    await this.cache.set(key, res, 60);\n    await this.cache.set(`stale:${key}`, res, 900);   // 15 min ka lifeboat\n    return res;\n  } catch (err) {\n    searchDegradedTotal.inc({ stage: 'es_failed' });\n    this.logger.error({ err: String(err) }, 'es search failed, degrading');\n\n    const stale = await this.cache.get(`stale:${key}`);            // STEP 1\n    if (stale) {\n      searchDegradedTotal.inc({ stage: 'stale_cache' });\n      return { ...stale, degraded: true };\n    }\n    try {                                                           // STEP 2\n      const rows = await this.productRepo.degradedSearch(req.q, 20);\n      searchDegradedTotal.inc({ stage: 'postgres' });\n      return { hits: rows, total: rows.length, totalIsLowerBound: true,\n               facets: { brands: [], categories: [], priceRanges: [] },\n               tookMs: 0, degraded: true };\n    } catch {                                                       // STEP 3\n      searchDegradedTotal.inc({ stage: 'failed' });\n      throw new ServiceUnavailableError('SEARCH_UNAVAILABLE');\n    }\n  }\n}\n```\n\n**Code Explanation:**\n\n- `cache.set('stale:' + key, res, 900)` -- **yahi trick hai.** Har successful search do jagah likhti hai: 60 s \"fresh\" copy, aur **15 min \"stale\" copy**. Normal din mein stale kabhi padhi hi nahi jaati; ES gira toh yahi lifeboat hai. Cost: ~2x Redis memory -- sasta insurance.\n- `catch (err)` -- **retry nahi kar rahe**; ES client already `maxRetries: 2` karta hai. Service layer par aur retry = user 3 sec wait karega bina fayde ke.\n- `searchDegradedTotal.inc({ stage })` -- spec ka `search_degraded_total`, `stage` label ke saath. Batata hai ladder ki **kaunsi seedhi** use hui. Alert: `stage=\"postgres\"` > 0 = **page**.\n- `degraded: true` -- API contract mein pehle se hai. UI banner dikhata hai: \"Search limited mode mein hai.\"\n- `degradedSearch(q, 20)` -- `pg_trgm` query, `LIMIT 20`, **bina facets** (`GROUP BY` 50M rows par Postgres ko maar dega) aur **bina pagination**. `facets: { brands: [], ... }` -- khaali arrays, `undefined` nahi (frontend crash na ho). `totalIsLowerBound: true` -- \"20 results\" mat bolo, \"20+\" bolo.\n- `throw ServiceUnavailableError` -- **503, khaali list nahi.** Khaali list ka matlab \"kuch nahi mila\" hota hai, jo jhooth hai.\n\n**Zaruri warning:** Postgres degraded path ko **rate limit + circuit breaker** ke peeche rakho. ES gira aur 1,000 QPS achanak Postgres par aa gaya -> ab tumhara **orders database** bhi mar gaya. Practical rule: degraded path par global cap (jaise 100 QPS), baaki seedha 503. **Aadhe log search kar payein, poora business zinda rahe.**\n\n> Interview line: \"ES down par teen seedhi: Redis se stale head-query results, phir Postgres `pg_trgm` se top-20 bina facets `degraded: true` ke saath, phir 503. Rate limiter mein sawaal 'fail open ya closed' tha; search mein sawaal hai 'kitna kam de sakte hain'. Aur degraded path circuit breaker ke peeche, warna search bachaate bachaate main OLTP DB gira doonga.\"\n\n### 5. \"JVM heap pressure / long GC pauses\"\n\n- **Problem:** heap 75%+ par lagatar rahe toh **old-gen GC** chalta hai, jo **stop-the-world** hai.\n- **Impact:** p99 200 ms se 2,000 ms. **p50 normal dikhta hai!** Sirf woh queries slow hoti hain jo pause ke dauran us node par thi. Graph par **spiky p99 + flat p50** -- yahi GC ka fingerprint hai.\n- **Causes:** high-cardinality `terms` agg (jaise `productId` par, ya bina `size` cap); bada `size: 10000` request; deep pagination (`from: 100000` -> har shard 100,024 hits coordinating node par); field data on a `text` field (**isiliye spec mein `brand`, `categoryPath` `keyword` hain, `text` nahi**).\n- **Solution:**\n  - **Heap 31 GB se upar kabhi nahi** (spec). 32 GB ke aage JVM **compressed oops** off kar deta hai -- pointers 4 se 8 byte -- yaani **40 GB heap 31 GB se kam useful memory deta hai.** Counter-intuitive par sach.\n  - Baaki RAM (64 - 31 = 33 GB) **OS page cache** ke liye -- Lucene segments wahan cache hote hain, aur yahi search speed ka sabse bada factor hai.\n  - **ES circuit breakers:** `indices.breaker.request.limit: 60%`, `total.limit: 70%`. Ek bhaari query **reject** ho jaayegi (`circuit_breaking_exception`) taaki node na gire. **Ek query ka 500 poore cluster ke outage se accha hai.**\n  - `search.max_buckets: 10000`; API par `size` max 100, `page` max 50.\n  - Alert: heap > 80% for 10 min = page.\n\n### 6. \"Ek slow shard poori query ko slow bana raha hai\"\n\n- **Problem:** ES query **scatter-gather** hai; coordinating node saari shards ka **wait** karta hai.\n\n> **Query latency = sabse SLOW shard ka latency.** 5 shards 40 ms, chhati 900 ms -> query 900 ms.\n\n- **Impact:** ek node par disk throttling / bada merge / GC -- aur **poore cluster ki p99 gir jaati hai** jabki 5 nodes theek hain.\n- **Kaise pakdo:** cluster-level average kuch nahi batata. `GET /_nodes/stats/indices/search` se **per-node** `query_time_in_millis / query_total` nikalo aur **6 alag lines** graph karo. Ek line upar = culprit mila.\n- **Solution:**\n\n```json\nGET /products/_search?allow_partial_search_results=true\n{ \"timeout\": \"800ms\", \"size\": 24, \"query\": { \"...\": \"...\" } }\n```\n\n**Code Explanation:**\n\n- `\"timeout\": \"800ms\"` -- **per-shard** timeout. Har shard 800 ms tak jo mila bhej de. Bina iske ek slow shard 30 sec baitha reh sakta hai. **800 ms kyun?** p99 budget 400 ms hai; 800 ms \"clearly broken\" ki line hai.\n- `allow_partial_search_results=true` -- default true hai, par **explicitly likho** taaki intent clear rahe. Ye **do-dhaari talwar** hai: `true` = user ko kuch milta hai (achha) par **chupchaap adhoora** (failure #2). `false` = saaf error par kuch nahi milta. **Isliye `true` + mandatory `_shards.failed` monitoring -- dono saath hi sahi hai.**\n- Client ka `requestTimeout: 1000` hamesha ES ke `timeout` (800 ms) se **bada** rakho, warna client pehle haath khada kar dega aur ES ka partial result kabhi milega hi nahi.\n- Root cause aksar us node par chal raha **bada segment merge** hota hai (bulk indexing ke baad) -- fix: merge scheduler tuning ya bulk ko off-peak shift.\n\n### 7. \"Indexer peeche chal raha hai\" (Kafka lag)\n\n- **Problem:** `product-indexer` group Kafka se peeche. Flash sale par 500 updates/sec aaye, workers 200/sec kar paa rahe hain.\n- **Impact:** **search purana data dikhaati hai** -- price 1,999 jabki 1,299 ho gaya; \"in stock\" jabki khatam. Spec ka `\u003c= 30 s` SLA tootkar 20 minute ho sakta hai. **User ko:** product page par alag price, ya cart mein \"out of stock\".\n- **Detect -- do alag metrics, dono chahiye:**\n\n| Metric | Naapta kya hai | Kyun |\n|---|---|---|\n| **Kafka consumer lag** | Kitne messages unprocessed | Sasta, par \"500 messages\" ka time mein matlab nahi pata |\n| **`indexer_lag_seconds`** | `now - doc.updatedAt` index karte waqt | **Yahi asli SLA metric hai** -- seller ke edit ko search mein aane mein kitne second lage |\n\n```ts\n// src/workers/product-indexer.worker.ts\nfor (const doc of batch) {\n  indexerLagSeconds.observe((Date.now() - new Date(doc.updatedAt).getTime()) / 1000);\n}\nawait this.esRepo.bulkIndex(batch);\n```\n\n**Code Explanation:**\n\n- `Date.now() - doc.updatedAt` -- **Postgres row badli** se **ES mein likhne** tak ka poora end-to-end time: outbox poller delay + Kafka + batch wait. Sirf Kafka lag dekhoge toh **outbox poller ka atakna miss ho jaayega** (failure #8).\n- `.observe(...)` -- histogram, gauge nahi -- p50 aur p99 dono chahiye. Alert `histogram_quantile(0.99, ...) > 60` for 5 min.\n- **Clock skew:** `Date.now()` worker ka clock hai, `updatedAt` Postgres ka -- NTP sync zaroori, warna lag negative/fake dikhega. (Rate Limiter Part 4 mein yahi problem thi; wahan fix Redis `TIME` tha.)\n\n- **Solution:** consumers scale karo -- par **max concurrency = partition count** (spec: 12 partitions = max 12 workers, 13va idle). Bulk batching 500 docs / 5 MB / 1 s. Backpressure mein **priority topic** sirf price/stock ke liye (title edits late chalenge, \"in stock\" ka jhooth mehenga hai). **Aur sabse bada fix:** spec ka rule -- **har stock quantity change par reindex mat karo** (`inStock` boolean index mein, exact `stock_qty` product page par DB/Redis se). Isse update volume 5M/day rehta hai, 50M/day nahi ban jaata.\n\n### 8. \"Outbox poller atak gaya\"\n\n- **Problem:** `outbox-poller` crash / deadlock / DB connection stuck. Postgres mein updates ho rahe hain, `product_outbox` rows ban rahi hain, koi publish nahi kar raha.\n- **Impact:** **Kafka lag ZERO dikhega** (messages aa hi nahi rahe!) aur `indexer_lag_seconds` bhi normal (jo aaya woh jaldi index hua). **Dono metrics green, search ka data poori tarah frozen.** Ye system ka sabse **dhokhebaaz** failure hai.\n- **Detect -- ek hi sahi metric: sabse purani unpublished row ki umar.**\n\n```ts\nnew client.Gauge({\n  name: 'outbox_oldest_unpublished_age_seconds',\n  help: 'Age of the oldest unpublished row in product_outbox',\n  async collect() {\n    const { rows } = await pg.query\u003c{ age: number }>(\n      `SELECT COALESCE(EXTRACT(EPOCH FROM (now() - MIN(created_at))), 0) AS age\n         FROM product_outbox WHERE published_at IS NULL`,\n    );\n    this.set(Number(rows[0].age));\n  },\n});\n```\n\n**Code Explanation:**\n\n- `MIN(created_at) WHERE published_at IS NULL` -- **row count mat naapo**: 10,000 rows healthy ho sakti hain (burst), aur 1 row 2 ghante purani = outage. **Umar hi sach batati hai.**\n- `COALESCE(..., 0)` -- koi pending row nahi toh `MIN` `NULL` deta hai -> gauge 0 (healthy).\n- Ye query `product_outbox_unpublished` **partial index** (`ON (id) WHERE published_at IS NULL`) use karti hai -- spec mein wahi isiliye banaya tha. Partial index mein sirf pending rows, isliye query millisecond mein chalti hai chaahe table mein 500M rows hon.\n- `async collect()` -- Prometheus scrape (15-30 s) par chalta hai, har request par nahi. Alert: `> 120` = **page**.\n\n- **Solution:** poller `SELECT ... FOR UPDATE SKIP LOCKED` ke saath -> multiple instances bina duplicate kaam ke. Heartbeat-based liveness (60 s se purana = restart). Published rows ka 7-din cleanup job (warna table 5M rows/day se badhta rahega). **Recovery:** poller wapas chalte hi backlog apne aap nikal jaayega -- **outbox ka poora point yahi hai: kuch kho nahi sakta, sirf late ho sakta hai.**\n\n### 9. \"Kisi ne bad mapping change deploy kar di\"\n\n- **Problem:** `rating` ko `half_float` se `keyword` kar diya, ya naya field `discount: integer` jabki data `\"25%\"` string bhej raha hai.\n- **Impact:** ES **existing mapping badalne nahi deta** (sirf naye fields add hote hain) -> bulk calls `mapper_parsing_exception` se reject, prabhavit docs **DLQ** mein. **User ko:** naye/edited products search mein aate hi nahi; purane normal. Business ko ye **sellers ki complaints se** pata chalta hai, monitoring se nahi -- agar DLQ par alert na ho.\n\n```ts\nconst res = await this.es.bulk({ operations, refresh: false });\nif (res.errors) {\n  for (const item of res.items) {\n    const r = item.index ?? item.create ?? item.update;\n    if (!r?.error) continue;\n    if (r.status === 409) { versionConflictTotal.inc(); continue; }   // expected\n    bulkIndexErrorsTotal.inc({ type: r.error.type });\n    if (r.status >= 400 && r.status \u003c 500) {\n      await this.dlq.send({ id: r._id, error: r.error.type, reason: r.error.reason });\n    } else {\n      await this.retryQueue.send({ id: r._id });\n    }\n  }\n}\n```\n\n**Code Explanation:**\n\n- `res.errors` -- ES bulk ka bada jaal: **poori bulk call HTTP 200 deti hai** chaahe 400 docs fail ho gaye hon. Per-item check **mandatory** hai.\n- `r.status === 409` -> `continue`. Ye **expected** hai: spec ka `version_type: 'external'`. Out-of-order Kafka message purana version laaya -> ES ne mana kiya -> **ye correctness hai, error nahi.** DLQ mein bhejoge toh DLQ bekaar alarms se bhar jaayega.\n- `{ type: r.error.type }` label -- `mapper_parsing_exception`, `strict_dynamic_mapping_exception`, `circuit_breaking_exception`. Low cardinality (ES ke error types ginti ke hain), safe label, aur **exactly** batata hai kya toota.\n- **4xx -> DLQ, 5xx -> retry** -- ye poora fark hai. 4xx = **doc galat hai**, dobara bhejne se wahi error (poison message, infinite loop). 5xx = **cluster busy**, retry sahi hai.\n- **Prevention:** mapping mein `\"dynamic\": \"strict\"` -- unknown field **reject** ho, chupchaap `text` mein map na ho. Mapping changes CI mein staging index par test hon. **Recovery:** mapping badalna = **alias swap reindex** (spec ka rule), phir DLQ replay.\n\n### 10. \"Reindex ne disk bhar di\"\n\n- **Problem:** `products_v4` banaya, `_reindex` shuru. Ab cluster par **dono** indices -- peak par ~520 GB jahan pehle 260 GB tha.\n\n| Watermark | Default | ES kya karta hai |\n|---|---|---|\n| **low** | **85%** | Us node par **nayi shards allocate band**. Cluster **yellow** |\n| **high** | **90%** | Us node se shards **relocate** shuru -- aur IO, aur network (aksar problem badhata hai) |\n| **flood_stage** | **95%** | **`index.blocks.read_only_allow_delete: true`** -- prabhavit indices **read-only** |\n\n- **User ko kya dikhta hai:** search **chalti rehti hai** (reads block nahi hote). Lekin **koi update index nahi ho raha** -- har bulk `cluster_block_exception`. Catalog frozen. Aur: **disk khaali karne ke baad bhi purane ES versions mein block khud nahi hatta.**\n- **Recovery (order matters):**\n\n```json\nDELETE /products_v1                                       // 1. PEHLE jagah banao\nPUT /_all/_settings                                       // 2. PHIR block hatao\n{ \"index.blocks.read_only_allow_delete\": null }\n```\n\n**Code Explanation:**\n\n- **Pehle jagah, phir block.** Ulta karoge toh writes shuru honge, disk phir 95%, block phir lagega -- ab tum loop mein ho.\n- `null` = \"setting hata do, default par jao\" (`false` nahi). `_all` isliye kyunki flood stage ne saare prabhavit indices par block laga diya tha.\n- **Prevention:** reindex se pehle capacity check (`used + new index size` \u003c 70%?); purana version (`products_v1`) delete karo -- spec kehta hai purana index **24 ghante** rakho, usse zyada nahi; reindex ke dauran naye index par `number_of_replicas: 0` (**aadhi jagah**, par us dauran koi copy nahi -- isliye sirf **initial build** ke liye, live index par kabhi nahi). Alert 82% par, 95% par pata chalna matlab already outage.\n\n### 11. \"Bad synonym ya analyzer change ne relevance tabah kar di\"\n\n- **Problem:** ops ne `search_synonyms` mein daala: `apple, fruit`. `_reload_search_analyzers` chal gaya.\n- **Impact:** \"apple iphone\" par **seb, apple juice, fruit baskets**. Aur **koi error nahi, koi 5xx nahi, koi latency spike nahi. Saare dashboards green.** Ye system ka sabse khatarnak outage hai kyunki **monitoring ise pakadti hi nahi** -- sirf revenue girti hai aur agle din analytics mein dikhti hai.\n- **Detect:**\n  - **Zero-result rate ka SUDDEN shift** -- dono direction mein (zyada match ya galat expansion). Sirf \"> 5%\" threshold kaafi nahi.\n  - **CTR by position** -- top 3 par clicks gire = relevance tooti. Ye p99 se behtar signal hai.\n  - **Golden query set** -- 200 queries + unke expected top-5 productIds. CI mein aur har synonym reload ke baad chalao. Overlap 80% se neeche -> **deploy block / auto rollback**.\n- **Rollback:**\n\n| Kya badla | Reindex? | Kaise | Time |\n|---|---|---|---|\n| **Synonyms** (search-time, spec ka decision) | **Nahi** | Row disable -> `synonyms.txt` regenerate -> `POST /products/_reload_search_analyzers` | **Seconds** |\n| **Analyzer / mapping** | **Haan** | Alias wapas purane index par -- atomic | **Seconds** (agar purana index zinda hai) |\n\n```json\nPOST /_aliases\n{ \"actions\": [\n  { \"remove\": { \"index\": \"products_v4\", \"alias\": \"products\" } },\n  { \"add\":    { \"index\": \"products_v3\", \"alias\": \"products\" } } ] }\n```\n\n**Code Explanation:**\n\n- Ek hi call mein `remove` + `add` -- **atomic**. Ek bhi query aisi nahi hogi jise alias na mile. Do alag calls karoge toh beech mein queries fail hongi.\n- **Ye rollback sirf tab kaam karta hai jab `products_v3` zinda ho** -- isiliye spec ka rule: purana index 24 ghante rakho. Warna rollback = 3 ghante ka reindex.\n- **Yahi wajah hai ki spec ne synonyms search-time rakhe, index-time nahi:** index-time synonyms tez hain (query par kaam nahi) par har change par **poora 130 GB reindex** maangte hain. Search-time thoda slow, par rollback **seconds** mein. **Jo cheez insaan roz edit karta hai, uska rollback sasta hona chahiye.**\n\n### 12. \"Ek scraper search par hathoda chala raha hai\"\n\n- **Problem:** competitor 500 QPS par `/api/v1/search`, hazaaron unique queries (`brand:X page:1..50` ka cross product), prices nikalne ke liye.\n- **Impact:** ye traffic **cache-proof** hai -- har query unique, hit 0%. Yaani **100% load seedha ES par**, aur deep pagination sabse mehengi query hai. Normal users ki latency badh jaati hai. **Cache hit ratio 30% se 12% girna hi pehla signal hai.**\n- **Solution (layers -- Rate Limiter lesson yahan cash hota hai):** `rl:search:\u003cip>` token bucket (spec ki key, jaise 60/min anonymous; suggest par alag aur zyada limit kyunki ek search = ~4 legit suggest calls); **per account/token** limit (IP badalna sasta, account mehenga); **global per-endpoint cap**; **page \u003c= 50 cap** (poora catalog nikalna mehenga ban jaata hai); **cache hit ratio drop par alert** (sabse sasta detector).\n- **Honest limit:** distributed scraper (10,000 residential IPs, har IP 3 req/min) ko app-level limit **kabhi nahi** rokega -- woh normal user se distinguishable hi nahi hai. Uske liye WAF / bot management chahiye. Aur poori tarah rokna **possible hi nahi** -- prices public hain. **Goal \"rokna\" nahi, scraping ko mehenga banana hai.**\n\n### 13. \"Query of death\" -- ek request jo node hila de\n\n- **Problem:** `?q=\u003c5000 characters>&page=50&size=100`.\n- **Impact:** `fuzziness: AUTO` har **term** par expand karta hai. 5,000 chars = ~700 terms x `max_expansions: 50` = **35,000 term lookups** ek query mein. Woh node CPU-bound, uski saari shards ki queries slow. **Ek request, poore node ka asar.**\n\n```ts\n// src/middleware/validate.ts\nexport const searchQuerySchema = z.object({\n  q: z.string().trim().min(1).max(100),                 // spec: 100 chars max\n  page: z.coerce.number().int().min(1).max(50),         // spec: aage searchAfter\n  size: z.coerce.number().int().min(1).max(100),        // spec\n  sort: z.enum(['relevance', 'price_asc', 'price_desc', 'newest', 'rating']),\n  brand: z.array(z.string().max(64)).max(10).optional(),\n  priceMin: z.coerce.number().int().min(0).max(100_000_000).optional(),\n  priceMax: z.coerce.number().int().min(0).max(100_000_000).optional(),\n}).strict();                                            // spec: unknown filter -> 400\n```\n\n**Code Explanation:**\n\n- `.max(100)` on `q` -- **spec ka number, aur ye ek security control hai, UX nahi.** Ye ek line query-of-death ki 90% power khatam kar deti hai: 100 chars = max ~15 terms x 50 = 750 expansions, manageable.\n- `.trim().min(1)` -- khaali query ES tak mat jaane do (`match_all` ban jaati hai = poora index scan). `.max(10)` on `brand` -- 500 brands ka array bhejna ek aur DoS vector hai (500 `term` clauses).\n- `z.coerce.number()` -- query string se sab string aata hai; `coerce` number banata hai, `.int()` ke bina `page=2.5` nikal jaayega.\n- `.strict()` -- **spec ka rule: unknown filter = 400.** Ye sirf hygiene nahi: unknown params chupchaap ignore karna matlab attacker `&script_fields=...` try karta rahega aur tumhe pata bhi nahi chalega.\n- **Iske aage ES-side guards** (validation mein bhi bug ho sakta hai): per-request `\"timeout\": \"800ms\"`, `search.max_buckets`, circuit breakers, aur `fuzziness` ko word count par conditional (5+ words par off -- lambi queries mein context zyada hai, typo tolerance ki zarurat kam).\n\n### 14. \"Split brain / master election issues\"\n\n- **Problem:** network partition ya masters par heap pressure -> elected master \"gayab\" -> re-election.\n- **Impact:** election ke dauran **cluster state changes ruk jaate hain** -- naye index nahi, shard allocation nahi, alias swap fail. **Searches aksar chalti rehti hain** (data nodes ke paas last known routing table hai). Bar-bar election (flapping) ho toh cluster \"chalta dikhta hai\" par kuch change nahi kar paate.\n- **Asli split brain** (do masters) purane ES (\u003c 7.x) mein possible tha jab `minimum_master_nodes` galat set hota tha. **ES 7+ mein ye structurally impossible hai** -- voting configuration quorum-based hai aur ES khud manage karta hai.\n- **Solution:** **3 dedicated masters, alag AZ/rack**, even number kabhi nahi. Masters chhote par **dedicated** -- unka heap kabhi search/agg se na bhare (yahi dedicated masters ka poora point hai). `discovery.seed_hosts` + `cluster.initial_master_nodes` sahi -- galat config par **do alag cluster** ban jaate hain jo ek dusre ko jaante hi nahi (split brain ka modern version). Monitor: `es_cluster_status`, election count, `GET /_cluster/pending_tasks` queue length.\n\n### Failure summary\n\n| Failure | Detect | Fallback / fix |\n|---|---|---|\n| Cluster yellow | `es_cluster_status` = 1 for 15 min | `allocation/explain`; aksar self-heal |\n| Cluster red | `partial_results_total > 0`, status = 2 | Node wapas / snapshot / **Postgres se reindex** |\n| Data node dead | Node count drop | Replica promote; `delayed_timeout: 5m` |\n| Cluster unreachable | `search_degraded_total` | Stale Redis -> Postgres top-20 -> 503 |\n| Heap / GC | heap > 80%, spiky p99 + flat p50 | Heap \u003c= 31 GB, circuit breakers, caps |\n| Slow shard | Per-node query time divergence | `timeout: 800ms` + partial + `_shards.failed` |\n| Indexer lag | `indexer_lag_seconds` p99 > 60 | Scale workers (\u003c= 12), priority topic |\n| Outbox stuck | `outbox_oldest_unpublished_age_seconds > 120` | `SKIP LOCKED` multi-poller, restart |\n| Bad mapping | `bulk_index_errors_total`, DLQ depth | `dynamic: strict`, staging test, reindex + replay |\n| Disk full | Disk % > 82 | Delete old index **phir** block clear |\n| Bad synonyms | Zero-result shift, CTR@1-3 drop, golden set | `_reload_search_analyzers` / alias swap back |\n| Scraper | Cache hit ratio drop, per-IP 429s | Rate limits + page cap + WAF |\n| Query of death | p99 spike on one node | Zod caps + ES timeout |\n| Master election | `pending_tasks` queue, election count | 3 dedicated masters, alag AZ |\n\n---\n\n## PART 18 -- Consistency\n\n### Teen words, simple Hinglish mein\n\n- **Strong consistency:** value badalte hi **har** padhne wala turant nayi value dekhega. Jaise bank balance -- ATM aur app dono ek hi number dikhayenge.\n- **Eventual consistency:** abhi kuch log purani value dekh sakte hain, thodi der mein sab same. Jaise YouTube view count -- 1,203 ya 1,210, kisi ko fark nahi.\n- **Read-after-write consistency:** **jisne likha woh turant apna likha dekhe**; baaki thoda late dekhein toh chalega. Jaise tumne comment kiya -- tumhe turant dikhna chahiye, dost ko 3 sec baad bhi chalega.\n\n### Is system mein kahan kya?\n\n| Cheez | Kya | Kyun |\n|---|---|---|\n| **Postgres `products`** | **Strong -- SOURCE OF TRUTH** | ACID. Price, stock, seller data ka sach yahi hai |\n| **`products` + `product_outbox` ek transaction mein** | **Strong (atomic)** | Dono saath commit ya dono rollback. **Yahi outbox ka poora point hai** |\n| **ES `products_v3`** | **Eventual** (SLA \u003c= 30 s) | **Jaan-boojh kar.** Strong ke liye har write ko ES-confirmed karna padta -- write latency 5 ms se 200 ms, aur ES gira toh **catalog writes bhi band** |\n| **Redis `q:\u003csha1>`** | Eventual + 60 s | Worst case: 30 s indexing + 60 s cache = **~90 s** |\n| **Seller apna product dashboard par dekhe** | **Read-after-write** | 2 min pehle price badla aur nahi dikh raha -> support ticket |\n| **Search results ka stock** | Eventual -- aur **isse authority mat banao** | Neeche poora section |\n| **Facet counts** | Eventual + approximate | Distributed `terms` agg (`doc_count_error_upper_bound`). 1,204 vs 1,199 -- kisi ko fark nahi |\n| **Synonyms / analyzer config** | Eventual (reload tak) | `_reload_search_analyzers` ke baad hi lagte hain |\n\n### ES eventual kyun hai -- do alag lags\n\nLog sochte hain \"indexing lag\" ek cheez hai. Actually do hain:\n\n```\nSeller ne Save dabaya (t=0)\n  | [1] PIPELINE LAG: outbox poller (~1s) + Kafka (~ms) + indexer batch (~1s) + bulk = 2-5 s\n  v\nES ne doc accept kar liya (t=3s)   \u003c-- par abhi bhi search mein NAHI hai!\n  | [2] REFRESH LAG: doc abhi in-memory buffer mein hai. Woh tabhi searchable hota hai\n  |     jab REFRESH naya Lucene segment banata hai. refresh_interval: 1s -> 0-1 s\n  v\nAb search mein dikhta hai (t=4s)\n```\n\n**Refresh lag hi \"near real-time\" ko \"real-time\" nahi banne deta.** Lucene segments **immutable** hain -- likha doc tab tak searchable nahi jab tak naya segment na bane. `refresh_interval` 100 ms kar sakte ho, par phir bahut chhote segments -> merge storm -> cluster slow. Isiliye sale day par ulta **badhate** hain (30 s).\n\n> **Anchor:** `refresh_interval` seedha ek knob hai: ek taraf freshness, doosri taraf indexing throughput. **Dono ek saath nahi mil sakte.**\n\n### Read-after-write: seller ka apna product\n\n**Problem:** seller ne price 1,999 -> 1,299 kiya, turant \"My Listings\" par gaya. ES se aaya toh 4 sec purana price. Seller ka reaction: \"save hua hi nahi\" -> dobara save -> phir dobara -> support ticket.\n\n```ts\n// src/controllers/search.controller.ts\nasync sellerListings(req: Request, res: Response) {\n  const rows = await this.productRepo.listBySeller(req.user.sellerId, req.query);\n  return res.json(rows);   // seller ka apna view -> ALWAYS Postgres\n}\n```\n\n**Code Explanation:**\n\n- Seller dashboard ES ko **bilkul touch nahi karta**. `products_seller_idx ON (seller_id, updated_at DESC)` (spec ka index) isi ke liye hai.\n- Ye scale karta hai kyunki ek seller ke paas 4,000 products hain, 50M nahi. Ye ek **filtered lookup** hai, search nahi -- yahan BM25 ki zarurat hi nahi.\n- **Sabse important sabak:** read-after-write ka sabse saaf hal ye hai ki **us ek case ko source of truth se serve karo**, na ki poore system ko strong banane ki koshish karo.\n- Agar seller ke 50,000 products hain aur usme **search** chahiye? Tab ES use karo par uske last 60 s ke Postgres edits response par overlay kar do. Thoda code, par SLA bach jaata hai.\n\n### Ordering guarantee: Kafka key + external version\n\n**Problem:** ek product par teen updates ek second mein: 1,999 -> 1,299 -> 1,499. Workers parallel hain. Agar `1,299` wala message `1,499` ke **baad** process ho gaya, toh ES mein **permanently galat price**. Khud kabhi theek nahi hogi.\n\n```ts\n// Layer 1 -- outbox poller: Kafka key = productId\nawait producer.send({ topic: 'product-changes',\n  messages: [{ key: row.product_id, value: JSON.stringify(payload) }] });\n\n// Layer 2 -- indexer: ES external version\noperations.push(\n  { index: { _index: 'products', _id: doc.productId,\n             version: doc.version, version_type: 'external' } },\n  doc,\n);\n```\n\n**Code Explanation:**\n\n- `key: row.product_id` -- Kafka guarantee: **same key = same partition = order preserved** (spec: `key=productId`).\n- **Par ye kaafi nahi.** Kyun? (a) consumer batch ke andar parallelism, (b) retries -- ek failed message retry hone tak agla nikal chuka hoga, (c) partitions badhaoge (12 -> 48) toh purani keys naye partitions par jaayengi aur **order toot jaayega**. Isliye layer 2 chahiye.\n- `version_type: 'external'` -- **yahi asli guarantee hai.** ES dekhta hai \"mere paas version 7 hai, tum 5 la rahe ho\" -> **409 reject.** Purana data naye ko overwrite kar hi nahi sakta, chaahe order kuch bhi ho. `doc.version` Postgres ka `version BIGINT` hai jo har update par bump hota hai -- yaani **DB ka truth hi ordering ka judge hai.**\n- Indexer 409 ko **success** maanta hai (failure #9) -- \"kisi aur ne naya data pehle daal diya\" achhi khabar hai.\n- **Ye idempotency free mein deta hai:** Kafka at-least-once hai; wahi message do baar aaya -> 409 -> koi nuksaan nahi. Rate Limiter mein duplicate ka jawab \"count karo\" tha; yahan \"version se reject karo\" -- kyunki wahan hum **kaam** gin rahe the, yahan **state** set kar rahe hain.\n\n### Sabse mehenga consistency bug: \"search says in stock, checkout says out of stock\"\n\n```\nt=0    Stock 1 bacha. ES mein inStock: true\nt=1    User A ne khareed liya. Postgres stock_qty = 0, inStock = false\nt=1-30 Indexing lag -> ES mein abhi bhi inStock: true\nt=5    User B: search -> product dikha -> cart -> checkout\nt=5.2  Checkout ne Postgres se validate kiya -> OUT OF STOCK\n```\n\n**Business cost (real):** user ne search kiya, click kiya, cart, address, payment page -- phir \"out of stock\". Woh aksar **poora session chhod deta hai**, sirf woh product nahi. Failed-checkout users ka repeat rate girta hai.\n\n**Standard fix -- do hisse.**\n\n**1. Index kabhi authority nahi hai.**\n\n> **Search index discovery ke liye hai, truth ke liye nahi. Paisa aur stock ka faisla hamesha Postgres se hota hai -- checkout par, transaction ke andar, `SELECT ... FOR UPDATE` ke saath.**\n\nYaani ye \"bug\" nahi, **design** hai. Checkout ka kaam hi re-validate karna hai. **Agar tumhara checkout ES se stock padh raha hai, toh tumhara architecture galat hai, tumhari consistency nahi.**\n\n**2. Lag ko wahan chhota rakho jahan sasta ho:**\n\n| Layer | Source | Lag |\n|---|---|---|\n| Search results page | `inStock` ES se (filter ke liye) | 30 s tak stale |\n| Product card badge | Frontend `inStock`, exact quantity **nahi** | -- |\n| Product detail page | Exact `stock_qty` **Redis/Postgres se** (spec) | ~real-time |\n| Add to cart | Postgres check | Real-time |\n| Checkout | Postgres `SELECT ... FOR UPDATE` + transaction | **Strong** |\n\nHar layer pichli se sakht hai. User jitna aage badhta hai, utna sahi sach milta hai -- aur jab tak paisa deta hai, sach 100% hai.\n\n**Practical trick:** \"out of stock\" products ko search se **hatao mat, neeche karo** -- `{ \"filter\": { \"term\": { \"inStock\": true } }, \"weight\": 1.2 }` (spec ki query) yahi kar raha hai. Kyun? (a) user use dhoondh raha ho sakta hai, (b) \"notify me\" monetize hota hai, (c) achanak gayab hona SEO ke liye bura hai.\n\n### Drift detect karna aur repair karna\n\nOutbox aur versioning sahi hone par bhi **drift hota hai**: DLQ mein pade docs, ek buggy deploy ki 20-minute window, manual DB fix jisne `updated_at` nahi chhua, ya ek reindex jo beech mein mar gaya.\n\n```ts\n// src/workers/reconcile.job.ts -- nightly\nfor (const category of categories) {\n  const pg = await pgRepo.categoryChecksum(category);\n  // SELECT count(*) AS cnt, md5(string_agg(id::text || ':' || version, ',' ORDER BY id)) AS sum\n  //   FROM products WHERE category_path = $1 AND status = 'active'\n  const es = await esRepo.categoryChecksum(category);\n\n  reconcileCountDiff.set({ category }, Math.abs(pg.cnt - es.cnt));\n  if (pg.cnt !== es.cnt || pg.sum !== es.sum) {\n    logger.warn({ category, pgCount: pg.cnt, esCount: es.cnt }, 'index drift detected');\n    await this.resyncCategory(category);    // targeted re-sync, poora reindex nahi\n  }\n}\n```\n\n**Code Explanation:**\n\n- **Category-wise, poore index par nahi.** 50M docs ka ek checksum bas \"kuch galat hai\" bolega. Category-wise se **kahan** galat hai pata chalta hai aur repair targeted hota hai.\n- `count(*)` sasta par kamzor (ek doc ka galat **price** count nahi badalta). `version` ko checksum mein daalne se **content drift** bhi pakda jaata hai, kyunki spec ke hisaab se har update `version` bump karta hai.\n- `ORDER BY id` -- **zaroori**. Bina order ke `string_agg` har baar alag aa sakta hai aur har raat fake drift milega.\n- `resyncCategory` -- us category ke products ko dobara `product_outbox` mein daal do. **Normal pipeline hi repair karega** -- koi alag \"fix path\" nahi. **Yahi outbox ki khoobsurati hai: replay = repair.**\n- Off-peak aur throttled (jaise 2,000 docs/sec) chalao. Alert: `count diff > 0.1%` = warn, `> 1%` = page.\n\n> Interview line: \"Postgres source of truth hai aur strongly consistent; ES derived hai aur **jaan-boojh kar** eventually consistent -- lag ke do hisse hain, pipeline (2-5 s) aur refresh (1 s). Ordering ke liye Kafka key `productId` aur uske upar ES external version, jo purane data ko naye par likhne se rokta hai. Seller apna dashboard Postgres se dekhta hai -- read-after-write. Aur sabse important rule: **index kabhi paise ya stock ka authority nahi hai** -- checkout Postgres se re-validate karta hai. Drift ke liye nightly category-wise count + version checksum, aur repair sirf outbox replay.\"\n\n---\n\n## PART 19 -- Security\n\nSearch ke saath ek khaas baat hai: **tum apne poore catalog par arbitrary user input chala rahe ho**, aur wahi input ek query language mein translate ho raha hai. Soch: **\"main is search box se kya kar sakta hoon jo tumne socha nahi tha?\"**\n\n| Threat | Defence |\n|---|---|\n| Doosre seller/tenant ka data dekhna | **Server-side mandatory filters** (client filter par kabhi bharosa nahi) |\n| Inactive / deleted products dikhna | Wahi mandatory filter (`status: active`) |\n| Query DSL injection | Typed client, kabhi string concat nahi; `query_string` ban |\n| Scripting exploit (RCE class) | `script.allowed_types: none` |\n| Resource exhaustion | `q` 100 chars, `max_expansions`, `max_buckets`, `max_result_window`, timeouts |\n| Price scraping | Per-IP + per-token limits, page cap, WAF |\n| ES khula internet par | **Port 9200 kabhi public nahi**, auth + TLS + private subnet |\n| PII in query logs | Normalize + scrub before storing |\n| Admin endpoints | AuthN + role authz + audit |\n\n### 1. Visibility filters -- har query par, server side\n\n**Ye is system ki #1 security baat hai.** Marketplace mein har product har user ko nahi dikhna chahiye: `deleted`/`inactive` kisi ko nahi; seller dashboard par **sirf uske apne**; region-restricted products; B2B catalog sirf approved buyers ko.\n\n**Galat (aur bahut common):** frontend `?sellerId=me` bhejta hai, backend use `filter` mein daal deta hai. Attacker `?sellerId=\u003ccompetitor_id>` bhej ke competitor ka poora catalog (inactive drafts, upcoming launches, internal SKUs) dekh lega. Ye **IDOR** hai -- OWASP ka #1 access control bug.\n\n```ts\n// src/middleware/visibility.ts\nexport interface VisibilityContext { mandatoryFilters: Record\u003cstring, unknown>[] }\n\nexport function visibilityFilter(req: Request, _res: Response, next: NextFunction) {\n  const filters: Record\u003cstring, unknown>[] = [\n    { term: { status: 'active' } },            // har query par, bina exception\n  ];\n  const ctx = req.auth;                        // JWT se decode hua, client se NAHI\n\n  if (ctx?.role === 'seller' && req.path.startsWith('/api/v1/seller/')) {\n    filters.push({ term: { sellerId: ctx.sellerId } });   // token se, query param se nahi\n  }\n  if (ctx?.role !== 'admin') {\n    filters.push({ term: { visibility: 'public' } });\n  }\n  if (req.geo?.country) {\n    filters.push({ bool: { must_not: [{ term: { blockedCountries: req.geo.country } }] } });\n  }\n\n  (req as Request & { visibility: VisibilityContext }).visibility = { mandatoryFilters: filters };\n  next();\n}\n```\n\n```ts\n// src/search/query-builder.ts\nbuild(req: SearchRequest, visibility: VisibilityContext) {       // visibility = REQUIRED param\n  return {\n    query: { function_score: {\n      query: { bool: {\n        must: [this.buildMultiMatch(req.q)],\n        filter: [...visibility.mandatoryFilters, ...this.buildUserFilters(req.filters)],\n      }},\n      functions: [/* popularityScore, inStock boost */],\n      score_mode: 'sum', boost_mode: 'multiply',\n    }},\n  };\n}\n```\n\n**Code Explanation:**\n\n- `const ctx = req.auth` -- identity **JWT/session se** aati hai jise server ne sign kiya. `req.query.sellerId` se **kabhi nahi**. Ek line ka fark, poore data breach ka fark.\n- `{ term: { status: 'active' } }` **sabse pehle, unconditional** -- yahan \"default deny\" chahiye. Koi bhi naya endpoint jo ye middleware use karega, automatically safe hoga.\n- `ctx.sellerId` -- seller ko uska scope **token se** milta hai; woh URL badal ke doosre ka nahi dekh sakta.\n- `build(req, visibility)` -- `visibility` **required parameter** hai, optional nahi. Yaani developer bhool hi nahi sakta: bina visibility ke TypeScript compile hi nahi hoga. **Security ko type system se enforce karo, discipline se nahi.**\n- Mandatory filters `filter` context mein hain -- performance ke liye bhi sahi (Part 3: cacheable bitsets; `status: active` ka bitset hamesha hot rahega).\n- **Test likho:** seller A ke token se seller B ka `sellerId` bhejo aur assert karo 0 results. Ye regression ke against sabse sasta insurance hai.\n\n### 2. Query injection -- ES mein \"SQL injection\" kaise dikhta hai\n\n```ts\n// [X] NEVER -- user input ko JSON string mein concat karna\nconst body = `{\"query\":{\"match\":{\"title\":\"${req.query.q}\"}}}`;\n```\n\nUser bheje `\"}},\"aggs\":{\"leak\":{\"terms\":{\"field\":\"sellerId\",\"size\":10000` -- ab woh query ka **shape** badal raha hai: aggregations add kar sakta hai, filters hata sakta hai.\n\n```ts\n// [OK] src/search/query-builder.ts\nbuildMultiMatch(q: string) {\n  return { multi_match: {\n    query: q,                                    // value slot -- kabhi structure nahi ban sakti\n    fields: ['title^3', 'brand^2', 'description'],\n    type: 'best_fields',\n    fuzziness: q.split(/\\s+/).length > 5 ? undefined : 'AUTO',\n    prefix_length: 1,\n    max_expansions: 50,\n  }};\n}\n```\n\n**Code Explanation:**\n\n- `query: q` -- `q` ek **JavaScript string value** hai object ke andar. Client ise `JSON.stringify` karta hai, jo har special character escape kar deta hai. User ka `\"}}` sirf literal text ban jaata hai. **Structure user ke haath mein hai hi nahi.**\n- `fuzziness: ... > 5 ? undefined : 'AUTO'` -- lambi queries par fuzzy off: security (expansion blowup) aur relevance dono ke liye achha.\n- `max_expansions: 50` (spec) -- har fuzzy term max 50 variants. **Hard cost cap.**\n- `prefix_length: 1` -- pehla akshar exact. Bina iske fuzzy match term dictionary ke bade hisse ko scan karta hai -- yaani ye performance control **bhi** hai aur DoS control **bhi**.\n\n**`query_string` query user input ke liye kabhi nahi:**\n\n| Problem | Example | Nateeja |\n|---|---|---|\n| Ye ek query **LANGUAGE** hai, value nahi | `sellerId:secret AND status:deleted` | User **filtering bypass** kar raha hai, fields khud choose kar raha hai |\n| Wildcards | `*`, `a*b*c*` | Poora term dictionary scan -- ek request se node down |\n| Regex | `/.*(a\\|b)*.*/` | Catastrophic backtracking, CPU 100% |\n| Fuzzy operator | `term~` baar-baar | Expansion blowup |\n| Parse errors | `title:(` | 400s ka flood, kabhi internals leak |\n\n**Safe choice: `multi_match`** (spec ki canonical query) -- user ka input hamesha **value** hai; fields, operators aur boosts **tum** decide karte ho. Power users ko `AND`/`OR` chahiye toh `simple_query_string` (invalid syntax throw nahi karti, `fields` tum fix karte ho) -- par usme bhi wildcards off (`flags: \"AND|OR|PHRASE\"`).\n\n**Scripting:** `elasticsearch.yml` mein `script.allowed_types: none` (zarurat ho toh `stored` -- **inline NEVER**). User input **kabhi** script source mein mat daalo. Purane ES versions (Groovy/MVEL) mein yahi **RCE** ka raasta tha; Painless sandboxed hai par principle wahi: **user ko code likhne mat do.**\n\n### 3. Resource exhaustion -- layered guards\n\n| Layer | Control | Value | Rokta kya hai |\n|---|---|---|---|\n| **API (Zod)** | `q` length | **100 chars** (spec) | Fuzzy expansion blowup |\n| **API** | `size` | max **100** (spec) | Bada `_source` fetch, heap |\n| **API** | `page` | max **50** (spec) | Deep pagination memory |\n| **API** | filter array | 10 | 500-clause `bool` |\n| **API** | per-IP rate limit | `rl:search:\u003cip>` | Volume |\n| **Query** | `max_expansions` | 50 | Fuzzy term explosion |\n| **Query** | `timeout` | `800ms` | Slow shard, runaway query |\n| **Index** | `index.max_result_window` | 10,000 (default) | `from + size` blow-up |\n| **Cluster** | `search.max_buckets` | 10,000 | Bucket explosion (heap OOM) |\n| **Cluster** | `indices.query.bool.max_clause_count` | default | Huge bool queries |\n| **Cluster** | circuit breakers (`request` 60%, `total` 70%) | -- | Ek query poora node na giraye |\n\n**`index.max_result_window` ke baare mein:** jab koi bole \"page 500 par error, limit badha do\" -- **mana karo.** 10,000 se 1,000,000 karne ka matlab ek request 6 shards se 1,000,024 hits coordinating node par la sakti hai. **Ye limit tumhari suraksha hai, tumhara bug nahi.** Sahi jawab: `search_after` (spec ka decision).\n\n```ts\n// src/middleware/validate.ts\nexport function validateSearch(req: Request, res: Response, next: NextFunction) {\n  const parsed = searchQuerySchema.safeParse(req.query);\n  if (!parsed.success) {\n    return res.status(400).json({ code: 'VALIDATION_ERROR',\n      details: parsed.error.issues.map((i) => ({ path: i.path.join('.'), message: i.message })) });\n  }\n  const q = parsed.data.q;\n  if (q.length > 40 && q.split(/\\s+/).length > 12) {\n    return res.status(400).json({ code: 'VALIDATION_ERROR', message: 'query too complex' });\n  }\n  if (parsed.data.page > 50 && !req.query.searchAfter) {\n    return res.status(400).json({ code: 'VALIDATION_ERROR',\n      message: 'use searchAfter cursor beyond page 50' });\n  }\n  (req as Request & { search: SearchRequest }).search = toSearchRequest(parsed.data);\n  next();\n}\n```\n\n**Code Explanation:**\n\n- `safeParse` -- throw nahi karta, `{ success, error }` deta hai, isliye hum apna `400 VALIDATION_ERROR` (spec ka code) bana sakte hain. `i.path` + `i.message` bhejo, **raw Zod error object kabhi nahi** (internal schema leak).\n- `q.length > 40 && words > 12` -- length cap ke **upar** ek complexity cap. 100 chars ke andar bhi `a b c d ... m` jaisi 13-term fuzzy query mehengi hai. **Do alag cheezein naapo: size aur shape.**\n- `page > 50 && !searchAfter` -> 400, **chupchaap clamp mat karo**. Silent clamping se client bug chhupta hai aur scraper ko pata bhi nahi chalta ki limit lagi.\n- `(req as ...).search = toSearchRequest(...)` -- validated, typed object request par rakho; controller ab **kabhi** `req.query` nahi chhuta. Ye \"parse, don't validate\" pattern hai: ek baar saaf karo, phir poore code mein sirf saaf data ghoome.\n\n### 4. Scraping aur competitor price harvesting\n\n**Stack:** (1) per IP `rl:search:\u003cip>` token bucket, suggest par alag zyada limit; (2) **per token/account** limit (IP badalna sasta, account mehenga); (3) **global endpoint cap** -- bots kaise bhi bikhre, backend bachta hai; (4) **page cap 50** -- poora catalog nikalne ki cost badha do; (5) **bot signals:** koi `Referer` nahi + data-center ASN + kabhi image/CSS request nahi + perfect timing (insaan 150 ms debounce se type karta hai, bot exactly 1000.0 ms par bhejta hai) + TLS/JA3 fingerprint -> CAPTCHA ya throttle; (6) **honeypot SKUs** jo sirf API se dikhte hain -- competitor ki site par dikh gaye toh pakka proof (legal ke liye kaam ka).\n\n**Honest limit (ye bolna interview mein maturity dikhata hai):**\n\n> **Prices public hain. Jo browser mein dikh sakta hai, woh scrape ho sakta hai.** 10,000 residential proxies, har IP 3 req/min -- koi rate limit ise nahi pakadega kyunki woh normal user se distinguishable hi nahi. **Goal \"rokna\" nahi; goal ye hai ki scraping ki cost uske fayde se zyada ho jaaye, aur asli users kabhi affected na hon.**\n\n### 5. ES cluster hardening -- \"internet par khula Elasticsearch\"\n\nYe industry ka sabse dohraya gaya breach pattern hai. Hazaaron ES clusters internet par **bina auth** khule mile -- millions of records leak, aur \"Meow attack\" jaise bots ne unhe **delete** hi kar diya. **Kyun hota hai:** purane ES versions mein security **by default OFF** thi; Docker mein `-p 9200:9200`, security group mein `0.0.0.0/0` -- aur poora catalog public.\n\n| Control | Kya |\n|---|---|\n| **Network** | ES **private subnet** mein. 9200 (HTTP) aur 9300 (transport) sirf app servers se inbound. **Public IP kabhi nahi** |\n| **Auth** | Built-in security on; har service ka apna user. `elastic` superuser app mein kabhi use nahi |\n| **Authorization** | Search API user -> `read` on `products`/`suggestions` alias. Indexer -> `write` on `products_*`. **Search API ko `DELETE /products` ka access hona hi nahi chahiye** |\n| **TLS** | Transport (node-to-node) aur HTTP dono par |\n| **Scripting** | `script.allowed_types: none` |\n| **Kibana** | SSO/VPN ke peeche -- Dev Tools = poora cluster control |\n| **Snapshots** | S3 bucket encrypted + private. Backup leak = index leak |\n| **Secrets** | Secret manager se env mein, repo mein kabhi nahi |\n\n```ts\n// src/infra/elasticsearch.ts\nexport const es = new Client({\n  node: process.env.ES_NODE,                       // https://es.internal:9200 -- private DNS\n  auth: { username: process.env.ES_USERNAME!, password: process.env.ES_PASSWORD! },\n  tls: { ca: readFileSync(process.env.ES_CA_PATH!) },\n  maxRetries: 2,\n  requestTimeout: 1000,\n  sniffOnStart: false,                             // spec: sniffing off behind LB\n});\n```\n\n**Code Explanation:**\n\n- `node` -- **private DNS**, `https`, env se. Hardcoded kabhi nahi.\n- `tls: { ca }` -- apna CA verify karo. **`rejectUnauthorized: false` kabhi mat likho** -- woh TLS off karne ke barabar hai (MITM khula).\n- `requestTimeout: 1000` (spec) -- search interactive hai; 1 sec se lambi wait ka matlab nahi.\n- `sniffOnStart: false` (spec) -- sniffing mein client cluster se node list leke unke **internal IPs** par seedha connect karta hai; LB ke peeche ye tootta hai aur security boundary bhi bypass hoti hai.\n\n### 6. PII in query logs -- scrub before storing\n\n**Problem:** 100M queries/day (~30 GB, spec) warehouse mein saalon rehti hain. Users search box mein **sab kuch** type karte hain: phone number, email, order ID, **credit card number** (galti se), naam, address, sharam wali medical cheezein. Pehle teen **PII**, chautha **PCI** (aur tab tumhara PCI scope poora warehouse ban gaya).\n\n```ts\n// src/infra/query-logger.ts\nconst PATTERNS: Array\u003c[RegExp, string]> = [\n  [/\\b\\d{13,19}\\b/g, '[CARD]'],\n  [/\\b[\\w.+-]+@[\\w-]+\\.[\\w.]{2,}\\b/gi, '[EMAIL]'],\n  [/\\b(?:\\+?91[\\s-]?)?[6-9]\\d{9}\\b/g, '[PHONE]'],\n  [/\\b[A-Z]{5}\\d{4}[A-Z]\\b/g, '[PAN]'],\n];\n\nexport function scrubQuery(raw: string): { text: string; redacted: boolean } {\n  let text = raw;\n  for (const [re, tag] of PATTERNS) text = text.replace(re, tag);\n  return { text, redacted: text !== raw };\n}\n\nexport function logSearch(evt: SearchLogEvent) {\n  const { text, redacted } = scrubQuery(evt.q);\n  queryLogProducer.send({ topic: 'search-queries', messages: [{ value: JSON.stringify({\n    q: text, qNormalized: normalize(text), redacted,\n    filters: evt.filterSet, resultCount: evt.total, tookMs: evt.tookMs,\n    cacheHit: evt.cacheHit, esTookMs: evt.esTook,\n    sessionId: evt.sessionId, userSegment: evt.segment, ts: Date.now(),\n  }) }] });\n}\n```\n\n**Code Explanation:**\n\n- `scrubQuery` Kafka par bhejne se **PEHLE** chalta hai. Raw query ek baar warehouse mein gayi toh use retroactively nikalna lagbhag namumkin hai (backups, replicas, downstream jobs). **Scrub at the source.**\n- `\\b\\d{13,19}\\b` -- **thoda aggressive** hai (kuch legit product codes bhi pakad sakta hai) aur ye **jaan-boojh kar** hai: false positive = analytics mein ek `[CARD]`; false negative = card number tumhare warehouse mein.\n- `redacted: true` ka metric banao -- achanak spike matlab koi naya PII pattern (ya koi integration galat data bhej raha hai).\n- `sessionId` **pseudonymous** hai, raw userId nahi. CTR aur refinement chains (PART 20) ke liye session-level linking chahiye, **identity nahi**. `userSegment` (`'new'|'returning'|'prime'`) low cardinality hai aur analytics ke liye kaafi.\n- **Retention:** Kafka 7 din (spec), warehouse mein raw queries 90 din, phir sirf **aggregates** (`query_popularity` table) -- unme koi query-to-person link nahi bachta.\n- **NAHI log karna:** raw un-scrubbed `q`, full user ID, poora IP (`/24` tak mask), `Authorization` header, cookies.\n\n### 7. Admin endpoints\n\n`POST /api/v1/admin/reindex` aur `/admin/synonyms` (spec) bahut takatwar hain: reindex = ghante bhar ka cluster load + alias swap se poora search badal jaata hai; synonyms = relevance ka seedha control (failure #11).\n\n- **AuthN + AuthZ alag:** login hona kaafi nahi; `role === 'search_admin'` check zaroori.\n- **Network:** internal VPN / private ALB -- ye endpoints public internet par kabhi nahi.\n- **Audit log:** kisne, kab, purana + naya value. Synonyms ke liye ye **ops ka undo button** hai.\n- **Reindex concurrency lock** (Redis) -- do parallel reindex = disk full (failure #10).\n- **Confirmation token** destructive ops par: `{ \"confirm\": \"products_v4\" }` -- naam manually likhna pade.\n\n> Interview line: \"Search security ke teen stambh: pehla, visibility filters **hamesha server side** aur type system se mandatory -- client ka `sellerId` kabhi trust nahi. Doosra, user input kabhi DSL structure nahi ban sakta -- typed client aur `multi_match`, `query_string` **kabhi nahi**, scripting off. Teesra, resource caps har layer par -- `q` 100 chars, page 50, `max_expansions` 50, `max_buckets`, timeouts, circuit breakers. Iske upar cluster private subnet mein auth aur TLS ke saath, aur query logs PII scrub hoke hi Kafka par jaati hain.\"\n\n---\n\n## PART 20 -- Observability\n\nSearch ke baare mein **chaar** log sawaal poochte hain -- aur chautha wahi hai jo engineers bhool jaate hain:\n\n- **On-call:** \"Search healthy hai? Latency budget ke andar?\"\n- **Indexing owner:** \"Data fresh hai? Lag kitna hai?\"\n- **Support:** \"Customer ka product search mein nahi aa raha.\"\n- **Product / Growth:** **\"Kya search achhe results de rahi hai?\"** -- ye latency wala sawaal **nahi** hai.\n\nChauthi dimension hi search ko baaki systems se alag banati hai. Ek search system **p99 50 ms** par chal sakta hai aur **poori tarah bekaar** ho sakta hai.\n\n### 1. SLIs -- paanch number jo poori kahani batate hain\n\n| SLI | Target (spec) | Kaise naapein |\n|---|---|---|\n| **Search p95 / p99** | **\u003c 200 ms / \u003c 400 ms** | `search_latency_seconds` histogram, **API mein** (ES ke `took` se nahi) |\n| **Suggest p99** | **\u003c 100 ms** | `suggest_latency_seconds` |\n| **Zero-result rate** | **\u003c 5%** (baseline 12%) | `search_zero_results_total / search_requests_total` |\n| **Cache hit ratio** | **~30%** | `search_cache_hit_ratio` |\n| **Indexer lag** | **p99 \u003c= 30 s** | `indexer_lag_seconds` histogram |\n\n**Do zaroori measurement rules:**\n\n1. **Latency client ke sabse kareeb naapo.** ES ka `took` sirf ES ke andar ka time hai. Budget (spec): Node ~10 ms + network ~5 ms + ES 60-120 ms + aggs 20-40 ms + serialization ~10 ms. `es_query_duration_seconds` aur `search_latency_seconds` **dono** rakho -- unka **antar** batata hai problem ES mein hai ya Node process mein (event loop lag!).\n2. **Cached aur uncached alag naapo.** Cache hits (2 ms) ko ES requests (150 ms) ke saath milaoge toh p95 jhoota accha dikhega -- aur cache hit ratio girte hi p95 \"achanak\" badh jaayega bina kisi asli reason ke. Isiliye spec ke metric mein `cached` label hai.\n\n### 2. Metrics + alert thresholds\n\n| Metric | Type | Labels | Alert |\n|---|---|---|---|\n| `search_requests_total` | Counter | `sort`, `cached` | Traffic drop > 50% vs pichla hafta = page |\n| `search_latency_seconds` | Histogram | `cached` | p95 > 200 ms 10 min = **page**; p99 > 400 ms = page |\n| `es_query_duration_seconds` | Histogram | `index` | p99 > 300 ms 10 min = warn |\n| `search_zero_results_total` | Counter | -- | Ratio > 8% 30 min = warn; **sudden 2x shift = page** (bad synonym!) |\n| `search_cache_hit_ratio` | Gauge | -- | \u003c 15% 15 min = warn (scraper ya cache down) |\n| `suggest_latency_seconds` | Histogram | `cached` | p99 > 100 ms 10 min = page |\n| `indexer_lag_seconds` | Histogram | -- | p99 > 60 s 5 min = **page** |\n| `bulk_index_errors_total` | Counter | `type` | > 0 warn; > 10/s page |\n| `es_cluster_status` | Gauge (0/1/2) | -- | 1 for 15 min = warn; **2 (red) = page** |\n| `es_jvm_heap_used_percent` | Gauge | `node` | > 80% 10 min = page |\n| `search_degraded_total` | Counter | `stage` | `stage=\"postgres\"` > 0 = **page** |\n| `outbox_oldest_unpublished_age_seconds` | Gauge | -- | > 120 s = **page** |\n| `partial_results_total` | Counter | `index` | > 0 for 2 min = **page** (silent partial!) |\n\n**Page vs warn ka rule:** page tabhi jab **user ko dard ho** ya **data chupchaap galat ja raha ho**. Yellow cluster user ko dard nahi deta -> warn. Silent partial results chupchaap galat data dete hain -> page.\n\n```\n# 1. Search p95 (uncached only -- yahi asli latency hai)\nhistogram_quantile(0.95, sum by (le) (rate(search_latency_seconds_bucket{cached=\"false\"}[5m])))\n\n# 2. Zero-result rate\nsum(rate(search_zero_results_total[10m])) / sum(rate(search_requests_total[10m]))\n\n# 3. Cache hit ratio\nsum(rate(search_requests_total{cached=\"true\"}[5m])) / sum(rate(search_requests_total[5m]))\n\n# 4. Indexer lag p99 -- SLA metric\nhistogram_quantile(0.99, sum by (le) (rate(indexer_lag_seconds_bucket[5m])))\n\n# 5. Node overhead = API latency - ES latency (kya Node hi slow hai?)\nhistogram_quantile(0.95, sum by (le) (rate(search_latency_seconds_bucket{cached=\"false\"}[5m])))\n  - histogram_quantile(0.95, sum by (le) (rate(es_query_duration_seconds_bucket[5m])))\n\n# 6. Degraded path abhi chal raha hai\nsum by (stage) (increase(search_degraded_total[1m])) > 0\n\n# 7. Slow shard detector -- ek node dusron se slow?\nmax by (node) (rate(elasticsearch_indices_search_query_time_seconds[5m])\n             / rate(elasticsearch_indices_search_query_total[5m]))\n\n# 8. Zero-result ka SUDDEN shift (bad synonym detector)\nabs(\n  (sum(rate(search_zero_results_total[15m])) / sum(rate(search_requests_total[15m])))\n  - (sum(rate(search_zero_results_total[15m] offset 2h)) / sum(rate(search_requests_total[15m] offset 2h)))\n) > 0.03\n```\n\n**Code Explanation:**\n\n- **#1** `{cached=\"false\"}` ke bina p95 jhoota dikhta hai. `sum by (le)` histogram quantile ke liye mandatory hai (buckets pehle jodo, phir quantile).\n- **#4** `histogram_quantile` on lag -- p99 chahiye, average nahi. Average 2 s ho sakta hai jabki 1% products 5 min late hon (jo aksar sabse important hote hain -- flash sale wale).\n- **#5** Ye **sabse kaam ki debugging query** hai. Antar achanak badhe toh ES theek hai aur problem **Node** mein hai: event loop lag, GC, serialization, connection pool.\n- **#8** `offset 2h` -- aaj ke rate ko 2 ghante pehle se compare karo. **Absolute threshold (> 5%) bad-synonym deploy ko miss kar sakta hai** agar baseline already 4% ho. **Sudden change hi asli signal hai.**\n\n### 3. ES slow log -- kaunsi query slow hai\n\nMetrics batate hain \"p99 kharab hai\". Slow log batata hai **\"ye wali query kharab hai.\"**\n\n```json\nPUT /products_v3/_settings\n{\n  \"index.search.slowlog.threshold.query.warn\":  \"500ms\",\n  \"index.search.slowlog.threshold.query.info\":  \"200ms\",\n  \"index.search.slowlog.threshold.fetch.warn\":  \"200ms\",\n  \"index.search.slowlog.threshold.fetch.info\":  \"100ms\",\n  \"index.indexing.slowlog.threshold.index.warn\": \"1s\"\n}\n```\n\n**Code Explanation:**\n\n- **Per-index** settings, **live** (restart nahi chahiye). `suggestions_v2` par bahut sakht rakho (`warn: 100ms`) kyunki uska budget hi 100 ms hai.\n- **`query` aur `fetch` alag kyun?** Ye ES ke do phase hain (Lever 6). `query` slow = matching/scoring mehengi (fuzzy expansion, bhaari aggs). `fetch` slow = **document retrieval** slow (bada `_source`, bada `size`, disk). **Do alag problems, do alag fixes.** Sirf \"query slow hai\" dekhoge toh galat jagah dhoondhoge.\n- Slow log ka time **per-shard** hai, poori query ka nahi. 600 ms wali entry matlab **us ek shard** ne 600 ms liye -- aur kyunki query = slowest shard, user ne bhi ~600+ ms dekhe.\n- Thresholds itne rakho ki din mein kuch sau lines aayein, hazaaron nahi. Warna koi nahi padhega.\n\n```\n[2026-09-18T20:14:03,221][WARN][index.search.slowlog.query] [data-node-3]\n[products_v3][4] took[812.4ms], took_millis[812], total_hits[48213 hits],\nsearch_type[QUERY_THEN_FETCH], total_shards[6],\nsource[{\"size\":24,\"query\":{\"function_score\":{...,\"fuzziness\":\"AUTO\"...}},\n\"aggs\":{\"brands\":{\"terms\":{\"field\":\"brand\",\"size\":10}},...}}]\n```\n\n| Field | Batata kya hai |\n|---|---|\n| `[data-node-3]` | Kaunsa node -- saari slow entries ek hi node se hain toh problem query nahi **node** hai |\n| `[products_v3][4]` | Index aur **shard 4** -- shard-level hotspot ka direct proof |\n| `took[812.4ms]` | **Sirf is shard ka** time |\n| `total_hits[48213]` | Itne docs match hue -- bahut zyada = query broad hai (shayad fuzzy expansion) |\n| `source[...]` | **Poori query.** Copy karke `\"profile\": true` ke saath chalao -- ES batayega kaunsa clause kitna time le raha hai |\n\n### 4. Har search request par kya log karein (aur kya nahi)\n\n```json\n{\"level\":\"info\",\"msg\":\"search\",\n \"q\":\"[EMAIL] case\",\"qNormalized\":\"email case\",\"redacted\":true,\n \"filters\":[\"brand\",\"priceRange\",\"inStock\"],\"sort\":\"relevance\",\"page\":1,\"size\":24,\n \"resultCount\":1204,\"totalIsLowerBound\":true,\n \"tookMs\":143,\"esTookMs\":98,\"cacheHit\":false,\"degraded\":false,\"shardsFailed\":0,\n \"userSegment\":\"returning\",\"sessionId\":\"s_9f2c\",\"requestId\":\"req_7f3a\",\"traceId\":\"4bf92f...\"}\n```\n\n| Field | Kyun |\n|---|---|\n| `q` (scrubbed) | Bina query ke koi search bug reproduce nahi hota |\n| `qNormalized` | Analytics grouping isi par (\"iPhone Case\" = \"iphone case\") |\n| `filters` (**keys only**) | Cardinality control: `[\"brand\"]` chalega, `[\"brand:Apple\"]` nahi |\n| `resultCount` | **Zero-result analysis ka dil** |\n| `tookMs` vs `esTookMs` | Antar = hamara overhead (PromQL #5 ka per-request version) |\n| `cacheHit` | Latency ko sahi bucket mein rakhne ke liye |\n| `shardsFailed` | Silent partial (failure #2) |\n| `sessionId` | CTR aur refinement chains ke liye -- pseudonymous |\n\n**[X] Kabhi nahi:** raw un-scrubbed `q` (PII/PCI), full user ID, poora IP (`/24` mask karo), `Authorization`/cookies, **poora ES response body** (24 hits x 2 KB = 50 KB per line x 20M/day = **logging system hi gir jaayega**), poora DSL har request par (ye slow log ka kaam hai), filter **values** as metric labels (cardinality explosion -- Rate Limiter Part 4 ka sabak).\n\n**Sampling:** **100% requests Kafka `search-queries` par** (ye analytics ka input hai), lekin **application logs** sirf **1% + har zero-result + har `degraded` + har `shardsFailed > 0`**. Jo interesting hai woh poora, jo normal hai woh sample.\n\n### 5. Search QUALITY -- woh dimension jo sab bhool jaate hain\n\n> **Ek search system jiska p99 50 ms hai aur zero-result rate 30% hai, woh ek fast failure machine hai.**\n\nLatency batati hai search **kaam kar rahi hai**. Quality batati hai search **kaam ki hai**. Spec ka analytics path (`search-queries` -> S3/warehouse -> popularity + synonyms + zero-result reports) exactly isi ke liye hai.\n\n| Quality metric | Kaise | Kya batata hai | Action |\n|---|---|---|---|\n| **Zero-result rate by query** | `GROUP BY qNormalized WHERE resultCount = 0` | Top 100 queries jinka jawab nahi hai | Har ek dekho (neeche triage) |\n| **CTR by position** | Search log + click events, `sessionId` se join | Position 1 ka CTR ~30%, 2 ka ~15% | **Position 1 ka CTR girna = ranking toot rahi hai** -- p99 se pehle ka signal |\n| **\"Searches with no click\"** | Search hua, koi result click nahi | **Results aaye par kaam ke nahi the** | Ye zero-result se **bada** problem hai kyunki dikhta nahi |\n| **Query -> refinement chains** | Ek session mein queries ka sequence | `\"shoes\"` -> `\"running shoes\"` -> `\"nike running shoes\"` -> click | Teen koshish lagi = pehli query ki ranking kharab |\n| **Reformulation rate** | 3+ queries bina click | Search baar-baar fail kar raha hai | Top offenders manually theek karo |\n| **Search -> cart -> order** | Funnel by query | **Business impact** -- leadership yahi samajhti hai | Relevance work ko justify karta hai |\n\n**Zero-result triage -- roz kaam aane wali table:**\n\n| Kahani | Example | Fix |\n|---|---|---|\n| **T
