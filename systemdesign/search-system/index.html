  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: var(--read-font); font-size: var(--font-size); line-height: 1.7; transition: background .2s, color .2s; }

  /* top bar */
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; gap: 8px;
            padding: 0 12px; background: var(--bar); border-bottom: 1px solid var(--border); z-index: 20;
            font-family: "Inter", -apple-system, "Segoe UI", sans-serif; font-size: 14px; backdrop-filter: blur(6px); }
  .topbar .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); text-align: center; }

  main blockquote { margin: 1.2em 0; padding: 0.5em 1em; background: var(--callout); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; }
  main code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 0.8em; background: var(--code-bg); padding: 2px 5px; border-radius: 4px; }
  main pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; line-height: 1.5; }

  .toc-part li a { display: block; padding: 5px 18px 5px 30px; color: var(--muted); text-decoration: none; }

<script type="application/json" id="book-data">{"title":"Search System","parts":[{"label":"Basics -> Requirements -> Estimation -> HLD","md":"# Search System -- HLD + LLD (Part 1: Basics -> Requirements -> Estimation -> HLD)\n\n> Is file mein prompt ke **Parts 1-6** hain: problem ko bilkul zero se samajhna (inverted index by hand banayenge), requirements, clarifying questions, capacity estimation, HLD, aur har component ka WHY.\n> Next file: search aur indexing ka complete request flow, API design, Postgres + Elasticsearch mapping, LLD folder structure, aur Node.js/TypeScript code line-by-line.\n>\n> **Pichhle systems se connection:**\n> **URL Shortener** mein lookup **exact** tha -- `short_code = 'aB92x'` -> ek row. Ek B-tree ya hash index kaafi tha, koi \"kaun sa result better hai\" wala sawaal hi nahi tha. Yahan query ek **text** hai (`iphone case`), ek query **hazaaron** documents match karti hai, aur unhe **rank** karna padta hai. Isliye data structure hi alag chahiye.\n> **Rate Limiter** yahan seedha reuse hoga: search API par per-IP token bucket (competitor scrapers din bhar price scrape karte hain), aur autocomplete par alag (zyada) limit kyunki har keystroke ek request hai.\n> **Notification / Paging** mein humne Kafka + outbox pattern dekha tha -- wahan events **incidents** banate the. Yahan bilkul wahi pattern hai, bas consumer alag hai: events **index updates** banate hain.\n\n---\n\n## PART 1 -- Problem ko bilkul basic se samjho\n\n### Ek kahani se shuru karte hain\n\nHum ek marketplace bana rahe hain -- Flipkart / Amazon / Myntra style. 20,000 sellers, aur catalog mein aaj **50 million products** hain.\n\nDo saal pehle, jab catalog mein sirf 50,000 products the, search feature ek developer ne 20 minute mein likh diya tha:\n\n```sql\nSELECT * FROM products WHERE name ILIKE '%iphone case%' LIMIT 20;\n```\n\nAur sach ye hai -- **ye kaam karta tha**. 50,000 rows scan karna Postgres ke liye kuch bhi nahi, 30-40 ms mein result aa jaata tha. Kisi ne complain nahi kiya.\n\nAaj catalog 50M hai. Aur do alag-alag cheezein toot gayi hain. Interview mein sabse badi galti yahi hoti hai ki log in dono ko ek hi problem samajh lete hain. **Ye do alag problems hain.**\n\n### Problem 1 -- SPEED (query 8 se 12 second leti hai)\n\n`ILIKE '%iphone case%'` mein pattern ke **shuru mein wildcard** hai (`%`). Isko **leading wildcard** kehte hain.\n\nB-tree index ek sorted phone-book jaisa hota hai. Phone book mein tum \"Sharma\" dhoondh sakte ho kyunki tumhe pata hai ki `S` kahan milega. Lekin agar main bolun \"aise saare naam dhoondho jinke **beech** mein `harm` aata hai\" -- toh phone book ki sorting bekaar ho gayi. Tumhe **har page** padhna padega.\n\nDatabase ke saath exactly yahi hota hai:\n\n```\nQuery: name ILIKE '%iphone case%'\n\nPostgres planner ka decision:\n  Index Scan?   -> nahi kar sakta, leading wildcard hai\n  Seq Scan      -> 50,000,000 rows padho, har row par string match chalao\n\nRows scanned      : 50,000,000\nBytes read        : ~100 GB (title + description)\nTime              : 8-12 seconds\nDB CPU            : 100% ek core par, aur har concurrent search ek aur core khaata hai\n```\n\nAur yahan asli disaster shuru hota hai. Ye DB **sirf search ke liye nahi hai** -- isi DB par orders, cart, checkout, seller dashboard sab chalta hai.\n\n```\n10 users ne ek saath search kiya\n      -> 10 sequential scans, 10 cores busy, buffer cache poora product pages se bhar gaya\n      -> checkout ki chhoti si query (jo normally 2 ms leti thi) ab 800 ms le rahi hai\n      -> connection pool full\n      -> \"Add to cart\" fail ho raha hai\n      -> search ne poori website gira di\n```\n\n> **Yaad rakho:** search ki problem sirf \"search slow hai\" nahi hoti. Search DB ko itna busy kar deta hai ki **baaki sab kuch** slow ho jaata hai. Isliye search ka data usually main DB se **bahar** nikaal diya jaata hai.\n\n### Problem 2 -- RELEVANCE (result bilkul bekaar hai)\n\nMaan lo speed ka problem magically solve ho gaya. Phir bhi result kharab hai. Kyun?\n\nKyunki **SQL `LIKE` boolean hai**: match hua ya nahi hua. Bas. Usme \"kaun sa result zyada relevant hai\" ka **concept hi nahi hai**.\n\nPehla issue: `'%iphone case%'` ek **literal substring** dhoondhta hai. Toh \"Spigen iPhone 15 Pro Case\" match hi nahi karega, kyunki usme \"iphone case\" aas-paas nahi hai. Result almost empty.\n\nToh developer ne ise \"fix\" kiya -- words tod ke OR laga diya:\n\n```sql\nSELECT * FROM products\nWHERE name ILIKE '%iphone%' OR name ILIKE '%case%'\nORDER BY created_at DESC LIMIT 20;\n```\n\nAb results toh aate hain. Lekin ye aate hain:\n\n```\nUser ne search kiya: \"iphone case\"\n\n1. Apple iPhone 15 Pro Max 256GB Blue Titanium   Rs 1,59,900   \u003c- ye case nahi hai\n2. iPhone 15 Screen Protector Tempered Glass      Rs 299        \u003c- ye bhi case nahi\n3. Laptop Case 15.6 inch Grey                     Rs 899        \u003c- ye iPhone ka nahi\n4. Camera Case Waterproof for DSLR                Rs 1,499      \u003c- kuch lena dena nahi\n5. iPhone Lightning Cable 1m                      Rs 799\n...\n17. Spigen iPhone 15 Case Rugged Armor Black      Rs 1,299      \u003c- ASLI JAWAB, position 17\n```\n\nUser ne 5 results dekhe, kuch nahi mila, aur **bounce** kar gaya. Ye seedha revenue loss hai.\n\nProblem kya hai? `ORDER BY created_at DESC` ke alawa hamare paas **koi option hi nahi tha**, kyunki SQL ke paas koi number hi nahi hai jo bole \"ye result us result se better hai\". Ek document ne query match ki -- bas, wo `true` hai. \"Kitna\" match ki, ye SQL ko nahi pata.\n\nAur do aur problems isi family ke hain:\n\n**Typos:**\n```sql\nname ILIKE '%iphon cover%'   ->   0 rows\n```\nUser ne bas ek letter miss kiya (`iphon`), aur website ne bol diya \"kuch nahi mila\". Real e-commerce traffic mein **~10% queries mein typo** hota hai. Har typo = ek lost customer.\n\n**Word forms aur case:**\n```\nTitle \"Mobile Charger\",  user: \"mobiles charger\"  -> NO MATCH  (plural)\nTitle \"Shoes for Runners\", user: \"running shoes\"  -> NO MATCH  (word form)\nTitle \"Mobile Phone\",    user: \"smartphone\"       -> NO MATCH  (synonym)\n```\n\nSQL ko **bhasha ka koi gyaan nahi hai**. Usko `mobile` aur `mobiles` do alag strings lagti hain. `run`, `running`, `runner` teen alag cheezein hain. `smartphone` aur `mobile` ka koi rishta nahi.\n\n### Do problems -- do alag jawab\n\n| Problem | Root cause | Solution |\n|---|---|---|\n| **Speed** -- 50M rows scan | Text ke liye B-tree kaam nahi karta | **Inverted index** |\n| **Relevance** -- best result 17th par | `LIKE` boolean hai, koi score nahi | **Scoring / ranking (BM25)** |\n\nSearch engine (Elasticsearch) ka poora wajood in **do** cheezon ke liye hai. Baaki sab (facets, autocomplete, typo tolerance) inhi do ke upar bana hua hai.\n\n### Inverted index kya hai -- 5 products par HAATH SE bana ke dekhte hain\n\n**Term (naya word):** analyzer ke through nikla hua ek searchable word. Jaise \"Red Cotton Shirt\" se terms nikalte hain `red`, `cotton`, `shirt`.\n\n**Analyzer (naya word):** ek pipeline jo raw text ko terms mein todti hai. Steps: lowercase -> **tokenizer** (space/punctuation par todna) -> stop words hataana (`for`, `the`, `a` -- inka koi search value nahi) -> **stemmer** (word ko uski root form mein lana: `shirts` -> `shirt`, `running` -> `run`).\n\nHamare paas 5 products hain:\n\n```\nP1: \"Red Cotton Shirt for Men\"\nP2: \"Blue Cotton Shirts\"\nP3: \"Red Silk Saree\"\nP4: \"Cotton Pants Blue\"\nP5: \"Men Leather Wallet\"\n```\n\nAnalyzer chalao (lowercase -> tokenize -> stop word `for` hatao -> stem `shirts` -> `shirt`, `pants` -> `pant`):\n\n```\nP1 -> [red, cotton, shirt, men]\nP2 -> [blue, cotton, shirt]\nP3 -> [red, silk, saree]\nP4 -> [cotton, pant, blue]\nP5 -> [men, leather, wallet]\n```\n\nAb table **ulta** (invert) kar do -- doc se terms ki jagah, **term se docs**:\n\n| Term | Posting list (kaunse docs mein hai) |\n|---|---|\n| blue | P2, P4 |\n| cotton | P1, P2, P4 |\n| leather | P5 |\n| men | P1, P5 |\n| pant | P4 |\n| red | P1, P3 |\n| saree | P3 |\n| shirt | P1, P2 |\n| silk | P3 |\n| wallet | P5 |\n\n**Posting list (naya word):** ek term ke saamne wali doc IDs ki **sorted** list. Real engine isme thoda aur rakhta hai: har doc mein term kitni baar aaya (`freq`) aur kis position par aaya (`positions` -- phrase search ke liye).\n\nAb query chalao: **\"cotton shirt\"**\n\n```\nStep 1: query ko usi analyzer se guzaro -> [cotton, shirt]\nStep 2: dono ki posting lists uthao\n          cotton -> [P1, P2, P4]\n          shirt  -> [P1, P2]\nStep 3: dono sorted hain, toh merge-walk karke INTERSECT karo\n          P1 dono mein hai [OK]\n          P2 dono mein hai [OK]\n          P4 sirf cotton mein [X]\nStep 4: candidates = [P1, P2]\n```\n\nHumne kitna kaam kiya? **5 doc IDs padhe.** Postgres ne isi cheez ke liye 5 documents ki poori text padhi hoti. 5 par farak nazar nahi aata. 50M par:\n\n```\nPostgres ILIKE : 50,000,000 rows ki poori text padho     -> 8-12 s\nInverted index : \"cotton\" ki list (maan lo 80,000 docs)\n                 aur \"shirt\" ki list (maan lo 40,000 docs)\n                 dono sorted, skip-list ke saath intersect  -> ~5-20 ms\n```\n\n> **Ye hai poora raaz.** Inverted index query time par kaam nahi karta -- wo **index time par** kaam kar chuka hota hai. Postgres ka `ILIKE '%x%'` inme se **kuch bhi** nahi kar sakta: na term nikale hue hain, na stem hue hain, na sorted lists hain. Usko har row padhni hi padti hai.\n\nAur relevance? Ab hamare paas har term ke saath **freq** hai aur ye pata hai ki term kitne documents mein aata hai. In dono se ek **score** nikalta hai (BM25) -- \"cotton\" har 5th product mein hai toh wo common hai, uska weight kam; \"saree\" sirf 1 product mein hai toh wo rare hai, uska weight zyada. **Rare term match hona bada signal hai.** Ye poora scoring math Part 3 file mein zero se karenge.\n\n**Relevance (naya word):** ek number (score) jo batata hai ki ye document is query ke liye kitna acha jawab hai. Iske bina \"sorting by relevance\" ka koi matlab hi nahi banta.\n\n### Toh ye system actually karta kya hai?\n\nSearch system ka kaam: **user ke kuch words lo, 50M documents mein se wo chuno jo match karte hain, unhe best-first order mein lagao, aur 200 ms ke andar 24 results + filters wapas do.**\n\nTeen cheezein saath mein deni hain:\n\n1. **Autocomplete** -- user `iph` type kar raha hai, 100 ms ke andar 10 suggestions.\n2. **Results** -- Enter dabaya, ranked products.\n3. **Facets** -- left side mein filters with counts: \"Samsung (1,204)\", \"Apple (890)\", price ranges, rating.\n\n**Facet (naya word):** ek filter option jiske saath **count** bhi hota hai. Sirf \"Apple\" nahi -- \"Apple (890)\". Count isliye zaroori hai kyunki user ko pehle hi pata chal jaata hai ki filter lagane par kuch bachega ya screen khaali ho jaayegi.\n\n### Real life mein iska example kya hai?\n\n| Product | Search kya karta hai | Special baat |\n|---|---|---|\n| **Amazon / Flipkart** | Product search + facets + sponsored slots | Business ranking bahut strong -- popularity, in-stock, ads |\n| **Airbnb** | Location + date + filters | Geo search (lat/long), availability calendar |\n| **GitHub code search** | Code ke andar text | Analyzer normal english nahi -- code tokenization |\n| **Zomato / Swiggy** | Restaurant + dish search | Geo + \"abhi khula hai\" jaisa real-time filter |\n| **Gmail search** | Apne hi mails mein | Per-user index, privacy strict |\n\nSabka core wahi do cheezein hai: inverted index + scoring. Upar ka business logic alag hai.\n\n### User kya bhejta hai, wapas kya milta hai?\n\n**Autocomplete request (har keystroke ke baad, 150 ms debounce):**\n```\nGET /api/v1/suggest?q=iph&limit=10\n\n200 OK  (p99 target: \u003c 100 ms)\n{\n  \"suggestions\": [\n    { \"text\": \"iphone 15\",        \"type\": \"query\" },\n    { \"text\": \"iphone case\",      \"type\": \"query\" },\n    { \"text\": \"iphone charger\",   \"type\": \"query\" },\n    { \"text\": \"Mobile Accessories\", \"type\": \"category\" }\n  ]\n}\n```\n\n**Search request (Enter dabane par):**\n```\nGET /api/v1/search?q=iphone+case&brand=Apple&priceMin=500&priceMax=2000&inStock=true&sort=relevance&page=1&size=24\n\n200 OK  (p95 target: \u003c 200 ms)\n{\n  \"hits\": [\n    { \"productId\": \"a1b2...\", \"title\": \"Spigen iPhone 15 Case Rugged Armor\",\n      \"brand\": \"Spigen\", \"price\": 1299, \"rating\": 4.4, \"inStock\": true, \"score\": 18.62 },\n    ...24 tak\n  ],\n  \"total\": 10000,\n  \"totalIsLowerBound\": true,\n  \"facets\": {\n    \"brands\":      [ { \"value\": \"Spigen\", \"count\": 1204 }, { \"value\": \"Apple\", \"count\": 890 } ],\n    \"categories\":  [ { \"value\": \"electronics/mobiles/accessories\", \"count\": 3120 } ],\n    \"priceRanges\": [ { \"value\": \"0-500\", \"count\": 410 }, { \"value\": \"500-2000\", \"count\": 2210 } ]\n  },\n  \"tookMs\": 74\n}\n```\n\nDo cheezein notice karo:\n- `\"score\": 18.62` -- **ye wo number hai jo SQL kabhi de hi nahi sakta tha.** Isi se sorting ho rahi hai.\n- `\"total\": 10000, \"totalIsLowerBound\": true` -- matlab \"10,000+ results\". Exact total nikalna mehenga hai (saare matching docs count karne padte hain), aur user ko kabhi farak nahi padta ki 84,312 hai ya 84,313. Amazon bhi tumhe exact number nahi dikhata.\n\n### Search engine kya karta hai / kya NAHI karta\n\nYe table interview mein bahut kaam aata hai:\n\n| Search engine (Elasticsearch) kya karta hai | Kya NAHI karta / hona chahiye |\n|---|---|\n| Text ko terms mein todta hai (analyzer) | **Source of truth NAHI hai.** Wo Postgres hai. ES ek derived copy hai. |\n| Inverted index rakhta hai (term -> posting list) | **Database NAHI hai.** Isme joins, foreign keys, constraints nahi hain. |\n| Har match ko score deta hai (BM25) | **Transactional NAHI hai.** Koi ACID transaction, rollback nahi. |\n| Facet counts nikalta hai (aggregations) | **Strongly consistent NAHI hai.** Likhne ke baad ~1 s tak wo doc search mein nahi dikhta (refresh interval). |\n| Typo tolerance, synonyms, stemming | **Order/payment data ke liye NAHI.** Paise ka hisaab kabhi ES se mat padho. |\n| Shards mein horizontally scale hota hai | **Cheap NAHI hai.** RAM-heavy hai; index size cost hai. |\n\n> **Sabse important line jo interview mein bolni hai:** \"Elasticsearch mere liye ek **derived, rebuildable index** hai. Agar poora ES cluster kal delete ho jaaye, toh main Postgres se reindex karke wapas bana sakta hoon. Ulta nahi ho sakta.\" Ye ek line bata deti hai ki tumne production search chalaya hai.\n\n### Interview mein 30 seconds mein kya bolun?\n\n> \"Search system do alag problems solve karta hai, aur main dono ko alag-alag treat karunga. Pehla speed: `LIKE '%term%'` B-tree index use nahi kar sakta, toh 50 million products par wo full table scan hai -- 8 se 12 second, aur wo DB ko itna busy kar deta hai ki checkout bhi slow ho jaata hai. Iska jawab **inverted index** hai: index time par text ko terms mein tod ke har term ke saamne uski sorted doc list rakhte hain, aur query time par bas do choti lists intersect karte hain. Doosra problem relevance: SQL `LIKE` boolean hai, usme 'kaun sa result better hai' ka concept hi nahi. Iska jawab **BM25 scoring** hai, jiske upar business boosts lagte hain -- popularity, in-stock, seller rating. Architecture mein main Postgres ko source of truth rakhunga aur Elasticsearch ko derived index, jo **outbox pattern se Kafka ke through** update hota hai -- dual write nahi, warna DB aur index permanently diverge ho jaate hain. Search API ke aage Redis cache rakhunga head queries ke liye, aur autocomplete ke liye ek alag chhota edge n-gram index, kyunki autocomplete traffic search se char guna zyada hota hai.\"\n\n---\n\n## PART 2 -- Requirements\n\n### Functional Requirements (system kya karega)\n\n**1. Full-text search on `q`**\n\nUser kuch bhi type kar sakta hai, system ko samajhna hai.\n\n| Feature | Example | Bina iske kya hota |\n|---|---|---|\n| **Typo tolerance** | `iphon` -> `iphone` match ho | `iphon cover` par zero results, user gaya |\n| **Stemming** | `mobiles` ~ `mobile`, `running` ~ `run` | \"running shoes\" par \"Shoes for Runners\" miss |\n| **Synonyms** | `mobile` = `smartphone` = `cell phone` | User ki bhasha aur seller ki bhasha match nahi karti |\n| **Multi-word phrase** | `red cotton shirt` -- sab words matter karte hain, aur saath mein hon toh aur better | Sirf ek word match karke kuda-karkat aa jaata hai |\n\n**2. Filters (facets)** -- category, brand, price range, rating >= X, in-stock only, seller rating, discount %.\n\nExample: `?brand=Apple&priceMin=500&priceMax=2000&inStock=true`\n\n**3. Facet counts** -- har filter ke aage number: \"Samsung (1,204)\", \"Apple (890)\".\n\nYe ek alag technical kaam hai, sirf filtering nahi. Filter karne ke liye 24 results chahiye. Count nikalne ke liye **saare matching documents** par group-by chalana padta hai. Isi liye ye latency budget mein 20-40 ms alag se khaata hai.\n\n**4. Sorting** -- relevance (default), price asc, price desc, newest, rating, popularity.\n\nImportant: jab user \"price low to high\" chunta hai toh **scoring ka kaam bekaar ho jaata hai** (score use hi nahi ho raha). Ye ek optimization opportunity hai.\n\n**5. Pagination** -- page 1 se 5 tak normal `from/size`, usse aage **`search_after`**.\n\nKyun? Deep pagination ek classic distributed problem hai: page 500 maangne par har shard ko `from + size` = 12,024 docs coordinating node ko bhejne padte hain, aur wo unhe merge karta hai. 6 shards x 12,024 = 72,144 docs ek node ki memory mein. Isliye ES ka default `index.max_result_window: 10000` hai. Detail Part 3 mein.\n\n**6. Autocomplete** -- har keystroke par top 10 suggestions, **p99 \u003c 100 ms**.\n\n100 ms kyun? Kyunki user type karta rehta hai. Agar suggestion 300 ms mein aayi toh tab tak user 2 aur letters type kar chuka hai -- suggestion galat prefix ki ho gayi, useless.\n\n**7. Near-real-time indexing** -- seller product update kare -> search mein **\u003c= 30 second** mein dikhe.\n\nPrice aur stock ke liye ye rule stricter hai (business reason neeche NFR mein).\n\n**8. Business ranking** -- text relevance ke **upar** business boosts:\n- `inStock` product upar (out-of-stock dikhana user ka time waste hai)\n- `popularityScore` (last 30 days ke orders se)\n- seller rating\n- \"Sponsored\" slots -- top 2 par, **clearly marked**\n\n**9. Analytics** -- har query log ho: query text, results count, user ne kis position par click kiya.\n\nYe sirf reporting nahi hai, ye **system ka feedback loop** hai:\n- **Zero-result rate** -> pata chalta hai kaunse synonyms missing hain\n- **CTR per position** -> pata chalta hai ranking sahi hai ya nahi\n- **Query popularity** -> autocomplete suggestions aur `popularityScore` dono isse bante hain\n\n### Non-Functional Requirements (aur ye yahan KYUN important hai)\n\n| Requirement | Target | Is system mein KYUN important hai |\n|---|---|---|\n| **Latency** | search p95 \u003c 200 ms, p99 \u003c 400 ms; autocomplete p99 \u003c 100 ms | Search ek **interactive** feature hai -- user wait kar raha hai, screen khaali hai. Amazon ka classic data point: **100 ms extra latency = ~1% sales drop**. Ye NFR yahan directly revenue hai, \"nice to have\" nahi. |\n| **Availability** | 99.95% | Search down = user homepage se aage badh hi nahi sakta = **shopping zero**. Isliye sirf \"ES ko HA banao\" kaafi nahi -- ek **fallback path** chahiye (Redis se stale results, phir Postgres degraded search). Rate Limiter mein \"fail open vs fail closed\" tha; yahan wo ban jaata hai **\"degrade, don't die\"**. |\n| **Consistency** | Eventual (\u003c= 30 s) acceptable | Naya product 30 s baad search mein dikhe -- bilkul chalega, koi user ko pata bhi nahi chalega. **LEKIN** stale **price/stock** ek business problem hai: user ne Rs 999 dekha, cart mein daala, checkout par Rs 1,299 -- trust gaya, aur kuch jagah legal issue bhi. Isliye price/stock ka special treatment hoga. |\n| **Scalability** | 50M docs, traffic 4x peak, sale day 20x | Big Billion Day par traffic 20x. Design peak ke liye hota hai, average ke liye nahi. |\n| **Durability** | ES ke liye **zaroori nahi** | Ye ek badi baat hai: ES data kho jaaye toh bhi theek, kyunki **Postgres source of truth hai aur hum reindex kar sakte hain**. Isliye ES ke liye backup strategy utni critical nahi jitni Postgres ke liye. |\n| **Cost** | ES RAM-heavy | ES ka performance JVM heap + OS page cache par depend karta hai. Nodes ka size aur shard count seedha monthly bill hai. Ye ek real design constraint hai, afterthought nahi. |\n| **Security** | Rate limiting, input validation | Competitors scrapers chalate hain (pura catalog + price nikalne ke liye). `q` par max length limit -- lambi query = mehengi fuzzy expansion = cheap DoS. |\n\n### v1 mein ye NAHI hai (clearly bolo)\n\n| Feature | Kyun nahi (abhi) |\n|---|---|\n| **Personalization** (per-user results) | Ye **query cache ko kill kar deta hai** -- har user ke liye alag result matlab cache hit ratio ~0%. Aur iske liye user behaviour data pipeline chahiye. v3. |\n| **Semantic / vector search** (embeddings + kNN) | \"cheap phone for my mother\" jaisi queries ke liye badhiya hai, lekin embedding pipeline + kNN index + GPU cost = apna ek poora project. Mention karo as \"modern addition\", v1 mein mat lo. |\n| **Learning-to-Rank (LTR)** | ML model se ranking. Iske liye pehle **click data chahiye** -- jo hamara analytics path abhi collect karna shuru kar raha hai. Pehle data, phir model. |\n| **Image search** | Alag domain (CV model). |\n| **Multi-language** | Har language ka apna analyzer + stemmer chahiye, aur usually alag field ya alag index. v1 English. |\n\n> Interview line: \"v1 mein main personalization aur vector search deliberately nahi le raha. Personalization isliye ki wo query cache ko tod deta hai aur mera 30% cache hit ratio chala jaayega. LTR isliye ki uske liye click data chahiye jo main abhi collect karna shuru kar raha hoon -- pehle data pipeline, phir model.\"\n\n---\n\n## PART 3 -- Clarifying Questions\n\nArchitecture banane se pehle ye poochho. **Har jawab design badal deta hai** -- ye dikhana hi is section ka point hai.\n\n| # | Question | Ye KYUN pooch raha hoon | Answer design ko kaise badlega |\n|---|---|---|---|\n| 1 | **Catalog mein kitne documents hain?** | Ye single sabse bada decision hai -- ES chahiye bhi ya nahi | 100K -> Postgres FTS kaafi. 5-10M+ -> ES. 50M -> ES, aur shard planning ki zarurat |\n| 2 | **Documents kitni tezi se update hote hain?** | Indexing pipeline ka design isi se banta hai | Din mein ek baar -> nightly batch reindex, bahut simple. Continuous (5M/day) -> Kafka + outbox + bulk workers |\n| 3 | **Search QPS kitna hai? Peak kya hai?** | ES cluster ki size aur replica count | 50 QPS -> 3 nodes. 1,000 QPS peak -> 6 data nodes + replicas (replicas reads bhi serve karte hain) |\n| 4 | **Autocomplete chahiye?** | Ye ek **alag system** hai, search ka feature nahi | Haan -> alag lightweight index + Redis prefix cache. Ye traffic ka sabse bada hissa hai |\n| 5 | **Facet counts chahiye?** | Ye Postgres vs ES ka decision flip kar sakta hai | Haan -> ES lagbhag mandatory. Postgres mein har filter ke liye alag `COUNT(*)` query = 6-8 queries per search |\n| 6 | **Typo tolerance expected hai?** | Fuzzy matching mehenga hai aur latency budget khaata hai | Haan -> `fuzziness: AUTO` + `prefix_length: 1`. Nahi -> query 2-3x sasti |\n| 7 | **Update kitni jaldi search mein dikhna chahiye?** | Ye poore indexing path ka SLA hai | 1 hour -> simple cron. 30 s -> streaming pipeline. 1 s -> bahut mehenga, poochho ki really chahiye kya |\n| 8 | **Multi-language?** | Analyzer per-language hota hai | Sirf English -> ek analyzer. Multi -> per-language fields ya indices, index size multiply hota hai |\n| 9 | **Personalization chahiye?** | Ye caching strategy decide karta hai | Nahi -> query-level Redis cache chalega (30% hit). Haan -> cache almost useless, aur ek user-profile service chahiye |\n| 10 | **Relevance ka owner kaun hai? Business boosts / sponsored?** | Ye pure tech nahi, product decision hai | Business boosts chahiye -> `function_score` layer. Sponsored -> alag ads service, **organic ranking ke andar mix mat karo** |\n| 11 | **Existing DB kya hai? Uspar kitna load hai?** | Source of truth aur migration path | Postgres -> outbox pattern natural. MySQL -> Debezium CDC. Aur agar DB already 80% CPU par hai toh search ko usse hataana urgent hai |\n| 12 | **Kya sale events hote hain?** | Peak sizing 4x hai ya 20x | Big Billion Day 20x -> autoscaling plan + pre-scaling runbook + cache warming |\n\n### Agar interviewer bole: \"50 million products, 20 million searches per day\"\n\nAb numbers mil gaye. Ye badal jaata hai:\n\n| Area | Chhota scale (100K products, 50 QPS) | 50M products, 20M searches/day |\n|---|---|---|\n| **Search engine** | Postgres `tsvector` + GIN index | **Elasticsearch cluster**, 6 primary shards + 1 replica |\n| **Nodes** | Kuch bhi nahi, wahi DB | 6 data nodes (64 GB RAM, 31 GB heap) + 3 dedicated master nodes |\n| **Indexing** | `UPDATE` ke saath hi trigger | **Postgres outbox -> Kafka -> indexer workers -> ES bulk API** |\n| **Autocomplete** | `LIKE 'iph%'` (leading wildcard nahi hai, toh B-tree chalta hai!) | Alag **edge n-gram index** + Redis prefix cache |\n| **Caching** | Zaroorat nahi | Redis head-query cache, 60 s TTL, ~30% hit ratio |\n| **Failure** | DB down = sab down | ES down -> Redis stale -> Postgres degraded -> 503. `degraded: true` flag |\n| **Reindex** | `REINDEX` chala do | Alias swap (`products_v3`), zero downtime |\n\n### Aur ab **ulta** sawaal (ye interview mein bahut strong lagta hai)\n\n> **\"Agar catalog mein sirf 100,000 products hain, toh main Elasticsearch use hi nahi karunga.\"**\n\nKyun? Ek ES cluster chalane ka matlab hai: 6+ nodes, JVM tuning, shard management, cluster health monitoring, reindex runbooks, aur ek poora **naya consistency problem** (DB aur index ko sync rakhna). 100K products ke liye ye insane overhead hai.\n\n100K par Postgres full-text search **bilkul kaafi hai**:\n\n```sql\n-- Step 1: ek tsvector column banao (generated, hamesha auto-update)\nALTER TABLE products ADD COLUMN search_vector tsvector\n  GENERATED ALWAYS AS (\n    setweight(to_tsvector('english', coalesce(title, '')),       'A') ||\n    setweight(to_tsvector('english', coalesce(brand, '')),       'B') ||\n    setweight(to_tsvector('english', coalesce(description, '')), 'C')\n  ) STORED;\n\n-- Step 2: GIN index -- Postgres ka apna inverted index\nCREATE INDEX products_search_idx ON products USING GIN (search_vector);\n\n-- Step 3: search + ranking\nSELECT id, title, ts_rank(search_vector, plainto_tsquery('english', 'iphone case')) AS rank\nFROM products\nWHERE search_vector @@ plainto_tsquery('english', 'iphone case')\nORDER BY rank DESC\nLIMIT 20;\n\n-- Step 4: typo tolerance ke liye trigram index\nCREATE EXTENSION IF NOT EXISTS pg_trgm;\nCREATE INDEX products_title_trgm ON products USING GIN (title gin_trgm_ops);\n\nSELECT id, title, similarity(title, 'iphon cover') AS sim\nFROM products\nWHERE title % 'iphon cover'          -- % operator = trigram similarity threshold\nORDER BY sim DESC\nLIMIT 20;\n```\n\n**Code Explanation:**\n\n- `to_tsvector('english', title)` -- Postgres ka analyzer. Ye wahi kaam karta hai jo humne haath se kiya tha: lowercase, tokenize, stop words hataana, stemming. `'english'` config batata hai ki english ke rules lagao (`mobiles` -> `mobil`).\n- `setweight(..., 'A')` -- title ko weight A (sabse zyada), brand ko B, description ko C. Yahi cheez ES mein `\"fields\": [\"title^3\", \"brand^2\", \"description\"]` se hoti hai. Matlab title mein match hona description mein match hone se **zyada important** hai.\n- `||` -- teeno tsvectors ko jodta hai ek column mein.\n- `GENERATED ALWAYS AS (...) STORED` -- Postgres khud maintain karega. Row update hoti hai toh `search_vector` apne aap update ho jaata hai. **Ye bahut bada fayda hai: koi sync problem hi nahi hai, koi outbox/Kafka nahi chahiye.**\n- `USING GIN` -- GIN = Generalized Inverted Index. Haan, Postgres ke paas apna inverted index hai. Ye wahi `term -> doc list` structure banata hai.\n- `@@` -- \"match karta hai?\" operator. Ye GIN index use karta hai.\n- `ts_rank(...)` -- Postgres ka relevance score. Ye BM25 jitna acha nahi hai lekin `ORDER BY created_at` se **infinitely** better hai.\n- `pg_trgm` -- word ko 3-letter chunks mein todta hai (`iphone` -> `iph`, `pho`, `hon`, `one`). Typo wale word ke bhi zyadatar trigrams same rehte hain, isliye `iphon` `iphone` se match kar jaata hai.\n- `%` operator -- trigram similarity ek threshold se upar hai ya nahi.\n\n**Toh phir ES kab lagao?** Jab in chaaron mein se koi bhi sach ho:\n\n| Trigger | Kyun Postgres FTS fail karta hai |\n|---|---|\n| **(a) Documents > ~5-10M** | GIN index bada ho jaata hai, aur index update slow (GIN writes mehengi hoti hain). Aur scale karne ke liye sharding khud karni padegi |\n| **(b) Facet counts chahiye** | Har facet ke liye alag `GROUP BY` query. 6 facets = 6 extra queries, har ek poore result set par. ES ye ek hi request mein karta hai |\n| **(c) Relevance tuning / typo / synonyms chahiye** | `ts_rank` tune nahi kar sakte. Synonym support basic hai. Fuzzy aur FTS ko ek saath ranked karna painful |\n| **(d) Search traffic DB ko hurt kar raha hai** | Ye sabse practical reason hai. Search queries buffer cache khaati hain aur checkout slow ho jaata hai. Search ko **alag system** mein bhejna hi asli fayda hai |\n\n> Interview line: \"Main pehle poochunga catalog size kitna hai. Agar 100K hai toh main Elasticsearch nahi laaunga -- Postgres `tsvector` + GIN + `pg_trgm` kaafi hai, aur uska sabse bada fayda ye hai ki wahan **koi sync problem hi nahi** hai. Main ES tab laaunga jab documents crore mein jayein, facet counts chahiye, relevance tuning chahiye, ya search traffic transactional DB ko nuksaan kar raha ho. Is question mein 50 million products aur facets dono hain, toh ES justified hai.\"\n\n---\n\n## PART 4 -- Capacity Estimation\n\nGoal wahi hai jo pehle systems mein tha: exact number nahi, **order of magnitude**. Lekin is system mein estimation seedha infra decide karti hai -- shard count, node count, cache strategy. Isliye har step ke baad poochenge: **ye number architecture mein useful kahan hai?**\n\n**Assume (interviewer se confirm karo):**\n- 50M products, 20,000 sellers\n- 20M searches/day\n- 5M product updates/day\n- Peak = 4x average, sale day = 20x\n- 1 din = 86,400 seconds\n\n### Step 1 -- Index size\n\n```\nEk searchable document mein kya hai?\n  title, description snippet, brand, categoryPath, attributes,\n  price, stock, ratings, popularityScore, timestamps\n\nEk doc ka size            = ~2 KB\nRaw data                  = 50,000,000 x 2 KB = 100,000,000 KB = ~100 GB\n```\n\nLekin index size raw size se **zyada** hota hai. ES teen cheezein store karta hai:\n1. **Inverted index** (terms + posting lists)\n2. **Doc values** -- column-oriented storage, sorting aur aggregations (facet counts) ke liye\n3. **`_source`** -- original JSON, taaki result mein wapas de sake\n\n```\nES index size             = ~1.3 x source = 130 GB primary data\n```\n\n**Ye number architecture mein useful kahan hai?** Ye hamara **starting point** hai poore cluster sizing ka. Agla har number isi se nikalta hai. Aur ye bata deta hai ki ye \"ek server par chala lo\" wala kaam nahi hai.\n\n### Step 2 -- Shards\n\n**Shard (naya word):** index ka ek tukda -- ek self-contained mini inverted index jo ek node par rehta hai. Index ko shards mein isliye baanta jaata hai taaki (a) data ek node se bada ho sake, aur (b) ek query saare shards par **parallel** chal sake.\n\nShard sizing ka practical rule: **25-40 GB per shard**.\n- Bahut chhote shards (2 GB) -> har query ka fixed overhead x bahut saare shards = slow, aur cluster state bloat\n- Bahut bade shards (200 GB) -> recovery/relocate mein ghante lagte hain, aur merge mehenge\n\n```\n130 GB / 25 GB = 5.2\n130 GB / 40 GB = 3.25\nChoose: 6 primary shards -> 130/6 = ~22 GB each  (growth ke liye headroom)\n```\n\n**Replica (naya word):** kisi shard ki exact copy doosre node par. Do kaam karti hai: (1) node marne par data bacha rehta hai, (2) **reads bhi serve karti hai** -- matlab throughput double.\n\n```\n6 primaries + 1 replica each = 12 shards total\nCluster data                 = 130 GB x 2 = ~260 GB\n```\n\n**Ye number useful kahan hai?** Shard count ek **baar** set hota hai -- baad mein badalne ke liye poora reindex chahiye. Isliye interview mein ye calculation dikhana bahut strong signal hai. Aur replica count wo lever hai jise tum **read traffic badhne par** badha sakte ho (bina reindex ke).\n\n### Step 3 -- Nodes\n\n```\n12 shards / 2 shards per node = 6 data nodes\nHar node: 64 GB RAM\n          31 GB JVM heap\n          baaki ~32 GB OS page cache ke liye (ES isi se fast hai -- index files RAM mein cached)\n\nPlus: 3 dedicated master nodes\n```\n\n**31 GB heap kyun, 32 ya 48 nahi?** Ye ek famous JVM rule hai. 32 GB se neeche JVM **compressed ordinary object pointers (compressed oops)** use karta hai -- object pointers 64-bit ki jagah 32-bit mein store hote hain. 32 GB cross karte hi ye band ho jaata hai, pointers double ho jaate hain, aur **tumhe 32 GB heap mein 31 GB se kam usable memory milti hai.** Isliye hamesha 31 GB.\n\nAur RAM ka aadha hissa heap ke liye, aadha OS ko chhodna -- kyunki Lucene index files ko **OS page cache** se padhta hai. Saara RAM heap ko de dena ES ko **slow** kar deta hai.\n\n**3 master nodes kyun?** Master node cluster state manage karta hai (kaunsa shard kahan hai). 3 isliye ki **quorum** (2 out of 3) chahiye. 2 nodes hote aur network toot jaata, toh dono khud ko master samajh lete -- **split brain**, do alag cluster states, data corruption.\n\n**Ye number useful kahan hai?** Ye tumhara monthly bill hai. 6 x (64 GB machine) + 3 small = ye ek real cost number hai jo interviewer ke saamne bolna maturity dikhata hai.\n\n### Step 4 -- Search traffic\n\n```\n20,000,000 searches / 86,400 sec = 231 QPS average\nPeak (4x)                        = ~1,000 QPS\nSale day (20x)                   = ~4,600 QPS\n```\n\n**Ye number useful kahan hai?** 231 QPS average dekh ke mat sochna \"arre ye toh kuch bhi nahi hai\". Design **4,600** ke liye karna hai. Aur ye decide karta hai:\n- Kitne Search API instances chahiye (stateless Node, horizontally scale)\n- Kitni replicas chahiye (replicas read throughput deti hain)\n- Sale day ke liye **pre-scaling runbook** -- ES nodes turant add nahi hote, shards rebalance hone mein time lagta hai. Sale se ek din pehle scale karo.\n\n### Step 5 -- Autocomplete traffic (ye sabse important insight hai)\n\nUser `iphone case` type karta hai -- average query ~12 characters. Frontend par 150 ms **debounce** hai (matlab typing rukne ke 150 ms baad hi request jaati hai, har keystroke par nahi).\n\n```\nHar search ke liye ~4 autocomplete requests (typing pauses ke hisaab se)\n20M searches/day x 4 = 80,000,000 autocomplete requests/day\n\n80,000,000 / 86,400 = ~925 QPS average\nPeak (4x)           = ~4,000 QPS\n```\n\n> **KEY INSIGHT: autocomplete traffic search traffic se ~4x zyada hai.**\n\nYe poore design ki ek buniyaad hai. Log usually autocomplete ko \"search ka chhota sa feature\" samajhte hain. Actually wo **sabse bada traffic source** hai, aur uska latency budget bhi **sabse tight** hai (100 ms vs 200 ms).\n\n**Ye number useful kahan hai?** Teen seedhe design decisions:\n1. Autocomplete ko main `products` index par **mat** chalao -- wo 130 GB ka index hai, 4,000 QPS usko mar dega. Alag `suggestions_v2` index banao jo chhota ho aur **poora RAM mein fit** ho jaaye.\n2. Redis mein top ~10,000 popular prefixes ka precomputed result rakho (TTL 10 min). 4,000 QPS ka bada hissa ES tak pahunchta hi nahi.\n3. Rate limiting mein autocomplete ki limit **alag aur zyada** honi chahiye -- warna normal typing hi rate limit hit kar degi.\n\n### Step 6 -- Cache hit ratio\n\nSearch queries **Zipf distribution** follow karti hain -- matlab kuch queries bahut popular hain aur baaki ek lambi patli tail.\n\n```\nTop 1,000 queries = poore traffic ka ~30%\n(\"iphone\", \"shoes\", \"laptop\", \"saree\", ...)\n\nRedis query cache (TTL 60 s, sirf page 1, no personalization)\n-> ~30% requests ES tak jaati hi nahi\n\nES par actual load = 1,000 QPS peak x 0.70 = ~700 QPS\n```\n\n**Ye number useful kahan hai?** Do jagah:\n1. ES cluster ko 1,000 QPS ke liye nahi, ~700 QPS ke liye size karna hai. Ye seedha node count aur paisa bachata hai.\n2. Ye **exactly** wo reason hai jisse personalization v1 mein nahi hai. Personalization ke saath har user ka result alag hota, cache key mein `userId` aata, aur hit ratio 30% se girke ~0% ho jaata. Matlab ES load 40% badh jaata. **Ek feature ka infra cost -- ye bolna interview mein bahut acha lagta hai.**\n\nCache TTL 60 s kyun? Kyunki 60 s purana result acceptable hai (ranking itni jaldi nahi badalti), lekin price change 60 s se zyada purana nahi dikhna chahiye.\n\n### Step 7 -- Indexing throughput\n\n```\n5,000,000 updates/day / 86,400 = ~58 updates/sec average\nFlash sale par                  = ~500 updates/sec (mostly price/stock)\n\nBulk data volume = 5M x 2 KB = 10 GB/day  -> ye bilkul chhota hai\n```\n\n10 GB/day network traffic kuch bhi nahi hai. **Lekin asli problem data volume nahi hai.**\n\n**ES mein segments immutable hote hain.** Matlab ek baar likhi hui index file kabhi modify nahi hoti. Toh \"update\" ka matlab actually hai:\n\n```\nUpdate = purane doc par \"tombstone\" (deleted marker) lagao\n       + naya doc ek naye segment mein likho\n       + baad mein background merge process purane segments ko jodta hai\n         aur deleted docs ko physically hataata hai\n```\n\nMatlab **har update segment churn banata hai**, aur merges CPU + disk I/O khaate hain -- **wahi CPU jo search queries serve kar raha hai**.\n\n**Ye number useful kahan hai?** Yahi wo jagah hai jahan ek naive design fail hota hai:\n\n> **\"Har stock quantity change par document reindex karo\"** -- ye **galat** hai. Popular product ki stock quantity minute mein 50 baar badalti hai (har order par). 50M products par ye indexing load explode kar dega aur merge storm search latency ko barbaad kar dega.\n\nIsliye hamara decision:\n- `inStock` ek **boolean** hai document mein (filter aur boost ke liye chahiye). Ye tabhi badalta hai jab stock 0 se >0 ya >0 se 0 ho -- bahut kam.\n- **Exact `stock_qty`** document mein hai hi nahi. Wo product page par DB/Redis se live aati hai.\n- **Price** indexed hai (search results mein dikhta hai aur price filter chahiye), lekin **debounced** -- 30 s ka batch window, taaki ek product ke 10 price changes ek hi update ban jaayein.\n\n### Step 8 -- Latency budget (200 ms p95 ko todo)\n\nEk target number hona kaafi nahi hai. Usko todna padta hai, warna pata nahi chalega ki optimize kahan karna hai.\n\n| Step | Budget | Note |\n|---|---|---|\n| Node.js API overhead (parse, validate, query build, rate limit) | ~10 ms | Query building pure CPU hai, fast |\n| Network (API \u003c-> ES, same region) | ~5 ms | Same AZ rakho, cross-region kabhi nahi |\n| **ES query execution** | **60-120 ms** | 6 shards parallel chalte hain -- **sabse slow shard time decide karta hai** |\n| Facet aggregations | +20-40 ms | Ye alag kaam hai: saare matching docs par group-by |\n| Response serialization (24 hits + facets -> JSON) | ~10 ms | |\n| **Total** | **~105-185 ms** | 200 ms budget ke andar, thoda headroom ke saath |\n\n**Ye number useful kahan hai?** Teen cheezein turant clear ho jaati hain:\n\n1. **ES query hi 60% budget hai.** Toh optimize karne ka sabse bada lever wahi hai -- aur wahan ka main lever hai: **jo cheez score mein contribute nahi karti usse `filter` context mein daalo** (filter cacheable hai, `must` nahi). Ye Part 3 ka core topic hai.\n2. **\"Sabse slow shard time decide karta hai\"** -- isliye shard balance important hai. Ek shard dusre se bada hua toh wo har query slow kar dega. Isi liye ES client mein `allow_partial_search_results: true` rakhte hain (ek shard timeout ho toh baaki ke results de do), lekin phir response mein `_shards.failed` check karke metric badhana zaroori hai -- warna tumhe kabhi pata nahi chalega ki users ko adhoore results ja rahe hain.\n3. **Facets 20-40 ms le rahe hain** -- toh agar koi page facets nahi dikha raha (jaise infinite scroll ka page 2+), toh aggregations mat maango. Free 30 ms.\n\n### Step 9 -- Query log volume\n\n```\n20M searches + 80M autocompletes = 100M events/day\nHar event ~300 bytes (query, timestamp, userId?, resultCount, clickedPosition, filters)\n\n100,000,000 x 300 B = 30,000,000,000 bytes = ~30 GB/day\n```\n\n**Ye number useful kahan hai?**\n- 30 GB/day Kafka mein **7 day retention** = ~210 GB Kafka storage. Manageable.\n- Ye data Kafka mein permanently nahi rakhna -- S3 / data warehouse mein jaata hai analytics ke liye.\n- Aur sabse important: ye path **asynchronous** hona chahiye. Query logging **kabhi bhi** search response ko block nahi karna chahiye. Fire and forget, ya ek local buffer. Agar Kafka down hai toh search chalti rehni chahiye.\n\n### Summary table\n\n| Metric | Value | Design decision jo isse nikla |\n|---|---|---|\n| Documents | 50M x 2 KB = 100 GB raw | ES chahiye (Postgres FTS ki limit cross) |\n| Index size | ~130 GB (1.3x) | Sizing ka base |\n| Shards | 6 primary (~22 GB) + 1 replica = 260 GB | 25-40 GB per shard rule |\n| Nodes | 6 data (64 GB RAM / 31 GB heap) + 3 master | Compressed oops; quorum |\n| Search QPS | 231 avg, 1,000 peak, 4,600 sale | Design for peak; pre-scale for sale |\n| **Autocomplete QPS** | **925 avg, 4,000 peak (4x search)** | **Alag index + Redis prefix cache** |\n| Cache hit | ~30% (top 1,000 queries) | ES load 1,000 -> ~700 QPS; personalization = cache death |\n| Updates | 58/s avg, 500/s flash sale | Segment churn problem -> stock ko index se bahar rakho |\n| Latency budget | 10 + 5 + (60-120) + (20-40) + 10 ms | Filter context; facets optional; same AZ |\n| Query logs | ~30 GB/day | Async Kafka, 7-day retention, S3 |\n\n### Interview mein kaise bolun (short)\n\n> \"50 million products x 2 KB = 100 GB raw, ES mein ~1.3x matlab ~130 GB. 25 se 40 GB per shard ke rule se main 6 primary shards lunga, lagbhag 22 GB each, plus ek replica -- 12 shards, ~260 GB cluster. Ye 6 data nodes par baithega, 64 GB RAM each, 31 GB JVM heap -- 32 se upar nahi jaunga compressed oops ki wajah se -- aur 3 dedicated master nodes quorum ke liye. Traffic: 20 million searches/day matlab 231 QPS average, 4x peak par 1,000, sale day 20x par 4,600. Lekin asli surprise autocomplete hai -- 4 requests per search matlab 80 million/day, ~4,000 QPS peak, search se char guna. Isliye autocomplete ke liye alag chhota edge n-gram index aur Redis prefix cache, warna main cluster mar jaayega. Top 1,000 queries traffic ka 30% hain toh Redis query cache se ES par load 1,000 se ghat ke 700 QPS ho jaata hai -- aur yahi reason hai ki main v1 mein personalization nahi le raha, wo cache ko zero kar deta. 200 ms budget mein ES query hi 60 se 120 ms hai, toh optimization ka focus wahan hai.\"\n\n---\n\n## PART 5 -- HLD (High-Level Design)\n\n### Poora architecture\n\n```\nBrowser (debounced 150 ms input)\n   |  GET /api/v1/suggest?q=iph        |  GET /api/v1/search?q=iphone+case&brand=Apple&page=1\n   v                                    v\n                        Load Balancer / API Gateway\n                                    v\n                   Search API (N stateless Node.js instances)\n                     |-- rate limit per IP (Rate Limiter lesson)\n                     |-- Redis: head-query cache (60 s) + popular-prefix cache (suggest)\n                     |-- QueryBuilder: parse -> analyze -> ES query DSL (bool: must/filter/should)\n                     v\n              Elasticsearch / OpenSearch cluster\n                 index `products_v3` behind alias `products`  (6 primary x 1 replica)\n                 index `suggestions_v2` (small, edge n-gram, fits in RAM)\n                                    ^\n                                    |  bulk index (workers)\nIndexer Workers (Kafka consumer group) \u003c---- Kafka `product-changes` (12 partitions, key=productId)\n                                    ^\n                                    |  outbox poller / Debezium CDC\nPostgres `products` (SOURCE OF TRUTH) + `product_outbox`\n                                    ^\n                                    |  seller updates product\n                        Catalog Service (writes)\n\nSide path: query logs -> Kafka `search-queries` -> S3/warehouse -> popularity + synonyms + zero-result reports\n                                                                 -> feeds `popularity_score` back into index (nightly)\n```\n\n```mermaid\nflowchart TD\n    B[Browser] --> LB[Load Balancer / API Gateway]\n    LB --> API[Search API\u003cbr/>N stateless Node.js\u003cbr/>rate limit + QueryBuilder]\n    API -->|1. check cache| RD[(Redis\u003cbr/>q: head-query 60s\u003cbr/>sug: prefix 600s)]\n    API -->|2. on miss| ES[(Elasticsearch\u003cbr/>products_v3 6x1\u003cbr/>suggestions_v2)]\n    API -.->|async, fire and forget| KQ[Kafka search-queries]\n    KQ --> WH[S3 / Warehouse\u003cbr/>popularity, synonyms, zero-result]\n    WH -.->|nightly popularityScore| ES\n\n    CS[Catalog Service\u003cbr/>seller updates] -->|one transaction| PG[(Postgres products\u003cbr/>SOURCE OF TRUTH\u003cbr/>+ product_outbox)]\n    PG -->|outbox poller / Debezium| KP[Kafka product-changes\u003cbr/>12 partitions, key=productId]\n    KP --> IW[Indexer Workers\u003cbr/>consumer group: product-indexer]\n    IW -->|bulk API 500 docs / 5 MB / 1 s| ES\n```\n\n### Do bilkul alag paths hain -- inhe hamesha alag karke samjhao\n\nInterview mein sabse common galti: sab kuch ek hi diagram mein mix kar dena. Search system mein do **poori tarah alag** pipelines hain:\n\n**PATH 1 -- QUERY PATH (read, synchronous, latency-critical)**\n\n```\nBrowser\n  -> Load Balancer\n  -> Search API  (rate limit -> validate -> cache key banao)\n  -> Redis       (hit? -> turant return, ES tak jaana hi nahi)\n  -> ES          (miss -> query DSL banao -> search -> facets)\n  -> Redis       (result cache karo, TTL 60 s)\n  -> Browser\n  -> (side, async) Kafka search-queries  \u003c- response ko block NAHI karta\n```\n\nIs path ka rule: **kuch bhi 200 ms se zyada nahi le sakta, aur kuch bhi user ko block nahi kar sakta.**\n\n**PATH 2 -- INDEXING PATH (write, asynchronous, throughput-critical)**\n\n```\nSeller \"price 1499 -> 1299\" karta hai\n  -> Catalog Service\n  -> Postgres: ONE TRANSACTION mein do writes\n       (a) UPDATE products SET price_paise=129900, version=version+1 ...\n       (b) INSERT INTO product_outbox (product_id, op, version) VALUES (..., 'upsert', ...)\n     COMMIT   \u003c- dono saath mein commit hote hain, ya dono nahi hote\n  -> Outbox poller (ya Debezium CDC) unpublished rows padhta hai\n  -> Kafka `product-changes`  (12 partitions, key = productId)\n  -> Indexer workers (consumer group `product-indexer`)\n  -> ES bulk API (batch: 500 docs YA 5 MB YA 1 second -- jo pehle aa jaaye)\n  -> ES refresh (~1 s) -> ab document searchable hai\n```\n\nIs path ka rule: **latency 30 s tak chalegi, lekin ek bhi update kho nahi sakta.**\n\n> **Dual write kyun nahi?** Sabse tempting galti: Catalog Service Postgres mein bhi likhe aur seedha ES mein bhi likhe. Problem: ye do alag systems hain, koi shared transaction nahi hai. Postgres commit ho gaya aur ES call timeout ho gayi -> **wo product hamesha ke liye search se gayab**. Koi retry mechanism bhi nahi hai kyunki request khatam ho chuki hai. Outbox pattern isko solve karta hai: outbox row **usi transaction** mein likhi jaati hai, toh agar product save hua toh event **zaroor** save hua. Poori detail Part 2/Part 3 mein.\n\nDhyan do: ye **bilkul wahi pattern hai** jo Notification/Paging system mein tha. Wahan outbox -> Kafka -> notification workers the. Yahan outbox -> Kafka -> indexer workers hain. **Pattern same, consumer alag.**\n\n### Timeline 1 -- \"Seller ne price badla, search mein kab dikha?\"\n\n| Time | Kya hua | Kya us waqt user ko dikhta hai |\n|---|---|---|\n| **t = 0 ms** | Postgres transaction COMMIT (product + outbox row, atomically) | Product page par naya price (wo DB se aata hai) -- **turant sahi** |\n| **t \u003c 1 s** | Outbox poller ne unpublished row uthaya (partial index par query, bahut fast) | Search mein abhi purana price |\n| **t ~ 1 s** | Kafka `product-changes` mein message publish, `published_at` set | Search mein abhi purana price |\n| **t ~ 2 s** | Indexer worker ne consume kiya, apne bulk batch mein jod diya (batch 500 docs / 5 MB / 1 s par flush) | Search mein abhi purana price |\n| **t ~ 2.5 s** | ES bulk API call complete -- doc likha ja chuka hai, **lekin abhi searchable nahi** | Search mein abhi purana price |\n| **t ~ 3 s** | ES **refresh** (`refresh_interval: 1s`) -- naya segment open hua | **Ab naya price search mein dikhta hai** |\n| **t \u003c= 30 s** | SLA ka boundary. Normal load par hum ~3 s par hain, 10x headroom hai | |\n\n**\"ES mein likh diya lekin searchable nahi\" ka kya matlab?** ES pehle doc ko in-memory buffer + translog mein likhta hai. Wo tabhi searchable banta hai jab **refresh** hota hai aur ek naya segment khulta hai. Default `refresh_interval` 1 second hai. Isi liye Elasticsearch ko \"near real time\" kehte hain, \"real time\" nahi.\n\n### Timeline 2 -- Ek search request (cache hit vs cache miss)\n\n| Step | Cache HIT (~30% requests) | Cache MISS (~70% requests) |\n|---|---|---|\n| LB -> API | 2 ms | 2 ms |\n| Rate limit check (Redis token bucket) | 1 ms | 1 ms |\n| Validate `q`, filters, `size`, `page` | \u003c 1 ms | \u003c 1 ms |\n| Cache key banao: `q:\u003csha1(normalizedQuery+filters+sort+page)>` | \u003c 1 ms | \u003c 1 ms |\n| Redis GET | 1 ms -> **HIT** | 1 ms -> MISS |\n| Query DSL build (bool: must + filter, function_score, aggs) | -- | 3 ms |\n| ES search (6 shards parallel + aggregations) | -- | 80-120 ms |\n| Response map (ES hits -> `SearchHit[]`, buckets -> facets) | -- | 8 ms |\n| Redis SETEX (TTL 60 s) | -- | 1 ms (fire and forget) |\n| Query log -> Kafka | async, 0 ms blocking | async, 0 ms blocking |\n| **Total** | **~7 ms** | **~100-140 ms** |\n\nCache hit ES ko **poori tarah** bypass karta hai. Isliye \"iphone\" jaisi head query 7 ms mein return hoti hai aur koi ES resource use hi nahi karti.\n\n> Cache key mein `page` kyun hai? Kyunki har page ka result alag hai. Aur hum sirf **page 1** cache karte hain -- kyunki traffic ka ~90% page 1 hi hota hai, aur baaki pages cache karne se Redis memory bhar jaayegi bina kisi fayde ke.\n\n### Har component ka kaam (Hinglish mein)\n\n| # | Component | Iska kaam |\n|---|---|---|\n| 1 | **Browser / Client** | Suggest requests **debounced** (150 ms) bhejta hai. Bina debounce ke har keystroke ek request banti aur autocomplete traffic 3x aur badh jaata -- ek client-side optimization jiska seedha server capacity impact hai |\n| 2 | **Load Balancer / Gateway** | Traffic ko N stateless API instances mein baantta hai, TLS terminate, health checks. Edge par coarse per-IP flood protection (scrapers) |\n| 3 | **Search API** | Rate limit (`rl:search:\u003cip>`) -> validate (`q` \u003c= 100 chars, `size` \u003c= 100, `page` \u003c= 50) -> Redis lookup -> QueryBuilder (params se ES query DSL) -> ES -> response mapping -> fallback orchestration. Stateless, horizontally scalable |\n| 4 | **Redis** | `q:\u003csha1(...)>` search cache (60 s, page 1 only), `sug:\u003cprefix>` suggestions (600 s), `rl:search:\u003cip>` token bucket |\n| 5 | **ES `products_v3`** | Main index, 6 primary x 1 replica, alias `products` ke peeche |\n| 6 | **ES `suggestions_v2`** | Autocomplete ka alag chhota index, edge n-gram analyzer, alias `suggestions` |\n| 7 | **Postgres** | Source of truth: `products`, `product_outbox`, `search_synonyms`, `query_popularity`. `price_paise BIGINT` (float kabhi nahi), `version BIGINT` har update par badhta hai |\n| 8 | **`product_outbox`** | Append-only event table, product change ke **usi transaction** mein likhi jaati hai |\n| 9 | **Kafka `product-changes`** | 12 partitions, key = `productId`. Durable buffer + decoupling |\n| 10 | **Indexer workers** | Consumer group `product-indexer`. Kafka event -> Postgres se latest row -> ES bulk |\n| 11 | **Query log path** | Async -> Kafka `search-queries` -> S3/warehouse |\n| 12 | **Catalog Service** | Seller writes. Isko **ES ka pata hi nahi hai** -- bas Postgres + outbox. Best decoupling: ES replace ho jaaye toh bhi iska code nahi badalta |\n\nAb in mein se jo cheezein specially samajhne layak hain:\n\n**Alias kyun (`products_v3` behind `products`)?** Application code kabhi `products_v3` nahi bolta, hamesha alias `products`. Isse **zero-downtime reindex** possible hota hai: naya `products_v4` banao, bharo, verify karo, phir ek atomic `POST /_aliases` call se alias switch kar do. Application ko pata bhi nahi chalta. Purana index 24 ghante rakho -- rollback ke liye.\n\n**Edge n-gram (naya word):** index time par ek word ke saare prefixes store kar do -- `iphone` -> `ip`, `iph`, `ipho`, `iphon`, `iphone`. Ab query time par `iph` dhoondhna ek **simple exact term match** ban jaata hai, koi wildcard nahi, koi scan nahi. Mehnat index time par kar li, query time par lagbhag O(1). Isliye autocomplete alag index par hai: (a) 4,000 QPS main index par nahi daalna, (b) ye chhota hai toh **poora RAM mein fit**, (c) iska analyzer bilkul alag hai.\n\n**Outbox par partial index:**\n```sql\nCREATE INDEX product_outbox_unpublished ON product_outbox (id) WHERE published_at IS NULL;\n```\n\n**Code Explanation:**\n\n- `ON product_outbox (id)` -- index `id` par hai kyunki poller `ORDER BY id` se events ko **insertion order** mein padhta hai.\n- `WHERE published_at IS NULL` -- ye **partial index** hai: index mein sirf wahi rows jaati hain jo abhi publish nahi hui. Table mein crore rows ho sakti hain, lekin unpublished sirf kuch sau -- toh ye index hamesha chhota rehta hai aur poller ki query (jo har second chalti hai) hamesha fast rehti hai. Full index hota toh wo table ke saath badhta jaata aur poller dheere-dheere slow hota.\n\n**Kafka key `productId` kyun?** Same key ke saare messages same partition mein jaate hain, aur ek partition ke andar order guaranteed hai. Matlab **ek product ke saare updates ordered** rehte hain, aur alag products parallel process hote hain. **12 partitions** = max 12 parallel indexer workers (ek partition ek hi consumer padh sakta hai) -- 500/s flash sale peak ke liye kaafi headroom.\n\n**Indexer worker Kafka payload par bharosa kyun nahi karta?** Kafka message mein sirf `productId` + `version` hai. Worker Postgres se **fresh** padhta hai, kyunki tab hamesha **latest** state milti hai -- agar 5 updates queue mein pade hain toh 5 writes ki jagah ek hi write kaafi hai. Batch trigger: **500 docs YA 5 MB YA 1 second**, jo pehle aa jaaye (ek-ek doc index karna 50-100x slower hai).\n\n**Query log path kya banata hai?** Teen cheezein: **zero-result report** (kaunse synonyms missing hain -- 12% se target \u003c 5%), **CTR per position** (ranking sahi hai ya nahi), aur **`query_popularity` table** jo do jagah feed karti hai: `suggestions_v2` index, aur nightly job jo `popularityScore` wapas main index mein likhta hai.\n\n> Ye last wala **feedback loop** hai, aur interview mein bahut kam log isko mention karte hain. Search ek static system nahi hai -- wo apne hi usage data se better hota hai.\n\n---\n\n## PART 6 -- Har Component ka WHY\n\n> Rule wahi hai: component tabhi add karo jab uska reason bol sako. Aur jahan zarurat nahi hai wahan clearly bolo \"yahan iski zarurat nahi hai.\"\n\n### Component: Elasticsearch\n\n- **Kya hai?** Ek distributed search engine jo Lucene ke upar bana hai. Documents ko shards mein baant ke har shard mein inverted index rakhta hai, BM25 se score karta hai, aur aggregations (facet counts) deta hai.\n- **Kyun use kar rahe hain?** Char reasons, aur chaaron hamare requirements se aate hain: (1) 50M docs par full-text search millisecond mein, (2) **facet counts** -- ye Postgres mein har filter ke liye alag `GROUP BY` query banti, (3) relevance tuning, typo tolerance, synonyms, stemming -- sab built-in aur configurable, (4) search load ko transactional DB se **poori tarah alag** kar dena, taaki search checkout ko slow na kare.\n- **Agar hata dein toh kya hoga?** Wapas `ILIKE '%...%'` par -- 8-12 second queries, DB CPU 100%, aur poori site slow. Ya Postgres FTS par -- jo chal jaayega lekin facet counts mehenge honge aur relevance tuning almost impossible.\n- **Kab zarurat NAHI hai?** **Ye sabse important answer hai.** Agar catalog ~100K products hai, facet counts nahi chahiye, aur search traffic kam hai -- toh ES **mat lagao**. Postgres `tsvector` + GIN + `pg_trgm` kaafi hai (upar Part 3 mein poora SQL hai), aur uska sabse bada fayda: **koi sync problem hi nahi hai**, `GENERATED ALWAYS AS ... STORED` khud maintain hota hai. ES tab lao jab: (a) docs > ~5-10M, (b) facet aggregations chahiye, (c) relevance/typo/synonym tuning chahiye, (d) search traffic DB ko hurt kar raha ho.\n- **Interview mein kaise bolun?** \"Main Elasticsearch le raha hoon kyunki 50 million documents, facet counts aur relevance tuning -- ye teeno Postgres FTS ki comfortable limit se bahar hain. Lekin main clearly bolna chahunga: agar catalog 100K hota toh main ES nahi laata, kyunki ek ES cluster ke saath ek poora naya consistency problem aata hai -- DB aur index ko sync rakhna. Postgres `tsvector` plus GIN us scale par kaafi hai aur wahan sync problem hoti hi nahi.\"\n\n### Component: Postgres (source of truth)\n\n- **Kya hai?** Relational DB jahan asli product data rehta hai -- `products`, `product_outbox`, `search_synonyms`, `query_popularity`.\n- **Kyun use kar rahe hain?** Product data ko **transactions, constraints aur durability** chahiye. Seller price update kare toh wo atomic hona chahiye. Price `price_paise BIGINT` mein hai -- integer, kabhi float nahi, kyunki floating point arithmetic paise ke saath rounding errors deti hai. Aur ES **rebuildable** hona chahiye -- wo tabhi possible hai jab kahin ek authoritative copy ho.\n- **Agar hata dein toh (ES ko hi source of truth bana dein)?** Disaster. ES mein transactions nahi hain, constraints nahi hain, joins nahi hain. Ek mapping change ya corrupt index aur product catalog **permanently** gaya -- kyunki rebuild karne ke liye koi source hi nahi bacha. Aur ES ka refresh delay matlab seller apna update save karke turant dekh bhi nahi paayega.\n- **Kab zarurat nahi?** Agar data kahin aur already authoritative hai (dusri team ki service, ya ek data lake) toh wo source of truth hai aur tum bas usse index karte ho.\n- **Interview mein kaise bolun?** \"Postgres source of truth hai, Elasticsearch ek derived index hai. Ye main deliberately bol raha hoon: agar ES cluster kal poora chala jaaye toh main Postgres se reindex kar sakta hoon, ulta nahi. Isi liye ES ke liye backup strategy utni critical nahi, lekin Postgres ke liye hai.\"\n\n### Component: `product_outbox` table\n\n- **Kya hai?** Ek chhoti append-only table jahan har product change ka ek event row likha jaata hai -- **product update ke bilkul usi transaction mein**.\n- **Kyun use kar rahe hain?** Ye **dual write problem** solve karta hai. Bina outbox ke tumhe do jagah likhna padta hai (Postgres + ES) bina kisi shared transaction ke. Agar Postgres commit ho gaya aur ES call fail -- wo product hamesha ke liye search se gayab, aur tumhe pata bhi nahi chalega. Outbox ke saath: outbox row aur product row **ek hi transaction** mein hain, toh dono hote hain ya dono nahi. Agar product save hua, toh event **guaranteed** save hua. Baaki kaam retry ho sakta hai.\n- **Agar hata dein toh?** Dual write -> silent permanent divergence. Ye production mein sabse painful bug hai kyunki wo **chup-chaap** hota hai. Ek din ek seller call karta hai \"mera product search mein nahi aa raha\", aur tumhe pata chalta hai ki 40,000 aur products bhi missing hain.\n- **Kab zarurat nahi?** (1) Agar tum **Debezium CDC** use kar rahe ho -- wo seedha Postgres WAL (write-ahead log) padhta hai, toh outbox table ki zarurat nahi. Trade-off: Debezium ek aur infra piece hai aur raw table changes deta hai, business events nahi. (2) Agar reindex nightly batch hai toh tum bas `WHERE updated_at > last_run` chala sakte ho -- bahut simpler, lekin latency ghante mein hai.\n- **Interview mein kaise bolun?** \"Main dual write nahi karunga. Product update aur outbox row ek hi Postgres transaction mein jaayenge -- atomicity DB deta hai. Phir ek poller un rows ko Kafka par publish karta hai. Iska matlab worst case duplicate delivery hai, missing delivery nahi -- aur duplicate ES mein idempotent hai kyunki hum document ko uski `productId` par upsert karte hain.\"\n\n### Component: Kafka `product-changes`\n\n- **Kya hai?** Distributed append-only log. 12 partitions, key = `productId`, messages 7 din retain hote hain.\n- **Kyun use kar rahe hain?** Char reasons: (1) **Buffer** -- flash sale par 500 updates/sec aate hain, ES ko utni speed se bulk index nahi karna. Kafka spike ko absorb karta hai aur workers apni comfortable speed par consume karte hain. (2) **Per-product ordering** -- key `productId` matlab ek product ke saare updates ek partition mein, ordered. (3) **Replay** -- reindex karna hai? Offset peeche karke poora stream dobara chala do. (4) **Decoupling** -- Catalog Service ko ES ka pata hi nahi. Kal ko ek aur consumer add karna ho (jaise recommendation engine), toh bas naya consumer group.\n- **Agar hata dein toh?** Outbox poller ko seedha ES mein likhna padta. Tab: ES down = poller ruk gaya ya retry loop mein phasa; koi replay nahi; aur ek hi consumer possible. Flash sale par backpressure sambhalne ki koi jagah nahi.\n- **Kab zarurat nahi?** Chhote system mein jahan update rate kam hai (kuch per second) -- tab outbox poller seedha ES bulk API call kar sakta hai, ek simple retry loop ke saath. Kafka chalana ek real operational cost hai; bina reason ke mat lo. Ya agar tumhare paas already RabbitMQ/SQS hai aur replay ki zarurat nahi, toh wo bhi chalega.\n- **Interview mein kaise bolun?** \"Kafka isliye ki mujhe buffering, per-product ordering, aur replay teeno chahiye. Key `productId` rakhunga taaki ek product ke updates ordered rahen. 12 partitions matlab max 12 parallel workers, jo 500 updates per second ke flash sale peak ke liye kaafi headroom hai. Aur replay ki wajah se reindex ek routine operation ban jaata hai, emergency nahi.\"\n\n### Component: Indexer workers\n\n- **Kya hai?** Kafka consumer group (`product-indexer`) jo events padhti hai, Postgres se latest product state fetch karti hai, ES document banati hai, aur bulk API se likhti hai.\n- **Kyun use kar rahe hain?** (1) **Bulk batching** -- 500 docs ek call mein bhejna 500 alag calls se 50-100x fast hai. (2) **Transformation** -- DB row (snake_case, `price_paise`) se ES document (camelCase, `scaled_float`) banana ek real mapping step hai jo kahin toh hona hi hai. (3) **Retry aur error handling** -- ES ne 429 diya (bulk queue full)? Backoff karke retry karo. Ek doc reject hua? Usko dead-letter karo, poora batch mat gira do. (4) **Version-based conflict handling** -- bulk request mein `version_type: 'external'` aur `version: product.version` bhejte hain, toh purana message naye doc ko overwrite nahi kar sakta (ES 409 dega, worker usse safely ignore karega). **Ye \"eventual consistency mein ordering kaise handle karoge\" ka concrete jawab hai.**\n- **Agar hata dein toh?** Ya toh Kafka se seedha ES (kaun batch karega, kaun retry karega, kaun transform karega?), ya wapas dual write. Dono kharab.\n- **Kab zarurat nahi?** Agar indexing nightly batch job hai toh ek simple script kaafi hai -- streaming worker ki zarurat nahi.\n- **Interview mein kaise bolun?** \"Indexer worker Kafka se `productId` leta hai, Postgres se latest row padhta hai -- Kafka payload par bharosa nahi karta, taaki hamesha latest state index ho -- aur 500 docs ya 5 MB ya 1 second ke batch mein bulk index karta hai. Bulk mein external versioning use karunga product ke `version` column se, taaki out-of-order message purane data se overwrite na kar de.\"\n\n### Component: Redis\n\n- **Kya hai?** In-memory store. Teen kaam: search result cache (`q:\u003csha1>`, TTL 60 s), suggestion prefix cache (`sug:\u003cprefix>`, TTL 600 s), rate limiter buckets (`rl:search:\u003cip>`).\n- **Kyun use kar rahe hain?** Top 1,000 queries traffic ka ~30% hain (Zipf). Wo 30% ES tak jaana **poora waste** hai -- same query, same result, baar-baar wahi shard work. Redis se wo 7 ms mein return hoti hai aur ES par load 1,000 se ghat ke ~700 QPS ho jaata hai. Autocomplete par ye aur bhi zyada matter karta hai (4,000 QPS, aur prefixes bahut repeat hote hain).\n- **Agar hata dein toh?** ES par 40% zyada load -> zyada nodes -> zyada paisa. Aur head queries par latency 7 ms se 100+ ms. System chalega, bas mehenga aur slow hoga. (Note: Rate Limiter lesson se ulta case -- wahan cache ka koi fayda nahi tha kyunki har operation write thi. Yahan search **read-heavy** hai, toh cache ka poora fayda milta hai.)\n- **Kab zarurat nahi?** Agar traffic kam hai (\u003c 100 QPS) toh ES aaram se handle kar lega, cache ek extra moving part hai. Aur **agar personalization hai** toh cache ka fayda lagbhag khatam -- har user ka result alag hoga.\n- **Important:** cache TTL 60 s deliberately chhoti hai. 5 minute rakhte toh hit ratio badhta, lekin price change 5 minute tak stale dikhta -- aur wo business problem hai.\n- **Interview mein kaise bolun?** \"Query distribution Zipf hai, toh top 1,000 queries traffic ka 30% hain. Main unhe Redis mein 60 second TTL ke saath cache karunga, sirf page 1 aur bina personalization ke. Isse ES load 30% kam ho jaata hai. TTL 60 second hi rakhunga, isse zyada nahi, kyunki stale price dikhana business problem hai.\"\n\n### Component: Alag `suggestions_v2` index\n\n- **Kya hai?** Ek chhota alag ES index jisme popular queries, product titles aur categories hain, edge n-gram analyzer ke saath.\n- **Kyun use kar rahe hain?** Yahi estimation ka sabse bada insight tha: **autocomplete traffic search se 4x zyada hai** (4,000 QPS vs 1,000 QPS) aur uska latency budget **aadha** hai (100 ms vs 200 ms). Agar ye 130 GB wale main index par chalega toh (a) wo 4,000 QPS main cluster ko mar dega, (b) latency 100 ms ke andar nahi rahegi. Alag index chhota hai, **poora RAM mein fit** ho jaata hai, aur uska edge n-gram analyzer query ko ek simple term match bana deta hai.\n- **Agar hata dein toh?** `match_phrase_prefix` main index par chalana padta -- jo kaam toh karta hai, lekin slow hai, fuzzy nahi hai, aur main cluster ka RAM aur CPU autocomplete ke traffic se bhar jaata. Search khud slow ho jaati.\n- **Kab zarurat nahi?** Chhote catalog mein `LIKE 'iph%'` bhi chal jaata hai! Dhyan do -- **trailing wildcard** hai, leading nahi, toh B-tree index use ho sakta hai. Ye ek acha nuance hai: autocomplete ki problem full-text search se **asaan** hai, kyunki prefix matching indexable hai.\n- **Interview mein kaise bolun?** \"Autocomplete ko main alag index par rakhunga kyunki uska traffic search se char guna hai aur latency budget aadha. Edge n-gram use karunga -- index time par saare prefixes store kar do, phir query time par bas ek term match, koi wildcard nahi. Uske aage Redis mein top 10,000 prefixes precomputed, toh 4,000 QPS ka bada hissa ES tak pahunchta hi nahi.\"\n\n### Component: Search API layer\n\n- **Kya hai?** Stateless Node.js instances jo rate limiting, validation, caching, query building, response mapping, aur fallback orchestration karte hain.\n- **Kyun use kar rahe hain?** Sabse pehle ek security baat: **ES ko kabhi internet par expose mat karo.** ES ka query DSL bahut powerful hai -- koi bhi aggregation, script query, ya deep pagination chala sakta hai aur cluster gira sakta hai. API layer ek **controlled interface** hai. Uske alawa: yahi rate limiting, `q` length validation (100 chars), cache, aur ES ke raw response ko clean client JSON mein badalna hota hai.\n- **Agar hata dein toh?** Client seedha ES se baat karta -- ek attacker ek expensive aggregation query se poora cluster gira sakta hai, internal mapping leak ho jaati, aur cache ya rate limiting ki koi jagah hi nahi bachti.\n- **Kab zarurat nahi?** Kabhi nahi, production mein. (Internal admin tools Kibana se seedha ES padh sakte hain, wo alag baat hai.)\n- **Interview mein kaise bolun?** \"ES kabhi client ke saamne expose nahi hoga. Search API validation, rate limiting, caching aur query building karegi. `q` ko 100 characters par cap karunga kyunki lambi query ki fuzzy expansion mehengi hai aur wo ek sasta DoS vector hai.\"\n\n### Component: Analytics / query-log path\n\n- **Kya hai?** Har search aur suggest event async Kafka `search-queries` par jaata hai, wahan se S3/warehouse.\n- **Kyun use kar rahe hain?** Ye search ka **feedback loop** hai, aur ye ek \"nice to have reporting\" nahi -- ye system ko better banata hai: zero-result queries batati hain kaunse synonyms missing hain (12% -> target \u003c 5%), CTR per position batati hai ranking sahi hai ya nahi, aur query popularity do jagah feed hoti hai: `suggestions_v2` index aur nightly job jo `popularityScore` wapas main index mein likhta hai.\n- **Agar hata dein toh?** Relevance improve karne ka koi **data-driven** tareeka hi nahi bachta. Tum guesses aur support tickets ke basis par ranking tune karoge. Aur autocomplete ke paas \"kya popular hai\" ka koi source nahi hoga.\n- **Kab zarurat nahi?** Day 1 par nahi chahiye. Lekin **pehle din se logging shuru kar do** even agar analysis baad mein karoge -- kyunki jo data aaj log nahi kiya wo kabhi wapas nahi milega. Ye ek practical production lesson hai.\n- **Interview mein kaise bolun?** \"Query logging async hoga, search response ko kabhi block nahi karega. Ye sirf reporting nahi hai -- ye popularity score aur synonyms dono ko feed karta hai, toh search apne hi usage data se better hoti jaati hai. Aur LTR ka rasta bhi yahi data kholta hai.\"\n\n### v1 mein deliberately kya NAHI daala (aur kyun)\n\n| Nahi liya | Kyun nahi |\n|---|---|\n| **Learning-to-Rank (LTR)** | ML model se ranking. Iske liye **click data chahiye** -- jo hamara analytics path abhi collect karna shuru kar raha hai. Bina data ke model banana ulta hai. Aur LTR ek re-ranking phase add karta hai jo latency badhata hai. v3. |\n| **Vector / semantic search** | \"cheap phone for my mother\" jaisi intent-based queries ke liye zabardast hai. Lekin chahiye: embedding model, 50M embeddings generate karna, kNN index (RAM bahut zyada), aur embedding regenerate karne ka pipeline jab model update ho. Interview mein **mention zaroor karo** as \"modern addition\", lekin v1 mein lena over-engineering hai. |\n| **Personalization** | Do reasons: (1) **query cache ko kill kar deta hai** -- 30% hit ratio se ~0%, matlab 40% zyada ES nodes ka bill, (2) user profile pipeline chahiye. v3 mein approach hogi: base ranking same rakho, sirf **top 100 results ko API layer par re-rank** karo -- isse cache bhi bach jaata hai (ES result cached, re-rank baad mein). |\n| **CDN for search results** | Search results **personalized aur volatile** hain (price, stock badalte rehte hain) aur query space infinite hai -- CDN hit ratio bhayanak hoga. Haan, **static category pages aur facet metadata** CDN-able hain, wo kar sakte ho. Lekin actual search results nahi. |\n| **Multi-region active-active** | Do jagah ES cluster matlab dono ko sync rakhna. Kafka ko cross-region replicate karna padega (MirrorMaker), aur reindex ab do cluster par coordinate karna hoga. Ye bahut zyada complexity hai jab tak tumhara traffic ek region se na aata ho. Latency chahiye toh pehle **read replicas ya CDN for static assets** try karo. |\n\n> Interview line: \"Main ye chaar cheezein deliberately nahi le raha aur har ek ka reason bata sakta hoon. Vector search sabse zyada tempting hai kyunki abhi trend mein hai, lekin uske liye embedding pipeline aur kNN index chahiye jo apna ek poora project hai. Pehle main BM25 plus business boosts se 90% value nikal lunga, click data collect karunga, aur phir LTR ya vector search tab laaunga jab mere paas dikhane ke liye ek concrete relevance problem ho.\"\n\n---\n\n## Remember\n\n> **Search do alag problems hai, ek nahi: SPEED aur RELEVANCE.** Speed ka jawab **inverted index** hai (kaam index time par kar lo -- term se sorted doc list -- taaki query time par bas do chhoti lists intersect karni pade, 50 million rows scan nahi). Relevance ka jawab **scoring** hai (BM25 + business boosts), kyunki SQL `LIKE` boolean hai aur usme \"better result\" ka concept hi nahi. Aur teesri baat jo dono se upar hai: **Elasticsearch ek derived, rebuildable index hai -- source of truth hamesha Postgres hai**, aur unhe jodne ka sahi tareeka outbox + Kafka hai, dual write nahi.\n\n## Quick Self-Test (answers baad mein check karna)\n\n1. `ILIKE '%iphone%'` index use nahi kar sakta, lekin `LIKE 'iphone%'` kar sakta hai. Kyun? Aur is farak ka autocomplete design par kya asar padta hai?\n2. Catalog 50M hai, index 130 GB hai, aur search traffic 1,000 QPS peak hai. Autocomplete ko alag index par kyun rakha? Dono numbers ke saath justify karo.\n3. Seller ne price badla. Wo product page par turant sahi dikhta hai lekin search mein 3 second baad. Ye 3 second kahan-kahan kharch hue -- har step ka time batao.\n4. Dual write (app seedha Postgres aur ES dono mein likhe) exactly kahan fail hota hai, aur outbox pattern us failure ko kaise rokta hai? Outbox ke saath duplicate delivery ka kya hota hai?\n5. Interviewer bolta hai \"personalization add kar do\". Tumhare current design ke kaunse do numbers turant kharab ho jaate hain, aur tum kya alternative propose karoge?\n\n---\n\n**Next (Part 2):** Search aur indexing ka complete request flow, API design (search, suggest, facets, pagination), Postgres + ES mapping design, LLD folder structure, Node.js/TypeScript code line-by-line. \"next\" bolo.\n"},{"label":"Request Flow -> API -> Index + DB Design -> LLD -> Code","md":"# Search System -- HLD + LLD (Part 2: Request Flow -> API -> Index + DB Design -> LLD -> Code)\n\n> Is file mein prompt ke **Parts 7-12** hain: request flow (search + autocomplete + indexing), API design, Postgres schema + Elasticsearch mapping, LLD folder structure, aur Node.js/TypeScript code ka line-by-line explanation.\n> Part 1 ka recap teen line mein: **(1)** `SELECT * FROM products WHERE name ILIKE '%iphone case%'` 50M products par 8-12 second leta hai kyunki leading wildcard koi B-tree index use nahi kar sakta, aur `LIKE` boolean hai -- usme \"kaun zyada relevant hai\" ka concept hi nahi. **(2)** Isliye do alag cheezein chahiye: **inverted index** (speed) aur **scoring/ranking** (relevance) -- yani Elasticsearch, index `products_v3` behind alias `products`, **6 primary shards x 1 replica** (~130 GB primary data, 22 GB per shard), 6 data nodes + 3 master nodes. **(3)** Traffic: search 20M/day (~231 QPS avg, ~1,000 QPS peak), autocomplete 80M/day (~925 QPS avg, ~4,000 QPS peak -- search se 4x zyada, isliye alag `suggestions_v2` index + Redis prefix cache), updates 5M/day (58/sec avg, ~500/sec flash sale), Postgres source of truth + outbox -> Kafka -> indexer workers.\n> **Part 3 mein** aayega: inverted index zero se (postings list by hand), TF-IDF se BM25 tak actual calculation, typo tolerance (Levenshtein), synonyms, autocomplete ke teen design options, indexing concurrency aur version conflicts, caching layers.\n\n---\n\n## PART 7 -- Request Flow (dono paths, step by step)\n\nSearch system mein **teen alag flows** hain aur interview mein teeno alag-alag bolne chahiye. Log aksar sirf \"search query\" wala bolte hain aur indexing bhool jaate hain -- wahi to asli distributed-systems wala hissa hai.\n\n| Flow | Kaun trigger karta hai | Traffic | Target latency | Path |\n|---|---|---|---|---|\n| **A. Search query** | User Enter dabata hai / filter click karta hai | ~1,000 QPS peak | p95 \u003c 200 ms | API -> Redis -> ES `products` |\n| **B. Autocomplete** | Har keystroke (debounced) | ~4,000 QPS peak | p99 \u003c 100 ms | API -> Redis -> ES `suggestions_v2` |\n| **C. Indexing** | Seller product update karta hai | ~58/sec avg, ~500/sec peak | end-to-end \u003c= 30 s | Postgres -> outbox -> Kafka -> worker -> ES |\n\nFlow A aur B **read path** hain (user wait kar raha hai). Flow C **write path** hai (koi user wait nahi kar raha, isliye async chal sakta hai).\n\n---\n\n### Flow A -- Search query (user ne \"iphon case\" type karke Enter dabaya)\n\nScenario: Priya Mumbai se mobile par `iphon case` search karti hai, phir left sidebar se **Brand = Apple** aur **price 500-2000** filter lagati hai.\n\n```mermaid\nsequenceDiagram\n    participant B as Browser (debounced)\n    participant LB as Load Balancer\n    participant API as Search API (Node.js)\n    participant R as Redis\n    participant QB as QueryBuilder\n    participant ES as ES coordinating node\n    participant S as 6 shards (parallel)\n    B->>LB: GET /api/v1/search?q=iphon+case&brand=Apple&priceMin=500&priceMax=2000&page=1\n    LB->>API: forward + X-Forwarded-For\n    API->>API: rate limit (rl:search:\u003cip>) + zod validate + normalize query\n    API->>R: GET q:\u003csha1(normalizedQuery+filters+sort+page)>\n    R-->>API: (nil) -- cache MISS\n    API->>QB: build(SearchRequest)\n    QB-->>API: ES query DSL (bool + function_score + aggs + sort)\n    API->>ES: POST /products/_search?timeout=800ms\n    ES->>S: query phase -- fan out to 6 shards\n    S-->>ES: har shard se top 24 (docId + score) + local agg results\n    ES->>ES: merge + global sort -> top 24 docIds\n    ES->>S: fetch phase -- in 24 docs ka _source lao\n    S-->>ES: 24 full documents\n    ES-->>API: hits + aggregations + took\n    API->>API: response-mapper -> SearchResponse\n    API->>R: SETEX q:\u003csha1> 60 \u003cjson>\n    API-->>B: 200 JSON (hits, facets, total, tookMs)\n```\n\n**Step by step (Hinglish mein):**\n\n**1. Browser debounce (150 ms).** User type kar raha hai to har keystroke par search nahi bhejte. 150 ms tak koi key na dabe tabhi request jaati hai. Ye **client-side ka sabse sasta o
