la gaya. Ye wo bug hai jo kabhi exception nahi deta, sirf ranking chup-chaap kharab karta hai.\n\nKoi ES nahi, koi Docker nahi, koi mock nahi. 2 millisecond mein chalta hai. Tum 50 aise tests likh sakte ho -- har sort option, har filter combination, har edge case (khaali `q`, `searchAfter` ke saath `page`, `size` boundary). **Jo cheez test karna aasan hai, wo actually test hoti hai.**\n\n**2. Ye ES ki details ko controllers se bahar rakhta hai.**\n\nAgar DSL banane ka code controller mein hota, to controller ko `multi_match`, `function_score`, `field_value_factor` -- sab pata hona chahiye. Phir:\n\n- Har naye endpoint mein wahi DSL code copy-paste hota.\n- ES 9 mein koi syntax badla? 12 jagah badalna padega.\n- Kal ES ki jagah OpenSearch ya kuch aur laaye? Poora controller layer rewrite.\n\nPure function hone se ES ka poora \"knowledge\" **ek file mein** band hai. Controller ko sirf itna pata hai: `SearchRequest` andar, results bahar.\n\n**3. Debugging trivially aasan ho jaati hai.**\n\nProduction mein koi bole \"ye query galat results de rahi hai\" -- tum us `SearchRequest` ko function mein daal ke **exact DSL print** kar sakte ho, phir usse Kibana Dev Tools mein paste karke khud chala sakte ho. Koi app chalane ki zarurat nahi. Ek admin endpoint bhi bana sakte ho: `GET /api/v1/admin/explain-query?q=...` jo sirf DSL return kare.\n\n> **Interview line:** \"`query-builder` ko main **pure function** rakhta hoon -- validated request andar, DSL object bahar, koi I/O nahi. Ye search system ka sabse bug-prone hissa hai (filter context, boosts, tie-breaker), aur pure hone ki wajah se ise milliseconds mein exhaustively unit-test kiya ja sakta hai. Saath hi ES ki saari DSL knowledge ek file mein rehti hai, controllers mein nahi.\"\n\n**Dependency diagram:**\n\n```\nsearch.routes.ts\n     |\n     v\nsearch.controller.ts  (zod validate, filter whitelist, status codes)\n     |\n     v\nsearch.service.ts  (cache-aside, metrics, fallback policy)\n     |\n     +--> search/query-builder.ts    [PURE]  SearchRequest -> ES DSL\n     |\n     +--> repositories/es.repository.ts  --> infra/elasticsearch.ts  --> ES cluster\n     |\n     +--> infra/redis.ts                                             --> Redis\n     |\n     +--> search/response-mapper.ts  [PURE]  ES response -> SearchResponse\n     |\n     +--> repositories/product.repository.ts --> infra/postgres.ts   --> Postgres (fallback only)\n```\n\nDekho: **do `[PURE]` boxes** hain aur baaki sab I/O hai. Testing strategy seedhi nikal aati hai -- pure parts ke liye fast unit tests, I/O parts ke liye kuch integration tests.\n\n---\n\n## PART 11 + 12 -- Node.js / TypeScript Code (line-by-line)\n\nStack: **Express 5**, **@elastic/elasticsearch v8**, **ioredis**, **pg**, **kafkajs**, **zod** (validation), **pino** (logs), **prom-client** (metrics).\n\nOrder: pehle types, phir ES client, phir controller (bahar se andar), phir query builder (dil), phir service, phir mapper, phir suggest, phir workers (write path).\n\n### 0. `types/search.ts` -- spec ke types (verbatim)\n\n```ts\ninterface SearchRequest {\n  q: string; page: number; size: number;\n  filters: { brand?: string[]; categoryPath?: string[]; priceMin?: number; priceMax?: number; minRating?: number; inStockOnly?: boolean };\n  sort: 'relevance' | 'price_asc' | 'price_desc' | 'newest' | 'rating';\n  searchAfter?: [number, string];\n}\ninterface SearchHit { productId: string; title: string; brand: string; price: number; rating: number; inStock: boolean; score: number; }\ninterface FacetBucket { value: string; count: number }\ninterface SearchResponse {\n  hits: SearchHit[]; total: number; totalIsLowerBound: boolean;\n  facets: { brands: FacetBucket[]; categories: FacetBucket[]; priceRanges: FacetBucket[] };\n  tookMs: number; searchAfter?: [number, string]; degraded?: boolean;\n}\ninterface ProductDoc { productId: string; title: string; description: string; brand: string; categoryPath: string;\n  attributes: Record\u003cstring, string>; price: number; rating: number; ratingCount: number; inStock: boolean;\n  sellerId: string; popularityScore: number; createdAt: string; updatedAt: string; version: number; }\n```\n\n**Code Explanation:**\n\n- `SearchRequest` -- ye **validated** request hai, raw `req.query` nahi. Controller zod se validate karke ye banata hai. Iske aage ka poora code maan ke chalta hai ki data saaf hai. Ye ek contract hai: \"is line ke baad koi untrusted input nahi hai.\"\n- `filters` ek **nested object** hai, flat fields nahi. Kyun? Kyunki query-builder ko \"kaunse filters hain\" ek hi jagah se chahiye -- `Object.entries(req.filters)` par loop kar sakta hai.\n- `brand?: string[]` -- array, kyunki `?brand=Apple&brand=Spigen` multi-select hai (OR).\n- `inStockOnly?: boolean` -- naam `inStockOnly` hai, `inStock` nahi. Kyun? Kyunki `false` ka matlab \"out of stock dikhao\" nahi hai -- matlab \"filter mat lagao\". Naam se ye clear hona chahiye.\n- `sort` ek **union type** hai, `string` nahi. TypeScript compile time par hi galat value pakad lega, aur `switch` mein exhaustiveness check milta hai.\n- `searchAfter?: [number, string]` -- ek **tuple**: `[sortValue, productId]`. Pehla element sort field ki value hai (`_score`, ya `price`, ya timestamp), doosra hamesha tie-breaker `productId`.\n- `SearchHit` -- **sirf wo fields jo grid card par dikhti hain.** `description`, `attributes`, `sellerId` yahan nahi hain -- unhe bhejna matlab har response 5x bada, bina kisi fayde ke.\n- `score: number` -- debugging ke liye rakha hai. Production mein ise `?debug=true` ke peeche rakh sakte ho, taaki competitor tumhara ranking model na padh sake.\n- `totalIsLowerBound: boolean` -- `track_total_hits: 10000` ka seedha nateeja (PART 8.2c).\n- `tookMs: number` -- **hamara** total time (ES ka `took` nahi). Isse frontend performance track kar sakta hai aur support tickets mein number hota hai.\n- `degraded?: boolean` -- optional. Normal response mein field hoti hi nahi (JSON chhota rehta hai); sirf fallback path par `true`.\n- `ProductDoc` -- ES mein jo document jaata hai uska exact shape. Ye `products` table se alag hai: `price_paise` (BIGINT) yahan `price` (number in rupees) ban gaya, `stock_qty` (INT) yahan `inStock` (boolean) ban gaya, `description` truncated snippet hai. **Ye translation repository layer ka kaam hai.**\n\n---\n\n### 1. `infra/elasticsearch.ts` -- ES client\n\n```ts\nimport { Client } from '@elastic/elasticsearch';\nimport { Agent } from 'node:http';\nimport { config } from '../config';\nimport { logger } from './logger';\n\nexport const esClient = new Client({\n  node: config.esUrl,                       // 'http://es-lb.internal:9200'\n  auth: { apiKey: config.esApiKey },\n  requestTimeout: 1000,                     // 1s hard ceiling per request\n  maxRetries: 2,                            // 2 retries, phir error\n  sniffOnStart: false,                      // LB ke peeche sniffing OFF\n  sniffOnConnectionFault: false,\n  compression: true,                        // gzip request/response bodies\n  agent: () => new Agent({\n    keepAlive: true,\n    keepAliveMsecs: 30_000,\n    maxSockets: 256,\n    maxFreeSockets: 64,\n  }),\n});\n\nexport async function esHealth(): Promise\u003c'green' | 'yellow' | 'red' | 'unknown'> {\n  try {\n    const res = await esClient.cluster.health({}, { requestTimeout: 500 });\n    return res.status as 'green' | 'yellow' | 'red';\n  } catch (err) {\n    logger.warn({ err }, 'ES health check failed');\n    return 'unknown';\n  }\n}\n```\n\n**Code Explanation:**\n\n- `new Client({ node: config.esUrl })` -- **ek hi URL**, jo ek internal load balancer ka hai. Client ko individual node IPs nahi de rahe.\n- `auth: { apiKey: config.esApiKey }` -- ES API key (env var se). **Username/password kabhi hardcode nahi.** API key ko scope kiya jaa sakta hai (sirf `products*` indices par read+write), yani ek leak hua key poora cluster nahi khol deta.\n- **`requestTimeout: 1000`** -- ek request par max 1 second. **Kyun itna tight?** Hamara p95 budget 200 ms hai. Agar ES 1 second se zyada le raha hai to wo request waise bhi useless hai -- user ja chuka hai. Bina timeout ke Node ki connection pool slow requests se bhar jaati hai aur **healthy requests bhi queue mein phans jaati hain** (ye cascading failure ka classic shape hai). Timeout ek **bulkhead** hai.\n  - Note: per-request bhi timeout bhejte hain (`timeout: '800ms'` ES ke andar). Do alag cheezein hain: `requestTimeout` = **client** kitna wait karega; `timeout` = **ES shards** ko kitna time dena hai. ES wala chhota (800 ms) rakhte hain taaki ES khud partial results wapas kar de, client ke abort karne se pehle -- warna tumhe kuch nahi milta.\n- **`maxRetries: 2`** -- network blip ya ek node ka restart ho to 2 retry. **3 ya 5 kyun nahi?** Kyunki ES already overloaded hai to retries load aur badhate hain -- \"retry storm\". 2 retries x 1 s timeout = worst case 3 second, jo pehle se budget se bahar hai. Retry sirf **idempotent** operations par safe hai; search read-only hai, isliye theek hai.\n- **`sniffOnStart: false` aur `sniffOnConnectionFault: false`** -- \"Sniffing\" ka matlab hai client khud cluster se node list nikal ke seedha nodes se baat kare. **LB ke peeche ye bilkul mat karo:**\n  - Sniffing se milne wale IPs aksar **internal/private** hote hain jo tumhare app network se reachable hi nahi (especially Kubernetes ya cloud-managed ES par).\n  - Client node list cache kar leta hai; node replace hone par client purani IP par hit karta rehta hai.\n  - LB ka poora point hi ye hai ki wo healthy nodes ko route kare. Sniffing usko bypass kar deti hai.\n  - **Kab ON karein?** Jab tum khud apna ES cluster chala rahe ho, bina LB ke, aur nodes ki IPs stable hon.\n- `compression: true` -- gzip. Search response 50-200 KB ka hota hai (24 documents ka `_source` + aggregations). Gzip se network par ~5x chhota. CPU thoda lagta hai par same-VPC bhi bandwidth free nahi hoti, aur serialization time bachta hai.\n- **`agent: () => new Agent({ keepAlive: true, ... })`** -- ye sabse zyada latency bachane wala option hai:\n  - `keepAlive: true` -- TCP connection ko request ke baad **band mat karo**, reuse karo. Har naye connection par TCP 3-way handshake (+TLS handshake agar HTTPS) = 1-3 network round trips = **2-10 ms**. 1,000 QPS par ye poora latency budget kha jaata.\n  - `keepAliveMsecs: 30_000` -- idle connection 30 second tak zinda rakho. ES/LB ka apna idle timeout usse zyada hona chahiye, warna server connection band kar dega aur client ko `ECONNRESET` milega.\n  - `maxSockets: 256` -- ek Node process se ES tak max 256 parallel connections. **Ye ek jaan-boojh ke lagayi gayi limit hai:** ES overload ho to backpressure yahin banta hai (requests Node mein queue hoti hain) bajaye ES ko aur maarne ke. Unlimited rakhoge to Node ES ko dubaa dega.\n  - `maxFreeSockets: 64` -- 64 idle connections warm rakho. Traffic spike par turant available.\n- `esHealth()` -- `/ready` endpoint ke liye. `requestTimeout: 500` **override** per-call kiya hai -- health check ko 1 second wait nahi karna chahiye.\n- `catch` mein `'unknown'` return -- health check **kabhi throw nahi karta**. Warna `/ready` endpoint 500 dega, jo readiness probe ke liye galat signal hai.\n\n---\n\n### 2. `controllers/search.controller.ts` -- validation ka darwaza\n\n```ts\nimport type { Request, Response } from 'express';\nimport { z } from 'zod';\nimport { searchService } from '../services/search.service';\nimport { logger } from '../infra/logger';\nimport { searchRequestsTotal } from '../infra/metrics';\n\nconst asArray = (v: unknown): string[] | undefined =>\n  v === undefined ? undefined : Array.isArray(v) ? v.map(String) : [String(v)];\n\nconst searchQuerySchema = z.object({\n  q:            z.string().trim().max(100).default(''),\n  brand:        z.preprocess(asArray, z.array(z.string().max(100)).max(10).optional()),\n  categoryPath: z.preprocess(asArray, z.array(z.string().max(200)).max(5).optional()),\n  priceMin:     z.coerce.number().min(0).max(10_000_000).optional(),\n  priceMax:     z.coerce.number().min(0).max(10_000_000).optional(),\n  minRating:    z.coerce.number().min(0).max(5).optional(),\n  inStock:      z.enum(['true', 'false']).optional(),\n  sort:         z.enum(['relevance', 'price_asc', 'price_desc', 'newest', 'rating']).default('relevance'),\n  page:         z.coerce.number().int().min(1).max(50).default(1),\n  size:         z.coerce.number().int().min(1).max(100).default(24),\n  searchAfter:  z.string().max(200).optional(),\n})\n  .strict()\n  .refine((v) => v.priceMin === undefined || v.priceMax === undefined || v.priceMin \u003c= v.priceMax,\n          { message: 'priceMin must be \u003c= priceMax', path: ['priceMin'] });\n\nexport async function search(req: Request, res: Response): Promise\u003cvoid> {\n  const parsed = searchQuerySchema.safeParse(req.query);\n\n  if (!parsed.success) {\n    const issue = parsed.error.issues[0];\n    res.status(400).json({\n      error: 'VALIDATION_ERROR',\n      field: String(issue.path[0] ?? ''),\n      message: issue.code === 'unrecognized_keys' ? 'unknown filter' : issue.message,\n    });\n    return;\n  }\n\n  const v = parsed.data;\n\n  let searchAfter: [number, string] | undefined;\n  if (v.searchAfter) {\n    try {\n      const raw = JSON.parse(v.searchAfter);\n      if (!Array.isArray(raw) || raw.length !== 2\n          || typeof raw[0] !== 'number' || typeof raw[1] !== 'string') throw new Error('shape');\n      searchAfter = [raw[0], raw[1]];\n    } catch {\n      res.status(400).json({ error: 'VALIDATION_ERROR', field: 'searchAfter', message: 'invalid cursor' });\n      return;\n    }\n  }\n\n  try {\n    const result = await searchService.search({\n      q: v.q,\n      page: v.page,\n      size: v.size,\n      filters: {\n        brand: v.brand,\n        categoryPath: v.categoryPath,\n        priceMin: v.priceMin,\n        priceMax: v.priceMax,\n        minRating: v.minRating,\n        inStockOnly: v.inStock === 'true' ? true : undefined,\n      },\n      sort: v.sort,\n      searchAfter,\n    });\n\n    searchRequestsTotal.inc({ sort: v.sort, cached: String(result.tookMs \u003c 15) });\n    res.status(200).json(result);\n  } catch (err) {\n    logger.error({ err, q: v.q, requestId: res.locals.requestId }, 'search failed');\n    res.status(503).json({ error: 'SEARCH_UNAVAILABLE', message: 'Search is temporarily unavailable' });\n  }\n}\n```\n\n**Code Explanation:**\n\n- `asArray` -- Express `?brand=Apple` ko string deta hai aur `?brand=Apple&brand=Spigen` ko array. Ye helper dono ko **hamesha array** bana deta hai, taaki neeche ka code ek hi shape dekhe. Ye chhoti si normalization bahut bugs bachati hai.\n- `z.string().trim().max(100).default('')` -- `q` ki poori validation ek line mein: whitespace hatao, 100 chars se lambi ho to **reject** (silently cut nahi -- user ko pata chalna chahiye), na ho to khaali string (category browse mode).\n- `z.preprocess(asArray, z.array(...).max(10))` -- pehle shape theek karo, phir validate karo. `.max(10)` = **10 se zyada brands nahi** (PART 8.2d ka `maxValues`). Har brand max 100 chars.\n- `z.coerce.number()` -- query params **hamesha strings** hote hain (`\"500\"`). `coerce` usse number banata hai. Ye bina `parseInt` ke har jagah likhe kaam ho jaata hai -- aur `\"abc\"` par saaf validation error deta hai, `NaN` nahi.\n- `.min(0).max(10_000_000)` on price -- upper bound kyun? Kyunki `priceMax=999999999999999` jaisa input range query ko useless bana deta hai aur kabhi-kabhi numeric overflow edge cases laata hai. Har numeric input ki **dono taraf** bound honi chahiye.\n- `z.enum(['true','false'])` for `inStock` -- boolean coerce **jaan-boojh ke nahi** kiya. `z.coerce.boolean()` mein `\"false\"` -> `true` ban jaata hai (kyunki JS mein non-empty string truthy hai) -- ye ek famous bug hai. Explicit enum se ye possible hi nahi.\n- `z.enum([...])` for `sort` -- **yahi filter whitelist ka half hai.** `sort=popularityScore` bhejo to `400`. User kabhi ES field name choose nahi kar sakta.\n- `page ... .max(50)` -- PART 8.2b. `page=51` par zod hi `400` de dega, service tak pahunchega hi nahi.\n- `size ... .max(100)` -- latency budget ki hifazat.\n- **`.strict()`** -- ye **sabse important line** hai. Iska matlab: schema mein jo keys nahi hain, wo **error** hain, chup-chaap ignore nahi. `?color=red` -> `400 unknown filter`.\n  - Ignore karne se kya hota hai? User ko lagega filter lag gaya, results filtered nahi honge, aur wo bharosa kho dega. Aur tumhare frontend ka typo (`?brnd=Apple`) production mein mahino tak pakda nahi jaayega.\n  - Security angle: `.strict()` ke bina agar koi future code `Object.entries(query)` par loop kare, to PART 8.2d wali injection wapas aa jaayegi. `.strict()` us darwaze ko schema level par band kar deta hai.\n- `.refine(...)` -- cross-field validation. Zod ka `.refine` tab use hota hai jab rule **do fields ke beech** ho. `priceMin > priceMax` ka matlab hamesha zero results -- user ko batao, chup-chaap khaali response mat do.\n- `safeParse` (not `parse`) -- `parse` exception throw karta hai; `safeParse` ek result object deta hai. Validation ek **expected** case hai (user galat input bhejta hi hai), exception nahi. Exceptions ko unexpected cheezon ke liye rakho.\n- `parsed.error.issues[0]` -- **sirf pehla** error bhejte hain. Saare 12 errors ka nested JSON API consumer ke liye kaam ka nahi hota aur internal schema structure leak karta hai.\n- `issue.code === 'unrecognized_keys' ? 'unknown filter' : ...` -- `.strict()` ke violation ko ek friendly message se replace kar rahe hain, zod ka raw message nahi.\n- `JSON.parse(v.searchAfter)` inside `try` -- **cursor user se aata hai, yani untrusted hai.** Malformed JSON par `JSON.parse` throw karega -- wo `400` banna chahiye, `500` nahi.\n- `raw.length !== 2 || typeof raw[0] !== 'number' || typeof raw[1] !== 'string'` -- **shape validation.** Ye tuple seedha ES ke `search_after` mein jaata hai. Bina check ke user `[\"{...}\", {...}]` bhej sakta hai. `JSON.parse` ke baad **hamesha** shape check karo -- `JSON.parse` sirf syntax check karta hai, structure nahi.\n- `inStockOnly: v.inStock === 'true' ? true : undefined` -- **`false` ki jagah `undefined`.** Kyun? `inStockOnly: false` ka matlab \"filter mat lagao\" hai, \"out-of-stock dikhao\" nahi. `undefined` bhejne se query-builder us filter ko skip kar dega. `false` bhejte to builder ko extra `if` chahiye hota.\n- `searchService.search({...})` -- controller ne **ek bhi ES ya Redis line nahi likhi.** Uska kaam sirf: untrusted input -> validated `SearchRequest`, phir service, phir HTTP status. Isi wajah se controller ka test sirf \"kya 400 aaya\" check karta hai.\n- `searchRequestsTotal.inc({ sort, cached })` -- metric labels. `cached` label se dashboard par cache hit ratio dikhta hai. (Production mein service ko explicit `fromCache` flag return karana behtar hai; `tookMs \u003c 15` ek shortcut hai.)\n  - **Label mein `q` kabhi mat daalo.** Har unique query ek nayi time-series banayegi -- ye \"cardinality explosion\" hai aur Prometheus ko maar deta hai. Labels hamesha **bounded set** se hone chahiye (5 sorts, 2 boolean values).\n- `catch` -> `503 SEARCH_UNAVAILABLE` -- yahan tab pahunchte hain jab **service ka fallback bhi fail** ho gaya (ES down aur Postgres bhi down). `500` nahi, kyunki `503` ka matlab \"temporary, retry karo\" hai -- clients aur monitoring dono isko sahi samajhte hain.\n- `logger.error({ err, q, requestId })` -- structured log. `requestId` se poori request trace hoti hai. **`q` log karna theek hai** (public search text, PII nahi), lekin logged-in user ka `userId` uske saath jodne se pehle privacy policy dekh lena.\n\n---\n\n### 3. `search/query-builder.ts` -- DSL ka dil (pure function)\n\nPehle **target** dekho -- spec ki canonical query (verbatim), jo ye function banata hai:\n\n```json\n{\n  \"size\": 24,\n  \"query\": {\n    \"function_score\": {\n      \"query\": {\n        \"bool\": {\n          \"must\": [{\n            \"multi_match\": {\n              \"query\": \"iphon case\", \"fields\": [\"title^3\", \"brand^2\", \"description\"],\n              \"type\": \"best_fields\", \"fuzziness\": \"AUTO\", \"prefix_length\": 1, \"max_expansions\": 50\n            }\n          }],\n          \"filter\": [\n            { \"term\":  { \"brand\": \"Apple\" } },\n            { \"range\": { \"price\": { \"gte\": 500, \"lte\": 2000 } } },\n            { \"term\":  { \"inStock\": true } }\n          ]\n        }\n      },\n      \"functions\": [\n        { \"field_value_factor\": { \"field\": \"popularityScore\", \"modifier\": \"log1p\", \"missing\": 0 }, \"weight\": 0.3 },\n        { \"filter\": { \"term\": { \"inStock\": true } }, \"weight\": 1.2 }\n      ],\n      \"score_mode\": \"sum\", \"boost_mode\": \"multiply\"\n    }\n  },\n  \"aggs\": {\n    \"brands\":     { \"terms\": { \"field\": \"brand\", \"size\": 10 } },\n    \"categories\": { \"terms\": { \"field\": \"categoryPath\", \"size\": 10 } },\n    \"price_ranges\": { \"range\": { \"field\": \"price\", \"ranges\": [{ \"to\": 500 }, { \"from\": 500, \"to\": 2000 }, { \"from\": 2000 }] } }\n  },\n  \"sort\": [\"_score\", { \"productId\": \"asc\" }],\n  \"track_total_hits\": 10000\n}\n```\n\nAb code:\n\n```ts\nimport type { SearchRequest } from '../types/search';\n\nconst SORT_MAP: Record\u003cSearchRequest['sort'], unknown[]> = {\n  relevance:  ['_score',                    { productId: 'asc' }],\n  price_asc:  [{ price: 'asc'  },           { productId: 'asc' }],\n  price_desc: [{ price: 'desc' },           { productId: 'asc' }],\n  newest:     [{ createdAt: 'desc' },       { productId: 'asc' }],\n  rating:     [{ rating: 'desc' },          { productId: 'asc' }],\n};\n\nconst AGGS = {\n  brands:     { terms: { field: 'brand', size: 10 } },\n  categories: { terms: { field: 'categoryPath', size: 10 } },\n  price_ranges: { range: { field: 'price', ranges: [{ to: 500 }, { from: 500, to: 2000 }, { from: 2000 }] } },\n};\n\nexport function buildSearchQuery(req: SearchRequest): Record\u003cstring, unknown> {\n  // ---- 1. QUERY CONTEXT: scoring wala hissa ----\n  const must: unknown[] = req.q\n    ? [{\n        multi_match: {\n          query: req.q,\n          fields: ['title^3', 'brand^2', 'description'],\n          type: 'best_fields',\n          fuzziness: 'AUTO',\n          prefix_length: 1,\n          max_expansions: 50,\n        },\n      }]\n    : [{ match_all: {} }];\n\n  // ---- 2. FILTER CONTEXT: sirf haan/naa, koi score nahi ----\n  const filter: unknown[] = [];\n  const f = req.filters;\n\n  if (f.brand?.length)        filter.push({ terms: { brand: f.brand } });\n  if (f.categoryPath?.length) filter.push({ terms: { categoryPath: f.categoryPath } });\n  if (f.minRating !== undefined) filter.push({ range: { rating: { gte: f.minRating } } });\n  if (f.inStockOnly)          filter.push({ term: { inStock: true } });\n\n  if (f.priceMin !== undefined || f.priceMax !== undefined) {\n    const range: Record\u003cstring, number> = {};\n    if (f.priceMin !== undefined) range.gte = f.priceMin;\n    if (f.priceMax !== undefined) range.lte = f.priceMax;\n    filter.push({ range: { price: range } });\n  }\n\n  // ---- 3. BUSINESS BOOSTS: text relevance ko multiply karo ----\n  const query = {\n    function_score: {\n      query: { bool: { must, filter } },\n      functions: [\n        { field_value_factor: { field: 'popularityScore', modifier: 'log1p', missing: 0 }, weight: 0.3 },\n        { filter: { term: { inStock: true } }, weight: 1.2 },\n      ],\n      score_mode: 'sum',\n      boost_mode: 'multiply',\n    },\n  };\n\n  // ---- 4. Pagination + sort ----\n  const body: Record\u003cstring, unknown> = {\n    size: req.size,\n    query,\n    aggs: AGGS,\n    sort: SORT_MAP[req.sort],\n    track_total_hits: 10000,\n    _source: ['productId', 'title', 'brand', 'price', 'rating', 'inStock'],\n  };\n\n  if (req.searchAfter) {\n    body.search_after = req.searchAfter;      // cursor mode -- `from` NAHI\n  } else {\n    body.from = (req.page - 1) * req.size;\n  }\n\n  return body;\n}\n```\n\n**Code Explanation:**\n\n**`SORT_MAP`** -- ek static object. User ka `sort` string sirf **is map ka key** ban sakta hai (zod enum ne pehle hi guarantee kar diya). Yani user kabhi `{ sellerId: 'asc' }` inject nahi kar sakta. **Har entry ka last element `{ productId: 'asc' }` hai** -- tie-breaker (PART 8.2b). Ye chhoot jaaye to `search_after` mein documents repeat/skip honge, aur bug reproduce karna bahut mushkil hoga.\n\n**`AGGS`** -- teen facets, sab `keyword`/numeric fields par. `size: 10` matlab top 10 buckets. Ye constant isliye hai ki har request ke liye naya object banane ki zarurat nahi -- JS mein object literal har call par allocate hota hai, aur 1,000 QPS par ye GC pressure banata hai.\n\n**`req.q ? multi_match : match_all`** -- khaali query ka matlab \"category browse\" hai (`/search?categoryPath=electronics/mobiles`). `match_all` sab documents match karta hai score `1.0` ke saath, aur filters usko narrow karte hain. Bina is branch ke khaali `q` par `multi_match` zero results de deta.\n\n**`fields: ['title^3', 'brand^2', 'description']`** -- `^` ek **boost multiplier** hai.\n- `title^3` -- title mein match **3x** weight ka. Kyun? Title chhota aur curated hota hai -- wahan \"iphone\" hona strong signal hai.\n- `brand^2` -- brand match 2x. `\"apple\"` search par Apple brand ke products upar.\n- `description` (boost 1) -- description lambi hoti hai aur usme sab kuch likha hota hai (\"compatible with iPhone, Samsung, OnePlus...\"). Wahan match weak signal hai.\n- **Ye teen numbers hi Part 1 ki \"relevance problem\" ka jawab hain.** SQL `LIKE` mein ye concept exist hi nahi karta -- wahan title match aur description match barabar hain.\n\n**`type: 'best_fields'`** -- multiple fields match hue to score kaise banega? `best_fields` = **sabse achhe ek field ka score** lo (sabka sum nahi). Kyun? Kyunki \"iphone case\" ek hi field (title) mein pura milna chahiye -- `\"iphone\"` title mein aur `\"case\"` description mein milna utna achha match nahi hai. (Alternative `cross_fields` tab use hota hai jab query ke words **naturally alag fields** mein bikhre hon, jaise person name search.)\n\n**`fuzziness: 'AUTO'`** -- typo tolerance. Levenshtein edit distance:\n- length 1-2 -> 0 edits allowed (`\"ip\"` ko fuzzy karne ka matlab nahi)\n- length 3-5 -> 1 edit (`\"iphon\"` -> `\"iphone\"`)\n- length > 5 -> 2 edits (`\"smartphne\"` -> `\"smartphone\"`)\n\n`AUTO` isliye ki fixed `fuzziness: 2` chhote words par tabaahi machata hai -- `\"cat\"` se `\"car\"`, `\"cap\"`, `\"bat\"`, `\"hat\"` sab match honge.\n\n**`prefix_length: 1`** -- **pehla character sahi maano**, uspar fuzzy mat karo. Ye pure query ka sabse bada performance lever hai. Bina iske ES ko **poori term dictionary** mein edit-distance-2 wale terms dhoondhne padte hain (lakhon terms). `prefix_length: 1` se search sirf `\"i\"` se shuru hone wale terms tak simit ho jaata hai -- **20-50x tez**. Cost: `\"iphone\"` ko `\"ophone\"` likho to match nahi hoga. Real users pehla akshar 99% sahi likhte hain.\n\n**`max_expansions: 50`** -- ek fuzzy term max 50 alternatives mein expand hoga. Iske bina ek common prefix wala term hazaaron terms mein expand ho sakta hai aur boolean clause limit cross kar sakta hai.\n\n---\n\n#### Query context vs filter context -- ye poore search ka sabse bada performance concept hai\n\n`bool` query ke andar do alag \"duniya\" hain:\n\n| | `must` / `should` (**query context**) | `filter` / `must_not` (**filter context**) |\n|---|---|---|\n| Sawaal | \"ye document **kitna** match karta hai?\" | \"ye document match karta hai: **haan ya na**?\" |\n| Output | ek float `_score` | ek bit: 1 ya 0 |\n| Calculation | BM25 (tf, idf, field length) -- **mehenga** | Sirf term lookup -- **sasta** |\n| Cacheable? | **Nahi** | **Haan -- bitset ke roop mein** |\n| Kis liye | `q` ka text match | brand, price range, inStock, category |\n\n**\"Cacheable bitset\" ka matlab kya hai?**\n\nJab tum `{ \"term\": { \"brand\": \"Apple\" } }` ko **filter** mein daalte ho, Lucene ek **bitset** banata hai -- har document ke liye ek bit:\n\n```\nShard 0 ke documents:   doc0 doc1 doc2 doc3 doc4 doc5 doc6 doc7 ...\nbrand=Apple ka bitset:    1    0    0    1    1    0    0    1   ...\n                          ^                ^    ^              ^\n                       Apple ke products\n```\n\nYe bitset **cache** ho jaata hai (query cache mein, per segment). Ab:\n\n- **Agli baar** koi bhi `brand=Apple` filter lagaye -- chahe query `\"iphone case\"` ho ya `\"apple watch\"` -- ye bitset **dobara nahi banega**, cache se aa jaayega.\n- Multiple filters combine karna ek **bitwise AND** hai -- CPU ke liye trivially fast:\n\n```\nbrand=Apple:        1 0 0 1 1 0 0 1\nprice 500-2000:     1 1 0 1 0 0 1 1\ninStock=true:       1 0 1 1 1 1 0 0\n                    ---------------  AND\nfinal candidates:   1 0 0 1 0 0 0 0   -> sirf doc0 aur doc3 ko score karna hai\n```\n\n- Aur sabse bada fayda: **scoring sirf surviving documents par chalti hai.** 50M documents mein se filters ne 2,000 bacha diye -- BM25 sirf un 2,000 par chalega, 50M par nahi.\n\n**Agar tum galti se filters ko `must` mein daal do:**\n\n```json\n\"must\": [\n  { \"multi_match\": { ... } },\n  { \"term\": { \"brand\": \"Apple\" } },        // [X] GALAT\n  { \"range\": { \"price\": { \"gte\": 500 } } } // [X] GALAT\n]\n```\n\n1. **Har brand match par BM25 calculate hoga.** Brand ek exact term hai -- uska \"score\" ka koi matlab hi nahi hai. Ye pure waste CPU hai.\n2. **Koi bitset cache nahi hoga.** Har request wahi kaam dobara.\n3. **Scores corrupt ho jaayenge.** `brand: \"Apple\"` ka IDF score final `_score` mein jud jaayega. Nateeja: **Apple ke products sirf isliye upar aa jaayenge ki unhone filter match kiya** -- jabki har result ne filter match kiya hai (warna wo result hota hi nahi). Ye ranking ko silently kharab karta hai aur pakadna bahut mushkil hai.\n\n> **Rule jo hamesha yaad rakho:** \"Jo cheez **score mein contribute nahi karti**, use hamesha `filter` mein daalo.\" Ek line ka test: \"Kya mujhe farak padta hai ki ye clause **kitna** match karta hai?\" Agar jawab \"nahi, bas match hona chahiye\" hai -> `filter`.\n\n---\n\n**`terms` vs `term`** -- code mein `{ terms: { brand: f.brand } }` hai kyunki `f.brand` ek **array** hai (`[\"Apple\", \"Spigen\"]`). `terms` ka matlab **OR**: \"in values mein se koi bhi\". Spec ke JSON mein single-value `term` dikhaya gaya hai -- wo ek brand wala case hai. Multi-select UI ke liye `terms` chahiye.\n\n**`if (f.inStockOnly)`** -- yahan `!== undefined` nahi, **truthiness** check hai. Kyunki controller ne `false` ki jagah `undefined` bheja hai (upar dekha). `inStockOnly` `true` hone par hi filter lagta hai.\n\n**Price range building** -- `gte` aur `lte` alag-alag optional hain. Ek `Record` bana ke sirf jo mile wo daalte hain. Agar `{ gte: undefined }` bhej dete to ES `null` ko galat samajh sakta hai; isliye key hi mat daalo.\n\n**`function_score` -- business boosts:**\n\n- `query: { bool: { must, filter } }` -- **pehle text relevance nikalo**, phir uspar business signals lagao.\n- `field_value_factor: { field: 'popularityScore', modifier: 'log1p', missing: 0 }` -- `popularityScore` (30-day orders se nikla number) ko score mein laao.\n  - **`modifier: 'log1p'` kyun?** Kyunki popularity ki distribution bahut skewed hoti hai: ek bestseller ke 500,000 orders, normal product ke 50. Raw value use karoge to bestseller ka score `10,000x` ho jaayega aur **text relevance ka koi matlab hi nahi bachega** -- har query par wahi 10 bestsellers aayenge. `log1p(x) = ln(1 + x)` isko compress karta hai:\n\n    ```\n    popularity      raw        log1p\n         50          50         3.9\n      5,000       5,000         8.5\n    500,000     500,000        13.1\n    ```\n\n    Dekho: 10,000x ka farak sirf ~3.4x ban gaya. Popularity ab ek **tie-breaker** hai, dictator nahi.\n  - **`missing: 0`** -- naye products ka `popularityScore` nahi hota. Bina iske ES error de sakta hai ya unpredictable behave kar sakta hai. `0` ka matlab \"koi popularity boost nahi\", jo naye product ke liye sahi hai.\n  - **`weight: 0.3`** -- is function ka contribution. Ye number tuning se aata hai (A/B test), theory se nahi.\n- `{ filter: { term: { inStock: true } }, weight: 1.2 }` -- **in-stock products ko 20% boost.** Kyun? Out-of-stock product user ke liye bekaar hai (aur conversion zero). Par use poori tarah **hide nahi karte** -- kabhi-kabhi user specifically wahi product dhoondh raha hota hai aur \"notify me\" lagana chahta hai. Isliye boost, filter nahi. (User khud `inStock=true` filter laga sakta hai.)\n- **`score_mode: 'sum'`** -- functions ke results kaise jodein? `sum` = `0.3 * log1p(popularity) + 1.2`. (`multiply`, `avg`, `max`, `first` bhi options hain.)\n- **`boost_mode: 'multiply'`** -- functions ka result **text score ke saath** kaise jode? `multiply` = `finalScore = textScore * functionScore`.\n  - **Ye sabse important knob hai.** `multiply` ka matlab: text relevance **base** hai, business signals usko **scale** karte hain. Agar text match hi kamzor hai (score 0.5), to popularity kitni bhi ho, product upar nahi aayega.\n  - `boost_mode: 'replace'` use karte to text score **poori tarah phenk diya** jaata aur sirf popularity bachti -- yani har query par wahi bestsellers. **Kabhi mat karo.**\n  - `boost_mode: 'sum'` bhi risky hai: bada popularity score chhote text score ko dabaa sakta hai.\n\n> **Rule:** \"**Text relevance ko multiply karo, replace mat karo.**\" Search pehle relevant hona chahiye, phir commercial.\n\n**`_source: [...]`** -- ES se **sirf 6 fields** maango, poora document nahi. Document ~2 KB ka hai; ye 6 fields ~200 bytes ke. 24 documents par: 48 KB ki jagah ~5 KB. Fetch phase tez, network kam, JSON parse tez. Yeh ek line 5-10 ms bachati hai.\n\n**`track_total_hits: 10000`** -- PART 8.2c.\n\n**`search_after` vs `from`** -- **dono kabhi ek saath nahi.** `search_after` ke saath `from` bhejo to ES error deta hai. Isliye `if/else`. Cursor mode mein \"skip\" ka concept hi nahi hota -- ES seedha us point se aage padhta hai.\n\n**Function pure hai:** poore function mein koi `await`, koi `Date.now()`, koi `fetch`, koi global read nahi. `SORT_MAP` aur `AGGS` constants hain. Isi wajah se iska test bina kisi infrastructure ke chalta hai.\n\n---\n\n### 4. `services/search.service.ts` -- cache-aside + fallback policy\n\n```ts\nimport { createHash } from 'node:crypto';\nimport { esClient } from '../infra/elasticsearch';\nimport { redis } from '../infra/redis';\nimport { logger } from '../infra/logger';\nimport { buildSearchQuery } from '../search/query-builder';\nimport { mapSearchResponse } from '../search/response-mapper';\nimport { productRepository } from '../repositories/product.repository';\nimport { esQueryDuration, cacheHits, cacheMisses, zeroResults, degradedTotal } from '../infra/metrics';\nimport type { SearchRequest, SearchResponse } from '../types/search';\n\nconst CACHE_TTL_SEC = 60;\nconst inFlight = new Map\u003cstring, Promise\u003cSearchResponse>>();\n\nfunction cacheKey(req: SearchRequest): string {\n  const canonical = JSON.stringify({\n    q: req.q.toLowerCase().replace(/\\s+/g, ' ').trim(),\n    f: {\n      brand: req.filters.brand?.slice().sort(),\n      cat: req.filters.categoryPath?.slice().sort(),\n      pmin: req.filters.priceMin, pmax: req.filters.priceMax,\n      rating: req.filters.minRating, stock: req.filters.inStockOnly,\n    },\n    s: req.sort,\n    p: req.page,\n    n: req.size,\n  });\n  return `q:${createHash('sha1').update(canonical).digest('hex')}`;\n}\n\nasync function runEsSearch(req: SearchRequest, startedAt: number): Promise\u003cSearchResponse> {\n  const body = buildSearchQuery(req);\n\n  const esStart = Date.now();\n  const res = await esClient.search(\n    { index: 'products', ...body, timeout: '800ms', allow_partial_search_results: true },\n    { requestTimeout: 1000 },\n  );\n  esQueryDuration.observe({ index: 'products' }, (Date.now() - esStart) / 1000);\n\n  const mapped = mapSearchResponse(res, Date.now() - startedAt);\n  if (mapped.hits.length === 0) zeroResults.inc();\n  return mapped;\n}\n\nexport const searchService = {\n  async search(req: SearchRequest): Promise\u003cSearchResponse> {\n    const startedAt = Date.now();\n    const key = cacheKey(req);\n    const cacheable = req.page === 1 && !req.searchAfter;\n\n    // ---- 1. Cache lookup (cache-aside) ----\n    if (cacheable) {\n      try {\n        const cached = await redis.get(key);\n        if (cached) {\n          cacheHits.inc();\n          const parsed = JSON.parse(cached) as SearchResponse;\n          return { ...parsed, tookMs: Date.now() - startedAt };\n        }\n        cacheMisses.inc();\n      } catch (err) {\n        logger.warn({ err }, 'redis cache read failed -- continuing to ES');\n      }\n    }\n\n    // ---- 2. Single-flight guard (stampede protection) ----\n    const existing = cacheable ? inFlight.get(key) : undefined;\n    if (existing) return existing;\n\n    const work = (async (): Promise\u003cSearchResponse> => {\n      try {\n        const result = await runEsSearch(req, startedAt);\n\n        if (cacheable && !result.degraded) {\n          redis.setex(key, CACHE_TTL_SEC, JSON.stringify(result))\n               .catch((err) => logger.warn({ err }, 'cache write failed'));\n        }\n        return result;\n      } catch (err) {\n        // ---- 3. ES failed -> degraded Postgres search ----\n        logger.error({ err, q: req.q }, 'ES search failed -- falling back to Postgres');\n        degradedTotal.inc();\n        const rows = await productRepository.degradedSearch(req.q, 20);\n        return {\n          hits: rows,\n          total: rows.length,\n          totalIsLowerBound: true,\n          facets: { brands: [], categories: [], priceRanges: [] },\n          tookMs: Date.now() - startedAt,\n          degraded: true,\n        };\n      } finally {\n        inFlight.delete(key);\n      }\n    })();\n\n    if (cacheable) inFlight.set(key, work);\n    return work;\n  },\n};\n```\n\n**Code Explanation -- `cacheKey`:**\n\n- `JSON.stringify({...})` -- poore request ka ek **canonical string**. \"Canonical\" ka matlab: semantically same requests ka string bhi **bilkul same** hona chahiye.\n- `req.q.toLowerCase().replace(/\\s+/g, ' ').trim()` -- `\"  iPhone   Case \"` aur `\"iphone case\"` ek hi key. Ye seedha cache hit ratio badhata hai.\n- `req.filters.brand?.slice().sort()` -- **`.sort()` bahut important hai.** `?brand=Apple&brand=Spigen` aur `?brand=Spigen&brand=Apple` bilkul same search hai, par arrays alag order mein hain -> alag JSON -> alag key -> ek hi result do baar cache. `.sort()` order ko normalize karta hai.\n  - `.slice()` pehle kyun? Kyunki `.sort()` array ko **in-place** modify karta hai. Bina `.slice()` ke tum caller ka `req.filters.brand` mutate kar doge -- ek classic silent bug.\n- Short keys (`f`, `s`, `p`, `n`) -- ye string hash hone se pehle ka hai, to size se koi farak nahi padta, par canonical string chhoti rehti hai (thoda tez hash).\n- `createHash('sha1').update(canonical).digest('hex')` -- fixed 40-char output. Spec ka format: `q:\u003csha1(normalizedQuery+filters+sort+page)>`.\n- **SHA-1 security ke liye nahi hai** -- yahan koi attacker collision se kuch gain nahi kar sakta (worst case do alag queries ek cache entry share karein -- jiska practical probability zero hai). Ye **fingerprinting** hai, isliye tez SHA-1 kaafi hai.\n\n**Code Explanation -- `runEsSearch`:**\n\n- `buildSearchQuery(req)` -- pure function, DSL milta hai.\n- `esClient.search({ index: 'products', ...body })` -- **`'products'` alias hai**, `products_v3` nahi. Isi wajah se zero-downtime reindex possible hai (PART 9b).\n- `timeout: '800ms'` -- **ES-side** timeout. ES shards ko 800 ms deta hai; uske baad jo shards ne diya wahi partial result wapas kar deta hai.\n- `allow_partial_search_results: true` -- ek shard timeout/fail ho to baaki 5 ke results do. **5/6 results zero results se bahut behtar hai.** (Mapper `_shards.failed` check karke metric badhata hai -- neeche.)\n- `{ requestTimeout: 1000 }` (second argument) -- **client-side** timeout, per-call override. Do layers: ES ko 800 ms, client 1,000 ms tak wait karta hai. Client wala thoda bada isliye ki ES ko apna partial response bhejne ka mauka mile.\n- `esQueryDuration.observe(...)` -- histogram metric. Isse p50/p95/p99 dashboards bante hain. **Dhyaan:** hum apna measured time record kar rahe hain (network sameth), ES ka `took` nahi -- kyunki user ko poora time lagta hai.\n- `if (mapped.hits.length === 0) zeroResults.inc()` -- **zero-result rate** Part 1 ka target metric hai (abhi ~12%, target \u003c 5%). Ye metric hi batata hai ki synonyms/typo tolerance kaam kar rahi hai ya nahi.\n\n**Code Explanation -- `search()` -- cache-aside pattern:**\n\n- `const cacheable = req.page === 1 && !req.searchAfter` -- **sirf page 1 cache karte hain.** Page 2+ ki repeat rate bahut kam hai; unhe cache karna Redis memory waste karna hai aur head queries ko evict karta hai. Cursor wali requests to definitionally unique hoti hain.\n- `await redis.get(key)` -> **cache-aside** ka step 1: \"pehle cache dekho\".\n  - Cache-aside (lazy loading) ka matlab: application cache ko manage karta hai. Miss par DB/ES se lao aur cache mein daal do. Ye **read-through** se alag hai (jahan cache khud fetch karta hai).\n- `return { ...parsed, tookMs: Date.now() - startedAt }` -- cached body wapas kar rahe hain **lekin `tookMs` fresh calculate kiya**. Kyun? Cached `tookMs` mein purani (74 ms wali) value hai; usko wapas bhejna jhooth hai. Cache hit ka asli time ~5 ms hai, aur frontend ko wahi dikhna chahiye.\n- **`try/catch` around `redis.get`** -- **Redis down hone se search down nahi honi chahiye.** Cache ek optimization hai, dependency nahi. Error log karo (sampled), aur seedha ES chale jao. Latency badhegi (cache hits khatam), par system zinda rahega.\n  - Ye `URL Shortener` lesson wala hi principle hai: \"cache ko cache ki tarah treat karo, source of truth ki tarah nahi.\"\n- **Single-flight / stampede guard (`inFlight` map):**\n  - **Problem (cache stampede / thundering herd):** `\"iphone\"` ki cache entry expire hui. Us exact moment par 300 concurrent requests aayi. Sabko miss mila. Ab **300 identical queries ek saath ES par** jaayengi -- wahi kaam 300 baar, aur ES spike.\n  - **Solution:** ek `Map\u003ckey, Promise>`. Pehli request kaam shuru karti hai aur apna **promise** map mein daal deti hai. Baaki 299 requests wahi promise `await` karti hain. **ES par sirf 1 query jaati hai**, jawab sabko milta hai.\n  - `finally { inFlight.delete(key) }` -- kaam khatam (success ya fail) hone par entry hatao, warna map leak karega aur agla request purana result paayega.\n  - **Limitation (interview mein bolna):** ye guard **per-process** hai. 10 Node instances hain to worst case 10 queries jaayengi, 300 nahi -- 30x improvement, par perfect nahi. **Cross-process** chahiye to Redis mein ek short lock (`SET key NX PX 2000`) chahiye, ya \"stale-while-revalidate\" (expire hone par purana result serve karo aur background mein refresh karo). Hamare scale par per-process guard kaafi hai.\n- `redis.setex(key, 60, JSON.stringify(result))` **bina `await`** -- fire and forget. Cache write user ko wait karane layak nahi hai. `.catch(...)` zaroori hai warna Node `unhandledRejection` par process crash kar sakta hai.\n- **`if (cacheable && !result.degraded)`** -- **degraded result kabhi cache mat karo.** Warna ES 30 second mein wapas aa jaaye, phir bhi agle 60 second tak users ko facets-less degraded results milte rahenge. Ye bug production mein \"ES to theek hai, phir search kharab kyun hai?\" wala confusion banata hai.\n- **Fallback `catch` block:**\n  - `degradedTotal.inc()` -- `search_degraded_total` metric. Ispar alert hona chahiye: `rate(search_degraded_total[5m]) > 0` matlab ES mein kuch gadbad hai.\n  - `productRepository.degradedSearch(req.q, 20)` -- Postgres se top 20 (SQL neeche). **Facets khaali** -- kyunki Postgres par facet counts nikalna har filter ke liye ek alag `GROUP BY` hai = bahut mehenga = ye wahi load hai jo DB ko maar dega, aur DB abhi hamara aakhri sahara hai.\n  - `degraded: true` -- UI banner (PART 8.2e).\n  - Agar `degradedSearch` bhi throw kar de? Error controller tak jaata hai -> `503 SEARCH_UNAVAILABLE`. **Teen level ka degradation: cache -> Postgres -> 503.**\n\n> **Interview line:** \"Cache ek optimization hai, dependency nahi -- Redis fail ho to main ES chala jaata hoon. ES ek derived view hai, source of truth nahi -- ES fail ho to main Postgres se degraded results deta hoon aur response mein `degraded: true` bhejta hoon taaki UI honest ban sake. 503 tabhi deta hoon jab teeno layers fail hon. Rate limiter mein ye 'fail open vs closed' tha; search mein ye **'degrade, don't die'** ban jaata hai.\"\n\n---\n\n### 5. `search/response-mapper.ts` -- ES response -> `SearchResponse` (pure function)\n\n```ts\nimport type { SearchResponse as EsResponse } from '@elastic/elasticsearch/lib/api/types';\nimport type { SearchHit, SearchResponse, FacetBucket } from '../types/search';\nimport { partialShardFailures } from '../infra/metrics';\nimport { logger } from '../infra/logger';\n\ninterface EsSource {\n  productId: string; title: string; brand?: string;\n  price: number; rating?: number; inStock: boolean;\n}\n\nexport function mapSearchResponse(res: EsResponse\u003cEsSource>, tookMs: number): SearchResponse {\n  // ---- 1. Partial failure detection ----\n  const failedShards = res._shards?.failed ?? 0;\n  if (failedShards > 0) {\n    partialShardFailures.inc(failedShards);\n    logger.warn(\n      { failed: failedShards, total: res._shards?.total,\n        reason: res._shards?.failures?.[0]?.reason?.type },\n      'partial shard failure -- results are incomplete',\n    );\n  }\n\n  // ---- 2. Hits ----\n  const hits: SearchHit[] = res.hits.hits.map((h) => {\n    const s = h._source as EsSource;\n    return {\n      productId: s.productId,\n      title: s.title,\n      brand: s.brand ?? '',\n      price: s.price,\n      rating: s.rating ?? 0,\n      inStock: s.inStock,\n      score: h._score ?? 0,\n    };\n  });\n\n  // ---- 3. Total (lower bound ya exact) ----\n  const totalRaw = res.hits.total;\n  const total = typeof totalRaw === 'number' ? totalRaw : (totalRaw?.value ?? 0);\n  const totalIsLowerBound = typeof totalRaw === 'object' && totalRaw?.relation === 'gte';\n\n  // ---- 4. Facets ----\n  const aggs = res.aggregations as Record\u003cstring, any> | undefined;\n\n  const terms = (name: string): FacetBucket[] =>\n    (aggs?.[name]?.buckets ?? []).map((b: any) => ({ value: String(b.key), count: b.doc_count }));\n\n  const ranges = (name: string): FacetBucket[] =>\n    (aggs?.[name]?.buckets ?? [])\n      .map((b: any) => ({ value: String(b.key), count: b.doc_count }))\n      .filter((b: FacetBucket) => b.count > 0);\n\n  // ---- 5. Next cursor ----\n  const lastHit = res.hits.hits[res.hits.hits.length - 1];\n  const sortVals = lastHit?.sort;\n  const searchAfter =\n    Array.isArray(sortVals) && sortVals.length === 2\n      ? ([Number(sortVals[0]), String(sortVals[1])] as [number, string])\n      : undefined;\n\n  return {\n    hits,\n    total,\n    totalIsLowerBound,\n    facets: {\n      brands: terms('brands'),\n      categories: terms('categories'),\n      priceRanges: ranges('price_ranges'),\n    },\n    tookMs,\n    searchAfter,\n  };\n}\n```\n\n**Code Explanation:**\n\n- **Ye function bhi `[PURE]` hai** -- ek object andar, ek object bahar. Koi I/O nahi. Iska matlab tum ES ka ek real response JSON file mein save karke 30 alag mapping tests likh sakte ho.\n- **`_shards.failed` check (sabse important hissa):** humne `allow_partial_search_results: true` set kiya hai. Iska matlab ES **chup-chaap** adhoore results de dega -- HTTP status 200 hi aayega, koi error nahi. Agar tum ye check na karo:\n  - 6 mein se 2 shards fail -> user ko **ek-tihaai catalog gayab** dikhega.\n  - Koi alert nahi, koi error rate spike nahi. Bas \"aaj search kharab lag raha hai\" wali complaints.\n  - **Ye \"silent data loss\" hai -- monitoring mein sabse khatarnak category.**\n  - Isliye `partialShardFailures` metric aur ek `warn` log. `res._shards.failures[0].reason.type` se pata chalta hai kyun (`search_phase_execution_exception`, `circuit_breaking_exception`, timeout).\n- `res.hits.hits.map(...)` -- ES ka nested shape (`hits.hits[]._source`) hamare flat `SearchHit` mein. **Ye \"anti-corruption layer\" hai** -- ES ki shape kabhi frontend tak nahi jaati.\n- `h._source as EsSource` -- `_source` mein wahi 6 fields hain jo query builder ne `_source: [...]` se maange the.\n- `brand: s.brand ?? ''` aur `rating: s.rating ?? 0` -- **defensive defaults.** Postgres mein `brand` nullable hai (unbranded products). ES document mein field **ho hi nahi sakti**. Frontend ko `undefined` bhejne se `product.brand.toUpperCase()` par crash hota hai. Mapper har optional field ko concrete value deta hai.\n- `score: h._score ?? 0` -- `_score` `null` hota hai jab sort `_score` par nahi hai (jaise `price_asc`). ES us case mein scoring skip kar deta hai (optimization) aur `null` deta hai.\n- **`res.hits.total` ka double shape:** ES 7+ mein ye `{ value, relation }` object hai, par purane clients/settings (`rest_total_hits_as_int`) mein plain number ho sakta hai. `typeof` check dono ko handle karta hai -- ye defensive coding ES upgrades ke liye hai.\n- `totalIsLowerBound = ... relation === 'gte'` -- PART 8.2c ka poora mapping ek line mein. `gte` -> UI \"10,000+\" dikhayega.\n- `terms(name)` helper -- `aggs?.[name]?.buckets ?? []`. **Teen safety layers:** aggregations ho hi na (fallback case), us naam ka agg na ho, ya buckets na hon. Har case mein khaali array -- kabhi crash nahi.\n- `String(b.key)` -- ES bucket key string, number ya boolean ho sakta hai. API contract mein `value: string` hai, to normalize kar do.\n- `ranges(name)` mein `.filter((b) => b.count > 0)` -- **zero-count range facets hata do.** `price_ranges` hamesha teeno buckets deta hai (`*-500`, `500-2000`, `2000-*`) chahe count 0 ho. UI par \"Under Rs 500 (0)\" dikhana bekaar hai -- user click karega aur khaali page milega.\n  - **Dhyaan do:** `terms` facets par ye filter nahi lagaya -- `terms` aggregation waise bhi zero-count buckets nahi deti.\n- **`lastHit?.sort`** -- ES har hit ke saath uski **sort values** deta hai (jab `sort` specify kiya ho). Aakhri hit ki sort values hi agle page ka cursor hain. Yahi `search_after` ka poora mechanism hai -- tum khud koi cursor generate nahi karte, ES tumhe de deta hai.\n- `sortVals.length === 2` check -- hamare `SORT_MAP` ke har entry mein 2 elements hain (main sort + `productId` tie-breaker). Agar kabhi 3 ho jaaye to type mismatch pakadna chahiye, silently galat cursor nahi banana chahiye.\n- `[Number(sortVals[0]), String(sortVals[1])]` -- tuple type mein cast. `_score` float aata hai, `price` number, `createdAt` epoch millis (number) -- sab `Number` ho jaate hain. `productId` string.\n- **`searchAfter` hamesha bhejte hain, sirf page 50 par nahi.** Frontend \"Load more\" ke liye isko use kar sakta hai chahe user page 2 par ho -- infinite scroll ke liye bhi yahi chahiye.\n\n---\n\n### 6. `services/suggest.service.ts` -- prefix cache + edge n-gram\n\n```ts\nimport { esClient } from '../infra/elasticsearch';\nimport { redis } from '../infra/redis';\nimport { logger } from '../infra/logger';\nimport { suggestLatency } from '../infra/metrics';\n\nconst SUGGEST_TTL_SEC = 600;              // 10 minutes\nconst MAX_PREFIX_LEN = 50;\n\nexport interface Suggestion { text: string; type: 'query' | 'product' | 'category' }\n\nfunction prefixKey(q: string): string {\n  return `sug:${q.toLowerCase().replace(/\\s+/g, ' ').trim().slice(0, MAX_PREFIX_LEN)}`;\n}\n\nexport const suggestService = {\n  async suggest(q: string, limit: number): Promise\u003cSuggestion[]> {\n    const startedAt = Date.now();\n    const key = prefixKey(q);\n\n    // ---- 1. Redis prefix cache (70-80% hit) ----\n    try {\n      const cached = await redis.get(key);\n      if (cached) {\n        suggestLatency.observe({ source: 'cache' }, (Date.now() - startedAt) / 1000);\n        return (JSON.parse(cached) as Suggestion[]).slice(0, limit);\n      }\n    } catch (err) {\n      logger.warn({ err }, 'suggest cache read failed');\n    }\n\n    // ---- 2. ES edge n-gram query on suggestions_v2 ----\n    try {\n      const res = await esClient.search\u003c{ text: string; type: Suggestion['type']; popularity: number }>(\n        {\n          index: 'suggestions',\n          size: 20,\n          query: {\n            bool: {\n              must: [{ match: { 'text.ac': { query: q, operator: 'and' } } }],\n              filter: [{ term: { enabled: true } }],\n            },\n          },\n          sort: [{ popularity: 'desc' }, { 'text.keyword': 'asc' }],\n          _source: ['text', 'type'],\n          track_total_hits: false,\n        },\n        { requestTimeout: 300 },\n      );\n\n      const out: Suggestion[] = res.hits.hits.map((h) => ({\n        text: h._source!.text,\n        type: h._source!.type,\n      }));\n\n      redis.setex(key, SUGGEST_TTL_SEC, JSON.stringify(out))\n           .catch((err) => logger.warn({ err }, 'suggest cache write failed'));\n\n      suggestLatency.observe({ source: 'es' }, (Date.now() - startedAt) / 1000);\n      return out.slice(0, limit);\n    } catch (err) {\n      logger.warn({ err, q }, 'suggest failed -- returning empty');\n      return [];                         // [OK] kabhi 500 nahi\n    }\n  },\n};\n```\n\n**Code Explanation:**\n\n- `SUGGEST_TTL_SEC = 600` -- 10 minute, search ke 60 second se **10x zyada**. Kyun? Suggestions ka data `query_popularity` table se aata hai jo **nightly** update hota hai. 10 minute purani suggestion bilkul theek hai. Lamba TTL = zyada hits = kam ES load, aur 4,000 QPS par yahi bachata hai.\n- `prefixKey` -- same normalization jaisa search mein: lowercase, whitespace collapse, trim, 50 chars cap. `\"IPH\"`, `\"iph\"`, `\" iph \"` ek hi Redis key.\n- **Redis pehle, hamesha.** Part 1 ka number: autocomplete peak ~4,000 QPS. ~75% cache hit ratio matlab ES par sirf ~1,000 QPS. Bina cache ke ES ko 4,000 QPS handle karna padta -- aur wahi cluster main search bhi chala raha hai.\n  - Cache hit ka latency ~3-5 ms. p99 \u003c 100 ms ka requirement isi ki wajah se comfortable hai.\n- `.slice(0, limit)` cache hit par -- hum cache mein **20 suggestions** rakhte hain par user ne `limit=10` maanga. Ek hi cache entry alag-alag `limit` values ko serve kar deti hai. Agar `limit` cache key ka hissa hota to 20 alag entries banti -- memory waste.\n- `index: 'suggestions'` -- alias, `suggestions_v2` nahi. Same reindex pattern.\n- `match: { 'text.ac': { query: q, operator: 'and' } }` -- `text.ac` woh edge-n-gram sub-field hai. User ne `\"iph\"` bheja; search analyzer `standard` hai (edge n-gram **nahi**), to query term sirf `\"iph\"` banega aur index mein pade `\"iph\"` gram se match karega.\n  - **`operator: 'and'` kyun?** Default `or` hai. `\"iphone ca\"` bhejo to `or` ke saath wo document bhi match karega jisme sirf `\"iphone\"` hai -- yani `\"iphone charger\"` bhi aa jaayega jab user `\"iphone ca(se)\"` type kar raha hai. `and` se **saare tokens** match hone chahiye.\n- `filter: [{ term: { enabled: true } }]` -- **filter context** (score nahi). Banned/spam queries ko suggestions se hata sakte ho bina delete kiye. Autocomplete ek brand risk hai -- galat suggestion screenshot ban ke Twitter par jaati hai.\n- `sort: [{ popularity: 'desc' }, { 'text.keyword': 'asc' }]` -- **relevance se sort nahi kar rahe, popularity se.** Kyun? `\"iph\"` ke liye BM25 score lagbhag sab par same hoga (sab ne wahi ek gram match kiya). Asli signal ye hai ki **log kya search karte hain** -- `\"iphone 15\"` ko `\"iphone 15 pro max leather case brown\"` se upar hona chahiye. `text.keyword` tie-breaker se order deterministic rehta hai (warna cache mein har baar alag order).\n- `_source: ['text', 'type']` -- sirf do fields. Dropdown ko aur kuch nahi chahiye.\n- `track_total_hits: false` -- total count ki **bilkul zarurat nahi** hai autocomplete mein. `false` karne se ES counting ka kaam poori tarah skip kar deta hai -- ye ek free optimization hai.\n- `{ requestTimeout: 300 }` -- **search ke 1,000 ms se bahut tight.** Kyun? p99 target 100 ms hai. 300 ms se zyada lagne wali suggestion waise bhi bekaar hai -- user aglaa character type kar chuka hoga aur nayi request ja chuki hogi. Jaldi fail karo, resources chhodo.\n- `catch` -> **`return []`**, error nahi. PART 8.3 wali baat: autocomplete fail hone se user ka flow nahi tootna chahiye. Dropdown nahi aaya to user Enter dabaa dega. `500` bhejne se browser console mein errors, error-tracking mein noise, aur kuch bhi behtar nahi hota.\n- `suggestLatency.observe({ source: 'cache' | 'es' })` -- **`source` label sabse kaam ka hai.** Dashboard par dikhta hai ki kitna traffic cache se ja raha hai aur cache-hit vs ES-hit latency mein kitna farak hai. Cache hit ratio girne par yahi pehla signal deta hai.\n\n**`suggestions_v2` index mein kya hai?** Nightly job `query_popularity` table + top product titles + categories se document banata hai:\n\n```json\n{ \"text\": \"iphone 15 case\", \"type\": \"query\",    \"popularity\": 184200, \"enabled\": true }\n{ \"text\": \"Apple iPhone 15 (128GB, Blue)\", \"type\": \"product\", \"popularity\": 9100, \"enabled\": true }\n{ \"text\": \"electronics/mobiles\", \"type\": \"category\", \"popularity\": 42000, \"enabled\": true }\n```\n\nIndex chhota hai (~1-2 GB, kuch million rows), isliye **poora page cache mein fit** hota hai -- koi disk I/O nahi, aur yahi p99 \u003c 100 ms ko possible banata hai.\n\n---\n\n### 7. `workers/outbox-poller.ts` -- Postgres outbox se Kafka tak\n\n```ts\nimport { pool } from '../infra/postgres';\nimport { kafkaProducer } from '../infra/kafka';\nimport { logger } from '../infra/logger';\nimport { outboxLag, outboxPublished } from '../infra/metrics';\n\nconst BATCH_SIZE = 500;\nconst POLL_INTERVAL_MS = 200;\n\ninterface OutboxRow { id: string; product_id: string; op: 'upsert' | 'delete'; version: string; created_at: Date }\n\nasync function pollOnce(): Promise\u003cnumber> {\n  const client = await pool.connect();\n  try {\n    await client.query('BEGIN');\n\n    const { rows } = await client.query\u003cOutboxRow>(\n      `SELECT id, product_id, op, version, created_at\n         FROM product_outbox\n        WHERE published_at IS NULL\n        ORDER BY id\n        LIMIT $1\n        FOR UPDATE SKIP LOCKED`,\n      [BATCH_SIZE],\n    );\n\n    if (rows.length === 0) {\n      await client.query('COMMIT');\n      return 0;\n    }\n\n    await kafkaProducer.send({\n      topic: 'product-changes',\n      messages: rows.map((r) => ({\n        key: r.product_id,                                   // partition = hash(productId)\n        value: JSON.stringify({\n          productId: r.product_id,\n          op: r.op,\n          version: Number(r.version),\n          outboxId: r.id,\n        }),\n      })),\n      acks: -1,                                              // all in-sync replicas\n    });\n\n    await client.query(\n      `UPDATE product_outbox SET published_at = now() WHERE id = ANY($1::bigint[])`,\n      [rows.map((r) => r.id)],\n    );\n\n    await client.query('COMMIT');\n\n    outboxPublished.inc(rows.length);\n    outboxLag.set((Date.now() - rows[0].created_at.getTime()) / 1000);\n    return rows.length;\n  } catch (err) {\n    await client.query('ROLLBACK').catch(() => {});\n    logger.error({ err }, 'outbox poll failed');\n    return 0;\n  } finally {\n    client.release();\n  }\n}\n\nexport async function startOutboxPoller(): Promise\u003cvoid> {\n  let stopped = false;\n  process.on('SIGTERM', () => { stopped = true; });\n\n  while (!stopped) {\n    const published = await pollOnce();\n    if (published \u003c BATCH_SIZE) {\n      await new Promise((r) => setTimeout(r, POLL_INTERVAL_MS));   // kaam khatam -> saans lo\n    }\n    // agar poora batch mila -> turant agla batch (backlog catch-up mode)\n  }\n  logger.info('outbox poller stopped');\n}\n```\n\n**Code Explanation:**\n\n- `const client = await pool.connect()` -- pool se ek **dedicated connection** liya. Transaction ke liye ye zaroori hai: `BEGIN`, query, `COMMIT` sab **ek hi connection** par hone chahiye. `pool.query()` har call par alag connection de sakta hai -- tab `BEGIN` ek connection par aur `COMMIT` doosre par jaayega, jo bilkul toot jaayega.\n- `BEGIN` ... `COMMIT` -- claim aur mark dono ek transaction mein.\n- **`FOR UPDATE SKIP LOCKED` -- ye poore poller ka jaadu hai:**\n  - `FOR UPDATE` -- \"in rows par lock lagao, main inhe update karunga.\" Doosra koi transaction inhe touch nahi kar sakta jab tak commit na ho.\n  - `SKIP LOCKED` -- \"jo rows **pehle se locked** hain, unhe chhod do aur agli lo.\"\n  - **Kyun zaroori:** high availability ke liye tum **do (ya teen) poller instances** chalaoge. Bina `SKIP LOCKED` ke:\n    - Poller B, poller A ke lock par **wait** karega (blocked) -> effectively sirf ek poller chal raha hai, doosra bekaar khada hai.\n    - Ya `NOWAIT` use karo to error aayega aur retry loop banega.\n  - `SKIP LOCKED` ke saath: poller A rows 1-500 leta hai, poller B **turant** rows 501-1000 le leta hai. **Koi wait nahi, koi duplicate nahi, linear scaling.** Ye Postgres ka built-in \"work queue\" pattern hai.\n- `ORDER BY id` -- outbox rows ko **insertion order** mein process karo. `id` `BIGSERIAL` hai, yani monotonically increasing. Ye ordering ki pehli layer hai (doosri Kafka key, teesri ES version).\n- `LIMIT 500` -- ek baar mein 500. Bahut bada batch (50,000) lambi transaction banata hai, lock lambe time tak rakhta hai, aur crash par zyada kaam dobara karna padta hai.\n- `key: r.product_id` -- **Kafka partition key.** Kafka `hash(key) % partitions` se partition chunta hai. Ek product ki saari events **hamesha ek hi partition** mein. Kafka partition ke andar order guarantee karta hai -> product P ke updates sahi order mein consume honge. **Ye line hata do to out-of-order indexing ka darwaza khul jaata hai.**\n- `value: JSON.stringify({ productId, op, version, outboxId })` -- **note: poora product data nahi bheja.** Sirf id + version.\n  - **Kyun?** (1) Message chhota rehta hai (Kafka throughput), (2) jab tak indexer process kare tab tak product aur update ho chuka ho sakta hai -- indexer **latest** row Postgres se padhega, jo behtar hai, (3) message mein PII/business data nahi jaata.\n  - **Trade-off:** indexer ko har batch par Postgres se read karna padega. Par wo ek `WHERE id = ANY($1)` batch query hai (500 rows ek baar mein), to bilkul theek hai.\n  - **Alternative:** poora document message mein bhejo (Kafka \"event-carried state transfer\"). Tab indexer ko DB chahiye hi nahi -- par messages bade, aur stale data ka risk.\n- `acks: -1` (ya `'all'`) -- Kafka producer tabhi success maanega jab message **saare in-sync replicas** par likha ja chuke. `acks: 1` (sirf leader) mein leader crash hone par message kho sakta hai -- aur tab wo product **kabhi index nahi hoga** (kyunki outbox row `published_at` set ho chuki hogi). Durability yahan latency se zyada important hai; ye background job hai.\n- `UPDATE ... SET published_at = now() WHERE id = ANY($1::bigint[])` -- Kafka par bhejne ke **baad** mark karo. Ek hi `UPDATE` 500 rows ke liye (500 alag updates nahi).\n- **`$1::bigint[]` ka cast kyun?** `pg` driver JS array ko Postgres array bhejta hai, par `id` `BIGSERIAL` hai aur JS mein wo **string** ban ke aata hai (kyunki `BIGINT` JS `number` mein safely fit nahi hota). Explicit cast Postgres ko batata hai ki ye strings `bigint` samjhe jaayein.\n- **Order bahut important hai: Kafka pehle, `UPDATE` baad mein.** Ulta karo to:\n  ```\n  UPDATE published_at = now()  [OK]\n  COMMIT                        [OK]\n  Kafka send ... CRASH          [X]\n  -> Row \"published\" mark ho chuki hai, par Kafka mein gayi hi nahi.\n  -> Wo product KABHI index nahi hoga. Permanent divergence -- wahi bimari jisse bachne ke liye outbox banaya tha.\n  ```\n  Hamare order mein (Kafka pehle) worst case: Kafka par chala gaya par `COMMIT` se pehle crash -> row abhi bhi `published_at IS NULL` -> **agla poll dobara bhejega** -> **duplicate message**. Aur duplicate theek hai (neeche).\n- **Isliye ye at-least-once hai, exactly-once nahi:**\n\n  | Kab | Kya hota hai |\n  |---|---|\n  | Sab theek | Message ek baar |\n  | Kafka send ke baad crash | Message **do baar** (agla poll dobara bhejega) |\n  | Kafka send fail | Message zero baar... **par row abhi bhi unpublished hai**, agla poll retry karega |\n\n  **Zero baar kabhi permanently nahi hota** -- yahi guarantee chahiye thi. Duplicate ki keemat chukani padti hai, aur wo keemat hai: **indexer ko idempotent hona hi padega.** Uska jawab `version_type: 'external'` hai (agla section).\n\n  > **Interview line:** \"Distributed systems mein exactly-once delivery practically possible nahi hai. Main **at-least-once delivery + idempotent consumer** choose karta hoon -- yani effectively-once processing. Yahan idempotency ES ke external versioning se aati hai.\"\n- `if (published \u003c BATCH_SIZE) await sleep(200)` -- **adaptive polling.** Poora batch mila matlab backlog hai -> **turant** agla batch lo (catch-up mode). Aadha batch mila matlab caught up ho -> 200 ms so jao. Ye flash sale (500 updates/sec) par apne aap tez ho jaata hai aur raat ko Postgres ko tang nahi karta.\n- `outboxLag.set(...)` -- sabse purani unpublished row kitni purani hai. Ye **poore pipeline ka early warning** hai: ye badhna shuru hua matlab ya Kafka down hai, ya poller mar gaya hai, ya update rate poller se zyada ho gayi hai.\n- `process.on('SIGTERM', ...)` + `while (!stopped)` -- **graceful shutdown.** Deploy par Kubernetes `SIGTERM` bhejta hai. Hum current batch poora karke rukte hain. Beech mein mar jaate to `ROLLBACK` hota (rows unpublished rehti, agli baar ho jaati) -- data safe hai, par graceful behtar hai.\n- `ROLLBACK().catch(() => {})` -- rollback bhi fail ho sakta hai (connection hi toot gaya). Us error ko swallow karo, warna wo asli error ko chhupa dega.\n\n---\n\n### 8. `workers/product-indexer.worker.ts` -- Kafka -> ES bulk\n\n```ts\nimport { Kafka } from 'kafkajs';\nimport { esClient } from '../infra/elasticsearch';\nimport { productRepository } from '../repositories/product.repository';\nimport { logger } from '../infra/logger';\nimport { dlq } from '../infra/kafka';\nimport { bulkErrors, indexerLag, staleSkipped } from '../infra/metrics';\nimport type { ProductDoc } from '../types/search';\n\nconst MAX_DOCS = 500;\nconst MAX_BYTES = 5 * 1024 * 1024;   // 5 MB\nconst MAX_WAIT_MS = 1000;\n\ninterface ChangeEvent { productId: string; op: 'upsert' | 'delete'; version: number; outboxId: string }\n\nconst kafka = new Kafka({ clientId: 'product-indexer', brokers: process.env.KAFKA_BROKERS!.split(',') });\nconst consumer = kafka.consumer({ groupId: 'product-indexer', sessionTimeout: 30_000 });\n\nexport async function startIndexer(): Promise\u003cvoid> {\n  await consumer.connect();\n  await consumer.subscribe({ topic: 'product-changes', fromBeginning: false });\n\n  await consumer.run({\n    autoCommit: false,                       // manual offset commit\n    eachBatchAutoResolve: false,\n    eachBatch: async ({ batch, resolveOffset, heartbeat, commitOffsetsIfNecessary, isRunning }) => {\n      let buffer: ChangeEvent[] = [];\n      let bytes = 0;\n      let lastOffset = '';\n      let flushedAt = Date.now();\n\n      const flush = async () => {\n        if (buffer.length === 0) return;\n        await indexBatch(buffer);\n        buffer = [];\n        bytes = 0;\n        flushedAt = Date.now();\n        resolveOffset(lastOffset);\n        await commitOffsetsIfNecessary();    // ES write ke BAAD commit\n        await heartbeat();\n      };\n\n      for (const message of batch.messages) {\n        if (!isRunning()) break;\n        const event = JSON.parse(message.value!.toString()) as ChangeEvent;\n        buffer.push(event);\n        bytes += message.value!.length;\n        lastOffset = message.offset;\n\n        if (buffer.length >= MAX_DOCS || bytes >= MAX_BYTES || Date.now() - flushedAt >= MAX_WAIT_MS) {\n          await flush();\n        }\n      }\n      await flush();                          // batch khatam -> bacha hua flush\n    },\n  });\n}\n```\n\n**Code Explanation -- consumer setup:**\n\n- `groupId: 'product-indexer'` -- **consumer group.** Kafka 12 partitions ko group ke consumers mein baant deta hai. 3 workers chalao to har ek ko 4 partitions milti hain; 12 workers tak scale kar sakte ho (12 partitions hain, usse zyada worker bekaar baithega). Ek worker mare to Kafka uski partitions baaki mein **rebalance** kar deta hai -- built-in HA.\n- `fromBeginning: false` -- naya worker **abhi se** shuru kare, poora 7-din ka history dobara na khaaye.\n- **`autoCommit: false`** -- ye sabse important setting hai. Auto-commit ka matlab: kafkajs har kuch second offsets commit karta rehta hai, chahe humne message **process kiya ho ya nahi**. Tab ye ho sakta hai:\n  ```\n  message read  -> offset auto-commit ho gaya  -> ES bulk call FAIL  -> worker crash\n  restart: Kafka \"tumne wo offset process kar liya tha\" -> wo product KABHI index nahi hoga  [X]\n  ```\n  Manual commit se hum **ES write ke baad** commit karte hain. Crash hua to offset commit nahi hua -> Kafka wahi messages dobara dega -> **at-least-once processing.**\n- `eachBatchAutoResolve: false` -- hum khud `resolveOffset` call karenge, kafkajs apne aap poori batch ko \"done\" nahi maanega.\n- `sessionTimeout: 30_000` -- 30 second tak heartbeat na aaye to Kafka is consumer ko dead maan ke rebalance kar dega. Isiliye `flush()` mein `heartbeat()` call hai -- lambi bulk calls ke dauran Kafka ko batate rehna ki hum zinda hain.\n\n**Code Explanation -- batching (`500 docs / 5 MB / 1 s`):**\n\n- **`MAX_DOCS = 500`** -- per-document indexing 500x zyada HTTP overhead hai. Bulk ek hi request mein 500 operations bhejta hai.\n- **`MAX_BYTES = 5 MB`** -- sirf doc count kaafi nahi. 500 products jinki descriptions bahut lambi hain = 50 MB ka request = ES ka `http.max_content_length` (default 100 MB) ke kareeb, memory spike, aur timeout. **Do limits chahiye: count aur size.**\n- **`MAX_WAIT_MS = 1000`** -- raat ko traffic kam hai; 500 events jama hone mein 10 minute lag sakte hain. Tab tak wait karoge to `indexer_lag_seconds` 600 ho jaayega aur 30-second requirement toot jaayegi. **1 second ke baad jo bhi hai, bhej do.**\n- Teeno limits ek saath: **\"500 docs YA 5 MB YA 1 second -- jo pehle aa jaaye.\"** Ye classic batching triple hai aur har Kafka/queue consumer mein yahi shape hoti hai.\n- `resolveOffset(lastOffset)` phir `commitOffsetsIfNecessary()` **`indexBatch` ke baad** -- yahi at-least-once ka core hai. Crash ho to offset wahin ka wahin, messages dobara aayenge.\n\n```ts\nasync function indexBatch(events: ChangeEvent[]): Promise\u003cvoid> {\n  // ---- 1. Ek productId ke duplicates mein sirf highest version rakho ----\n  const latest = new Map\u003cstring, ChangeEvent>();\n  for (const e of events) {\n    const prev = latest.get(e.productId);\n    if (!prev || e.version > prev.version) latest.set(e.productId, e);\n  }\n\n  const upserts = [...latest.values()].filter((e) => e.op === 'upsert');\n  const deletes = [...latest.values()].filter((e) => e.op === 'delete');\n\n  // ---- 2. Postgres se latest rows ----\n  const docs: ProductDoc[] = upserts.length\n    ? await productRepository.findManyForIndex(upserts.map((e) => e.productId))\n    : [];\n\n  // ---- 3. Bulk body banao ----\n  const operations: unknown[] = [];\n\n  for (const doc of docs) {\n    operations.push({ index: { _index: 'products', _id: doc.productId,\n                               version: doc.version, version_type: 'external' } });\n    operations.push(doc);\n  }\n  for (const e of deletes) {\n    operations.push({ delete: { _index: 'products', _id: e.productId,\n                                version: e.version, version_type: 'external' } });\n  }\n\n  if (operations.length === 0) return;\n\n  // ---- 4. Bulk call ----\n  const res = await esClient.bulk({ operations, refresh: false });\n\n  // ---- 5. Per-item error handling ----\n  if (!res.errors) {\n    for (const doc of docs) {\n      indexerLag.observe((Date.now() - new Date(doc.updatedAt).getTime()) / 1000);\n    }\n    return;\n  }\n\n  const retryable: unknown[] = [];\n\n  res.items.forEach((item, i) => {\n    const op = item.index ?? item.delete;\n    if (!op?.error) return;\n\n    const status = op.status;\n    const type = op.error.type;\n\n    if (status === 409 || type === 'version_conflict_engine_exception') {\n      staleSkipped.inc();                                   // purana event -- ignore\n      return;\n    }\n    if (status === 429 || status >= 500) {\n      retryable.push(operations[i * 2], operations[i * 2 + 1]);  // action + doc\n      return;\n    }\n    // 400, 404 (mapping error, malformed doc) -- retry se theek nahi hoga\n    bulkErrors.inc({ type });\n    logger.error({ id: op._id, status, error: op.error }, 'permanent bulk index error');\n    void dlq.send({ topic: 'product-changes-dlq',\n                    messages: [{ key: op._id, value: JSON.stringify({ id: op._id, error: op.error }) }] });\n  });\n\n  if (retryable.length > 0) {\n    await retryWithBackoff(retryable);\n  }\n}\n\nasync function retryWithBackoff(operations: unknown[], attempt = 1): Promise\u003cvoid> {\n  if (attempt > 5) {\n    bulkErrors.inc({ type: 'retry_exhausted' });\n    throw new Error('bulk retry exhausted');            // offset commit nahi hoga -> Kafka dobara dega\n  }\n  const delayMs = Math.min(200 * 2 ** attempt, 10_000) + Math.random() * 200;\n  await new Promise((r) => setTimeout(r, delayMs));\n\n  const res = await esClient.bulk({ operations, refresh: false });\n  if (!res.errors) return;\n\n  const stillFailing: unknown[] = [];\n  res.items.forEach((item, i) => {\n    const op = item.index ?? item.delete;\n    if (op?.error && (op.status === 429 || op.status >= 500)) {\n      stillFailing.push(operations[i * 2], operations[i * 2 + 1]);\n    }\n  });\n  if (stillFailing.length > 0) await retryWithBackoff(stillFailing, attempt + 1);\n}\n```\n\n**Code Explanation:**\n\n- **`latest` Map -- batch ke andar deduplication.** Flash sale mein ek hi product ke 5 price updates 1 second mein aa sakte hain. Sabko ES par bhejne ka koi fayda nahi -- final state to wahi hai. Sirf **highest version** wala rakho. Ye ES par load seedha kam karta hai (500 operations ki jagah shayad 300).\n  - `e.version > prev.version` -- comparison version par hai, array order par nahi. Kafka ordering ke bharose mat raho jab tumhare paas explicit version ho.\n- `productRepository.findManyForIndex([...ids])` -- ek hi query se saare products (`WHERE id = ANY($1)`). N+1 queries bilkul nahi. Ye function `products` row ko `ProductDoc` mein badalta hai: `price_paise / 100`, `stock_qty > 0 ? true : false`, `status = 'deleted'` ko delete op mein.\n- **Bulk body ka shape:** ES bulk NDJSON hai -- **do lines per operation**: pehli line action metadata, doosri line document. `esClient.bulk({ operations: [...] })` mein ye ek flat array hai jahan **even index = action, odd index = document**. (Delete ka sirf ek line hota hai -- code mein ye ek simplification hai; production mein index aur delete ke arrays alag rakhna behtar hai taaki `operations[i * 2]` wali mapping tooti na.)\n- **`version: doc.version, version_type: 'external'`** -- **ye poore indexer ki sabse important do lines hain.**\n  - `version_type: 'external'` ka matlab: \"version main de raha hoon, tu apna internal counter mat use kar.\"\n  - ES rule: naya document tabhi likho jab `incoming version > stored version`. Warna `409 version_conflict_engine_exception`.\n  - Isi se indexer **idempotent** ban jaata hai:\n    ```\n    Same message do baar aaya (at-least-once)?\n        pehli baar: version 6 > 0  -> index [OK]\n        doosri baar: version 6 > 6? NAHI -> 409 -> ignore [OK]   koi nuksaan nahi\n\n    Purana message baad mein aaya (out of order)?\n        version 5 aaya jab stored 6 hai -> 409 -> ignore [OK]   purana data jeet nahi paaya\n    ```\n  - **Yahi wajah hai ki outbox at-least-once ho ke bhi safe hai.**\n- **`refresh: false`** -- bulk ke baad **refresh mat karo.** Default (`false`) hi sahi hai, par explicitly likhna achha hai. `refresh: true` karoge to **har bulk par** naya segment banega -- 58 bulks/sec = 58 segments/sec = segment explosion, merge storm, aur cluster ki latency tabaah. Hum `refresh_interval: 1s` par bharosa karte hain (PART 9b).\n  - (`refresh: 'wait_for'` ek beech ka option hai -- next refresh tak wait karta hai. Tab use karo jab caller ko turant read-after-write chahiye. Batch indexer ko nahi chahiye.)\n- **`if (!res.errors)`** -- **ye check kabhi mat bhoolo.** `esClient.bulk()` HTTP 200 deta hai chahe **saare 500 documents fail** ho gaye hon! Bulk response mein per-item status hota hai. `res.errors` ek boolean flag hai: \"kya kisi bhi item mein error tha?\" Iske bina tumhara indexer chup-chaap kuch bhi index nahi karega aur koi alert nahi bajega.\n- **Per-item error handling -- teen categories:**\n\n  | Status | Matlab | Action | Kyun |\n  |---|---|---|---|\n  | **409** `version_conflict` | Stale event (duplicate ya out-of-order) | **Ignore**, metric badhao | Ye \"error\" nahi, ye **design ke hisaab se sahi** hai. Naya data pehle se ES mein hai. |\n  | **429** `es_rejected_execution` | ES ki write queue full | **Retry with backoff** | ES bol raha hai \"dheere\". Retry karo, par turant nahi -- warna aur bura. |\n  | **5xx** | ES node problem, timeout | **Retry with backoff** | Transient ho sakta hai. |\n  | **400 / 404** | Mapping conflict, malformed doc, missing index | **DLQ** | Retry se kabhi theek nahi hoga. Ye **code ya data ka bug** hai. |\n\n- `staleSkipped.inc()` -- 409 ko alag metric mein ginte hain. **Ye normal hai** (duplicates hote rehte hain), par agar ye rate suddenly badh jaaye to kuch gadbad hai (poller duplicate bhej raha hai, ya rebalance loop chal raha hai).\n- **DLQ (dead letter queue) kyun?** Ek poison message (jaise ek product jiska `attributes` field ES mapping tod raha hai) tumhare poore indexer ko **infinite retry loop** mein daal sakta hai -- aur tab **baaki saare products ka indexing ruk jaayega**. DLQ us ek message ko alag topic par bhej ke pipeline ko chalta rakhta hai. Koi engineer baad mein DLQ dekh ke fix karta hai.\n  - `void dlq.send(...)` -- `void` operator batata hai \"maine jaan-boojh ke `await` nahi kiya\". Linter ka floating-promise warning chup ho jaata hai aur intent clear rehta hai.\n- **`retryWithBackoff`:**\n  - `Math.min(200 * 2 ** attempt, 10_000)` -- **exponential backoff**: 400 ms, 800 ms, 1.6 s, 3.2 s, 6.4 s, max 10 s par cap. ES overloaded hai -- har retry ke beech zyada time do taaki wo recover kar sake.\n  - `+ Math.random() * 200` -- **jitter.** 3 indexer workers ek saath 429 khaayenge aur bina jitter ke teeno exactly 400 ms baad ek saath wapas aayenge -- wahi thundering herd. Random spread se load smooth hota hai.\n  - `attempt > 5` -> **throw**. Iska matlab `eachBatch` fail ho jaayega, `commitOffsetsIfNecessary` nahi chalega, aur **Kafka wahi messages dobara dega.** Ye sahi behaviour hai: agar ES 5 retries ke baad bhi nahi le raha, to ye **cluster-level problem** hai, ek message ki nahi. Rukna aur Kafka mein backlog banne dena sahi hai -- Kafka 7 din retention rakhta hai, kuch nahi khoyega. Aur `indexer_lag_seconds` alert baja dega.\n  - **Sirf 429/5xx retry hote hain**, 400 nahi. Ek malformed document ko 5 baar retry karna sirf time waste hai.\n- `indexerLag.observe((Date.now() - doc.updatedAt) / 1000)` -- **end-to-end lag.** Ye seller ke update se lekar ES mein document pahunchne tak ka poora time hai (outbox + Kafka + batch wait + bulk). Requirement 30 s hai. Ye **ek hi metric** poore write pipeline ki sehat batata hai -- agar SLO dashboard par sirf ek indexing metric rakh sakte ho, to yahi rakho.\n\n---\n\n### 9. Postgres degraded search
