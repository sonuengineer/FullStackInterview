ptimization** hai -- 12 characters type karne par 12 requests ki jagah ~4 requests jaati hain. Debounce hata do to autocomplete traffic 3x ho jaayega aur cluster ka size badhana padega. Yani ek `setTimeout` ne hardware bacha diya.\n\n**2. Load Balancer.** TLS yahin terminate hota hai. LB request ko kisi bhi healthy Node instance par bhejta hai -- **Search API stateless hai** (koi session, koi local state nahi), isliye koi bhi instance koi bhi request handle kar sakta hai. `X-Forwarded-For` mein asli client IP aata hai (rate limiter ko chahiye).\n\n**3. Rate limit.** Rate Limiter lesson wala token bucket, key `rl:search:\u003cip>`. Kyun? Price scrapers competitor ki pricing nikalne ke liye search API ko hammer karte hain. Ye traffic ES cluster ka RAM aur CPU khaata hai aur real users ki latency badhata hai. **Search par sakht limit, autocomplete par dheeli limit** (autocomplete waise bhi 4x zyada hai aur mostly cache se serve hota hai).\n\n**4. Validate + normalize query.** Do alag kaam hain, dono zaroori:\n\n```\nraw:        \"  IPHON   Case!!  \"\ntrim:       \"IPHON   Case!!\"\nlowercase:  \"iphon   case!!\"\ncollapse:   \"iphon case!!\"     (multiple spaces -> ek space)\nstrip:      \"iphon case\"       (control chars, ES reserved chars)\ncap:        pehle 100 chars\n```\n\nNormalization ka asli fayda **cache hit ratio** hai. `\"iPhone Case\"`, `\"iphone case\"`, `\"iphone  case\"` -- teeno alag strings hain lekin same result dena chahiye. Normalize na karo to teeno alag cache entries banayenge aur teeno ES tak jaayengi. Normalize karne se ek entry, teen hits.\n\n**5. Cache key banao: `q:\u003csha1(normalizedQuery + filters + sort + page)>`.**\n\nKey mein sirf query nahi, **poora request shape** jaata hai. Kyun? `q=iphone case` ka result `brand=Apple` filter ke saath bilkul alag hai. Sirf query ko key banaya to Priya ko filter lagane par bhi bina-filter wale results milenge -- **silent wrong data**, jo sabse buri bug hoti hai.\n\nSHA-1 kyun? Kyunki raw string bahut lambi ho sakti hai (100 char query + 10 filters + sort + page). SHA-1 hamesha 40 hex characters deta hai -- chhoti, fixed-length Redis key. Yahan SHA-1 **security ke liye nahi** hai (collision attacks se koi matlab nahi), sirf **fingerprinting** ke liye -- isliye SHA-256 ki zarurat nahi, SHA-1 tez hai.\n\n**6. Cache miss.** Part 1 ka number yaad karo: **top 1,000 queries = traffic ka ~30%** (Zipf distribution -- \"iphone\", \"shoes\", \"laptop\" type head queries). Yani ~30% requests yahin se lautt jaati hain, ~5 ms mein. Baaki 70% aage jaati hain.\n\n**7. QueryBuilder -> ES DSL.** Ek **pure function**: `SearchRequest` andar, JSON object bahar. Koi network call nahi, koi I/O nahi. (Iska poora code PART 11 mein.)\n\n**8. ES coordinating node.** Request kisi bhi ES node par jaati hai; wo node us request ke liye **coordinating node** ban jaata hai. Uska kaam: request ko saare relevant shards par bhejna, results merge karna, wapas dena. Usme khud data hone ki zarurat nahi.\n\n**9. Query phase -- 6 shards parallel.** Ye sabse important internal detail hai:\n\n```\nCoordinating node\n   |\n   +---> shard 0 --> local search --> top 24 (docId, score) + local aggs\n   +---> shard 1 --> local search --> top 24 (docId, score) + local aggs\n   +---> shard 2 --> ...\n   +---> shard 3 --> ...\n   +---> shard 4 --> ...\n   +---> shard 5 --> ...\n   |\n   (sab wapas aane ka WAIT)\n   |\n   merge 6 x 24 = 144 entries -> global sort -> top 24 docIds\n```\n\nHar shard apne **local inverted index** par search chalata hai, apne top 24 nikalta hai, aur sirf `(docId, score)` bhejta hai -- poora document nahi. 6 shards x 24 = 144 chhoti entries network par aati hain, 144 x 2 KB documents nahi. Ye **bandwidth aur memory dono bachata hai.**\n\n**10. Fetch phase.** Merge ke baad coordinating node ke paas final 24 docIds hain. Ab wo **sirf un shards** se, **sirf un 24 docs** ka `_source` maangta hai. Do-phase design ka poora point yahi hai: mehenga kaam (document body padhna) sirf 24 docs par hota hai, poore match set par nahi.\n\n**11. Slowest shard hi tumhara p99 hai.** Ye interview ka killer point hai:\n\n```\nshard 0: 45 ms\nshard 1: 50 ms\nshard 2: 48 ms\nshard 3: 52 ms\nshard 4: 47 ms\nshard 5: 190 ms   \u003c-- GC pause / cold page cache / hot neighbour\n-----------------------------------------------\nquery phase total = 190 ms  (NOT the average of 72 ms)\n```\n\nCoordinating node **saare** shards ka intezaar karta hai. Yani search latency = **max(shards)**, average nahi. Iske teen seedhe nateeje hain:\n\n- **Zyada shards = zyada chance ki koi ek slow ho.** 60 shards banaoge to har request 60 lottery tickets kharidti hai ki koi ek GC pause mein ho. Isliye Part 1 mein 6 shards chune, 60 nahi.\n- **Ek slow node poore cluster ki p99 kharab karta hai**, sirf apne queries ki nahi. Isliye node-level monitoring (`es_jvm_heap_used_percent`) zaroori hai.\n- **`allow_partial_search_results: true`** -- ek shard fail/timeout ho to baaki 5 ke results de do. 5/6 results >> 0 results. Par response mein `_shards.failed` check karke metric badhao, warna silently kharab results serve karte rahoge.\n\n**12. Aggregations (facets).** \"Samsung (1,204)\", \"Apple (890)\" -- ye `aggs` se aate hain. Har shard apne matched docs par local `terms` aggregation chalata hai, coordinating node unhe merge karta hai. **Cost:** +20-40 ms, kyunki aggregation poore match set par chalta hai (top 24 par nahi). 50,000 products match hue to aggregation 50,000 par chalega.\n\n> Isiliye aggregation ke liye **doc values** chahiye (PART 9 mein detail) -- `keyword` fields par by default on hote hain. `text` field par aggregation karoge to ES `fielddata` maangega, jo heap kha jaata hai. Rule: **facet field hamesha `keyword`.**\n\n**13. Response mapping.** ES ka raw response bahut bada aur ES-specific hota hai (`hits.hits[]._source`, `aggregations.brands.buckets[]`). Usse apne clean `SearchResponse` shape mein badalte hain. Kyun? Kal ES ki jagah kuch aur laaye (ya ES 9 mein response shape badla) to **sirf mapper badlega**, frontend nahi.\n\n**14. Cache set (TTL 60 s).** `SETEX q:\u003csha1> 60 \u003cjson>`. 60 second kyun?\n\n- Bahut chhota (5 s) -> cache hit ratio gir jaayega, fayda khatam.\n- Bahut bada (10 min) -> price/stock change hone ke baad bhi purana result 10 minute dikhta rahega. User \"In Stock\" dekh ke click karega aur product page par \"Out of Stock\" milega -- **worst UX**.\n- 60 s = acceptable staleness + ~30% hit ratio. Aur **sirf page 1** cache karte hain (page 2+ ki repeat rate bahut kam hai, cache memory waste).\n- **Personalization v1 mein nahi** -- kyunki personalized result matlab har user ka alag result, matlab cache key mein userId, matlab hit ratio ~0%. Ye trade-off Part 1 mein settle ho chuka hai.\n\n**15. JSON to browser.** `200 OK` + `SearchResponse`.\n\n---\n\n### Flow B -- Autocomplete (user \"iph\" tak type kar chuka hai)\n\nYe flow **alag**, **halka**, aur **Redis-heavy** hai. Same code path use karna sabse badi galti hoti.\n\n```\nBrowser (150 ms debounce)\n   |  GET /api/v1/suggest?q=iph&limit=10\n   v\nLoad Balancer\n   v\nSuggest API (same Node.js process, alag route + alag rate limit)\n   |\n   +--> Redis GET sug:iph\n   |        HIT (~70-80% of traffic)  --> return in ~3-5 ms   [DONE]\n   |        MISS\n   |          |\n   |          v\n   |     ES POST /suggestions/_search   (index suggestions_v2, chhota, RAM mein fit)\n   |          match on title.ac (edge n-gram), size 10, sort by popularity\n   |          |\n   |          v\n   |     Redis SETEX sug:iph 600 \u003cjson>   (TTL 10 min)\n   |          |\n   v          v\nBrowser  \u003c-- { suggestions: [{ text, type }] }\n```\n\n**Search flow se kya-kya alag hai aur KYUN:**\n\n| Cheez | Search | Autocomplete | Kyun alag |\n|---|---|---|---|\n| Index | `products_v3` (~130 GB) | `suggestions_v2` (chhota, ~1-2 GB) | Chhota index poora RAM/page cache mein fit hota hai -> disk I/O zero -> p99 \u003c 100 ms possible |\n| Cache TTL | 60 s | **600 s** | Suggestions ka data (popular queries) dheere badalta hai. Price/stock ki tarah volatile nahi. |\n| Cache hit ratio | ~30% | **~70-80%** | Prefixes bahut zyada repeat hote hain -- \"i\", \"ip\", \"iph\" har iPhone search karne wala type karta hai |\n| Query type | `multi_match` + fuzzy + `function_score` + aggs | simple `match` on `title.ac` | Autocomplete mein facets nahi chahiye, scoring simple hai (popularity) |\n| Fuzziness | `AUTO` | **nahi** (v1 mein) | 4,000 QPS par fuzzy expansion bahut mehenga hai; aur user abhi type kar raha hai, next keystroke waise bhi theek kar dega |\n| Traffic | ~1,000 QPS peak | **~4,000 QPS peak** | user 12 chars type karta hai, debounce ke baad ~4 requests per search |\n\n> **Key insight (Part 1 se):** autocomplete traffic search se **4x zyada** hai. Agar dono ek hi `products_v3` index par chalein, to autocomplete main cluster ka 80% CPU kha jaayega aur asli search slow ho jaayegi. Isliye: **alag index + aggressive Redis cache.** Redis mein top ~10K popular prefixes cache hain, aur 4,000 QPS ka bada hissa ES tak pahunchta hi nahi.\n\n**Edge n-gram ka one-line idea (poora Part 3 mein):** index time par hi `iphone` ko `ip, iph, ipho, iphon, iphone` mein tod ke store kar dete hain. Query time par `iph` ek **simple term lookup** ban jaata hai -- O(1) jaisa. Yani mehnat index time par shift kar di, jab koi user wait nahi kar raha.\n\n---\n\n### Flow C -- Indexing (seller ne price 1,999 se 1,499 kiya)\n\nYe **write path** hai. Yahan koi user wait nahi kar raha, isliye async + reliable hona zaroori hai (fast hone se zyada).\n\n```\n   Seller Panel\n       |  PUT /api/v1/seller/products/:id  { price: 1499 }\n       v\n   Catalog Service (Node.js)\n       |\n       |  BEGIN;\n       |    UPDATE products SET price_paise = 149900, version = version + 1, updated_at = now()\n       |     WHERE id = $1;\n       |    INSERT INTO product_outbox (product_id, op, version) VALUES ($1, 'upsert', $2);\n       |  COMMIT;                    \u003c-- DONO ek hi transaction mein. Atomic.\n       v\n   Postgres  products  +  product_outbox\n       |\n       |  (har 200 ms)\n       v\n   Outbox Poller  (SELECT ... WHERE published_at IS NULL ORDER BY id LIMIT 500 FOR UPDATE SKIP LOCKED)\n       |\n       |  produce, key = productId\n       v\n   Kafka topic `product-changes`  (12 partitions, key = productId)\n       |                            [same product ki saari events ek hi partition -> ORDER preserved]\n       v\n   Indexer Workers  (consumer group `product-indexer`, 12 consumers max)\n       |\n       |  batch: 500 docs  OR  5 MB  OR  1 s  (jo pehle aa jaaye)\n       |  Postgres se full product row lao (event mein sirf id + version hai)\n       |  ES bulk index, version_type: 'external', version: product.version\n       v\n   Elasticsearch  products_v3\n       |\n       |  refresh_interval: 1s  -> in-memory buffer se naya segment banta hai\n       v\n   SEARCHABLE  (end to end: ~1-3 s typical, requirement \u003c= 30 s)\n```\n\n**Step by step:**\n\n1. **Seller update karta hai.** Catalog Service ek hi Postgres transaction mein **do** cheezein likhta hai: `products` row update + `product_outbox` mein ek row insert. Ye dono ya to dono commit honge ya dono rollback -- **atomic**. Yahi outbox pattern ka poora point hai.\n2. **`version` bump hota hai.** Har update par `version = version + 1`. Ye number aage ES tak jaayega aur out-of-order messages se bachayega.\n3. **Outbox poller** har ~200 ms `published_at IS NULL` wali rows uthata hai, Kafka par bhejta hai, phir `published_at = now()` set karta hai.\n4. **Kafka `product-changes`, key = `productId`.** Key isliye zaroori hai ki **ek hi product ki saari events ek hi partition mein jaayein**. Kafka sirf partition ke andar order guarantee karta hai. Key na do to product P ka \"price 1499\" update partition 3 mein aur \"price 1299\" update partition 7 mein chala jaayega -- do alag consumers, do alag speed, aur ES mein galat final value aa sakti hai.\n5. **Indexer worker** events ko batch karta hai (500 docs / 5 MB / 1 s) aur ES `_bulk` API par bhejta hai. Per-document request bhejna 500x zyada network overhead hai.\n6. **ES refresh (`refresh_interval: 1s`).** ES mein document turant searchable nahi hota. Pehle in-memory buffer mein jaata hai; refresh par wo buffer ek naya **segment** banta hai aur tabhi search ko dikhta hai. 1 second = \"near real-time\".\n7. **Total lag:** outbox poll (~200 ms) + Kafka (~10 ms) + batch wait (\u003c= 1 s) + bulk index (~50-200 ms) + refresh (\u003c= 1 s) = **~1-3 second typical.** Requirement 30 s hai, to comfortable margin hai.\n\n**Metric jo is poore flow ko ek number mein batata hai:** `indexer_lag_seconds` = `now() - product.updatedAt` jab document ES mein successfully index ho. Ye 30 s cross kare to alert.\n\n---\n\n### Latency budget -- p95 \u003c 200 ms kaise prove karein\n\nInterview mein \"p95 200 ms rakhenge\" bolna kaafi nahi. **Budget todo aur dikhao ki har hissa kahan jaa raha hai.**\n\n| # | Step | p50 | p95 | Kyun itna |\n|---|---|---|---|---|\n| 1 | Client -> LB -> API network (same region) | 2 ms | 5 ms | TLS pehle se established (keep-alive) |\n| 2 | Rate limit (Redis token bucket) | 0.4 ms | 1 ms | Ek `EVALSHA`, same AZ |\n| 3 | zod validate + normalize + sha1 | 0.5 ms | 2 ms | Pure CPU, koi I/O nahi |\n| 4 | Redis `GET q:\u003csha1>` | 0.5 ms | 1 ms | In-memory |\n| -- | **Agar CACHE HIT -> yahin return** | **~5 ms** | **~12 ms** | ~30% requests |\n| 5 | QueryBuilder (pure function) | 0.2 ms | 0.5 ms | Sirf object banana |\n| 6 | API -> ES network + JSON serialize | 1 ms | 3 ms | Keep-alive agent, same VPC |\n| 7 | **ES query phase (6 shards parallel)** | 35 ms | **90 ms** | **max(shards)**, average nahi |\n| 8 | **ES aggregations (3 facets)** | 15 ms | **35 ms** | Poore match set par chalti hain |\n| 9 | ES fetch phase (24 docs ka `_source`) | 3 ms | 8 ms | Sirf 24 documents |\n| 10 | ES -> API network + JSON parse | 3 ms | 8 ms | ~50-100 KB response |\n| 11 | `response-mapper` | 1 ms | 3 ms | Array map, 24 items |\n| 12 | Redis `SETEX` (fire and forget) | 0 ms | 0 ms | `await` nahi karte |\n| 13 | JSON serialize -> client | 3 ms | 10 ms | Node ka `JSON.stringify` + gzip |\n| | **TOTAL (cache miss)** | **~64 ms** | **~166 ms** | Budget **200 ms** -- ~34 ms headroom [OK] |\n\n**Headroom kyun chhoda?** Kyunki peak traffic (4x) par ES queue karna shuru karti hai aur p95 badhta hai. 166 ms par chal rahe ho to 20% degradation bhi 200 ms ke andar hai. Agar design 198 ms par baithta, to har chhota spike SLO tod deta.\n\n**Budget kahan sabse pehle tootega?**\n\n| Kya badla | Asar | Fix |\n|---|---|---|\n| `size=100` (24 ki jagah) | Fetch phase 8 ms -> 30 ms, network 8 ms -> 40 ms | `size` max 100 par cap, default 24 |\n| `page=500` | Har shard se 500+24 docs coordinate node par = memory blow-up | `page` max 50, uske aage `search_after` |\n| Facets 3 se 10 kar diye | Aggregation 35 ms -> 120 ms | Sirf visible facets maango; baaki lazy load |\n| `track_total_hits: true` | Poora match set count karna padega (+50-150 ms) | `10000` par cap |\n| ES doosre region mein | +60-150 ms per request | ES hamesha same region, ideally same AZ |\n| Ek node par heap 85%+ | Lambe GC pauses -> wahi shard p99 kharab karega | Heap 31 GB cap, alert at 75% |\n\n> **Interview line:** \"Search ka latency budget basically **ek ES round trip** hai, aur ES ka round trip **sabse slow shard** se decide hota hai -- average se nahi. Isliye maine shard count 6 rakha (60 nahi), facets 3 rakhe, `track_total_hits` 10,000 par cap kiya, aur head queries ke liye 60-second Redis cache lagaya jo ~30% traffic ES tak pahunchne hi nahi deta.\"\n\n---\n\n## PART 8 -- API Design\n\nSearch system ki API chhoti hai -- do public endpoints, do admin, do health. Lekin **har query param ke peeche ek design decision hai**, aur interviewer wahi poochta hai.\n\n```\nGET  /api/v1/search     -- main search (public)\nGET  /api/v1/suggest    -- autocomplete (public)\nPOST /api/v1/admin/reindex    -- reindex job start (admin only)\nPOST /api/v1/admin/synonyms   -- synonyms add/update + reload analyzers (admin only)\nGET  /health                  -- process zinda hai?\nGET  /ready                   -- ES cluster status theek hai? (traffic lene layak hoon?)\n```\n\n### 8.1 `GET /api/v1/search`\n\n**Full request:**\n\n```\nGET /api/v1/search?q=iphone+case&brand=Apple&brand=Spigen&categoryPath=electronics%2Fmobiles%2Faccessories\n   &priceMin=500&priceMax=2000&minRating=4&inStock=true&sort=relevance&page=1&size=24\nAccept: application/json\n```\n\n**Query params (poori table):**\n\n| Param | Type | Default | Max / Allowed | Kyun |\n|---|---|---|---|---|\n| `q` | string | `\"\"` | **100 chars** | Search text. Khaali ho to category browse mode (`match_all` + filters) |\n| `brand` | string, repeatable | -- | 10 values | `?brand=Apple&brand=Spigen` -> OR filter |\n| `categoryPath` | string, repeatable | -- | 5 values | `electronics/mobiles/accessories` |\n| `priceMin` | number (rupees) | -- | >= 0 | `range` filter ka `gte` |\n| `priceMax` | number (rupees) | -- | \u003c= 10,000,000 | `range` filter ka `lte` |\n| `minRating` | number | -- | 0-5 | `range` filter `rating >= X` |\n| `inStock` | boolean | -- | `true`/`false` | `true` hone par hi filter lagta hai |\n| `sort` | enum | `relevance` | `relevance`, `price_asc`, `price_desc`, `newest`, `rating` | Whitelist -- user ka string field name kabhi nahi banta |\n| `page` | int | `1` | **50** | Uske aage `searchAfter` mandatory |\n| `size` | int | `24` | **100** | Grid 4x6 = 24 |\n| `searchAfter` | string (JSON array) | -- | -- | Deep pagination cursor `[sortValue, productId]` |\n\n**Response (200) -- spec ka `SearchResponse` shape:**\n\n```json\n{\n  \"hits\": [\n    { \"productId\": \"8f2c1a4e-...\", \"title\": \"Spigen Ultra Hybrid Case for iPhone 15\",\n      \"brand\": \"Spigen\", \"price\": 1299, \"rating\": 4.3, \"inStock\": true, \"score\": 18.42 },\n    { \"productId\": \"b71d0c99-...\", \"title\": \"Apple Silicone Case with MagSafe - iPhone 15\",\n      \"brand\": \"Apple\", \"price\": 4900, \"rating\": 4.6, \"inStock\": true, \"score\": 17.10 }\n  ],\n  \"total\": 10000,\n  \"totalIsLowerBound\": true,\n  \"facets\": {\n    \"brands\":      [ { \"value\": \"Spigen\", \"count\": 1204 }, { \"value\": \"Apple\", \"count\": 890 } ],\n    \"categories\":  [ { \"value\": \"electronics/mobiles/accessories\", \"count\": 3421 } ],\n    \"priceRanges\": [ { \"value\": \"*-500\", \"count\": 812 }, { \"value\": \"500-2000\", \"count\": 2210 },\n                     { \"value\": \"2000-*\", \"count\": 1190 } ]\n  },\n  \"tookMs\": 74,\n  \"searchAfter\": [17.10, \"b71d0c99-...\"]\n}\n```\n\n**Ye endpoint kyun hai?** Poora product discovery isi par khada hai. Homepage ke baad user ka pehla interaction search box hai -- agar ye down hai to catalog exist hi nahi karta. Isliye Part 1 mein availability 99.95% aur **fallback path** decide kiya tha.\n\n**Auth chahiye ya nahi?** **Nahi.** Search public hai -- logged-out user bhi search karta hai (aur wahi conversion funnel ka top hai). Lekin **rate limit zaroori hai** (`rl:search:\u003cip>`), kyunki bina auth ke abuse ka darwaza khula hai. Logged-in user ka token ho to use sirf analytics (`userId` query log mein) aur future personalization ke liye padhte hain -- results abhi same rehte hain.\n\n**Validation rules aur error cases:**\n\n| Condition | Status | Body |\n|---|---|---|\n| `q` > 100 chars | `400` | `{ \"error\": \"VALIDATION_ERROR\", \"field\": \"q\", \"message\": \"q max 100 characters\" }` |\n| `size` > 100 | `400` | `{ \"error\": \"VALIDATION_ERROR\", \"field\": \"size\" }` |\n| `page` > 50 bina `searchAfter` | `400` | `{ \"error\": \"VALIDATION_ERROR\", \"field\": \"page\", \"message\": \"use searchAfter beyond page 50\" }` |\n| `sort=price` (typo, allowed list mein nahi) | `400` | `{ \"error\": \"VALIDATION_ERROR\", \"field\": \"sort\" }` |\n| Unknown filter (`?color=red`) | `400` | `{ \"error\": \"VALIDATION_ERROR\", \"field\": \"color\", \"message\": \"unknown filter\" }` |\n| `priceMin > priceMax` | `400` | `{ \"error\": \"VALIDATION_ERROR\", \"message\": \"priceMin must be \u003c= priceMax\" }` |\n| Rate limit cross | `429` | `{ \"error\": \"RATE_LIMITED\", \"retryAfterSec\": 12 }` + `Retry-After` |\n| ES down, Postgres fallback chala | `200` | Normal body + `\"degraded\": true`, facets khaali |\n| ES down **aur** fallback bhi fail | `503` | `{ \"error\": \"SEARCH_UNAVAILABLE\" }` |\n\n---\n\n### 8.2 Deep dive -- har limit ke peeche ki wajah\n\n#### (a) `q` 100 characters par cap kyun?\n\nYahan teen alag problems ek saath rukti hain:\n\n1. **Fuzzy expansion ka cost.** Hamari query mein `fuzziness: AUTO` hai. Har term ke liye ES term dictionary mein edit-distance-1/2 wale saare terms dhoondhta hai. 3-word query mein 3 terms x ~50 expansions = 150 terms. 50-word query mein 50 x 50 = **2,500 terms** ka boolean query -- ek hi request cluster ka ek core kha jaayegi.\n2. **`max_clause_count` crash.** Lucene ka default boolean clause limit 1024 (newer versions mein 4096) hai. Bahut lambi query cross kar jaati hai aur ES `too_many_clauses` exception phenkta hai -- 500 error, na ki slow response.\n3. **Cache poisoning.** Har unique lambi query ek nayi Redis key banati hai. Attacker 1M random 5,000-char queries bhej ke Redis memory bhar sakta hai aur asli head queries ko evict kara sakta hai.\n\n100 chars kaafi hai: real users ki average query ~2.5 words (~18 chars) hoti hai. 100 se lambi query 99.99% cases mein bot hai.\n\n#### (b) `page` 50 par cap, uske aage `search_after` kyun?\n\nYe sabse achha \"distributed systems\" question hai. Problem ko number ke saath samjho.\n\n**`from + size` kaise kaam karta hai:** page 500, size 24 maango (`from=11976, size=24`). ES ko top 12,000 results **global order mein** chahiye, lekin har shard ko nahi pata ki uske results global ranking mein kahan aayenge. Isliye:\n\n```\npage 1   (from=0,     size=24):  har shard se 24 docs    -> 6 x 24     =    144 entries merge\npage 50  (from=1176,  size=24):  har shard se 1,200 docs -> 6 x 1,200  =  7,200 entries merge\npage 500 (from=11976, size=24):  har shard se 12,000 docs-> 6 x 12,000 = 72,000 entries merge\n                                  ... aur user ko dikhne wale sirf 24!\n```\n\nCoordinating node ko 72,000 `(docId, score, sortValue)` entries memory mein rakhni padti hain, sort karni padti hain, aur 71,976 ko phenk dena padta hai. Ek request ke liye -- aur 1,000 QPS par ye heap ko maar deta hai. Isiliye ES ka default `index.max_result_window: 10000` hai; `from + size > 10000` par wo seedha error deta hai.\n\n**`search_after` kaise bachata hai:** cursor-based pagination. Pichhle page ke **aakhri document ki sort values** bhejte ho, aur ES bolta hai \"in values ke *baad* wale 24 do\". Har shard ko sirf apne local index mein us point se aage 24 docs chahiye -- **memory constant rehti hai, chahe page 5 ho ya 5,000.**\n\n```\npage 1 response:  searchAfter: [17.10, \"b71d0c99-...\"]\nnext request:     ?q=iphone+case&searchAfter=[17.10,\"b71d0c99-...\"]\nES:  sort [\"_score\", {\"productId\":\"asc\"}]  +  search_after: [17.10, \"b71d0c99-...\"]\n```\n\n**Tie-breaker `productId` kyun zaroori hai?** `search_after` ko ek **unique, stable** sort position chahiye. Agar 40 products ka score exactly `17.10` hai aur sirf `_score` par sort kiya, to ES ko pata hi nahi chalega ki un 40 mein se kahan se continue karna hai -- results repeat honge ya skip. `productId` (unique) tie-breaker add karne se har document ki position unique ho jaati hai. **Yahi wajah hai ki spec ke har sort mein `{ \"productId\": \"asc\" }` last element hai.**\n\n**Trade-off:** `search_after` se tum **page 500 par jump nahi kar sakte** -- sirf \"next\" kar sakte ho, kyunki cursor pichhle page se aata hai. Ye theek hai: analytics kehti hai ki 99% users page 3 se aage jaate hi nahi. Jo jaate hain wo scrapers hain.\n\n**Aur `scroll` API?** Wo **stateful snapshot** banata hai (server par context, memory, expiry). Export/offline jobs ke liye sahi hai, real-time UI ke liye bilkul nahi -- 1,000 QPS par hazaaron scroll contexts cluster ki memory kha jaayenge. Modern tareeka **PIT (point in time) + `search_after`** hai.\n\n#### (c) `track_total_hits: 10000` -> `totalIsLowerBound: true` -> UI par \"10,000+ results\"\n\nExact total count nikalne ke liye ES ko **poore match set** ko count karna padta hai -- 50M ke index mein \"shoes\" 800,000 documents match kar sakta hai. Sirf ye count karne ke liye 800,000 documents par iterate karna +50-150 ms hai, aur user isse kuch nahi karta.\n\n`track_total_hits: 10000` ka matlab: \"10,000 tak exact count karo, uske baad rok do aur bata do ki 10,000 se zyada hain.\"\n\nES response mein ye aise aata hai:\n\n```json\n\"hits\": { \"total\": { \"value\": 10000, \"relation\": \"gte\" } }\n\"hits\": { \"total\": { \"value\": 347,   \"relation\": \"eq\"  } }\n```\n\n`gte` = greater than or equal (lower bound), `eq` = exact. Hum isko API mein do fields mein translate karte hain:\n\n| ES `relation` | API `total` | API `totalIsLowerBound` | UI par kya dikhe |\n|---|---|---|---|\n| `eq` | `347` | `false` | \"347 results\" |\n| `gte` | `10000` | `true` | **\"10,000+ results\"** |\n\n**UI ko `totalIsLowerBound` clearly handle karna chahiye:**\n\n- [OK] `\"10,000+ results found\"`\n- [X] `\"10000 results found\"` -- jhooth hai, aur user page 417 par jaayega to khaali milega\n- [X] Pagination component mein `Math.ceil(10000/24) = 417` pages dikhana -- user 417 pages dekhega jabki wo `page > 50` par ja hi nahi sakta\n\nSahi UI: \"10,000+ results\", aur pagination sirf 50 pages tak, uske baad \"Load more\" button jo `searchAfter` bhejta hai.\n\n#### (d) Filters kaise pass hote hain aur validate hote hain -- \"query injection\" wala point\n\nYe **PART 8 ka sabse important security point** hai.\n\n**Galat approach (bahut tempting):**\n\n```ts\n// [X] KABHI NAHI\nconst filters = Object.entries(req.query)\n  .filter(([k]) => !['q', 'page', 'size', 'sort'].includes(k))\n  .map(([field, value]) => ({ term: { [field]: value } }));   // user ka key -> ES field\n```\n\n**Code Explanation:**\n\n- `Object.entries(req.query)` -- user ne jo bhi query params bheje, sab utha liye.\n- `.filter(...)` -- known params hata diye, baaki sabko \"filter\" maan liya.\n- `{ term: { [field]: value } }` -- **yahi line poison hai**: `field` seedha user se aa raha hai aur ES DSL ka **field name** ban raha hai.\n\nProblem kya hai?\n\n1. **Internal fields expose ho gaye.** `?sellerId=xyz` chal jaayega. `?popularityScore=...`, `?version=...` -- tumhare internal ranking fields ab public filterable hain. Competitor tumhara popularity model reverse-engineer kar sakta hai.\n2. **Galat/mehengi operations trigger ho sakti hain.** `?description=something` -> `text` field par `term` query. Ye galat result dega (term query analyze nahi karti) aur user confuse hoga.\n3. **DoS.** `?attributes=\u003c10 MB string>` -> ES ko ek bada term lookup karna padega.\n4. **Nested DSL injection.** Agar tum `JSON.parse(req.query.filter)` karke usse DSL mein daal do, to user `{\"script\": {\"source\": \"...\"}}` bhej sakta hai -- **painless script execution**. Ye asli RCE-class bug hai. (Isiliye production clusters mein inline scripting disable hoti hai.)\n\n**Sahi approach -- explicit whitelist:**\n\n```ts\n// [OK] Har filter ka naam, type, aur ES field mapping HUM decide karte hain\nexport const FILTER_SPEC = {\n  brand:        { esField: 'brand',        kind: 'terms',    maxValues: 10 },\n  categoryPath: { esField: 'categoryPath', kind: 'terms',    maxValues: 5  },\n  priceMin:     { esField: 'price',        kind: 'rangeGte' },\n  priceMax:     { esField: 'price',        kind: 'rangeLte' },\n  minRating:    { esField: 'rating',       kind: 'rangeGte' },\n  inStock:      { esField: 'inStock',      kind: 'termBool' },\n} as const;\n```\n\n**Code Explanation:**\n\n- Ye ek **static map** hai -- compile time par fixed. Runtime par user isme kuch add nahi kar sakta.\n- `esField` -- public param naam (`minRating`) aur internal ES field (`rating`) alag ho sakte hain. Isse tum ES schema ko rename kar sakte ho bina public API toda.\n- `kind` -- kaunsi DSL clause banegi. `terms` (multi-value OR), `rangeGte`, `rangeLte`, `termBool`. **User `kind` choose nahi karta.**\n- `maxValues` -- `?brand=A&brand=B&...` 500 baar bhejne par bhi hum sirf pehle 10 lenge (ya `400` denge). Warna 500-clause `terms` query.\n- `as const` -- TypeScript ko batata hai ki ye object literal readonly hai, aur keys ka union type (`'brand' | 'categoryPath' | ...`) nikal aata hai. Isse zod schema aur query-builder dono type-safe ho jaate hain.\n\nTeen niyam yaad rakho:\n\n1. **User kabhi field name decide nahi karta.** `brand` -> `brand`, ye mapping code mein hai. Unknown key = `400`, chup-chaap ignore nahi (warna typo `?brnd=Apple` silently ignore hoga aur user ko galat results milenge).\n2. **User kabhi query *type* decide nahi karta.** `term` vs `range` vs `match` -- humne decide kiya.\n3. **Values bhi validate hoti hain.** `brand` ek string hai, max 100 chars, max 10 values. `priceMin` ek finite number hai. `inStock` sirf `\"true\"`/`\"false\"`.\n\n> **Interview line:** \"User input se main sirf **values** leta hoon, **structure** kabhi nahi. Query DSL ka shape hamesha server-side whitelist se banta hai. Ye wahi principle hai jo SQL mein parameterized queries ka hai -- yahan bas JSON DSL hai, SQL string nahi.\"\n\n#### (e) `degraded: true` -- fallback path ka honest signal\n\nJab ES cluster red ho ya ES calls timeout ho rahi hon, hum **teen step** neeche girte hain (Part 1 ka \"degrade, don't die\"):\n\n```\n1. Redis cache se stale result             -> degraded: true  (head queries ke liye kaam karta hai)\n2. Postgres pg_trgm / tsvector top 20      -> degraded: true, facets: {} (khaali)\n3. dono fail                               -> 503 SEARCH_UNAVAILABLE\n```\n\nResponse:\n\n```json\n{\n  \"hits\": [ \"... top 20 ...\" ],\n  \"total\": 20,\n  \"totalIsLowerBound\": true,\n  \"facets\": { \"brands\": [], \"categories\": [], \"priceRanges\": [] },\n  \"tookMs\": 180,\n  \"degraded\": true\n}\n```\n\n**`degraded` field API mein kyun daala, sirf log kyun nahi?**\n\n- **Frontend banner dikha sakta hai:** \"Showing limited results. Filters temporarily unavailable.\" User ko pata chalta hai ki kuch alag hai -- warna wo sochega ki tumhara catalog chhota hai.\n- **UI facet sidebar hide kar sakti hai.** Khaali facets dikhana (\"Brands: none\") galat lagta hai; sidebar hi hata do.\n- **Client-side metric.** Frontend `degraded` ki rate track kar sakta hai -- kabhi-kabhi backend metric se pehle client par dikhta hai.\n- **Cache mein `degraded: true` wala response kabhi mat daalo.** Warna ES wapas aane ke baad bhi 60 second tak degraded results serve hote rahenge.\n\nServer side par ye `search_degraded_total` metric badhata hai -- alert ka pehla signal.\n\n---\n\n### 8.3 `GET /api/v1/suggest`\n\n```\nGET /api/v1/suggest?q=iph&limit=10\n\n200 OK\n{\n  \"suggestions\": [\n    { \"text\": \"iphone 15\",         \"type\": \"query\" },\n    { \"text\": \"iphone case\",       \"type\": \"query\" },\n    { \"text\": \"iphone 15 pro max\", \"type\": \"query\" },\n    { \"text\": \"Apple iPhone 15 (128GB, Blue)\", \"type\": \"product\" },\n    { \"text\": \"electronics/mobiles\", \"type\": \"category\" }\n  ]\n}\n```\n\n| Param | Rules | Kyun |\n|---|---|---|\n| `q` | required, 1-50 chars | 50 se lambi \"prefix\" hoti hi nahi; cache key chhoti rehti hai |\n| `limit` | default 10, max 20 | Dropdown mein 10 se zyada koi nahi padhta; har extra result latency hai |\n\n**`type` field kyun?** UI ko pata hona chahiye ki click par kya karna hai:\n\n- `query` -> search page par le jao (`/search?q=iphone+case`)\n- `product` -> seedha product page (`/p/\u003cproductId>`)\n- `category` -> category listing page\n\n**Auth:** nahi. **Rate limit:** haan, lekin **search se 4-5x dheeli** -- kyunki ek search ke liye 4 suggest calls normal hain. Same limit lagaoge to normal user hi 429 khaayega.\n\n**Error cases:**\n\n| Condition | Status |\n|---|---|\n| `q` missing ya khaali | `400 VALIDATION_ERROR` |\n| `q` > 50 chars | `400 VALIDATION_ERROR` |\n| ES `suggestions` index down | `200` with `{ \"suggestions\": [] }` -- **kabhi 500 nahi** |\n\n> Autocomplete fail hone par **khaali array** dena sahi hai, error nahi. User type karta rahega aur Enter dabayega -- uska flow tootna nahi chahiye sirf isliye ki dropdown nahi aaya. Ye \"graceful degradation\" ka sabse saaf example hai.\n\n### 8.4 Admin endpoints\n\n```\nPOST /api/v1/admin/reindex\nAuthorization: Bearer \u003cadmin-token>\n{ \"targetIndex\": \"products_v4\", \"sourceIndex\": \"products_v3\" }\n\n202 Accepted\n{ \"jobId\": \"reindex-2026-09-18-01\", \"status\": \"running\",\n  \"statusUrl\": \"/api/v1/admin/reindex/reindex-2026-09-18-01\" }\n```\n\n**`202` kyun, `200` nahi?** Reindex 50M documents par **ghanton** chalta hai. HTTP request usse wait nahi kar sakti. `202 Accepted` ka matlab hai \"kaam accept kar liya, background mein chal raha hai, yahan se status dekho.\" Ye **async job API** ka standard pattern hai.\n\n```\nPOST /api/v1/admin/synonyms\nAuthorization: Bearer \u003cadmin-token>\n{ \"terms\": \"mobile, smartphone, cell phone, cellphone\", \"enabled\": true }\n\n200 OK\n{ \"id\": 42, \"reloaded\": true, \"affectedIndices\": [\"products_v3\"] }\n```\n\nYe `search_synonyms` table mein row daalta hai, `synonyms.txt` export karta hai, aur `POST /products/_reload_search_analyzers` call karta hai. **Reindex ki zarurat nahi** kyunki synonyms **search-time** par lagte hain (PART 9 mein detail).\n\n**Auth (dono admin endpoints):** admin JWT + role `search-admin`, aur internal network/VPN se hi reachable. Galat reindex = cluster par ghanton ka load; galat synonym = poore catalog ki relevance kharab. Har change ka audit log (kaun, kab, kya).\n\n### 8.5 `/health` vs `/ready` -- ye alag kyun hain\n\n```\nGET /health   ->  200 { \"status\": \"ok\" }\n                  (sirf: Node process zinda hai aur event loop blocked nahi hai)\n\nGET /ready    ->  200 { \"status\": \"ready\", \"es\": \"green\", \"redis\": \"up\" }\n                  503 { \"status\": \"not_ready\", \"es\": \"red\" }\n```\n\n- **`/health` (liveness):** \"process ko restart karna chahiye?\" Isme **kabhi** ES check mat karo. ES red hone par Kubernetes tumhare saare healthy API pods ko restart karne lagega -- ES already down hai aur ab API bhi restart loop mein. Disaster.\n- **`/ready` (readiness):** \"is instance ko traffic bhejna chahiye?\" Yahan ES cluster status aur Redis connectivity check karo. Not ready = LB is instance ko rotation se hata dega.\n\n> Note: agar hamare paas Postgres fallback hai, to ES red hone par bhi API **degraded results de sakti hai**. Us case mein `/ready` ko 503 dena galat hoga -- sab instances rotation se nikal jaayenge aur user ko kuch bhi nahi milega. Isliye `/ready` tabhi fail karo jab **na ES, na Postgres fallback** kaam kar raha ho.\n\n---\n\n## PART 9 -- Index + Database Design\n\nIs system mein **do storage** hain aur unka rishta samajhna hi poora design samajhna hai:\n\n```\n   Postgres  =  SOURCE OF TRUTH      (correctness, transactions, money, durability)\n        |\n        |   (outbox -> Kafka -> indexer)\n        v\n   Elasticsearch = DERIVED VIEW      (speed, relevance, facets -- ek \"smart cache\")\n```\n\n**Ek line mein rule:** ES ko kabhi source of truth mat banao. ES delete ho jaaye to tum Postgres se **poora index dobara bana sakte ho** (kuch ghante lagenge, par data nahi gaya). Postgres delete ho jaaye to data gaya -- ES se poora product record wapas nahi milega (usme sirf searchable fields hain, saara business data nahi).\n\n---\n\n### 9(a) -- Postgres: source of truth\n\n**Spec ka DDL (verbatim):**\n\n```sql\nCREATE TABLE products (\n  id            UUID PRIMARY KEY,\n  seller_id     UUID NOT NULL,\n  title         TEXT NOT NULL,\n  description   TEXT,\n  brand         TEXT,\n  category_path TEXT NOT NULL,             -- 'electronics/mobiles/accessories'\n  attributes    JSONB NOT NULL DEFAULT '{}',\n  price_paise   BIGINT NOT NULL,           -- paisa/cents, never float for money\n  stock_qty     INT NOT NULL DEFAULT 0,\n  rating        NUMERIC(2,1) DEFAULT 0,\n  rating_count  INT DEFAULT 0,\n  status        TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active','inactive','deleted')),\n  version       BIGINT NOT NULL DEFAULT 1, -- bumped on every update; used as ES external version\n  created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),\n  updated_at    TIMESTAMPTZ NOT NULL DEFAULT now()\n);\nCREATE INDEX products_seller_idx ON products (seller_id, updated_at DESC);\n\nCREATE TABLE product_outbox (              -- written in the SAME transaction as the product change\n  id          BIGSERIAL PRIMARY KEY,\n  product_id  UUID NOT NULL,\n  op          TEXT NOT NULL CHECK (op IN ('upsert','delete')),\n  version     BIGINT NOT NULL,\n  created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),\n  published_at TIMESTAMPTZ NULL\n);\nCREATE INDEX product_outbox_unpublished ON product_outbox (id) WHERE published_at IS NULL;\n\nCREATE TABLE search_synonyms (             -- edited by ops, exported to synonyms.txt on reload\n  id BIGSERIAL PRIMARY KEY, terms TEXT NOT NULL, enabled BOOLEAN DEFAULT true, updated_at TIMESTAMPTZ DEFAULT now()\n);\nCREATE TABLE query_popularity (            -- nightly job output, feeds suggestions index\n  query TEXT PRIMARY KEY, searches_30d BIGINT, ctr NUMERIC(5,4), updated_at TIMESTAMPTZ\n);\n```\n\n**Code Explanation -- `products` table, column by column:**\n\n- `id UUID PRIMARY KEY` -- auto-increment integer kyun nahi? Kyunki product ids **multiple services** (seller panel, bulk upload, partner API) se banti hain aur sabko ek central sequence par depend nahi karna chahiye. UUID client-side generate ho sakta hai, aur ye ES ka `_id` bhi banta hai -- ek hi identifier har jagah.\n- `seller_id UUID NOT NULL` -- kaunse seller ka product. Seller suspend hua to uske saare products ek query se nikal sakte ho.\n- `title TEXT NOT NULL` -- searchable, ES mein `text` + `keyword` + `ac` banega.\n- `description TEXT` -- nullable, kyunki bahut se sellers description nahi bharte.\n- `brand TEXT` -- nullable (unbranded products hote hain). ES mein `keyword` banega (facet chahiye).\n- `category_path TEXT NOT NULL` -- `'electronics/mobiles/accessories'`. Ek **denormalized path string** hai, alag `categories` table ka join nahi. Kyun? Kyunki search ko path prefix chahiye hota hai aur join hot path par nahi chahiye.\n- `attributes JSONB NOT NULL DEFAULT '{}'` -- `{ \"color\": \"blue\", \"storage\": \"128GB\" }`. Har category ke alag attributes hote hain (mobile mein RAM, shirt mein size) -- fixed columns banana impossible. `DEFAULT '{}'` isliye ki code ko kabhi `null` check na karna pade.\n- `price_paise BIGINT NOT NULL` -- **agla point poora isi par hai.**\n- `stock_qty INT` -- exact quantity yahin rehti hai, ES mein sirf `inStock` boolean jaata hai.\n- `rating NUMERIC(2,1)` -- `4.3` type. `NUMERIC` exact hai, `FLOAT` nahi -- rating average dikhane mein `4.300000000001` nahi chahiye.\n- `status ... CHECK (status IN ('active','inactive','deleted'))` -- **soft delete.** Row physically delete nahi karte. Kyun? (1) Orders table usko reference karti hai, (2) accidentally delete hua to wapas la sakte ho, (3) \"deleted\" bhi ek event hai jo ES tak propagate karna hai.\n- `version BIGINT NOT NULL DEFAULT 1` -- har update par `version = version + 1`. Iska poora kaam neeche.\n- `updated_at TIMESTAMPTZ` -- `indexer_lag_seconds` metric isi se calculate hota hai.\n- `CREATE INDEX products_seller_idx ON products (seller_id, updated_at DESC)` -- seller panel ka main query: \"mere products, latest pehle\". Composite index isliye ki filter (`seller_id`) aur sort (`updated_at DESC`) dono ek hi index se ho jaayein -- Postgres ko alag sort step nahi karna padega.\n\n> **Dhyaan do:** yahan `title` par koi text index nahi hai. Kyunki **normal search Postgres par chalti hi nahi** -- wo ES karta hai. Postgres par sirf **degraded fallback search** chalti hai, aur uske liye alag GIN/trigram index PART 11 ke end mein add karenge.\n\n#### `price_paise BIGINT` -- float kabhi nahi, kyun?\n\nYe har payment/e-commerce interview ka classic hai. Chalo asli calculation dekhte hain:\n\n```\n0.1 + 0.2 === 0.3      ->  false\n0.1 + 0.2              ->  0.30000000000000004\n```\n\nKyun? `FLOAT`/`DOUBLE` binary floating point hai (IEEE 754). Binary mein `0.1` ko exactly represent kiya hi nahi ja sakta -- jaise decimal mein `1/3` ko exactly nahi likh sakte. Har operation mein thoda rounding error jamta hai.\n\nE-commerce mein iska asar:\n\n```\nPrice 1999.99 as FLOAT stored:   1999.9899999999999999\nDiscount 10% calculate:          1799.9909999999998\nRound for display:               1799.99\nCart total (3 items):            5399.969999999999   -> display 5399.97\nPayment gateway ko bheja:        5399.97\nLedger mein add kiya:            5399.969999999999\n                                 ------------------------\n                                 Mismatch of 0.000000001 per order\n                                 x 1M orders/day = reconciliation team ka nightmare\n```\n\n**Solution:** paise (smallest unit) mein **integer** store karo.\n\n```\nRs 1,999.99  ->  price_paise = 199999   (BIGINT)\n```\n\n- **`BIGINT` kyun, `INT` nahi?** `INT` ki max value ~2.1 billion = Rs 21,474,836.47. Ek luxury item (car, jewellery, B2B bulk order) us se upar ja sakta hai. `BIGINT` = ~92 quadrillion paise. Extra 4 bytes per row x 50M rows = 200 MB. Ye insurance sasta hai.\n- **ES mein `scaled_float` with `scaling_factor: 100`** -- ES ko `1999.99` dete ho, wo internally `199999` (long) store karta hai. Yani **dono jagah integer**, sirf API surface par decimal. Range queries aur sorting exact rehti hain.\n- **Conversion ek hi jagah:** repository layer mein `price_paise / 100`. Poore codebase mein bikhra hua `/100` nahi.\n\n#### `version` column kis liye hai?\n\n`version` ek **monotonically increasing counter** hai jo har update par badhta hai. Iska ek hi kaam hai: **out-of-order updates ko rokna.**\n\nProblem dekho:\n\n```\n10:00:00.000  Seller price 1499 karta hai   -> version = 5, Kafka mein event A\n10:00:00.200  Seller price 1299 karta hai   -> version = 6, Kafka mein event B\n\nIndexer worker 1 uthata hai event A -> Postgres se row padhta hai -> bulk request banata hai\nIndexer worker 2 uthata hai event B -> Postgres se row padhta hai -> bulk request banata hai\n\nNetwork / GC / retry ki wajah se:\n   worker 2 ka bulk request ES par pehle pahunchta hai  (price 1299)\n   worker 1 ka bulk request ES par baad mein pahunchta hai (price 1499)\n\nBina version ke: ES mein FINAL value = 1499  [X]  GALAT (purana data jeet gaya)\n```\n\n`version_type: 'external'` ke saath:\n\n```\nworker 2: PUT doc, version = 6  -> ES accept (6 > current 0)   -> ES mein version 6, price 1299\nworker 1: PUT doc, version = 5  -> ES: 5 \u003c 6, REJECT -> 409 version_conflict_engine_exception\nindexer:  409 mila? matlab stale event tha -> IGNORE, commit offset, aage badho\n\nES mein FINAL value = 1299  [OK]  SAHI\n```\n\n**Ye \"eventual consistency mein ordering\" ka concrete jawab hai.** Interview mein bolne wali line: \"Main Kafka ko `productId` se partition karta hoon taaki ek product ki events ordered rahein, **aur** ES par external versioning lagata hoon taaki retries/reprocessing ke baad bhi purana data naye ko overwrite na kar sake. Ordering ke do layers -- transport level aur storage level.\"\n\n**Aur kaunse options the?**\n\n| Option | Kaam karta hai? | Kyun/kyun nahi |\n|---|---|---|\n| `version` column + `version_type: external` | **Haan (hamari choice)** | ES khud enforce karta hai, indexer stateless reh sakta hai |\n| `updated_at` timestamp ko version banana | Risky | Do servers ki clocks skew ho sakti hain; ek hi millisecond mein do updates possible |\n| Kafka offset ko version banana | Nahi | Har partition ka apna offset space hai, aur reprocessing par offsets repeat |\n| Indexer mein \"last seen version\" memory mein rakhna | Nahi | Worker restart = memory gayi; multiple workers = alag-alag memory |\n\n#### `product_outbox` -- ye table kyun exist karta hai?\n\n**Pehle galat approach dekho, taaki outbox ki value samajh aaye.**\n\n**Dual write (app khud DB aur ES dono mein likhta hai):**\n\n```ts\n// [X] BROKEN -- interview mein ye bolne par follow-up question pakka aayega\nasync function updateProduct(id: string, price: number) {\n  await pg.query('UPDATE products SET price_paise = $1 WHERE id = $2', [price * 100, id]);\n  await es.index({ index: 'products', id, document: { price } });   // \u003c-- do alag systems\n}\n```\n\n**Code Explanation:**\n\n- Line 1: Postgres mein price update -- commit ho gaya, durable hai.\n- Line 2: ES mein same update -- ye ek **alag network call, alag system, alag failure domain** hai.\n- Beech mein koi transaction nahi hai. Postgres aur ES ke beech koi \"dono ya koi nahi\" guarantee nahi hai.\n\n**Exact failure sequence jo permanent divergence deta hai:**\n\n```\nt=0     Seller \"price 1299\" bhejta hai\nt=1     Postgres: UPDATE ... COMMIT  [OK]   -> DB mein price = 1299\nt=2     Node process ES call karta hai...\nt=3     *** Node process crash / pod OOMKilled / deploy ne restart kar diya ***\n        (ya: ES 503 deta hai, ya network timeout, ya ES cluster us waqt red hai)\nt=4     ES mein price abhi bhi 1999\n\nAB KYA HOTA HAI:\n- Kisi ko pata hi nahi chala ki divergence ho gayi. Koi error log bhi nahi (process hi mar gaya).\n- Retry kaun karega? Request khatam ho chuki hai, HTTP connection band ho chuka hai.\n- Seller ko \"Saved successfully\" dikh chuka hai (DB commit ho gaya tha).\n- Search mein product 1999 par dikhta rahega -- HAMESHA ke liye.\n- Ye tabhi theek hoga jab seller dobara koi update kare. Yani kabhi bhi nahi.\n```\n\nAur ulta order karo (pehle ES, phir DB)? Utna hi bura: ES mein 1299 chala gaya, DB transaction fail ho gaya -- ab search mein price 1299 dikh raha hai jo asli nahi hai. User us price par cart mein daalega aur checkout par 1999 dikhega. **Trust gaya.**\n\nAur \"try/catch mein retry laga do\"? Wo bhi nahi bachata:\n\n- Process crash ho gaya to retry loop bhi mar gaya.\n- Retry ke liye state kahan rakhoge? Memory mein -> restart par gaya. Disk par -> tumne outbox hi bana diya, bas gande tareeke se.\n- Retry karte waqt agar naya update aa gaya to purana retry naye ko overwrite kar dega.\n\n**Outbox pattern isko kaise solve karta hai:**\n\n```\nBEGIN;\n  UPDATE products SET price_paise = 129900, version = version + 1, updated_at = now()\n   WHERE id = $1;\n  INSERT INTO product_outbox (product_id, op, version) VALUES ($1, 'upsert', $2);\nCOMMIT;                      \u003c-- EK transaction. Postgres guarantee: dono ya koi nahi.\n```\n\n**Code Explanation:**\n\n- `BEGIN` / `COMMIT` -- ek hi Postgres transaction. Ye **ek hi database** hai, isliye ACID guarantee asli hai (do alag systems ke beech distributed transaction ki zarurat nahi).\n- `UPDATE products ...` -- business data.\n- `INSERT INTO product_outbox ...` -- \"is product ko re-index karna hai\" ka **durable intent**.\n- Agar commit se pehle process crash ho jaaye -> **dono** rollback. DB purane state mein, ES purane state mein -> **consistent**.\n- Agar commit ho gaya -> outbox row **disk par hai**. Process crash ho jaaye to bhi row wahin hai. Poller wapas aa ke usko uthayega. **Kuch kho nahi sakta.**\n\n**Ab guarantee ka level:**\n\n| Approach | Guarantee | Failure par |\n|---|---|---|\n| Dual write | **koi nahi** | Permanent silent divergence |\n| Outbox | **at-least-once** | Event dobara publish ho sakta hai -> indexer idempotent hona chahiye (version se) |\n\nAt-least-once matlab: event **kam se kam ek baar** zaroor jaayega, kabhi-kabhi do baar. Do baar jaana theek hai kyunki ES upsert idempotent hai aur `version` duplicate/stale ko sambhal leta hai. **Zero baar jaana** kabhi nahi hoga -- aur wahi cheez dual write guarantee nahi kar sakta.\n\n**Outbox table ka index:**\n\n```sql\nCREATE INDEX product_outbox_unpublished ON product_outbox (id) WHERE published_at IS NULL;\n```\n\n**Code Explanation:**\n\n- Ye ek **partial index** hai (`WHERE` clause ke saath). Sirf un rows ko index karta hai jo abhi publish nahi hui.\n- Kyun partial? Kyunki 5M updates/day x 30 din = 150M rows table mein hongi, lekin **unpublished hamesha sirf kuch hazaar** hongi (poller har 200 ms chalta hai). Full index 150M entries ka hota -- bada, slow, aur har insert par maintain karna padta. Partial index sirf ~5,000 entries ka rehta hai -- RAM mein fit, lightning fast.\n- Poller ki query `WHERE published_at IS NULL ORDER BY id LIMIT 500` exactly is index se serve hoti hai.\n- **Purani published rows ka kya?** Nightly cleanup: `DELETE FROM product_outbox WHERE published_at \u003c now() - interval '7 days'`. 7 din isliye ki debugging aur replay ke liye history chahiye.\n\n#### Baaki do tables\n\n- **`search_synonyms`** -- ops team UI se synonyms edit karti hai (`\"mobile, smartphone, cell phone\"`). Ek job isko `synonyms.txt` mein export karta hai aur `_reload_search_analyzers` call karta hai. Git mein file rakhna bhi chalta, lekin phir har synonym change ke liye deploy chahiye -- aur synonyms roz badalte hain (zero-result report dekh ke).\n- **`query_popularity`** -- nightly job Kafka `search-queries` topic (S3/warehouse) se banata hai: `query`, `searches_30d`, `ctr`. Ye do jagah use hota hai: (1) `suggestions_v2` index bharne ke liye (popular queries hi suggest hoti hain), (2) `popularityScore` calculate karke `products_v3` mein feed karne ke liye.\n\n---\n\n### 9(b) -- Elasticsearch mapping: har choice ka WHY\n\n**Spec ki mapping (verbatim):**\n\n```json\n{\n  \"settings\": {\n    \"number_of_shards\": 6, \"number_of_replicas\": 1, \"refresh_interval\": \"1s\",\n    \"analysis\": {\n      \"filter\": {\n        \"en_stop\":     { \"type\": \"stop\", \"stopwords\": \"_english_\" },\n        \"en_stemmer\":  { \"type\": \"stemmer\", \"language\": \"english\" },\n        \"syn_graph\":   { \"type\": \"synonym_graph\", \"synonyms_path\": \"synonyms.txt\" },\n        \"edge_ngram\":  { \"type\": \"edge_ngram\", \"min_gram\": 2, \"max_gram\": 20 }\n      },\n      \"analyzer\": {\n        \"product_index\":  { \"tokenizer\": \"standard\", \"filter\": [\"lowercase\", \"en_stop\", \"en_stemmer\"] },\n        \"product_search\": { \"tokenizer\": \"standard\", \"filter\": [\"lowercase\", \"syn_graph\", \"en_stop\", \"en_stemmer\"] },\n        \"autocomplete_index\": { \"tokenizer\": \"standard\", \"filter\": [\"lowercase\", \"edge_ngram\"] }\n      }\n    }\n  },\n  \"mappings\": {\n    \"properties\": {\n      \"productId\":   { \"type\": \"keyword\" },\n      \"title\":       { \"type\": \"text\", \"analyzer\": \"product_index\", \"search_analyzer\": \"product_search\",\n                       \"fields\": { \"keyword\": { \"type\": \"keyword\", \"ignore_above\": 256 },\n                                   \"ac\": { \"type\": \"text\", \"analyzer\": \"autocomplete_index\", \"search_analyzer\": \"standard\" } } },\n      \"description\": { \"type\": \"text\", \"analyzer\": \"product_index\", \"search_analyzer\": \"product_search\" },\n      \"brand\":       { \"type\": \"keyword\" },\n      \"categoryPath\":{ \"type\": \"keyword\" },\n      \"attributes\":  { \"type\": \"flattened\" },\n      \"price\":       { \"type\": \"scaled_float\", \"scaling_factor\": 100 },\n      \"rating\":      { \"type\": \"half_float\" },\n      \"ratingCount\": { \"type\": \"integer\" },\n      \"inStock\":     { \"type\": \"boolean\" },\n      \"sellerId\":    { \"type\": \"keyword\" },\n      \"popularityScore\": { \"type\": \"float\" },\n      \"createdAt\":   { \"type\": \"date\" },\n      \"updatedAt\":   { \"type\": \"date\" },\n      \"version\":     { \"type\": \"long\" }\n    }\n  }\n}\n```\n\n**Code Explanation -- settings:**\n\n- `\"number_of_shards\": 6` -- Part 1 ka math: 50M docs x ~2 KB = ~100 GB raw -> ES index ~1.3x = **~130 GB primary data**. Target 25-40 GB per shard -> `130 / 6 = ~22 GB per shard`. **Ye number index banne ke baad badla nahi ja sakta** -- shard count change = poora reindex. Isliye Part 1 mein itna time isi par diya tha.\n  - **Zyada shards (jaise 60) kyun bura?** Har shard ek poora Lucene index hai: apni memory, apne file handles, apne merge threads. Aur query time par **har shard ko wait karna padta hai** -- 60 shards = 60 chances ki koi ek GC pause mein ho. Chhote shards = zyada overhead, kam fayda.\n  - **Kam shards (jaise 2) kyun bura?** 65 GB per shard -- recovery slow, rebalancing slow, aur parallelism kam (ek query sirf 2 cores use karegi).\n- `\"number_of_replicas\": 1` -- har primary shard ki ek copy. Do fayde: (1) **availability** -- node mare to replica promote ho jaata hai, (2) **read throughput** -- search queries replicas par bhi ja sakti hain, yani read capacity 2x. Total 12 shards, ~260 GB cluster data.\n- `\"refresh_interval\": \"1s\"` -- **neeche detail mein.**\n\n**Code Explanation -- analysis filters:**\n\n- `en_stop` -- English stop words (`the`, `a`, `of`, `for`, `with`...) hata deta hai. Kyun? Ye words har document mein hote hain, yani inka IDF ~0 hai -- matching mein koi information nahi dete, bas index bada karte hain aur query slow karte hain.\n  - **Sawdhaani:** e-commerce mein stop words kabhi-kabhi matter karte hain -- \"The North Face\" brand hai, \"IT\" ek category ho sakti hai. Production mein aksar custom stop list use hoti hai, `_english_` nahi.\n- `en_stemmer` -- `\"cases\"` -> `\"case\"`, `\"running\"` -> `\"run\"`. Yani plural/tense ke alag-alag roop ek hi **normalized key** ban jaate hain. Requirement #1 (`mobiles` ~ `mobile`) yahi filter solve karta hai.\n- `syn_graph` (`synonym_graph`) -- `mobile` = `smartphone` = `cell phone`. **`synonym_graph` `synonym` se behtar kyun hai?** Multi-word synonyms (`\"cell phone\"` = 2 tokens) ko purana `synonym` filter theek se handle nahi karta -- token positions gadbad ho jaati hain aur phrase queries tootti hain. `synonym_graph` ek proper token graph banata hai.\n- `edge_ngram` (`min_gram: 2, max_gram: 20`) -- `\"iphone\"` ko `[\"ip\", \"iph\", \"ipho\", \"iphon\", \"iphone\"]` mein todta hai. **Sirf shuru se** (edge), beech se nahi.\n  - `min_gram: 2` kyun, 1 nahi? 1-char gram (`\"i\"`) poore catalog ke lakhon products se match karega -- useless aur mehenga. User 2 characters to type karega hi.\n  - `max_gram: 20` -- 20 se lambe prefix par koi autocomplete nahi karta.\n\n**Code Explanation -- analyzers:**\n\n- `product_index` = `standard tokenizer -> lowercase -> en_stop -> en_stemmer`. Ye **index time** par chalta hai.\n- `product_search` = `standard tokenizer -> lowercase -> syn_graph -> en_stop -> en_stemmer`. Ye **search time** par chalta hai. **Farak sirf ek hai: `syn_graph`.** Kyun -- neeche poora section hai.\n- `autocomplete_index` = `standard -> lowercase -> edge_ngram`. Sirf `title.ac` sub-field par.\n\n---\n\n#### `text` vs `keyword` -- sabse zaroori distinction\n\nYe ES ka **pehla** concept hai aur 80% bugs yahin se aate hain.\n\n| | `text` | `keyword` |\n|---|---|---|\n| Analyze hota hai? | **Haan** -- tokenize, lowercase, stem | **Nahi** -- poori string ek single term |\n| `\"Apple iPhone 15\"` index mein kaise? | `[appl, iphon, 15]` | `[\"Apple iPhone 15\"]` (bilkul waisa) |\n| Kis liye | **Full-text search** (\"iphone\" se match) | **Exact match, filter, facet, sort** |\n| Doc values (default) | **Nahi** | **Haan** |\n| Aggregation kar sakte ho? | Nahi (fielddata chahiye -- heap killer) | **Haan** |\n| Sort kar sakte ho? | Nahi | **Haan** |\n\n**Practical example:**\n\n```\nbrand = \"Apple\"  as keyword  ->  term query { \"brand\": \"Apple\" }  matches   [OK]\nbrand = \"Apple\"  as text     ->  term query { \"brand\": \"Apple\" }  NO MATCH  [X]\n                                 (kyunki index mein \"appl\" pada hai, \"Apple\" nahi)\n```\n\nYe **sabse common ES bug** hai: developer `brand` ko `text` rakh deta hai, `term` filter lagata hai, aur zero results aate hain. Phir `match` use karta hai -- ab `\"Apple Store\"` bhi match karne lagta hai, jo facet ke liye galat hai.\n\n**Rule:**\n- Jo cheez **user padhta aur search karta hai** (title, description) -> `text`\n- Jo cheez **filter, facet, sort, ya exact match** hai (brand, category, sellerId, productId) -> `keyword`\n\n#### `title` ke teen roop kyun hain?\n\n```json\n\"title\": { \"type\": \"text\", \"analyzer\": \"product_index\", \"search_analyzer\": \"product_search\",\n           \"fields\": { \"keyword\": { \"type\": \"keyword\", \"ignore_above\": 256 },\n                       \"ac\":      { \"type\": \"text\", \"analyzer\": \"autocomplete_index\",\n                                    \"search_analyzer\": \"standard\" } } }\n```\n\nEk hi source value (`\"Apple iPhone 15 Cases\"`) **teen alag tareeke se** index hoti hai. ES mein isko **multi-fields** kehte hain.\n\n| Field | Type | Andar kya jaata hai | Kis liye use hota hai |\n|---|---|---|---|\n| `title` | `text` (product_index) | `[appl, iphon, 15, case]` | Main full-text search -- `multi_match` mein `title^3` |\n| `title.keyword` | `keyword` | `\"Apple iPhone 15 Cases\"` | Exact match, sort by title A-Z, \"same title wale duplicate products\" wali aggregation |\n| `title.ac` | `text` (autocomplete_index) | `[ap, app, appl, apple, ip, iph, ipho, iphon, iphone, 15, ca, cas, case, cases]` | Autocomplete prefix matching |\n\n**Faayda:** ek hi `title` bhejte ho indexing ke waqt, ES teen index bana leta hai. Alag fields banane ki zarurat nahi (`title_search`, `title_exact`, `title_autocomplete`) -- document chhota rehta hai aur code saaf.\n\n**Cost:** disk. `title.ac` sabse mehenga hai kyunki har word ke saare prefixes store hote hain -- ek 5-word title se ~30-40 terms bante hain. Isiliye `suggestions_v2` ek **alag chhota index** hai aur `title.ac` main index mein sirf backup/hybrid use ke liye hai.\n\n`ignore_above: 256` -- agar title 256 characters se lambi ho to `title.keyword` mein **store hi mat karo** (index nahi hogi, sirf skip). Kyun? `keyword` field mein bahut lambi string ka koi matlab nahi (exact match kaun karega?) aur Lucene ka term length limit ~32 KB hai -- uske paar document indexing **fail** ho jaati hai. `ignore_above` ek safety valve hai: document index ho jaayega, bas us ek sub-field mein value nahi hogi.\n\n`\"search_analyzer\": \"standard\"` on `title.ac` -- **ye bahut important hai.** Index time par `\"iphone\"` -> saare prefixes. Search time par user ne `\"iph\"` type kiya. Agar search par bhi `edge_ngram` lagta, to `\"iph\"` -> `[\"ip\", \"iph\"]` ban jaata aur `\"ip\"` bhi match karta -- yani \"ipad\" bhi aa jaata. **Search side par sirf lowercase karna hai, tod-na nahi.** Rule: **edge n-gram sirf index time par, kabhi search time par nahi.**\n\n#### `analyzer` vs `search_analyzer` -- synonyms search time par kyun?\n\n```json\n\"title\": { \"analyzer\": \"product_index\", \"search_analyzer\": \"product_search\" }\n```\n\n- `analyzer` = **index time** par document ke saath kya hota hai (permanent -- ye tokens disk par likh diye jaate hain).\n- `search_analyzer` = **query time** par user ki query ke saath kya hota hai (har request par fresh).\n\nDono mein farak sirf `syn_graph` ka hai. Ab do options compare karo:\n\n**Option A -- synonyms index time par:**\n\n```\nIndex:  \"Apple mobile cover\"  -> [appl, mobil, smartphon, cell, phone, cover]\n                                  (synonyms disk par expand ho ke likh diye)\nQuery:  \"smartphone cover\"    -> [smartphon, cover]   -> match [OK]\n```\n\n- **Faayda:** query time par kaam kam, search thodi tez.\n- **Nuksaan:** ops team ne aaj naya synonym add kiya (`\"tws\" = \"wireless earbuds\"`)? Purane 50M documents mein wo synonym **hai hi nahi** -- wo tokens disk par likhe ja chuke hain. **Poora reindex karna padega. 50M documents. Ghanton ka kaam. Har synonym change par.**\n\n**Option B -- synonyms search time par (hamari choice):**\n\n```\nIndex:  \"Apple mobile cover\"  -> [appl, mobil, cover]        (saaf, chhota)\nQuery:  \"smartphone cover\"    -> [smartphon | mobil | cell phone, cover]  -> \"mobil\" match [OK]\n```\n\n- **Faayda:** synonym list badli? Bas `synonyms.txt` update karo aur `POST /products/_reload_search_analyzers` maaro. **Reindex zero.** Effect turant.\n- **Nuksaan:** har query par expansion hoti hai (thoda slow), aur IDF scores thode off ho sakte hain (synonym term ka document frequency alag hota hai).\n\nHamare liye Option B clearly jeetta hai, kyunki **synonyms roz badalte hain**. Zero-result report dekh ke ops team har hafte 20-50 naye synonyms add karti hai. Har baar 50M docs reindex karna possible hi nahi.\n\n> **Yaad rakhne wali line:** \"Jo cheez **roz badalti hai**, use search time par rakho. Jo cheez **stable hai**, use index time par rakho -- kyunki index time ka kaam sirf reindex se badalta hai.\"\n\n#### Worked `_analyze` example -- tokens asli mein kya bante hain\n\nChalo ES se poochte hain ki `\"Apple iPhone 15 Cases\"` ka kya hota hai.\n\n**Index analyzer:**\n\n```json\nPOST /products/_analyze\n{ \"analyzer\": \"product_index\", \"text\": \"Apple iPhone 15 Cases\" }\n```\n\n**Step by step andar kya hota hai:**\n\n```\ninput:               \"Apple iPhone 15 Cases\"\n                             |\nstandard tokenizer:  [\"Apple\", \"iPhone\", \"15\", \"Cases\"]\n                             |           (whitespace + punctuation par toda)\nlowercase:           [\"apple\", \"iphone\", \"15\", \"cases\"]\n                             |\nen_stop:             [\"apple\", \"iphone\", \"15\", \"cases\"]\n                             |           (koi English stop word nahi tha)\nen_stemmer:          [\"appl\",  \"iphon\",  \"15\", \"case\"]\n                             |           (\"cases\" -> \"case\": plural hata)\nFINAL (disk par):    appl | iphon | 15 | case\n```\n\n> **Dhyaan do:** `\"appl\"` aur `\"iphon\"` asli English words nahi hain. Stemmer ka kaam dictionary banana nahi hai -- uska kaam ek **normalized key** banana hai. Jab tak index aur search **dono side** same stemmer chalta hai, `\"cases\"` aur `\"case\"` dono `\"case\"` par milte hain aur match ho jaata hai. Exact stem string implementation par depend karti hai; important baat consistency hai.\n\n**Search analyzer (same input):**\n\n```json\nPOST /products/_analyze\n{ \"analyzer\": \"product_search\", \"text\": \"Apple iPhone 15 Cases\" }\n```\n\nMaano `synonyms.txt` mein ye lines hain:\n\n```\niphone, apple phone\ncase, cover, pouch\nmobile, smartphone, cell phone\n```\n\n```\ninput:               \"Apple iPhone 15 Cases\"\n                             |\nstandard tokenizer:  [\"Apple\", \"iPhone\", \"15\", \"Cases\"]\n                             |\nlowercase:           [\"apple\", \"iphone\", \"15\", \"cases\"]\n                             |\nsyn_graph:           [\"apple\", (\"iphone\" | \"apple phone\"), \"15\", \"cases\"]\n                             |    ^^^^ \"iphone\" matched -> graph branch bana\n                             |    \"cases\" NAHI matched (rule \"case\" par hai, \"cases\" par nahi)\nen_stop:             (no change)\n                             |\nen_stemmer:          [\"appl\", (\"iphon\" | \"appl phone\"), \"15\", \"case\"]\nFINAL (query terms): appl | iphon OR (appl + phone) | 15 | case\n```\n\n**Yahan ek asli production gotcha chhupa hai:** `syn_graph` **`en_stemmer` se pehle** chalta hai. Yani synonym matching **un-stemmed, lowercased** token par hoti hai. Rule `case, cover, pouch` likha hai, lekin token us waqt `\"cases\"` hai -- **match nahi hua.** User ne `\"cases\"` likha to `\"cover\"` wala product nahi milega, lekin `\"case\"` likha to milega.\n\nDo fix hain:\n\n1. **`synonyms.txt` mein saare surface forms likho:** `case, cases, cover, covers, pouch, pouches`. Simple, explicit, debug karne mein aasan. Zyadatar teams yahi karti hain.\n2. **`syn_graph` ko stemmer ke *baad* rakho:** `[\"lowercase\", \"en_stop\", \"en_stemmer\", \"syn_graph\"]` -- phir synonyms stemmed form mein likhni padengi (`case, cover, pouch` -- jo already stems hain). Cleaner lagta hai, par `synonyms.txt` padhne mein confusing ho jaati hai aur multi-word synonyms mein aur uljhan hoti hai.\n\n> **Interview mein bolne wali line:** \"Analyzer ek **pipeline** hai, aur har filter apne **se pehle wale filter ka output** dekhta hai. Isliye synonym filter aur stemmer ka order maayne rakhta hai -- main `_analyze` API se hamesha verify karta hoon ki index side aur search side ke tokens actually milte hain. Zero-result bugs 90% baar yahin se aate hain.\"\n\n**Autocomplete analyzer:**\n\n```json\nPOST /products/_analyze\n{ \"analyzer\": \"autocomplete_index\", \"text\": \"Apple iPhone 15 Cases\" }\n```\n\n```\nlowercase:   [\"apple\", \"iphone\", \"15\", \"cases\"]\nedge_ngram (min 2, max 20) -- har token ke prefixes:\n  apple  -> ap, app, appl, apple\n  iphone -> ip, iph, ipho, iphon, iphone\n  15     -> 15\n  cases  -> ca, cas, case, cases\nFINAL: ap app appl apple ip iph ipho iphon iphone 15 ca cas case cases   (14 terms)\n```\n\n**Dekha kitna index bloat hota hai?** 4 tokens se 14 terms. Ek 10-word product title se ~70-90 terms. Isiliye `suggestions_v2` ek chhota, alag index hai -- usme sirf popular queries aur product titles hain, saara catalog nahi.\n\n#### `scaled_float` money ke liye\n\n```json\n\"price\": { \"type\": \"scaled_float\", \"scaling_factor\": 100 }\n```\n\n- Tum ES ko `1999.99` bhejte ho. ES internally `1999.99 * 100 = 199999` ek **`long`** ki tarah store karta hai.\n- Read karte waqt `199999 / 100 = 1999.99` wapas milta hai.\n- **Yani storage integer hai, API decimal.** `float`/`double` ke rounding errors nahi -- `range` filter `{ \"gte\": 500, \"lte\": 2000 }` exact kaam karta hai aur price sorting mein koi surprise nahi.\n- `scaling_factor: 100` = 2 decimal places (paise). Postgres ke `price_paise BIGINT` ke saath perfectly consistent.\n- **`double` kyun nahi?** Wahi float problem: `price \u003c= 2000` filter kabhi-kabhi `1999.9999999` ko chhod sakta hai. Aur `long` ke comparison `double` se tez hote hain.\n\n#### `half_float` rating ke liye\n\n```json\n\"rating\": { \"type\": \"half_float\" }\n```\n\nRating `0.0` se `5.0` tak hai, ek decimal place. `half_float` 16-bit hai (`float` 32-bit, `double` 64-bit). Precision `4.3` ke liye kaafi se zyada hai, aur memory **aadhi** lagti hai. 50M documents x doc values mein ye seedha RAM bachata hai.\n\n> **Yeh chhoti optimization kyun matter karti hai?** ES mein doc values page cache mein rehti hain. Jitni chhoti, utna zyada data RAM mein fit -- utne kam disk reads -- utni kam latency. 50M docs par 2 bytes vs 4 bytes = 100 MB ka farak, sirf ek field par.\n\n#### `flattened` attributes ke liye\n\n```json\n\"attributes\": { \"type\": \"flattened\" }\n```\n\n**Problem:** `attributes` har category mein alag hai. Mobile mein `{ ram, storage, color }`, shirt mein `{ size, fabric, fit }`, book mein `{ author, pages, language }`. Poore catalog mein **hazaaron** alag keys.\n\n**Agar normal `object` type use karein:** ES har naye key ke liye mapping mein ek naya field add karta hai (dynamic mapping). 5,000 alag attribute keys = **mapping explosion**. Cluster state (jo har node par replicate hoti hai aur master node manage karta hai) bahut badi ho jaati hai -> master node slow -> cluster unstable. Ye ek asli production outage ka reason hai, theory nahi.\n\n**`flattened` kya karta hai:** poore object ko **ek hi field** ki tarah treat karta hai. Saari nested keys aur values ek single `keyword` list bann jaati hain. Mapping mein sirf **ek** entry (`attributes`), chahe 10,000 alag keys ho.\n\n```\nDocument:  \"attributes\": { \"color\": \"blue\", \"storage\": \"128GB\" }\nQuery:     { \"term\": { \"attributes.color\": \"blue\" } }        -- kaam karta hai [OK]\nQuery:     { \"term\": { \"attributes\": \"blue\" } }              -- bhi kaam karta hai (koi bhi key)\n```\n\n**Trade-off:** `flattened` ke andar sab kuch `keyword` hai. Yani:\n- Full-text search nahi (`attributes.description` mein \"comfortable cotton\" search nahi kar sakte)\n- Numeric range nahi (`attributes.weight > 500` nahi chalega -- sab string hai)\n- Analyzer nahi lagta\n\n**Kab `flattened` chhod dein?** Jab koi attribute itna important ho jaaye ki uspar range/sort/facet chahiye -- tab use **top-level field bana do** (jaise humne `price`, `rating` ko banaya). `flattened` un baaki hazaaron attributes ke liye hai jo sirf \"dikhane\" aur occasional exact filter ke liye hain.\n\n#### Doc values -- sorting aur aggregation isi par chalte hain\n\nAb tak humne **inverted index** ki baat ki: `term -> [docIds]`. Ye \"kaunse documents is term ko rakhte hain\" ke liye perfect hai.\n\nLekin sorting aur aggregation ko **ulta** chahiye: \"**is document ka** brand kya hai?\" Inverted index se ye nikalne ke liye poora index scan karna padega -- impossible.\n\nIsliye Lucene **doc values** bhi likhta hai -- ek **column-oriented** structure:\n\n```\nINVERTED INDEX (search ke liye):\n   \"apple\"  -> [1, 5, 9, 12, ...]\n   \"spigen\" -> [2, 3, 7, ...]\n\nDOC VALUES (sort/aggregate ke liye):\n   doc 1 -> brand: \"Apple\"\n   doc 2 -> brand: \"Spigen\"\n   doc 3 -> brand: \"Spigen\"\n   doc 5 -> brand: \"Apple\"\n   ...\n```\n\n| Kaam | Kaunsa structure |\n|---|---|\n| `\"iphone case\"` search karo | Inverted index |\n| Brand ke hisaab se count karo (facets) | **Doc values** |\n| Price par sort karo | **Doc values** |\n| `range` filter price par | Inverted index (BKD tree) + doc values |\n| `_score` par sort | Kuch nahi -- score query ke time calculate hota hai |\n\n**Key baatein:**\n\n- `keyword`, numeric, `date`, `boolean` fields par doc values **by default ON** hain.\n- `text` fields par doc values **OFF** hain (analyzed tokens par sort/aggregate ka koi matlab nahi hota).\n- Isiliye `text` field par aggregation karne par ES `fielddata` maangta hai -- wo **heap mein** on-the-fly banta hai aur bade field par node ko OOM kar deta hai. **Kabhi mat karo.** Iske bajaye `title.keyword` sub-field use karo.\n- Doc values **disk par** hoti hain (heap mein nahi) aur OS page cache se padhi jaati hain -- isliye RAM ki zarurat hoti hai par heap nahi bharta.\n- Jis field par kabhi sort/aggregate/script nahi karna, uspar `\"doc_values\": false` set karke disk bacha sakte ho (jaise `description` ke liye -- wo waise bhi `text` hai).\n\n**Hamari mapping mein doc values kahan chahiye:**\n\n| Field | Doc values chahiye? | Kyun |\n|---|---|---|\n| `brand` | **Haan** | `brands` facet aggregation |\n| `categoryPath` | **Haan** | `categories` facet |\n| `price` | **Haan** | `price_ranges` facet + `price_asc`/`price_desc` sort |\n| `rating` | **Haan** | `rating` sort |\n| `createdAt` | **Haan** | `newest` sort |\n| `popularityScore` | **Haan** | `function_score` ka `field_value_factor` isse padhta hai |\n| `productId` | **Haan** | `search_after` ka tie-breaker sort |\n| `title`, `description` | Nahi (`text`) | Inpar sort/aggregate karte hi nahi |\n\n#### `refresh_interval: 1s` -- \"near real-time\" ka asli matlab\n\nES mein document index karne ke baad wo **turant searchable nahi hota.** Kyun? Kyunki Lucene segments **immutable** hain -- ek baar likhe gaye to badle nahi ja sakte.\n\n```\nbulk index request\n      |\n      v\n  in-memory buffer          \u003c-- document yahan hai, search ko NAHI dikhta\n      |\n      |  refresh (har 1 second)\n      v\n  naya segment (searchable) \u003c-- AB dikhta hai\n      |\n      |  background merge (chhote segments -> bade)\n      v\n  bade segments\n```\n\n- **`1s` kyun?** Requirement: seller update \u003c= 30 s mein dikhe. 1 second us se bahut behtar hai aur ES ka default bhi yahi hai.\n- **Refresh mehenga kyun hai?** Har refresh ek naya segment file banata hai. Zyada segments = har query ko zyada segments search karne padte hain = slow. Aur merge ka load badhta hai.\n- **`refresh_interval: -1` kab?** **Initial bulk reindex** ke dauran. Tab koi search nahi chal rahi us index par, to har second segment banane ka koi fayda nahi -- bas overhead hai. Reindex 2-3x tez ho jaata hai. Reindex khatam hone par **wapas `1s` set karna mat bhoolna** (`PUT /products_v4/_settings`).\n  - **Risk:** agar set karna bhool gaye to naya index live ho jaayega aur documents kabhi searchable nahi honge (jab tak koi manual `_refresh` na kare). Isliye reindex script mein ye step **automated** hona chahiye, manual checklist mein nahi.\n- **Same logic `number_of_replicas: 0` par:** initial reindex ke dauran replicas off karo (har document do jagah likhne ka kaam aadha), phir wapas 1. **Risk:** us window mein koi node mara to shard gaya aur reindex dobara. Isliye ye sirf **naye, abhi-live-nahi** index par karo -- live index par kabhi nahi.\n\n#### \"Analyzer change = reindex\" -- ye rule kyun absolute hai\n\n```\nAaj:      analyzer mein stemmer hai.  \"Cases\" -> disk par \"case\" likha gaya.\nKal:      tumne stemmer hata diya (mapping update).\nAb:       naye documents  -> \"cases\" disk par jaayega\n          purane documents -> \"case\" abhi bhi disk par pada hai\n\nQuery \"cases\" -> search analyzer \"cases\" banata hai\n   -> naye documents match [OK]\n   -> purane documents match NAHI [X]\n\nNateeja: aadha catalog search se gayab. Aur koi error nahi aayega -- bas results kam aayenge.\n```\n\n**Analyzer index time par tokens ko disk par likh deta hai.** Wo tokens purane analyzer ke hisaab se likhe gaye hain. Mapping badalne se purane tokens **apne aap nahi badalte.**\n\nIsiliye:\n\n- `analyzer` change -> **reindex zaroori** (alias swap wala pattern)\n- `search_analyzer` change -> **reindex nahi** (query time par lagta hai)\n- `synonyms.txt` change -> **reindex nahi** (kyunki hamare synonyms search-time hain) -- bas `POST /products/_reload_search_analyzers`\n- Naya field add karna -> reindex nahi (purane docs mein wo field `null` rahega)\n- Field ka type change (`text` -> `keyword`) -> **reindex zaroori**\n- `number_of_shards` change -> **reindex zaroori**\n\n**Zero-downtime reindex ka shape (poora Part 4 mein):**\n\n```\n1. products_v4 banao (nayi mapping ke saath, refresh_interval: -1, replicas: 0)\n2. _reindex from products_v3 -> products_v4   (ghante lag sakte hain)\n3. Kafka se live changes bhi products_v4 par apply karte raho (dual indexing window)\n4. refresh_interval: 1s, replicas: 1 wapas karo\n5. Verify: doc count match, 20 sample queries ke results compare karo\n6. POST /_aliases { remove: products_v3 from \"products\", add: products_v4 to \"products\" }\n      \u003c-- ye ATOMIC hai. Ek instant mein saara traffic switch.\n7. products_v3 ko 24 ghante rakho (rollback ke liye), phir delete\n```\n\n**Alias (`products`) hi wajah hai ki ye possible hai.** Application code kabhi `products_v3` nahi bolta -- hamesha `products` alias bolta hai. Isliye swap ke liye koi deploy, koi config change, koi restart nahi chahiye.\n\n---\n\n## PART 10 -- LLD: Node.js project structure\n\nSpec ka tree (verbatim):\n\n```\nsrc/\n  routes/          search.routes.ts, suggest.routes.ts, admin.routes.ts\n  controllers/     search.controller.ts, suggest.controller.ts\n  services/        search.service.ts, suggest.service.ts, indexer.service.ts, reindex.service.ts\n  search/          query-builder.ts, response-mapper.ts, facets.ts, analyzer-config.ts\n  repositories/    product.repository.ts (Postgres), es.repository.ts (ES client wrapper)\n  workers/         product-indexer.worker.ts (Kafka -> bulk), outbox-poller.ts, popularity-job.ts\n  middleware/      rate-limit.ts, validate.ts, cache.ts\n  infra/           elasticsearch.ts, kafka.ts, redis.ts, postgres.ts, logger.ts, metrics.ts\n  app.ts  server.ts\n```\n\n**Har folder ka kaam (Hinglish mein):**\n\n| Folder | Kaam | Yahan kya **NAHI** hona chahiye |\n|---|---|---|\n| `routes/` | URL se controller tak ka mapping. `router.get('/search', searchController.search)` -- bas. | Business logic, validation ki details |\n| `controllers/` | **HTTP ki duniya**: query params padho, zod se validate karo, service call karo, status code + JSON bhejo | ES DSL, SQL, Redis commands |\n| `services/` | **Orchestration + policy**: cache dekho, query builder call karo, ES call karo, fallback decide karo, metrics badhao | Express ka `req`/`res`, raw ES client calls |\n| `search/` | **Pure search logic**: DSL banana, ES response ko map karna, facet definitions, analyzer config | Network I/O, database, Redis |\n| `repositories/` | **Data access**: Postgres SQL aur ES client ke wrappers. Ye layer \"kaise laayein\" jaanti hai | \"Kab laayein\" ka decision, HTTP |\n| `workers/` | Background processes: Kafka consumer, outbox poller, nightly popularity job. Alag process mein chalte hain | HTTP handlers |\n| `middleware/` | Cross-cutting: rate limit, validation helpers, cache middleware | Domain logic |\n| `infra/` | Connection objects banana: ES client, Kafka client, Redis, pg Pool, logger, metrics registry | Search logic, SQL queries |\n| `app.ts` | **Composition root** -- saare objects yahan jodte hain aur Express app banta hai | Koi business logic |\n| `server.ts` | `listen()` + graceful shutdown | Kuch aur nahi |\n\n**Layering rule (ek line):**\n\n```\nroutes -> controllers -> services -> (search/ pure logic  +  repositories -> infra)\n```\n\n**Har arrow ek hi direction mein jaata hai. Peeche kabhi nahi.**\n\n- Controller service ko call karta hai. **Service kabhi controller ko nahi.**\n- Service repository ko call karta hai. **Repository kabhi service ko nahi.**\n- `search/` kisi ko call nahi karta -- wo **pure functions** ka folder hai.\n- `infra/` kisi business code ko import nahi karta.\n\n**Ye rule todne par kya hota hai?** Ek chhoti misaal: agar `query-builder.ts` ne `es.repository.ts` ko import kar liya (kyunki \"ek chhoti si field list ES se laani thi\"), to ab query builder test karne ke liye ES chahiye. Ek pure function ka unit test 2 ms ka tha, ab 2 second ka integration test ban gaya. Ye dheere-dheere poora test suite slow kar deta hai aur log tests likhna band kar dete hain.\n\n---\n\n### `query-builder.ts` ko **pure function** kyun hona chahiye\n\nYe is poore LLD ka **sabse important design decision** hai. Interview mein isko explicitly bolo.\n\n```ts\n// Signature -- bas itna\nexport function buildSearchQuery(req: SearchRequest): Record\u003cstring, unknown>\n```\n\n**Code Explanation:** ek argument, ek return value, aur return type `Promise` **nahi** hai -- yani function ke andar koi `await` ho hi nahi sakta. Signature khud hi guarantee de raha hai ki ye I/O-free hai.\n\n**Input:** ek validated `SearchRequest` object.\n**Output:** ek plain JavaScript object (ES query DSL).\n**Beech mein:** koi network call nahi, koi `await` nahi, koi `Date.now()`, koi `Math.random()`, koi global state. **Same input = hamesha same output.**\n\n**Teen wajah:**\n\n**1. Ye woh piece hai jise tum actually unit-test karte ho.**\n\nSearch system mein \"bug\" ka matlab aksar \"galat DSL bana\" hota hai -- filter query context mein chala gaya, boost galat lag gaya, tie-breaker chhoot gaya. Ye saare bugs **silent** hote hain: koi exception nahi, bas galat results. Pure function hone se test aise dikhta hai:\n\n```ts\nit('brand filter ko filter context mein daalta hai, must mein nahi', () => {\n  const dsl = buildSearchQuery({ q: 'iphone', filters: { brand: ['Apple'] }, ... });\n  const bool = (dsl as any).query.function_score.query.bool;\n  expect(bool.filter).toContainEqual({ terms: { brand: ['Apple'] } });\n  expect(JSON.stringify(bool.must)).not.toContain('Apple');\n});\n```\n\n**Code Explanation:**\n\n- `buildSearchQuery({...})` -- seedha function call, koi setup nahi, koi `beforeAll` mein container start nahi.\n- `dsl.query.function_score.query.bool` -- generated DSL ke andar jhaank rahe hain. Ye tabhi possible hai jab function ek **plain object** return kare.\n- `expect(bool.filter).toContainEqual({ terms: { brand: ['Apple'] } })` -- positive assertion: filter sahi jagah pahuncha.\n- `expect(...bool.must).not.toContain('Apple')` -- **negative assertion, aur yahi asli test hai**: brand galti se query context mein to nahi cha
