## PART 10 -- LLD: Node.js project structure

Spec ka tree (verbatim):

```
src/
  routes/          search.routes.ts, suggest.routes.ts, admin.routes.ts
  controllers/     search.controller.ts, suggest.controller.ts
  services/        search.service.ts, suggest.service.ts, indexer.service.ts, reindex.service.ts
  search/          query-builder.ts, response-mapper.ts, facets.ts, analyzer-config.ts
  repositories/    product.repository.ts (Postgres), es.repository.ts (ES client wrapper)
  workers/         product-indexer.worker.ts (Kafka -> bulk), outbox-poller.ts, popularity-job.ts
  middleware/      rate-limit.ts, validate.ts, cache.ts
  infra/           elasticsearch.ts, kafka.ts, redis.ts, postgres.ts, logger.ts, metrics.ts
  app.ts  server.ts
```

**Har folder ka kaam (Hinglish mein):**

| Folder | Kaam | Yahan kya **NAHI** hona chahiye |
|---|---|---|
| `routes/` | URL se controller tak ka mapping. `router.get('/search', searchController.search)` -- bas. | Business logic, validation ki details |
| `controllers/` | **HTTP ki duniya**: query params padho, zod se validate karo, service call karo, status code + JSON bhejo | ES DSL, SQL, Redis commands |
| `services/` | **Orchestration + policy**: cache dekho, query builder call karo, ES call karo, fallback decide karo, metrics badhao | Express ka `req`/`res`, raw ES client calls |
| `search/` | **Pure search logic**: DSL banana, ES response ko map karna, facet definitions, analyzer config | Network I/O, database, Redis |
| `repositories/` | **Data access**: Postgres SQL aur ES client ke wrappers. Ye layer "kaise laayein" jaanti hai | "Kab laayein" ka decision, HTTP |
| `workers/` | Background processes: Kafka consumer, outbox poller, nightly popularity job. Alag process mein chalte hain | HTTP handlers |
| `middleware/` | Cross-cutting: rate limit, validation helpers, cache middleware | Domain logic |
| `infra/` | Connection objects banana: ES client, Kafka client, Redis, pg Pool, logger, metrics registry | Search logic, SQL queries |
| `app.ts` | **Composition root** -- saare objects yahan jodte hain aur Express app banta hai | Koi business logic |
| `server.ts` | `listen()` + graceful shutdown | Kuch aur nahi |

**Layering rule (ek line):**

```
routes -> controllers -> services -> (search/ pure logic  +  repositories -> infra)
```

**Har arrow ek hi direction mein jaata hai. Peeche kabhi nahi.**

- Controller service ko call karta hai. **Service kabhi controller ko nahi.**
- Service repository ko call karta hai. **Repository kabhi service ko nahi.**
- `search/` kisi ko call nahi karta -- wo **pure functions** ka folder hai.
- `infra/` kisi business code ko import nahi karta.

**Ye rule todne par kya hota hai?** Ek chhoti misaal: agar `query-builder.ts` ne `es.repository.ts` ko import kar liya (kyunki "ek chhoti si field list ES se laani thi"), to ab query builder test karne ke liye ES chahiye. Ek pure function ka unit test 2 ms ka tha, ab 2 second ka integration test ban gaya. Ye dheere-dheere poora test suite slow kar deta hai aur log tests likhna band kar dete hain.

---

### `query-builder.ts` ko **pure function** kyun hona chahiye

Ye is poore LLD ka **sabse important design decision** hai. Interview mein isko explicitly bolo.

```ts
// Signature -- bas itna
export function buildSearchQuery(req: SearchRequest): Record<string, unknown>
```

**Code Explanation:** ek argument, ek return value, aur return type `Promise` **nahi** hai -- yani function ke andar koi `await` ho hi nahi sakta. Signature khud hi guarantee de raha hai ki ye I/O-free hai.

**Input:** ek validated `SearchRequest` object.
**Output:** ek plain JavaScript object (ES query DSL).
**Beech mein:** koi network call nahi, koi `await` nahi, koi `Date.now()`, koi `Math.random()`, koi global state. **Same input = hamesha same output.**

**Teen wajah:**

**1. Ye woh piece hai jise tum actually unit-test karte ho.**

Search system mein "bug" ka matlab aksar "galat DSL bana" hota hai -- filter query context mein chala gaya, boost galat lag gaya, tie-breaker chhoot gaya. Ye saare bugs **silent** hote hain: koi exception nahi, bas galat results. Pure function hone se test aise dikhta hai:

```ts
it('brand filter ko filter context mein daalta hai, must mein nahi', () => {
  const dsl = buildSearchQuery({ q: 'iphone', filters: { brand: ['Apple'] }, ... });
  const bool = (dsl as any).query.function_score.query.bool;
  expect(bool.filter).toContainEqual({ terms: { brand: ['Apple'] } });
  expect(JSON.stringify(bool.must)).not.toContain('Apple');
});
```

**Code Explanation:**

- `buildSearchQuery({...})` -- seedha function call, koi setup nahi, koi `beforeAll` mein container start nahi.
- `dsl.query.function_score.query.bool` -- generated DSL ke andar jhaank rahe hain. Ye tabhi possible hai jab function ek **plain object** return kare.
- `expect(bool.filter).toContainEqual({ terms: { brand: ['Apple'] } })` -- positive assertion: filter sahi jagah pahuncha.
- `expect(...bool.must).not.toContain('Apple')` -- **negative assertion, aur yahi asli test hai**: brand galti se query context mein to nahi chala gaya. Ye wo bug hai jo kabhi exception nahi deta, sirf ranking chup-chaap kharab karta hai.

Koi ES nahi, koi Docker nahi, koi mock nahi. 2 millisecond mein chalta hai. Tum 50 aise tests likh sakte ho -- har sort option, har filter combination, har edge case (khaali `q`, `searchAfter` ke saath `page`, `size` boundary). **Jo cheez test karna aasan hai, wo actually test hoti hai.**

**2. Ye ES ki details ko controllers se bahar rakhta hai.**

Agar DSL banane ka code controller mein hota, to controller ko `multi_match`, `function_score`, `field_value_factor` -- sab pata hona chahiye. Phir:

- Har naye endpoint mein wahi DSL code copy-paste hota.
- ES 9 mein koi syntax badla? 12 jagah badalna padega.
- Kal ES ki jagah OpenSearch ya kuch aur laaye? Poora controller layer rewrite.

Pure function hone se ES ka poora "knowledge" **ek file mein** band hai. Controller ko sirf itna pata hai: `SearchRequest` andar, results bahar.

**3. Debugging trivially aasan ho jaati hai.**

Production mein koi bole "ye query galat results de rahi hai" -- tum us `SearchRequest` ko function mein daal ke **exact DSL print** kar sakte ho, phir usse Kibana Dev Tools mein paste karke khud chala sakte ho. Koi app chalane ki zarurat nahi. Ek admin endpoint bhi bana sakte ho: `GET /api/v1/admin/explain-query?q=...` jo sirf DSL return kare.

> **Interview line:** "`query-builder` ko main **pure function** rakhta hoon -- validated request andar, DSL object bahar, koi I/O nahi. Ye search system ka sabse bug-prone hissa hai (filter context, boosts, tie-breaker), aur pure hone ki wajah se ise milliseconds mein exhaustively unit-test kiya ja sakta hai. Saath hi ES ki saari DSL knowledge ek file mein rehti hai, controllers mein nahi."

**Dependency diagram:**

```
search.routes.ts
     |
     v
search.controller.ts  (zod validate, filter whitelist, status codes)
     |
     v
search.service.ts  (cache-aside, metrics, fallback policy)
     |
     +--> search/query-builder.ts    [PURE]  SearchRequest -> ES DSL
     |
     +--> repositories/es.repository.ts  --> infra/elasticsearch.ts  --> ES cluster
     |
     +--> infra/redis.ts                                             --> Redis
     |
     +--> search/response-mapper.ts  [PURE]  ES response -> SearchResponse
     |
     +--> repositories/product.repository.ts --> infra/postgres.ts   --> Postgres (fallback only)
```

Dekho: **do `[PURE]` boxes** hain aur baaki sab I/O hai. Testing strategy seedhi nikal aati hai -- pure parts ke liye fast unit tests, I/O parts ke liye kuch integration tests.

Stack: **Express 5**, **@elastic/elasticsearch v8**, **ioredis**, **pg**, **kafkajs**, **zod** (validation), **pino** (logs), **prom-client** (metrics).

Order: pehle types, phir ES client, phir controller (bahar se andar), phir query builder (dil), phir service, phir mapper, phir suggest, phir workers (write path).

### 0. `types/search.ts` -- spec ke types (verbatim)

```ts
interface SearchRequest {
  q: string; page: number; size: number;
  filters: { brand?: string[]; categoryPath?: string[]; priceMin?: number; priceMax?: number; minRating?: number; inStockOnly?: boolean };
  sort: 'relevance' | 'price_asc' | 'price_desc' | 'newest' | 'rating';
  searchAfter?: [number, string];
}
interface SearchHit { productId: string; title: string; brand: string; price: number; rating: number; inStock: boolean; score: number; }
interface FacetBucket { value: string; count: number }
interface SearchResponse {
  hits: SearchHit[]; total: number; totalIsLowerBound: boolean;
  facets: { brands: FacetBucket[]; categories: FacetBucket[]; priceRanges: FacetBucket[] };
  tookMs: number; searchAfter?: [number, string]; degraded?: boolean;
}
interface ProductDoc { productId: string; title: string; description: string; brand: string; categoryPath: string;
  attributes: Record<string, string>; price: number; rating: number; ratingCount: number; inStock: boolean;
  sellerId: string; popularityScore: number; createdAt: string; updatedAt: string; version: number; }
```

**Code Explanation:**

- `SearchRequest` -- ye **validated** request hai, raw `req.query` nahi. Controller zod se validate karke ye banata hai. Iske aage ka poora code maan ke chalta hai ki data saaf hai. Ye ek contract hai: "is line ke baad koi untrusted input nahi hai."
- `filters` ek **nested object** hai, flat fields nahi. Kyun? Kyunki query-builder ko "kaunse filters hain" ek hi jagah se chahiye -- `Object.entries(req.filters)` par loop kar sakta hai.
- `brand?: string[]` -- array, kyunki `?brand=Apple&brand=Spigen` multi-select hai (OR).
- `inStockOnly?: boolean` -- naam `inStockOnly` hai, `inStock` nahi. Kyun? Kyunki `false` ka matlab "out of stock dikhao" nahi hai -- matlab "filter mat lagao". Naam se ye clear hona chahiye.
- `sort` ek **union type** hai, `string` nahi. TypeScript compile time par hi galat value pakad lega, aur `switch` mein exhaustiveness check milta hai.
- `searchAfter?: [number, string]` -- ek **tuple**: `[sortValue, productId]`. Pehla element sort field ki value hai (`_score`, ya `price`, ya timestamp), doosra hamesha tie-breaker `productId`.
- `SearchHit` -- **sirf wo fields jo grid card par dikhti hain.** `description`, `attributes`, `sellerId` yahan nahi hain -- unhe bhejna matlab har response 5x bada, bina kisi fayde ke.
- `score: number` -- debugging ke liye rakha hai. Production mein ise `?debug=true` ke peeche rakh sakte ho, taaki competitor tumhara ranking model na padh sake.
- `totalIsLowerBound: boolean` -- `track_total_hits: 10000` ka seedha nateeja (PART 8.2c).
- `tookMs: number` -- **hamara** total time (ES ka `took` nahi). Isse frontend performance track kar sakta hai aur support tickets mein number hota hai.
- `degraded?: boolean` -- optional. Normal response mein field hoti hi nahi (JSON chhota rehta hai); sirf fallback path par `true`.
- `ProductDoc` -- ES mein jo document jaata hai uska exact shape. Ye `products` table se alag hai: `price_paise` (BIGINT) yahan `price` (number in rupees) ban gaya, `stock_qty` (INT) yahan `inStock` (boolean) ban gaya, `description` truncated snippet hai. **Ye translation repository layer ka kaam hai.**

### 1. `infra/elasticsearch.ts` -- ES client

```ts
import { Client } from '@elastic/elasticsearch';
import { Agent } from 'node:http';
import { config } from '../config';
import { logger } from './logger';

export const esClient = new Client({
  node: config.esUrl,                       // 'http://es-lb.internal:9200'
  auth: { apiKey: config.esApiKey },
  requestTimeout: 1000,                     // 1s hard ceiling per request
  maxRetries: 2,                            // 2 retries, phir error
  sniffOnStart: false,                      // LB ke peeche sniffing OFF
  sniffOnConnectionFault: false,
  compression: true,                        // gzip request/response bodies
  agent: () => new Agent({
    keepAlive: true,
    keepAliveMsecs: 30_000,
    maxSockets: 256,
    maxFreeSockets: 64,
  }),
});

export async function esHealth(): Promise<'green' | 'yellow' | 'red' | 'unknown'> {
  try {
    const res = await esClient.cluster.health({}, { requestTimeout: 500 });
    return res.status as 'green' | 'yellow' | 'red';
  } catch (err) {
    logger.warn({ err }, 'ES health check failed');
    return 'unknown';
  }
}
```

**Code Explanation:**

- `new Client({ node: config.esUrl })` -- **ek hi URL**, jo ek internal load balancer ka hai. Client ko individual node IPs nahi de rahe.
- `auth: { apiKey: config.esApiKey }` -- ES API key (env var se). **Username/password kabhi hardcode nahi.** API key ko scope kiya jaa sakta hai (sirf `products*` indices par read+write), yani ek leak hua key poora cluster nahi khol deta.
- **`requestTimeout: 1000`** -- ek request par max 1 second. **Kyun itna tight?** Hamara p95 budget 200 ms hai. Agar ES 1 second se zyada le raha hai to wo request waise bhi useless hai -- user ja chuka hai. Bina timeout ke Node ki connection pool slow requests se bhar jaati hai aur **healthy requests bhi queue mein phans jaati hain** (ye cascading failure ka classic shape hai). Timeout ek **bulkhead** hai.
  - Note: per-request bhi timeout bhejte hain (`timeout: '800ms'` ES ke andar). Do alag cheezein hain: `requestTimeout` = **client** kitna wait karega; `timeout` = **ES shards** ko kitna time dena hai. ES wala chhota (800 ms) rakhte hain taaki ES khud partial results wapas kar de, client ke abort karne se pehle -- warna tumhe kuch nahi milta.
- **`maxRetries: 2`** -- network blip ya ek node ka restart ho to 2 retry. **3 ya 5 kyun nahi?** Kyunki ES already overloaded hai to retries load aur badhate hain -- "retry storm". 2 retries x 1 s timeout = worst case 3 second, jo pehle se budget se bahar hai. Retry sirf **idempotent** operations par safe hai; search read-only hai, isliye theek hai.
- **`sniffOnStart: false` aur `sniffOnConnectionFault: false`** -- "Sniffing" ka matlab hai client khud cluster se node list nikal ke seedha nodes se baat kare. **LB ke peeche ye bilkul mat karo:**
  - Sniffing se milne wale IPs aksar **internal/private** hote hain jo tumhare app network se reachable hi nahi (especially Kubernetes ya cloud-managed ES par).
  - Client node list cache kar leta hai; node replace hone par client purani IP par hit karta rehta hai.
  - LB ka poora point hi ye hai ki wo healthy nodes ko route kare. Sniffing usko bypass kar deti hai.
  - **Kab ON karein?** Jab tum khud apna ES cluster chala rahe ho, bina LB ke, aur nodes ki IPs stable hon.
- `compression: true` -- gzip. Search response 50-200 KB ka hota hai (24 documents ka `_source` + aggregations). Gzip se network par ~5x chhota. CPU thoda lagta hai par same-VPC bhi bandwidth free nahi hoti, aur serialization time bachta hai.
- **`agent: () => new Agent({ keepAlive: true, ... })`** -- ye sabse zyada latency bachane wala option hai:
  - `keepAlive: true` -- TCP connection ko request ke baad **band mat karo**, reuse karo. Har naye connection par TCP 3-way handshake (+TLS handshake agar HTTPS) = 1-3 network round trips = **2-10 ms**. 1,000 QPS par ye poora latency budget kha jaata.
  - `keepAliveMsecs: 30_000` -- idle connection 30 second tak zinda rakho. ES/LB ka apna idle timeout usse zyada hona chahiye, warna server connection band kar dega aur client ko `ECONNRESET` milega.
  - `maxSockets: 256` -- ek Node process se ES tak max 256 parallel connections. **Ye ek jaan-boojh ke lagayi gayi limit hai:** ES overload ho to backpressure yahin banta hai (requests Node mein queue hoti hain) bajaye ES ko aur maarne ke. Unlimited rakhoge to Node ES ko dubaa dega.
  - `maxFreeSockets: 64` -- 64 idle connections warm rakho. Traffic spike par turant available.
- `esHealth()` -- `/ready` endpoint ke liye. `requestTimeout: 500` **override** per-call kiya hai -- health check ko 1 second wait nahi karna chahiye.
- `catch` mein `'unknown'` return -- health check **kabhi throw nahi karta**. Warna `/ready` endpoint 500 dega, jo readiness probe ke liye galat signal hai.

### 2. `controllers/search.controller.ts` -- validation ka darwaza

```ts
import type { Request, Response } from 'express';
import { z } from 'zod';
import { searchService } from '../services/search.service';
import { logger } from '../infra/logger';
import { searchRequestsTotal } from '../infra/metrics';

const asArray = (v: unknown): string[] | undefined =>
  v === undefined ? undefined : Array.isArray(v) ? v.map(String) : [String(v)];

const searchQuerySchema = z.object({
  q:            z.string().trim().max(100).default(''),
  brand:        z.preprocess(asArray, z.array(z.string().max(100)).max(10).optional()),
  categoryPath: z.preprocess(asArray, z.array(z.string().max(200)).max(5).optional()),
  priceMin:     z.coerce.number().min(0).max(10_000_000).optional(),
  priceMax:     z.coerce.number().min(0).max(10_000_000).optional(),
  minRating:    z.coerce.number().min(0).max(5).optional(),
  inStock:      z.enum(['true', 'false']).optional(),
  sort:         z.enum(['relevance', 'price_asc', 'price_desc', 'newest', 'rating']).default('relevance'),
  page:         z.coerce.number().int().min(1).max(50).default(1),
  size:         z.coerce.number().int().min(1).max(100).default(24),
  searchAfter:  z.string().max(200).optional(),
})
  .strict()
  .refine((v) => v.priceMin === undefined || v.priceMax === undefined || v.priceMin <= v.priceMax,
          { message: 'priceMin must be <= priceMax', path: ['priceMin'] });

export async function search(req: Request, res: Response): Promise<void> {
  const parsed = searchQuerySchema.safeParse(req.query);

  if (!parsed.success) {
    const issue = parsed.error.issues[0];
    res.status(400).json({
      error: 'VALIDATION_ERROR',
      field: String(issue.path[0] ?? ''),
      message: issue.code === 'unrecognized_keys' ? 'unknown filter' : issue.message,
    });
    return;
  }

  const v = parsed.data;

  let searchAfter: [number, string] | undefined;
  if (v.searchAfter) {
    try {
      const raw = JSON.parse(v.searchAfter);
      if (!Array.isArray(raw) || raw.length !== 2
          || typeof raw[0] !== 'number' || typeof raw[1] !== 'string') throw new Error('shape');
      searchAfter = [raw[0], raw[1]];
    } catch {
      res.status(400).json({ error: 'VALIDATION_ERROR', field: 'searchAfter', message: 'invalid cursor' });
      return;
    }
  }

  try {
    const result = await searchService.search({
      q: v.q,
      page: v.page,
      size: v.size,
      filters: {
        brand: v.brand,
        categoryPath: v.categoryPath,
        priceMin: v.priceMin,
        priceMax: v.priceMax,
        minRating: v.minRating,
        inStockOnly: v.inStock === 'true' ? true : undefined,
      },
      sort: v.sort,
      searchAfter,
    });

    searchRequestsTotal.inc({ sort: v.sort, cached: String(result.tookMs < 15) });
    res.status(200).json(result);
  } catch (err) {
    logger.error({ err, q: v.q, requestId: res.locals.requestId }, 'search failed');
    res.status(503).json({ error: 'SEARCH_UNAVAILABLE', message: 'Search is temporarily unavailable' });
  }
}
```

**Code Explanation:**

- `asArray` -- Express `?brand=Apple` ko string deta hai aur `?brand=Apple&brand=Spigen` ko array. Ye helper dono ko **hamesha array** bana deta hai, taaki neeche ka code ek hi shape dekhe. Ye chhoti si normalization bahut bugs bachati hai.
- `z.string().trim().max(100).default('')` -- `q` ki poori validation ek line mein: whitespace hatao, 100 chars se lambi ho to **reject** (silently cut nahi -- user ko pata chalna chahiye), na ho to khaali string (category browse mode).
- `z.preprocess(asArray, z.array(...).max(10))` -- pehle shape theek karo, phir validate karo. `.max(10)` = **10 se zyada brands nahi** (PART 8.2d ka `maxValues`). Har brand max 100 chars.
- `z.coerce.number()` -- query params **hamesha strings** hote hain (`"500"`). `coerce` usse number banata hai. Ye bina `parseInt` ke har jagah likhe kaam ho jaata hai -- aur `"abc"` par saaf validation error deta hai, `NaN` nahi.
- `.min(0).max(10_000_000)` on price -- upper bound kyun? Kyunki `priceMax=999999999999999` jaisa input range query ko useless bana deta hai aur kabhi-kabhi numeric overflow edge cases laata hai. Har numeric input ki **dono taraf** bound honi chahiye.
- `z.enum(['true','false'])` for `inStock` -- boolean coerce **jaan-boojh ke nahi** kiya. `z.coerce.boolean()` mein `"false"` -> `true` ban jaata hai (kyunki JS mein non-empty string truthy hai) -- ye ek famous bug hai. Explicit enum se ye possible hi nahi.
- `z.enum([...])` for `sort` -- **yahi filter whitelist ka half hai.** `sort=popularityScore` bhejo to `400`. User kabhi ES field name choose nahi kar sakta.
- `page ... .max(50)` -- PART 8.2b. `page=51` par zod hi `400` de dega, service tak pahunchega hi nahi.
- `size ... .max(100)` -- latency budget ki hifazat.
- **`.strict()`** -- ye **sabse important line** hai. Iska matlab: schema mein jo keys nahi hain, wo **error** hain, chup-chaap ignore nahi. `?color=red` -> `400 unknown filter`.
  - Ignore karne se kya hota hai? User ko lagega filter lag gaya, results filtered nahi honge, aur wo bharosa kho dega. Aur tumhare frontend ka typo (`?brnd=Apple`) production mein mahino tak pakda nahi jaayega.
  - Security angle: `.strict()` ke bina agar koi future code `Object.entries(query)` par loop kare, to PART 8.2d wali injection wapas aa jaayegi. `.strict()` us darwaze ko schema level par band kar deta hai.
- `.refine(...)` -- cross-field validation. Zod ka `.refine` tab use hota hai jab rule **do fields ke beech** ho. `priceMin > priceMax` ka matlab hamesha zero results -- user ko batao, chup-chaap khaali response mat do.
- `safeParse` (not `parse`) -- `parse` exception throw karta hai; `safeParse` ek result object deta hai. Validation ek **expected** case hai (user galat input bhejta hi hai), exception nahi. Exceptions ko unexpected cheezon ke liye rakho.
- `parsed.error.issues[0]` -- **sirf pehla** error bhejte hain. Saare 12 errors ka nested JSON API consumer ke liye kaam ka nahi hota aur internal schema structure leak karta hai.
- `issue.code === 'unrecognized_keys' ? 'unknown filter' : ...` -- `.strict()` ke violation ko ek friendly message se replace kar rahe hain, zod ka raw message nahi.
- `JSON.parse(v.searchAfter)` inside `try` -- **cursor user se aata hai, yani untrusted hai.** Malformed JSON par `JSON.parse` throw karega -- wo `400` banna chahiye, `500` nahi.
- `raw.length !== 2 || typeof raw[0] !== 'number' || typeof raw[1] !== 'string'` -- **shape validation.** Ye tuple seedha ES ke `search_after` mein jaata hai. Bina check ke user `["{...}", {...}]` bhej sakta hai. `JSON.parse` ke baad **hamesha** shape check karo -- `JSON.parse` sirf syntax check karta hai, structure nahi.
- `inStockOnly: v.inStock === 'true' ? true : undefined` -- **`false` ki jagah `undefined`.** Kyun? `inStockOnly: false` ka matlab "filter mat lagao" hai, "out-of-stock dikhao" nahi. `undefined` bhejne se query-builder us filter ko skip kar dega. `false` bhejte to builder ko extra `if` chahiye hota.
- `searchService.search({...})` -- controller ne **ek bhi ES ya Redis line nahi likhi.** Uska kaam sirf: untrusted input -> validated `SearchRequest`, phir service, phir HTTP status. Isi wajah se controller ka test sirf "kya 400 aaya" check karta hai.
- `searchRequestsTotal.inc({ sort, cached })` -- metric labels. `cached` label se dashboard par cache hit ratio dikhta hai. (Production mein service ko explicit `fromCache` flag return karana behtar hai; `tookMs < 15` ek shortcut hai.)
  - **Label mein `q` kabhi mat daalo.** Har unique query ek nayi time-series banayegi -- ye "cardinality explosion" hai aur Prometheus ko maar deta hai. Labels hamesha **bounded set** se hone chahiye (5 sorts, 2 boolean values).
- `catch` -> `503 SEARCH_UNAVAILABLE` -- yahan tab pahunchte hain jab **service ka fallback bhi fail** ho gaya (ES down aur Postgres bhi down). `500` nahi, kyunki `503` ka matlab "temporary, retry karo" hai -- clients aur monitoring dono isko sahi samajhte hain.
- `logger.error({ err, q, requestId })` -- structured log. `requestId` se poori request trace hoti hai. **`q` log karna theek hai** (public search text, PII nahi), lekin logged-in user ka `userId` uske saath jodne se pehle privacy policy dekh lena.

### 3. `search/query-builder.ts` -- DSL ka dil (pure function)

Pehle **target** dekho -- spec ki canonical query (verbatim), jo ye function banata hai:

```json
{
  "size": 24,
  "query": {
    "function_score": {
      "query": {
        "bool": {
          "must": [{
            "multi_match": {
              "query": "iphon case", "fields": ["title^3", "brand^2", "description"],
              "type": "best_fields", "fuzziness": "AUTO", "prefix_length": 1, "max_expansions": 50
            }
          }],
          "filter": [
            { "term":  { "brand": "Apple" } },
            { "range": { "price": { "gte": 500, "lte": 2000 } } },
            { "term":  { "inStock": true } }
          ]
        }
      },
      "functions": [
        { "field_value_factor": { "field": "popularityScore", "modifier": "log1p", "missing": 0 }, "weight": 0.3 },
        { "filter": { "term": { "inStock": true } }, "weight": 1.2 }
      ],
      "score_mode": "sum", "boost_mode": "multiply"
    }
  },
  "aggs": {
    "brands":     { "terms": { "field": "brand", "size": 10 } },
    "categories": { "terms": { "field": "categoryPath", "size": 10 } },
    "price_ranges": { "range": { "field": "price", "ranges": [{ "to": 500 }, { "from": 500, "to": 2000 }, { "from": 2000 }] } }
  },
  "sort": ["_score", { "productId": "asc" }],
  "track_total_hits": 10000
}
```

Ab code:

```ts
import type { SearchRequest } from '../types/search';

const SORT_MAP: Record<SearchRequest['sort'], unknown[]> = {
  relevance:  ['_score',                    { productId: 'asc' }],
  price_asc:  [{ price: 'asc'  },           { productId: 'asc' }],
  price_desc: [{ price: 'desc' },           { productId: 'asc' }],
  newest:     [{ createdAt: 'desc' },       { productId: 'asc' }],
  rating:     [{ rating: 'desc' },          { productId: 'asc' }],
};

const AGGS = {
  brands:     { terms: { field: 'brand', size: 10 } },
  categories: { terms: { field: 'categoryPath', size: 10 } },
  price_ranges: { range: { field: 'price', ranges: [{ to: 500 }, { from: 500, to: 2000 }, { from: 2000 }] } },
};

export function buildSearchQuery(req: SearchRequest): Record<string, unknown> {
  // ---- 1. QUERY CONTEXT: scoring wala hissa ----
  const must: unknown[] = req.q
    ? [{
        multi_match: {
          query: req.q,
          fields: ['title^3', 'brand^2', 'description'],
          type: 'best_fields',
          fuzziness: 'AUTO',
          prefix_length: 1,
          max_expansions: 50,
        },
      }]
    : [{ match_all: {} }];

  // ---- 2. FILTER CONTEXT: sirf haan/naa, koi score nahi ----
  const filter: unknown[] = [];
  const f = req.filters;

  if (f.brand?.length)        filter.push({ terms: { brand: f.brand } });
  if (f.categoryPath?.length) filter.push({ terms: { categoryPath: f.categoryPath } });
  if (f.minRating !== undefined) filter.push({ range: { rating: { gte: f.minRating } } });
  if (f.inStockOnly)          filter.push({ term: { inStock: true } });

  if (f.priceMin !== undefined || f.priceMax !== undefined) {
    const range: Record<string, number> = {};
    if (f.priceMin !== undefined) range.gte = f.priceMin;
    if (f.priceMax !== undefined) range.lte = f.priceMax;
    filter.push({ range: { price: range } });
  }

  // ---- 3. BUSINESS BOOSTS: text relevance ko multiply karo ----
  const query = {
    function_score: {
      query: { bool: { must, filter } },
      functions: [
        { field_value_factor: { field: 'popularityScore', modifier: 'log1p', missing: 0 }, weight: 0.3 },
        { filter: { term: { inStock: true } }, weight: 1.2 },
      ],
      score_mode: 'sum',
      boost_mode: 'multiply',
    },
  };

  // ---- 4. Pagination + sort ----
  const body: Record<string, unknown> = {
    size: req.size,
    query,
    aggs: AGGS,
    sort: SORT_MAP[req.sort],
    track_total_hits: 10000,
    _source: ['productId', 'title', 'brand', 'price', 'rating', 'inStock'],
  };

  if (req.searchAfter) {
    body.search_after = req.searchAfter;      // cursor mode -- `from` NAHI
  } else {
    body.from = (req.page - 1) * req.size;
  }

  return body;
}
```

**Code Explanation:**

**`SORT_MAP`** -- ek static object. User ka `sort` string sirf **is map ka key** ban sakta hai (zod enum ne pehle hi guarantee kar diya). Yani user kabhi `{ sellerId: 'asc' }` inject nahi kar sakta. **Har entry ka last element `{ productId: 'asc' }` hai** -- tie-breaker (PART 8.2b). Ye chhoot jaaye to `search_after` mein documents repeat/skip honge, aur bug reproduce karna bahut mushkil hoga.

**`AGGS`** -- teen facets, sab `keyword`/numeric fields par. `size: 10` matlab top 10 buckets. Ye constant isliye hai ki har request ke liye naya object banane ki zarurat nahi -- JS mein object literal har call par allocate hota hai, aur 1,000 QPS par ye GC pressure banata hai.

**`req.q ? multi_match : match_all`** -- khaali query ka matlab "category browse" hai (`/search?categoryPath=electronics/mobiles`). `match_all` sab documents match karta hai score `1.0` ke saath, aur filters usko narrow karte hain. Bina is branch ke khaali `q` par `multi_match` zero results de deta.

**`fields: ['title^3', 'brand^2', 'description']`** -- `^` ek **boost multiplier** hai.
- `title^3` -- title mein match **3x** weight ka. Kyun? Title chhota aur curated hota hai -- wahan "iphone" hona strong signal hai.
- `brand^2` -- brand match 2x. `"apple"` search par Apple brand ke products upar.
- `description` (boost 1) -- description lambi hoti hai aur usme sab kuch likha hota hai ("compatible with iPhone, Samsung, OnePlus..."). Wahan match weak signal hai.
- **Ye teen numbers hi Part 1 ki "relevance problem" ka jawab hain.** SQL `LIKE` mein ye concept exist hi nahi karta -- wahan title match aur description match barabar hain.

**`type: 'best_fields'`** -- multiple fields match hue to score kaise banega? `best_fields` = **sabse achhe ek field ka score** lo (sabka sum nahi). Kyun? Kyunki "iphone case" ek hi field (title) mein pura milna chahiye -- `"iphone"` title mein aur `"case"` description mein milna utna achha match nahi hai. (Alternative `cross_fields` tab use hota hai jab query ke words **naturally alag fields** mein bikhre hon, jaise person name search.)

**`fuzziness: 'AUTO'`** -- typo tolerance. Levenshtein edit distance:
- length 1-2 -> 0 edits allowed (`"ip"` ko fuzzy karne ka matlab nahi)
- length 3-5 -> 1 edit (`"iphon"` -> `"iphone"`)
- length > 5 -> 2 edits (`"smartphne"` -> `"smartphone"`)

`AUTO` isliye ki fixed `fuzziness: 2` chhote words par tabaahi machata hai -- `"cat"` se `"car"`, `"cap"`, `"bat"`, `"hat"` sab match honge.

**`prefix_length: 1`** -- **pehla character sahi maano**, uspar fuzzy mat karo. Ye pure query ka sabse bada performance lever hai. Bina iske ES ko **poori term dictionary** mein edit-distance-2 wale terms dhoondhne padte hain (lakhon terms). `prefix_length: 1` se search sirf `"i"` se shuru hone wale terms tak simit ho jaata hai -- **20-50x tez**. Cost: `"iphone"` ko `"ophone"` likho to match nahi hoga. Real users pehla akshar 99% sahi likhte hain.

**`max_expansions: 50`** -- ek fuzzy term max 50 alternatives mein expand hoga. Iske bina ek common prefix wala term hazaaron terms mein expand ho sakta hai aur boolean clause limit cross kar sakta hai.

---

#### Query context vs filter context -- ye poore search ka sabse bada performance concept hai

`bool` query ke andar do alag "duniya" hain:

| | `must` / `should` (**query context**) | `filter` / `must_not` (**filter context**) |
|---|---|---|
| Sawaal | "ye document **kitna** match karta hai?" | "ye document match karta hai: **haan ya na**?" |
| Output | ek float `_score` | ek bit: 1 ya 0 |
| Calculation | BM25 (tf, idf, field length) -- **mehenga** | Sirf term lookup -- **sasta** |
| Cacheable? | **Nahi** | **Haan -- bitset ke roop mein** |
| Kis liye | `q` ka text match | brand, price range, inStock, category |

**"Cacheable bitset" ka matlab kya hai?**

Jab tum `{ "term": { "brand": "Apple" } }` ko **filter** mein daalte ho, Lucene ek **bitset** banata hai -- har document ke liye ek bit:

```
Shard 0 ke documents:   doc0 doc1 doc2 doc3 doc4 doc5 doc6 doc7 ...
brand=Apple ka bitset:    1    0    0    1    1    0    0    1   ...
                          ^                ^    ^              ^
                       Apple ke products
```

Ye bitset **cache** ho jaata hai (query cache mein, per segment). Ab:

- **Agli baar** koi bhi `brand=Apple` filter lagaye -- chahe query `"iphone case"` ho ya `"apple watch"` -- ye bitset **dobara nahi banega**, cache se aa jaayega.
- Multiple filters combine karna ek **bitwise AND** hai -- CPU ke liye trivially fast:

```
brand=Apple:        1 0 0 1 1 0 0 1
price 500-2000:     1 1 0 1 0 0 1 1
inStock=true:       1 0 1 1 1 1 0 0
                    ---------------  AND
final candidates:   1 0 0 1 0 0 0 0   -> sirf doc0 aur doc3 ko score karna hai
```

- Aur sabse bada fayda: **scoring sirf surviving documents par chalti hai.** 50M documents mein se filters ne 2,000 bacha diye -- BM25 sirf un 2,000 par chalega, 50M par nahi.

**Agar tum galti se filters ko `must` mein daal do:**

```json
"must": [
  { "multi_match": { ... } },
  { "term": { "brand": "Apple" } },        // [X] GALAT
  { "range": { "price": { "gte": 500 } } } // [X] GALAT
]
```

1. **Har brand match par BM25 calculate hoga.** Brand ek exact term hai -- uska "score" ka koi matlab hi nahi hai. Ye pure waste CPU hai.
2. **Koi bitset cache nahi hoga.** Har request wahi kaam dobara.
3. **Scores corrupt ho jaayenge.** `brand: "Apple"` ka IDF score final `_score` mein jud jaayega. Nateeja: **Apple ke products sirf isliye upar aa jaayenge ki unhone filter match kiya** -- jabki har result ne filter match kiya hai (warna wo result hota hi nahi). Ye ranking ko silently kharab karta hai aur pakadna bahut mushkil hai.

> **Rule jo hamesha yaad rakho:** "Jo cheez **score mein contribute nahi karti**, use hamesha `filter` mein daalo." Ek line ka test: "Kya mujhe farak padta hai ki ye clause **kitna** match karta hai?" Agar jawab "nahi, bas match hona chahiye" hai -> `filter`.

---

**`terms` vs `term`** -- code mein `{ terms: { brand: f.brand } }` hai kyunki `f.brand` ek **array** hai (`["Apple", "Spigen"]`). `terms` ka matlab **OR**: "in values mein se koi bhi". Spec ke JSON mein single-value `term` dikhaya gaya hai -- wo ek brand wala case hai. Multi-select UI ke liye `terms` chahiye.

**`if (f.inStockOnly)`** -- yahan `!== undefined` nahi, **truthiness** check hai. Kyunki controller ne `false` ki jagah `undefined` bheja hai (upar dekha). `inStockOnly` `true` hone par hi filter lagta hai.

**Price range building** -- `gte` aur `lte` alag-alag optional hain. Ek `Record` bana ke sirf jo mile wo daalte hain. Agar `{ gte: undefined }` bhej dete to ES `null` ko galat samajh sakta hai; isliye key hi mat daalo.

**`function_score` -- business boosts:**

- `query: { bool: { must, filter } }` -- **pehle text relevance nikalo**, phir uspar business signals lagao.
- `field_value_factor: { field: 'popularityScore', modifier: 'log1p', missing: 0 }` -- `popularityScore` (30-day orders se nikla number) ko score mein laao.
  - **`modifier: 'log1p'` kyun?** Kyunki popularity ki distribution bahut skewed hoti hai: ek bestseller ke 500,000 orders, normal product ke 50. Raw value use karoge to bestseller ka score `10,000x` ho jaayega aur **text relevance ka koi matlab hi nahi bachega** -- har query par wahi 10 bestsellers aayenge. `log1p(x) = ln(1 + x)` isko compress karta hai:

    ```
    popularity      raw        log1p
         50          50         3.9
      5,000       5,000         8.5
    500,000     500,000        13.1
    ```

    Dekho: 10,000x ka farak sirf ~3.4x ban gaya. Popularity ab ek **tie-breaker** hai, dictator nahi.
  - **`missing: 0`** -- naye products ka `popularityScore` nahi hota. Bina iske ES error de sakta hai ya unpredictable behave kar sakta hai. `0` ka matlab "koi popularity boost nahi", jo naye product ke liye sahi hai.
  - **`weight: 0.3`** -- is function ka contribution. Ye number tuning se aata hai (A/B test), theory se nahi.
- `{ filter: { term: { inStock: true } }, weight: 1.2 }` -- **in-stock products ko 20% boost.** Kyun? Out-of-stock product user ke liye bekaar hai (aur conversion zero). Par use poori tarah **hide nahi karte** -- kabhi-kabhi user specifically wahi product dhoondh raha hota hai aur "notify me" lagana chahta hai. Isliye boost, filter nahi. (User khud `inStock=true` filter laga sakta hai.)
- **`score_mode: 'sum'`** -- functions ke results kaise jodein? `sum` = `0.3 * log1p(popularity) + 1.2`. (`multiply`, `avg`, `max`, `first` bhi options hain.)
- **`boost_mode: 'multiply'`** -- functions ka result **text score ke saath** kaise jode? `multiply` = `finalScore = textScore * functionScore`.
  - **Ye sabse important knob hai.** `multiply` ka matlab: text relevance **base** hai, business signals usko **scale** karte hain. Agar text match hi kamzor hai (score 0.5), to popularity kitni bhi ho, product upar nahi aayega.
  - `boost_mode: 'replace'` use karte to text score **poori tarah phenk diya** jaata aur sirf popularity bachti -- yani har query par wahi bestsellers. **Kabhi mat karo.**
  - `boost_mode: 'sum'` bhi risky hai: bada popularity score chhote text score ko dabaa sakta hai.

> **Rule:** "**Text relevance ko multiply karo, replace mat karo.**" Search pehle relevant hona chahiye, phir commercial.

**`_source: [...]`** -- ES se **sirf 6 fields** maango, poora document nahi. Document ~2 KB ka hai; ye 6 fields ~200 bytes ke. 24 documents par: 48 KB ki jagah ~5 KB. Fetch phase tez, network kam, JSON parse tez. Yeh ek line 5-10 ms bachati hai.

**`track_total_hits: 10000`** -- PART 8.2c.

**`search_after` vs `from`** -- **dono kabhi ek saath nahi.** `search_after` ke saath `from` bhejo to ES error deta hai. Isliye `if/else`. Cursor mode mein "skip" ka concept hi nahi hota -- ES seedha us point se aage padhta hai.

**Function pure hai:** poore function mein koi `await`, koi `Date.now()`, koi `fetch`, koi global read nahi. `SORT_MAP` aur `AGGS` constants hain. Isi wajah se iska test bina kisi infrastructure ke chalta hai.

### 4. `services/search.service.ts` -- cache-aside + fallback policy

```ts
import { createHash } from 'node:crypto';
import { esClient } from '../infra/elasticsearch';
import { redis } from '../infra/redis';
import { logger } from '../infra/logger';
import { buildSearchQuery } from '../search/query-builder';
import { mapSearchResponse } from '../search/response-mapper';
import { productRepository } from '../repositories/product.repository';
import { esQueryDuration, cacheHits, cacheMisses, zeroResults, degradedTotal } from '../infra/metrics';
import type { SearchRequest, SearchResponse } from '../types/search';

const CACHE_TTL_SEC = 60;
const inFlight = new Map<string, Promise<SearchResponse>>();

function cacheKey(req: SearchRequest): string {
  const canonical = JSON.stringify({
    q: req.q.toLowerCase().replace(/\s+/g, ' ').trim(),
    f: {
      brand: req.filters.brand?.slice().sort(),
      cat: req.filters.categoryPath?.slice().sort(),
      pmin: req.filters.priceMin, pmax: req.filters.priceMax,
      rating: req.filters.minRating, stock: req.filters.inStockOnly,
    },
    s: req.sort,
    p: req.page,
    n: req.size,
  });
  return `q:${createHash('sha1').update(canonical).digest('hex')}`;
}

async function runEsSearch(req: SearchRequest, startedAt: number): Promise<SearchResponse> {
  const body = buildSearchQuery(req);

  const esStart = Date.now();
  const res = await esClient.search(
    { index: 'products', ...body, timeout: '800ms', allow_partial_search_results: true },
    { requestTimeout: 1000 },
  );
  esQueryDuration.observe({ index: 'products' }, (Date.now() - esStart) / 1000);

  const mapped = mapSearchResponse(res, Date.now() - startedAt);
  if (mapped.hits.length === 0) zeroResults.inc();
  return mapped;
}

export const searchService = {
  async search(req: SearchRequest): Promise<SearchResponse> {
    const startedAt = Date.now();
    const key = cacheKey(req);
    const cacheable = req.page === 1 && !req.searchAfter;

    // ---- 1. Cache lookup (cache-aside) ----
    if (cacheable) {
      try {
        const cached = await redis.get(key);
        if (cached) {
          cacheHits.inc();
          const parsed = JSON.parse(cached) as SearchResponse;
          return { ...parsed, tookMs: Date.now() - startedAt };
        }
        cacheMisses.inc();
      } catch (err) {
        logger.warn({ err }, 'redis cache read failed -- continuing to ES');
      }
    }

    // ---- 2. Single-flight guard (stampede protection) ----
    const existing = cacheable ? inFlight.get(key) : undefined;
    if (existing) return existing;

    const work = (async (): Promise<SearchResponse> => {
      try {
        const result = await runEsSearch(req, startedAt);

        if (cacheable && !result.degraded) {
          redis.setex(key, CACHE_TTL_SEC, JSON.stringify(result))
               .catch((err) => logger.warn({ err }, 'cache write failed'));
        }
        return result;
      } catch (err) {
        // ---- 3. ES failed -> degraded Postgres search ----
        logger.error({ err, q: req.q }, 'ES search failed -- falling back to Postgres');
        degradedTotal.inc();
        const rows = await productRepository.degradedSearch(req.q, 20);
        return {
          hits: rows,
          total: rows.length,
          totalIsLowerBound: true,
          facets: { brands: [], categories: [], priceRanges: [] },
          tookMs: Date.now() - startedAt,
          degraded: true,
        };
      } finally {
        inFlight.delete(key);
      }
    })();

    if (cacheable) inFlight.set(key, work);
    return work;
  },
};
```

**Code Explanation -- `cacheKey`:**

- `JSON.stringify({...})` -- poore request ka ek **canonical string**. "Canonical" ka matlab: semantically same requests ka string bhi **bilkul same** hona chahiye.
- `req.q.toLowerCase().replace(/\s+/g, ' ').trim()` -- `"  iPhone   Case "` aur `"iphone case"` ek hi key. Ye seedha cache hit ratio badhata hai.
- `req.filters.brand?.slice().sort()` -- **`.sort()` bahut important hai.** `?brand=Apple&brand=Spigen` aur `?brand=Spigen&brand=Apple` bilkul same search hai, par arrays alag order mein hain -> alag JSON -> alag key -> ek hi result do baar cache. `.sort()` order ko normalize karta hai.
  - `.slice()` pehle kyun? Kyunki `.sort()` array ko **in-place** modify karta hai. Bina `.slice()` ke tum caller ka `req.filters.brand` mutate kar doge -- ek classic silent bug.
- Short keys (`f`, `s`, `p`, `n`) -- ye string hash hone se pehle ka hai, to size se koi farak nahi padta, par canonical string chhoti rehti hai (thoda tez hash).
- `createHash('sha1').update(canonical).digest('hex')` -- fixed 40-char output. Spec ka format: `q:<sha1(normalizedQuery+filters+sort+page)>`.
- **SHA-1 security ke liye nahi hai** -- yahan koi attacker collision se kuch gain nahi kar sakta (worst case do alag queries ek cache entry share karein -- jiska practical probability zero hai). Ye **fingerprinting** hai, isliye tez SHA-1 kaafi hai.

**Code Explanation -- `runEsSearch`:**

- `buildSearchQuery(req)` -- pure function, DSL milta hai.
- `esClient.search({ index: 'products', ...body })` -- **`'products'` alias hai**, `products_v3` nahi. Isi wajah se zero-downtime reindex possible hai (PART 9b).
- `timeout: '800ms'` -- **ES-side** timeout. ES shards ko 800 ms deta hai; uske baad jo shards ne diya wahi partial result wapas kar deta hai.
- `allow_partial_search_results: true` -- ek shard timeout/fail ho to baaki 5 ke results do. **5/6 results zero results se bahut behtar hai.** (Mapper `_shards.failed` check karke metric badhata hai -- neeche.)
- `{ requestTimeout: 1000 }` (second argument) -- **client-side** timeout, per-call override. Do layers: ES ko 800 ms, client 1,000 ms tak wait karta hai. Client wala thoda bada isliye ki ES ko apna partial response bhejne ka mauka mile.
- `esQueryDuration.observe(...)` -- histogram metric. Isse p50/p95/p99 dashboards bante hain. **Dhyaan:** hum apna measured time record kar rahe hain (network sameth), ES ka `took` nahi -- kyunki user ko poora time lagta hai.
- `if (mapped.hits.length === 0) zeroResults.inc()` -- **zero-result rate** Part 1 ka target metric hai (abhi ~12%, target < 5%). Ye metric hi batata hai ki synonyms/typo tolerance kaam kar rahi hai ya nahi.

**Code Explanation -- `search()` -- cache-aside pattern:**

- `const cacheable = req.page === 1 && !req.searchAfter` -- **sirf page 1 cache karte hain.** Page 2+ ki repeat rate bahut kam hai; unhe cache karna Redis memory waste karna hai aur head queries ko evict karta hai. Cursor wali requests to definitionally unique hoti hain.
- `await redis.get(key)` -> **cache-aside** ka step 1: "pehle cache dekho".
  - Cache-aside (lazy loading) ka matlab: application cache ko manage karta hai. Miss par DB/ES se lao aur cache mein daal do. Ye **read-through** se alag hai (jahan cache khud fetch karta hai).
- `return { ...parsed, tookMs: Date.now() - startedAt }` -- cached body wapas kar rahe hain **lekin `tookMs` fresh calculate kiya**. Kyun? Cached `tookMs` mein purani (74 ms wali) value hai; usko wapas bhejna jhooth hai. Cache hit ka asli time ~5 ms hai, aur frontend ko wahi dikhna chahiye.
- **`try/catch` around `redis.get`** -- **Redis down hone se search down nahi honi chahiye.** Cache ek optimization hai, dependency nahi. Error log karo (sampled), aur seedha ES chale jao. Latency badhegi (cache hits khatam), par system zinda rahega.
  - Ye `URL Shortener` lesson wala hi principle hai: "cache ko cache ki tarah treat karo, source of truth ki tarah nahi."
- **Single-flight / stampede guard (`inFlight` map):**
  - **Problem (cache stampede / thundering herd):** `"iphone"` ki cache entry expire hui. Us exact moment par 300 concurrent requests aayi. Sabko miss mila. Ab **300 identical queries ek saath ES par** jaayengi -- wahi kaam 300 baar, aur ES spike.
  - **Solution:** ek `Map<key, Promise>`. Pehli request kaam shuru karti hai aur apna **promise** map mein daal deti hai. Baaki 299 requests wahi promise `await` karti hain. **ES par sirf 1 query jaati hai**, jawab sabko milta hai.
  - `finally { inFlight.delete(key) }` -- kaam khatam (success ya fail) hone par entry hatao, warna map leak karega aur agla request purana result paayega.
  - **Limitation (interview mein bolna):** ye guard **per-process** hai. 10 Node instances hain to worst case 10 queries jaayengi, 300 nahi -- 30x improvement, par perfect nahi. **Cross-process** chahiye to Redis mein ek short lock (`SET key NX PX 2000`) chahiye, ya "stale-while-revalidate" (expire hone par purana result serve karo aur background mein refresh karo). Hamare scale par per-process guard kaafi hai.
- `redis.setex(key, 60, JSON.stringify(result))` **bina `await`** -- fire and forget. Cache write user ko wait karane layak nahi hai. `.catch(...)` zaroori hai warna Node `unhandledRejection` par process crash kar sakta hai.
- **`if (cacheable && !result.degraded)`** -- **degraded result kabhi cache mat karo.** Warna ES 30 second mein wapas aa jaaye, phir bhi agle 60 second tak users ko facets-less degraded results milte rahenge. Ye bug production mein "ES to theek hai, phir search kharab kyun hai?" wala confusion banata hai.
- **Fallback `catch` block:**
  - `degradedTotal.inc()` -- `search_degraded_total` metric. Ispar alert hona chahiye: `rate(search_degraded_total[5m]) > 0` matlab ES mein kuch gadbad hai.
  - `productRepository.degradedSearch(req.q, 20)` -- Postgres se top 20 (SQL neeche). **Facets khaali** -- kyunki Postgres par facet counts nikalna har filter ke liye ek alag `GROUP BY` hai = bahut mehenga = ye wahi load hai jo DB ko maar dega, aur DB abhi hamara aakhri sahara hai.
  - `degraded: true` -- UI banner (PART 8.2e).
  - Agar `degradedSearch` bhi throw kar de? Error controller tak jaata hai -> `503 SEARCH_UNAVAILABLE`. **Teen level ka degradation: cache -> Postgres -> 503.**

> **Interview line:** "Cache ek optimization hai, dependency nahi -- Redis fail ho to main ES chala jaata hoon. ES ek derived view hai, source of truth nahi -- ES fail ho to main Postgres se degraded results deta hoon aur response mein `degraded: true` bhejta hoon taaki UI honest ban sake. 503 tabhi deta hoon jab teeno layers fail hon. Rate limiter mein ye 'fail open vs closed' tha; search mein ye **'degrade, don't die'** ban jaata hai."

### 5. `search/response-mapper.ts` -- ES response -> `SearchResponse` (pure function)

```ts
import type { SearchResponse as EsResponse } from '@elastic/elasticsearch/lib/api/types';
import type { SearchHit, SearchResponse, FacetBucket } from '../types/search';
import { partialShardFailures } from '../infra/metrics';
import { logger } from '../infra/logger';

interface EsSource {
  productId: string; title: string; brand?: string;
  price: number; rating?: number; inStock: boolean;
}

export function mapSearchResponse(res: EsResponse<EsSource>, tookMs: number): SearchResponse {
  // ---- 1. Partial failure detection ----
  const failedShards = res._shards?.failed ?? 0;
  if (failedShards > 0) {
    partialShardFailures.inc(failedShards);
    logger.warn(
      { failed: failedShards, total: res._shards?.total,
        reason: res._shards?.failures?.[0]?.reason?.type },
      'partial shard failure -- results are incomplete',
    );
  }

  // ---- 2. Hits ----
  const hits: SearchHit[] = res.hits.hits.map((h) => {
    const s = h._source as EsSource;
    return {
      productId: s.productId,
      title: s.title,
      brand: s.brand ?? '',
      price: s.price,
      rating: s.rating ?? 0,
      inStock: s.inStock,
      score: h._score ?? 0,
    };
  });

  // ---- 3. Total (lower bound ya exact) ----
  const totalRaw = res.hits.total;
  const total = typeof totalRaw === 'number' ? totalRaw : (totalRaw?.value ?? 0);
  const totalIsLowerBound = typeof totalRaw === 'object' && totalRaw?.relation === 'gte';

  // ---- 4. Facets ----
  const aggs = res.aggregations as Record<string, any> | undefined;

  const terms = (name: string): FacetBucket[] =>
    (aggs?.[name]?.buckets ?? []).map((b: any) => ({ value: String(b.key), count: b.doc_count }));

  const ranges = (name: string): FacetBucket[] =>
    (aggs?.[name]?.buckets ?? [])
      .map((b: any) => ({ value: String(b.key), count: b.doc_count }))
      .filter((b: FacetBucket) => b.count > 0);

  // ---- 5. Next cursor ----
  const lastHit = res.hits.hits[res.hits.hits.length - 1];
  const sortVals = lastHit?.sort;
  const searchAfter =
    Array.isArray(sortVals) && sortVals.length === 2
      ? ([Number(sortVals[0]), String(sortVals[1])] as [number, string])
      : undefined;

  return {
    hits,
    total,
    totalIsLowerBound,
    facets: {
      brands: terms('brands'),
      categories: terms('categories'),
      priceRanges: ranges('price_ranges'),
    },
    tookMs,
    searchAfter,
  };
}
```

**Code Explanation:**

- **Ye function bhi `[PURE]` hai** -- ek object andar, ek object bahar. Koi I/O nahi. Iska matlab tum ES ka ek real response JSON file mein save karke 30 alag mapping tests likh sakte ho.
- **`_shards.failed` check (sabse important hissa):** humne `allow_partial_search_results: true` set kiya hai. Iska matlab ES **chup-chaap** adhoore results de dega -- HTTP status 200 hi aayega, koi error nahi. Agar tum ye check na karo:
  - 6 mein se 2 shards fail -> user ko **ek-tihaai catalog gayab** dikhega.
  - Koi alert nahi, koi error rate spike nahi. Bas "aaj search kharab lag raha hai" wali complaints.
  - **Ye "silent data loss" hai -- monitoring mein sabse khatarnak category.**
  - Isliye `partialShardFailures` metric aur ek `warn` log. `res._shards.failures[0].reason.type` se pata chalta hai kyun (`search_phase_execution_exception`, `circuit_breaking_exception`, timeout).
- `res.hits.hits.map(...)` -- ES ka nested shape (`hits.hits[]._source`) hamare flat `SearchHit` mein. **Ye "anti-corruption layer" hai** -- ES ki shape kabhi frontend tak nahi jaati.
- `h._source as EsSource` -- `_source` mein wahi 6 fields hain jo query builder ne `_source: [...]` se maange the.
- `brand: s.brand ?? ''` aur `rating: s.rating ?? 0` -- **defensive defaults.** Postgres mein `brand` nullable hai (unbranded products). ES document mein field **ho hi nahi sakti**. Frontend ko `undefined` bhejne se `product.brand.toUpperCase()` par crash hota hai. Mapper har optional field ko concrete value deta hai.
- `score: h._score ?? 0` -- `_score` `null` hota hai jab sort `_score` par nahi hai (jaise `price_asc`). ES us case mein scoring skip kar deta hai (optimization) aur `null` deta hai.
- **`res.hits.total` ka double shape:** ES 7+ mein ye `{ value, relation }` object hai, par purane clients/settings (`rest_total_hits_as_int`) mein plain number ho sakta hai. `typeof` check dono ko handle karta hai -- ye defensive coding ES upgrades ke liye hai.
- `totalIsLowerBound = ... relation === 'gte'` -- PART 8.2c ka poora mapping ek line mein. `gte` -> UI "10,000+" dikhayega.
- `terms(name)` helper -- `aggs?.[name]?.buckets ?? []`. **Teen safety layers:** aggregations ho hi na (fallback case), us naam ka agg na ho, ya buckets na hon. Har case mein khaali array -- kabhi crash nahi.
- `String(b.key)` -- ES bucket key string, number ya boolean ho sakta hai. API contract mein `value: string` hai, to normalize kar do.
- `ranges(name)` mein `.filter((b) => b.count > 0)` -- **zero-count range facets hata do.** `price_ranges` hamesha teeno buckets deta hai (`*-500`, `500-2000`, `2000-*`) chahe count 0 ho. UI par "Under Rs 500 (0)" dikhana bekaar hai -- user click karega aur khaali page milega.
  - **Dhyaan do:** `terms` facets par ye filter nahi lagaya -- `terms` aggregation waise bhi zero-count buckets nahi deti.
- **`lastHit?.sort`** -- ES har hit ke saath uski **sort values** deta hai (jab `sort` specify kiya ho). Aakhri hit ki sort values hi agle page ka cursor hain. Yahi `search_after` ka poora mechanism hai -- tum khud koi cursor generate nahi karte, ES tumhe de deta hai.
- `sortVals.length === 2` check -- hamare `SORT_MAP` ke har entry mein 2 elements hain (main sort + `productId` tie-breaker). Agar kabhi 3 ho jaaye to type mismatch pakadna chahiye, silently galat cursor nahi banana chahiye.
- `[Number(sortVals[0]), String(sortVals[1])]` -- tuple type mein cast. `_score` float aata hai, `price` number, `createdAt` epoch millis (number) -- sab `Number` ho jaate hain. `productId` string.
- **`searchAfter` hamesha bhejte hain, sirf page 50 par nahi.** Frontend "Load more" ke liye isko use kar sakta hai chahe user page 2 par ho -- infinite scroll ke liye bhi yahi chahiye.

### 6. `services/suggest.service.ts` -- prefix cache + edge n-gram

```ts
import { esClient } from '../infra/elasticsearch';
import { redis } from '../infra/redis';
import { logger } from '../infra/logger';
import { suggestLatency } from '../infra/metrics';

const SUGGEST_TTL_SEC = 600;              // 10 minutes
const MAX_PREFIX_LEN = 50;

export interface Suggestion { text: string; type: 'query' | 'product' | 'category' }

function prefixKey(q: string): string {
  return `sug:${q.toLowerCase().replace(/\s+/g, ' ').trim().slice(0, MAX_PREFIX_LEN)}`;
}

export const suggestService = {
  async suggest(q: string, limit: number): Promise<Suggestion[]> {
    const startedAt = Date.now();
    const key = prefixKey(q);

    // ---- 1. Redis prefix cache (70-80% hit) ----
    try {
      const cached = await redis.get(key);
      if (cached) {
        suggestLatency.observe({ source: 'cache' }, (Date.now() - startedAt) / 1000);
        return (JSON.parse(cached) as Suggestion[]).slice(0, limit);
      }
    } catch (err) {
      logger.warn({ err }, 'suggest cache read failed');
    }

    // ---- 2. ES edge n-gram query on suggestions_v2 ----
    try {
      const res = await esClient.search<{ text: string; type: Suggestion['type']; popularity: number }>(
        {
          index: 'suggestions',
          size: 20,
          query: {
            bool: {
              must: [{ match: { 'text.ac': { query: q, operator: 'and' } } }],
              filter: [{ term: { enabled: true } }],
            },
          },
          sort: [{ popularity: 'desc' }, { 'text.keyword': 'asc' }],
          _source: ['text', 'type'],
          track_total_hits: false,
        },
        { requestTimeout: 300 },
      );

      const out: Suggestion[] = res.hits.hits.map((h) => ({
        text: h._source!.text,
        type: h._source!.type,
      }));

      redis.setex(key, SUGGEST_TTL_SEC, JSON.stringify(out))
           .catch((err) => logger.warn({ err }, 'suggest cache write failed'));

      suggestLatency.observe({ source: 'es' }, (Date.now() - startedAt) / 1000);
      return out.slice(0, limit);
    } catch (err) {
      logger.warn({ err, q }, 'suggest failed -- returning empty');
      return [];                         // [OK] kabhi 500 nahi
    }
  },
};
```

**Code Explanation:**

- `SUGGEST_TTL_SEC = 600` -- 10 minute, search ke 60 second se **10x zyada**. Kyun? Suggestions ka data `query_popularity` table se aata hai jo **nightly** update hota hai. 10 minute purani suggestion bilkul theek hai. Lamba TTL = zyada hits = kam ES load, aur 4,000 QPS par yahi bachata hai.
- `prefixKey` -- same normalization jaisa search mein: lowercase, whitespace collapse, trim, 50 chars cap. `"IPH"`, `"iph"`, `" iph "` ek hi Redis key.
- **Redis pehle, hamesha.** Part 1 ka number: autocomplete peak ~4,000 QPS. ~75% cache hit ratio matlab ES par sirf ~1,000 QPS. Bina cache ke ES ko 4,000 QPS handle karna padta -- aur wahi cluster main search bhi chala raha hai.
  - Cache hit ka latency ~3-5 ms. p99 < 100 ms ka requirement isi ki wajah se comfortable hai.
- `.slice(0, limit)` cache hit par -- hum cache mein **20 suggestions** rakhte hain par user ne `limit=10` maanga. Ek hi cache entry alag-alag `limit` values ko serve kar deti hai. Agar `limit` cache key ka hissa hota to 20 alag entries banti -- memory waste.
- `index: 'suggestions'` -- alias, `suggestions_v2` nahi. Same reindex pattern.
- `match: { 'text.ac': { query: q, operator: 'and' } }` -- `text.ac` woh edge-n-gram sub-field hai. User ne `"iph"` bheja; search analyzer `standard` hai (edge n-gram **nahi**), to query term sirf `"iph"` banega aur index mein pade `"iph"` gram se match karega.
  - **`operator: 'and'` kyun?** Default `or` hai. `"iphone ca"` bhejo to `or` ke saath wo document bhi match karega jisme sirf `"iphone"` hai -- yani `"iphone charger"` bhi aa jaayega jab user `"iphone ca(se)"` type kar raha hai. `and` se **saare tokens** match hone chahiye.
- `filter: [{ term: { enabled: true } }]` -- **filter context** (score nahi). Banned/spam queries ko suggestions se hata sakte ho bina delete kiye. Autocomplete ek brand risk hai -- galat suggestion screenshot ban ke Twitter par jaati hai.
- `sort: [{ popularity: 'desc' }, { 'text.keyword': 'asc' }]` -- **relevance se sort nahi kar rahe, popularity se.** Kyun? `"iph"` ke liye BM25 score lagbhag sab par same hoga (sab ne wahi ek gram match kiya). Asli signal ye hai ki **log kya search karte hain** -- `"iphone 15"` ko `"iphone 15 pro max leather case brown"` se upar hona chahiye. `text.keyword` tie-breaker se order deterministic rehta hai (warna cache mein har baar alag order).
- `_source: ['text', 'type']` -- sirf do fields. Dropdown ko aur kuch nahi chahiye.
- `track_total_hits: false` -- total count ki **bilkul zarurat nahi** hai autocomplete mein. `false` karne se ES counting ka kaam poori tarah skip kar deta hai -- ye ek free optimization hai.
- `{ requestTimeout: 300 }` -- **search ke 1,000 ms se bahut tight.** Kyun? p99 target 100 ms hai. 300 ms se zyada lagne wali suggestion waise bhi bekaar hai -- user aglaa character type kar chuka hoga aur nayi request ja chuki hogi. Jaldi fail karo, resources chhodo.
- `catch` -> **`return []`**, error nahi. PART 8.3 wali baat: autocomplete fail hone se user ka flow nahi tootna chahiye. Dropdown nahi aaya to user Enter dabaa dega. `500` bhejne se browser console mein errors, error-tracking mein noise, aur kuch bhi behtar nahi hota.
- `suggestLatency.observe({ source: 'cache' | 'es' })` -- **`source` label sabse kaam ka hai.** Dashboard par dikhta hai ki kitna traffic cache se ja raha hai aur cache-hit vs ES-hit latency mein kitna farak hai. Cache hit ratio girne par yahi pehla signal deta hai.

**`suggestions_v2` index mein kya hai?** Nightly job `query_popularity` table + top product titles + categories se document banata hai:

```json
{ "text": "iphone 15 case", "type": "query",    "popularity": 184200, "enabled": true }
{ "text": "Apple iPhone 15 (128GB, Blue)", "type": "product", "popularity": 9100, "enabled": true }
{ "text": "electronics/mobiles", "type": "category", "popularity": 42000, "enabled": true }
```

Index chhota hai (~1-2 GB, kuch million rows), isliye **poora page cache mein fit** hota hai -- koi disk I/O nahi, aur yahi p99 < 100 ms ko possible banata hai.

### 7. `workers/outbox-poller.ts` -- Postgres outbox se Kafka tak

```ts
import { pool } from '../infra/postgres';
import { kafkaProducer } from '../infra/kafka';
import { logger } from '../infra/logger';
import { outboxLag, outboxPublished } from '../infra/metrics';

const BATCH_SIZE = 500;
const POLL_INTERVAL_MS = 200;

interface OutboxRow { id: string; product_id: string; op: 'upsert' | 'delete'; version: string; created_at: Date }

async function pollOnce(): Promise<number> {
  const client = await pool.connect();
  try {
    await client.query('BEGIN');

    const { rows } = await client.query<OutboxRow>(
      `SELECT id, product_id, op, version, created_at
         FROM product_outbox
        WHERE published_at IS NULL
        ORDER BY id
        LIMIT $1
        FOR UPDATE SKIP LOCKED`,
      [BATCH_SIZE],
    );

    if (rows.length === 0) {
      await client.query('COMMIT');
      return 0;
    }

    await kafkaProducer.send({
      topic: 'product-changes',
      messages: rows.map((r) => ({
        key: r.product_id,                                   // partition = hash(productId)
        value: JSON.stringify({
          productId: r.product_id,
          op: r.op,
          version: Number(r.version),
          outboxId: r.id,
        }),
      })),
      acks: -1,                                              // all in-sync replicas
    });

    await client.query(
      `UPDATE product_outbox SET published_at = now() WHERE id = ANY($1::bigint[])`,
      [rows.map((r) => r.id)],
    );

    await client.query('COMMIT');

    outboxPublished.inc(rows.length);
    outboxLag.set((Date.now() - rows[0].created_at.getTime()) / 1000);
    return rows.length;
  } catch (err) {
    await client.query('ROLLBACK').catch(() => {});
    logger.error({ err }, 'outbox poll failed');
    return 0;
  } finally {
    client.release();
  }
}

export async function startOutboxPoller(): Promise<void> {
  let stopped = false;
  process.on('SIGTERM', () => { stopped = true; });

  while (!stopped) {
    const published = await pollOnce();
    if (published < BATCH_SIZE) {
      await new Promise((r) => setTimeout(r, POLL_INTERVAL_MS));   // kaam khatam -> saans lo
    }
    // agar poora batch mila -> turant agla batch (backlog catch-up mode)
  }
  logger.info('outbox poller stopped');
}
```

**Code Explanation:**

- `const client = await pool.connect()` -- pool se ek **dedicated connection** liya. Transaction ke liye ye zaroori hai: `BEGIN`, query, `COMMIT` sab **ek hi connection** par hone chahiye. `pool.query()` har call par alag connection de sakta hai -- tab `BEGIN` ek connection par aur `COMMIT` doosre par jaayega, jo bilkul toot jaayega.
- `BEGIN` ... `COMMIT` -- claim aur mark dono ek transaction mein.
- **`FOR UPDATE SKIP LOCKED` -- ye poore poller ka jaadu hai:**
  - `FOR UPDATE` -- "in rows par lock lagao, main inhe update karunga." Doosra koi transaction inhe touch nahi kar sakta jab tak commit na ho.
  - `SKIP LOCKED` -- "jo rows **pehle se locked** hain, unhe chhod do aur agli lo."
  - **Kyun zaroori:** high availability ke liye tum **do (ya teen) poller instances** chalaoge. Bina `SKIP LOCKED` ke:
    - Poller B, poller A ke lock par **wait** karega (blocked) -> effectively sirf ek poller chal raha hai, doosra bekaar khada hai.
    - Ya `NOWAIT` use karo to error aayega aur retry loop banega.
  - `SKIP LOCKED` ke saath: poller A rows 1-500 leta hai, poller B **turant** rows 501-1000 le leta hai. **Koi wait nahi, koi duplicate nahi, linear scaling.** Ye Postgres ka built-in "work queue" pattern hai.
- `ORDER BY id` -- outbox rows ko **insertion order** mein process karo. `id` `BIGSERIAL` hai, yani monotonically increasing. Ye ordering ki pehli layer hai (doosri Kafka key, teesri ES version).
- `LIMIT 500` -- ek baar mein 500. Bahut bada batch (50,000) lambi transaction banata hai, lock lambe time tak rakhta hai, aur crash par zyada kaam dobara karna padta hai.
- `key: r.product_id` -- **Kafka partition key.** Kafka `hash(key) % partitions` se partition chunta hai. Ek product ki saari events **hamesha ek hi partition** mein. Kafka partition ke andar order guarantee karta hai -> product P ke updates sahi order mein consume honge. **Ye line hata do to out-of-order indexing ka darwaza khul jaata hai.**
- `value: JSON.stringify({ productId, op, version, outboxId })` -- **note: poora product data nahi bheja.** Sirf id + version.
  - **Kyun?** (1) Message chhota rehta hai (Kafka throughput), (2) jab tak indexer process kare tab tak product aur update ho chuka ho sakta hai -- indexer **latest** row Postgres se padhega, jo behtar hai, (3) message mein PII/business data nahi jaata.
  - **Trade-off:** indexer ko har batch par Postgres se read karna padega. Par wo ek `WHERE id = ANY($1)` batch query hai (500 rows ek baar mein), to bilkul theek hai.
  - **Alternative:** poora document message mein bhejo (Kafka "event-carried state transfer"). Tab indexer ko DB chahiye hi nahi -- par messages bade, aur stale data ka risk.
- `acks: -1` (ya `'all'`) -- Kafka producer tabhi success maanega jab message **saare in-sync replicas** par likha ja chuke. `acks: 1` (sirf leader) mein leader crash hone par message kho sakta hai -- aur tab wo product **kabhi index nahi hoga** (kyunki outbox row `published_at` set ho chuki hogi). Durability yahan latency se zyada important hai; ye background job hai.
- `UPDATE ... SET published_at = now() WHERE id = ANY($1::bigint[])` -- Kafka par bhejne ke **baad** mark karo. Ek hi `UPDATE` 500 rows ke liye (500 alag updates nahi).
- **`$1::bigint[]` ka cast kyun?** `pg` driver JS array ko Postgres array bhejta hai, par `id` `BIGSERIAL` hai aur JS mein wo **string** ban ke aata hai (kyunki `BIGINT` JS `number` mein safely fit nahi hota). Explicit cast Postgres ko batata hai ki ye strings `bigint` samjhe jaayein.
- **Order bahut important hai: Kafka pehle, `UPDATE` baad mein.** Ulta karo to:
  ```
  UPDATE published_at = now()  [OK]
  COMMIT                        [OK]
  Kafka send ... CRASH          [X]
  -> Row "published" mark ho chuki hai, par Kafka mein gayi hi nahi.
  -> Wo product KABHI index nahi hoga. Permanent divergence -- wahi bimari jisse bachne ke liye outbox banaya tha.
  ```
  Hamare order mein (Kafka pehle) worst case: Kafka par chala gaya par `COMMIT` se pehle crash -> row abhi bhi `published_at IS NULL` -> **agla poll dobara bhejega** -> **duplicate message**. Aur duplicate theek hai (neeche).
- **Isliye ye at-least-once hai, exactly-once nahi:**

  | Kab | Kya hota hai |
  |---|---|
  | Sab theek | Message ek baar |
  | Kafka send ke baad crash | Message **do baar** (agla poll dobara bhejega) |
  | Kafka send fail | Message zero baar... **par row abhi bhi unpublished hai**, agla poll retry karega |

  **Zero baar kabhi permanently nahi hota** -- yahi guarantee chahiye thi. Duplicate ki keemat chukani padti hai, aur wo keemat hai: **indexer ko idempotent hona hi padega.** Uska jawab `version_type: 'external'` hai (agla section).

  > **Interview line:** "Distributed systems mein exactly-once delivery practically possible nahi hai. Main **at-least-once delivery + idempotent consumer** choose karta hoon -- yani effectively-once processing. Yahan idempotency ES ke external versioning se aati hai."
- `if (published < BATCH_SIZE) await sleep(200)` -- **adaptive polling.** Poora batch mila matlab backlog hai -> **turant** agla batch lo (catch-up mode). Aadha batch mila matlab caught up ho -> 200 ms so jao. Ye flash sale (500 updates/sec) par apne aap tez ho jaata hai aur raat ko Postgres ko tang nahi karta.
- `outboxLag.set(...)` -- sabse purani unpublished row kitni purani hai. Ye **poore pipeline ka early warning** hai: ye badhna shuru hua matlab ya Kafka down hai, ya poller mar gaya hai, ya update rate poller se zyada ho gayi hai.
- `process.on('SIGTERM', ...)` + `while (!stopped)` -- **graceful shutdown.** Deploy par Kubernetes `SIGTERM` bhejta hai. Hum current batch poora karke rukte hain. Beech mein mar jaate to `ROLLBACK` hota (rows unpublished rehti, agli baar ho jaati) -- data safe hai, par graceful behtar hai.
- `ROLLBACK().catch(() => {})` -- rollback bhi fail ho sakta hai (connection hi toot gaya). Us error ko swallow karo, warna wo asli error ko chhupa dega.
