### 8. `workers/product-indexer.worker.ts` -- Kafka -> ES bulk

```ts
import { Kafka } from 'kafkajs';
import { esClient } from '../infra/elasticsearch';
import { productRepository } from '../repositories/product.repository';
import { logger } from '../infra/logger';
import { dlq } from '../infra/kafka';
import { bulkErrors, indexerLag, staleSkipped } from '../infra/metrics';
import type { ProductDoc } from '../types/search';

const MAX_DOCS = 500;
const MAX_BYTES = 5 * 1024 * 1024;   // 5 MB
const MAX_WAIT_MS = 1000;

interface ChangeEvent { productId: string; op: 'upsert' | 'delete'; version: number; outboxId: string }

const kafka = new Kafka({ clientId: 'product-indexer', brokers: process.env.KAFKA_BROKERS!.split(',') });
const consumer = kafka.consumer({ groupId: 'product-indexer', sessionTimeout: 30_000 });

export async function startIndexer(): Promise<void> {
  await consumer.connect();
  await consumer.subscribe({ topic: 'product-changes', fromBeginning: false });

  await consumer.run({
    autoCommit: false,                       // manual offset commit
    eachBatchAutoResolve: false,
    eachBatch: async ({ batch, resolveOffset, heartbeat, commitOffsetsIfNecessary, isRunning }) => {
      let buffer: ChangeEvent[] = [];
      let bytes = 0;
      let lastOffset = '';
      let flushedAt = Date.now();

      const flush = async () => {
        if (buffer.length === 0) return;
        await indexBatch(buffer);
        buffer = [];
        bytes = 0;
        flushedAt = Date.now();
        resolveOffset(lastOffset);
        await commitOffsetsIfNecessary();    // ES write ke BAAD commit
        await heartbeat();
      };

      for (const message of batch.messages) {
        if (!isRunning()) break;
        const event = JSON.parse(message.value!.toString()) as ChangeEvent;
        buffer.push(event);
        bytes += message.value!.length;
        lastOffset = message.offset;

        if (buffer.length >= MAX_DOCS || bytes >= MAX_BYTES || Date.now() - flushedAt >= MAX_WAIT_MS) {
          await flush();
        }
      }
      await flush();                          // batch khatam -> bacha hua flush
    },
  });
}
```

**Code Explanation -- consumer setup:**

- `groupId: 'product-indexer'` -- **consumer group.** Kafka 12 partitions ko group ke consumers mein baant deta hai. 3 workers chalao to har ek ko 4 partitions milti hain; 12 workers tak scale kar sakte ho (12 partitions hain, usse zyada worker bekaar baithega). Ek worker mare to Kafka uski partitions baaki mein **rebalance** kar deta hai -- built-in HA.
- `fromBeginning: false` -- naya worker **abhi se** shuru kare, poora 7-din ka history dobara na khaaye.
- **`autoCommit: false`** -- ye sabse important setting hai. Auto-commit ka matlab: kafkajs har kuch second offsets commit karta rehta hai, chahe humne message **process kiya ho ya nahi**. Tab ye ho sakta hai:
  ```
  message read  -> offset auto-commit ho gaya  -> ES bulk call FAIL  -> worker crash
  restart: Kafka "tumne wo offset process kar liya tha" -> wo product KABHI index nahi hoga  [X]
  ```
  Manual commit se hum **ES write ke baad** commit karte hain. Crash hua to offset commit nahi hua -> Kafka wahi messages dobara dega -> **at-least-once processing.**
- `eachBatchAutoResolve: false` -- hum khud `resolveOffset` call karenge, kafkajs apne aap poori batch ko "done" nahi maanega.
- `sessionTimeout: 30_000` -- 30 second tak heartbeat na aaye to Kafka is consumer ko dead maan ke rebalance kar dega. Isiliye `flush()` mein `heartbeat()` call hai -- lambi bulk calls ke dauran Kafka ko batate rehna ki hum zinda hain.

**Code Explanation -- batching (`500 docs / 5 MB / 1 s`):**

- **`MAX_DOCS = 500`** -- per-document indexing 500x zyada HTTP overhead hai. Bulk ek hi request mein 500 operations bhejta hai.
- **`MAX_BYTES = 5 MB`** -- sirf doc count kaafi nahi. 500 products jinki descriptions bahut lambi hain = 50 MB ka request = ES ka `http.max_content_length` (default 100 MB) ke kareeb, memory spike, aur timeout. **Do limits chahiye: count aur size.**
- **`MAX_WAIT_MS = 1000`** -- raat ko traffic kam hai; 500 events jama hone mein 10 minute lag sakte hain. Tab tak wait karoge to `indexer_lag_seconds` 600 ho jaayega aur 30-second requirement toot jaayegi. **1 second ke baad jo bhi hai, bhej do.**
- Teeno limits ek saath: **"500 docs YA 5 MB YA 1 second -- jo pehle aa jaaye."** Ye classic batching triple hai aur har Kafka/queue consumer mein yahi shape hoti hai.
- `resolveOffset(lastOffset)` phir `commitOffsetsIfNecessary()` **`indexBatch` ke baad** -- yahi at-least-once ka core hai. Crash ho to offset wahin ka wahin, messages dobara aayenge.

```ts
async function indexBatch(events: ChangeEvent[]): Promise<void> {
  // ---- 1. Ek productId ke duplicates mein sirf highest version rakho ----
  const latest = new Map<string, ChangeEvent>();
  for (const e of events) {
    const prev = latest.get(e.productId);
    if (!prev || e.version > prev.version) latest.set(e.productId, e);
  }

  const upserts = [...latest.values()].filter((e) => e.op === 'upsert');
  const deletes = [...latest.values()].filter((e) => e.op === 'delete');

  // ---- 2. Postgres se latest rows ----
  const docs: ProductDoc[] = upserts.length
    ? await productRepository.findManyForIndex(upserts.map((e) => e.productId))
    : [];

  // ---- 3. Bulk body banao ----
  const operations: unknown[] = [];

  for (const doc of docs) {
    operations.push({ index: { _index: 'products', _id: doc.productId,
                               version: doc.version, version_type: 'external' } });
    operations.push(doc);
  }
  for (const e of deletes) {
    operations.push({ delete: { _index: 'products', _id: e.productId,
                                version: e.version, version_type: 'external' } });
  }

  if (operations.length === 0) return;

  // ---- 4. Bulk call ----
  const res = await esClient.bulk({ operations, refresh: false });

  // ---- 5. Per-item error handling ----
  if (!res.errors) {
    for (const doc of docs) {
      indexerLag.observe((Date.now() - new Date(doc.updatedAt).getTime()) / 1000);
    }
    return;
  }

  const retryable: unknown[] = [];

  res.items.forEach((item, i) => {
    const op = item.index ?? item.delete;
    if (!op?.error) return;

    const status = op.status;
    const type = op.error.type;

    if (status === 409 || type === 'version_conflict_engine_exception') {
      staleSkipped.inc();                                   // purana event -- ignore
      return;
    }
    if (status === 429 || status >= 500) {
      retryable.push(operations[i * 2], operations[i * 2 + 1]);  // action + doc
      return;
    }
    // 400, 404 (mapping error, malformed doc) -- retry se theek nahi hoga
    bulkErrors.inc({ type });
    logger.error({ id: op._id, status, error: op.error }, 'permanent bulk index error');
    void dlq.send({ topic: 'product-changes-dlq',
                    messages: [{ key: op._id, value: JSON.stringify({ id: op._id, error: op.error }) }] });
  });

  if (retryable.length > 0) {
    await retryWithBackoff(retryable);
  }
}

async function retryWithBackoff(operations: unknown[], attempt = 1): Promise<void> {
  if (attempt > 5) {
    bulkErrors.inc({ type: 'retry_exhausted' });
    throw new Error('bulk retry exhausted');            // offset commit nahi hoga -> Kafka dobara dega
  }
  const delayMs = Math.min(200 * 2 ** attempt, 10_000) + Math.random() * 200;
  await new Promise((r) => setTimeout(r, delayMs));

  const res = await esClient.bulk({ operations, refresh: false });
  if (!res.errors) return;

  const stillFailing: unknown[] = [];
  res.items.forEach((item, i) => {
    const op = item.index ?? item.delete;
    if (op?.error && (op.status === 429 || op.status >= 500)) {
      stillFailing.push(operations[i * 2], operations[i * 2 + 1]);
    }
  });
  if (stillFailing.length > 0) await retryWithBackoff(stillFailing, attempt + 1);
}
```

**Code Explanation:**

- **`latest` Map -- batch ke andar deduplication.** Flash sale mein ek hi product ke 5 price updates 1 second mein aa sakte hain. Sabko ES par bhejne ka koi fayda nahi -- final state to wahi hai. Sirf **highest version** wala rakho. Ye ES par load seedha kam karta hai (500 operations ki jagah shayad 300).
  - `e.version > prev.version` -- comparison version par hai, array order par nahi. Kafka ordering ke bharose mat raho jab tumhare paas explicit version ho.
- `productRepository.findManyForIndex([...ids])` -- ek hi query se saare products (`WHERE id = ANY($1)`). N+1 queries bilkul nahi. Ye function `products` row ko `ProductDoc` mein badalta hai: `price_paise / 100`, `stock_qty > 0 ? true : false`, `status = 'deleted'` ko delete op mein.
- **Bulk body ka shape:** ES bulk NDJSON hai -- **do lines per operation**: pehli line action metadata, doosri line document. `esClient.bulk({ operations: [...] })` mein ye ek flat array hai jahan **even index = action, odd index = document**. (Delete ka sirf ek line hota hai -- code mein ye ek simplification hai; production mein index aur delete ke arrays alag rakhna behtar hai taaki `operations[i * 2]` wali mapping tooti na.)
- **`version: doc.version, version_type: 'external'`** -- **ye poore indexer ki sabse important do lines hain.**
  - `version_type: 'external'` ka matlab: "version main de raha hoon, tu apna internal counter mat use kar."
  - ES rule: naya document tabhi likho jab `incoming version > stored version`. Warna `409 version_conflict_engine_exception`.
  - Isi se indexer **idempotent** ban jaata hai:
    ```
    Same message do baar aaya (at-least-once)?
        pehli baar: version 6 > 0  -> index [OK]
        doosri baar: version 6 > 6? NAHI -> 409 -> ignore [OK]   koi nuksaan nahi

    Purana message baad mein aaya (out of order)?
        version 5 aaya jab stored 6 hai -> 409 -> ignore [OK]   purana data jeet nahi paaya
    ```
  - **Yahi wajah hai ki outbox at-least-once ho ke bhi safe hai.**
- **`refresh: false`** -- bulk ke baad **refresh mat karo.** Default (`false`) hi sahi hai, par explicitly likhna achha hai. `refresh: true` karoge to **har bulk par** naya segment banega -- 58 bulks/sec = 58 segments/sec = segment explosion, merge storm, aur cluster ki latency tabaah. Hum `refresh_interval: 1s` par bharosa karte hain (PART 9b).
  - (`refresh: 'wait_for'` ek beech ka option hai -- next refresh tak wait karta hai. Tab use karo jab caller ko turant read-after-write chahiye. Batch indexer ko nahi chahiye.)
- **`if (!res.errors)`** -- **ye check kabhi mat bhoolo.** `esClient.bulk()` HTTP 200 deta hai chahe **saare 500 documents fail** ho gaye hon! Bulk response mein per-item status hota hai. `res.errors` ek boolean flag hai: "kya kisi bhi item mein error tha?" Iske bina tumhara indexer chup-chaap kuch bhi index nahi karega aur koi alert nahi bajega.
- **Per-item error handling -- teen categories:**

  | Status | Matlab | Action | Kyun |
  |---|---|---|---|
  | **409** `version_conflict` | Stale event (duplicate ya out-of-order) | **Ignore**, metric badhao | Ye "error" nahi, ye **design ke hisaab se sahi** hai. Naya data pehle se ES mein hai. |
  | **429** `es_rejected_execution` | ES ki write queue full | **Retry with backoff** | ES bol raha hai "dheere". Retry karo, par turant nahi -- warna aur bura. |
  | **5xx** | ES node problem, timeout | **Retry with backoff** | Transient ho sakta hai. |
  | **400 / 404** | Mapping conflict, malformed doc, missing index | **DLQ** | Retry se kabhi theek nahi hoga. Ye **code ya data ka bug** hai. |

- `staleSkipped.inc()` -- 409 ko alag metric mein ginte hain. **Ye normal hai** (duplicates hote rehte hain), par agar ye rate suddenly badh jaaye to kuch gadbad hai (poller duplicate bhej raha hai, ya rebalance loop chal raha hai).
- **DLQ (dead letter queue) kyun?** Ek poison message (jaise ek product jiska `attributes` field ES mapping tod raha hai) tumhare poore indexer ko **infinite retry loop** mein daal sakta hai -- aur tab **baaki saare products ka indexing ruk jaayega**. DLQ us ek message ko alag topic par bhej ke pipeline ko chalta rakhta hai. Koi engineer baad mein DLQ dekh ke fix karta hai.
  - `void dlq.send(...)` -- `void` operator batata hai "maine jaan-boojh ke `await` nahi kiya". Linter ka floating-promise warning chup ho jaata hai aur intent clear rehta hai.
- **`retryWithBackoff`:**
  - `Math.min(200 * 2 ** attempt, 10_000)` -- **exponential backoff**: 400 ms, 800 ms, 1.6 s, 3.2 s, 6.4 s, max 10 s par cap. ES overloaded hai -- har retry ke beech zyada time do taaki wo recover kar sake.
  - `+ Math.random() * 200` -- **jitter.** 3 indexer workers ek saath 429 khaayenge aur bina jitter ke teeno exactly 400 ms baad ek saath wapas aayenge -- wahi thundering herd. Random spread se load smooth hota hai.
  - `attempt > 5` -> **throw**. Iska matlab `eachBatch` fail ho jaayega, `commitOffsetsIfNecessary` nahi chalega, aur **Kafka wahi messages dobara dega.** Ye sahi behaviour hai: agar ES 5 retries ke baad bhi nahi le raha, to ye **cluster-level problem** hai, ek message ki nahi. Rukna aur Kafka mein backlog banne dena sahi hai -- Kafka 7 din retention rakhta hai, kuch nahi khoyega. Aur `indexer_lag_seconds` alert baja dega.
  - **Sirf 429/5xx retry hote hain**, 400 nahi. Ek malformed document ko 5 baar retry karna sirf time waste hai.
- `indexerLag.observe((Date.now() - doc.updatedAt) / 1000)` -- **end-to-end lag.** Ye seller ke update se lekar ES mein document pahunchne tak ka poora time hai (outbox + Kafka + batch wait + bulk). Requirement 30 s hai. Ye **ek hi metric** poore write pipeline ki sehat batata hai -- agar SLO dashboard par sirf ek indexing metric rakh sakte ho, to yahi rakho.

### 9. Postgres degraded search -- fallback ka SQL

Jab ES down ho, `search.service.ts` ka `catch` block `productRepository.degradedSearch()` call karta hai. Uske liye Postgres par ek text index chahiye.

**Option A -- `tsvector` + GIN (full-text search):**

```sql
-- Generated column: title + brand ka search vector, Postgres khud maintain karta hai
ALTER TABLE products
  ADD COLUMN search_vector tsvector
  GENERATED ALWAYS AS (
    setweight(to_tsvector('english', coalesce(title, '')), 'A') ||
    setweight(to_tsvector('english', coalesce(brand, '')), 'B')
  ) STORED;

CREATE INDEX products_search_idx ON products USING GIN (search_vector);

-- Fallback query
SELECT id, title, brand, price_paise, rating, (stock_qty > 0) AS in_stock,
       ts_rank(search_vector, plainto_tsquery('english', $1)) AS score
  FROM products
 WHERE status = 'active'
   AND search_vector @@ plainto_tsquery('english', $1)
 ORDER BY score DESC
 LIMIT $2;
```

**Code Explanation:**

- `tsvector` -- Postgres ka apna **inverted index format**: text ko tokens + positions mein todta hai, lowercase karta hai, stop words hata ta hai, aur stem karta hai. Yani ES ke analyzer jaisa hi kaam, chhote paimane par.
- `GENERATED ALWAYS AS (...) STORED` -- **generated column.** Har `INSERT`/`UPDATE` par Postgres khud ye column recalculate karta hai. Trigger likhne ki zarurat nahi, aur koi developer isko update karna bhool nahi sakta.
- `setweight(..., 'A')` / `'B'` -- Postgres mein 4 weights hote hain (A > B > C > D). Title ko `A`, brand ko `B`. `ts_rank` inko alag weight deta hai -- yani ES ke `title^3, brand^2` ka chhota version.
- `coalesce(title, '')` -- `NULL` ko `to_tsvector` mein daalo to poora result `NULL` ho jaata hai (SQL mein `NULL` sab kuch nigal leta hai). `brand` nullable hai, isliye zaroori.
- `USING GIN` -- **Generalized Inverted Index.** Ye `tsvector` ke liye sahi index type hai: har lexeme (stemmed word) ke liye matching rows ki list rakhta hai. `@@` operator isi index se serve hota hai.
  - GIN vs GiST: GIN **search par tez**, build/update par dheera aur bada. Hamare use case (bahut zyada read, fallback par hi) ke liye GIN sahi hai.
- `@@` -- "matches" operator. `search_vector @@ plainto_tsquery(...)`.
- `plainto_tsquery('english', $1)` -- user ki plain string ko tsquery mein badalta hai, **saare words AND karke**. Sabse bada fayda: ye user input ko **safely parse** karta hai. `to_tsquery` ko raw user input dena error de sakta hai (special syntax `&`, `|`, `!` ki wajah se) -- `plainto_tsquery` un sabko literal treat karta hai. **Ye SQL-injection ka issue nahi (`$1` parameterized hai) par syntax-error ka issue zaroor hai.**
- `ts_rank(...)` -- Postgres ki apni ranking. ES ke BM25 se bahut simple hai (koi field-length normalization tuning nahi, koi function score nahi), par degraded mode ke liye kaafi.
- `WHERE status = 'active'` -- deleted/inactive products fallback mein bhi nahi aane chahiye.
- `LIMIT $2` (20) -- **fallback mein kabhi zyada mat maango.** ES down hai, matlab poora search traffic (1,000 QPS) ab Postgres par aa raha hai. Wo Postgres tumhara **source of truth** hai -- usse marna sabse bura outcome hai. Chhota limit, no facets, aur upar rate limit tighten karna.

**Option B -- `pg_trgm` (typo tolerance ke liye):**

```sql
CREATE EXTENSION IF NOT EXISTS pg_trgm;
CREATE INDEX products_title_trgm_idx ON products USING GIN (title gin_trgm_ops);

SELECT id, title, brand, price_paise, rating, (stock_qty > 0) AS in_stock,
       similarity(title, $1) AS score
  FROM products
 WHERE status = 'active'
   AND title % $1                      -- '%' = trigram similarity operator
 ORDER BY score DESC
 LIMIT $2;
```

**Code Explanation:**

- `pg_trgm` -- string ko **3-character ke tukdon (trigrams)** mein todta hai. `"iphone"` -> `[" i", " ip", "iph", "pho", "hon", "one", "ne "]`.
- `similarity(a, b)` -- dono strings ke trigram sets kitne overlap karte hain (0 se 1). `"iphon"` aur `"iphone"` ke trigrams kaafi overlap karte hain -> **typo tolerance mil jaati hai**, jo `tsvector` nahi deta.
- `title % $1` -- `%` operator "similarity threshold se upar hai?" (default 0.3). Ye GIN trigram index se serve hota hai.
- `gin_trgm_ops` -- GIN index ko batata hai ki trigrams index karo, lexemes nahi.
- **Bonus:** `pg_trgm` `ILIKE '%...%'` ko bhi index-backed bana deta hai -- yani Part 1 wali original slow query bhi tez ho jaati hai. **Yahi wajah hai ki chhote catalog (100K products) ke liye ES ki zarurat hi nahi.**

**Kaunsa chunein?** Practically **dono**: `tsvector` normal words ke liye (tez, better ranking), `pg_trgm` tab jab tsvector zero results de (typo). Fallback code mein pehle `tsvector`, khaali aaye to `pg_trgm`.

> **Honest interview point (Part 1 se dohraana):** "Agar catalog 100K products ka hota, to main Elasticsearch lagata hi nahi -- Postgres `tsvector` + GIN + `pg_trgm` kaafi hota, ek kam system operate karna padta. ES tab justify hota hai jab (a) docs 5-10M se upar, (b) facet aggregations chahiye, (c) relevance tuning/typo/synonyms chahiye, (d) search traffic DB ko hurt kar raha ho. Mazedaar baat ye hai ki wahi Postgres search hamara **fallback** ban jaata hai jab ES gir jaaye."

---

### Poora system ek nazar mein

```
READ PATH:
  Browser -> LB -> rate limit -> zod validate -> Redis q:<sha1> (30% hit, 60s TTL)
          -> single-flight guard -> query-builder [PURE] -> ES products (6 shards)
          -> response-mapper [PURE] -> cache set -> JSON
          ES down? -> Postgres tsvector/pg_trgm top 20 -> degraded: true -> phir 503

AUTOCOMPLETE:
  Browser (debounce 150ms) -> Redis sug:<prefix> (75% hit, 600s TTL)
          -> ES suggestions_v2 (edge n-gram, popularity sort) -> fail? -> []

WRITE PATH:
  Seller -> Postgres TX { products UPDATE + product_outbox INSERT }  [ATOMIC]
         -> outbox poller (FOR UPDATE SKIP LOCKED) -> Kafka product-changes (key=productId)
         -> indexer (500/5MB/1s batch) -> ES bulk (version_type: external)
            409 = stale (ignore) | 429/5xx = retry+backoff | 4xx = DLQ
         -> refresh 1s -> searchable (~1-3s end to end)
```

---

## Remember

> **Search ek "derived view" hai, source of truth nahi.** Postgres mein sach likho, **usi transaction mein outbox** likho, aur Kafka + idempotent indexer (`version_type: external`) se ES tak pahuncha do -- dual write hamesha permanent divergence deta hai. Read side par: **jo score nahi karta wo `filter` mein** (cacheable bitset), **text relevance ko multiply karo, replace mat karo**, `page` 50 ke aage `search_after` + tie-breaker, aur ES gir jaaye to **degrade karo, maro mat** (`degraded: true`).
