## PART 19 -- Security

Search ke saath ek khaas baat hai: **tum apne poore catalog par arbitrary user input chala rahe ho**, aur wahi input ek query language mein translate ho raha hai. Soch: **"main is search box se kya kar sakta hoon jo tumne socha nahi tha?"**

| Threat | Defence |
|---|---|
| Doosre seller/tenant ka data dekhna | **Server-side mandatory filters** (client filter par kabhi bharosa nahi) |
| Inactive / deleted products dikhna | Wahi mandatory filter (`status: active`) |
| Query DSL injection | Typed client, kabhi string concat nahi; `query_string` ban |
| Scripting exploit (RCE class) | `script.allowed_types: none` |
| Resource exhaustion | `q` 100 chars, `max_expansions`, `max_buckets`, `max_result_window`, timeouts |
| Price scraping | Per-IP + per-token limits, page cap, WAF |
| ES khula internet par | **Port 9200 kabhi public nahi**, auth + TLS + private subnet |
| PII in query logs | Normalize + scrub before storing |
| Admin endpoints | AuthN + role authz + audit |

### 1. Visibility filters -- har query par, server side

**Ye is system ki #1 security baat hai.** Marketplace mein har product har user ko nahi dikhna chahiye: `deleted`/`inactive` kisi ko nahi; seller dashboard par **sirf uske apne**; region-restricted products; B2B catalog sirf approved buyers ko.

**Galat (aur bahut common):** frontend `?sellerId=me` bhejta hai, backend use `filter` mein daal deta hai. Attacker `?sellerId=<competitor_id>` bhej ke competitor ka poora catalog (inactive drafts, upcoming launches, internal SKUs) dekh lega. Ye **IDOR** hai -- OWASP ka #1 access control bug.

```ts
// src/middleware/visibility.ts
export interface VisibilityContext { mandatoryFilters: Record<string, unknown>[] }

export function visibilityFilter(req: Request, _res: Response, next: NextFunction) {
  const filters: Record<string, unknown>[] = [
    { term: { status: 'active' } },            // har query par, bina exception
  ];
  const ctx = req.auth;                        // JWT se decode hua, client se NAHI

  if (ctx?.role === 'seller' && req.path.startsWith('/api/v1/seller/')) {
    filters.push({ term: { sellerId: ctx.sellerId } });   // token se, query param se nahi
  }
  if (ctx?.role !== 'admin') {
    filters.push({ term: { visibility: 'public' } });
  }
  if (req.geo?.country) {
    filters.push({ bool: { must_not: [{ term: { blockedCountries: req.geo.country } }] } });
  }

  (req as Request & { visibility: VisibilityContext }).visibility = { mandatoryFilters: filters };
  next();
}
```

```ts
// src/search/query-builder.ts
build(req: SearchRequest, visibility: VisibilityContext) {       // visibility = REQUIRED param
  return {
    query: { function_score: {
      query: { bool: {
        must: [this.buildMultiMatch(req.q)],
        filter: [...visibility.mandatoryFilters, ...this.buildUserFilters(req.filters)],
      }},
      functions: [/* popularityScore, inStock boost */],
      score_mode: 'sum', boost_mode: 'multiply',
    }},
  };
}
```

**Code Explanation:**

- `const ctx = req.auth` -- identity **JWT/session se** aati hai jise server ne sign kiya. `req.query.sellerId` se **kabhi nahi**. Ek line ka fark, poore data breach ka fark.
- `{ term: { status: 'active' } }` **sabse pehle, unconditional** -- yahan "default deny" chahiye. Koi bhi naya endpoint jo ye middleware use karega, automatically safe hoga.
- `ctx.sellerId` -- seller ko uska scope **token se** milta hai; woh URL badal ke doosre ka nahi dekh sakta.
- `build(req, visibility)` -- `visibility` **required parameter** hai, optional nahi. Yaani developer bhool hi nahi sakta: bina visibility ke TypeScript compile hi nahi hoga. **Security ko type system se enforce karo, discipline se nahi.**
- Mandatory filters `filter` context mein hain -- performance ke liye bhi sahi (Part 3: cacheable bitsets; `status: active` ka bitset hamesha hot rahega).
- **Test likho:** seller A ke token se seller B ka `sellerId` bhejo aur assert karo 0 results. Ye regression ke against sabse sasta insurance hai.

### 2. Query injection -- ES mein "SQL injection" kaise dikhta hai

```ts
// [X] NEVER -- user input ko JSON string mein concat karna
const body = `{"query":{"match":{"title":"${req.query.q}"}}}`;
```

User bheje `"}},"aggs":{"leak":{"terms":{"field":"sellerId","size":10000` -- ab woh query ka **shape** badal raha hai: aggregations add kar sakta hai, filters hata sakta hai.

```ts
// [OK] src/search/query-builder.ts
buildMultiMatch(q: string) {
  return { multi_match: {
    query: q,                                    // value slot -- kabhi structure nahi ban sakti
    fields: ['title^3', 'brand^2', 'description'],
    type: 'best_fields',
    fuzziness: q.split(/\s+/).length > 5 ? undefined : 'AUTO',
    prefix_length: 1,
    max_expansions: 50,
  }};
}
```

**Code Explanation:**

- `query: q` -- `q` ek **JavaScript string value** hai object ke andar. Client ise `JSON.stringify` karta hai, jo har special character escape kar deta hai. User ka `"}}` sirf literal text ban jaata hai. **Structure user ke haath mein hai hi nahi.**
- `fuzziness: ... > 5 ? undefined : 'AUTO'` -- lambi queries par fuzzy off: security (expansion blowup) aur relevance dono ke liye achha.
- `max_expansions: 50` (spec) -- har fuzzy term max 50 variants. **Hard cost cap.**
- `prefix_length: 1` -- pehla akshar exact. Bina iske fuzzy match term dictionary ke bade hisse ko scan karta hai -- yaani ye performance control **bhi** hai aur DoS control **bhi**.

**`query_string` query user input ke liye kabhi nahi:**

| Problem | Example | Nateeja |
|---|---|---|
| Ye ek query **LANGUAGE** hai, value nahi | `sellerId:secret AND status:deleted` | User **filtering bypass** kar raha hai, fields khud choose kar raha hai |
| Wildcards | `*`, `a*b*c*` | Poora term dictionary scan -- ek request se node down |
| Regex | `/.*(a\|b)*.*/` | Catastrophic backtracking, CPU 100% |
| Fuzzy operator | `term~` baar-baar | Expansion blowup |
| Parse errors | `title:(` | 400s ka flood, kabhi internals leak |

**Safe choice: `multi_match`** (spec ki canonical query) -- user ka input hamesha **value** hai; fields, operators aur boosts **tum** decide karte ho. Power users ko `AND`/`OR` chahiye toh `simple_query_string` (invalid syntax throw nahi karti, `fields` tum fix karte ho) -- par usme bhi wildcards off (`flags: "AND|OR|PHRASE"`).

**Scripting:** `elasticsearch.yml` mein `script.allowed_types: none` (zarurat ho toh `stored` -- **inline NEVER**). User input **kabhi** script source mein mat daalo. Purane ES versions (Groovy/MVEL) mein yahi **RCE** ka raasta tha; Painless sandboxed hai par principle wahi: **user ko code likhne mat do.**

### 3. Resource exhaustion -- layered guards

| Layer | Control | Value | Rokta kya hai |
|---|---|---|---|
| **API (Zod)** | `q` length | **100 chars** (spec) | Fuzzy expansion blowup |
| **API** | `size` | max **100** (spec) | Bada `_source` fetch, heap |
| **API** | `page` | max **50** (spec) | Deep pagination memory |
| **API** | filter array | 10 | 500-clause `bool` |
| **API** | per-IP rate limit | `rl:search:<ip>` | Volume |
| **Query** | `max_expansions` | 50 | Fuzzy term explosion |
| **Query** | `timeout` | `800ms` | Slow shard, runaway query |
| **Index** | `index.max_result_window` | 10,000 (default) | `from + size` blow-up |
| **Cluster** | `search.max_buckets` | 10,000 | Bucket explosion (heap OOM) |
| **Cluster** | `indices.query.bool.max_clause_count` | default | Huge bool queries |
| **Cluster** | circuit breakers (`request` 60%, `total` 70%) | -- | Ek query poora node na giraye |

**`index.max_result_window` ke baare mein:** jab koi bole "page 500 par error, limit badha do" -- **mana karo.** 10,000 se 1,000,000 karne ka matlab ek request 6 shards se 1,000,024 hits coordinating node par la sakti hai. **Ye limit tumhari suraksha hai, tumhara bug nahi.** Sahi jawab: `search_after` (spec ka decision).

```ts
// src/middleware/validate.ts
export function validateSearch(req: Request, res: Response, next: NextFunction) {
  const parsed = searchQuerySchema.safeParse(req.query);
  if (!parsed.success) {
    return res.status(400).json({ code: 'VALIDATION_ERROR',
      details: parsed.error.issues.map((i) => ({ path: i.path.join('.'), message: i.message })) });
  }
  const q = parsed.data.q;
  if (q.length > 40 && q.split(/\s+/).length > 12) {
    return res.status(400).json({ code: 'VALIDATION_ERROR', message: 'query too complex' });
  }
  if (parsed.data.page > 50 && !req.query.searchAfter) {
    return res.status(400).json({ code: 'VALIDATION_ERROR',
      message: 'use searchAfter cursor beyond page 50' });
  }
  (req as Request & { search: SearchRequest }).search = toSearchRequest(parsed.data);
  next();
}
```

**Code Explanation:**

- `safeParse` -- throw nahi karta, `{ success, error }` deta hai, isliye hum apna `400 VALIDATION_ERROR` (spec ka code) bana sakte hain. `i.path` + `i.message` bhejo, **raw Zod error object kabhi nahi** (internal schema leak).
- `q.length > 40 && words > 12` -- length cap ke **upar** ek complexity cap. 100 chars ke andar bhi `a b c d ... m` jaisi 13-term fuzzy query mehengi hai. **Do alag cheezein naapo: size aur shape.**
- `page > 50 && !searchAfter` -> 400, **chupchaap clamp mat karo**. Silent clamping se client bug chhupta hai aur scraper ko pata bhi nahi chalta ki limit lagi.
- `(req as ...).search = toSearchRequest(...)` -- validated, typed object request par rakho; controller ab **kabhi** `req.query` nahi chhuta. Ye "parse, don't validate" pattern hai: ek baar saaf karo, phir poore code mein sirf saaf data ghoome.

### 4. Scraping aur competitor price harvesting

**Stack:** (1) per IP `rl:search:<ip>` token bucket, suggest par alag zyada limit; (2) **per token/account** limit (IP badalna sasta, account mehenga); (3) **global endpoint cap** -- bots kaise bhi bikhre, backend bachta hai; (4) **page cap 50** -- poora catalog nikalne ki cost badha do; (5) **bot signals:** koi `Referer` nahi + data-center ASN + kabhi image/CSS request nahi + perfect timing (insaan 150 ms debounce se type karta hai, bot exactly 1000.0 ms par bhejta hai) + TLS/JA3 fingerprint -> CAPTCHA ya throttle; (6) **honeypot SKUs** jo sirf API se dikhte hain -- competitor ki site par dikh gaye toh pakka proof (legal ke liye kaam ka).

**Honest limit (ye bolna interview mein maturity dikhata hai):**

> **Prices public hain. Jo browser mein dikh sakta hai, woh scrape ho sakta hai.** 10,000 residential proxies, har IP 3 req/min -- koi rate limit ise nahi pakadega kyunki woh normal user se distinguishable hi nahi. **Goal "rokna" nahi; goal ye hai ki scraping ki cost uske fayde se zyada ho jaaye, aur asli users kabhi affected na hon.**

### 5. ES cluster hardening -- "internet par khula Elasticsearch"

Ye industry ka sabse dohraya gaya breach pattern hai. Hazaaron ES clusters internet par **bina auth** khule mile -- millions of records leak, aur "Meow attack" jaise bots ne unhe **delete** hi kar diya. **Kyun hota hai:** purane ES versions mein security **by default OFF** thi; Docker mein `-p 9200:9200`, security group mein `0.0.0.0/0` -- aur poora catalog public.

| Control | Kya |
|---|---|
| **Network** | ES **private subnet** mein. 9200 (HTTP) aur 9300 (transport) sirf app servers se inbound. **Public IP kabhi nahi** |
| **Auth** | Built-in security on; har service ka apna user. `elastic` superuser app mein kabhi use nahi |
| **Authorization** | Search API user -> `read` on `products`/`suggestions` alias. Indexer -> `write` on `products_*`. **Search API ko `DELETE /products` ka access hona hi nahi chahiye** |
| **TLS** | Transport (node-to-node) aur HTTP dono par |
| **Scripting** | `script.allowed_types: none` |
| **Kibana** | SSO/VPN ke peeche -- Dev Tools = poora cluster control |
| **Snapshots** | S3 bucket encrypted + private. Backup leak = index leak |
| **Secrets** | Secret manager se env mein, repo mein kabhi nahi |

```ts
// src/infra/elasticsearch.ts
export const es = new Client({
  node: process.env.ES_NODE,                       // https://es.internal:9200 -- private DNS
  auth: { username: process.env.ES_USERNAME!, password: process.env.ES_PASSWORD! },
  tls: { ca: readFileSync(process.env.ES_CA_PATH!) },
  maxRetries: 2,
  requestTimeout: 1000,
  sniffOnStart: false,                             // spec: sniffing off behind LB
});
```

**Code Explanation:**

- `node` -- **private DNS**, `https`, env se. Hardcoded kabhi nahi.
- `tls: { ca }` -- apna CA verify karo. **`rejectUnauthorized: false` kabhi mat likho** -- woh TLS off karne ke barabar hai (MITM khula).
- `requestTimeout: 1000` (spec) -- search interactive hai; 1 sec se lambi wait ka matlab nahi.
- `sniffOnStart: false` (spec) -- sniffing mein client cluster se node list leke unke **internal IPs** par seedha connect karta hai; LB ke peeche ye tootta hai aur security boundary bhi bypass hoti hai.

### 6. PII in query logs -- scrub before storing

**Problem:** 100M queries/day (~30 GB, spec) warehouse mein saalon rehti hain. Users search box mein **sab kuch** type karte hain: phone number, email, order ID, **credit card number** (galti se), naam, address, sharam wali medical cheezein. Pehle teen **PII**, chautha **PCI** (aur tab tumhara PCI scope poora warehouse ban gaya).

```ts
// src/infra/query-logger.ts
const PATTERNS: Array<[RegExp, string]> = [
  [/\b\d{13,19}\b/g, '[CARD]'],
  [/\b[\w.+-]+@[\w-]+\.[\w.]{2,}\b/gi, '[EMAIL]'],
  [/\b(?:\+?91[\s-]?)?[6-9]\d{9}\b/g, '[PHONE]'],
  [/\b[A-Z]{5}\d{4}[A-Z]\b/g, '[PAN]'],
];

export function scrubQuery(raw: string): { text: string; redacted: boolean } {
  let text = raw;
  for (const [re, tag] of PATTERNS) text = text.replace(re, tag);
  return { text, redacted: text !== raw };
}

export function logSearch(evt: SearchLogEvent) {
  const { text, redacted } = scrubQuery(evt.q);
  queryLogProducer.send({ topic: 'search-queries', messages: [{ value: JSON.stringify({
    q: text, qNormalized: normalize(text), redacted,
    filters: evt.filterSet, resultCount: evt.total, tookMs: evt.tookMs,
    cacheHit: evt.cacheHit, esTookMs: evt.esTook,
    sessionId: evt.sessionId, userSegment: evt.segment, ts: Date.now(),
  }) }] });
}
```

**Code Explanation:**

- `scrubQuery` Kafka par bhejne se **PEHLE** chalta hai. Raw query ek baar warehouse mein gayi toh use retroactively nikalna lagbhag namumkin hai (backups, replicas, downstream jobs). **Scrub at the source.**
- `\b\d{13,19}\b` -- **thoda aggressive** hai (kuch legit product codes bhi pakad sakta hai) aur ye **jaan-boojh kar** hai: false positive = analytics mein ek `[CARD]`; false negative = card number tumhare warehouse mein.
- `redacted: true` ka metric banao -- achanak spike matlab koi naya PII pattern (ya koi integration galat data bhej raha hai).
- `sessionId` **pseudonymous** hai, raw userId nahi. CTR aur refinement chains (PART 20) ke liye session-level linking chahiye, **identity nahi**. `userSegment` (`'new'|'returning'|'prime'`) low cardinality hai aur analytics ke liye kaafi.
- **Retention:** Kafka 7 din (spec), warehouse mein raw queries 90 din, phir sirf **aggregates** (`query_popularity` table) -- unme koi query-to-person link nahi bachta.
- **NAHI log karna:** raw un-scrubbed `q`, full user ID, poora IP (`/24` tak mask), `Authorization` header, cookies.

### 7. Admin endpoints

`POST /api/v1/admin/reindex` aur `/admin/synonyms` (spec) bahut takatwar hain: reindex = ghante bhar ka cluster load + alias swap se poora search badal jaata hai; synonyms = relevance ka seedha control (failure #11).

- **AuthN + AuthZ alag:** login hona kaafi nahi; `role === 'search_admin'` check zaroori.
- **Network:** internal VPN / private ALB -- ye endpoints public internet par kabhi nahi.
- **Audit log:** kisne, kab, purana + naya value. Synonyms ke liye ye **ops ka undo button** hai.
- **Reindex concurrency lock** (Redis) -- do parallel reindex = disk full (failure #10).
- **Confirmation token** destructive ops par: `{ "confirm": "products_v4" }` -- naam manually likhna pade.

> Interview line: "Search security ke teen stambh: pehla, visibility filters **hamesha server side** aur type system se mandatory -- client ka `sellerId` kabhi trust nahi. Doosra, user input kabhi DSL structure nahi ban sakta -- typed client aur `multi_match`, `query_string` **kabhi nahi**, scripting off. Teesra, resource caps har layer par -- `q` 100 chars, page 50, `max_expansions` 50, `max_buckets`, timeouts, circuit breakers. Iske upar cluster private subnet mein auth aur TLS ke saath, aur query logs PII scrub hoke hi Kafka par jaati hain."

## PART 20 -- Observability

Search ke baare mein **chaar** log sawaal poochte hain -- aur chautha wahi hai jo engineers bhool jaate hain:

- **On-call:** "Search healthy hai? Latency budget ke andar?"
- **Indexing owner:** "Data fresh hai? Lag kitna hai?"
- **Support:** "Customer ka product search mein nahi aa raha."
- **Product / Growth:** **"Kya search achhe results de rahi hai?"** -- ye latency wala sawaal **nahi** hai.

Chauthi dimension hi search ko baaki systems se alag banati hai. Ek search system **p99 50 ms** par chal sakta hai aur **poori tarah bekaar** ho sakta hai.

### 1. SLIs -- paanch number jo poori kahani batate hain

| SLI | Target (spec) | Kaise naapein |
|---|---|---|
| **Search p95 / p99** | **< 200 ms / < 400 ms** | `search_latency_seconds` histogram, **API mein** (ES ke `took` se nahi) |
| **Suggest p99** | **< 100 ms** | `suggest_latency_seconds` |
| **Zero-result rate** | **< 5%** (baseline 12%) | `search_zero_results_total / search_requests_total` |
| **Cache hit ratio** | **~30%** | `search_cache_hit_ratio` |
| **Indexer lag** | **p99 <= 30 s** | `indexer_lag_seconds` histogram |

**Do zaroori measurement rules:**

1. **Latency client ke sabse kareeb naapo.** ES ka `took` sirf ES ke andar ka time hai. Budget (spec): Node ~10 ms + network ~5 ms + ES 60-120 ms + aggs 20-40 ms + serialization ~10 ms. `es_query_duration_seconds` aur `search_latency_seconds` **dono** rakho -- unka **antar** batata hai problem ES mein hai ya Node process mein (event loop lag!).
2. **Cached aur uncached alag naapo.** Cache hits (2 ms) ko ES requests (150 ms) ke saath milaoge toh p95 jhoota accha dikhega -- aur cache hit ratio girte hi p95 "achanak" badh jaayega bina kisi asli reason ke. Isiliye spec ke metric mein `cached` label hai.

### 2. Metrics + alert thresholds

| Metric | Type | Labels | Alert |
|---|---|---|---|
| `search_requests_total` | Counter | `sort`, `cached` | Traffic drop > 50% vs pichla hafta = page |
| `search_latency_seconds` | Histogram | `cached` | p95 > 200 ms 10 min = **page**; p99 > 400 ms = page |
| `es_query_duration_seconds` | Histogram | `index` | p99 > 300 ms 10 min = warn |
| `search_zero_results_total` | Counter | -- | Ratio > 8% 30 min = warn; **sudden 2x shift = page** (bad synonym!) |
| `search_cache_hit_ratio` | Gauge | -- | < 15% 15 min = warn (scraper ya cache down) |
| `suggest_latency_seconds` | Histogram | `cached` | p99 > 100 ms 10 min = page |
| `indexer_lag_seconds` | Histogram | -- | p99 > 60 s 5 min = **page** |
| `bulk_index_errors_total` | Counter | `type` | > 0 warn; > 10/s page |
| `es_cluster_status` | Gauge (0/1/2) | -- | 1 for 15 min = warn; **2 (red) = page** |
| `es_jvm_heap_used_percent` | Gauge | `node` | > 80% 10 min = page |
| `search_degraded_total` | Counter | `stage` | `stage="postgres"` > 0 = **page** |
| `outbox_oldest_unpublished_age_seconds` | Gauge | -- | > 120 s = **page** |
| `partial_results_total` | Counter | `index` | > 0 for 2 min = **page** (silent partial!) |

**Page vs warn ka rule:** page tabhi jab **user ko dard ho** ya **data chupchaap galat ja raha ho**. Yellow cluster user ko dard nahi deta -> warn. Silent partial results chupchaap galat data dete hain -> page.

```
# 1. Search p95 (uncached only -- yahi asli latency hai)
histogram_quantile(0.95, sum by (le) (rate(search_latency_seconds_bucket{cached="false"}[5m])))

# 2. Zero-result rate
sum(rate(search_zero_results_total[10m])) / sum(rate(search_requests_total[10m]))

# 3. Cache hit ratio
sum(rate(search_requests_total{cached="true"}[5m])) / sum(rate(search_requests_total[5m]))

# 4. Indexer lag p99 -- SLA metric
histogram_quantile(0.99, sum by (le) (rate(indexer_lag_seconds_bucket[5m])))

# 5. Node overhead = API latency - ES latency (kya Node hi slow hai?)
histogram_quantile(0.95, sum by (le) (rate(search_latency_seconds_bucket{cached="false"}[5m])))
  - histogram_quantile(0.95, sum by (le) (rate(es_query_duration_seconds_bucket[5m])))

# 6. Degraded path abhi chal raha hai
sum by (stage) (increase(search_degraded_total[1m])) > 0

# 7. Slow shard detector -- ek node dusron se slow?
max by (node) (rate(elasticsearch_indices_search_query_time_seconds[5m])
             / rate(elasticsearch_indices_search_query_total[5m]))

# 8. Zero-result ka SUDDEN shift (bad synonym detector)
abs(
  (sum(rate(search_zero_results_total[15m])) / sum(rate(search_requests_total[15m])))
  - (sum(rate(search_zero_results_total[15m] offset 2h)) / sum(rate(search_requests_total[15m] offset 2h)))
) > 0.03
```

**Code Explanation:**

- **#1** `{cached="false"}` ke bina p95 jhoota dikhta hai. `sum by (le)` histogram quantile ke liye mandatory hai (buckets pehle jodo, phir quantile).
- **#4** `histogram_quantile` on lag -- p99 chahiye, average nahi. Average 2 s ho sakta hai jabki 1% products 5 min late hon (jo aksar sabse important hote hain -- flash sale wale).
- **#5** Ye **sabse kaam ki debugging query** hai. Antar achanak badhe toh ES theek hai aur problem **Node** mein hai: event loop lag, GC, serialization, connection pool.
- **#8** `offset 2h` -- aaj ke rate ko 2 ghante pehle se compare karo. **Absolute threshold (> 5%) bad-synonym deploy ko miss kar sakta hai** agar baseline already 4% ho. **Sudden change hi asli signal hai.**

### 3. ES slow log -- kaunsi query slow hai

Metrics batate hain "p99 kharab hai". Slow log batata hai **"ye wali query kharab hai."**

```json
PUT /products_v3/_settings
{
  "index.search.slowlog.threshold.query.warn":  "500ms",
  "index.search.slowlog.threshold.query.info":  "200ms",
  "index.search.slowlog.threshold.fetch.warn":  "200ms",
  "index.search.slowlog.threshold.fetch.info":  "100ms",
  "index.indexing.slowlog.threshold.index.warn": "1s"
}
```

**Code Explanation:**

- **Per-index** settings, **live** (restart nahi chahiye). `suggestions_v2` par bahut sakht rakho (`warn: 100ms`) kyunki uska budget hi 100 ms hai.
- **`query` aur `fetch` alag kyun?** Ye ES ke do phase hain (Lever 6). `query` slow = matching/scoring mehengi (fuzzy expansion, bhaari aggs). `fetch` slow = **document retrieval** slow (bada `_source`, bada `size`, disk). **Do alag problems, do alag fixes.** Sirf "query slow hai" dekhoge toh galat jagah dhoondhoge.
- Slow log ka time **per-shard** hai, poori query ka nahi. 600 ms wali entry matlab **us ek shard** ne 600 ms liye -- aur kyunki query = slowest shard, user ne bhi ~600+ ms dekhe.
- Thresholds itne rakho ki din mein kuch sau lines aayein, hazaaron nahi. Warna koi nahi padhega.

```
[2026-09-18T20:14:03,221][WARN][index.search.slowlog.query] [data-node-3]
[products_v3][4] took[812.4ms], took_millis[812], total_hits[48213 hits],
search_type[QUERY_THEN_FETCH], total_shards[6],
source[{"size":24,"query":{"function_score":{...,"fuzziness":"AUTO"...}},
"aggs":{"brands":{"terms":{"field":"brand","size":10}},...}}]
```

| Field | Batata kya hai |
|---|---|
| `[data-node-3]` | Kaunsa node -- saari slow entries ek hi node se hain toh problem query nahi **node** hai |
| `[products_v3][4]` | Index aur **shard 4** -- shard-level hotspot ka direct proof |
| `took[812.4ms]` | **Sirf is shard ka** time |
| `total_hits[48213]` | Itne docs match hue -- bahut zyada = query broad hai (shayad fuzzy expansion) |
| `source[...]` | **Poori query.** Copy karke `"profile": true` ke saath chalao -- ES batayega kaunsa clause kitna time le raha hai |

### 4. Har search request par kya log karein (aur kya nahi)

```json
{"level":"info","msg":"search",
 "q":"[EMAIL] case","qNormalized":"email case","redacted":true,
 "filters":["brand","priceRange","inStock"],"sort":"relevance","page":1,"size":24,
 "resultCount":1204,"totalIsLowerBound":true,
 "tookMs":143,"esTookMs":98,"cacheHit":false,"degraded":false,"shardsFailed":0,
 "userSegment":"returning","sessionId":"s_9f2c","requestId":"req_7f3a","traceId":"4bf92f..."}
```

| Field | Kyun |
|---|---|
| `q` (scrubbed) | Bina query ke koi search bug reproduce nahi hota |
| `qNormalized` | Analytics grouping isi par ("iPhone Case" = "iphone case") |
| `filters` (**keys only**) | Cardinality control: `["brand"]` chalega, `["brand:Apple"]` nahi |
| `resultCount` | **Zero-result analysis ka dil** |
| `tookMs` vs `esTookMs` | Antar = hamara overhead (PromQL #5 ka per-request version) |
| `cacheHit` | Latency ko sahi bucket mein rakhne ke liye |
| `shardsFailed` | Silent partial (failure #2) |
| `sessionId` | CTR aur refinement chains ke liye -- pseudonymous |

**[X] Kabhi nahi:** raw un-scrubbed `q` (PII/PCI), full user ID, poora IP (`/24` mask karo), `Authorization`/cookies, **poora ES response body** (24 hits x 2 KB = 50 KB per line x 20M/day = **logging system hi gir jaayega**), poora DSL har request par (ye slow log ka kaam hai), filter **values** as metric labels (cardinality explosion -- Rate Limiter Part 4 ka sabak).

**Sampling:** **100% requests Kafka `search-queries` par** (ye analytics ka input hai), lekin **application logs** sirf **1% + har zero-result + har `degraded` + har `shardsFailed > 0`**. Jo interesting hai woh poora, jo normal hai woh sample.

### 5. Search QUALITY -- woh dimension jo sab bhool jaate hain

> **Ek search system jiska p99 50 ms hai aur zero-result rate 30% hai, woh ek fast failure machine hai.**

Latency batati hai search **kaam kar rahi hai**. Quality batati hai search **kaam ki hai**. Spec ka analytics path (`search-queries` -> S3/warehouse -> popularity + synonyms + zero-result reports) exactly isi ke liye hai.

| Quality metric | Kaise | Kya batata hai | Action |
|---|---|---|---|
| **Zero-result rate by query** | `GROUP BY qNormalized WHERE resultCount = 0` | Top 100 queries jinka jawab nahi hai | Har ek dekho (neeche triage) |
| **CTR by position** | Search log + click events, `sessionId` se join | Position 1 ka CTR ~30%, 2 ka ~15% | **Position 1 ka CTR girna = ranking toot rahi hai** -- p99 se pehle ka signal |
| **"Searches with no click"** | Search hua, koi result click nahi | **Results aaye par kaam ke nahi the** | Ye zero-result se **bada** problem hai kyunki dikhta nahi |
| **Query -> refinement chains** | Ek session mein queries ka sequence | `"shoes"` -> `"running shoes"` -> `"nike running shoes"` -> click | Teen koshish lagi = pehli query ki ranking kharab |
| **Reformulation rate** | 3+ queries bina click | Search baar-baar fail kar raha hai | Top offenders manually theek karo |
| **Search -> cart -> order** | Funnel by query | **Business impact** -- leadership yahi samajhti hai | Relevance work ko justify karta hai |

**Zero-result triage -- roz kaam aane wali table:**

| Kahani | Example | Fix |
|---|---|---|
| **Typo** | "ipone case", "samsng" | `fuzziness: AUTO` hai -- kyun nahi laga? Shayad `prefix_length: 1` ne pehla akshar block kiya |
| **Synonym missing** | "cell phone" par 0, "mobile" par 50K | `search_synonyms` mein add -> `_reload_search_analyzers` (**reindex nahi!**) |
| **Product hi nahi hai** | "iphone 19 pro max" | Search ka bug nahi -- **merchandising signal**. "Log aisi cheezein dhoondh rahe hain jo hum bechte nahi" = catalog team ke liye gold |
| **Over-filtering** | "shoes" + price < 100 + 5 star + in stock = 0 | UI: "koi result nahi -- ye filter hataayein?" |
| **Analyzer gap** | "t-shirt" vs "tshirt" vs "t shirt" | Character filter ya synonym |

```mermaid
flowchart LR
    S[Search API] -->|search-queries| K[Kafka] --> W[S3 / warehouse]
    W --> Z[Zero-result report: top 100 failing queries]
    W --> P[query_popularity: searches_30d, ctr]
    Z --> SY[search_synonyms edits by ops]
    SY -->|_reload_search_analyzers| ES[(products_v3)]
    P -->|nightly popularity job| ES
    P --> SUG[(suggestions_v2 weights)]
```

- **Zero-result report -> synonyms:** seconds mein deploy (search-time synonyms). Har hafte 20-30 synonyms add karne se zero-result 12% se 5% tak realistically aata hai.
- **`query_popularity` -> `popularityScore`:** nightly job 30-din ke searches aur CTR se score nikaalta hai, jo `function_score` ke `field_value_factor` mein jaata hai (spec ki query). **Yahi woh loop hai jo search ko har hafte behtar banata hai** -- users hi bata rahe hain kya important hai. Wahi table `suggestions_v2` ki weights bhi feed karti hai.
- **Chetavni:** popularity boost ek **self-fulfilling prophecy** hai -- jo upar hai use zyada click milte hain, isliye woh aur upar jaata hai, aur naye achhe products kabhi upar nahi aate. Isiliye: `log1p` modifier (bade numbers dabata hai), `weight: 0.3` (**text relevance ko multiply karo, replace mat karo**), freshness decay, aur thoda "exploration" (kabhi kabhi naye products ko top 10 mein try karke unka CTR naapo).

```

- Span attributes: `es.index`, `es.took`, `es.shards_failed`, `cache.hit`, `result.count`, `degraded`. **`q` ka raw value span mein mat daalo** -- traces bhi logs jitne leak-prone hain.
- `kafka.produce` **fire and forget** -- query log ka await user ki latency mein nahi aana chahiye.
- "Search slow hai" par trace turant batata hai: ES 168 ms (ES ki problem) ya `response.map` 90 ms (hamari serialization ki problem).

### 8. Ek worked debugging story: "p99 800 se 900 ms ho gaya, raat 8 baje"

Har step ek possibility **kaatta** hai.

**Step 0 -- Kya ye asli hai?** `search_requests_total` dekho. 8 PM peak hour hai (spec: 4x). QPS 250 se 1,000 hua hai toh ye **capacity** ki baat ho sakti hai, kisi bug ki nahi. **Traffic aur latency ka graph hamesha saath dekho.**

**Step 1 -- Sabko ho raha hai ya kuch ko?** p50 vs p99.
- p50 bhi badha (140 -> 400 ms) -> **systemic**: cluster-wide load ya capacity.
- **p50 flat, sirf p99 uda** -> kuch **specific** queries ya kuch **specific node**. GC / slow shard ka classic fingerprint. Maano yahi hua.

**Step 2 -- Hamari taraf ya ES ki?** PromQL #5 (`search_latency p95 - es_query_duration p95`).
- Antar normal (~25 ms) -> **ES ki taraf**. Antar 300 ms ho gaya -> Node ki problem (`nodejs_eventloop_lag_seconds` dekho). Maano normal hai -> ES.

**Step 3 -- Cache toh nahi gira?** `search_cache_hit_ratio` 30% se 12%?
- **Haan** -> ES ka load bina traffic badhe 700 se 880 QPS ho gaya. Poochho **kyun**: Redis down? Ya **scraper** unique queries bhej raha hai (failure #12)? Top talkers per IP dekho.
- **Nahi** -> aage.

**Step 4 -- Cluster health.** `es_cluster_status` yellow/red? **`partial_results_total` zero se upar?** Agar haan -- RED cluster chupchaap aadhe results de raha hai (failure #2). **Yahi asli incident hai, latency toh side effect hai.** Escalate. Maano green hai.

**Step 5 -- Kaunsa node?** PromQL #7.
- Saari 6 lines saath badhi -> cluster-wide load.
- **`data-node-3` 40 ms se 400 ms** -> **ek node** ki problem. Focus wahan.

**Step 6 -- Us node ko kya ho raha hai?** `es_jvm_heap_used_percent{node="data-node-3"}` 60% se 92%?
- **Haan** -> heap pressure (failure #5). Nayi bhaari aggregation deploy hui? Kisi ne `size` badhaya? Bada merge? GC old-gen time dekho.
- **Nahi** -> disk IO / CPU. Bada segment merge? EBS burst credits khatam (cloud ka classic)?

**Step 7 -- Kaunsi query?** `products_v3` ka **slow log**, last 30 min. Saari WARN entries `[data-node-3]` se hain (node ki problem) ya har node se ek hi **shape** ki (query ki problem)?
Maano har node se: `"aggs":{"brands":{"terms":{"field":"brand","size":500}}}`.
Aha -- kisi ne facet `size` 10 (spec ka number) se **500** kar diya. 500 buckets x 6 shards x har request. `data-node-3` sirf sabse pehle gira.

**Step 8 -- Confirm.** Slow log ki query `"profile": true` ke saath chalao -- time ka bada hissa `aggregations` mein, `query` mein nahi. Deploy timeline: 7:50 PM ka deploy. **Time match kar gaya.**

**Step 9 -- Mitigate pehle, fix baad mein.**
- **Turant:** facet `size` wapas 10 (config flag se, poora rollback nahi -- agar ye config hai; warna deploy rollback).
- **Time lage toh:** sale-day degrade ladder -- facets temporarily off.
- **Uske baad:** `search.max_buckets` sakht karo taaki agli baar ES khud reject kare (`circuit_breaking_exception`) bajaye dheere marne ke.
- **Postmortem:** facet `size` validation schema mein cap, aur golden-query latency test CI mein taaki aisi query merge hi na ho.

> **Order: real? -> sabko ya kuch ko? -> hamara ya ES ka? -> cache -> cluster health -> kaunsa node -> kaunsi query -> profile -> mitigate.** Har step ek possibility kaatta hai. Seedha "ES slow hai, nodes add kar do" par mat kood jao -- us raat nodes add karne se ye problem theek **nahi** hoti, sirf mehengi ho jaati.

> Interview line: "Main search ko chaar angle se observe karta hoon: latency (p95/p99, cached aur uncached alag), freshness (`indexer_lag_seconds` aur outbox age), correctness (`_shards.failed`, cluster status, degraded counter), aur **quality** -- zero-result rate, CTR by position, aur 'searches with no click'. Chauthi wali sabse zyada bhooli jaati hai aur sabse zyada revenue se judi hai: search p99 50 ms par bhi bekaar ho sakti hai."

---

## Remember

> **Search mein sawaal "fail open ya fail closed" nahi hai -- sawaal hai "kitna kam de sakte hain": Redis stale -> Postgres top-20 -> 503. Shards data ke liye hain aur replicas QPS ke liye (aur shard count immutable hai, isliye din 1 ka decision hai); autocomplete search se 4x bada hai isliye alag index; ES eventually consistent hai isliye index kabhi paise ya stock ka authority nahi; aur p99 ke saath zero-result rate aur CTR bhi dekho, warna tum ek bahut fast failure machine chala rahe ho.**

## Quick Self-Test

1. Tumhara search p99 theek hai par QPS badhne par latency badh rahi hai. Shards badhaoge ya replicas? Aur agar catalog 130 GB se 400 GB ho jaaye toh kya badlega -- us badlav mein sabse bada constraint kya hai?
2. Cluster YELLOW vs RED -- dono mein user ko exactly kya dikhta hai, aur RED wale case mein woh kaunsa ek metric hai jiske bina tumhe pata hi nahi chalega ki kuch toota hai?
3. `outbox_oldest_unpublished_age_seconds` 400 par hai, lekin Kafka consumer lag 0 hai aur `indexer_lag_seconds` bhi normal. Kya hua hai, aur ye combination itni khatarnak kyun hai?
4. Ek attacker `?q=` ke through `sellerId:competitor_x AND status:deleted` bhejta hai. Kaunsi do design choices ise rokti hain, aur `multi_match` ki jagah `query_string` use karne se exactly kya toot jaata?
5. Search ka p99 120 ms hai, cluster green hai, koi error nahi -- par orders gir rahe hain. Kaunse teen quality metrics dekhoge, aur "searches with no click" ka rate zero-result rate se zyada khatarnak kyun hai?
