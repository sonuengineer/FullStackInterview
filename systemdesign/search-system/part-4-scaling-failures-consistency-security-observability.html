# Search System -- HLD + LLD (Part 4: Scaling -> Failures -> Consistency -> Security -> Observability)

> Is file mein prompt ke **Parts 16-20** hain: scaling (1x se 1000x), failure scenarios, consistency, security, aur observability.
> Part 1-3 ka recap: Part 1 mein numbers nikale (**50M products, ~130 GB index, 6 primary shards x 1 replica, 6 data nodes + 3 dedicated masters, 20M searches/day = 231 QPS avg aur ~1,000 QPS peak, aur autocomplete 80M/day = search se 4x zyada**). Part 2 mein request flow, `GET /api/v1/search` ka contract, Postgres schema (`products` + `product_outbox`), LLD folder structure aur `QueryBuilder` -> ES DSL ka Node.js code likha. Part 3 mein inverted index zero se banaya, **BM25** ki poori calculation ki, query context vs filter context ka rule seekha (`filter` = cacheable bitset), edge n-gram autocomplete choose kiya, indexer ki **concurrency aur ordering** (out-of-order updates) dekhi, aur caching ki saari layers lagayin (`q:<sha1>` TTL 60 s, head queries = traffic ka 30%).
> Ab dekhenge ye search **traffic badhne par, cheezein tootne par, aur attack hone par** kaise behave karta hai. Part 5 mein trade-offs, MVP -> scalable versions, aur follow-up questions aayenge.

**Ek baat pehle se yaad rakho:** Rate Limiter mein sawaal tha "limiter mar jaaye toh API chalti rahe?" -- wahan jawab *fail open vs fail closed* tha. Search mein woh framing kaam nahi karti, kyunki search **khud hi product** hai. Search band = user homepage se aage badh hi nahi sakta = revenue zero. Isliye is part ka har decision ek naye sawaal se nikalta hai:

> **"Poora search nahi de sakte, toh kam se kam kitna de sakte hain?"** -- yaani **degrade, don't die.**

---

## PART 16 -- Scaling: 1x -> 10x -> 100x -> 1000x

Har level par sirf teen sawaal: **sabse pehle kya tootega? usko theek karne ka sasta tareeka kya hai? kya abhi zarurat NAHI hai?**

**Key insight:** search **read-heavy** hai -- 20M searches/day ke saamne sirf 5M updates/day. Isliye URL Shortener wala "cache laga do" trick yahan kaam karta hai (Rate Limiter mein nahi karta tha, kyunki wahan har check ek write tha).

Par ek twist: cache sirf **head queries** par lagta hai. "iphone case" 10,000 baar search hoti hai -- hit. "samsung m31 back cover blue" ek baar -- miss. Zipf: top 1,000 queries = 30% traffic. Yaani **cache ne 30% bachaya, baaki 70% ES ko hi khaana hai.** ES capacity planning se bach nahi sakte.

Doosra twist: **autocomplete search se 4x zyada traffic hai** (80M vs 20M/day). Scaling ki asli kahani yahi hai.

| Level | Products | Searches/day | Avg QPS | Peak (4x) | Index size (1.3x, 2 KB/doc) | Engine |
|---|---|---|---|---|---|---|
| **1x** | 100K | 200K | ~2.3 | ~10 | ~260 MB | **Postgres** `tsvector` + GIN |
| **10x** | 5M | 2M | ~23 | ~95 | ~13 GB | 1 ES node / managed OpenSearch (3 chhote nodes) |
| **100x** (spec) | **50M** | **20M** | **231** | **~1,000** | **~130 GB** | 6 primary x 1 replica, 6 data + 3 master nodes |
| **1000x** | 500M | 200M | ~2,315 | **10,000+** | ~1.3 TB | ~40 primaries, ~25 data nodes, coordinating tier |

> Autocomplete har level par search ka 4x: 100x par 4,000 QPS peak, 1000x par **~40,000 QPS peak**. Isi number ne 100x par alag `suggestions_v2` index aur 1000x par alag cluster force kiya.

---

### 1x -- 100K products, 200K searches/day

```
Browser -> LB -> 1-2 Node.js instances -> Postgres (products + tsvector GIN index)
```

**Honest baat (spec ka decision):** 100K products par **Elasticsearch mat lagao.**

```sql
ALTER TABLE products ADD COLUMN search_tsv tsvector
  GENERATED ALWAYS AS (
    setweight(to_tsvector('english', coalesce(title,'')), 'A') ||
    setweight(to_tsvector('english', coalesce(brand,'')), 'B') ||
    setweight(to_tsvector('english', coalesce(description,'')), 'C')
  ) STORED;

CREATE INDEX products_tsv_idx  ON products USING GIN (search_tsv);
CREATE INDEX products_trgm_idx ON products USING GIN (title gin_trgm_ops);

SELECT id, title, ts_rank(search_tsv, plainto_tsquery('english', $1)) AS rank
FROM products
WHERE search_tsv @@ plainto_tsquery('english', $1) AND status = 'active'
ORDER BY rank DESC LIMIT 20;
```

**Code Explanation:**

- `GENERATED ALWAYS AS ... STORED` -- Postgres khud har insert/update par `tsvector` bana deta hai. Koi pipeline, koi Kafka, koi indexer worker nahi. **Ye 1x ki sabse badi jeet hai**, aur consistency free mein (same transaction).
- `setweight('A'/'B'/'C')` -- title > brand > description. Ye hamare ES ke `["title^3", "brand^2", "description"]` ka chhota bhai hai. `to_tsvector('english', ...)` lowercase + stop words + stemming deta hai (`mobiles` -> `mobil`).
- `GIN (search_tsv)` -- GIN ek **inverted index** hi hai (term -> row ids). Yaani Part 3 mein jo data structure haath se banaya tha, wahi Postgres ke andar hai.
- `gin_trgm_ops` on `title` -- `pg_trgm`, typo tolerance ka sasta version. **Ye index 100x par bhi mat hatao** -- yahi ES-down wala fallback path hai.
- `ts_rank` -- Postgres ka relevance score. BM25 jitna accha nahi (field-length normalization kamzor), par 100K docs par user ko fark nahi dikhta.

**ES kab chahiye (spec ka rule):** (a) docs > ~5-10M, (b) **facet aggregations**, (c) relevance tuning / typo / synonyms, (d) search traffic DB ko hurt kar raha ho. Ek bhi true na ho -> Postgres.

**Sabse pehle kya toota (1x):**

| Kya | Kab | Fix |
|---|---|---|
| `ILIKE '%term%'` | 50K docs ke baad (full table scan) | `tsvector` + GIN |
| Typo par zero results | Din 1 se | `pg_trgm` similarity |
| Facet counts | Pehla "Brand (count)" filter | `GROUP BY brand` -- 100K par theek, 5M par nahi |

**Kya NAHI chahiye:** ES, Kafka, outbox, Redis cache, alias swap, indexer workers.

> Interview line: "1x par ES nahi lagaunga. Postgres `tsvector` + GIN inverted index deta hai, `ts_rank` basic relevance, `pg_trgm` typo tolerance -- bina alag pipeline ke. ES tab aayega jab docs 5-10M cross karein ya facet counts / relevance tuning chahiye."

---

### 10x -- 5M products, ~95 QPS peak

| Area | Kya tootega? | Change | Kyun |
|---|---|---|---|
| **Facet counts** | `GROUP BY brand` 5M rows par 2-4 sec | ES **aggregations** | ES `terms` agg **doc values** (columnar) se chalta hai -- structural fayda, tuning nahi |
| **Relevance** | `ts_rank` mein `k1`/`b` tune nahi hote, business boost nahi | ES **BM25 + `function_score`** | `popularityScore` boost Postgres mein likhna dard hai |
| **Search load on DB** | Search queries OLTP CPU kha rahi hain -- checkout slow | Search alag system mein | Blast radius: search ka load orders ko na maare |
| **Typo / synonyms** | `pg_trgm` scale nahi karta | `synonym_graph` + `fuzziness: AUTO` | Zero-result target < 5% |
| **Consistency** | Ab do systems hain | **Outbox + Kafka** | Dual-write = permanent divergence |

**Cluster shape:** 13 GB index -> **1 primary shard + 1 replica** (25-40 GB rule ke hisaab se 1 hi kaafi). Managed OpenSearch ke **3 chhote nodes** (quorum ke liye). Abhi **dedicated masters nahi** (teeno `master + data`), **alag suggestions index nahi** (`title.ac` sub-field kaafi, 400 QPS), **Redis cache optional** (95 QPS par ES bore ho raha hai).

**Sabse pehle kya toota (10x):** Postgres CPU ka 40% search kha rahi thi -> ES par shift. Facet sidebar 3 sec -> `terms` agg. Nightly reindex se update 10 min late -> outbox + Kafka + bulk indexer (<= 30 s).

**Kya NAHI chahiye:** multiple shards, dedicated masters, coordinating nodes, alag suggest cluster, hot/warm tiers.

> Interview line: "10x par main ES laata hoon -- traffic ki wajah se nahi, **capability** ki wajah se: facets, BM25 tuning, synonyms, typo tolerance. 13 GB ek shard mein fit hai. Sabse bada kaam engine ka nahi, **pipeline** ka hai -- outbox + Kafka, kyunki ab Postgres aur ES do alag jagah hain."

---

### 100x -- 50M products, 1,000 QPS peak (hamara spec)

```mermaid
flowchart TB
    C[Browser: 150ms debounce] --> LB[LB / API Gateway]
    LB --> N1[Search API: Node.js x N stateless]
    N1 --> R[(Redis: q:sha1 60s, sug:prefix 600s)]
    N1 --> ES[ES products_v3: 6 primary x 1 replica]
    N1 --> SG[ES suggestions_v2: small, edge n-gram]
    N1 -. ES down .-> PG[(Postgres pg_trgm: degraded top-20)]
    K[Kafka product-changes: 12 partitions] --> IW[Indexer workers] --> ES
    PG2[(Postgres products + outbox)] --> OP[Outbox poller] --> K
```

**Sizing ka hisaab (ratta nahi, derivation):**

```
50M docs x 2 KB                              = 100 GB raw
x 1.3 (inverted index + doc values + _source) = 130 GB primary data
130 GB / 35 GB per shard = 3.7 -> round up   -> 6 primary shards (~22 GB each)
6 primaries + 6 replicas                     = 12 shards, ~260 GB cluster data
6 data nodes (2 shards each, 64 GB RAM, 31 GB heap) + 3 dedicated masters
```

#### Lever 1: Replicas vs Shards -- sabse zyada galat samjha jaata hai

> **Shards = data volume aur per-query parallelism. Replicas = read throughput (QPS).**

| Badhaoge | Milega | NAHI milega |
|---|---|---|
| **Shards** | Zyada data fit; ek query zyada CPUs par parallel | QPS nahi badhega -- ek query ab **zyada** nodes ko busy karti hai |
| **Replicas** | Zyada QPS (query kisi bhi copy par), HA | Index chhota nahi hoga -- har replica poora data duplicate karta hai |

```
Latency zyada, QPS theek        -> shards badhao
QPS zyada, latency theek        -> replicas badhao
Disk bhar raha / shard > 40 GB  -> shards badhao (+ nodes)
```

Hamare case mein: 1,000 QPS peak, 30% cache ke baad **~700 QPS ES par**, 12 shard copies x ~13 search-thread slots per node -- kaafi hai. **Sale day 4,600 QPS?** -> `PUT /products/_settings {"number_of_replicas": 2}`. Ab 18 copies. Ye **online** hota hai, reindex nahi. Cost: +130 GB disk.

#### Over-sharding -- classic mistake

"Zyada shards = zyada parallel = fast" **galat** hai.

```
6 shards:  coordinating -> 6 parallel -> merge 144 hits -> fetch 24
50 shards: coordinating -> 50 parallel -> merge 1,200 hits -> fetch 24
           = 50 coordination round trips + 50 shards ka apna overhead
```

Har shard ek **alag Lucene index** hai: apni memory, segments, file handles, merge thread. 50 chhote shards par:

- **Coordination cost** query time ka bada hissa kha jaata hai (fan-out + merge).
- **Slowest shard decides** -- 50 mein se koi ek GC pause mein hoga hi. Ye **tail latency amplification** hai: shard ka p99 50 baar roll karoge toh query ka p99 shard ke p99 se bura aayega.
- **IDF distorted** -- BM25 ka `idf` har shard apne local doc counts se nikaalta hai; bahut chhote shards par ek hi term ka score shard-dar-shard alag -> relevance flaky. (Fix `dfs_query_then_fetch` hai, par woh extra round trip hai.)

> **Rule:** shard count woh sabse **chhota** number rakho jisse har shard 25-40 GB ke andar rahe. 130 GB / 35 = 4, headroom ke saath **6**. 50 nahi.

#### Lever 2: Shard sizing + woh constraint jo log bhool jaate hain

- **Target 25-40 GB.** Chhota (< 5 GB) = over-sharding. Bada (> 50 GB) = recovery slow (node gira toh 60 GB network par copy), merges bhaari, hot spot. Hard limit ~2.1B docs/shard (hum 50M par, tension nahi).

> **`number_of_shards` index banne ke baad badla NAHI ja sakta.**

| Operation | Kya | Constraint |
|---|---|---|
| `_split` (6 -> 12/18) | Shards **badhata** hai | Source **read-only**; naya count source ka **multiple** |
| `_shrink` (6 -> 3/1) | Shards **ghatata** hai | Saari shards pehle **ek node** par; naya count source ka **factor** |
| `_reindex` + alias swap | Kuch bhi badlo (shards, mapping, analyzer) | Mehenga -- 130 GB dobara, ghante lagenge |

Isiliye **shard count din 1 par plan karo, 2-3 saal ka growth soch ke.** 2 saal mein 250 GB hoga -> 6 abhi bhi theek. 500 GB hoga -> aaj hi 12-14 lo.

#### Lever 3: Hot / Warm / Cold tiers -- yahan lagte hain ya nahi?

**Kya hai:** **Hot** = fast NVMe, naya data. **Warm** = sasta disk, sirf read. **Cold/Frozen** = S3 se searchable, bahut sasta, bahut slow.

**Kaam kab karta hai:** jab data **time-series** ho aur purana kam padha jaaye.

**Hamare products index par? Mostly NAHI.** 2019 ka product 2024 ke jitna hi searchable hona chahiye -- "iphone case" ko poore catalog par chalna hai. Purane docs slow disk par = **har query slow**. Aur `products_v3` time-partitioned hai hi nahi.

**Haan kahan lagta hai:** **query-log indices** (spec ka `search-queries` -> analytics path). ILM policy se:

```
search-logs-2026.09.18   -> hot   (aaj ka, dashboards live)
search-logs-2026.09.0*   -> warm  (7-30 din)
search-logs-2026.0[1-8]* -> cold  (90+ din, quarterly report)
```

> **Anchor:** hot/warm/cold **time-based data** ka tool hai, **catalog data** ka nahi.

#### Lever 4: Dedicated masters aur quorum

**Master** data nahi dhoondhta -- woh **cluster state** sambhalta hai: kaunsi index, kaunsa shard kahan, mapping kya, alias kahan point kar raha hai.

**Dedicated kyun?** Master ka role data node par ho toh ek bhaari aggregation us node ko GC pause mein daal degi -> master "gayab" -> re-election -> **indexing aur shard allocation ruk jaayegi**. Ek bhaari query se poora cluster hilna acceptable nahi. Isliye **3 chhote dedicated masters** (8-16 GB RAM, na data na query).

```
minimum required = (n / 2) + 1
n = 1 -> 1   (koi HA nahi)
n = 2 -> 2   (SABSE KHARAB: ek gaya = quorum gaya. 2 nodes 1 se BURE hain)
n = 3 -> 2   [OK] ek gir sakta hai
n = 5 -> 3   bade clusters (50+ nodes)
```

**Kyun (n/2)+1?** Partition ho gaya: `A | B,C`. Agar dono side apna master chun lein toh **split brain** -- do cluster states, ek hi shard par dono taraf writes, permanent divergence. Quorum rokta hai: A akela hai (1 < 2), master nahi chun sakta, **read-only** ho jaata hai. B,C ke paas 2 hain -> chalte rehte hain. **Majority hi jeet sakta hai, isliye do masters ban hi nahi sakte.**

> **Even number master-eligible nodes kabhi mat rakho.** 4 ka quorum bhi 3 hai -- extra HA nahi, sirf extra bill.

#### Lever 5: Routing (`_routing`) -- ek query, ek shard

**Default:** `shard = hash(_id) % 6`, query **saari 6 shards** par. **`_routing` ke saath** tum batate ho doc kahan jaaye:

```json
PUT /products_v3/_doc/p_123?routing=seller_8891
{ "productId": "p_123", "sellerId": "seller_8891", "title": "..." }
```

```json
GET /products/_search?routing=seller_8891
{ "query": { "bool": { "filter": [{ "term": { "sellerId": "seller_8891" }}] } } }
```

Ab query **1 shard** par -> 6x kam kaam per query -> cluster ki QPS capacity ~6x.

**Kab helpful:** jab query **hamesha** ek tenant ke andar ho.

- [OK] **Multi-tenant marketplace ka seller dashboard** -- "mere 4,000 products mein 'blue shirt' dhoondo". 20,000 sellers, har koi sirf apna data. Perfect fit.
- [X] **Buyer search** -- "iphone case" 20,000 sellers mein dhoondhna hai. Routing lag hi nahi sakta.

**Hot shard ka risk:** `hash(routingValue) % 6`. Ek mega seller ke 4M products ek hi shard par baith jaayenge:

```
shard 0: 22 GB  shard 1: 22 GB  shard 2: 22 GB
shard 3: 22 GB  shard 4: 22 GB  shard 5: 68 GB  <-- mega seller
```

Us node par disk, heap, latency, merges -- sab kharab. Aur **fix mushkil** hai: rebalance se kuch nahi hoga, data ek hi shard ka hai. **Mitigation:** bade tenants ke liye `routing_partition_size` (tenant ka data N shards mein bikhre, query N par jaaye, 6 par nahi), ya mega-sellers ko alag index.

> **Rule:** routing tab lagao jab tenants **chhote aur ek jaise** hon. Ek whale tenant poori strategy ko zeher bana deta hai.

#### Lever 6: Coordinating-only nodes

```
QUERY phase: coordinating -> saari shards "top 24 ids + scores do" -> har shard local top 24
FETCH phase: coordinating 144 hits merge -> global top 24 -> un docs ka _source maango -> response
```

**Coordinating node** wahi hai jisne request receive ki -- by default koi bhi data node. Uska kaam CPU + heap khata hai: merge, sort, **aggregations ka final reduce** (facet counts!), JSON serialization.

**Problem:** 1,000 QPS x 3 facet aggs ka reduce usi node par ho raha hai jo Lucene search bhi chala raha hai. Ek bhaari reduce us node ka heap kha jaata hai -> GC pause -> us node ki saari shards slow -> p99 spike.

**Fix:** 2-3 **coordinating-only nodes** (`node.roles: []`). Data nodes sirf Lucene search karein, merge alag machine par. **Blast radius** kam. Ye ek ES-aware smart load balancer hai.

**Kab NAHI:** 100x par (6 data nodes, 1,000 QPS) abhi zarurat nahi -- ye **1000x ka lever** hai. Jaldi lagana = 2 extra nodes ka bill bina fayde ke.

#### Lever 7: Caching ki paratein -- 30% head queries

Cheapest query woh hai jo **chali hi nahi**.

| Tier | Kahan | Kya | TTL | Hit |
|---|---|---|---|---|
| **1. Redis query cache** | Hamara code | `q:<sha1(normQuery+filters+sort+page)>` -> poora `SearchResponse` | 60 s | **~30%** |
| **2. Redis prefix cache** | Hamara code | `sug:<prefix>` -> top 10 suggestions | 600 s | **~60-70%** |
| **3. ES node query cache** | ES (auto) | `filter` context ke **bitsets** (`brand:Apple`, `inStock:true`) | LRU, heap ka 10% | -- |
| **4. ES shard request cache** | ES | `size: 0` wali pure-aggregation requests ka result | refresh tak | -- |

```
1,000 QPS peak - 30% Redis hit (~2 ms) = 700 QPS ES tak
```

Yaani cache ne cluster ka ~30% kaam bachaya -- lagbhag **2 data nodes ka bill**. Cache "nice to have" nahi, **capacity plan ka hissa** hai.

**Tier 3 kyun kaam karta hai (Part 3 ka rule):** `filter` score nahi banata, isliye ES uska result **bitset** (har doc ke liye 1 bit) mein cache kar sakta hai. `brand: Apple` ka bitset ek baar bana, har `iphone case + Apple` query usko reuse karti hai. **Isiliye** rule tha: jo score mein contribute nahi karti, usse `filter` mein daalo. Woh theory nahi thi -- woh ek cache hit hai.

**Honest limit:** **personalization cache ko maar deti hai** (cache key mein userId -> hit ~0%). Isiliye spec mein personalization v1 mein nahi. Cache sirf **page 1** ka. Aur TTL 60 s = price change cached queries par 60 s late dikh sakta hai (PART 18).

#### Lever 8: Autocomplete ko alag karo -- 100x ka sabse bada decision

```
Search:       20M/day ->  231 QPS avg,  ~1,000 QPS peak
Autocomplete: 80M/day ->  925 QPS avg,  ~4,000 QPS peak    <-- 4x zyada
```

**Ek hi index par chalein toh?** Har suggest request 6 shards jagati hai -- 4,000 x 6 = **24,000 shard ops/sec** sirf autocomplete ke liye. Autocomplete ka p99 budget **100 ms** hai, search ka 400 ms -- dono ek hi thread pool mein compete karenge, aur autocomplete apne volume se search ko bhookha maar dega.

| | `products_v3` | `suggestions_v2` |
|---|---|---|
| Docs | 50M products | ~2-5M (popular queries + titles + categories) |
| Size | ~130 GB | **~2-4 GB** -- OS page cache mein poora fit |
| Fields | 15+, `_source` stored | `text`, `type`, `weight` -- bas |
| Query | `multi_match` + fuzzy + aggs + `function_score` | `match` on edge n-gram, sort by weight |
| Shards | 6 | **1-2** |
| Budget | p95 200 ms | **p99 100 ms** |

Uske aage **Redis `sug:<prefix>`** (top ~10K prefixes, TTL 600 s) -- 4,000 QPS ka bada hissa ES tak pahunchta hi nahi.

**1000x par next step:** `suggestions` apne **alag cluster** par. Kyun? Failure domains alag: **suggest cluster gire toh search chalti rahe** -- UI bas suggestions band kar de, user phir bhi Enter dabake search kar sakta hai. Ye degradation user ko mushkil se dikhega.

> Interview line: "Sabse counter-intuitive number: autocomplete search se 4x zyada traffic laata hai -- 80M vs 20M/day. Isliye main use kabhi main index par nahi chalata. Ek chhota `suggestions_v2` jo RAM mein fit ho, uske aage Redis prefix cache, aur 1000x par poora alag cluster taaki uska failure search ko na le doobe."

#### Sale-day playbook (20x = ~4,600 QPS)

Sale **predictable** hai -- date pata hai. Ye reactive nahi, **pre-planned checklist** hai. T = sale start.

| Kab | Kya | Kyun |
|---|---|---|
| **T-7 din** | `number_of_replicas: 1 -> 2` + extra data nodes | Replica = QPS capacity. Shards **nahi** badha sakte (immutable) -- isliye ye pehle se socha hona chahiye |
| **T-2 din** | `_reindex` / mapping migrations **freeze** | Merge + IO kha jaata hai; sale ke beech alias swap = risk without upside |
| **T-1 din** | Popularity job, synonym updates, analyzer reload -- sab ab | Analyzer change = reindex (spec ka rule). Sale mein bilkul nahi |
| **T-2 ghante** | **Cache pre-warm:** top 5,000 queries background script se hit karo | Cold cache + 4,600 QPS = sab ek saath ES par. Warm cache = pehle minute se 30% saved |
| **T-2 ghante** | `refresh_interval: 1s -> 30s` | Refresh = naya Lucene segment. 500 updates/sec par 1s = segment churn + merge storm. Keemat: naya product 30-60 s mein dikhega -- sale par acceptable |
| **T-1 ghanta** | Non-critical Kafka consumers **pause** (re-embedding, image jobs, analytics backfill) | Bulk indexing aur search CPU ke liye ladte hain |
| **T-1 ghanta** | API autoscale min instances badhao; ES `requestTimeout` **mat** badhao | Timeout badhana = slow queries ko jam hone dena. Fast fail better |
| **T-0** | **Degradation switches ready** (neeche ladder), `size` cap 24, `page` cap 20 | Facets query cost ka 20-40% hain -- search bachane ke liye **facets sabse pehle giro** |
| **T+** | Watch: heap %, search p99, `indexer_lag_seconds`, cache hit ratio | Chaar number, ek screen |
| **T+2 din** | `refresh_interval` wapas 1s, replicas wapas 1, jobs resume, scale down | Bhoolna = mehenga bill + stale search |

**Degrade ladder sale par (sabse pehle kya chhodo):**

```
1. Facet counts off        -> ES cost -20-40%, filter counts nahi dikhte
2. Fuzziness off           -> ES cost -10-20%, typo tolerance jaata hai
3. track_total_hits: false -> "10,000+" bhi nahi
4. Page cap 20 -> 5        -> deep pagination band
5. Cache TTL 60s -> 300s   -> thoda purana result chalega
6. Postgres degraded top-20 (PART 17)
```

**Sabse pehle kya toota (100x):**

| Kya | Symptom | Fix |
|---|---|---|
| Facet aggregations | p99 400 ms cross | Facet `size: 10` cap, sale par off |
| JVM heap | heap > 80%, GC pauses | Heap **31 GB se upar kabhi nahi**; agg cardinality kam |
| Coordinating load | Ek data node ka CPU double | Coordinating-only nodes |
| Deep pagination | Page 500 par `max_result_window` error / OOM | `page <= 50` + `search_after` |
| Autocomplete | Suggest p99 300 ms, search bhi slow | Alag `suggestions_v2` + Redis prefix cache |

> Interview line: "100x par 130 GB 6 shards par baithta hai, aur 1,000 QPS peak Redis ke 30% head-query cache ke baad ~700 QPS ban jaata hai. QPS badhaana ho toh replicas, data badhe toh shards -- aur shard count immutable hai isliye woh din 1 ka decision hai."

---

### 1000x -- 500M products, 10,000+ QPS peak

| Bottleneck | Kyun | Kya karunga |
|---|---|---|
| **Index size** | 500M x 2 KB x 1.3 = **~1.3 TB** | 1.3 TB / 35 = **~40 primary shards**, ~25 data nodes |
| **Query fan-out** | Ek query ab **40 shards** par -> coordination + tail amplification | **Index partitioning:** `products_electronics`, `products_fashion`... alias `products` ke peeche. User aksar category ke andar hai -> query 6 shards par, 40 nahi |
| **Coordinating load** | Merge + agg reduce data nodes ko maar rahe hain | **4-6 coordinating-only nodes**, LB unhi ko hit kare |
| **QPS** | 10,000 peak, cache ke baad ~7,000 ES par | Replicas 2-3 + zyada data nodes. Linear, bas mehenga |
| **Autocomplete** | 40,000 QPS peak | **Alag cluster** + Redis cluster prefix cache |
| **Indexing** | 50M updates/day, flash sale 5,000/sec | Kafka partitions 12 -> 48; `refresh_interval: 5s` default (1s ka cost 40 shards par bahut) |
| **Global users** | Ek region = 150-250 ms cross-region | **Multi-region read clusters**, Kafka se feed |
| **Cost** | ~25 data nodes x 64 GB + replicas | Frozen tier (searchable snapshot S3) discontinued products ke liye; `best_compression`; `description` ko `index: false` karke DB se serve |
| **Relevance** | 500M docs par BM25 akela kaafi nahi | **LTR** (BM25 se top 500 -> ML re-rank) + **vector/kNN hybrid** -- spec ne inhe v3 kaha tha, yahan aate hain |

```
              Postgres primary (single writer, source of truth)
                        | outbox -> Kafka (multi-region replicated)
          /                       |                       \
    IN indexer              US indexer              EU indexer
    ES cluster IN           ES cluster US           ES cluster EU
    IN users                US users                EU users
```

Har region **read-only** search apne local cluster se -> latency ~50 ms. Writes ek jagah, isliye "do jagah alag price" wala problem nahi. Trade-off: **indexing lag per region** alag hai; ek region ka indexer atka toh sirf wahan purana data -- aur ye debug karna mushkil hai ("mujhe dikh raha hai, aapko nahi"). `indexer_lag_seconds{region}` label mandatory ho jaata hai.

**Sabse pehle kya toota (1000x):**

| Kya | Symptom | Fix |
|---|---|---|
| Query fan-out | p99 800 ms, par har shard ka apna time 40 ms | Category-wise index partitioning |
| Cluster state | 3,200 shards; master slow, allocation minutes leti hai | Shard discipline, ILM, `_shrink` purane indices |
| Cost | Bill 3x expected | Frozen tier, compression, bade fields hatao |
| Relevance | Zero-result wapas 8% (long tail) | Hybrid: BM25 + vector kNN, RRF se merge |

> Interview line: "1000x par ek query ka 40-shard fan-out hi bottleneck ban jaata hai -- shards badhana ab **madad nahi, nuksaan** karta hai. Isliye index ko category-wise partition karta hoon aliases ke peeche, coordinating-only tier lagata hoon, autocomplete alag cluster par, aur multi-region read clusters Kafka se feed karta hoon."

### Har scaling tool -- kab, kab nahi

| Tool | Kab | Kab NAHI |
|---|---|---|
| **Postgres FTS (`tsvector` + GIN)** | 1x, aur 100x par **fallback path** ke roop mein hamesha | Jab facets / tuning / 5M+ docs chahiye |
| **Elasticsearch** | 10x se | 100K products wali site |
| **More replicas** | QPS badhe (sale day) | Data badhne par |
| **More shards** | Data badhe / shard 40 GB cross kare | QPS ke liye -- over-sharding latency badhata hai |
| **3 dedicated masters** | 100x se (6+ data nodes) | 3-node dev cluster |
| **Coordinating-only nodes** | 1000x, ya bhaari aggregations par | 100x par -- overkill |
| **Routing (`_routing`)** | Seller dashboard (per-tenant) | Buyer search; ya jab whale tenant ho |
| **Hot/warm/cold + ILM** | Query-log indices | `products` index |
| **Redis query cache** | 100x se (30% bachata hai) | Jab personalization on ho |

| **Alag suggest cluster** | 1000x | Pehle |
| **Multi-region clusters** | 1000x / global users | Ek desh ka marketplace |

## PART 17 -- Failure Scenarios (interviewer style)

Format: **Problem -> Impact -> Solution**, aur har ek mein **user ko kya dikhta hai**.

> **Rate Limiter mein hum poochte the "fail open ya fail closed?" -- yahan woh sawaal galat hai. Search ka jawab hai: DEGRADE, DON'T DIE.** Poora search nahi de sakte toh aadha do; aadha nahi toh stale do; woh bhi nahi toh 503 -- **usi order mein**.

```
Failure                     Search chalti hai?  User ko kya dikhta hai
ES cluster YELLOW           Haan (normal)       Kuch nahi
ES cluster RED              Partial             ~1/6 results gayab, CHUPCHAAP
Ek data node mara           Haan                Kuch nahi (replica promote)
Poora ES cluster gaya       Degraded            Top 20, no facets, banner
JVM heap / GC               Slow                p99 spike, lamba "loading..."
Ek slow shard               Partial / slow      Kam results ya slow page
Indexer peeche (Kafka lag)  Haan                Purana price / stock
Outbox poller atka          Haan                Naya product dikhta hi nahi
Bad mapping deploy          Haan                Naye/edited products missing
Reindex ne disk bhari       Read-only           Naya kuch index nahi hota
Bad synonym / analyzer      Haan                Bakwaas results (sabse khatarnak)
Scraper hammering           Slow sabke liye     429 usko, latency sabko
Query of death              Ek node struggle    Us node ki saari queries slow
Master election issue       Partial             Cluster changes ruk jaate hain
```

### 1. "Cluster YELLOW ho gaya -- panic karun?"

- **Problem:** `"status": "yellow"` -- **saari primaries assigned hain, kam se kam ek replica unassigned hai.**
- **Impact:** **Data loss zero, search poori tarah kaam kar rahi hai. User ko kuch nahi dikhta.** Do risks: (a) ab us shard ki ek hi copy -- woh node bhi gaya toh **RED**; (b) us shard ka read throughput aadha.
- **Common causes:** ek data node abhi restart hua; naya index `replicas: 1` ke saath par cluster mein ek hi node (ES ek shard aur uski replica **kabhi** ek node par nahi rakhta); disk **high watermark (90%)** cross -> allocation band.
- **Solution:** `GET /_cluster/allocation/explain` -- ye API **seedha batati hai** shard allocate kyun nahi ho rahi. Guess mat karo. Node wapas aaya toh khud green (22 GB shard copy hone mein minutes). Alert: **yellow > 15 min = warn** (page nahi).

### 2. "Cluster RED ho gaya"

- **Problem:** kam se kam ek **PRIMARY** shard assigned nahi hai.
- **Impact:** us shard ka data search mein hai hi nahi. Aur khatarnak baat: **query fail nahi hoti.** ES baaki 5 shards se results laata hai aur 200 OK deta hai, `_shards: { total: 6, successful: 5, failed: 1 }`.
  - User ko dikhega: 8,300 results (10,000 ki jagah). **Woh kabhi nahi jaanega ki 1/6 catalog gayab hai.** Ye **silent partial failure** hai -- outage se bura, kyunki koi alarm nahi bajta.
- **Solution -- `_shards.failed` har response par check karo:**

```ts
// src/repositories/es.repository.ts
const res = await this.es.search<ProductDoc>({ index: 'products', ...body });

if (res._shards.failed > 0) {
  partialResultsTotal.inc({ index: 'products' }, res._shards.failed);
  logger.warn(
    { failed: res._shards.failed, total: res._shards.total,
      reasons: res._shards.failures?.slice(0, 2).map((f) => f.reason?.type) },
    'partial search results -- some shards did not answer',
  );
}
```

**Code Explanation:**

- `res._shards.failed > 0` -- ES ne 200 diya, par kuch shards ne jawab nahi diya. **Ye check na ho toh RED cluster chupchaap aadhe results deta rahega.** Yahi RED ka asli detector hai (cluster-health polling se bhi jaldi).
- `.slice(0, 2)` -- sirf pehle 2 reasons log karo; 1,000 QPS par poora failures array logging pipeline hi gira dega. `f.reason?.type` (`no_shard_available_action_exception`, `circuit_breaking_exception`) batata hai RED hai ya slow shard ya heap.
- Alert: `rate(partial_results_total[5m]) > 0 for 2m` = **page**. Chaaho toh response mein `degraded: true` bhi bhejo.

  **Recovery:** RED aksar matlab primary **aur** replica dono gaye. Options: node wapas laao, snapshot restore, ya **Postgres se reindex** -- kyunki **ES hamara source of truth nahi hai, worst case mein poora index dobara bana sakte hain.** 50M docs ka full reindex kuch ghante, data loss zero.

### 3. "Ek data node mar gaya"

- **Problem:** 6 mein se ek node crash / AZ issue.
- **Impact:** us node ki 2 shards ki replicas doosre nodes par **seconds mein promote**. Cluster **yellow**. Search chalti rehti hai, **user ko kuch nahi dikhta.** Baaki 5 nodes par 20% zyada load -- p99 thoda badhega.
- **Solution:**
  - `index.unassigned.node_left.delayed_timeout: 5m` (default 1m) -- ES turant 22 GB shards copy na kare. Node 5 min mein wapas aa gaya (restart/deploy) toh poora network storm bach gaya. **Ye ek setting bahut saare "cluster slow ho gaya" incidents rokti hai.**
  - `cluster.routing.allocation.awareness.attributes: zone` -- primary aur replica **alag AZ** mein.
  - Capacity: 6 nodes ko **5 nodes ka load** jhelne layak rakho (peak par ~80% se upar mat jao).

### 4. "Poora ES cluster unreachable hai" -- degrade ladder

- **Problem:** bad config push, network ACL, provider outage, ya saari nodes OOM.
- **Impact:** kuch na karein toh **search feature poora gayab** = revenue zero. Ye system ka worst case hai.

```
Step 0: ES query -------> fail
Step 1: Redis stale cache -> head queries ka purana result (30% queries yahin nikal jaati hain)
Step 2: Postgres pg_trgm --> degraded top-20, BINA facets, degraded: true + UI banner
Step 3: 503 SEARCH_UNAVAILABLE
```

```ts
// src/services/search.service.ts
async search(req: SearchRequest): Promise<SearchResponse> {
  const key = cacheKey(req);
  const fresh = await this.cache.get(key);
  if (fresh) return { ...fresh, tookMs: 1 };

  try {
    const res = await this.esRepo.search(req);
    await this.cache.set(key, res, 60);
    await this.cache.set(`stale:${key}`, res, 900);   // 15 min ka lifeboat
    return res;
  } catch (err) {
    searchDegradedTotal.inc({ stage: 'es_failed' });
    this.logger.error({ err: String(err) }, 'es search failed, degrading');

    const stale = await this.cache.get(`stale:${key}`);            // STEP 1
    if (stale) {
      searchDegradedTotal.inc({ stage: 'stale_cache' });
      return { ...stale, degraded: true };
    }
    try {                                                           // STEP 2
      const rows = await this.productRepo.degradedSearch(req.q, 20);
      searchDegradedTotal.inc({ stage: 'postgres' });
      return { hits: rows, total: rows.length, totalIsLowerBound: true,
               facets: { brands: [], categories: [], priceRanges: [] },
               tookMs: 0, degraded: true };
    } catch {                                                       // STEP 3
      searchDegradedTotal.inc({ stage: 'failed' });
      throw new ServiceUnavailableError('SEARCH_UNAVAILABLE');
    }
  }
}
```

**Code Explanation:**

- `cache.set('stale:' + key, res, 900)` -- **yahi trick hai.** Har successful search do jagah likhti hai: 60 s "fresh" copy, aur **15 min "stale" copy**. Normal din mein stale kabhi padhi hi nahi jaati; ES gira toh yahi lifeboat hai. Cost: ~2x Redis memory -- sasta insurance.
- `catch (err)` -- **retry nahi kar rahe**; ES client already `maxRetries: 2` karta hai. Service layer par aur retry = user 3 sec wait karega bina fayde ke.
- `searchDegradedTotal.inc({ stage })` -- spec ka `search_degraded_total`, `stage` label ke saath. Batata hai ladder ki **kaunsi seedhi** use hui. Alert: `stage="postgres"` > 0 = **page**.
- `degraded: true` -- API contract mein pehle se hai. UI banner dikhata hai: "Search limited mode mein hai."
- `degradedSearch(q, 20)` -- `pg_trgm` query, `LIMIT 20`, **bina facets** (`GROUP BY` 50M rows par Postgres ko maar dega) aur **bina pagination**. `facets: { brands: [], ... }` -- khaali arrays, `undefined` nahi (frontend crash na ho). `totalIsLowerBound: true` -- "20 results" mat bolo, "20+" bolo.
- `throw ServiceUnavailableError` -- **503, khaali list nahi.** Khaali list ka matlab "kuch nahi mila" hota hai, jo jhooth hai.

**Zaruri warning:** Postgres degraded path ko **rate limit + circuit breaker** ke peeche rakho. ES gira aur 1,000 QPS achanak Postgres par aa gaya -> ab tumhara **orders database** bhi mar gaya. Practical rule: degraded path par global cap (jaise 100 QPS), baaki seedha 503. **Aadhe log search kar payein, poora business zinda rahe.**

> Interview line: "ES down par teen seedhi: Redis se stale head-query results, phir Postgres `pg_trgm` se top-20 bina facets `degraded: true` ke saath, phir 503. Rate limiter mein sawaal 'fail open ya closed' tha; search mein sawaal hai 'kitna kam de sakte hain'. Aur degraded path circuit breaker ke peeche, warna search bachaate bachaate main OLTP DB gira doonga."

### 5. "JVM heap pressure / long GC pauses"

- **Problem:** heap 75%+ par lagatar rahe toh **old-gen GC** chalta hai, jo **stop-the-world** hai.
- **Impact:** p99 200 ms se 2,000 ms. **p50 normal dikhta hai!** Sirf woh queries slow hoti hain jo pause ke dauran us node par thi. Graph par **spiky p99 + flat p50** -- yahi GC ka fingerprint hai.
- **Causes:** high-cardinality `terms` agg (jaise `productId` par, ya bina `size` cap); bada `size: 10000` request; deep pagination (`from: 100000` -> har shard 100,024 hits coordinating node par); field data on a `text` field (**isiliye spec mein `brand`, `categoryPath` `keyword` hain, `text` nahi**).
- **Solution:**
  - **Heap 31 GB se upar kabhi nahi** (spec). 32 GB ke aage JVM **compressed oops** off kar deta hai -- pointers 4 se 8 byte -- yaani **40 GB heap 31 GB se kam useful memory deta hai.** Counter-intuitive par sach.
  - Baaki RAM (64 - 31 = 33 GB) **OS page cache** ke liye -- Lucene segments wahan cache hote hain, aur yahi search speed ka sabse bada factor hai.
  - **ES circuit breakers:** `indices.breaker.request.limit: 60%`, `total.limit: 70%`. Ek bhaari query **reject** ho jaayegi (`circuit_breaking_exception`) taaki node na gire. **Ek query ka 500 poore cluster ke outage se accha hai.**
  - `search.max_buckets: 10000`; API par `size` max 100, `page` max 50.
  - Alert: heap > 80% for 10 min = page.

### 6. "Ek slow shard poori query ko slow bana raha hai"

- **Problem:** ES query **scatter-gather** hai; coordinating node saari shards ka **wait** karta hai.

> **Query latency = sabse SLOW shard ka latency.** 5 shards 40 ms, chhati 900 ms -> query 900 ms.

- **Impact:** ek node par disk throttling / bada merge / GC -- aur **poore cluster ki p99 gir jaati hai** jabki 5 nodes theek hain.
- **Kaise pakdo:** cluster-level average kuch nahi batata. `GET /_nodes/stats/indices/search` se **per-node** `query_time_in_millis / query_total` nikalo aur **6 alag lines** graph karo. Ek line upar = culprit mila.
- **Solution:**

```json
GET /products/_search?allow_partial_search_results=true
{ "timeout": "800ms", "size": 24, "query": { "...": "..." } }
```

**Code Explanation:**

- `"timeout": "800ms"` -- **per-shard** timeout. Har shard 800 ms tak jo mila bhej de. Bina iske ek slow shard 30 sec baitha reh sakta hai. **800 ms kyun?** p99 budget 400 ms hai; 800 ms "clearly broken" ki line hai.
- `allow_partial_search_results=true` -- default true hai, par **explicitly likho** taaki intent clear rahe. Ye **do-dhaari talwar** hai: `true` = user ko kuch milta hai (achha) par **chupchaap adhoora** (failure #2). `false` = saaf error par kuch nahi milta. **Isliye `true` + mandatory `_shards.failed` monitoring -- dono saath hi sahi hai.**
- Client ka `requestTimeout: 1000` hamesha ES ke `timeout` (800 ms) se **bada** rakho, warna client pehle haath khada kar dega aur ES ka partial result kabhi milega hi nahi.
- Root cause aksar us node par chal raha **bada segment merge** hota hai (bulk indexing ke baad) -- fix: merge scheduler tuning ya bulk ko off-peak shift.

### 7. "Indexer peeche chal raha hai" (Kafka lag)

- **Problem:** `product-indexer` group Kafka se peeche. Flash sale par 500 updates/sec aaye, workers 200/sec kar paa rahe hain.
- **Impact:** **search purana data dikhaati hai** -- price 1,999 jabki 1,299 ho gaya; "in stock" jabki khatam. Spec ka `<= 30 s` SLA tootkar 20 minute ho sakta hai. **User ko:** product page par alag price, ya cart mein "out of stock".
- **Detect -- do alag metrics, dono chahiye:**

| Metric | Naapta kya hai | Kyun |
|---|---|---|
| **Kafka consumer lag** | Kitne messages unprocessed | Sasta, par "500 messages" ka time mein matlab nahi pata |
| **`indexer_lag_seconds`** | `now - doc.updatedAt` index karte waqt | **Yahi asli SLA metric hai** -- seller ke edit ko search mein aane mein kitne second lage |

```ts
// src/workers/product-indexer.worker.ts
for (const doc of batch) {
  indexerLagSeconds.observe((Date.now() - new Date(doc.updatedAt).getTime()) / 1000);
}
await this.esRepo.bulkIndex(batch);
```

**Code Explanation:**

- `Date.now() - doc.updatedAt` -- **Postgres row badli** se **ES mein likhne** tak ka poora end-to-end time: outbox poller delay + Kafka + batch wait. Sirf Kafka lag dekhoge toh **outbox poller ka atakna miss ho jaayega** (failure #8).
- `.observe(...)` -- histogram, gauge nahi -- p50 aur p99 dono chahiye. Alert `histogram_quantile(0.99, ...) > 60` for 5 min.
- **Clock skew:** `Date.now()` worker ka clock hai, `updatedAt` Postgres ka -- NTP sync zaroori, warna lag negative/fake dikhega. (Rate Limiter Part 4 mein yahi problem thi; wahan fix Redis `TIME` tha.)

- **Solution:** consumers scale karo -- par **max concurrency = partition count** (spec: 12 partitions = max 12 workers, 13va idle). Bulk batching 500 docs / 5 MB / 1 s. Backpressure mein **priority topic** sirf price/stock ke liye (title edits late chalenge, "in stock" ka jhooth mehenga hai). **Aur sabse bada fix:** spec ka rule -- **har stock quantity change par reindex mat karo** (`inStock` boolean index mein, exact `stock_qty` product page par DB/Redis se). Isse update volume 5M/day rehta hai, 50M/day nahi ban jaata.

### 8. "Outbox poller atak gaya"

- **Problem:** `outbox-poller` crash / deadlock / DB connection stuck. Postgres mein updates ho rahe hain, `product_outbox` rows ban rahi hain, koi publish nahi kar raha.
- **Impact:** **Kafka lag ZERO dikhega** (messages aa hi nahi rahe!) aur `indexer_lag_seconds` bhi normal (jo aaya woh jaldi index hua). **Dono metrics green, search ka data poori tarah frozen.** Ye system ka sabse **dhokhebaaz** failure hai.
- **Detect -- ek hi sahi metric: sabse purani unpublished row ki umar.**

```ts
new client.Gauge({
  name: 'outbox_oldest_unpublished_age_seconds',
  help: 'Age of the oldest unpublished row in product_outbox',
  async collect() {
    const { rows } = await pg.query<{ age: number }>(
      `SELECT COALESCE(EXTRACT(EPOCH FROM (now() - MIN(created_at))), 0) AS age
         FROM product_outbox WHERE published_at IS NULL`,
    );
    this.set(Number(rows[0].age));
  },
});
```

**Code Explanation:**

- `MIN(created_at) WHERE published_at IS NULL` -- **row count mat naapo**: 10,000 rows healthy ho sakti hain (burst), aur 1 row 2 ghante purani = outage. **Umar hi sach batati hai.**
- `COALESCE(..., 0)` -- koi pending row nahi toh `MIN` `NULL` deta hai -> gauge 0 (healthy).
- Ye query `product_outbox_unpublished` **partial index** (`ON (id) WHERE published_at IS NULL`) use karti hai -- spec mein wahi isiliye banaya tha. Partial index mein sirf pending rows, isliye query millisecond mein chalti hai chaahe table mein 500M rows hon.
- `async collect()` -- Prometheus scrape (15-30 s) par chalta hai, har request par nahi. Alert: `> 120` = **page**.

- **Solution:** poller `SELECT ... FOR UPDATE SKIP LOCKED` ke saath -> multiple instances bina duplicate kaam ke. Heartbeat-based liveness (60 s se purana = restart). Published rows ka 7-din cleanup job (warna table 5M rows/day se badhta rahega). **Recovery:** poller wapas chalte hi backlog apne aap nikal jaayega -- **outbox ka poora point yahi hai: kuch kho nahi sakta, sirf late ho sakta hai.**

### 9. "Kisi ne bad mapping change deploy kar di"

- **Problem:** `rating` ko `half_float` se `keyword` kar diya, ya naya field `discount: integer` jabki data `"25%"` string bhej raha hai.
- **Impact:** ES **existing mapping badalne nahi deta** (sirf naye fields add hote hain) -> bulk calls `mapper_parsing_exception` se reject, prabhavit docs **DLQ** mein. **User ko:** naye/edited products search mein aate hi nahi; purane normal. Business ko ye **sellers ki complaints se** pata chalta hai, monitoring se nahi -- agar DLQ par alert na ho.

```ts
const res = await this.es.bulk({ operations, refresh: false });
if (res.errors) {
  for (const item of res.items) {
    const r = item.index ?? item.create ?? item.update;
    if (!r?.error) continue;
    if (r.status === 409) { versionConflictTotal.inc(); continue; }   // expected
    bulkIndexErrorsTotal.inc({ type: r.error.type });
    if (r.status >= 400 && r.status < 500) {
      await this.dlq.send({ id: r._id, error: r.error.type, reason: r.error.reason });
    } else {
      await this.retryQueue.send({ id: r._id });
    }
  }
}
```

**Code Explanation:**

- `res.errors` -- ES bulk ka bada jaal: **poori bulk call HTTP 200 deti hai** chaahe 400 docs fail ho gaye hon. Per-item check **mandatory** hai.
- `r.status === 409` -> `continue`. Ye **expected** hai: spec ka `version_type: 'external'`. Out-of-order Kafka message purana version laaya -> ES ne mana kiya -> **ye correctness hai, error nahi.** DLQ mein bhejoge toh DLQ bekaar alarms se bhar jaayega.
- `{ type: r.error.type }` label -- `mapper_parsing_exception`, `strict_dynamic_mapping_exception`, `circuit_breaking_exception`. Low cardinality (ES ke error types ginti ke hain), safe label, aur **exactly** batata hai kya toota.
- **4xx -> DLQ, 5xx -> retry** -- ye poora fark hai. 4xx = **doc galat hai**, dobara bhejne se wahi error (poison message, infinite loop). 5xx = **cluster busy**, retry sahi hai.
- **Prevention:** mapping mein `"dynamic": "strict"` -- unknown field **reject** ho, chupchaap `text` mein map na ho. Mapping changes CI mein staging index par test hon. **Recovery:** mapping badalna = **alias swap reindex** (spec ka rule), phir DLQ replay.

### 10. "Reindex ne disk bhar di"

- **Problem:** `products_v4` banaya, `_reindex` shuru. Ab cluster par **dono** indices -- peak par ~520 GB jahan pehle 260 GB tha.

| Watermark | Default | ES kya karta hai |
|---|---|---|
| **low** | **85%** | Us node par **nayi shards allocate band**. Cluster **yellow** |
| **high** | **90%** | Us node se shards **relocate** shuru -- aur IO, aur network (aksar problem badhata hai) |
| **flood_stage** | **95%** | **`index.blocks.read_only_allow_delete: true`** -- prabhavit indices **read-only** |

- **User ko kya dikhta hai:** search **chalti rehti hai** (reads block nahi hote). Lekin **koi update index nahi ho raha** -- har bulk `cluster_block_exception`. Catalog frozen. Aur: **disk khaali karne ke baad bhi purane ES versions mein block khud nahi hatta.**
- **Recovery (order matters):**

```json
DELETE /products_v1                                       // 1. PEHLE jagah banao
PUT /_all/_settings                                       // 2. PHIR block hatao
{ "index.blocks.read_only_allow_delete": null }
```

**Code Explanation:**

- **Pehle jagah, phir block.** Ulta karoge toh writes shuru honge, disk phir 95%, block phir lagega -- ab tum loop mein ho.
- `null` = "setting hata do, default par jao" (`false` nahi). `_all` isliye kyunki flood stage ne saare prabhavit indices par block laga diya tha.
- **Prevention:** reindex se pehle capacity check (`used + new index size` < 70%?); purana version (`products_v1`) delete karo -- spec kehta hai purana index **24 ghante** rakho, usse zyada nahi; reindex ke dauran naye index par `number_of_replicas: 0` (**aadhi jagah**, par us dauran koi copy nahi -- isliye sirf **initial build** ke liye, live index par kabhi nahi). Alert 82% par, 95% par pata chalna matlab already outage.

### 11. "Bad synonym ya analyzer change ne relevance tabah kar di"

- **Problem:** ops ne `search_synonyms` mein daala: `apple, fruit`. `_reload_search_analyzers` chal gaya.
- **Impact:** "apple iphone" par **seb, apple juice, fruit baskets**. Aur **koi error nahi, koi 5xx nahi, koi latency spike nahi. Saare dashboards green.** Ye system ka sabse khatarnak outage hai kyunki **monitoring ise pakadti hi nahi** -- sirf revenue girti hai aur agle din analytics mein dikhti hai.
- **Detect:**
  - **Zero-result rate ka SUDDEN shift** -- dono direction mein (zyada match ya galat expansion). Sirf "> 5%" threshold kaafi nahi.
  - **CTR by position** -- top 3 par clicks gire = relevance tooti. Ye p99 se behtar signal hai.
  - **Golden query set** -- 200 queries + unke expected top-5 productIds. CI mein aur har synonym reload ke baad chalao. Overlap 80% se neeche -> **deploy block / auto rollback**.
- **Rollback:**

| Kya badla | Reindex? | Kaise | Time |
|---|---|---|---|
| **Synonyms** (search-time, spec ka decision) | **Nahi** | Row disable -> `synonyms.txt` regenerate -> `POST /products/_reload_search_analyzers` | **Seconds** |
| **Analyzer / mapping** | **Haan** | Alias wapas purane index par -- atomic | **Seconds** (agar purana index zinda hai) |

```json
POST /_aliases
{ "actions": [
  { "remove": { "index": "products_v4", "alias": "products" } },
  { "add":    { "index": "products_v3", "alias": "products" } } ] }
```

**Code Explanation:**

- Ek hi call mein `remove` + `add` -- **atomic**. Ek bhi query aisi nahi hogi jise alias na mile. Do alag calls karoge toh beech mein queries fail hongi.
- **Ye rollback sirf tab kaam karta hai jab `products_v3` zinda ho** -- isiliye spec ka rule: purana index 24 ghante rakho. Warna rollback = 3 ghante ka reindex.
- **Yahi wajah hai ki spec ne synonyms search-time rakhe, index-time nahi:** index-time synonyms tez hain (query par kaam nahi) par har change par **poora 130 GB reindex** maangte hain. Search-time thoda slow, par rollback **seconds** mein. **Jo cheez insaan roz edit karta hai, uska rollback sasta hona chahiye.**

### 12. "Ek scraper search par hathoda chala raha hai"

- **Problem:** competitor 500 QPS par `/api/v1/search`, hazaaron unique queries (`brand:X page:1..50` ka cross product), prices nikalne ke liye.
- **Impact:** ye traffic **cache-proof** hai -- har query unique, hit 0%. Yaani **100% load seedha ES par**, aur deep pagination sabse mehengi query hai. Normal users ki latency badh jaati hai. **Cache hit ratio 30% se 12% girna hi pehla signal hai.**
- **Solution (layers -- Rate Limiter lesson yahan cash hota hai):** `rl:search:<ip>` token bucket (spec ki key, jaise 60/min anonymous; suggest par alag aur zyada limit kyunki ek search = ~4 legit suggest calls); **per account/token** limit (IP badalna sasta, account mehenga); **global per-endpoint cap**; **page <= 50 cap** (poora catalog nikalna mehenga ban jaata hai); **cache hit ratio drop par alert** (sabse sasta detector).
- **Honest limit:** distributed scraper (10,000 residential IPs, har IP 3 req/min) ko app-level limit **kabhi nahi** rokega -- woh normal user se distinguishable hi nahi hai. Uske liye WAF / bot management chahiye. Aur poori tarah rokna **possible hi nahi** -- prices public hain. **Goal "rokna" nahi, scraping ko mehenga banana hai.**

### 13. "Query of death" -- ek request jo node hila de

- **Problem:** `?q=<5000 characters>&page=50&size=100`.
- **Impact:** `fuzziness: AUTO` har **term** par expand karta hai. 5,000 chars = ~700 terms x `max_expansions: 50` = **35,000 term lookups** ek query mein. Woh node CPU-bound, uski saari shards ki queries slow. **Ek request, poore node ka asar.**

```ts
// src/middleware/validate.ts
export const searchQuerySchema = z.object({
  q: z.string().trim().min(1).max(100),                 // spec: 100 chars max
  page: z.coerce.number().int().min(1).max(50),         // spec: aage searchAfter
  size: z.coerce.number().int().min(1).max(100),        // spec
  sort: z.enum(['relevance', 'price_asc', 'price_desc', 'newest', 'rating']),
  brand: z.array(z.string().max(64)).max(10).optional(),
  priceMin: z.coerce.number().int().min(0).max(100_000_000).optional(),
  priceMax: z.coerce.number().int().min(0).max(100_000_000).optional(),
}).strict();                                            // spec: unknown filter -> 400
```

**Code Explanation:**

- `.max(100)` on `q` -- **spec ka number, aur ye ek security control hai, UX nahi.** Ye ek line query-of-death ki 90% power khatam kar deti hai: 100 chars = max ~15 terms x 50 = 750 expansions, manageable.
- `.trim().min(1)` -- khaali query ES tak mat jaane do (`match_all` ban jaati hai = poora index scan). `.max(10)` on `brand` -- 500 brands ka array bhejna ek aur DoS vector hai (500 `term` clauses).
- `z.coerce.number()` -- query string se sab string aata hai; `coerce` number banata hai, `.int()` ke bina `page=2.5` nikal jaayega.
- `.strict()` -- **spec ka rule: unknown filter = 400.** Ye sirf hygiene nahi: unknown params chupchaap ignore karna matlab attacker `&script_fields=...` try karta rahega aur tumhe pata bhi nahi chalega.
- **Iske aage ES-side guards** (validation mein bhi bug ho sakta hai): per-request `"timeout": "800ms"`, `search.max_buckets`, circuit breakers, aur `fuzziness` ko word count par conditional (5+ words par off -- lambi queries mein context zyada hai, typo tolerance ki zarurat kam).

### 14. "Split brain / master election issues"

- **Problem:** network partition ya masters par heap pressure -> elected master "gayab" -> re-election.
- **Impact:** election ke dauran **cluster state changes ruk jaate hain** -- naye index nahi, shard allocation nahi, alias swap fail. **Searches aksar chalti rehti hain** (data nodes ke paas last known routing table hai). Bar-bar election (flapping) ho toh cluster "chalta dikhta hai" par kuch change nahi kar paate.
- **Asli split brain** (do masters) purane ES (< 7.x) mein possible tha jab `minimum_master_nodes` galat set hota tha. **ES 7+ mein ye structurally impossible hai** -- voting configuration quorum-based hai aur ES khud manage karta hai.
- **Solution:** **3 dedicated masters, alag AZ/rack**, even number kabhi nahi. Masters chhote par **dedicated** -- unka heap kabhi search/agg se na bhare (yahi dedicated masters ka poora point hai). `discovery.seed_hosts` + `cluster.initial_master_nodes` sahi -- galat config par **do alag cluster** ban jaate hain jo ek dusre ko jaante hi nahi (split brain ka modern version). Monitor: `es_cluster_status`, election count, `GET /_cluster/pending_tasks` queue length.

### Failure summary

| Failure | Detect | Fallback / fix |
|---|---|---|
| Cluster yellow | `es_cluster_status` = 1 for 15 min | `allocation/explain`; aksar self-heal |
| Cluster red | `partial_results_total > 0`, status = 2 | Node wapas / snapshot / **Postgres se reindex** |
| Data node dead | Node count drop | Replica promote; `delayed_timeout: 5m` |
| Cluster unreachable | `search_degraded_total` | Stale Redis -> Postgres top-20 -> 503 |
| Heap / GC | heap > 80%, spiky p99 + flat p50 | Heap <= 31 GB, circuit breakers, caps |
| Slow shard | Per-node query time divergence | `timeout: 800ms` + partial + `_shards.failed` |
| Indexer lag | `indexer_lag_seconds` p99 > 60 | Scale workers (<= 12), priority topic |
| Outbox stuck | `outbox_oldest_unpublished_age_seconds > 120` | `SKIP LOCKED` multi-poller, restart |
| Bad mapping | `bulk_index_errors_total`, DLQ depth | `dynamic: strict`, staging test, reindex + replay |
| Disk full | Disk % > 82 | Delete old index **phir** block clear |
| Bad synonyms | Zero-result shift, CTR@1-3 drop, golden set | `_reload_search_analyzers` / alias swap back |
| Scraper | Cache hit ratio drop, per-IP 429s | Rate limits + page cap + WAF |
| Query of death | p99 spike on one node | Zod caps + ES timeout |
| Master election | `pending_tasks` queue, election count | 3 dedicated masters, alag AZ |

## PART 18 -- Consistency

### Teen words, simple Hinglish mein

- **Strong consistency:** value badalte hi **har** padhne wala turant nayi value dekhega. Jaise bank balance -- ATM aur app dono ek hi number dikhayenge.
- **Eventual consistency:** abhi kuch log purani value dekh sakte hain, thodi der mein sab same. Jaise YouTube view count -- 1,203 ya 1,210, kisi ko fark nahi.
- **Read-after-write consistency:** **jisne likha woh turant apna likha dekhe**; baaki thoda late dekhein toh chalega. Jaise tumne comment kiya -- tumhe turant dikhna chahiye, dost ko 3 sec baad bhi chalega.

### Is system mein kahan kya?

| Cheez | Kya | Kyun |
|---|---|---|
| **Postgres `products`** | **Strong -- SOURCE OF TRUTH** | ACID. Price, stock, seller data ka sach yahi hai |
| **`products` + `product_outbox` ek transaction mein** | **Strong (atomic)** | Dono saath commit ya dono rollback. **Yahi outbox ka poora point hai** |
| **ES `products_v3`** | **Eventual** (SLA <= 30 s) | **Jaan-boojh kar.** Strong ke liye har write ko ES-confirmed karna padta -- write latency 5 ms se 200 ms, aur ES gira toh **catalog writes bhi band** |
| **Redis `q:<sha1>`** | Eventual + 60 s | Worst case: 30 s indexing + 60 s cache = **~90 s** |
| **Seller apna product dashboard par dekhe** | **Read-after-write** | 2 min pehle price badla aur nahi dikh raha -> support ticket |
| **Search results ka stock** | Eventual -- aur **isse authority mat banao** | Neeche poora section |
| **Facet counts** | Eventual + approximate | Distributed `terms` agg (`doc_count_error_upper_bound`). 1,204 vs 1,199 -- kisi ko fark nahi |
| **Synonyms / analyzer config** | Eventual (reload tak) | `_reload_search_analyzers` ke baad hi lagte hain |

### ES eventual kyun hai -- do alag lags

Log sochte hain "indexing lag" ek cheez hai. Actually do hain:

```
Seller ne Save dabaya (t=0)
  | [1] PIPELINE LAG: outbox poller (~1s) + Kafka (~ms) + indexer batch (~1s) + bulk = 2-5 s
  v
ES ne doc accept kar liya (t=3s)   <-- par abhi bhi search mein NAHI hai!
  | [2] REFRESH LAG: doc abhi in-memory buffer mein hai. Woh tabhi searchable hota hai
  |     jab REFRESH naya Lucene segment banata hai. refresh_interval: 1s -> 0-1 s
  v
Ab search mein dikhta hai (t=4s)
```

**Refresh lag hi "near real-time" ko "real-time" nahi banne deta.** Lucene segments **immutable** hain -- likha doc tab tak searchable nahi jab tak naya segment na bane. `refresh_interval` 100 ms kar sakte ho, par phir bahut chhote segments -> merge storm -> cluster slow. Isiliye sale day par ulta **badhate** hain (30 s).

> **Anchor:** `refresh_interval` seedha ek knob hai: ek taraf freshness, doosri taraf indexing throughput. **Dono ek saath nahi mil sakte.**

### Read-after-write: seller ka apna product

**Problem:** seller ne price 1,999 -> 1,299 kiya, turant "My Listings" par gaya. ES se aaya toh 4 sec purana price. Seller ka reaction: "save hua hi nahi" -> dobara save -> phir dobara -> support ticket.

```ts
// src/controllers/search.controller.ts
async sellerListings(req: Request, res: Response) {
  const rows = await this.productRepo.listBySeller(req.user.sellerId, req.query);
  return res.json(rows);   // seller ka apna view -> ALWAYS Postgres
}
```

**Code Explanation:**

- Seller dashboard ES ko **bilkul touch nahi karta**. `products_seller_idx ON (seller_id, updated_at DESC)` (spec ka index) isi ke liye hai.
- Ye scale karta hai kyunki ek seller ke paas 4,000 products hain, 50M nahi. Ye ek **filtered lookup** hai, search nahi -- yahan BM25 ki zarurat hi nahi.
- **Sabse important sabak:** read-after-write ka sabse saaf hal ye hai ki **us ek case ko source of truth se serve karo**, na ki poore system ko strong banane ki koshish karo.
- Agar seller ke 50,000 products hain aur usme **search** chahiye? Tab ES use karo par uske last 60 s ke Postgres edits response par overlay kar do. Thoda code, par SLA bach jaata hai.

### Ordering guarantee: Kafka key + external version

**Problem:** ek product par teen updates ek second mein: 1,999 -> 1,299 -> 1,499. Workers parallel hain. Agar `1,299` wala message `1,499` ke **baad** process ho gaya, toh ES mein **permanently galat price**. Khud kabhi theek nahi hogi.

```ts
// Layer 1 -- outbox poller: Kafka key = productId
await producer.send({ topic: 'product-changes',
  messages: [{ key: row.product_id, value: JSON.stringify(payload) }] });

// Layer 2 -- indexer: ES external version
operations.push(
  { index: { _index: 'products', _id: doc.productId,
             version: doc.version, version_type: 'external' } },
  doc,
);
```

**Code Explanation:**

- `key: row.product_id` -- Kafka guarantee: **same key = same partition = order preserved** (spec: `key=productId`).
- **Par ye kaafi nahi.** Kyun? (a) consumer batch ke andar parallelism, (b) retries -- ek failed message retry hone tak agla nikal chuka hoga, (c) partitions badhaoge (12 -> 48) toh purani keys naye partitions par jaayengi aur **order toot jaayega**. Isliye layer 2 chahiye.
- `version_type: 'external'` -- **yahi asli guarantee hai.** ES dekhta hai "mere paas version 7 hai, tum 5 la rahe ho" -> **409 reject.** Purana data naye ko overwrite kar hi nahi sakta, chaahe order kuch bhi ho. `doc.version` Postgres ka `version BIGINT` hai jo har update par bump hota hai -- yaani **DB ka truth hi ordering ka judge hai.**
- Indexer 409 ko **success** maanta hai (failure #9) -- "kisi aur ne naya data pehle daal diya" achhi khabar hai.
- **Ye idempotency free mein deta hai:** Kafka at-least-once hai; wahi message do baar aaya -> 409 -> koi nuksaan nahi. Rate Limiter mein duplicate ka jawab "count karo" tha; yahan "version se reject karo" -- kyunki wahan hum **kaam** gin rahe the, yahan **state** set kar rahe hain.

### Sabse mehenga consistency bug: "search says in stock, checkout says out of stock"

```
t=0    Stock 1 bacha. ES mein inStock: true
t=1    User A ne khareed liya. Postgres stock_qty = 0, inStock = false
t=1-30 Indexing lag -> ES mein abhi bhi inStock: true
t=5    User B: search -> product dikha -> cart -> checkout
t=5.2  Checkout ne Postgres se validate kiya -> OUT OF STOCK
```

**Business cost (real):** user ne search kiya, click kiya, cart, address, payment page -- phir "out of stock". Woh aksar **poora session chhod deta hai**, sirf woh product nahi. Failed-checkout users ka repeat rate girta hai.

**Standard fix -- do hisse.**

**1. Index kabhi authority nahi hai.**

> **Search index discovery ke liye hai, truth ke liye nahi. Paisa aur stock ka faisla hamesha Postgres se hota hai -- checkout par, transaction ke andar, `SELECT ... FOR UPDATE` ke saath.**

Yaani ye "bug" nahi, **design** hai. Checkout ka kaam hi re-validate karna hai. **Agar tumhara checkout ES se stock padh raha hai, toh tumhara architecture galat hai, tumhari consistency nahi.**

**2. Lag ko wahan chhota rakho jahan sasta ho:**

| Layer | Source | Lag |
|---|---|---|
| Search results page | `inStock` ES se (filter ke liye) | 30 s tak stale |
| Product card badge | Frontend `inStock`, exact quantity **nahi** | -- |
| Product detail page | Exact `stock_qty` **Redis/Postgres se** (spec) | ~real-time |
| Add to cart | Postgres check | Real-time |
| Checkout | Postgres `SELECT ... FOR UPDATE` + transaction | **Strong** |

Har layer pichli se sakht hai. User jitna aage badhta hai, utna sahi sach milta hai -- aur jab tak paisa deta hai, sach 100% hai.

**Practical trick:** "out of stock" products ko search se **hatao mat, neeche karo** -- `{ "filter": { "term": { "inStock": true } }, "weight": 1.2 }` (spec ki query) yahi kar raha hai. Kyun? (a) user use dhoondh raha ho sakta hai, (b) "notify me" monetize hota hai, (c) achanak gayab hona SEO ke liye bura hai.

### Drift detect karna aur repair karna

Outbox aur versioning sahi hone par bhi **drift hota hai**: DLQ mein pade docs, ek buggy deploy ki 20-minute window, manual DB fix jisne `updated_at` nahi chhua, ya ek reindex jo beech mein mar gaya.

```ts
// src/workers/reconcile.job.ts -- nightly
for (const category of categories) {
  const pg = await pgRepo.categoryChecksum(category);
  // SELECT count(*) AS cnt, md5(string_agg(id::text || ':' || version, ',' ORDER BY id)) AS sum
  //   FROM products WHERE category_path = $1 AND status = 'active'
  const es = await esRepo.categoryChecksum(category);

  reconcileCountDiff.set({ category }, Math.abs(pg.cnt - es.cnt));
  if (pg.cnt !== es.cnt || pg.sum !== es.sum) {
    logger.warn({ category, pgCount: pg.cnt, esCount: es.cnt }, 'index drift detected');
    await this.resyncCategory(category);    // targeted re-sync, poora reindex nahi
  }
}
```

**Code Explanation:**

- **Category-wise, poore index par nahi.** 50M docs ka ek checksum bas "kuch galat hai" bolega. Category-wise se **kahan** galat hai pata chalta hai aur repair targeted hota hai.
- `count(*)` sasta par kamzor (ek doc ka galat **price** count nahi badalta). `version` ko checksum mein daalne se **content drift** bhi pakda jaata hai, kyunki spec ke hisaab se har update `version` bump karta hai.
- `ORDER BY id` -- **zaroori**. Bina order ke `string_agg` har baar alag aa sakta hai aur har raat fake drift milega.
- `resyncCategory` -- us category ke products ko dobara `product_outbox` mein daal do. **Normal pipeline hi repair karega** -- koi alag "fix path" nahi. **Yahi outbox ki khoobsurati hai: replay = repair.**
- Off-peak aur throttled (jaise 2,000 docs/sec) chalao. Alert: `count diff > 0.1%` = warn, `> 1%` = page.

> Interview line: "Postgres source of truth hai aur strongly consistent; ES derived hai aur **jaan-boojh kar** eventually consistent -- lag ke do hisse hain, pipeline (2-5 s) aur refresh (1 s). Ordering ke liye Kafka key `productId` aur uske upar ES external version, jo purane data ko naye par likhne se rokta hai. Seller apna dashboard Postgres se dekhta hai -- read-after-write. Aur sabse important rule: **index kabhi paise ya stock ka authority nahi hai** -- checkout Postgres se re-validate karta hai. Drift ke liye nightly category-wise count + version checksum, aur repair sirf outbox replay."
