n exit (Kubernetes default grace period 30 sec hai, uske andar). `unref()` -- ye timer akela process ko zinda na rakhe.\n- `await ... setTimeout(r, 5_000)` -- LB ko health check fail notice karne mein kuch seconds lagte hain. Us beech aayi requests abhi bhi serve ho jaati hain.\n- `server.close(...)` -- naye connections accept band, aur jab saari in-flight requests khatam, callback. (Node 19+ mein `close()` idle keep-alive connections bhi band karta hai; purane versions mein `server.closeIdleConnections()` call karo.)\n- `Promise.allSettled([db.end(), redis.quit()])` -- pool ke connections aur Redis cleanly band. `allSettled` -- ek fail ho toh bhi doosra band ho.\n- `process.exit(0)` -- clean exit.\n- Worker (Kafka consumer) ke liye bhi same idea: `consumer.disconnect()` -- current batch poora, offsets commit, phir exit.\n\n### Q10. \"Streams aur backpressure -- is system mein kahan?\"\n\n**My Answer:** \"User 'Export my links as CSV' dabata hai aur uske 1 million links hain. Naive tareeka: `SELECT *` -> 1M rows memory mein -> string banao -> bhejo. Memory 500 MB+, event loop block, doosri requests slow. **Stream** mein rows thodi thodi DB se aati hain aur thodi thodi client ko jaati hain. **Backpressure** ka matlab: client slow hai (mobile network) toh hum DB se padhna bhi slow kar dete hain, taaki memory mein data jama na ho.\"\n\n```ts\nimport QueryStream from 'pg-query-stream';\nimport { Transform } from 'node:stream';\nimport { pipeline } from 'node:stream/promises';\n\nexportCsv = async (req: Request, res: Response) => {\n  const client = await this.replicaPool.connect();\n  try {\n    const rows = client.query(new QueryStream(\n      'SELECT short_code, long_url, created_at FROM urls WHERE user_id = $1 ORDER BY created_at',\n      [res.locals.userId],\n      { batchSize: 1000 },\n    ));\n    const toCsv = new Transform({\n      objectMode: true,\n      transform(row, _enc, cb) {\n        cb(null, `${row.short_code},${csvCell(row.long_url)},${row.created_at.toISOString()}\\n`);\n      },\n    });\n    res.setHeader('Content-Type', 'text/csv');\n    res.setHeader('Content-Disposition', 'attachment; filename=\"links.csv\"');\n    res.write('short_code,long_url,created_at\\n');\n    await pipeline(rows, toCsv, res);\n  } finally {\n    client.release();\n  }\n};\n\nfunction csvCell(v: string): string {\n  const safe = /^[=+\\-@]/.test(v) ? `'${v}` : v;\n  return `\"${safe.replace(/\"/g, '\"\"')}\"`;\n}\n```\n\n**Code Explanation:**\n\n- `this.replicaPool.connect()` -- ek dedicated connection, kyunki cursor poore export tak khula rahega. **Replica** par, taaki lamba export primary ko na chhue.\n- `new QueryStream(sql, params, { batchSize: 1000 })` -- Postgres **cursor**: ek baar mein 1000 rows fetch, saari nahi.\n- `new Transform({ objectMode: true, ... })` -- har row object ko CSV line (string) mein badalta hai.\n- `res.write(header)` -- pehli line: column names.\n- `await pipeline(rows, toCsv, res)` -- **backpressure yahin handle hota hai.** `res` ka buffer bhar gaya (slow client) -> `toCsv` ruk jaata hai -> `rows` agla batch DB se fetch nahi karta. Memory flat rehti hai, chahe 1M rows hon. Client beech mein disconnect kare -> pipeline saare streams destroy karke reject karta hai, leak nahi.\n- `finally { client.release() }` -- connection hamesha pool mein wapas, error ho ya nahi. Bhool gaye toh pool dheere dheere khaali -> saari requests `connectionTimeout`.\n- `csvCell` -- value ko quotes mein, andar ke `\"` double. `=`, `+`, `-`, `@` se shuru hone wali value ke aage `'` -- **CSV/formula injection** se bachao (Excel `=HYPERLINK(...)` ko formula samajh ke chala deta hai).\n- Production: ek user ke ek saath max 1 export (rate limit), kyunki har export ek DB connection pakad ke rakhta hai. Bahut bade exports -> async job jo file S3 par likhe aur download link email kare.\n\n### Q11. \"Live click dashboard ke liye WebSockets lagaoge?\"\n\n**My Answer:** \"Pehle poochunga: 'kitna live?' Hamara analytics pipeline khud minute-level aggregate karta hai, toh WebSocket se har second push karne ka fayda nahi -- data hi har minute badal raha hai. **Polling har 15-30 sec** kaafi hai -- stateless, cacheable, zero naya infra. Agar product sach mein live ticker chahta hai, toh pehle **SSE** (one-way push, plain HTTP). WebSocket tab jab two-way chahiye. WebSocket ki keemat: connections stateful hain, har instance ke paas alag users -> click events ko sahi instance tak pahunchane ke liye Redis pub/sub ya Kafka fan-out, LB par long-lived connections, deploy par saare connections reconnect (thundering herd), aur har connection memory leta hai.\"\n\n### Q12. \"Redis client -- kitne connections? Pipelining kya hai?\"\n\n**My Answer:** \"ioredis mein **ek connection per process** kaafi hai, kyunki Redis single-threaded hai aur ek connection par multiple commands bina response ka wait kiye bheje ja sakte hain -- responses same order mein aate hain. Pool ki zarurat nahi (Postgres se ulta). Exceptions: blocking commands (`BLPOP`) aur **pub/sub subscriber** ko alag connection chahiye, kyunki woh connection 'busy' ho jaata hai.\"\n\n```ts\nconst redis = new Redis(config.redisUrl, {\n  enableOfflineQueue: false,\n  commandTimeout: 50,\n  maxRetriesPerRequest: 1,\n  enableAutoPipelining: true,\n});\n\n// Bulk warm-up: 1000 keys, 1 round trip\nconst pipe = redis.pipeline();\nfor (const { code, url } of topLinks) pipe.set(`url:${code}`, url, 'EX', 86_400);\nawait pipe.exec();\n```\n\n**Code Explanation:**\n\n- `enableOfflineQueue: false` -- disconnect hai toh command queue mein mat rakho, turant fail -> DB fallback (Part 2). Default `true` mein redirect Redis ke wapas aane tak latakta.\n- `commandTimeout: 50` -- 50 ms mein jawab nahi toh error = cache miss.\n- `maxRetriesPerRequest: 1` -- ek fail command ko baar baar retry mat karo.\n- `enableAutoPipelining: true` -- ek event loop tick mein aaye saare commands ioredis khud ek batch mein bhejta hai -- 35K req/sec par network round trips kam.\n- `redis.pipeline()` + `pipe.exec()` -- 1000 `SET` ek round trip mein. 1000 alag round trips x ~0.5 ms = 500 ms vs ek batch ~ kuch ms. Dhyan: pipeline **atomic nahi** hai (beech mein doosre clients ke commands aa sakte hain); atomic chahiye toh `MULTI` ya Lua.\n\n### Q13. \"DB connection handling mein kya galtiyan hoti hain?\"\n\n**My Answer:** \"Teen common galtiyan:\n1. **`pool.connect()` ke baad `release()` bhoolna** -- har leak ek connection kha jaata hai, kuch ghante baad pool khaali. Hamesha `try/finally`.\n2. **Transaction `pool.query` se chalana** -- `pool.query('BEGIN')` aur agli `pool.query(...)` **alag connections** par ja sakti hain! Transaction ke liye ek client lo, uspe BEGIN/COMMIT/ROLLBACK.\n3. **Har request par `new Pool()` / `new Client()`** -- har baar TCP + TLS + auth, aur connections ka flood. Pool ek baar app start par (composition root, Part 2).\"\n\n```ts\nconst client = await db.connect();\ntry {\n  await client.query('BEGIN');\n  await client.query('UPDATE alias_orders SET status = $1 WHERE id = $2 AND status = $3', ['ALIAS_ASSIGNED', orderId, 'PAID']);\n  await client.query('INSERT INTO urls (id, short_code, long_url, user_id) VALUES ($1, $2, $3, $4)', [id, alias, longUrl, userId]);\n  await client.query('COMMIT');\n} catch (err) {\n  await client.query('ROLLBACK');\n  throw err;\n} finally {\n  client.release();\n}\n```\n\n**Code Explanation:**\n\n- `db.connect()` -- pool se **ek** client; transaction ki saari queries isi par.\n- `BEGIN ... COMMIT` -- dono statements ek saath hon ya bilkul na hon (What if #9 wala paid alias).\n- `AND status = $3` -- sirf `PAID` order hi assign ho; duplicate webhook par 0 rows update -> idempotent.\n- `catch -> ROLLBACK` -- beech mein fail (e.g. alias unique violation) toh aadha kaam undo.\n- `finally -> release()` -- connection wapas pool mein, har haal mein.\n\n### Q14. \"Kafka consumer Node.js mein kaise likhoge (click events)? At-least-once kya hai?\"\n\n**My Answer:** \"**Consumer group** ka matlab: same `groupId` wale saare worker instances topic ki partitions aapas mein baant lete hain -- har partition ek time par group ke ek hi consumer ko. 12 partitions, 4 workers -> har worker 3 partitions. **Offset** = partition mein kahan tak padh liya. Main offset **DB write ke baad** commit karta hoon: crash hua toh last committed offset se dobara padhega -> kuch events do baar aayenge. Isko **at-least-once** kehte hain. Isliye processing **idempotent** honi chahiye -- har event ka `event_id` (UUID) aur DB mein `ON CONFLICT DO NOTHING`.\"\n\n```ts\nimport { Kafka } from 'kafkajs';\n\nconst kafka = new Kafka({ clientId: 'click-worker', brokers: config.kafkaBrokers });\nconst consumer = kafka.consumer({ groupId: 'click-aggregator' });\n\nawait consumer.connect();\nawait consumer.subscribe({ topic: 'url-clicks', fromBeginning: false });\n\nawait consumer.run({\n  eachBatchAutoResolve: false,\n  eachBatch: async ({ batch, resolveOffset, heartbeat }) => {\n    const events = batch.messages.map((m) => JSON.parse(m.value!.toString()) as ClickEvent);\n    await db.query(\n      `INSERT INTO click_events (event_id, short_code, clicked_at, country)\n       SELECT * FROM unnest($1::uuid[], $2::text[], $3::timestamptz[], $4::text[])\n       ON CONFLICT (event_id) DO NOTHING`,\n      [events.map((e) => e.eventId), events.map((e) => e.shortCode),\n       events.map((e) => e.clickedAt), events.map((e) => e.country)],\n    );\n    for (const m of batch.messages) resolveOffset(m.offset);\n    await heartbeat();\n  },\n});\n```\n\n**Code Explanation:**\n\n- `groupId: 'click-aggregator'` -- consumer group. Aur worker chalao -> Kafka partitions rebalance karke baant dega. Max parallelism = partitions ki sankhya.\n- `fromBeginning: false` -- naya group latest se padhe. Replay chahiye (bug fix ke baad recompute) toh naya group ya offsets reset.\n- `eachBatch` -- ek ek message ki jagah batch -> ek DB insert mein 500 events. 35K events/sec par per-message insert DB ko maar dega.\n- `unnest($1::uuid[], ...)` -- arrays ko rows mein badal ke ek hi `INSERT` mein bulk insert.\n- `ON CONFLICT (event_id) DO NOTHING` -- **idempotency.** Redelivery par same `event_id` dobara insert nahi hoga. Agar hum seedha `UPDATE counts SET clicks = clicks + n` karte, toh replay par count double ho jaata.\n- `eachBatchAutoResolve: false` + `resolveOffset` **DB write ke baad** -- pehle DB, phir offset. Ulta kiya (pehle commit, phir crash) toh events **lose** ho jaate (at-most-once).\n- `heartbeat()` -- Kafka ko batao \"zinda hoon\", warna lamba batch processing par group rebalance kar dega aur partitions kisi aur ko de dega.\n- Partition key: counting mein order matter nahi karta, toh key random/event_id rakho -- warna viral link ki saari events ek partition par (hot partition).\n- Poison message (invalid JSON) -- `JSON.parse` throw karega aur batch baar baar fail hoga. Production mein try/catch karke usko **dead-letter topic** mein bhejo aur aage badho.\n\n### Q15. \"Event loop block kaise hota hai? Is system mein kaunse pitfalls?\"\n\n**My Answer:** \"Koi bhi lamba **synchronous** kaam poore process ki saari requests ko rok deta hai. Hamare system mein:\n1. **Bada `JSON.parse`** -- koi 50 MB body bheje toh parse synchronous hai. Isliye `express.json({ limit: '10kb' })` (Part 2). Bulk import ke liye streaming parser ya worker.\n2. **Sync crypto** -- `crypto.pbkdf2Sync`, `scryptSync` login par = har login par loop 100 ms ruk gaya. Async versions libuv threadpool par chalte hain.\n3. **ReDoS (Regular expression Denial of Service)** -- kuch regex (nested quantifiers jaise `/^(a+)+$/`) specially crafted input par exponential time lete hain. Ek request = CPU 100% for seconds. Hamara alias regex `^[a-zA-Z0-9_-]{4,30}$` safe hai (koi nesting nahi, length bounded). URL validation ke liye internet ka 'perfect URL regex' copy mat karo -- `new URL()` use karo (Part 2 ne yahi kiya).\n4. **Bade loops** -- 1 lakh items ka sync `for` + processing request ke andar.\nDetect kaise: event loop delay metric.\"\n\n```ts\nimport { monitorEventLoopDelay } from 'node:perf_hooks';\n\nconst loopDelay = monitorEventLoopDelay({ resolution: 20 });\nloopDelay.enable();\n\nsetInterval(() => {\n  const p99Ms = loopDelay.percentile(99) / 1e6;\n  metrics.gauge('event_loop_delay_p99_ms', p99Ms);\n  if (p99Ms > 100) logger.warn({ p99Ms }, 'event loop blocked');\n  loopDelay.reset();\n}, 10_000).unref();\n```\n\n**Code Explanation:**\n\n- `monitorEventLoopDelay({ resolution: 20 })` -- Node har 20 ms par check karta hai ki timer kitna late chala. Late = loop kisi aur kaam mein busy tha.\n- `percentile(99) / 1e6` -- histogram **nanoseconds** mein deta hai; ms mein badlo.\n- `metrics.gauge(...)` -- dashboard aur alert ke liye (Part 4 observability). Healthy Node mein ye few ms rehta hai.\n- `> 100` ms -- warning: kuch block kar raha hai. Autoscaling bhi is par ho sakti hai.\n- `loopDelay.reset()` -- har 10 sec ka fresh window.\n- `.unref()` -- ye interval shutdown ko roke nahi.\n\n### Q16. \"Unhandled promise rejection se kya hota hai? Fire-and-forget safe kaise?\"\n\n**My Answer:** \"Node 15+ mein unhandled rejection by default **process crash** kar deta hai. Hamare code mein cache SET aur click event bhejna fire-and-forget hai (await nahi karte, taaki redirect fast rahe). Isliye har aise promise par `.catch(...)` zaruri hai -- `this.cache.set(...).catch(() => {})` (Part 2). Safety net ke liye `process.on('unhandledRejection', ...)` mein log + metric, lekin woh bug pakadne ke liye hai, normal flow ke liye nahi. Aur `uncaughtException` ke baad process ko graceful shutdown karke restart hone do -- state corrupt ho sakti hai, 'ignore karke chalte raho' galat hai.\"\n\n### Node.js answers ka summary\n\n| Topic | Hamare system mein ek line |\n|---|---|\n| Event loop | I/O-heavy redirect path ke liye perfect; CPU kaam loop ko rokta hai |\n| async/await | Independent calls `Promise.all` se parallel |\n| all vs allSettled | Zaruri data -> `all`; optional (stats) -> `allSettled` |\n| Worker threads | QR / bulk import jaise CPU kaam; hashing ke liye async crypto kaafi |\n| Cluster vs containers | K8s mein 1 process per container; VM par cluster/PM2 |\n| Stateless | Rate limiter, sessions, cron memory mein nahi; local LRU chalta hai |\n| Pool | `instances x max \u003c= max_connections`; Little's law; PgBouncer |\n| Graceful shutdown | Readiness 503 -> wait -> `server.close` -> `db.end` -> exit, hard timeout |\n| Streams | CSV export cursor + `pipeline` = backpressure, flat memory |\n| WebSockets | Dashboard ke liye polling/SSE kaafi |\n| Redis client | Ek connection, auto-pipelining, offline queue off |\n| Kafka consumer | Consumer group, offset DB write ke baad, `event_id` dedupe |\n| Blocking | Body limit, async crypto, safe regex, event loop delay metric |\n\n---\n\n## Remember\n\n> **Har design choice ek keemat hai -- sabse simple version se shuru karo, metric dekh ke agla version lao, aur Node.js mein event loop ko sirf I/O ka wait karne do, CPU ka kaam kabhi nahi.**\n\n## Quick Self-Test\n\n1. 302 se 301 par kab switch karoge, aur switch karne ke baad kaunse do features toot jaayenge?\n2. V2 se V3 par jaane ke liye kaunse 3 metrics tumhe signal denge?\n3. \"Exactly-once payment\" par interviewer ko kya honest answer doge, aur paid custom alias mein idempotency kaise lagaoge?\n4. 12 Node instances, har ek `pool.max = 20`, Postgres `max_connections = 100` -- kya hoga aur kaise fix karoge?\n5. Kafka consumer mein offset DB write se **pehle** commit kiya toh crash par kya hoga? Aur baad mein kiya toh kya naya problem aata hai, uska fix kya hai?\n\n---\n\n**Next (Part 6):** Implement it (TypeScript), 30-second answer, 5-minute answer, whiteboard drawing order, final cheat sheet. \"next\" bolo.\n"},{"label":"Implement It -> Interview Answers -> Whiteboard -> Cheat Sheet","md":"# URL Shortener -- HLD + LLD (Part 6: Implement It -> Interview Answers -> Whiteboard -> Cheat Sheet)\n\n> Is file mein prompt ke **Parts 26-30** hain: coding round mein \"Implement URL shortener\" kaise solve karein, 30-second answer, 5-minute answer, whiteboard par diagram kis order mein banayein, aur poore URL Shortener (Parts 1-5) ki final cheat sheet.\n> Ye last file hai. Parts 1-5 mein humne design samjha; yahan hum usko **interview mein bolna, likhna aur draw karna** seekhenge.\n\n---\n\n## PART 26 -- Code Design Question: \"Implement URL shortener\"\n\n### Pehle samjho: ye system design round nahi hai\n\nKabhi kabhi interviewer HLD nahi, **coding round** mein bolta hai: \"Implement a URL shortener.\" Yahan woh Postgres, Redis, load balancer nahi dekhna chahta. Woh dekhna chahta hai:\n\n- Tum problem ko **clarify** karte ho ya seedha typing shuru kar dete ho?\n- Tumhara **data structure choice** sahi hai?\n- Code **clean, correct aur edge cases** handle karta hai?\n- Tum **complexity** bata sakte ho?\n\nIska matlab: **ek file, in-memory, koi DB nahi.** Lekin tumhara in-memory design aisa ho ki baad mein DB lagana easy ho -- aur ye tum bologe bhi.\n\n### Step 1 -- Clarify (1-2 minute, typing se pehle)\n\n> \"Code likhne se pehle kuch cheezein confirm kar leta hoon.\"\n\n| Question | Mera assumption (agar interviewer bole \"you decide\") |\n|---|---|\n| Sirf `shorten` aur `resolve` chahiye, ya delete/stats bhi? | Sirf `shorten` + `resolve` |\n| Storage in-memory chalega? | Haan, `Map` |\n| Code kaisa ho -- random ya sequential? | Counter + Base62 (collision-free, Part 13 wala logic) |\n| Custom alias chahiye? | Haan, optional, conflict par error |\n| Same long URL do baar aaye toh same code? | Haan (dedup), sirf non-expiring generated links ke liye |\n| Expiry chahiye? | Optional `ttlMs` |\n| Invalid URL par kya? | Error throw |\n\n> Interview tip: 5 questions poocho, 5 answers likh lo board/comment mein, phir code. Isse interviewer ko dikhta hai tum requirement-driven ho.\n\n### Step 2 -- Logic pehle bolo (code se pehle, Hinglish mein)\n\n> \"Main do `Map` rakhunga. Pehla `code -> { longUrl, expiresAt }` -- ye redirect ke liye hai, O(1) lookup. Doosra `longUrl -> code` -- ye dedup ke liye, taaki same URL par naya code na bane.\n>\n> Code banane ke liye ek counter rakhunga jo `62^6` se start hoga, aur usko Base62 mein encode karunga -- toh har code 7 characters ka hoga aur counter unique hai isliye collision ka sawaal nahi. Sirf ek case bachta hai: agar kisi ne custom alias `1000001` le liya aur baad mein counter bhi wahi code banaye -- us case mein main counter aage badha dunga.\n>\n> Custom alias aaya toh format check, phir map mein already hai toh `ALIAS_TAKEN`.\n>\n> `resolve` mein map se entry nikaalunga; nahi mili toh `NOT_FOUND`, expire ho gayi toh `EXPIRED`, warna long URL.\"\n\nAb code.\n\n### Step 3 -- TypeScript code (single file, self-contained)\n\n```ts\nconst ALPHABET = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';\nconst ALIAS_PATTERN = /^[a-zA-Z0-9_-]{4,30}$/;\nconst MAX_URL_LENGTH = 2048;\nconst FIRST_ID = 62n ** 6n; // pehla code hi 7 chars ka: \"1000000\"\n\ntype ErrorCode = 'INVALID_URL' | 'INVALID_ALIAS' | 'ALIAS_TAKEN' | 'NOT_FOUND' | 'EXPIRED';\n\nexport class ShortenerError extends Error {\n  constructor(public readonly code: ErrorCode) {\n    super(code);\n  }\n}\n\ninterface Entry {\n  longUrl: string;\n  expiresAt: number | null; // epoch ms, null = kabhi expire nahi\n}\n\nexport function encodeBase62(num: bigint): string {\n  if (num === 0n) return ALPHABET[0];\n  let code = '';\n  while (num > 0n) {\n    code = ALPHABET[Number(num % 62n)] + code;\n    num = num / 62n;\n  }\n  return code;\n}\n\nexport class UrlShortener {\n  private readonly codeToEntry = new Map\u003cstring, Entry>();\n  private readonly urlToCode = new Map\u003cstring, string>();\n  private counter = FIRST_ID;\n\n  constructor(\n    private readonly baseUrl = 'https://sho.rt',\n    private readonly now: () => number = Date.now,\n  ) {}\n\n  shorten(longUrl: string, opts: { alias?: string; ttlMs?: number } = {}): string {\n    const url = this.normalize(longUrl);\n    const expiresAt = opts.ttlMs !== undefined ? this.now() + opts.ttlMs : null;\n\n    if (opts.alias !== undefined) {\n      if (!ALIAS_PATTERN.test(opts.alias)) throw new ShortenerError('INVALID_ALIAS');\n      if (this.codeToEntry.has(opts.alias)) throw new ShortenerError('ALIAS_TAKEN');\n      this.codeToEntry.set(opts.alias, { longUrl: url, expiresAt });\n      return `${this.baseUrl}/${opts.alias}`;\n    }\n\n    if (expiresAt === null) {\n      const existing = this.urlToCode.get(url);\n      if (existing) return `${this.baseUrl}/${existing}`;\n    }\n\n    let code = encodeBase62(this.counter++);\n    while (this.codeToEntry.has(code)) code = encodeBase62(this.counter++);\n\n    this.codeToEntry.set(code, { longUrl: url, expiresAt });\n    if (expiresAt === null) this.urlToCode.set(url, code);\n    return `${this.baseUrl}/${code}`;\n  }\n\n  resolve(code: string): string {\n    const entry = this.codeToEntry.get(code);\n    if (!entry) throw new ShortenerError('NOT_FOUND');\n    if (entry.expiresAt !== null && entry.expiresAt \u003c= this.now()) {\n      throw new ShortenerError('EXPIRED');\n    }\n    return entry.longUrl;\n  }\n\n  private normalize(raw: string): string {\n    if (raw.length > MAX_URL_LENGTH) throw new ShortenerError('INVALID_URL');\n    let parsed: URL;\n    try {\n      parsed = new URL(raw.trim());\n    } catch {\n      throw new ShortenerError('INVALID_URL');\n    }\n    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {\n      throw new ShortenerError('INVALID_URL');\n    }\n    if (parsed.hostname === new URL(this.baseUrl).hostname) {\n      throw new ShortenerError('INVALID_URL');\n    }\n    return parsed.href;\n  }\n}\n```\n\n> Ye code `tsc --strict` se bina error compile hota hai, aur neeche ke saare outputs actually run karke nikaale gaye hain.\n\n### Step 4 -- Line-by-line explanation\n\n**Code Explanation -- constants aur types:**\n\n- `ALPHABET` -- Part 2/13 wala same 62 characters: `0-9`, `a-z`, `A-Z`. Index hi Base62 digit ki value hai.\n- `ALIAS_PATTERN = /^[a-zA-Z0-9_-]{4,30}$/` -- alias sirf URL-safe characters, 4-30 length. Same rule jo Part 8 ki API validation mein tha.\n- `MAX_URL_LENGTH = 2048` -- bahut lambe URL memory bharenge aur browsers bhi handle nahi karte.\n- `FIRST_ID = 62n ** 6n` -- counter `56,800,235,584` se start. `Base62(62^6) = \"1000000\"`, toh **pehla code hi 7 characters** ka. Warna pehle codes `\"1\"`, `\"2\"` jaise hote.\n- `type ErrorCode = ...` -- string literal union. Galat error code likha toh TypeScript compile time par pakad lega.\n- `class ShortenerError extends Error` -- ek hi error class, `code` field ke saath. Caller `e.code === 'ALIAS_TAKEN'` check kar sakta hai -- message text par depend nahi. Ye Part 2 ke `AppError` jaisa idea hai, bas HTTP status ke bina.\n- `public readonly code` -- **parameter property**: constructor argument hi class field ban jaata hai. Kam boilerplate.\n- `interface Entry { longUrl; expiresAt }` -- map ki value. Sirf string nahi rakha, kyunki expiry bhi chahiye. `null` = kabhi expire nahi.\n\n**Code Explanation -- `encodeBase62`:**\n\n- `num: bigint` -- counter 56 billion se start hota hai, jo JS `number` ki safe limit (2^53, ~9 x 10^15) se chhota hai, lekin long run mein `bigint` safe hai aur DB `BIGINT` se match karta hai.\n- `if (num === 0n) return ALPHABET[0];` -- 0 ka edge case, warna loop chalta hi nahi aur empty string aati.\n- `num % 62n` -- last Base62 digit. `ALPHABET[...] + code` -- usko **aage** jodo, kyunki digits right se left nikal rahe hain.\n- `num = num / 62n` -- bigint division floor karta hai. Agle digit par jao.\n\n**Code Explanation -- class fields aur constructor:**\n\n- `codeToEntry = new Map\u003cstring, Entry>()` -- **main store**: short code -> entry. Redirect isi se hota hai. `Map` ka `get/set/has` average O(1).\n- `urlToCode = new Map\u003cstring, string>()` -- **reverse index** dedup ke liye. DB mein ye `long_url_hash` par index jaisa hai (Part 9).\n- `private counter = FIRST_ID` -- agla ID. In-memory hai, isliye ek hi process ke andar unique. (Multi-server ka issue edge cases mein.)\n- `constructor(baseUrl = 'https://sho.rt', now = Date.now)` -- dono **inject** kiye. `baseUrl` config se aana chahiye, hardcode nahi. `now` inject kiya taaki test mein **fake clock** de sakein aur expiry test karne ke liye 60 second wait na karna pade. Interviewer ko ye testability bahut pasand aati hai.\n\n**Code Explanation -- `shorten`:**\n\n- `opts: { alias?; ttlMs? } = {}` -- optional cheezein ek object mein. `shorten(url, undefined, 5000)` jaisi ugly calls nahi karni padti.\n- `const url = this.normalize(longUrl);` -- sabse pehle validation + normalize. Galat input aage jaana hi nahi chahiye.\n- `expiresAt = ttlMs !== undefined ? now() + ttlMs : null` -- relative TTL ko absolute time mein badlo. `!== undefined` isliye, `if (opts.ttlMs)` likhte toh `ttlMs = 0` false ban jaata.\n- `if (opts.alias !== undefined)` -- custom alias branch.\n- `if (!ALIAS_PATTERN.test(opts.alias)) throw ... 'INVALID_ALIAS'` -- format galat.\n- `if (this.codeToEntry.has(opts.alias)) throw ... 'ALIAS_TAKEN'` -- ye alias pehle se kisi generated code ya alias ke roop mein hai. Note: **expired alias bhi taken** hai -- purana printed link kisi aur ki site par nahi jaana chahiye (Part 9 ka `is_active` / \"ye code dobara mat do\" wala idea).\n- `this.codeToEntry.set(opts.alias, ...)` + `return` -- alias save. Alias ko dedup map mein **nahi** daala -- alias user ki explicit choice hai, \"same URL ka default code\" nahi.\n- `if (expiresAt === null) { existing = urlToCode.get(url) ... }` -- **dedup sirf non-expiring links ke liye.** Kyun? Agar pehle link 1 ghante ka tha aur ab user permanent chahta hai, toh purana code dena galat hoga.\n- `let code = encodeBase62(this.counter++);` -- counter se naya code. `counter++` pehle current value deta hai, phir badhata hai.\n- `while (this.codeToEntry.has(code)) code = encodeBase62(this.counter++);` -- **alias vs generated code clash.** Kisi ne alias `1000001` le liya tha; counter jab wahan pahunchega toh skip karke agla le lega. Total skips kabhi aliases ki count se zyada nahi ho sakte, toh ye loop cheap hai.\n- `codeToEntry.set(...)` + `if (expiresAt === null) urlToCode.set(url, code)` -- dono maps update, taaki agli baar same URL par same code mile.\n- `` return `${this.baseUrl}/${code}` `` -- poora short URL, sirf code nahi. Caller ko khud join na karna pade.\n\n**Code Explanation -- `resolve`:**\n\n- `const entry = this.codeToEntry.get(code);` -- ek O(1) lookup. Yahi redirect ka hot path hai.\n- `if (!entry) throw ... 'NOT_FOUND'` -- real API mein 404.\n- `entry.expiresAt !== null && entry.expiresAt \u003c= this.now()` -- **lazy expiry**: expire hone par koi timer delete nahi karta; read ke time check karte hain. Real API mein ye 410 Gone.\n- `return entry.longUrl` -- real API mein ye `302 Location: ...` banega.\n\n**Code Explanation -- `normalize`:**\n\n- `raw.length > MAX_URL_LENGTH` -- sabse sasta check pehle. 1 MB string ko parse karne ka matlab nahi.\n- `new URL(raw.trim())` -- Node ka built-in WHATWG URL parser. Invalid string par throw karta hai. `trim()` -- copy-paste mein aaye spaces hatao.\n- `catch { throw ... 'INVALID_URL' }` -- parser ka generic `TypeError` apne domain error mein translate.\n- `protocol !== 'http:' && protocol !== 'https:'` -- `javascript:alert(1)`, `file:///etc/passwd`, `data:` block. Security (Part 19).\n- `parsed.hostname === new URL(this.baseUrl).hostname` -- apne hi domain ka link shorten nahi hoga, warna `sho.rt/a -> sho.rt/b -> sho.rt/a` redirect loop.\n- `return parsed.href` -- **normalized** URL: host lowercase ho jaata hai (`AMAZON.in` -> `amazon.in`). Isi wajah se dedup do alag likhawat wale same URL ko pakad leta hai.\n\n### Step 5 -- Chalake dikhao (usage + real output)\n\n```ts\nimport { UrlShortener, ShortenerError } from './url-shortener';\n\nlet fakeNow = 0;\nconst s = new UrlShortener('https://sho.rt', () => fakeNow);\n\nfunction tryIt(label: string, fn: () => string) {\n  try {\n    console.log(label, '->', fn());\n  } catch (e) {\n    console.log(label, '->', e instanceof ShortenerError ? e.code : e);\n  }\n}\n\ntryIt('A', () => s.shorten('https://amazon.in/dp/B0CHX1W1XY'));\ntryIt('B', () => s.shorten('  https://AMAZON.in/dp/B0CHX1W1XY '));\ntryIt('C', () => s.shorten('https://flipkart.com/sale', { alias: 'priya-deal' }));\ntryIt('D', () => s.shorten('https://myntra.com', { alias: 'priya-deal' }));\ntryIt('E', () => s.shorten('https://myntra.com', { alias: '1000001' }));\ntryIt('F', () => s.shorten('https://swiggy.com'));\ntryIt('G', () => s.shorten('https://zomato.com/offer', { ttlMs: 60_000 }));\ntryIt('H', () => s.resolve('1000000'));\ntryIt('I', () => s.resolve('priya-deal'));\ntryIt('J', () => s.resolve('zzzzzzz'));\ntryIt('K', () => s.shorten('javascript:alert(1)'));\ntryIt('L', () => s.shorten('https://sho.rt/1000000'));\ntryIt('M', () => s.shorten('https://a.com', { alias: 'ab' }));\nfakeNow = 60_000;\ntryIt('N', () => s.resolve('1000003'));\n```\n\n**Actual output:**\n\n```\nA -> https://sho.rt/1000000\nB -> https://sho.rt/1000000\nC -> https://sho.rt/priya-deal\nD -> ALIAS_TAKEN\nE -> https://sho.rt/1000001\nF -> https://sho.rt/1000002\nG -> https://sho.rt/1000003\nH -> https://amazon.in/dp/B0CHX1W1XY\nI -> https://flipkart.com/sale\nJ -> NOT_FOUND\nK -> INVALID_URL\nL -> INVALID_URL\nM -> INVALID_ALIAS\nN -> EXPIRED\n```\n\n**Code Explanation -- output kya prove karta hai:**\n\n- `let fakeNow = 0` + `() => fakeNow` -- humara fake clock. Baad mein `fakeNow = 60_000` karke \"60 second aage\" chale gaye, bina wait kiye.\n- `tryIt(label, fn)` -- chhota helper jo success par result, error par sirf `code` print karta hai.\n- **A** -- pehla code `1000000` (7 chars, kyunki counter 62^6 se start).\n- **B** -- spaces aur capital host ke saath same URL -> normalize ke baad same -> **dedup**, same code.\n- **C / D** -- alias mila; dobara wahi alias maanga -> `ALIAS_TAKEN` (real API mein 409).\n- **E / F** -- kisi ne alias `1000001` le liya. Counter jab `1000001` par aaya toh skip karke **`1000002`** diya. Clash handle ho gaya.\n- **G** -- expiring link, dedup map mein nahi gaya.\n- **H / I / J** -- resolve: mila, mila, nahi mila.\n- **K / L / M** -- `javascript:` scheme, apna domain, aur 2-char alias -- teeno reject.\n- **N** -- `fakeNow = 60_000` = exactly expiry time. `\u003c=` check ki wajah se **EXPIRED**.\n\n### Step 6 -- Edge cases (interviewer zaroor poochega)\n\n| Edge case | Humara code kya karta hai | Real system mein (Parts 2-4) |\n|---|---|---|\n| Invalid URL / `javascript:` / bahut lamba | `INVALID_URL` throw | zod validation -> 400 |\n| Apne domain ka URL (`sho.rt/...`) | `INVALID_URL` -- redirect loop se bachao | Same refine rule |\n| Alias galat format (`ab`, `a b`, `@x`) | `INVALID_ALIAS` | 400 |\n| Duplicate alias | `ALIAS_TAKEN` | UNIQUE index -> `23505` -> 409 |\n| Alias kisi future generated code jaisa (`1000001`) | Counter skip kar deta hai (`while has`) | Retry loop in `createShortUrl`; better: aliases ke liye alag rule (jaise min 8 chars ya `-` zaruri) taaki clash possible hi na ho |\n| Same long URL do baar | Same code (dedup map) | `long_url_hash` index; default design mein dedup off |\n| Unknown code | `NOT_FOUND` | 404 + negative cache 60s |\n| Expired code | `EXPIRED` (lazy check) | 410 + cleanup cron (distributed lock ke saath) |\n| Expired entries memory mein pade rehte hain | Abhi haan (memory leak jaisa) | Periodic sweep / cron; in-memory mein ek min-heap by `expiresAt` |\n| Counter overflow | `bigint` hai, overflow nahi. 62^7 ke baad codes 8 chars ke ho jaayenge (~950 saal at 10M/day) | DB `BIGINT` max ~9.2 x 10^18 -- practically kabhi nahi |\n| Process restart | **Saara data gayab** (in-memory) | Isliye Postgres source of truth |\n| Multiple servers | Har server ka counter `62^6` se start -> **dono `1000000` denge** | Block allocation from DB sequence + UNIQUE index (Part 13/14) |\n| Concurrency (ek process) | Safe -- `shorten` synchronous hai, koi `await` nahi, toh event loop isko beech mein nahi todta | Jaise hi DB `await` aaya, check-then-insert race aayega -> UNIQUE constraint |\n\n> Interview line: \"Ye in-memory version single process ke liye correct hai. Isko production mein le jaane ke liye teen cheezein badlengi: `Map` ki jagah Postgres with unique index, counter ki jagah DB sequence se ID blocks, aur resolve ke aage Redis cache-aside. Class ka public interface same rahega -- sirf storage badlega.\"\n\n### Step 7 -- Complexity\n\nPehle symbols fix karo:\n\n- **N** = total stored URLs\n- **L** = URL ki length (max 2048)\n- **k** = code ki length (7 ya alias \u003c= 30)\n- **id** = counter ki value\n\n| Operation | Time | Kyun |\n|---|---|---|\n| `encodeBase62(id)` | **O(log62 id)** | Har loop mein number 62 se divide hota hai. id ~ 62^6-62^7 ke beech hai toh sirf **7 iterations** -- practically constant |\n| `normalize(url)` | **O(L)** | URL parse karna poori string padhta hai |\n| `shorten` (generated) | **O(L)** average | normalize O(L) + Map lookup (string hashing O(L), phir O(1) average) + encode O(7). `while` skip loop poori life mein aliases ki count se zyada nahi chalta, toh **amortized O(1)** extra |\n| `shorten` (alias) | **O(L + k)** average | normalize + regex O(k) + ek Map lookup |\n| `resolve(code)` | **O(k)**, yaani effectively **O(1)** average | Ek Map `get` -- code ko hash karna O(k), k \u003c= 30 |\n| Worst case Map op | O(N) theoretically (sab keys ek hash bucket mein) | Practically nahi hota; interview mein \"average O(1)\" bolo aur worst case mention kar do |\n\n**Space Complexity: O(N x L)**\n\n- `codeToEntry` -- N entries, har ek mein URL (L) + code (k) -> O(N x (L + k)) = **O(N x L)** kyunki L >> k.\n- `urlToCode` -- dedup ke liye URL **dobara** store hota hai (key ke roop mein) -> ye bhi O(N x L). Constant factor 2x, Big-O same.\n- Optimization agar interviewer pooche: reverse map mein poora URL ki jagah **SHA-256 hash (32 bytes)** rakho -> reverse map O(N) ho jaata hai. Yahi Part 9 ka `long_url_hash` idea hai.\n\n> Interview line: \"`resolve` average O(1) hai kyunki ek hash map lookup hai; `shorten` O(L) hai URL parsing ki wajah se, aur Base62 encoding O(log base 62 of id) hai jo 7 steps hai. Space O(N times L) hai -- dedup map ki wajah se URLs do baar store ho rahe hain, jo main hash rakh ke kam kar sakta hoon.\"\n\n---\n\n## PART 27 -- 30-Second Answer\n\n> \"At a high level, I would use ek stateless Node.js API load balancer ke peeche, Postgres ko source of truth, aur Redis ko cache. Ye system heavily read-heavy hai -- roughly 100 reads per write, around 10-12K redirects per second average aur peak par 35K -- isliye redirect path cache-aside se Redis se serve hoga, aur DB read replica sirf cache miss par hit hoga. Short code ke liye counter-based ID ko Base62 mein encode karunga -- 7 characters mein 3.5 trillion codes, koi collision nahi -- aur har server DB sequence se 1000 IDs ka block reserve karega. Short code par unique index uniqueness ki final guarantee hai. Redirect 302 hoga taaki analytics mil sake, aur click events queue ke through async process honge. Scale badhne par main DB ko short_code se shard karunga.\"\n\n(Bolne mein ~40 seconds. Numbers, 3 components, 1 algorithm, 1 trade-off -- bas.)\n\n---\n\n## PART 28 -- 5-Minute Interview Answer (natural Hinglish)\n\n> Ise ratna nahi hai. Har minute ka **goal** yaad rakho; words apne aap aayenge. Beech beech mein interviewer ko check-in karo: \"Is this direction okay?\"\n\n### 0:00 - 0:45 -- Requirements clarify karo\n\n\"Main pehle requirements clarify karunga. Core features mere hisaab se teen hain: user long URL dega, hum short URL denge, aur short URL open karne par redirect hoga. Custom alias, expiry, aur analytics -- ye chahiye? ... Theek hai, main maan leta hoon custom alias aur expiry chahiye, analytics basic click count.\n\nNon-functional side par, mere liye sabse important hai redirect ki **availability aur low latency** -- kyunki ye links SMS, QR codes, posters mein already phaile hote hain, down hue toh sab toot jaate hain. Aur **durability** -- ek baar bana link 5 saal baad bhi kaam kare. Analytics thoda late ho toh chalega.\"\n\n### 0:45 - 1:30 -- Scale estimate\n\n\"Scale ke liye maan lete hain 100 million users aur 10 million naye URLs per day. Toh writes roughly 116 per second, peak par ~300. Read:write 100:1 hai, toh ~11-12K redirects per second, peak par ~35K.\n\nStorage -- ek record ~500 bytes, toh 5 GB per day, 5 saal mein ~10 TB aur ~18 billion URLs. Isliye main 7-character Base62 code lunga -- 62 ki power 7 matlab 3.5 trillion, bahut margin.\n\nIska matlab: **writes easy hain, reads heavy hain.** Design ka poora focus read path par hoga.\"\n\n### 1:30 - 2:30 -- High-level architecture + dono flows\n\n\"Initially main simple architecture rakhunga: client, load balancer, multiple stateless Node.js instances, aur Postgres. Node.js yahan fit hai kyunki kaam I/O-bound hai -- CPU kam, DB/cache calls zyada.\n\n**Create flow:** request aayi, rate limit, URL validate kiya -- sirf http/https, hamara domain nahi. Phir unique ID generate ki, Base62 kiya, Postgres primary mein insert kiya, 201 return.\n\n**Redirect flow:** `GET /aB92xK`, pehle Redis dekho. Hit hua toh seedha 302 with Location header. Miss hua toh Postgres read replica se laao, Redis mein 24 ghante TTL ke saath daalo, phir redirect.\n\nAt scale, yahan bottleneck database ho sakta hai -- 35K reads per second seedha DB par nahi bhejna. Isliye hum Redis introduce kar sakte hain. Hot data ~10 GB hai, jo ek Redis node plus replica mein fit ho jaata hai, toh cluster ki abhi zarurat nahi. However, Redis source of truth nahi hoga -- Redis down hua toh hum DB se serve karenge, slow but working.\"\n\n### 2:30 - 3:15 -- API, DB, ID generation\n\n\"APIs simple hain: `POST /api/v1/urls` jo longUrl, optional customAlias aur expiresAt leta hai -- 201, ya 409 agar alias taken. Aur `GET /:shortCode` -- 302, 404 ya expired hone par 410.\n\nDB mein ek `urls` table: id, short_code, long_url, user_id, created_at, expires_at, is_active. Sabse important cheez `short_code` par **unique index** hai -- ye fast lookup bhi deta hai aur uniqueness ki guarantee bhi.\n\nID ke liye counter plus Base62. Ek problem hai -- multiple servers apna apna counter rakhenge toh same ID banegi. Isliye har server Postgres sequence se 1000 IDs ka block reserve karta hai. Matlab 1000 creates mein sirf ek DB call. Custom alias ke liye main pehle check nahi karta, seedha insert karta hoon -- duplicate hua toh unique constraint error deta hai aur main 409 return karta hoon. Check-then-insert mein race condition hoti.\"\n\n### 3:15 - 4:15 -- Caching details + scaling\n\n\"Cache-aside use kar raha hoon: key `url:\u003ccode>`, value long URL. TTL mein thoda jitter, taaki saari keys ek saath expire na hon. Not-found ko bhi 60 second cache karta hoon, warna bots random codes try karke DB ko maar denge. Viral link ke liye har Node instance mein 5 second ka local LRU cache, aur cache stampede se bachne ke liye single-flight -- ek key ke liye ek process se ek hi DB query.\n\nScaling: 10x par aur Node instances aur read replicas. 100x par Redis Cluster aur connection pooling -- PgBouncer. 1000x par data 10s of TB hoga, toh main `short_code` se shard karunga ya DynamoDB/Cassandra jaisa key-value store lunga, kyunki access pattern pure key lookup hai. Global users hain toh multi-region read path.\"\n\n### 4:15 - 5:00 -- Failures, consistency, security, trade-offs, wrap-up\n\n\"Failures: Redis down -- DB fallback, lekin DB par load 20x ho sakta hai, isliye Redis ko replica ke saath HA rakhunga aur circuit breaker lagaunga. DB primary down -- redirects cache aur replicas se chalte rahenge, sirf create fail hoga jab tak failover na ho.\n\nConsistency: short code uniqueness ke liye strong consistency -- DB constraint. Link banate hi turant click kiya toh replica lag se 404 aa sakta hai, isliye miss par primary fallback ya create par cache warm. Analytics eventual.\n\nSecurity: rate limiting Redis se, sirf http/https URLs, malware scanning, aur codes sequential hain toh private links ke liye random 8-char codes.\n\nOne trade-off here is 301 vs 302: 301 browser cache karta hai, server load kam, lekin clicks count nahi honge aur link edit/disable nahi hoga. Analytics chahiye isliye main 302 le raha hoon. Doosra trade-off -- counter predictable hai lekin collision-free; random guess-proof hai lekin retries chahiye.\n\nSummary: read-heavy system, Redis cache se fast reads, Postgres unique constraint se correctness, aur async analytics. Kisi part mein deep dive karein?\"\n\n---\n\n## PART 29 -- Whiteboard Drawing Order\n\n**Rule:** diagram ek saath mat banao. Har box tab draw karo jab uska **reason** bol rahe ho. Board par jo bhi hai, uska \"kyun\" tumhare paas hona chahiye.\n\n### Step 1 -- Client\n\n```\n[Client: Browser / App]\n```\n\n**Ab interviewer ko kya explain karna hai?**\n\n> \"Do tarah ke clients hain -- ek jo link banata hai (`POST`), aur lakhon jo link click karte hain (`GET /code`). Traffic 100:1 read-heavy hai, toh main neeche jo bhi banaunga uska focus read path hoga.\"\n\n**Abhi mat draw karo:** CDN, DNS details. Pehle core flow.\n\n### Step 2 -- Load Balancer\n\n```\n[Client]\n   |\n   v\n[Load Balancer]   (TLS yahan terminate)\n```\n\n**Ab interviewer ko kya explain karna hai?**\n\n> \"Peak 35K requests per second ek server nahi sambhalega, aur ek server single point of failure hai. LB traffic multiple instances mein baantega aur health checks se crashed instance ko hata dega. HTTPS yahin terminate hoga.\"\n\n### Step 3 -- Node.js API\n\n```\n[Client]\n   |\n   v\n[Load Balancer]\n   |\n   +------------+------------+\n   v            v            v\n[Node API]  [Node API]  [Node API]    stateless, N instances\n```\n\n**Ab interviewer ko kya explain karna hai?**\n\n> \"Node.js instances stateless hain -- koi mapping ya session memory mein nahi -- isliye koi bhi request kisi bhi instance par jaa sakti hai aur scaling matlab bas naya instance add karna. Yahan dono APIs hain: `POST /api/v1/urls` aur `GET /:shortCode`. Validation, rate limiting, ID generation yahin hota hai.\"\n\nSide mein chhota sa likh do: `POST /api/v1/urls -> 201`, `GET /:code -> 302 / 404 / 410`.\n\n### Step 4 -- Cache (Redis)\n\n```\n[Node API] ----> [Redis]   url:\u003ccode> -> longUrl, TTL 24h\n```\n\n**Ab interviewer ko kya explain karna hai?**\n\n> \"Reads 100 guna zyada hain, toh redirect pehle Redis dekhega -- cache-aside. Hit par ~1 ms mein 302. Hot data ~10 GB hai, toh ek Redis node plus replica kaafi hai. Redis sirf cache hai -- down hua toh DB se serve karenge.\"\n\n**Ek trick:** abhi Database draw nahi kiya, lekin bolte hi arrow ke saath \"miss -> DB\" likh do. Interviewer ko flow clear rehta hai.\n\n### Step 5 -- Database\n\n```\n[Node API] ----> [Redis]\n     |              (miss)\n     v\n[Postgres Primary] ----replication----> [Read Replica]\n   writes                                  cache-miss reads\n\nurls(id PK, short_code UNIQUE, long_url, user_id, created_at, expires_at, is_active)\nseq: url_id_block_seq -> 1000 IDs per block\n```\n\n**Ab interviewer ko kya explain karna hai?**\n\n> \"Postgres source of truth hai. `short_code` par unique index -- fast lookup plus uniqueness guarantee. Writes primary par, cache-miss reads replica par. ID ke liye har server sequence se 1000 IDs ka block leta hai aur Base62 encode karta hai. 1000x scale par yahi table short_code se shard hogi.\"\n\nSchema board ke kone mein ek line mein likho -- poori SQL nahi.\n\n### Step 6 -- Queue\n\n```\n[Node API] - - click event - - > [Queue: Kafka / SQS]\n```\n\n**Ab interviewer ko kya explain karna hai?**\n\n> \"Analytics ke liye har redirect par DB update karna redirect ko slow karega aur viral link ki row par lock contention hoga. Isliye click event queue mein fire-and-forget, aur user ko turant redirect. Agar analytics requirement nahi hai toh ye box hai hi nahi.\"\n\n**Dotted line** use karo -- dikhata hai ye optional/async hai.\n\n### Step 7 -- Workers\n\n```\n[Queue] ----> [Analytics Worker] ----> [Analytics Store]\n                  (batch: clicks = clicks + N)\n\n[Cleanup Cron] ----> [Postgres]   expired links (distributed lock)\n```\n\n**Ab interviewer ko kya explain karna hai?**\n\n> \"Worker events batch mein padhta hai aur har minute ek aggregated update karta hai. Worker crash hua toh queue mein messages bache rehte hain -- restart par wahin se. Duplicate message aa sakta hai, isliye event ID se dedupe. Ek cleanup job expired links hataata hai -- sirf ek instance chale isliye Redis lock.\"\n\n### Step 8 -- External services\n\n```\n[Node API] ----> [Malware / Safe Browsing API]   (create time par, timeout ke saath)\n[Client]  ----> [DNS] ----> [LB]\n                 (future) [CDN] -- sirf global latency ya 301 ke liye\n```\n\n**Ab interviewer ko kya explain karna hai?**\n\n> \"Create par URL ko malware/phishing API se check kar sakte hain -- lekin timeout ke saath, aur API down ho toh link ko 'pending review' mein daal ke create hone do ya async scan karo, taaki third-party ki wajah se hamara create down na ho. CDN abhi nahi -- bandwidth sirf ~17 MB/s peak hai, aur 302 + analytics ke saath CDN clicks chhupa dega.\"\n\n### Final board (aisa dikhna chahiye)\n\n```\n                  [Client]\n                     |\n                  [DNS]\n                     |\n             [Load Balancer]\n                     |\n     +---------------+---------------+\n     v               v               v\n [Node API]     [Node API]      [Node API] ----> [Malware API]\n     |\n     +------> [Redis]  url:\u003ccode>  (L1 local LRU 5s inside Node)\n     |           | miss\n     v           v\n [Postgres Primary] --repl--> [Read Replica]\n     ^\n     |  [Cleanup Cron + lock]\n     |\n     + - - click - - > [Queue] ----> [Analytics Worker] ----> [Analytics Store]\n```\n\n### Kya **bilkul** draw nahi karna (jab tak pooche nahi)\n\n- Kafka + Elasticsearch + S3 + MongoDB sab ek saath -- \"resume-driven design\" lagta hai.\n- Sharding, Redis Cluster, multi-region -- ye scaling discussion mein **baad mein** aate hain, pehle diagram mein nahi.\n- Microservices (alag \"ID service\", \"redirect service\") -- is scale par ek service kaafi hai.\n\n---\n\n## PART 30 -- Final Cheat Sheet (5 minute revision)\n\n### Problem\n\nLong URL -> 7-char code (`sho.rt/aB92xK`) -> `302` redirect. **Ek baar likho, lakhon baar padho.** 2 flows: create (write) + redirect (read).\n\n### Requirements\n\n| Type | Points |\n|---|---|\n| Functional (core) | Shorten, redirect |\n| Functional (extra) | Custom alias, expiry, analytics, my-links / delete |\n| NFR sabse important | Redirect availability + low latency, durability of mappings |\n| NFR relaxed | Analytics eventual, replica lag ~1-2 sec chalega |\n| Clarify first | Users, URLs/day, read:write, expiry, alias, analytics (301 vs 302), auth, dedup, global? |\n\n### Numbers (yaad rakho)\n\n| Metric | Value | Isse kya decide hua |\n|---|---|---|\n| Writes | 10M/day, ~116/s avg, ~300/s peak | Ek Postgres primary kaafi |\n| Reads | 1B/day, ~11.6K/s avg, ~35K/s peak | Redis + ~8-12 Node instances |\n| Ratio | 100:1 | Cache-first read path |\n| Record | ~500 B | -- |\n| Storage | 5 GB/day, ~10 TB / 5 yrs, ~18B URLs | Future sharding |\n| Code | 7 chars Base62 = 62^7 = 3.52T | ~950 saal ka space |\n| Hot cache | ~10 GB | 1 Redis node + replica, cluster nahi |\n| Bandwidth | ~5-17 MB/s | CDN bandwidth ke liye nahi chahiye |\n\n### APIs\n\n| API | Success | Errors |\n|---|---|---|\n| `POST /api/v1/urls {longUrl, customAlias?, expiresAt?}` | `201 {shortCode, shortUrl, longUrl, expiresAt}` | 400, 401, 409 `ALIAS_TAKEN`, 429, 500 |\n| `GET /:shortCode` | `302 Location` + `Cache-Control: private, max-age=0` | 404, 410 |\n| `GET /api/v1/urls/:shortCode` | details (owner only) | 404 |\n| `DELETE /api/v1/urls/:shortCode` | 204 (owner only), DB then cache `DEL` | 404 |\n\n### HLD\n\n```\nClient -> DNS -> LB -> Node.js (stateless, N) -> Redis (cache)\n                                           |-> Postgres primary (writes) + replica (miss reads)\n                                           |- -> Queue -> Analytics worker   (optional)\n```\n\nNo CDN, no Elasticsearch, no S3 initially -- har component ka reason bolo.\n\n### LLD\n\n```\nroutes -> middleware (rate-limit, validate(zod), error-handler) -> controller -> service -> repository -> Postgres\n                                                               service -> Redis, IdGenerator\napp.ts = composition root (sab `new` yahin)\n```\n\n- Controller: HTTP only. Service: logic, cache-aside, IDs. Repository: sirf SQL, `23505` -> `DuplicateShortCodeError`.\n- Express 5 (async errors auto), `pg` Pool max 20, ioredis `enableOfflineQueue: false`, `commandTimeout: 50`.\n\n### Database\n\n```sql\nurls(id BIGINT PK, short_code VARCHAR(32) UNIQUE, long_url TEXT, user_id,\n     created_at, expires_at, is_active)\n-- UNIQUE(short_code) | (user_id, created_at DESC) | partial (expires_at)\n-- SEQUENCE url_id_block_seq START WITH 56800236  (x1000 >= 62^6)\n```\n\nPostgres kyun: simple key lookup, unique constraint, replicas easy. 1000x: shard by `short_code` / DynamoDB.\n\n### Redis\n\n| Cheez | Value |\n|---|---|\n| Pattern | Cache-aside, lazy fill (create par cache nahi) |\n| Key / value | `url:\u003ccode>` -> long URL |\n| TTL | 24h, **downward** jitter, `min(24h, time till expiry)` |\n| Negative cache | `__404__` / `__410__` for 60s; create ke baad `DEL` |\n| Hot key | L1 in-process LRU 5s |\n| Stampede | Single-flight (in-flight promise map) + jitter |\n| Invalidation | DB update first, then `DEL` (set nahi) |\n| Failure | `.catch(() => null)` -> DB; HA replica + circuit breaker; eviction `allkeys-lru` |\n| Other uses | Rate limiting counters, cleanup-cron lock |\n\n### Queue\n\nSirf analytics ke liye. Redirect -> click event fire-and-forget -> worker batch update. Queue down -> redirect chalta rahe, events drop/local buffer. Duplicate message -> event ID dedupe. Worker crash -> messages queue mein, offset/ack ke baad hi commit. Analytics nahi chahiye -> **queue hi nahi**.\n\n### Main Algorithm\n\n`id = block counter` -> `Base62(id)` -> 7-char code.\n\n```\nBase62: baar baar % 62, remainders ulta.   125 -> \"21\"   11157 -> \"2TX\"   62^6 -> \"1000000\"\nBlock:  nextval(seq) x 1000 -> [start, start+999] in memory; refill ??= (single refill)\n```\n\n| Option | Kab |\n|---|---|\n| **Counter + Base62** | Default: unique, 7 chars, no collision check |\n| Random 7-8 + retry | Private links, guess-proof |\n| Hash (MD5) | Dedup requirement |\n| UUID | Internal IDs only (22 chars) |\n| Snowflake | Huge write scale (11 chars, clock issues) |\n\n### Scaling\n\n| Traffic | Change |\n|---|---|\n| 1x | LB + few Node + Postgres (+ replica) + Redis |\n| 10x | More Node instances, more read replicas, PgBouncer |\n| 100x | Redis Cluster, bigger L1 cache, partitioning, async everything non-critical |\n| 1000x | Shard by `short_code` / DynamoDB-Cassandra, multi-region reads, CDN/edge if 301 allowed |\n\n### Consistency\n\n| Where | Level | How |\n|---|---|---|\n| Code uniqueness | **Strong** | UNIQUE index on primary |\n| Redirect right after create | **Read-after-write** | Miss par primary fallback, ya create par write-through |\n| Delete / edit | Bounded stale | DB then `DEL`, TTL, L1 5s |\n| Analytics | **Eventual** | Queue + batch worker |\n\n### Failure Handling\n\n| Failure | Impact | Fix |\n|---|---|---|\n| Redis down | DB par ~20x load | DB fallback, HA, circuit breaker, L1 cache |\n| DB primary down | Create fail | Failover; redirects cache + replica se chalte rahein |\n| Node crash | Kuch in-flight requests | LB health check, stateless, graceful shutdown |\n| Queue down | Analytics loss | Redirect unaffected; buffer / drop |\n| Timeout | Slow responses | Har call par timeout (Redis 50ms), retry with backoff sirf idempotent par |\n| Duplicate create request | 2 links | `Idempotency-Key` header |\n| Duplicate message | Double count | Event ID dedupe |\n| Worker crash | Lag | Ack after process, restart from offset |\n| Malware API down | Create slow/fail | Timeout + async scan / pending state |\n\n### Security\n\nHTTPS (TLS at LB), auth (JWT/API key) + owner check (authorization), zod validation (http/https only, no own domain, 2048 max), parameterized SQL, rate limiting (Redis) on create **and** redirect, malware/phishing scanning, secrets in env/secret manager, `helmet`, body limit 10kb, no internal errors in 500, random codes for private links (enumeration).\n\n### Observability (bonus)\n\npino structured logs, metrics: RPS, p99 latency, error rate, **Redis hit ratio**, DB latency, queue lag, CPU/memory, event loop lag; OpenTelemetry tracing.\n\n### Top 5 Trade-offs\n\n| Decision | Chosen | Kyun | Kab badlega |\n|---|---|---|---|\n| 301 vs 302 | 302 | Analytics + edit/disable | No analytics -> 301, server load kam |\n| Counter vs random | Counter + Base62 | No collisions, 7 chars | Private links -> random 8 chars |\n| Postgres vs NoSQL | Postgres | Unique constraint, simple, replicas | 10s of TB / multi-region writes -> DynamoDB/Cassandra |\n| Cache vs no cache | Redis cache-aside | 100:1 reads, 35K peak | MVP / low traffic -> no Redis |\n| Sync vs async analytics | Async queue | Redirect latency safe | No analytics -> no queue |\n\n### Top 10 Follow-up Questions (one-line answers)\n\n| # | Question | One-line answer |\n|---|---|---|\n| 1 | Redis down ho gaya? | Cache hai, source of truth nahi -- DB se serve, HA + circuit breaker taaki DB na gire |\n| 2 | Do servers same ID banayein? | Nahi -- har server DB sequence se alag 1000-ID block leta hai, aur UNIQUE index last defence |\n| 3 | Do users same alias ek saath? | Seedha INSERT, UNIQUE violation `23505` -> 409; check-then-insert nahi |\n| 4 | Viral link / hot key? | 5s in-process LRU + single-flight; Redis replicas |\n| 5 | Banate hi click kiya, 404 aaya? | Replica lag -- miss par primary fallback ya create par cache warm |\n| 6 | 301 ya 302? | Analytics chahiye toh 302; warna 301 (browser cache, kam load) |\n| 7 | Traffic 1000x? | Shard by short_code / DynamoDB, Redis Cluster, multi-region reads |\n| 8 | Bots random codes try kar rahe? | Negative cache 60s + redirect par rate limit; private links ke liye random codes |\n| 9 | Expired links? | `expires_at` check on read (410), cleanup cron with distributed lock |\n| 10 | Duplicate create request (client retry)? | `Idempotency-Key` header -> same response, naya link nahi |\n\n### 30-second answer\n\nPART 27 dekho. Skeleton: **read-heavy (100:1) -> stateless Node + LB -> Redis cache-aside -> Postgres source of truth + unique index -> counter blocks + Base62 (7 chars) -> 302 + async analytics -> shard at scale.**\n\n### 5-minute answer (skeleton -- full text PART 28 mein)\n\n1. **0:00** Requirements: core 3 + alias/expiry/analytics; NFR = availability, latency, durability.\n2. **0:45** Numbers: 116 w/s, 11.6K r/s (35K peak), 10 TB, 18B -> 7 chars.\n3. **1:30** HLD + create flow + redirect flow; \"bottleneck DB -> Redis; Redis source of truth nahi\".\n4. **2:30** APIs, `urls` table + unique index, ID blocks, insert-and-catch for alias.\n5. **3:15** Cache details (TTL jitter, negative cache, L1, single-flight) + scaling 10x/100x/1000x.\n6. **4:15** Failures, consistency levels, security, 2 trade-offs (301/302, counter/random), \"deep dive kahan?\"\n\n### MOST IMPORTANT RULE -- 5 sawaal, 3 key decisions par\n\n| Sawaal | Redis cache | Counter + Base62 | Postgres |\n|---|---|---|---|\n| **Hum ye kyun kar rahe hain?** | 100:1 reads, 35K peak; ~1 ms hit, DB load 90%+ kam | Unique number -> unique code, collision check hi nahi; 7 chars | Durability + UNIQUE constraint + simple key lookup + easy replicas |\n| **Agar ye nahi kiya toh?** | Saara read load DB par -> zyada replicas, latency badhegi, viral link par DB CPU spike | Random codes -> collisions + retries; plain auto-increment -> lamba aur guessable | Sirf Redis -> crash par data loss, 10 TB RAM mehenga, uniqueness guarantee nahi |\n| **Iska alternative kya hai?** | DB replicas only, in-process cache, CDN (301 ke saath) | Random + retry, hash (MD5), Snowflake, UUID | MySQL, MongoDB, DynamoDB/Cassandra |\n| **Alternative kab choose karenge?** | Low traffic / MVP -> no Redis; no analytics + global -> CDN + 301 | Private links -> random 8 chars; dedup -> hash; huge writes multi-region -> Snowflake | Team MySQL jaanti hai -> MySQL; flexible metadata -> Mongo; 10s of TB / 100K+ r/s -> DynamoDB |\n| **Scale badhne par kya change hoga?** | Single node -> Redis Cluster; hot keys -> L1 LRU + replicas | Block size badhao; multi-region -> region prefix / Snowflake | Replicas -> PgBouncer -> partitioning -> shard by `short_code` |\n\n### Most Important Things To Remember\n\n1. **Read-heavy (100:1)** -- har decision read path ke liye hai.\n2. **Postgres = truth, Redis = speed.** Redis girne se system slow ho, down nahi.\n3. **Uniqueness database se lo** -- UNIQUE index, insert-and-catch; check-then-insert kabhi nahi.\n4. **Counter blocks + Base62 = 7 chars, no collisions**; private links ke liye random.\n5. **302 for analytics**, analytics async via queue -- redirect ko kabhi slow mat karo.\n6. **Cache ke 3 dushman:** stale data (DB then `DEL`), stampede (single-flight + jitter), hot key (L1 LRU).\n7. **Components tabhi jab reason ho** -- queue sirf analytics ke liye, CDN/cluster/sharding sirf scale par.\n8. Har jagah **timeouts**, create par **Idempotency-Key**, create + redirect par **rate limit**.\n9. Numbers bolo: **116 w/s, 11.6K r/s, 35K peak, 10 TB, 18B, 3.5T, 10 GB cache.**\n10. Har decision ke saath **trade-off** bolo -- \"X always better\" kabhi nahi.\n\n---\n\n## Remember\n\n> **Coding round mein: clarify -> logic bolo -> clean code -> edge cases -> complexity. Design round mein: requirements -> numbers -> simple diagram -> bottleneck -> ek-ek component uske reason ke saath.** URL shortener ka dil ek line hai: \"Postgres se correctness, Redis se speed, aur redirect path ko kisi bhi cheez ke liye slow mat hone do.\"\n\n## Quick Self-Test\n\n1. In-memory `UrlShortener` ko 3 servers par chala diya -- kaunsa bug aayega aur production design mein woh kaise solve hua?\n2. Dedup map (`urlToCode`) mein expiring links kyun nahi daale? Ek example ke saath batao.\n3. `shorten` ka time complexity O(L) kyun hai, O(1) kyun nahi? Aur space O(N x L) ko kaise kam karoge?\n4. Whiteboard par Queue kis step par aata hai, aur interviewer bole \"analytics nahi chahiye\" toh board se kya mitaoge?\n5. 5-minute answer mein \"Redis source of truth nahi hoga\" line kis minute mein aati hai, aur uske turant baad kaunsa risk batana zaruri hai?\n\n---\n\n**URL Shortener complete.** Next system: **Rate Limiter**. \"next\" bolo.\n"}]}</script>
<script>
(function () {
  const book = JSON.parse(document.getElementById('book-data').textContent);
  const parts = book.parts;
  const KEY = 'reader:' + book.title;
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;

  // ---- storage (optional; page works without it) ----
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(patch) { try { localStorage.setItem(KEY, JSON.stringify(Object.assign(load(), patch))); } catch (e) {} }
  const saved = load();

  // ---- settings ----
  let fontSize = saved.fontSize || (window.innerWidth <= 600 ? 17 : 19);
  function applySettings() {
    root.style.setProperty('--font-size', fontSize + 'px');
    root.dataset.theme = saved.theme || 'light';
    root.dataset.font = saved.font || 'serif';
    root.dataset.width = saved.width || 'narrow';
    document.querySelectorAll('.swatch').forEach((s) => s.classList.toggle('on', s.dataset.theme === root.dataset.theme));
    document.querySelectorAll('#fontSeg button').forEach((b) => b.classList.toggle('on', b.dataset.font === root.dataset.font));
    document.querySelectorAll('#widthSeg button').forEach((b) => b.classList.toggle('on', b.dataset.width === root.dataset.width));
  }
  $('fontUp').onclick = () => { fontSize = Math.min(28, fontSize + 1); save({ fontSize }); applySettings(); };
  $('fontDown').onclick = () => { fontSize = Math.max(13, fontSize - 1); save({ fontSize }); applySettings(); };
  document.querySelectorAll('.swatch').forEach((s) => s.onclick = () => { saved.theme = s.dataset.theme; save({ theme: saved.theme }); applySettings(); });
  document.querySelectorAll('#fontSeg button').forEach((b) => b.onclick = () => { saved.font = b.dataset.font; save({ font: saved.font }); applySettings(); });
  document.querySelectorAll('#widthSeg button').forEach((b) => b.onclick = () => { saved.width = b.dataset.width; save({ width: saved.width }); applySettings(); });
  applySettings();

  // ---- markdown rendering ----
  mermaid.initialize({ startOnLoad: false, theme: 'default' });
  const renderer = new marked.Renderer();
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  renderer.code = (code, lang) => lang === 'mermaid'
    ? '<div class="mermaid">' + esc(code) + '</div>'
    : '<pre><code>' + esc(code) + '</code></pre>';
  renderer.table = (header, body) => '<div class="table-wrap"><table><thead>' + header + '</thead><tbody>' + body + '</tbody></table></div>';
  const slug = (s, i) => 'p' + i + '-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);

  // pre-compute headings for the contents drawer
  parts.forEach((p, i) => {
    p.headings = [];
    p.md.split('\n').forEach((line) => {
      const m = /^## (.+)$/.exec(line);
      if (m) p.headings.push({ text: m[1].replace(/[*`]/g, ''), id: slug(m[1].replace(/[*`]/g, ''), i) });
    });
  });

  // ---- contents drawer ----
  function buildToc() {
    $('toc').innerHTML = parts.map((p, i) =>
      '<div class="toc-part' + (i === current ? ' current' : '') + '"><button data-part="' + i + '">Part ' + (i + 1) +
      '<small>' + p.label + '</small></button><ul>' +
      p.headings.map((h) => '<li><a href="#" data-part="' + i + '" data-id="' + h.id + '">' + h.text + '</a></li>').join('') +
      '</ul></div>').join('');
    $('toc').querySelectorAll('[data-part]').forEach((el) => el.onclick = (e) => {
      e.preventDefault();
      closeAll();
      show(+el.dataset.part, el.dataset.id || null);
    });
  }
  function closeAll() { $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); $('settings').classList.remove('open'); }
  $('tocBtn').onclick = () => { buildToc(); $('drawer').classList.add('open'); $('scrim').classList.add('open'); };
  $('setBtn').onclick = (e) => { e.stopPropagation(); $('settings').classList.toggle('open'); };
  $('scrim').onclick = closeAll;
  $('settings').onclick = (e) => e.stopPropagation();
  document.addEventListener('click', () => $('settings').classList.remove('open'));

  // ---- chapters ----
  let current = -1;
  function show(i, anchorId, scrollRatio) {
    if (i < 0 || i >= parts.length) return;
    if (i !== current) {
      current = i;
      const html = marked.parse(parts[i].md, { renderer });
      const next = parts[i + 1], prev = parts[i - 1];
      $('content').innerHTML = html +
        '<div class="chapter-end">' +
        (prev ? '<button class="prev" data-go="' + (i - 1) + '"><small>Previous</small>Part ' + i + ': ' + prev.label + '</button>' : '<span></span>') +
        (next ? '<button class="next" data-go="' + (i + 1) + '"><small>Next</small>Part ' + (i + 2) + ': ' + next.label + '</button>' : '<span></span>') +
        '</div>';
      $('content').querySelectorAll('h2').forEach((h) => { h.id = slug(h.textContent, i); });
      $('content').querySelectorAll('[data-go]').forEach((b) => b.onclick = () => show(+b.dataset.go));
      mermaid.run({ nodes: $('content').querySelectorAll('.mermaid') }).catch(() => {});
      $('chapTitle').textContent = ' -- Part ' + (i + 1) + ': ' + parts[i].label;
      $('prevBtn').disabled = i === 0;
      $('nextBtn').disabled = i === parts.length - 1;
      document.title = 'Part ' + (i + 1) + ': ' + parts[i].label + ' -- ' + book.title;
    }
    requestAnimationFrame(() => {
      if (anchorId && $(anchorId)) $(anchorId).scrollIntoView();
      else window.scrollTo(0, scrollRatio ? scrollRatio * maxScroll() : 0);
      onScroll();
    });
  }
  $('prevBtn').onclick = () => show(current - 1);
  $('nextBtn').onclick = () => show(current + 1);

  // ---- progress + remembered position ----
  const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  let saveTimer = null;
  function onScroll() {
    const ratio = Math.min(1, window.scrollY / maxScroll());
    $('progress').style.width = (ratio * 100).toFixed(1) + '%';
    const overall = ((current + ratio) / parts.length) * 100;
    $('status').textContent = 'Part ' + (current + 1) + ' of ' + parts.length + '  |  ' + Math.round(ratio * 100) + '% of part  |  ' + Math.round(overall) + '% of book';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => save({ part: current, ratio }), 300);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);

  // ---- page turning (keys + side taps) ----
  const atBottom = () => window.scrollY >= maxScroll() - 4;
  const atTop = () => window.scrollY <= 4;
  function pageDown() { if (atBottom()) { if (current < parts.length - 1) show(current + 1); } else window.scrollBy({ top: window.innerHeight - 110, behavior: 'smooth' }); }
  function pageUp() { if (atTop()) { if (current > 0) show(current - 1, null, 1); } else window.scrollBy({ top: -(window.innerHeight - 110), behavior: 'smooth' }); }
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); pageDown(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); pageUp(); }
    else if (e.key === 't' || e.key === 'T') { $('tocBtn').click(); }
    else if (e.key === 'Escape') closeAll();
  });
  $('content').addEventListener('click', (e) => {
    if (e.target.closest('a, button, pre, table, .mermaid, code')) return;
    if (String(window.getSelection())) return;
    const x = e.clientX / window.innerWidth;
    if (x > 0.8) pageDown(); else if (x < 0.2) pageUp();
  });

  // ---- start where the reader left off ----
  const startPart = Number.isInteger(saved.part) && saved.part < parts.length ? saved.part : 0;
  show(startPart, null, saved.ratio || 0);
})();
</script>
